controller:
  config:
    templatingSettings:
      extraContext:
        platformHeader: haptic
    templateSnippets:
      frontend-extra-400-platform-header:
        template: |
          {%- var value = extraContext | dig("platformHeader") | fallback("") | tostring() %}
          {%- if value != "" %}
          {%- if !regex_search(value, "^[A-Za-z0-9-]+$") %}
          {{ fail("platformHeader cannot be rendered as a header. Use only letters, digits, or hyphens.") }}
          {%- end %}
          http-response set-header X-Platform {{ value }}
          {%- end %}
    validationTests:
      skill-header-present:
        extraContext:
          platformHeader: example-team
        fixtures: &header-fixtures
          ingresses:
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                namespace: default
                name: header-example
              spec:
                ingressClassName: haptic
                rules:
                  - host: header.example.com
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: app
                              port:
                                number: 80
          services:
            - apiVersion: v1
              kind: Service
              metadata:
                namespace: default
                name: app
              spec:
                ports:
                  - port: 80
        assertions:
          - type: haproxy_valid
          - type: contains
            target: haproxy.cfg
            pattern: 'http-response set-header X-Platform example-team'
      skill-header-empty:
        extraContext:
          platformHeader: ""
        fixtures: *header-fixtures
        assertions:
          - type: haproxy_valid
          - type: not_contains
            target: haproxy.cfg
            pattern: 'http-response set-header X-Platform'
      skill-header-invalid:
        extraContext:
          platformHeader: "bad\nvalue"
        fixtures: *header-fixtures
        assertions:
          - type: contains
            target: rendering_error
            pattern: 'platformHeader cannot be rendered as a header'
