# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: prometheus rule
templates:
  - prometheusrule.yaml
set:
  # Default: PrometheusRule enabled. Tests that need it off override per-case.
  monitoring.prometheusRule.enabled: true
tests:
  - it: should not render when prometheusRule is disabled
    set:
      monitoring.prometheusRule.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when prometheusRule is enabled
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule

  - it: should set correct apiVersion
    asserts:
      - isAPIVersion:
          of: monitoring.coreos.com/v1

  - it: should include default reconciliation errors alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerReconciliationErrors
            expr: rate(haptic_reconciliation_errors_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HAProxy controller has reconciliation errors"
              description: "Controller {{ $labels.pod }} has {{ $value | humanize }} reconciliation errors/sec"

  - it: should include default deployment failures alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerDeploymentFailures
            expr: rate(haptic_deployment_errors_total[5m]) > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "HAProxy configuration deployment failures"
              description: "Controller {{ $labels.pod }} is failing to deploy configs to HAProxy"

  - it: should include default fleet diverged alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyFleetDiverged
            expr: haptic_haproxy_fleet_converged < haptic_haproxy_fleet_size
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HAProxy fleet is diverged"
              description: "Controller {{ $labels.pod }}: {{ $value }} of the fleet's HAProxy pods are at the desired config; the rest have not converged for 5m. Transient deploy failures self-heal, so sustained divergence is a real fault."

  - it: should disable fleet diverged alert when configured
    set:
      monitoring.prometheusRule.defaultRules.fleetDiverged: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyFleetDiverged
          any: true

  - it: should include default high queue depth alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerHighQueueDepth
            expr: histogram_quantile(0.95, sum(rate(haptic_reconciliation_queue_wait_seconds_bucket[5m])) by (le)) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HAProxy controller reconciliation queue is backing up"
              description: "p95 reconciliation queue wait is {{ $value | humanizeDuration }}, indicating processing delays"

  - it: should include default no leader alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerNoLeader
            expr: sum(haptic_leader_election_is_leader) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "No HAProxy controller leader elected"
              description: "No controller instance holds the leader lock - deployments are stalled"

  - it: should include default config rejected alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerConfigRejected
            expr: increase(haptic_config_rejected_total[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "HAProxyTemplateConfig rejected by the validation gate"
              description: "Validator {{ $labels.validator }} rejected a config change - the controller is serving the last-good config and the latest change is NOT live"

  - it: should include default no HAProxy pods alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerNoHAProxyPods
            expr: haptic_resource_count{type="haproxy-pods"} < 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "No HAProxy pods discovered"
              description: "Controller {{ $labels.pod }} finds no HAProxy pods to manage - no config is reaching the data plane"

  - it: should include default critical events dropped alert
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerCriticalEventsDropped
            expr: increase(haptic_events_dropped_critical_total[5m]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Critical events dropped from the event bus"
              description: "A critical subscriber's buffer overflowed - reconciliation work has been lost and the data plane may be stale"

  - it: should disable no HAProxy pods alert when configured
    set:
      monitoring.prometheusRule.defaultRules.noHAProxyPods: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerNoHAProxyPods
          any: true

  - it: should disable reconciliation errors alert when configured
    set:
      monitoring.prometheusRule.defaultRules.reconciliationErrors: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerReconciliationErrors
          any: true

  - it: should disable deployment failures alert when configured
    set:
      monitoring.prometheusRule.defaultRules.deploymentFailures: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerDeploymentFailures
          any: true

  - it: should disable high queue depth alert when configured
    set:
      monitoring.prometheusRule.defaultRules.highQueueDepth: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerHighQueueDepth
          any: true

  - it: should disable leader election alert when configured
    set:
      monitoring.prometheusRule.defaultRules.leaderElectionLost: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerNoLeader
          any: true

  - it: should use custom rules when provided
    set:
      monitoring.prometheusRule.rules:
        - alert: CustomAlert
          expr: custom_metric > 100
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Custom alert"
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: CustomAlert
            expr: custom_metric > 100
            for: 10m
            labels:
              severity: info
            annotations:
              summary: "Custom alert"

  - it: should not include default rules when custom rules provided
    set:
      monitoring.prometheusRule.rules:
        - alert: CustomAlert
          expr: custom_metric > 100
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: HAProxyControllerReconciliationErrors
          any: true

  - it: should include custom labels
    set:
      monitoring.prometheusRule.labels:
        prometheus: kube-prometheus
    asserts:
      - equal:
          path: metadata.labels.prometheus
          value: kube-prometheus

  - it: should include common labels
    set:
      commonLabels:
        environment: production
    asserts:
      - equal:
          path: metadata.labels.environment
          value: production

  - it: should include common annotations
    set:
      commonAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform

  - it: should set group name
    asserts:
      - equal:
          path: spec.groups[0].name
          value: haptic
