# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# validationTests must never vanish. The config template strips them and the
# companion template emits them, gated on the same predicate — if the two ever
# disagree the suite is silently dropped from both objects, and an empty suite
# passes unconditionally, so nothing downstream would notice.
suite: companion tests gate
templates:
  - haproxytemplateconfig.yaml
tests:
  # helm-unittest renders with IsInstall=true, which is the branch that emits
  # the companion — so the config must carry no inline tests here.
  - it: should move tests out of the config when the companion is emitted
    asserts:
      - notExists:
          path: spec.validationTests
      - exists:
          path: spec.validationTestsSelector
      - equal:
          path: spec.requireValidationTests
          value: true

  - it: should scope the selector to the release so two installs do not share a suite
    asserts:
      - equal:
          path: spec.validationTestsSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
