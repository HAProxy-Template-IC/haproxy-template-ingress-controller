# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: haproxy service
templates:
  - haproxy-service.yaml
# templates/haproxy-service.yaml renders the chart-internal dataplane
# Service only. The user-facing HAProxy LoadBalancer Service is no
# longer chart-static — it is declared in libraries/base.yaml as a
# `k8sResources.haproxy-service` template, rendered by the controller
# from listener state, and applied via Server-Side Apply with an
# OwnerReference to the HAProxyTemplateConfig CR. This test suite
# therefore covers ONLY the dataplane Service; the user-facing
# Service's port set, type, annotations, and load-balancer fields are
# pinned by chart-validation tests under
# charts/haptic/libraries/base.yaml (k8sResources.haproxy-service).
tests:
  - it: should render dataplane service
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - matchRegex:
          path: metadata.name
          pattern: ".*-haproxy-dataplane$"
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: dataplane-api
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: dataplane
            port: 5555
            targetPort: dataplane
            protocol: TCP

  - it: should select pods labelled as the loadbalancer component
    documentIndex: 0
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: loadbalancer

  - it: should honour haproxy.dataplane.service.type override
    documentIndex: 0
    set:
      haproxy.dataplane.service.type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should honour haproxy.ports.dataplane override
    documentIndex: 0
    set:
      haproxy.ports.dataplane: 6666
    asserts:
      - contains:
          path: spec.ports
          content:
            name: dataplane
            port: 6666
            targetPort: dataplane
            protocol: TCP

  - it: should not render anything when haproxy is disabled
    set:
      haproxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
