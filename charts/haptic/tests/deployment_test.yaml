# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: controller deployment
templates:
  - deployment.yaml
tests:
  - it: should render deployment with correct kind
    asserts:
      - isKind:
          of: Deployment

  - it: should use default replica count of 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should set replica count from values
    set:
      replicaCount: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  - it: should not set replicas when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: should set controller container name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: controller

  - it: should set security context with readOnlyRootFilesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should set security context to run as non-root
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: should drop all capabilities
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should expose healthz port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: healthz
            containerPort: 8080
            protocol: TCP

  - it: should expose metrics port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: should set resources when specified
    set:
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: should mount tmp volume
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: should include tmp emptyDir volume
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: should set priorityClassName when specified
    set:
      controller.podSpec.priorityClassName: high-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority

  - it: should set nodeSelector when specified
    set:
      controller.podSpec.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: should set tolerations when specified
    set:
      controller.podSpec.tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: node-role.kubernetes.io/master
            effect: NoSchedule

  - it: should expose webhook port when enabled
    set:
      webhook.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: webhook
            containerPort: 9443
            protocol: TCP

  - it: should mount webhook certs when webhook enabled
    set:
      webhook.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: webhook-certs
            mountPath: /etc/webhook/certs
            readOnly: true

  - it: should configure controller admission deadlines below the API-server defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "WEBHOOK_RESOURCE_ADMISSION_TIMEOUT")].value
          value: 9s
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "WEBHOOK_CONFIG_ADMISSION_TIMEOUT")].value
          value: 29s

  - it: should derive controller admission deadlines from custom API-server timeouts
    set:
      webhook.timeoutSeconds: 7
      webhook.haproxyTemplateConfig.timeoutSeconds: 23
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "WEBHOOK_RESOURCE_ADMISSION_TIMEOUT")].value
          value: 6s
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "WEBHOOK_CONFIG_ADMISSION_TIMEOUT")].value
          value: 22s

  # Extra volumes and volume mounts
  - it: should include extra volumes when specified
    set:
      extraVolumes:
        - name: custom-config
          configMap:
            name: my-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-config
            configMap:
              name: my-config

  - it: should include extra volume mounts when specified
    set:
      extraVolumeMounts:
        - name: custom-config
          mountPath: /etc/custom
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /etc/custom
            readOnly: true

  # Init containers and sidecars
  - it: should include init containers when specified
    set:
      initContainers:
        - name: init-db
          image: busybox:1.28
          command: ["sh", "-c", "echo init"]
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-db
            image: busybox:1.28
            command: ["sh", "-c", "echo init"]

  - it: should include sidecars when specified
    set:
      sidecars:
        - name: log-collector
          image: fluent/fluent-bit:latest
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: log-collector
            image: fluent/fluent-bit:latest

  # Startup probe
  # Enabled by default and load-bearing (see values.yaml): without it the
  # liveness probe kills the controller during validationTests startup.
  - it: should include startup probe by default
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should omit startup probe when disabled
    set:
      startupProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should include startup probe when enabled
    set:
      startupProbe.enabled: true
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: healthz

  - it: should set startup probe parameters
    set:
      startupProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 15
        failureThreshold: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 20

  # Lifecycle hooks
  - it: should include lifecycle hooks when specified
    set:
      lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "sleep 15"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["/bin/sh", "-c", "sleep 15"]

  # Termination grace period
  - it: should set default termination grace period
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: should set custom termination grace period
    set:
      controller.podSpec.terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  # Update strategy
  - it: should set default update strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: "25%"
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: "25%"

  - it: should set custom update strategy
    set:
      updateStrategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  # Min ready seconds and revision history
  - it: should set default minReadySeconds
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 0

  - it: should set custom minReadySeconds
    set:
      minReadySeconds: 10
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 10

  - it: should set default revisionHistoryLimit
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 10

  - it: should set custom revisionHistoryLimit
    set:
      revisionHistoryLimit: 5
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  # DNS configuration
  - it: should set default dnsPolicy
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirst

  - it: should set custom dnsPolicy
    set:
      controller.podSpec.dnsPolicy: None
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: None

  - it: should set dnsConfig when specified
    set:
      controller.podSpec.dnsConfig:
        nameservers:
          - 8.8.8.8
        options:
          - name: ndots
            value: "2"
    asserts:
      - contains:
          path: spec.template.spec.dnsConfig.nameservers
          content: 8.8.8.8
      - contains:
          path: spec.template.spec.dnsConfig.options
          content:
            name: ndots
            value: "2"

  # Host aliases
  - it: should set hostAliases when specified
    set:
      controller.podSpec.hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "foo.local"
    asserts:
      - contains:
          path: spec.template.spec.hostAliases
          content:
            ip: "127.0.0.1"
            hostnames:
              - "foo.local"

  # Runtime class
  - it: should not set runtimeClassName by default
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should set runtimeClassName when specified
    set:
      controller.podSpec.runtimeClassName: gvisor
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: gvisor

  # Common labels and annotations
  - it: should include common labels
    set:
      commonLabels:
        environment: production
        team: platform
    asserts:
      - equal:
          path: metadata.labels.environment
          value: production
      - equal:
          path: metadata.labels.team
          value: platform

  - it: should include common annotations
    set:
      commonAnnotations:
        config.kubernetes.io/managed-by: helm
    asserts:
      - equal:
          path: metadata.annotations["config.kubernetes.io/managed-by"]
          value: helm

  - it: should include deployment annotations
    set:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  # Topology spread constraints
  - it: should set topologySpreadConstraints when specified
    set:
      controller.podSpec.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: controller
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: controller
