suite: credential source value guards
templates:
- haproxytemplateconfig.yaml
tests:
- it: rejects conflicting credential sources
  set:
    credentials.existingSecret: external-credentials
    credentials.dataplane.password: conflicting-password
  asserts:
  - failedTemplate:
      errorMessage: credentials.existingSecret and credentials.dataplane.password cannot both be set.
- it: rejects a malformed Secret name
  set:
    credentials.existingSecret: invalid/name
  asserts:
  - failedTemplate:
      errorMessage: credentials.existingSecret must be a valid Kubernetes Secret name.
- it: rejects a boolean Secret name
  set:
    credentials.existingSecret: false
  asserts:
  - failedTemplate:
      errorMessage: credentials.existingSecret must be a Secret name.
