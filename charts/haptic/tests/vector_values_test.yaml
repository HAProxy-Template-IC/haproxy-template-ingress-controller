suite: vector value guards
# Renders ONLY haproxytemplateconfig.yaml, which is where
# haptic.vector.validateValues is invoked. Kept separate from vector_test.yaml so
# a render error in the deployment can never be mistaken for one of these guards.
templates:
  - haproxytemplateconfig.yaml
tests:
  - it: should reject a socketPath at the filesystem root
    template: haproxytemplateconfig.yaml
    set:
      # dir("/haproxy.sock") is "/", and that parent is what gets mounted as the
      # shared emptyDir — it would shadow both containers' root filesystems.
      vector.socketPath: /haproxy.sock
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath must be inside a subdirectory, not directly at the filesystem root, got "/haproxy.sock". The chart mounts the socket''s parent directory as a shared emptyDir in both the haproxy and vector containers, so a parent of "/" would shadow their root filesystems. Use something like /run/vector/haproxy.sock.'

  - it: should refuse the combination that silently stops all scraping
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.enabled: true
      spoaHub.monitoring.podMonitor.enabled: true
      # vector.podMonitor.enabled left at its false default — with the sidecar on
      # the chart skips the spoaHub PodMonitor, so this pair means NOTHING scrapes
      # haproxy_* or spoa_* and nothing says so. A live cluster was in exactly this
      # state; the render must refuse it rather than lose the metrics quietly.
    asserts:
      - failedTemplate:
          errorMessage: 'spoaHub.monitoring.podMonitor.enabled=true has no effect while vector.enabled=true: the chart skips that PodMonitor because the vector sidecar re-exports both the hub''s and HAProxy''s metrics on one endpoint. Set vector.podMonitor.enabled=true to scrape the merged endpoint (recommended), or set vector.enabled=false to keep scraping the hub directly. Leaving it as-is would silently stop every haproxy_* and spoa_* scrape.'

  - it: should reject shell metacharacters in socketPath
    template: haproxytemplateconfig.yaml
    set:
      # The path is interpolated into the sidecar's /bin/sh -c start script, so
      # this is the boundary that keeps a values string out of a shell. It is
      # quoted there too, but a single quote would break out of the quoting —
      # which is why the charset check, not the quoting, is the real guard.
      vector.socketPath: /run/vector/a;id
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath may only contain letters, digits, dot, underscore, hyphen and slash, got "/run/vector/a;id". It is interpolated into the sidecar''s shell start script, so shell metacharacters are refused.'

  - it: should reject a relative socketPath
    template: haproxytemplateconfig.yaml
    set:
      vector.socketPath: run/vector/haproxy.sock
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath must be an absolute path, got "run/vector/haproxy.sock". HAProxy''s `log <path>` form requires one.'

  - it: should reject a metricsPort that collides with an HAProxy port
    template: haproxytemplateconfig.yaml
    set:
      # 8404 is haproxy.ports.stats; both bind in the same pod network namespace,
      # so without this guard the pod would CrashLoopBackOff on bind instead.
      vector.metricsPort: 8404
    asserts:
      - failedTemplate:
          errorMessage: 'vector.metricsPort (8404) collides with haproxy.ports.stats. Both bind in the same pod network namespace; pick a different port.'

  - it: should reject an unpinned image tag
    template: haproxytemplateconfig.yaml
    set:
      vector.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: 'vector.image.tag must be pinned to an explicit tag so a silent upstream bump can''t change the log pipeline under a running fleet.'

  # excludeMetrics guards. These cover the Helm path, which is what every normal
  # install goes through; the Scriggo copies in libraries/vector.yaml only matter
  # for a hand-written HAProxyTemplateConfig CR. Every pattern below reaches the
  # rendered vector config verbatim, and a bad one fails vector's config LOAD —
  # i.e. it crash-loops the sidecar rather than degrading, so the render must refuse.
  - it: should reject an uncompilable exclusion pattern
    template: haproxytemplateconfig.yaml
    set:
      vector.excludeMetrics:
        broken:
          enabled: true
          pattern: ^haproxy_((
    asserts:
      # Regression guard on a real hole: this was written with sprig's plain
      # regexMatch, which does `match, _ := regexp.MatchString(...)` and DISCARDS
      # the compile error — so the check passed anything and this pattern rendered
      # clean. Only mustRegexMatch surfaces it.
      - failedTemplate:
          errorPattern: 'error parsing regexp: missing closing \)'

  - it: should reject an enabled exclusion with no pattern
    template: haproxytemplateconfig.yaml
    set:
      vector.excludeMetrics:
        empty:
          enabled: true
          pattern: ""
    asserts:
      - failedTemplate:
          errorMessage: 'vector.excludeMetrics.empty is enabled but has no `pattern`.'

  - it: should reject an exclusion entry that omits enabled
    template: haproxytemplateconfig.yaml
    set:
      # An entry without the flag would pass every other check and then be skipped
      # by the resolution loop — excluding nothing, silently. The operator who
      # wrote it believes their exclusion is live, so this must be an error and
      # not a default.
      vector.excludeMetrics:
        mine:
          pattern: ^haproxy_x
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.excludeMetrics\.mine has no .enabled.'

  - it: should reject an exclusion pattern carrying a quote
    template: haproxytemplateconfig.yaml
    set:
      # Patterns are emitted inside a VRL r'...' literal, so a single quote breaks
      # out of it and corrupts the config vector is about to load.
      vector.excludeMetrics:
        quoted:
          enabled: true
          pattern: "^haproxy_'"
    asserts:
      - failedTemplate:
          errorMessage: 'vector.excludeMetrics pattern "^haproxy_''" contains a quote, backslash or newline. Patterns are embedded in a VRL r''...'' literal in the rendered config, so those characters would break vector''s config load and crash-loop the sidecar.'

  - it: should reject a families entry that its own pattern would not match
    template: haproxytemplateconfig.yaml
    set:
      # families is passed to HAProxy as metrics=-<name> and pattern runs in vector.
      # If a name isn't matched by its own pattern the two stages disagree: the
      # family is dropped at the source while the filter that is supposed to be
      # authoritative never mentions it.
      vector.excludeMetrics:
        drifted:
          enabled: true
          pattern: ^haproxy_x
          families:
            - haproxy_y
    asserts:
      - failedTemplate:
          errorPattern: 'families entry "haproxy_y" does not match that entry''s own pattern'

  - it: should reject excludeMetrics that is not a map
    template: haproxytemplateconfig.yaml
    set:
      vector.excludeMetrics: ^haproxy_server_max_
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.excludeMetrics must be a map of named exclusions'

  - it: should reject the pre-0.2.0 list form with a message naming the replacement
    template: haproxytemplateconfig.yaml
    set:
      # The shape an operator carries over from an older values.yaml. Helm would
      # otherwise accept the list silently and the render would exclude nothing.
      vector.excludeMetrics:
        - ^haproxy_(server|backend)_max_
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.excludeMetrics must be a map of named exclusions'

  - it: should accept the shipped defaults and pass them to the render context
    template: haproxytemplateconfig.yaml
    asserts:
      # The library reads them from here, so this is the seam between the two.
      - equal:
          path: spec.templatingSettings.extraContext.vector.excludeMetrics
          value:
            - ^haproxy_backend_agg_check_status$
            - ^haproxy_backend_agg_server_check_status$
            - ^haproxy_backend_http_cache_
            - ^haproxy_backend_http_comp_
            - ^haproxy_(server_backup|backend_backup_servers)$
            - ^haproxy_(server|backend)_max_
      # haproxy_backend_agg_server_status is deliberately NOT excluded. With
      # excludeMaintServerMetrics on, agg_server_status{state="MAINT"} is the only
      # remaining free-slot census, so excluding it would remove the signal rather
      # than de-duplicate it. Pinned so it can't drift back in unnoticed.
      - notContains:
          path: spec.templatingSettings.extraContext.vector.excludeMetrics
          content: ^haproxy_backend_agg_server_status$
      - equal:
          path: spec.templatingSettings.extraContext.vector.excludeMaintServerMetrics
          value: true

  - it: should pass every excluded family to the source-side scrape list
    template: haproxytemplateconfig.yaml
    asserts:
      # families is what becomes metrics=-<name> on the scrape URL, which is the
      # half that actually cuts vector's peak RSS (the pattern filter runs after
      # the whole exposition is already parsed into events).
      - lengthEqual:
          path: spec.templatingSettings.extraContext.vector.excludeMetricFamilies
          count: 24
      - contains:
          path: spec.templatingSettings.extraContext.vector.excludeMetricFamilies
          content: haproxy_backend_http_comp_bytes_in_total

  - it: should let one exclusion be disabled without disturbing the others
    template: haproxytemplateconfig.yaml
    set:
      # The entire point of the map shape. Against the old list, turning one off
      # meant restating every other entry — and silently inheriting none of the
      # exclusions added in a later release.
      vector.excludeMetrics.backendHttpCompression.enabled: false
    asserts:
      - notContains:
          path: spec.templatingSettings.extraContext.vector.excludeMetrics
          content: ^haproxy_backend_http_comp_
      - contains:
          path: spec.templatingSettings.extraContext.vector.excludeMetrics
          content: ^haproxy_backend_http_cache_
      # ...and its four families leave the source-side list with it.
      - lengthEqual:
          path: spec.templatingSettings.extraContext.vector.excludeMetricFamilies
          count: 20

  # Trace-export guards. Both live in HELM rather than in the Scriggo render, and
  # that placement is the point: a validationTest legitimately pins individual
  # extraContext keys (test-status-frontend-prometheus-exporter sets
  # `vector: null`), so the same cross-key check at render time would fail the LOAD
  # GATE on a good config and crash-loop the controller instead of refusing an
  # install.
  - it: should refuse an OTLP endpoint without the vector sidecar
    template: haproxytemplateconfig.yaml
    set:
      vector.enabled: false
      controller.config.templatingSettings.extraContext.tracing.enabled: true
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - failedTemplate:
          errorPattern: 'endpoint is set .* but vector\.enabled is false'

  - it: should refuse an OTLP endpoint while tracing is disabled
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - failedTemplate:
          errorPattern: 'endpoint is set .* but tracing\.enabled is false'

  - it: should accept tracing with an endpoint when the sidecar is on
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.config.templatingSettings.extraContext.tracing.enabled: true
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.tracing.otlp.endpoint
          value: http://tempo:4318/v1/traces

  - it: should reject a non-boolean omitEmptyLogFields
    template: haproxytemplateconfig.yaml
    set:
      # A string is truthy in the render, so "false" would enable the very transform
      # the operator was switching off.
      vector.omitEmptyLogFields: "false"
    asserts:
      - failedTemplate:
          errorMessage: 'vector.omitEmptyLogFields must be a boolean, got false.'

  - it: should strip empty access-log fields by default
    template: haproxytemplateconfig.yaml
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.vector.omitEmptyLogFields
          value: true

  - it: should reject a non-boolean excludeMaintServerMetrics
    template: haproxytemplateconfig.yaml
    set:
      # A string reaches the render as truthy, so "false" would enable the very
      # filter the operator was trying to switch off.
      vector.excludeMaintServerMetrics: "false"
    asserts:
      - failedTemplate:
          errorMessage: 'vector.excludeMaintServerMetrics must be a boolean, got false.'

  - it: should bind the hub metrics on loopback with vector on and pod-routable with it off
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.enabled: true
    asserts:
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.hub.metricsAddr
          pattern: '^127\.0\.0\.1:9095$'

  - it: should bind the hub metrics pod-routable when vector is disabled
    template: haproxytemplateconfig.yaml
    set:
      vector.enabled: false
      spoaHub.enabled: true
    asserts:
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.hub.metricsAddr
          pattern: '^0\.0\.0\.0:9095$'
