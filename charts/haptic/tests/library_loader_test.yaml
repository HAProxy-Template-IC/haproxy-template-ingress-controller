# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Tests for the decentralized library loader (haptic.mergeLibraries).
# See ADR-0002 (docs/adr/0002-decentralized-helm-library-loader.md).
suite: library loader
templates:
  - haproxytemplateconfig.yaml
documentSelector:
  path: kind
  value: HAProxyTemplateConfig
tests:
  - it: should strip _helm_load metadata from rendered HAProxyTemplateConfig spec
    asserts:
      - notExists:
          path: spec._helm_load
      - notExists:
          path: _helm_load

  - it: should inject ingressClassName into ingresses.fieldSelector via _helm_load
    set:
      ingressClass.name: my-class
    asserts:
      - equal:
          path: spec.watchedResources.ingresses.fieldSelector
          value: spec.ingressClassName=my-class

  - it: should inject gatewayClassName into gateways.fieldSelector via _helm_load
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
    set:
      gatewayClass.name: my-gw-class
    asserts:
      - equal:
          path: spec.watchedResources.gateways.fieldSelector
          value: spec.gatewayClassName=my-gw-class

  - it: should inject controller-services labelSelector via _helm_load
    asserts:
      - matchRegex:
          path: spec.watchedResources.controller_services.labelSelector
          pattern: app\.kubernetes\.io/name=.*,app\.kubernetes\.io/component=loadbalancer

  - it: should swap frontend-routing-logic to regex-last variant when configured
    set:
      controller.config.routing.regexMatchOrder: last
    asserts:
      - matchRegex:
          path: spec.templateSnippets["frontend-routing-logic"].template
          pattern: "Path matching: Exact > Prefix-exact > Prefix > Regex"
      - notExists:
          path: spec.templateSnippets["frontend-routing-logic-regex-last"]

  - it: should always strip frontend-routing-logic-regex-last variant from output
    asserts:
      - notExists:
          path: spec.templateSnippets["frontend-routing-logic-regex-last"]

  - it: should not load gateway library when Capabilities.APIVersions.Has fails
    asserts:
      - notExists:
          path: spec.watchedResources.gateways

  - it: should load gateway library when Gateway API CRD is detected
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
    asserts:
      - exists:
          path: spec.watchedResources.gateways

  # The TCPRoute feature must strip ATOMICALLY when its CRD is served at no
  # known version (standard-channel Gateway API <= v1.5): the watch, all three
  # snippets, and ALL of its validationTests. A validationTest that survives
  # while its snippets/watch are stripped fails the controller's fatal load
  # gate and crash-loops the deployment.
  - it: should strip the whole TCPRoute feature when its CRD is not served
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
    asserts:
      - notExists:
          path: spec.watchedResources.tcproutes
      - notExists:
          path: spec.templateSnippets["util-gateway-tcproute-analysis"]
      - notExists:
          path: spec.templateSnippets["util-gateway-tcproute-count-contrib"]
      - notExists:
          path: spec.templateSnippets["util-generate-tcproute-status-patches"]
      - notExists:
          path: spec.templateSnippets["util-sharded-tcproute-status-patches"]
      - notExists:
          path: spec.templateSnippets["status-patches-210-gateway-tcproute"]
      - notExists:
          path: spec.templateSnippets["backends-502-gateway-tcproute"]
      - notExists:
          path: spec.templateSnippets["frontends-700-gateway-tcp-listener"]
      - notExists:
          path: spec.validationTests.test-tcproute-basic-l4-forward
      - notExists:
          path: spec.validationTests.test-tcproute-oldest-route-wins-port
      - notExists:
          path: spec.validationTests.test-tcproute-weighted-routing
      - notExists:
          path: spec.validationTests.test-tcproute-multi-listener-single-backend
      - notExists:
          path: spec.validationTests.test-tcproute-unattached-no-frontend
      - notExists:
          path: spec.validationTests.test-tcproute-orphan-sibling-does-not-drop-others

  - it: should watch TCPRoute at v1 when the cluster serves it at v1
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
        - gateway.networking.k8s.io/v1/TCPRoute
    asserts:
      - equal:
          path: spec.watchedResources.tcproutes.apiVersion
          value: gateway.networking.k8s.io/v1
      - exists:
          path: spec.validationTests.test-tcproute-basic-l4-forward

  - it: should fall back to TCPRoute v1alpha2 when only v1alpha2 is served
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
        - gateway.networking.k8s.io/v1alpha2/TCPRoute
    asserts:
      - equal:
          path: spec.watchedResources.tcproutes.apiVersion
          value: gateway.networking.k8s.io/v1alpha2

  - it: should load ingress-annotations-compat scaffold by default
    asserts:
      - exists:
          path: spec.templateSnippets["util-build-annotation-ssl-passthrough"]
      - exists:
          path: spec.templateSnippets["util-emit-annotation-access-control"]

  - it: should skip ingress-annotations-compat scaffold when disabled
    set:
      controller.templateLibraries.ingressAnnotationsCompat.enabled: false
    asserts:
      - notExists:
          path: spec.templateSnippets["util-build-annotation-ssl-passthrough"]

  # Library-declared extraContext defaults (haproxytemplateconfig.yaml merges a
  # library's top-level templatingSettings.extraContext at lowest precedence).
  - it: should merge a library-declared extraContext default into the rendered config
    set:
      controller.templateLibraries.nginxIngress.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.nginxHttpRedirectCode
          value: "308"

  - it: should not leak a library extraContext default when the library is disabled
    set:
      controller.templateLibraries.nginxIngress.enabled: false
    asserts:
      - notExists:
          path: spec.templatingSettings.extraContext.nginxHttpRedirectCode

  - it: operator extraContext override wins over a library-declared default
    set:
      controller.templateLibraries.nginxIngress.enabled: true
      controller.config.templatingSettings.extraContext.nginxHttpRedirectCode: "301"
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.nginxHttpRedirectCode
          value: "301"
