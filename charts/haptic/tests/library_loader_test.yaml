# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Tests for the decentralized library loader (haptic.prepareLibraries).
# See ADR-0002 (loader) and ADR-0016 (one object per library, merged by the
# controller in CRD_NAME order).
#
# The object SET and ORDER pinned here must agree with the CRD_NAME literal in
# deployment_test.yaml — both derive from haptic.prepareLibraries, and these
# two tests are what keeps that true.
suite: library loader
templates:
  - haproxytemplateconfig.yaml
tests:
  - it: emits one object per enabled library plus the operator's, in merge order
    asserts:
      - hasDocuments:
          count: 11
      - equal:
          path: metadata.name
          value: haptic-config-base
        documentIndex: 0
      - equal:
          path: metadata.name
          value: haptic-config-kubernetes-backends
        documentIndex: 1
      - equal:
          path: metadata.name
          value: haptic-config-ssl
        documentIndex: 2
      - equal:
          path: metadata.name
          value: haptic-config-ingress
        documentIndex: 3
      - equal:
          path: metadata.name
          value: haptic-config-gateway
        documentIndex: 4
      - equal:
          path: metadata.name
          value: haptic-config-ingress-annotations-compat
        documentIndex: 5
      - equal:
          path: metadata.name
          value: haptic-config-governance
        documentIndex: 6
      - equal:
          path: metadata.name
          value: haptic-config-haptic-annotations
        documentIndex: 7
      - equal:
          path: metadata.name
          value: haptic-config-spoa-hub
        documentIndex: 8
      - equal:
          path: metadata.name
          value: haptic-config-vector
        documentIndex: 9
      - equal:
          path: metadata.name
          value: haptic-config
        documentIndex: 10

  - it: references every library snippets object, in merge order
    # The ref list is the ONLY place merge order is declared, so nothing can
    # disagree with it. The revision is compared by the controller and never
    # recomputed from content, which is what lets kubectl edit on a snippet
    # take effect.
    asserts:
      - equal:
          path: spec.libraryRefs[0].name
          value: haptic-config-base
        documentIndex: 10
      - equal:
          path: spec.libraryRefs[9].name
          value: haptic-config-vector
        documentIndex: 10
      - matchRegex:
          path: spec.libraryRefs[0].revision
          pattern: "^base-[0-9a-f]{16}$"
        documentIndex: 10
      - matchRegex:
          path: spec.revision
          pattern: "^base-[0-9a-f]{16}$"
        documentIndex: 0

  - it: keeps operational fields off the snippets objects
    # A library cannot redefine the controller's own identity: the snippets
    # schema has no room for these, and the watchedResources union lands on
    # the config instead.
    asserts:
      - notExists:
          path: spec.podSelector
        documentIndex: 0
      - notExists:
          path: spec.watchedResources
        documentIndex: 0
      - notExists:
          path: spec.dataplane
        documentIndex: 0
      - notExists:
          path: spec.partial
        documentIndex: 10

  - it: drops a disabled library's object entirely
    set:
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.ingressAnnotationsCompat.enabled: false
    asserts:
      - hasDocuments:
          count: 10

  - it: emits the shared Kubernetes backend capability and watch union
    documentSelector:
      path: metadata.name
      value: haptic-config-kubernetes-backends
    asserts:
      - exists:
          path: spec.templateSnippets["util-service-port-resolution"]
      - exists:
          path: spec.templateSnippets["util-backend-servers-result"]
      - exists:
          path: spec.templateSnippets["util-backend-servers"]
      - exists:
          path: spec.templateSnippets["default-backend-100-kubernetes"]

  - it: unions Kubernetes backend watches into the operator config
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.watchedResources.services.resources
          value: services
      - equal:
          path: spec.watchedResources.endpoints.resources
          value: endpointslices
      - equal:
          path: spec.watchedResources.endpoints.debounceInterval
          value: "0"

  - it: keeps Kubernetes backend semantics out of base
    documentSelector:
      path: metadata.name
      value: haptic-config-base
    asserts:
      - notExists:
          path: spec.templateSnippets["util-service-port-resolution"]
      - notExists:
          path: spec.templateSnippets["util-backend-servers-result"]
      - notExists:
          path: spec.templateSnippets["util-backend-servers"]
      - matchRegex:
          path: spec.templateSnippets["util-default-backend"].template
          pattern: 'render_glob "default-backend-\*"'
      - matchRegex:
          path: spec.templateSnippets["util-validate-config-value"].template
          pattern: "on resource"
      - notMatchRegex:
          path: spec.templateSnippets["util-validate-config-value"].template
          pattern: "on Ingress"
      - notMatchRegex:
          path: spec.templateSnippets["frontend-filters-999-debug"].template
          pattern: "X-Gateway-"

  - it: keeps Gateway diagnostics in the Gateway library
    documentSelector:
      path: metadata.name
      value: haptic-config-gateway
    asserts:
      - matchRegex:
          path: spec.templateSnippets["frontend-filters-999-gateway-debug"].template
          pattern: "X-Gateway-Matched-Route"
      - matchRegex:
          path: spec.templateSnippets["frontend-filters-999-gateway-debug"].template
          pattern: "X-Gateway-Match-Reason"
      - matchRegex:
          path: spec.templateSnippets["frontend-filters-999-gateway-debug"].template
          pattern: "X-Gateway-Filters-Applied"

  - it: rejects disabling Kubernetes backends while a consumer remains enabled
    set:
      controller.templateLibraries.kubernetesBackends.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "controller.templateLibraries.kubernetesBackends.enabled=false leaves enabled consumers without Service/EndpointSlice helpers: ingress, gateway, ingressAnnotationsCompat, hapticAnnotations. Enable kubernetesBackends or disable those libraries."

  - it: allows Kubernetes backends to be disabled with all consumers
    set:
      controller.templateLibraries.kubernetesBackends.enabled: false
      controller.templateLibraries.ingress.enabled: false
      controller.templateLibraries.gateway.enabled: false
      controller.templateLibraries.ingressAnnotationsCompat.enabled: false
      controller.templateLibraries.hapticAnnotations.enabled: false
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: haptic-config-base
        documentIndex: 0
      - equal:
          path: metadata.name
          value: haptic-config
        documentIndex: 4

  - it: should strip _helm_load metadata and underscore scratch keys from every spec
    asserts:
      - notExists:
          path: spec._helm_load
        documentIndex: 0
      - notExists:
          path: spec._helm_load
        documentIndex: 1
      # ssl.yaml carries _test_tls_* YAML-anchor scratch values; SSA would
      # reject an object carrying a field its CRD does not declare.
      - notExists:
          path: spec._test_tls_cert
        documentIndex: 2

  - it: should inject ingressClassName into ingresses.fieldSelector via _helm_load
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      ingressClass.name: my-class
    asserts:
      - equal:
          path: spec.watchedResources.ingresses.fieldSelector
          value: spec.ingressClassName=my-class

  - it: should inject gatewayClassName into gateways.fieldSelector via _helm_load
    documentSelector:
      path: metadata.name
      value: haptic-config
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/GatewayClass
    set:
      gatewayClass.name: my-gw-class
    asserts:
      - equal:
          path: spec.watchedResources.gateways.fieldSelector
          value: spec.gatewayClassName=my-gw-class

  - it: should inject controller-services labelSelector via _helm_load
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - matchRegex:
          path: spec.watchedResources.controller_services.labelSelector
          pattern: app\.kubernetes\.io/name=.*,app\.kubernetes\.io/component=loadbalancer

  - it: should swap frontend-routing-logic to regex-last variant when configured
    documentSelector:
      path: metadata.name
      value: haptic-config-base
    set:
      controller.config.templatingSettings.extraContext.routing.regexMatchOrder: last
    asserts:
      - matchRegex:
          path: spec.templateSnippets["frontend-routing-logic"].template
          pattern: "Path matching: Exact > Prefix-exact > Prefix > Regex"
      - notExists:
          path: spec.templateSnippets["frontend-routing-logic-regex-last"]

  - it: should inject the agent connection port from the HAProxy port owner
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      haproxy.ports.dataplane: 6666
    asserts:
      - equal:
          path: spec.dataplane.port
          value: 6666

  - it: should derive every object name from controller.configName
    set:
      controller.configName: edge-config
    asserts:
      - equal:
          path: metadata.name
          value: edge-config-base
        documentIndex: 0
      - equal:
          path: metadata.name
          value: edge-config
        documentIndex: 10

  - it: should carry template-owned status patch policy in structured extraContext
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.config.templatingSettings.extraContext.statusPatches.enabled: false
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.statusPatches.enabled
          value: false
      - notExists:
          path: spec.templatingSettings.extraContext.statusPatchesDisabled

  - it: should disable routing diagnostics by default
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.diagnostics.routingHeaders.enabled
          value: false

  - it: should enable routing diagnostics only through the explicit nested value
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.config.templatingSettings.extraContext.diagnostics.routingHeaders.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.diagnostics.routingHeaders.enabled
          value: true

  - it: should always strip frontend-routing-logic-regex-last variant from output
    documentSelector:
      path: metadata.name
      value: haptic-config-base
    asserts:
      - notExists:
          path: spec.templateSnippets["frontend-routing-logic-regex-last"]

  # Gateway API availability is a RUNTIME concern: the library loads whenever
  # the operator enables it (no .Capabilities gate), every gateway kind is an
  # optional watched resource with an ordered apiVersions candidate list, and
  # the CONTROLLER resolves/strips against live discovery (see
  # pkg/core/config.ResolveEffective; degraded profiles are pinned by the
  # schema-bundle validate runs).
  - it: should load the gateway library regardless of cluster capabilities
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - exists:
          path: spec.watchedResources.gateways
      - equal:
          path: spec.watchedResources.gateways.optional
          value: true
      - equal:
          path: spec.watchedResources.gateways.apiVersions
          value:
            - gateway.networking.k8s.io/v1
            - gateway.networking.k8s.io/v1beta1

  - it: should declare TCPRoute as an optional multi-version watch with requires-annotated features
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.watchedResources.tcproutes.optional
          value: true
      - equal:
          path: spec.watchedResources.tcproutes.apiVersions
          value:
            - gateway.networking.k8s.io/v1
            - gateway.networking.k8s.io/v1alpha2

  # The watch lands on the config (unioned there); the snippet that consumes it
  # stays on the gateway library object, so the two are asserted separately.
  - it: annotates the TCPRoute backend snippet with the watch it requires
    documentSelector:
      path: metadata.name
      value: haptic-config-gateway
    asserts:
      - contains:
          path: spec.templateSnippets["backends-502-gateway-tcproute"].requires
          content: tcproutes

  - it: configures Gateway backend-service producers as one incremental group
    documentSelector:
      path: metadata.name
      value: haptic-config-gateway
    asserts:
      - equal:
          path: spec.templateSnippets["map-backend-service-200-gateway-http"].incremental
          value:
            source: httproutes
            root: gateway-http-route-pre-analysis
            group: map-backend-service-gateway
      - equal:
          path: spec.templateSnippets["map-backend-service-210-gateway-grpc"].incremental
          value:
            source: grpcroutes
            group: map-backend-service-gateway

  - it: configures governance with dynamic bindings and declared effects
    documentSelector:
      path: metadata.name
      value: haptic-config-governance
    asserts:
      - exists:
          path: spec.templateSnippets["features-960-governance"].incremental.bindingsTemplate
      - notExists:
          path: spec.templateSnippets["features-960-governance"].incremental.source
      - equal:
          path: spec.templateSnippets["features-960-governance"].incremental.effects
          value: [deriveResource, recordEvent]

  - it: should exclude the incompatible BackendTLSPolicy v1alpha2 from the candidate list
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.watchedResources.backendtlspolicies.apiVersions
          value:
            - gateway.networking.k8s.io/v1
            - gateway.networking.k8s.io/v1alpha3

  - it: should load ingress-annotations-compat scaffold by default
    documentSelector:
      path: metadata.name
      value: haptic-config-ingress-annotations-compat
    asserts:
      - exists:
          path: spec.templateSnippets["util-annotation-ssl-passthrough-component"]
      - exists:
          path: spec.templateSnippets["util-annotation-ssl-passthrough-values"]
      - exists:
          path: spec.templateSnippets["util-emit-annotation-access-control"]

  # Library-declared extraContext defaults ride the LIBRARY object; the
  # operator's override rides the operator object, which is LAST in CRD_NAME.
  # The controller's later-wins map merge is what gives the operator
  # precedence — pinned Go-side by the MergeSpecs tests; the chart's job is
  # placement, pinned here.
  - it: a library-declared extraContext default rides the library's own object
    documentSelector:
      path: metadata.name
      value: haptic-config-nginx-ingress
    set:
      controller.templateLibraries.nginxIngress.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.nginxHttpRedirectCode
          value: "308"

  - it: an operator override rides the operator object, last in merge order
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.templateLibraries.nginxIngress.enabled: true
      controller.config.templatingSettings.extraContext.nginxHttpRedirectCode: "301"
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.nginxHttpRedirectCode
          value: "301"

  - it: strips migration tooling data from annotation library objects
    documentSelector:
      path: metadata.name
      value: haptic-config-haptic-annotations
    asserts:
      - notExists:
          path: spec._migrationCoverage
      - notExists:
          path: spec.migrationCoverage

  - it: keeps migration tooling data out of the operator config object
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - notExists:
          path: spec._migrationCoverage
      - notExists:
          path: spec.migrationCoverage

  - it: rejects the removed migration coverage switch
    set:
      controller.config.includeMigrationCoverage: true
    asserts:
      - failedTemplate:
          errorMessage: controller.config.includeMigrationCoverage was removed because migration coverage is no longer a CRD field. Remove the value.

  - it: rejects migration coverage under controller config
    set:
      controller.config.migrationCoverage: []
    asserts:
      - failedTemplate:
          errorMessage: controller.config.migrationCoverage was removed because migration coverage is no longer a CRD field. Remove the value.
