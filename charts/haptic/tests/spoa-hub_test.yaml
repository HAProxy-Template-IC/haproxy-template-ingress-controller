# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: spoa-hub sidecar
templates:
  - haproxy-deployment.yaml
  - spoa-hub-configmap.yaml
  - haproxytemplateconfig.yaml
  - rate-limit-store-networkpolicy.yaml

tests:
  # Baseline: with the plugin-triggering libraries off, the spoa-hub sidecar
  # is not rendered. haproxy-ingress / nginx-ingress auto-enable coraza via
  # spoaHub.plugins.coraza.enabled's `or` predicate (the documented tradeoff
  # for path-scoped `haproxy-ingress.github.io/waf` to work without a second
  # toggle), and the gateway library (on by default) auto-enables the `mirror`
  # plugin so HTTPRoute RequestMirror filters work out of the box. The default
  # annotation library, hapticAnnotations (haproxy-haptic.org/*), does NOT
  # auto-enable any plugin — its waf/external-auth/mirror annotations require
  # the operator to enable the matching plugin explicitly — so a default install
  # renders a sidecar only via the gateway/mirror trigger. These baseline tests
  # pin the inverse: with haproxyIngress / nginxIngress / gateway all disabled,
  # no sidecar.
  - it: should render no spoa-hub sidecar when no plugin-triggering library is enabled
    template: haproxy-deployment.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: spoa-hub
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spoa-socket
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spoa-hub-bootstrap
          any: true

  - it: should render no spoa-hub ConfigMap when no plugin-triggering library is enabled
    template: spoa-hub-configmap.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the spoa-hub sidecar when a plugin is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: spoa-hub
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spoa-hub-bootstrap
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spoa-socket
          any: true

  - it: should mount the spoa-socket volume on the haproxy container when enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spoa-socket
            mountPath: /run/spoa
          any: true

  # ADR-0007 Step 2 (MR2): the bootstrap-copy from the spoa-hub
  # configmap into /etc/haproxy/general/spoa-hub-config.toml runs in
  # an initContainer rather than the haproxy main container's shell
  # init. K8s guarantees init containers complete before any regular
  # container starts, so the spoa-hub sidecar can't race the copy and
  # crash on a missing config file. HAPTIC's controller later
  # overwrites the file via the dataplane API; the hub's file-watch
  # picks up the change without a restart.
  - it: should add the bootstrap-copy initContainer when spoa-hub is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub-bootstrap-copy
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].volumeMounts
          content:
            name: general-storage
            mountPath: /etc/haproxy/general
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].volumeMounts
          content:
            name: spoa-hub-bootstrap
            mountPath: /etc/spoa-hub-bootstrap
            readOnly: true
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].args[0]
          pattern: 'cp /etc/spoa-hub-bootstrap/config\.toml /etc/haproxy/general/spoa-hub-config\.toml'

  - it: should NOT add the bootstrap-copy initContainer when spoa-hub is disabled
    template: haproxy-deployment.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub-bootstrap-copy
          any: true

  - it: haproxy main container does NOT carry the bootstrap copy logic
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      # The bootstrap copy lives in the initContainer, not the
      # haproxy container's shell init. Keep this contract — moving
      # it back into the main container's args would re-introduce the
      # startup race Gitar caught on the first round of MR2.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'cp /etc/spoa-hub-bootstrap/config\.toml'
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spoa-hub-bootstrap
          any: true

  - it: should mount haproxy-runtime/general into the spoa-hub container
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].volumeMounts
          content:
            name: general-storage
            mountPath: /etc/haproxy/general
            readOnly: true
          any: true
      - notContains:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].volumeMounts
          content:
            name: spoa-hub-bootstrap
          any: true
      # The spoa-hub container MUST NOT mount haproxy-runtime — that
      # volume carries SSL private keys, ingress maps, and other
      # high-value content the hub has no business reading. The narrow
      # general-storage overlay above gives it just the config file.
      - notContains:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].volumeMounts
          content:
            name: haproxy-runtime
          any: true

  - it: should pass --config pointing at the shared volume to the spoa-hub binary
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].args
          content: --config
          any: true
      - contains:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].args
          content: /etc/haproxy/general/spoa-hub-config.toml
          any: true

  - it: should render the spoa-hub ConfigMap when a plugin is enabled
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "fingerprinting"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "libfingerprinting_plugin\.so"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'messages = \["get-fingerprint"\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'ja4 = true'

  - it: should map the sso-auth plugin to its quirk lib filename
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.sso-auth.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "libhaproxy_spoa_hub_plugin_sso_auth\.so"'

  - it: should auto-enable the rate-limit plugin from controller.rateLimit.shared.enabled
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "rate_limit"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "librate_limit_plugin\.so"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'messages = \["check-ratelimit"\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'timeout_ms = 50'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_timeout_ms = 10'

  - it: should fail shared rate-limit rendering without a shared store_url
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "controller.rateLimit.shared.enabled=true requires a shared store. Leave controller.rateLimit.store.enabled=true for chart-managed HA Valkey, or set spoaHub.plugins.rate-limit.params.store_url/store_urls to bring your own Redis/Valkey."

  - it: should fail shared rate-limit rendering when spoa-hub is forced off
    template: haproxytemplateconfig.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
      spoaHub.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "controller.rateLimit.shared.enabled=true requires the spoaHub sidecar. Remove spoaHub.enabled=false or disable shared rate limiting."

  - it: should fail shared rate-limit rendering when the rate-limit plugin is forced off
    template: haproxytemplateconfig.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
      spoaHub.plugins.rate-limit.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "controller.rateLimit.shared.enabled=true requires spoaHub.plugins.rate-limit to be enabled. Remove spoaHub.plugins.rate-limit.enabled=false or disable shared rate limiting."

  - it: should inject the chart-managed Valkey store_url into the rate-limit plugin
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_url = "redis-sentinel://.*haptic-rl-store-sentinel\.[^.]+\.svc:26379/0\?sentinelServiceName=haptic-rate-limit'

  - it: should render shared rate-limit timeout knobs
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.shared.pluginTimeoutMs: 75
      controller.rateLimit.shared.storeTimeoutMs: 20
      controller.rateLimit.store.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'timeout_ms = 75'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_timeout_ms = 20'

  - it: should fail invalid shared rate-limit plugin timeout
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.shared.pluginTimeoutMs: 0
      controller.rateLimit.store.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.timeoutMs must resolve to a positive integer milliseconds value."

  - it: should fail invalid shared rate-limit store timeout
    template: spoa-hub-configmap.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.shared.storeTimeoutMs: 0
      controller.rateLimit.store.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "controller.rateLimit.shared.storeTimeoutMs must be a positive integer milliseconds value."

  - it: should render the managed rate-limit store NetworkPolicy
    template: rate-limit-store-networkpolicy.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: haptic-rate-limit-store
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 26379
            protocol: TCP
          any: true

  - it: should not render the managed rate-limit store NetworkPolicy when disabled
    template: rate-limit-store-networkpolicy.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
      controller.rateLimit.store.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should let spoaHub.enabled=false force the sidecar off even when a plugin is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.enabled: false
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: spoa-hub
          any: true

  - it: should let spoaHub.enabled=true force the sidecar on with no plugin enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: spoa-hub
          any: true

  - it: should default the spoa-hub image tag to .Chart.AppVersion
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].image
          pattern: 'registry\.gitlab\.com/haproxy-haptic/haptic/spoa-hub:\d+\.\d+\.\d+'

  - it: should respect spoaHub.image.tag override
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.image.tag: "v0.9.9-test"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "spoa-hub")].image
          value: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:v0.9.9-test

  - it: should render the SPOP listener with the configured socketPath
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'address = "/run/spoa/hub\.sock"'

  - it: should render multiple plugins in one ConfigMap
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.coraza.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "coraza"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "fingerprinting"'

  - it: should not surface a spoaHub extraContext entry when no plugin-triggering library is enabled
    template: haproxytemplateconfig.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - isNull:
          path: spec.templatingSettings.extraContext.spoaHub

  - it: should surface spoaHub config under extraContext when a plugin is enabled
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.enabled
          value: true
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.socketPath
          value: /run/spoa/hub.sock
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.modeSpop
          value: true
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.messages
          content: get-fingerprint

  - it: should surface shared rate-limit extraContext and store params
    template: haproxytemplateconfig.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.hapticRateLimitSharedEnabled
          value: "true"
      - equal:
          path: spec.templatingSettings.extraContext.hapticRateLimitStoreEnabled
          value: "true"
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.messages
          content: check-ratelimit
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.plugins[?(@.name == "rate_limit")].params
          pattern: 'store_url = "redis-sentinel://.*haptic-rl-store-sentinel\.[^.]+\.svc:26379/0\?sentinelServiceName=haptic-rate-limit'
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.plugins[?(@.name == "rate_limit")].params
          pattern: 'store_timeout_ms = 10'

  - it: should allow disabling the managed rate-limit store PodDisruptionBudget
    template: haproxytemplateconfig.yaml
    set:
      controller.rateLimit.shared.enabled: true
      controller.rateLimit.store.enabled: true
      controller.rateLimit.store.podDisruptionBudget.enabled: false
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.hapticRateLimitStorePDBEnabled
          value: "false"

  - it: should union messages from multiple enabled plugins in extraContext
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.coraza.enabled: true
    asserts:
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.messages
          content: get-fingerprint
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.messages
          content: check-request

  - it: should preserve a user-supplied params blob verbatim
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.fingerprinting.params: |
        # this is a user comment
        sort_extensions = false
        ja4 = false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '# this is a user comment'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'sort_extensions = false'
