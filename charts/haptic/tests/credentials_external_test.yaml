suite: externally managed agent credentials
templates:
- secret.yaml
- deployment.yaml
- haproxytemplateconfig.yaml
tests:
- it: leaves the external Secret under its existing owner
  set:
    credentials.existingSecret: external-credentials
  template: secret.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: points the controller at the external Secret
  set:
    credentials.existingSecret: external-credentials
  template: deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SECRET_NAME
        value: external-credentials
  - equal:
      path: spec.template.metadata.annotations["checksum/secret"]
      value: 94cf9db10e80703ff65bef7f21b08e847624011d950720b134d187d5ec62fee0
- it: points the configuration at the external Secret
  set:
    credentials.existingSecret: external-credentials
  template: haproxytemplateconfig.yaml
  asserts:
  - equal:
      path: spec.credentialsSecretRef.name
      value: external-credentials
  documentSelector:
    path: kind
    value: HAProxyTemplateConfig
