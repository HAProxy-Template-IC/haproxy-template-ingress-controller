# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: haproxy configmap
templates:
  - haproxy-configmap.yaml
set:
  haproxy.enabled: true
tests:
  - it: should render the default bootstrap config
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "frontend status"
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "Not ready - waiting for controller config"
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "default_backend default_backend"
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "hard-stop-after 10s"
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "stats socket /etc/haproxy/haproxy-worker\\.sock mode 600 level admin"

  - it: should use the rendered config hard-stop bound for the bootstrap worker
    set:
      controller.config.templatingSettings.extraContext.hardStopAfter: 45s
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "hard-stop-after 45s"

  - it: should allow explicitly disabling hard-stop-after in both configs
    set:
      controller.config.templatingSettings.extraContext.hardStopAfter: ""
    asserts:
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: "hard-stop-after"

  - it: should replace the bootstrap when initialConfig is overridden
    set:
      haproxy.initialConfig: |
        global
            log stdout len 4096 local0 info
        frontend custom
            bind *:9999
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "frontend custom"
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: "Not ready - waiting for controller config"

  - it: should resolve chart values inside initialConfig via tpl
    set:
      haproxy.ports.stats: 9999
      haproxy.initialConfig: |
        frontend status
            bind *:{{ .Values.haproxy.ports.stats }}
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: "bind \\*:9999"

  - it: should render an empty haproxy.cfg when initialConfig is explicitly null
    set:
      haproxy.initialConfig: null
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data["haproxy.cfg"]
          value: ""

  - it: should not render when haproxy disabled
    set:
      haproxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
