{{- $controller := .Values.controller }}
{{- if $controller.config }}
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateConfig
metadata:
  name: {{ $controller.crdName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  {{- $config := $controller.config | deepCopy }}
  {{- with $config.credentialsSecretRef }}
    {{- $_ := set . "name" (.name | default (include "haptic.dataplane.credentialsSecretName" $)) }}
  {{- end }}
  {{- /* Set maxParallel for dataplane (auto-calculate if not explicitly set) */ -}}
  {{- with $config.dataplane }}
    {{- $_ := set . "maxParallel" (include "haptic.config.dataplane.maxParallel" $ | int) }}
  {{- end }}
  {{- with $config.controller }}
    {{- /* Remove fields that are not part of the CRD (configured via env vars instead) */ -}}
    {{- $_ := unset . "healthzPort" }}
    {{- $_ := unset . "metricsPort" }}
    {{- if and .leaderElection (not .leaderElection.leaseName) }}
      {{- $_ := set .leaderElection "leaseName" (include "haptic.fullname" $) }}
    {{- end }}
  {{- end }}
  {{- /* Ensure templatingSettings.extraContext exists, then populate it.
         extraContext is a parameter bag the Scriggo runtime exposes to
         every template snippet. Each block below is a single concern. */ -}}
  {{- $_ := set $config "templatingSettings" ($config.templatingSettings | default dict) }}
  {{- $_ := set $config.templatingSettings "extraContext" ($config.templatingSettings.extraContext | default dict) }}
  {{- $extraContext := $config.templatingSettings.extraContext }}

  {{- /* Default SSL certificate */ -}}
  {{- $defaultSSL := $controller.defaultSSLCertificate }}
  {{- if $defaultSSL.enabled }}
    {{- $_ := set $extraContext "default_ssl_cert_name" $defaultSSL.secretName }}
    {{- $_ := set $extraContext "default_ssl_cert_namespace" ($defaultSSL.namespace | default .Release.Namespace) }}
  {{- end }}

  {{- /* Disable status-patch snippets when the operator opts out */ -}}
  {{- if ne ($controller.statusPatches.enabled | toString) "true" }}
    {{- $_ := set $extraContext "statusPatchesDisabled" true }}
  {{- end }}

  {{- /* Gateway API controllerName for status patches */ -}}
  {{- if and $controller.templateLibraries.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}
    {{- $_ := set $extraContext "controllerName" .Values.gatewayClass.controllerName }}
  {{- end }}

  {{- /* HAProxy version (used by version-gated features such as shm-stats-file) */ -}}
  {{- $_ := set $extraContext "haproxyVersion" .Values.haproxyVersion }}

  {{- /* Pass spoaHub wiring through extraContext when the sidecar is
         enabled AND at least one plugin contributes an SPOE message.
         The spoa-hub template library reads this to render spoe.conf
         and the spoa-hub backend block. We compute the union of
         enabled-plugin messages once here rather than asking Scriggo
         to recompute it on every render. The controller stays generic
         — it never learns the word "spoaHub". An empty messages list
         (sidecar forced on with no plugins enabled) leaves the library
         dormant; HAProxy rejects an spoe-agent with no `messages`,
         so emitting nothing is the only safe behaviour. */ -}}
  {{- if include "haptic.spoaHub.enabled" . }}
    {{- $messages := list }}
    {{- range $name, $plugin := .Values.spoaHub.plugins }}
      {{- if include "haptic.spoaHub.pluginEnabled" (dict "plugin" $plugin "root" $) }}
        {{- $messages = concat $messages $plugin.messages }}
      {{- end }}
    {{- end }}
    {{- with uniq $messages }}
      {{- $hub := $.Values.spoaHub.haproxy }}
      {{- $_ := set $extraContext "spoaHub" (dict
          "enabled" true
          "socketPath" $hub.socketPath
          "modeSpop" $hub.modeSpop
          "messages" .
          "timeoutHello" (toString $hub.timeoutHello)
          "timeoutIdle" (toString $hub.timeoutIdle)
          "timeoutProcessing" (toString $hub.timeoutProcessing)
          "poolMaxConn" (int $hub.poolMaxConn)
          "poolPurgeDelay" (toString $hub.poolPurgeDelay)
      ) }}
    {{- end }}
  {{- end }}

  {{- /* shm-stats-file settings (when enabled) */ -}}
  {{- $shmStats := .Values.haproxy.shmStats }}
  {{- if $shmStats.enabled }}
    {{- $_ := set $extraContext "shmStatsEnabled" true }}
    {{- $_ := set $extraContext "shmStatsPath" $shmStats.path }}
    {{- $_ := set $extraContext "shmStatsMaxObjects" ($shmStats.maxObjects | int) }}
  {{- end }}

  {{- /* nbthread for controller-rendered HAProxy config */ -}}
  {{- with include "haptic.haproxy.nbthread" . }}
    {{- $_ := set $extraContext "nbthread" (. | int) }}
  {{- end }}
  {{- /* Pluggable validators. The chart appends entries declared under
         controller.validators.entries to spec.validators (de-duplicating
         by name with operator-provided $config.validators winning). The
         CRD requires non-empty `files` per entry, so an empty list here
         leaves spec.validators absent rather than emitting an invalid
         empty entry. */ -}}
  {{- $entries := default list $controller.validators.entries }}
  {{- if $entries }}
    {{- $existing := default list $config.validators }}
    {{- $byName := dict }}
    {{- range $existing }}
      {{- $_ := set $byName .name . }}
    {{- end }}
    {{- $merged := $existing }}
    {{- range $entries }}
      {{- if not (hasKey $byName .name) }}
        {{- $merged = append $merged . }}
      {{- end }}
    {{- end }}
    {{- $_ := set $config "validators" $merged }}
  {{- end }}
  {{- /* Merge template libraries into config */ -}}
  {{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
  {{- range $key := list "templateSnippets" "maps" "files" "sslCertificates" "haproxyConfig" "validationTests" }}
    {{- with index $mergedLibraries $key }}
      {{- $_ := set $config $key . }}
    {{- end }}
  {{- end }}
  {{- /* watchedResources: merge with the operator's override instead of replacing it */ -}}
  {{- with $mergedLibraries.watchedResources }}
    {{- $_ := set $config "watchedResources" (merge ($config.watchedResources | default dict) .) }}
  {{- end }}
  {{- /* Strip Helm-only fields from watchedResources before CRD rendering */ -}}
  {{- range $name, $resource := $config.watchedResources }}
    {{- $_ := unset $resource "statusPatch" }}
  {{- end }}
  {{- toYaml $config | nindent 2 }}
{{- end }}
