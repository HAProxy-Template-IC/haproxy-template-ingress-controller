{{- $controller := .Values.controller }}
{{- if and $controller.rateLimit.shared.enabled (eq (toString .Values.spoaHub.enabled) "false") }}
  {{- fail "controller.rateLimit.shared.enabled=true requires the spoaHub sidecar. Remove spoaHub.enabled=false or disable shared rate limiting." }}
{{- end }}
{{- $rateLimitPlugin := (index (.Values.spoaHub.plugins | default dict) "rate-limit") | default dict }}
{{- if and $controller.rateLimit.shared.enabled (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" $rateLimitPlugin "root" .))) }}
  {{- fail "controller.rateLimit.shared.enabled=true requires spoaHub.plugins.rate-limit to be enabled. Remove spoaHub.plugins.rate-limit.enabled=false or disable shared rate limiting." }}
{{- end }}
{{- if and $controller.apiGateway.validation.enabled (eq (toString .Values.spoaHub.enabled) "false") }}
  {{- fail "controller.apiGateway.validation.enabled=true requires the spoaHub sidecar. Remove spoaHub.enabled=false or disable request validation." }}
{{- end }}
{{- $apiGatewayPlugin := (index (.Values.spoaHub.plugins | default dict) "api-gateway") | default dict }}
{{- if and $controller.apiGateway.validation.enabled (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" $apiGatewayPlugin "root" .))) }}
  {{- fail "controller.apiGateway.validation.enabled=true requires spoaHub.plugins.api-gateway to be enabled. Remove spoaHub.plugins.api-gateway.enabled=false or disable request validation." }}
{{- end }}
{{- if $controller.config }}
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateConfig
metadata:
  name: {{ $controller.crdName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  {{- $config := $controller.config | deepCopy }}
  {{- /* routing.regexMatchOrder is a Helm-load-time switch consumed by
         libraries/base.yaml's `_helm_load.inject.when` (it swaps in the
         regex-last variant of frontend-routing-logic). The CRD has no
         `routing` field, so leaving it on the rendered spec makes the
         apiserver reject the manifest with `field not declared in
         schema`. Drop it before serialising. */ -}}
  {{- $_ := unset $config "routing" }}
  {{- with $config.credentialsSecretRef }}
    {{- $_ := set . "name" (.name | default (include "haptic.dataplane.credentialsSecretName" $)) }}
  {{- end }}
  {{- with $config.controller }}
    {{- /* Remove fields that are not part of the CRD (configured via env vars instead) */ -}}
    {{- $_ := unset . "healthzPort" }}
    {{- $_ := unset . "metricsPort" }}
    {{- if and .leaderElection (not .leaderElection.leaseName) }}
      {{- $_ := set .leaderElection "leaseName" (include "haptic.fullname" $) }}
    {{- end }}
  {{- end }}
  {{- /* Ensure templatingSettings.extraContext exists, then populate it.
         extraContext is a parameter bag the Scriggo runtime exposes to
         every template snippet. Each block below is a single concern. */ -}}
  {{- $_ := set $config "templatingSettings" ($config.templatingSettings | default dict) }}
  {{- $_ := set $config.templatingSettings "extraContext" ($config.templatingSettings.extraContext | default dict) }}
  {{- $extraContext := $config.templatingSettings.extraContext }}

  {{- /* Default SSL certificate */ -}}
  {{- $defaultSSL := $controller.defaultSSLCertificate }}
  {{- if $defaultSSL.enabled }}
    {{- $_ := set $extraContext "default_ssl_cert_name" $defaultSSL.secretName }}
    {{- $_ := set $extraContext "default_ssl_cert_namespace" ($defaultSSL.namespace | default .Release.Namespace) }}
  {{- end }}

  {{- /* Disable status-patch snippets when the operator opts out */ -}}
  {{- if ne ($controller.statusPatches.enabled | toString) "true" }}
    {{- $_ := set $extraContext "statusPatchesDisabled" true }}
  {{- end }}

  {{- /* Gateway API controllerName for status patches */ -}}
  {{- if $controller.templateLibraries.gateway.enabled }}
    {{- $_ := set $extraContext "controllerName" .Values.gatewayClass.controllerName }}
  {{- end }}

  {{- /* GatewayClass shape for the runtime emitter (util-emit-gatewayclass).
         The GatewayClass is created by the CONTROLLER via k8sResources — not
         by a Helm template — so it exists exactly when the gatewayclasses CRD
         is served, surviving install-order races and in-place Gateway API
         installation without a helm operation. */ -}}
  {{- if and $controller.templateLibraries.gateway.enabled .Values.gatewayClass.enabled }}
    {{- $gcParams := .Values.gatewayClass.parametersRef }}
    {{- $_ := set $extraContext "gatewayClassResource" (dict
          "name" .Values.gatewayClass.name
          "default" .Values.gatewayClass.default
          "controllerName" .Values.gatewayClass.controllerName
          "parametersGroup" $gcParams.group
          "parametersKind" $gcParams.kind
          "parametersName" ($gcParams.name | default $controller.crdName)
          "parametersNamespace" ($gcParams.namespace | default .Release.Namespace)) }}
  {{- end }}

  {{- /* HAProxy version (used by version-gated features such as shm-stats-file) */ -}}
  {{- $_ := set $extraContext "haproxyVersion" .Values.haproxyVersion }}

  {{- /* Shared cache (Varnish tier). When enabled, the caching library emits the
         varnish_cache routing/backend and the k8sResources Varnish workload.
         The Varnish loopback origin is the chart's HAProxy Service. */ -}}
  {{- if $controller.cache.varnish.enabled }}
    {{- $varnish := $controller.cache.varnish }}
    {{- $_ := set $extraContext "hapticCacheEnabled" "true" }}
    {{- $_ := set $extraContext "hapticCacheVarnishService" (printf "%s-varnish-cache" (include "haptic.fullname" .)) }}
    {{- $_ := set $extraContext "hapticCacheVarnishNamespace" .Release.Namespace }}
    {{- $_ := set $extraContext "hapticCacheWorkload" $varnish.workload }}
    {{- $_ := set $extraContext "hapticCacheReplicas" ($varnish.replicas | toString) }}
    {{- $_ := set $extraContext "hapticCacheImage" $varnish.image }}
    {{- $_ := set $extraContext "hapticCacheMalloc" $varnish.malloc }}
    {{- $_ := set $extraContext "hapticCacheHashBalanceFactor" ($varnish.hashBalanceFactor | toString) }}
    {{- $_ := set $extraContext "hapticCacheOriginHost" (include "haptic.haproxyFullname" .) }}
    {{- $_ := set $extraContext "hapticCacheOriginPort" (.Values.haproxy.ports.http | toString) }}
    {{- $vres := $varnish.resources | default dict }}
    {{- $_ := set $extraContext "hapticCacheCpuRequest" (dig "requests" "cpu" "100m" $vres | toString) }}
    {{- $_ := set $extraContext "hapticCacheMemRequest" (dig "requests" "memory" "384Mi" $vres | toString) }}
    {{- $_ := set $extraContext "hapticCacheMemLimit" (dig "limits" "memory" "384Mi" $vres | toString) }}
    {{- $vPDB := $varnish.podDisruptionBudget | default dict }}
    {{- $vPDBEnabled := true }}
    {{- if hasKey $vPDB "enabled" }}
      {{- $vPDBEnabled = $vPDB.enabled }}
    {{- end }}
    {{- $_ := set $extraContext "hapticCachePDBEnabled" ($vPDBEnabled | toString) }}
    {{- $_ := set $extraContext "hapticCachePDBMaxUnavailable" (dig "maxUnavailable" 1 $vPDB | toString) }}
    {{- if $varnish.autoscaling.enabled }}
    {{- $_ := set $extraContext "hapticCacheAutoscalingEnabled" "true" }}
    {{- $_ := set $extraContext "hapticCacheMinReplicas" ($varnish.autoscaling.minReplicas | toString) }}
    {{- $_ := set $extraContext "hapticCacheMaxReplicas" ($varnish.autoscaling.maxReplicas | toString) }}
    {{- $_ := set $extraContext "hapticCacheTargetCPU" ($varnish.autoscaling.targetCPUUtilizationPercentage | toString) }}
    {{- $_ := set $extraContext "hapticCacheScaleDownWindow" ($varnish.autoscaling.scaleDownStabilizationSeconds | toString) }}
    {{- end }}
  {{- end }}

  {{- /* Shared request-rate limiting. The haptic-annotations library consumes
         these flat keys to fail-loud when route annotations are used without
         the chart opt-in and, when requested, to emit the chart-owned Valkey
         store through k8sResources. */ -}}
  {{- if $controller.rateLimit.shared.enabled }}
    {{- $_ := set $extraContext "hapticRateLimitSharedEnabled" "true" }}
  {{- end }}
  {{- if and $controller.rateLimit.shared.enabled $controller.rateLimit.store.enabled }}
    {{- $rlStore := $controller.rateLimit.store }}
    {{- $rlSentinel := $rlStore.sentinel | default dict }}
    {{- $rlReplicas := int ($rlStore.replicas | default 3) }}
    {{- $rlQuorum := int ($rlSentinel.quorum | default 2) }}
    {{- if lt $rlReplicas 3 }}
      {{- fail "controller.rateLimit.store.replicas must be at least 3 for chart-managed Sentinel HA." }}
    {{- end }}
    {{- if or (lt $rlQuorum 1) (gt $rlQuorum $rlReplicas) }}
      {{- fail "controller.rateLimit.store.sentinel.quorum must be between 1 and controller.rateLimit.store.replicas." }}
    {{- end }}
    {{- $rlRes := $rlStore.resources | default dict }}
    {{- $rlSentinelRes := $rlSentinel.resources | default dict }}
    {{- $rlPDB := $rlStore.podDisruptionBudget | default dict }}
    {{- $rlPDBEnabled := true }}
    {{- if hasKey $rlPDB "enabled" }}
      {{- $rlPDBEnabled = $rlPDB.enabled }}
    {{- end }}
    {{- $_ := set $extraContext "hapticRateLimitStoreEnabled" "true" }}
    {{- $_ := set $extraContext "hapticRateLimitStoreBaseName" (include "haptic.rateLimit.storeServiceName" .) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreNamespace" .Release.Namespace }}
    {{- $_ := set $extraContext "hapticRateLimitStorePort" ($rlStore.port | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreImage" $rlStore.image }}
    {{- $_ := set $extraContext "hapticRateLimitStoreReplicas" ($rlReplicas | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreMaxmemory" ($rlStore.maxmemory | default "96mb" | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreMaxmemoryPolicy" ($rlStore.maxmemoryPolicy | default "volatile-ttl" | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelMasterName" (include "haptic.rateLimit.storeSentinelMasterName" .) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelPort" ($rlSentinel.port | default 26379 | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelQuorum" ($rlQuorum | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelDownAfterMs" ($rlSentinel.downAfterMilliseconds | default 2000 | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelFailoverTimeoutMs" ($rlSentinel.failoverTimeoutMilliseconds | default 10000 | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelParallelSyncs" ($rlSentinel.parallelSyncs | default 1 | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreCpuRequest" (dig "requests" "cpu" "50m" $rlRes | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreMemRequest" (dig "requests" "memory" "128Mi" $rlRes | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreMemLimit" (dig "limits" "memory" "128Mi" $rlRes | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelCpuRequest" (dig "requests" "cpu" "25m" $rlSentinelRes | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelMemRequest" (dig "requests" "memory" "64Mi" $rlSentinelRes | toString) }}
    {{- $_ := set $extraContext "hapticRateLimitStoreSentinelMemLimit" (dig "limits" "memory" "64Mi" $rlSentinelRes | toString) }}
    {{- if $rlPDBEnabled }}
      {{- $_ := set $extraContext "hapticRateLimitStorePDBEnabled" "true" }}
    {{- else }}
      {{- $_ := set $extraContext "hapticRateLimitStorePDBEnabled" "false" }}
    {{- end }}
    {{- $_ := set $extraContext "hapticRateLimitStorePDBMaxUnavailable" ($rlPDB.maxUnavailable | default 1 | toString) }}
  {{- end }}

  {{- /* API-gateway request validation. The haptic-annotations library uses
         these flat keys to fail-loud when schema annotations are present
         without the chart opt-in and to pass bounded defaults to the SPOA
         dispatch map. */ -}}
  {{- if $controller.apiGateway.validation.enabled }}
    {{- $validation := $controller.apiGateway.validation }}
    {{- $maxBodyBytes := int $validation.maxBodyBytes }}
    {{- if or (le $maxBodyBytes 0) (gt $maxBodyBytes 1048576) }}
      {{- fail "controller.apiGateway.validation.maxBodyBytes must be between 1 and 1048576 bytes." }}
    {{- end }}
    {{- $bufferSize := int ($validation.bufferSize | default 16384) }}
    {{- if or (lt $bufferSize 16384) (gt $bufferSize 2097152) }}
      {{- fail "controller.apiGateway.validation.bufferSize must be between 16384 and 2097152 bytes." }}
    {{- end }}
    {{- $bufferHeadroomBytes := int ($validation.bufferHeadroomBytes | default 8192) }}
    {{- if or (le $bufferHeadroomBytes 0) (ge $bufferHeadroomBytes $bufferSize) }}
      {{- fail "controller.apiGateway.validation.bufferHeadroomBytes must be a positive integer smaller than controller.apiGateway.validation.bufferSize." }}
    {{- end }}
    {{- $maxBufferedBodyBytes := sub $bufferSize $bufferHeadroomBytes }}
    {{- if gt $maxBodyBytes $maxBufferedBodyBytes }}
      {{- fail "controller.apiGateway.validation.maxBodyBytes must not exceed controller.apiGateway.validation.bufferSize minus controller.apiGateway.validation.bufferHeadroomBytes, so request validation never sees a truncated HAProxy body." }}
    {{- end }}
    {{- $pluginTimeoutMs := int $validation.pluginTimeoutMs }}
    {{- if le $pluginTimeoutMs 0 }}
      {{- fail "controller.apiGateway.validation.pluginTimeoutMs must be a positive integer milliseconds value." }}
    {{- end }}
    {{- $bodyWaitTimeout := ($validation.bodyWaitTimeout | default "100ms" | toString) }}
    {{- if not (regexMatch "^[0-9]+(us|ms|s|m|h|d)?$" $bodyWaitTimeout) }}
      {{- fail "controller.apiGateway.validation.bodyWaitTimeout must be a positive HAProxy duration using an optional us, ms, s, m, h, or d suffix." }}
    {{- end }}
    {{- if le (int (regexFind "^[0-9]+" $bodyWaitTimeout)) 0 }}
      {{- fail "controller.apiGateway.validation.bodyWaitTimeout must be a positive HAProxy duration using an optional us, ms, s, m, h, or d suffix." }}
    {{- end }}
    {{- $_ := set $extraContext "hapticRequestValidationEnabled" "true" }}
    {{- $_ := set $extraContext "hapticRequestValidationMaxBodyBytes" ($maxBodyBytes | toString) }}
    {{- $_ := set $extraContext "hapticRequestValidationBufferSize" ($bufferSize | toString) }}
    {{- $_ := set $extraContext "hapticRequestValidationBufferHeadroomBytes" ($bufferHeadroomBytes | toString) }}
    {{- $_ := set $extraContext "hapticRequestValidationFailOpen" ($validation.failOpen | toString) }}
    {{- $_ := set $extraContext "hapticRequestValidationBodyWaitTimeout" $bodyWaitTimeout }}
  {{- end }}

  {{- /* Controller's own namespace + HAProxy pod selector. Templates that
         emit owned resources via renderResource() (e.g. per-Gateway
         LoadBalancer Services for SupportGatewayStaticAddresses) need
         both: the namespace because the resourceapplier refuses to
         apply outside the controller's namespace by default, and the
         selector so the spawned Service routes traffic to the shared
         HAProxy pods. We compute these here from chart values once
         rather than asking Scriggo to reach for them. */ -}}
  {{- $_ := set $extraContext "controllerNamespace" .Release.Namespace }}
  {{- $_ := set $extraContext "haproxyPodSelector" (include "haptic.haproxy.selectorLabels" . | fromYaml) }}
  {{- /* Resolved name of the chart-emitted HAProxy Service. Templates
         that partial-patch its spec.ports (e.g. the gateway-listener-
         ports snippet) need this so the SSA payload targets the same
         object the chart created. The controller never hardcodes the
         name — the chart computes it via fullname conventions and
         hands it through extraContext. */ -}}
  {{- $_ := set $extraContext "haproxyServiceName" (include "haptic.haproxyFullname" .) }}

  {{- /* Plumb the chart's HAProxy bind-port values through extraContext
         so the base/ssl/gateway libraries' bind directives stay in
         lockstep with `haproxy.ports`. The fallbacks in those libraries
         (8080/8443) only apply when the chart hasn't provided values,
         so chart-managed installs always emit binds that match the
         Service targetPort / containerPort wiring. Defaulting these to
         the literal Gateway listener-port numbers (80/443) keeps each
         Gateway listener port unambiguous on its own bind — see
         comment in values.yaml on `haproxy.ports.http` for the full
         rationale. */ -}}
  {{- $_ := set $extraContext "httpPort" (.Values.haproxy.ports.http | int) }}
  {{- $_ := set $extraContext "httpsPort" (.Values.haproxy.ports.https | int) }}

  {{- /* Plumb the chart's haproxy.service.* values through extraContext so
         the k8sResources.haproxy-service template (in libraries/base.yaml)
         can render the user-facing LoadBalancer Service from listener
         state. This replaces the chart-static templates/haproxy-service.yaml
         main-Service block: the controller now owns the Service end-to-end
         and emits an OwnerReference pointing at the HAProxyTemplateConfig
         CR, so `helm uninstall` cascade-GCs it. The bag is intentionally
         flat so the template can read fields without re-walking
         values.yaml. */ -}}
  {{- if $haproxy := .Values.haproxy }}
  {{- if $haproxy.enabled }}
  {{- $svc := $haproxy.service }}
  {{- $svcLabels := dict }}
  {{- range $k, $v := (include "haptic.labels" . | fromYaml) }}
    {{- $_ := set $svcLabels $k $v }}
  {{- end }}
  {{- $_ := set $svcLabels "app.kubernetes.io/component" "loadbalancer" }}
  {{- $svcSelectorLabels := dict }}
  {{- range $k, $v := (include "haptic.selectorLabels" . | fromYaml) }}
    {{- $_ := set $svcSelectorLabels $k $v }}
  {{- end }}
  {{- $_ := set $svcSelectorLabels "app.kubernetes.io/component" "loadbalancer" }}
  {{- /* Build a single Service-port list with chart-static defaults
         (http / https / stats) and any operator-declared extras
         appended. The k8sResources.haproxy-service template just
         iterates this list — there is no static / dynamic split on
         the Scriggo side. Operators can:
           * drop a default entry by overriding the matching
             `haproxy.service.{http,https,stats}` block with
             `port: 0` (the build below skips zero-port entries)
           * change a default port number via the existing
             `haproxy.service.{http,https,stats}.port` keys
           * append additional ports via
             `haproxy.service.extraPorts` (one entry per extra). */ -}}
  {{- $defaultPorts := list }}
  {{- range $name := list "http" "https" "stats" }}
    {{- $entry := index $svc $name }}
    {{- if $entry }}
      {{- $portNum := int ($entry.port | default 0) }}
      {{- if gt $portNum 0 }}
        {{- $portDict := dict "name" $name "port" $portNum "targetPort" $name "protocol" "TCP" }}
        {{- with ($entry.nodePort | default 0) }}
          {{- $_ := set $portDict "nodePort" (int .) }}
        {{- end }}
        {{- $defaultPorts = append $defaultPorts $portDict }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $allPorts := concat $defaultPorts ($svc.extraPorts | default list) }}
  {{- $haproxyService := dict
      "type" $svc.type
      "labels" $svcLabels
      "selector" $svcSelectorLabels
      "annotations" ($svc.annotations | default dict)
      "loadBalancerIP" ($svc.loadBalancerIP | default "")
      "loadBalancerClass" ($svc.loadBalancerClass | default "")
      "loadBalancerSourceRanges" ($svc.loadBalancerSourceRanges | default list)
      "externalTrafficPolicy" ($svc.externalTrafficPolicy | default "")
      "internalTrafficPolicy" ($svc.internalTrafficPolicy | default "")
      "healthCheckNodePort" (int ($svc.healthCheckNodePort | default 0))
      "publishNotReadyAddresses" ($svc.publishNotReadyAddresses | default false)
      "ports" $allPorts
  }}
  {{- $_ := set $extraContext "haproxyService" $haproxyService }}
  {{- end }}
  {{- end }}

  {{- /* Pass spoaHub wiring through extraContext when the sidecar is
         enabled AND at least one plugin contributes an SPOE message.
         The spoa-hub template library reads this to render spoe.conf
         and the spoa-hub backend block. We compute the union of
         enabled-plugin messages once here rather than asking Scriggo
         to recompute it on every render. The controller stays generic
         — it never learns the word "spoaHub". An empty messages list
         (sidecar forced on with no plugins enabled) leaves the library
         dormant; HAProxy rejects an spoe-agent with no `messages`,
         so emitting nothing is the only safe behaviour. */ -}}
  {{- if include "haptic.spoaHub.enabled" . }}
    {{- $messages := list }}
    {{- $pluginEntries := list }}
    {{- range $name, $plugin := .Values.spoaHub.plugins }}
      {{- if include "haptic.spoaHub.pluginEnabled" (dict "plugin" $plugin "root" $) }}
        {{- $messages = concat $messages $plugin.messages }}
        {{- /* Plugin name in HAProxy variable namespace must be a valid identifier;
               TOML/YAML allow kebab-case but HAProxy var lookups don't. Sanitize
               dashes to underscores to match what the rendered TOML and the
               chart's bootstrap configmap use. */}}
        {{- $entry := dict
            "name" (regexReplaceAll "-" $name "_")
            "library" (include "haptic.spoaHub.libName" (dict "name" $name))
            "messages" $plugin.messages
            "timeoutMs" (int (include "haptic.spoaHub.pluginTimeoutMs" (dict "plugin" $plugin "root" $ "name" $name)))
            "dependsOn" ($plugin.dependsOn | default list)
            "params" (include "haptic.spoaHub.effectivePluginParams" (dict "root" $ "name" $name "plugin" $plugin))
        }}
        {{- /* Coraza-specific: surface the directives field separately so
               the runtime render snippet can append per-Ingress
               `nginx.ingress.kubernetes.io/modsecurity-snippet` values
               into it. Other plugins splice `params` verbatim. */}}
        {{- if eq $name "coraza" }}
          {{- $_ := set $entry "directives" ($plugin.directives | default "") }}
        {{- end }}
        {{- $pluginEntries = append $pluginEntries $entry }}
      {{- end }}
    {{- end }}
    {{- with uniq $messages }}
      {{- $hub := $.Values.spoaHub.haproxy }}
      {{- $hubRuntime := $.Values.spoaHub.hub }}
      {{- /* pluginDir and defaultTimeoutMs aren't typically operator-tuned —
             the plugin path is baked into the spoa-hub container image,
             and the default-timeout floor matches the upstream hub's
             example config. Read with `default` anyway so an operator
             who DOES add them to values.yaml propagates through to the
             runtime renderer's `hub | dig | fallback` path; otherwise
             chart and library would silently disagree. */}}
      {{- $spoaHubExtra := dict
          "enabled" true
          "socketPath" $hub.socketPath
          "modeSpop" $hub.modeSpop
          "messages" .
          "timeoutHello" (toString $hub.timeoutHello)
          "timeoutIdle" (toString $hub.timeoutIdle)
          "timeoutProcessing" (toString $hub.timeoutProcessing)
          "poolMaxConn" (int $hub.poolMaxConn)
          "poolPurgeDelay" (toString $hub.poolPurgeDelay)
          "mirrorStaticMinSlots" (int ($.Values.spoaHub.mirrorStaticMinSlots | default 4))
          "hub" (dict
              "logLevel" $hubRuntime.logLevel
              "maxConnections" (int $hubRuntime.maxConnections)
              "blockingThreadKeepAliveSecs" (int $hubRuntime.blockingThreadKeepAliveSecs)
              "workerThreads" $hubRuntime.workerThreads
              "pluginDir" ($hubRuntime.pluginDir | default "/etc/haproxy-spoa-hub/plugins")
              "defaultTimeoutMs" (int ($hubRuntime.defaultTimeoutMs | default 500))
          )
          "plugins" $pluginEntries
      }}
      {{- $_ := set $extraContext "spoaHub" $spoaHubExtra }}
    {{- end }}
  {{- end }}

  {{- /* shm-stats-file settings (when enabled) */ -}}
  {{- $shmStats := .Values.haproxy.shmStats }}
  {{- if $shmStats.enabled }}
    {{- $_ := set $extraContext "shmStatsEnabled" true }}
    {{- $_ := set $extraContext "shmStatsPath" $shmStats.path }}
    {{- $_ := set $extraContext "shmStatsMaxObjects" ($shmStats.maxObjects | int) }}
  {{- end }}

  {{- /* nbthread for controller-rendered HAProxy config */ -}}
  {{- with include "haptic.haproxy.nbthread" . }}
    {{- $_ := set $extraContext "nbthread" (. | int) }}
  {{- end }}
  {{- /* Pluggable validators. The chart appends entries declared under
         controller.validators.entries to spec.validators (de-duplicating
         by name with operator-provided $config.validators winning). The
         CRD requires non-empty `files` per entry, so an empty list here
         leaves spec.validators absent rather than emitting an invalid
         empty entry. */ -}}
  {{- $entries := default list $controller.validators.entries }}
  {{- /* Auto-wire the spoa-hub validator when both the spoa-hub sidecar and the
         validator sidecar are enabled: the chart already emits
         general/spoa-hub-config.toml and runs the --validate-socket sidecar, so
         admission-time WAF/TOML validation (ADR-0007 step 6) works out of the box
         without the operator hand-adding the entry. An operator entry named
         "spoa-hub" (here or in config.validators) takes precedence. */ -}}
  {{- if include "haptic.spoaHub.enabled" . }}
  {{- if include "haptic.validators.enabled" . }}
    {{- $hasSpoa := false }}
    {{- range $entries }}
      {{- if eq .name "spoa-hub" }}{{- $hasSpoa = true }}{{- end }}
    {{- end }}
    {{- if not $hasSpoa }}
      {{- $entries = append $entries (dict
          "name" "spoa-hub"
          "socketPath" (include "haptic.validators.socketPath" .)
          "files" (list "general/spoa-hub-config.toml")) }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if $entries }}
    {{- $existing := default list $config.validators }}
    {{- $byName := dict }}
    {{- range $existing }}
      {{- $_ := set $byName .name . }}
    {{- end }}
    {{- $merged := $existing }}
    {{- range $entries }}
      {{- if not (hasKey $byName .name) }}
        {{- $merged = append $merged . }}
      {{- end }}
    {{- end }}
    {{- $_ := set $config "validators" $merged }}
  {{- end }}
  {{- /* Merge template libraries into config */ -}}
  {{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
  {{- range $key := list "templateSnippets" "maps" "files" "sslCertificates" "k8sResources" "haproxyConfig" "validationTests" "migrationCoverage" }}
    {{- with index $mergedLibraries $key }}
      {{- $_ := set $config $key . }}
    {{- end }}
  {{- end }}
  {{- /* Keep the bundled default-ssl-cert validationTests fixture (ssl.yaml's
         _global) in the same namespace default.pem looks it up in
         (extraContext.default_ssl_cert_namespace, set above to the release
         namespace). Library YAML can't be Helm-templated, so rewrite it here —
         now that the libraries (and thus _global) are merged into $config.
         Without this the suite fails in any release namespace other than the
         library placeholder, which crash-loops the controller because the load
         gate runs validationTests fatally. */ -}}
  {{- if $defaultSSL.enabled }}
    {{- $nsValue := ($defaultSSL.namespace | default .Release.Namespace) }}
    {{- range $sec := (dig "validationTests" "_global" "fixtures" "secrets" (list) $config) }}
      {{- if eq (dig "metadata" "name" "" $sec) $defaultSSL.secretName }}
        {{- $_ := set (index $sec "metadata") "namespace" $nsValue }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- /* Library-declared extraContext defaults. A template library may set
         top-level `templatingSettings.extraContext.<key>` to provide a default
         value its snippets read (e.g. nginx-ingress's nginxHttpRedirectCode).
         Lowest precedence: `merge` fills only keys NOT already set by the
         operator's controller.config or the chart-computed blocks above. */ -}}
  {{- with ($mergedLibraries.templatingSettings | default dict).extraContext }}
    {{- $_ := merge $extraContext . }}
  {{- end }}
  {{- /* watchedResources: merge with the operator's override instead of replacing it */ -}}
  {{- with $mergedLibraries.watchedResources }}
    {{- $_ := set $config "watchedResources" (merge ($config.watchedResources | default dict) .) }}
  {{- end }}
  {{- /* Strip Helm-only fields from watchedResources before CRD rendering */ -}}
  {{- range $name, $resource := $config.watchedResources }}
    {{- $_ := unset $resource "statusPatch" }}
  {{- end }}
  {{- toYaml $config | nindent 2 }}
{{- end }}
