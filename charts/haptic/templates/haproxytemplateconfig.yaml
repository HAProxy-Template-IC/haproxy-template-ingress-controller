{{- if .Values.controller.config }}
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateConfig
metadata:
  name: {{ .Values.controller.crdName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  {{- $config := .Values.controller.config | deepCopy }}
  {{- if and $config.credentialsSecretRef (not $config.credentialsSecretRef.name) }}
    {{- $_ := set $config.credentialsSecretRef "name" (printf "%s-credentials" (include "haptic.fullname" .)) }}
  {{- end }}
  {{- /* Set maxParallel for dataplane (auto-calculate if not explicitly set) */ -}}
  {{- if $config.dataplane }}
    {{- $maxParallel := include "haptic.config.dataplane.maxParallel" . | int }}
    {{- $_ := set $config.dataplane "maxParallel" $maxParallel }}
  {{- end }}
  {{- if $config.controller }}
    {{- /* Remove fields that are not part of the CRD (configured via env vars instead) */ -}}
    {{- $_ := unset $config.controller "healthzPort" }}
    {{- $_ := unset $config.controller "metricsPort" }}
    {{- if $config.controller.leaderElection }}
      {{- if not $config.controller.leaderElection.leaseName }}
        {{- $_ := set $config.controller.leaderElection "leaseName" (include "haptic.fullname" .) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- /* Add default SSL certificate configuration to extraContext */ -}}
  {{- if .Values.controller.defaultSSLCertificate.enabled }}
    {{- if not $config.templatingSettings }}
      {{- $_ := set $config "templatingSettings" dict }}
    {{- end }}
    {{- if not $config.templatingSettings.extraContext }}
      {{- $_ := set $config.templatingSettings "extraContext" dict }}
    {{- end }}
    {{- $_ := set $config.templatingSettings.extraContext "default_ssl_cert_name" .Values.controller.defaultSSLCertificate.secretName }}
    {{- $_ := set $config.templatingSettings.extraContext "default_ssl_cert_namespace" (.Values.controller.defaultSSLCertificate.namespace | default .Release.Namespace) }}
  {{- end }}
  {{- /* Add statusPatchesDisabled flag to extraContext when status patches are turned off */ -}}
  {{- if not (eq (.Values.controller.statusPatches.enabled | toString) "true") }}
    {{- if not $config.templatingSettings }}
      {{- $_ := set $config "templatingSettings" dict }}
    {{- end }}
    {{- if not $config.templatingSettings.extraContext }}
      {{- $_ := set $config.templatingSettings "extraContext" dict }}
    {{- end }}
    {{- $_ := set $config.templatingSettings.extraContext "statusPatchesDisabled" true }}
  {{- end }}
  {{- /* Add Gateway API controllerName to extraContext for status patches */ -}}
  {{- if and .Values.controller.templateLibraries.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}
    {{- if not $config.templatingSettings }}
      {{- $_ := set $config "templatingSettings" dict }}
    {{- end }}
    {{- if not $config.templatingSettings.extraContext }}
      {{- $_ := set $config.templatingSettings "extraContext" dict }}
    {{- end }}
    {{- $_ := set $config.templatingSettings.extraContext "controllerName" .Values.gatewayClass.controllerName }}
  {{- end }}
  {{- /* Add haproxyVersion to extraContext for version-gated features (e.g., shm-stats-file) */ -}}
  {{- if not $config.templatingSettings }}
    {{- $_ := set $config "templatingSettings" dict }}
  {{- end }}
  {{- if not $config.templatingSettings.extraContext }}
    {{- $_ := set $config.templatingSettings "extraContext" dict }}
  {{- end }}
  {{- $_ := set $config.templatingSettings.extraContext "haproxyVersion" .Values.haproxyVersion }}
  {{- /* Pass spoaHub wiring through extraContext when the sidecar is
         enabled AND at least one plugin contributes a SPOE message.
         The spoa-hub template library reads this to render spoe.conf
         and the spoa-hub backend block. We compute the union of
         enabled-plugin messages once here rather than asking Scriggo
         to recompute it on every render. The controller stays generic
         — it never learns the word "spoaHub". An empty messages list
         (sidecar forced on with no plugins enabled) leaves the library
         dormant; HAProxy rejects an spoe-agent with no `messages`,
         so emitting nothing is the only safe behaviour. */ -}}
  {{- if include "haptic.spoaHub.enabled" . }}
    {{- $messages := list }}
    {{- range $name, $plugin := .Values.spoaHub.plugins }}
      {{- if include "haptic.spoaHub.pluginEnabled" (dict "plugin" $plugin "root" $) }}
        {{- $messages = concat $messages $plugin.messages }}
      {{- end }}
    {{- end }}
    {{- $messages = uniq $messages }}
    {{- if $messages }}
      {{- $_ := set $config.templatingSettings.extraContext "spoaHub" (dict
          "enabled" true
          "socketPath" .Values.spoaHub.haproxy.socketPath
          "modeSpop" .Values.spoaHub.haproxy.modeSpop
          "messages" $messages
          "timeoutHello" (toString .Values.spoaHub.haproxy.timeoutHello)
          "timeoutIdle" (toString .Values.spoaHub.haproxy.timeoutIdle)
          "timeoutProcessing" (toString .Values.spoaHub.haproxy.timeoutProcessing)
          "poolMaxConn" (int .Values.spoaHub.haproxy.poolMaxConn)
          "poolPurgeDelay" (toString .Values.spoaHub.haproxy.poolPurgeDelay)
      ) }}
    {{- end }}
  {{- end }}
  {{- /* Add shmStats settings to extraContext when enabled */ -}}
  {{- if .Values.haproxy.shmStats.enabled }}
    {{- $_ := set $config.templatingSettings.extraContext "shmStatsEnabled" true }}
    {{- $_ := set $config.templatingSettings.extraContext "shmStatsPath" .Values.haproxy.shmStats.path }}
    {{- $_ := set $config.templatingSettings.extraContext "shmStatsMaxObjects" (.Values.haproxy.shmStats.maxObjects | int) }}
  {{- end }}
  {{- /* Add nbthread to extraContext for controller-rendered HAProxy config */ -}}
  {{- $nbthread := include "haptic.haproxy.nbthread" . }}
  {{- if $nbthread }}
    {{- if not $config.templatingSettings }}
      {{- $_ := set $config "templatingSettings" dict }}
    {{- end }}
    {{- if not $config.templatingSettings.extraContext }}
      {{- $_ := set $config.templatingSettings "extraContext" dict }}
    {{- end }}
    {{- $_ := set $config.templatingSettings.extraContext "nbthread" ($nbthread | int) }}
  {{- end }}
  {{- /* Merge template libraries into config */ -}}
  {{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
  {{- if $mergedLibraries.templateSnippets }}
    {{- $_ := set $config "templateSnippets" $mergedLibraries.templateSnippets }}
  {{- end }}
  {{- if $mergedLibraries.maps }}
    {{- $_ := set $config "maps" $mergedLibraries.maps }}
  {{- end }}
  {{- if $mergedLibraries.files }}
    {{- $_ := set $config "files" $mergedLibraries.files }}
  {{- end }}
  {{- if $mergedLibraries.sslCertificates }}
    {{- $_ := set $config "sslCertificates" $mergedLibraries.sslCertificates }}
  {{- end }}
  {{- if $mergedLibraries.haproxyConfig }}
    {{- $_ := set $config "haproxyConfig" $mergedLibraries.haproxyConfig }}
  {{- end }}
  {{- if $mergedLibraries.validationTests }}
    {{- $_ := set $config "validationTests" $mergedLibraries.validationTests }}
  {{- end }}
  {{- if $mergedLibraries.watchedResources }}
    {{- $_ := set $config "watchedResources" (merge ($config.watchedResources | default dict) $mergedLibraries.watchedResources) }}
  {{- end }}
  {{- /* Strip Helm-only fields from watchedResources before CRD rendering */ -}}
  {{- range $name, $resource := $config.watchedResources }}
    {{- $_ := unset $resource "statusPatch" }}
  {{- end }}
  {{- toYaml $config | nindent 2 }}
{{- end }}
