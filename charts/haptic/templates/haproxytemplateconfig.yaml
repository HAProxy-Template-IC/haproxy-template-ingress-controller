{{- $_ := include "haptic.controller.validateValues" . }}
{{- $_ := include "haptic.haproxy.validateValues" . }}
{{- $_ := include "haptic.spoaHub.validateValues" . }}
{{- $_ := include "haptic.rateLimit.validateValues" . }}
{{- $_ := include "haptic.cache.validateValues" . }}
{{- $_ := include "haptic.defaultSSLCertificate.validateValues" . }}
{{- $controller := .Values.controller }}
{{- if hasKey $controller "cache" }}{{- fail "controller.cache has moved to the top-level cache tree; use cache.varnish instead." }}{{- end }}
{{- if hasKey $controller "rateLimit" }}{{- fail "controller.rateLimit has moved to the top-level rateLimit tree; use rateLimit.shared instead." }}{{- end }}
{{- if hasKey $controller "defaultSSLCertificate" }}{{- fail "controller.defaultSSLCertificate has moved to the top-level defaultSSLCertificate tree." }}{{- end }}
{{- if hasKey $controller.config "includeMigrationCoverage" }}{{- fail "controller.config.includeMigrationCoverage was removed because migration coverage is no longer a CRD field. Remove the value." }}{{- end }}
{{- if hasKey $controller.config "migrationCoverage" }}{{- fail "controller.config.migrationCoverage was removed because migration coverage is no longer a CRD field. Remove the value." }}{{- end }}
{{- /* One HAProxyTemplateConfig per enabled template library, then the
       operator's own config LAST. The controller is handed all of them via
       CRD_NAME and merges them in that order, later wins, with per-source
       validationTests union (ADR-0016). Splitting keeps every object clear of
       etcd's ~1.5 MiB ceiling, which the single merged config had reached —
       and per-library budgets are what let the Scriggo comment stripper go.

       The in-file document order IS the merge order: `validate -f` and the
       preflight hook consume this stream and merge in document order, so the
       library objects come first and the operator's last. */ -}}
{{- $prepared := (include "haptic.prepareLibraries" . | fromYaml).libraries | default list }}
{{- /* Ordered: the range below fills it in merge order, and the config's own
       inline content wins after every ref. */ -}}
{{- $libraryRefs := dict }}
{{- $refOrder := list }}
{{- range $library := $prepared }}
{{- $refOrder = append $refOrder $library.name }}
{{- /* statusPatch is a Helm-only field on a watchedResource — the ClusterRole
       turns it into a status/patch rule and the CRD has no such property. */ -}}
{{- range $_, $resource := ($library.config.watchedResources | default dict) }}
  {{- $_ := unset $resource "statusPatch" }}
{{- end }}
{{- /* Snippets carry CONTENT only. watchedResources is unioned onto the
       operator's config by haptic.watchedResourcesUnion (the same union the
       ClusterRole and the webhook already consume), so a library cannot
       redefine the controller's operational identity. Copy the content keys
       explicitly rather than deleting the rest: an allowlist cannot leak a
       future field into an object whose schema has no room for it. */ -}}
{{- $content := dict }}
{{- range $key := (list "templatingSettings" "templateSnippets" "maps" "files" "sslCertificates" "k8sResources" "haproxyConfig" "validationTests") }}
  {{- with (index $library.config $key) }}
    {{- $_ := set $content $key . }}
  {{- end }}
{{- end }}
{{- $_ := set $content "revision" (printf "%s-%s" $library.name (toYaml $content | sha256sum | trunc 16)) }}
{{- $_ := set $libraryRefs $library.name (get $content "revision") }}
---
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateLibrary
metadata:
  name: {{ printf "%s-%s" $controller.configName $library.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "haptic.labels" $ | nindent 4 }}
    app.kubernetes.io/component: template-library
    haproxy-haptic.org/template-library: {{ $library.name }}
spec:
  {{- toYaml $content | nindent 2 }}
{{- end }}
{{- if $controller.config }}
---
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateConfig
metadata:
  name: {{ $controller.configName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator-config
spec:
  {{- $config := $controller.config | deepCopy }}
  {{- /* Ordered refs to the snippets objects above; the merge order is declared
         here and nowhere else, so nothing can disagree with it. The revision is
         compared by the controller and never recomputed from content, which is
         what lets `kubectl edit` on a snippet take effect. */ -}}
  {{- $refs := list }}
  {{- range $name := $refOrder }}
    {{- $refs = append $refs (dict "name" (printf "%s-%s" $controller.configName $name) "revision" (get $libraryRefs $name)) }}
  {{- end }}
  {{- if $refs }}
    {{- $_ := set $config "libraryRefs" $refs }}
  {{- end }}
  {{- /* Libraries declare the resources they need but cannot carry
         watchedResources themselves, so the union lands here — the same union
         the ClusterRole and the webhook consume. */ -}}
  {{- $_ := set $config "watchedResources" (include "haptic.watchedResourcesUnion" $ | fromYaml) }}
  {{- /* controller.config seeds the CR spec wholesale, so a values key that is
         NOT part of the CRD has to be dropped here or server-side apply rejects
         the whole object ("field not declared in schema") and `helm upgrade`
         fails. Chart-time-only switches belong in this list. */ -}}
  {{- with $config.credentialsSecretRef }}
    {{- $_ := set . "name" (.name | default (include "haptic.dataplane.credentialsSecretName" $)) }}
  {{- end }}
  {{- with $config.controller }}
    {{- if and .leaderElection (not .leaderElection.leaseName) }}
      {{- $_ := set .leaderElection "leaseName" (include "haptic.fullname" $) }}
    {{- end }}
  {{- end }}
  {{- $_ := set $config "dataplane" ($config.dataplane | default dict) }}
  {{- $_ := set $config.dataplane "port" (.Values.haproxy.ports.dataplane | int) }}
  {{- $_ := set $config "templatingSettings" ($config.templatingSettings | default dict) }}
  {{- $_ := set $config.templatingSettings "extraContext" (include "haptic.extraContext" . | fromYaml) }}
  {{- $extraContext := $config.templatingSettings.extraContext }}
  {{- /* What validationTests render with instead of extraContext, so an
         operator's values cannot change what a test asserts. */ -}}
  {{- $testRoot := dict "Values" (include "haptic.testValues" . | fromJson) "Release" .Release "Chart" .Chart "Files" .Files "Capabilities" .Capabilities "Template" .Template }}
  {{- $testExtraContext := include "haptic.extraContext" $testRoot | fromYaml }}
  {{- $_ := set $config.templatingSettings "testExtraContext" (mustMergeOverwrite $testExtraContext ($config.templatingSettings.testExtraContext | default dict)) }}
  {{- /* Pluggable validators. The chart appends entries declared under
         controller.validators.entries to spec.validators (de-duplicating
         by name with operator-provided $config.validators winning). The
         CRD requires non-empty `files` per entry, so an empty list here
         leaves spec.validators absent rather than emitting an invalid
         empty entry. */ -}}
  {{- $entries := default list $controller.validators.entries }}
  {{- /* Auto-wire the spoa-hub validator when both the spoa-hub sidecar and the
         validator sidecar are enabled: the chart already emits
         general/spoa-hub-config.toml and runs the --validate-socket sidecar, so
         admission-time WAF/TOML validation (ADR-0007 step 6) works out of the box
         without the operator hand-adding the entry. An operator entry named
         "spoa-hub" (here or in config.validators) takes precedence. */ -}}
  {{- if include "haptic.spoaHub.enabled" . }}
  {{- if include "haptic.validators.enabled" . }}
    {{- $hasSpoa := false }}
    {{- range $entries }}
      {{- if eq .name "spoa-hub" }}{{- $hasSpoa = true }}{{- end }}
    {{- end }}
    {{- if not $hasSpoa }}
      {{- /* dataFiles carries the fetched CRS to the validator. It runs in the
             controller pod and cannot read the HAProxy pod's disk, so without
             the content travelling with the request the coraza plugin sees an
             Include that matches nothing — which it reports as an error, since
             a ruleset that never arrived must not validate clean. */ -}}
      {{- $entries = append $entries (dict
          "name" "spoa-hub"
          "socketPath" (include "haptic.validators.socketPath" .)
          "files" (list "general/spoa-hub-config.toml")
          "dataFiles" (list "general/crs-*.conf" "general/*.data")) }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if $entries }}
    {{- $existing := default list $config.validators }}
    {{- $byName := dict }}
    {{- range $existing }}
      {{- $_ := set $byName .name . }}
    {{- end }}
    {{- $merged := $existing }}
    {{- range $entries }}
      {{- if not (hasKey $byName .name) }}
        {{- $merged = append $merged . }}
      {{- end }}
    {{- end }}
    {{- $_ := set $config "validators" $merged }}
  {{- end }}
  {{- /* validationTests render against fixture stores, so a configured WAF
         policy ConfigMap reference (extraContext.waf.policies.configMapRefs)
         would fail every test's render with "was not found" — and the fatal
         load gate would then block the very config whose referenced
         ConfigMap exists live in the cluster. Mirror the default-ssl-cert
         fixture above: inject a minimal catalog fixture per referenced
         identity into validationTests._global. A per-test fixture with the
         same namespace/name still overrides the injected one, and per-test
         extraContext pointing at OTHER identities still exercises the
         not-found failure. The catalog carries the values-declared
         defaultPolicy (or a placeholder) so catalog-membership checks hold. */ -}}
  {{- /* The injection rides THIS object's validationTests._global: the
         controller's union accumulates _global fixtures across all sources,
         so the operator object is the one place a values-derived fixture can
         live without touching the library objects. */ -}}
  {{- $wafRefs := dig "waf" "policies" "configMapRefs" (dict) $extraContext }}
  {{- if gt (len $wafRefs) 0 }}
    {{- /* Policy names must be unique across the whole catalog
           (registerPolicy rejects duplicates), so each injected source
           carries a distinct per-source placeholder, and only the FIRST
           source additionally carries the values-declared defaultPolicy —
           unless an inline policy already defines it. */ -}}
    {{- $defaultPolicy := (dig "waf" "policies" "defaultPolicy" "" $extraContext) | toString }}
    {{- $inlinePolicies := dig "waf" "policies" "inline" (dict) $extraContext }}
    {{- $defaultPolicyNeeded := and (ne $defaultPolicy "") (not (hasKey $inlinePolicies $defaultPolicy)) }}
    {{- $byIdentity := dict }}
    {{- $sourceIndex := 0 }}
    {{- range $ref := $wafRefs }}
      {{- $refNs := ((dig "namespace" "" $ref) | default $.Release.Namespace | toString) }}
      {{- $refName := ((dig "name" "" $ref) | toString) }}
      {{- $refKey := ((dig "key" "" $ref) | default "policies.yaml" | toString) }}
      {{- $id := printf "%s/%s" $refNs $refName }}
      {{- $catalog := printf "haptic-validation-fixture-%d:\n  description: Chart-injected validationTests catalog fixture\n" $sourceIndex }}
      {{- if and $defaultPolicyNeeded (eq $sourceIndex 0) }}
        {{- $catalog = printf "%s%s:\n  description: Chart-injected validationTests catalog fixture\n" $catalog $defaultPolicy }}
      {{- end }}
      {{- $entry := index $byIdentity $id | default (dict "apiVersion" "v1" "kind" "ConfigMap" "metadata" (dict "namespace" $refNs "name" $refName) "data" (dict)) }}
      {{- $_ := set (index $entry "data") $refKey $catalog }}
      {{- $_ := set $byIdentity $id $entry }}
      {{- $sourceIndex = add1 $sourceIndex }}
    {{- end }}
    {{- $vt := $config.validationTests | default dict }}
    {{- $vtGlobal := (index $vt "_global") | default dict }}
    {{- $vtFixtures := (index $vtGlobal "fixtures") | default dict }}
    {{- $vtCms := (index $vtFixtures "configmaps") | default list }}
    {{- range $id, $entry := $byIdentity }}
      {{- $vtCms = append $vtCms $entry }}
    {{- end }}
    {{- $_ := set $vtFixtures "configmaps" $vtCms }}
    {{- $_ := set $vtGlobal "fixtures" $vtFixtures }}
    {{- $_ := set $vt "_global" $vtGlobal }}
    {{- $_ := set $config "validationTests" $vt }}
  {{- end }}
  {{- /* Library-declared extraContext defaults stay on the library objects.
         The controller's merge is map-deep with later-wins, and this object is
         LAST in CRD_NAME, so an operator/chart key here beats a library
         default while library keys the operator never set survive — the same
         precedence the chart-side mergeOverwrite used to produce. */ -}}
  {{- /* Strip Helm-only fields from watchedResources before CRD rendering */ -}}
  {{- range $name, $resource := $config.watchedResources }}
    {{- $_ := unset $resource "statusPatch" }}
  {{- end }}
  {{- toYaml $config | nindent 2 }}
{{- end }}
