{{- $np := .Values.networkPolicy }}
{{- if $np.enabled }}
{{- $haproxyPorts := .Values.haproxy.ports }}
{{- $controllerPorts := .Values.controller.ports }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "haptic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "haptic.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Egress
    - Ingress

  # Egress rules - what the controller can access
  egress:
    {{- if $np.egress.allowDNS }}
    # Allow DNS resolution (kube-dns/coredns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}

    {{- if $np.egress.kubernetesApi }}
    # Allow Kubernetes API Server access
    {{- range $np.egress.kubernetesApi }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - port: {{ .port }}
          protocol: {{ .protocol }}
        {{- end }}
    {{- end }}
    {{- end }}

    {{- if $np.egress.haproxyPods.enabled }}
    # Allow access to HAProxy Dataplane API pods (release namespace unless namespaceSelector is set)
    - to:
        - podSelector:
            {{- toYaml $np.egress.haproxyPods.podSelector | nindent 12 }}
          {{- if $np.egress.haproxyPods.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $np.egress.haproxyPods.namespaceSelector | nindent 12 }}
          {{- end }}
      ports:
        - port: {{ $haproxyPorts.dataplane }}
          protocol: TCP
        - port: {{ $haproxyPorts.stats }}
          protocol: TCP
    {{- end }}

    {{- with $np.egress.additionalRules }}
    # Additional egress rules
    {{- toYaml . | nindent 4 }}
    {{- end }}

  # Ingress rules - what can access the controller
  ingress:
    {{- if $np.ingress.healthChecks.enabled }}
    # Allow health checks
    - from:
        {{- toYaml $np.ingress.healthChecks.from | nindent 8 }}
      ports:
        - port: {{ $controllerPorts.healthz }}
          protocol: TCP
    {{- end }}

    {{- if $np.ingress.dataplaneApi.enabled }}
    # Allow controller to access HAProxy Dataplane API
    - from:
        {{- toYaml $np.ingress.dataplaneApi.from | nindent 8 }}
      ports:
        - port: {{ $haproxyPorts.dataplane }}
          protocol: TCP
    {{- end }}

    {{- if $np.ingress.monitoring.enabled }}
    # Allow Prometheus/monitoring to scrape metrics
    - from:
        - podSelector:
            {{- toYaml $np.ingress.monitoring.podSelector | nindent 12 }}
          {{- if $np.ingress.monitoring.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $np.ingress.monitoring.namespaceSelector | nindent 12 }}
          {{- end }}
      ports:
        - port: {{ $controllerPorts.metrics }}
          protocol: TCP
    {{- end }}

    {{- if and .Values.webhook.enabled $np.ingress.webhook.enabled }}
    # Allow Kubernetes API server to call webhook
    - from:
        {{- toYaml $np.ingress.webhook.from | nindent 8 }}
      ports:
        - port: {{ $controllerPorts.webhook }}
          protocol: TCP
    {{- end }}

    {{- with $np.ingress.additionalRules }}
    # Additional ingress rules
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
