{{- $default := .Values.defaultSSLCertificate }}
{{- $cm := $default.certManager }}
{{- if and $default.enabled $cm.enabled (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $default.secretName }}
  namespace: {{ $default.namespace | default .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  secretName: {{ $default.secretName }}
  duration: {{ $cm.duration | default "8760h" }}
  renewBefore: {{ $cm.renewBefore | default "720h" }}
  dnsNames:
    {{- toYaml (required "defaultSSLCertificate.certManager.dnsNames is required when using cert-manager for SSL certificates" $cm.dnsNames) | nindent 4 }}
  issuerRef:
    {{- if $cm.createIssuer }}
    name: {{ include "haptic.fullname" . }}-ssl-selfsigned
    kind: Issuer
    {{- else }}
    {{- $_ := required "defaultSSLCertificate.certManager.issuerRef.name is required when createIssuer is false" $cm.issuerRef.name }}
    {{- toYaml $cm.issuerRef | nindent 4 }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}
