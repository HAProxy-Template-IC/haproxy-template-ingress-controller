{{/*
The configuration's validationTests, in their own object.

They are ~36% of the merged spec and are needed only when the configuration is
VALIDATED, never when it is rendered — carrying them inline is what pushed a
migration profile past etcd's per-object limit, which is the whole reason this
file exists. The controller runs the union of this object and any inline
spec.validationTests, so a hand-written configuration that keeps them inline is
unaffected.

This is a separate file rather than a second document in
haproxytemplateconfig.yaml so that template still renders exactly one document —
several chart test suites address it by document index.
*/}}
{{- $controller := .Values.controller }}
{{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
{{- $tests := merge (deepCopy ($mergedLibraries.validationTests | default dict)) ($controller.config.validationTests | default dict) }}
{{- if $tests }}
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyValidationTests
metadata:
  name: {{ $controller.configName }}-tests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    app.kubernetes.io/component: validation-tests
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  validationTests:
    {{- toYaml $tests | nindent 4 }}
{{- end }}
