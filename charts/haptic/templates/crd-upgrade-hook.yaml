{{- /*
CRD upgrade hook: server-side applies the bundled CRDs on install/upgrade.

Helm never upgrades the CRDs it installed from crds/, so additive schema changes
in a chart upgrade would otherwise be pruned by the API server. This Job runs
`haptic-controller apply-crds` (server-side apply) as a pre-install/pre-upgrade
hook, gated by crds.upgradeJob.enabled.

The Job and its scoped RBAC (ServiceAccount + ClusterRole limited to
customresourcedefinitions) are hook resources. Weights order RBAC (-5) before
the Job (0); hook-succeeded deletion is deferred by Helm until the whole hook
batch completes, so the RBAC outlives the Job it authorises.
*/}}
{{- if .Values.crds.upgradeJob.enabled }}
{{- $job := .Values.crds.upgradeJob }}
{{- /* Namespace-qualified: the ClusterRole/Binding are cluster-scoped, so the
       whole hook RBAC set shares one namespace-qualified name to avoid collisions
       across same-release-name multi-namespace installs. */ -}}
{{- $name := printf "%s-crd-upgrade" (include "haptic.clusterScopedFullname" .) | trunc 63 | trimSuffix "-" }}
{{- $controller := .Values.controller }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # get/list/create/patch on CRDs: create for first install, patch (Apply) for
  # upgrades. No delete — the hook never removes CRDs (data-loss safety).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    {{- with $job.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $job.backoffLimit }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "haptic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crd-upgrade
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- include "haptic.podSpec" $controller.podSpec | nindent 6 }}
      {{- with $controller.podSpec.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apply-crds
          {{- with $controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "haptic.controller.image" . | quote }}
          imagePullPolicy: {{ $controller.image.pullPolicy }}
          command: ["/usr/local/bin/haptic-controller"]
          args: ["apply-crds"]
          resources:
            {{- toYaml $job.resources | nindent 12 }}
{{- end }}
