{{- /*
Chart-generated self-signed webhook serving certificate (the default,
zero-dependency path — see templates/_webhook.tpl). Rendered only when the
chart is self-signing (webhook enabled, cert-manager off, no manual caBundle).
cert-manager mode creates this Secret via the Certificate resource instead; the
manual mode expects the operator to create it. The controller mounts this Secret
at WEBHOOK_CERT_DIR and hot-reloads it, so a future rotation (delete + helm
upgrade, or switch to cert-manager) is picked up without a restart.
*/ -}}
{{- if include "haptic.webhook.selfSigned" . }}
{{- $certs := include "haptic.webhook.selfSignedCert" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haptic.webhook.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certs.crt | b64enc }}
  tls.key: {{ $certs.key | b64enc }}
  ca.crt: {{ $certs.ca | b64enc }}
{{- end }}
