{{- $controller := .Values.controller }}
{{- $podSpec := $controller.podSpec }}
{{- $ports := $controller.ports }}
{{- $debugPort := $controller.debugPort }}
{{- $debugPortInt := $debugPort | int }}
{{- $webhookEnabled := .Values.webhook.enabled }}
{{- $webhookSecretName := include "haptic.webhook.secretName" . }}
{{- $labels := include "haptic.labels" . }}
{{- $validatorsEnabled := include "haptic.validators.enabled" . }}
{{- $validators := $controller.validators }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haptic.controllerFullname" . }}
  labels:
    {{- $labels | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.deploymentAnnotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "haptic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "haptic.dataplane.credentialsChecksum" . }}
        {{- with $podSpec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with $podSpec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "haptic.serviceAccountName" . }}
      {{- include "haptic.podSpec" $podSpec | trim | nindent 6 }}
      {{- with $podSpec.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "haptic.controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/haptic-controller"]
          args: ["run"]
          ports:
            {{- range $name := list "healthz" "metrics" }}
            - name: {{ $name }}
              containerPort: {{ index $ports $name }}
              protocol: TCP
            {{- end }}
            {{- if and (gt $debugPortInt 0) (ne $debugPortInt ($ports.healthz | int)) }}
            - name: debug
              containerPort: {{ $debugPort }}
              protocol: TCP
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook
              containerPort: {{ $ports.webhook }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $env := list (dict "name" "POD_NAME" "field" "metadata.name") (dict "name" "POD_NAMESPACE" "field" "metadata.namespace") }}
            - name: {{ $env.name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $env.field }}
            {{- end }}
            - name: CRD_NAME
              value: {{ $controller.crdName | quote }}
            - name: SECRET_NAME
              value: {{ include "haptic.dataplane.credentialsSecretName" . }}
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "haptic.webhook.serviceName" . }}
            - name: DEBUG_PORT
              value: {{ $debugPort | quote }}
            {{- with $controller.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if $webhookEnabled }}
            - name: WEBHOOK_PORT
              value: {{ $ports.webhook | quote }}
            - name: WEBHOOK_CERT_SECRET_NAME
              value: {{ $webhookSecretName | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $startupProbe := .Values.startupProbe }}
          {{- if $startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit $startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $webhookEnabled }}
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
            {{- end }}
            {{- if $validatorsEnabled }}
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- if $validatorsEnabled }}
        # Validator sidecar — runs the haproxy-spoa-hub binary in
        # --validate-socket mode so the admission webhook can call into
        # plugin validate() overrides at admission time. Loads the same
        # plugins and config.toml as the HAProxy-side spoa-hub sidecar
        # so the validator and the data plane see identical plugin
        # behavior. Listens on a Unix socket on a shared emptyDir.
        - name: validators
          image: {{ include "haptic.spoaHub.image" . }}
          imagePullPolicy: {{ .Values.spoaHub.image.pullPolicy }}
          args:
            - --config
            - /etc/haproxy-spoa-hub/config.toml
            - --validate-socket
            - {{ include "haptic.validators.socketPath" . }}
          securityContext:
            {{- toYaml $validators.securityContext | nindent 12 }}
          resources:
            {{- toYaml $validators.resources | nindent 12 }}
          volumeMounts:
            - name: validators-config
              mountPath: /etc/haproxy-spoa-hub/config.toml
              subPath: config.toml
              readOnly: true
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            {{- with $validators.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with .Values.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $webhookEnabled }}
        - name: webhook-certs
          secret:
            secretName: {{ $webhookSecretName }}
        {{- end }}
        {{- if $validatorsEnabled }}
        - name: validators-config
          configMap:
            name: {{ include "haptic.spoaHub.configMapName" . }}
        - name: validators-socket
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
