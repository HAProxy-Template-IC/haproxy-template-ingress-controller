{{- $controller := .Values.controller }}
{{- $podSpec := $controller.podSpec }}
{{- $ports := $controller.ports }}
{{- $webhookEnabled := .Values.controller.webhook.enabled }}
{{- $webhookSecretName := include "haptic.webhook.secretName" . }}
{{- $webhookResourceTimeoutSeconds := include "haptic.webhook.resourceTimeoutSeconds" . | int }}
{{- $webhookConfigTimeoutSeconds := include "haptic.webhook.configTimeoutSeconds" . | int }}
{{- $labels := include "haptic.labels.withCommon" . }}
{{- $validatorsEnabled := include "haptic.validators.enabled" . }}
{{- $validators := $controller.validators }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haptic.controllerFullname" . }}
  labels:
    {{- $labels | nindent 4 }}
  {{- if or $controller.deploymentAnnotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $controller.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not $controller.autoscaling.enabled }}
  replicas: {{ $controller.replicaCount }}
  {{- end }}
  {{- with $controller.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ $controller.minReadySeconds }}
  revisionHistoryLimit: {{ $controller.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "haptic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "haptic.dataplane.credentialsChecksum" . }}
        {{- with $podSpec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with $podSpec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "haptic.serviceAccountName" . }}
      {{- include "haptic.podSpec" $podSpec | nindent 6 }}
      {{- with $podSpec.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $controller.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          {{- with $controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "haptic.controller.image" . | quote }}
          imagePullPolicy: {{ $controller.image.pullPolicy }}
          command: ["/usr/local/bin/haptic-controller"]
          args: ["run"]
          ports:
            {{- range $name := list "healthz" "metrics" }}
            {{- if gt (int (index $ports $name)) 0 }}
            - name: {{ $name }}
              containerPort: {{ index $ports $name }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook
              containerPort: {{ $ports.webhook }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $env := list (dict "name" "POD_NAME" "field" "metadata.name") (dict "name" "POD_NAMESPACE" "field" "metadata.namespace") }}
            - name: {{ $env.name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $env.field }}
            {{- end }}
            - name: CRD_NAME
              value: {{ $controller.configName | quote }}
            - name: SECRET_NAME
              value: {{ include "haptic.dataplane.credentialsSecretName" . }}
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "haptic.webhook.serviceName" . }}
            - name: DEBUG_PORT
              value: {{ $ports.healthz | quote }}
            - name: METRICS_PORT
              value: {{ $ports.metrics | quote }}
            {{- with $controller.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if $webhookEnabled }}
            - name: WEBHOOK_PORT
              value: {{ $ports.webhook | quote }}
            - name: WEBHOOK_CERT_DIR
              value: /etc/webhook/certs
            - name: WEBHOOK_RESOURCE_ADMISSION_TIMEOUT
              value: {{ printf "%ds" (sub $webhookResourceTimeoutSeconds 1) | quote }}
            - name: WEBHOOK_CONFIG_ADMISSION_TIMEOUT
              value: {{ printf "%ds" (sub $webhookConfigTimeoutSeconds 1) | quote }}
            {{- end }}
            {{- with $controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $startupProbe := $controller.startupProbe }}
          {{- if $startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit $startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- with $controller.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $webhookEnabled }}
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
            {{- end }}
            {{- if $validatorsEnabled }}
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            {{- end }}
            {{- with $controller.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- if $validatorsEnabled }}
        # Validator sidecar — runs the haproxy-spoa-hub binary in
        # --validate-socket mode so the admission webhook can call into
        # plugin validate() overrides at admission time. Loads the same
        # plugins and config.toml as the HAProxy-side spoa-hub sidecar
        # so the validator and the data plane see identical plugin
        # behavior. Listens on a Unix socket on a shared emptyDir.
        - name: validators
          image: {{ include "haptic.spoaHub.image" . }}
          imagePullPolicy: {{ .Values.spoaHub.image.pullPolicy }}
          args:
            - --config
            - /etc/haproxy-spoa-hub/config.toml
            - --validate-socket
            - {{ include "haptic.validators.socketPath" . }}
          securityContext:
            {{- toYaml $validators.securityContext | nindent 12 }}
          resources:
            {{- toYaml $validators.resources | nindent 12 }}
          # The pod is marked Ready only after this exec succeeds, so
          # the haptic-webhook Service does not include the controller
          # pod in its endpoints until the validator socket exists. Without
          # the probe the pod's `Ready` condition flips on as soon as the
          # controller container's /healthz responds, which can race the
          # validator sidecar's socket-bind and produce 'connection refused'
          # on early webhook calls. Mirrors the failure mode in the !890
          # post-mortem and the e2e debug from !893.
          readinessProbe:
            exec:
              command:
                - test
                - -S
                - {{ include "haptic.validators.socketPath" . }}
            initialDelaySeconds: 2
            periodSeconds: 5
          # Liveness check on the same socket. `test -S` only verifies the
          # socket file exists — it does not detect a deadlocked sidecar
          # that's still holding the file open. A richer check (try a
          # connect()) would catch that, but Kubernetes' exec-probe model
          # makes it awkward and the hub's keep-alive loop has no known
          # deadlock paths today. Worth a follow-up if hangs surface in
          # production.
          livenessProbe:
            exec:
              command:
                - test
                - -S
                - {{ include "haptic.validators.socketPath" . }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: validators-config
              mountPath: /etc/haproxy-spoa-hub/config.toml
              subPath: config.toml
              readOnly: true
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            # Writable /tmp for the coraza plugin's pre-init filesystem-
            # access probe. Coraza's WAF init writes a small `checkfs…`
            # file under `/tmp` to verify it can do disk I/O before
            # compiling SecRules; with `readOnlyRootFilesystem: true`
            # on the validator sidecar the probe fails EROFS and every
            # admission webhook call returns "create file: read-only
            # file system. Use 'no_fs_access' build tag…" — the
            # validator never reaches the SecRule parser. Memory-
            # backed because the contents are tiny + ephemeral. Same
            # pattern as the haproxy-pod's `spoa-hub-tmp` volume.
            - name: validators-tmp
              mountPath: /tmp
            {{- with $validators.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with $controller.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $webhookEnabled }}
        - name: webhook-certs
          secret:
            secretName: {{ $webhookSecretName }}
        {{- end }}
        {{- if $validatorsEnabled }}
        - name: validators-config
          configMap:
            name: {{ include "haptic.spoaHub.configMapName" . }}
        - name: validators-socket
          emptyDir: {}
        - name: validators-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- with $controller.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
