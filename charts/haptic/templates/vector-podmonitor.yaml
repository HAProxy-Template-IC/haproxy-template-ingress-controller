{{/*
PodMonitor for the vector sidecar's merged metrics endpoint.

This is the "one target instead of two" payoff: vector re-exports HAProxy's
exporter and the spoa-hub's metrics alongside its own, so this single endpoint
replaces the two the spoa-hub PodMonitor declares. That file is disabled whenever
vector is enabled, so the two never both render.

No loopback guard is needed here (unlike the spoa-hub PodMonitor): vector's
exporter binds 0.0.0.0 in the rendered config, and the sources it scrapes are
reached over loopback from inside the pod — which is precisely why enabling vector
lets spoaHub.hub.metricsAddr stay on its loopback-only default.

Targets become UP once HAPTIC pushes the rendered config containing the exporter.
A supervised Vector child exit leaves HAProxy readiness unchanged.
*/}}
{{- if .Values.vector.enabled }}
{{- $pm := .Values.vector.podMonitor }}
{{- if $pm.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "haptic.fullname" . }}-vector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    {{- with $pm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "haptic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loadbalancer
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- /* vector-metrics carries everything; vector-sizes exists only when a size
         family is on, purely because `buckets` is per-sink. Both take the same
         settings, so tuning `interval` needs no knowledge of the second. */ -}}
  {{- $ports := list "vector-metrics" }}
  {{- if include "haptic.vector.sizeExporterEnabled" . }}
  {{- $ports = append $ports "vector-sizes" }}
  {{- end }}
  podMetricsEndpoints:
  {{- range $port := $ports }}
    - port: {{ $port }}
      path: /metrics
      {{- with $pm.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $pm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with $pm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
