{{- $pm := .Values.spoaHub.monitoring.podMonitor }}
{{- /* Skipped entirely when the vector sidecar is enabled: vector re-exports both
       of the endpoints below on one port and vector-podmonitor.yaml scrapes that,
       so rendering this too would double every haproxy_* and spoa_* series.
       Skipping also means the loopback guard below does not fire — with vector,
       spoaHub.hub.metricsAddr SHOULD stay loopback-only, because vector scrapes it
       from inside the pod rather than Prometheus scraping the pod IP. */}}
{{- if and $pm.enabled (include "haptic.spoaHub.enabled" .) (not .Values.vector.enabled) }}
{{- $addr := include "haptic.spoaHub.metricsAddrEffective" . }}
{{- /* Loopback guard: a PodMonitor scrapes the pod IP, so a hub bound to
       loopback is unreachable and the scrape target would be dead. Catch IPv4
       127/8 and every IPv6 loopback spelling ([::1], [0:0:...:1], [::0001]):
       the bracketed host with brackets, colons and zeros stripped is exactly
       "1" for loopback, and "" for the bind-all [::] (which IS reachable, so
       must not be flagged). metricsAddr is validated as a numeric IP upstream,
       so hostnames can't reach here. */}}
{{- $v6 := regexFind "\\[[0-9A-Fa-f:]+\\]" $addr }}
{{- $v6core := regexReplaceAll "[\\[\\]:0]" $v6 "" }}
{{- if or (eq (trim $addr) "") (regexMatch "^127\\." $addr) (and (ne $v6 "") (eq $v6core "1")) }}
{{- fail "spoaHub.monitoring.podMonitor.enabled=true requires spoaHub.hub.metricsAddr to be a non-loopback bind Prometheus can reach from outside the pod (the default 127.0.0.1:9095 is loopback-only). Set spoaHub.hub.metricsAddr to \"0.0.0.0:9095\" (or a pod-routable address), or disable spoaHub.monitoring.podMonitor." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "haptic.fullname" . }}-spoa-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    {{- with $pm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "haptic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loadbalancer
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    # SPOA hub data-path metrics (spoa_*, plugin_coraza_*), via the sidecar's
    # named `metrics` container port. prometheus-operator only builds targets
    # from declared container ports, so this must be a named port, not a bare
    # targetPort on the (otherwise undeclared) metrics port.
    - port: metrics
      path: /metrics
      {{- with $pm.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $pm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with $pm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # HAProxy Prometheus exporter — backend timers including the spoa-hub backend
    # round trip (haproxy_backend_*_time_average_seconds{proxy="spoa-hub"}).
    - port: stats
      path: /metrics
      {{- with $pm.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $pm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with $pm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
