{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haptic.dataplane.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
type: Opaque
data:
  dataplane_username: {{ include "haptic.dataplane.username" . | b64enc | quote }}
  dataplane_password: {{ include "haptic.dataplane.password" . | b64enc | quote }}
{{- end }}
