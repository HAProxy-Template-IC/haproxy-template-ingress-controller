{{- $gc := .Values.gatewayClass }}
{{- if and $gc.enabled .Values.controller.templateLibraries.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}
{{- $params := $gc.parametersRef }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $gc.name }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
  {{- if $gc.default }}
  annotations:
    gateway.networking.k8s.io/is-default-class: "true"
  {{- end }}
spec:
  controllerName: {{ $gc.controllerName }}
  parametersRef:
    group: {{ $params.group }}
    kind: {{ $params.kind }}
    name: {{ $params.name | default .Values.controller.crdName }}
    namespace: {{ $params.namespace | default .Release.Namespace }}
{{- end }}
