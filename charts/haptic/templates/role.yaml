{{- if .Values.rbac.create }}
{{- $cachePDB := .Values.controller.cache.varnish.podDisruptionBudget | default dict }}
{{- $cachePDBEnabled := true }}
{{- if hasKey $cachePDB "enabled" }}
  {{- $cachePDBEnabled = $cachePDB.enabled }}
{{- end }}
{{- $ratePDB := .Values.controller.rateLimit.store.podDisruptionBudget | default dict }}
{{- $ratePDBEnabled := true }}
{{- if hasKey $ratePDB "enabled" }}
  {{- $ratePDBEnabled = $ratePDB.enabled }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "haptic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
rules:
  # Secrets (namespace-scoped)
  # - Credentials: HAProxy Dataplane API credentials (read-only)
  # - SSL Certificates: Published as Secrets for HAProxy runtime config (read-write)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # HAProxyCfg CRD (runtime configuration publishing)
  # Published to controller's namespace as read-only view of rendered config
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs/status"]
    verbs: ["get", "update", "patch"]
  # HAProxyMapFile CRD (auxiliary map files)
  # Published to controller's namespace as children of HAProxyCfg
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxymapfiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxymapfiles/status"]
    verbs: ["get", "update", "patch"]
  # Services (namespace-scoped — tightens blast radius)
  #
  # Templates that declare Kubernetes resources via the renderResource()
  # template function need RBAC on those resource types. The
  # GatewayStaticAddresses feature spawns one LoadBalancer Service per
  # Gateway with spec.addresses[] in *this* (controller) namespace, with
  # spec.loadBalancerIP plumbed from the Gateway's spec.addresses[].value.
  # Same pattern every other Gateway API implementation uses
  # (envoy-gateway, cilium, istio, NGF) — but scoped to the controller's
  # namespace via Role (not ClusterRole) so a misbehaving template can't
  # escalate beyond the controller's own namespace, even if the
  # in-process RestrictToOwnNamespace guard in resourceapplier were
  # somehow bypassed.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.controller.cache.varnish.enabled }}
  # Shared-cache (Varnish) tier: the haptic-annotations library's k8sResources
  # emit a VCL ConfigMap into the controller's own namespace, applied via SSA by
  # the resource applier. SSA needs patch (with create for first apply); delete
  # covers orphan cleanup when the tier is disabled.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if or .Values.controller.cache.varnish.enabled (and .Values.controller.rateLimit.shared.enabled .Values.controller.rateLimit.store.enabled) }}
  # Template-owned auxiliary workloads: Varnish emits a StatefulSet or
  # Deployment, and shared rate limiting emits a Valkey StatefulSet.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if or (and .Values.controller.cache.varnish.enabled $cachePDBEnabled) (and .Values.controller.rateLimit.shared.enabled .Values.controller.rateLimit.store.enabled $ratePDBEnabled) }}
  # Template-owned auxiliary workloads can emit PodDisruptionBudgets alongside
  # their Varnish or Sentinel-managed Valkey workloads.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.controller.cache.varnish.enabled }}
  {{- if .Values.controller.cache.varnish.autoscaling.enabled }}
  # The cache tier's HPA is applied via SSA when autoscaling is enabled.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- end }}
{{- end }}
