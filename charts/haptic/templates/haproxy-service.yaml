{{- $haproxy := .Values.haproxy }}
{{- if $haproxy.enabled }}
{{- $svc := $haproxy.service }}
{{- $haproxyFullname := include "haptic.haproxyFullname" . }}
{{- $labels := include "haptic.labels" . }}
{{- $selectorLabels := include "haptic.selectorLabels" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $haproxyFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- $exposesNodePort := or (eq $svc.type "NodePort") (eq $svc.type "LoadBalancer") }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $svc.internalTrafficPolicy }}
  internalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $svc.healthCheckNodePort }}
  healthCheckNodePort: {{ . }}
  {{- end }}
  {{- with $svc.publishNotReadyAddresses }}
  publishNotReadyAddresses: {{ . }}
  {{- end }}
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  ports:
    {{- range $name := list "http" "https" "stats" }}
    {{- $port := index $svc $name }}
    - name: {{ $name }}
      port: {{ $port.port }}
      targetPort: {{ $name }}
      protocol: TCP
      {{- if $exposesNodePort }}
      nodePort: {{ $port.nodePort }}
      {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $haproxyFullname }}-dataplane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    # Distinct from the haproxy-frontend service: the dataplane service
    # is the internal HAProxy Dataplane API (used by the controller to
    # push config), NOT user-facing traffic. Selectors that look up the
    # user-facing loadbalancer (e.g. status-address discovery, network
    # policy ingress rules) intentionally exclude this service.
    app.kubernetes.io/component: dataplane-api
spec:
  type: {{ $haproxy.dataplane.service.type }}
  selector:
    # Pods are still labeled `component: loadbalancer` (the HAProxy
    # pod hosts the dataplane sidecar). The mismatch between Service
    # label and pod label is intentional.
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  ports:
    - name: dataplane
      port: {{ $haproxy.ports.dataplane }}
      targetPort: dataplane
      protocol: TCP
{{- end }}
