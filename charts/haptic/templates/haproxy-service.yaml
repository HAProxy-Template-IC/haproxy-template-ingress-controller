{{- $haproxy := .Values.haproxy }}
{{- if $haproxy.enabled }}
{{- $haproxyFullname := include "haptic.haproxyFullname" . }}
{{- $labels := include "haptic.labels" . }}
{{- $selectorLabels := include "haptic.selectorLabels" . }}
{{- /* The user-facing HAProxy LoadBalancer Service is no longer
       chart-static. It is now declared in
       `libraries/base.yaml` as a `k8sResources.haproxy-service`
       template, rendered by the controller from listener state, and
       applied via Server-Side Apply. The controller injects an
       OwnerReference at apply time pointing at the
       HAProxyTemplateConfig CR (controller=true,
       blockOwnerDeletion=true) so `helm uninstall` cascade-GCs the
       Service when this chart goes away.

       The chart-internal dataplane Service remains static — it is
       internal controller-to-haproxy plumbing (no listener-derived
       state) and has no functional reason to participate in the
       declarative resource flow. Its name, label and port name predate
       the HAPTIC agent and are kept: the Deployment selector is
       immutable and scripts and docs address it by name. */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $haproxyFullname }}-dataplane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    # Distinct from the haproxy-frontend service: this one reaches the
    # HAPTIC agent (used by the controller to push config), NOT
    # user-facing traffic. Selectors that look up the user-facing
    # loadbalancer (e.g. status-address discovery, network policy
    # ingress rules) intentionally exclude this service.
    app.kubernetes.io/component: dataplane-api
spec:
  type: {{ $haproxy.agent.service.type }}
  selector:
    # Pods are still labeled `component: loadbalancer` (the HAProxy
    # pod hosts the agent sidecar). The mismatch between Service
    # label and pod label is intentional.
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  ports:
    - name: dataplane
      port: {{ $haproxy.ports.dataplane }}
      targetPort: dataplane
      protocol: TCP
{{- end }}
