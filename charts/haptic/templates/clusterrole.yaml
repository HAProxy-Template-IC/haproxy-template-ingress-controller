{{- if .Values.rbac.create }}
{{- /* Merge watched resources from libraries */ -}}
{{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
{{- $allWatchedResources := merge ($mergedLibraries.watchedResources | default dict) (.Values.controller.config.watchedResources | default dict) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "haptic.fullname" . }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
rules:
  # Watched resources from configuration and libraries
  {{- range $name, $resource := $allWatchedResources }}
  {{- $groups := list }}
  {{- range $v := include "haptic.candidateVersionsOf" $resource | fromJsonArray }}
  {{- $groups = append $groups (include "haptic.apiGroupOf" $v) }}
  {{- end }}
  - apiGroups:
      {{- range $g := $groups | uniq }}
      - {{ $g }}
      {{- end }}
    resources:
      - {{ $resource.resources }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Status subresource patch permissions for resources with statusPatch: true
  {{- range $name, $resource := $allWatchedResources }}
  {{- if $resource.statusPatch }}
  {{- $groups := list }}
  {{- range $v := include "haptic.candidateVersionsOf" $resource | fromJsonArray }}
  {{- $groups = append $groups (include "haptic.apiGroupOf" $v) }}
  {{- end }}
  - apiGroups:
      {{- range $g := $groups | uniq }}
      - {{ $g }}
      {{- end }}
    resources:
      - {{ $resource.resources }}/status
    verbs: ["patch"]
  {{- end }}
  {{- end }}
  # Additional core resources
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  # Leader election (coordination.k8s.io/v1)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # CustomResourceDefinitions — read-only access so the controller's
  # type-bootstrap (pkg/controller/typebootstrap) can resolve OpenAPI
  # schemas for watched CRDs at iteration start. Without this, the
  # cluster fetcher falls back to the public OpenAPI v3 endpoint
  # (which covers built-ins and any registered CRD), but CRD-defined
  # x-kubernetes-preserve-unknown-fields subtrees and the canonical
  # schema-from-CRD path can't resolve, so the typed view degrades
  # to the generic envelope for those resources. Granting list/get
  # here keeps typed access at full fidelity in production. The watch
  # verb additionally powers the runtime CRD watch
  # (pkg/controller/crdwatch): late installation, in-place upgrade, or
  # removal of a watched resource's CRD re-resolves the effective config
  # without a helm operation or pod restart.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # HAProxyTemplateConfig CRD
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxytemplateconfigs"]
    verbs: ["get", "list", "watch"]
  # HAProxyTemplateConfig status updates
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxytemplateconfigs/status"]
    verbs: ["update", "patch"]
  # Auxiliary file CRDs for config publishing
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs", "haproxygeneralfiles", "haproxycrtlistfiles", "haproxymapfiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Auxiliary file CRD status updates
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs/status", "haproxygeneralfiles/status", "haproxycrtlistfiles/status", "haproxymapfiles/status"]
    verbs: ["update", "patch"]
  {{- if .Values.controller.templateLibraries.ingress.enabled }}
  # Warning Events on Ingresses whose by-name backend Service is absent
  # (the ingress library's `ingress-degraded-backend-events` k8sResources
  # emission, issue #66). Each Event lands in the owning Ingress's own
  # namespace, so the grant is cluster-scoped. SSA needs patch (with
  # create for the first apply); delete covers orphan pruning once the
  # Service appears.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.controller.templateLibraries.gateway.enabled }}
  # Cluster-wide Service write verbs for Gateway-API templates that emit
  # owned Services in namespaces other than the controller's. The chart's
  # gateway library uses this for the per-Gateway marker Service that
  # carries `spec.infrastructure.{labels,annotations}` (the
  # SupportGatewayInfrastructurePropagation conformance feature) — that
  # Service must land in the Gateway's namespace where the upstream test
  # discovers it via the `gateway.networking.k8s.io/gateway-name` label.
  #
  # The narrower namespace-scoped grant in templates/role.yaml stays in
  # place for same-namespace emission (e.g. per-Gateway LoadBalancer
  # Services for SupportGatewayStaticAddresses, which land in the
  # controller's namespace alongside MetalLB). RBAC alone is the security
  # gate — the resourceapplier accepts cross-namespace SSA, and the API
  # server returns Forbidden when this rule isn't granted.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The GatewayClass is created and maintained at RUNTIME by the resource
  # applier (SSA from the gateway library's k8sResources), not by Helm —
  # so it exists exactly when the gatewayclasses CRD is served and
  # survives install-order races. SSA needs patch (with create for the
  # first apply); delete covers orphan cleanup when the emission is
  # disabled. Read verbs come from the watched-resources rules above.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["create", "update", "patch", "delete"]
  {{- end }}
{{- end }}
