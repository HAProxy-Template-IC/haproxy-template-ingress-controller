{{- $cm := .Values.webhook.certManager }}
{{- /* Guard a silent foot-gun: webhook enabled + cert-manager path selected,
       but the cert-manager CRDs are absent on a LIVE cluster. The
       `lookup ... kube-system` is a liveness probe — it returns empty during
       `helm template`/CI (no API server), so this never trips offline. Without
       this guard no Certificate (and thus no webhook-cert Secret) is created,
       yet the controller Deployment mounts that Secret as required, leaving the
       pod stuck in ContainerCreating with no clear signal. Fail fast instead. */ -}}
{{- if and .Values.webhook.enabled $cm.enabled (not (.Capabilities.APIVersions.Has "cert-manager.io/v1")) (lookup "v1" "Namespace" "" "kube-system") }}
{{- fail (printf "webhook.certManager.enabled=true but cert-manager CRDs (cert-manager.io/v1) are not installed on this cluster. The webhook TLS Secret %q cannot be created and the controller would hang in ContainerCreating. Resolve by ONE of: (1) install cert-manager (https://cert-manager.io/docs/installation/); (2) set webhook.certManager.enabled=false to use the chart's built-in self-signed certificate (the default); (3) set webhook.enabled=false." (include "haptic.webhook.secretName" .)) }}
{{- end }}
{{- if and .Values.webhook.enabled $cm.enabled (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- $fullname := include "haptic.fullname" . }}
{{- $svcName := include "haptic.webhook.serviceName" . }}
{{- $secretName := include "haptic.webhook.secretName" . }}
{{- $ns := .Release.Namespace }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
spec:
  secretName: {{ $secretName }}
  duration: {{ $cm.duration | default "8760h" }}
  renewBefore: {{ $cm.renewBefore | default "720h" }}
  dnsNames:
    - {{ $svcName }}
    - {{ $svcName }}.{{ $ns }}
    - {{ $svcName }}.{{ $ns }}.svc
    - {{ $svcName }}.{{ $ns }}.svc.cluster.local
  issuerRef:
    {{- if $cm.createIssuer }}
    name: {{ $fullname }}-webhook-selfsigned
    kind: Issuer
    {{- else }}
    {{- $_ := required "webhook.certManager.issuerRef.name is required when createIssuer is false" $cm.issuerRef.name }}
    {{- toYaml $cm.issuerRef | nindent 4 }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}
