{{- $webhook := .Values.controller.webhook }}
{{- $cm := $webhook.certManager }}
{{- if $webhook.enabled }}
{{- /*
  The validating webhook fronts the same render pipeline the controller runs
  for an active reconcile, so its scope must match the resources the
  controller actually watches. We therefore source `watchedResources` from
  the same `haptic.watchedResourcesUnion` helper that `clusterrole.yaml`
  uses to compose the CRD spec. Library files (libraries/ingress.yaml etc.)
  declare `enableValidationWebhook: true` on each resource that should be
  validated; this template emits one webhook rule per such resource.
  Users wanting to override should add to `controller.config.watchedResources`
  using the same camelCase shape as the library files (the merge helper
  uses camelCase throughout).
*/ -}}
{{- $watched := include "haptic.watchedResourcesUnion" . | fromYaml }}
{{- $webhookRules := list }}
{{- range $name, $resource := $watched }}
  {{- if $resource.enableValidationWebhook }}
    {{- $webhookRules = append $webhookRules (dict "name" $name "resource" $resource) }}
  {{- end }}
{{- end }}
{{- $htcCfg := default (dict "enabled" true) $webhook.haproxyTemplateConfig }}
{{- $resourceTimeoutSeconds := include "haptic.webhook.resourceTimeoutSeconds" . | int }}
{{- $configTimeoutSeconds := include "haptic.webhook.configTimeoutSeconds" . | int }}
{{- $webhookSvcName := include "haptic.webhook.serviceName" . }}
{{- /* The config is cluster-scoped, so its name is namespace-qualified to avoid
       collisions across same-release-name multi-namespace installs. The webhook
       Service ($webhookSvcName) and per-rule webhook names stay as-is — the
       Service is namespaced, and the rule names only need in-config uniqueness. */ -}}
{{- $webhookConfigName := printf "%s-webhook" (include "haptic.clusterScopedFullname" .) | trunc 63 | trimSuffix "-" }}
{{- $ns := .Release.Namespace }}
{{- if or $webhookRules $htcCfg.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $webhookConfigName }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
  {{- if $cm.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ include "haptic.webhook.secretName" . }}
  {{- end }}
webhooks:
{{- range $rule := $webhookRules }}
  - name: {{ $rule.name }}.validation.{{ $webhookSvcName }}
    clientConfig:
      {{- if not $cm.enabled }}
      caBundle: {{ include "haptic.webhook.caBundle" $ }}
      {{- end }}
      service:
        namespace: {{ $ns }}
        name: {{ $webhookSvcName }}
        path: /validate
    rules:
      {{- $groups := list }}{{- $versions := list }}
      {{- range $v := include "haptic.candidateVersionsOf" $rule.resource | fromJsonArray }}
      {{- $groups = append $groups (include "haptic.apiGroupOf" $v) }}
      {{- $versions = append $versions (include "haptic.apiVersionOf" $v) }}
      {{- end }}
      - apiGroups:
          {{- range $g := $groups | uniq }}
          - {{ $g }}
          {{- end }}
        apiVersions:
          {{- range $v := $versions | uniq }}
          - {{ $v }}
          {{- end }}
        resources:
          - {{ $rule.resource.resources }}
        operations:
          - CREATE
          - UPDATE
        scope: "*"
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ $resourceTimeoutSeconds }}
{{- end }}
{{- /*
  HAProxyTemplateConfig admission webhook. Validates the controller's own
  CRD at apply time — operators see template errors with line-numbered
  haproxy -c output, AND the config's embedded validationTests are run,
  before the resource ever lands in etcd. Running validationTests here (the
  same suite the daemon's load gate runs) is what stops the "time bomb": a
  config that fails its tests is refused at apply, so it can never sit in
  etcd waiting to crash-loop the next fresh controller pod. With this
  upstream gate in place, the leader-side reconcile pipeline can safely
  skip haproxy -c (saves ~94 ms on every render).

  failurePolicy: Ignore is intentional — the worst case of webhook
  unavailability is "operator gets a delayed error from the daemon's load
  gate / dataplane API rejection" rather than "broken config silently runs".
  This avoids the chicken-and-egg of first install (controller starting
  while Helm applies the CRD) and any recovery scenario (operator must be
  able to apply CRD fixes while the controller is degraded — an unreachable
  webhook fails open).

  timeoutSeconds defaults to 30 (Kubernetes' maximum) because this privileged,
  low-volume path compiles and strictly renders the complete prospective
  template set before running a bounded validationTests gate. The controller
  self-imposes a deadline one second shorter and admits-with-warning if it
  cannot finish, so a slow suite or a degraded controller never blocks the
  apply — the load gate still enforces. Watched-resource admission remains on
  its separate, tighter timeout.
*/}}
{{- if $htcCfg.enabled }}
  - name: haproxytemplateconfig.validation.{{ $webhookSvcName }}
    clientConfig:
      {{- if not $cm.enabled }}
      caBundle: {{ include "haptic.webhook.caBundle" $ }}
      {{- end }}
      service:
        namespace: {{ $ns }}
        name: {{ $webhookSvcName }}
        path: /validate
    rules:
      - apiGroups:
          - haproxy-haptic.org
        apiVersions:
          - v1alpha1
        resources:
          - haproxytemplateconfigs
        operations:
          - CREATE
          - UPDATE
        scope: Namespaced
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ $configTimeoutSeconds }}
{{- end }}
{{- end }}
{{- end }}
