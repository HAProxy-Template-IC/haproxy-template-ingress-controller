{{- $webhook := .Values.webhook }}
{{- $cm := $webhook.certManager }}
{{- if $webhook.enabled }}
{{- /*
  The validating webhook fronts the same render pipeline the controller runs
  for an active reconcile, so its scope must match the resources the
  controller actually watches. We therefore source `watchedResources` from
  the same `haptic.mergeLibraries` helper that `haproxytemplateconfig.yaml`
  uses to compose the CRD spec. Library files (libraries/ingress.yaml etc.)
  declare `enableValidationWebhook: true` on each resource that should be
  validated; this template emits one webhook rule per such resource.
  Users wanting to override should add to `controller.config.watchedResources`
  using the same camelCase shape as the library files (the merge helper
  uses camelCase throughout).
*/ -}}
{{- $mergedLibraries := include "haptic.mergeLibraries" . | fromYaml }}
{{- $watched := merge ($mergedLibraries.watchedResources | default dict) (.Values.controller.config.watchedResources | default dict) }}
{{- $webhookRules := list }}
{{- range $name, $resource := $watched }}
  {{- if $resource.enableValidationWebhook }}
    {{- $webhookRules = append $webhookRules (dict "name" $name "resource" $resource) }}
  {{- end }}
{{- end }}
{{- $htcCfg := default (dict "enabled" true) $webhook.haproxyTemplateConfig }}
{{- $webhookSvcName := include "haptic.webhook.serviceName" . }}
{{- $ns := .Release.Namespace }}
{{- if or $webhookRules $htcCfg.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $webhookSvcName }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
  {{- if $cm.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ include "haptic.webhook.secretName" . }}
  {{- end }}
webhooks:
{{- range $rule := $webhookRules }}
  - name: {{ $rule.name }}.validation.{{ $webhookSvcName }}
    clientConfig:
      {{- if not $cm.enabled }}
      caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled is false" $webhook.caBundle }}
      {{- end }}
      service:
        namespace: {{ $ns }}
        name: {{ $webhookSvcName }}
        path: /validate
    rules:
      - apiGroups:
          - {{ include "haptic.apiGroupOf" $rule.resource.apiVersion }}
        apiVersions:
          - {{ include "haptic.apiVersionOf" $rule.resource.apiVersion }}
        resources:
          - {{ $rule.resource.resources }}
        operations:
          - CREATE
          - UPDATE
        scope: "*"
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions:
      - v1
    timeoutSeconds: 10
{{- end }}
{{- /*
  HAProxyTemplateConfig admission webhook. Validates the controller's own
  CRD at apply time — operators see template errors with line-numbered
  haproxy -c output before the resource ever lands in etcd. With this
  upstream gate in place, the leader-side reconcile pipeline can safely
  skip haproxy -c (saves ~94 ms on every render — see
  project_haptic_rolling_restart_root_cause.md).

  failurePolicy: Ignore is intentional — the worst case of webhook
  unavailability is "operator gets a delayed error from the dataplane API
  rejection on the next reload" rather than "broken config silently runs".
  This avoids the chicken-and-egg of first install (controller starting
  while Helm applies the CRD) and any recovery scenario (operator must be
  able to apply CRD fixes while the controller is degraded).

  timeoutSeconds: 5 is shorter than the watched-resource webhook's 10 s —
  CRD updates are infrequent (operator-triggered), so a quick timeout
  failing back to Ignore is preferable to a 10 s hang during partial-
  degradation scenarios.
*/}}
{{- if $htcCfg.enabled }}
  - name: haproxytemplateconfig.validation.{{ $webhookSvcName }}
    clientConfig:
      {{- if not $cm.enabled }}
      caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled is false" $webhook.caBundle }}
      {{- end }}
      service:
        namespace: {{ $ns }}
        name: {{ $webhookSvcName }}
        path: /validate
    rules:
      - apiGroups:
          - haproxy-haptic.org
        apiVersions:
          - v1alpha1
        resources:
          - haproxytemplateconfigs
        operations:
          - CREATE
          - UPDATE
        scope: Namespaced
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions:
      - v1
    timeoutSeconds: 5
{{- end }}
{{- end }}
{{- end }}
