{{/*
Bootstrap config for the vector sidecar, copied into the shared general-storage
volume by an init container before the sidecar starts. HAPTIC overwrites
general/vector.yaml through the agent within seconds of startup and vector's
--watch-config reloads it.

Two deliberate properties:

  1. It ALREADY forwards the access log to stdout, so Vector can bind the socket
     before HAPTIC's first push. HAProxy and Vector are unordered regular
     containers; records emitted before Vector binds can still be lost.

  2. It omits the metrics exporter and request pipeline. Their endpoints become
     available after HAPTIC pushes the rendered config.
*/}}
{{- if .Values.vector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "haptic.vector.configMapName" . }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
data:
  vector.yaml: |
    # Bootstrap config — replaced by HAPTIC through the agent.
    # The rendered config adds metrics export and request processing.
    data_dir: /var/lib/vector

    sources:
      haproxy_log:
        type: socket
        mode: unix_datagram
        path: {{ .Values.vector.socketPath }}
        socket_file_mode: 0o666
        decoding:
          codec: bytes

    sinks:
      stdout:
        type: console
        inputs: [haproxy_log]
        encoding:
          codec: text
{{- end }}
