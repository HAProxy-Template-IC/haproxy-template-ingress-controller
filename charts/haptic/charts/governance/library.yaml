# Governance rule engine: declarative constraints over ANY watched resource.
# Generic via resource() / jsonpathGet / jsonpathSet — a rule names its own
# target, so it applies to ingresses, httproutes or a custom CRD alike.
# Rule shape and worked examples: docs/site/docs/operations/governance.md

_fx:
  fixturesAnyExampleCom: &fixturesAnyExampleCom
    ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: { namespace: default, name: any, annotations: {} }
        spec:
          ingressClassName: haptic
          rules:
            - host: any.example.com
              http:
                paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
  governanceEnabledRules: &governanceEnabledRules
    enabled: true
    rules: {main: {enabled: true, resource: ingresses, satisfiedBy: tls}}

_helm_load: {enable: '{{ .Values.controller.templateLibraries.governance.enabled }}'}

# Governance rule shape and worked examples:
# docs/site/docs/operations/governance.md (enforced by features-960-governance).
templatingSettings:
  extraContext:
    governance:
      enabled: false
      exemptNamespaces: []
      # Keyed by rule name so an operator's own rules merge with, rather than
      # replace, the ones the chart ships. Every entry must set `enabled`.
      rules: {}

templateSnippets:
  # Applies the admin-declared rules to every item of their target watched
  # resource. Generic over ANY watched resource via resource() / jsonpathGet /
  # jsonpathSet — it reads no Ingress-specific field and lives in this library
  # only because the governance config bag is declared here.
  features-960-governance:
    template: |-
      {%%
        var gov = extraContext | dig("governance") | fallback(map[string]any{})
        if tostring(gov | dig("enabled") | fallback("false")) == "true" {
          var exempt = map[string]bool{}
          for _, n := range toSlice(gov | dig("exemptNamespaces") | fallback([]any{})) {
            exempt[tostring(n)] = true
          }
          // Chart-wide default HTTPS terminates TLS for every route, so
          // satisfiedBy: tls passes without per-resource spec.tls.
          var defaultHTTPS = tostring(extraContext | dig("ingressDefaultHTTPS") | fallback("false")) == "true"

          // A map, not a list: Helm and mergo replace lists wholesale, so an
          // operator adding one rule would silently drop every rule the chart
          // ships. keys() is sorted, so application order stays deterministic.
          var rulesMap, rulesOk = (gov | dig("rules") | fallback(map[string]any{})).(map[string]any)
          if !rulesOk { fail("governance.rules must be a map of rule name to rule.") }

          // Rule validation is global config validation, not per-resource, so
          // fail() is right: a typo would otherwise silently drop enforcement.
          // Disabled rules are validated too — a parked rule that no longer
          // parses is a trap for whoever re-enables it.
          var isConcretePath = func(p string) bool {
            return p != "" && !regex_search(p, "[*?@]")
          }
          var byResource = map[string][]any{}
          for _, rname := range keys(rulesMap) {
            var rule, ok = rulesMap[rname].(map[string]any)
            if !ok { fail("governance.rules." + rname + " must be a map.") }
            if tostring(fallback(rule["resource"], "")) == "" {
              fail("governance.rules." + rname + ".resource is required.")
            }
            var enf = tostring(fallback(rule["enforcement"], "reject"))
            if enf != "reject" && enf != "audit" {
              fail("governance.rules." + rname + ".enforcement must be \"reject\" or \"audit\", got \"" + enf + "\".")
            }
            var onV = tostring(fallback(rule["onViolation"], "reject"))
            if onV != "reject" && onV != "clamp" {
              fail("governance.rules." + rname + ".onViolation must be \"reject\" or \"clamp\", got \"" + onV + "\".")
            }
            if rule["min"] != nil && rule["max"] != nil && toint(tostring(rule["min"])) > toint(tostring(rule["max"])) {
              fail("governance.rules." + rname + ".min must be <= max.")
            }
            if rule["default"] != nil {
              var path = tostring(fallback(rule["path"], ""))
              if !isConcretePath(path) {
                fail("governance.rules." + rname + ".default requires a concrete path (filtered/wildcard paths are validate-only).")
              }
            }
            // Required, not defaulted: the chart ships rules of its own, so an
            // entry missing the flag must fail rather than sit inert.
            var en = tostring(fallback(rule["enabled"], ""))
            if en != "true" && en != "false" {
              fail("governance.rules." + rname + ".enabled is required and must be true or false.")
            }
            if en == "true" {
              byResource[tostring(rule["resource"])] = append(byResource[tostring(rule["resource"])], rulesMap[rname])
            }
          }

          var present = func(v any) bool { return v != nil && strip(tostring(v)) != "" }

          for res, rrules := range byResource {
            for _, item := range resource(res) {
              var ns = tostring(jsonpathGet(item, "metadata.namespace"))
              var name = tostring(jsonpathGet(item, "metadata.name"))
              if exempt[ns] { continue }
              var subjStore = tostring(admissionSubject | dig("store") | fallback(""))
              var subjNs = tostring(admissionSubject | dig("namespace") | fallback(""))
              var subjName = tostring(admissionSubject | dig("name") | fallback(""))
              var underAdmission = renderMode == "admission" && subjStore == res && subjNs == ns && subjName == name
              // Scoped to the admission subject: a pre-existing violator must
              // never wedge an unrelated resource's admission.
              var violate = func(enf string, custom string, detail string) {
                var m = custom
                if m == "" { m = detail }
                m = res + " " + ns + "/" + name + " violates org policy: " + m
                if enf == "reject" && underAdmission {
                  fail(m)
                } else {
                  recordEvent(item, "GovernanceViolation", m)
                }
              }
              for _, ruleAny := range rrules {
                var rule = ruleAny.(map[string]any)
                var enf = tostring(fallback(rule["enforcement"], "reject"))
                var custom = tostring(fallback(rule["message"], ""))
                var path = tostring(fallback(rule["path"], ""))

                if tostring(fallback(rule["satisfiedBy"], "")) == "tls" {
                  var tlsv = jsonpathGet(item, "spec.tls")
                  var hasTLS = tlsv != nil && len(toSlice(tlsv)) > 0
                  if !hasTLS && !defaultHTTPS {
                    violate(enf, custom, "must terminate TLS (add spec.tls, or enable the chart-wide default HTTPS)")
                  }
                  continue
                }

                var anyOf = toSlice(rule["anyOf"])
                if len(anyOf) > 0 {
                  var anyPresent = false
                  for _, p := range anyOf {
                    if present(jsonpathGet(item, tostring(p))) { anyPresent = true; break }
                  }
                  if !anyPresent {
                    violate(enf, custom, "must set at least one of the required fields")
                  }
                  continue
                }

                if path == "" { continue }

                var v = jsonpathGet(item, path)
                // Injected in place so later snippets in this render see it.
                if !present(v) && rule["default"] != nil {
                  jsonpathSet(item, path, rule["default"])
                  v = rule["default"]
                }

                if tostring(fallback(rule["required"], "false")) == "true" && !present(v) {
                  violate(enf, custom, "must set " + path)
                  continue
                }
                if !present(v) { continue }
                var vs = strip(tostring(v))

                if rule["min"] != nil || rule["max"] != nil {
                  if !regex_search(vs, "^[0-9]+$") {
                    violate(enf, custom, path + "=" + vs + " must be a non-negative integer")
                    continue
                  }
                  var n = toint(vs)
                  var below = rule["min"] != nil && n < toint(tostring(rule["min"]))
                  var above = rule["max"] != nil && n > toint(tostring(rule["max"]))
                  if below || above {
                    if tostring(fallback(rule["onViolation"], "reject")) == "clamp" {
                      var c = n
                      if below { c = toint(tostring(rule["min"])) }
                      if above { c = toint(tostring(rule["max"])) }
                      jsonpathSet(item, path, tostring(c))
                      recordEvent(item, "GovernanceClamped", res + " " + ns + "/" + name + ": " + path + "=" + vs + " clamped to " + tostring(c))
                    } else {
                      violate(enf, custom, path + "=" + vs + " must be within the configured bounds")
                    }
                    continue
                  }
                }

                var allowed = toSlice(rule["allowed"])
                if len(allowed) > 0 {
                  var inSet = false
                  for _, a := range allowed {
                    if tostring(a) == vs { inSet = true; break }
                  }
                  if !inSet {
                    violate(enf, custom, path + "=" + vs + " is not one of the allowed values")
                    continue
                  }
                }

                var pattern = tostring(fallback(rule["pattern"], ""))
                if pattern != "" && !regex_search(vs, pattern) {
                  violate(enf, custom, path + "=" + vs + " does not match required pattern " + pattern)
                  continue
                }
              }
            }
          }
        }
      %%}

validationTests:
  # Pin governance OFF for the bundled tests: an operator's production rules
  # would otherwise emit GovernanceViolation events on unrelated tests' fixtures
  # and — because the daemon runs validationTests at the load gate — get their
  # config rejected. The governance tests below re-enable it per-test.
  _global:
    extraContext:
      governance:
        enabled: false
        # __replace__ clears the operator's rules outright. A plain {} would
        # deep-merge and leave them in place, so `enabled: false` would be the
        # only thing standing between a production rule set and these fixtures.
        rules: { __replace__: true }

  test-governance-inject-reaches-consumer:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An injected default rate-limit annotation reaches the rate-limiting consumer.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "100"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: inject-rps, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: inject-rps.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_inject-rps_svc_echo_80' }
      - { type: contains, target: haproxy.cfg, pattern: 'stick-table type ip size 100k expire 1s store http_req_rate' }
      - { type: contains, target: haproxy.cfg, pattern: 'http-request track-sc0 src' }

  test-governance-inject-then-validate-pass:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An injected default within min/max validates without a violation.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "40"
            min: 1
            max: 100
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: inject-ok, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: inject-ok.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_inject-ok_svc_echo_80' }
      - { type: contains, target: haproxy.cfg, pattern: 'stick-table type ip size 100k expire 1s store http_req_rate' }

  test-governance-clamp-rewrites:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An over-limit value is clamped and the consumer emits the cap, not the original.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            max: 50
            onViolation: clamp
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: clamp-rps
            annotations: { haproxy-haptic.org/rate-limit-rps: "8888" }
          spec:
            ingressClassName: haptic
            rules:
              - host: clamp-rps.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      # Assert the consumer's own line, not a bare "8888": the harness's random
      # temp path lands in haproxy.cfg and may contain the number.
      - { type: contains, target: haproxy.cfg, pattern: 'sc_http_req_rate\(0\) gt 50' }
      - { type: not_contains, target: haproxy.cfg, pattern: 'sc_http_req_rate\(0\) gt 8888' }

  test-governance-min-max-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A value above max is rejected at the offending resource's own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: over-limit }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['ratelimit']
            min: 1
            max: 100
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: over-limit, labels: { ratelimit: "9999" }}
          spec:
            ingressClassName: haptic
            rules:
              - host: over-limit.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'must be within the configured bounds' }

  test-governance-required-absent-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A required-but-absent value is rejected at the offending resource's own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: no-tier }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: no-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tier.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: "must set metadata.labels" }

  test-governance-audit-warns-not-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: An audit rule only warns; a violating resource is admitted under the webhook.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: audit-tier }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
            enforcement: audit
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: audit-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: audit-tier.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }

  test-governance-exempt-namespace:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A resource in an exempt namespace is never checked, even under admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: infra, name: exempt-tier }
      governance:
        enabled: true
        exemptNamespaces: [infra]
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: infra, name: exempt-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: exempt-tier.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }

  test-governance-non-subject-violator-not-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A pre-existing violator warns during another resource's admission — no wedge.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: compliant-subject }
      ingressDefaultHTTPS: false
      governance: *governanceEnabledRules
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: compliant-subject, annotations: {} }
          spec:
            ingressClassName: haptic
            tls: [{ hosts: [compliant-subject.example.com], secretName: subject-cert }]
            rules:
              - host: compliant-subject.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: other-no-tls, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: other-no-tls.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }

  test-governance-anyof-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A resource missing every anyOf path is rejected at its own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: no-auth }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            anyOf:
              - metadata.labels['team-a']
              - metadata.labels['team-b']
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: no-auth, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-auth.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'at least one of the required fields' }

  test-governance-anyof-satisfied:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A resource with one anyOf path present passes.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: has-team }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            anyOf:
              - metadata.labels['team-a']
              - metadata.labels['team-b']
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: has-team, labels: { team-a: "yes" } }
          spec:
            ingressClassName: haptic
            rules:
              - host: has-team.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }

  test-governance-satisfiedby-tls-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A no-TLS Ingress is rejected when TLS is required and no chart default terminates TLS.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: no-tls }
      ingressDefaultHTTPS: false
      governance: *governanceEnabledRules
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: no-tls, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tls.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'must terminate TLS' }

  test-governance-satisfiedby-tls-default-https:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: Chart-wide default HTTPS satisfies the TLS requirement without spec.tls.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: no-tls-but-default }
      ingressDefaultHTTPS: true
      governance: *governanceEnabledRules
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: no-tls-but-default, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tls-but-default.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }

  test-governance-allowed-enum-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A value not in the allowed enum is rejected at its own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: bad-tier }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            allowed: [gold, silver]
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: bad-tier, labels: { tier: bronze } }
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-tier.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'is not one of the allowed values' }

  test-governance-pattern-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A value that fails the required regex pattern is rejected at its own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: bad-pattern }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['code']
            pattern: '^[0-9]{3}$'
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: bad-pattern, labels: { code: "5" } }
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-pattern.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'does not match required pattern' }

  test-governance-httproutes-cross-resource:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.gateway.enabled) }}true{{ end }}'
    requires: [httproutes]
    description: A required-annotation rule on httproutes rejects a non-compliant HTTPRoute at its own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: httproutes, namespace: default, name: gov-route }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: httproutes
            path: metadata.annotations['haproxy-haptic.org/waf-policy']
            required: true
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: { namespace: default, name: gov-route, annotations: {} }
          spec:
            parentRefs: [{ name: nonexistent-gw }]
            rules:
              - backendRefs: [{ name: echo, port: 80 }]
    assertions:
      - { type: contains, target: rendering_error, pattern: "must set metadata.annotations" }

  test-governance-invalid-enforcement-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: An invalid enforcement value is a loud global config error.
    extraContext:
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
            enforcement: block
    fixtures: *fixturesAnyExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: 'governance\.rules\.main\.enforcement must be' }

  test-governance-default-on-wildcard-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A default on a filtered/wildcard path is a loud global config error (validate-only).
    extraContext:
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: spec.rules[*].host
            default: "example.com"
    fixtures: *fixturesAnyExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: 'governance\.rules\.main\.default requires a concrete path' }

  test-governance-rule-missing-enabled-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A rule without `enabled` is refused rather than sitting inert.
    extraContext:
      governance:
        enabled: true
        rules:
          no-flag:
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "100"
    fixtures: *fixturesAnyExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: 'governance\.rules\.no-flag\.enabled is required and must be true or false' }

  test-governance-rules-merge-selectively:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: >-
      Rules are keyed, so switching one off leaves its siblings applying. This is
      the property a list cannot have — an operator adding a rule to a list would
      replace every rule the chart ships.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          switched-off:
            enabled: false
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "100"
          still-on:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/load-balance']
            default: leastconn
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: two-rules, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: two-rules.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_two-rules_svc_echo_80' }
      - { type: contains, target: haproxy.cfg, pattern: 'balance leastconn' }
      # The disabled rule injected nothing, so the rate limiter never armed.
      - { type: not_contains, target: haproxy.cfg, pattern: 'stick-table type ip size 100k expire 1s store http_req_rate' }
