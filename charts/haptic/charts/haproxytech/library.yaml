              kubernetes.io/service-name: nocheck-svc
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nocheck-ingress
            annotations:
              haproxy.org/check: "false"
