  test-haproxytech-rate-limit-whitelist:
    description: >-
      haproxy.org/rate-limit-whitelist appends a trailing '!{ src <cidrs> }' guard
      to the rate-limit deny line so whitelisted sources are never denied.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-whitelist-ingress
            annotations:
              haproxy.org/rate-limit-requests: "10"
              haproxy.org/rate-limit-period: "10s"
              haproxy.org/rate-limit-whitelist: "10.0.0.0/8, 192.168.1.5"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rl.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type ip size 100k expire 10s store http_req_rate\\(10s\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 403 if \\{ sc_http_req_rate\\(0\\) gt 10 \\} !\\{ src 10\\.0\\.0\\.0/8 192\\.168\\.1\\.5 \\}"

