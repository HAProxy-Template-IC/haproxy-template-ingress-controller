  test-haproxytech-check-disable:
    description: haproxy.org/check=false disables health checks via default-server no-check
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nocheck-ingress
            annotations:
              haproxy.org/check: "false"
          spec:
            ingressClassName: haproxy
            rules:
              - host: nocheck.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "default-server no-check"}
      # Scoped to this test's own backend. A bare `default-server check` matches
      # any OTHER backend that legitimately health-checks — the Varnish cache
      # tier does — which made this assertion true only while the cache tier
      # happened to be disabled, and a load-gate crash-loop once it wasn't.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'backend default_nocheck-ingress_svc_echo_80 from haptic-be-\w+\n\s+guid [^\n]*\n\s+default-server check'

