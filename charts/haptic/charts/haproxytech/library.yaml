  test-haproxytech-scale-server-slots:
    description: haproxy.org/scale-server-slots overrides the pre-allocated slot count
    # `server SRV_6 ` cannot be anchored to one backend the way a
    # `default-server` line can, so this test pins the config surface its
    # absence assertion depends on: any other backend with more slots — the
    # Varnish cache tier has them — would otherwise falsify it, and the load
    # gate turns that into a crash-loop.
    extraContext:
      cache: { varnish: { enabled: false } }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: slots-ingress
            annotations:
              haproxy.org/scale-server-slots: "5"
          spec:
            ingressClassName: haproxy
            rules:
              - host: slots.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 "
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_6 "

# Consumed by the playground's migration report and the generated tables in
# docs/site/docs/migrating.md; scripts/check-migration-coverage.sh pins drift.
# Upstream haproxytech/kubernetes-ingress also reads many of these on Services and
# ConfigMaps — HAPTIC reads Ingress annotations only, so those don't carry over.
migrationCoverage:
  - source: haproxytech
    detect:
      ingressClasses: ["haproxy"]
      annotationPrefixes: ["haproxy.org/"]
    annotations:
      haproxy.org/timeout-server:
        status: supported
        note: Mapped to HAProxy's timeout server.
      haproxy.org/timeout-connect:
        status: supported
        note: Mapped to HAProxy's timeout connect.
      haproxy.org/timeout-queue:
        status: supported
        note: Mapped to HAProxy's timeout queue.
      haproxy.org/timeout-tunnel:
        status: supported
        note: Mapped to HAProxy's timeout tunnel.
      haproxy.org/timeout-check:
        status: supported
        note: Mapped to HAProxy's timeout check.
      haproxy.org/load-balance:
        status: supported
        note: roundrobin, static-rr, leastconn, first, source and random, plus parameterized uri/url_param/hdr/rdp-cookie, are accepted; other values fail the render.
      haproxy.org/pod-maxconn:
        status: different
        note: Divided across the number of ready HAProxy pods (quantized to a power of two) rather than applied per-server verbatim; must be a positive integer.
        doc: annotation-support
      haproxy.org/check:
        status: supported
        note: '"true"/"false" toggle health checks; other values fail the render.'
      haproxy.org/check-http:
        status: supported
        note: Emits option httpchk (a bare path becomes GET <path>).
      haproxy.org/check-interval:
        status: supported
        note: Sets the check interval (inter); ignored when check is "false".
      haproxy.org/rate-limit-requests:
        status: supported
        note: Deny threshold that enables rate limiting; exceeding it returns the rate-limit-status-code.
      haproxy.org/rate-limit-period:
        status: supported
        note: Stick-table window (default 1s).
      haproxy.org/rate-limit-size:
        status: supported
        note: Stick-table size (default 100k).
      haproxy.org/rate-limit-status-code:
        status: supported
        note: Deny status (default 403).
      haproxy.org/rate-limit-whitelist:
        status: supported
        note: Comma-separated CIDRs never rate-limited; invalid CIDRs fail the render.
      haproxy.org/ssl-redirect:
        status: supported
        note: '"true" redirects HTTP to HTTPS; the default can be flipped via extraContext.ssl_redirect_default.'
      haproxy.org/ssl-redirect-code:
        status: supported
        note: Redirect status code (default 302).
      haproxy.org/ssl-redirect-port:
        status: supported
        note: Redirects to HTTPS on an explicit port, preserving the request URI, via a reload-free map.
      haproxy.org/request-redirect:
        status: supported
        note: Host-scoped redirect to a URL via a reload-free map.
      haproxy.org/request-redirect-code:
        status: different
        note: Default 302; an invalid code fails the render.
        doc: annotation-support
      haproxy.org/set-host:
        status: supported
        note: Overrides the upstream Host header via a reload-free map.
      haproxy.org/request-set-header:
        status: supported
        note: Newline-separated "name value" pairs set on requests.
      haproxy.org/response-set-header:
        status: supported
        note: Newline-separated "name value" pairs set on responses.
      haproxy.org/path-rewrite:
        status: supported
        note: A single "<from> <to>" pair maps to replace-path; a bare value rewrites the whole path.
      haproxy.org/src-ip-header:
        status: different
        note: Rewrites the source IP from the named header (set-src), but only for rules with an explicit host.
        doc: annotation-support
      haproxy.org/request-capture:
        status: supported
        note: Newline-separated fetch expressions captured into the log.
      haproxy.org/request-capture-len:
        status: supported
        note: Capture length for request-capture (default 128).
      haproxy.org/cookie-persistence:
        status: supported
        note: Dynamic cookie-based stickiness.
      haproxy.org/cookie-persistence-no-dynamic:
        status: different
        note: Static (non-dynamic) cookie stickiness; setting it together with cookie-persistence fails the render.
        doc: annotation-support
      haproxy.org/auth-type:
        status: different
        note: Only "basic-auth" is supported; other values fail the render (note the value differs from ingress-nginx's "basic").
        doc: annotation-support
      haproxy.org/auth-secret:
        status: different
        note: Secret format is one key per username with a base64(hash) value — different from ingress-nginx's htpasswd. A missing Secret makes the route serve 503 until it appears, and writing such an Ingress is rejected by the admission webhook.
        doc: annotation-support
      haproxy.org/auth-realm:
        status: different
        note: Default "Protected-Content" (matching the upstream controller); spaces in the realm are replaced with dashes, as upstream does, since the DataPlane API forbids spaces.
        doc: annotation-support
      haproxy.org/send-proxy-protocol:
        status: different
        note: proxy, proxy-v1, proxy-v2, proxy-v2-ssl and proxy-v2-ssl-cn map to the matching send-proxy flags; any other value is silently ignored.
        doc: annotation-support
      haproxy.org/server-ssl:
        status: supported
        note: '"true" enables TLS to the upstream (ssl alpn h2,http/1.1 verify none).'
      haproxy.org/server-proto:
        status: supported
        note: Sets the upstream ALPN/proto (e.g. h2).
      haproxy.org/server-ca:
        status: different
        note: Verifies the upstream certificate against the Secret's ca.crt; a missing Secret or missing ca.crt renders a warning comment and silently skips verification instead of failing.
        doc: annotation-support
      haproxy.org/server-crt:
        status: different
        note: Presents a client certificate to the upstream from the Secret; a missing Secret or missing tls.crt/tls.key renders a warning comment and skips the client cert instead of failing.
        doc: annotation-support
      haproxy.org/scale-server-slots:
        status: supported
        note: Overrides the pre-allocated server-slot count (positive integer; other values fail the render).
      haproxy.org/backend-config-snippet:
        status: supported
        note: Raw HAProxy directives injected into the backend section.
      haproxy.org/ssl-passthrough:
        status: supported
        note: SNI-based TCP passthrough; HTTP-level annotations don't apply to passthrough hosts.
      haproxy.org/forwarded-for:
        status: supported
        note: '"true" enables option forwardfor; "false" disables it; other values fail the render.'
      haproxy.org/allow-list:
        status: different
        note: Host-scoped source-IP allowlist — only gates rules with an explicit host; invalid CIDRs fail the render.
        doc: annotation-support
      haproxy.org/deny-list:
        status: different
        note: Host-scoped source-IP denylist — only gates rules with an explicit host; invalid CIDRs fail the render.
        doc: annotation-support
      haproxy.org/whitelist:
        status: different
        note: Deprecated alias of allow-list, honoured only when allow-list is absent; host-scoped.
        doc: annotation-support
      haproxy.org/blacklist:
        status: different
        note: Deprecated alias of deny-list, honoured only when deny-list is absent; host-scoped.
        doc: annotation-support
      haproxy.org/cors-enable:
        status: supported
        note: Emits the Access-Control-* headers via http-after-response (matching the upstream controller). By default OPTIONS preflights flow to the backend; set cors-respond-to-options "true" to have HAProxy answer them with a 204.
        doc: annotation-support
      haproxy.org/cors-allow-origin:
        status: supported
        note: The value is a regex matched against the request Origin; the Allow-Origin header echoes the matched origin (default "*" allows any). Combining "*" with cors-allow-credentials "true" fails the render.
        doc: annotation-support
      haproxy.org/cors-allow-methods:
        status: supported
        note: Default "*", matching the upstream controller.
        doc: annotation-support
      haproxy.org/cors-allow-headers:
        status: supported
        note: Allowed request headers for preflight responses (default "*").
      haproxy.org/cors-allow-credentials:
        status: supported
        note: Only emitted when "true"; combining it with cors-allow-origin "*" fails the render.
        doc: annotation-support
      haproxy.org/cors-max-age:
        status: supported
        note: Preflight cache duration in seconds; default 5. Unlike the upstream controller, HAPTIC takes a plain integer (seconds), not an HAProxy duration string.
      haproxy.org/cors-respond-to-options:
        status: supported
        note: When "true", HAProxy answers the CORS preflight (OPTIONS) with a 204 instead of forwarding it to the backend, matching the upstream controller.
      haproxy.org/timeout-client:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/timeout-http-request:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/timeout-http-keep-alive:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/standalone-backend:
        status: dropped
        note: Not implemented; HAPTIC always shares the backend model.
        doc: annotation-support
