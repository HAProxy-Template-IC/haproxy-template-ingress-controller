# Chart-time loading rules (consumed by haptic.prepareLibraries; stripped from output).
_fx:
  specTestExampleComRoot: &specTestExampleComRoot
    rules:
      - host: test.example.com
        http:
          paths:
            - path: /
              pathType: Prefix
              backend: {service: {name: echo, port: {number: 80}}}
  statusReady: &statusReady
    phase: Running
    conditions:
      - {type: Ready, status: "True"}

_helm_load: {enable: '{{ .Values.controller.templateLibraries.haproxytech.enabled }}'}

watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]

templateSnippets:
  features-099-haproxytech-publications:
    template: |-
      {{- render "haproxytech-forwarded-for-publications" -}}
      {{- render "haproxytech-access-control-publications" -}}
      {{- render "haproxytech-cors-publications" -}}
      {{- render "haproxytech-logging-publications" -}}
      {{- render "haproxytech-ssl-redirect-port-publications" -}}
      {{- render "haproxytech-captured-headers-publications" -}}

  frontend-filters-100-haproxytech-basic-headers:
    template: |
      {%- if incremental_value_count("haproxytech-forwarded-for", "enabled") > 0 %}
      # haproxytech/frontend-filters-haproxytech-basic-headers (forwarded-for)
      option forwardfor
      {%- end -%}

  haproxytech-forwarded-for-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/forwarded-for']"]
      group: haproxytech-forwarded-for
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var value = ingress.Metadata.Annotations["haproxy.org/forwarded-for"] -%}
        {%- if value != "" && value != "true" && value != "false" -%}
          {{- fail("Invalid value '" + value + "' for annotation 'haproxy.org/forwarded-for' on Ingress '" + key + "'. Valid values: 'true', 'false'") -}}
        {%- end -%}
        {%- if value == "true" -%}{{- shared.Publish("enabled", "global", true) -}}{%- end -%}
      {%- end -%}

  frontend-filters-200-haproxytech-access-control:
    template: |-
      {%- for _, fragment := range incremental_values("haproxytech-access-control", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}

  haproxytech-access-control-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy.org/allow-list']"
        - "metadata.annotations['haproxy.org/whitelist']"
        - "metadata.annotations['haproxy.org/deny-list']"
        - "metadata.annotations['haproxy.org/blacklist']"
      group: haproxytech-access-control
      effects: [publishValue]
    template: |-
      {%- var fragment = render "util-haproxytech-access-control-fragment" -%}
      {%- if fragment != "" -%}
        {{- shared.Publish("fragments", dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name"), fragment) -}}
      {%- end -%}

  util-haproxytech-access-control-fragment:
    template: |-
      {%- import "util-emit-annotation-access-control" for EmitAnnotationAccessControl -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {#- No participating annotation → the macro emits nothing; skip the call. -#}
        {%- var anns = ingress.Metadata.Annotations %}
        {%- if anns["haproxy.org/allow-list"] != "" || anns["haproxy.org/whitelist"] != "" || anns["haproxy.org/deny-list"] != "" || anns["haproxy.org/blacklist"] != "" -%}
          {%- var allowKey = "haproxy.org/allow-list" %}
          {%- if anns["haproxy.org/allow-list"] == "" && anns["haproxy.org/whitelist"] != "" %}
            {%- allowKey = "haproxy.org/whitelist" %}
          {%- end %}
          {%- var denyKey = "haproxy.org/deny-list" %}
          {%- if anns["haproxy.org/deny-list"] == "" && anns["haproxy.org/blacklist"] != "" %}
            {%- denyKey = "haproxy.org/blacklist" %}
          {%- end %}
          {{ EmitAnnotationAccessControl(ingress,
              allowKey, denyKey,
              "haproxytech",
              "haproxytech/frontend-filters-haproxytech-access-control (allow-list for {KEY})",
              "haproxytech/frontend-filters-haproxytech-access-control (deny-list for {KEY})") }}
        {%- end %}
      {%- end -%}

  frontend-filters-300-haproxytech-cors:
    template: |
      {# Mirrors upstream haproxytech/kubernetes-ingress pkg/annotations/ingress/resSetCORS.go.
          http-after-response, not http-response: the headers must also reach the synthetic preflight 204. #}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-escape-logformat-value" for EscapeLogFormatValue -%}
      {%- for _, entryAny := range incremental_values("haproxytech-cors", "entries") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var hosts = []string{} %}
        {%- for _, host := range toSlice(entry["hosts"]) %}{%- hosts = append(hosts, tostring(host)) %}{%- end %}
        {%- var key = tostring(entry["key"]) %}
        {%- var origin = tostring(entry["origin"]) %}
        {%- var methods = tostring(entry["methods"]) %}
        {%- var headers = tostring(entry["headers"]) %}
        {%- var credentials = tostring(entry["credentials"]) %}
        {%- var maxAge = tostring(entry["maxAge"]) %}
        {%- var respondOptions = tostring(entry["respondOptions"]) %}
        {%- var cond = HostMatchCondition(hosts) %}
        {%- var originHdr = origin %}
        {%- var originAcl = "{ var(txn.cors_origin) -m found }" %}
        {%- if origin != "*" %}
          {%- originAcl = "{ var(txn.cors_origin) -m reg '" + origin + "' }" %}
          {%- originHdr = "%[var(txn.cors_origin)]" %}
        {%- end %}
      # haproxytech/frontend-filters-haproxytech-cors (for {{ key }})
      http-request set-var(txn.cors_origin) req.hdr(origin) if {{ cond }}
      http-after-response set-header Access-Control-Allow-Origin '{{ originHdr }}' if {{ cond }} {{ originAcl }}
      http-after-response set-header Access-Control-Allow-Methods "{{ EscapeLogFormatValue(methods) }}" if {{ cond }} {{ originAcl }}
        {%- if headers != "" %}
      http-after-response set-header Access-Control-Allow-Headers "{{ EscapeLogFormatValue(headers) }}" if {{ cond }} {{ originAcl }}
        {%- end %}
        {%- if credentials == "true" %}
      http-after-response set-header Access-Control-Allow-Credentials 'true' if {{ cond }} {{ originAcl }}
        {%- end %}
        {%- if maxAge != "" %}
      http-after-response set-header Access-Control-Max-Age "{{ EscapeLogFormatValue(maxAge) }}" if {{ cond }} {{ originAcl }}
        {%- end %}
        {%- if respondOptions == "true" %}
      http-request return status 204 if {{ cond }} METH_OPTIONS
        {%- end %}
      {%- end -%}

  haproxytech-cors-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/cors-enable']"]
      group: haproxytech-cors
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy.org/cors-enable"] == "true" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var hosts = []any{} -%}
        {%- for _, rule := range ingress.Spec.Rules -%}
          {%- if rule.Host != "" -%}{%- hosts = append(hosts, rule.Host) -%}{%- end -%}
        {%- end -%}
        {%- if len(hosts) > 0 -%}
          {%- var origin = ingress.Metadata.Annotations["haproxy.org/cors-allow-origin"] -%}
          {%- if origin == "" -%}{%- origin = "*" -%}{%- end -%}
          {%- var methods = ingress.Metadata.Annotations["haproxy.org/cors-allow-methods"] -%}
          {%- if methods == "" -%}{%- methods = "*" -%}{%- end -%}
          {%- var headers = ingress.Metadata.Annotations["haproxy.org/cors-allow-headers"] -%}
          {%- if headers == "" -%}{%- headers = "*" -%}{%- end -%}
          {%- var credentials = ingress.Metadata.Annotations["haproxy.org/cors-allow-credentials"] -%}
          {%- if credentials == "" -%}{%- credentials = "false" -%}{%- end -%}
          {%- var maxAge = ingress.Metadata.Annotations["haproxy.org/cors-max-age"] -%}
          {%- if maxAge == "" -%}{%- maxAge = "5" -%}{%- end -%}
          {%- var respondOptions = ingress.Metadata.Annotations["haproxy.org/cors-respond-to-options"] -%}
          {%- var corsInj = "" -%}
          {%- if origin != "*" -%}{%- corsInj = ConfigInjectionKind(origin, "squote") -%}{%- end -%}
          {%- if corsInj == "" -%}{%- corsInj = ConfigInjectionKind(methods, "line") -%}{%- end -%}
          {%- if corsInj == "" -%}{%- corsInj = ConfigInjectionKind(headers, "line") -%}{%- end -%}
          {%- if corsInj == "" -%}{%- corsInj = ConfigInjectionKind(maxAge, "line") -%}{%- end -%}
          {%- if corsInj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "A CORS annotation on Ingress '" + key + "' contains " + corsInj + ", which would split the frontend directive; CORS is not applied. Remove control characters from the value.") -}}
          {%- else if credentials == "true" && origin == "*" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "CORS configuration error on Ingress '" + key + "': cors-allow-credentials cannot be 'true' when cors-allow-origin is '*'. Specify an explicit origin.") -}}
          {%- else -%}
            {{- shared.Publish("entries", key, map[string]any{
              "key": key, "hosts": hosts, "origin": origin, "methods": methods,
              "headers": headers, "credentials": credentials, "maxAge": maxAge,
              "respondOptions": respondOptions,
            }) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-100-haproxytech-ssl-redirect:
    template: |
      {# gf["sslRedirectHosts"] is initialised by ssl.yaml's features-050-ssl-initialization
          and consumed by features-160-ssl-redirect-map. #}

      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {{- render "haproxytech-ssl-redirect-publications" -}}
      {%- for _, entry := range incremental_values("haproxytech-ssl-redirect-hosts", "hosts") -%}
        {%- var redirectHosts []any = gf["sslRedirectHosts"] -%}
        {%- gf["sslRedirectHosts"] = append(redirectHosts, entry) -%}
      {%- end -%}

  haproxytech-ssl-redirect-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"sslRedirectDefault": extraContext | dig_string("", "ssl_redirect_default")}}) -}}'
      group: haproxytech-ssl-redirect-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var sslRedirect = ingress.Metadata.Annotations["haproxy.org/ssl-redirect"] -%}
        {%- var shouldRedirect = sslRedirect == "true" || (sslRedirect == "" && tostring(props["sslRedirectDefault"]) == "true") -%}
        {%- if shouldRedirect && ingress.Metadata.Annotations["haproxy.org/ssl-redirect-port"] == "" -%}
          {%- var code = ingress.Metadata.Annotations["haproxy.org/ssl-redirect-code"] -%}
          {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
            {%- if rule.Host != "" -%}
              {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{"host": toLower(rule.Host), "code": code}) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-055-haproxytech-ssl-redirect-port:
    template: |
      {# hdr(host),field(1,:) strips any port already in the Host header. The port comes from
          ssl-redirect-port-<code>.map, so changing it is a reload-free map update.
          features-100 keeps these hosts out of ssl.yaml's scheme-redirect map (no double redirect). #}
      {%- var portByCode = map[string]map[string]string{} -%}
      {%- var codeHosts = map[string][]any{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- for _, entryAny := range incremental_values("haproxytech-ssl-redirect-port-hosts", "codes") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var code = tostring(entry["code"]) %}
        {%- if portByCode[code] == nil %}{%- portByCode[code] = map[string]string{} %}{%- end %}
      {%- end %}
      {%- for _, entryAny := range incremental_values("haproxytech-ssl-redirect-port-hosts", "hosts") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var code = tostring(entry["code"]) %}
        {%- var host = tostring(entry["host"]) %}
        {%- if host != "" && !seen[host] %}
          {%- seen[host] = true %}
          {%- if portByCode[code] == nil %}{%- portByCode[code] = map[string]string{} %}{%- end %}
          {%- portByCode[code][host] = tostring(entry["port"]) %}
          {%- codeHosts[code] = append(coalesce(codeHosts[code], []any{}).([]any), host) %}
        {%- end %}
      {%- end %}
      {%- for code, hostPort := range portByCode %}
        {%- var sortedHosts = sort_strings(coalesce(codeHosts[code], []any{})) %}
        {%- var lines = []string{} %}
        {%- for _, h := range sortedHosts %}{%- lines = append(lines, tostring(h) + " " + hostPort[tostring(h)]) %}{%- end %}
        {%- var mapContent = join(lines, "\n") + "\n" %}
        {%- var _, mapErr = fileRegistry.Register("map", "ssl-redirect-port-" + code + ".map", mapContent) %}
        {%- if mapErr != nil %}{{ fail("failed to register ssl-redirect-port map: " + tostring(mapErr)) }}{%- end %}
        {%- var m, _ = pathResolver.GetPath("ssl-redirect-port-" + code + ".map", "map") %}
      # haproxytech/ssl-redirect-port (code {{ code }})
      http-request redirect location https://%[hdr(host),field(1,:)]:%[var(txn.host),map({{ m }})]%[capture.req.uri] code {{ code }} if !{ ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  haproxytech-ssl-redirect-port-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"sslRedirectDefault": extraContext | dig_string("", "ssl_redirect_default")}}) -}}'
      whenAnyPathExists: ["metadata.annotations['haproxy.org/ssl-redirect-port']"]
      group: haproxytech-ssl-redirect-port-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var redirectPort = ingress.Metadata.Annotations["haproxy.org/ssl-redirect-port"] -%}
        {%- if redirectPort != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if toint(redirectPort) <= 0 -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + redirectPort + "' for annotation 'haproxy.org/ssl-redirect-port' on Ingress '" + key + "'. Must be a positive integer port.") -}}
          {%- else -%}
            {%- var sslRedirect = ingress.Metadata.Annotations["haproxy.org/ssl-redirect"] -%}
            {%- var shouldRedirect = sslRedirect == "true" || (sslRedirect == "" && tostring(props["sslRedirectDefault"]) == "true") -%}
            {%- if shouldRedirect -%}
              {%- var code = ingress.Metadata.Annotations["haproxy.org/ssl-redirect-code"] -%}
              {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
              {{- shared.Publish("codes", key, map[string]any{"code": code}) -}}
              {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
                {%- if rule.Host != "" -%}
                  {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                    "host": toLower(rule.Host), "code": code, "port": redirectPort,
                  }) -}}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-130-haproxytech-request-redirect:
    template: |
      {# base.yaml's frontend-filters-060-redirect-location emits the rule from redirect-loc-<code>.map,
          so a redirect change is a reload-free map update. No first_seen gate — features-170 dedups hosts. #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {{- render "haproxytech-request-redirect-publications" -}}
      {%- for _, entry := range incremental_values("haproxytech-request-redirect-hosts", "hosts") -%}
        {%- var rh []any = coalesce(gf["redirectHosts"], []any{}) -%}
        {%- gf["redirectHosts"] = append(rh, entry) -%}
      {%- end -%}

  haproxytech-request-redirect-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/request-redirect']"]
      group: haproxytech-request-redirect-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var target = ingress.Metadata.Annotations["haproxy.org/request-redirect"] -%}
        {%- if target != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if regex_search(target, "[[:cntrl:]]") -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/request-redirect' on Ingress '" + key + "': must not contain control characters — config-injection guard.") -}}
          {%- else -%}
            {%- var code = ingress.Metadata.Annotations["haproxy.org/request-redirect-code"] -%}
            {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
            {%- var validCodes = []string{"301", "302", "303", "307", "308"} -%}
            {%- var codeValid = false -%}
            {%- for _, validCode := range validCodes -%}{%- if code == validCode -%}{%- codeValid = true -%}{%- end -%}{%- end -%}
            {%- if !codeValid -%}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + code + "' for annotation 'haproxy.org/request-redirect-code' on Ingress '" + key + "'. Valid values: 301, 302, 303, 307, 308") -}}
            {%- else -%}
              {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
                {%- if rule.Host != "" -%}
                  {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                    "host": toLower(rule.Host), "location": target, "code": code,
                  }) -}}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-500-haproxytech-logging:
    template: |-
      {%- for _, fragment := range incremental_values("haproxytech-logging", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}

  haproxytech-logging-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy.org/src-ip-header']"
        - "metadata.annotations['haproxy.org/request-capture']"
      group: haproxytech-logging
      effects: [publishValue, recordEvent]
    template: |-
      {%- var fragment = render "util-haproxytech-logging-fragment" -%}
      {%- if fragment != "" -%}
        {{- shared.Publish("fragments", dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name"), fragment) -}}
      {%- end -%}

  util-haproxytech-logging-fragment:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- var srcIpHeader = ingress.Metadata.Annotations["haproxy.org/src-ip-header"] %}
          {%- var reqCapture = ingress.Metadata.Annotations["haproxy.org/request-capture"] %}
          {%- var captureLen = ingress.Metadata.Annotations["haproxy.org/request-capture-len"] %}
          {%- if captureLen == "" %}{%- captureLen = "128" %}{%- end %}
          {%- if srcIpHeader != "" %}
            {#- src-ip-header rewrites the trusted client address (set-src), so a bad
                value must fail closed, not skip: emitting nothing would leave downstream
                trust ACLs judging the proxy's address. The header name is a bare token. -#}
            {%- var srcInj = ConfigInjectionKind(srcIpHeader, "token") %}
            {%- if srcInj != "" %}
              {{- fail("Invalid value for annotation 'haproxy.org/src-ip-header' on Ingress '" + key + "': contains " + srcInj + ", which would break the set-src directive. Use a plain header name.") -}}
            {%- end %}
            {# Scoped by matched route. set-src rewrites the address every
                src-based ACL then evaluates, so a wildcard or host-less rule
                that skipped this left the CIDR allow/deny lists judging the
                proxy's address instead of the client's. #}
      # haproxytech/frontend-filters-haproxytech-logging (src-ip-header for {{ key }})
      http-request set-src hdr({{ srcIpHeader }}) if { var(txn.resource_id) -m str {{ key }} }
          {%- end %}
          {%- if reqCapture != "" %}
            {#- captureLen is a bare positive integer; toint() rejects any trailing
                garbage (a newline, a second word) by returning 0, so this one check
                is both the sanity gate and the injection guard for the len operand. -#}
            {%- if toint(captureLen) <= 0 %}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + captureLen + "' for annotation 'haproxy.org/request-capture-len' on Ingress '" + key + "'. Must be a positive integer; request capture is skipped.") -}}
            {%- else %}
      # haproxytech/frontend-filters-haproxytech-logging (request-capture for {{ key }})
            {%- for _, line := range split(reqCapture, "\n") %}
              {%- var t = trimSpace(line) %}
              {%- if t != "" %}
                {%- var capInj = ConfigInjectionKind(t, "token") %}
                {%- if capInj != "" %}
                  {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation 'haproxy.org/request-capture' on Ingress '" + key + "' names a header containing " + capInj + ", which would break the capture directive; that entry is skipped.") -}}
                {%- else %}
      capture request header {{ t }} len {{ captureLen }}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- end %}
          {%- end %}
      {%- end -%}

  global-top-500-haproxytech-ingress-auth:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {{- render "haproxytech-auth-userlist-publications" -}}
      {%- for _, entryAny := range incremental_values("haproxytech-auth-userlists", "userlists") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var key = tostring(entry["key"]) %}
        {%- var secretNs = tostring(entry["secretNamespace"]) %}
        {%- var secretName = tostring(entry["secretName"]) %}
        {%- var userlistName = tostring(entry["userlistName"]) %}
      # haproxytech/global-top-haproxytech-ingress-auth
      userlist {{ userlistName }}
        {%- var hashRegex = extraContext | dig_string("^.*$", "annotationCompatibility", "basicAuth", "passwordHashValidation", "regex") %}
        {%- var hashErrMsg = extraContext | dig_string("Invalid password hash", "annotationCompatibility", "basicAuth", "passwordHashValidation", "errorMessage") %}
        {%- for _, userAny := range toSlice(entry["users"]) %}
          {%- var user = userAny.(map[string]any) %}
          {%- var username = tostring(user["username"]) %}
          {%- var passwordHash = tostring(user["passwordHash"]) %}
          {%- var pwInj = ConfigInjectionKind(passwordHash, "token") %}
          {%- if !regex_search(passwordHash, hashRegex) %}
            {{- fail(hashErrMsg + " for user '" + username + "' in Secret '" + secretNs + "/" + secretName + "' (pattern \"" + hashRegex + "\")") -}}
          {%- else if pwInj != "" %}
            {{- fail("Basic-auth hash for user '" + username + "' in Secret '" + secretNs + "/" + secretName + "' referenced on Ingress '" + key + "' contains " + pwInj + ", which would break out of the userlist line. Remove whitespace, quotes and control characters from the hash.") -}}
          {%- end %}
        user {{ username }} password {{ passwordHash }}
        {% end -%}
      {%- end -%}

  haproxytech-auth-userlist-publications:
    requires: [ingresses, secrets]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/auth-type']"]
      group: haproxytech-auth-userlists
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var ns = ingress.Metadata.Namespace -%}
        {%- var key = ns + "/" + ingress.Metadata.Name -%}
        {%- var authType = ingress.Metadata.Annotations["haproxy.org/auth-type"] -%}
        {%- if authType != "" && authType != "basic-auth" -%}
          {{- fail("Invalid value '" + authType + "' for annotation 'haproxy.org/auth-type' on Ingress '" + key + "'. Valid values: 'basic-auth'") -}}
        {%- end -%}
        {%- if authType == "basic-auth" -%}
          {%- var authSecret = ingress.Metadata.Annotations["haproxy.org/auth-secret"] -%}
          {%- if authSecret != "" -%}
            {%- var secretNs = ns -%}
            {%- var secretName = authSecret -%}
            {%- if strings_contains(authSecret, "/") -%}
              {%- var parts = split(authSecret, "/") -%}
              {%- secretNs = parts[0] -%}
              {%- secretName = parts[1] -%}
            {%- end -%}
            {%- var secret = resources.secrets.GetSingle(secretNs, secretName) -%}
            {%- if secret != nil -%}
              {%- var users = []any{} -%}
              {%- for _, username := range keys(secret.Data) -%}
                {%- users = append(users, map[string]any{
                  "username": username,
                  "passwordHash": secret.Data[username] | b64decode() | tostring(),
                }) -%}
              {%- end -%}
              {%- var userlistName = "auth_" + secretNs + "_" + secretName -%}
              {{- shared.PublishRanked("userlists", userlistName, key, map[string]any{
                "key": key,
                "secretNamespace": secretNs,
                "secretName": secretName,
                "userlistName": userlistName,
                "users": users,
              }) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-100-haproxytech-pod-maxconn:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var podMaxconn = ingress.Metadata.Annotations["haproxy.org/pod-maxconn"] %}
        {%- if podMaxconn != "" %}
          {%- var val = toint(podMaxconn) %}
          {%- if val <= 0 %}
            {{- fail("Invalid value '" + podMaxconn + "' for annotation 'haproxy.org/pod-maxconn' on Ingress '" + key + "'. Must be a positive integer.") -}}
          {%- end %}
          {%- var haproxyPodCount = 0 %}
          {%- if controller != nil %}
            {%- var pods = controller.haproxy_pods %}
            {%- if pods != nil %}
              {%- for _, pod := range pods.List() %}
                {%- if (pod | dig("status", "phase") | fallback("")) == "Running" %}
                  {%- for _, cond := range (pod | dig("status", "conditions") | fallback([]any{}) | toSlice()) %}
                    {%- if (cond | dig("type") | fallback("")) == "Ready" && (cond | dig("status") | fallback("")) == "True" %}
                      {%- haproxyPodCount = haproxyPodCount + 1 %}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- if haproxyPodCount > 0 %}
            {#- Power of 2, not the raw pod count: otherwise every scale event rewrites maxconn and reloads. -#}
            {%- var effectiveCount = 1 %}
            {%- for effectiveCount < haproxyPodCount %}
              {%- effectiveCount = effectiveCount * 2 %}
            {%- end %}
            {%- var perPod = ((val | float64()) / (effectiveCount | float64())) | ceil() %}
      # haproxytech/backend-directives-haproxytech-pod-maxconn
      # pod-maxconn: {{ podMaxconn }} total / {{ haproxyPodCount }} ready pods (effective: {{ effectiveCount }}) = {{ perPod }} per pod
            {% serverOpts["podMaxconnValue"] = perPod -%}
          {%- else %}
      # haproxytech/backend-directives-haproxytech-pod-maxconn
      # pod-maxconn: {{ podMaxconn }} (no ready HAProxy pods discovered yet, using full value)
            {% serverOpts["podMaxconnValue"] = val -%}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-100-haproxytech-timeouts:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var emitted = false %}
        {#- timeout-server and timeout-tunnel are the settable timeouts: they move to
            backend-timeouts.map via map-backend-timeout-100-haproxytech-timeouts
            (reload-free). connect/queue/check stay per-value here. -#}
        {%- for _, t := range [][]string{ {"haproxy.org/timeout-connect", "connect"}, {"haproxy.org/timeout-queue", "queue"}, {"haproxy.org/timeout-check", "check"} } %}
          {%- var ann = t[0] %}
          {%- var n = t[1] %}
          {%- var v = ingress.Metadata.Annotations[ann] %}
          {%- if v != "" %}
            {%- var inj = ConfigInjectionKind(v, "token") %}
            {%- if inj != "" %}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value for annotation '" + ann + "' on Ingress '" + key + "': contains " + inj + ", which would split the backend directive; the timeout is skipped.") -}}
            {%- else %}
              {%- if !emitted %}
      # haproxytech/backend-directives-haproxytech-timeouts
                {%- emitted = true %}
              {%- end %}
      timeout {{ n }} {{ v }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # Reload-free settable timeouts: timeout-server / timeout-tunnel become
  # `<backend>|server` / `<backend>|tunnel` entries in backend-timeouts.map.
  map-backend-timeout-100-haproxytech-timeouts:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy.org/timeout-server']"
        - "metadata.annotations['haproxy.org/timeout-tunnel']"
      group: map-backend-timeout-ingress
      effects: [recordEvent]
    template: |
      {%- import "util-ingress-backend-timeout" for IngressBackendTimeoutMapEntries -%}
      {{- IngressBackendTimeoutMapEntries(item, "haproxy.org/timeout-server", "haproxy.org/timeout-tunnel") -}}

  backend-directives-150-haproxytech-load-balance:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var lb = ingress.Metadata.Annotations["haproxy.org/load-balance"] %}
        {%- if lb != "" %}
          {%- var exactValid = []string{"roundrobin", "static-rr", "leastconn", "first", "source", "random"} %}
          {%- var prefixValid = []string{"uri", "url_param", "hdr", "rdp-cookie"} %}
          {%- var isValid = false %}
          {%- for _, v := range exactValid %}{%- if lb == v %}{%- isValid = true %}{%- end %}{%- end %}
          {%- if !isValid %}
            {%- for _, v := range prefixValid %}
              {%- if lb | hasPrefix(v) %}{%- isValid = true %}{%- end %}
            {%- end %}
          {%- end %}
          {%- if !isValid %}
            {{- fail("Invalid value '" + lb + "' for annotation 'haproxy.org/load-balance' on Ingress '" + key + "'. Valid algorithms: " + (exactValid | join(", ")) + ", or parameterized: " + (prefixValid | join("(...), ")) + "(...)") -}}
          {%- end %}
          {#- The parameterized forms accept an unbounded suffix (hdr(<v>), url_param(<v>)),
              so a control char or space there would split the backend directive; the
              exact algorithms can't carry one. -#}
          {%- var lbInj = ConfigInjectionKind(lb, "token") %}
          {%- if lbInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value for annotation 'haproxy.org/load-balance' on Ingress '" + key + "': contains " + lbInj + ", which would split the backend directive; load-balancing is left at the default.") -}}
          {%- else %}
          {#- Structured Backend() arg (profile), not a body line, so the macro
              adds `hash-type consistent` for a hash-family algorithm. -#}
          {%- serverOpts["balance"] = lb %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-200-haproxytech-health-checks:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var check = ingress.Metadata.Annotations["haproxy.org/check"] %}
        {%- if check != "" %}
          {%- if check != "true" && check != "false" %}
            {{- fail("Invalid value '" + check + "' for annotation 'haproxy.org/check' on Ingress '" + key + "'. Valid values: 'true', 'false'") -}}
          {%- end %}
          {#- ingress.yaml emits `default-server <checkDirective>`, defaulting to "check". -#}
          {%- if check == "false" %}
            {%- serverOpts["checkDirective"] = "no-check" %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-210-haproxytech-advanced-health-checks:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var checkHttp = ingress.Metadata.Annotations["haproxy.org/check-http"] %}
        {%- var checkInterval = ingress.Metadata.Annotations["haproxy.org/check-interval"] %}
        {%- if checkHttp != "" %}
          {#- httpchk legitimately holds spaces (method + uri + version), so only
              control chars are rejected here. -#}
          {%- var httpInj = ConfigInjectionKind(checkHttp, "line") %}
          {%- if httpInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/check-http' on Ingress '" + key + "': contains " + httpInj + ", which would split the backend directive; the HTTP health check is skipped.") -}}
          {%- else %}
      # haproxytech/backend-directives-haproxytech-advanced-health-checks
            {%- if strings_contains(checkHttp, " ") %}
      option httpchk {{ checkHttp }}
            {%- else %}
      option httpchk GET {{ checkHttp }}
            {%- end %}
          {%- end %}
        {%- end %}
        {#- 200-health-checks already ran, so checkDirective is set; inter is meaningless under no-check. -#}
        {%- if checkInterval != "" && (serverOpts | dig("checkDirective") | fallback("check") | tostring()) != "no-check" %}
          {%- var intInj = ConfigInjectionKind(checkInterval, "token") %}
          {%- if intInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value for annotation 'haproxy.org/check-interval' on Ingress '" + key + "': contains " + intInj + ", which would split the server directive; the check interval is skipped.") -}}
          {%- else %}
          {%- serverOpts["flags"] = append(serverOpts | dig("flags") | toSlice(), "inter " + checkInterval) %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-250-haproxytech-rate-limiting:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- if ingress != nil %}
        {%- var rateReq = ingress.Metadata.Annotations["haproxy.org/rate-limit-requests"] %}
        {%- if rateReq != "" %}
          {%- var period = ingress.Metadata.Annotations["haproxy.org/rate-limit-period"] %}
          {%- if period == "" %}{%- period = "1s" %}{%- end %}
          {%- var size = ingress.Metadata.Annotations["haproxy.org/rate-limit-size"] %}
          {%- if size == "" %}{%- size = "100k" %}{%- end %}
          {%- var status = ingress.Metadata.Annotations["haproxy.org/rate-limit-status-code"] %}
          {%- if status == "" %}{%- status = "403" %}{%- end %}
          {#- Rate limiting is a security control: an injected value must fail closed, not
              skip (skipping would drop the limit entirely). Each field is a bare token. -#}
          {%- var rlName = "" %}{%- var rlChar = "" %}{%- var c = "" %}
          {%- c = ConfigInjectionKind(rateReq, "token") %}{%- if c != "" %}{%- rlName = "rate-limit-requests" %}{%- rlChar = c %}{%- end %}
          {%- if rlName == "" %}{%- c = ConfigInjectionKind(period, "token") %}{%- if c != "" %}{%- rlName = "rate-limit-period" %}{%- rlChar = c %}{%- end %}{%- end %}
          {%- if rlName == "" %}{%- c = ConfigInjectionKind(size, "token") %}{%- if c != "" %}{%- rlName = "rate-limit-size" %}{%- rlChar = c %}{%- end %}{%- end %}
          {%- if rlName == "" %}{%- c = ConfigInjectionKind(status, "token") %}{%- if c != "" %}{%- rlName = "rate-limit-status-code" %}{%- rlChar = c %}{%- end %}{%- end %}
          {%- if rlName != "" %}
            {{- fail("Invalid value for annotation 'haproxy.org/" + rlName + "' on Ingress '" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + "': contains " + rlChar + ", which would split the rate-limit directive. Rate limiting must stay enforceable, so the config is rejected.") -}}
          {%- end %}
          {%- var whitelist = ingress.Metadata.Annotations["haproxy.org/rate-limit-whitelist"] %}
          {%- var guard = "" %}
          {%- if whitelist != "" %}
            {%- var validated = ValidateCidrList(whitelist, "haproxy.org/rate-limit-whitelist", ingress.Metadata.Namespace + "/" + ingress.Metadata.Name) %}
            {%- if validated != "" %}
              {%- guard = " !{ src " + validated + " }" %}
            {%- end %}
          {%- end %}
      # haproxytech/backend-directives-haproxytech-rate-limiting
      {# `peers localinstance` (base.yaml global-top-050-peers) hands the per-source counter to the new worker on reload, so a reload doesn't reset every client's budget. #}
      stick-table type ip size {{ size }} expire {{ period }} store http_req_rate({{ period }}) peers localinstance
      http-request track-sc0 src
      http-request set-var(txn.denied_by) str(rate_limit_local) if { sc_http_req_rate(0) gt {{ rateReq }} }{{ guard }}
      http-request deny deny_status {{ status }} if { sc_http_req_rate(0) gt {{ rateReq }} }{{ guard }}
        {%- end %}
      {%- end -%}

  map-reqhdr-host-250-haproxytech:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/set-host']"]
      group: map-reqhdr-host
    template: |
      {# Emits `<backend> <host>` for base.yaml's frontend-filters-260-request-set-host — a reload-free
          alternative to a per-backend set-header Host. The shared group gives this 250 component precedence
          over nginx's 760 and HAPTIC's 850 emitters when annotations target the same backend. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var host = ingress.Metadata.Annotations["haproxy.org/set-host"] -%}
        {%- if host != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- var seen = map[string]bool{} -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {%- if !seen[be] -%}
                {%- seen[be] = true -%}
                {{- shared.Unique("map-reqhdr-host", be, "\n" + be + " " +
                  queryEscape(ValidateConfigValue(host, "haproxy.org/set-host", key, true))) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Reload-free header manipulation: haproxy.org/request-set-header and
  # response-set-header become entries in ing-reqhdr.map / ing-reshdr.map (built
  # by ingress.yaml frontend-filters-263-ingress-headers), keyed on the resolved
  # backend, so changing a header value is a map-only update. Contributes in the
  # features phase (before the frontend builder reads the shared list).
  features-300-haproxytech-header-mods:
    template: '{{- "" -}}'

  ingress-header-mods-0300-haproxytech:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy.org/request-set-header']"
        - "metadata.annotations['haproxy.org/response-set-header']"
      group: ingress-header-mods
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-header-publish" for PublishIngressHeaderContributions -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishIngressHeaderContributions(ingress,
          "haproxy.org/request-set-header", "haproxy.org/response-set-header", "\n", " ", "0300-haproxytech") -}}
      {%- end -%}

  backend-directives-350-haproxytech-path-rewrite:
    template: |
      {#- Both the match regex and the replacement legitimately carry backslashes —
          regex escapes and \N group backreferences — so they are emitted raw and guarded
          for control chars only (EscapeLogFormatValue would double the backslashes and
          break the backreferences). A control char is the cross-directive injection here. -#}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var rewrite = ingress.Metadata.Annotations["haproxy.org/path-rewrite"] %}
        {%- if rewrite != "" %}
          {%- var rwInj = ConfigInjectionKind(rewrite, "line") %}
          {%- if rwInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/path-rewrite' on Ingress '" + key + "': contains " + rwInj + ", which would split the backend directive; the path rewrite is skipped.") -}}
          {%- else if strings_contains(rewrite, " ") %}
            {%- var parts = split(rewrite, " ") %}
      # haproxytech/backend-directives-haproxytech-path-rewrite
      http-request replace-path {{ parts[0] }} {{ parts[1:] | join(" ") }}
          {%- else %}
      # haproxytech/backend-directives-haproxytech-path-rewrite
      http-request replace-path (.*) {{ rewrite }}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-400-haproxytech-session-persistence:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var cookie = ingress.Metadata.Annotations["haproxy.org/cookie-persistence"] %}
        {%- if cookie != "" %}
          {%- var cookieInj = ConfigInjectionKind(cookie, "token") %}
          {%- if cookieInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/cookie-persistence' on Ingress '" + key + "': contains " + cookieInj + ", which would split the backend directive; session persistence is skipped.") -}}
          {%- else %}
      # haproxytech/backend-directives-haproxytech-session-persistence
      cookie {{ cookie }} insert indirect nocache dynamic
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-401-haproxytech-session-persistence-no-dynamic:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var dynamic = ingress.Metadata.Annotations["haproxy.org/cookie-persistence"] %}
        {%- var static = ingress.Metadata.Annotations["haproxy.org/cookie-persistence-no-dynamic"] %}
        {%- if dynamic != "" && static != "" %}
          {{- fail("Cannot use both 'haproxy.org/cookie-persistence' and 'haproxy.org/cookie-persistence-no-dynamic' on Ingress '" + key + "'. Use only one cookie persistence method.") -}}
        {%- end %}
        {%- if static != "" %}
          {%- var staticInj = ConfigInjectionKind(static, "token") %}
          {%- if staticInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/cookie-persistence-no-dynamic' on Ingress '" + key + "': contains " + staticInj + ", which would split the backend directive; session persistence is skipped.") -}}
          {%- else %}
      # haproxytech/backend-directives-haproxytech-session-persistence-no-dynamic
      cookie {{ static }} insert indirect nocache
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-500-haproxytech-ingress-auth:
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var authType = ingress.Metadata.Annotations["haproxy.org/auth-type"] %}
        {%- if authType != "" && authType != "basic-auth" %}
          {{- fail("Invalid value '" + authType + "' for annotation 'haproxy.org/auth-type' on Ingress '" + key + "'. Valid values: 'basic-auth'") -}}
        {%- end %}
        {%- if authType == "basic-auth" %}
          {%- var authSecret = ingress.Metadata.Annotations["haproxy.org/auth-secret"] %}
          {%- var authRealm = ingress.Metadata.Annotations["haproxy.org/auth-realm"] %}
          {%- if authRealm == "" %}{%- authRealm = "Protected-Content" %}{%- end %}
          {#- Upstream dashes spaces in the realm; match it rather than fail. -#}
          {%- authRealm = replace(authRealm, " ", "-") %}
          {#- Auth is security-critical: fail closed on a control char (it cannot live in a
              double-quoted realm string). The " / \ / $ are escaped for the quoted emission. -#}
          {%- var realmInj = ConfigInjectionKind(authRealm, "line") %}
          {%- if realmInj != "" %}
            {{- fail("Invalid value for annotation 'haproxy.org/auth-realm' on Ingress '" + key + "': contains " + realmInj + ". The realm must not contain control characters.") -}}
          {%- end %}
          {%- if authSecret != "" %}
            {%- var secretNs = ns %}
            {%- var secretName = authSecret %}
            {%- if strings_contains(authSecret, "/") %}
              {%- var parts = split(authSecret, "/") %}
              {%- secretNs = parts[0] %}
              {%- secretName = parts[1] %}
            {%- end %}
            {%- var userlistName = "auth_" + secretNs + "_" + secretName %}
            {#- Absent Secret: skip the http_auth ref — global-top-500 skips its userlist on the same
                condition, so HAProxy never sees a dangling http_auth(). Shared via ComputeIfAbsent:
                stores are live, so two GetSingle calls can disagree. -#}
            {%- var htAuthSecret = resources.secrets.GetSingle(secretNs, secretName) %}
            {#- Assert to the typed pointer before the nil check: a boxed typed-nil passes `!= nil`, and the
                ref would then point at a userlist global-top-500 skipped ("unable to find userlist"). -#}
            {%- if htAuthSecret != nil %}
      # haproxytech/backend-directives-haproxytech-ingress-auth
      http-request set-var(txn.denied_by) str(basic_auth) unless { http_auth({{ userlistName }}) }
      http-request auth realm "{{ EscapeDquoteValue(authRealm) }}" unless { http_auth({{ userlistName }}) }
            {%- else %}
              {# Without a resolvable Secret there is no userlist, and emitting
                  nothing served every request unauthenticated. Fail closed. #}
              {{- recordEvent(ingress, "AuthSecretMissing", "Ingress " + key + " sets 'haproxy.org/auth-secret', but that Secret could not be resolved. Basic auth cannot be enforced without it, so this route fails closed with 503. Create the Secret, or remove the auth annotations.") -}}
      # WARNING haproxy.org/auth-secret: Secret not resolvable for {{ key }}; failing closed (503) until it is present.
      http-request set-var(txn.denied_by) str(basic_auth_unavailable)
      http-request deny deny_status 503
            {%- end %}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-900-haproxytech-advanced:
    template: |
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}

        {%- var sendProxy = ingress.Metadata.Annotations["haproxy.org/send-proxy-protocol"] %}
        {%- if sendProxy != "" %}
          {%- if sendProxy == "proxy" || sendProxy == "proxy-v1" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy") %}
          {%- else if sendProxy == "proxy-v2" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2") %}
          {%- else if sendProxy == "proxy-v2-ssl" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2-ssl") %}
          {%- else if sendProxy == "proxy-v2-ssl-cn" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2-ssl-cn") %}
          {%- end %}
        {%- end %}

        {%- var serverSsl = ingress.Metadata.Annotations["haproxy.org/server-ssl"] %}
        {%- if serverSsl == "true" %}
          {#- One keyword per entry so the plan record carries each structurally. -#}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl") %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "alpn h2,http/1.1") %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "verify none") %}
        {%- end %}

        {%- var serverProto = ingress.Metadata.Annotations["haproxy.org/server-proto"] %}
        {%- if serverProto != "" %}
          {%- var protoInj = ConfigInjectionKind(serverProto, "token") %}
          {%- if protoInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy.org/server-proto' on Ingress '" + key + "': contains " + protoInj + ", which would split the server directive; the upstream protocol is skipped.") -}}
          {%- else %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto " + serverProto) %}
          {%- end %}
        {%- end %}

        {%- var serverCa = ingress.Metadata.Annotations["haproxy.org/server-ca"] %}
        {%- if serverCa != "" %}
          {%- var caNs = ns %}
          {%- var caName = serverCa %}
          {%- if strings_contains(serverCa, "/") %}
            {%- var parts = split(serverCa, "/") %}
            {%- caNs = parts[0] %}
            {%- caName = parts[1] %}
          {%- end %}
          {%- var caSecret = resources.secrets.GetSingle(caNs, caName) %}
          {%- if caSecret != nil %}
            {%- var caContent = caSecret.Data["ca.crt"] | b64decode() %}
            {%- if caContent != "" %}
              {%- var caFilename = caNs + "-" + caName + "-ca.pem" %}
              {#- "ca-file": a content-only CA rotation applies at runtime, no reload on v3.2+. -#}
              {%- var caPath, caRegErr = RegisterBackendFile("ca-file", caFilename, caContent) -%}
              {%- if caRegErr != nil -%}{{ fail("failed to register CA file " + caFilename + ": " + tostring(caRegErr)) }}{%- end -%}
              {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl") %}
              {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "verify required") %}
              {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ca-file " + caPath) %}
            {%- else %}
              {#- Name-free comment: the tenant-controlled Secret name goes only into the
                  Kubernetes Event, never into the rendered config, so a newline in it can't
                  smuggle a directive past the # comment. -#}
              {{- recordEvent(ingress, "ServerCASecretMissingCACert", "Ingress " + key + " references Secret '" + serverCa + "' in 'haproxy.org/server-ca', but it has no ca.crt. Upstream certificate verification is skipped.") -}}
            # haproxy.org/server-ca: referenced Secret has no ca.crt; upstream verification skipped
            {%- end %}
          {%- else %}
            {{- recordEvent(ingress, "ServerCASecretMissing", "Ingress " + key + " references Secret '" + serverCa + "' in 'haproxy.org/server-ca', but it could not be resolved. Upstream certificate verification is skipped.") -}}
            # haproxy.org/server-ca: referenced Secret not found; upstream verification skipped
          {%- end %}
        {%- end %}

        {%- var serverCrt = ingress.Metadata.Annotations["haproxy.org/server-crt"] %}
        {%- if serverCrt != "" %}
          {%- var crtNs = ns %}
          {%- var crtName = serverCrt %}
          {%- if strings_contains(serverCrt, "/") %}
            {%- var parts = split(serverCrt, "/") %}
            {%- crtNs = parts[0] %}
            {%- crtName = parts[1] %}
          {%- end %}
          {%- var crtSecret = resources.secrets.GetSingle(crtNs, crtName) %}
          {%- if crtSecret != nil %}
            {%- var tlsCrt = crtSecret.Data["tls.crt"] | b64decode() %}
            {%- var tlsKey = crtSecret.Data["tls.key"] | b64decode() %}
            {%- if tlsCrt != "" && tlsKey != "" %}
              {%- var combinedPem = tlsCrt + "\n" + tlsKey %}
              {%- var crtFilename = crtNs + "-" + crtName + "-client.pem" %}
              {%- var _, crtRegErr = RegisterBackendFile("cert", crtFilename, combinedPem) -%}
              {%- if crtRegErr != nil -%}{{ fail("failed to register client cert " + crtFilename + ": " + tostring(crtRegErr)) }}{%- end -%}
              {#- Bare filename: `crt` resolves against crt-base, so the arg can't
                  match the runtime store ident and add server can't carry it —
                  structural. -#}
              {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "crt " + crtFilename) %}
              {%- serverOpts["shape"] = "structural-crt" %}
            {%- else %}
              {{- recordEvent(ingress, "ServerCrtSecretIncomplete", "Ingress " + key + " references Secret '" + serverCrt + "' in 'haproxy.org/server-crt', but it has no tls.crt/tls.key. No client certificate is presented upstream.") -}}
            # haproxy.org/server-crt: referenced Secret missing tls.crt/tls.key; no client certificate presented
            {%- end %}
          {%- else %}
            {{- recordEvent(ingress, "ServerCrtSecretMissing", "Ingress " + key + " references Secret '" + serverCrt + "' in 'haproxy.org/server-crt', but it could not be resolved. No client certificate is presented upstream.") -}}
            # haproxy.org/server-crt: referenced Secret not found; no client certificate presented
          {%- end %}
        {%- end %}

        {#- haproxy.org/scale-server-slots no longer has any effect: servers are
            named after their pods (no slot pool, ADR-0011), so a backend always
            holds the current pods and scaling never reserves slots or reloads. -#}
        {%- if ingress.Metadata.Annotations["haproxy.org/scale-server-slots"] != "" %}
          {%- _ = WebhookRejectOrWarn(ingress, "UnsupportedAnnotation", "Ingress " + key + " sets 'haproxy.org/scale-server-slots', which no longer has any effect: servers are named after pods and scale with no reserved slots and no reload. Remove the annotation.") %}
        {%- end %}

        {%- var snippet = ingress.Metadata.Annotations["haproxy.org/backend-config-snippet"] %}
        {%- if snippet != "" %}
      # haproxytech/backend-config-snippet
      {{ snippet }}
        {%- end %}
      {%- end -%}

  backends-501-haproxytech-ssl-passthrough:
    requires: [ingresses, services, endpoints]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/ssl-passthrough']"]
      group: ingress-ssl-passthrough
      effects: [publishValue, backendPlan]
    template: |-
      {%- import "util-annotation-ssl-passthrough-component" for RenderAnnotationSSLPassthrough -%}
      {{- RenderAnnotationSSLPassthrough(item,
        "haproxy.org/ssl-passthrough",
        "ssl-passthrough-", "haproxytech", "haproxytech") -}}

  log-fields-530-haproxytech-captured-headers:
    template: |-
      {# %hr is the positional capture list — the only consumer of haproxy.org/request-capture.
          haptic-annotations emits the identical item for the native vocabulary; base deduplicates. #}
      {%- if incremental_value_count("haproxytech-captured-headers", "enabled") > 0 %}
      %(captured_headers)hr
      {%- end %}

  haproxytech-captured-headers-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy.org/request-capture']"]
      group: haproxytech-captured-headers
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy.org/request-capture"] != "" -%}
        {{- shared.Publish("enabled", "global", true) -}}
      {%- end -%}

validationTests:
  test-haproxytech-set-host:
    description: haproxy.org/set-host relocates the upstream Host override to reqhdr-host.map (reload-free)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: sethost-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sethost-ing
            annotations:
              haproxy.org/set-host: "internal.svc.local"
          spec:
            ingressClassName: haproxy
            rules:
              - host: sethost.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: sethost-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:reqhdr-host.map
        pattern: "default_sethost-ing_svc_sethost-svc_80 internal.svc.local"
      - {type: not_contains, target: haproxy.cfg, pattern: "set-header Host 'internal.svc.local'"}

  test-auth-basic-cross-namespace:
    description: Basic authentication with secret in different namespace
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: auth-system, name: shared-auth}
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: production
            name: api-ingress
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: auth-system/shared-auth
          spec:
            rules:
              - host: api.production.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 443}}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: production, name: api-service}
          spec:
            ports:
              - {port: 443, targetPort: 8443}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist auth_auth-system_shared-auth"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password"}
      - {type: contains, target: haproxy.cfg, pattern: "http_auth\\(auth_auth-system_shared-auth\\)"}

  test-auth-custom-realm:
    description: Basic authentication with custom realm
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: api-auth}
          type: Opaque
          data: {apiuser: JDJ5JDA1JDJlV1VoQVU5Z0VlZ2FDZkY4Uk4xZHV1WUNrdlhoUGtpS1BDL3pkTFBvN2xNYlkxcWlUQXRP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: secure-api-ingress
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: api-auth
              haproxy.org/auth-realm: "API-Access"
          spec:
            rules:
              - host: secure-api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 8080}}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: api-service}
          spec:
            ports:
              - port: 8080
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "API-Access"'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'realm "Protected-Content"'}

  test-haproxytech-basic-auth-missing-secret:
    description: >-
      haproxy.org/auth-secret referencing a Secret absent from the render
      snapshot (informer lag / cascade-delete) must skip the userlist + auth ACL
      cleanly, not panic. Regression for the typed-nil gotcha (GetSingle returns a
      typed-nil *resources.secrets.T when absent; boxing it through
      shared.ComputeIfAbsent's func() any made `!= nil` pass, then `.Data`
      dereferenced nil).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: api-service}
          spec:
            ports:
              - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: secure-api-missing-secret
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: absent-secret
              haproxy.org/auth-realm: "API-Access"
          spec:
            rules:
              - host: secure-api-missing.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 8080}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "userlist auth_default_absent-secret"}
      - {type: not_contains, target: haproxy.cfg, pattern: "http_auth(auth_default_absent-secret)"}

  test-haproxytech-basic-auth-hash-injection-fails-closed:
    description: A space in a basic-auth password hash (accepted by the default hash regex) fails the render closed instead of appending extra tokens to the userlist line (#157).
    extraContext: {renderMode: admission}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: basic-auth-secret}
          data: {admin: eDJ5MDV2YWxpZGhhc2ggZ3JvdXBzIGFkbWlu}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-inj
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: basic-auth-secret
          spec:
            rules:
              - host: hash-inj.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 8080}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "would break out of the userlist line"}

  test-auth-realm-with-spaces:
    description: Auth realm with spaces is normalized to dashes (matching upstream), not a render failure
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: api-auth}
          type: Opaque
          data: {user1: JDJ5JDA1JDJlV1VoQVU5Z0VlZ2FDZkY4Uk4xZHV1WUNrdlhoUGtpS1BDL3pkTFBvN2xNYlkxcWlUQXRP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: space-realm-ingress
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: api-auth
              haproxy.org/auth-realm: "DeepL demo"
          spec:
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'realm "DeepL-demo"'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "DeepL-demo"'}

  test-auth-per-secret-userlists:
    description: Ingresses sharing the same secret share the same userlist (deduplication for performance)
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: shared-credentials}
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: app1-ingress
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: shared-credentials
          spec:
            rules:
              - host: app1.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: app1-service, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: app2-ingress
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: shared-credentials
          spec:
            rules:
              - host: app2.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: app2-service, port: {number: 80}}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: app1-service}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: app2-service}
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist auth_default_shared-credentials"}
      - {type: not_contains, target: haproxy.cfg, pattern: "userlist default-app1-ingress"}
      - {type: not_contains, target: haproxy.cfg, pattern: "userlist default-app2-ingress"}
      - {type: contains, target: haproxy.cfg, pattern: "http_auth\\(auth_default_shared-credentials\\)"}

  test-load-balance-hdr-parameter:
    description: Load balance with hdr(header-name) parameter for header-based routing
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sticky-ingress
            annotations:
              haproxy.org/load-balance: "hdr(x-session-id)"
          spec:
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "balance hdr\\(x-session-id\\)"}

  test-haproxytech-cors-regex-anchor:
    description: CORS non-wildcard origin regex-matches the request Origin and echoes it back (upstream model), and a regex $ anchor must not cause a parse error
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-regex-ingress
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "^https://(.+\\.)?(dev\\.|test\\.)?example\\.com$"
              haproxy.org/cors-allow-methods: "GET, POST, OPTIONS"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # The regex origin is single-quoted, and its backslash-escaped dots survive
      # literally inside the strong quotes (token/double-quote guarding would have
      # mangled the '\').
      - {type: contains, target: haproxy.cfg, pattern: 'var\(txn\.cors_origin\) -m reg ''\^https://'}
      - {type: contains, target: haproxy.cfg, pattern: 'example\\\.com\$'' \}'}
      - type: contains
        target: haproxy.cfg
        pattern: "Access-Control-Allow-Origin '%\\[var\\(txn\\.cors_origin\\)\\]'"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Origin"

  test-haproxytech-cors-respond-to-options:
    description: cors-respond-to-options makes HAProxy answer the OPTIONS preflight with a 204
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-preflight-ingress
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "https://app.example.com"
              haproxy.org/cors-allow-credentials: "true"
              haproxy.org/cors-respond-to-options: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 204 if .* METH_OPTIONS"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Credentials 'true'"

  test-haproxytech-auth-password-hash-validation-reject:
    description: Password hash validation rejects non-matching hashes
    extraContext:
      annotationCompatibility:
        basicAuth: {passwordHashValidation: {regex: "^\\$apr1\\$", errorMessage: "Bcrypt hashes not allowed"}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: auth-secret}
          type: Opaque
          data: {admin: JDJ5JDEwJGJjcnlwdGhhc2g=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
