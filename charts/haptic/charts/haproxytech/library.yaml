  test-haproxytech-ssl-passthrough-named-port:
    description: haproxy.org/ssl-passthrough annotation must resolve a backend referenced by port.name to the correct numeric pod port (mirrors the original unifi-controller bug scenario)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: unifi
            namespace: default
          spec:
            ports:
              - name: https-gui
                port: 8443
                targetPort: https-gui
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: unifi-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: unifi
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.42"]
              targetRef:
                kind: Pod
                name: unifi-0
          ports:
            - name: https-gui
              port: 8443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: unifi
            namespace: default
            annotations:
              haproxy.org/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: unifi.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: unifi
                          port:
                            name: https-gui
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.42:8443 "
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.42:80 "

