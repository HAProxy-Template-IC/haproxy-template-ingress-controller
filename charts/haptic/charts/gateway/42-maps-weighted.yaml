templateSnippets:
  util-generate-httproute-weighted-backend-map-gateway:
    requires: [httproutes, referencegrants]
    template: |
      {# Generate weighted backend map entries for HTTPRoute. #}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- macro GenerateHTTPRouteWeightedBackendMap(routes any) -%}
      {%- for _, route := range toSlice(routes) %}
      {%- var routeNs = dig_string(route, "", "metadata", "namespace") %}
      {%- var routeName = dig_string(route, "", "metadata", "name") %}
      {%- var weightedEntries = []any{} %}
      {%- var ruleIdx = 0 %}
      {%- for _, rule := range toSlice(dig(route, "spec", "rules")) %}
        {%- var backendRefs = toSlice(dig(rule, "backendRefs")) %}
        {%- if len(backendRefs) > 1 %}
          {%- var routeKey = routeNs + "_" + routeName + "_" + ruleIdx %}
          {%- var cumulative = 0 %}
          {%- for _, backendRef := range backendRefs %}
            {%- var backendPort = toint(dig(backendRef, "port") | fallback(0)) %}
            {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end %}
            {%- var backend = map[string]any{"name": dig_string(backendRef, "", "name"), "port": backendPort} %}
            {%- var weight = toint(dig(backendRef, "weight") | fallback(0)) %}
            {%- if weight == 0 && dig(backendRef, "weight") == nil %}{%- weight = 1 %}{%- end %}
            {%- var refValid = BackendRefValid("HTTPRoute", routeNs, backendRef) == "true" %}
            {%- for i := cumulative; i < cumulative + weight; i++ %}
              {%- weightedEntries = append(weightedEntries, map[string]any{
                "index": i,
                "routeKey": routeKey,
                "backend": backend,
                "valid": refValid,
              }) %}
            {%- end %}
            {%- cumulative = cumulative + weight %}
          {%- end %}
        {%- end %}
        {%- ruleIdx = ruleIdx + 1 %}
      {%- end %}
      {%- if len(weightedEntries) > 0 %}
      # HTTPRoute: {{ routeNs }}/{{ routeName }} (weighted rules)
      {% for _, entry := range weightedEntries -%}
      {{ entry["index"] }}:{{ entry["routeKey"] }} {% if entry["valid"] == true %}{{ BackendNameGateway(route, entry["backend"]) }}{% else %}gw-invalid-backend{% end %}
      {% end -%}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-generate-grpcroute-weighted-backend-map-gateway:
    requires: [grpcroutes, referencegrants]
    template: |
      {# Generate weighted backend map entries for GRPCRoute.
          Typed sibling of GenerateHTTPRouteWeightedBackendMap; body
          differs only in the `route` slice type. #}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- macro GenerateGRPCRouteWeightedBackendMap(routes []*resources.grpcroutes.T) -%}
      {%- for _, route := range routes %}
      {%- var routeNs = route.Metadata.Namespace %}
      {%- var routeName = route.Metadata.Name %}
      {%- var weightedEntries = []any{} %}
      {%- var ruleIdx = 0 %}
      {%- for _, rule := range route.Spec.Rules %}
        {%- if len(rule.BackendRefs) > 1 %}
          {%- var routeKey = routeNs + "_" + routeName + "_" + ruleIdx %}
          {%- var cumulative = 0 %}
          {%- for _, backendRef := range rule.BackendRefs %}
            {%- var backendPort = toint(backendRef.Port) %}
            {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end %}
            {%- var backend = map[string]any{"name": backendRef.Name, "port": backendPort} %}
            {%- var weight = toint(backendRef.Weight) %}
            {%- if weight == 0 && dig(backendRef, "weight") == nil %}{%- weight = 1 %}{%- end %}
            {%- var refValid = BackendRefValid("GRPCRoute", routeNs, backendRef) == "true" %}
            {%- for i := cumulative; i < cumulative + weight; i++ %}
              {%- weightedEntries = append(weightedEntries, map[string]any{
                "index": i,
                "routeKey": routeKey,
                "backend": backend,
                "valid": refValid,
              }) %}
            {%- end %}
            {%- cumulative = cumulative + weight %}
          {%- end %}
        {%- end %}
        {%- ruleIdx = ruleIdx + 1 %}
      {%- end %}
      {%- if len(weightedEntries) > 0 %}
      # GRPCRoute: {{ routeNs }}/{{ routeName }} (weighted rules)
      {% for _, entry := range weightedEntries -%}
      {{ entry["index"] }}:{{ entry["routeKey"] }} {% if entry["valid"] == true %}{{ BackendNameGateway(route, entry["backend"]) }}{% else %}gw-invalid-backend{% end %}
      {% end -%}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  map-weighted-backend-500-gateway:
    template: |
      {# Generate weighted backend map entries for HTTPRoute and
          GRPCRoute. Both kinds support multi-backendRef rules with
          weights — the chart's weighted-multi-backend.map is
          backend-kind-agnostic (lookups key off `<random_weight>:
          <route_key>` produced by the routing chain). The
          GRPCRouteWeight conformance test pins this contract:
          a GRPCRoute with `[v1: weight=70, v2: weight=30, v3:
          weight=0]` must distribute requests 70/30 across v1 and v2
          (and never to v3). Without GRPCRoute coverage here, the
          MULTIBACKEND lookup at runtime returned an empty
          backend_name and the request fell through to
          default_backend (404). #}
      # gateway/map-weighted-backend-gateway

  map-weighted-backend-510-gateway-http:
    requires: [httproutes, referencegrants, services]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: map-weighted-backend-gateway
    template: |-
      {%- import "util-generate-httproute-weighted-backend-map-gateway" for GenerateHTTPRouteWeightedBackendMap -%}
      {%- var route = item -%}
      {%- if route != nil -%}
      {{- GenerateHTTPRouteWeightedBackendMap([]any{route}) -}}
      {%- end -%}

  map-weighted-backend-515-gateway-separator:
    template: '{{ "\n" }}'

  map-weighted-backend-520-gateway-grpc:
    requires: [grpcroutes, referencegrants, services]
    incremental:
      source: grpcroutes
      group: map-weighted-backend-gateway
    template: |-
      {%- import "util-generate-grpcroute-weighted-backend-map-gateway" for GenerateGRPCRouteWeightedBackendMap -%}
      {%- var route = resources.grpcroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}
      {{- GenerateGRPCRouteWeightedBackendMap([]*resources.grpcroutes.T{route}) -}}
      {%- end -%}

  # Frontend-extra: HTTPS misdirected-request detection (Gateway API
  # SupportGatewayHTTPSListenerDetectMisdirectedRequests).
  #
  # Per RFC 9110 §15.5.20 / Gateway API spec, an HTTPS listener that
  # carves up TLS connections by SNI must reject requests whose Host
  # header doesn't match the SNI: the client connected to a server
  # certificate the route doesn't authorise for that hostname.
  #
  # We only emit the directive on the HTTPS path (`{ ssl_fc }`); the
  # HTTP frontend renders the same snippet but the guards skip it.
  # Comparing via strcmp(<var>) in a converter chain — sample-fetch
  # to-sample-fetch comparison isn't expressible with `-m str`, but
  # strcmp returns 0 on equality which we negate.
  # gateway/http-bind-extra-050-gateway-multi-port-bind:
  # Emits an additional `bind *:<port>` directive for every unique
  # non-default Gateway HTTP listener port we observe. Hooks into the
  # HTTP-frontend-only http-bind-extra-* extension point so the binds
  # don't double-render into the HTTPS frontend (where they would
  # conflict with the existing https port bind). HTTPS-listener-port
  # binds are emitted by a sibling snippet (https-bind-extra-*).
