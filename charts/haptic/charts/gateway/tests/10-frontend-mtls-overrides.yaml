  listeners: &frontendOverrideListeners
    - name: default
      protocol: HTTPS
      port: 443
      hostname: default.example.org
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: shared-tls}]
    - name: override
      protocol: HTTPS
      port: 8443
      hostname: override.example.org
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: shared-tls}]
  services: &frontendOverrideServices
    - apiVersion: v1
      kind: Service
      metadata: {name: mtls-echo, namespace: default}
      spec:
        ports: [{port: 80, targetPort: 8080}]
  routes: &frontendOverrideRoutes
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata: {name: mtls-override-route, namespace: default, generation: 1}
      spec:
        parentRefs: [{name: mtls-overrides, sectionName: override}]
        hostnames: [override.example.org]
        rules:
          - backendRefs: [{name: mtls-echo, port: 80}]

validationTests:
  test-gateway-frontend-mtls-pinned-address-isolates-listeners:
    requires: [gateways, configmaps, secrets]
    requiresFields: [gateways.spec.tls.frontend]
    extraContext:
      controllerName: haproxy-haptic.org/controller
      controllerNamespace: haptic-system
      haproxyPodSelector: {app.kubernetes.io/name: haptic, app.kubernetes.io/component: haproxy}
    fixtures:
      configmaps: *frontendOverrideCAs
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-pinned, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            addresses: [{type: IPAddress, value: "192.0.2.10"}]
            listeners:
              - name: strict
                protocol: HTTPS
                port: 443
                hostname: same.example.org
                tls:
                  mode: Terminate
                  certificateRefs: [{kind: Secret, name: shared-tls}]
              - name: permissive
                protocol: HTTPS
                port: 8443
                hostname: same.example.org
                tls:
                  mode: Terminate
                  certificateRefs: [{kind: Secret, name: shared-tls}]
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs: [{kind: ConfigMap, group: "", name: default-ca}]
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        mode: AllowInsecureFallback
                        caCertificateRefs: [{kind: ConfigMap, group: "", name: default-ca}]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s*bind \*:18[0-9]{3} ssl crt-list \S+/gw-default-mtls-pinned-strict-crtlist\.txt alpn h2,http/1\.1$'
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:18[0-9]{3} ssl crt-list \S+/gw-default-mtls-pinned-permissive-crtlist\.txt alpn h2,http/1\.1 ca-ignore-err all crt-ignore-err all'
      - type: contains
        target: crt-list:gw-default-mtls-pinned-strict-crtlist.txt
        pattern: 'ca-file \S+ verify required'
      - type: contains
        target: crt-list:gw-default-mtls-pinned-permissive-crtlist.txt
        pattern: 'ca-file \S+ verify optional'
      - type: contains
        target: k8s:gateway-static-addresses
        pattern: 'metallb\.universe\.tf/loadBalancerIPs: 192\.0\.2\.10'
      - type: match_count
        target: k8s:gateway-static-addresses
        pattern: 'targetPort: 18[0-9]{3}'
        expected: "2"
      - type: not_contains
        target: k8s:gateway-static-addresses
        pattern: 'targetPort: (443|8443)\b'

  test-gateway-frontend-mtls-unresolved-per-port-override:
    requires: [gatewayclasses, gateways, configmaps, secrets]
    requiresFields: [gateways.spec.tls.frontend]
    description: An unresolved per-port CA blocks its listener while an unconfigured sibling remains available.
    extraContext:
      controllerName: haproxy-haptic.org/controller
      controllerNamespace: haptic-system
    fixtures:
      gatewayclasses: &frontendOverrideClasses
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy-haptic.org/controller}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-perport-missing, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default: {}
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        mode: AllowValidOnly
                        caCertificateRefs:
                          - {kind: ConfigMap, group: "", name: absent-per-port-ca}
            listeners:
              - name: healthy
                protocol: HTTPS
                port: 443
                hostname: healthy.example.org
                tls:
                  mode: Terminate
                  certificateRefs: [{kind: Secret, name: shared-tls}]
              - name: blocked
                protocol: HTTPS
                port: 8443
                hostname: blocked.example.org
                tls:
                  mode: Terminate
                  certificateRefs: [{kind: Secret, name: shared-tls}]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:[0-9]+ ssl crt-list \S+/gw-default-mtls-perport-missing-healthy-crtlist\.txt'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'gw-default-mtls-perport-missing-blocked-crtlist\.txt'
      - type: not_exists
        target: crt-list:gw-default-mtls-perport-missing-blocked-crtlist.txt
      - type: contains
        target: status:default/mtls-perport-missing:rendered
        pattern: '"reason":"NoValidCACertificate"'
      - type: contains
        target: status:default/mtls-perport-missing:rendered
        pattern: '"reason":"InvalidCACertificateRef"'

  test-gateway-frontend-mtls-invalid-override-never-inherits-permissive-default:
    requires: [gatewayclasses, gateways, configmaps, secrets]
    requiresFields: [gateways.spec.tls.frontend]
    description: A strict unresolved per-port override cannot inherit a permissive default.
    extraContext: {controllerName: haproxy-haptic.org/controller, controllerNamespace: haptic-system}
    fixtures:
      gatewayclasses: *frontendOverrideClasses
      configmaps: *frontendOverrideCAs
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-overrides, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners: *frontendOverrideListeners
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowInsecureFallback
                    caCertificateRefs: [{kind: ConfigMap, group: "", name: default-ca}]
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        mode: AllowValidOnly
                        caCertificateRefs: [{kind: ConfigMap, group: "", name: missing-override-ca}]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:[0-9]+ ssl crt-list \S+/gw-default-mtls-overrides-default-crtlist\.txt alpn h2,http/1\.1 ca-ignore-err all crt-ignore-err all'
      - type: contains
        target: crt-list:gw-default-mtls-overrides-default-crtlist.txt
        pattern: 'ca-file \S+/frontend-mtls-default-mtls-overrides-default\.crt verify optional'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'gw-default-mtls-overrides-override-crtlist\.txt'
      - type: not_exists
        target: crt-list:gw-default-mtls-overrides-override-crtlist.txt
      - type: contains
        target: status:default/mtls-overrides:rendered
        pattern: '"reason":"NoValidCACertificate"'
      - type: contains
        target: status:default/mtls-overrides:rendered
        pattern: '"reason":"InvalidCACertificateRef"'

  test-gateway-frontend-mtls-empty-override-replaces-strict-default:
    requires: [gatewayclasses, gateways, configmaps, secrets, httproutes, services]
    requiresFields: [gateways.spec.tls.frontend]
    description: An empty per-port TLS configuration disables inherited validation only on its port.
    extraContext: {controllerName: haproxy-haptic.org/controller, controllerNamespace: haptic-system}
    fixtures:
      gatewayclasses: *frontendOverrideClasses
      configmaps: *frontendOverrideCAs
      services: *frontendOverrideServices
      httproutes: *frontendOverrideRoutes
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-overrides, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners: *frontendOverrideListeners
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs: [{kind: ConfigMap, group: "", name: default-ca}]
                perPort: [{port: 8443, tls: {}}]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:gw-default-mtls-overrides-default-crtlist.txt
        pattern: 'ca-file \S+/frontend-mtls-default-mtls-overrides-default\.crt verify required'
      - type: equals
        target: crt-list:gw-default-mtls-overrides-override-crtlist.txt
        expected: |
          default_shared-tls.pem [ocsp-update on] override.example.org
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:[0-9]+ ssl crt-list \S+/gw-default-mtls-overrides-override-crtlist\.txt alpn h2,http/1\.1'
      - type: contains
        target: map:host.map
        pattern: 'override\.example\.org'
      - type: contains
        target: status:default/mtls-override-route:deployed
        pattern: '"reason":"Accepted","status":"True","type":"Accepted"'

  test-gateway-frontend-mtls-empty-override-survives-invalid-default:
    requires: [gatewayclasses, gateways, configmaps, secrets, httproutes, services]
    requiresFields: [gateways.spec.tls.frontend]
    description: An empty per-port override remains routable when the default CA is missing.
    extraContext: {controllerName: haproxy-haptic.org/controller, controllerNamespace: haptic-system}
    fixtures:
      gatewayclasses: *frontendOverrideClasses
      services: *frontendOverrideServices
      httproutes: *frontendOverrideRoutes
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-overrides, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners: *frontendOverrideListeners
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs: [{kind: ConfigMap, group: "", name: missing-default-ca}]
                perPort: [{port: 8443, tls: {}}]
    assertions:
      - type: haproxy_valid
      - type: not_exists
        target: crt-list:gw-default-mtls-overrides-default-crtlist.txt
      - type: not_contains
        target: haproxy.cfg
        pattern: 'gw-default-mtls-overrides-default-crtlist\.txt'
      - type: equals
        target: crt-list:gw-default-mtls-overrides-override-crtlist.txt
        expected: |
          default_shared-tls.pem [ocsp-update on] override.example.org
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:[0-9]+ ssl crt-list \S+/gw-default-mtls-overrides-override-crtlist\.txt alpn h2,http/1\.1'
      - type: contains
        target: map:host.map
        pattern: 'override\.example\.org'
      - type: contains
        target: status:default/mtls-overrides:rendered
        pattern: '"reason":"NoValidCACertificate"'
      - type: contains
        target: status:default/mtls-overrides:rendered
        pattern: '"attachedRoutes":1,"conditions":\[\{[^}]*"reason":"Accepted","status":"True","type":"Accepted"'
      - type: contains
        target: status:default/mtls-override-route:deployed
        pattern: '"reason":"Accepted","status":"True","type":"Accepted"'
