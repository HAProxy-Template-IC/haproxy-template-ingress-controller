  test-httproute-redirect-replacefullpath-quote-encoded:
    requires: [httproutes]
    description: A double quote in a RequestRedirect ReplaceFullPath value is percent-encoded into the map, so it cannot become a directive; a clean sibling redirect is unaffected.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
