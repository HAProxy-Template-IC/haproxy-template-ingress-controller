                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplaceFullPath, replaceFullPath: "/new\" code 301 if { path /redirpwned } #"}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: RequestRedirect
