_fx:
  gatewaysGatewayGw: &gatewaysGatewayGw
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: default}
      spec:
        gatewayClassName: haptic
        listeners:
          - {name: http, port: 80, protocol: HTTP}
  servicesServiceApiService: &servicesServiceApiService
    - apiVersion: v1
      kind: Service
      metadata: {name: api-service, namespace: default}
      spec:
        ports:
          - port: 80
  gatewayclassesGatewayclass: &gatewayclassesGatewayclass
    - apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata: {name: haptic}
      spec: {controllerName: haproxy.org/haptic}
  matchesPathprefixApi: &matchesPathprefixApi
    - path: {type: PathPrefix, value: /api}

validationTests:
  test-httproute-request-header-modifier:
    requires: [httproutes]
    description: HTTPRoute with RequestHeaderModifier filter (add, set, remove headers)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: header-filter-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - {name: X-Custom-Header, value: custom-value}
                      set:
                        - {name: X-Replace-Header, value: new-value}
                      remove:
                        - X-Remove-Header
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: map:gw-reqhdr.map, pattern: 'default_header-filter-route_0\|set\|x-replace-header new-value'}
      - {type: contains, target: map:gw-reqhdr.map, pattern: 'default_header-filter-route_0\|add\|x-custom-header custom-value'}
      - {type: contains, target: map:gw-reqhdr.map, pattern: 'default_header-filter-route_0\|del\|x-remove-header 1'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header X-Replace-Header %\[var\(txn\.gw_rule_id\),concat\(\|set\|x-replace-header\),map\([^)]*gw-reqhdr\.map\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request add-header X-Custom-Header %\[var\(txn\.gw_rule_id\),concat\(\|add\|x-custom-header\),map\([^)]*gw-reqhdr\.map\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-Remove-Header if \{ var\(txn\.gw_rule_id\),concat\(\|del\|x-remove-header\),map\([^)]*gw-reqhdr\.map\) -m found \}'}

      # The value is never inlined: it lives in the map, so a second route
      # using this header name adds no config line.
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header X-Replace-Header "new-value"'}

  test-httproute-response-header-modifier:
    requires: [httproutes]
    description: HTTPRoute with ResponseHeaderModifier filter (add, set, remove response headers)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: response-filter-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: ResponseHeaderModifier
                    responseHeaderModifier:
                      add:
                        - {name: X-Response-Header, value: response-value}
                      set:
                        - {name: X-Replace-Response, value: new-response}
                      remove:
                        - X-Remove-Response
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_response-filter-route_0\|set\|x-replace-response new-response'}
      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_response-filter-route_0\|add\|x-response-header response-value'}
      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_response-filter-route_0\|del\|x-remove-response 1'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Replace-Response %\[var\(txn\.gw_rule_id\),concat\(\|set\|x-replace-response\),map\([^)]*gw-reshdr\.map\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response add-header X-Response-Header %\[var\(txn\.gw_rule_id\),concat\(\|add\|x-response-header\),map\([^)]*gw-reshdr\.map\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response del-header X-Remove-Response if \{ var\(txn\.gw_rule_id\),concat\(\|del\|x-remove-response\),map\([^)]*gw-reshdr\.map\) -m found \}'}

  test-httproute-request-redirect:
    requires: [httproutes]
    description: HTTPRoute with RequestRedirect filter (scheme, path, status code)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redirect-route, namespace: default}
          spec:
            hostnames:
              - old.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /old}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /new}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      # code|scheme|host|port|pathmode|pfxlen|path. /old is 4 bytes, so the
      # remainder starts there and the encoded /new is prepended.
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redirect-route_0 301\|https\|new\.example\.com\|\|P\|4\|%2fnew'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir\) var\(txn\.gw_rule_id\),map\([^)]*gw-redirect\.map\) if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_rest\) path,bytes\(txn\.gw_pfxlen\) if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_query\) pathq,regsub\(\^\[\^\?\]\*,\) if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request redirect location "%\[var\(txn\.gw_redir_scheme\)\]://%\[var\(txn\.gw_redir_host\)\]%\[var\(txn\.gw_redir_port\)\]%\[var\(txn\.gw_redir_path\)\]%\[var\(txn\.gw_redir_query\)\]" code 301 if \{ var\(txn\.gw_redir\),field\(1,\|\) -m str 301 \}'}

      # One line per redirect code per rendered frontend (five codes, two
      # frontends here); the count does not grow with the number of routes.
      - {type: match_count, target: haproxy.cfg, pattern: 'http-request redirect location "%\[var\(txn\.gw_redir_scheme\)', expected: "10"}

  test-httproute-request-redirect-default-port-omission:
    requires: [httproutes]
    description: "RequestRedirect MUST NOT include the port in Location when the resulting (scheme, port) pair is the scheme's default ((http, 80) or (https, 443)) per Gateway API spec."
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redirect-default-ports, namespace: default}
          spec:
            hostnames:
              - example.org
            rules:
              # Empty spec.scheme + port:80 → http://example.org (no :80)
              - matches:
                  - path: {type: PathPrefix, value: /scheme-nil-and-port-80}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org, port: 80, statusCode: 302}
              # spec.scheme=https + port:443 → https://example.org (no :443)
              - matches:
                  - path: {type: PathPrefix, value: /scheme-https-and-port-443}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {scheme: https, hostname: example.org, port: 443, statusCode: 302}
              # Non-default port stays in Location: spec.scheme=http + port:8080.
              - matches:
                  - path: {type: PathPrefix, value: /non-default-port}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {scheme: http, hostname: example.org, port: 8080, statusCode: 302}
    assertions:
      - type: haproxy_valid

      # The port part is a map field now, so the assertions read the map: an
      # empty 4th field means Location carries no port.
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redirect-default-ports_0 302\|\|example\.org\|\|'}
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redirect-default-ports_1 302\|https\|example\.org\|\|'}
      # Negative control for the two above: a non-default port IS carried.
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redirect-default-ports_2 302\|http\|example\.org\|:8080\|'}
      - {type: not_contains, target: map:gw-redirect.map, pattern: 'example\.org\|:80\|'}
      - {type: not_contains, target: map:gw-redirect.map, pattern: 'example\.org\|:443\|'}

  test-httproute-url-rewrite:
    requires: [httproutes]
    description: HTTPRoute with URLRewrite filter (hostname and path rewrite)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rewrite-route, namespace: default}
          spec:
            hostnames:
              - external.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api/v1}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      hostname: internal.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /api/v2}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      # host|pathmode|pfxlen|path. /api/v1 is 7 bytes.
      - {type: contains, target: map:gw-urlrewrite.map, pattern: 'default_rewrite-route_0 internal\.example\.com\|P\|7\|%2fapi%2fv2'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header Host %\[var\(txn\.gw_rw\),field\(1,\|\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_rw_rest\) path,bytes\(txn\.gw_pfxlen\) if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-path %\[var\(txn\.gw_rw_path\)\] if'}

      # The rewrite is no longer a per-route replace-path pair.
      - {type: not_contains, target: haproxy.cfg, pattern: 'http-request replace-path'}

  test-httproute-cors-filter:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: HTTPRoute CORS filter generates set-var, return 200, and response headers
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods:
                        - GET
                        - POST
                      allowHeaders:
                        - X-Custom-Header
                backendRefs:
                  - {name: backend, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\} \\{ req\\.fhdr\\(Access-Control-Request-Method\\) -m found \\}"

      - {type: contains, target: haproxy.cfg, pattern: "hdr access-control-allow-methods \"GET, POST\""}

      - {type: contains, target: haproxy.cfg, pattern: "hdr access-control-allow-headers \"X-Custom-Header\""}

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header \"access-control-allow-origin\" \"%\\[var\\(txn\\.gw_cors_origin\\)\\]\""

  test-httproute-cors-wildcard-methods-echo:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: "Closes the chart-side gap on the HTTPRouteCORS conformance test sub-cases that send `allowMethods: [\"*\"]`."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-wildcard-methods-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors-wildcard.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /cors-2}
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods: ["*"]
                backendRefs:
                  - {name: backend, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_acrm\\) req\\.fhdr\\(Access-Control-Request-Method\\)"

      - type: contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "%\[var\(txn\.gw_cors_acrm\)\]"'

      - type: not_contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS"'
  test-httproute-backend-request-header-modifier:
    requires: [gatewayclasses, gateways, httproutes]
    description: HTTPRoute with per-backendRef RequestHeaderModifier emits set-header in correct backend
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-v1, namespace: default}
          spec:
            ports:
              - {name: http, port: 8080, targetPort: 8080}
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-v2, namespace: default}
          spec:
            ports:
              - {name: http, port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: br-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - {name: Backend, value: backend-v1}
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - {name: Backend, value: backend-v2}
    assertions:
      - type: haproxy_valid

      # Keyed by rule AND backend, so one frontend line serves both backendRefs.
      - {type: contains, target: map:gw-reqhdr.map, pattern: 'default_br-route_0\|gtw_default_br-route_backend-v1_8080\|set\|backend backend-v1'}
      - {type: contains, target: map:gw-reqhdr.map, pattern: 'default_br-route_0\|gtw_default_br-route_backend-v2_8080\|set\|backend backend-v2'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header Backend %\[var\(txn\.gw_rule_id\),concat\(\|,txn\.backend_name,\),concat\(\|set\|backend\),map\([^)]*gw-reqhdr\.map\),url_dec\(1\)\] if'}

      # The backend sections carry no header lines at all now.
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header Backend "backend-v1"'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header Backend "backend-v2"'}

  test-httproute-backend-response-header-modifier:
    requires: [gatewayclasses, gateways, httproutes]
    description: HTTPRoute with per-backendRef ResponseHeaderModifier emits http-response directives in that backend only, gated on the rule id
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
              - {name: http-alt, port: 8080, targetPort: 8081}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: route, namespace: default}
          spec:
            hostnames: [route.example.com]
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend
                    port: 80
                    filters:
                      - type: ResponseHeaderModifier
                        responseHeaderModifier:
                          add:
                            - {name: my-added-header, value: added-value}
                          set:
                            - {name: X-Set, value: set-value}
                          remove: [X-Remove]
              - backendRefs:
                  - name: backend
                    port: 8080
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_route_0\|gtw_default_route_backend_80\|add\|my-added-header added-value'}
      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_route_0\|gtw_default_route_backend_80\|set\|x-set set-value'}
      - {type: contains, target: map:gw-reshdr.map, pattern: 'default_route_0\|gtw_default_route_backend_80\|del\|x-remove 1'}

      # In the frontend, after the rule-level block, so a backendRef modifier
      # overrides a rule-level one for the same header (spec order).
      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Set %\[var\(txn\.gw_rule_id\),concat\(\|,txn\.backend_name,\),concat\(\|set\|x-set\),map\([^)]*gw-reshdr\.map\),url_dec\(1\)\] if'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response del-header X-Remove if \{ var\(txn\.gw_rule_id\),concat\(\|,txn\.backend_name,\),concat\(\|del\|x-remove\),map\([^)]*gw-reshdr\.map\) -m found \}'}

      # Negative control for the two above: nothing lands inside a backend now.
      - {type: not_contains, target: haproxy.cfg, pattern: 'http-response set-header X-Set "set-value"'}
      # One static line per header name per op — not one per frontend backend.
      - {type: match_count, target: map:gw-reshdr.map, pattern: 'add\|my-added-header', expected: "1"}

  test-httproute-cors-no-hostname:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: HTTPRoute CORS filter on catch-all route (no hostnames) routes correctly
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: same-namespace, namespace: gateway-conformance-infra}
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: http, port: 80, protocol: HTTP}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: infra-backend-v1, namespace: gateway-conformance-infra}
          spec:
            ports:
              - {port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-wildcard-origin, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - "*"
                      allowMethods: ["PUT"]
                      allowCredentials: false
                matches:
                  - path: {type: PathPrefix, value: /cors-wildcard-origin}
                backendRefs:
                  - {name: infra-backend-v1, port: 8080}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^:[0-9]+/cors-wildcard-origin/?\\s+GW_ROUTE_ID"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\}"

  test-httproute-redirect-preserves-request-scheme:
    requires: [gatewayclasses, gateways, httproutes]
    description: RequestRedirect without spec.scheme preserves the request's scheme via txn.gw_request_scheme
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-svc, namespace: default}
          spec:
            ports:
              - {port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /scheme-nil-and-port-nil}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org}
                backendRefs:
                  - {name: backend-svc, port: 8080}
              - matches:
                  - path: {type: PathPrefix, value: /scheme-https-and-port-nil}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org, scheme: https}
                backendRefs:
                  - {name: backend-svc, port: 8080}
    assertions:
      - type: haproxy_valid

      # An empty scheme field means "keep the request's scheme"; "L" in the port
      # field means "the Gateway listener's port, resolved per request".
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redir-route_0 302\|\|example\.org\|L\|'}
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redir-route_1 302\|https\|example\.org\|\|'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_scheme\) str\(http\) if \{ var\(txn\.gw_redir\) -m found \} \{ var\(txn\.gw_redir_scheme\) -m len 0 \} !\{ ssl_fc \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_scheme\) str\(https\) if \{ var\(txn\.gw_redir\) -m found \} \{ var\(txn\.gw_redir_scheme\) -m len 0 \} \{ ssl_fc \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_port\) str\(\) if \{ var\(txn\.gw_redir_port\) -m str L \} \{ var\(txn\.gw_listener_port\) -m int \d+ \} !\{ ssl_fc \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_redir_port\) str\(:\),concat\(,txn\.gw_listener_port,\) if \{ var\(txn\.gw_redir_port\) -m str L \}'}

  test-httproute-request-mirror-single:
    requires: [httproutes]
    description: "HTTPRoute with a single RequestMirror filter at full traffic (no percent / fraction): appends one scheme|host:port|timeout|retries entry to txn.gw_mirror_targets and fires the single mirror-group once, plus a Content-Length-gated http-request wait-for-body on the frontend (without which req.body would be empty at the plugin; gated so a GRPCRoute sharing the frontend isn't deadlocked)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-backend, namespace: default}
          spec:
            ports:
              - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-backend, namespace: default, port: 8080}}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      # Buffering is gated on the rule having a mirror, so a cluster with no
      # mirrors never buffers even though the line is always present.
      - {type: contains, target: haproxy.cfg, pattern: 'http-request wait-for-body time 10s if \{ req\.hdr\(content-length\) -m found \} !\{ var\(txn\.backend_name\),map\([^)]*request-buffering\.map,on\) -m str off \} \{ var\(txn\.gw_rule_id\),map_str_int\([^)]*gw-mirror-pct\.map\) -m found \}'}

      - {type: contains, target: map:gw-mirror.map, pattern: 'default_mirror-route_0 http%7cmirror-backend\.default\.svc\.cluster\.local%3a8080%7c2000%7c0%3b'}
      - {type: contains, target: map:gw-mirror-pct.map, pattern: 'default_mirror-route_0 100'}

      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_mirror_targets\) var\(txn\.gw_rule_id\),map\([^)]*gw-mirror\.map\),url_dec\(1\) if \{ var\(txn\.gw_rule_id\),map\([^)]*gw-mirror\.map\) -m found \} \{ rand\(100\),sub\(txn\.gw_mirror_pct\) -m int lt 0 \}'}

      # The target list is a map value, not a per-route directive.
      - {type: not_contains, target: haproxy.cfg, pattern: 'str\(http\|mirror-backend'}

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub-mirror mirror-group if \{ var\(txn\.gw_mirror_targets\) -m found \}'

      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\) arg_method=method'
  test-httproute-request-mirror-percent:
    requires: [httproutes]
    requiresFields: [httproutes.spec.rules.filters.requestMirror.percent]
    description: "HTTPRoute with a RequestMirror filter at 20% sampling: the target-list append is gated by an inline rand(100) lt 20 ACL on top of the route-id condition (one directive, one draw — no stored sample var)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-backend, namespace: default}
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-percent-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      percent: 20
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      # rand(100) draws 0..99 and sub() goes negative exactly when the draw is
      # below the percentage, so the sampling gate is one static line.
      - {type: contains, target: map:gw-mirror-pct.map, pattern: 'default_mirror-percent-route_0 20'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_mirror_pct\) var\(txn\.gw_rule_id\),map_str_int\([^)]*gw-mirror-pct\.map\) if'}
      - {type: contains, target: haproxy.cfg, pattern: '\{ rand\(100\),sub\(txn\.gw_mirror_pct\) -m int lt 0 \}'}

      - {type: not_contains, target: haproxy.cfg, pattern: 'gw_mirror_sample'}
      # Negative control: a per-route rand() ACL is gone from the shared path.
      - {type: not_contains, target: haproxy.cfg, pattern: 'rand\(100\) -m int lt 20'}

