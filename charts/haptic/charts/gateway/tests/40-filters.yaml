  test-httproute-request-mirror-static-spoe-config:
    requires: [httproutes]
    description: "Cluster with two routes carrying 1 and 3 mirror filters respectively. The SPOE config is a single static `mirror` message + `mirror-group` regardless of how many mirrors exist — no per-target slots, so nothing in spoe.conf changes as routes/mirrors are added. The 3-mirror route appends its 3 target entries to one txn.gw_mirror_targets list; the plugin fans out."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: m1, namespace: default}
          spec: {ports: [{port: 8081}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m2, namespace: default}
          spec: {ports: [{port: 8082}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m3, namespace: default}
          spec: {ports: [{port: 8083}]}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-one, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /one}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                backendRefs: [{name: api-service, port: 80}]
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-three, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /three}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m2, namespace: default, port: 8082}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m3, namespace: default, port: 8083}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      # Exactly one static mirror message + group — no numbered slots at any fanout.
      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\)'
      - {type: contains, target: file:spoe.conf, pattern: 'spoe-group mirror-group\n    messages mirror'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-group mirror-1-group'}

      # The 3-mirror route appends all three targets to the one list variable.
      - {type: contains, target: map:gw-mirror.map, pattern: 'default_r-three_0 http%7cm1\.default\.svc\.cluster\.local%3a8081%7c2000%7c0%3bhttp%7cm2\.default\.svc\.cluster\.local%3a8082%7c2000%7c0%3bhttp%7cm3\.default\.svc\.cluster\.local%3a8083%7c2000%7c0%3b'}
      - {type: contains, target: map:gw-mirror.map, pattern: 'default_r-one_0 http%7cm1\.default\.svc\.cluster\.local%3a8081%7c2000%7c0%3b'}

      # One line per rendered frontend, however many routes mirror.
      - {type: match_count, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.gw_mirror_targets\) var\(txn\.gw_rule_id\)', expected: "2"}

  # Rewrite/redirect path injection guard (#155). replaceFullPath /
  # replacePrefixMatch are arbitrary strings (no Gateway-API charset validation).
  # They are percent-encoded into a map value now, so a quote has nothing to break
  # out of; a control character still survives url_dec into the runtime Location or
  # path, so it stays guarded — denied at admission, warned-and-skipped on reconcile.
  test-httproute-urlrewrite-replacefullpath-quote-encoded:
    requires: [httproutes]
    description: A double quote in a URLRewrite ReplaceFullPath value is percent-encoded into the map, so it cannot become a directive.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplaceFullPath, replaceFullPath: "/new\" if { path /rwpwned }"}
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplaceFullPath, replaceFullPath: /rwok}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:gw-urlrewrite.map, pattern: 'default_rw-attacker_0 \|F\|0\|%2fnew%22%20if%20%7b%20path%20%2frwpwned%20%7d'}
      - {type: contains, target: map:gw-urlrewrite.map, pattern: 'default_rw-good_0 \|F\|0\|%2frwok'}
      - {type: not_contains, target: haproxy.cfg, pattern: "rwpwned"}

  test-httproute-urlrewrite-replacefullpath-injection-admission-rejected:
    requires: [httproutes]
    description: A newline in a URLRewrite ReplaceFullPath value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
