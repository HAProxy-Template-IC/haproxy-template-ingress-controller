_fx:
  gatewaysGatewayGw: &gatewaysGatewayGw
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: default}
      spec:
        gatewayClassName: haptic
        listeners:
          - {name: http, port: 80, protocol: HTTP}
  servicesServiceApiService: &servicesServiceApiService
    - apiVersion: v1
      kind: Service
      metadata: {name: api-service, namespace: default}
      spec:
        ports:
          - port: 80
  gatewayclassesGatewayclass: &gatewayclassesGatewayclass
    - apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata: {name: haptic}
      spec: {controllerName: haproxy.org/haptic}
  matchesPathprefixApi: &matchesPathprefixApi
    - path: {type: PathPrefix, value: /api}

validationTests:
  test-httproute-request-header-modifier:
    requires: [httproutes]
    description: HTTPRoute with RequestHeaderModifier filter (add, set, remove headers)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: header-filter-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - {name: X-Custom-Header, value: custom-value}
                      set:
                        - {name: X-Replace-Header, value: new-value}
                      remove:
                        - X-Remove-Header
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request add-header X-Custom-Header "custom-value" if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-header X-Replace-Header "new-value" if'

      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-Remove-Header if'}

  test-httproute-response-header-modifier:
    requires: [httproutes]
    description: HTTPRoute with ResponseHeaderModifier filter (add, set, remove response headers)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: response-filter-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: ResponseHeaderModifier
                    responseHeaderModifier:
                      add:
                        - {name: X-Response-Header, value: response-value}
                      set:
                        - {name: X-Replace-Response, value: new-response}
                      remove:
                        - X-Remove-Response
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-response add-header X-Response-Header "response-value" if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-response set-header X-Replace-Response "new-response" if'

      - {type: contains, target: haproxy.cfg, pattern: 'http-response del-header X-Remove-Response if'}

  test-httproute-request-redirect:
    requires: [httproutes]
    description: HTTPRoute with RequestRedirect filter (scheme, path, status code)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redirect-route, namespace: default}
          spec:
            hostnames:
              - old.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /old}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /new}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redirect_path\) path,regsub\("\^/old","/new"\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://new\.example\.com%\[var\(txn\.gw_redirect_path\)\]" code 301 if'

  test-httproute-request-redirect-default-port-omission:
    requires: [httproutes]
    description: "RequestRedirect MUST NOT include the port in Location when the resulting (scheme, port) pair is the scheme's default ((http, 80) or (https, 443)) per Gateway API spec."
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redirect-default-ports, namespace: default}
          spec:
            hostnames:
              - example.org
            rules:
              # Empty spec.scheme + port:80 → http://example.org (no :80)
              - matches:
                  - path: {type: PathPrefix, value: /scheme-nil-and-port-80}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org, port: 80, statusCode: 302}
              # spec.scheme=https + port:443 → https://example.org (no :443)
              - matches:
                  - path: {type: PathPrefix, value: /scheme-https-and-port-443}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {scheme: https, hostname: example.org, port: 443, statusCode: 302}
              # Non-default port stays in Location: spec.scheme=http + port:8080.
              - matches:
                  - path: {type: PathPrefix, value: /non-default-port}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {scheme: http, hostname: example.org, port: 8080, statusCode: 302}
    assertions:
      - type: haproxy_valid

      - {type: not_contains, target: haproxy.cfg, pattern: 'http://example\.org:80(?:[^0-9]|$)'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'https://example\.org:443(?:[^0-9]|$)'}
      - {type: contains, target: haproxy.cfg, pattern: 'http://example\.org:8080'}

  test-httproute-url-rewrite:
    requires: [httproutes]
    description: HTTPRoute with URLRewrite filter (hostname and path rewrite)
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rewrite-route, namespace: default}
          spec:
            hostnames:
              - external.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api/v1}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      hostname: internal.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /api/v2}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header Host 'internal.example.com' if"

      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path'}

      - {type: contains, target: haproxy.cfg, pattern: '"/api/v2'}

  test-httproute-cors-filter:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: HTTPRoute CORS filter generates set-var, return 200, and response headers
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods:
                        - GET
                        - POST
                      allowHeaders:
                        - X-Custom-Header
                backendRefs:
                  - {name: backend, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\} \\{ req\\.fhdr\\(Access-Control-Request-Method\\) -m found \\}"

      - {type: contains, target: haproxy.cfg, pattern: "hdr access-control-allow-methods \"GET, POST\""}

      - {type: contains, target: haproxy.cfg, pattern: "hdr access-control-allow-headers \"X-Custom-Header\""}

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header \"access-control-allow-origin\" \"%\\[var\\(txn\\.gw_cors_origin\\)\\]\""

  test-httproute-cors-wildcard-methods-echo:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: "Closes the chart-side gap on the HTTPRouteCORS conformance test sub-cases that send `allowMethods: [\"*\"]`."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-wildcard-methods-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors-wildcard.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /cors-2}
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods: ["*"]
                backendRefs:
                  - {name: backend, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_acrm\\) req\\.fhdr\\(Access-Control-Request-Method\\)"

      - type: contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "%\[var\(txn\.gw_cors_acrm\)\]"'

      - type: not_contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS"'
  test-httproute-backend-request-header-modifier:
    requires: [gatewayclasses, gateways, httproutes]
    description: HTTPRoute with per-backendRef RequestHeaderModifier emits set-header in correct backend
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-v1, namespace: default}
          spec:
            ports:
              - {name: http, port: 8080, targetPort: 8080}
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-v2, namespace: default}
          spec:
            ports:
              - {name: http, port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: br-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - {name: Backend, value: backend-v1}
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - {name: Backend, value: backend-v2}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: '(?s)backend gtw_default_br-route_backend-v1_8080.*?http-request set-header Backend "backend-v1".*?backend gtw_default_br-route_backend-v2_8080'

      - type: contains
        target: haproxy.cfg
        pattern: '(?s)backend gtw_default_br-route_backend-v2_8080.*?http-request set-header Backend "backend-v2"'

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_br-route_backend-v1_8080[^a-zA-Z]+[^\\n]*\\n([^\\n]+\\n){0,5}[^\\n]*http-request set-header Backend \"backend-v1\""

  test-httproute-backend-response-header-modifier:
    requires: [gatewayclasses, gateways, httproutes]
    description: HTTPRoute with per-backendRef ResponseHeaderModifier emits http-response directives in that backend only, gated on the rule id
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
              - {name: http-alt, port: 8080, targetPort: 8081}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: route, namespace: default}
          spec:
            hostnames: [route.example.com]
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend
                    port: 80
                    filters:
                      - type: ResponseHeaderModifier
                        responseHeaderModifier:
                          add:
                            - {name: my-added-header, value: added-value}
                          set:
                            - {name: X-Set, value: set-value}
                          remove: [X-Remove]
              - backendRefs:
                  - name: backend
                    port: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)backend gtw_default_route_backend_80\n.*?http-response add-header my-added-header "added-value" if \{ var\(txn.gw_rule_id\) -m str "default_route_0" \}.*?backend gtw_default_route_backend_8080'
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)backend gtw_default_route_backend_80\n.*?http-response set-header X-Set "set-value" if \{ var\(txn.gw_rule_id\) -m str "default_route_0" \}'
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)backend gtw_default_route_backend_80\n.*?http-response del-header X-Remove if \{ var\(txn.gw_rule_id\) -m str "default_route_0" \}'
      - {type: match_count, target: haproxy.cfg, pattern: 'http-response add-header my-added-header', expected: "1"}

  test-httproute-cors-no-hostname:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.filters.cors]
    description: HTTPRoute CORS filter on catch-all route (no hostnames) routes correctly
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: same-namespace, namespace: gateway-conformance-infra}
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: http, port: 80, protocol: HTTP}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: infra-backend-v1, namespace: gateway-conformance-infra}
          spec:
            ports:
              - {port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: cors-wildcard-origin, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - "*"
                      allowMethods: ["PUT"]
                      allowCredentials: false
                matches:
                  - path: {type: PathPrefix, value: /cors-wildcard-origin}
                backendRefs:
                  - {name: infra-backend-v1, port: 8080}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^:[0-9]+/cors-wildcard-origin/?\\s+GW_ROUTE_ID"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\}"

  test-httproute-redirect-preserves-request-scheme:
    requires: [gatewayclasses, gateways, httproutes]
    description: RequestRedirect without spec.scheme preserves the request's scheme via txn.gw_request_scheme
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *gatewaysGatewayGw
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-svc, namespace: default}
          spec:
            ports:
              - {port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-route, namespace: default}
          spec:
            parentRefs:
              - name: gw
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /scheme-nil-and-port-nil}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org}
                backendRefs:
                  - {name: backend-svc, port: 8080}
              - matches:
                  - path: {type: PathPrefix, value: /scheme-https-and-port-nil}
                filters:
                  - type: RequestRedirect
                    requestRedirect: {hostname: example.org, scheme: https}
                backendRefs:
                  - {name: backend-svc, port: 8080}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(http\\) if !\\{ ssl_fc \\}"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(https\\) if \\{ ssl_fc \\}"

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "%\[var\(txn\.gw_request_scheme\)\]://example\.org%\[var\(txn\.gw_redir_port_part\)\]%\[path\]" code 302'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(\) if .* \{ var\(txn\.gw_listener_port\) -m int \d+ \} !\{ ssl_fc \}'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(:\),concat\(,txn\.gw_listener_port,\) if .* !\{ var\(txn\.gw_redir_port_part\) -m found \}'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://example\.org%\[path\]" code 302'

  test-httproute-request-mirror-single:
    requires: [httproutes]
    description: "HTTPRoute with a single RequestMirror filter at full traffic (no percent / fraction): appends one scheme|host:port|timeout|retries entry to txn.gw_mirror_targets and fires the single mirror-group once, plus a Content-Length-gated http-request wait-for-body on the frontend (without which req.body would be empty at the plugin; gated so a GRPCRoute sharing the frontend isn't deadlocked)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-backend, namespace: default}
          spec:
            ports:
              - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches: *matchesPathprefixApi
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-backend, namespace: default, port: 8080}}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request wait-for-body time 10s if \{ req\.hdr\(content-length\) -m found \} !\{ var\(txn\.backend_name\),map\(.*request-buffering\.map,on\) -m str off \}'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(http\|mirror-backend\.default\.svc\.cluster\.local:8080\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub-mirror mirror-group if \{ var\(txn\.gw_mirror_targets\) -m found \}'

      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\) arg_method=method'
  test-httproute-request-mirror-percent:
    requires: [httproutes]
    requiresFields: [httproutes.spec.rules.filters.requestMirror.percent]
    description: "HTTPRoute with a RequestMirror filter at 20% sampling: the target-list append is gated by an inline rand(100) lt 20 ACL on top of the route-id condition (one directive, one draw — no stored sample var)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-backend, namespace: default}
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-percent-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      percent: 20
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(http\|mirror-backend\.default\.svc\.cluster\.local:8080\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if .* \{ rand\(100\) -m int lt 20 \}'

      - {type: not_contains, target: haproxy.cfg, pattern: 'gw_mirror_sample'}

  test-httproute-request-mirror-fraction:
    requires: [httproutes]
    requiresFields: [httproutes.spec.rules.filters.requestMirror.fraction]
    description: "HTTPRoute with a RequestMirror filter using a fraction (numerator=25, denominator=50 — 50%) instead of percent. The chart normalises both forms to a percent-of-100 integer so the rand() ACL shape is uniform across config styles."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-backend, namespace: default}
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-fraction-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      fraction: {numerator: 25, denominator: 50}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(http\|mirror-backend\.default\.svc\.cluster\.local:8080\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if .* \{ rand\(100\) -m int lt 50 \}'

  test-httproute-request-mirror-multiple:
    requires: [httproutes]
    description: "HTTPRoute with two RequestMirror filters on the same rule (SupportHTTPRouteRequestMultipleMirrors). Each filter appends its own entry to txn.gw_mirror_targets; the single mirror-group is fired once and its arg_targets carries BOTH entries, so the plugin fans out to both targets from one NOTIFY. HAProxy SPOE processes each group once per stream — the list-in-one-message design is what lets a single group cover N simultaneous mirrors."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-a, namespace: default}
          spec:
            ports: [{port: 8081}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-b, namespace: default}
          spec:
            ports: [{port: 8082}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-multi-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-a, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-b, namespace: default, port: 8082}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(http\|mirror-a\.default\.svc\.cluster\.local:8081\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(http\|mirror-b\.default\.svc\.cluster\.local:8082\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub-mirror mirror-group if \{ var\(txn\.gw_mirror_targets\) -m found \}'

      - {type: not_contains, target: haproxy.cfg, pattern: 'mirror-2-group'}

  test-httproute-request-mirror-https-scheme:
    requires: [httproutes]
    description: "HTTPRoute with a RequestMirror filter pointing at a Service whose target port carries appProtocol=https. The target-list entry must start with the https scheme (not http) so the mirror plugin dispatches over TLS rather than silently downgrading."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-tls, namespace: default}
          spec:
            ports:
              - {port: 443, name: https, appProtocol: https}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-https-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-tls, namespace: default, port: 443}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_targets\) str\(https\|mirror-tls\.default\.svc\.cluster\.local:443\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if'

  test-httproute-request-mirror-static-spoe-config:
    requires: [httproutes]
    description: "Cluster with two routes carrying 1 and 3 mirror filters respectively. The SPOE config is a single static `mirror` message + `mirror-group` regardless of how many mirrors exist — no per-target slots, so nothing in spoe.conf changes as routes/mirrors are added. The 3-mirror route appends its 3 target entries to one txn.gw_mirror_targets list; the plugin fans out."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: m1, namespace: default}
          spec: {ports: [{port: 8081}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m2, namespace: default}
          spec: {ports: [{port: 8082}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m3, namespace: default}
          spec: {ports: [{port: 8083}]}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-one, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /one}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                backendRefs: [{name: api-service, port: 80}]
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-three, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /three}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m2, namespace: default, port: 8082}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m3, namespace: default, port: 8083}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      # Exactly one static mirror message + group — no numbered slots at any fanout.
      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\)'
      - {type: contains, target: file:spoe.conf, pattern: 'spoe-group mirror-group\n    messages mirror'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-group mirror-1-group'}

      # The 3-mirror route appends all three targets to the one list variable.
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(http\|m1\.default\.svc\.cluster\.local:8081\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\)'
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(http\|m2\.default\.svc\.cluster\.local:8082\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\)'
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(http\|m3\.default\.svc\.cluster\.local:8083\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\)'

  # Rewrite/redirect directive injection guard (#155). replaceFullPath /
  # replacePrefixMatch are arbitrary strings (no Gateway-API charset validation) that
  # land inside double-quoted set-path / replace-path / regsub / redirect directives; a
  # " breaks out and a newline splits the line into a new directive. Guarded before
  # emission: denied at admission, warned-and-skipped on reconcile.
  test-httproute-urlrewrite-replacefullpath-injection-reconcile-warns-and-skips:
    requires: [httproutes]
    description: A double quote in a URLRewrite ReplaceFullPath value is skipped; the set-path directive is not emitted while a valid sibling rewrite renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplaceFullPath, replaceFullPath: "/new\" if { path /rwpwned }"}
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplaceFullPath, replaceFullPath: /rwok}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-path "/rwok" if'}
      - {type: not_contains, target: haproxy.cfg, pattern: "rwpwned"}

  test-httproute-urlrewrite-replacefullpath-injection-admission-rejected:
    requires: [httproutes]
    description: A newline in a URLRewrite ReplaceFullPath value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplaceFullPath, replaceFullPath: "/new\nhttp-request set-header X-Pwned 1"}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "break out of the set-path directive"}

  test-httproute-urlrewrite-replaceprefix-injection-admission-rejected:
    requires: [httproutes]
    description: A double quote in a URLRewrite ReplacePrefixMatch value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: rw-prefix-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: "/new\"x"}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "break out of the replace-path directive"}

  test-httproute-redirect-replaceprefix-injection-admission-rejected:
    requires: [httproutes]
    description: A double quote in a RequestRedirect ReplacePrefixMatch value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: "/new\"x"}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "break out of the redirect directive"}

  test-httproute-redirect-replacefullpath-injection-reconcile-warns-and-skips:
    requires: [httproutes]
    description: A double quote in a RequestRedirect ReplaceFullPath value is skipped; the redirect directive is not emitted while a valid sibling redirect renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /a}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplaceFullPath, replaceFullPath: "/new\" code 301 if { path /redirpwned } #"}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplaceFullPath, replaceFullPath: /redirok}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'https://new\.example\.com/redirok'}
      - {type: not_contains, target: haproxy.cfg, pattern: "redirpwned"}

  # The RequestRedirect ReplacePrefixMatch branch folds the route's own match path
  # (routeInfo.pathValue) into regsub("^<sanitize_regex(path)>", ...). sanitize_regex
  # (QuoteMeta) escapes regex metacharacters but NOT a " or control character, so a
  # RegularExpression match path is a second injection vector even when the
  # replacePrefixMatch value itself is clean. The clean header match makes the rule
  # non-path-only, so the frontend routing ACL matches on the derived conflict group,
  # not the raw path — the redirect regsub is then the sole place the path is emitted,
  # isolating this fallback guard from the match-value guard.
  test-httproute-redirect-regex-path-injection-admission-rejected:
    requires: [httproutes]
    description: A double quote in a RegularExpression match path is denied by admission even when the RequestRedirect ReplacePrefixMatch value is clean.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/a\"x"}
                    headers:
                      - {type: Exact, name: X-Adv, value: adv}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "break out of the redirect directive"}

  test-httproute-redirect-regex-path-injection-reconcile-warns-and-skips:
    requires: [httproutes]
    description: A double quote in a RegularExpression match path (clean replacePrefixMatch) is skipped; the smuggled regsub content never appears while a valid sibling redirect renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/REDIRPATHPWNED\"x"}
                    headers:
                      - {type: Exact, name: X-Adv, value: adv}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'regsub\("\^/b","/clean"\)'}
      - {type: not_contains, target: haproxy.cfg, pattern: "REDIRPATHPWNED"}
