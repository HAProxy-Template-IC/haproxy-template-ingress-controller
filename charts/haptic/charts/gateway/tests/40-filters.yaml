      - {type: not_contains, target: haproxy.cfg, pattern: "redirpwned"}

  # The RequestRedirect ReplacePrefixMatch branch folds the route's own match path
  # The RequestRedirect ReplacePrefixMatch branch used to fold the route's own
  # match path into regsub("^<sanitize_regex(path)>", ...), where a " or control
  # character in a RegularExpression match path broke out even when the
  # replacePrefixMatch value itself was clean. ReplacePrefixMatch now needs a
  # PathPrefix match to take a length from, so the combination is refused before
  # the match path reaches anything.
  test-httproute-redirect-replaceprefix-on-regex-rejected:
    requires: [httproutes]
    description: ReplacePrefixMatch against a RegularExpression match has no prefix to replace, so it is refused rather than stripping the regex source's byte length off the request path.
    extraContext: {renderMode: admission}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/a\"x"}
                    headers:
                      - {type: Exact, name: X-Adv, value: adv}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "ReplacePrefixMatch on a RegularExpression path match"}

  test-httproute-redirect-regex-path-injection-reconcile-warns-and-skips:
    requires: [httproutes]
    description: A double quote in a RegularExpression match path (clean replacePrefixMatch) is skipped; the smuggled regsub content never appears while a valid sibling redirect renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      services: *servicesServiceApiService
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/REDIRPATHPWNED\"x"}
                    headers:
                      - {type: Exact, name: X-Adv, value: adv}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: redir-path-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /b}
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path: {type: ReplacePrefixMatch, replacePrefixMatch: /clean}
                      statusCode: 301
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:gw-redirect.map, pattern: 'default_redir-path-good_0 301\|https\|new\.example\.com\|\|P\|2\|%2fclean'}
      # The regex-matched rule is refused, so neither its path nor a prefix
      # length derived from it reaches the configuration or the map.
      - {type: not_contains, target: map:gw-redirect.map, pattern: 'default_redir-path-attacker_0'}
      - {type: not_contains, target: haproxy.cfg, pattern: "REDIRPATHPWNED"}
