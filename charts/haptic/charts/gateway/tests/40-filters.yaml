  test-httproute-request-mirror-multiple:
    requires: [httproutes]
    description: "HTTPRoute with two RequestMirror filters on the same rule (SupportHTTPRouteRequestMultipleMirrors). Each filter appends its own entry to txn.gw_mirror_targets; the single mirror-group is fired once and its arg_targets carries BOTH entries, so the plugin fans out to both targets from one NOTIFY. HAProxy SPOE processes each group once per stream — the list-in-one-message design is what lets a single group cover N simultaneous mirrors."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-a, namespace: default}
          spec:
            ports: [{port: 8081}]
        - apiVersion: v1
          kind: Service
          metadata: {name: mirror-b, namespace: default}
          spec:
            ports: [{port: 8082}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mirror-multi-route, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-a, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: mirror-b, namespace: default, port: 8082}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      # Both targets share one map value, ';'-separated and encoded once so the
      # runtime CLI cannot mistake the separator for a command break.
      - {type: contains, target: map:gw-mirror.map, pattern: 'default_mirror-multi-route_0 http%7cmirror-a\.default\.svc\.cluster\.local%3a8081%7c2000%7c0%3bhttp%7cmirror-b\.default\.svc\.cluster\.local%3a8082%7c2000%7c0%3b'}
      # Negative control: the raw ';' never reaches the map file.
      - {type: not_contains, target: map:gw-mirror.map, pattern: '8081\|2000\|0;'}

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub-mirror mirror-group if \{ var\(txn\.gw_mirror_targets\) -m found \}'

      - {type: not_contains, target: haproxy.cfg, pattern: 'mirror-2-group'}

  test-httproute-request-mirror-https-scheme:
    requires: [httproutes]
    description: "HTTPRoute with a RequestMirror filter pointing at a Service whose target port carries appProtocol=https. The target-list entry must start with the https scheme (not http) so the mirror plugin dispatches over TLS rather than silently downgrading."
    fixtures:
