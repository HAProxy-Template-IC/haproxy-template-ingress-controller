  test-gateway-frontend-client-cert-default-line-verify:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Mirrors the upstream Gateway API GatewayFrontendClientCertificateValidation conformance fixture: a Gateway with two HTTPS listeners on different ports — one with no hostname (port 443, default fronten."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: client-validation-default
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - kind: ConfigMap
                        group: ""
                        name: tls-validity-checks-ca-certificate
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        caCertificateRefs:
                          - kind: ConfigMap
                            group: ""
                            name: tls-validity-checks-per-port-ca-certificate
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - group: ""
                      kind: Secret
                      name: tls-validity-checks-certificate
                      namespace: gateway-conformance-infra
              - name: https-with-hostname
                port: 8443
                hostname: second-example.org
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - group: ""
                      kind: Secret
                      name: tls-validity-checks-certificate
                      namespace: gateway-conformance-infra
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-conformance-infra
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-validity-checks-certificate
