  test-backendtlspolicy-status-transition-time-preserved:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: "Sweep companion to test-gatewayclass-status-transition-time-preserved (issue #63): BackendTLSPolicy conditions live under .status.ancestors[].conditions (GEP-713 PolicyStatus), but the status snippet used RouteParentTransitionTime, which navigates .status.parents — a path that doesn't exist on policies — so every render re-stamped lastTransitionTime regardless of resource shape. The fix matches the existing ancestor entry by identity (controllerName + ancestorRef), not by index: the ancestors list read back from the apiserver can interleave entries from other controllers, so the fixture puts a foreign controller's entry FIRST (same ancestorRef, different timestamp) — positional matching would preserve the wrong entry's timestamp; identity matching must skip it and preserve ours."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-svc
            namespace: gateway-conformance-infra
          spec:
            ports:
              - port: 443
                targetPort: 8443
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ca-cert
            namespace: gateway-conformance-infra
          data:
            ca.crt: |
              -----BEGIN CERTIFICATE-----
              MIIDCzCCAfOgAwIBAgIUOaFEhrZTWgRilJ+HRB9hIBysOlMwDQYJKoZIhvcNAQEL
              BQAwFDESMBAGA1UEAwwJbG9jYWxob3N0MCAXDTI1MTExOTE4MjU1MVoYDzIxMjUx
              MDI2MTgyNTUxWjAUMRIwEAYDVQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEB
              AQUAA4IBDwAwggEKAoIBAQCX2HBp4WM+lR/Iyc/4LGMjPy4mGEqKUbnqhWQmOg1x
              4ygFI32G25fXGWcgFmVh8bFReQqu0tgY6IJ9POgZgyxsaiH3zWA2/0nGDz5o7gXy
              ygEKi7Ycs7lsE6x4cyK+kYhWofCMh2CrNK5eBW9QRxwSzbx3VDFjU/GuUZBtAUlH
              DKwfBoFG4HshFCPyvcpnNSKmGpKL0gE2s3ALsy5jjb4i2zrBx82x4cxPeIB8KzrC
              06oAupo2CuLZA1L2C+ePyRT4AlQPcN/iwZgj3+wxo/ZAIiLP+cWmF5uGWy6TDJ2l
              6+aKaaNj1BUPVJLSuovXXB2g6jF1ulH3UV5XO2ULCVsRAgMBAAGjUzBRMB0GA1Ud
              DgQWBBTGv/UXnggkJk+iNCtZqp1+SI/IhjAfBgNVHSMEGDAWgBTGv/UXnggkJk+i
              NCtZqp1+SI/IhjAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQAK
              3ot2A4rGNCXJndpy9iAkGTRy6IlBpLJRSIgRNZiYBE8HKeZu2GrgPb7WFT/TrZB6
              nc28sV7laCC5yreU1xei/fcNYOHylqgAGiEbkvRmskXSwn0JQZjzT5iukhNmPdWD
              IltmhBSqlfTlXTXk+c1YsyBkVCyMSNuFLwzd89KjreSllg19rTURiKG6FSJ6k0OI
              kTMemg3DfZnWYK+Mfpqv9UH2RnPa1Relrxi3KMfhWHvol1yIUHggOH72A8ZGzxVL
              Xx/OkI/0yz3PXo3LmRDjs33YJWK4S2dphZrKtLKhjpAHg256O3RSumgvwcic6UEc
              hJoZ+gyfZqGArrz3WVM9
              -----END CERTIFICATE-----
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: btls-route
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-svc
                    port: 443
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata:
            name: btls-policy
            namespace: gateway-conformance-infra
            generation: 2
          spec:
            targetRefs:
              - group: ""
                kind: Service
                name: backend-svc
            validation:
              caCertificateRefs:
                - group: ""
                  kind: ConfigMap
                  name: ca-cert
              hostname: backend.example.com
          status:
            ancestors:
              # Foreign controller's entry for the SAME ancestorRef comes
              # first — index-based matching would preserve its timestamp.
              - ancestorRef:
                  group: gateway.networking.k8s.io
                  kind: Gateway
                  name: gw
                controllerName: example.com/other-controller
                conditions:
                  - type: Accepted
                    status: "True"
                    reason: Accepted
                    message: Accepted by other controller
                    observedGeneration: 1
                    lastTransitionTime: "2022-09-09T09:09:09Z"
              # Our previously written entry (shape matches what the
              # snippet emits: parentRef without namespace → ancestorRef
              # without namespace; controllerName comes from the chart's
              # extraContext.controllerName default).
              - ancestorRef:
                  group: gateway.networking.k8s.io
                  kind: Gateway
                  name: gw
                controllerName: haproxy-haptic.org/controller
                conditions:
                  - type: Accepted
                    status: "True"
                    reason: Accepted
                    message: Policy accepted
                    observedGeneration: 1
                    lastTransitionTime: "2021-03-04T05:06:07Z"
                  - type: ResolvedRefs
                    status: "True"
                    reason: ResolvedRefs
                    message: All references resolved
                    observedGeneration: 1
                    lastTransitionTime: "2021-03-04T05:06:07Z"
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: "status:gateway-conformance-infra/btls-policy:rendered"
        pattern: '"lastTransitionTime":"2021-03-04T05:06:07Z"'
        expected: "2"
        description: "Unchanged Accepted=True and ResolvedRefs=True must both keep the pre-existing lastTransitionTime from haptic's own ancestor entry"
      - type: not_contains
        target: "status:gateway-conformance-infra/btls-policy:rendered"
        pattern: '"lastTransitionTime":"2022-09-09T09:09:09Z"'
        description: "The foreign controller's timestamp must not leak in — ancestor matching is by controllerName + ancestorRef, not by index"

