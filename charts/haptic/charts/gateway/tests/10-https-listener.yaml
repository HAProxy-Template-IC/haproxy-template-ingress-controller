validationTests:
  test-gateway-https-listener-with-invalid-cert-no-bind:
    requires: [gatewayclasses, gateways]
    description: "A Gateway HTTPS listener at the chart's default httpsPort with a malformed cert (Secret exists but tls."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: invalid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: malformed-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: malformed-cert
            namespace: default
          data:
            # Garbage that fails b64decode -> won't reach the PEM check
            tls.crt: bm90LWFjdHVhbGx5LXBlbQ==
            tls.key: bm90LWFjdHVhbGx5LXBlbQ==
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"

  test-gateway-https-listener-mtls-unresolved-ca-no-bind:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Closes the GatewayFrontendInvalidDefaultClientCertificateValidation conformance gap on the chart side: a Gateway HTTPS listener with a valid server cert AND `spec.tls.frontend.default."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                  frontendValidation:
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"
  test-gateway-https-listener-mtls-unresolved-ca-status-conditions:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Status-side companion of test-gateway-https-listener-mtls- unresolved-ca-no-bind. The chart-side fix for GatewayFrontendInvalidDefaultClientCertificateValidation requires BOTH:"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
    assertions:
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"InvalidCACertificateRef"'
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"NoValidCACertificate"'
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"status":"False"'
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"name":"https"'

  test-gateway-https-listener-with-valid-cert-binds:
    requires: [gatewayclasses, gateways]
    description: "The companion test to the invalid-cert case: a Gateway HTTPS listener at httpsPort with a resolvable cert sets gf [\"bindHTTPSDefault\"]=true via features-150-gateway-bind, the chart-static `bind *:443 ssl crt-list ...` renders normally, and `frontend https` exists."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: valid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "frontend https"
      - type: contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt-list"

  test-gateway-https-misdirected-listener-claim-maps:
    requires: [gatewayclasses, gateways]
    description: HTTPS listener hostnames are emitted as listener-claim maps and the misdirected directive references them
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: catch-all
                port: 443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
              - name: with-host
                port: 443
                hostname: second-example.org
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
              - name: with-wildcard
                port: 443
                hostname: "*.wildcard.org"
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^second-example\\.org second-example\\.org$"

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\$ \\*\\.wildcard\\.org$"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_sni_listener\\) ssl_fc_sni,lower,map\\("

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 421 if .* var\\(txn\\.gw_sni_listener\\),strcmp\\(txn\\.gw_host_listener\\) eq 0"
