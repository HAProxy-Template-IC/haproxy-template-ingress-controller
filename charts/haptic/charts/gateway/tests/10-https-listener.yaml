  test-gateway-backend-client-cert-shape:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    requiresFields: [gateways.spec.tls.backend]
    description: "Mirrors the upstream Gateway API GatewayBackendClientCertificateFeature conformance fixture: a Gateway with HTTP listener (port 80), an HTTPRoute pointing at a Service, a BackendTLSPolicy validating t."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-tls-backend-client-certificate
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
            tls:
              backend:
                clientCertificateRef:
                  group: ""
                  kind: Secret
                  name: tls-checks-client-certificate
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-conformance-infra
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: gateway-tls-backend-client-certificate
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: gateway-tls-backend-client-certificate
                namespace: gateway-conformance-infra
            hostnames:
              - abc.example.com
            rules:
              - backendRefs:
                  - group: ""
                    kind: Service
                    name: tls-backend-with-client-cert-validation
                    port: 443
                matches:
                  - path:
                      type: Exact
                      value: /
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tls-backend-with-client-cert-validation
            namespace: gateway-conformance-infra
          spec:
            ports:
              - name: https
