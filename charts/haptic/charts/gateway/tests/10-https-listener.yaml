  test-gateway-https-listener-dual-cert:
    requires: [gatewayclasses, gateways]
    description: "A Gateway HTTPS listener with TWO certificateRefs (ECDSA + RSA) emits both certs to the crt-list under the listener hostname, so HAProxy serves ECDSA or RSA per client capability (dual-cert via Gateway API)."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: dual-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: dual.example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                    - kind: Secret
                      name: dual-rsa-gw
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: dual-rsa-gw
            namespace: default
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_shared-tls\.pem \[ocsp-update on\] dual\.example\.com'
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_dual-rsa-gw\.pem \[ocsp-update on\] dual\.example\.com'
