validationTests:
  test-httproute-duplicate-backend-different-ports:
    requires: [httproutes]
    description: HTTPRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
              - name: admin
                port: 81
                targetPort: 8081
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: api-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: api-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: api-pod-1
          ports:
            - name: http
              port: 8080
              protocol: TCP
            - name: admin
              port: 8081
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: multi-port
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                backendRefs:
                  - name: api-svc
                    port: 80
              - matches:
                  - path:
                      type: PathPrefix
                      value: /admin
                backendRefs:
                  - name: api-svc
                    port: 81
              - matches:
                  - path:
                      type: PathPrefix
                      value: /app
                backendRefs:
                  - name: api-svc
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_api-svc_80"

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_api-svc_81"

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^backend gtw_default_multi-port_api-svc_"
        expected: "2"

      - type: contains
        target: haproxy.cfg
        pattern: "10.0.0.1:8080"

      - type: contains
        target: haproxy.cfg
        pattern: "10.0.0.1:8081"

  test-grpcroute-duplicate-backend-different-ports:
    requires: [grpcroutes]
    description: GRPCRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-svc
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
              - name: grpc-admin
                port: 9091
                targetPort: 9091
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: multi-port
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.API
                      method: Method1
                backendRefs:
                  - name: grpc-svc
                    port: 9090
              - matches:
                  - method:
                      type: Exact
                      service: com.example.Admin
                      method: Method1
                backendRefs:
                  - name: grpc-svc
                    port: 9091
              - matches:
                  - method:
                      type: Exact
                      service: com.example.App
                      method: Method1
                backendRefs:
                  - name: grpc-svc
                    port: 9090
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_grpc-svc_9090"

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_grpc-svc_9091"

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^backend gtw_default_multi-port_grpc-svc_"
        expected: "2"

  test-httproute-single-backend:
    requires: [httproutes]
    description: HTTPRoute with single backend uses BACKEND qualifier
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: app
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: single-backend
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - single.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: app
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_single-backend_app_80"

      - type: contains
        target: map:path-prefix.map
        pattern: "single.example.com/ GW_ROUTE_ID:http:default_single-backend_0"

      - type: not_contains
        target: map:weighted-multi-backend.map
        pattern: "default_single-backend"

  test-httproute-method-matching:
    requires: [httproutes]
    description: HTTPRoute with method matching (GET vs POST to same path)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: read-service
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: write-service
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: method-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                    method: GET
                backendRefs:
                  - name: read-service
                    port: 80
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                    method: POST
                backendRefs:
                  - name: write-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-prefix.map
        pattern: "api.example.com/api/ GW_ROUTE_ID:http"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_method-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_method-route_0__default_method-route_1\" \\} \\{ method GET \\}"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_method-route_1\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_method-route_0__default_method-route_1\" \\} \\{ method POST \\}"

  test-httproute-multi-hostname-map-newlines:
    requires: [httproutes]
    description: HTTPRoute with 3 hostnames must generate separate map file lines
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: app
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: multi-host
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - one.example.com
              - two.example.com
              - three.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: app
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: not_contains
        target: map:host.map
        pattern: "one\\.example\\.com one\\.example\\.comtwo\\.example\\.com"

      - type: match_count
        target: map:host.map
        pattern: "(?m)^.*\\.example\\.com .*\\.example\\.com$"
        expected: "3"

  test-grpcroute-multi-hostname-map-newlines:
    requires: [grpcroutes]
    description: GRPCRoute with 3 hostnames must generate separate map file lines
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-app
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: multi-host-grpc
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - one.example.com
              - two.example.com
              - three.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.Service
                      method: TestMethod
                backendRefs:
                  - name: grpc-app
                    port: 9090
    assertions:
      - type: haproxy_valid

      - type: not_contains
        target: map:host.map
        pattern: "one\\.example\\.com one\\.example\\.comtwo\\.example\\.com"

      - type: match_count
        target: map:host.map
        pattern: "(?m)^.*\\.example\\.com .*\\.example\\.com$"
        expected: "3"

  test-httproute-path-exact:
    requires: [httproutes]
    description: HTTPRoute with Exact path type (no prefix matching)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: exact-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: exact-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: Exact
                      value: /api/users
                backendRefs:
                  - name: exact-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-exact.map
        pattern: "api.example.com/api/users GW_ROUTE_ID:http:default_exact-route_0"

      - type: not_contains
        target: map:path-prefix.map
        pattern: "api.example.com/api/users"

  test-httproute-path-regex:
    requires: [httproutes]
    description: HTTPRoute with RegularExpression path type
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: versioned-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: regex-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: RegularExpression
                      value: "^/api/v[0-9]+/users$"
                backendRefs:
                  - name: versioned-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-regex.map
        pattern: "api\\.example\\.com\\^/api/v\\[0-9\\]\\+/users\\$ gtw_default_regex-route_versioned-service_80"

      - type: not_contains
        target: map:path-prefix.map
        pattern: "api.example.com/.*users"

  test-httproute-listener-port-matching:
    requires: [gatewayclasses, gateways, httproutes]
    description: Routes attached to listeners on different ports get port-suffixed host map entries
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-80
                port: 80
                hostname: foo.com
                protocol: HTTP
              - name: l-8080
                port: 8080
                hostname: foo.com
                protocol: HTTP
              - name: l-8090
                port: 8090
                hostname: foo.com
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-80
            namespace: default
          spec:
            parentRefs:
              - name: gw
                port: 80
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-8080
            namespace: default
          spec:
            parentRefs:
              - name: gw
                port: 8080
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-8090-by-section
            namespace: default
          spec:
            parentRefs:
              - name: gw
                sectionName: l-8090
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com foo\\.com$"

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:180[0-9][0-9] foo\\.com:180[0-9][0-9]$"

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:180[0-9][0-9] foo\\.com:180[0-9][0-9]$"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.host_full\\) req\\.hdr\\(Host\\),lower"

      # The port-scoped exact lookup (host:listener_port) MUST precede the
      # bare-host lookup, else a hostname present on several listener ports
      # (foo.com on :80/:8080/:8090) resolves every request to the bare
      # default-port backend (HTTPRouteListenerPortMatching regression).
      - type: contains
        target: haproxy.cfg
        pattern: "(?s)set-var\\(txn\\.host_match\\) var\\(txn\\.host\\),concat\\(:,txn\\.listener_port,\\),map\\(.*?set-var\\(txn\\.host_match\\) var\\(txn\\.host\\),map\\("
