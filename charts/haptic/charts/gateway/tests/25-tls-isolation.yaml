validationTests:
  test-tlsroute-gateway-address-isolation:
    requires:
    - gateways
    - tlsroutes
    extraContext:
      controllerName: haproxy-haptic.org/controller
      controllerNamespace: haptic-system
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
      perGatewayPodPortBase: 18000
      perGatewayPodPortRange: 1000
    fixtures:
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: tls-wildcard
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          gatewayClassName: haptic
          listeners:
          - name: tls
            protocol: TLS
            port: 443
            hostname: '*.example.com'
            allowedRoutes:
              namespaces:
                from: Same
              kinds:
              - kind: TLSRoute
            tls:
              mode: Passthrough
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: tls-exact
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          gatewayClassName: haptic
          listeners:
          - name: tls
            protocol: TLS
            port: 443
            hostname: abc.example.com
            allowedRoutes:
              namespaces:
                from: Same
              kinds:
              - kind: TLSRoute
            tls:
              mode: Passthrough
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          name: app
          namespace: default
        spec:
          ports:
          - port: 443
      tlsroutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: a-broad
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          parentRefs:
          - name: tls-wildcard
          hostnames:
          - '*.com'
          rules: &id001
          - backendRefs:
            - name: app
              port: 443
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: z-specific
          namespace: default
          creationTimestamp: '2024-01-02T00:00:00Z'
        spec:
          parentRefs:
          - name: tls-wildcard
          hostnames:
          - '*.example.com'
          rules: *id001
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: other-gateway
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          parentRefs:
          - name: tls-exact
          hostnames:
          - '*.example.com'
          rules:
          - backendRefs:
            - name: app
              port: 443
    assertions:
    - type: haproxy_valid
    - type: contains
      target: k8s:gateway-static-addresses
      pattern: '(?s)name: gw-default-tls-wildcard\b.*?targetPort: 18453'
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18453$
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^[ \t]+bind \*:18453$
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18453\n(?:[ \t][^\n]*\n|\n)*[ \t]+use_backend
        gtw_tls_default_z-specific_0 if
    - type: not_contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18453\n(?:[ \t][^\n]*\n|\n)*[ \t]+use_backend
        gtw_tls_default_other-gateway_0 if
    - type: contains
      target: k8s:gateway-static-addresses
      pattern: '(?s)name: gw-default-tls-exact\b.*?targetPort: 18147'
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18147$
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^[ \t]+bind \*:18147$
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18147\n(?:[ \t][^\n]*\n|\n)*[ \t]+use_backend
        gtw_tls_default_other-gateway_0 if
    - type: not_contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-18147\n(?:[ \t][^\n]*\n|\n)*[ \t]+use_backend
        gtw_tls_default_z-specific_0 if
