validationTests:
  test-tlsroute-precedence-exact-over-wildcard:
    requires:
    - gateways
    - tlsroutes
    extraContext:
      controllerName: haproxy-haptic.org/controller
    fixtures:
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: gateway
          namespace: default
        spec:
          gatewayClassName: haptic
          listeners:
          - name: tls
            protocol: TLS
            port: 443
            hostname: abc.example.com
            allowedRoutes:
              namespaces:
                from: Same
              kinds:
              - kind: TLSRoute
            tls:
              mode: Passthrough
      services: &id002
      - apiVersion: v1
        kind: Service
        metadata:
          name: app
          namespace: default
        spec:
          ports:
          - port: 443
      tlsroutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: a-broad
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          parentRefs:
          - name: gateway
          hostnames:
          - '*.example.com'
          rules: &id001
          - backendRefs:
            - name: app
              port: 443
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: z-specific
          namespace: default
          creationTimestamp: '2024-01-02T00:00:00Z'
        spec:
          parentRefs:
          - name: gateway
          hostnames:
          - abc.example.com
          rules: *id001
    assertions:
    - type: haproxy_valid
    - type: match_order
      target: haproxy.cfg
      patterns:
      - use_backend gtw_tls_default_z-specific_0 if
      - use_backend gtw_tls_default_a-broad_0 if
