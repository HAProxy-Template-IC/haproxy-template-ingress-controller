validationTests:
  test-gateway-routing-diagnostic-response-headers:
    requires: [httproutes]
    description: Gateway routing diagnostics expose the matched route, reason, and applied filters
    extraContext:
      diagnostics: {routingHeaders: {enabled: true}}
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: diagnostics, namespace: default}
          spec:
            hostnames: [diagnostics.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /}}]
                backendRefs: [{name: echo, port: 80}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Gateway-Matched-Route'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Gateway-Match-Reason'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Gateway-Filters-Applied'}
