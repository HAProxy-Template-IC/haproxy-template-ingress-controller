validationTests:
  test-cache-dispatch-timeout-gateway:
    requires:
    - httproutes
    requiresFields:
    - httproutes.spec.rules.timeouts
    extraContext:
      cache:
        varnish:
          enabled: true
        haproxy:
          responseTimeoutMs: 2000
    fixtures:
      httproutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: slow
          namespace: default
        spec:
          hostnames:
          - slow.example.com
          rules:
          - matches:
            - path:
                type: PathPrefix
                value: /
            timeouts:
              request: 2h
              backendRequest: 5s
            backendRefs:
            - name: echo
              port: 80
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:cache-dispatch-timeout.map
      pattern: (?m)^budget 28806900$
    - type: contains
      target: haproxy.cfg
      pattern: timeout server 206900ms
