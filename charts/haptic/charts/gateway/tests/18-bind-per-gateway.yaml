_fx:
  tlsSecretSharedTls: &tlsSecretSharedTls
    certificateRefs:
      - {kind: Secret, name: shared-tls, namespace: default}

validationTests:
  test-gateway-bind-per-gateway-shape:
    requires: [gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Phase 4 of the per-Gateway-IP refactor. Verifies that `https-bind-extra-100-per-gateway` emits one `bind *:<allocated-pod-port> ssl crt-list <per-listener-crt-list> alpn h2,http/1.1` line per HTTPS Gateway listener in the chart's `frontend https`, and SKIPS the bind when the listener's mTLS CA refs are unresolvable. Three listener shapes in one render:   * `gw-mixed/https-default` — catchall, AllowValidOnly default     validation → bind on allocated pod port, crt-list with     `verify required`.   * `gw-mixed/https-perport` — hostnamed, AllowInsecureFallback     per-port → bind on a different allocated pod port, crt-list     with `verify optional + ca-ignore-err all crt-ignore-err     all`.   * `gw-blocked/https` — catchall, mTLS CA ref points at a     non-existent ConfigMap → mTLS-blocked → NO bind emitted     (phase 2 didn't emit a crt-list for it either, so the     reference would fail HAProxy parse if we did)."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: haproxy
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-mixed, namespace: default}
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - {kind: ConfigMap, group: "", name: ca-cm}
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        mode: AllowInsecureFallback
                        caCertificateRefs:
                          - {kind: ConfigMap, group: "", name: ca-cm}
            listeners:
              - name: https-default
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
              - name: https-perport
                port: 8443
                hostname: second-example.org
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-blocked, namespace: default}
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - {kind: ConfigMap, group: "", name: nonexistent-ca}
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {name: ca-cm, namespace: default}
          data:
            ca.crt: |
              -----BEGIN CERTIFICATE-----
              MIIDCzCCAfOgAwIBAgIUOaFEhrZTWgRilJ+HRB9hIBysOlMwDQYJKoZIhvcNAQEL
              BQAwFDESMBAGA1UEAwwJbG9jYWxob3N0MCAXDTI1MTExOTE4MjU1MVoYDzIxMjUx
              MDI2MTgyNTUxWjAUMRIwEAYDVQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEB
              AQUAA4IBDwAwggEKAoIBAQCX2HBp4WM+lR/Iyc/4LGMjPy4mGEqKUbnqhWQmOg1x
              4ygFI32G25fXGWcgFmVh8bFReQqu0tgY6IJ9POgZgyxsaiH3zWA2/0nGDz5o7gXy
              ygEKi7Ycs7lsE6x4cyK+kYhWofCMh2CrNK5eBW9QRxwSzbx3VDFjU/GuUZBtAUlH
              DKwfBoFG4HshFCPyvcpnNSKmGpKL0gE2s3ALsy5jjb4i2zrBx82x4cxPeIB8KzrC
              06oAupo2CuLZA1L2C+ePyRT4AlQPcN/iwZgj3+wxo/ZAIiLP+cWmF5uGWy6TDJ2l
              6+aKaaNj1BUPVJLSuovXXB2g6jF1ulH3UV5XO2ULCVsRAgMBAAGjUzBRMB0GA1Ud
              DgQWBBTGv/UXnggkJk+iNCtZqp1+SI/IhjAfBgNVHSMEGDAWgBTGv/UXnggkJk+i
              NCtZqp1+SI/IhjAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQAK
              3ot2A4rGNCXJndpy9iAkGTRy6IlBpLJRSIgRNZiYBE8HKeZu2GrgPb7WFT/TrZB6
              nc28sV7laCC5yreU1xei/fcNYOHylqgAGiEbkvRmskXSwn0JQZjzT5iukhNmPdWD
              IltmhBSqlfTlXTXk+c1YsyBkVCyMSNuFLwzd89KjreSllg19rTURiKG6FSJ6k0OI
              kTMemg3DfZnWYK+Mfpqv9UH2RnPa1Relrxi3KMfhWHvol1yIUHggOH72A8ZGzxVL
              Xx/OkI/0yz3PXo3LmRDjs33YJWK4S2dphZrKtLKhjpAHg256O3RSumgvwcic6UEc
              hJoZ+gyfZqGArrz3WVM9
              -----END CERTIFICATE-----
    assertions:
      - type: haproxy_valid
      # Allocations are the allocator's sha256-derived slots (see
      # tests/15-pod-port-allocator.yaml for the recompute one-liner):
      #   default/gw-blocked:443 → 18746 (allocated, but bind skipped — mTLS-blocked)
      #   default/gw-mixed:443   → 18975
      #   default/gw-mixed:8443  → 18126
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:18975 ssl crt-list \S+/gw-default-gw-mixed-https-default-crtlist\.txt alpn h2,http/1\.1$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:18126 ssl crt-list \S+/gw-default-gw-mixed-https-perport-crtlist\.txt alpn h2,http/1\.1 ca-ignore-err all crt-ignore-err all$'
      # gw-blocked: mTLS-blocked → NO bind emitted at its allocated port.
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:18746 ssl crt-list \S+/gw-default-gw-blocked-https-crtlist\.txt'
      # Sanity: the existing chart-static `bind *:443` is still present.
      # Phase 4 ADDS per-Gateway binds; it doesn't remove the chart-static
      # path used by Ingress TLS and pinned-IP Gateways.
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:443 ssl crt-list .*/certificate-list\.txt alpn h2,http/1\.1$'
