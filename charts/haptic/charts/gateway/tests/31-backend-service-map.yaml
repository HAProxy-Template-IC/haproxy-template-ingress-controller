validationTests:
  test-gateway-backend-service-map-incremental-group:
    requires: [httproutes, grpcroutes]
    description: Grouped HTTPRoute and GRPCRoute backend-service entries keep canonical order and deduplicate repeated contributions.
    fixtures:
      services:
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: alpha}, spec: {ports: [{port: 80}]}}
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: shared}, spec: {ports: [{port: 80}]}}
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: zeta}, spec: {ports: [{port: 80}]}}
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: grpc}, spec: {ports: [{port: 9090}]}}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {namespace: default, name: z-http}
          spec: {parentRefs: [{name: gateway}], rules: [{backendRefs: [{name: zeta, port: 80}]}]}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {namespace: default, name: shared}
          spec: {parentRefs: [{name: gateway}], rules: [{backendRefs: [{name: shared, port: 80}, {name: shared, port: 80}]}]}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {namespace: default, name: a-http}
          spec: {parentRefs: [{name: gateway}], rules: [{backendRefs: [{name: alpha, port: 80}]}]}
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {namespace: default, name: z-grpc}
          spec: {parentRefs: [{name: gateway}], rules: [{backendRefs: [{name: grpc, port: 9090}]}]}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:backend-service.map
        pattern: '(?m)^gtw_default_a-http_alpha_80 default/alpha\ngtw_default_shared_shared_80 default/shared\ngtw_default_z-http_zeta_80 default/zeta\ngtw_default_z-grpc_grpc_9090 default/grpc$'
      - {type: match_count, target: map:backend-service.map, pattern: '(?m)^gtw_default_shared_shared_80 ', expected: "1"}
