validationTests:
  test-listenerset-host-gateway-status:
    requires: [gateways, listenersets]
    description: >
      A Gateway with allowedListeners plus an attached ListenerSet (multiple
      listeners sharing port 80 with different hostnames/allowedRoutes — the
      conformance ListenerSetAllowedRoutesNamespaces shape) must still get a
      status patch: Accepted and addresses ride the rendered variant, so a
      skipped patch leaves the Gateway at CRD-default status indefinitely.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: ls-host-gw, namespace: default, generation: 1}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: gateway-listener
                port: 80
                protocol: HTTP
                hostname: "gateway-listener.com"
                allowedRoutes: {namespaces: {from: All}}
            allowedListeners: {namespaces: {from: All}}
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata: {name: ls-set, namespace: default, generation: 1}
          spec:
            parentRef: {kind: Gateway, group: gateway.networking.k8s.io, name: ls-host-gw, namespace: default}
            listeners:
              - name: listener-set-listener-allowed-routes-all
                port: 80
                protocol: HTTP
                hostname: "listener-set-listener-allowed-routes-all.com"
                allowedRoutes: {namespaces: {from: All}}
              - name: listener-set-listener-allowed-routes-same
                port: 80
                protocol: HTTP
                hostname: "listener-set-listener-allowed-routes-same.com"
                allowedRoutes: {namespaces: {from: Same}}
              - name: listener-set-listener-allowed-routes-selector
                port: 80
                protocol: HTTP
                hostname: "listener-set-listener-allowed-routes-selector.com"
                allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {allowed: ns}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "status:default/ls-host-gw:rendered", pattern: '"observedGeneration":1'}
      - {type: contains, target: "status:default/ls-host-gw:rendered", pattern: '"type":"Accepted"'}
      # attachedRoutes is REQUIRED by the Gateway CRD on every ListenerStatus
      # entry (required = [attachedRoutes, conditions, name]). The deployed
      # and deployFailed variants may apply a listener entry BEFORE the
      # rendered variant creates it; an entry without attachedRoutes is then
      # rejected by the API server and the apply retries forever, flooding
      # the status applier (the exact production incident these assertions
      # pin — see the variant builders in 70-status-gateway.yaml).
      - type: contains
        target: "status:default/ls-host-gw:deployed"
        pattern: '"attachedRoutes":\d+,"conditions":\[[^]]*"type":"Programmed"'
      - type: contains
        target: "status:default/ls-host-gw:deployFailed"
        pattern: '"attachedRoutes":\d+,"conditions":\[[^]]*"type":"Programmed"'
      # attachedListenerSets must be emitted whenever the listenersets watch
      # is active (this test requires listenersets, so it only runs against
      # schema generations that know the field). The field is gated on the
      # ListenerSet schema publication because pre-v1.5 Gateway schemas
      # don't declare it and the whole rendered patch would fail at SSA
      # typed-patch construction (live-matrix finding, refs #59) — this
      # assertion is the regression guard for the field itself surviving
      # that gate. The ls-set above attaches (allowedListeners from=All,
      # listeners survive conflict detection), so the count is exactly 1.
      - {type: contains, target: "status:default/ls-host-gw:rendered", pattern: '"attachedListenerSets":1'}
