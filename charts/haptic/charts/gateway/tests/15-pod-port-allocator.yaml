validationTests:
  test-gateway-pod-port-allocator-multi-gateway:
    requires: [gateways]
    description: "Verifies that the pod-port allocator (`util-gateway-pod-port-allocator`) assigns a unique, deterministic container port to each (Gateway, port) tuple. Activated via `extraContext.dumpPodPortAllocations=true` so the allocator emits debug comments into `frontend-extra-*` for assertion. Allocation contract (pure hash-and-probe — see 15-pod-port-allocator.yaml header for why read-back designs are forbidden):   * slot = parseInt(sha256(\"<gwNs>/<gwName>:<port>\")[0:7], 16) mod range     (range default 1000), linear probing on collision in sorted-key order.   * port = base + slot, base 18000     (or `extraContext.perGatewayPodPortBase` if set).   * Only HTTP/HTTPS Gateway listeners receive an allocation —     TLS-Passthrough / TLS-Terminate listeners use     existing chart-static or per-port routing paths. The expected ports below are the sha256-derived slots for these exact keys — recompute via `python3 -c 'import hashlib; print(18000 + int(hashlib.sha256(b\"default/gw-alpha:443\").hexdigest()[:7], 16) % 1000)'` when touching fixtures."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      dumpPodPortAllocations: "true"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-zulu
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                      namespace: default
              - name: https-alt
                port: 8443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                      namespace: default
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-alpha
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                      namespace: default
              # Mixed-protocol Gateway: HTTPS listener gets allocation,
              # HTTP listener does NOT (allocator filters by protocol).
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
              # TLS-Passthrough listener: NO allocation (uses
              # ssl-tcp / per-port mode-tcp frontends instead).
              - name: tls-pass
                port: 9443
                protocol: TLS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  mode: Passthrough
    assertions:
      - type: haproxy_valid

      # One pod port is allocated per (Gateway, PORT) — HTTP and HTTPS
      # listeners both get a per-Gateway bind for listener isolation;
      # only TLS listeners are excluded. Each (Gateway, port) key hashes
      # to its own slot (sha256-derived, see description); the values
      # below are those hashes — deterministic and order-independent,
      # NOT sequential. Keys here (the per-listener key maps to its
      # (Gateway, port) pod port):
      #   default/gw-alpha:443  → 18049
      #   default/gw-alpha:80   → 18400
      #   default/gw-zulu:443   → 18968
      #   default/gw-zulu:8443  → 18418
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+# gw-pod-port: default/gw-alpha:https:443 = 18049$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+# gw-pod-port: default/gw-alpha:http:80 = 18400$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+# gw-pod-port: default/gw-zulu:https:443 = 18968$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+# gw-pod-port: default/gw-zulu:https-alt:8443 = 18418$'

      # TLS-Passthrough listeners are still excluded — they flow through
      # the chart-static `frontend ssl-tcp`, not a per-Gateway bind.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'gw-pod-port: default/gw-alpha:tls-pass:9443'
  test-gateway-pod-port-allocator-custom-base:
    requires: [gateways]
    description: "`extraContext.perGatewayPodPortBase` overrides the default 18000 base. Useful for operators whose port budget is constrained or who run HAProxy alongside other pod processes that already claim 18xxx."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      dumpPodPortAllocations: "true"
      perGatewayPodPortBase: 25000
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-only
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
                      namespace: default
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+# gw-pod-port: default/gw-only:https:443 = 25302$'

  test-gateway-listener-port-override-stands-alone:
    requires: [gatewayclasses, gateways]
    description: "Regression: base.yaml's `frontend-routing-listener-port-*` extension point must place the gateway override's first directive on its own line. The Scriggo `{{- … }}` form strips ALL adjacent whitespace INCLUDING newlines (see `charts/CLAUDE.md` \"Whitespace Control\"), which fuses the preceding comment with the rendered snippet's first output line — HAProxy then parses the directive as part of the comment and silently drops it. Symptom: `txn.listener_port` never gets remapped from pod port (e.g. 18003) back to the user-facing listener port (e.g. 443), and Gateway-API HTTPRoute RequestRedirect filters emit Location headers with the pod port. Caught in conformance shard 2/4 (HTTPRouteRedirectPortAndScheme). This test asserts both:   - the override directive appears on a line by itself (not fused)   - no comment line ends with the directive (the fused form)"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https-443
                port: 443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  certificateRefs:
                    - name: shared-tls
                      namespace: default
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+http-request set-var\(txn\.listener_port\) var\(txn\.dst_port\),map\([^)]*pod-listener-port\.map\) if \{ var\(txn\.dst_port\),map\([^)]*pod-listener-port\.map\) -m found \}$'
      - type: not_contains
        target: haproxy.cfg
        pattern: '#[^\n]*http-request set-var\(txn\.listener_port\)'
