    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gateway, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: http, port: 80, hostname: abc.example.com, protocol: HTTP}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: app, namespace: default}
          spec:
            ports:
              - {port: 80}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: older, namespace: default, creationTimestamp: '2024-01-01T00:00:00Z'}
          spec:
            parentRefs:
              - {name: gateway}
            hostnames: ['*.example.com']
            rules:
              - backendRefs:
                  - {name: app, port: 80}
                matches:
                  - headers:
                      - {name: x-match, value: 'yes'}
                      - {name: x-extra, value: 'yes'}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: newer, namespace: default, creationTimestamp: '2024-01-02T00:00:00Z'}
          spec:
            parentRefs:
              - {name: gateway}
            hostnames: [abc.example.com]
            rules:
              - backendRefs:
                  - {name: app, port: 80}
                matches:
                  - headers:
                      - {name: x-match, value: 'yes'}
    assertions:
      - {type: haproxy_valid}
      - type: match_order
        target: haproxy.cfg
        patterns: [set-var\(txn.gw_rule_id\) str\(h_default_newer_0\), set-var\(txn.gw_rule_id\) str\(h_default_older_0\)]
