validationTests:
  test-tcproute-orphan-sibling-does-not-drop-others:
    requires: [gateways, tcproutes]
    description: An orphaned TCPRoute (parentRef Gateway deleted) must NOT drop sibling routes from rendering. Regression for the Scriggo bubble-sort mis-lowering that dropped every route after an orphan.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: { name: tcp-weighted-gateway, namespace: gci }
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: tcp, protocol: TCP, port: 9300}
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: { name: tcproute-attach-newer, namespace: gci, creationTimestamp: "2026-07-02T09:00:00Z" }
          spec:
            parentRefs: [ { name: gone-gateway, sectionName: tcp } ]
            rules: [ { backendRefs: [ { name: tcp-backend-v1, port: 3000 } ] } ]
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: { name: tcp-weighted-route, namespace: gci, creationTimestamp: "2026-07-02T12:00:00Z" }
          spec:
            parentRefs: [ { name: tcp-weighted-gateway, sectionName: tcp } ]
            rules:
              - backendRefs:
                  - { name: tcp-backend-v1, port: 3000, weight: 70 }
                  - { name: tcp-backend-v2, port: 3000, weight: 30 }
                  - { name: tcp-backend-v3, port: 3000, weight: 0 }
      services:
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-backend-v1, namespace: gci }
          spec: { ports: [ { port: 3000, targetPort: 3000 } ] }
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-backend-v2, namespace: gci }
          spec: { ports: [ { port: 3000, targetPort: 3000 } ] }
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-backend-v3, namespace: gci }
          spec: { ports: [ { port: 3000, targetPort: 3000 } ] }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'frontend gateway-tcp-port-9300'}

  test-tcproute-cross-namespace-backend-without-referencegrant-not-routed:
    requires: [gateways, referencegrants, tcproutes]
    description: A TCPRoute backendRef in another namespace without a covering ReferenceGrant must not receive traffic (status reports RefNotPermitted); a permitted sibling ref still routes.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: { name: tcp-xns-gateway, namespace: gci }
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: tcp, protocol: TCP, port: 9301}
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: { name: tcp-xns-route, namespace: gci }
          spec:
            parentRefs: [ { name: tcp-xns-gateway, sectionName: tcp } ]
            rules:
              - backendRefs:
                  - { name: secret-tcp, namespace: other, port: 3000, weight: 1 }
                  - { name: tcp-local, port: 3000, weight: 1 }
      services:
        - apiVersion: v1
          kind: Service
          metadata: { name: secret-tcp, namespace: other }
          spec: { ports: [ { port: 3000, targetPort: 3000 } ] }
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-local, namespace: gci }
          spec: { ports: [ { port: 3000, targetPort: 3000 } ] }
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secret-tcp-1
            namespace: other
            labels: {kubernetes.io/service-name: secret-tcp}
          addressType: IPv4
          ports: [{port: 3000}]
          endpoints:
            - addresses: ["10.9.9.9"]
              conditions: {ready: true}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'frontend gateway-tcp-port-9301'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tcp_gci_tcp-xns-route_0'}
      - {type: not_contains, target: haproxy.cfg, pattern: '10\.9\.9\.9'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'secret-tcp'}
