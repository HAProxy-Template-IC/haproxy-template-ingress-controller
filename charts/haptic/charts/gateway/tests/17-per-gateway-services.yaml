_fx:
  tlsSecretSharedTls: &tlsSecretSharedTls
    certificateRefs:
      - {kind: Secret, name: shared-tls, namespace: default}

validationTests:
  test-gateway-per-gateway-services-shape:
    requires: [gateways]
    description: "Phase 3 of the per-Gateway-IP refactor. Verifies that `features-090-gateway-per-gateway-services` emits one LoadBalancer Service per HTTPS Gateway in the controller namespace, with port→targetPort mappings drawn from phase 1's pod-port allocator. Three Gateways exercise the gating logic:   * `gw-https`: HTTPS listener on 443, no spec.addresses → MUST     get a per-Gateway Service.   * `gw-http-only`: HTTP listener only → MUST NOT get one     (no consumer for the per-Gateway bind).   * `gw-pinned`: HTTPS listener + spec.addresses set → MUST     NOT get one from this path; the existing     `gateway-static-addresses` path handles per-IP emission."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: haproxy
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-https, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
              - name: https-alt
                port: 8443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-http-only, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes: {namespaces: {from: Same}}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-pinned, namespace: default}
          spec:
            gatewayClassName: haptic
            addresses:
              - {type: IPAddress, value: "192.0.2.10"}
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecretSharedTls
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
    assertions:
      - type: haproxy_valid

      # gw-https: per-Gateway Service emitted with both listener ports.
      - {type: contains, target: "k8s:gateway-static-addresses", pattern: 'name: gw-default-gw-https\b'}
      - {type: contains, target: "k8s:gateway-static-addresses", pattern: 'app\.kubernetes\.io/name: haptic'}
      # Both listener ports map to allocated pod ports. HTTP and HTTPS
      # listeners both get allocations (per-Gateway binds for listener
      # isolation). Ports are the allocator's sha256-derived slots for
      # each (Gateway, port) key (see tests/15-pod-port-allocator.yaml
      # for the recompute one-liner):
      #   default/gw-http-only:80 → 18281
      #   default/gw-https:8443   → 18074
      #   default/gw-https:443    → 18747
      - type: contains
        target: "k8s:gateway-static-addresses"
        pattern: '(?s)name: gw-default-gw-https.*?targetPort: 18074'
      - type: contains
        target: "k8s:gateway-static-addresses"
        pattern: '(?s)name: gw-default-gw-https.*?targetPort: 18747'
      # gw-http-only: now gets its OWN per-Gateway Service too (HTTP
      # listeners are isolated by per-Gateway bind, same as HTTPS), with
      # its :80 listener DNATed to the allocated pod port 18281.
      - {type: contains, target: "k8s:gateway-static-addresses", pattern: 'name: gw-default-gw-http-only'}
      - type: contains
        target: "k8s:gateway-static-addresses"
        pattern: '(?s)name: gw-default-gw-http-only.*?targetPort: 18281'
      # gw-pinned: NO per-Gateway Service from THIS path. The
      # static-addresses path emits per-IP Services instead.
      - type: not_contains
        target: "k8s:gateway-static-addresses"
        pattern: '(?m)^  name: gw-default-gw-pinned$'
      # The static-addresses path's per-IP Service for gw-pinned still
      # appears, just keyed by the IP suffix. (This pattern asserts
      # the pinned path remains untouched by phase 3.)
      - type: contains
        target: "k8s:gateway-static-addresses"
        pattern: 'name: gw-default-gw-pinned-192-0-2-10'
  test-k8s-haproxy-service-gateway-listener-ports:
    requires: [gatewayclasses, gateways]
    description: "Gateway listeners on non-default ports must add corresponding `gw-<port>-<proto>` port entries to the haproxy-service Service. Without these, kube-proxy doesn't route LoadBalancer-IP traffic on those ports to the haproxy pod — the upstream `HTTPRouteListenerPortMatching` conformance test failed in CI precisely because port 80 worked (default Service port) but 8080/8090 timed out (no Service port → no kube-proxy DNAT). Lives in the gateway library (not base) because the assertion fixtures reference Gateway / GatewayClass watchedResources — those only exist when the gateway library is loaded. base.yaml's `k8sResources.haproxy-service` template is what produces the rendered Service; this test exercises the cross-library interaction with gateway-supplied listener metadata."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: multi-port-gw, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: l-80, port: 80, protocol: HTTP}
              - {name: l-8080, port: 8080, protocol: HTTP}
              - {name: l-8090, port: 8090, protocol: HTTP}
    extraContext:
      haproxyService:
        type: LoadBalancer
        labels:
          app.kubernetes.io/component: loadbalancer
        selector:
          app.kubernetes.io/component: loadbalancer
        annotations: {}
        loadBalancerIP: ""
        loadBalancerClass: ""
        loadBalancerSourceRanges: []
        externalTrafficPolicy: ""
        internalTrafficPolicy: ""
        healthCheckNodePort: 0
        publishNotReadyAddresses: false
        ports:
          - {name: http, port: 80, targetPort: http, protocol: TCP}
          - {name: https, port: 443, targetPort: https, protocol: TCP}
          - {name: stats, port: 8404, targetPort: stats, protocol: TCP}
    assertions:
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: http\n"}

      - {type: contains, target: "k8s:haproxy-service", pattern: "name: gw-8080-h"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: gw-8090-h"}

      - {type: contains, target: "k8s:haproxy-service", pattern: "(?ms)name: gw-8080-h.*\\n.*port: 8080"}

      - {type: contains, target: "k8s:haproxy-service", pattern: "(?ms)name: gw-8090-h.*\\n.*port: 8090"}

  test-k8s-haproxy-service-listenerset-ports:
    requires: [gatewayclasses, gateways, listenersets]
    description: "A ListenerSet's non-default listener ports must reach the haproxy-service Service, same as a Gateway's. The two contributions are computed by separate snippets — features-141 is gated on the ListenerSet CRD so it can read the resource typed — and this pins that the gated half still lands in the Service. Without it, kube-proxy has no DNAT for the ListenerSet's ports and traffic on them times out while the Gateway's own ports work."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: ls-parent-gw, namespace: default}
          spec:
            gatewayClassName: haptic
            allowedListeners: {namespaces: {from: Same}}
            listeners:
              - {name: l-80, port: 80, protocol: HTTP}
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata: {name: svc-ports-ls, namespace: default}
          spec:
            parentRef: {name: ls-parent-gw}
            listeners:
              - {name: ls-8085, protocol: HTTP, port: 8085}
              - {name: ls-8086, protocol: HTTP, port: 8086}
    extraContext:
      haproxyService:
        type: LoadBalancer
        labels:
          app.kubernetes.io/component: loadbalancer
        selector:
          app.kubernetes.io/component: loadbalancer
        annotations: {}
        loadBalancerIP: ""
        loadBalancerClass: ""
        loadBalancerSourceRanges: []
        externalTrafficPolicy: ""
        internalTrafficPolicy: ""
        healthCheckNodePort: 0
        publishNotReadyAddresses: false
        ports:
          - {name: http, port: 80, targetPort: http, protocol: TCP}
          - {name: https, port: 443, targetPort: https, protocol: TCP}
          - {name: stats, port: 8404, targetPort: stats, protocol: TCP}
    assertions:
      - {type: contains, target: "k8s:haproxy-service", pattern: "(?ms)name: gw-8085-h.*\\n.*port: 8085"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "(?ms)name: gw-8086-h.*\\n.*port: 8086"}
