_fixtures: &backendTLSFixtures
  gatewayclasses:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata: {name: haptic}
      spec: {controllerName: haproxy.org/haptic}
  gateways:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: gateway-conformance-infra}
      spec:
        gatewayClassName: haptic
        listeners:
          - {name: http, port: 80, protocol: HTTP}
  endpoints:
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: backend-svc
        namespace: gateway-conformance-infra
        labels: {kubernetes.io/service-name: backend-svc}
      addressType: IPv4
      ports: [{port: 8443, protocol: TCP}]
      endpoints:
        - addresses: [192.0.2.10]
          conditions: {ready: true}
  services:
    - apiVersion: v1
      kind: Service
      metadata: {name: backend-svc, namespace: gateway-conformance-infra}
      spec:
        ports:
          - {port: 443, targetPort: 8443}
