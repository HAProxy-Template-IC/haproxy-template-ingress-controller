        parentRefs:
          - name: gw
        rules:
          - backendRefs:
              - {name: backend-svc, port: 443}
_policy: &backendTLSPolicy
  apiVersion: gateway.networking.k8s.io/v1
  kind: BackendTLSPolicy
  metadata: {name: btls-san-policy, namespace: gateway-conformance-infra}
  spec: &backendTLSSpec
    targetRefs:
      - {group: "", kind: Service, name: backend-svc}
    validation: &backendTLSValidation
      caCertificateRefs:
        - {group: "", kind: ConfigMap, name: ca-cert}
      hostname: sni.example.com
validationTests:
  test-backendtlspolicy-san-matching-hostname:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: A single Hostname SAN matching SNI preserves certificate verification.
    extraContext: {renderMode: reconcile}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: Hostname, hostname: sni.example.com}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'default-server check ssl ca-file [^\s]+ verify required sni str\(sni\.example\.com\) verifyhost sni\.example\.com'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"Accepted","status":"True","type":"Accepted"'}

  test-backendtlspolicy-no-san-hostname-drives-both:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: Without SANs, hostname controls SNI and certificate verification.
    extraContext: {renderMode: reconcile}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'default-server check ssl ca-file [^\s]+ verify required sni str\(sni\.example\.com\) verifyhost sni\.example\.com'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"Accepted","status":"True","type":"Accepted"'}

  test-backendtlspolicy-san-uri:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: A URI identity blocks the backend and is rejected at admission.
    extraContext: {renderMode: reconcile}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: URI, uri: "spiffe://cluster.local/ns/x/sa/y"}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 503'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'verifyhost|sni str\(sni\.example\.com\)'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"ResolvedRefs","status":"True","type":"ResolvedRefs"'}

  test-backendtlspolicy-san-uri-admission-rejected:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: A URI identity blocks the backend and is rejected at admission.
    extraContext: {renderMode: admission}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: URI, uri: "spiffe://cluster.local/ns/x/sa/y"}]
    assertions:
      - {type: contains, target: rendering_error, pattern: "BackendTLSPolicy gateway-conformance-infra/btls-san-policy: subjectAltNames must contain exactly one Hostname entry"}

  test-backendtlspolicy-san-multiple-hostnames:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: Multiple DNS alternatives cannot be reduced to the first name.
    extraContext: {renderMode: reconcile}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: Hostname, hostname: first.example.com}, {type: Hostname, hostname: second.example.com}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 503'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'verifyhost|sni str\(sni\.example\.com\)'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"ResolvedRefs","status":"True","type":"ResolvedRefs"'}

  test-backendtlspolicy-san-multiple-hostnames-admission-rejected:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: Multiple DNS alternatives cannot be reduced to the first name.
    extraContext: {renderMode: admission}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: Hostname, hostname: first.example.com}, {type: Hostname, hostname: second.example.com}]
    assertions:
      - {type: contains, target: rendering_error, pattern: "BackendTLSPolicy gateway-conformance-infra/btls-san-policy: subjectAltNames must contain exactly one Hostname entry"}

  test-backendtlspolicy-san-mixed:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: A DNS identity cannot replace a list containing a URI identity.
    extraContext: {renderMode: reconcile}
    fixtures:
      <<: *backendTLSFixtures
      backendtlspolicies:
        - <<: *backendTLSPolicy
          spec:
            <<: *backendTLSSpec
            validation:
              <<: *backendTLSValidation
              subjectAltNames: [{type: Hostname, hostname: san.example.com}, {type: URI, uri: "spiffe://cluster.local/ns/x/sa/y"}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 503'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'verifyhost|sni str\(sni\.example\.com\)'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-san-policy:rendered", pattern: '"reason":"ResolvedRefs","status":"True","type":"ResolvedRefs"'}

  test-backendtlspolicy-san-mixed-admission-rejected:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: A DNS identity cannot replace a list containing a URI identity.
    extraContext: {renderMode: admission}
    fixtures:
