_fx:
  controllerServicesService: &controllerServicesService
    - apiVersion: v1
      kind: Service
      metadata:
        name: haptic-haproxy
        namespace: haptic-system
        labels:
          app.kubernetes.io/name: haptic
          app.kubernetes.io/component: loadbalancer
      spec: {type: LoadBalancer}
      status:
        loadBalancer:
          ingress:
            - ip: "203.0.113.10"
  specHttp: &specHttp
    gatewayClassName: haproxy
    listeners:
      - {name: http, protocol: HTTP, port: 80}
  matchesPathprefixRoot: &matchesPathprefixRoot
    - path: {type: PathPrefix, value: /}

validationTests:
  test-gateway-slot-preservation:
    requires: [httproutes]
    description: |
      Gateway-side mirror of test-ingress-slot-preservation. Existing pod
      parked at SRV_3 for assertion sensitivity to actual preservation.
    currentConfig: |
      backend gtw_default_slot-route_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.1:8080 check
          server SRV_4 10.0.0.2:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: slot-svc, namespace: default}
          spec:
            ports:
              - {port: 80, targetPort: 8080}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef: {kind: Pod, name: slot-pod-1}
            - addresses: ["10.0.0.3"]
              targetRef: {kind: Pod, name: slot-pod-3}
          ports:
            - {port: 8080, protocol: TCP}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: slot-route, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - slot-test.example.com
            rules:
              - matches: *matchesPathprefixRoot
                backendRefs:
                  - {name: slot-svc, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend gtw_default_slot-route_slot-svc_80"}

      - {type: contains, target: haproxy.cfg, pattern: "server SRV_3 10\\.0\\.0\\.1:8080"}
      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_1 10\\.0\\.0\\.1:8080"}
      - {type: contains, target: haproxy.cfg, pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"}
      - {type: contains, target: haproxy.cfg, pattern: "server SRV_5 10\\.0\\.0\\.3:8080"}
      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_[12] 10\\.0\\.0\\.3:8080"}

  test-gateway-slot-preservation-lower-ip:
    requires: [httproutes]
    description: Gateway-side mirror of test-ingress-slot-preservation-lower-ip.
    currentConfig: |
      # SRV_3=10.0.0.5 kept; SRV_4=10.0.0.6 vacated; 10.0.0.2 → SRV_5.
      backend gtw_default_slot-lower_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.5:8080 check
          server SRV_4 10.0.0.6:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: slot-svc, namespace: default}
          spec:
            ports:
              - {port: 80, targetPort: 8080}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.5"]
              targetRef: {kind: Pod, name: slot-pod-5}
            - addresses: ["10.0.0.2"]
              targetRef: {kind: Pod, name: slot-pod-2}
          ports:
            - {port: 8080, protocol: TCP}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: slot-lower, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - slot-lower.example.com
            rules:
              - matches: *matchesPathprefixRoot
                backendRefs:
                  - {name: slot-svc, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "server SRV_3 10\\.0\\.0\\.5:8080"}
      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_[12] 10\\.0\\.0\\.2:8080"}
      - {type: contains, target: haproxy.cfg, pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"}
      - {type: contains, target: haproxy.cfg, pattern: "server SRV_5 10\\.0\\.0\\.2:8080"}

  test-gateway-status-patches:
    requires: [gateways, httproutes]
    description: Gateway status patches register conditions and addresses
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      controller_services: *controllerServicesService
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: my-gateway, namespace: default, generation: 3}
          spec:
            gatewayClassName: haproxy
            listeners:
              - {name: http, protocol: HTTP, port: 80}
              - {name: https, protocol: HTTPS, port: 443}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: web-route, namespace: default, generation: 1}
          spec:
            parentRefs:
              - {name: my-gateway, sectionName: http}
            hostnames:
              - example.com
            rules:
              - matches: *matchesPathprefixRoot
                backendRefs:
                  - {name: web-svc, port: 80}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: web-svc, namespace: default}
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend gtw_default_web-route"}

      - {type: contains, target: "status:default/my-gateway:rendered", pattern: '"observedGeneration":3'}
      # supportedKinds is REQUIRED on ListenerStatus entries by OLD Gateway
      # CRD schemas (v1.1/v1.4 list it in required alongside attachedRoutes/
      # conditions/name; v1.5+ dropped it). The deployed and deployFailed
      # variants may apply a listener entry BEFORE the rendered variant
      # creates it — on a live v1.1 cluster the rendered patch was rejected
      # for carrying attachedListenerSets, so the deployed patch was the
      # FIRST to create the listener entries and CRD validation rejected
      # them with "supportedKinds: Required value" (live-matrix finding,
      # refs #59). Every variant must be self-sufficient regardless of
      # phase ordering. JSON keys are sorted, so supportedKinds follows name.
      - type: contains
        target: "status:default/my-gateway:deployed"
        pattern: '"name":"http","supportedKinds":\[[^]]*"kind":"HTTPRoute"'
      - type: contains
        target: "status:default/my-gateway:deployFailed"
        pattern: '"name":"http","supportedKinds":\[[^]]*"kind":"HTTPRoute"'
  test-gateway-mixed-unsupported-protocol:
    requires: [gateways]
    description: >
      A Gateway with one supported (HTTP) and one unsupported-protocol
      listener stays Accepted=True but reports reason ListenersNotValid; the
      bad listener is Accepted=False/UnsupportedProtocol with empty
      supportedKinds. Mirrors the GatewayListenerUnsupportedProtocol
      conformance test's mixed case.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mixed-gw, namespace: default, generation: 1}
          spec:
            gatewayClassName: haproxy
            listeners:
              - {name: http, protocol: HTTP, port: 80}
              - {name: invalid, protocol: FOO, port: 9999}
    assertions:
      - type: haproxy_valid
      # Gateway stays Accepted=True but flags ListenersNotValid.
      - type: contains
        target: "status:default/mixed-gw:rendered"
        pattern: '"reason":"ListenersNotValid","status":"True","type":"Accepted"'
      # The unsupported listener is rejected with UnsupportedProtocol.
      - type: contains
        target: "status:default/mixed-gw:rendered"
        pattern: '"reason":"UnsupportedProtocol","status":"False","type":"Accepted"'

  test-httproute-status-patches:
    requires: [gateways, httproutes]
    description: HTTPRoute status patches register parent conditions with ResolvedRefs
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      controller_services: *controllerServicesService
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: my-gateway, namespace: default, generation: 2}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: app-route, namespace: default, generation: 5}
          spec:
            parentRefs:
              - name: my-gateway
            hostnames:
              - app.example.com
            rules:
              - matches: *matchesPathprefixRoot
                backendRefs:
                  - {name: app-svc, port: 80}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: app-svc, namespace: default}
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend gtw_default_app-route"}
      # Backend Service exists → ResolvedRefs stays True, no BackendNotFound.
      - type: contains
        target: "status:default/app-route:deployed"
        pattern: "All backend references resolved"
      - {type: not_contains, target: "status:default/app-route:deployed", pattern: "BackendNotFound"}

  test-httproute-status-backend-not-found:
    requires: [gateways, httproutes]
    description: |
      Companion to the Ingress degraded-backend Event (issue #66), pinning
      the Gateway API side of the same failure mode: an HTTPRoute whose
      backendRef Service is absent from the store renders (last-known-good
      routing stays up) but the parent status carries the spec-correct
      signal ResolvedRefs=False with reason BackendNotFound, so a
      Service-name typo is visible in `kubectl describe httproute` instead
      of serving 503 silently.
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: my-gateway, namespace: default, generation: 2}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: ghost-route, namespace: default, generation: 3}
          spec:
            parentRefs:
              - name: my-gateway
            hostnames:
              - ghost.example.com
            rules:
              - matches: *matchesPathprefixRoot
                backendRefs:
                  - {name: ghost-svc, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "status:default/ghost-route:deployed", pattern: '"type":"ResolvedRefs"'}
      - {type: contains, target: "status:default/ghost-route:deployed", pattern: '"reason":"BackendNotFound"'}
      - type: contains
        target: "status:default/ghost-route:deployed"
        pattern: "Backend not found: default/ghost-svc"

  test-grpcroute-status-patches:
    requires: [gateways, grpcroutes]
    description: GRPCRoute status patches register parent conditions
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      controller_services: *controllerServicesService
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: my-gateway, namespace: default, generation: 1}
          spec: *specHttp
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-route, namespace: default, generation: 2}
          spec:
            parentRefs:
              - name: my-gateway
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method: {service: mypackage.MyService, method: MyMethod, type: Exact}
                backendRefs:
                  - {name: grpc-svc, port: 9090}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-svc, namespace: default}
          spec:
            ports:
              - port: 9090
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend gtw_default_grpc-route"}

  test-gateway-status-listeners-typed-shape:
    requires: [gatewayclasses, gateways]
    description: "Regression test for MR !987: when a Gateway arrives with .status.listeners already populated (the typical state after the first reconcile), the production renderer wraps it into a typed *resources.gateways.T whose Status.Listeners is a typegen-built struct slice. Earlier macros in util-condition-transition-time did `.(map[string]any)` on each listener entry and panicked on the typed shape:   interface conversion: interface {} is struct { AttachedRoutes int64; ... }, not map[string]interface {} That panic deadlocked the leader-only Coordinator, crashed every leader reconciliation, and surfaced as ALL gateway-conformance + e2e-TLS jobs failing (pipeline 2548908046). This test exercises the exact production path: a Gateway with pre-populated .status.listeners drives Programmed/ResolvedRefs/Accepted conditions through ListenerTransitionTime; the fixture matches what the kube-apiserver returns after the first reconcile, so the dig() path through typed structs is the same one production hits."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haproxy}
          spec: {controllerName: "haproxy.org/haptic"}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: typed-status-gw, namespace: default, generation: 2}
          spec: *specHttp
          status:
            # Pre-populated status: the production kube-apiserver returns
            # this shape after the first reconcile; the renderer wraps it
            # into a typed struct, and the chart's ListenerTransitionTime
            # macro must handle that without panicking on a map[string]any
            # assertion.
            conditions:
              - type: Accepted
                status: "True"
                reason: Accepted
                message: Gateway accepted
                observedGeneration: 1
                lastTransitionTime: "2026-05-24T00:00:00Z"
            listeners:
              - name: http
                attachedRoutes: 0
                supportedKinds:
                  - {group: gateway.networking.k8s.io, kind: HTTPRoute}
                conditions:
                  - type: Accepted
                    status: "True"
                    reason: Accepted
                    message: Listener accepted
                    observedGeneration: 1
                    lastTransitionTime: "2026-05-24T00:00:00Z"
                  - type: Programmed
                    status: "True"
                    reason: Programmed
                    message: Listener programmed
                    observedGeneration: 1
                    lastTransitionTime: "2026-05-24T00:00:00Z"
                  - type: ResolvedRefs
                    status: "True"
                    reason: ResolvedRefs
                    message: All references resolved
                    observedGeneration: 1
                    lastTransitionTime: "2026-05-24T00:00:00Z"
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "status:default/typed-status-gw:rendered"
        pattern: '"type":"Accepted"'
        description: "Rendered status patch must exist and carry the Accepted condition"
      # Transition-time stickiness through the typed shape (issue #63):
      # the fixture's pre-populated conditions carry an old timestamp;
      # for every condition whose status is unchanged the patch must
      # keep that timestamp instead of re-stamping `now` — top-level
      # Accepted plus listener Accepted/ResolvedRefs in rendered,
      # listener Programmed in deployed.
      - type: contains
        target: "status:default/typed-status-gw:rendered"
        pattern: '"lastTransitionTime":"2026-05-24T00:00:00Z"'
        description: "Unchanged conditions in the rendered patch must preserve the pre-existing lastTransitionTime (typed .status.conditions / .status.listeners path)"
      - type: contains
        target: "status:default/typed-status-gw:deployed"
        pattern: '"lastTransitionTime":"2026-05-24T00:00:00Z"'
        description: "Unchanged listener Programmed condition in the deployed patch must preserve the pre-existing lastTransitionTime"

  test-gatewayclass-status-transition-time-preserved:
    requires: [gatewayclasses]
    description: "Reproduction for issue #63: the controller-created GatewayClass got an SSA status update ~1/s under e2e load because the Accepted condition's lastTransitionTime was re-stamped on every render while type/status/reason/message stayed identical. Each write bumped resourceVersion, produced a watch event on the watched gatewayclasses resource, and re-triggered reconciliation — a self-feeding loop. Root cause: transitionTime() only handled []any-of-map conditions; in production (schemas loaded) dig(gc, 'status', 'conditions') returns a typegen-built typed slice, so the helper silently fell back to `now`. This test runs with --schema-dir (typed fixtures, same shape as production) and pins that an unchanged Accepted=True keeps its original timestamp, which lets the statusapplier checksum dedup absorb the loop."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haproxy, generation: 3}
          spec: {controllerName: "haproxy.org/haptic"}
          status:
            conditions:
              - type: Accepted
                status: "True"
                reason: Accepted
                message: GatewayClass accepted by haproxy-haptic controller
                observedGeneration: 2
                lastTransitionTime: "2020-01-01T00:00:00Z"
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "status:/haproxy:rendered"
        pattern: '"type":"Accepted"'
        description: "GatewayClass rendered status patch must carry the Accepted condition"
      - type: contains
        target: "status:/haproxy:rendered"
        pattern: '"status":"True"'
        description: "Accepted stays True for a valid GatewayClass"
      - type: contains
        target: "status:/haproxy:rendered"
        pattern: '"lastTransitionTime":"2020-01-01T00:00:00Z"'
        description: "Unchanged Accepted=True must keep the pre-existing lastTransitionTime — re-stamping it is the #63 churn"
