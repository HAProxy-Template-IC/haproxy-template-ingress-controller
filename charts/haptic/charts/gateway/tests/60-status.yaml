validationTests:
  test-gateway-slot-preservation:
    requires: [httproutes]
    description: |
      Gateway-side mirror of test-ingress-slot-preservation. Existing pod
      parked at SRV_3 for assertion sensitivity to actual preservation.
    currentConfig: |
      backend gtw_default_slot-route_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.1:8080 check
          server SRV_4 10.0.0.2:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: slot-pod-1
            - addresses: ["10.0.0.3"]
              targetRef:
                kind: Pod
                name: slot-pod-3
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: slot-route
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - slot-test.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: slot-svc
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_slot-route_slot-svc_80"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.1:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.3:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.3:8080"

  test-gateway-slot-preservation-lower-ip:
    requires: [httproutes]
    description: Gateway-side mirror of test-ingress-slot-preservation-lower-ip.
    currentConfig: |
      # SRV_3=10.0.0.5 kept; SRV_4=10.0.0.6 vacated; 10.0.0.2 → SRV_5.
      backend gtw_default_slot-lower_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.5:8080 check
          server SRV_4 10.0.0.6:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.5"]
              targetRef:
                kind: Pod
                name: slot-pod-5
            - addresses: ["10.0.0.2"]
              targetRef:
                kind: Pod
                name: slot-pod-2
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: slot-lower
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - slot-lower.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: slot-svc
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.5:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.2:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.2:8080"

  test-gateway-status-patches:
    requires: [gateways, httproutes]
    description: Gateway status patches register conditions and addresses
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: my-gateway
            namespace: default
            generation: 3
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: http
                protocol: HTTP
                port: 80
              - name: https
                protocol: HTTPS
                port: 443
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: web-route
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: my-gateway
                sectionName: http
            hostnames:
              - example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: web-svc
                    port: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: web-svc
            namespace: default
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_web-route"

      - type: contains
        target: "status:default/my-gateway:rendered"
        pattern: '"observedGeneration":3'
  test-gateway-mixed-unsupported-protocol:
    requires: [gateways]
    description: >
      A Gateway with one supported (HTTP) and one unsupported-protocol
      listener stays Accepted=True but reports reason ListenersNotValid; the
      bad listener is Accepted=False/UnsupportedProtocol with empty
      supportedKinds. Mirrors the GatewayListenerUnsupportedProtocol
      conformance test's mixed case.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mixed-gw
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: http
                protocol: HTTP
                port: 80
              - name: invalid
                protocol: FOO
                port: 9999
    assertions:
      - type: haproxy_valid
      # Gateway stays Accepted=True but flags ListenersNotValid.
      - type: contains
        target: "status:default/mixed-gw:rendered"
        pattern: '"reason":"ListenersNotValid","status":"True","type":"Accepted"'
      # The unsupported listener is rejected with UnsupportedProtocol.
      - type: contains
        target: "status:default/mixed-gw:rendered"
        pattern: '"reason":"UnsupportedProtocol","status":"False","type":"Accepted"'

