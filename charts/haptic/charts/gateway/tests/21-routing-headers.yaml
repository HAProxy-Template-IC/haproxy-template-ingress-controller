validationTests:
  test-httproute-header-exact:
    requires: [httproutes]
    description: HTTPRoute with exact header matching
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: v1-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: header-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    headers:
                      - {type: Exact, name: X-Version, value: v1}
                backendRefs:
                  - {name: v1-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_header-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_header-route_0\" \\} \\{ req\\.hdr\\(X-Version\\) \"v1\" \\}"

  test-httproute-header-regex:
    requires: [httproutes]
    description: HTTPRoute with regex header matching
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-header-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    headers:
                      - {type: RegularExpression, name: User-Agent, value: "^Mozilla.*"}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_regex-header-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_regex-header-route_0\" \\} \\{ req\\.hdr\\(User-Agent\\) -m reg \"\\^Mozilla\\.\\*\" \\}"

  test-httproute-query-params:
    requires: [httproutes]
    description: HTTPRoute with query parameter matching
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: search-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: query-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /search}
                    queryParams:
                      - {type: Exact, name: version, value: v2}
                      - {type: RegularExpression, name: filter, value: "^active.*"}
                backendRefs:
                  - {name: search-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_query-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_query-route_0\" \\} \\{ urlp\\(version\\) \"v2\" \\} \\{ urlp\\(filter\\) -m reg \"\\^active\\.\\*\" \\}"

  test-httproute-regex-dollar-escaping:
    requires: [httproutes]
    description: HTTPRoute with query parameter regex containing dollar signs for anchoring
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-dollar-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    queryParams:
                      - {type: RegularExpression, name: token, value: "^secret[0-9]+$"}
                backendRefs:
                  - {name: api-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_regex-dollar-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_regex-dollar-route_0\" \\} \\{ urlp\\(token\\) -m reg \"\\^secret\\[0-9\\]\\+\\\\\\$\" \\}"

  test-grpcroute-headers:
    requires: [grpcroutes]
    description: GRPCRoute with header matching (Exact and RegularExpression)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-api, namespace: default}
          spec:
            ports:
              - port: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-header-route, namespace: default}
          spec:
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method: {type: Exact, service: com.example.API, method: GetUser}
                    headers:
                      - {type: Exact, name: X-API-Version, value: v1}
                      - {type: RegularExpression, name: User-Agent, value: "^grpc-.*"}
                backendRefs:
                  - {name: grpc-api, port: 9090}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_grpc-header-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\}.*\\{ req\\.hdr\\(X-API-Version\\) \"v1\" \\} \\{ req\\.hdr\\(User-Agent\\) -m reg \"\\^grpc-\\.\\*\" \\}"

  test-grpcroute-method-regex:
    requires: [grpcroutes]
    description: GRPCRoute with RegularExpression method type
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-multi, namespace: default}
          spec:
            ports:
              - port: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-regex-route, namespace: default}
          spec:
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method: {type: RegularExpression, service: com.example.*, method: Get.*}
                backendRefs:
                  - {name: grpc-multi, port: 9090}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_grpc-regex-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_grpc-regex-route_0\" \\} \\{ path -m reg \"/com\\.example\\.\\*/Get\\.\\*\" \\}"
  test-httproute-all-matchers:
    requires: [httproutes]
    description: HTTPRoute with all matcher types combined (method + headers + query params)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: combined-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: combined-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    method: POST
                    headers:
                      - {type: Exact, name: Content-Type, value: application/json}
                    queryParams:
                      - {type: Exact, name: version, value: v2}
                backendRefs:
                  - {name: combined-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_combined-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"default_combined-route_0\" \\} \\{ method POST \\} \\{ req\\.hdr\\(Content-Type\\) \"application/json\" \\} \\{ urlp\\(version\\) \"v2\" \\}"

  test-grpcroute-multiple-headers:
    requires: [grpcroutes]
    description: GRPCRoute with multiple header matchers of different types
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-multi-header, namespace: default}
          spec:
            ports:
              - port: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-multi-header-route, namespace: default}
          spec:
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method: {type: Exact, service: com.example.API, method: Create}
                    headers:
                      - {type: Exact, name: X-Tenant-ID, value: tenant1}
                      - {type: Exact, name: X-Environment, value: production}
                      - {type: RegularExpression, name: Authorization, value: "^Bearer .*"}
                backendRefs:
                  - {name: grpc-multi-header, port: 9090}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "\\{ req\\.hdr\\(X-Tenant-ID\\) \"tenant1\" \\} \\{ req\\.hdr\\(X-Environment\\) \"production\" \\} \\{ req\\.hdr\\(Authorization\\) -m reg \"\\^Bearer \\.\\*\" \\}"

  test-httproute-invalid-regex:
    requires: [httproutes]
    description: HTTPRoute with invalid regex pattern (negative test)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: test-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: invalid-route, namespace: default}
          spec:
            hostnames:
              - invalid.example.com
            rules:
              - matches:
                  - headers:
                      - type: RegularExpression
                        name: X-Token
                        value: "[invalid"  # Unclosed bracket - invalid regex
                backendRefs:
                  - {name: test-service, port: 80}
    assertions:
      - {type: not_contains, target: haproxy.cfg, pattern: "invalid\\.example\\.com"}

  test-httproute-header-matching-conformance-fixture:
    requires: [gatewayclasses, gateways, httproutes]
    description: "Mirrors the upstream Gateway-API conformance suite's HTTPRouteHeaderMatching fixture: a Gateway with a wildcard-hostname HTTP listener on port 80, and an HTTPRoute whose rules use ONLY header matchers (no path, no method, no host). This is the scenario that fails in CI shards (404 instead of 200). The chart must emit set-var statements that pick the right backend based on header values, even though the request has no path-or-host specificity that would normally drive map lookups."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: same-namespace, namespace: gateway-conformance-infra}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes: {namespaces: {from: Same}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: infra-backend-v1, namespace: gateway-conformance-infra}
          spec:
            ports:
              - port: 8080
        - apiVersion: v1
          kind: Service
          metadata: {name: infra-backend-v2, namespace: gateway-conformance-infra}
          spec:
            ports:
              - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: header-matching, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - matches:
                  - headers:
                      - {name: version, value: one}
                backendRefs:
                  - {name: infra-backend-v1, port: 8080}
              - matches:
                  - headers:
                      - {name: version, value: two}
                backendRefs:
                  - {name: infra-backend-v2, port: 8080}
              - matches:
                  - headers:
                      - {name: color, value: blue}
                  - headers:
                      - {name: color, value: green}
                backendRefs:
                  - {name: infra-backend-v1, port: 8080}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "\\{ req\\.hdr\\(version\\) \"one\" \\}"}
      - {type: contains, target: haproxy.cfg, pattern: "\\{ req\\.hdr\\(color\\) \"blue\" \\}"}
  test-httproute-header-edge-cases:
    requires: [httproutes]
    description: HTTPRoute with edge case header matching (special characters)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: edge-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: edge-route, namespace: default}
          spec:
            hostnames:
              - edge.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    headers:
                      - {type: Exact, name: X-Special-Chars, value: "value-with-dashes_and_underscores.dots"}
                backendRefs:
                  - {name: edge-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "\\{ req\\.hdr\\(X-Special-Chars\\) \"value-with-dashes_and_underscores\\.dots\" \\}"
