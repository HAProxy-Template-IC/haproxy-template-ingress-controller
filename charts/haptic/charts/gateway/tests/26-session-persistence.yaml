    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy-haptic.org/controller
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-sp2
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: sticky-svc2
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: sp-route2
            namespace: default
          spec:
            parentRefs:
              - name: gw-sp2
                namespace: default
            hostnames:
              - sticky2.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                sessionPersistence:
                  type: Cookie
                backendRefs:
