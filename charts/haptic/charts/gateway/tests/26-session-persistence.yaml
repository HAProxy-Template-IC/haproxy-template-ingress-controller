                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "cookie SESSION insert indirect nocache dynamic"

  test-httproute-session-persistence-only-on-declaring-rule:
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: a sessionPersistence on one rule must NOT leak its cookie directive onto a sibling rule's distinct backend."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy-haptic.org/controller
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-sp3
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: sticky-a
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: plain-b
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: sp-route3
            namespace: default
          spec:
            parentRefs:
              - name: gw-sp3
                namespace: default
            hostnames:
              - mixed.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /sticky
                sessionPersistence:
                  sessionName: STICKY
                backendRefs:
                  - name: sticky-a
                    port: 80
              - matches:
                  - path:
                      type: PathPrefix
                      value: /plain
                backendRefs:
                  - name: plain-b
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_sp-route3_sticky-a_80.*?cookie STICKY insert"

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^  cookie .* insert "
        expected: "1"

      - type: not_contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_sp-route3_plain-b_80.*?cookie .* insert"

  test-grpcroute-session-persistence-cookie:
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: GRPCRoute rule with sessionPersistence emits the cookie-insert directive on its backend."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy-haptic.org/controller
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-spg
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-sticky
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: spg-route
            namespace: default
          spec:
            parentRefs:
              - name: gw-spg
                namespace: default
            hostnames:
              - grpc-sticky.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.API
                      method: Method1
                sessionPersistence:
                  sessionName: GRPCSESSION
                  type: Cookie
                backendRefs:
                  - name: grpc-sticky
                    port: 9090
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_spg-route_grpc-sticky_9090.*?cookie GRPCSESSION insert indirect nocache dynamic"
