validationTests:
  test-httproute-session-persistence-cookie-default:
    # sessionPersistence is an experimental-channel HTTPRoute field; skip when
    # that channel is absent (the snippet correctly emits no cookie directive,
    # so the assertion can't pass). See haptic.gatewayExperimental.disabled.
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: HTTPRoute rule with sessionPersistence (type unset → Cookie) emits the HAProxy cookie-insert + dynamic-cookie-key directives on the rule's backend."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy-haptic.org/controller
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-sp
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: sticky-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: sticky-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: sticky-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: sticky-pod-1
          ports:
            - name: http
              port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: sp-route
            namespace: default
          spec:
            parentRefs:
              - name: gw-sp
                namespace: default
            hostnames:
              - sticky.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                sessionPersistence:
                  sessionName: MYSESSION
                  type: Cookie
                  absoluteTimeout: 1h
                  idleTimeout: 10m
                backendRefs:
                  - name: sticky-svc
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_sp-route_sticky-svc_80"

      - type: contains
        target: haproxy.cfg
        pattern: "cookie MYSESSION insert indirect nocache dynamic maxlife 1h maxidle 10m"

      - type: contains
        target: haproxy.cfg
        pattern: "dynamic-cookie-key "

  test-httproute-session-persistence-cookie-defaultname:
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
