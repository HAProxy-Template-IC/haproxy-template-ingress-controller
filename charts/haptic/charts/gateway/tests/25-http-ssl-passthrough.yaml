validationTests:
  test-gateway-httproute-ssl-passthrough:
    requires: [httproutes]
    description: HTTPRoute SSLPassthrough sends the encrypted stream to its first backend.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: tls-backend}
          spec:
            ports:
              - {name: tls, port: 443, targetPort: 8443}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: tls-backend-abc
            labels: {kubernetes.io/service-name: tls-backend}
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.8"]
              targetRef: {kind: Pod, name: tls-backend-0}
          ports:
            - {name: tls, port: 8443, protocol: TCP}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {namespace: default, name: http-pass}
          spec:
            parentRefs:
              - {name: gateway}
            hostnames:
              - passthrough.example.com
            rules:
              - backendRefs:
                  - {name: tls-backend, port: 443}
              - filters:
                  - type: ExtensionRef
                    extensionRef:
                      group: haproxy-haptic.org
                      kind: SSLPassthrough
                      name: enabled
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: 'backend ssl-passthrough-default-http-pass from '}
      - {type: contains, target: haproxy.cfg, pattern: '10.0.0.8:8443'}
      - {type: contains, target: haproxy.cfg, pattern: 'use_backend ssl-passthrough-default-http-pass if \{ req_ssl_sni -m str passthrough\.example\.com \}'}
