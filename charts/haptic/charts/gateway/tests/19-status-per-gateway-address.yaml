validationTests:
  test-gateway-status-per-gateway-address:
    requires: [gateways]
    description: "Phase 5 of the per-Gateway-IP refactor. Verifies that the Gateway status patcher writes the per-Gateway LoadBalancer Service's realized LB IP into Gateway.Status.Addresses instead of the chart's main LB IP. Two Gateway shapes:   * `gw-https-allocated`: HTTPS listener, no spec.addresses,     per-Gateway Service `gw-default-gw-https-allocated`     allocated `203.0.113.50` by MetalLB → status.addresses     MUST contain that IP, NOT the chart's main IP.   * `gw-http-only`: HTTP-only Gateway → no per-Gateway Service     → status.addresses keeps using the chart's main LB IP     (existing behaviour, untouched by phase 5)."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: haproxy
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-https-allocated, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls:
                  certificateRefs:
                    - {kind: Secret, name: shared-tls, namespace: default}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-http-only, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes: {namespaces: {from: Same}}
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "10.0.0.1"
      services:
        # Pre-populate the per-Gateway Service that phase 3 will emit,
        # already with a MetalLB-allocated IP, so the status patcher
        # has something to read back. (In production, the Service is
        # written by the resourceapplier and picked up by the watcher
        # on the next reconciliation.)
        - apiVersion: v1
          kind: Service
          metadata:
            name: gw-default-gw-https-allocated
            namespace: haptic-system
            labels:
              gateway.networking.k8s.io/gateway-name: gw-https-allocated
              gateway.networking.k8s.io/gateway-namespace: default
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.50"
        # HTTP-only Gateways now also get a per-Gateway Service (they get a
        # per-Gateway HTTP bind for listener isolation), so the status
        # patcher reads THIS IP back — not the chart's main LB IP.
        - apiVersion: v1
          kind: Service
          metadata:
            name: gw-default-gw-http-only
            namespace: haptic-system
            labels:
              gateway.networking.k8s.io/gateway-name: gw-http-only
              gateway.networking.k8s.io/gateway-namespace: default
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.51"
    assertions:
      - type: haproxy_valid

      # gw-https-allocated: status.addresses uses per-Gateway Service IP.
      - type: contains
        target: 'status:default/gw-https-allocated:rendered'
        pattern: '"value":"203\.0\.113\.50"'
      - type: not_contains
        target: 'status:default/gw-https-allocated:rendered'
        pattern: '"value":"10\.0\.0\.1"'
      # gw-http-only: now uses its OWN per-Gateway Service IP (HTTP
      # listeners are isolated by per-Gateway bind, same as HTTPS), NOT
      # the chart's main LB IP.
      - {type: contains, target: 'status:default/gw-http-only:rendered', pattern: '"value":"203\.0\.113\.51"'}
      - {type: not_contains, target: 'status:default/gw-http-only:rendered', pattern: '"value":"10\.0\.0\.1"'}
