validationTests:
  test-gateway-multi-port-listener-bind:
    requires: [gatewayclasses, gateways]
    description: Gateway with listeners on extra HTTP ports emits additional bind directives
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: multi-port-gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-80
                port: 80
                protocol: HTTP
              - name: l-8080
                port: 8080
                protocol: HTTP
              - name: l-8090
                port: 8090
                protocol: HTTP
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:80$"

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:8090$"

  test-gateway-https-multi-port-listener-bind:
    requires: [gatewayclasses, gateways]
    description: "Gateway with HTTPS listeners on non-default ports emits additional `bind *:<port> ssl crt-list ...` directives in the https frontend. Verifies the https-bind-extra-* extension point: gateway."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: tls-gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-https-default
                port: 443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  # Listeners need certificateRefs for the bind-decision
                  # cert-resolvability check (features-150-gateway-bind)
                  # to greenlight the frontend rendering. Without a
                  # registered cert the listener is treated as
                  # unresolvable and dropped — same path
                  # GatewayFrontendInvalidDefaultClientCertificateValidation
                  # exercises with NoValidCACertificate.
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
              - name: l-https-8443
                port: 8443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
              - name: l-https-9443
                port: 9443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: shared-tls
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:8443 ssl crt-list .*alpn h2,http/1\\.1"

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:9443 ssl crt-list .*alpn h2,http/1\\.1"

      - type: not_contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:443 ssl crt-list .*\\n\\s*bind \\*:443 ssl crt-list"
