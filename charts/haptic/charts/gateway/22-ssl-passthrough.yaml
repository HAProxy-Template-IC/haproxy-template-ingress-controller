templateSnippets:
  util-publish-gateway-http-ssl-passthrough:
    requires: [httproutes]
    template: |
      {%- macro PublishGatewayHTTPSSLPassthrough(route any) %}
        {%%
          var hasPassthrough = false
          for _, rule := range toSlice(dig(route, "spec", "rules")) {
            for _, filter := range toSlice(dig(rule, "filters")) {
              if dig_string(filter, "", "type") != "ExtensionRef" { continue }
              var extensionRef = dig(filter, "extensionRef")
              var kind = dig_string(extensionRef, "", "kind")
              var name = dig_string(extensionRef, "", "name")
              if kind == "SSLPassthrough" || (name != "" && (name | toLower() | regex_search("ssl.*passthrough"))) {
                hasPassthrough = true
              }
            }
          }
          var namespace = dig_string(route, "", "metadata", "namespace")
          var routeName = dig_string(route, "", "metadata", "name")
        %%}
        {%- if hasPassthrough %}
        {%- for _, host := range toSlice(dig(route, "spec", "hostnames")) %}
          {%%
            show shared.Publish("backends", "0/http/" + tostring(host), map[string]any{
              "name": "ssl-passthrough-" + namespace + "-" + routeName,
              "sni": host, "namespace": namespace, "route": routeName, "route_type": "httproute",
            })
          %%}
        {%- end %}
        {%- end %}
      {%- end macro %}

  util-publish-gateway-tls-ssl-passthrough:
    requires: [gateways, namespaces, referencegrants, services, tlsroutes]
    template: |
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection %}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted %}
      {%- import "util-resource-helpers" for ListenerName, ListenerProtocol, ListenerHostname %}
      {%- macro PublishGatewayTLSSSLPassthrough(tlsRoute *resources.tlsroutes.T) %}
        {#- Pass 2: TLSRoute (Gateway API spec — TLS Passthrough listener)

            For each TLSRoute / rule that survives the listener-attachment
            filters (TLS protocol, Passthrough mode, no ProtocolConflict,
            allowedRoutes.kinds, allowedRoutes.namespaces, sectionName,
            port) AND whose backendRefs all resolve, emit one entry per
            (intersected route hostname × listener hostname). Backend
            naming: gtw_tls_<ns>_<name>_<ruleIdx>. The ssl-tcp frontend
            then renders one `use_backend ... if { req_ssl_sni -m str
            <host> }` line per entry, all pointing at the same backend
            for a given rule. -#}
        {%- if tlsRoute != nil %}
          {%- var route = tlsRoute %}
          {%%
            var nsStr = route.Metadata.Namespace
            var nameStr = route.Metadata.Name
            var routeHostnames = route.Spec.Hostnames
            var rules = route.Spec.Rules
          %%}
          {%- for ruleIdx, rule := range rules %}
            {%%
              // ResolvedRefs gate: every backendRef must point at an
              // existing core/Service. Cross-namespace refs need a
              // matching ReferenceGrant (parity with status side).
              //
              // We do NOT skip unresolved rules — instead we mark
              // their emitted entries with `invalid: true`. The
              // chart-static ssl-tcp and per-port mode-tcp frontends
              // both use this flag to:
              //   * skip use_backend emission (no real backend exists)
              //   * still register the route's claimed SNI as
              //     "claimed by the chart" so connections to it get
              //     rejected (not silently passed through to a
              //     non-existent backend or chart-static fallback).
              // Closes the upstream
              // TLSRouteInvalidBackendRefNonexistent /
              // TLSRouteInvalidBackendRefUnknownKind conformance tests
              // (the spec mandates the connection be refused, not
              // routed elsewhere).
              var ruleResolved = true
              for _, br := range rule.BackendRefs {
                var brName = br.Name
                var brNs = br.Namespace
                if brNs == "" { brNs = nsStr }
                var brGroup = br.Group
                var brKind = br.Kind
                if brKind == "" { brKind = "Service" }
                if !((brGroup == "" || brGroup == "core") && brKind == "Service") {
                  ruleResolved = false
                  break
                }
                if resources.services.GetSingle(brNs, brName) == nil {
                  ruleResolved = false
                  break
                }
                if brNs != nsStr && ReferenceGrantPermitted("gateway.networking.k8s.io", "TLSRoute", nsStr, "", "Service", brNs, brName) != "true" {
                  ruleResolved = false
                  break
                }
              }
            %%}

            {%%
              // Aggregate effective SNIs across every accepted (parentRef,
              // listener) pair for this rule, deduped per rule.
              var snisForRule = map[string]bool{}
            %%}
            {%%
              // sniMeta carries per-SNI listener-frontend metadata
              // (port, mode, hostname, Gateway identity) that the new
              // frontends-600-gateway-tls-listener consumer needs to
              // emit one mode-tcp frontend per port. The map dedupes
              // by SNI within a route, mirroring the previous
              // `snisForRule` set behaviour — first listener that
              // claims a given SNI wins.
              var sniMeta = map[string]any{}
            %%}
            {%- for _, parentRef := range route.Spec.ParentRefs %}
              {%%
                var prGroup = parentRef.Group
                if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
                var prKind = parentRef.Kind
                if prKind == "" { prKind = "Gateway" }
                var prNs = parentRef.Namespace
                if prNs == "" { prNs = nsStr }
                var prName = parentRef.Name
                var prSection = parentRef.SectionName
                var prPort = toint(parentRef.Port)
              %%}
              {%- if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" %}
                {%- continue %}
              {%- end %}
              {%- var gw = resources.gateways.GetSingle(prNs, prName) %}
              {%- if gw == nil %}
                {%- continue %}
              {%- end %}
              {%%
                // ProtocolConflict: a TLS port that hosts both
                // Passthrough and Terminate siblings yields no accepted
                // listeners on that port (parity with status patches).
                var portModes = map[int]map[string]bool{}
                for _, l := range gw.Spec.Listeners {
                  if l.Protocol == "TLS" {
                    var lp = toint(l.Port)
                    var lm = l.Tls.Mode
                    if lm == "" { lm = "Terminate" }
                    if portModes[lp] == nil { portModes[lp] = map[string]bool{} }
                    portModes[lp][lm] = true
                  }
                }
              %%}
              {%- for _, listener := range gw.Spec.Listeners %}
                {%%
                  var lName = ListenerName(listener)
                  var lProto = ListenerProtocol(listener)
                  var lPort = toint(listener.Port)
                  var lMode = listener.Tls.Mode
                  if lMode == "" { lMode = "Terminate" }
                  var lHost = ListenerHostname(listener)

                  var skipListener = false
                  if prSection != "" && prSection != lName { skipListener = true }
                  if prPort != 0 && prPort != lPort { skipListener = true }
                  if lProto != "TLS" { skipListener = true }
                  // Both TLS modes (Passthrough and Terminate) accept
                  // TLSRoutes per Gateway API. The downstream consumers
                  // filter on `mode`: existing ssl-tcp keeps reading
                  // only Passthrough entries; the new
                  // frontends-600-gateway-tls-listener snippet picks up
                  // Terminate entries (and any Passthrough on a non-
                  // chart-static port) and emits one mode-tcp frontend
                  // per listener port with SNI-based use_backend +
                  // reject-default.
                  if lMode != "Passthrough" && lMode != "Terminate" { skipListener = true }
                  var pm = portModes[lPort]
                  if pm != nil && pm["Passthrough"] && pm["Terminate"] { skipListener = true }
                %%}
                {%- if skipListener %}
                  {%- continue %}
                {%- end %}

                {%%
                  // allowedRoutes.kinds intersection: when omitted, the
                  // protocol-default kinds apply (TLS → TLSRoute).
                  var kindOk = true
                  if len(listener.AllowedRoutes.Kinds) > 0 {
                    kindOk = false
                    for _, ak := range listener.AllowedRoutes.Kinds {
                      var akG = ak.Group
                      if akG == "" { akG = "gateway.networking.k8s.io" }
                      if akG == "gateway.networking.k8s.io" && ak.Kind == "TLSRoute" {
                        kindOk = true
                        break
                      }
                    }
                  }

                  // allowedRoutes.namespaces gating.
                  var nsOk = false
                  var fromMode = listener.AllowedRoutes.Namespaces.From
                  if fromMode == "" { fromMode = "Same" }
                  switch fromMode {
                  case "Same":
                    nsOk = (nsStr == prNs)
                  case "All":
                    nsOk = true
                  case "Selector":
                    var selectorMap = listener.AllowedRoutes.Namespaces.Selector.MatchLabels
                    if selectorMap != nil {
                      var nsObj = resources.namespaces.GetSingle(nsStr)
                      if nsObj != nil {
                        // nsObj is typed *resources.namespaces.T —
                        // Metadata.Labels is map[string]string directly.
                        var allMatch = true
                        for k, v := range selectorMap {
                          var actual, ok = nsObj.Metadata.Labels[k]
                          if !ok || actual != v { allMatch = false; break }
                        }
                        nsOk = allMatch
                      }
                    }
                  }
                %%}
                {%- if !kindOk || !nsOk %}
                  {%- continue %}
                {%- end %}

                {#- Hostname intersection: empty listener hostname means
                    accept any route hostname; otherwise apply the
                    Gateway API single-pair intersection. -#}
                {%- if len(routeHostnames) == 0 %}
                  {%- continue %}
                {%- end %}
                {%- for _, rh := range routeHostnames %}
                  {%%
                    var rhStr = tostring(rh)
                    var inter = ""
                    if lHost == "" {
                      inter = rhStr
                    } else {
                      inter = HostnameSinglePairIntersection(lHost, rhStr)
                    }
                  %%}
                  {%- if inter != "" %}
                    {%- snisForRule[inter] = true %}
                    {%%
                      // First listener to claim this SNI wins for the
                      // listener-frontend metadata (matches the existing
                      // snisForRule set behaviour). Subsequent listeners
                      // contributing the same SNI to the same route
                      // route to the same backend; per-port routing is
                      // homogeneous within a route.
                      _, alreadySeen := sniMeta[inter]
                      if !alreadySeen {
                        sniMeta[inter] = map[string]any{
                          "port":              lPort,
                          "mode":              lMode,
                          "listener_hostname": lHost,
                          "gw_namespace":      prNs,
                          "gw_name":           prName,
                        }
                      }
                    %%}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}

            {#- Emit one entry per intersected SNI; backend dedup happens
                downstream in backends-501-gateway-ssl-passthrough. -#}
            {%%
              var beName = "gtw_tls_" + nsStr + "_" + nameStr + "_" + tostring(ruleIdx)
              var fixed = func(value int) string {
                var encoded = tostring(value)
                var zeroes = "0000000000"
                if len(encoded) >= len(zeroes) { return encoded }
                return zeroes[:len(zeroes)-len(encoded)] + encoded
              }
            %%}
            {%%
              // Dump the SNI set into a slice so we iterate over a known
              // shape; ranging over `map[string]bool` was producing
              // surprising loop-variable behaviour in Scriggo.
              var sniSlice = []any{}
              for k, _ := range snisForRule {
                sniSlice = append(sniSlice, k)
              }
              if len(sniSlice) > 0 {
                var definitionKey = "1/tls/" + nsStr + "/" + route.Metadata.Name + "/" + fixed(ruleIdx)
                var sortedSNIs = sort_strings(sniSlice)
                show shared.Publish("definitions", definitionKey, map[string]any{
                  "name": beName,
                  "invalid": !ruleResolved,
                  "rank": definitionKey + "/" + sortedSNIs[0],
                })
              }
            %%}
            {%- for _, sniVal := range sniSlice %}
              {%%
                var entry = map[string]any{}
                entry["name"] = beName
                entry["sni"] = sniVal
                entry["namespace"] = nsStr
                // Re-derive the route name on the spot — `nameStr` from
                // the enclosing scope was being clobbered by an inner
                // for-range; this freshly-resolved value is correct.
                entry["route"] = route.Metadata.Name
                entry["route_type"] = "tlsroute"
                entry["rule_idx"] = ruleIdx
                // Listener-frontend metadata for the new
                // frontends-600-gateway-tls-listener consumer. The
                // existing ssl-tcp consumer ignores these fields. We
                // copy from sniMeta (built inside the listener loop
                // where lPort/lMode/lHost were in scope) rather than
                // referencing those vars here — they're out of scope
                // by now, and Scriggo loop-var leakage is unreliable.
                var meta = sniMeta[tostring(sniVal)].(map[string]any)
                entry["port"] = meta["port"]
                entry["mode"] = meta["mode"]
                entry["gw_namespace"] = meta["gw_namespace"]
                entry["gw_name"] = meta["gw_name"]
                entry["listener_hostname"] = meta["listener_hostname"]
                entry["invalid"] = !ruleResolved
                show shared.Publish("backends", "1/tls/" + nsStr + "/" + route.Metadata.Name + "/" +
                  fixed(ruleIdx) + "/" + tostring(sniVal), entry)
              %%}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  gateway-ssl-passthrough-100-http:
    requires: [httproutes]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: gateway-ssl-passthrough
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-http-ssl-passthrough" for PublishGatewayHTTPSSLPassthrough -%}
      {%- var route = item -%}
      {%- if route != nil -%}{%% PublishGatewayHTTPSSLPassthrough(route) %%}{%- end -%}

  gateway-ssl-passthrough-200-tls:
    requires: [gateways, namespaces, referencegrants, services, tlsroutes]
    incremental:
      source: tlsroutes
      group: gateway-ssl-passthrough
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-tls-ssl-passthrough" for PublishGatewayTLSSSLPassthrough -%}
      {%- var route = resources.tlsroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{%% PublishGatewayTLSSSLPassthrough(route) %%}{%- end -%}

  gateway-route-attachments-300-tls:
    requires: [gateways, namespaces, tlsroutes]
    incremental:
      source: tlsroutes
      group: gateway-route-attachments
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-route-attachments" for PublishGatewayRouteAttachments -%}
      {{- PublishGatewayRouteAttachments(item, "TLSRoute", true, false) -}}

  util-gateway-tlsroute-status-bindings:
    template: |-
      {{- toJSON(map[string]any{"tlsroutes": map[string]any{
        "controllerName": extraContext | dig_string("", "controllerName"),
      }}) -}}

  status-patches-205-gateway-tlsroute:
    requires: [gateways, namespaces, referencegrants, services, tlsroutes]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-tlsroute-status-bindings" -}}'
      group: gateway-tlsroute-status
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-tlsroute-status-patches" for GenerateTLSRouteStatusPatch -%}
      {%- var route = resources.tlsroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{{- GenerateTLSRouteStatusPatch(route) -}}{%- end -%}
