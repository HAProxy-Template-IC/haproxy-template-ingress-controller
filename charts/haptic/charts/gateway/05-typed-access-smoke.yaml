templateSnippets:
  # ----------------------------------------------------------------------------
  # global-settings-001-typed-access-smoke
  #
  # End-to-end proof that the typed `resources.<name>` access path
  # wires through the offline validate path AND the production
  # renderer. Emits one HAProxy comment per Gateway using compile-time
  # typed field access (gw.Metadata.Namespace, gw.Metadata.Name) —
  # the property the typed-watched-resources work hinges on:
  #
  #   - Engine compile-time: a misspelled field (`gw.Metadata.Naamespace`)
  #     fails when the controller boots, not at the next reconcile
  #     against a live cluster. Without this snippet exercising the
  #     typed path, no chart code does, and a regression in
  #     typebootstrap could ship unnoticed.
  #
  #   - Render time: the iteration variable `gw` is `*<Generated Gateway>`,
  #     produced by the closure that the rendercontext builder binds
  #     to `resources.gateways.List`. A drift between
  #     BuildEngineDeclarations's declared shape and the runtime
  #     closure-return shape would surface as a render-time type
  #     mismatch.
  #
  # HAProxy treats `#` lines as comments — the snippet is functionally
  # a no-op in production, and the test below asserts on the comment
  # text. Hooked into `global-settings-*` rather than `frontend-extra-*`
  # because the latter is render_glob'd 4× (HTTP frontend, HTTPS
  # frontend in base + ssl). Global section is rendered once, keeping
  # production output to one comment per Gateway.
  # ----------------------------------------------------------------------------
  global-settings-001-typed-access-smoke:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-typed-access-smoke
    template: |
      {%- var gw = resources.gateways.GetSingle(
        dig_string(item, "", "metadata", "namespace"),
        dig_string(item, "", "metadata", "name")) -%}
      {%- if gw != nil %}
      # typed-access-smoke: ns={{ gw.Metadata.Namespace }} name={{ gw.Metadata.Name }}
      {%- end %}
