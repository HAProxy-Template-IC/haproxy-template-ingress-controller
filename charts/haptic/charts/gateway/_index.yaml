# Gateway API Template Library
#
# Provides Kubernetes Gateway API v1 (Standard channel) support, plus TLSRoute
# (Standard as of v1.5) and TCPRoute (Experimental channel, wired only when its
# CRD is served — see the _helm_load.unset block below).
# Documentation: ../docs/libraries/gateway.md
#
# Resources: GatewayClass, Gateway, HTTPRoute, GRPCRoute, TLSRoute, TCPRoute,
#   ReferenceGrant, BackendTLSPolicy, ListenerSet (GEP-1713).
#
# Features:
#   - HTTPRoute matching: path (Exact/PathPrefix/RegularExpression), header
#     (Exact/RegularExpression), query param, method
#   - GRPCRoute matching: service/method (Exact/RegularExpression), headers
#   - Filters: RequestHeaderModifier, ResponseHeaderModifier, RequestRedirect,
#     URLRewrite (ReplaceFullPath/ReplacePrefixMatch), RequestMirror (via the
#     SPOA-hub mirror plugin), CORS (GEP-1767), ExtensionRef
#   - Traffic splitting: weighted backends
#   - Timeouts (GEP-1742: request + backendRequest), retries (GEP-1731:
#     attempts + retry-on codes), session persistence (GEP-1619, type Cookie)
#   - TLS: listener Terminate + Passthrough (TLSRoute SNI), per-listener TLS
#     options (GEP-2907: min/max version, ciphers), BackendTLSPolicy (CA refs
#     via Secret/ConfigMap, hostname + SAN verification, well-known/system CAs)
#   - Cross-namespace refs via ReferenceGrant; allowedRoutes kinds + namespaces
#     (incl. namespace Selector); Gateway spec.addresses (static-IP binds) and
#     spec.infrastructure metadata propagation
#   - Status conditions for Gateway, *Route, GatewayClass, BackendTLSPolicy,
#     ListenerSet
#
# Architecture:
#   - util-gateway-analysis: Central cached analysis of all routes
#   - Sharded generation: Automatic parallel processing for large route sets
#   - Extension points: frontend-matchers-advanced-*, frontend-filters-*

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# Loaded only when Gateway API CRDs are detected on the cluster (via Capabilities).
_helm_load:
  enable: '{{ and .Values.controller.templateLibraries.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}'
  inject:
    - path: watchedResources.gateways.fieldSelector
      value: 'spec.gatewayClassName={{ .Values.gatewayClass.name }}'
    - path: watchedResources.gatewayclasses.fieldSelector
      value: 'spec.controllerName={{ .Values.gatewayClass.controllerName }}'
    # TCPRoute served version is version-adaptive: v1.6+ serves it at v1 (v1alpha2
    # retired), older Gateway API releases serve it only at v1alpha2. The schema
    # resolver keys typed access on (apiVersion, plural) → GVK, so the watch MUST
    # name the version the cluster actually serves. Prefer v1; fall back to
    # v1alpha2 for pre-1.6 clusters. When neither is served the unset below strips
    # the whole entry, so this value is moot in that case.
    - path: watchedResources.tcproutes.apiVersion
      value: '{{ if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/TCPRoute" }}gateway.networking.k8s.io/v1{{ else }}gateway.networking.k8s.io/v1alpha2{{ end }}'
  # TCPRoute is Experimental-channel only — its CRD is absent from the Gateway
  # API Standard install most clusters use (including CI's). Watching a
  # non-existent CRD makes the controller's watcher fail to sync so it never
  # becomes Ready, and the analysis snippet references the typed resources.tcproutes
  # field which only exists when the resource is watched. So when the TCPRoute CRD
  # is NOT served at ANY known version, strip the whole TCPRoute feature — the
  # watch, its snippets, and its tests — together. TCPRoute routing is then simply
  # inactive (there are no TCPRoutes without the CRD). Offline `helm template`
  # keeps it via --api-versions.
  unset:
    - path: watchedResources.tcproutes
      when: &noTCPRoute '{{ not (or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/TCPRoute") (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1alpha2/TCPRoute")) }}'
    - path: templateSnippets.util-gateway-tcproute-analysis
      when: *noTCPRoute
    - path: templateSnippets.backends-502-gateway-tcproute
      when: *noTCPRoute
    - path: templateSnippets.frontends-700-gateway-tcp-listener
      when: *noTCPRoute
    - path: validationTests.test-tcproute-basic-l4-forward
      when: *noTCPRoute
    - path: validationTests.test-tcproute-multi-listener-single-backend
      when: *noTCPRoute
    - path: validationTests.test-tcproute-unattached-no-frontend
      when: *noTCPRoute

watchedResources:
  gatewayclasses:
    apiVersion: gateway.networking.k8s.io/v1
    resources: gatewayclasses
    # GatewayClass is cluster-scoped, so no namespace key. metadata.name is
    # globally unique already; indexing by name lets the templates look up
    # the matching class without scanning the whole list.
    indexBy: ["metadata.name"]
    enableValidationWebhook: false
    statusPatch: true
    # fieldSelector: injected by Helm to scope to GatewayClasses we own
    # (spec.controllerName == .Values.gatewayClass.controllerName).

  gateways:
    apiVersion: gateway.networking.k8s.io/v1
    resources: gateways
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: false
    statusPatch: true
    # fieldSelector: injected by Helm from gatewayClass.name

  httproutes:
    apiVersion: gateway.networking.k8s.io/v1
    resources: httproutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # Filter by Gateway reference using label selector
    # Users can label HTTPRoutes to target specific Gateways
    # Example: kubectl label httproute my-route gateway=haproxy

  grpcroutes:
    apiVersion: gateway.networking.k8s.io/v1
    resources: grpcroutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  tlsroutes:
    # Gateway API v1.5 ships TLSRoute on the Standard channel with v1
    # served+storage (v1alpha2 / v1alpha3 are still served for backwards
    # compatibility). The conformance fixtures use the v1 apiVersion.
    apiVersion: gateway.networking.k8s.io/v1
    resources: tlsroutes
    indexBy: ["metadata.namespace", "metadata.name"]
    statusPatch: true

  tcproutes:
    # TCPRoute is on the Gateway API *Experimental* channel. As of v1.6 it
    # graduated to v1 (v1 served+storage; v1alpha2 retired); pre-1.6 releases
    # serve it only at v1alpha2. The schema resolver keys typed access on
    # (apiVersion, plural) → GVK, so this MUST name the served version or
    # `resources.tcproutes` is undefined and typed TCPRoute snippets fail to
    # compile. The _helm_load.inject above overwrites this with the version the
    # cluster actually serves (v1 preferred, else v1alpha2); the literal below is
    # just the fallback for the moot no-CRD case.
    # NOTE: this whole entry (plus the TCPRoute snippets/tests) is stripped by
    # _helm_load.unset when the cluster serves TCPRoute at no known version, so a
    # Standard-channel install never tries to watch a non-existent resource.
    apiVersion: gateway.networking.k8s.io/v1
    resources: tcproutes
    indexBy: ["metadata.namespace", "metadata.name"]
    statusPatch: true

  services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]

  endpoints:
    apiVersion: discovery.k8s.io/v1
    resources: endpointslices
    indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
    # "0" = no debounce; see ingress.yaml endpoints entry.
    debounceInterval: "0"

  namespaces:
    apiVersion: v1
    resources: namespaces
    # Cluster-scoped; metadata.name is globally unique. Watched so the
    # listener-attachment evaluator can resolve `allowedRoutes.namespaces.from:
    # Selector` against namespace labels (per Gateway API spec). Without this
    # the chart can't tell whether a route's namespace matches the listener's
    # namespace selector and the listener's `attachedRoutes` count drifts
    # from what conformance expects.
    indexBy: ["metadata.name"]

  referencegrants:
    apiVersion: gateway.networking.k8s.io/v1beta1
    resources: referencegrants
    # ReferenceGrant lives in the namespace that GRANTS access. Index by
    # namespace+name so the cert/backend-ref validators can list grants
    # in a target namespace efficiently. Per Gateway API spec, a
    # cross-namespace cert ref or backendRef is permitted iff a
    # ReferenceGrant in the TARGET namespace lists the source's
    # group/kind/namespace under spec.from and the target's group/kind
    # (and optional name) under spec.to.
    indexBy: ["metadata.namespace", "metadata.name"]

  listenersets:
    apiVersion: gateway.networking.k8s.io/v1
    resources: listenersets
    # ListenerSet (GEP-1713) lets users add listeners to a Gateway from
    # a separate resource — designed for shared-frontend dataplanes
    # (which is haptic's exact architecture). Indexed by namespace +
    # name so route-resolution sites can `GetSingle(lsNs, lsName)` the
    # exact ListenerSet a parentRef points at. Per-Gateway iteration
    # uses `resources.listenersets.List()` and filters in template code
    # (the typical Gateway has at most a handful of attached
    # ListenerSets so the linear scan is cheap).
    indexBy: ["metadata.namespace", "metadata.name"]
    statusPatch: true

  backendtlspolicies:
    apiVersion: gateway.networking.k8s.io/v1
    resources: backendtlspolicies
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: false
    statusPatch: true

  configmaps:
    apiVersion: v1
    resources: configmaps
    # Watched only so BackendTLSPolicy CACertificateRefs that point at
    # ConfigMaps can be resolved (Core support per Gateway API spec).
    indexBy: ["metadata.namespace", "metadata.name"]
    # This is an unscoped cluster-wide watch, but the chart only ever reads a
    # handful of ConfigMaps by name (GetSingle) for CA bundles — it never
    # List()s them. Keeping every cluster ConfigMap body resident in a full
    # MemoryStore is pure overhead, so use on-demand (CachedStore): only
    # references stay resident and bodies are fetched live on access. Combined
    # with informer body projection (ADR-0012), even the informer cache drops
    # the bodies. Same access profile as the secrets watch.
    store: on-demand
