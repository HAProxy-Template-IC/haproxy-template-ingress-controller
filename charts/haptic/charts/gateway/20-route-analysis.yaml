                {%- if matchCount > 0 %}
                  {%- var match = rule.Matches[matchIdx] %}
                  {%- hasMethod = (match.Method.Service != "" || match.Method.Method != "") %}
                  {%- headerCount = len(match.Headers) %}
                {%- end %}
                {%- var grpcPath = map[string]any{"type": "PathPrefix", "value": "/"} %}
                {%- var pathKey = hostname + "|PathPrefix|/" %}
                {%- var routeInfo = map[string]any{
                  "route": route,
                  "hostname": hostname,
                  "ruleIdx": ruleIdx,
                  "matchIdx": matchIdx,
                  "pathKey": pathKey,
                  "pathType": "PathPrefix",
                  "pathValue": "/",
                  "pathValueLen": 1,
                  "hasMethod": hasMethod,
                  "headerCount": headerCount,
                  "queryParamCount": 0,
                } %}
                {%- allRoutes = append(allRoutes, routeInfo) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Group by path key to detect conflicts #}
        {%- var pathGroups = group_by(allRoutes, "pathKey") %}

        {#- Check for conflicts and mark routes needing VAR qualifier.
            "Conflict" here means two routes share the same pathKey
            but have different method / header / queryParam matchers
            — the chart needs a per-route VAR qualifier in the
            rendered http-request rules so the matchers pick the
            right backend. The conditions key is the deterministic
            serialisation of the matcher set; two routes with
            identical sets share a key and don't conflict. -#}
        {%%
          {#- buildConditions(routeInfo) reads the matcher set from
              the typed route + ruleIdx/matchIdx (per ADR-0010).
              Two sibling cases — HTTPRouteMatch has a string Method;
              GRPCRouteMatch has a struct Method that we serialise
              Type/Service/Method into a comparable string here. -#}
          var buildConditions = func(ri any) string {
            var rm = ri.(map[string]any)
            var ruleIdx = toint(rm["ruleIdx"])
            var matchIdx = toint(rm["matchIdx"])
            var conditions = ""
            switch r := rm["route"].(type) {
            case *resources.httproutes.T:
              if ruleIdx < 0 || ruleIdx >= len(r.Spec.Rules) {
                return conditions
              }
              var rule = r.Spec.Rules[ruleIdx]
              if matchIdx < 0 || matchIdx >= len(rule.Matches) {
                return conditions
              }
              var match = rule.Matches[matchIdx]
              if match.Method != "" {
                conditions = conditions + "method:" + match.Method
              }
              for _, h := range match.Headers {
                conditions = conditions + ";header:" + h.Name + "=" + h.Value
              }
              for _, p := range match.QueryParams {
                conditions = conditions + ";param:" + p.Name + "=" + p.Value
              }
            case *resources.grpcroutes.T:
              if ruleIdx < 0 || ruleIdx >= len(r.Spec.Rules) {
                return conditions
              }
              var rule = r.Spec.Rules[ruleIdx]
              if matchIdx < 0 || matchIdx >= len(rule.Matches) {
                return conditions
              }
              var match = rule.Matches[matchIdx]
              // GRPCRouteMatch.Method is a struct (Type/Service/
              // Method), not a string — serialise into the same
              // shape the previous polymorphic dig+tostring produced.
              if match.Method.Service != "" || match.Method.Method != "" {
                conditions = conditions + "method:" + match.Method.Type + "/" + match.Method.Service + "/" + match.Method.Method
              }
              for _, h := range match.Headers {
                conditions = conditions + ";header:" + h.Name + "=" + h.Value
              }
              // GRPCRoute has no QueryParams field — skip.
            }
            return conditions
          }
        %%}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var routes []any = pathGroups[pathKey] %}
          {%- var hasConflicts = false %}
          {%- if len(routes) > 1 %}
            {%- var firstConditions = buildConditions(routes[0]) %}
            {%- for i := 1; i < len(routes); i++ %}
              {%- if buildConditions(routes[i]) != firstConditions %}
                {%- hasConflicts = true %}
              {%- end %}
            {%- end %}
          {%- end %}

          {#- Rebuild routes list with updated dicts #}
          {%- var updatedRoutes = []any{} %}
          {%- for _, route := range routes %}
            {%- var routeObj = route["route"] %}
            {%- var routeNs = routeObj | dig("metadata", "namespace") | fallback("") %}
            {%- var routeName = routeObj | dig("metadata", "name") | fallback("") %}
            {%- var ruleIdxVal = route["ruleIdx"] %}
            {%- var routeId = routeNs + "_" + routeName + "_" + (ruleIdxVal) %}
            {%- var updatedRoute = merge(route, map[string]any{
              "hasConflicts": hasConflicts,
              "pathKey": pathKey,
              "routeId": routeId,
            }) %}
            {%- updatedRoutes = append(updatedRoutes, updatedRoute) %}
          {%- end %}

          {#- Build conflictGroup string #}
          {%- var routeIds = map_extract(updatedRoutes, "routeId") %}
          {%- var conflictGroup = join(sort_strings(routeIds), "__") %}

          {#- Add conflictGroup to each route #}
          {%- var finalRoutes = []any{} %}
          {%- for _, route := range updatedRoutes %}
            {%- var routeWithGroup = merge(route, map[string]any{"conflictGroup": conflictGroup}) %}
            {%- finalRoutes = append(finalRoutes, routeWithGroup) %}
          {%- end %}

          {#- Update pathGroups with modified routes #}
          {%- pathGroups[pathKey] = finalRoutes %}
        {%- end %}

        {#- Rebuild allRoutes from updated pathGroups #}
        {%- var finalAllRoutes = []any{} %}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var pathRoutes []any = pathGroups[pathKey] %}
          {%- for _, route := range pathRoutes %}
            {%- finalAllRoutes = append(finalAllRoutes, route) %}
          {%- end %}
        {%- end %}

        {#- Sort by precomputed scalars (set during routeInfo emission)
            rather than dig'ing into the legacy `$.match.*` / `$.path.*`
            polymorphic slots. The :desc modifier on the bool /
            length-based criteria gives the existing
            most-specific-first ordering. -#}
        {%- var sortedRoutes = finalAllRoutes | sort_by([]string{
          "$.pathType",
          "$.pathValueLen:desc",
          "$.hasMethod:desc",
          "$.headerCount:desc",
          "$.queryParamCount:desc",
          "$.route.metadata.creationTimestamp",
          "$.route.metadata.namespace ~ '/' ~ $.route.metadata.name",
          "$.ruleIdx",
        }) %}

        {#- Pre-compute filter existence flags (optimization: avoids repeated iteration) #}
        {%- var hasRequestHeader = false %}
        {%- var hasResponseHeader = false %}
        {%- var hasRedirect = false %}
        {%- var hasUrlrewrite = false %}
        {%- var hasMirror = false %}
        {#- The count of (message, group) pairs the SPOA-hub library
            needs to allocate for the mirror plugin: equal to the
            number of RequestMirror filters on whichever route has the
            most. NOT a cap — the chart allocates exactly as many
            slots as the workload demands. HAProxy SPOE processes each
            group at most once per stream, so a route with N mirror
            filters needs N distinct (message, group) pairs to fire
            all N NOTIFY frames in one stream; the cluster-wide max
            determines how many message names get declared in the
            rendered spoe.conf + the hub plugin's TOML messages list.
            Consumed by spoa-hub.yaml's spoa-hub-config-content (hub
            TOML) and spoe-conf-content (HAProxy SPOE config), via
            globalFeatures["mirrorMaxFanout"]. The key name is
            resource-neutral so the spoa-hub library can read it without
            embedding Gateway-API "Route" terminology in its consumer
            code — a hypothetical CRD-based routing layer that uses
            mirror filters would produce the same key. -#}
        {%- var mirrorFanout = 0 %}
        {%%
          // Type-switch on routeInfo["route"] to read filters via the
          // typed rule struct. Filter type strings
          // (RequestHeaderModifier / etc.) match the schema's enum
          // values for both Kinds.
          for _, route := range finalAllRoutes {
            var rm = route.(map[string]any)
            var ruleIdx = toint(rm["ruleIdx"])
            var perRouteMirrors = 0
            switch r := rm["route"].(type) {
            case *resources.httproutes.T:
              if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
                for _, filter := range r.Spec.Rules[ruleIdx].Filters {
                  switch filter.Type {
                  case "RequestHeaderModifier":
                    hasRequestHeader = true
                  case "ResponseHeaderModifier":
                    hasResponseHeader = true
                  case "RequestRedirect":
                    hasRedirect = true
                  case "URLRewrite":
                    hasUrlrewrite = true
                  case "RequestMirror":
                    hasMirror = true
                    perRouteMirrors = perRouteMirrors + 1
                  }
                }
              }
            case *resources.grpcroutes.T:
              if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
                for _, filter := range r.Spec.Rules[ruleIdx].Filters {
                  switch filter.Type {
                  case "RequestHeaderModifier":
                    hasRequestHeader = true
                  case "ResponseHeaderModifier":
                    hasResponseHeader = true
                  case "RequestMirror":
                    hasMirror = true
                    perRouteMirrors = perRouteMirrors + 1
                  }
                  // GRPCRouteFilter has no RequestRedirect or
                  // URLRewrite cases per the spec — schema-enforced
                  // by typegen.
                }
              }
            }
            if perRouteMirrors > mirrorFanout {
              mirrorFanout = perRouteMirrors
            }
          }
        %%}

        {#- Populate result map with analysis data #}
        {%- result["pathGroups"] = pathGroups %}
        {%- result["sortedRoutes"] = sortedRoutes %}
        {%- result["allRoutes"] = finalAllRoutes %}
        {#- Filter existence flags for optimized filter template rendering #}
        {%- result["hasRequestHeader_filter"] = hasRequestHeader %}
        {%- result["hasResponseHeader_filter"] = hasResponseHeader %}
        {%- result["hasRedirect_filter"] = hasRedirect %}
        {%- result["hasUrlrewrite_filter"] = hasUrlrewrite %}
        {%- result["hasMirror_filter"] = hasMirror %}
        {%- result["mirrorMaxFanout"] = mirrorFanout %}
        {#- Cross-library: spoa-hub.yaml's spoe-conf-content +
            spoa-hub-config-content snippets read this off
            globalFeatures to size the mirror message list. Defensive
            init via ComputeIfAbsent — util-gateway-analysis runs in
            multiple render contexts (haproxyConfig template, map-
            file templates, status patches), and not all of them
            pre-init globalFeatures via ssl.yaml's features snippet
            or base.yaml's k8sResources. Without this init the type
            assertion below panics on a nil shared.Get result,
            erroring the whole render → controller logs an error and
            never publishes HTTPRoute status updates → conformance
            tests time out waiting for "parents matching expectations". -#}
        {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any {
            return map[string]any{}
        }) %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- gf["mirrorMaxFanout"] = mirrorFanout %}
      {%- end macro %}
