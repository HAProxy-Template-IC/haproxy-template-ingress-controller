templateSnippets:
  util-gateway-route-effective-hosts-incremental:
    requires: [gateways, namespaces, configmaps, secrets]
    template: |
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection, HostnameSinglePairMatch, HostnameRank -%}
      {%- import "util-listenerset-routing-gate" for IsRouteAllowedOnListener -%}
      {%- import "util-resource-helpers" for ListenerProtocolOr, ListenerHostname -%}
      {%- import "util-gw-mtls-blocked-value" for ComputeGwMtlsBlockedValue -%}
      {%- macro GatewayRouteEffectiveHosts(route any, effectiveHosts map[string]bool) -%}
      {%%
        var routeNs = dig_string(route, "", "metadata", "namespace")
        var routeHostnames = toSlice(dig(route, "spec", "hostnames"))
        var resolvedParentCount = 0
        for _, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
          var parentGroup = dig_string(parentRef, "", "group")
          if parentGroup == "" { parentGroup = "gateway.networking.k8s.io" }
          var parentKind = dig_string(parentRef, "", "kind")
          if parentKind == "" { parentKind = "Gateway" }
          if parentGroup != "gateway.networking.k8s.io" {
            continue
          }
          var section = dig_string(parentRef, "", "sectionName")
          var parentPort = toint(dig(parentRef, "port") | fallback(0))
          if parentKind == "Gateway" {
            var gatewayNs = dig_string(parentRef, routeNs, "namespace")
            if gatewayNs == "" { gatewayNs = routeNs }
            var gatewayName = dig_string(parentRef, "", "name")
            var gateway = resources.gateways.GetSingle(gatewayNs, gatewayName)
            if gateway == nil {
              continue
            }
            resolvedParentCount++
            var mtlsBlocked = map[string]bool{}
            ComputeGwMtlsBlockedValue(gateway, mtlsBlocked)
            for _, listener := range gateway.Spec.Listeners {
              var listenerName = listener.Name
              var listenerPort = toint(listener.Port)
              if (section != "" && section != listenerName) ||
                mtlsBlocked[listenerName] ||
                (parentPort != 0 && parentPort != listenerPort) ||
                !hasPrefix(IsRouteAllowedOnListener(routeNs, listener, gatewayNs), "true") {
                continue
              }
              var listenerProtocol = ListenerProtocolOr(listener, "HTTP")
              var listenerHostname = ListenerHostname(listener)
              var portSuffix = ""
              if listenerPort > 0 {
                var scopePort = listenerPort
                var selectedPort, foundPort = shared.Select(
                  "gateway-host-port-scopes", "ports",
                  gatewayNs + "/" + gatewayName + ":" + tostring(listenerPort))
                if foundPort {
                  scopePort = toint(selectedPort)
                }
                var nonDefault = (listenerProtocol == "HTTP" && listenerPort != 80) ||
                  ((listenerProtocol == "HTTPS" || listenerProtocol == "TLS") && listenerPort != 443)
                if listenerHostname == "" || nonDefault {
                  portSuffix = ":" + tostring(scopePort)
                }
              }
              var currentRank = toint(HostnameRank(listenerHostname))
              if len(routeHostnames) == 0 {
                effectiveHosts[listenerHostname + portSuffix] = true
              } else if listenerHostname == "" {
                for _, hostnameAny := range routeHostnames {
                  var hostname = tostring(hostnameAny)
                  var ownedBySibling = false
                  for _, sibling := range gateway.Spec.Listeners {
                    if sibling.Name != listenerName && sibling.Hostname != "" &&
                      HostnameSinglePairMatch(sibling.Hostname, hostname) == "true" &&
                      toint(HostnameRank(sibling.Hostname)) > currentRank {
                      ownedBySibling = true
                    }
                  }
                  if !ownedBySibling {
                    effectiveHosts[hostname + portSuffix] = true
                  }
                }
              } else {
                for _, hostnameAny := range routeHostnames {
                  var intersection = HostnameSinglePairIntersection(listenerHostname, tostring(hostnameAny))
                  if intersection == "" {
                    continue
                  }
                  var ownedBySibling = false
                  for _, sibling := range gateway.Spec.Listeners {
                    if sibling.Name != listenerName && sibling.Hostname != "" &&
                      HostnameSinglePairIntersection(sibling.Hostname, intersection) == intersection &&
                      toint(HostnameRank(sibling.Hostname)) > currentRank {
                      ownedBySibling = true
                    }
                  }
                  if !ownedBySibling {
                    effectiveHosts[intersection + portSuffix] = true
                  }
                }
              }
            }
          } else if parentKind == "ListenerSet" {
            var listenerSetNs = dig_string(parentRef, routeNs, "namespace")
            if listenerSetNs == "" { listenerSetNs = routeNs }
            var listenerSetName = dig_string(parentRef, "", "name")
            var selected, found = shared.Select(
              "gateway-host-listenersets", "listenersets", listenerSetNs + "/" + listenerSetName)
            if !found || tostring(dig(selected, "accepted") | fallback(false)) != "true" {
              continue
            }
            resolvedParentCount++
            var listeners = toSlice(dig(selected, "candidates"))
            for _, listener := range listeners {
              var listenerName = dig_string(listener, "", "name")
              var listenerPort = toint(dig(listener, "port") | fallback(0))
              var ownerNs = dig_string(listener, listenerSetNs, "ownerNamespace")
              if (section != "" && section != listenerName) ||
                (parentPort != 0 && parentPort != listenerPort) ||
                !hasPrefix(IsRouteAllowedOnListener(routeNs, listener, ownerNs), "true") {
                continue
              }
              var listenerProtocol = ListenerProtocolOr(listener, "HTTP")
              var portSuffix = ""
              if listenerPort > 0 &&
                ((listenerProtocol == "HTTP" && listenerPort != 80) ||
                  (listenerProtocol == "HTTPS" && listenerPort != 443) ||
                  (listenerProtocol == "TLS" && listenerPort != 443)) {
                portSuffix = ":" + tostring(listenerPort)
              }
              var listenerHostname = ListenerHostname(listener)
              var currentRank = toint(HostnameRank(listenerHostname))
              if len(routeHostnames) == 0 {
                effectiveHosts[listenerHostname + portSuffix] = true
              } else if listenerHostname == "" {
                for _, hostnameAny := range routeHostnames {
                  effectiveHosts[tostring(hostnameAny) + portSuffix] = true
                }
              } else {
                for _, hostnameAny := range routeHostnames {
                  var intersection = HostnameSinglePairIntersection(listenerHostname, tostring(hostnameAny))
                  if intersection == "" {
                    continue
                  }
                  var ownedBySibling = false
                  for _, sibling := range listeners {
                    var siblingName = dig_string(sibling, "", "name")
                    var siblingHostname = dig_string(sibling, "", "hostname")
                    if siblingName != listenerName && siblingHostname != "" &&
                      HostnameSinglePairIntersection(siblingHostname, intersection) == intersection &&
                      toint(HostnameRank(siblingHostname)) > currentRank {
                      ownedBySibling = true
                    }
                  }
                  if !ownedBySibling {
                    effectiveHosts[intersection + portSuffix] = true
                  }
                }
              }
            }
          }
        }
        if resolvedParentCount == 0 {
          if len(routeHostnames) == 0 {
            effectiveHosts[""] = true
          } else {
            for _, hostname := range routeHostnames {
              effectiveHosts[tostring(hostname)] = true
            }
          }
        }
      %%}
      {%- end macro -%}

  util-publish-gateway-route-candidates:
    requires: [gateways, namespaces, configmaps, secrets]
    template: |
      {%- import "util-gateway-route-effective-hosts-incremental" for GatewayRouteEffectiveHosts -%}
      {%- macro PublishGatewayRouteCandidates(route any, routeKind string) -%}
      {%%
        var namespace = dig_string(route, "", "metadata", "namespace")
        var name = dig_string(route, "", "metadata", "name")
        var routeKey = routeKind + "/" + namespace + "/" + name
        var presenceCell = "presence-http"
        if routeKind == "GRPCRoute" { presenceCell = "presence-grpc" }
        show shared.Publish(presenceCell, namespace + "/" + name, true)
        var rawKindRank = "0"
        if routeKind == "GRPCRoute" { rawKindRank = "1" }
        var fixed = func(value int) string {
          var encoded = tostring(value)
          var zeroes = "0000000000"
          if len(encoded) >= len(zeroes) { return encoded }
          return zeroes[:len(zeroes)-len(encoded)] + encoded
        }
        var descending = func(value int) string { return fixed(999999999 - value) }
        var effectiveHosts = map[string]bool{}
        GatewayRouteEffectiveHosts(route, effectiveHosts)
        var entries = []any{}
        var routeAdvanced = routeKind == "GRPCRoute"
        for _, hostname := range keys(effectiveHosts) {
          for ruleIndex, rule := range toSlice(dig(route, "spec", "rules")) {
            var matches = toSlice(dig(rule, "matches"))
            var matchCount = len(matches)
            var iterationCount = matchCount
            if iterationCount == 0 { iterationCount = 1 }
            for matchIndex := 0; matchIndex < iterationCount; matchIndex++ {
              var pathType = "PathPrefix"
              var pathValue = "/"
              var hasMethod = false
              var headerCount = 0
              var queryParamCount = 0
              if matchCount > 0 {
                var match = matches[matchIndex]
                if routeKind == "HTTPRoute" {
                  var configuredType = dig_string(match, "", "path", "type")
                  var configuredValue = dig_string(match, "", "path", "value")
                  if configuredType != "" { pathType = configuredType }
                  if configuredValue != "" { pathValue = configuredValue }
                  hasMethod = dig_string(match, "", "method") != ""
                  headerCount = len(toSlice(dig(match, "headers")))
                  queryParamCount = len(toSlice(dig(match, "queryParams")))
                } else {
                  hasMethod = dig_string(match, "", "method", "service") != "" ||
                    dig_string(match, "", "method", "method") != ""
                  headerCount = len(toSlice(dig(match, "headers")))
                }
              }
              if hasMethod || headerCount > 0 || queryParamCount > 0 {
                routeAdvanced = true
              }
              var pathKey = hostname + "|" + pathType + "|" + pathValue
              var entryID = routeKey + "/" + fixed(ruleIndex) + "/" + fixed(matchIndex) + "/" + hostname
              var rawRank = rawKindRank + "\x00" + namespace + "/" + name + "\x00" +
                hostname + "\x00" + fixed(ruleIndex) + "\x00" + fixed(matchIndex)
              var methodRank = "1"
              if hasMethod { methodRank = "0" }
              var creationTimestamp = dig_string(route, "", "metadata", "creationTimestamp")
              var sortRank = pathType + "\x00" + descending(len(pathValue)) + "\x00" + methodRank + "\x00" +
                descending(headerCount) + "\x00" + descending(queryParamCount) + "\x00" +
                creationTimestamp + "\x00" + namespace + "/" + name + "\x00" + fixed(ruleIndex) + "\x00" +
                pathKey + "\x00" + rawRank
              var routeInfo = map[string]any{
                "entryID": entryID,
                "kind": routeKind,
                "routeNamespace": namespace,
                "routeName": name,
                "hostname": hostname,
                "ruleIdx": ruleIndex,
                "matchIdx": matchIndex,
                "pathKey": pathKey,
                "pathType": pathType,
                "pathValue": pathValue,
                "pathValueLen": len(pathValue),
                "hasMethod": hasMethod,
                "headerCount": headerCount,
                "queryParamCount": queryParamCount,
                "rawRank": rawRank,
                "allRank": pathKey + "\x00" + rawRank,
                "sortRank": sortRank,
              }
              entries = append(entries, map[string]any{"id": entryID, "pathKey": pathKey})
              show shared.Publish("path:" + pathKey, entryID, routeInfo)
            }
          }
        }
        show shared.Publish("routes", routeKey, map[string]any{
          "entries": entries,
          "advanced": routeAdvanced,
        })
      %%}
      {%- end macro -%}

  gateway-route-candidates-100-http:
    requires: [gateways, httproutes, namespaces, configmaps, secrets]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: gateway-route-candidates
      consumes: [gateway-host-port-scopes]
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |
      {%- import "util-publish-gateway-route-candidates" for PublishGatewayRouteCandidates -%}
      {%- var route = item -%}
      {%- if route != nil -%}{{- PublishGatewayRouteCandidates(route, "HTTPRoute") -}}{%- end -%}

  gateway-route-candidates-200-grpc:
    requires: [gateways, grpcroutes, namespaces, configmaps, secrets]
    incremental:
      source: grpcroutes
      group: gateway-route-candidates
      consumes: [gateway-host-port-scopes]
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |
      {%- import "util-publish-gateway-route-candidates" for PublishGatewayRouteCandidates -%}
      {%- var route = resources.grpcroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{{- PublishGatewayRouteCandidates(route, "GRPCRoute") -}}{%- end -%}

  util-analyze-gateway-route-incremental:
    requires: [grpcroutes, httproutes]
    template: |
      {%- macro AnalyzeGatewayRouteIncremental(route any, routeKind string) -%}
      {%%
        var namespace = dig_string(route, "", "metadata", "namespace")
        var name = dig_string(route, "", "metadata", "name")
        var routeKey = routeKind + "/" + namespace + "/" + name
        var routeIndex, foundRoute = shared.Select("gateway-route-candidates", "routes", routeKey)
        if !foundRoute {
          return
        }
        var finalizedEntryIDs = []any{}
        for _, entryRef := range toSlice(dig(routeIndex, "entries")) {
          var entryID = dig_string(entryRef, "", "id")
          var pathKey = dig_string(entryRef, "", "pathKey")
          var pathCandidates = shared.SelectValues("gateway-route-candidates", "path:" + pathKey)
          if len(pathCandidates) == 0 {
            continue
          }
          pathCandidates = sort_by(pathCandidates, []string{"$.rawRank"})
          var resolveRoute = func(candidate any) any {
            var candidateNamespace = dig_string(candidate, "", "routeNamespace")
            var candidateName = dig_string(candidate, "", "routeName")
            if dig_string(candidate, "", "kind") == "HTTPRoute" {
              return resources.httproutes.GetSingle(candidateNamespace, candidateName)
            }
            return resources.grpcroutes.GetSingle(candidateNamespace, candidateName)
          }
          var buildConditions = func(candidate any) string {
            var candidateRoute = resolveRoute(candidate)
            if candidateRoute == nil {
              return ""
            }
            var ruleIndex = toint(dig(candidate, "ruleIdx") | fallback(0))
            var matchIndex = toint(dig(candidate, "matchIdx") | fallback(0))
            var rules = toSlice(dig(candidateRoute, "spec", "rules"))
            if ruleIndex < 0 || ruleIndex >= len(rules) {
              return ""
            }
            var matches = toSlice(dig(rules[ruleIndex], "matches"))
            if matchIndex < 0 || matchIndex >= len(matches) {
              return ""
            }
            var match = matches[matchIndex]
            var conditions = ""
            if dig_string(candidate, "", "kind") == "HTTPRoute" {
              var method = dig_string(match, "", "method")
              if method != "" { conditions = conditions + "method:" + method }
              for _, header := range toSlice(dig(match, "headers")) {
                conditions = conditions + ";header:" + dig_string(header, "", "name") + "=" +
                  dig_string(header, "", "value")
              }
              for _, parameter := range toSlice(dig(match, "queryParams")) {
                conditions = conditions + ";param:" + dig_string(parameter, "", "name") + "=" +
                  dig_string(parameter, "", "value")
              }
            } else {
              var service = dig_string(match, "", "method", "service")
              var method = dig_string(match, "", "method", "method")
              if service != "" || method != "" {
                conditions = conditions + "method:" + dig_string(match, "", "method", "type") + "/" +
                  service + "/" + method
              }
              for _, header := range toSlice(dig(match, "headers")) {
                conditions = conditions + ";header:" + dig_string(header, "", "name") + "=" +
                  dig_string(header, "", "value")
              }
            }
            return conditions
          }
          var firstConditions = buildConditions(pathCandidates[0])
          var hasConflicts = false
          var routeIDs = []string{}
          var groupRank = ""
          var winnerEntryID = ""
          for _, candidate := range pathCandidates {
            if buildConditions(candidate) != firstConditions {
              hasConflicts = true
            }
            routeIDs = append(routeIDs,
              dig_string(candidate, "", "routeNamespace") + "_" +
              dig_string(candidate, "", "routeName") + "_" +
              tostring(dig(candidate, "ruleIdx") | fallback(0)))
            var candidateRank = dig_string(candidate, "", "sortRank")
            if groupRank == "" || candidateRank < groupRank {
              groupRank = candidateRank
              winnerEntryID = dig_string(candidate, "", "entryID")
            }
          }
          var conflictGroup = join(routeIDs, "__")
          for _, candidate := range pathCandidates {
            if dig_string(candidate, "", "entryID") != entryID {
              continue
            }
            var routeID = namespace + "_" + name + "_" +
              tostring(dig(candidate, "ruleIdx") | fallback(0))
            var finalized = merge(candidate, map[string]any{
              "hasConflicts": hasConflicts,
              "routeId": routeID,
              "conflictGroup": conflictGroup,
              "groupRank": groupRank,
              "groupWinner": entryID == winnerEntryID,
              "rawRepresentative": entryID == dig_string(pathCandidates[0], "", "entryID"),
              "groupKind": dig_string(pathCandidates[0], "", "kind"),
              "groupRouteNamespace": dig_string(pathCandidates[0], "", "routeNamespace"),
              "groupRouteName": dig_string(pathCandidates[0], "", "routeName"),
              "advancedScope": tostring(dig(routeIndex, "advanced") | fallback(false)) == "true",
            })
            show shared.Publish("entries", entryID, finalized)
            finalizedEntryIDs = append(finalizedEntryIDs, entryID)
          }
        }
        show shared.Publish("routes", routeKey, map[string]any{"entries": finalizedEntryIDs})
      %%}
      {%- end macro -%}

  gateway-route-analysis-100-http:
    requires: [grpcroutes, httproutes]
    incremental:
      source: httproutes
      group: gateway-route-analysis
      consumes: [gateway-route-candidates]
      effects: [publishValue]
    template: |
      {%- import "util-analyze-gateway-route-incremental" for AnalyzeGatewayRouteIncremental -%}
      {{- AnalyzeGatewayRouteIncremental(item, "HTTPRoute") -}}

  gateway-route-analysis-200-grpc:
    requires: [grpcroutes, httproutes]
    incremental:
      source: grpcroutes
      group: gateway-route-analysis
      consumes: [gateway-route-candidates]
      effects: [publishValue]
    template: |
      {%- import "util-analyze-gateway-route-incremental" for AnalyzeGatewayRouteIncremental -%}
      {{- AnalyzeGatewayRouteIncremental(item, "GRPCRoute") -}}

  features-004-gateway-route-analysis-publications:
    requires: [gateways, grpcroutes, httproutes]
    template: |-
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "map-hostvalues-490-gateway-port-scopes" -}}
      {{- render "gateway-route-candidates-100-http" -}}
      {{- render "gateway-route-candidates-200-grpc" -}}
      {{- render "gateway-route-analysis-100-http" -}}
      {{- render "gateway-route-analysis-200-grpc" -}}
      {{- render "gateway-route-paths-100-http" -}}
      {{- render "gateway-route-paths-200-grpc" -}}

  util-listenerset-routing-gate:
    requires: [namespaces]
    template: |
      {#- Returns text because Scriggo macros have text results. -#}
      {%- macro IsRouteAllowedOnListener(routeNs string, listener any, listenerOwnerNs string) -%}
        {%- var allowedFrom = "Same" -%}
        {%- var allowedSelector any = nil -%}
        {%- var allowed = listener | dig("allowedRoutes", "namespaces") -%}
        {%- if allowed != nil -%}
          {%- allowedFrom = tostring(dig(allowed, "from") | fallback("Same")) -%}
          {%- allowedSelector = dig(allowed, "selector", "matchLabels") -%}
        {%- end -%}
        {%- var result = "false" -%}
        {%- if allowedFrom == "All" -%}
          {%- result = "true" -%}
        {%- else if allowedFrom == "Same" -%}
          {%- if routeNs == listenerOwnerNs -%}
            {%- result = "true" -%}
          {%- end -%}
        {%- else if allowedFrom == "Selector" -%}
          {%- if allowedSelector != nil -%}
            {%- var nsObj = resources.namespaces.GetSingle(routeNs) -%}
            {%- if nsObj != nil -%}
              {#- to_str_map, not .(map[string]any): typegen labels are
                  map[string]string, which that assertion panics on. -#}
              {%- var selMap = to_str_map(allowedSelector) -%}
              {%- var allMatch = "true" -%}
              {%- for k, v := range selMap -%}
                {%- var actual, ok = nsObj.Metadata.Labels[k] -%}
                {%- if !ok -%}
                  {%- allMatch = "false" -%}
                {%- else if actual != v -%}
                  {%- allMatch = "false" -%}
                {%- end -%}
              {%- end -%}
              {%- result = allMatch -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {{ result -}}
      {%- end macro -%}
