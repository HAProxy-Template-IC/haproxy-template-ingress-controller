templateSnippets:
  frontend-extra-100-gateway-misdirected:
    requires: [gateways, referencegrants]
    template: |
      {%- import "util-listenerset-routing-gate" for IsListenerSetAdmitted -%}
      {%- var exactEntries = []any{} %}
      {%- var regexEntries = []any{} %}
      {#- Per-Gateway "has a hostname-less HTTPS/TLS listener" markers, appended to the
          regex map LAST so map_reg first-match-wins prefers specific patterns. -#}
      {%%
        // Returns true for a catch-all listener (empty / `*`). Kept shared: while the
        // Gateway and ListenerSet loops had copies, their `$` anchors drifted apart.
        var classifyHostname = func(lh string) bool {
          if lh == "" || lh == "*" {
            return true
          }
          if regex_search(lh, "^\\*\\.") {
            var suffix = lh[2:]
            var regexBase = tostring(replace(suffix, ".", "\\."))
            regexEntries = append(regexEntries, "^[^.]+\\." + regexBase + "$ " + lh)
            return false
          }
          exactEntries = append(exactEntries, lh + " " + lh)
          return false
        }
      %%}
      {%- var catchallEntries = []any{} %}
      {%- for _, gw := range resources.gateways.List() %}
        {%- var gwNs = gw.Metadata.Namespace %}
        {%- var gwName = gw.Metadata.Name %}
        {%- var gwHasCatchall = false %}
        {%- for _, listener := range gw.Spec.Listeners %}
          {%- var protocol = listener.Protocol %}
          {%- if protocol == "" %}{%- protocol = "HTTP" %}{%- end %}
          {%- if protocol == "HTTPS" || protocol == "TLS" %}
            {%- var lh = listener.Hostname %}
            {%- if classifyHostname(lh) %}
              {%- gwHasCatchall = true %}
            {%- end %}
          {%- end %}
        {%- end %}
        {%- _ = render "util-listenerset-candidates" default "" -%}
        {%%
            // Admission is decided once, by util-listenerset-candidates, which
            // reads the resource typed behind its own CRD gate.
            var lsCands = []any{}
            var published = shared.Get("listenerSetCandidates")
            if published != nil {
              var part = published.(map[string]any)[gwNs + "/" + gwName]
              if part != nil {
                lsCands = part.(map[string]any)["candidates"].([]any)
              }
            }
        %%}
        {%- for _, cAny := range lsCands %}
          {%- var c = cAny.(map[string]any) %}
          {%- if c["_accepted"].(bool) %}
            {%- var protocol = tostring(c["protocol"]) %}
            {%- if protocol == "" %}{%- protocol = "HTTP" %}{%- end %}
            {%- if protocol == "HTTPS" || protocol == "TLS" %}
              {%- if classifyHostname(tostring(c["hostname"])) %}
                {%- gwHasCatchall = true %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
        {%- if gwHasCatchall %}
          {%- catchallEntries = append(catchallEntries, "^.*$ catchall:" + gwNs + "/" + gwName) %}
        {%- end %}
      {%- end %}
      {#- `catchall:` cannot collide with a user hostname: HTTP forbids `:` in a host. -#}
      {%- for _, e := range catchallEntries %}
        {%- regexEntries = append(regexEntries, e) %}
      {%- end %}
      {%- var exactPath, _ = fileRegistry.Register("map", "listener-hostname-claim.map", join(exactEntries, "\n") + "\n") %}
      {%- var regexPath, _ = fileRegistry.Register("map", "listener-hostname-claim-regex.map", join(regexEntries, "\n") + "\n") %}
      # gateway/frontend-extra-misdirected
      http-request set-var(txn.gw_host_canonical) req.fhdr(Host),lower,field(1,:)
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map({{ exactPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 }
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map_reg({{ regexPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_sni_listener) -m len 0 }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map({{ exactPath }},'') if { var(txn.gw_host_canonical) -m found }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map_reg({{ regexPath }},'') if { var(txn.gw_host_canonical) -m found } { var(txn.gw_host_listener) -m len 0 }
      {# The `^.*$ catchall:` markers keep gw_sni_listener non-empty for a Gateway with a
          hostname-less listener; without them the `len 0` gate kills the 421 that conformance
          HTTPRouteHTTPSListenerDetectMisdirectedRequests requires. The gate then only fires for
          orphan TLS (SNI matches no Gateway), where a 421 would mis-flag the request. #}
      # 421: SNI matched one listener but the Host belongs to a different one (misdirected request).
      {# A second 421 source (cache-origin frontend) makes `frontend` alone ambiguous in
          the access log. The condition must stay byte-identical to the return below. #}
      http-request set-var(txn.denied_by) str(gw_sni_host_mismatch) if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_host_canonical) -m found } !{ var(txn.gw_sni_listener) -m len 0 } !{ var(txn.gw_sni_listener),strcmp(txn.gw_host_listener) eq 0 }
      http-request return status 421 if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_host_canonical) -m found } !{ var(txn.gw_sni_listener) -m len 0 } !{ var(txn.gw_sni_listener),strcmp(txn.gw_host_listener) eq 0 }
  log-fields-500-gateway:
    requires: [gateways]
    template: |-
      {# txn.gw_rule_id (<ns>_<name>_<ruleIdx>) comes from frontend-matchers-advanced-500-gateway;
          gated on Gateways existing so an Ingress-only install has no permanently-empty log key. #}
      {%- if len(resources.gateways.List()) > 0 %}
      %(gw_route)[var(txn.gw_rule_id)]
      {%- end %}

  util-gateway-match-groups:
    requires: [gateways, grpcroutes, httproutes]
    template: |
      {#- Classifies each conflict group — the candidate set sharing one host+path, which is
          exactly what field(3) of the path maps puts in req.gw_routeId.

          "advanced" is keyed by HTTPRoute scope ("<ns>_<name>_"), NOT by conflict group,
          because that is the scope the chain's fallback actually spans: a path-only rule's
          condition is `{ var(req.gw_routeId) -m beg "<ns>_<name>_" }`, so it can rescue a
          request whose more-specific path selected a DIFFERENT group of the same HTTPRoute
          whose method/header/query matcher then failed. Group-level scoping misses that and
          sends the request to the default backend (caught by TestHTTPRouteCombined).

          So an HTTPRoute needs the ordered chain if ANY of its rules matches on more than
          the path. When none does, no request data can change which rule wins, the winner
          is known here at render time, and the two maps below resolve it in two lookups
          instead of ~4 http-request lines per route on every request.

          "winner" is the first member of each conflict group in precedence order
          (sortedRoutes), i.e. the rule that would have won first-match-wins.

          After rendering:
            shared.Get("gatewayMatchGroups") -> {"advanced": map[string]bool,  // by scope
                                                "winner":   map[string]string} // by group
      -#}
      {%- var _, _ = shared.ComputeIfAbsent("gatewayMatchGroups", func() any {
          var advanced = map[string]bool{}
          var winner = map[string]string{}
          var gaVal = shared.Get("gatewayAnalysis")
          if gaVal == nil {
            return map[string]any{"advanced": advanced, "winner": winner}
          }
          var sorted = gaVal.(map[string]any)["sortedRoutes"] | toSlice()
          for _, riAny := range sorted {
            var ri = riAny.(map[string]any)
            var cg = tostring(ri["conflictGroup"])
            if _, seen := winner[cg]; !seen {
              winner[cg] = tostring(ri["routeId"])
            }
            var ruleIdx = toint(ri["ruleIdx"])
            var matchIdx = toint(ri["matchIdx"])
            switch r := ri["route"].(type) {
            case *resources.httproutes.T:
              var scope = r.Metadata.Namespace + "_" + r.Metadata.Name + "_"
              if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
                var rule = r.Spec.Rules[ruleIdx]
                if matchIdx >= 0 && matchIdx < len(rule.Matches) {
                  var m = rule.Matches[matchIdx]
                  if m.Method != "" || len(m.Headers) > 0 || len(m.QueryParams) > 0 {
                    advanced[scope] = true
                  }
                }
              }
            case *resources.grpcroutes.T:
              // Every GRPCRoute match narrows within the synthesized "/" PathPrefix.
              advanced[r.Metadata.Namespace + "_" + r.Metadata.Name + "_"] = true
            }
          }
          return map[string]any{"advanced": advanced, "winner": winner}
      }) %}

  frontend-matchers-advanced-010-route-id-setup:
    template: |
      {# txn.path_match qualifier format: GW_ROUTE_ID:<route_type>:<routeIds>, e.g. GW_ROUTE_ID:http:ns1_route1_0__ns2_route2_1 #}
      # gateway/frontend-matchers-advanced-010-route-id-setup
      http-request set-var(req.gw_route_type) var(txn.path_match),field(2,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }
      http-request set-var(req.gw_routeId) var(txn.path_match),field(3,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }

  frontend-matchers-advanced-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-value-injection" for ConfigValueInjection -%}
      {{- "" }}
      {# Non-stripping form: keeps the blank line before the section marker. #}
      # gateway/frontend-matchers-advanced-500-gateway
      {{ render "util-gateway-analysis" -}}
      {%- var gatewayAnalysis = shared.Get("gatewayAnalysis").(map[string]any) %}
      {%- var sortedRoutes []any = gatewayAnalysis["sortedRoutes"] %}
      {{ render "util-gateway-match-groups" -}}
      {%- var advancedGroups = shared.Get("gatewayMatchGroups").(map[string]any)["advanced"].(map[string]bool) %}
      {%- if len(sortedRoutes) > 0 %}
      # Advanced route matching (method/header/query)
      {%- for _, routeInfo := range sortedRoutes %}
        {%- var riRouteId = routeInfo["routeId"] %}
        {%- var riConflictGroup = routeInfo["conflictGroup"] %}
        {%- var riRuleIdx int = routeInfo["ruleIdx"] %}
        {%- var riMatchIdx int = routeInfo["matchIdx"] %}
        {#- Map-decidable routes emit nothing here (every line below is gated on advancedGroups);
            skip them before the wasted type-switch + extraction. Their path is validated in the path-map builder. -#}
        {%- if !advancedGroups[tostring(routeInfo | dig("route", "metadata", "namespace")) + "_" + tostring(routeInfo | dig("route", "metadata", "name")) + "_"] %}{%- continue %}{%- end %}

        {%%
          var riKind = ""
          var riNs = ""
          var riName = ""
          var riIsGrpc = false
          var pathType = "PathPrefix"
          var pathValue = "/"
          var hasMethod = false
          var riMethod = ""
          var headerSpecs = []any{}
          var paramSpecs = []any{}
          var hasGrpcMethod = false
          var grpcService = ""
          var grpcMethodName = ""
          var grpcType = "Exact"
        %%}

        {%- switch r := routeInfo["route"].(type) %}
        {%- case *resources.httproutes.T %}
          {%- riKind = "HTTPRoute" %}
          {%- riNs = r.Metadata.Namespace %}
          {%- riName = r.Metadata.Name %}
          {%- if riRuleIdx >= 0 && riRuleIdx < len(r.Spec.Rules) %}
            {%- var rule = r.Spec.Rules[riRuleIdx] %}
            {%- if riMatchIdx >= 0 && riMatchIdx < len(rule.Matches) %}
              {%- var match = rule.Matches[riMatchIdx] %}
              {%- if match.Path.Type != "" %}{%- pathType = match.Path.Type %}{%- end %}
              {%- if match.Path.Value != "" %}{%- pathValue = match.Path.Value %}{%- end %}
              {%- if match.Method != "" %}
                {%- hasMethod = true %}
                {%- riMethod = match.Method %}
              {%- end %}
              {%- for _, h := range match.Headers %}
                {#- Gateway API defaults the match type to "Exact"; the chart sees the
                    route as authored, and the offline harness applies no CRD defaults. -#}
                {%- var hType = h.Type %}
                {%- if hType == "" %}{%- hType = "Exact" %}{%- end %}
                {%- headerSpecs = append(headerSpecs, map[string]any{
                  "type": hType, "name": h.Name, "value": h.Value,
                }) %}
              {%- end %}
              {%- for _, p := range match.QueryParams %}
                {%- var pType = p.Type %}
                {%- if pType == "" %}{%- pType = "Exact" %}{%- end %}
                {%- paramSpecs = append(paramSpecs, map[string]any{
                  "type": pType, "name": p.Name, "value": p.Value,
                }) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- case *resources.grpcroutes.T %}
          {%- riKind = "GRPCRoute" %}
          {%- riIsGrpc = true %}
          {%- riNs = r.Metadata.Namespace %}
          {%- riName = r.Metadata.Name %}
          {#- 20-route-analysis.yaml synthesizes PathPrefix "/" for GRPCRoutes; the gRPC
              method matchers narrow within it, so the defaults above already hold. -#}
          {%- if riRuleIdx >= 0 && riRuleIdx < len(r.Spec.Rules) %}
            {%- var rule = r.Spec.Rules[riRuleIdx] %}
            {%- if riMatchIdx >= 0 && riMatchIdx < len(rule.Matches) %}
              {%- var match = rule.Matches[riMatchIdx] %}
              {%- if match.Method.Service != "" %}
                {%- hasGrpcMethod = true %}
                {%- grpcService = match.Method.Service %}
                {%- grpcMethodName = match.Method.Method %}
                {%- if match.Method.Type != "" %}{%- grpcType = match.Method.Type %}{%- end %}
              {%- end %}
              {%- for _, h := range match.Headers %}
                {%- var hType = h.Type %}
                {%- if hType == "" %}{%- hType = "Exact" %}{%- end %}
                {%- headerSpecs = append(headerSpecs, map[string]any{
                  "type": hType, "name": h.Name, "value": h.Value,
                }) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Path-only rules need the relaxed scope check below: gw_routeId holds only the
            most-specific path's rule IDs, so a path-only catch-all would lose to a
            more-specific sibling whose sub-matchers failed, but the spec wants fallback. -#}
        {%- var isPathOnly = !hasMethod && len(headerSpecs) == 0 && len(paramSpecs) == 0 && !hasGrpcMethod %}

        {#- #155: match values land inside double-quoted HAProxy ACL patterns below; a "
            breaks out and appends ACL terms (routing hijack), a control char splits the
            line into a new directive. Names and Exact gRPC service/method are token-charset
            validated by the Gateway API, but every RegularExpression value and header/query
            value is arbitrary, so check the values that reach an emitted pattern. The path
            value is only emitted for path-only rules (otherwise the derived conflictGroup
            matches). -#}
        {%- var matchValues = []any{} %}
        {%- if isPathOnly %}{%- matchValues = append(matchValues, tostring(pathValue)) %}{%- end %}
        {%- for _, hSpec := range headerSpecs %}{%- var hm map[string]any = hSpec %}{%- matchValues = append(matchValues, tostring(hm["value"])) %}{%- end %}
        {%- for _, pSpec := range paramSpecs %}{%- var pm map[string]any = pSpec %}{%- matchValues = append(matchValues, tostring(pm["value"])) %}{%- end %}
        {%- if hasGrpcMethod %}{%- matchValues = append(matchValues, tostring(grpcService), tostring(grpcMethodName)) %}{%- end %}
        {%- var matchInjection = "" %}
        {%- for _, mv := range matchValues %}
          {%- if matchInjection == "" %}{%- matchInjection = ConfigValueInjection(tostring(mv)) %}{%- end %}
        {%- end %}
        {%- if matchInjection != "" %}
          {{- WebhookRejectOrWarn(routeInfo["route"], "InvalidMatch", riKind + " " + riNs + "/" + riName + " has a match value containing " + matchInjection + ", which would break out of its routing ACL; the route is not applied. Remove double quotes and control characters from the match value.") -}}
          {%- continue %}
        {%- end %}

        {%- var conditions = []any{"!{ var(txn.gw_rule_id) -m found }"} %}

        {%- if isPathOnly %}
          {%- var httprouteScope = riNs + "_" + riName + "_" %}
          {%- conditions = append(conditions, "{ var(req.gw_routeId) -m beg \"" + httprouteScope + "\" }") %}
          {%- if pathType == "Exact" %}
            {%- conditions = append(conditions, "{ path \"" + pathValue + "\" }") %}
          {%- else if pathType == "RegularExpression" %}
            {%- var escapedPathOnly = replace(pathValue, "$", "\\$") %}
            {%- conditions = append(conditions, "{ path -m reg \"" + escapedPathOnly + "\" }") %}
          {%- else %}
            {#- Gateway API PathPrefix matches whole segments anchored at the path start:
                `path_beg` is a byte prefix (matches /v2example) and `path_dir` matches a
                segment anywhere (/foo/v2/example), so neither works — use `^<prefix>(/|$)`. -#}
            {%- if pathValue == "/" || pathValue == "" %}
              {%- conditions = append(conditions, "{ path_beg \"/\" }") %}
            {%- else %}
              {%- var pathPrefixValue = pathValue %}
              {%- if hasSuffix(pathPrefixValue, "/") %}
                {%- pathPrefixValue = pathPrefixValue[:len(pathPrefixValue)-1] %}
              {%- end %}
              {%- var escaped = sanitize_regex(pathPrefixValue) %}
              {#- HAProxy expands $VAR in config strings; `\$` is the literal-dollar escape. -#}
              {%- conditions = append(conditions, "{ path -m reg \"^" + escaped + "(/|\\$)\" }") %}
            {%- end %}
          {%- end %}
        {%- else %}
          {%- conditions = append(conditions, "{ var(req.gw_routeId) -m str \"" + riConflictGroup + "\" }") %}
        {%- end %}

        {%- if hasMethod && riKind == "HTTPRoute" %}
          {%- conditions = append(conditions, "{ method " + riMethod + " }") %}
        {%- end %}

        {%- for _, hSpec := range headerSpecs %}
          {%- var hm map[string]any = hSpec %}
          {%- var hType = tostring(hm["type"]) %}
          {%- var hName = tostring(hm["name"]) %}
          {%- var hValue = tostring(hm["value"]) %}
          {%- if hType == "Exact" %}
            {%- conditions = append(conditions, "{ req.hdr(" + hName + ") \"" + hValue + "\" }") %}
          {%- else if hType == "RegularExpression" %}
            {%- var escapedHeaderValue = replace(hValue, "$", "\\$") %}
            {%- conditions = append(conditions, "{ req.hdr(" + hName + ") -m reg \"" + escapedHeaderValue + "\" }") %}
          {%- end %}
        {%- end %}

        {%- for _, pSpec := range paramSpecs %}
          {%- var pm map[string]any = pSpec %}
          {%- var pType = tostring(pm["type"]) %}
          {%- var pName = tostring(pm["name"]) %}
          {%- var pValue = tostring(pm["value"]) %}
          {%- if pType == "Exact" %}
            {%- conditions = append(conditions, "{ urlp(" + pName + ") \"" + pValue + "\" }") %}
          {%- else if pType == "RegularExpression" %}
            {%- var escapedParamValue = replace(pValue, "$", "\\$") %}
            {%- conditions = append(conditions, "{ urlp(" + pName + ") -m reg \"" + escapedParamValue + "\" }") %}
          {%- end %}
        {%- end %}

        {#- HAProxy exposes the HTTP/2 `:path` pseudo-header through the `path` fetch, NOT
            through `req.hdr(:path)` — that yields "" and every gRPC method matcher then
            silently never fires, dropping the request to default_backend (404). -#}
        {%- if hasGrpcMethod %}
          {%- var grpcPath = "/" + grpcService %}
          {%- if grpcMethodName != "" %}
            {%- grpcPath = grpcPath + "/" + grpcMethodName %}
          {%- end %}
          {%- if grpcType == "Exact" %}
            {%- conditions = append(conditions, "{ path \"" + grpcPath + "\" }") %}
          {%- else if grpcType == "RegularExpression" %}
            {%- var escapedGrpcPath = replace(grpcPath, "$", "\\$") %}
            {%- conditions = append(conditions, "{ path -m reg \"" + escapedGrpcPath + "\" }") %}
          {%- end %}
        {%- end %}

        {%- if len(conditions) > 0 %}
          {%- var descParts = []any{} %}
          {%- if hasMethod && riKind == "HTTPRoute" %}
            {%- descParts = append(descParts, "method " + riMethod) %}
          {%- end %}
          {%- if len(headerSpecs) > 0 %}
            {%- descParts = append(descParts, tostring(len(headerSpecs)) + " headers") %}
          {%- end %}
          {%- if len(paramSpecs) > 0 %}
            {%- descParts = append(descParts, tostring(len(paramSpecs)) + " query params") %}
          {%- end %}
          {%- if hasGrpcMethod %}
            {%- descParts = append(descParts, "gRPC method") %}
          {%- end %}
          {%- var matcherDesc = "path-only" %}
          {%- if len(descParts) > 0 %}{%- matcherDesc = join(descParts, ", ") %}{%- end %}
          {#- Map-decidable HTTPRoute: the two route maps resolve it, no per-request rule. -#}
          {%- if advancedGroups[riNs + "_" + riName + "_"] %}
      # Rule: {{ riKind }} {{ riNs }}/{{ riName }} rule[{{ riRuleIdx }}] - {{ matcherDesc }}
      http-request set-var(txn.gw_rule_id) str({{ riRouteId }}) if {{ join(conditions, " ") }}
          {%- end %}
          {#- Same gate as the rule line above: a map-decidable HTTPRoute has no chain for
              these to annotate, and they are per-route too. -#}
          {%- if advancedGroups[riNs + "_" + riName + "_"] && (debug | fallback(false) | tostring()) == "true" %}
            {%- var matchTypes = []any{} %}
            {%- if hasMethod && riKind == "HTTPRoute" %}
              {%- matchTypes = append(matchTypes, "method") %}
            {%- end %}
            {%- if len(headerSpecs) > 0 %}
              {%- matchTypes = append(matchTypes, "header") %}
            {%- end %}
            {%- if len(paramSpecs) > 0 %}
              {%- matchTypes = append(matchTypes, "query") %}
            {%- end %}
            {%- if hasGrpcMethod %}
              {%- matchTypes = append(matchTypes, "grpc-method") %}
            {%- end %}
            {%- var matchTypes_str = "advanced" %}
            {%- if len(matchTypes) > 0 %}{%- matchTypes_str = join(matchTypes, "+") %}{%- end %}
      http-request set-var(txn.matched_route) str({{ riNs }}/{{ riName }}/rule{{ riRuleIdx }}) if {{ join(conditions, " ") }}
      http-request set-var(txn.match_reason) str({{ matchTypes_str }}) if {{ join(conditions, " ") }}
          {% end %}
        {% end %}
      {% end %}
      {% end %}

  frontend-matchers-advanced-900-path-match:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- import "util-register-map" for RegisterMap -%}
      {{- "" }}
      {# Reads txn.gw_rule_id, set by frontend-matchers-advanced-500-gateway. Non-stripping
         form: keeps the blank line before the section marker. #}
      # gateway/frontend-matchers-advanced-900-path-match
      {{ render "util-gateway-analysis" -}}
      {{ render "util-gateway-match-groups" -}}
      {%- var matchGroups = shared.Get("gatewayMatchGroups").(map[string]any) %}
      {%- var advancedGroups = matchGroups["advanced"].(map[string]bool) %}
      {%- var groupWinner = matchGroups["winner"].(map[string]string) %}
      {#- One entry per map-decidable group: the candidate set -> its winning routeId, and
          that routeId -> its path_match value. Two lookups rather than one so txn.gw_rule_id
          is still set: the access log's resource / gw_route fields derive from it, as do the
          debug matched_route vars. -#}
      {%- var routeWinnerEntries = []any{} %}
      {%- var routeBackendEntries = []any{} %}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- var gatewayAllRoutes = ga["allRoutes"] | toSlice() %}
      {%- if len(gatewayAllRoutes) > 0 %}
      # Set txn.path_match for backend selection based on txn.gw_rule_id
      {% for _, routeInfo := range gatewayAllRoutes -%}
        {%- var backendRefs []any = nil %}
        {%%
          var rm = routeInfo.(map[string]any)
          var ruleIdx = toint(rm["ruleIdx"])
          switch r := rm["route"].(type) {
          case *resources.httproutes.T:
            if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
              for _, br := range r.Spec.Rules[ruleIdx].BackendRefs {
                backendRefs = append(backendRefs, br)
              }
            }
          case *resources.grpcroutes.T:
            if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
              for _, br := range r.Spec.Rules[ruleIdx].BackendRefs {
                backendRefs = append(backendRefs, br)
              }
            }
          }
        %%}
        {#- Deliberately no `len(backendRefs) > 0` guard: a matched rule with zero
            backendRefs must reach the 500 sink below too, not fall through to 404
            (conformance HTTPRouteNoBackendRefs). -#}
        {%- if true %}
          {#- The route's ResolvedRefs=InvalidKind/BackendNotFound condition is set elsewhere. -#}
          {%- var validRefs = []any{} %}
          {%- var routeNs = tostring(routeInfo | dig("route", "metadata", "namespace") | fallback("")) %}
          {%- var routeKind = tostring(routeInfo | dig("route", "kind") | fallback("HTTPRoute")) %}
          {%- for _, ref := range backendRefs %}
            {%- if BackendRefValid(routeKind, routeNs, ref) == "true" %}
              {%- validRefs = append(validRefs, ref) %}
            {%- end %}
          {%- end %}

          {%- var qualifier = "" %}
          {%- if len(validRefs) == 0 %}
            {#- Spec wants 500 (not 503) when every backendRef is unresolvable;
                gw-invalid-backend is the sink carrying `http-request return status 500`. -#}
            {%- qualifier = "BACKEND:gw-invalid-backend" %}
          {%- else if len(backendRefs) == 1 %}
            {%- var backendRef any = validRefs[0] %}
            {%- var backendName = "gtw_" + (routeInfo | dig("route", "metadata", "namespace")) + "_" + (routeInfo | dig("route", "metadata", "name")) + "_" + (backendRef | dig("name")) + "_" + (backendRef | dig("port")) %}
            {%- qualifier = "BACKEND:" + backendName %}
          {%- else %}
            {#- Spec: an invalid ref's weight share must return 500, so the total
                counts every ref; the weighted map sends invalid shares to
                gw-invalid-backend. -#}
            {%- var totalWeight = 0 %}
            {%- for _, ref := range backendRefs %}
              {%- var refMap any = ref %}
              {%- var weight = refMap | dig("weight") | fallback(1) %}
              {%- totalWeight = totalWeight + (weight) %}
            {%- end %}
            {%- if totalWeight <= 0 %}
              {%- qualifier = "BACKEND:gw-invalid-backend" %}
            {%- else %}
              {%- var routeKey = (routeInfo | dig("route", "metadata", "namespace")) + "_" + (routeInfo | dig("route", "metadata", "name")) + "_" + (routeInfo | dig("ruleIdx")) %}
              {%- qualifier = "MULTIBACKEND:" + totalWeight + ":" + routeKey %}
            {%- end %}
          {%- end %}
          {%- var riCg = tostring(routeInfo | dig("conflictGroup")) %}
          {%- var riScope = tostring(routeInfo | dig("route", "metadata", "namespace")) + "_" + tostring(routeInfo | dig("route", "metadata", "name")) + "_" %}
          {%- if advancedGroups[riScope] %}
      http-request set-var(txn.path_match) str({{ qualifier }}) if { var(txn.gw_rule_id) -m str "{{ routeInfo | dig("routeId") }}" }
          {%- else if groupWinner[riCg] == tostring(routeInfo | dig("routeId")) %}
            {#- Only the group's precedence winner contributes; its siblings would have
                lost the chain's first-match-wins evaluation anyway. -#}
            {%- routeWinnerEntries = append(routeWinnerEntries, riCg + " " + tostring(routeInfo | dig("routeId"))) %}
            {%- routeBackendEntries = append(routeBackendEntries, tostring(routeInfo | dig("routeId")) + " " + qualifier) %}
          {%- end %}
        {% end %}
      {% end %}
      {% end %}
      {#- Registered and referenced even with no entries: creating the map on the first
          map-decidable route and deleting it with the last are both structural changes to
          haproxy.cfg, which is the reload this whole map machinery exists to avoid. -#}
      {%- var routeWinnerPath = RegisterMap("route-winner.map",
            append([]string{"# Candidate group -> the routeId that wins it"}, sort_strings(routeWinnerEntries)...),
            map[string]any{"ordered": false}) %}
      {%- var routeBackendPath = RegisterMap("route-backend.map",
            append([]string{"# routeId -> its path_match qualifier"}, sort_strings(routeBackendEntries)...),
            map[string]any{"ordered": false}) %}
      {#- Resolves every group that needed no chain, in two lookups instead of ~4
          http-request lines per route. Gated on gw_rule_id being unset so a group that DID
          match through the chain keeps its answer, and on the GW_ROUTE_ID qualifier so a
          request that never reached the route maps is untouched. Only map-decidable groups
          have entries, so an advanced group whose matchers all failed still falls through
          to the default backend exactly as before. #}
      http-request set-var(txn.gw_rule_id) var(req.gw_routeId),map({{ routeWinnerPath }}) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID } !{ var(txn.gw_rule_id) -m found } { var(req.gw_routeId),map({{ routeWinnerPath }}) -m found }
      http-request set-var(txn.path_match) var(txn.gw_rule_id),map({{ routeBackendPath }}) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID } { var(txn.gw_rule_id),map({{ routeBackendPath }}) -m found }
  frontend-filters-450-gateway-cors:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-route-condition" for RouteIdCondition -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-logformat-value" for EscapeLogFormatValue -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- var _, isHTTPRoute = routeInfo.(map[string]any)["route"].(*resources.httproutes.T) %}
        {%- if !isHTTPRoute %}{%- continue %}{%- end %}
        {%- var routeId = routeInfo | dig("routeId") | tostring() %}
        {%- var filters = []any{} %}
        {%%
          var rm = routeInfo.(map[string]any)
          var ruleIdx = toint(rm["ruleIdx"])
          switch r := rm["route"].(type) {
          case *resources.httproutes.T:
            if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
              for _, f := range r.Spec.Rules[ruleIdx].Filters {
                filters = append(filters, f)
              }
            }
          case *resources.grpcroutes.T:
            if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
              for _, f := range r.Spec.Rules[ruleIdx].Filters {
                filters = append(filters, f)
              }
            }
          }
        %%}
        {%- for _, filter := range filters %}
          {%- if (filter | dig("type")) != "CORS" %}{%- continue %}{%- end %}
          {%- var cors = filter | dig("cors") %}
          {%- if cors == nil %}{%- continue %}{%- end %}
          {%- var allowOrigins = cors | dig("allowOrigins") | fallback([]any{}) | toSlice() %}
          {%- var hasWildcardOrigin = false %}
          {%- var originAlternatives = []any{} %}
          {%- for _, o := range allowOrigins %}
            {%- var os = tostring(o) %}
            {%- if os == "*" %}
              {%- hasWildcardOrigin = true %}
            {%- else if regex_search(os, "\\*") %}
              {#- Gateway API allows any subdomain depth, so `*.` matches one-or-more labels. -#}
              {%- var literal = tostring(sanitize_regex(os)) %}
              {%- var pattern = tostring(replace(literal, "\\*\\.", "[^.]+(?:\\.[^.]+)*\\.")) %}
              {%- originAlternatives = append(originAlternatives, "^" + pattern + "\\$") %}
            {%- else %}
              {%- originAlternatives = append(originAlternatives, "^" + tostring(sanitize_regex(os)) + "\\$") %}
            {%- end %}
          {%- end %}
          {%- var originRegex = "" %}
          {%- if !hasWildcardOrigin && len(originAlternatives) > 0 %}
            {%- originRegex = "(?:" + join(originAlternatives, "|") + ")" %}
          {%- end %}
          {#- Browsers reject a literal `*` in Allow-Origin when credentials are on, so
              Allow-Origin always echoes the request Origin. -#}
          {%- var allowCreds = cors | dig("allowCredentials") | fallback(false) %}
          {%- var methods = cors | dig("allowMethods") | fallback([]any{}) | toSlice() %}
          {%- var methodsList = []any{} %}
          {%- var hasWildcardMethod = false %}
          {%- for _, m := range methods %}
            {%- var ms = tostring(m) %}
            {%- if ms == "*" %}
              {#- Echo Access-Control-Request-Method rather than `*` or an expanded method
                  list: browsers reject a literal `*` when credentials are on, and the
                  HTTPRouteCORS conformance cases accept only `*` or the requested method. -#}
              {%- hasWildcardMethod = true %}
              {%- break %}
            {%- end %}
            {%- methodsList = append(methodsList, ms) %}
          {%- end %}
          {%- var headers = cors | dig("allowHeaders") | fallback([]any{}) | toSlice() %}
          {%- var headersList = []any{} %}
          {%- for _, h := range headers %}
            {%- var hs = tostring(h) %}
            {%- if hs == "*" %}
              {#- Sentinel: a `["*"]` list means echo Access-Control-Request-Headers per request. -#}
              {%- headersList = []any{"*"} %}
              {%- break %}
            {%- end %}
            {%- headersList = append(headersList, hs) %}
          {%- end %}
          {%- var exposeHeaders = cors | dig("exposeHeaders") | fallback([]any{}) | toSlice() %}
          {%- var exposeList = []any{} %}
          {%- for _, eh := range exposeHeaders %}
            {%- exposeList = append(exposeList, tostring(eh)) %}
          {%- end %}
          {%- var maxAge = cors | dig("maxAge") | fallback(0) %}
          {#- #157: list values ride inside double-quoted log-format hdr/set-header values
              (a control char splits the line; % / " / $ need escaping) and origins ride
              inside a -m reg "..." ACL (a " breaks out — sanitize_regex escapes neither).
              Reject control/quote here, then EscapeLogFormatValue handles the rest below. -#}
          {%- var corsInj = "" %}
          {%- for _, m := range methodsList %}{%- if corsInj == "" %}{%- corsInj = ConfigInjectionKind(tostring(m), "line") %}{%- end %}{%- end %}
          {%- for _, h := range headersList %}{%- if corsInj == "" && tostring(h) != "*" %}{%- corsInj = ConfigInjectionKind(tostring(h), "line") %}{%- end %}{%- end %}
          {%- for _, e := range exposeList %}{%- if corsInj == "" %}{%- corsInj = ConfigInjectionKind(tostring(e), "line") %}{%- end %}{%- end %}
          {%- for _, o := range allowOrigins %}{%- if corsInj == "" %}{%- corsInj = ConfigInjectionKind(tostring(o), "dquote") %}{%- end %}{%- end %}
          {%- if corsInj != "" %}
            {{- WebhookRejectOrWarn(routeInfo.(map[string]any)["route"], "InvalidCORS", "HTTPRoute " + tostring(dig(routeInfo.(map[string]any)["route"], "metadata", "namespace")) + "/" + tostring(dig(routeInfo.(map[string]any)["route"], "metadata", "name")) + " has a CORS filter value containing " + corsInj + ", which would break out of the CORS response header directive; the CORS filter is not applied. Remove control characters and double quotes from allowMethods, allowHeaders, exposeHeaders and allowOrigins.") -}}
            {%- continue %}
          {%- end %}
          {%- var ruleCond = RouteIdCondition(routeId) %}
          {%- var originCond = "{ req.fhdr(Origin) -m found }" %}
          {%- if originRegex != "" %}
            {%- originCond = originCond + " { req.fhdr(Origin) -m reg \"" + originRegex + "\" }" %}
          {%- end %}
          {# HAProxy quirk: `http-request return` responses skip the http-response phase,
              so preflight CORS headers must ride inline as `hdr` arguments; only
              backend-served responses can use http-response set-header. #}
      http-request set-var(txn.gw_cors_origin) req.fhdr(Origin) if {{ originCond }} {{ ruleCond }}
          {%- if len(headersList) > 0 && headersList[0] == "*" %}
      http-request set-var(txn.gw_cors_acrh) req.fhdr(Access-Control-Request-Headers) if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found }
          {%- end %}
          {%- if hasWildcardMethod %}
      http-request set-var(txn.gw_cors_acrm) req.fhdr(Access-Control-Request-Method) if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found }
          {%- end %}
          {#- HAProxy caps a directive at 64 tokens and each `hdr` triple costs 3. -#}
          {%- var preflightHdrs = []any{} %}
          {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-origin \"%[var(txn.gw_cors_origin)]\"") %}
          {%- if allowCreds %}
            {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-credentials \"true\"") %}
          {%- end %}
          {%- if hasWildcardMethod %}
            {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-methods \"%[var(txn.gw_cors_acrm)]\"") %}
          {%- else if len(methodsList) > 0 %}
            {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-methods \"" + EscapeLogFormatValue(join(methodsList, ", ")) + "\"") %}
          {%- end %}
          {%- if len(headersList) > 0 %}
            {%- if headersList[0] == "*" %}
              {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-headers \"%[var(txn.gw_cors_acrh)]\"") %}
            {%- else %}
              {%- preflightHdrs = append(preflightHdrs, "hdr access-control-allow-headers \"" + EscapeLogFormatValue(join(headersList, ", ")) + "\"") %}
            {%- end %}
          {%- end %}
          {%- if toint(maxAge) > 0 %}
            {%- preflightHdrs = append(preflightHdrs, "hdr access-control-max-age \"" + tostring(maxAge) + "\"") %}
          {%- end %}
          {%- if len(exposeList) > 0 %}
            {%- preflightHdrs = append(preflightHdrs, "hdr access-control-expose-headers \"" + EscapeLogFormatValue(join(exposeList, ", ")) + "\"") %}
          {%- end %}
      http-request return status 200 {{ join(preflightHdrs, " ") }} if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found } {{ ruleCond }}
      {# A disallowed-origin preflight must get no access-control-* headers; falling through
         to the backend echoes its body and fails the conformance body/path check. #}
      http-request return status 204 if METH_OPTIONS { req.fhdr(Origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found } {{ ruleCond }} !{ var(txn.gw_cors_origin) -m found }
          {# Non-preflight responses come from the backend, so set-header applies to them. #}
      http-response set-header "access-control-allow-origin" "%[var(txn.gw_cors_origin)]" if { var(txn.gw_cors_origin) -m found } {{ ruleCond }}
          {%- if allowCreds %}
      http-response set-header "access-control-allow-credentials" "true" if { var(txn.gw_cors_origin) -m found } {{ ruleCond }}
          {%- end %}
          {%- if len(exposeList) > 0 %}
      http-response set-header "access-control-expose-headers" "{{ EscapeLogFormatValue(join(exposeList, ", ")) }}" if { var(txn.gw_cors_origin) -m found } {{ ruleCond }}
          {%- end %}
      {# The `{%-` end markers below strip the prior directive's newline, fusing successive
         routes' CORS directives onto one malformed line; only the explicit show survives. #}{% show "\n" %}
        {%- end %}
      {%- end %}
  # Gated on Content-Length, not frontend-wide `option http-buffer-request`: one
  # mirrored route turns this on for the whole shared frontend, and unconditional
  # buffering deadlocks a gRPC stream into a 408 the backend never saw. Nothing that
  # streams can send a Content-Length, so the gate excludes them by construction;
  # a chunked body is therefore mirrored empty rather than breaking the frontend.
  # Lives in frontend-filters-* because txn.backend_name — the key of the per-route
  # `request-buffering: off` opt-out map — is only set by frontend-routing-logic,
  # which runs after frontend-extra-*. That map defaults to `on` rather than the
  # fleet-wide setting because mirroring needs the body even where buffering is off.
  frontend-filters-091-gateway-mirror-buffer:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var mirrorWait = extraContext | dig_string("10s", "requestBuffering", "waitTimeout") %}
      {%- var rbMap, _ = pathResolver.GetPath("request-buffering.map", "map") %}
      {%- var m = tostring(gwmVal.(map[string]any)["mirrorPctPath"]) %}
      # gateway/mirror-buffer: required so req.body reaches
      # the mirror plugin (see frontend-filters-550-gateway-mirror).
      http-request wait-for-body time {{ mirrorWait }} if { req.hdr(content-length) -m found } !{ var(txn.backend_name),map({{ rbMap }},on) -m str off } { var(txn.gw_rule_id),map_str_int({{ m }}) -m found }
