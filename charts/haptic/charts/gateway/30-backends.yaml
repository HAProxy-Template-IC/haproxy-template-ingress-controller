templateSnippets:
  util-generate-httproute-backends-gateway:
    requires: [gateways, httproutes]
    template: |
      {#- Generate backends for HTTPRoute resources.
          Typed sibling of the original polymorphic
          GenerateGatewayBackends. Deduplicates backends across all
          routes using first_seen.

          Parameters:
            routes: typed slice of HTTPRoute resources
            dedupCategory: first_seen category name -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- macro GenerateHTTPRouteBackends(routes []*resources.httproutes.T, dedupCategory string) -%}
        {%- _ = render "util-backendtlspolicies-contrib" default "" -%}
      {%- for _, route := range routes -%}
      {%- var routeNs = route.Metadata.Namespace -%}
      {%- var routeName = route.Metadata.Name -%}
      {%- for _, rule := range route.Spec.Rules -%}
      {%- var backendRefs = rule.BackendRefs -%}
      {%- if len(backendRefs) > 0 %}
      {%- for _, backendRef := range backendRefs -%}
      {#- Skip backendRefs the chart can't realise as a HAProxy backend.
          Per Gateway API spec, only core/v1 Service refs are routable;
          anything else (custom kind, wrong group) results in
          ResolvedRefs=False/InvalidKind on the route. The backend
          rendering below would otherwise silently use the ref's `name`
          field (which can collide with a real Service of the same
          name) and incorrectly route traffic. The route-matcher path
          below detects all-invalid rules and routes them to
          gw-invalid-backend (HTTP 500) instead. -#}
      {%- var refGroup = backendRef.Group -%}
      {%- var refKind = backendRef.Kind -%}
      {%- if refKind == "" %}{%- refKind = "Service" %}{%- end -%}
      {%- if (refGroup != "" && refGroup != "core") || refKind != "Service" -%}
        {%- continue -%}
      {%- end -%}
      {%- var backendName = backendRef.Name -%}
      {%- var backendPort = toint(backendRef.Port) -%}
      {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end -%}
      {#- backendRef.namespace defaults to the route's namespace (per
          Gateway API spec). For cross-namespace backendRefs, the
          target Service + EndpointSlice live in the ref's namespace,
          so endpoint resolution must look there — not in routeNs.
          Conformance test HTTPRouteReferenceGrant sets up a
          cross-namespace HTTPRoute → Service ref permitted by RG;
          previously the chart resolved endpoints in routeNs which
          turned up nothing and HAProxy returned 503 / no server. -#}
      {%- var backendNs = backendRef.Namespace -%}
      {%- if backendNs == "" %}{%- backendNs = routeNs %}{%- end -%}
      {%- var backend = map[string]any{"name": backendName, "port": backendPort} -%}
      {%- var backendKey = backendNs + "_" + routeNs + "_" + routeName + "_" + backendName + "_" + tostring(backendPort) -%}
      {%- if first_seen(dedupCategory, backendKey) -%}
      {%- var protoFlag = "" -%}
      {%- var routeTypeLabel = "HTTPRoute" -%}
      {%- var beKey = BackendNameGateway(route, backend) -%}
      {#- Per Gateway API spec, when the target Service port declares
          appProtocol (kubernetes.io/h2c, kubernetes.io/ws[s]), the data
          plane MUST honour that protocol. HAProxy's `proto` directive on
          default-server gives us h2c; WebSocket flows through native HTTP
          handling without any directive. We look up the Service by
          (namespace, name) and find the port matching backendRef.port. -#}
      {%- var resolvedProtoFlag = protoFlag -%}
      {%- if protoFlag == "" -%}
        {%- var svc = resources.services.GetSingle(backendNs, tostring(backendName)) -%}
        {%- if svc != nil -%}
          {%- for _, p := range svc.Spec.Ports -%}
            {%- if toint(p.Port) == toint(backendPort) -%}
              {%- if p.AppProtocol == "kubernetes.io/h2c" -%}
                {%- resolvedProtoFlag = "h2" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {#- BackendTLSPolicy lookup: per Gateway API spec, when a
          BackendTLSPolicy in the same namespace targets this Service
          (optionally pinned to a sectionName matching the port name),
          the data plane MUST connect to the backend over TLS, validate
          the server cert against the policy's CA bundle, and use
          policy.validation.hostname for SNI + cert hostname check.
          We resolve the policy's CA refs to a single PEM blob and
          stash it via fileRegistry; the default-server line below picks
          up the resulting `ssl ca-file ... verify required sni ...`. -#}
      {%- var btlsCaPath = "" -%}
      {%- var btlsHostname = "" -%}
      {#- btlsVerifyHost is the value passed to HAProxy `verifyhost`.
          Per Gateway API spec (BackendTLSPolicy validation), when
          `subjectAltNames` is set the served cert must carry at least
          one SAN matching one of the listed entries, and `hostname`
          is then used ONLY for SNI / cert selection — not for the cert
          identity check. So SNI continues to come from `hostname`,
          but verifyhost comes from the first Hostname-type SAN when
          SANs are present (falling back to `hostname` when no SANs are
          declared, matching the pre-SAN behaviour). -#}
      {%- var btlsVerifyHost = "" -%}
      {%- var btlsBroken = false -%}
      {#- gw client-cert: per Gateway API spec, when the route's parent
          Gateway carries `spec.tls.backend.clientCertificateRef`, the
          backend connection MUST present that cert. Resolve once per
          backend so the default-server line below can emit
          `crt <path>` alongside any BackendTLSPolicy-driven options. -#}
      {%- var gwClientCertPath = "" -%}
      {%%
        var portNameForBackend = ""
        if protoFlag == "" {
          var svcLookup = resources.services.GetSingle(tostring(backendNs), tostring(backendName))
          if svcLookup != nil {
            for _, p := range svcLookup.Spec.Ports {
              if toint(p.Port) == toint(backendPort) {
                portNameForBackend = p.Name
              }
            }
          }
        }
        // Untyped via the backendtlspolicies contrib seam: typed access
        // here would strip ALL gateway backends on clusters without the
        // BackendTLSPolicy CRD (Gateway API < v1.4 standard).
        var btpSeamRaw = shared.Get("backendtlspoliciesUntyped")
        var btpAll = []any{}
        if btpSeamRaw != nil {
          var btpSeamAll, btpSeamOk = btpSeamRaw.(map[string]any)["all"].([]any)
          if btpSeamOk { btpAll = btpSeamAll }
        }
        var winningPolicy any = nil
        var winningPolicyTs = ""
        var winningPolicyKey = ""
        for _, pol := range btpAll {
          var polNs = dig_string(pol, "", "metadata", "namespace")
          if polNs != tostring(backendNs) {
            continue
          }
          for _, tr := range dig(pol, "spec", "targetRefs") | toSlice() {
            var trGroup = dig_string(tr, "", "group")
            var trKind = dig_string(tr, "", "kind")
            var trName = dig_string(tr, "", "name")
            var trSec = dig_string(tr, "", "sectionName")
            if (trGroup != "" && trGroup != "core") || trKind != "Service" {
              continue
            }
            if trName != tostring(backendName) {
              continue
            }
            if trSec != "" && trSec != portNameForBackend {
              continue
            }
            // Conflict tiebreak — earliest creationTimestamp wins.
            var polTs = dig_string(pol, "", "metadata", "creationTimestamp")
            var polKey = polNs + "/" + dig_string(pol, "", "metadata", "name")
            if winningPolicy == nil {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs != "" && (winningPolicyTs == "" || polTs < winningPolicyTs) {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs == winningPolicyTs && polKey < winningPolicyKey {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            }
            break
          }
        }
        if winningPolicy != nil {
          var validation any = dig(winningPolicy, "spec", "validation")
          btlsHostname = dig_string(validation, "", "hostname")
          // Default verifyhost to hostname (pre-SAN behaviour). When
          // subjectAltNames carries a Hostname-type entry, that entry
          // drives the cert-identity check instead. HAProxy `verifyhost`
          // is single-valued, so we take the FIRST Hostname SAN; a
          // multi-Hostname OR-list and URI-type SANs are deferred (no
          // HAProxy verifyhost equivalent — see the snippet comment).
          btlsVerifyHost = dig_string(validation, "", "hostname")
          for _, san := range dig(validation, "subjectAltNames") | toSlice() {
            if dig_string(san, "", "type") == "Hostname" && dig_string(san, "", "hostname") != "" {
              btlsVerifyHost = dig_string(san, "", "hostname")
              break
            }
          }
          var caBundleParts = []any{}
          for _, ref := range dig(validation, "caCertificateRefs") | toSlice() {
            var refGroup = dig_string(ref, "", "group")
            var refKind = dig_string(ref, "", "kind")
            var refName = dig_string(ref, "", "name")
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(tostring(backendNs), refName)
                if cm != nil {
                  var caCrt = cm.Data["ca.crt"]
                  if caCrt != "" {
                    caBundleParts = append(caBundleParts, caCrt)
                  }
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(tostring(backendNs), refName)
                if sec != nil {
                  // sec is typed *resources.secrets.T from the bundled
                  // core/v1 Secret schema — sec.Data is map[string]string
                  // directly (typegen materialises K8s Secret.data as
                  // string-to-string per the OpenAPI shape). The previous
                  // `.(map[string]any)` assertion was a leftover from
                  // the untyped era.
                  var dataMap = sec.Data
                  var caCrt, ok = dataMap["ca.crt"]
                  var b64 = ""
                  if ok && caCrt != "" {
                    b64 = caCrt
                  } else {
                    var tlsCrt, ok2 = dataMap["tls.crt"]
                    if ok2 && tlsCrt != "" {
                      b64 = tlsCrt
                    }
                  }
                  if b64 != "" {
                    var decoded, decodeErr = b64decode(b64)
                    if decodeErr == nil {
                      caBundleParts = append(caBundleParts, decoded)
                    }
                  }
                }
              }
            }
          var wkca = dig_string(validation, "", "wellKnownCACertificates")
          if len(caBundleParts) > 0 {
            var caBundle = join(caBundleParts, "\n")
            var policyName = dig_string(winningPolicy, "", "metadata", "name")
            var caFilename = "btls-" + tostring(backendNs) + "-" + policyName + ".crt"
            {#- "ca-file": delivered as a general file (same disk path) but
                flagged so a content-only trust-bundle rotation applies via the
                runtime API (add ssl ca-file) with no reload on v3.2+ — backend
                mTLS / SPIFFE bundles rotate every few hours. -#}
            var resolvedPath, fileErr = fileRegistry.Register("ca-file", caFilename, caBundle)
            if fileErr == nil {
              btlsCaPath = resolvedPath
            }
          } else if wkca == "System" {
            btlsCaPath = "@system-ca"
          }
          // Per Gateway API spec, when a BackendTLSPolicy targets a
          // backend but its caCertificateRefs all fail to resolve (and
          // no System wellKnownCACertificates fallback), the policy is
          // *invalid* and the backend MUST not be reachable — clients
          // must see 5xx, not be silently downgraded to plaintext.
          // Conformance: BackendTLSPolicyInvalidCACertificateRef.
          if btlsCaPath == "" {
            btlsBroken = true
          }
        }
        // Resolve gateway client cert ref via the route's parentRefs.
        // Walk the route's parents in declaration order and pick the
        // first one with a working clientCertificateRef.
        for _, parentRef := range route.Spec.ParentRefs {
          if gwClientCertPath != "" {
            break
          }
          var prGroup = parentRef.Group
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = parentRef.Kind
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
            continue
          }
          var gwNs = parentRef.Namespace
          if gwNs == "" { gwNs = routeNs }
          var gwName = parentRef.Name
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          // Dig-only: spec.tls newer than the oldest resolvable Gateway schema.
          var ccRef = dig(gw, "spec", "tls", "backend", "clientCertificateRef")
          if dig_string(ccRef, "", "name") == "" {
            // Optional struct fields default to the zero value;
            // an empty Name is the clearest "no ref configured"
            // signal. (Same proxy used by ingress.yaml's
            // defaultBackend block.)
            continue
          }
          var refGroup = dig_string(ccRef, "", "group")
          var refKind = dig_string(ccRef, "", "kind")
          if refKind == "" { refKind = "Secret" }
          var refName = dig_string(ccRef, "", "name")
          var refNs = dig_string(ccRef, "", "namespace")
          if refNs == "" { refNs = gwNs }
          if (refGroup != "" && refGroup != "core") || refKind != "Secret" || refName == "" {
            continue
          }
          var sec = resources.secrets.GetSingle(refNs, refName)
          if sec == nil {
            continue
          }
          // sec is typed *resources.secrets.T — sec.Data is
          // map[string]string directly (no assertion needed).
          var dataMap = sec.Data
          var crtB64, ok1 = dataMap["tls.crt"]
          var keyB64, ok2 = dataMap["tls.key"]
          if !ok1 || !ok2 || crtB64 == "" || keyB64 == "" {
            continue
          }
          var crtPem, e1 = b64decode(crtB64)
          var keyPem, e2 = b64decode(keyB64)
          if e1 != nil || e2 != nil {
            continue
          }
          var combined = crtPem + "\n" + keyPem
          var fname = "gw-clientcert-" + gwNs + "-" + gwName + ".pem"
          {#- Register the bundle as type "cert" so the file lands under
              the chart's SSL dir (`ssl/`). HAProxy's `crt-base ssl`
              will prepend `ssl/` to the emitted relative path on the
              `crt` directive — so we emit JUST the filename (without
              the `ssl/` prefix that fileRegistry returns) and let
              crt-base re-add it. Closes the GatewayBackendClient
              CertificateFeature webhook admission failure ("unable to
              stat SSL certificate from file 'ssl/general/gw-clientcert-
              ...'"): the previous "file" registration produced
              `general/<fname>` which crt-base turned into the
              non-existent `ssl/general/<fname>`. -#}
          var _, fErr = fileRegistry.Register("cert", fname, combined)
          if fErr == nil {
            gwClientCertPath = fname
          }
        }
      %%}
      # Backend for: {{ routeTypeLabel }} {{ routeNs }}/{{ routeName }} → Service {{ backendName }}:{{ backendPort }}
      backend {{ beKey }}
          guid {{ make_guid("be", beKey) }}
        default-server check{%- if resolvedProtoFlag != "" %} proto {{ resolvedProtoFlag }}{%- end -%}
      {%- if btlsCaPath != "" && btlsCaPath != "@system-ca" %} ssl ca-file {{ btlsCaPath }} verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}){%- end %}{%- if btlsVerifyHost != "" %} verifyhost {{ btlsVerifyHost }}{%- end -%}
      {%- else if btlsCaPath == "@system-ca" %} ssl verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}){%- end %}{%- if btlsVerifyHost != "" %} verifyhost {{ btlsVerifyHost }}{%- end -%}
      {%- else if gwClientCertPath != "" %} ssl verify none
      {%- end -%}
      {%- if gwClientCertPath != "" %} crt {{ gwClientCertPath }}
      {%- end %}
      {%- if btlsBroken %}
          # BackendTLSPolicy CA unresolved → fail closed (503) per Gateway API spec; downgrading
          # to plaintext would defeat the policy. See https://haproxy-haptic.org/helm-chart/latest/libraries/gateway/
          http-request return status 503
      {%- end %}
      {#- HTTPRoute retry (spec.rules[].retry — experimental, GEP-1731).
          Maps to backend-scoped `retries <attempts>` + `retry-on
          <codes>`. Unlike per-rule timeouts (which use the gateable
          `set-timeout server`), `retries`/`retry-on` are NOT
          conditional directives, so they cannot be scoped per
          gw_rule_id. The chart dedups one backend per (route, service,
          port); when several rules share the backend we take the FIRST
          rule (by rule index) whose backendRefs reference this
          (backendName, backendPort) and carry a retry block. The retry
          config of a later rule sharing the same backend is dropped —
          mirroring how a single HAProxy backend can carry only one
          retries/retry-on directive set.

          Mappable:  attempts -> `retries N`; codes -> `retry-on <c>...`
                     (HAProxy accepts bare status tokens like 503).
          Defaults:  no codes -> spec-mandated retriable 5xx
                     (500 502 503 504, all MUST-support per GEP-1731).
          DEFERRED:  retry.backoff (exponential/min-wait backoff) — HAProxy
                     has no per-retry backoff knob; emitting nothing here
                     keeps the directive set valid. Only emit for
                     HTTPRoute (protoFlag == ""), not GRPCRoute. -#}
      {%- if protoFlag == "" %}
        {%- var retryAttempts = 0 %}
        {%- var retryCodes = "" %}
        {%- var retryFound = false %}
        {%- for _, rl := range route.Spec.Rules %}
          {%- if !retryFound %}
            {%- var rlReferencesBackend = false %}
            {%- for _, bRef := range rl.BackendRefs %}
              {%- if bRef.Name == backendName && toint(bRef.Port) == toint(backendPort) %}
                {%- rlReferencesBackend = true %}
              {%- end %}
            {%- end %}
            {%- if rlReferencesBackend %}
              {#- `retry` is an Experimental-channel HTTPRoute field (GEP-1731):
                  it is absent from the Standard-channel HTTPRoute CRD, so the
                  typed rule struct has no Retry field on a Standard install and
                  `rl.Retry` would not compile. Access via dig() — it returns nil
                  when the field is absent (no Standard route can carry it), and
                  the value when the Experimental schema is present. -#}
              {%- var rt = dig(rl, "retry") %}
              {%- var attempts = toint(dig(rt, "attempts")) %}
              {%- if attempts > 0 %}
                {%- retryAttempts = attempts %}
                {%- retryFound = true %}
                {%- var codeParts = []any{} %}
                {%- for _, c := range toSlice(dig(rt, "codes")) %}
                  {%- codeParts = append(codeParts, tostring(toint(c))) %}
                {%- end %}
                {%- if len(codeParts) > 0 %}
                  {%- retryCodes = join(codeParts, " ") %}
                {%- else %}
                  {%- retryCodes = "500 502 503 504" %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
        {%- if retryFound %}
          retries {{ retryAttempts }}
          retry-on {{ retryCodes }}
        {%- end %}
      {%- end %}
      {#- GEP-1619 session persistence (type Cookie / unset).
          A rule's spec.sessionPersistence maps to HAProxy cookie-insert
          persistence on the backend(s) the rule references. Backends are
          deduplicated per (route, service, port), so we look across ALL
          rules of this route for the FIRST one that both (a) declares
          sessionPersistence of type Cookie (or unset → Cookie) and (b)
          references this (service, port) backend, then emit the cookie
          directive once at backend scope.

          Note: HAProxy cookie persistence is PER-POD (the dynamic cookie
          encodes the chosen server). That is the correct GEP-1619 mapping
          — the persistent session pins a client to one backend pod.

          `dynamic-cookie-key` seeds HAProxy's per-server cookie hash so
          the cookie value can't be guessed/forged and stays stable across
          reloads; we derive it from the backend key (sha256) so each
          backend gets a distinct, deterministic seed.

          Type: Header persistence is NOT implemented (it would require a
          stick-table keyed on the named request header, which HAProxy
          can't drive from a dynamically-named header the way GEP-1619
          intends); such rules fall through with no cookie emitted. -#}
      {%- var spCookieEmitted = false %}
      {%- for _, rl := range route.Spec.Rules %}
        {%- if !spCookieEmitted %}
          {%- var sp = dig(rl, "sessionPersistence") %}
          {%- if sp != nil %}
            {%- var spType = tostring(dig(sp, "type") | fallback("Cookie")) %}
            {%- if spType == "Cookie" %}
              {#- Does this rule reference the current (service, port) backend? -#}
              {%- var refsThis = false %}
              {%- for _, bRef := range rl.BackendRefs %}
                {%- if bRef.Name == backendName && toint(bRef.Port) == toint(backendPort) %}
                  {%- refsThis = true %}
                {%- end %}
              {%- end %}
              {%- if refsThis %}
                {%- var cookieName = tostring(dig(sp, "sessionName") | fallback("")) %}
                {%- if cookieName == "" %}{%- cookieName = "SESSION" %}{%- end %}
                {%- var absTimeout = tostring(dig(sp, "absoluteTimeout") | fallback("")) %}
                {%- var idleTimeout = tostring(dig(sp, "idleTimeout") | fallback("")) %}
                {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
                {%- if absTimeout != "" %}{%- cookieDir = cookieDir + " maxlife " + absTimeout %}{%- end %}
                {%- if idleTimeout != "" %}{%- cookieDir = cookieDir + " maxidle " + idleTimeout %}{%- end %}
          # GEP-1619 session persistence (Cookie) — per-pod cookie-insert affinity
          {{ cookieDir }}
          dynamic-cookie-key {{ sha256(beKey) }}
                {%- spCookieEmitted = true %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {#- Per-rule HTTPRoute timeouts: applied here in the backend
          (HAProxy doesn't allow `set-timeout server` in the frontend
          section, since no backend is bound at frontend phase). The
          matched rule's id is stashed in txn.gw_rule_id by the
          frontend matcher; we gate set-timeout on it. Only emit for
          HTTPRoute (protoFlag == ""), not GRPCRoute. -#}
      {%- if protoFlag == "" %}
        {%- var ruleIdxLocal = 0 %}
        {%- for _, rl := range route.Spec.Rules %}
          {#- Dig-only: rules[].timeouts is newer than the oldest schema
              generation the httproutes candidate list can resolve. -#}
          {%- var rlReq = dig_string(rl, "", "timeouts", "request") %}
          {%- var rlBeReq = dig_string(rl, "", "timeouts", "backendRequest") %}
          {%- var tval = rlReq %}
          {%- if tval == "" || tval == "0s" %}{%- tval = rlBeReq %}{%- end %}
          {%- if tval != "" && tval != "0s" %}
            {%- var ruleRouteId = tostring(routeNs) + "_" + tostring(routeName) + "_" + tostring(ruleIdxLocal) %}
        http-request set-timeout server {{ tval }} if { var(txn.gw_rule_id) -m str "{{ ruleRouteId }}" }
          {%- end %}
          {%- ruleIdxLocal = ruleIdxLocal + 1 %}
        {%- end %}
        {#- Per-backendRef RequestHeaderModifier
            (SupportHTTPRouteBackendRequestHeaderModification).

            Multiple rules of the same HTTPRoute can reference the
            same (service, port) backend with DIFFERENT filter sets —
            the upstream `HTTPRouteBackendRequestHeaderModifier`
            conformance fixture has five rules (`/set`, `/add`,
            `/remove`, `/multiple`, `/case-insensitivity`) all
            pointing at `infra-backend-v1:8080` with distinct header
            modifications. The chart deduplicates the backend block
            (one HAProxy `backend` per `(route, service, port)`), so
            the filter directives MUST be gated by `gw_rule_id` to
            keep them rule-scoped — emitting them unconditionally
            would cross-bleed.

            Walk every rule of the route, find each rule's matching
            backendRef, and emit its filters with an `if { var(txn.
            gw_rule_id) -m str <ruleRouteId> }` guard that the
            frontend matcher already populated. -#}
        {%- var ruleIdxBe = 0 %}
        {%- for _, rl := range route.Spec.Rules %}
          {%- for _, bRef := range rl.BackendRefs %}
            {%- if bRef.Name == backendName -%}
            {%- if toint(bRef.Port) == toint(backendPort) %}
              {%- var ruleRouteIdBe = tostring(routeNs) + "_" + tostring(routeName) + "_" + tostring(ruleIdxBe) %}
              {%- for _, bf := range bRef.Filters %}
                {%- if bf.Type == "RequestHeaderModifier" %}
                  {%- var mod = bf.RequestHeaderModifier %}
                  {%- for _, h := range mod.Set %}
        http-request set-header {{ h.Name }} '{{ h.Value }}' if { var(txn.gw_rule_id) -m str "{{ ruleRouteIdBe }}" }
                  {%- end %}
                  {%- for _, h := range mod.Add %}
        http-request add-header {{ h.Name }} '{{ h.Value }}' if { var(txn.gw_rule_id) -m str "{{ ruleRouteIdBe }}" }
                  {%- end %}
                  {%- for _, name := range mod.Remove %}
        http-request del-header {{ name }} if { var(txn.gw_rule_id) -m str "{{ ruleRouteIdBe }}" }
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- end %}
          {%- end %}
          {%- ruleIdxBe = ruleIdxBe + 1 %}
        {%- end %}
      {%- end %}
        {{ BackendServers(backendName, 10, backendPort, nil, nil, beKey, backendNs) | indent(2, true) -}}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  util-generate-grpcroute-backends-gateway:
    requires: [gateways, grpcroutes]
    template: |
      {#- Generate backends for GRPCRoute resources.
          Typed sibling of the original polymorphic
          GenerateGatewayBackends. Deduplicates backends across all
          routes using first_seen.

          Parameters:
            routes: typed slice of GRPCRoute resources
            dedupCategory: first_seen category name -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- macro GenerateGRPCRouteBackends(routes []*resources.grpcroutes.T, dedupCategory string) -%}
        {%- _ = render "util-backendtlspolicies-contrib" default "" -%}
      {%- for _, route := range routes -%}
      {%- var routeNs = route.Metadata.Namespace -%}
      {%- var routeName = route.Metadata.Name -%}
      {%- for _, rule := range route.Spec.Rules -%}
      {%- var backendRefs = rule.BackendRefs -%}
      {%- if len(backendRefs) > 0 %}
      {%- for _, backendRef := range backendRefs -%}
      {#- Skip backendRefs the chart can't realise as a HAProxy backend.
          Per Gateway API spec, only core/v1 Service refs are routable;
          anything else (custom kind, wrong group) results in
          ResolvedRefs=False/InvalidKind on the route. The backend
          rendering below would otherwise silently use the ref's `name`
          field (which can collide with a real Service of the same
          name) and incorrectly route traffic. The route-matcher path
          below detects all-invalid rules and routes them to
          gw-invalid-backend (HTTP 500) instead. -#}
      {%- var refGroup = backendRef.Group -%}
      {%- var refKind = backendRef.Kind -%}
      {%- if refKind == "" %}{%- refKind = "Service" %}{%- end -%}
      {%- if (refGroup != "" && refGroup != "core") || refKind != "Service" -%}
        {%- continue -%}
      {%- end -%}
      {%- var backendName = backendRef.Name -%}
      {%- var backendPort = toint(backendRef.Port) -%}
      {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end -%}
      {#- backendRef.namespace defaults to the route's namespace (per
          Gateway API spec). For cross-namespace backendRefs, the
          target Service + EndpointSlice live in the ref's namespace,
          so endpoint resolution must look there — not in routeNs.
          Conformance test HTTPRouteReferenceGrant sets up a
          cross-namespace HTTPRoute → Service ref permitted by RG;
          previously the chart resolved endpoints in routeNs which
          turned up nothing and HAProxy returned 503 / no server. -#}
      {%- var backendNs = backendRef.Namespace -%}
      {%- if backendNs == "" %}{%- backendNs = routeNs %}{%- end -%}
      {%- var backend = map[string]any{"name": backendName, "port": backendPort} -%}
      {%- var backendKey = backendNs + "_" + routeNs + "_" + routeName + "_" + backendName + "_" + tostring(backendPort) -%}
      {%- if first_seen(dedupCategory, backendKey) -%}
      {%- var protoFlag = "h2" -%}
      {%- var routeTypeLabel = "GRPCRoute" -%}
      {%- var beKey = BackendNameGateway(route, backend) -%}
      {#- Per Gateway API spec, when the target Service port declares
          appProtocol (kubernetes.io/h2c, kubernetes.io/ws[s]), the data
          plane MUST honour that protocol. HAProxy's `proto` directive on
          default-server gives us h2c; WebSocket flows through native HTTP
          handling without any directive. We look up the Service by
          (namespace, name) and find the port matching backendRef.port. -#}
      {%- var resolvedProtoFlag = protoFlag -%}
      {#- BackendTLSPolicy lookup: per Gateway API spec, when a
          BackendTLSPolicy in the same namespace targets this Service
          (optionally pinned to a sectionName matching the port name),
          the data plane MUST connect to the backend over TLS, validate
          the server cert against the policy's CA bundle, and use
          policy.validation.hostname for SNI + cert hostname check.
          We resolve the policy's CA refs to a single PEM blob and
          stash it via fileRegistry; the default-server line below picks
          up the resulting `ssl ca-file ... verify required sni ...`. -#}
      {%- var btlsCaPath = "" -%}
      {%- var btlsHostname = "" -%}
      {#- btlsVerifyHost is the value passed to HAProxy `verifyhost`.
          Per Gateway API spec (BackendTLSPolicy validation), when
          `subjectAltNames` is set the served cert must carry at least
          one SAN matching one of the listed entries, and `hostname`
          is then used ONLY for SNI / cert selection — not for the cert
          identity check. So SNI continues to come from `hostname`,
          but verifyhost comes from the first Hostname-type SAN when
          SANs are present (falling back to `hostname` when no SANs are
          declared, matching the pre-SAN behaviour). -#}
      {%- var btlsVerifyHost = "" -%}
      {%- var btlsBroken = false -%}
      {#- gw client-cert: per Gateway API spec, when the route's parent
          Gateway carries `spec.tls.backend.clientCertificateRef`, the
          backend connection MUST present that cert. Resolve once per
          backend so the default-server line below can emit
          `crt <path>` alongside any BackendTLSPolicy-driven options. -#}
      {%- var gwClientCertPath = "" -%}
      {%%
        var portNameForBackend = ""
        // Untyped via the backendtlspolicies contrib seam: typed access
        // here would strip ALL gateway backends on clusters without the
        // BackendTLSPolicy CRD (Gateway API < v1.4 standard).
        var btpSeamRaw = shared.Get("backendtlspoliciesUntyped")
        var btpAll = []any{}
        if btpSeamRaw != nil {
          var btpSeamAll, btpSeamOk = btpSeamRaw.(map[string]any)["all"].([]any)
          if btpSeamOk { btpAll = btpSeamAll }
        }
        var winningPolicy any = nil
        var winningPolicyTs = ""
        var winningPolicyKey = ""
        for _, pol := range btpAll {
          var polNs = dig_string(pol, "", "metadata", "namespace")
          if polNs != tostring(backendNs) {
            continue
          }
          for _, tr := range dig(pol, "spec", "targetRefs") | toSlice() {
            var trGroup = dig_string(tr, "", "group")
            var trKind = dig_string(tr, "", "kind")
            var trName = dig_string(tr, "", "name")
            var trSec = dig_string(tr, "", "sectionName")
            if (trGroup != "" && trGroup != "core") || trKind != "Service" {
              continue
            }
            if trName != tostring(backendName) {
              continue
            }
            if trSec != "" && trSec != portNameForBackend {
              continue
            }
            // Conflict tiebreak — earliest creationTimestamp wins.
            var polTs = dig_string(pol, "", "metadata", "creationTimestamp")
            var polKey = polNs + "/" + dig_string(pol, "", "metadata", "name")
            if winningPolicy == nil {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs != "" && (winningPolicyTs == "" || polTs < winningPolicyTs) {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs == winningPolicyTs && polKey < winningPolicyKey {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            }
            break
          }
        }
        if winningPolicy != nil {
          var validation any = dig(winningPolicy, "spec", "validation")
          btlsHostname = dig_string(validation, "", "hostname")
          // Default verifyhost to hostname (pre-SAN behaviour). When
          // subjectAltNames carries a Hostname-type entry, that entry
          // drives the cert-identity check instead. HAProxy `verifyhost`
          // is single-valued, so we take the FIRST Hostname SAN; a
          // multi-Hostname OR-list and URI-type SANs are deferred (no
          // HAProxy verifyhost equivalent — see the snippet comment).
          btlsVerifyHost = dig_string(validation, "", "hostname")
          for _, san := range dig(validation, "subjectAltNames") | toSlice() {
            if dig_string(san, "", "type") == "Hostname" && dig_string(san, "", "hostname") != "" {
              btlsVerifyHost = dig_string(san, "", "hostname")
              break
            }
          }
          var caBundleParts = []any{}
          for _, ref := range dig(validation, "caCertificateRefs") | toSlice() {
            var refGroup = dig_string(ref, "", "group")
            var refKind = dig_string(ref, "", "kind")
            var refName = dig_string(ref, "", "name")
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(tostring(backendNs), refName)
                if cm != nil {
                  var caCrt = cm.Data["ca.crt"]
                  if caCrt != "" {
                    caBundleParts = append(caBundleParts, caCrt)
                  }
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(tostring(backendNs), refName)
                if sec != nil {
                  // sec is typed *resources.secrets.T from the bundled
                  // core/v1 Secret schema — sec.Data is map[string]string
                  // directly (typegen materialises K8s Secret.data as
                  // string-to-string per the OpenAPI shape). The previous
                  // `.(map[string]any)` assertion was a leftover from
                  // the untyped era.
                  var dataMap = sec.Data
                  var caCrt, ok = dataMap["ca.crt"]
                  var b64 = ""
                  if ok && caCrt != "" {
                    b64 = caCrt
                  } else {
                    var tlsCrt, ok2 = dataMap["tls.crt"]
                    if ok2 && tlsCrt != "" {
                      b64 = tlsCrt
                    }
                  }
                  if b64 != "" {
                    var decoded, decodeErr = b64decode(b64)
                    if decodeErr == nil {
                      caBundleParts = append(caBundleParts, decoded)
                    }
                  }
                }
              }
            }
          var wkca = dig_string(validation, "", "wellKnownCACertificates")
          if len(caBundleParts) > 0 {
            var caBundle = join(caBundleParts, "\n")
            var policyName = dig_string(winningPolicy, "", "metadata", "name")
            var caFilename = "btls-" + tostring(backendNs) + "-" + policyName + ".crt"
            {#- "ca-file": delivered as a general file (same disk path) but
                flagged so a content-only trust-bundle rotation applies via the
                runtime API (add ssl ca-file) with no reload on v3.2+ — backend
                mTLS / SPIFFE bundles rotate every few hours. -#}
            var resolvedPath, fileErr = fileRegistry.Register("ca-file", caFilename, caBundle)
            if fileErr == nil {
              btlsCaPath = resolvedPath
            }
          } else if wkca == "System" {
            btlsCaPath = "@system-ca"
          }
          // Per Gateway API spec, when a BackendTLSPolicy targets a
          // backend but its caCertificateRefs all fail to resolve (and
          // no System wellKnownCACertificates fallback), the policy is
          // *invalid* and the backend MUST not be reachable — clients
          // must see 5xx, not be silently downgraded to plaintext.
          // Conformance: BackendTLSPolicyInvalidCACertificateRef.
          if btlsCaPath == "" {
            btlsBroken = true
          }
        }
        // Resolve gateway client cert ref via the route's parentRefs.
        // Walk the route's parents in declaration order and pick the
        // first one with a working clientCertificateRef.
        for _, parentRef := range route.Spec.ParentRefs {
          if gwClientCertPath != "" {
            break
          }
          var prGroup = parentRef.Group
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = parentRef.Kind
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
            continue
          }
          var gwNs = parentRef.Namespace
          if gwNs == "" { gwNs = routeNs }
          var gwName = parentRef.Name
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          // Dig-only: spec.tls newer than the oldest resolvable Gateway schema.
          var ccRef = dig(gw, "spec", "tls", "backend", "clientCertificateRef")
          if dig_string(ccRef, "", "name") == "" {
            // Optional struct fields default to the zero value;
            // an empty Name is the clearest "no ref configured"
            // signal. (Same proxy used by ingress.yaml's
            // defaultBackend block.)
            continue
          }
          var refGroup = dig_string(ccRef, "", "group")
          var refKind = dig_string(ccRef, "", "kind")
          if refKind == "" { refKind = "Secret" }
          var refName = dig_string(ccRef, "", "name")
          var refNs = dig_string(ccRef, "", "namespace")
          if refNs == "" { refNs = gwNs }
          if (refGroup != "" && refGroup != "core") || refKind != "Secret" || refName == "" {
            continue
          }
          var sec = resources.secrets.GetSingle(refNs, refName)
          if sec == nil {
            continue
          }
          // sec is typed *resources.secrets.T — sec.Data is
          // map[string]string directly (no assertion needed).
          var dataMap = sec.Data
          var crtB64, ok1 = dataMap["tls.crt"]
          var keyB64, ok2 = dataMap["tls.key"]
          if !ok1 || !ok2 || crtB64 == "" || keyB64 == "" {
            continue
          }
          var crtPem, e1 = b64decode(crtB64)
          var keyPem, e2 = b64decode(keyB64)
          if e1 != nil || e2 != nil {
            continue
          }
          var combined = crtPem + "\n" + keyPem
          var fname = "gw-clientcert-" + gwNs + "-" + gwName + ".pem"
          {#- Register the bundle as type "cert" so the file lands under
              the chart's SSL dir (`ssl/`). HAProxy's `crt-base ssl`
              will prepend `ssl/` to the emitted relative path on the
              `crt` directive — so we emit JUST the filename (without
              the `ssl/` prefix that fileRegistry returns) and let
              crt-base re-add it. Closes the GatewayBackendClient
              CertificateFeature webhook admission failure ("unable to
              stat SSL certificate from file 'ssl/general/gw-clientcert-
              ...'"): the previous "file" registration produced
              `general/<fname>` which crt-base turned into the
              non-existent `ssl/general/<fname>`. -#}
          var _, fErr = fileRegistry.Register("cert", fname, combined)
          if fErr == nil {
            gwClientCertPath = fname
          }
        }
      %%}
      # Backend for: {{ routeTypeLabel }} {{ routeNs }}/{{ routeName }} → Service {{ backendName }}:{{ backendPort }}
      backend {{ beKey }}
          guid {{ make_guid("be", beKey) }}
        default-server check{%- if resolvedProtoFlag != "" %} proto {{ resolvedProtoFlag }}{%- end -%}
      {%- if btlsCaPath != "" && btlsCaPath != "@system-ca" %} ssl ca-file {{ btlsCaPath }} verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}){%- end %}{%- if btlsVerifyHost != "" %} verifyhost {{ btlsVerifyHost }}{%- end -%}
      {%- else if btlsCaPath == "@system-ca" %} ssl verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}){%- end %}{%- if btlsVerifyHost != "" %} verifyhost {{ btlsVerifyHost }}{%- end -%}
      {%- else if gwClientCertPath != "" %} ssl verify none
      {%- end -%}
      {%- if gwClientCertPath != "" %} crt {{ gwClientCertPath }}
      {%- end %}
      {%- if btlsBroken %}
          # BackendTLSPolicy CA unresolved → fail closed (503) per Gateway API spec; downgrading
          # to plaintext would defeat the policy. See https://haproxy-haptic.org/helm-chart/latest/libraries/gateway/
          http-request return status 503
      {%- end %}
      {#- GEP-1619 session persistence (type Cookie / unset) — see the
          HTTPRoute backend block above for the full rationale. Backends
          are deduplicated per (route, service, port); find the first rule
          that declares Cookie sessionPersistence AND references this
          (service, port) backend, then emit one backend-scoped cookie
          directive. Per-pod cookie-insert affinity is the correct
          GEP-1619 mapping. type: Header is not implemented. -#}
      {%- var spCookieEmitted = false %}
      {%- for _, rl := range route.Spec.Rules %}
        {%- if !spCookieEmitted %}
          {%- var sp = dig(rl, "sessionPersistence") %}
          {%- if sp != nil %}
            {%- var spType = tostring(dig(sp, "type") | fallback("Cookie")) %}
            {%- if spType == "Cookie" %}
              {%- var refsThis = false %}
              {%- for _, bRef := range rl.BackendRefs %}
                {%- if bRef.Name == backendName && toint(bRef.Port) == toint(backendPort) %}
                  {%- refsThis = true %}
                {%- end %}
              {%- end %}
              {%- if refsThis %}
                {%- var cookieName = tostring(dig(sp, "sessionName") | fallback("")) %}
                {%- if cookieName == "" %}{%- cookieName = "SESSION" %}{%- end %}
                {%- var absTimeout = tostring(dig(sp, "absoluteTimeout") | fallback("")) %}
                {%- var idleTimeout = tostring(dig(sp, "idleTimeout") | fallback("")) %}
                {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
                {%- if absTimeout != "" %}{%- cookieDir = cookieDir + " maxlife " + absTimeout %}{%- end %}
                {%- if idleTimeout != "" %}{%- cookieDir = cookieDir + " maxidle " + idleTimeout %}{%- end %}
          # GEP-1619 session persistence (Cookie) — per-pod cookie-insert affinity
          {{ cookieDir }}
          dynamic-cookie-key {{ sha256(beKey) }}
                {%- spCookieEmitted = true %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
        {{ BackendServers(backendName, 10, backendPort, nil, nil, beKey, backendNs) | indent(2, true) -}}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  util-sharded-gateway-backends:
    requires: [gateways, grpcroutes, httproutes]
    template: |
      {#-
        Per-Kind typed sharded Gateway backend wrappers.

        Each wrapper inlines the sharding logic and calls its
        Kind-specific Generate macro directly with the typed slice.
        Sharding is auto-calculated:
          clamp(resourceCount / 300, 1, 2 * GOMAXPROCS).
        Deduplication via first_seen() is thread-safe (sync.Map).
      -#}
      {%- import "util-generate-httproute-backends-gateway" for GenerateHTTPRouteBackends -%}
      {%- import "util-generate-grpcroute-backends-gateway" for GenerateGRPCRouteBackends -%}
      {%- import "util-macros" for CalculateShardCount -%}

      {%- macro ShardedHTTPRouteBackends(routes []*resources.httproutes.T, dedupCategory string) -%}
        {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
        {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateHTTPRouteBackends(routes, dedupCategory) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateHTTPRouteBackends(shard_slice(routes, i, n), dedupCategory) }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

      {%- macro ShardedGRPCRouteBackends(routes []*resources.grpcroutes.T, dedupCategory string) -%}
        {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
        {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateGRPCRouteBackends(routes, dedupCategory) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateGRPCRouteBackends(shard_slice(routes, i, n), dedupCategory) }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  backends-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {#- Generate backend definitions from HTTPRoute and GRPCRoute resources -#}
      {%- import "util-sharded-gateway-backends" for ShardedHTTPRouteBackends, ShardedGRPCRouteBackends -%}
      {#- Pre-cache gateway analysis during haproxy.cfg render (sequential).
          This ensures the cache is populated BEFORE map files render in parallel,
          preventing race conditions on the shared map. -#}
      {{- render "util-gateway-analysis" -}}
      # gateway/backends-gateway
      {{ ShardedHTTPRouteBackends(resources.httproutes.List(), "gatewayBackends_http") }}
      {{- ShardedGRPCRouteBackends(resources.grpcroutes.List(), "gatewayBackends_grpc") -}}

  backends-501-gateway-invalid:
    template: |
      {#-
        Sink backend for HTTPRoute rules where every backendRef is
        invalid (unsupported kind, non-core group). Per Gateway API
        spec, requests matching such a rule must receive HTTP 500.

        The chart's frontend-matchers-advanced-900-path-match snippet
        routes such rules' traffic here (qualifier
        "BACKEND:gw-invalid-backend") rather than to a real Service-
        backed backend whose `name` happened to collide with the
        invalid ref's `name` field.

        Always rendered (even when no Gateway API resources exist) so
        the BACKEND qualifier always resolves; HAProxy refuses to load
        a config that references a non-existent backend.
      -#}
      # gateway/backends-501-gateway-invalid
      backend gw-invalid-backend
          guid be:gw-invalid-backend
          http-request return status 500

  backends-501-gateway-ssl-passthrough:
    requires: [gateways, httproutes, tlsroutes]
    template: |
      {#-
        Gateway API SSL Passthrough Backends

        Purpose:
          TCP backends for SSL passthrough from Gateway API resources.
          Forwards encrypted traffic directly to pods without SSL termination.
          Uses util-gateway-ssl-passthrough for cached analysis.

        Generated HAProxy Config:
          backend ssl-passthrough-<namespace>-<name>
            mode tcp
            server SRV_1 <pod-ip>:<pod-port> check
      -#}
      {#- Get cached SSL passthrough analysis (runs once, shared across all renders) #}
      {%- import "util-backend-servers" for BackendServers -%}
      {{ render "util-gateway-ssl-passthrough" }}

      {%- var sslPassthroughData = shared.Get("gateway_ssl_passthrough").(map[string]any) %}
      {%- var sslBackends []any = sslPassthroughData["backends"] %}
      {%- for _, backendInfo := range sslBackends %}
        {#- Skip entries flagged invalid by Pass 2 (failed
            ResolvedRefs gate). They keep their slot in the
            passthrough list so the SNI consumers (ssl-tcp,
            frontends-600-gateway-tls-listener) can register the
            claimed SNI as "claimed but unrouteable" and reject
            inbound connections. Emitting a backend block here
            would point at a non-existent Service. -#}
        {%- if tostring(backendInfo | dig("invalid") | fallback("false")) == "true" %}
          {%- continue %}
        {%- end %}
        {%- var biNamespace = backendInfo["namespace"] %}
        {%- var biRoute = backendInfo["route"] %}
        {%- var biName = backendInfo["name"] %}
        {%- var biRouteType = backendInfo["route_type"] %}
        {#- Dedup by backend name so multi-rule TLSRoutes (one entry per
            intersected SNI, possibly several entries per rule) emit
            exactly one `backend gtw_tls_...` block per (route, ruleIdx). -#}
        {%- if first_seen("gateway_ssl_passthrough_backends", tostring(biName)) %}
          {%- if biRouteType == "httproute" %}
            {#- Get the actual HTTPRoute resource to extract service
                details. Flatten via `[*]`: outer rule loop only
                accessed rule.BackendRefs; the `if !generated`
                re-check at the rule level is no longer needed since
                the inner break exits the (single) desugared loop. -#}
            {%- var route = resources.httproutes.GetSingle(biNamespace, biRoute) %}
            {%- var generated = false %}
            {%- if route != nil %}
              {%- for _, backendRef := range route.Spec.Rules[*].BackendRefs %}
                {%- if !generated %}
                  {%- var refName = backendRef.Name %}
                  {%- var refPort = toint(backendRef.Port) %}
                  {%- if refPort == 0 %}{%- refPort = 80 %}{%- end %}
      # gateway/backends-gateway-ssl-passthrough

      backend {{ biName }}
          guid {{ make_guid("be", biName) }}
          mode tcp
          {{ BackendServers(refName, 10, refPort, nil, nil, biName, tostring(biNamespace)) | indent(4, false) }}
                  {%- generated = true %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- else if biRouteType == "tlsroute" %}
            {#- TLSRoute: emit one TCP backend per rule. Use the rule
                index from the entry to find the right backendRef. -#}
            {%- var route = resources.tlsroutes.GetSingle(biNamespace, biRoute) %}
            {%- if route != nil %}
              {%- var ruleIdx = toint(backendInfo["rule_idx"]) %}
              {%- var rules = route.Spec.Rules %}
              {%- if ruleIdx < len(rules) %}
                {%- var rule = rules[ruleIdx] %}
                {%- var generated = false %}
                {%- for _, backendRef := range rule.BackendRefs %}
                  {%- if !generated %}
                    {%- var refName = backendRef.Name %}
                    {%- var refPort = toint(backendRef.Port) %}
                    {%- if refPort == 0 %}{%- refPort = 443 %}{%- end %}
                    {%- var refNs = backendRef.Namespace %}
                    {%- if refNs == "" %}{%- refNs = tostring(biNamespace) %}{%- end %}
      # gateway/backends-gateway-ssl-passthrough (tlsroute)

      backend {{ biName }}
          guid {{ make_guid("be", biName) }}
          mode tcp
          {{ BackendServers(refName, 10, refPort, nil, nil, biName, refNs) | indent(4, false) }}
                    {%- generated = true %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
