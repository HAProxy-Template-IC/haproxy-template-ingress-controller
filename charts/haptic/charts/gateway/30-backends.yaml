    template: |-
      {%- import "util-generate-grpcroute-backends-gateway" for GenerateGRPCRouteBackends -%}
      {%- var route = resources.grpcroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}
      {{- GenerateGRPCRouteBackends([]*resources.grpcroutes.T{route}, "grpc") -}}
