          {%- if registerErr != nil -%}{{ fail(tostring(registerErr)) }}{%- end -%}
        {%- end -%}
      {%- end -%}
      {% end %}

  backenditems-500-gateway-http:
    requires: [gateways, httproutes, referencegrants, services, endpoints, secrets, configmaps]
    incremental:
