templateSnippets:
  util-generate-httproute-backends-gateway:
    requires: [gateways, httproutes, referencegrants]
    template: |
      {%- import "util-backend" for FlagsToKeywordArgs, PrepareBackend -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- macro GenerateHTTPRouteBackends(routes []any, dedupCategory string) -%}
      {%- for _, route := range routes -%}
      {%- var routeNs = dig_string(route, "", "metadata", "namespace") -%}
      {%- var routeName = dig_string(route, "", "metadata", "name") -%}
      {%- var backendFiles = []any{} -%}
      {%- var seenBackends = map[string]bool{} -%}
      {%- var FilePath = func(fileType string, filename string) string {
        var base = tostring(props["fileDir"])
        if fileType == "map" { base = tostring(props["mapDir"]) }
        if base == "" { return filename }
        return base + "/" + filename
      } -%}
      {%- var RegisterBackendFile = func(fileType string, filename string, content string) (string, error) {
        backendFiles = append(backendFiles, map[string]any{
          "type": fileType, "filename": filename, "content": content,
        })
        return FilePath(fileType, filename), nil
      } -%}
      {%- for _, rule := range toSlice(dig(route, "spec", "rules")) -%}
      {%- var backendRefs = toSlice(dig(rule, "backendRefs")) -%}
      {%- if len(backendRefs) > 0 %}
      {%- for _, backendRef := range backendRefs -%}
      {#- Only a valid ref (core/v1 Service that exists, ReferenceGrant-covered)
          gets a backend section; the frontend and the weighted map route every
          other ref to gw-invalid-backend (500), so an unreachable section would
          only cost config size and reload time. -#}
      {%- if BackendRefValid("HTTPRoute", routeNs, backendRef) != "true" -%}
        {%- continue -%}
      {%- end -%}
      {%- var backendName = dig_string(backendRef, "", "name") -%}
      {%- var backendPort = toint(dig(backendRef, "port") | fallback(0)) -%}
      {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end -%}
      {#- Cross-namespace ref: the Service and its EndpointSlices live in
          backendNs, so endpoint resolution below must use it, not routeNs. -#}
      {%- var backendNs = dig_string(backendRef, "", "namespace") -%}
      {%- if backendNs == "" %}{%- backendNs = routeNs %}{%- end -%}
      {%- var backend = map[string]any{"name": backendName, "port": backendPort} -%}
      {%- var backendKey = backendNs + "_" + routeNs + "_" + routeName + "_" + backendName + "_" + tostring(backendPort) -%}
      {%- if !seenBackends[backendKey] -%}
      {%- seenBackends[backendKey] = true -%}
      {%- var protoFlag = "" -%}
      {%- var routeTypeLabel = "HTTPRoute" -%}
      {%- var beKey = BackendNameGateway(route, backend) -%}
      {#- A Service port with appProtocol kubernetes.io/h2c needs `proto h2`;
          ws/wss need no directive (native HTTP handling covers them). -#}
      {%- var resolvedProtoFlag = protoFlag -%}
      {%- if protoFlag == "" -%}
        {%- var svc = resources.services.GetSingle(backendNs, tostring(backendName)) -%}
        {%- if svc != nil -%}
          {%- for _, p := range svc.Spec.Ports -%}
            {%- if toint(p.Port) == toint(backendPort) -%}
              {%- if p.AppProtocol == "kubernetes.io/h2c" -%}
                {%- resolvedProtoFlag = "h2" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- var btlsCaPath = "" -%}
      {%- var btlsHostname = "" -%}
      {%- var btlsVerifyHost = "" -%}
      {%- var btlsBroken = false -%}
      {%- var gwClientCertPath = "" -%}
      {%%
        var portNameForBackend = ""
        if protoFlag == "" {
          var svcLookup = resources.services.GetSingle(tostring(backendNs), tostring(backendName))
          if svcLookup != nil {
            for _, p := range svcLookup.Spec.Ports {
              if toint(p.Port) == toint(backendPort) {
                portNameForBackend = p.Name
              }
            }
          }
        }
        var policyTarget = tostring(backendNs) + "\x00" + tostring(backendName) + "\x00" + portNameForBackend
        var winningPolicy, _ = shared.Select("gateway-backend-tls-policies", "targets", policyTarget)
        if winningPolicy != nil {
          var validation any = dig(winningPolicy, "validation")
          btlsHostname = dig_string(validation, "", "hostname")
          // verifyhost takes the FIRST Hostname SAN if any, else hostname
          // (HAProxy verifyhost is single-valued; SAN OR-lists / URI SANs
          // have no equivalent). hostname keeps driving SNI.
          btlsVerifyHost = dig_string(validation, "", "hostname")
          for _, san := range dig(validation, "subjectAltNames") | toSlice() {
            if dig_string(san, "", "type") == "Hostname" && dig_string(san, "", "hostname") != "" {
              btlsVerifyHost = dig_string(san, "", "hostname")
              break
            }
          }
          var caBundleParts = []any{}
          for _, ref := range dig(validation, "caCertificateRefs") | toSlice() {
            var refGroup = dig_string(ref, "", "group")
            var refKind = dig_string(ref, "", "kind")
            var refName = dig_string(ref, "", "name")
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(tostring(backendNs), refName)
                if cm != nil {
                  var caCrt = cm.Data["ca.crt"]
                  if caCrt != "" {
                    caBundleParts = append(caBundleParts, caCrt)
                  }
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(tostring(backendNs), refName)
                if sec != nil {
                  // sec.Data is map[string]string (typegen); a
                  // .(map[string]any) assertion panics on it.
                  var dataMap = sec.Data
                  var caCrt, ok = dataMap["ca.crt"]
                  var b64 = ""
                  if ok && caCrt != "" {
                    b64 = caCrt
                  } else {
                    var tlsCrt, ok2 = dataMap["tls.crt"]
                    if ok2 && tlsCrt != "" {
                      b64 = tlsCrt
                    }
                  }
                  if b64 != "" {
                    var decoded, decodeErr = b64decode(b64)
                    if decodeErr == nil {
                      caBundleParts = append(caBundleParts, decoded)
                    }
                  }
                }
              }
            }
          var wkca = dig_string(validation, "", "wellKnownCACertificates")
          if len(caBundleParts) > 0 {
            var caBundle = join(caBundleParts, "\n")
            var policyName = dig_string(winningPolicy, "", "name")
            var caFilename = "btls-" + tostring(backendNs) + "-" + policyName + ".crt"
            // Type "ca-file" (not "file"): same path, but a content-only
            // rotation then applies via the runtime API, no reload on 3.2+.
            var resolvedPath, fileErr = RegisterBackendFile("ca-file", caFilename, caBundle)
            if fileErr == nil {
              btlsCaPath = resolvedPath
            }
          } else if wkca == "System" {
            btlsCaPath = "@system-ca"
          }
          // An unresolvable CA makes the policy invalid: fail closed (503
          // below), never downgrade the backend connection to plaintext.
          if btlsCaPath == "" {
            btlsBroken = true
          }
        }
        for _, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
          if gwClientCertPath != "" {
            break
          }
          var prGroup = dig_string(parentRef, "", "group")
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = dig_string(parentRef, "", "kind")
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
            continue
          }
          var gwNs = dig_string(parentRef, "", "namespace")
          if gwNs == "" { gwNs = routeNs }
          var gwName = dig_string(parentRef, "", "name")
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          // Dig-only: spec.tls newer than the oldest resolvable Gateway schema.
          var ccRef = dig(gw, "spec", "tls", "backend", "clientCertificateRef")
          if dig_string(ccRef, "", "name") == "" {
            continue
          }
          var refGroup = dig_string(ccRef, "", "group")
          var refKind = dig_string(ccRef, "", "kind")
          if refKind == "" { refKind = "Secret" }
          var refName = dig_string(ccRef, "", "name")
          var refNs = dig_string(ccRef, "", "namespace")
          if refNs == "" { refNs = gwNs }
          if (refGroup != "" && refGroup != "core") || refKind != "Secret" || refName == "" {
            continue
          }
          var sec = resources.secrets.GetSingle(refNs, refName)
          if sec == nil {
            continue
          }
          var dataMap = sec.Data
          var crtB64, ok1 = dataMap["tls.crt"]
          var keyB64, ok2 = dataMap["tls.key"]
          if !ok1 || !ok2 || crtB64 == "" || keyB64 == "" {
            continue
          }
          var crtPem, e1 = b64decode(crtB64)
          var keyPem, e2 = b64decode(keyB64)
          if e1 != nil || e2 != nil {
            continue
          }
          var combined = crtPem + "\n" + keyPem
          var fname = "gw-clientcert-" + gwNs + "-" + gwName + ".pem"
          // Type "cert" lands the file under ssl/, and HAProxy's
          // `crt-base ssl` prepends ssl/ again — so emit the bare filename,
          // not the path fileRegistry returns.
          var _, fErr = RegisterBackendFile("cert", fname, combined)
          if fErr == nil {
            gwClientCertPath = fname
          }
        }

        // namespace/service go into backend-service.map (map-backend-service-*),
        // not set-var body lines, so the backend section stays empty (dynamic).
        // Every defaults-legal directive (default-server, the fail-closed 503,
        // retries, cookie, set-timeout) goes into the profile, not the body.
        var body = []any{}
        var profile = []any{}

        // default-server keywords, one per entry so the plan record carries each
        // as a structured KeywordArg (FlagsToKeywordArgs). The deploy side
        // composes `add server` from the record, so a BackendTLS backend keeps
        // its ssl/ca-file/verify/sni on a runtime-added pod (no silent bypass).
        var dsFlags = []any{}
        if resolvedProtoFlag != "" {
          dsFlags = append(dsFlags, "proto " + resolvedProtoFlag)
        }
        if btlsCaPath != "" && btlsCaPath != "@system-ca" {
          dsFlags = append(dsFlags, "ssl", "ca-file " + btlsCaPath, "verify required")
        } else if btlsCaPath == "@system-ca" {
          dsFlags = append(dsFlags, "ssl", "verify required")
        } else if gwClientCertPath != "" {
          dsFlags = append(dsFlags, "ssl", "verify none")
        }
        if btlsCaPath != "" {
          if btlsHostname != "" {
            dsFlags = append(dsFlags, "sni str(" + btlsHostname + ")")
          }
          if btlsVerifyHost != "" {
            dsFlags = append(dsFlags, "verifyhost " + btlsVerifyHost)
          }
        }
        if gwClientCertPath != "" {
          dsFlags = append(dsFlags, "crt " + gwClientCertPath)
        }
        // crt is crt-base-relative, so add server can't match it: structural (Backend
        // records why). Reload-free needs a crt-base-free absolute reference (follow-up).
        var beShape any = nil
        if gwClientCertPath != "" {
          beShape = "structural-crt"
        }
        var defaultServer = []any{map[string]any{"name": "check"}}
        for _, kw := range FlagsToKeywordArgs(dsFlags) {
          defaultServer = append(defaultServer, kw)
        }

        if btlsBroken {
          profile = append(profile,
            "# BackendTLSPolicy CA unresolved → fail closed (503) per Gateway API spec; downgrading",
            "# to plaintext would defeat the policy. See https://haproxy-haptic.org/docs/latest/libraries/gateway/",
            "http-request return status 503")
        }

        // Rule-level retry (GEP-1731). `retries`/`retry-on` are not conditional
        // directives, so they can't be scoped per gw_rule_id: with several rules
        // sharing this deduplicated backend, the first one carrying a retry block
        // wins. retry.backoff has no HAProxy equivalent and is dropped.
        if protoFlag == "" {
          var retryFound = false
          for _, rl := range toSlice(dig(route, "spec", "rules")) {
            if retryFound {
              continue
            }
            var rlReferencesBackend = false
            for _, bRef := range toSlice(dig(rl, "backendRefs")) {
              if dig_string(bRef, "", "name") == backendName &&
                toint(dig(bRef, "port") | fallback(0)) == toint(backendPort) {
                rlReferencesBackend = true
              }
            }
            if !rlReferencesBackend {
              continue
            }
            // dig(): `retry` is Experimental-channel only, so `rl.Retry`
            // doesn't compile against the Standard-channel CRD.
            var rt = dig(rl, "retry")
            var attempts = toint(dig(rt, "attempts"))
            if attempts <= 0 {
              continue
            }
            retryFound = true
            var codeParts = []any{}
            for _, c := range toSlice(dig(rt, "codes")) {
              codeParts = append(codeParts, tostring(toint(c)))
            }
            var retryCodes = "500 502 503 504"
            if len(codeParts) > 0 {
              retryCodes = join(codeParts, " ")
            }
            profile = append(profile, "retries " + tostring(attempts), "retry-on " + retryCodes)
          }
        }

        // GEP-1619 session persistence. Backends are deduplicated per
        // (route, service, port), so the first rule declaring Cookie persistence
        // for this backend wins. type: Header is not implemented (no stick-table
        // key for a dynamically-named header).
        var spCookieEmitted = false
        for _, rl := range toSlice(dig(route, "spec", "rules")) {
          if spCookieEmitted {
            continue
          }
          var sp = dig(rl, "sessionPersistence")
          if sp == nil || tostring(dig(sp, "type") | fallback("Cookie")) != "Cookie" {
            continue
          }
          var refsThis = false
          for _, bRef := range toSlice(dig(rl, "backendRefs")) {
            if dig_string(bRef, "", "name") == backendName &&
              toint(dig(bRef, "port") | fallback(0)) == toint(backendPort) {
              refsThis = true
            }
          }
          if !refsThis {
            continue
          }
          var cookieName = tostring(dig(sp, "sessionName") | fallback(""))
          if cookieName == "" { cookieName = "SESSION" }
          var absTimeout = tostring(dig(sp, "absoluteTimeout") | fallback(""))
          var idleTimeout = tostring(dig(sp, "idleTimeout") | fallback(""))
          var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic"
          if absTimeout != "" { cookieDir = cookieDir + " maxlife " + absTimeout }
          if idleTimeout != "" { cookieDir = cookieDir + " maxidle " + idleTimeout }
          // dynamic-cookie-key is shared per installation (not sha256(beKey) per
          // backend) so two backends with the same cookie config share one
          // profile. It salts the address→cookie hash; override for a secret salt.
          profile = append(profile,
            "# GEP-1619 session persistence (Cookie) — per-pod cookie-insert affinity",
            cookieDir,
            "dynamic-cookie-key " + tostring(props | dig("dynamicCookieKey") | fallback("haptic-dynamic-cookie")))
          spCookieEmitted = true
        }

        // GEP-1742 timeouts, keyed on the txn.gw_rule_id the frontend matcher
        // set: one line for every rule this backend serves, its value from a
        // map. `set-timeout server` is backend-only, which is why it is here
        // and not with the other map-driven filters.
        var toMap = FilePath("map", "gw-timeout.map")
        profile = append(profile, "http-request set-timeout server var(txn.gw_rule_id),map_str_int(" +
          tostring(toMap) + ") if { var(txn.gw_rule_id),map_str_int(" + tostring(toMap) + ") -m found }")
      %%}
      {%- var serverResult = BackendServersResult(backendName, 0, backendPort, nil, nil, beKey, backendNs) -%}
      {{- shared.Publish("owners", beKey, map[string]any{"backend": beKey}) -}}
      {%- var record, text = PrepareBackend(map[string]any{
           "name": beKey,
           "guid": make_guid("be", beKey),
           "comments": []any{"# Backend for: " + routeTypeLabel + " " + tostring(routeNs) + "/" + tostring(routeName) +
             " → Service " + tostring(backendName) + ":" + tostring(backendPort)},
           "shape": beShape,
           "defaultServer": defaultServer,
           "profile": profile,
           "body": body,
           "servers": serverResult["servers"],
         }) -%}
      {%- var token, planErr = planRegistry.BackendWhenAny(record, text, "owners", []string{beKey}) -%}
      {%- if planErr != nil -%}{{ fail(planErr.Error()) }}{%- end -%}
      {{ token }}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- if len(backendFiles) > 0 -%}
        {{- shared.Publish("effects", dedupCategory + "/" + routeNs + "/" + routeName,
          map[string]any{"files": backendFiles}) -}}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  util-generate-grpcroute-backends-gateway:
    requires: [gateways, grpcroutes, referencegrants]
    template: |
      {%- import "util-backend" for FlagsToKeywordArgs, PrepareBackend -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- macro GenerateGRPCRouteBackends(routes []*resources.grpcroutes.T, dedupCategory string) -%}
      {%- for _, route := range routes -%}
      {%- var routeNs = route.Metadata.Namespace -%}
      {%- var routeName = route.Metadata.Name -%}
      {%- var backendFiles = []any{} -%}
      {%- var seenBackends = map[string]bool{} -%}
      {%- var FilePath = func(fileType string, filename string) string {
        var base = tostring(props["fileDir"])
        if fileType == "map" { base = tostring(props["mapDir"]) }
        if base == "" { return filename }
        return base + "/" + filename
      } -%}
      {%- var RegisterBackendFile = func(fileType string, filename string, content string) (string, error) {
        backendFiles = append(backendFiles, map[string]any{
          "type": fileType, "filename": filename, "content": content,
        })
        return FilePath(fileType, filename), nil
      } -%}
      {%- for _, rule := range route.Spec.Rules -%}
      {%- var backendRefs = rule.BackendRefs -%}
      {%- if len(backendRefs) > 0 %}
      {%- for _, backendRef := range backendRefs -%}
      {#- Only a valid ref (core/v1 Service that exists, ReferenceGrant-covered)
          gets a backend section; the frontend and the weighted map route every
          other ref to gw-invalid-backend (500), so an unreachable section would
          only cost config size and reload time. -#}
      {%- if BackendRefValid("GRPCRoute", routeNs, backendRef) != "true" -%}
        {%- continue -%}
      {%- end -%}
      {%- var backendName = backendRef.Name -%}
      {%- var backendPort = toint(backendRef.Port) -%}
      {%- if backendPort == 0 %}{%- backendPort = 80 %}{%- end -%}
      {#- Cross-namespace ref: the Service and its EndpointSlices live in
          backendNs, so endpoint resolution below must use it, not routeNs. -#}
      {%- var backendNs = backendRef.Namespace -%}
      {%- if backendNs == "" %}{%- backendNs = routeNs %}{%- end -%}
      {%- var backend = map[string]any{"name": backendName, "port": backendPort} -%}
      {%- var backendKey = backendNs + "_" + routeNs + "_" + routeName + "_" + backendName + "_" + tostring(backendPort) -%}
      {%- if !seenBackends[backendKey] -%}
      {%- seenBackends[backendKey] = true -%}
      {%%
        var protoFlag = "h2"
        var routeTypeLabel = "GRPCRoute"
        var beKey = BackendNameGateway(route, backend)
        var resolvedProtoFlag = protoFlag
        var btlsCaPath = ""
        var btlsHostname = ""
        var btlsVerifyHost = ""
        var btlsBroken = false
        var gwClientCertPath = ""
      %%}
      {%%
        var portNameForBackend = ""
        var policyTarget = tostring(backendNs) + "\x00" + tostring(backendName) + "\x00" + portNameForBackend
        var winningPolicy, _ = shared.Select("gateway-backend-tls-policies", "targets", policyTarget)
        if winningPolicy != nil {
          var validation any = dig(winningPolicy, "validation")
          btlsHostname = dig_string(validation, "", "hostname")
          // verifyhost takes the FIRST Hostname SAN if any, else hostname
          // (HAProxy verifyhost is single-valued; SAN OR-lists / URI SANs
          // have no equivalent). hostname keeps driving SNI.
          btlsVerifyHost = dig_string(validation, "", "hostname")
          for _, san := range dig(validation, "subjectAltNames") | toSlice() {
            if dig_string(san, "", "type") == "Hostname" && dig_string(san, "", "hostname") != "" {
              btlsVerifyHost = dig_string(san, "", "hostname")
              break
            }
          }
          var caBundleParts = []any{}
          for _, ref := range dig(validation, "caCertificateRefs") | toSlice() {
            var refGroup = dig_string(ref, "", "group")
            var refKind = dig_string(ref, "", "kind")
            var refName = dig_string(ref, "", "name")
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(tostring(backendNs), refName)
                if cm != nil {
                  var caCrt = cm.Data["ca.crt"]
                  if caCrt != "" {
                    caBundleParts = append(caBundleParts, caCrt)
                  }
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(tostring(backendNs), refName)
                if sec != nil {
                  // sec.Data is map[string]string (typegen); a
                  // .(map[string]any) assertion panics on it.
                  var dataMap = sec.Data
                  var caCrt, ok = dataMap["ca.crt"]
                  var b64 = ""
                  if ok && caCrt != "" {
                    b64 = caCrt
                  } else {
                    var tlsCrt, ok2 = dataMap["tls.crt"]
                    if ok2 && tlsCrt != "" {
                      b64 = tlsCrt
                    }
                  }
                  if b64 != "" {
                    var decoded, decodeErr = b64decode(b64)
                    if decodeErr == nil {
                      caBundleParts = append(caBundleParts, decoded)
                    }
                  }
                }
              }
            }
          var wkca = dig_string(validation, "", "wellKnownCACertificates")
          if len(caBundleParts) > 0 {
            var caBundle = join(caBundleParts, "\n")
            var policyName = dig_string(winningPolicy, "", "name")
            var caFilename = "btls-" + tostring(backendNs) + "-" + policyName + ".crt"
            // Type "ca-file" (not "file"): same path, but a content-only
            // rotation then applies via the runtime API, no reload on 3.2+.
            var resolvedPath, fileErr = RegisterBackendFile("ca-file", caFilename, caBundle)
            if fileErr == nil {
              btlsCaPath = resolvedPath
            }
          } else if wkca == "System" {
            btlsCaPath = "@system-ca"
          }
          // An unresolvable CA makes the policy invalid: fail closed (503
          // below), never downgrade the backend connection to plaintext.
          if btlsCaPath == "" {
            btlsBroken = true
          }
        }
        for _, parentRef := range route.Spec.ParentRefs {
          if gwClientCertPath != "" {
            break
          }
          var prGroup = parentRef.Group
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = parentRef.Kind
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
            continue
          }
          var gwNs = parentRef.Namespace
          if gwNs == "" { gwNs = routeNs }
          var gwName = parentRef.Name
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          // Dig-only: spec.tls newer than the oldest resolvable Gateway schema.
          var ccRef = dig(gw, "spec", "tls", "backend", "clientCertificateRef")
          if dig_string(ccRef, "", "name") == "" {
            continue
          }
          var refGroup = dig_string(ccRef, "", "group")
          var refKind = dig_string(ccRef, "", "kind")
          if refKind == "" { refKind = "Secret" }
          var refName = dig_string(ccRef, "", "name")
          var refNs = dig_string(ccRef, "", "namespace")
          if refNs == "" { refNs = gwNs }
          if (refGroup != "" && refGroup != "core") || refKind != "Secret" || refName == "" {
            continue
          }
          var sec = resources.secrets.GetSingle(refNs, refName)
          if sec == nil {
            continue
          }
          var dataMap = sec.Data
          var crtB64, ok1 = dataMap["tls.crt"]
          var keyB64, ok2 = dataMap["tls.key"]
          if !ok1 || !ok2 || crtB64 == "" || keyB64 == "" {
            continue
          }
          var crtPem, e1 = b64decode(crtB64)
          var keyPem, e2 = b64decode(keyB64)
          if e1 != nil || e2 != nil {
            continue
          }
          var combined = crtPem + "\n" + keyPem
          var fname = "gw-clientcert-" + gwNs + "-" + gwName + ".pem"
          // Type "cert" lands the file under ssl/, and HAProxy's
          // `crt-base ssl` prepends ssl/ again — so emit the bare filename,
          // not the path fileRegistry returns.
          var _, fErr = RegisterBackendFile("cert", fname, combined)
          if fErr == nil {
            gwClientCertPath = fname
          }
        }

        // namespace/service go into backend-service.map (map-backend-service-*),
        // not set-var body lines, so the backend section stays empty (dynamic).
        // Every defaults-legal directive (default-server, the fail-closed 503,
        // retries, cookie, set-timeout) goes into the profile, not the body.
        var body = []any{}
        var profile = []any{}

        // default-server keywords, one per entry so the plan record carries each
        // as a structured KeywordArg (FlagsToKeywordArgs). The deploy side
        // composes `add server` from the record, so a BackendTLS backend keeps
        // its ssl/ca-file/verify/sni on a runtime-added pod (no silent bypass).
        var dsFlags = []any{}
        if resolvedProtoFlag != "" {
          dsFlags = append(dsFlags, "proto " + resolvedProtoFlag)
        }
        if btlsCaPath != "" && btlsCaPath != "@system-ca" {
          dsFlags = append(dsFlags, "ssl", "ca-file " + btlsCaPath, "verify required")
        } else if btlsCaPath == "@system-ca" {
          dsFlags = append(dsFlags, "ssl", "verify required")
        } else if gwClientCertPath != "" {
          dsFlags = append(dsFlags, "ssl", "verify none")
        }
        if btlsCaPath != "" {
          if btlsHostname != "" {
            dsFlags = append(dsFlags, "sni str(" + btlsHostname + ")")
          }
          if btlsVerifyHost != "" {
            dsFlags = append(dsFlags, "verifyhost " + btlsVerifyHost)
          }
        }
        if gwClientCertPath != "" {
          dsFlags = append(dsFlags, "crt " + gwClientCertPath)
        }
        // crt is crt-base-relative, so add server can't match it: structural (Backend
        // records why). Reload-free needs a crt-base-free absolute reference (follow-up).
        var beShape any = nil
        if gwClientCertPath != "" {
          beShape = "structural-crt"
        }
        var defaultServer = []any{map[string]any{"name": "check"}}
        for _, kw := range FlagsToKeywordArgs(dsFlags) {
          defaultServer = append(defaultServer, kw)
        }

        if btlsBroken {
          profile = append(profile,
            "# BackendTLSPolicy CA unresolved → fail closed (503) per Gateway API spec; downgrading",
            "# to plaintext would defeat the policy. See https://haproxy-haptic.org/docs/latest/libraries/gateway/",
            "http-request return status 503")
        }

        // GEP-1619 session persistence — rationale in the HTTPRoute backend
        // above; the first Cookie rule referencing this backend wins.
        var spCookieEmitted = false
        for _, rl := range route.Spec.Rules {
          if spCookieEmitted {
            continue
          }
          var sp = dig(rl, "sessionPersistence")
          if sp == nil || tostring(dig(sp, "type") | fallback("Cookie")) != "Cookie" {
            continue
          }
          var refsThis = false
          for _, bRef := range rl.BackendRefs {
            if bRef.Name == backendName && toint(bRef.Port) == toint(backendPort) {
              refsThis = true
            }
          }
          if !refsThis {
            continue
          }
          var cookieName = tostring(dig(sp, "sessionName") | fallback(""))
          if cookieName == "" { cookieName = "SESSION" }
          var absTimeout = tostring(dig(sp, "absoluteTimeout") | fallback(""))
          var idleTimeout = tostring(dig(sp, "idleTimeout") | fallback(""))
          var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic"
          if absTimeout != "" { cookieDir = cookieDir + " maxlife " + absTimeout }
          if idleTimeout != "" { cookieDir = cookieDir + " maxidle " + idleTimeout }
          // dynamic-cookie-key is shared per installation (not sha256(beKey) per
          // backend) so two backends with the same cookie config share one
          // profile. It salts the address→cookie hash; override for a secret salt.
          profile = append(profile,
            "# GEP-1619 session persistence (Cookie) — per-pod cookie-insert affinity",
            cookieDir,
            "dynamic-cookie-key " + tostring(props | dig("dynamicCookieKey") | fallback("haptic-dynamic-cookie")))
          spCookieEmitted = true
        }

        // GEP-1742 timeouts, same map and gate as the HTTPRoute backend above.
        var toMap = FilePath("map", "gw-timeout.map")
        profile = append(profile, "http-request set-timeout server var(txn.gw_rule_id),map_str_int(" +
          tostring(toMap) + ") if { var(txn.gw_rule_id),map_str_int(" + tostring(toMap) + ") -m found }")
      %%}
      {%- var serverResult = BackendServersResult(backendName, 0, backendPort, nil, nil, beKey, backendNs) -%}
      {{- shared.Publish("owners", beKey, map[string]any{"backend": beKey}) -}}
      {%- var record, text = PrepareBackend(map[string]any{
           "name": beKey,
           "guid": make_guid("be", beKey),
           "comments": []any{"# Backend for: " + routeTypeLabel + " " + tostring(routeNs) + "/" + tostring(routeName) +
             " → Service " + tostring(backendName) + ":" + tostring(backendPort)},
           "shape": beShape,
           "defaultServer": defaultServer,
           "profile": profile,
           "body": body,
           "servers": serverResult["servers"],
         }) -%}
      {%- var token, planErr = planRegistry.BackendWhenAny(record, text, "owners", []string{beKey}) -%}
      {%- if planErr != nil -%}{{ fail(planErr.Error()) }}{%- end -%}
      {{ token }}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- if len(backendFiles) > 0 -%}
        {{- shared.Publish("effects", dedupCategory + "/" + routeNs + "/" + routeName,
          map[string]any{"files": backendFiles}) -}}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  backendtlsvalues-490-gateway:
    requires: [backendtlspolicies, services]
    incremental:
      source: backendtlspolicies
      group: gateway-backend-tls-policies
      effects: [publishValue]
    template: |-
      {%%
        var policy = item
        var policyNs = dig_string(policy, "", "metadata", "namespace")
        var policyName = dig_string(policy, "", "metadata", "name")
        var policyKey = policyNs + "/" + policyName
        var policyTs = dig_string(policy, "", "metadata", "creationTimestamp")
        var rank = "1/" + policyKey
        if policyTs != "" { rank = "0/" + policyTs + "/" + policyKey }
        var validation = dig(policy, "spec", "validation")
        var publishedValue = map[string]any{"validation": validation}
        if len(dig(validation, "caCertificateRefs") | toSlice()) > 0 {
          publishedValue["name"] = policyName
        }
        var published = map[string]bool{}
        for _, targetRef := range dig(policy, "spec", "targetRefs") | toSlice() {
          var targetGroup = dig_string(targetRef, "", "group")
          var targetKind = dig_string(targetRef, "", "kind")
          var targetName = dig_string(targetRef, "", "name")
          if (targetGroup != "" && targetGroup != "core") || targetKind != "Service" || targetName == "" {
            continue
          }
          var sections = map[string]bool{}
          var sectionName = dig_string(targetRef, "", "sectionName")
          if sectionName != "" {
            sections[sectionName] = true
          } else {
            sections[""] = true
            var service = resources.services.GetSingle(policyNs, targetName)
            if service != nil {
              for _, servicePort := range service.Spec.Ports {
                sections[servicePort.Name] = true
              }
            }
          }
          for _, section := range keys(sections) {
            var target = policyNs + "\x00" + targetName + "\x00" + section
            if published[target] { continue }
            published[target] = true
            show shared.PublishRanked("targets", target, rank, publishedValue)
          }
        }
      %%}

  util-gateway-backend-bindings:
    template: |-
      {%- var GatewayBackendProps = func() map[string]any {
        var mapDir, mapErr = pathResolver.GetPath("", "map")
        if mapErr != nil { fail(tostring(mapErr)) }
        var fileDir, fileErr = pathResolver.GetPath("", "file")
        if fileErr != nil { fail(tostring(fileErr)) }
        return map[string]any{
          "mapDir": mapDir,
          "fileDir": fileDir,
          "dynamicCookieKey": extraContext | dig("dynamicCookieKey") | fallback("haptic-dynamic-cookie"),
        }
      } -%}

  util-gateway-http-backend-bindings:
