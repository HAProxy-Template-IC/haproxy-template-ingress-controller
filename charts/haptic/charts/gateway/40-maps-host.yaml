templateSnippets:
  map-hostvalues-479-gateway-listenersets-empty:
    requires: [gateways]
    incremental:
      bindingsTemplate: '{}'
      group: gateway-host-listenersets
      effects: [publishValue]
    template: '{{- "" -}}'

  map-hostvalues-480-gateway-listenersets:
    requires: [gateways, listenersets, namespaces]
    incremental:
      source: listenersets
      group: gateway-host-listenersets
      effects: [publishValue]
    template: |-
      {%%
        var lsNamespace = dig_string(item, "", "metadata", "namespace")
        var lsName = dig_string(item, "", "metadata", "name")
        var listenerSet = resources.listenersets.GetSingle(lsNamespace, lsName)
        if listenerSet != nil {
          var gatewayNamespace = listenerSet.Spec.ParentRef.Namespace
          if gatewayNamespace == "" { gatewayNamespace = lsNamespace }
          var gateway = resources.gateways.GetSingle(gatewayNamespace, listenerSet.Spec.ParentRef.Name)
          var permitted = false
          if gateway != nil {
            var allowed = dig(gateway, "spec", "allowedListeners")
            var allowedFrom = "None"
            var allowedSelector any = nil
            if allowed != nil {
              allowedFrom = tostring(dig(allowed, "namespaces", "from") | fallback("None"))
              allowedSelector = dig(allowed, "namespaces", "selector", "matchLabels")
            }
            switch allowedFrom {
            case "All":
              permitted = true
            case "Same":
              permitted = lsNamespace == gatewayNamespace
            case "Selector":
              if allowedSelector != nil {
                var namespace = resources.namespaces.GetSingle(lsNamespace)
                if namespace != nil {
                  permitted = true
                  for key, expected := range to_str_map(allowedSelector) {
                    var actual, found = namespace.Metadata.Labels[key]
                    if !found || actual != expected {
                      permitted = false
                      break
                    }
                  }
                }
              }
            }
          }
          var candidates = []any{}
          for listenerIndex, listener := range listenerSet.Spec.Listeners {
            var certificateRefs = []any{}
            for _, certificateRef := range listener.Tls.CertificateRefs {
              certificateRefs = append(certificateRefs, map[string]any{
                "group": certificateRef.Group,
                "kind": certificateRef.Kind,
                "name": certificateRef.Name,
                "namespace": certificateRef.Namespace,
              })
            }
            var tlsOptions = map[string]any{}
            for option, value := range listener.Tls.Options {
              tlsOptions[option] = value
            }
            var allowedNamespaces = map[string]any{}
            var allowedFrom = dig_string(listener, "", "allowedRoutes", "namespaces", "from")
            if allowedFrom != "" {
              allowedNamespaces["from"] = allowedFrom
            }
            var allowedLabels = map[string]any{}
            for label, value := range to_str_map(
              dig(listener, "allowedRoutes", "namespaces", "selector", "matchLabels")) {
              allowedLabels[label] = value
            }
            if dig(listener, "allowedRoutes", "namespaces", "selector") != nil {
              allowedNamespaces["selector"] = map[string]any{"matchLabels": allowedLabels}
            }
            candidates = append(candidates, map[string]any{
              "name": listener.Name,
              "hostname": listener.Hostname,
              "port": listener.Port,
              "protocol": listener.Protocol,
              "allowedRoutes": map[string]any{"namespaces": allowedNamespaces},
              "tls": map[string]any{
                "mode": listener.Tls.Mode,
                "options": tlsOptions,
                "certificateRefs": certificateRefs,
              },
              "ownerNamespace": lsNamespace,
              "index": listenerIndex,
            })
          }
          var listenerSetKey = lsNamespace + "/" + lsName
          var creationTimestamp = listenerSet.Metadata.CreationTimestamp
          var sortTimestamp = creationTimestamp
          if sortTimestamp == "" { sortTimestamp = "9999-12-31T23:59:59Z" }
          var entry = map[string]any{
            "accepted": permitted,
            "candidates": candidates,
            "gatewayNamespace": gatewayNamespace,
            "gatewayName": listenerSet.Spec.ParentRef.Name,
            "listenerSetNamespace": lsNamespace,
            "listenerSetName": lsName,
            "creationTimestamp": creationTimestamp,
            "sortTimestamp": sortTimestamp,
            "rank": sortTimestamp + "\x00" + listenerSetKey,
          }
          show shared.Publish("listenersets", listenerSetKey, entry)
          if gateway != nil {
            show shared.Publish("gateway\x00" + gatewayNamespace + "\x00" +
              listenerSet.Spec.ParentRef.Name, listenerSetKey, entry)
          }
        }
      %%}

  map-hostvalues-490-gateway-port-scopes:
    requires: [gateways]
    template: |-
      {{- render "gateway-pod-port-candidates-100-gateway" -}}
      {{- render "gateway-pod-port-allocations-200-leader" -}}
      {{- render "gateway-host-port-scopes-100-gateway" -}}

  gateway-host-port-scopes-100-gateway:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-host-port-scopes
      consumes: [gateway-pod-port-allocations]
      effects: [publishValue]
    template: |-
      {%%
        var gatewayNamespace = dig_string(item, "", "metadata", "namespace")
        var gatewayName = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(gatewayNamespace, gatewayName)
        if gateway != nil {
          var seenPorts = map[int]bool{}
          for _, listener := range gateway.Spec.Listeners {
            var listenerPort = toint(listener.Port)
            if listenerPort <= 0 || seenPorts[listenerPort] ||
              (listener.Protocol != "HTTP" && listener.Protocol != "HTTPS") {
              continue
            }
            seenPorts[listenerPort] = true
            var allocationKey = gatewayNamespace + "/" + gatewayName + ":" +
              listener.Name + ":" + tostring(listenerPort)
            var podPort, found = shared.Select(
              "gateway-pod-port-allocations", "ports", allocationKey)
            if found {
              show shared.Publish("ports", gatewayNamespace + "/" + gatewayName + ":" +
                tostring(listenerPort), podPort)
            }
          }
        }
      %%}

  util-generate-httproute-host-map-gateway:
    requires: [gateways, httproutes, referencegrants]
    template: |
      {#
        Generate host map entries for HTTPRoute.

        Per Gateway API spec the effective hostname set for a route is
        the *intersection* of the route's `spec.hostnames` with each
        attached listener's hostname:

          - route empty + listener empty           → "" (catch-all)
          - route empty + listener H               → H  (route inherits)
          - route H... + listener "" (catch-all)   → each H (route narrows)
          - route H... + listener L                → per-pair intersection
            (drops pairs with no intersection — e.g. `wildcard.io` against
             `*.wildcard.io` does NOT intersect, since `*.wildcard.io`
             matches at least one prefix label, not the bare base)

        AnalyzeRoutes does the same computation for the per-route
        routeInfo entries that drive advanced matchers; this snippet
        mirrors the logic so host.map and the route-analysis view stay
        consistent.
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection, HostnameSinglePairMatch, HostnameRank -%}
      {%- macro GenerateHTTPRouteHostMap(routes []any) -%}
      {%- for _, route := range routes %}
      {%%
        var routeHostnames = toSlice(dig(route, "spec", "hostnames"))
        var effectiveHosts = map[string]bool{}
        var resolvedGwCount = 0
        var routeNs = dig_string(route, "", "metadata", "namespace")
        for _, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
          var prGroup = dig_string(parentRef, "", "group")
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = dig_string(parentRef, "", "kind")
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" {
            continue
          }
          if prKind == "ListenerSet" {
            var lsNs = dig_string(parentRef, "", "namespace")
            if lsNs == "" { lsNs = routeNs }
            var lsName = dig_string(parentRef, "", "name")
            var section = dig_string(parentRef, "", "sectionName")
            var prPort = toint(dig(parentRef, "port") | fallback(0))
            // An absent publication means the ListenerSet isn't observed.
            var lsEntry, _ = shared.Select(
              "gateway-host-listenersets", "listenersets", lsNs + "/" + lsName)
            if lsEntry == nil {
              continue
            }
            var lsInfo = lsEntry.(map[string]any)
            if !lsInfo["accepted"].(bool) {
              continue
            }
            resolvedGwCount = resolvedGwCount + 1
            for _, cAny := range lsInfo["candidates"].([]any) {
              var listener = cAny.(map[string]any)
              var listenerName = tostring(listener["name"])
              if section != "" && section != listenerName {
                continue
              }
              var listenerPort = toint(listener["port"])
              if prPort != 0 && prPort != listenerPort {
                continue
              }
              var listenerProto = tostring(listener["protocol"])
              if listenerProto == "" { listenerProto = "HTTP" }
              var portSuffix = ""
              if listenerPort > 0 {
                if (listenerProto == "HTTP" && listenerPort != 80) || (listenerProto == "HTTPS" && listenerPort != 443) || (listenerProto == "TLS" && listenerPort != 443) {
                  portSuffix = ":" + tostring(listenerPort)
                }
              }
              var listenerHostname = dig_string(listener, "", "hostname")
              if len(routeHostnames) == 0 {
                effectiveHosts[listenerHostname + portSuffix] = true
              } else if listenerHostname == "" {
                for _, rh := range routeHostnames {
                  effectiveHosts[rh + portSuffix] = true
                }
              } else {
                for _, rh := range routeHostnames {
                  var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                  if inter != "" {
                    effectiveHosts[inter + portSuffix] = true
                  }
                }
              }
            }
            continue
          }
          if prKind != "Gateway" {
            continue
          }
          var gwNs = dig_string(parentRef, "", "namespace")
          if gwNs == "" { gwNs = routeNs }
          var gwName = dig_string(parentRef, "", "name")
          var section = dig_string(parentRef, "", "sectionName")
          var prPort = toint(dig(parentRef, "port") | fallback(0))
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          resolvedGwCount = resolvedGwCount + 1
          for _, listener := range gw.Spec.Listeners {
            var listenerName = listener.Name
            if section != "" && section != listenerName {
              continue
            }
            var listenerPort = toint(listener.Port)
            if prPort != 0 && prPort != listenerPort {
              continue
            }
            var listenerProto = listener.Protocol
            if listenerProto == "" { listenerProto = "HTTP" }
            var listenerHostname = listener.Hostname
            // Per-Gateway port scope: a catch-all (no-hostname) listener,
            // and any listener on a non-default port, keys by the Gateway's
            // representative pod port so its routes are reachable only via
            // this Gateway's bind (GatewayHTTPListenerIsolation). Default-
            // port hostname'd listeners keep the bare-host key (base's
            // wildcard cascade doesn't carry a port). Falls back to the
            // listener port for pinned / chart-static Gateways.
            var portSuffix = ""
            if listenerPort > 0 {
              var isNonDefault = (listenerProto == "HTTP" && listenerPort != 80) || ((listenerProto == "HTTPS" || listenerProto == "TLS") && listenerPort != 443)
              if listenerHostname == "" || isNonDefault {
                var scopePort = listenerPort
                var selectedPort, found = shared.Select(
                  "gateway-host-port-scopes", "ports",
                  gwNs + "/" + gwName + ":" + tostring(listenerPort))
                if found { scopePort = toint(selectedPort) }
                portSuffix = ":" + tostring(scopePort)
              }
            }
            // Listener isolation (catch-all only — see analyze_routes for
            // the rationale): drop a route hostname when a sibling listener
            // on the same Gateway claims it more specifically.
            var currentRank = toint(HostnameRank(listenerHostname))
            if len(routeHostnames) == 0 {
              effectiveHosts[listenerHostname + portSuffix] = true
            } else if listenerHostname == "" {
              for _, rh := range routeHostnames {
                var ownedBySibling = false
                for _, sibling := range gw.Spec.Listeners {
                  var sibName = sibling.Name
                  if sibName == listenerName {
                    continue
                  }
                  var sibHost = sibling.Hostname
                  if sibHost != "" && HostnameSinglePairMatch(sibHost, rh) == "true" && toint(HostnameRank(sibHost)) > currentRank {
                    ownedBySibling = true
                    break
                  }
                }
                if !ownedBySibling {
                  effectiveHosts[rh + portSuffix] = true
                }
              }
            } else {
              for _, rh := range routeHostnames {
                var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                if inter != "" {
                  effectiveHosts[inter + portSuffix] = true
                }
              }
            }
          }
        }
        // Fallback when no parentRef resolves to a known Gateway:
        //   - true orphan (no parentRefs at all), or
        //   - chart-test fixture with parentRefs but no Gateway resource.
        // Routes that DID resolve at least one Gateway but found no
        // intersecting listener produce no entries (spec-correct).
        if resolvedGwCount == 0 {
          if len(routeHostnames) == 0 {
            effectiveHosts[""] = true
          } else {
            for _, rh := range routeHostnames {
              effectiveHosts[rh] = true
            }
          }
        }
        // keys(), not a bare range: Go randomises map iteration, and an
        // unordered host.map is a different file on every render — a spurious
        // sync and reload for a config that did not change. Same rationale as
        // util-host-keyed-map and the ssl.yaml crt-list.
        var hostnames = keys(effectiveHosts)
      %%}
      {%- if len(hostnames) > 0 %}
      # HTTPRoute: {{ dig_string(route, "", "metadata", "namespace") }}/{{ dig_string(route, "", "metadata", "name") }} ({{ len(hostnames) }} hosts)
      {% for _, hostname := range hostnames %}
      {%- if hostname != "" %}
      {%- var hostKey = MapKeyForHost(hostname) %}
      {{ hostKey }} {{ hostKey }}
      {%- end %}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-generate-grpcroute-host-map-gateway:
    requires: [gateways, grpcroutes, referencegrants]
    template: |
      {#
        Generate host map entries for GRPCRoute (typed sibling).

        Body identical to GenerateHTTPRouteHostMap apart from the
        route slice type and the route_type literal stamped on the
        header comment. Kept as a separate macro so the typed
        parameter stays at the call boundary — the whole point of the
        per-Kind split.
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection, HostnameSinglePairMatch, HostnameRank -%}
      {%- macro GenerateGRPCRouteHostMap(routes []*resources.grpcroutes.T) -%}
      {%- for _, route := range routes %}
      {%%
        var routeHostnames = route.Spec.Hostnames
        var effectiveHosts = map[string]bool{}
        var resolvedGwCount = 0
        var routeNs = route.Metadata.Namespace
        for _, parentRef := range route.Spec.ParentRefs {
          var prGroup = parentRef.Group
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = parentRef.Kind
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" {
            continue
          }
          if prKind == "ListenerSet" {
            var lsNs = parentRef.Namespace
            if lsNs == "" { lsNs = routeNs }
            var lsName = parentRef.Name
            var section = parentRef.SectionName
            var prPort = toint(parentRef.Port)
            // An absent publication means the ListenerSet isn't observed.
            var lsEntry, _ = shared.Select(
              "gateway-host-listenersets", "listenersets", lsNs + "/" + lsName)
            if lsEntry == nil {
              continue
            }
            var lsInfo = lsEntry.(map[string]any)
            if !lsInfo["accepted"].(bool) {
              continue
            }
            resolvedGwCount = resolvedGwCount + 1
            for _, cAny := range lsInfo["candidates"].([]any) {
              var listener = cAny.(map[string]any)
              var listenerName = tostring(listener["name"])
              if section != "" && section != listenerName {
                continue
              }
              var listenerPort = toint(listener["port"])
              if prPort != 0 && prPort != listenerPort {
                continue
              }
              var listenerProto = tostring(listener["protocol"])
              if listenerProto == "" { listenerProto = "HTTP" }
              var portSuffix = ""
              if listenerPort > 0 {
                if (listenerProto == "HTTP" && listenerPort != 80) || (listenerProto == "HTTPS" && listenerPort != 443) || (listenerProto == "TLS" && listenerPort != 443) {
                  portSuffix = ":" + tostring(listenerPort)
                }
              }
              var listenerHostname = dig_string(listener, "", "hostname")
              if len(routeHostnames) == 0 {
                effectiveHosts[listenerHostname + portSuffix] = true
              } else if listenerHostname == "" {
                for _, rh := range routeHostnames {
                  effectiveHosts[rh + portSuffix] = true
                }
              } else {
                for _, rh := range routeHostnames {
                  var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                  if inter != "" {
                    effectiveHosts[inter + portSuffix] = true
                  }
                }
              }
            }
            continue
          }
          if prKind != "Gateway" {
            continue
          }
          var gwNs = parentRef.Namespace
          if gwNs == "" { gwNs = routeNs }
          var gwName = parentRef.Name
          var section = parentRef.SectionName
          var prPort = toint(parentRef.Port)
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          resolvedGwCount = resolvedGwCount + 1
          for _, listener := range gw.Spec.Listeners {
            var listenerName = listener.Name
            if section != "" && section != listenerName {
              continue
            }
            var listenerPort = toint(listener.Port)
            if prPort != 0 && prPort != listenerPort {
              continue
            }
            var listenerProto = listener.Protocol
            if listenerProto == "" { listenerProto = "HTTP" }
            var listenerHostname = listener.Hostname
            // Per-Gateway port scope: a catch-all (no-hostname) listener, and
            // any listener on a non-default port, keys by the Gateway's
            // representative pod port so its routes are reachable only via this
            // Gateway's bind (GatewayHTTPListenerIsolation). Must mirror
            // GenerateHTTPRouteHostMap exactly — a GRPCRoute on a default-port
            // catch-all listener (the conformance shape) otherwise gets an empty
            // portSuffix, so its only "host" is "" which the emit loop skips,
            // leaving no `:<podPort>` host.map entry. host_match then stays empty,
            // the path key never forms, and the request falls to default_backend
            // (grpc-status 12 Unimplemented) instead of the matched route.
            var portSuffix = ""
            if listenerPort > 0 {
              var isNonDefault = (listenerProto == "HTTP" && listenerPort != 80) || ((listenerProto == "HTTPS" || listenerProto == "TLS") && listenerPort != 443)
              if listenerHostname == "" || isNonDefault {
                var scopePort = listenerPort
                var selectedPort, found = shared.Select(
                  "gateway-host-port-scopes", "ports",
                  gwNs + "/" + gwName + ":" + tostring(listenerPort))
                if found { scopePort = toint(selectedPort) }
                portSuffix = ":" + tostring(scopePort)
              }
            }
            var currentRank = toint(HostnameRank(listenerHostname))
            if len(routeHostnames) == 0 {
              effectiveHosts[listenerHostname + portSuffix] = true
            } else if listenerHostname == "" {
              for _, rh := range routeHostnames {
                var ownedBySibling = false
                for _, sibling := range gw.Spec.Listeners {
                  var sibName = sibling.Name
                  if sibName == listenerName {
                    continue
                  }
                  var sibHost = sibling.Hostname
                  if sibHost != "" && HostnameSinglePairMatch(sibHost, rh) == "true" && toint(HostnameRank(sibHost)) > currentRank {
                    ownedBySibling = true
                    break
                  }
                }
                if !ownedBySibling {
                  effectiveHosts[rh + portSuffix] = true
                }
              }
            } else {
              for _, rh := range routeHostnames {
                var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                if inter != "" {
                  effectiveHosts[inter + portSuffix] = true
                }
              }
            }
          }
        }
        if resolvedGwCount == 0 {
          if len(routeHostnames) == 0 {
            effectiveHosts[""] = true
          } else {
            for _, rh := range routeHostnames {
              effectiveHosts[rh] = true
            }
          }
        }
        // keys(), not a bare range: Go randomises map iteration, and an
        // unordered host.map is a different file on every render — a spurious
        // sync and reload for a config that did not change. Same rationale as
        // util-host-keyed-map and the ssl.yaml crt-list.
        var hostnames = keys(effectiveHosts)
      %%}
      {%- if len(hostnames) > 0 %}
      # GRPCRoute: {{ route.Metadata.Namespace }}/{{ route.Metadata.Name }} ({{ len(hostnames) }} hosts)
      {% for _, hostname := range hostnames %}
      {%- if hostname != "" %}
      {%- var hostKey = MapKeyForHost(hostname) %}
      {{ hostKey }} {{ hostKey }}
      {%- end %}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

