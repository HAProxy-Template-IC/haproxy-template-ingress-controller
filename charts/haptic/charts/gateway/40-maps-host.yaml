templateSnippets:
  util-generate-httproute-host-map-gateway:
    template: |
      {#-
        Generate host map entries for HTTPRoute (typed sibling).

        Per Gateway API spec the effective hostname set for a route is
        the *intersection* of the route's `spec.hostnames` with each
        attached listener's hostname:

          - route empty + listener empty           → "" (catch-all)
          - route empty + listener H               → H  (route inherits)
          - route H... + listener "" (catch-all)   → each H (route narrows)
          - route H... + listener L                → per-pair intersection
            (drops pairs with no intersection — e.g. `wildcard.io` against
             `*.wildcard.io` does NOT intersect, since `*.wildcard.io`
             matches at least one prefix label, not the bare base)

        AnalyzeRoutes does the same computation for the per-route
        routeInfo entries that drive advanced matchers; this snippet
        mirrors the logic so host.map and the route-analysis view stay
        consistent.
      -#}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection, HostnameSinglePairMatch, HostnameRank -%}
      {%- import "util-listenerset-routing-gate" for IsListenerSetAdmitted -%}
      {%- macro GenerateHTTPRouteHostMap(routes []*resources.httproutes.T) -%}
      {%- for _, route := range routes %}
      {%%
        var routeHostnames = route.Spec.Hostnames
        var effectiveHosts = map[string]bool{}
        var resolvedGwCount = 0
        var routeNs = route.Metadata.Namespace
        for _, parentRef := range route.Spec.ParentRefs {
          var prGroup = parentRef.Group
          if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
          var prKind = parentRef.Kind
          if prKind == "" { prKind = "Gateway" }
          if prGroup != "gateway.networking.k8s.io" {
            continue
          }
          if prKind == "ListenerSet" {
            var lsNs = parentRef.Namespace
            if lsNs == "" { lsNs = routeNs }
            var lsName = parentRef.Name
            var section = parentRef.SectionName
            var prPort = toint(parentRef.Port)
            var ls = resources.listenersets.GetSingle(lsNs, lsName)
            if ls == nil {
              continue
            }
            var gwName = ls.Spec.ParentRef.Name
            var gwNs = ls.Spec.ParentRef.Namespace
            if gwNs == "" { gwNs = lsNs }
            var gw = resources.gateways.GetSingle(gwNs, gwName)
            if gw == nil || !hasPrefix(IsListenerSetAdmitted(gw, ls), "true") {
              continue
            }
            resolvedGwCount = resolvedGwCount + 1
            for _, listener := range ls.Spec.Listeners {
              var listenerName = listener.Name
              if section != "" && section != listenerName {
                continue
              }
              var listenerPort = toint(listener.Port)
              if prPort != 0 && prPort != listenerPort {
                continue
              }
              var listenerProto = listener.Protocol
              if listenerProto == "" { listenerProto = "HTTP" }
              var portSuffix = ""
              if listenerPort > 0 {
                if (listenerProto == "HTTP" && listenerPort != 80) || (listenerProto == "HTTPS" && listenerPort != 443) || (listenerProto == "TLS" && listenerPort != 443) {
                  portSuffix = ":" + tostring(listenerPort)
                }
              }
              var listenerHostname = listener.Hostname
              if len(routeHostnames) == 0 {
                effectiveHosts[listenerHostname + portSuffix] = true
              } else if listenerHostname == "" {
                for _, rh := range routeHostnames {
                  effectiveHosts[rh + portSuffix] = true
                }
              } else {
                for _, rh := range routeHostnames {
                  var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                  if inter != "" {
                    effectiveHosts[inter + portSuffix] = true
                  }
                }
              }
            }
            continue
          }
          if prKind != "Gateway" {
            continue
          }
          var gwNs = parentRef.Namespace
          if gwNs == "" { gwNs = routeNs }
          var gwName = parentRef.Name
          var section = parentRef.SectionName
          var prPort = toint(parentRef.Port)
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          resolvedGwCount = resolvedGwCount + 1
          for _, listener := range gw.Spec.Listeners {
            var listenerName = listener.Name
            if section != "" && section != listenerName {
              continue
            }
            var listenerPort = toint(listener.Port)
            if prPort != 0 && prPort != listenerPort {
              continue
            }
            var listenerProto = listener.Protocol
            if listenerProto == "" { listenerProto = "HTTP" }
            var portSuffix = ""
            if listenerPort > 0 {
              if (listenerProto == "HTTP" && listenerPort != 80) || (listenerProto == "HTTPS" && listenerPort != 443) || (listenerProto == "TLS" && listenerPort != 443) {
                portSuffix = ":" + tostring(listenerPort)
              }
            }
            var listenerHostname = listener.Hostname
            // Listener isolation (catch-all only — see analyze_routes for
            // the rationale): drop a route hostname when a sibling listener
            // on the same Gateway claims it more specifically.
            var currentRank = toint(HostnameRank(listenerHostname))
            if len(routeHostnames) == 0 {
              effectiveHosts[listenerHostname + portSuffix] = true
            } else if listenerHostname == "" {
              for _, rh := range routeHostnames {
                var ownedBySibling = false
                for _, sibling := range gw.Spec.Listeners {
                  var sibName = sibling.Name
                  if sibName == listenerName {
                    continue
                  }
                  var sibHost = sibling.Hostname
                  if sibHost != "" && HostnameSinglePairMatch(sibHost, rh) == "true" && toint(HostnameRank(sibHost)) > currentRank {
                    ownedBySibling = true
                    break
                  }
                }
                if !ownedBySibling {
                  effectiveHosts[rh + portSuffix] = true
                }
              }
            } else {
              for _, rh := range routeHostnames {
                var inter = HostnameSinglePairIntersection(listenerHostname, rh)
                if inter != "" {
                  effectiveHosts[inter + portSuffix] = true
                }
              }
            }
          }
        }
        // Fallback when no parentRef resolves to a known Gateway:
        //   - true orphan (no parentRefs at all), or
        //   - chart-test fixture with parentRefs but no Gateway resource.
        // Routes that DID resolve at least one Gateway but found no
        // intersecting listener produce no entries (spec-correct).
        if resolvedGwCount == 0 {
          if len(routeHostnames) == 0 {
            effectiveHosts[""] = true
          } else {
            for _, rh := range routeHostnames {
              effectiveHosts[rh] = true
            }
          }
        }
        var hostnames = []string{}
        for h, _ := range effectiveHosts {
          hostnames = append(hostnames, h)
        }
      %%}
      {%- if len(hostnames) > 0 %}
      # HTTPRoute: {{ route.Metadata.Namespace }}/{{ route.Metadata.Name }} ({{ len(hostnames) }} hosts)
      {% for _, hostname := range hostnames %}
      {%- if hostname != "" %}
      {%- var hostKey = MapKeyForHost(hostname) %}
      {{ hostKey }} {{ hostKey }}
      {%- end %}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

