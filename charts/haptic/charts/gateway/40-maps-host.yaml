  util-sharded-host-map-gateway:
    template: |
      {#- Per-Kind typed sharded host-map wrappers. Each calls its
          Kind-specific Generate macro directly with the typed slice. -#}
      {%- import "util-generate-httproute-host-map-gateway" for GenerateHTTPRouteHostMap -%}
      {%- import "util-generate-grpcroute-host-map-gateway" for GenerateGRPCRouteHostMap -%}
      {%- import "util-macros" for CalculateShardCount -%}

      {%- macro ShardedHTTPRouteHostMap(routes []*resources.httproutes.T) -%}
        {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
        {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateHTTPRouteHostMap(routes) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateHTTPRouteHostMap(shard_slice(routes, i, n)) }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

      {%- macro ShardedGRPCRouteHostMap(routes []*resources.grpcroutes.T) -%}
        {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
        {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateGRPCRouteHostMap(routes) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateGRPCRouteHostMap(shard_slice(routes, i, n)) }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  map-host-500-gateway:
    template: |
      {#- Generate host map entries for Gateway API routes #}
      {%- import "util-sharded-host-map-gateway" for ShardedHTTPRouteHostMap, ShardedGRPCRouteHostMap %}
      # gateway/map-host-gateway
      {{- ShardedHTTPRouteHostMap(resources.httproutes.List()) -}}
      {{- ShardedGRPCRouteHostMap(resources.grpcroutes.List()) -}}

  map-hostregex-500-gateway:
    template: |
      {%- import "util-resource-helpers" for ListenerHostname -%}
      {#-
        Wildcard listener hostnames as regex entries.

        For each Gateway listener whose hostname starts with `*.`,
        emit a regex map entry that matches the suffix at any depth
        (per Gateway API spec — `*.example.com` matches both
        `foo.example.com` and `a.b.foo.example.com`, but NOT
        `example.com` itself). The mapped value reuses the existing
        leading-dot host_match key (`.example.com`) so downstream
        path map lookups don't need to change.

        Why a regex map: HAProxy's `regsub(^[^.]*,,)` fallback in
        base.yaml only strips one label, so a request to
        `multiple.prefixes.bar.com` against an `*.bar.com` listener
        misses both the exact host.map and the single-strip
        fallback. `map_reg` lets a single entry match any depth.

        Why the leading anchor `^[^.]+(?:\.[^.]+)*\.bar\.com$`:
          - `[^.]+` requires at least one label,
          - `(?:\.[^.]+)*` allows arbitrarily-many extra labels,
          - the trailing `\.bar\.com$` pins the wildcard suffix.
        This excludes `bar.com` itself (which would have been matched
        already by the exact host.map entry for any sibling exact
        listener — and per spec must not match `*.bar.com`).
      -#}
      # gateway/map-hostregex-gateway
      {%%
        var seen = map[string]bool{}
        var suffixEntries = []any{}
        for _, gw := range resources.gateways.List() {
          for _, listener := range gw.Spec.Listeners {
            var h = listener.Hostname
            if !hasPrefix(h, "*.") {
              continue
            }
            var suffix = h[2:]
            if seen[suffix] {
              continue
            }
            seen[suffix] = true
            suffixEntries = append(suffixEntries, map[string]any{"suffix": suffix})
          }
        }
        // Most-specific (longest) suffix wins HAProxy `map_reg` ties — that's
        // first-match-wins on file order, so emit longer suffixes first. Per
        // Gateway API spec: when a request Host matches multiple listeners'
        // wildcard hostnames, the most-specific one owns the request (e.g.
        // `bar.foo.example.com` belongs to `*.foo.example.com`, not `*.example.com`).
      %%}
      {%- var sortedSuffixEntries = suffixEntries | sort_by([]string{"$.suffix | length:desc"}) %}
      {%- for _, entry := range sortedSuffixEntries %}
      {%- var suffix = tostring(entry | dig("suffix")) %}
      ^[^.]+(?:\.[^.]+)*\.{{ replace(suffix, ".", "\\.") }}$ .{{ suffix }}
      {%- end %}
