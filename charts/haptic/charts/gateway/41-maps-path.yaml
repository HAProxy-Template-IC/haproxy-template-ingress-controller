templateSnippets:
  util-path-map-entry-gateway-shard:
    requires: [grpcroutes]
    template: |
      {#
        Gateway Path Map Entry Shard Processor

        Generates map file entries for a slice of sorted routes
        (pre-grouped by pathKey in AnalyzeRoutes). Reads the
        precomputed scalars routeInfo emits — pathKey / pathType /
        pathValue / hostname — and derives the route Kind via
        type-switch on routeInfo["route"].
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {% macro PathMapEntryGatewayShard(sortedRoutes []any, pathGroups any, pathType string, suffix string) string %}
      {%- for _, routeInfo := range sortedRoutes %}
        {%- var pathKey = tostring(routeInfo["pathKey"]) %}
        {%- if first_seen("gateway_pathMap_" + pathType + suffix, pathKey) %}
          {%- var routes []any = pathGroups | dig(pathKey) | toSlice() %}
          {%- var firstRoute = routes[0].(map[string]any) %}
          {%- var frPath_type = tostring(firstRoute["pathType"]) %}
        {%- if frPath_type == pathType %}
          {#- The group's conflictGroup IS this join, computed once in AnalyzeRoutes. Rebuilding
              it here let the two drift: route-winner.map and the advanced chain key on the
              analysis string, and a group of 2+ routes then never matched at runtime. -#}
          {%- var routeIds_str = tostring(firstRoute["conflictGroup"]) -%}
          {%- var frHostname = tostring(firstRoute["hostname"]) %}
          {%- var frPath_val = tostring(firstRoute["pathValue"]) %}
          {#- Map keys are whitespace-delimited: a space/tab/newline in a path
              splits the line and smuggles a second entry (#153). Reject the route. -#}
          {%- if regex_search(frPath_val, "[[:cntrl:]]") || strings_contains(frPath_val, " ") %}
            {{- WebhookRejectOrWarn(firstRoute["route"], "InvalidPath", "Route path '" + frPath_val + "' (host '" + frHostname + "') contains whitespace or control characters, which cannot be written to the routing map; the route is not applied. Remove spaces, tabs and newlines from the HTTPRoute path value.") -}}
            {%- continue %}
          {%- end %}
          {#- Skip the catch-all `/` entry only for PathPrefix routes —
              an Exact `/` route must still emit, otherwise requests
              to the bare root are unroutable. PathPrefix `/` matches
              everything so its entry would otherwise pin every
              non-matched request to that route's backend; the chart
              relies on the path-prefix-exact / path-prefix maps for
              specific paths, with a default fall-through to 404. The
              GatewayBackendClientCertificateFeature fixture pins this
              with `path: {type: Exact, value: /}`. -#}
          {%- if suffix == "" && frPath_val == "/" && pathType == "PathPrefix" %}
            {%- continue %}
          {%- end %}
          {#- Route Kind discriminator. HTTPRoute is the default;
              GRPCRoute is the only non-default branch. -#}
          {%- var routeTypeShort = "http" %}
          {%- switch firstRoute["route"].(type) %}
          {%- case *resources.grpcroutes.T %}
            {%- routeTypeShort = "grpc" %}
          {%- end %}
          {%- var pathSuffix = suffix %}
          {%- if suffix == "/" && hasSuffix(frPath_val, "/") %}
            {%- pathSuffix = "" %}
          {%- end %}
          {%- if suffix == "" && pathType != "RegularExpression" && len(frPath_val) > 1 && hasSuffix(frPath_val, "/") %}
            {%- frPath_val = frPath_val[:len(frPath_val)-1] %}
          {%- end %}
      {{ "\n" }}{{ MapKeyForHost(frHostname) }}{{ frPath_val }}{{ pathSuffix }} GW_ROUTE_ID:{{ routeTypeShort }}:{{ routeIds_str }}
        {%- end %}
        {%- end %}
      {%- end %}
      {% end %}

  util-path-map-entry-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Sharded Gateway Path Map Entry Generator #}
      {%- import "util-path-map-entry-gateway-shard" for PathMapEntryGatewayShard -%}
      {%- import "util-macros" for CalculateShardCount -%}

      {%- macro GeneratePathMapEntries(pathType string, suffix string) %}
      # gateway/util-path-map-entry-gateway ({{ pathType }})

      {# Get cached route analysis (runs once, shared across all renders) #}
      {{ render "util-gateway-analysis" }}

      {%- var gatewayAnalysis = shared.Get("gatewayAnalysis").(map[string]any) %}
      {%- var sortedRoutes []any = gatewayAnalysis["sortedRoutes"] %}
      {%- var pathGroups any = gatewayAnalysis["pathGroups"] %}

      {%- var n = toint(CalculateShardCount(len(sortedRoutes), 100)) -%}
      {%- if n <= 1 || len(sortedRoutes) < 100 -%}
      {{ PathMapEntryGatewayShard(sortedRoutes, pathGroups, pathType, suffix) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go PathMapEntryGatewayShard(shard_slice(sortedRoutes, i, n), pathGroups, pathType, suffix) }}
      {%- end -%}
      {%- end -%}
      {%- end macro %}

  map-path-exact-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-exact-gateway
      {{ GeneratePathMapEntries("Exact", "") }}

  map-pfxexact-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate prefix-exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-pfxexact-gateway
      {{ GeneratePathMapEntries("PathPrefix", "") }}

  map-path-prefix-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate prefix path map entries with trailing slash for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-prefix-gateway
      {{ GeneratePathMapEntries("PathPrefix", "/") }}

  map-path-regex-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate regex path map entries for HTTPRoute with RegularExpression type.
         Emits the same GW_ROUTE_ID qualifier as the exact and prefix maps: pointing
         straight at a backend left txn.gw_rule_id unset, so a regex route got no
         filters, no timeouts and no resource fields in the access log. #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-regex-gateway
      {{ GeneratePathMapEntries("RegularExpression", "") }}
