templateSnippets:
  # ============================================================================
  # Per-Gateway-listener pod-port allocator
  #
  # Each Gateway with an HTTPS listener gets its OWN HAProxy bind. Different
  # Gateways' binds need different SSL configs (cert, verify mode,
  # ca-ignore-err flags, ALPN, ...) because HAProxy applies bind-line SSL
  # options uniformly across the bind. To support that, each (Gateway,
  # listener) tuple needs a UNIQUE container port — `bind *:<port>` on the
  # same `0.0.0.0` collides at the OS level if two binds claim the same
  # port. Per-Gateway IPs solve this at the Service layer (each Gateway
  # gets a unique LB IP via MetalLB) but kube-proxy DNATs the LB IP to
  # the pod IP; HAProxy sees its own pod IP regardless of which LB IP the
  # client used. The chart bridges that by giving each (Gateway, listener)
  # a per-Gateway target port, so the per-Gateway Service maps
  # `<lb-ip>:<listener-port>` → `<pod-ip>:<unique-pod-port>` and HAProxy
  # binds on `<unique-pod-port>` with isolated SSL config.
  #
  # Allocation strategy: PURE hash-and-probe over the current Gateway set.
  #
  # Each (Gateway, port) key hashes to a slot in
  # [basePort, basePort+rangeSize); same-slot collisions between current
  # keys are resolved by linear probing in OLDEST-FIRST order (ascending
  # Gateway creationTimestamp, key as tie-break). The result is a pure
  # function of the current Gateway set: the same key always maps to the
  # same port no matter what the cluster cache currently contains or
  # which render computes it, and — because slots are handed out
  # oldest-first — a key's port depends only on itself and on the keys
  # of OLDER Gateways. Creating or deleting a NEWER Gateway can never
  # move an existing Gateway's port.
  #
  # DO NOT "improve" this by reading committed Services back from the
  # cluster cache to stabilise allocations. A previous version did
  # exactly that (lock in any existing Service's targetPort, assign
  # sequential free ports to the rest) and it failed in two proven ways
  # under parallel Gateway churn, because the read-back state lags the
  # allocator's own output:
  #   * Permanent collision lock-in: render R1 allocates B=18000; R2's
  #     snapshot doesn't include B's Service yet, so B is reallocated to
  #     18001 while new Gateway A takes 18000; R3's snapshot has A=18000
  #     committed but B's update still in flight (old 18000) — read-back
  #     "locks" BOTH at 18000 and reverts B. Every later render agrees,
  #     HAProxy binds two Gateways on one pod port (plaintext requests
  #     answered with TLS alerts by the neighbour's ssl bind), and the
  #     state is self-sustaining.
  #   * Read-back oscillation: with several Services' visibility
  #     alternating across snapshots, consecutive renders keep
  #     "correcting" each other's targetPorts — observed as ~50
  #     Service-update flips per second, sustained, each flip
  #     re-triggering a render. (Gateway-API conformance CI, 2026-07-03.)
  #
  # Hash+probe trades those failure modes for one small, bounded one: a
  # key whose slot probe-chains through another key's slot can shift
  # when that neighbour DISAPPEARS (likelihood ~keys/rangeSize per
  # deletion, i.e. ~3% at 30 concurrent Gateway-ports over a 1000-port
  # range, and only for the YOUNGER member of a collision — oldest-wins
  # ordering means an appearing Gateway shifts nobody).
  #
  # A shift is not free, and the exposure is NOT just "one kube-proxy
  # sync": the shifted Gateway's Service targetPort and its bind move in
  # the same render, but they leave the render on two different paths —
  # the Service is applied immediately and unthrottled
  # (pkg/controller/resourceapplier/component.go handleReconciliation-
  # Completed → applyAndPrune), while the config waits out the
  # deployer's minDeploymentInterval remainder plus a reload (a bind
  # change is laneStructural, so the runtime-eligible fast path can't
  # carry it). Anything pinned to the OLD pod port — an established
  # keep-alive/h2 connection held open by conntrack, a `kubectl
  # port-forward` that resolved targetPort earlier — keeps arriving
  # there for the life of that connection. If the old port is unbound
  # the client gets a clean refusal and reconnects; if another Gateway
  # has meanwhile bound it, the request is silently scoped to THAT
  # Gateway (404 via default_backend, or that Gateway's catch-all).
  # Oldest-wins ordering is what keeps the second, cross-tenant case out
  # of the common path: on deletion the mover VACATES its old slot
  # rather than being evicted from it in favour of a newcomer.
  #
  # The map is initialised once per render via `shared.ComputeIfAbsent`
  # so concurrent map renderers see a consistent view.
  # ============================================================================

  util-gateway-pod-port-allocator:
    requires: [gateways]
    template: |
      {# Initialise the per-Gateway-listener pod-port allocation map.
          Idempotent — multiple snippets render this; only the first
          actually computes. Downstream consumers should `{{ render
          "util-gateway-pod-port-allocator" }}` then read
          `shared.Get("gatewayPodPortAllocations")` directly.

          Schema (returned map):
            keys:    "<gwNs>/<gwName>:<listenerName>:<port>"
            values:  int (the allocated container port)

          Allocation rules:
            * Only HTTP and HTTPS Gateway listeners get an allocation.
              TLS-Terminate listeners on non-default ports already render
              via `frontends-600-gateway-tls-listener` (per-port mode-tcp
              frontend) and don't need per-Gateway pod ports.
              TLS-Passthrough listeners flow through chart-static
              `frontend ssl-tcp` and don't need pod-port allocation either.
            * Listeners with empty name or non-positive port are skipped
              (defensively — invalid Gateway state shouldn't crash the
              allocator, just leave them out).
      #}
      {%- var _, _ = shared.ComputeIfAbsent("gatewayPodPortAllocations", func() any {
        var basePort = toint(extraContext | dig("perGatewayPodPortBase") | fallback(18000))
        var rangeSize = toint(extraContext | dig("perGatewayPodPortRange") | fallback(1000))
        if rangeSize < 1 {
          rangeSize = 1000
        }
        var allTuples = []any{}
        for _, gw := range resources.gateways.List() {
          var gwNs = gw.Metadata.Namespace
          var gwName = gw.Metadata.Name
          for _, listener := range gw.Spec.Listeners {
            // HTTP and HTTPS listeners both get a per-Gateway bind on a
            // unique pod port, so each Gateway's routing is isolated by
            // destination (dst_port) rather than collapsing onto the
            // shared chart-static :80 / :443 binds. TLS listeners are
            // excluded — TLS-Passthrough flows through chart-static
            // `frontend ssl-tcp` and TLS-Terminate (non-default port)
            // renders its own `frontends-600` mode-tcp frontend.
            if listener.Protocol != "HTTPS" && listener.Protocol != "HTTP" {
              continue
            }
            var lName = listener.Name
            var lPort = toint(listener.Port)
            if lName == "" || lPort <= 0 {
              continue
            }
            allTuples = append(allTuples, map[string]any{
              "key":     gwNs + "/" + gwName + ":" + lName + ":" + tostring(lPort),
              "gwNs":    gwNs,
              "gwName":  gwName,
              "lPort":   lPort,
              "created": tostring(gw.Metadata.CreationTimestamp),
            })
          }
        }

        // Allocate ONE pod port per (Gateway, PORT) — every listener
        // sharing a Gateway+port shares the single bind and is
        // host-disambiguated downstream. Then expand to the
        // per-(Gateway,listener) keys consumers look up.
        //
        // PURE HASH-AND-PROBE allocation (see the header comment for
        // why this must NOT read committed Services back from the
        // cluster cache): each key's home slot is derived from a
        // sha256 of the key itself, so the same key lands on the same
        // pod port in every render, on every replica, regardless of
        // snapshot staleness. Only genuine slot collisions between
        // keys present in THIS render probe forward, in AGE-THEN-KEY
        // order (see below) so the assignment is deterministic.
        //
        // 7 hex chars (28 bits) keeps parseInt inside int32 range on
        // any platform; 268M values over a ~1000-slot range is
        // uniform enough.
        // OLDEST-WINS probe order. Slots are handed out walking the
        // keys in ascending (Gateway creationTimestamp, key) order, so
        // a key's port depends ONLY on itself and on the keys of
        // OLDER Gateways. Creating a Gateway can therefore never move
        // an existing Gateway's pod port, no matter how the hashes
        // collide: the newcomer is processed last and probes past the
        // slots the incumbents already hold.
        //
        // That invariant is what makes a moved port safe(ish) to live
        // with. Under the previous key-only order the winner of a
        // contested slot was whichever key sorted first, so a
        // newly-created Gateway could evict a long-lived one — and
        // the evicted Gateway's OLD pod port was, in the same render,
        // taken over by the newcomer's bind. Anything still addressing
        // the old pod port directly (an established keep-alive
        // connection pinned by conntrack, a `kubectl port-forward`
        // that resolved targetPort before the shift) then reached a
        // DIFFERENT Gateway's routes: its host key missed every map
        // entry (404 via default_backend) or, worse, matched that
        // Gateway's catch-all and crossed tenants. Oldest-wins removes
        // the eviction case entirely; the remaining case (deleting the
        // OLDER member of a collision pair lets the younger one move
        // down to the freed slot) vacates a port instead of handing it
        // to a neighbour, so stale clients get a clean connection
        // refusal and reconnect.
        //
        // creationTimestamp is safe to read here and is NOT the
        // forbidden read-back: it is an immutable field of the watched
        // Gateway itself, arriving atomically with the object, not a
        // lagging observation of the controller's own output. It
        // cannot oscillate. Gateways whose timestamp is absent
        // (fixtures, hand-built objects) sort LAST — treated as
        // newest, so they can never evict a Gateway of known age — and
        // then fall back to key order, which is exactly the previous
        // behaviour. RFC3339 timestamps are fixed-width, so a plain
        // lexicographic sort is chronological; second granularity
        // means same-second creations tie and fall back to key order.
        //
        var portKeys = []any{}
        var seenKeys = map[string]bool{}
        for _, tAny := range allTuples {
          var t = tAny.(map[string]any)
          var pk = tostring(t["gwNs"]) + "/" + tostring(t["gwName"]) + ":" + tostring(toint(t["lPort"]))
          if !seenKeys[pk] {
            seenKeys[pk] = true
            var created = tostring(t["created"])
            if created == "" {
              created = "9999-12-31T23:59:59Z"
            }
            // "\t" separates the sort prefix from the key: it can
            // appear in neither an RFC3339 timestamp nor a
            // namespace/name, so the split below is unambiguous.
            portKeys = append(portKeys, created + "\t" + pk)
          }
        }

        var sortedKeys = sort_strings(portKeys)
        // More keys than slots means the probe loop below could never
        // find a free slot and would spin forever, hanging the render
        // goroutine — fail loudly with the knob to turn instead.
        if len(sortedKeys) > rangeSize {
          fail(sprintf("pod-port allocator: %d (Gateway,port) keys exceed the %d-slot pod-port range; raise perGatewayPodPortRange", len(sortedKeys), rangeSize))
        }
        var portPod = map[string]any{}
        var usedSlots = map[int]bool{}
        for _, sortKeyAny := range sortedKeys {
          // Strip the creationTimestamp sort prefix — only the
          // (Gateway, port) key is hashed, so the home slot stays a
          // pure function of the key and is unaffected by age.
          var sortKeyParts = split(tostring(sortKeyAny), "\t")
          var pk = tostring(sortKeyParts[len(sortKeyParts)-1])
          var hashVal, hashErr = parseInt(sha256(pk)[0:7], 16)
          if hashErr != nil {
            // Unreachable — sha256 output is always valid hex — but
            // failing loudly beats allocating garbage.
            fail("pod-port allocator: hash parse failed for key " + pk)
          }
          var slot = hashVal % rangeSize
          for usedSlots[slot] {
            slot = (slot + 1) % rangeSize
          }
          usedSlots[slot] = true
          portPod[pk] = basePort + slot
        }

        // Expand to per-(Gateway,listener) keys, all pointing at their
        // (Gateway,port) pod port.
        var result = map[string]any{}
        for _, tAny := range allTuples {
          var t = tAny.(map[string]any)
          var pk = tostring(t["gwNs"]) + "/" + tostring(t["gwName"]) + ":" + tostring(toint(t["lPort"]))
          result[tostring(t["key"])] = portPod[pk]
        }
        return result
      }) %}

  util-gateway-pod-port-for:
    requires: [gateways]
    template: |
      {# Emit the allocated container port for a given (Gateway, listener).
          Renders the allocator first so callers don't need to. Falls back
          to the listener's own port when no allocation exists (the
          fallback is intentional — chart paths that bypass the allocator
          for TLS-Passthrough / chart-static binds keep working).

          Usage:
            {%- import "util-gateway-pod-port-for" for PodPortFor %}
            bind *:{{ PodPortFor(gwNs, gwName, listenerName, listenerPort) }}
      #}
      {%- macro PodPortFor(gwNs string, gwName string, listenerName string, listenerPort int) %}
        {{ render "util-gateway-pod-port-allocator" -}}
        {%%
          var key = gwNs + "/" + gwName + ":" + listenerName + ":" + tostring(listenerPort)
          var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any)
          var port = listenerPort
          if val, ok := allocations[key]; ok {
            port = toint(val)
          }
        %%}
        {{- port -}}
      {%- end macro -%}

  # Debug emission gated on extraContext.dumpPodPortAllocations.
  # Production deploys NEVER set the flag, so the body emits zero
  # bytes: only the snippet's `{%- if … %}` predicate runs, which is
  # one map dig + string compare per render — effectively free.
  #
  # The flag exists for TWO consumers, both tests:
  #   * chart-validation tests at `tests/15-pod-port-allocator.yaml`,
  #     which assert the allocator's output without depending on
  #     phase-4-and-later consumers (which transform the allocation
  #     into binds). The debug snippet runs inside `render_glob
  #     "frontend-extra-*"` specifically so the comments appear in
  #     haproxy.cfg, where the test's `contains` assertions can
  #     pattern-match them.
  #   * the churn/soak e2e tier (`tests/e2e/gateway_churn_test.go`,
  #     issue #64), whose TestMain helm-installs with the flag set and
  #     reads the dump through the controller's /debug/vars/rendered
  #     to assert zero cross-wiring under sustained parallel churn.
  #
  # If you ever delete this debug emitter, also delete the
  # `dumpPodPortAllocations` flag, replace the chart tests with
  # ones that assert phase-4 bind lines directly, and rework the
  # churn tier's cross-wiring assertion.
  frontend-extra-099-gateway-pod-port-debug:
    requires: [gateways]
    template: |
      {%- if tostring(extraContext | dig("dumpPodPortAllocations") | fallback("")) == "true" %}
        {{ render "util-gateway-pod-port-allocator" -}}
        {%- var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any) %}
        {%- var keys = []any{} %}
        {%- for k := range allocations %}
          {%- keys = append(keys, k) %}
        {%- end %}
        {%- var sortedKeys = sort_strings(keys) %}
        {%- for _, key := range sortedKeys %}
          # gw-pod-port: {{ tostring(key) }} = {{ allocations[tostring(key)] }}
        {%- end %}
      {%- end %}

  # Pod-port → listener-port map. The companion snippet
  # `frontend-routing-listener-port-100-gateway` (below) plugs this map
  # into base.yaml's listener-port translation extension point, so a
  # request landing on phase 4's per-Gateway bind (e.g. pod port 18002
  # for a Gateway listener port 8443) is translated back to the
  # listener port that the chart's host.map and path-prefix.map keys
  # are scoped by. Without this translation, the host lookup would
  # try `<host>:18002` and miss the `<host>:8443` entry the chart
  # emitted.
  #
  # Schema: `<podPort> <listenerPort>` per line. The override snippet
  # reads it via `map(...)`; entries absent from the map cause the
  # lookup to fall through to base.yaml's default (`listener_port =
  # dst_port`), which is the right behaviour for chart-static binds.
  features-170-pod-listener-port-map:
    requires: [gateways]
    template: |
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any) %}
      {%- var keys = []any{} %}
      {%- for k := range allocations %}
        {%- keys = append(keys, k) %}
      {%- end %}
      {%- var sortedKeys = sort_strings(keys) %}
      {%- var seenPod = map[string]bool{} %}
      {%- var lines = []any{} %}
      {%- for _, key := range sortedKeys %}
        {#- Identity map: `<podPort> <podPort>`. A request landing on a
            per-Gateway bind (dst_port = the unique pod port) keeps
            listener_port = pod port, so the host.map / path-map keys —
            which this refactor scopes by the SAME per-Gateway pod port
            (util-gateway-port-scope) — resolve to that Gateway only. A
            no-hostname listener on one Gateway can no longer catch
            another Gateway's hosts via the shared `:<listenerPort>`
            fallback (the GatewayHTTPListenerIsolation leak). Pinned /
            chart-static binds have no allocation, so their dst_port
            misses this map and falls through to base's default
            (`listener_port = dst_port = listenerPort`) — correct, since
            their keys stay listener-port-scoped. -#}
        {%- var keyStr = tostring(key) %}
        {%- var podPort = tostring(allocations[keyStr]) %}
        {%- if !seenPod[podPort] %}
          {%- seenPod[podPort] = true %}
          {%- lines = append(lines, podPort + " " + podPort) %}
        {%- end %}
      {%- end %}
      {#- The DataPlane API rejects empty file uploads with 422
          "data in body is required" (cannot register a 0-byte body),
          but the companion `frontend-routing-listener-port-100-gateway`
          snippet below references this map unconditionally whenever
          the gateway library is loaded — so we always need a
          registered file. Emit a single comment line when there are
          no allocations: HAProxy treats `# ...` as a comment, the map
          stays effectively empty, and the `map(...) -m found`
          predicate falls through to base.yaml's default
          (`listener_port = dst_port`) on every lookup — the right
          behaviour for chart-static binds. -#}
      {%- var content = "" %}
      {%- if len(lines) > 0 %}
        {%- content = (lines | toStringSlice() | join("\n")) + "\n" %}
      {%- else %}
        {%- content = "# no per-Gateway pod-port allocations\n" %}
      {%- end %}
      {%- var _, regErr = fileRegistry.Register("map", "pod-listener-port.map", content) %}
      {%- if regErr != nil %}
        {{ fail("failed to register pod-listener-port.map: " + tostring(regErr)) }}
      {%- end %}

  # base.yaml exposes a `frontend-routing-listener-port-*` extension
  # point so it can stay resource-agnostic (Level 0): base sets
  # `txn.listener_port = txn.dst_port` by default, and resource
  # libraries that introduce a pod-port → listener-port mapping plug
  # the translation in here. Without the gateway library, base's
  # default holds and `pod-listener-port.map` is never referenced.
  frontend-routing-listener-port-100-gateway:
    requires: [gateways]
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      http-request set-var(txn.listener_port) var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) if { var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) -m found }
      {# txn.gw_listener_port = the USER-FACING Gateway listener port (e.g. 80 /
          443) the client connected to, resolved from the pod dst_port via
          pod-gw-listener-port.map. Consumed by the RequestRedirect filter's
          port-omit rule. Set here UNCONDITIONALLY (not in the redirect filter
          snippet) so the map_int converter is present in the startup config and
          HAProxy loads the map file — a converter that only appears once a
          redirect route exists is added at runtime by the DataPlane API without
          the map ever being loaded, so the lookup silently misses and the pod
          port leaks into Location. map_int (not map): the key is the integer
          dst_port. Chart-static binds miss the map and fall back to dst_port,
          which already IS the listener port there. #}
      http-request set-var(txn.gw_listener_port) var(txn.dst_port),map_int({{ mapPath("pod-gw-listener-port.map") }}) if { var(txn.dst_port),map_int({{ mapPath("pod-gw-listener-port.map") }}) -m found }
      http-request set-var(txn.gw_listener_port) var(txn.dst_port) if !{ var(txn.gw_listener_port) -m found }

  # Pod-port → USER-FACING Gateway listener port map. Distinct from
  # `pod-listener-port.map` (which is an identity `<podPort> <podPort>` map so
  # host.map / path-map keys stay scoped by the per-Gateway pod port for
  # GatewayHTTPListenerIsolation). Some sites need the *real* listener port a
  # client connected to (e.g. 80 / 443), NOT the internal pod port — the
  # RequestRedirect filter must decide whether to include the port in the
  # Location header per the Gateway API well-known-port omit rule, which is
  # defined against the user-facing listener port. `txn.listener_port` can't
  # serve that (it equals the pod port on the per-Gateway path), so this map
  # translates dst_port (pod port) → the actual Gateway listener port. Chart-
  # static binds have no allocation, miss this map, and callers fall back to
  # dst_port (which already IS the listener port there).
  #
  # Schema: `<podPort> <listenerPort>` per line, deduped by podPort. The
  # allocation key is `<gwNs>/<gwName>:<listenerName>:<listenerPort>`, so the
  # listener port is the last `:`-separated field.
  features-171-pod-gateway-listener-port-map:
    requires: [gateways]
    template: |
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any) %}
      {%- var keys = []any{} %}
      {%- for k := range allocations %}
        {%- keys = append(keys, k) %}
      {%- end %}
      {%- var sortedKeys = sort_strings(keys) %}
      {%- var seenPod = map[string]bool{} %}
      {%- var lines = []any{} %}
      {%- for _, key := range sortedKeys %}
        {%- var keyStr = tostring(key) %}
        {%- var podPort = tostring(allocations[keyStr]) %}
        {%- if !seenPod[podPort] %}
          {%- seenPod[podPort] = true %}
          {%- var parts = split(keyStr, ":") %}
          {%- var listenerPort = tostring(parts[len(parts)-1]) %}
          {%- lines = append(lines, podPort + " " + listenerPort) %}
        {%- end %}
      {%- end %}
      {%- var content = "" %}
      {%- if len(lines) > 0 %}
        {%- content = (lines | toStringSlice() | join("\n")) + "\n" %}
      {%- else %}
        {%- content = "# no per-Gateway pod-port allocations\n" %}
      {%- end %}
      {%- var _, regErr = fileRegistry.Register("map", "pod-gw-listener-port.map", content) %}
      {%- if regErr != nil %}
        {{ fail("failed to register pod-gw-listener-port.map: " + tostring(regErr)) }}
      {%- end %}

  # Representative pod port per (Gateway, port): the pod port of the FIRST
  # allocated listener on that Gateway+port — the one phase-3's Service
  # DNATs to and phase-4 binds. Host/path map keys are scoped by this so
  # every listener sharing a Gateway+port lands on the same bind and is
  # disambiguated by Host, and so a no-hostname listener's catch-all is
  # scoped to its own Gateway (GatewayHTTPListenerIsolation).
  util-gateway-port-scope:
    requires: [gateways]
    template: |
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var _, _ = shared.ComputeIfAbsent("gatewayPortScope", func() any {
        var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any)
        var scope = map[string]any{}
        for _, gw := range resources.gateways.List() {
          var gwNs = gw.Metadata.Namespace
          var gwName = gw.Metadata.Name
          var seenPort = map[int]bool{}
          for _, listener := range gw.Spec.Listeners {
            var lName = listener.Name
            var lPort = toint(listener.Port)
            if lName == "" || lPort <= 0 || seenPort[lPort] {
              continue
            }
            seenPort[lPort] = true
            var allocKey = gwNs + "/" + gwName + ":" + lName + ":" + tostring(lPort)
            if val, ok := allocations[allocKey]; ok {
              scope[gwNs + "/" + gwName + ":" + tostring(lPort)] = toint(val)
            }
          }
        }
        return scope
      }) %}

  # Port-scope SUFFIX for a Gateway listener's host/path map keys.
  #   * catch-all listener (empty hostname): ALWAYS `:<podPort>` — this is
  #     what closes the no-hostname cross-Gateway leak (base's `:port`
  #     fallback then resolves to THIS Gateway's pod port only).
  #   * hostname'd listener on a NON-default port: `:<podPort>` — base's
  #     `host:port` cascade step carries the port, scoped per Gateway.
  #   * hostname'd listener on the protocol's DEFAULT port (HTTP:80 /
  #     HTTPS:443 / TLS:443): "" (bare host) — base's wildcard/host
  #     cascade steps don't carry a port, so suffixing would break
  #     wildcard matching; cross-Gateway same-hostname collisions on a
  #     default port stay possible but are not what the isolation tests
  #     exercise.
  # Falls back to the listener port when the Gateway has no allocation
  # (pinned / chart-static), keeping those keys listener-port-scoped.
  util-gateway-port-scope-for:
    requires: [gateways]
    template: |
      {%- macro PortScopeSuffix(gwNs string, gwName string, port int, proto string, hostname string) string %}
        {{ render "util-gateway-port-scope" -}}
        {%%
          var scope = shared.Get("gatewayPortScope").(map[string]any)
          var scopePort = port
          if val, ok := scope[gwNs + "/" + gwName + ":" + tostring(port)]; ok {
            scopePort = toint(val)
          }
          var isNonDefault = (proto == "HTTP" && port != 80) || ((proto == "HTTPS" || proto == "TLS") && port != 443)
          var suffix = ""
          if hostname == "" || isNonDefault {
            suffix = ":" + tostring(scopePort)
          }
        %%}
        {{- suffix -}}
      {%- end macro -%}
