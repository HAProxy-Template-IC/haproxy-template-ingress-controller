templateSnippets:
  # ============================================================================
  # Per-Gateway-listener pod-port allocator
  #
  # Each Gateway with an HTTPS listener gets its OWN HAProxy bind. Different
  # Gateways' binds need different SSL configs (cert, verify mode,
  # ca-ignore-err flags, ALPN, ...) because HAProxy applies bind-line SSL
  # options uniformly across the bind. To support that, each (Gateway,
  # listener) tuple needs a UNIQUE container port — `bind *:<port>` on the
  # same `0.0.0.0` collides at the OS level if two binds claim the same
  # port. Per-Gateway IPs solve this at the Service layer (each Gateway
  # gets a unique LB IP via MetalLB) but kube-proxy DNATs the LB IP to
  # the pod IP; HAProxy sees its own pod IP regardless of which LB IP the
  # client used. The chart bridges that by giving each (Gateway, listener)
  # a per-Gateway target port, so the per-Gateway Service maps
  # `<lb-ip>:<listener-port>` → `<pod-ip>:<unique-pod-port>` and HAProxy
  # binds on `<unique-pod-port>` with isolated SSL config.
  #
  # Allocation strategy: two-pass, stable across renders.
  #
  # Pass 1 — preserve existing allocations. Walk every (Gateway, HTTPS
  # listener) tuple. For each one, look up the per-Gateway Service in
  # the cluster cache by its `gw-<bounded-hash>` name and, if a
  # `spec.ports[].targetPort >= basePort` is already set for the
  # listener's port, lock that port in. This is what makes the
  # allocation stable across renders: an existing Gateway's
  # allocation is whatever kube-proxy currently DNATs to, so we
  # MUST NOT shuffle it when a new alphabetically-earlier Gateway
  # joins the set.
  #
  # Pass 2 — assign free ports for new tuples. Tuples whose Service
  # didn't yield a reusable allocation get the next-available pod
  # port from `basePort` upward, skipping any port that pass 1 locked
  # in. Sort by stable key (`<gwNs>/<gwName>:<listenerName>:<port>`)
  # before assignment so two renders with the same NEW tuples produce
  # the same NEW allocations.
  #
  # The cache is initialised once per render via `shared.ComputeIfAbsent`
  # so concurrent map renderers see a consistent view.
  # ============================================================================

  util-gateway-pod-port-allocator:
    template: |
      {%- import "util-resource-helpers" for ResourceNamespace, ResourceName, ListenerName, ListenerProtocol %}
      {%- import "util-bounded-k8s-name" for BoundedK8sName %}
      {#- Initialise the per-Gateway-listener pod-port allocation map.
          Idempotent — multiple snippets render this; only the first
          actually computes. Downstream consumers should `{{ render
          "util-gateway-pod-port-allocator" }}` then read
          `shared.Get("gatewayPodPortAllocations")` directly.

          Schema (returned map):
            keys:    "<gwNs>/<gwName>:<listenerName>:<port>"
            values:  int (the allocated container port)

          Allocation rules:
            * Only HTTPS Gateway listeners get an allocation. TLS-Terminate
              listeners on non-default ports already render via
              `frontends-600-gateway-tls-listener` (per-port mode-tcp
              frontend) and don't need per-Gateway pod ports.
              TLS-Passthrough listeners flow through chart-static
              `frontend ssl-tcp` and don't need pod-port allocation either.
            * Listeners with empty name or non-positive port are skipped
              (defensively — invalid Gateway state shouldn't crash the
              allocator, just leave them out).
      -#}
      {%- var _, _ = shared.ComputeIfAbsent("gatewayPodPortAllocations", func() any {
        {#- Two-pass allocator with stability across renders.

            Pass 1: walk every (Gateway, HTTPS listener) tuple AND read
            back the per-Gateway Service from the cluster cache. If the
            Service already exists with a non-default targetPort for
            this listener's port, REUSE that targetPort as the pod-port
            allocation. This is what gives allocations
            within-conformance-suite stability: when a new Gateway is
            applied alongside an existing one, the existing one's
            allocations stay put (its Service was emitted by a prior
            render and is what kube-proxy currently DNATs to), and
            only the new Gateway gets fresh allocations from the free
            pool.

            Pass 2: for tuples without an existing Service allocation,
            assign the lowest free pod port (basePort + i, skipping
            ports already locked in by pass 1). Sort the new tuples
            alphabetically so within a single render the assignment
            order is deterministic — but only NEW tuples ever pick
            from the free pool, so an existing Gateway's allocations
            don't shift when a new alphabetically-earlier Gateway
            arrives. -#}
        var basePort = toint(extraContext | dig("perGatewayPodPortBase") | fallback(18000))
        var allTuples = []any{}
        for _, gw := range resources.gateways.List() {
          var gwNs = gw.Metadata.Namespace
          var gwName = gw.Metadata.Name
          for _, listener := range gw.Spec.Listeners {
            {#- HTTP and HTTPS listeners both get a per-Gateway bind on a
                unique pod port, so each Gateway's routing is isolated by
                destination (dst_port) rather than collapsing onto the
                shared chart-static :80 / :443 binds. TLS listeners are
                excluded — TLS-Passthrough flows through chart-static
                `frontend ssl-tcp` and TLS-Terminate (non-default port)
                renders its own `frontends-600` mode-tcp frontend. -#}
            if listener.Protocol != "HTTPS" && listener.Protocol != "HTTP" {
              continue
            }
            var lName = listener.Name
            var lPort = toint(listener.Port)
            if lName == "" || lPort <= 0 {
              continue
            }
            allTuples = append(allTuples, map[string]any{
              "key":    gwNs + "/" + gwName + ":" + lName + ":" + tostring(lPort),
              "gwNs":   gwNs,
              "gwName": gwName,
              "lPort":  lPort,
            })
          }
        }

        {#- Allocate ONE pod port per (Gateway, PORT) — every listener
            sharing a Gateway+port shares the single bind and is
            host-disambiguated downstream. Then expand to the
            per-(Gateway,listener) keys consumers look up.

            TWO-PASS, STABLE-UNDER-CHURN allocation.

            Pass 1 — preserve committed allocations. For each distinct
            (Gateway, port) key, read back the per-Gateway Service
            (name `gw-<bounded-hash>` in the controller namespace) from
            the cluster cache. If it already publishes a `targetPort >=
            basePort` for this listener port, LOCK that port in. This is
            what makes the allocation stable: an existing Gateway keeps
            whatever kube-proxy currently DNATs to, even as other
            Gateways join or leave the set.

            Pass 2 — assign fresh ports to the remaining keys from the
            lowest free pod port upward (basePort, skipping locked
            ports), in sorted-key order for determinism.

            Why this is required (not just nicer than sort-and-index):
            the conformance suite creates and deletes Gateways
            continuously and in parallel. A pure sort-and-index allocator
            (`basePort + i`) reshuffles EVERY later key's pod port each
            time an alphabetically-earlier Gateway is added or removed —
            so a Gateway's `bind`, its Service `targetPort`, and its
            host/path map keys all move mid-suite, transiently colliding
            two distinct Gateways onto one pod port and bleeding one
            Gateway's routes into another's `:<podPort>` catch-all
            (observed: `same-namespace` and `certificate-malformed` both
            landing on 18010, requests to one served by the other's
            backend). Read-back pins existing Gateways so only genuinely
            new keys draw from the free pool.

            Split-render-pass safety: k8sResources (Service) and
            haproxyConfig (bind) render from the SAME store snapshot
            within a reconcile, so both passes read back the same
            committed Services and compute the same fresh allocations —
            Service `targetPort` == `bind` port holds. A brand-new
            Gateway (no Service yet in the snapshot) gets the same
            deterministic fresh port in both passes; once its Service is
            committed, read-back pins it. Collision-free by construction
            (locked ports are excluded from the free pool). -#}
        var ctrlNs = tostring(extraContext | dig("controllerNamespace") | fallback(""))
        var portKeys = []any{}
        var portKeyMeta = map[string]any{}
        for _, tAny := range allTuples {
          var t = tAny.(map[string]any)
          var pk = tostring(t["gwNs"]) + "/" + tostring(t["gwName"]) + ":" + tostring(toint(t["lPort"]))
          if _, seen := portKeyMeta[pk]; !seen {
            portKeyMeta[pk] = map[string]any{
              "gwNs":   tostring(t["gwNs"]),
              "gwName": tostring(t["gwName"]),
              "lPort":  toint(t["lPort"]),
            }
            portKeys = append(portKeys, pk)
          }
        }

        {#- Pass 1: lock committed allocations from existing per-Gateway Services. -#}
        var portPod = map[string]any{}
        var usedPorts = map[int]bool{}
        var pendingKeys = []any{}
        for _, pkAny := range portKeys {
          var pk = tostring(pkAny)
          var meta = portKeyMeta[pk].(map[string]any)
          var committed = 0
          if ctrlNs != "" {
            var svcName = BoundedK8sName("gw", tostring(meta["gwNs"]), tostring(meta["gwName"]), "")
            var svc = resources.services.GetSingle(ctrlNs, svcName)
            if svc != nil {
              for _, p := range svc.Spec.Ports {
                if toint(p.Port) == toint(meta["lPort"]) {
                  var tp = toint(p.TargetPort)
                  if tp >= basePort {
                    committed = tp
                  }
                }
              }
            }
          }
          if committed > 0 {
            portPod[pk] = committed
            usedPorts[committed] = true
          } else {
            pendingKeys = append(pendingKeys, pk)
          }
        }

        {#- Pass 2: assign lowest free ports to the remaining keys,
            sorted for deterministic assignment, skipping locked ports. -#}
        var sortedPending = sort_strings(pendingKeys)
        var nextPort = basePort
        for _, pkAny := range sortedPending {
          for usedPorts[nextPort] {
            nextPort = nextPort + 1
          }
          portPod[tostring(pkAny)] = nextPort
          usedPorts[nextPort] = true
          nextPort = nextPort + 1
        }

        {#- Expand to per-(Gateway,listener) keys, all pointing at their
            (Gateway,port) pod port. -#}
        var result = map[string]any{}
        for _, tAny := range allTuples {
          var t = tAny.(map[string]any)
          var pk = tostring(t["gwNs"]) + "/" + tostring(t["gwName"]) + ":" + tostring(toint(t["lPort"]))
          result[tostring(t["key"])] = portPod[pk]
        }
        return result
      }) %}

  util-gateway-pod-port-for:
    template: |
      {#- Emit the allocated container port for a given (Gateway, listener).
          Renders the allocator first so callers don't need to. Falls back
          to the listener's own port when no allocation exists (the
          fallback is intentional — chart paths that bypass the allocator
          for TLS-Passthrough / chart-static binds keep working).

          Usage:
            {%- import "util-gateway-pod-port-for" for PodPortFor %}
            bind *:{{ PodPortFor(gwNs, gwName, listenerName, listenerPort) }}
      -#}
      {%- macro PodPortFor(gwNs string, gwName string, listenerName string, listenerPort int) %}
        {{ render "util-gateway-pod-port-allocator" -}}
        {%%
          var key = gwNs + "/" + gwName + ":" + listenerName + ":" + tostring(listenerPort)
          var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any)
          var port = listenerPort
          if val, ok := allocations[key]; ok {
            port = toint(val)
          }
        %%}
        {{- port -}}
      {%- end macro -%}

  # Debug emission gated on extraContext.dumpPodPortAllocations.
  # Production deploys NEVER set the flag, so the body emits zero
  # bytes: only the snippet's `{%- if … %}` predicate runs, which is
  # one map dig + string compare per render — effectively free.
  #
  # The flag exists for ONE thing: chart-validation tests at
  # `tests/15-pod-port-allocator.yaml`. Those tests need to assert
  # the allocator's output without depending on phase-4-and-later
  # consumers (which transform the allocation into binds). The
  # debug snippet runs inside `render_glob "frontend-extra-*"`
  # specifically so the comments appear in haproxy.cfg, where the
  # test's `contains` assertions can pattern-match them.
  #
  # If you ever delete this debug emitter, also delete the
  # `dumpPodPortAllocations` flag and replace the chart tests with
  # ones that assert phase-4 bind lines directly.
  frontend-extra-099-gateway-pod-port-debug:
    template: |
      {%- if tostring(extraContext | dig("dumpPodPortAllocations") | fallback("")) == "true" %}
        {{ render "util-gateway-pod-port-allocator" -}}
        {%- var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any) %}
        {%- var keys = []any{} %}
        {%- for k := range allocations %}
          {%- keys = append(keys, k) %}
        {%- end %}
        {%- var sortedKeys = sort_strings(keys) %}
        {%- for _, key := range sortedKeys %}
          # gw-pod-port: {{ tostring(key) }} = {{ allocations[tostring(key)] }}
        {%- end %}
      {%- end %}

  # Pod-port → listener-port map. The companion snippet
  # `frontend-routing-listener-port-100-gateway` (below) plugs this map
  # into base.yaml's listener-port translation extension point, so a
  # request landing on phase 4's per-Gateway bind (e.g. pod port 18002
  # for a Gateway listener port 8443) is translated back to the
  # listener port that the chart's host.map and path-prefix.map keys
  # are scoped by. Without this translation, the host lookup would
  # try `<host>:18002` and miss the `<host>:8443` entry the chart
  # emitted.
  #
  # Schema: `<podPort> <listenerPort>` per line. The override snippet
  # reads it via `map(...)`; entries absent from the map cause the
  # lookup to fall through to base.yaml's default (`listener_port =
  # dst_port`), which is the right behaviour for chart-static binds.
  features-170-pod-listener-port-map:
    template: |
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any) %}
      {%- var keys = []any{} %}
      {%- for k := range allocations %}
        {%- keys = append(keys, k) %}
      {%- end %}
      {%- var sortedKeys = sort_strings(keys) %}
      {%- var seenPod = map[string]bool{} %}
      {%- var lines = []any{} %}
      {%- for _, key := range sortedKeys %}
        {#- Identity map: `<podPort> <podPort>`. A request landing on a
            per-Gateway bind (dst_port = the unique pod port) keeps
            listener_port = pod port, so the host.map / path-map keys —
            which this refactor scopes by the SAME per-Gateway pod port
            (util-gateway-port-scope) — resolve to that Gateway only. A
            no-hostname listener on one Gateway can no longer catch
            another Gateway's hosts via the shared `:<listenerPort>`
            fallback (the GatewayHTTPListenerIsolation leak). Pinned /
            chart-static binds have no allocation, so their dst_port
            misses this map and falls through to base's default
            (`listener_port = dst_port = listenerPort`) — correct, since
            their keys stay listener-port-scoped. -#}
        {%- var keyStr = tostring(key) %}
        {%- var podPort = tostring(allocations[keyStr]) %}
        {%- if !seenPod[podPort] %}
          {%- seenPod[podPort] = true %}
          {%- lines = append(lines, podPort + " " + podPort) %}
        {%- end %}
      {%- end %}
      {#- The DataPlane API rejects empty file uploads with 422
          "data in body is required" (cannot register a 0-byte body),
          but the companion `frontend-routing-listener-port-100-gateway`
          snippet below references this map unconditionally whenever
          the gateway library is loaded — so we always need a
          registered file. Emit a single comment line when there are
          no allocations: HAProxy treats `# ...` as a comment, the map
          stays effectively empty, and the `map(...) -m found`
          predicate falls through to base.yaml's default
          (`listener_port = dst_port`) on every lookup — the right
          behaviour for chart-static binds. -#}
      {%- var content = "" %}
      {%- if len(lines) > 0 %}
        {%- content = (lines | toStringSlice() | join("\n")) + "\n" %}
      {%- else %}
        {%- content = "# no per-Gateway pod-port allocations\n" %}
      {%- end %}
      {%- var _, regErr = fileRegistry.Register("map", "pod-listener-port.map", content) %}
      {%- if regErr != nil %}
        {{ fail("failed to register pod-listener-port.map: " + tostring(regErr)) }}
      {%- end %}

  # base.yaml exposes a `frontend-routing-listener-port-*` extension
  # point so it can stay resource-agnostic (Level 0): base sets
  # `txn.listener_port = txn.dst_port` by default, and resource
  # libraries that introduce a pod-port → listener-port mapping plug
  # the translation in here. Without the gateway library, base's
  # default holds and `pod-listener-port.map` is never referenced.
  frontend-routing-listener-port-100-gateway:
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      http-request set-var(txn.listener_port) var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) if { var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) -m found }

  # Representative pod port per (Gateway, port): the pod port of the FIRST
  # allocated listener on that Gateway+port — the one phase-3's Service
  # DNATs to and phase-4 binds. Host/path map keys are scoped by this so
  # every listener sharing a Gateway+port lands on the same bind and is
  # disambiguated by Host, and so a no-hostname listener's catch-all is
  # scoped to its own Gateway (GatewayHTTPListenerIsolation).
  util-gateway-port-scope:
    template: |
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var _, _ = shared.ComputeIfAbsent("gatewayPortScope", func() any {
        var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any)
        var scope = map[string]any{}
        for _, gw := range resources.gateways.List() {
          var gwNs = gw.Metadata.Namespace
          var gwName = gw.Metadata.Name
          var seenPort = map[int]bool{}
          for _, listener := range gw.Spec.Listeners {
            var lName = listener.Name
            var lPort = toint(listener.Port)
            if lName == "" || lPort <= 0 || seenPort[lPort] {
              continue
            }
            seenPort[lPort] = true
            var allocKey = gwNs + "/" + gwName + ":" + lName + ":" + tostring(lPort)
            if val, ok := allocations[allocKey]; ok {
              scope[gwNs + "/" + gwName + ":" + tostring(lPort)] = toint(val)
            }
          }
        }
        return scope
      }) %}

  # Port-scope SUFFIX for a Gateway listener's host/path map keys.
  #   * catch-all listener (empty hostname): ALWAYS `:<podPort>` — this is
  #     what closes the no-hostname cross-Gateway leak (base's `:port`
  #     fallback then resolves to THIS Gateway's pod port only).
  #   * hostname'd listener on a NON-default port: `:<podPort>` — base's
  #     `host:port` cascade step carries the port, scoped per Gateway.
  #   * hostname'd listener on the protocol's DEFAULT port (HTTP:80 /
  #     HTTPS:443 / TLS:443): "" (bare host) — base's wildcard/host
  #     cascade steps don't carry a port, so suffixing would break
  #     wildcard matching; cross-Gateway same-hostname collisions on a
  #     default port stay possible but are not what the isolation tests
  #     exercise.
  # Falls back to the listener port when the Gateway has no allocation
  # (pinned / chart-static), keeping those keys listener-port-scoped.
  util-gateway-port-scope-for:
    template: |
      {%- macro PortScopeSuffix(gwNs string, gwName string, port int, proto string, hostname string) string %}
        {{ render "util-gateway-port-scope" -}}
        {%%
          var scope = shared.Get("gatewayPortScope").(map[string]any)
          var scopePort = port
          if val, ok := scope[gwNs + "/" + gwName + ":" + tostring(port)]; ok {
            scopePort = toint(val)
          }
          var isNonDefault = (proto == "HTTP" && port != 80) || ((proto == "HTTPS" || proto == "TLS") && port != 443)
          var suffix = ""
          if hostname == "" || isNonDefault {
            suffix = ":" + tostring(scopePort)
          }
        %%}
        {{- suffix -}}
      {%- end macro -%}
