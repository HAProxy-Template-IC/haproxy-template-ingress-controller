templateSnippets:
  # ----------------------------------------------------------------------------
  # util-tls-cert-by-secret
  #
  # Indexes gf.tlsCertificates by `<secret_namespace>/<secret_name>` so the
  # cert-resolvability check in phases 1/2/4 plus features-150-gateway-bind
  # is a single map lookup instead of an O(N) scan. Cached via
  # shared.ComputeIfAbsent so the index is built at most once per render
  # (any caller can render this util — order is irrelevant since the cache
  # ignores duplicate calls).
  #
  # Usage:
  #   {{ render "util-tls-cert-by-secret" -}}
  #   {%- var certBySecret = shared.Get("tlsCertBySecret").(map[string]any) %}
  #
  # Map value: the full tlsCertificate entry (so callers needing
  # `.sanitized_filename` get it for free). For presence-only callers,
  # `certBySecret[key] != nil` is the membership test.
  # ----------------------------------------------------------------------------
  util-tls-cert-by-secret:
    template: |
      {%- var _, _ = shared.ComputeIfAbsent("tlsCertBySecret", func() any {
        var gf = shared.Get("globalFeatures").(map[string]any)
        var index = map[string]any{}
        for _, tc := range gf["tlsCertificates"].([]any) {
          var tcm = tc.(map[string]any)
          var key = tostring(tcm["secret_namespace"]) + "/" + tostring(tcm["secret_name"])
          index[key] = tcm
        }
        return index
      }) %}

  features-100-gateway-ssl-passthrough:
    requires: [gateways, httproutes, tlsroutes]
    template: |
      {# Register SSL passthrough backends with global feature registry. #}
      {{ render "util-gateway-ssl-passthrough" }}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var sslBackends = gf | dig("sslPassthroughBackends") %}
      {%- if sslBackends != nil %}
        {%- var gwVal, _ = shared.ComputeIfAbsent("gateway_ssl_passthrough", func() any { return nil }) %}
        {%- if gwVal != nil %}
          {%- var gwPassthrough = gwVal.(map[string]any) %}
          {%- var gatewayBackends = gwPassthrough["backends"].([]any) %}
          {%- for _, backend := range gatewayBackends %}
            {%- gf["sslPassthroughBackends"] = append(gf["sslPassthroughBackends"].([]any), backend) %}
          {%- end %}
        {%- end %}
      {%- end %}

  # Register Gateway TLS Terminate mode certificates with SSL infrastructure
  # Pass 1 of the Gateway TLS cert pipeline: walk every
  # (gateway, listener, certRef) triple and aggregate per-secret
  # metadata (SNI patterns, listener ports, default-cert eligibility).
  # Lives in its own snippet so features-100-gateway-tls only contains
  # the emission (Pass 2) — and so the aggregation runs once per render
  # via shared.ComputeIfAbsent even if other snippets read the result.
  util-aggregate-gateway-cert-metadata:
    requires: [gateways, referencegrants]
    template: |
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-resource-helpers" for ResourceNamespace, ListenerHostname -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("gatewayCertAggregates", func() any {
          var certAggregates = map[string]map[string]any{}
          for _, gateway := range resources.gateways.List() {
            var nsStr = ResourceNamespace(gateway)
            for _, listener := range gateway.Spec.Listeners {
              var tlsMode = listener.Tls.Mode
              // Gateway API: tls.mode defaults to Terminate when
              // unspecified. Skip only when explicitly set to a
              // non-Terminate value (Passthrough is handled
              // separately by the SSL passthrough feature).
              if tlsMode != "" && tlsMode != "Terminate" {
                continue
              }
              for _, certRef := range listener.Tls.CertificateRefs {
                var certKind = certRef.Kind
                if certKind == "" {
                  certKind = "Secret"
                }
                if certKind != "Secret" {
                  continue
                }
                var certName = certRef.Name
                var certNamespace = certRef.Namespace
                if certNamespace == "" {
                  certNamespace = nsStr
                }
                var refNsStr = certNamespace
                // Cross-namespace gate. Same-namespace refs are always
                // permitted (no grant needed); cross-ns refs without a
                // matching ReferenceGrant are skipped (the listener-status
                // path elsewhere surfaces this as ResolvedRefs=False
                // /RefNotPermitted).
                if refNsStr != nsStr {
                  if ReferenceGrantPermitted(
                    "gateway.networking.k8s.io", "Gateway", nsStr,
                    "", "Secret", refNsStr, certName) != "true" {
                    continue
                  }
                }
                var secretKey = refNsStr + "/" + certName
                var existing = certAggregates[secretKey]
                if existing == nil {
                  certAggregates[secretKey] = map[string]any{
                    "secret_namespace":   certNamespace,
                    "secret_name":        certName,
                    "sni_patterns":       []any{},
                    "is_gateway_default": false,
                    "listener_ports":     []any{},
                  }
                  existing = certAggregates[secretKey]
                }
                var listenerHostnameStr = ListenerHostname(listener)
                if listenerHostnameStr != "" {
                  existing["sni_patterns"] = append(existing["sni_patterns"].([]any), listenerHostnameStr)
                } else {
                  // Listener with no hostname → cert is a default
                  // candidate (per spec, any SNI accepted).
                  existing["is_gateway_default"] = true
                }
                // Track ports the cert is bound to, so the bind-decision
                // pass downstream knows which listener ports to enable.
                var listenerPort = toint(listener.Port)
                if listenerPort > 0 {
                  existing["listener_ports"] = append(existing["listener_ports"].([]any), listenerPort)
                }
                certAggregates[secretKey] = existing
              }
            }
          }
          return certAggregates
        })
      %%}

  features-100-gateway-tls:
    requires: [gateways, referencegrants]
    template: |
      {# Register TLS certificates from Gateway listeners with TLS mode "Terminate" #}
      {# Dynamically generates certificate files using fileRegistry.Register() #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {# Gateway API TLS configuration structure:
          Gateway.spec.listeners[]:
            - name: https
              protocol: HTTPS  # or GRPC
              port: 443
              hostname: example.com  # optional, can be wildcard
              tls:
                mode: Terminate  # we only handle Terminate here, not Passthrough
                certificateRefs:
                  - kind: Secret
                    name: example-tls
                    namespace: default  # optional, defaults to Gateway namespace
      #}
      {# Two-pass cert registration. Pass 1 — walking every
          (gateway, listener, certRef) triple to aggregate per-secret
          (sni_patterns, listener_ports, is_gateway_default) — lives in
          util-aggregate-gateway-cert-metadata. We render that snippet
          to populate the shared cache, then load the result and emit
          one tlsCert entry per unique secret here.

          Cross-namespace refs are gated by ReferenceGrant: a Gateway
          referencing a Secret in a different namespace requires a
          ReferenceGrant in the Secret's namespace whose `from` matches
          the Gateway and `to` matches the Secret. Without a matching
          grant the cert is skipped (status patch reflects this with
          ResolvedRefs=False/RefNotPermitted, set elsewhere). #}
      {{ render "util-aggregate-gateway-cert-metadata" }}
      {%- var certAggregates = shared.Get("gatewayCertAggregates").(map[string]map[string]any) %}

      {#- Pass 2: emit one tlsCert entry per unique secret. Keys sorted
          for deterministic ordering — Scriggo map iteration is not stable
          and a reordered tlsCerts list would churn the rendered crt-list
          (HAProxy reload thrash on otherwise-identical input). -#}
      {%- var aggKeys = []any{} %}
      {%- for k := range certAggregates %}
        {%- aggKeys = append(aggKeys, k) %}
      {%- end %}
      {%- var sortedAggKeys = sort_strings(aggKeys) %}
      {%- for _, secretKey := range sortedAggKeys %}
        {%%
          var agg = certAggregates[secretKey]
          var certNamespace = tostring(agg["secret_namespace"])
          var certName = tostring(agg["secret_name"])

          var secret = resources.secrets.GetSingle(certNamespace, certName)
          if secret == nil {
            continue
          }
          var tlsCrtB64 = secret.Data["tls.crt"]
          var tlsKeyB64 = secret.Data["tls.key"]
          if tlsCrtB64 == "" || tlsKeyB64 == "" {
            continue
          }
          // Decode and verify the data really is PEM. The conformance
          // suite's malformed-cert fixture has non-empty tls.crt /
          // tls.key fields whose decoded bytes aren't valid PEM —
          // writing such a cert into the crt-list crashes HAProxy at
          // reload time, which in turn fails the entire render-validate
          // pipeline so NO status patch ever reaches the API server
          // (the listener-level InvalidCertificateRef condition our
          // status macro produces is silently dropped). Skip the
          // registration; the listener-status path elsewhere already
          // surfaces the failure as ResolvedRefs=False
          // /InvalidCertificateRef.
          var tlsCrt, crtErr = b64decode(tlsCrtB64)
          var tlsKey, keyErr = b64decode(tlsKeyB64)
          if crtErr != nil || keyErr != nil {
            continue
          }
          if !hasPrefix(tlsCrt, "-----BEGIN ") || !hasPrefix(tlsKey, "-----BEGIN ") {
            continue
          }

          var combinedPem = tlsCrt + "\n" + tlsKey
          var certFilename = certNamespace + "_" + certName + ".pem"
          var certPath, _ = fileRegistry.Register("cert", certFilename, combinedPem)
          var sanitizedFilename = basename(certPath)

          var tlsCert = map[string]any{
            "secret_namespace":   certNamespace,
            "secret_name":        certName,
            "sni_patterns":       agg["sni_patterns"],
            "sanitized_filename": sanitizedFilename,
            "is_gateway_default": agg["is_gateway_default"],
            "listener_ports":     agg["listener_ports"],
          }
          var tlsCerts []any = gf["tlsCertificates"]
          gf["tlsCertificates"] = append(tlsCerts, tlsCert)
        %%}
      {%- end %}

  features-110-gateway-frontend-mtls:
    requires: [gateways, referencegrants]
    template: |
      {%- import "util-resource-helpers" for ListenerKey -%}
      {%- _ = render "util-listenersets-contrib" default "" -%}
      {{ render "util-effective-listeners" }}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {#- Self-seed the two gateway-owned mTLS shared-state keys before the
          first read. ssl.yaml used to pre-seed these for convenience, but
          ssl.yaml is Level 1 (knows only base) and the keys are produced
          and consumed entirely within the gateway library — seeding them
          here keeps the Level-1 boundary clean. -#}
      {%- if gf["mtlsBlockedListeners"] == nil -%}
        {%- gf["mtlsBlockedListeners"] = map[string]any{} -%}
      {%- end -%}
      {%- if gf["gatewayListenerMTLSConfig"] == nil -%}
        {%- gf["gatewayListenerMTLSConfig"] = map[string]any{} -%}
      {%- end -%}
      {%- var clientCertVerifyHosts = gf["clientCertVerifyHosts"].(map[string]any) %}
      {#- mtlsBlockedListeners: set of listener keys
          (`<gw-ns>/<gw-name>/<listener-name>`) where the configured
          frontend mTLS validation either failed to resolve any CA
          (caCertificateRefs all unresolvable) or pointed at an empty
          set. Per Gateway API spec a Gateway listener with
          spec.tls.frontend.default.validation set MUST refuse TLS
          handshakes when the configured CA can't be resolved — closes
          the GatewayFrontendInvalidDefaultClientCertificateValidation
          conformance gap. Read by features-150-gateway-bind to gate
          bindHTTPSDefault / needHTTPSFrontend so the listener's bind
          line drops out of the rendered HAProxy config. -#}
      {%- var mtlsBlockedListeners = gf["mtlsBlockedListeners"].(map[string]any) %}
      {#- gatewayListenerMTLSConfig: per-(Gateway, listener) resolved
          mTLS state, keyed by `<gwNs>/<gwName>/<listenerName>`. Each
          entry is `{ca_path, verify_mode}` (the same shape stored
          under `clientCertVerifyHosts[hostname]`, but unambiguously
          scoped to ONE listener so two Gateways with different
          mTLS configs but overlapping hostnames don't collide).
          Phase 2 of the per-Gateway-IP refactor
          (features-160-gateway-crtlist-per-listener) reads this
          map to emit one crt-list line per listener with the
          listener-specific verify clause. Phase 4's per-Gateway
          bind references the resulting crt-list. -#}
      {%- var gatewayListenerMTLSConfig = gf["gatewayListenerMTLSConfig"].(map[string]any) %}
      {%- for _, gateway := range resources.gateways.List() %}
        {%%
          var gwNs = gateway.Metadata.Namespace
          var gwName = gateway.Metadata.Name
          // Outer presence check uses dig() so an absent TLS-frontend
          // block short-circuits the loop (typed access would yield a
          // zero-value struct, indistinguishable from "present but
          // empty"). Same idiom as the route-analysis pass.
          if dig(gateway, "spec", "tls", "frontend") == nil {
            continue
          }
          // Dig-only: spec.tls is newer than the oldest schema generation
          // the gateways candidate list can resolve — typed access would
          // fail to COMPILE against pre-1.4 Gateway schemas.
          var defaultValidation = dig(gateway, "spec", "tls", "frontend", "default", "validation")
          var perPortValidations = map[int]any{}
          for _, pp := range dig(gateway, "spec", "tls", "frontend", "perPort") | toSlice() {
            var p = toint(dig(pp, "port") | fallback(0))
            if p > 0 && dig(pp, "tls", "validation") != nil {
              perPortValidations[p] = dig(pp, "tls", "validation")
            }
          }

          // Helper: resolve a validation block to (caPath, mode)
          // or ("", "") when it can't be resolved.
          //
          // HAProxy verify mode is derived from validation.mode (GEP-91):
          //   AllowValidOnly        → verify required
          //   AllowInsecureFallback → verify optional
          // The optional mode lets the TLS handshake complete without a
          // client cert OR with an invalid cert (HAProxy still records
          // the verify state in `ssl_c_verify`); applications can then
          // gate per-route. Required rejects both at handshake time.
          var resolveValidation = func(validation any, suffix string) (string, string) {
            if validation == nil {
              return "", ""
            }
            var refs []any = validation | dig("caCertificateRefs") | toSlice()
            if refs == nil {
              return "", ""
            }
            var validationMode = tostring(validation | dig("mode") | fallback("AllowValidOnly"))
            var verifyMode = "required"
            if validationMode == "AllowInsecureFallback" {
              verifyMode = "optional"
            }
            var parts = []any{}
            for _, ref := range refs {
              var refGroup = tostring(dig(ref, "group") | fallback(""))
              var refKind = tostring(dig(ref, "kind") | fallback(""))
              var refName = tostring(dig(ref, "name") | fallback(""))
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(gwNs, refName)
                if cm == nil {
                  continue
                }
                var caCrt = cm.Data["ca.crt"]
                if caCrt != "" {
                  parts = append(parts, caCrt)
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(gwNs, refName)
                if sec == nil {
                  continue
                }
                var b64 = ""
                var caCrt, ok = sec.Data["ca.crt"]
                if ok && caCrt != "" {
                  b64 = caCrt
                } else {
                  var tlsCrt, ok2 = sec.Data["tls.crt"]
                  if ok2 && tlsCrt != "" {
                    b64 = tlsCrt
                  }
                }
                if b64 != "" {
                  var decoded, decodeErr = b64decode(b64)
                  if decodeErr == nil {
                    parts = append(parts, decoded)
                  }
                }
              }
            }
            if len(parts) == 0 {
              return "", ""
            }
            var bundle = join(parts, "\n")
            var fname = "frontend-mtls-" + gwNs + "-" + gwName + suffix + ".crt"
            // "ca-file": a general file (same disk path) flagged so a
            // content-only client-CA bundle rotation applies via the runtime
            // API (add ssl ca-file) with no reload on v3.2+.
            var p, fErr = fileRegistry.Register("ca-file", fname, bundle)
            if fErr != nil {
              return "", ""
            }
            return p, verifyMode
          }

          var defaultPath, defaultMode = resolveValidation(defaultValidation, "-default")
          var perPortResolved = map[int][]string{}
          for port, v := range perPortValidations {
            var p, m = resolveValidation(v, "-port-" + tostring(port))
            if p != "" && m != "" {
              perPortResolved[port] = []string{p, m}
            }
          }

          // Walk the Gateway's own HTTPS listeners + the HTTPS listeners
          // of every accepted ListenerSet attached to this Gateway. Per
          // Gateway API spec the parent Gateway's spec.tls.frontend
          // applies to all listeners under it (Gateway + ListenerSets);
          // there is no per-ListenerSet mTLS config slot.
          var allListeners = []any{}
          for _, l := range gateway.Spec.Listeners {
            allListeners = append(allListeners, l)
          }
          // Read pre-computed admission state from the
          // effectiveListeners cache (populated by util-effective-
          // listeners) so the gate matches what F3 emits as
          // Accepted/Programmed conditions on each ListenerSet.
          var effLAny = shared.Get("effectiveListeners")
          var lsStatuses = map[string]any{}
          if effLAny != nil {
            var effL, ok = effLAny.(map[string]any)
            if ok {
              var stAny, hasSt = effL["statuses"]
              if hasSt {
                lsStatuses = stAny.(map[string]any)
              }
            }
          }
          var lsSeamRaw = shared.Get("listenersetsUntyped")
          var lsAll = []any{}
          if lsSeamRaw != nil {
            var lsSeamAll, lsSeamOk = lsSeamRaw.(map[string]any)["all"].([]any)
            if lsSeamOk { lsAll = lsSeamAll }
          }
          for _, ls := range lsAll {
            if dig_string(ls, "", "spec", "parentRef", "name") != gwName {
              continue
            }
            var lsNs = dig_string(ls, "", "metadata", "namespace")
            var pNs = dig_string(ls, "", "spec", "parentRef", "namespace")
            if pNs == "" { pNs = lsNs }
            if pNs != gwNs {
              continue
            }
            var lsName = dig_string(ls, "", "metadata", "name")
            var lsKey = lsNs + "/" + lsName
            var permitted = false
            var entryAny, hasEntry = lsStatuses[lsKey]
            if hasEntry {
              permitted = entryAny.(map[string]any)["permitted"].(bool)
            }
            if !permitted {
              continue
            }
            allListeners = append(allListeners, dig(ls, "spec", "listeners") | toSlice()...)
          }
          for _, listener := range allListeners {
            var protocol = tostring(listener | dig("protocol") | fallback("HTTP"))
            if protocol != "HTTPS" {
              continue
            }
            var listenerPort = toint(listener | dig("port") | fallback(0))
            var listenerName = tostring(listener | dig("name") | fallback(""))
            // Decide which validation block applies to this listener:
            // per-port override if present, otherwise the gateway-level
            // default. A listener with no validation configured (neither
            // default nor per-port) is unaffected and never gets blocked.
            var hadValidationConfig = false
            var caPath = ""
            var verifyMode = ""
            var override, hasOverride = perPortResolved[listenerPort]
            if hasOverride {
              caPath = override[0]
              verifyMode = override[1]
              hadValidationConfig = true
            } else if defaultValidation != nil {
              caPath = defaultPath
              verifyMode = defaultMode
              hadValidationConfig = true
            }
            // Per-port validation overrides default; if the listener
            // had per-port set explicitly we ignore the default entirely
            // (perPortResolved already encodes "this port has a
            // configured override"). The same applies if the listener
            // had only a default — the resolveValidation call returned
            // ("", "") for unresolvable refs, which is what we detect
            // here.
            //
            // GatewayFrontendInvalidDefaultClientCertificateValidation:
            // a listener with validation configured but no resolvable
            // CA must be blocked from binding so HAProxy doesn't
            // present the chart's default cert and answer handshakes.
            if hadValidationConfig && (caPath == "" || verifyMode == "") {
              if listenerName != "" {
                mtlsBlockedListeners[ListenerKey(gwNs, gwName, listenerName)] = true
              }
              continue
            }
            if caPath == "" || verifyMode == "" {
              continue
            }
            var listenerHostname = tostring(listener | dig("hostname") | fallback(""))
            var key = listenerHostname
            if key == "" {
              key = "*"
            }
            clientCertVerifyHosts[key] = map[string]any{
              "ca_path":     caPath,
              "verify_mode": verifyMode,
            }
            // Per-(Gateway, listener) mTLS state: scoped uniquely
            // by `<gwNs>/<gwName>/<listenerName>`, so two Gateways
            // with different mTLS configs on overlapping hostnames
            // don't clobber each other's resolved state.
            if listenerName != "" {
              gatewayListenerMTLSConfig[gwNs+"/"+gwName+"/"+listenerName] = map[string]any{
                "ca_path":     caPath,
                "verify_mode": verifyMode,
              }
            }
          }
        %%}
      {%- end %}
      {%- gf["clientCertVerifyHosts"] = clientCertVerifyHosts %}
      {%- gf["mtlsBlockedListeners"] = mtlsBlockedListeners %}
      {%- gf["gatewayListenerMTLSConfig"] = gatewayListenerMTLSConfig %}

  # ============================================================================
  # haproxy-service extra ports (gateway / listenerset contribution)
  # ============================================================================
  # base.yaml owns the chart's haproxy Service (k8sResources/haproxy-service)
  # but stays at Level 0 of the library hierarchy — it cannot reference
  # `resources.gateways` / `resources.listenersets` directly. To add
  # the non-default listener ports to the Service surface, we populate
  # `shared.extraServicePorts` here (gateway is Level 2 and has typed
  # access to its own resources), and base.yaml's haproxy-service
  # template reads from shared and appends. Gateways with
  # spec.addresses set get their own dedicated LoadBalancer Service
  # via the gateway-static-addresses k8sResources template — skip
  # them here so we don't double-count.
  # The ListenerSet half lives in features-141, gated on its own CRD, so this
  # snippet never has to reach a ListenerSet through an untyped seam.
  util-gateway-service-port-entry:
    template: |
      {#
        One Service-port entry per (port, protocol). The name carries the key,
        so deduping on it keeps the first contributor of a pair.
      #}
      {#- A func var, not a macro: a macro returns text, and this returns a map. -#}
      {%- var ServicePortEntry = func(port int, protocol string) map[string]any {
        if protocol == "" { protocol = "HTTP" }
        var key = tostring(port) + "-" + toLower(protocol[0:1])
        return map[string]any{
          "name":       "gw-" + key,
          "port":       port,
          "targetPort": port,
          "protocol":   "TCP",
        }
      } -%}

  features-140-gateway-service-extra-ports:
    requires: [gateways]
    template: |
      {%- import "util-gateway-service-port-entry" for ServicePortEntry -%}
      {%%
        // A holder, so features-141 can add to it when the ListenerSet CRD is
        // present. ComputeIfAbsent cannot be re-entered, so the value it
        // returns has to be the mutable thing.
        var holderAny, _ = shared.ComputeIfAbsent("extraServicePorts", func() any {
          return map[string]any{"ports": []map[string]any{}}
        })
        var holder = holderAny.(map[string]any)
        holder["ports"] = resources.gateways.List() |
          reject(gw => len(gw.Spec.Addresses) > 0) |
          flat_map(gw => gw.Spec.Listeners) |
          filter(l => toint(l.Port) > 0) |
          map(l => ServicePortEntry(toint(l.Port), l.Protocol)) |
          unique_by(e => tostring(e["name"]))
      %%}

  # Conservative: all declared listenersets contribute their ports to the
  # Service surface; the routing-layer admission gate still applies separately.
  #
  # `requires: [listenersets]` is what makes the typed access below legal: the
  # snippet is stripped whole on a cluster without the CRD, so it can name the
  # type that a shared-context seam would otherwise have to hide behind `any`.
  features-141-listenerset-service-extra-ports:
    requires: [listenersets]
    template: |
      {%- import "util-gateway-service-port-entry" for ServicePortEntry -%}
      {%%
        var holderAny, _ = shared.ComputeIfAbsent("extraServicePorts", func() any {
          return map[string]any{"ports": []map[string]any{}}
        })
        var holder = holderAny.(map[string]any)
        var ports = holder["ports"].([]map[string]any)
        ports = append(ports, resources.listenersets.List() |
          flat_map(ls => ls.Spec.Listeners) |
          filter(l => toint(l.Port) > 0) |
          map(l => ServicePortEntry(toint(l.Port), l.Protocol))...)
        holder["ports"] = ports | unique_by(e => tostring(e["name"]))
      %%}

  # ============================================================================
  # Route Analysis (Cached)
  # ============================================================================

  features-150-gateway-bind:
    requires: [gateways, grpcroutes, httproutes]
    template: |
      {%- import "util-resource-helpers" for ResourceNamespace, ResourceName, ListenerName, ListenerProtocol, ListenerHostname, ListenerKey -%}
      {%- _ = render "util-listenersets-contrib" default "" -%}
      {#-
        Gateway / ListenerSet contribution to the chart-static bind decision.

        Runs at priority 150, after features-100-* have populated
        gf["tlsCertificates"] (Terminate listeners with valid certs)
        and gf["sslPassthroughBackends"] (Passthrough listeners).
        Here we OR our findings into:
          - bindHTTPDefault   — emit `bind *:httpPort` for HTTP listeners
                                at the chart's default http port
          - bindHTTPSDefault  — emit `bind *:httpsPort` only when at
                                least one valid cert (or passthrough
                                backend) wants traffic on that port
          - needHTTPFrontend  — render http_frontend block (any HTTP
                                listener at any port — even non-default
                                ones, so http-bind-extra-* has somewhere
                                to attach)
          - needHTTPSFrontend — same idea for HTTPS / TLS listeners /
                                passthrough

        The conformance gap this closes:
        GatewayFrontendInvalidDefaultClientCertificateValidation
        sends an HTTPS listener with NoValidCACertificate. The cert
        registration in features-100-gateway-tls fails the PEM check
        and skips the listener, so `tlsCertificates` ends up without
        an entry for that secret. Reading the populated structure
        rather than re-walking listeners means an invalid cert never
        lights up the bind, and the LB doesn't expose port 443 to
        connections HAProxy would otherwise answer with the chart's
        default cert.
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      {# Pre-compute lookup tables consumed by the per-listener checks
          below.

          certBySecret  — set of `<ns>/<name>` keys for every cert that
                          successfully registered (passed b64decode +
                          PEM prefix check). Read tlsCertificates,
                          which features-100-gateway-tls and
                          features-100-ingress-tls have already filled.
          mtlsBlocked   — set of listener-key (`<gw-ns>/<gw-name>/
                          <listener-name>`) for listeners whose
                          configured frontend mTLS validation failed
                          to resolve any CA. Set by
                          features-110-gateway-frontend-mtls. Listed
                          listeners MUST NOT bind, per
                          GatewayFrontendInvalidDefaultClient
                          CertificateValidation. #}
      {{ render "util-tls-cert-by-secret" -}}
      {%- var certBySecret = shared.Get("tlsCertBySecret").(map[string]any) %}
      {#- comma-ok: features-110-gateway-frontend-mtls may be stripped on
          clusters without its required kinds. -#}
      {%- var mtlsBlocked, _ = gf["mtlsBlockedListeners"].(map[string]any) %}
      {#- Walk every Gateway listener and decide its contribution to the
          four bind-decision flags.

          * HTTP at any port → needHTTPFrontend; port == httpPort →
            bindHTTPDefault. http-bind-extra-* handles non-default
            ports without a separate gate; the HTTP path has no
            cert-resolvability check to apply.

          * HTTPS / TLS:
              - Drop the listener if it's in mtlsBlocked (failed CA
                resolution → MUST NOT answer handshakes).
              - For Terminate mode (the default when tls.mode is
                unset), require at least one of the listener's
                certificateRefs to have registered a cert; otherwise
                drop (failed cert resolution).
              - For Passthrough mode, the chart routes via the
                ssl-tcp frontend keyed off sslPassthroughBackends —
                we don't add a per-listener contribution here; the
                fallback below catches that case.
              - port == httpsPort → bindHTTPSDefault; any port lights
                needHTTPSFrontend so https-bind-extra-* has a
                frontend to attach to. -#}
      {%- macro applyListener(gwNs string, gwName string, listener any) %}
      {%%
        var lProto = ListenerProtocol(listener)
        var lPort = toint(dig(listener, "port") | fallback(0))
        var lName = ListenerName(listener)
        if lProto == "HTTP" {
          gf["needHTTPFrontend"] = true
          if lPort == httpPort {
            gf["bindHTTPDefault"] = true
          }
          return
        }
        if lProto != "HTTPS" && lProto != "TLS" {
          return
        }
        // mTLS blocking — listener configured frontend validation but
        // its CA refs didn't resolve. Drop.
        var listenerKey = gwNs + "/" + gwName + "/" + lName
        if lName != "" && mtlsBlocked[listenerKey] != nil {
          return
        }
        var lTlsMode = tostring(listener | dig("tls", "mode") | fallback("Terminate"))
        if lProto == "HTTPS" || (lProto == "TLS" && lTlsMode != "Passthrough") {
          // Cert resolvability — at least one certificateRef must
          // map to an entry in tlsCertificates (cert resolved + PEM
          // valid). For TLS Terminate listeners we keep the same
          // gate; without a resolvable cert HAProxy can't terminate
          // and the listener must not bind.
          var hasResolvedCert = false
          for _, certRef := range listener | dig("tls", "certificateRefs") | toSlice() {
            var refKind = tostring(dig(certRef, "kind") | fallback("Secret"))
            if refKind != "Secret" {
              continue
            }
            var refNs = tostring(dig(certRef, "namespace") | fallback(gwNs))
            var refName = tostring(dig(certRef, "name") | fallback(""))
            if refName == "" {
              continue
            }
            if certBySecret[refNs+"/"+refName] {
              hasResolvedCert = true
              break
            }
          }
          if !hasResolvedCert {
            return
          }
        }
        // TLS-protocol listeners (Terminate or Passthrough) feed the
        // per-port mode-tcp frontends emitted by frontends-600-gateway-
        // tls-listener — NOT the chart's mode-http HTTPS frontend.
        // Each frontend's allowlist of `use_backend if { ssl_fc_sni
        // ... }` rules is the spec contract; reject-default makes
        // unmatched SNIs produce a connection rejection (TCP RST),
        // which closes the upstream TLSRoute conformance gap on
        // invalid-backend rejection. Keyed by port to support the
        // common case of one Gateway claiming several listeners on a
        // single port (different hostnames, same TLS mode — mixed
        // mode is already flagged ProtocolConflict by status patches).
        if lProto == "TLS" {
          var byPortRaw, _ = shared.ComputeIfAbsent("gatewayTLSListenersByPort", func() any { return map[int]any{} })
          var byPort = byPortRaw.(map[int]any)
          var portEntry, exists = byPort[lPort]
          if !exists {
            portEntry = map[string]any{
              "mode":      lTlsMode,
              "listeners": []any{},
            }
          }
          var pe = portEntry.(map[string]any)
          var listenerEntry = map[string]any{
            "gwNs":     gwNs,
            "gwName":   gwName,
            "name":     lName,
            "hostname": ListenerHostname(listener),
            "mode":     lTlsMode,
          }
          pe["listeners"] = append(pe["listeners"].([]any), listenerEntry)
          byPort[lPort] = pe
          return
        }
        // HTTPS-only path below — TLS handled above. HTTPS Gateway
        // listeners terminate TLS in the chart's HTTPS frontend, so
        // light up needHTTPSTermination to keep ssl-tcp's default
        // fall-through to ssl-loopback (rejecting unmatched SNIs would
        // break HTTPS for hosts without an explicit listener match).
        gf["needHTTPSFrontend"] = true
        gf["needHTTPSTermination"] = true
        if lPort == httpsPort {
          gf["bindHTTPSDefault"] = true
        }
      %%}
      {%- end macro %}
      {%- for _, gw := range resources.gateways.List() %}
      {%%
        var gwNs = gw.Metadata.Namespace
        var gwName = gw.Metadata.Name
      %%}
      {%- for _, listener := range gw.Spec.Listeners %}
      {{ applyListener(gwNs, gwName, listener) }}
      {%- end %}
      {%- end %}
      {%- var lsSeamRaw = shared.Get("listenersetsUntyped") %}
      {%- var lsAll150 = []any{} %}
      {%- if lsSeamRaw != nil %}
        {%- var lsSeamAll, lsSeamOk = lsSeamRaw.(map[string]any)["all"].([]any) %}
        {%- if lsSeamOk %}{%- lsAll150 = lsSeamAll %}{%- end %}
      {%- end %}
      {%- for _, ls := range lsAll150 %}
      {%%
        // ListenerSets attach to a parent Gateway via spec.parentRef.
        // Inherit the parent's namespace + name so mTLS blocking
        // (keyed under the Gateway's identity in
        // features-110-gateway-frontend-mtls) applies consistently.
        // Untyped via util-listenersets-contrib (rendered above).
        var lsNs = dig_string(ls, "", "metadata", "namespace")
        var parentName = dig_string(ls, "", "spec", "parentRef", "name")
        var parentNs = dig_string(ls, "", "spec", "parentRef", "namespace")
        if parentNs == "" { parentNs = lsNs }
      %%}
      {%- for _, listener := range dig(ls, "spec", "listeners") | toSlice() %}
      {{ applyListener(parentNs, parentName, listener) }}
      {%- end %}
      {%- end %}
      {#- HTTPRoutes / GRPCRoutes contribute to needHTTPFrontend
          even when they aren't pinned to a specific Gateway in the
          fixtures we see. Their routing logic emits inside the
          http_frontend block (regardless of bind port — the routing
          logic uses dst_port to disambiguate listener ports), so
          the frontend has to exist whenever at least one route is
          declared. The narrower bindHTTPDefault flag stays gated on
          actual listeners at the chart's default httpPort. -#}
      {%%
        if len(resources.httproutes.List()) > 0 {
          gf["needHTTPFrontend"] = true
        }
        if len(resources.grpcroutes.List()) > 0 {
          gf["needHTTPFrontend"] = true
        }
      %%}
      {#- Ingress contribution: any cert registered via
          features-100-ingress-tls indicates an Ingress with spec.tls,
          which the chart routes through the chart-static https
          frontend at httpsPort. ingress.yaml's
          features-100-ingress-bind already lit bindHTTPSDefault
          + needHTTPSFrontend for that case; this is a defensive
          re-affirmation when an Ingress's cert ends up in
          tlsCertificates without going through that path. -#}
      {%%
        for _, certEntry := range gf["tlsCertificates"].([]any) {
          var entry = certEntry.(map[string]any)
          // Ingress-registered entries have no listener_ports key;
          // detect by absence and infer the chart's default httpsPort.
          var ports = entry | dig("listener_ports") | toSlice()
          if len(ports) == 0 {
            gf["needHTTPSFrontend"] = true
            gf["bindHTTPSDefault"] = true
            // HTTPS termination is configured: chart-static
            // ssl-tcp's default_backend should fall through to
            // ssl-loopback for SNIs not claimed by a passthrough
            // route (the chart's pre-existing behaviour).
            gf["needHTTPSTermination"] = true
          }
        }
      %%}
      {# HTTPS-Passthrough bind decisions moved to ssl.yaml's
          `features-140-ssl-passthrough-binds`: `sslPassthroughBackends`
          is cross-library shared state owned by ssl.yaml (any of
          gateway, haproxy-ingress, nginx-ingress can populate it),
          so the consequent bind-decision lives next to the consumer
          (frontends-500-ssl-tcp) rather than in this Level-2 library.
          Without that move, an ingress-only chart with annotation-driven
          ssl-passthrough never saw `bindHTTPSDefault` lit, and the
          TCP frontend silently failed to bind. #}
