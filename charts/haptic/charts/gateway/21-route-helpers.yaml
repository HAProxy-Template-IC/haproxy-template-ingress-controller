templateSnippets:
  util-backend-name-gateway:
    template: |
      {%- macro BackendNameGateway(route any, backend any) string -%}
      gtw_{{ route | dig("metadata", "namespace") | fallback("") }}_{{ route | dig("metadata", "name") | fallback("") }}_{{ backend | dig("name") | fallback("") }}_{{ backend | dig("port") | fallback("") }}
      {%- end macro -%}

  util-resource-helpers:
    template: |
      {# Scriggo macros are text-typed: every helper returns a string, so callers wrap
          numeric fields (listener.port) in toint(). #}
      {%- macro ResourceNamespace(r any) string -%}
      {{- dig(r, "metadata", "namespace") | fallback("") -}}
      {%- end macro -%}

      {%- macro ResourceName(r any) string -%}
      {{- dig(r, "metadata", "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro GatewayKey(ns string, name string) string -%}
      {{- ns -}}/{{- name -}}
      {%- end macro -%}

      {%- macro ListenerKey(gwNs string, gwName string, listenerName string) string -%}
      {{- gwNs -}}/{{- gwName -}}/{{- listenerName -}}
      {%- end macro -%}

      {%- macro ListenerProtocol(listener any) string -%}
      {{- dig(listener, "protocol") | fallback("") -}}
      {%- end macro -%}

      {#- Gateway API defaults a missing protocol to HTTP; pass "" only when absent must stay
          distinguishable from a concrete value. -#}
      {%- macro ListenerProtocolOr(listener any, defaultProto string) string -%}
      {{- dig(listener, "protocol") | fallback(defaultProto) -}}
      {%- end macro -%}

      {%- macro ListenerName(listener any) string -%}
      {{- dig(listener, "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro ListenerHostname(listener any) string -%}
      {{- dig(listener, "hostname") | fallback("") -}}
      {%- end macro -%}

      {%- macro ResolveCertRefKey(listener any, defaultNs string) string -%}
      {%- var certRefs = dig(listener, "tls", "certificateRefs") | toSlice() -%}
      {%- if len(certRefs) > 0 -%}
        {%- var cr = certRefs[0] -%}
        {%- var crNs = tostring(dig(cr, "namespace") | fallback(defaultNs)) -%}
        {%- var crName = tostring(dig(cr, "name") | fallback("")) -%}
        {{- crNs -}}/{{- crName -}}
      {%- end -%}
      {%- end macro -%}

  util-route-condition:
    template: |
      {# txn.gw_rule_id is set by frontend-matchers-advanced-500-gateway. #}
      {%- macro RouteIdCondition(routeId string) string -%}
      { var(txn.gw_rule_id) -m str "{{ routeId }}" }
      {%- end macro -%}

  util-bounded-k8s-name:
    template: |
      {# 63 = the RFC 1123 label limit on K8s object names. Over-long inputs keep an 8-char hash of
          the untruncated key so inputs that collide after truncation still get distinct names. #}
      {%- macro BoundedK8sName(prefix string, ns string, name string, suffix string) string -%}
      {%- var middle = ns + "-" + name -%}
      {%- var joined = prefix + "-" + middle -%}
      {%- if suffix != "" -%}{%- joined = joined + "-" + suffix -%}{%- end -%}
      {%- if len(joined) <= 63 -%}
      {{- joined -}}
      {%- else -%}
      {%- var hashKey = ns + "/" + name -%}
      {%- if suffix != "" -%}{%- hashKey = hashKey + "/" + suffix -%}{%- end -%}
      {%- var hashTag = sha256(hashKey)[0:8] -%}
      {%- var tail = "-" + hashTag -%}
      {%- if suffix != "" -%}{%- tail = tail + "-" + suffix -%}{%- end -%}
      {%- var room = 63 - len(prefix) - 1 - len(tail) -%}
      {%- if room < 1 -%}{%- room = 1 -%}{%- end -%}
      {%- if len(middle) > room -%}{%- middle = middle[0:room] -%}{%- end -%}
      {{- prefix + "-" + middle + tail -}}
      {%- end -%}
      {%- end macro -%}

  util-condition-transition-time:
    template: |
      {# Gateway-API status paths live here, not in the resource-agnostic transitionTime() filter
          (RULE #1). Re-stamping lastTransitionTime on an unchanged status breaks the
          status-applier checksum dedup and self-feeds an SSA-write -> re-render loop. #}
      {%- macro TopLevelTransitionTime(resource any, conditionType string, newStatus string) string -%}
      {{- transitionTime(dig(resource, "status", "conditions"), conditionType, newStatus) -}}
      {%- end macro -%}

      {#- dig(), not .(map[string]any): listener and parent entries are typed structs in production
          and maps in fixture-only paths; the assertion panics on the typed shape. -#}
      {%- macro ListenerTransitionTime(gateway any, listenerName string, conditionType string, newStatus string) string -%}
      {%- var listeners = dig(gateway, "status", "listeners") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- for _, l := range listeners -%}
        {%- if found == nil && tostring(dig(l, "name") | fallback("")) == listenerName -%}
          {%- found = dig(l, "conditions") | toSlice() -%}
        {%- end -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {%- macro RouteParentTransitionTime(route any, parentIdx int, conditionType string, newStatus string) string -%}
      {%- var parents = dig(route, "status", "parents") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- if parentIdx >= 0 && parentIdx < len(parents) -%}
        {%- found = dig(parents[parentIdx], "conditions") | toSlice() -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {#- Match ancestors by identity, not index: the list read back from the apiserver interleaves
          other controllers' entries. Refs compare in the exact shape we wrote them (an omitted
          namespace stays ""), so our own entry always re-matches. -#}
      {%- macro AncestorTransitionTime(policy any, ancestorRef map[string]any, controllerName string, conditionType string, newStatus string) string -%}
      {%%
        var found []any = nil
        var wantGroup = tostring(fallback(ancestorRef["group"], ""))
        var wantKind = tostring(fallback(ancestorRef["kind"], ""))
        var wantName = tostring(fallback(ancestorRef["name"], ""))
        var wantNs = tostring(fallback(ancestorRef["namespace"], ""))
        for _, a := range dig(policy, "status", "ancestors") | toSlice() {
          if dig_string(a, "", "controllerName") != controllerName {
            continue
          }
          if dig_string(a, "", "ancestorRef", "group") != wantGroup {
            continue
          }
          if dig_string(a, "", "ancestorRef", "kind") != wantKind {
            continue
          }
          if dig_string(a, "", "ancestorRef", "name") != wantName {
            continue
          }
          if dig_string(a, "", "ancestorRef", "namespace") != wantNs {
            continue
          }
          found = dig(a, "conditions") | toSlice()
          break
        }
      %%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

  util-hostname-intersect-gateway:
    template: |
      {# Scriggo macros can only return text, so these return "true"/"false" strings; callers
          compare == "true". #}
      {%- macro HostnamesIntersect(listenerHostname string, routeHostnames []any) -%}
        {%- if listenerHostname == "" -%}
          true
        {%- else if len(routeHostnames) == 0 -%}
          true
        {%- else -%}
          {%- var matched = "false" -%}
          {%- for _, rh := range routeHostnames -%}
            {%- if matched == "false" -%}
              {%- if HostnameSinglePairMatch(listenerHostname, tostring(rh)) == "true" -%}
                {%- matched = "true" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ matched -}}
        {%- end -%}
      {%- end macro -%}

      {%- macro HostnameSinglePairMatch(lh string, rh string) -%}
        {%- if HostnameSinglePairIntersection(lh, rh) == "" -%}
          false
        {%- else -%}
          true
        {%- end -%}
      {%- end macro -%}

      {#- Tier offsets keep exact (100000+) > wildcard (100+) > catch-all (0) totally ordered
          without tuple comparison; within a tier the longer hostname wins. Used by listener
          isolation to find the most specific listener claiming a host. -#}
      {%- macro HostnameRank(h string) -%}
        {%- if h == "" -%}
          0
        {%- else if hasPrefix(h, "*.") -%}
          {{ 100 + len(h[2:]) }}
        {%- else -%}
          {{ 100000 + len(h) }}
        {%- end -%}
      {%- end macro -%}

      {#- Gateway API v1 wildcard semantics, NOT RFC 1034: "*.X" matches any host ending in ".X"
          with at least one label before it, so multi.label.foo.X matches too; bare X does not.
          Returns the more specific of the two hostnames, or "" when they don't intersect. -#}
      {%- macro HostnameSinglePairIntersection(lh string, rh string) -%}
        {%- if lh == rh -%}
          {{ lh }}
        {%- else if hasPrefix(lh, "*.") && !hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- if hasSuffix(rh, "."+lhBase) && len(rh) > len("."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- else if !hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var rhBase = rh[2:] -%}
          {%- if hasSuffix(lh, "."+rhBase) && len(lh) > len("."+rhBase) -%}
            {{ lh }}
          {%- end -%}
        {%- else if hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- var rhBase = rh[2:] -%}
          {%- if lhBase == rhBase -%}
            {{ lh }}
          {%- else if hasSuffix(lhBase, "."+rhBase) -%}
            {{ lh }}
          {%- else if hasSuffix(rhBase, "."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-reference-grant-permitted:
    requires: [referencegrants]
    template: |
      {# Scriggo macros can only return text, so this returns "true"/"false"; callers compare
          == "true". #}
      {%- macro ReferenceGrantPermitted(
          fromGroup string, fromKind string, fromNs string,
          toGroup string, toKind string, toNs string, toName string) -%}
        {%- if fromNs == toNs -%}
          true
        {%- else -%}
          {%- var permitted = "false" -%}
          {%- for _, g := range resources.referencegrants.Fetch(toNs) -%}
            {%- if permitted == "false" -%}
              {%- var fromOk = false -%}
              {%- for _, fr := range g.Spec.From -%}
                {%- if fr.Group == fromGroup && fr.Kind == fromKind && fr.Namespace == fromNs -%}
                  {%- fromOk = true -%}
                {%- end -%}
              {%- end -%}
              {%- if fromOk -%}
                {%- for _, to := range g.Spec.To -%}
                  {%- if permitted == "false" -%}
                    {%- if to.Group == toGroup && to.Kind == toKind && (to.Name == "" || to.Name == toName) -%}
                      {%- permitted = "true" -%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ permitted -}}
        {%- end -%}
      {%- end macro -%}

  util-gw-mtls-blocked:
    requires: [gateways]
    template: |
      {# Routes on a listener whose TLS validation CA refs don't resolve must not be served: the
          chart's shared HTTPS frontend would otherwise route them via a SIBLING Gateway's bind
          (conformance GatewayFrontendInvalidDefaultClientCertificateValidation). Reads the live
          stores instead of features-110-gateway-frontend-mtls's state, so map-file renders don't
          depend on that snippet having run. Callers inline the same key literal
          (20-route-analysis.yaml); keep it in sync with GetGwMtlsBlockedKey. #}
      {%- macro GetGwMtlsBlockedKey(gw *resources.gateways.T) string -%}
        gwMtlsBlocked:{{ gw.Metadata.Namespace }}/{{ gw.Metadata.Name }}
      {%- end macro -%}

      {%- macro ComputeGwMtlsBlocked(gw *resources.gateways.T) -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("gwMtlsBlocked:"+gw.Metadata.Namespace+"/"+gw.Metadata.Name, func() any {
          var blocked = map[string]bool{}
          // dig(), not typed access: typed access yields the zero struct, so it cannot tell an
          // absent spec.tls.frontend from a present-but-empty one.
          if dig(gw, "spec", "tls", "frontend") == nil {
            return blocked
          }
          var gwNs = gw.Metadata.Namespace
          // dig-only: spec.tls is newer than the oldest schema generation the gateways
          // candidate list can resolve.
          var defaultValidation = dig(gw, "spec", "tls", "frontend", "default", "validation")
          var perPortValidations = map[int]any{}
          for _, pp := range dig(gw, "spec", "tls", "frontend", "perPort") | toSlice() {
            var p = toint(dig(pp, "port") | fallback(0))
            if p > 0 && dig(pp, "tls", "validation") != nil {
              perPortValidations[p] = dig(pp, "tls", "validation")
            }
          }
          var resolveValidation = func(validation any) bool {
            var refs = dig(validation, "caCertificateRefs") | toSlice()
            if len(refs) == 0 {
              return false
            }
            for _, ref := range refs {
              var refKind = tostring(dig(ref, "kind") | fallback(""))
              var refGroup = tostring(dig(ref, "group") | fallback(""))
              var refName = tostring(dig(ref, "name") | fallback(""))
              var refNs = tostring(dig(ref, "namespace") | fallback(gwNs))
              if refName == "" {
                continue
              }
              if refGroup != "" && refGroup != "core" {
                continue
              }
              if refKind == "ConfigMap" {
                if resources.configmaps.GetSingle(refNs, refName) != nil {
                  return true
                }
              } else if refKind == "Secret" {
                if resources.secrets.GetSingle(refNs, refName) != nil {
                  return true
                }
              }
            }
            return false
          }
          for _, l := range gw.Spec.Listeners {
            var lProto = l.Protocol
            if lProto != "HTTPS" && lProto != "TLS" {
              continue
            }
            var lName = l.Name
            var validation any = perPortValidations[toint(l.Port)]
            if validation == nil {
              validation = defaultValidation
            }
            if validation == nil {
              continue
            }
            if !resolveValidation(validation) {
              blocked[lName] = true
            }
          }
          return blocked
        })
      %%}
      {%- end macro -%}
