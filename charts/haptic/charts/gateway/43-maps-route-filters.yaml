# Per-route filter logic, driven by map files instead of per-route directives.
#
# Every rule-level and backendRef-level filter HAProxy can source from a map at
# request time is built here once and read by static lines: adding a route then
# changes a map entry, not haproxy.cfg, so it deploys without a reload. What
# stays structural is listed in docs/site/docs/libraries/gateway.md.
#
# The maps are registered even when empty. Creating a map file on the first
# route that needs it, and deleting it with the last, are both structural
# changes to haproxy.cfg — the reload this machinery exists to avoid.
templateSnippets:
  util-gateway-route-maps:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%%
        var ga = gaVal.(map[string]any)
        var _, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any {
          var allRoutes = toSlice(ga["allRoutes"])
          var out = map[string]any{}

          // bucket -> lowercased header name -> the spelling the static line
          // emits. Smallest spelling wins, so two routes disagreeing on case
          // still share one line and the choice does not depend on route order.
          var buckets = []string{
            "req-rule-set", "req-rule-add", "req-rule-del",
            "res-rule-set", "res-rule-add", "res-rule-del",
            "req-be-set", "req-be-add", "req-be-del",
            "res-be-set", "res-be-add", "res-be-del"}
          var names = map[string]any{}
          for _, b := range buckets {
            names[b] = map[string]string{}
          }
          var addName = func(bucket string, n string) {
            var m = names[bucket].(map[string]string)
            var lower = toLower(n)
            var cur, seen = m[lower]
            if !seen || n < cur {
              m[lower] = n
            }
          }
          // RFC 7230 token minus the characters that mean something to HAProxy
          // where the name lands: '|' (the map key delimiter), '#' (a comment),
          // '%' (a fetch), and the quotes its tokenizer pairs up.
          var nameOk = func(n string) bool {
            return regex_search(n, "^[A-Za-z0-9!$&*+.^_~-]+$")
          }
          var hostOk = func(h string) bool {
            return regex_search(toLower(h), "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
          }
          // Gateway API treats "/foo/" and "/foo" as one prefix, and the
          // remainder starts at the byte after the normalised form.
          var normPrefix = func(p string) string {
            if p == "" || p == "/" {
              return ""
            }
            if hasSuffix(p, "/") {
              return p[:len(p)-1]
            }
            return p
          }

          var reqEntries = []string{"# <rule_id>[|<backend>]|set|add|del|<header> -> URL-encoded value"}
          var resEntries = []string{"# <rule_id>[|<backend>]|set|add|del|<header> -> URL-encoded value"}
          var redirEntries = []string{"# <rule_id> -> code|scheme|host|port|pathmode|pfxlen|path"}
          var rwEntries = []string{"# <rule_id> -> host|pathmode|pfxlen|path"}
          var toEntries = []string{"# <rule_id> -> backend request timeout in ms"}
          var mirEntries = []string{"# <rule_id> -> scheme|host:port|timeout_ms|retries;... (URL-encoded)"}
          var mirPctEntries = []string{"# <rule_id> -> mirror sampling percentage"}
          // Rules a single map value cannot describe keep a per-route line:
          // prefix lengths per match, mirror targets per sampling percentage.
          var pfxFallback = []any{}
          var mirFallback = []any{}

          // A rule matching several path prefixes has several prefix lengths and
          // a map value carries one, so collect them before the filter loop.
          var pfxLens = map[string]any{}
          for _, ri := range allRoutes {
            var rm = ri.(map[string]any)
            var rid = tostring(rm["routeId"])
            var lens map[string]bool
            var have, ok = pfxLens[rid]
            if ok {
              lens = have.(map[string]bool)
            } else {
              lens = map[string]bool{}
              pfxLens[rid] = lens
            }
            if tostring(rm["pathType"]) != "PathPrefix" {
              // An Exact or RegularExpression match has no prefix to strip;
              // marking it takes the fallback rather than a wrong length.
              lens["none"] = true
              continue
            }
            lens[tostring(len(normPrefix(tostring(rm["pathValue"]))))] = true
          }
          var multiPrefix = func(rid string) bool {
            return len(pfxLens[rid].(map[string]bool)) > 1
          }
          // Only a rule that stored "M" needs the per-match lines; emitting them
          // for any other multi-prefix rule would put a configuration line back
          // on a route that has no path modifier at all.
          var needsRuntimePrefix = map[string]bool{}

          // The redirect codes Gateway API expresses and HAProxy's `redirect`
          // accepts. The static block emits one line per code — HAProxy rejects an
          // expression there — so the set is fixed rather than per-route.
          var redirectCodes = map[string]bool{"301": true, "302": true, "303": true, "307": true, "308": true}

          // `<mode>|<prefix length>|<path>`, shared by RequestRedirect and
          // URLRewrite. "M" as the length defers to the per-match lines a rule
          // matching several prefixes contributes.
          var pathFields = func(pathMod any, rid string, rm map[string]any) map[string]any {
            var pmode = ""
            var pfxlen = "0"
            var newPath = ""
            if pathMod != nil {
              var ptype = tostring(dig(pathMod, "type"))
              if ptype == "ReplaceFullPath" {
                pmode = "F"
                newPath = tostring(dig(pathMod, "replaceFullPath") | fallback(""))
              } else if ptype == "ReplacePrefixMatch" {
                // The remainder is taken from the matched prefix's byte length,
                // and a regex has no such length — Gateway API defines
                // ReplacePrefixMatch against a PathPrefix match only.
                if tostring(rm["pathType"]) == "RegularExpression" {
                  return map[string]any{"bad": "regex", "packed": ""}
                }
                pmode = "P"
                newPath = normPrefix(tostring(dig(pathMod, "replacePrefixMatch") | fallback("")))
                pfxlen = tostring(len(normPrefix(tostring(rm["pathValue"]))))
                if multiPrefix(rid) {
                  pfxlen = "M"
                  needsRuntimePrefix[rid] = true
                }
              }
            }
            var bad = ""
            if newPath != "" && ConfigInjectionKind(newPath, "line") != "" {
              bad = "cntrl"
            }
            return map[string]any{
              "bad": bad,
              "packed": pmode + "|" + pfxlen + "|" + queryEscape(newPath),
            }
          }

          var seen = map[string]bool{}
          for _, ri := range allRoutes {
            var rm = ri.(map[string]any)
            var rid = tostring(rm["routeId"])
            if seen[rid] {
              continue
            }
            seen[rid] = true

            var route = rm["route"]
            var ruleIdx = toint(rm["ruleIdx"])
            var routeKey = tostring(dig(route, "metadata", "namespace")) + "/" + tostring(dig(route, "metadata", "name"))
            var routeNs = tostring(dig(route, "metadata", "namespace"))
            var isHTTP = false
            var ruleAny any = nil
            var filters = []any{}
            var backendRefs = []any{}
            // rm["route"], not the `route` local: a typed value copied into an
            // any-typed variable loses its dynamic type for a Scriggo type switch.
            switch r := rm["route"].(type) {
            case *resources.httproutes.T:
              isHTTP = true
              if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
                ruleAny = r.Spec.Rules[ruleIdx]
                for _, f := range r.Spec.Rules[ruleIdx].Filters {
                  filters = append(filters, f)
                }
                for _, b := range r.Spec.Rules[ruleIdx].BackendRefs {
                  backendRefs = append(backendRefs, b)
                }
              }
            case *resources.grpcroutes.T:
              if ruleIdx >= 0 && ruleIdx < len(r.Spec.Rules) {
                ruleAny = r.Spec.Rules[ruleIdx]
                for _, f := range r.Spec.Rules[ruleIdx].Filters {
                  filters = append(filters, f)
                }
                for _, b := range r.Spec.Rules[ruleIdx].BackendRefs {
                  backendRefs = append(backendRefs, b)
                }
              }
            }

            // One `<rule_id>|any` entry per direction, however many headers the
            // rule touches: it exists so the debug marker costs one static line
            // rather than one per header name, and a duplicate map line is noise
            // in every runtime diff of that map.
            var anySeen = map[string]bool{}
            var modLines = func(mod any, keyPrefix string, bucketBase string) []string {
              var lines = []string{}
              if mod == nil {
                return lines
              }
              var markAny = func() {
                var key = rid + "|" + bucketBase[:3]
                if !anySeen[key] {
                  anySeen[key] = true
                  lines = append(lines, rid + "|any 1")
                }
              }
              for _, op := range []string{"set", "add"} {
                for _, h := range toSlice(dig(mod, op)) {
                  var hn = tostring(dig(h, "name"))
                  var hv = tostring(dig(h, "value"))
                  if !nameOk(hn) {
                    _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", "Gateway route " + routeKey + " modifies header '" + hn + "', which is not an HTTP token; the header is not applied. Use letters, digits and -._~!$&*+^.")
                    continue
                  }
                  var inj = ConfigInjectionKind(hv, "line")
                  if inj != "" {
                    _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", "Gateway route " + routeKey + " sets header '" + hn + "' to a value containing " + inj + ", which would inject a header break at request time; the header is not applied. Remove control characters from the value.")
                    continue
                  }
                  addName(bucketBase + "-" + op, hn)
                  markAny()
                  lines = append(lines, keyPrefix + "|" + op + "|" + toLower(hn) + " " + queryEscape(hv))
                }
              }
              for _, h := range toSlice(dig(mod, "remove")) {
                var hn = tostring(h)
                if !nameOk(hn) {
                  _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", "Gateway route " + routeKey + " removes header '" + hn + "', which is not an HTTP token; the removal is not applied. Use letters, digits and -._~!$&*+^.")
                  continue
                }
                addName(bucketBase + "-del", hn)
                markAny()
                lines = append(lines, keyPrefix + "|del|" + toLower(hn) + " 1")
              }
              return lines
            }

            var mirrorTargets = []any{}
            var mirrorPcts = map[string]bool{}

            for _, f := range filters {
              var ft = tostring(dig(f, "type"))
              if ft == "RequestHeaderModifier" {
                for _, l := range modLines(dig(f, "requestHeaderModifier"), rid, "req-rule") {
                  reqEntries = append(reqEntries, l)
                }
              } else if ft == "ResponseHeaderModifier" {
                for _, l := range modLines(dig(f, "responseHeaderModifier"), rid, "res-rule") {
                  resEntries = append(resEntries, l)
                }
              } else if ft == "RequestRedirect" && isHTTP {
                var redir = dig(f, "requestRedirect")
                if redir == nil {
                  continue
                }
                var code = toint(dig(redir, "statusCode") | fallback(302))
                if !redirectCodes[tostring(code)] {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " RequestRedirect statusCode is " + tostring(code) + "; the redirect is not applied. Use 301, 302, 303, 307 or 308.")
                  continue
                }
                var scheme = tostring(dig(redir, "scheme") | fallback(""))
                if scheme != "" && scheme != "http" && scheme != "https" {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " RequestRedirect scheme is '" + scheme + "'; the redirect is not applied. Use http or https.")
                  continue
                }
                var host = tostring(dig(redir, "hostname") | fallback(""))
                if host != "" && !hostOk(host) {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " RequestRedirect hostname '" + host + "' is not a DNS name; the redirect is not applied. Use letters, digits, '-' and '.'.")
                  continue
                }
                var portStr = tostring(dig(redir, "port") | fallback(""))
                if portStr != "" && (toint(portStr) < 1 || toint(portStr) > 65535) {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " RequestRedirect port " + portStr + " is outside 1-65535; the redirect is not applied.")
                  continue
                }
                // Spec: Location omits the port when the resulting (scheme, port)
                // is (http,80) or (https,443); with both unset it is the Gateway
                // listener's own port, which only the request knows — sentinel "L".
                var portPart = ""
                if portStr == "" && scheme == "" {
                  portPart = "L"
                } else if portStr != "" {
                  var isDefault = (portStr == "80" && (scheme == "" || scheme == "http")) ||
                    (portStr == "443" && (scheme == "" || scheme == "https"))
                  if !isDefault {
                    portPart = ":" + portStr
                  }
                }
                var pathSpec = pathFields(dig(redir, "path"), rid, rm)
                if tostring(pathSpec | dig("bad")) == "cntrl" {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " RequestRedirect path contains a control character, which would break the redirect target; the redirect is not applied.")
                  continue
                }
                if tostring(pathSpec | dig("bad")) == "regex" {
                  _ = WebhookRejectOrWarn(route, "InvalidRedirect", "HTTPRoute " + routeKey + " uses RequestRedirect ReplacePrefixMatch on a RegularExpression path match, which has no prefix to replace; the redirect is not applied. Match on a PathPrefix, or use ReplaceFullPath.")
                  continue
                }
                redirEntries = append(redirEntries, rid + " " + tostring(code) + "|" + scheme + "|" +
                  queryEscape(host) + "|" + portPart + "|" + tostring(pathSpec | dig("packed")))
              } else if ft == "URLRewrite" && isHTTP {
                var rw = dig(f, "urlRewrite")
                if rw == nil {
                  continue
                }
                var host = tostring(dig(rw, "hostname") | fallback(""))
                if host != "" && !hostOk(host) {
                  _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", "HTTPRoute " + routeKey + " URLRewrite hostname '" + host + "' is not a DNS name; the rewrite is not applied. Use letters, digits, '-' and '.'.")
                  continue
                }
                var pathSpec = pathFields(dig(rw, "path"), rid, rm)
                if tostring(pathSpec | dig("bad")) == "cntrl" {
                  _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", "HTTPRoute " + routeKey + " URLRewrite path contains a control character, which would break the rewritten path; the rewrite is not applied.")
                  continue
                }
                if tostring(pathSpec | dig("bad")) == "regex" {
                  _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", "HTTPRoute " + routeKey + " uses URLRewrite ReplacePrefixMatch on a RegularExpression path match, which has no prefix to replace; the rewrite is not applied. Match on a PathPrefix, or use ReplaceFullPath.")
                  continue
                }
                rwEntries = append(rwEntries, rid + " " + queryEscape(host) + "|" + tostring(pathSpec | dig("packed")))
              } else if ft == "RequestMirror" {
                var mirror = dig(f, "requestMirror")
                var backendRef = dig(mirror, "backendRef")
                var bName = dig_string(backendRef, "", "name")
                if bName == "" {
                  continue
                }
                var bNs = tostring(dig(backendRef, "namespace") | fallback(routeNs))
                var bPort = toint(dig(backendRef, "port") | fallback(80))
                if bPort < 1 || bPort > 65535 {
                  _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", "Gateway route " + routeKey + " mirrors to port " + tostring(bPort) + ", outside 1-65535; the mirror is not applied.")
                  continue
                }
                // Service DNS, not pod IPs: mirror dispatch is fire-and-forget,
                // so an individual endpoint failure must not affect the request.
                var target = bName + "." + bNs + ".svc.cluster.local"
                if !hostOk(target) {
                  _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", "Gateway route " + routeKey + " mirrors to '" + bNs + "/" + bName + "', which is not a DNS name; the mirror is not applied.")
                  continue
                }
                // Mirror dispatch does not validate TLS certs (plugin default
                // `verify_tls = false`).
                var bScheme = "http"
                var svc = resources.services.GetSingle(bNs, bName)
                if svc != nil {
                  for _, p := range svc.Spec.Ports {
                    if toint(p.Port) == bPort &&
                      (p.AppProtocol == "https" || p.AppProtocol == "kubernetes.io/https" || p.Name == "https") {
                      bScheme = "https"
                    }
                  }
                }
                var percent = 100
                var pct = dig(mirror, "percent")
                if pct != nil {
                  percent = toint(pct)
                } else {
                  var frac = dig(mirror, "fraction")
                  if frac != nil {
                    var den = toint(dig(frac, "denominator") | fallback(100))
                    if den > 0 {
                      percent = (toint(dig(frac, "numerator") | fallback(0)) * 100) / den
                    }
                  }
                }
                if percent < 0 || percent > 100 {
                  _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", "Gateway route " + routeKey + " mirrors " + tostring(percent) + "% of requests, outside 0-100; the mirror is not applied.")
                  continue
                }
                var timeoutMs = toint(extraContext | dig("spoaHub", "mirror", "targetTimeoutMs") | fallback(2000))
                var retriesCount = toint(extraContext | dig("spoaHub", "mirror", "targetRetries") | fallback(0))
                mirrorTargets = append(mirrorTargets, map[string]any{
                  "entry": bScheme + "|" + target + ":" + tostring(bPort) + "|" + tostring(timeoutMs) + "|" + tostring(retriesCount),
                  "pct": percent})
                mirrorPcts[tostring(percent)] = true
              }
            }

            if len(mirrorTargets) > 0 {
              var maxPct = 0
              for _, t := range mirrorTargets {
                if toint(t | dig("pct")) > maxPct {
                  maxPct = toint(t | dig("pct"))
                }
              }
              // Every mirroring rule lands here, fallbacks included: the
              // request-buffering gate keys off this map, and a fallback rule
              // has no entry in gw-mirror.map to key off.
              mirPctEntries = append(mirPctEntries, rid + " " + tostring(maxPct))
              if len(mirrorPcts) > 1 {
                // One map value carries one percentage, so a rule whose mirrors
                // disagree keeps a per-target line with its own rand() draw.
                for _, t := range mirrorTargets {
                  mirFallback = append(mirFallback,
                    map[string]any{"rid": rid, "entry": tostring(t | dig("entry")), "pct": toint(t | dig("pct"))})
                }
              } else {
                var packed = []string{}
                for _, t := range mirrorTargets {
                  packed = append(packed, tostring(t | dig("entry")))
                }
                mirEntries = append(mirEntries, rid + " " + queryEscape(join(packed, ";") + ";"))
              }
            }

            // GEP-1742. `request` covers the whole client-facing exchange and
            // `backendRequest` a single try; HAProxy has one server timeout, so
            // the wider one wins where both are set.
            var tval = dig_string(ruleAny, "", "timeouts", "request")
            if tval == "" || tval == "0s" {
              tval = dig_string(ruleAny, "", "timeouts", "backendRequest")
            }
            if tval != "" && tval != "0s" {
              var d, dErr = parseDuration(tval)
              if dErr != nil {
                _ = WebhookRejectOrWarn(route, "InvalidTimeout", "Gateway route " + routeKey + " sets timeout '" + tval + "', which is not a duration; the timeout is not applied. Use a value like 30s or 1m30s.")
              } else if toint(d.Milliseconds()) <= 0 {
                _ = WebhookRejectOrWarn(route, "InvalidTimeout", "Gateway route " + routeKey + " sets timeout '" + tval + "', which is under a millisecond; the timeout is not applied.")
              } else {
                toEntries = append(toEntries, rid + " " + tostring(toint(d.Milliseconds())))
              }
            }

            for _, br := range backendRefs {
              var beFilters = toSlice(dig(br, "filters"))
              if len(beFilters) == 0 {
                continue
              }
              var beKey = rid + "|" + BackendNameGateway(route, br)
              for _, bf := range beFilters {
                var bt = tostring(dig(bf, "type"))
                if bt == "RequestHeaderModifier" {
                  for _, l := range modLines(dig(bf, "requestHeaderModifier"), beKey, "req-be") {
                    reqEntries = append(reqEntries, l)
                  }
                } else if bt == "ResponseHeaderModifier" {
                  for _, l := range modLines(dig(bf, "responseHeaderModifier"), beKey, "res-be") {
                    resEntries = append(resEntries, l)
                  }
                }
              }
            }
          }

          var pfxSeen = map[string]bool{}
          for _, ri := range allRoutes {
            var rm = ri.(map[string]any)
            var rid = tostring(rm["routeId"])
            if !needsRuntimePrefix[rid] {
              continue
            }
            var ptype = tostring(rm["pathType"])
            if ptype != "PathPrefix" && ptype != "Exact" {
              continue
            }
            var np = tostring(rm["pathValue"])
            if ptype == "PathPrefix" {
              np = normPrefix(np)
            }
            // The value lands inside a double-quoted ACL. sanitize_regex escapes
            // the regex metacharacters but not a quote or a control character,
            // and the routing map's own guard lets a quote through.
            var inj = ConfigInjectionKind(np, "dquote")
            if inj != "" {
              _ = WebhookRejectOrWarn(rm["route"], "InvalidPath", "HTTPRoute " + tostring(dig(rm["route"], "metadata", "namespace")) + "/" + tostring(dig(rm["route"], "metadata", "name")) + " has a path match containing " + inj + ", which cannot be written to the prefix-length rule; that match keeps the original path. Remove double quotes and control characters from the path.")
              continue
            }
            // allRoutes carries one entry per (rule, match, hostname), so the same
            // prefix arrives once per hostname.
            if pfxSeen[rid + "|" + np] {
              continue
            }
            pfxSeen[rid + "|" + np] = true
            var cond = "{ path -m reg \"^" + sanitize_regex(np) + "(/|\\$)\" }"
            if ptype == "Exact" {
              cond = "{ path -m str \"" + np + "\" }"
            }
            pfxFallback = append(pfxFallback,
              map[string]any{"len": len(np), "rid": rid, "cond": cond})
          }
          // Ascending length, so the longest prefix is set last and wins — the
          // Gateway API precedence a first-match-wins chain gave.
          var sortedPfx, pfxErr = sort_by(pfxFallback, []string{"$.len", "$.rid"})
          if pfxErr != nil {
            fail("failed to sort the gateway prefix-length fallback: " + tostring(pfxErr))
          }

          for _, b := range buckets {
            var m = names[b].(map[string]string)
            var lowered = []any{}
            for _, k := range keys(m) {
              lowered = append(lowered, k)
            }
            var display = []string{}
            for _, k := range sort_strings(lowered) {
              display = append(display, m[k])
            }
            out[b] = display
          }
          out["reqPath"] = RegisterMap("gw-reqhdr.map", reqEntries, map[string]any{"ordered": false})
          out["resPath"] = RegisterMap("gw-reshdr.map", resEntries, map[string]any{"ordered": false})
          out["redirectPath"] = RegisterMap("gw-redirect.map", redirEntries, map[string]any{"ordered": false})
          out["urlrewritePath"] = RegisterMap("gw-urlrewrite.map", rwEntries, map[string]any{"ordered": false})
          out["timeoutPath"] = RegisterMap("gw-timeout.map", toEntries, map[string]any{"ordered": false})
          out["mirrorPath"] = RegisterMap("gw-mirror.map", mirEntries, map[string]any{"ordered": false})
          out["mirrorPctPath"] = RegisterMap("gw-mirror-pct.map", mirPctEntries, map[string]any{"ordered": false})
          out["pfxFallback"] = sortedPfx
          out["mirrorFallback"] = mirFallback
          return out
        })
      %%}

  # Registers the maps in the features phase, so they exist before any frontend
  # renders — frontend-filters-* render once per frontend and must not each
  # build their own copy.
  features-500-gateway-route-maps:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}

  # One snippet for every filter whose value comes out of a map, because the
  # order between them is a contract rather than a coincidence of how four
  # snippet names sorted: the per-match prefix lengths have to be set before the
  # redirect and rewrite blocks read txn.gw_pfxlen, and a backendRef-level header
  # modifier has to run after the rule-level one it overrides — which the old
  # placement (rule-level in the frontend, backendRef-level in the backend) got
  # backwards for responses, since HAProxy evaluates a backend's http-response
  # rules first.
  frontend-filters-495-gateway-route-filters:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-header-modifier-rules" for HeaderModifierRules -%}
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var gwm = gwmVal.(map[string]any) %}
      {%- for _, fb := range gwm["pfxFallback"] | toSlice() %}
      http-request set-var(txn.gw_pfxlen) int({{ fb | dig("len") }}) if { var(txn.gw_rule_id) -m str "{{ fb | dig("rid") }}" } {{ fb | dig("cond") }}
      {%- end %}
      # gateway/frontend-filters-gateway-headers
      {%- if extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) %}
      http-request set-var(txn.filters_applied) str(RequestHeaderModifier) if { var(txn.gw_rule_id),concat(|any),map({{ tostring(gwm["reqPath"]) }}) -m found } !{ var(txn.filters_applied) -m found }
      http-request set-var(txn.filters_applied) str(ResponseHeaderModifier) if { var(txn.gw_rule_id),concat(|any),map({{ tostring(gwm["resPath"]) }}) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}
      {%- for _, lvl := range []any{
            map[string]any{"b": "rule", "k": "var(txn.gw_rule_id)"},
            map[string]any{"b": "be", "k": "var(txn.gw_rule_id),concat(|,txn.backend_name,)"}} %}
      {%- var b = tostring(lvl | dig("b")) %}
      {%- var k = tostring(lvl | dig("k")) %}
      {{- HeaderModifierRules("request", k, tostring(gwm["reqPath"]),
            gwm["req-" + b + "-set"].([]string), gwm["req-" + b + "-add"].([]string), gwm["req-" + b + "-del"].([]string)) -}}
      {{- HeaderModifierRules("response", k, tostring(gwm["resPath"]),
            gwm["res-" + b + "-set"].([]string), gwm["res-" + b + "-add"].([]string), gwm["res-" + b + "-del"].([]string)) -}}
      {%- end %}
      {%- var redirMap = tostring(gwm["redirectPath"]) %}
      {#- Fallbacks are the pod-internal 8080/8443 (chart-wide convention);
          extraContext.httpPort/httpsPort is always plumbed in production. -#}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      {%- var debug = extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) %}
      # gateway/frontend-filters-gateway-redirect
      http-request set-var(txn.gw_redir) var(txn.gw_rule_id),map({{ redirMap }}) if { var(txn.gw_rule_id),map({{ redirMap }}) -m found }
      {# Spec: an unset spec.scheme MUST keep the request's scheme, not downgrade. #}
      http-request set-var(txn.gw_redir_scheme) var(txn.gw_redir),field(2,|) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_scheme) str(http) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_scheme) -m len 0 } !{ ssl_fc }
      http-request set-var(txn.gw_redir_scheme) str(https) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_scheme) -m len 0 } { ssl_fc }
      http-request set-var(txn.gw_redir_host) var(txn.gw_redir),field(3,|),url_dec(1) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_host) req.hdr(Host),field(1,:) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_host) -m len 0 }
      {# "L" means both scheme and port were unset, so Location carries the Gateway
         listener port, resolved per request because one route can serve several.
         txn.gw_listener_port, not txn.listener_port or dst_port: on the
         per-Gateway-IP path those are the allocated pod port (e.g. 18000). #}
      http-request set-var(txn.gw_redir_port) var(txn.gw_redir),field(4,|) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_port) str() if { var(txn.gw_redir_port) -m str L } { var(txn.gw_listener_port) -m int {{ httpPort }} } !{ ssl_fc }
      http-request set-var(txn.gw_redir_port) str() if { var(txn.gw_redir_port) -m str L } { var(txn.gw_listener_port) -m int {{ httpsPort }} } { ssl_fc }
      http-request set-var(txn.gw_redir_port) str(:),concat(,txn.gw_listener_port,) if { var(txn.gw_redir_port) -m str L }
      {# A stored pfxlen of "M" defers to the per-match lines of
         frontend-filters-495-gateway-prefix-length. #}
      http-request set-var(txn.gw_pfxlen) var(txn.gw_redir),field(6,|),add(0) if { var(txn.gw_redir),field(5,|) -m str P } !{ var(txn.gw_redir),field(6,|) -m str M }
      http-request set-var(txn.gw_redir_rest) path,bytes(txn.gw_pfxlen) if { var(txn.gw_redir),field(5,|) -m str P }
      {# A prefix of "/" strips nothing, so the whole path is the remainder — but
         the request path "/" must then yield the replacement itself, not
         "<replacement>/". #}
      http-request set-var(txn.gw_redir_rest) str() if { var(txn.gw_pfxlen) -m int 0 } { var(txn.gw_redir_rest) -m str / }
      http-request set-var(txn.gw_redir_path) path if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_path) var(txn.gw_redir),field(7,|),url_dec(1) if { var(txn.gw_redir),field(5,|) -m str F }
      http-request set-var(txn.gw_redir_path) var(txn.gw_redir),field(7,|),url_dec(1),concat(,txn.gw_redir_rest,) if { var(txn.gw_redir),field(5,|) -m str P }
      http-request set-var(txn.gw_redir_path) str(/) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_path) -m len 0 }
      {# The query the request arrived with, kept across the redirect: HAProxy's
         own `keep-query` does not exist on 3.0. #}
      http-request set-var(txn.gw_redir_query) pathq,regsub(^[^?]*,) if { var(txn.gw_redir) -m found }
      {%- if debug %}
      http-request set-var(txn.filters_applied) str(RequestRedirect) if { var(txn.gw_redir) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}
      {# The code must be a literal (HAProxy rejects an expression there), so every
         code Gateway API expresses gets one line — a fixed five, whatever the
         routes do. #}
      {%- for _, code := range []string{"301", "302", "303", "307", "308"} %}
      http-request redirect location "%[var(txn.gw_redir_scheme)]://%[var(txn.gw_redir_host)]%[var(txn.gw_redir_port)]%[var(txn.gw_redir_path)]%[var(txn.gw_redir_query)]" code {{ code }} if { var(txn.gw_redir),field(1,|) -m str {{ code }} }
      {%- end %}
      {%- var rwMap = tostring(gwm["urlrewritePath"]) %}
      # gateway/frontend-filters-gateway-urlrewrite
      http-request set-var(txn.gw_rw) var(txn.gw_rule_id),map({{ rwMap }}) if { var(txn.gw_rule_id),map({{ rwMap }}) -m found }
      http-request set-header Host %[var(txn.gw_rw),field(1,|),url_dec(1)] if { var(txn.gw_rw) -m found } !{ var(txn.gw_rw),field(1,|) -m len 0 }
      http-request set-var(txn.gw_pfxlen) var(txn.gw_rw),field(3,|),add(0) if { var(txn.gw_rw),field(2,|) -m str P } !{ var(txn.gw_rw),field(3,|) -m str M }
      http-request set-var(txn.gw_rw_rest) path,bytes(txn.gw_pfxlen) if { var(txn.gw_rw),field(2,|) -m str P }
      http-request set-var(txn.gw_rw_rest) str() if { var(txn.gw_pfxlen) -m int 0 } { var(txn.gw_rw_rest) -m str / }
      http-request set-var(txn.gw_rw_path) var(txn.gw_rw),field(4,|),url_dec(1) if { var(txn.gw_rw),field(2,|) -m str F }
      http-request set-var(txn.gw_rw_path) var(txn.gw_rw),field(4,|),url_dec(1),concat(,txn.gw_rw_rest,) if { var(txn.gw_rw),field(2,|) -m str P }
      http-request set-var(txn.gw_rw_path) str(/) if { var(txn.gw_rw) -m found } { var(txn.gw_rw_path) -m len 0 }
      http-request set-path %[var(txn.gw_rw_path)] if { var(txn.gw_rw_path) -m found }
      {%- if debug %}
      http-request set-var(txn.filters_applied) str(URLRewrite) if { var(txn.gw_rw) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}

  # Appends `scheme|host:port|timeout_ms|retries` entries to txn.gw_mirror_targets.
  # One static SPOE message + mirror-group carries the whole list — HAProxy runs a
  # group at most once per stream and the plugin (mirror v0.6.0+) fans out to every
  # entry — so spoe.conf never changes when routes do.
  # frontend-filters-950-spoa-hub-mirror-fire fires the group after the appends.
  frontend-filters-550-gateway-mirror:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var gwm = gwmVal.(map[string]any) %}
      {%- var m = tostring(gwm["mirrorPath"]) %}
      {%- var pctMap = tostring(gwm["mirrorPctPath"]) %}
      # gateway/frontend-filters-gateway-mirror
      http-request set-var(txn.gw_mirror_pct) var(txn.gw_rule_id),map_str_int({{ pctMap }}) if { var(txn.gw_rule_id),map_str_int({{ pctMap }}) -m found }
      {# rand(100) draws 0..99, so 100% always samples and 0% never does. #}
      http-request set-var(txn.gw_mirror_targets) var(txn.gw_rule_id),map({{ m }}),url_dec(1) if { var(txn.gw_rule_id),map({{ m }}) -m found } { rand(100),sub(txn.gw_mirror_pct) -m int lt 0 }
      {%- for _, fb := range gwm["mirrorFallback"] | toSlice() %}
      {%- var sampleCond = "" %}
      {%- if toint(fb | dig("pct")) < 100 %}{% sampleCond = " { rand(100) -m int lt " + tostring(toint(fb | dig("pct"))) + " }" %}{% end %}
      http-request set-var(txn.gw_mirror_targets) str({{ fb | dig("entry") }};),concat(,txn.gw_mirror_targets,) if { var(txn.gw_rule_id) -m str "{{ fb | dig("rid") }}" }{{ sampleCond }}
      {%- end %}
