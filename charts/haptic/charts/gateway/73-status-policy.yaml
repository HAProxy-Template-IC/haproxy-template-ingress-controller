templateSnippets:
  util-gateway-backendtlspolicy-status-bindings:
    template: |-
      {{- toJSON(map[string]any{"backendtlspolicies": map[string]any{
        "controllerName": extraContext | dig_string("haproxy.org/haptic", "controllerName"),
      }}) -}}

  gateway-backendtlspolicy-targets-100:
    requires: [backendtlspolicies]
    incremental:
      source: backendtlspolicies
      group: gateway-backendtlspolicy-targets
      effects: [publishValue]
    template: |-
      {%%
        var policyNamespace = dig_string(item, "", "metadata", "namespace")
        var policyName = dig_string(item, "", "metadata", "name")
        var policy = resources.backendtlspolicies.GetSingle(policyNamespace, policyName)
        if policy != nil {
          var policyKey = policyNamespace + "/" + policyName
          var creationTimestamp = policy.Metadata.CreationTimestamp
          for _, targetRef := range policy.Spec.TargetRefs {
            var cell = "target\x00" + targetRef.Group + "\x00" + targetRef.Kind +
              "\x00" + targetRef.Name + "\x00" + targetRef.SectionName
            show shared.Publish(cell, policyKey, map[string]any{
              "key": policyKey,
              "creationTimestamp": creationTimestamp,
            })
          }
        }
      %%}

  gateway-backendtlspolicy-route-ancestors-100:
    requires: [backendtlspolicies, httproutes]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: gateway-backendtlspolicy-route-ancestors
      effects: [publishValue]
    template: |-
      {%%
        var route = item
        var routeNamespace = dig_string(route, "", "metadata", "namespace")
        var routeName = dig_string(route, "", "metadata", "name")
        if route != nil {
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          var serviceNames = map[string]bool{}
          for _, rule := range toSlice(dig(route, "spec", "rules")) {
            for _, backendRef := range toSlice(dig(rule, "backendRefs")) {
            var backendKind = dig_string(backendRef, "", "kind")
            if backendKind == "" { backendKind = "Service" }
            if backendKind == "Service" {
              serviceNames[dig_string(backendRef, "", "name")] = true
            }
            }
          }
          for serviceName := range serviceNames {
            for parentIndex, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
              var parentGroup = dig_string(parentRef, "", "group")
              if parentGroup == "" { parentGroup = "gateway.networking.k8s.io" }
              var parentKind = dig_string(parentRef, "", "kind")
              if parentKind == "" { parentKind = "Gateway" }
              if parentGroup != "gateway.networking.k8s.io" || parentKind != "Gateway" {
                continue
              }
              var gatewayNamespace = dig_string(parentRef, "", "namespace")
              if gatewayNamespace == "" { gatewayNamespace = routeNamespace }
              var gatewayName = dig_string(parentRef, "", "name")
              var rank = routeNamespace + "/" + routeName + "\x00" + fixed(parentIndex)
              show shared.Publish("service\x00" + routeNamespace + "\x00" + serviceName,
                rank, map[string]any{
                  "rank": rank,
                  "key": "Gateway/" + gatewayNamespace + "/" + gatewayName,
                  "namespace": gatewayNamespace,
                  "name": gatewayName,
                  "namespaceSpecified": dig_string(parentRef, "", "namespace") != "",
                })
            }
          }
        }
      %%}

  util-generate-backendtlspolicy-status-patch:
    requires: [backendtlspolicies]
    template: |
      {%- import "util-condition-transition-time" for AncestorTransitionTime -%}
      {% macro GenerateBackendTLSPolicyStatusPatch(policy *resources.backendtlspolicies.T) %}
        {%%
          var policyNamespace = policy.Metadata.Namespace
          var policyName = policy.Metadata.Name
          var generation = policy.Metadata.Generation
          var controllerName = dig_string(props, "haproxy.org/haptic", "controllerName")

          var validation = policy.Spec.Validation
          var caRefs = validation.CaCertificateRefs
          var wellKnownCA = validation.WellKnownCACertificates
          var resolvedStatus = "True"
          var resolvedReason = "ResolvedRefs"
          var resolvedMessage = "All references resolved"
          var noValidCA = false
          var noValidCAMessage = ""
          if len(caRefs) > 0 {
            var hasValid = false
            var hasInvalidGroupKind = false
            for _, ref := range caRefs {
              if (ref.Group == "" || ref.Group == "core") && ref.Kind == "ConfigMap" {
                var configMap = resources.configmaps.GetSingle(policyNamespace, ref.Name)
                if configMap != nil && configMap.Data["ca.crt"] != "" {
                  hasValid = true
                }
              } else if (ref.Group == "" || ref.Group == "core") && ref.Kind == "Secret" {
                var secret = resources.secrets.GetSingle(policyNamespace, ref.Name)
                if secret != nil {
                  var caCertificate, caFound = secret.Data["ca.crt"]
                  var tlsCertificate, tlsFound = secret.Data["tls.crt"]
                  if (caFound && caCertificate != "") || (!caFound && tlsFound && tlsCertificate != "") {
                    hasValid = true
                  }
                }
              } else {
                hasInvalidGroupKind = true
              }
            }
            if !hasValid {
              resolvedStatus = "False"
              if hasInvalidGroupKind {
                resolvedReason = "InvalidKind"
                resolvedMessage = "CACertificateRef points at an unsupported group / kind"
              } else {
                resolvedReason = "InvalidCACertificateRef"
                resolvedMessage = "No CACertificateRef resolves to a valid CA certificate (missing or malformed)"
              }
              noValidCA = true
              noValidCAMessage = resolvedMessage
            }
          } else if wellKnownCA != "" {
            if wellKnownCA != "System" {
              resolvedStatus = "False"
              resolvedReason = "Invalid"
              resolvedMessage = "wellKnownCACertificates value " + wellKnownCA + " is not recognised"
            }
          } else {
            resolvedStatus = "False"
            resolvedReason = "InvalidCACertificateRef"
            resolvedMessage = "Validation must specify caCertificateRefs or wellKnownCACertificates"
            noValidCA = true
            noValidCAMessage = resolvedMessage
          }

          var acceptedStatus = "True"
          var acceptedReason = "Accepted"
          var acceptedMessage = "Policy accepted"
          var policyKey = policyNamespace + "/" + policyName
          var policyTimestamp = policy.Metadata.CreationTimestamp
          for _, targetRef := range policy.Spec.TargetRefs {
            var cell = "target\x00" + targetRef.Group + "\x00" + targetRef.Kind +
              "\x00" + targetRef.Name + "\x00" + targetRef.SectionName
            var competitors = shared.SelectValues("gateway-backendtlspolicy-targets", cell)
            for _, competitor := range competitors {
              var competitorKey = dig_string(competitor, "", "key")
              if competitorKey == policyKey {
                continue
              }
              var competitorTimestamp = dig_string(competitor, "", "creationTimestamp")
              var thisIsLoser = false
              if competitorTimestamp != "" && policyTimestamp != "" && competitorTimestamp < policyTimestamp {
                thisIsLoser = true
              } else if competitorTimestamp != "" && policyTimestamp != "" &&
                competitorTimestamp == policyTimestamp && competitorKey < policyKey {
                thisIsLoser = true
              } else if competitorTimestamp != "" && policyTimestamp == "" {
                thisIsLoser = true
              } else if competitorTimestamp == policyTimestamp && competitorKey < policyKey {
                thisIsLoser = true
              }
              if thisIsLoser {
                acceptedStatus = "False"
                acceptedReason = "Conflicted"
                acceptedMessage = "Another BackendTLSPolicy already targets " + targetRef.Kind + "/" +
                  targetRef.Name + "/" + targetRef.SectionName
                break
              }
            }
            if acceptedStatus == "False" {
              break
            }
          }
          if noValidCA && acceptedStatus == "True" {
            acceptedStatus = "False"
            acceptedReason = "NoValidCACertificate"
            acceptedMessage = noValidCAMessage
          }

          var ancestorSet = map[string]bool{}
          var ancestors = []any{}
          for _, targetRef := range policy.Spec.TargetRefs {
            if targetRef.Kind != "Service" {
              continue
            }
            var candidates = shared.SelectValues("gateway-backendtlspolicy-route-ancestors",
              "service\x00" + policyNamespace + "\x00" + targetRef.Name)
            candidates = sort_by(candidates, []string{"$.rank"})
            for _, candidate := range candidates {
              var ancestorKey = dig_string(candidate, "", "key")
              if ancestorSet[ancestorKey] {
                continue
              }
              ancestorSet[ancestorKey] = true
              var ancestorRef = map[string]any{
                "group": "gateway.networking.k8s.io",
                "kind": "Gateway",
                "name": dig_string(candidate, "", "name"),
              }
              if tostring(dig(candidate, "namespaceSpecified") | fallback(false)) == "true" {
                ancestorRef["namespace"] = dig_string(candidate, "", "namespace")
              }
              ancestors = append(ancestors, map[string]any{
                "ancestorRef": ancestorRef,
                "controllerName": controllerName,
                "conditions": []any{
                  condition("Accepted", acceptedStatus, acceptedReason, acceptedMessage, generation,
                    AncestorTransitionTime(policy, ancestorRef, controllerName, "Accepted", acceptedStatus)),
                  condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMessage, generation,
                    AncestorTransitionTime(policy, ancestorRef, controllerName, "ResolvedRefs", resolvedStatus)),
                },
              })
            }
          }
          if len(ancestors) == 0 {
            for _, targetRef := range policy.Spec.TargetRefs {
              var ancestorRef = map[string]any{
                "group": targetRef.Group,
                "kind": targetRef.Kind,
                "name": targetRef.Name,
                "namespace": policyNamespace,
              }
              ancestors = append(ancestors, map[string]any{
                "ancestorRef": ancestorRef,
                "controllerName": controllerName,
                "conditions": []any{
                  condition("Accepted", acceptedStatus, acceptedReason, acceptedMessage, generation,
                    AncestorTransitionTime(policy, ancestorRef, controllerName, "Accepted", acceptedStatus)),
                  condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMessage, generation,
                    AncestorTransitionTime(policy, ancestorRef, controllerName, "ResolvedRefs", resolvedStatus)),
                },
              })
            }
          }
          if len(ancestors) > 0 {
            statusPatch(policy, map[string]interface{}{
                "rendered": map[string]interface{}{"ancestors": ancestors},
              })
          }
        %%}
      {% end %}

  gateway-backendtlspolicy-status-100:
    requires: [backendtlspolicies, configmaps, secrets]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-backendtlspolicy-status-bindings" -}}'
      group: gateway-backendtlspolicy-status
      consumes:
        - gateway-backendtlspolicy-targets
        - gateway-backendtlspolicy-route-ancestors
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-backendtlspolicy-status-patch" for GenerateBackendTLSPolicyStatusPatch -%}
      {%- var policy = resources.backendtlspolicies.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if policy != nil -%}{{- GenerateBackendTLSPolicyStatusPatch(policy) -}}{%- end -%}

  status-patches-300-backendtlspolicy:
    requires: [backendtlspolicies, httproutes]
    template: |-
      {{- render "gateway-backendtlspolicy-targets-100" -}}
      {{- render "gateway-backendtlspolicy-route-ancestors-100" -}}
      {{- render "gateway-backendtlspolicy-status-100" -}}
