templateSnippets:
  # ============================================================================
  # Per-Gateway-listener crt-list emission
  #
  # Each Gateway HTTPS listener gets its OWN crt-list file. Phase 4
  # (per-Gateway HAProxy bind) references this file via `bind ... ssl
  # crt-list <per-listener-crt-list>`, so the bind-line SSL options
  # are scoped to one (Gateway, listener) — different Gateways on the
  # same logical port can have different `verify required` /
  # `verify optional` / `ca-ignore-err` configs without clobbering
  # each other.
  #
  # The chart-static `features-150-ssl-crtlist` continues to emit the
  # shared `certificate-list.txt` for the chart-static bind (Ingress
  # TLS, default cert). Per-Gateway crt-lists are ADDITIONAL files,
  # one per (Gateway, listener) tuple. The crt-list of a listener
  # whose mTLS CA refs failed to resolve is intentionally NOT emitted
  # — phase 4 sees the missing file and drops that listener's bind,
  # which is what the `GatewayFrontendInvalidDefaultClientCertificateValidation`
  # conformance contract requires (the listener doesn't accept
  # traffic).
  #
  # File naming: `gw-<gwNs>-<gwName>-<listenerName>.crt-list.txt`,
  # k8s-name-sanitised. Phase 4 derives the same path from the same
  # inputs.
  # ============================================================================

  util-gateway-listener-crtlist-name:
    template: >-
      {%- import "util-bounded-name" for BoundedName -%}
      {%- macro CrtlistName(gwNs string, gwName string, listenerName string) string %}
        {#- Single dot for the extension only: sanitizeStorageName (filters.go)
            turns interior dots into underscores, and a `crt-list:<name>` lookup
            must match what the registry stored. -#}
        {{- BoundedName("gw-" + gwNs + "-" + gwName + "-" + listenerName, 243) + "-crtlist.txt" -}}
      {%- end %}

  # One record per servable HTTPS listener, published per Gateway and replayed by
  # the crt-list and bind roots for unrelated changes (#226). A listener is
  # servable when its first certificateRef resolved for THIS Gateway (the
  # ReferenceGrant verdict is per Gateway) and its frontend validation is not
  # blocked; a listener whose tls.options would break the bind line is
  # published with the offending kind so the bind root can reject or warn.
  gateway-https-listeners-100-gateway:
    requires: [gateways, secrets]
    incremental:
      source: gateways
      group: gateway-https-listeners
      consumes: [gateway-tls-certificates, gateway-pod-port-allocations]
      optionalConsumes: [gateway-listener-mtls]
      effects: [publishValue]
    template: |-
      {%- import "util-gateway-listener-crtlist-name" for CrtlistName -%}
      {%- import "util-gateway-listener-tls-options" for TLSOptionsSuffix, TLSOptionsInjection -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil && namespace != "" && name != "" {
          var gatewayKey = namespace + "/" + name
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          for listenerIndex, listener := range gateway.Spec.Listeners {
            var listenerPort = toint(listener.Port)
            if listener.Protocol != "HTTPS" || listener.Name == "" || listenerPort <= 0 {
              continue
            }
            var _, blocked = shared.Select("gateway-listener-mtls", "blocked", gatewayKey + "/" + listener.Name)
            if blocked { continue }
            var resolved, found = shared.Select("gateway-tls-certificates", "resolved",
              gatewayKey + "/" + tostring(listenerIndex) + "/0")
            if !found { continue }
            var podPort = listenerPort
            var allocated, allocatedFound = shared.Select("gateway-pod-port-allocations", "ports",
              gatewayKey + ":" + listener.Name + ":" + tostring(listenerPort))
            if allocatedFound { podPort = toint(allocated) }
            var mtls, _ = shared.Select("gateway-listener-mtls", "listeners", gatewayKey + "/" + fixed(listenerIndex))
            var ignoreErr = ""
            if mtls != nil {
              mtls = map[string]any{
                "ca_path": dig_string(mtls, "", "ca_path"), "verify_mode": dig_string(mtls, "", "verify_mode"),
              }
              // AllowInsecureFallback: complete the handshake even when the client
              // certificate fails validation; bind-scope, so one listener only.
              if dig_string(mtls, "", "verify_mode") == "optional" {
                ignoreErr = " ca-ignore-err all crt-ignore-err all"
              }
            }
            show shared.Publish("listeners", gatewayKey + "/" + fixed(listenerIndex), map[string]any{
              "gateway": map[string]any{
                "apiVersion": dig_string(gateway, "", "apiVersion"),
                "kind": dig_string(gateway, "", "kind"),
                "metadata": map[string]any{"namespace": namespace, "name": name},
              },
              "gatewayNamespace": namespace,
              "gatewayName": name,
              "listenerName": listener.Name,
              "hostname": listener.Hostname,
              "certKey": dig_string(resolved, "", "secret_namespace") + "/" + dig_string(resolved, "", "secret_name"),
              "crtlist": CrtlistName(namespace, name, listener.Name),
              "mtls": mtls,
              "podPort": podPort,
              "ignoreErr": ignoreErr,
              "tlsSuffix": TLSOptionsSuffix(listener),
              "injection": TLSOptionsInjection(listener),
            })
          }
        }
      %%}

  features-160-gateway-crtlist-per-listener:
    requires: [gateways]
    template: |
      {# One crt-list file per (Gateway, HTTPS listener), so bind-line SSL options
          stay scoped to that listener. `ca-ignore-err` / `crt-ignore-err` are
          bind-scope keywords and belong to the bind root, not to the crt-list. #}
      {%- import "util-crtlist-line" for CrtListLine %}
      {{ render "util-tls-cert-by-secret" -}}
      {{- render "gateway-listener-mtls-100-gateway" default "" -}}
      {{- render "gateway-https-listeners-100-gateway" -}}
      {%- var certBySecret = shared.Get("tlsCertBySecret").(map[string]any) %}
      {%- for _, entry := range incremental_values("gateway-https-listeners", "listeners") %}
        {%%
          var certKey = dig_string(entry, "", "certKey")
          var registered = certBySecret[certKey]
          if registered != nil {
            var tcm = registered.(map[string]any)
            var certFilename = tostring(tcm["sanitized_filename"] | fallback(replace(certKey, "/", "_") + ".pem"))
            var content = CrtListLine(certFilename, dig(entry, "mtls"), dig_string(entry, "", "hostname")) + "\n"
            var fname = dig_string(entry, "", "crtlist")
            var _, regErr = fileRegistry.Register("crt-list", fname, content)
            if regErr != nil {
              fail("failed to register per-listener crt-list " + fname + ": " + tostring(regErr))
            }
          }
        %%}
      {%- end %}
