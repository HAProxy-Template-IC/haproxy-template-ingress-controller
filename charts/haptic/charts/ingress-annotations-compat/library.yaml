# Ingress-only macros shared by the three vendor annotation libraries
# (haproxytech, haproxy-ingress, nginx-ingress). Loaded at level 2.5 — after
# ingress/gateway, before those libraries. A vendor library for a non-Ingress
# CRD writes its own. See docs/adr/0003-annotation-compat-scaffold-level-2-5.md

_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}'

templateSnippets:

  util-webhook-reject-or-warn:
    template: |-
      {#
        CALLER CONTRACT: the warn path returns and the render CONTINUES, so the
        caller MUST skip the offending resource's own output right after calling
        this ({% continue %} in a per-resource loop, or stop emitting in a macro)
        — otherwise it emits config built from the value it just rejected.
      #}
      {%- macro WebhookRejectOrWarn(resource any, reason string, message string) -%}
        {%- if renderMode == "admission" -%}
          {{- fail(message) -}}
        {%- else -%}
          {{- recordEvent(resource, reason, message) -}}
        {%- end -%}
      {%- end macro -%}

  util-build-annotation-ssl-passthrough:
    template: |
      {#
        Service info is captured during this scan instead of being re-fetched by
        the consumer: a second GetSingle() could disagree with the use_backend
        pass under concurrent Ingress deletion. The backend entry shape must stay
        identical across the libraries that read sslData["backends"].
      #}
      {%- import "util-service-port-resolution" for ResolveServicePort %}
      {%- macro BuildAnnotationSSLPassthrough(sslData map[string]any, annotationKey string, namePrefix string, firstSeenKey string) %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- var passthrough = ingress.Metadata.Annotations[annotationKey] %}
          {%- if passthrough == "true" %}
            {%- var ns = ingress.Metadata.Namespace %}
            {%- var name = ingress.Metadata.Name %}
            {#- Passthrough routes by SNI, not by path, so the first usable
                path's service serves every host on this ingress. -#}
            {%- var svcName = "" %}
            {%- var svcPort = 0 %}
            {%- var svcPortName = "" %}
            {%- for _, path := range ingress.Spec.Rules[*].Http.Paths %}
              {%- var n = path.Backend.Service.Name %}
              {%- if n != "" %}
                {%- var resolvedParts = split(ResolveServicePort(tostring(ns), n, path.Backend.Service.Port), " ") %}
                {%- svcName = n %}
                {%- svcPort = toint(resolvedParts[0]) %}
                {%- svcPortName = resolvedParts[1] %}
                {%- break %}
              {%- end %}
            {%- end %}
            {%- if svcName != "" %}
              {%- for _, rule := range ingress.Spec.Rules %}
                {%- if rule.Host != "" && first_seen(firstSeenKey, rule.Host) %}
                  {%- sslData["backends"] = append(sslData["backends"].([]any), map[string]any{
                    "name": namePrefix + ns + "-" + name,
                    "sni": rule.Host, "namespace": ns, "ingress": name,
                    "svcName": svcName, "svcPort": svcPort, "svcPortName": svcPortName,
                  }) %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-render-annotation-ssl-passthrough-backends:
    template: |
      {%- import "util-backend-servers" for BackendServers -%}
      {%- macro RenderAnnotationSSLPassthroughBackends(cacheKey string, firstSeenKey string, commentLabel string) %}
        {%- var rawVal, _ = shared.ComputeIfAbsent(cacheKey, func() any { return nil }) %}
        {%- if rawVal == nil %}{% return %}{% end %}
        {%- var sslData = rawVal.(map[string]any) %}
        {%- var backends = sslData["backends"].([]any) %}
        {%- for _, backendInfo := range backends %}
          {%- var info = backendInfo.(map[string]any) %}
          {%- var beNs = info["namespace"] | tostring() %}
          {%- var beIngress = info["ingress"] | tostring() %}
          {%- var beName = info["name"] | tostring() %}
          {%- var svcName = info["svcName"] | tostring() %}
          {%- var svcPort = info["svcPort"] | toint() %}
          {%- var svcPortName = info["svcPortName"] | fallback("") | tostring() %}
          {%- if first_seen(firstSeenKey, beNs + "/" + beIngress) %}
      # {{ commentLabel }}/backends-ssl-passthrough

      backend {{ beName }}
          mode tcp
          {{ BackendServers(svcName, 10, svcPort, nil, svcPortName, beName, beNs) | indent(4) }}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-register-annotation-hsts:
    template: |
      {#
        Registers each host's Strict-Transport-Security value into
        gf["hstsHosts"]; base.yaml's features-190-hsts-map and
        frontend-filters-080-hsts turn it into one map-driven response-header
        rule, so changing a value stays a reload-free map update.
      #}
      {%- macro RegisterAnnotationHSTS(ingress *resources.ingresses.T, enabledAnn string, maxAgeAnn string, subdomainsAnn string, preloadAnn string, defaultMaxAge string) %}
        {%- if ingress.Metadata.Annotations[enabledAnn] == "true" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- var maxAge = ingress.Metadata.Annotations[maxAgeAnn] %}
          {%- if maxAge == "" %}{%- maxAge = defaultMaxAge %}{%- end %}
          {%- if regex_search(maxAge, "[[:cntrl:]]") %}{{ fail("Invalid value for annotation '" + maxAgeAnn + "' on Ingress '" + key + "': must not contain control characters — config-injection guard.") }}{%- end %}
          {%- var hstsValue = "max-age=" + maxAge %}
          {%- if ingress.Metadata.Annotations[subdomainsAnn] == "true" %}{%- hstsValue = hstsValue + "; includeSubDomains" %}{%- end %}
          {%- if ingress.Metadata.Annotations[preloadAnn] == "true" %}{%- hstsValue = hstsValue + "; preload" %}{%- end %}
          {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {%- var hh []any = coalesce(gf["hstsHosts"], []any{}) %}
              {%- gf["hstsHosts"] = append(hh, map[string]any{"host": toLower(rule.Host), "value": hstsValue}) %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-cors:
    template: |
      {#
        Mirrors ingress-nginx: cors-allow-origin is a comma-separated allow-list
        (single-level "*." wildcards allowed) matched against the request Origin;
        a lone "*" or unset allows any origin. haproxytech CORS is structurally
        different and lives in haproxytech's own library — it does NOT call this.
      #}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationCORS(ingress *resources.ingresses.T, prefix string, enabledAnn string, defaultMaxAge string, commentLabel string) %}
        {%- var corsEnabled = ingress.Metadata.Annotations[enabledAnn] %}
        {%- if corsEnabled == "true" %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var ns = ingress.Metadata.Namespace %}
            {%- var name = ingress.Metadata.Name %}
            {%- var key = ns + "/" + name %}
            {%- var rawOrigin = ingress.Metadata.Annotations[prefix + "/cors-allow-origin"] %}
            {%- if rawOrigin == "" %}{%- rawOrigin = "*" %}{%- end %}
            {%- var methods = ingress.Metadata.Annotations[prefix + "/cors-allow-methods"] %}
            {%- if methods == "" %}{%- methods = "GET, PUT, POST, DELETE, PATCH, OPTIONS" %}{%- end %}
            {%- var headers = ingress.Metadata.Annotations[prefix + "/cors-allow-headers"] %}
            {%- if headers == "" %}{%- headers = "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" %}{%- end %}
            {%- var credentials = ingress.Metadata.Annotations[prefix + "/cors-allow-credentials"] %}
            {%- var exposeHeaders = ingress.Metadata.Annotations[prefix + "/cors-expose-headers"] %}
            {%- var maxAge = ingress.Metadata.Annotations[prefix + "/cors-max-age"] %}
            {%- if maxAge == "" %}{%- maxAge = defaultMaxAge %}{%- end %}
            {%- var cond = HostMatchCondition(hosts) %}
            {%- var allowAny = false %}
            {%- var exact = []string{} %}
            {%- var regexes = []string{} %}
            {%- for _, tok := range split(rawOrigin, ",") %}
              {%- var o = strip(tok) %}
              {%- if o == "" %}{%- continue %}{%- end %}
              {%- if o == "*" %}{%- allowAny = true %}{%- break %}{%- end %}
              {%- if !regex_search(o, "^([a-z]+://(\\*\\.)?[A-Za-z0-9\\-.]*(:[0-9]+)?|null)$") %}
                {{- fail("Invalid CORS origin '" + o + "' in annotation '" + prefix + "/cors-allow-origin' on Ingress '" + key + "' — must be scheme://host[:port], scheme://*.host[:port], null, or *.") -}}
              {%- end %}
              {%- if strings_contains(o, "*") %}
                {%- regexes = append(regexes, "^" + replace(sanitize_regex(o), "\\*", "[A-Za-z0-9\\-]+") + "$") %}
              {%- else %}
                {%- exact = append(exact, o) %}
              {%- end %}
            {%- end %}
            {%- var aclName = "cors_origin_" + replace(replace(prefix, ".", "_"), "/", "_") + "_" + ns + "_" + name %}
            {%- var originHdr = "%[var(txn.cors_origin)]" %}
            {%- if allowAny %}{%- originHdr = "*" %}{%- end %}
      # {{ commentLabel }} ({{ key }})
      {# CORS headers ride on http-after-response so they also cover the
          synthetic preflight 204; http-response is dropped for a return. #}
      http-request set-var(txn.cors_origin) req.hdr(Origin) if {{ cond }}
            {%- if allowAny %}
      acl {{ aclName }} var(txn.cors_origin) -m found
            {%- else %}
              {%- for i := 0; i < len(exact); i += 20 %}
                {%- var hi = i + 20 %}{%- if hi > len(exact) %}{%- hi = len(exact) %}{%- end %}
      acl {{ aclName }} var(txn.cors_origin) -m str {{ join(exact[i:hi], " ") }}
              {%- end %}
              {%- for i := 0; i < len(regexes); i += 20 %}
                {%- var hi = i + 20 %}{%- if hi > len(regexes) %}{%- hi = len(regexes) %}{%- end %}
      acl {{ aclName }} var(txn.cors_origin) -m reg {{ join(regexes[i:hi], " ") }}
              {%- end %}
            {%- end %}
      http-after-response set-header Access-Control-Allow-Origin '{{ originHdr }}' if {{ cond }} {{ aclName }}
      http-after-response set-header Access-Control-Allow-Methods '{{ methods }}' if {{ cond }} {{ aclName }}
      http-after-response set-header Access-Control-Allow-Headers '{{ headers }}' if {{ cond }} {{ aclName }}
      http-after-response set-header Access-Control-Max-Age '{{ maxAge }}' if {{ cond }} {{ aclName }}
            {%- if credentials == "true" %}
      http-after-response set-header Access-Control-Allow-Credentials 'true' if {{ cond }} {{ aclName }}
            {%- end %}
            {%- if exposeHeaders != "" %}
      http-after-response set-header Access-Control-Expose-Headers '{{ exposeHeaders }}' if {{ cond }} {{ aclName }}
            {%- end %}
            {%- if !allowAny %}
      {# add-header, never set-header: Vary is a comma-combinable list per RFC 9110
          and several producers contribute to it. set-header replaced the whole
          field, destroying both the origin's own Vary and the one the cache tier
          adds to declare its key — so a CDN in front of HAPTIC keyed on Origin
          alone and served one caller's keyed body to another. #}
      http-after-response add-header Vary Origin if {{ cond }} {{ aclName }}
            {%- end %}
      http-request return status 204 if {{ cond }} {{ aclName }} METH_OPTIONS { req.hdr(Access-Control-Request-Method) -m found }
          {%- end %}
        {%- end %}
      {%- end macro %}

  # aclPrefix must stay distinct per library — validation tests assert on the
  # resulting ACL names.
  util-emit-annotation-access-control:
    template: |
      {%- import "util-ingress-helpers" for ResourceMatchCondition %}
      {%- import "util-validate-cidr-list" for ValidateCidrList %}
      {#- Scoped by matched route, not by Host header. A wildcard rule host never
          equals a concrete request host and a host-less rule has nothing to
          match, so the previous exact host gate dropped the deny entirely and
          served the route to every source address. -#}
      {%- macro EmitAnnotationAccessControl(ingress *resources.ingresses.T, allowAnnotation string, denyAnnotation string, aclPrefix string, allowCommentFmt string, denyCommentFmt string) %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var cond = ResourceMatchCondition([]string{key}) %}
        {%- var allowlist = ingress.Metadata.Annotations[allowAnnotation] %}
        {%- var denylist = ingress.Metadata.Annotations[denyAnnotation] %}
        {%- if allowlist != "" %}
          {%- var aclName = aclPrefix + "_allowlist_" + ns + "_" + name %}
      # {{ replace(allowCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src {{ ValidateCidrList(allowlist, allowAnnotation, key) }}

      http-request deny if {{ cond }} !{{ aclName }}
        {%- end %}
        {%- if denylist != "" %}
          {%- var aclName = aclPrefix + "_denylist_" + ns + "_" + name %}
      # {{ replace(denyCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src {{ ValidateCidrList(denylist, denyAnnotation, key) }}

      http-request deny if {{ cond }} {{ aclName }}
        {%- end %}
      {%- end macro %}

  # Every comma-separated CIDR annotation interpolated into an HAProxy `src` ACL
  # MUST go through ValidateCidrList: a value carrying a newline would smuggle a
  # second directive into the config and still pass `haproxy -c`.
  util-validate-cidr-list:
    template: |
      {# Charset guard only: malformed-but-clean values (999.0.0.0/8) are left
          for `haproxy -c` to reject. #}
      {%- macro ValidateCidrList(rawList string, annotation string, key string) %}
        {%- var out = []string{} %}
        {%- for _, c := range split(rawList, ",") %}
          {%- var t = trimSpace(c) %}
          {%- if t != "" %}
            {%- if !regex_search(t, "^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^[0-9a-fA-F:]+(/[0-9]{1,3})?$") %}
              {{- fail("Invalid CIDR/IP '" + t + "' in annotation '" + annotation + "' on Ingress '" + key + "'. Only comma-separated IPv4/IPv6 addresses or CIDR ranges are permitted (config-injection guard).") -}}
            {%- end %}
            {%- out = append(out, t) %}
          {%- end %}
        {%- end %}
        {{- join(out, " ") -}}
      {%- end macro %}

  # A control character in an interpolated annotation value would split the
  # config line and smuggle a second directive past `haproxy -c`.
  util-validate-config-value:
    template: |
      {%- macro ValidateConfigValue(value string, annotation string, key string, allowSpaces bool) %}
        {%- if regex_search(value, "[[:cntrl:]]") %}
          {{- fail("Invalid value for annotation '" + annotation + "' on Ingress '" + key + "': must not contain control characters (newlines/tabs) — config-injection guard.") -}}
        {%- end %}
        {%- if !allowSpaces && strings_contains(value, " ") %}
          {{- fail("Invalid value for annotation '" + annotation + "' on Ingress '" + key + "': must not contain spaces.") -}}
        {%- end %}
        {{- value -}}
      {%- end macro %}

  # One macro owns the "is WAF governance active, and what may an Ingress author
  # do" verdict, so the compat shims cannot drift from the native policy engine.
  util-waf-governance:
    template: |
      {%- macro WafGovernance(gov map[string]any) %}
      {%%
        var resolvedAny, _ = shared.ComputeIfAbsent("wafGovernance", func() any {
          var wafAny = extraContext | dig("waf")
          if wafAny == nil { wafAny = map[string]any{} }
          var waf, wafOK = wafAny.(map[string]any)
          if !wafOK { fail("extraContext.waf must be a map.") }
          var policiesAny = waf | dig("policies")
          if policiesAny == nil { policiesAny = map[string]any{} }
          var policies, policiesOK = policiesAny.(map[string]any)
          if !policiesOK { fail("extraContext.waf.policies must be a map.") }
          var inlinePoliciesAny = policies | dig("inline")
          if inlinePoliciesAny == nil { inlinePoliciesAny = map[string]any{} }
          var inlinePolicies, inlinePoliciesOK = inlinePoliciesAny.(map[string]any)
          if !inlinePoliciesOK { fail("extraContext.waf.policies.inline must be a map.") }
          var policyRefsAny = policies | dig("configMapRefs")
          if policyRefsAny == nil { policyRefsAny = map[string]any{} }
          var policyRefs, policyRefsOK = policyRefsAny.(map[string]any)
          if !policyRefsOK { fail("extraContext.waf.policies.configMapRefs must be a map.") }
          var selfServiceAny = policies | dig("selfService")
          if selfServiceAny == nil { selfServiceAny = map[string]any{} }
          var selfService, selfServiceOK = selfServiceAny.(map[string]any)
          if !selfServiceOK { fail("extraContext.waf.policies.selfService must be a map.") }
          for _, field := range keys(selfService) {
            if field != "enabled" && field != "configMapName" && field != "key" && field != "allowSecLang" && field != "limits" {
              fail("extraContext.waf.policies.selfService contains unknown field '" + field + "'. Valid fields: enabled, configMapName, key, allowSecLang, limits.")
            }
          }
          var selfServiceEnabled = false
          if selfService["enabled"] != nil {
            var selfServiceEnabledOK = false
            selfServiceEnabled, selfServiceEnabledOK = selfService["enabled"].(bool)
            if !selfServiceEnabledOK { fail("extraContext.waf.policies.selfService.enabled must be a boolean.") }
          }
          var selfServiceConfigMapName = selfService | dig("configMapName") | fallback("waf-policies") | tostring()
          if !regex_search(selfServiceConfigMapName, "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$") {
            fail("extraContext.waf.policies.selfService.configMapName '" + selfServiceConfigMapName + "' is not a valid ConfigMap name.")
          }
          var selfServiceKey = selfService | dig("key") | fallback("policies.yaml") | tostring()
          if !regex_search(selfServiceKey, "^[-._A-Za-z0-9]+$") {
            fail("extraContext.waf.policies.selfService.key '" + selfServiceKey + "' is not a valid ConfigMap data key.")
          }
          var selfServiceAllowSecLang = false
          if selfService["allowSecLang"] != nil {
            var selfServiceAllowSecLangOK = false
            selfServiceAllowSecLang, selfServiceAllowSecLangOK = selfService["allowSecLang"].(bool)
            if !selfServiceAllowSecLangOK { fail("extraContext.waf.policies.selfService.allowSecLang must be a boolean.") }
          }
          var selfServiceLimitsAny = selfService | dig("limits")
          if selfServiceLimitsAny == nil { selfServiceLimitsAny = map[string]any{} }
          var selfServiceLimits, selfServiceLimitsOK = selfServiceLimitsAny.(map[string]any)
          if !selfServiceLimitsOK { fail("extraContext.waf.policies.selfService.limits must be a map.") }
          for _, field := range keys(selfServiceLimits) {
            if field != "maxPoliciesPerNamespace" && field != "maxTotalPolicies" {
              fail("extraContext.waf.policies.selfService.limits contains unknown field '" + field + "'. Valid fields: maxPoliciesPerNamespace, maxTotalPolicies.")
            }
          }
          var defaultPolicy = policies | dig("defaultPolicy") | fallback("") | tostring()
          var dispatchMode = waf | dig("dispatch", "mode") | fallback("opt-in") | tostring()
          var policyCatalogConfigured = len(inlinePolicies) > 0 || len(policyRefs) > 0 || defaultPolicy != ""
          // Permissions bind only once an admin owns a WAF baseline; plain
          // opt-in mode keeps upstream compatibility behavior.
          var governanceEnabled = policyCatalogConfigured || dispatchMode == "default-on" || selfServiceEnabled

          var ingressPermissionsAny = waf | dig("ingressPermissions")
          if ingressPermissionsAny == nil { ingressPermissionsAny = map[string]any{} }
          var ingressPermissions, ingressPermissionsOK = ingressPermissionsAny.(map[string]any)
          if !ingressPermissionsOK { fail("extraContext.waf.ingressPermissions must be a map.") }
          var allowedPermissionFields = map[string]bool{
            "allowPolicySelection": true, "allowEnforcementOverride": true,
            "allowWafDisable": true, "allowCustomRules": true,
            "allowRawHAProxyConfig": true,
          }
          for _, field := range keys(ingressPermissions) {
            if !allowedPermissionFields[field] {
              fail("extraContext.waf.ingressPermissions contains unknown field '" + field + "'.")
            }
            var _, fieldOK = ingressPermissions[field].(bool)
            if !fieldOK { fail("extraContext.waf.ingressPermissions." + field + " must be a boolean.") }
          }
          var permission = func(field string, governedDefault bool) bool {
            if !governanceEnabled { return true }
            // fallback() would treat an explicit false as absent and flip a
            // denial back to the permissive default.
            var valueAny, isSet = ingressPermissions[field]
            if isSet { return valueAny.(bool) }
            return governedDefault
          }
          var allowPolicySelection = permission("allowPolicySelection", true)
          if governanceEnabled && policyCatalogConfigured && !allowPolicySelection && defaultPolicy == "" {
            fail("extraContext.waf.policies.defaultPolicy is required when extraContext.waf.ingressPermissions.allowPolicySelection=false.")
          }

          var customRuleLimitsAny = waf | dig("customRules", "limits")
          if customRuleLimitsAny == nil { customRuleLimitsAny = map[string]any{} }
          var customRuleLimits, customRuleLimitsOK = customRuleLimitsAny.(map[string]any)
          if !customRuleLimitsOK { fail("extraContext.waf.customRules.limits must be a map.") }
          var boundedInteger = func(input any, defaultValue int, field string, minimum int, maximum int) int {
            if input == nil { return defaultValue }
            var text = tostring(input)
            if !regex_search(text, "^[0-9]+$") {
              fail(field + " must be an integer between " + tostring(minimum) + " and " + tostring(maximum) + ".")
            }
            var value = toint(text)
            if value < minimum || value > maximum {
              fail(field + " must be between " + tostring(minimum) + " and " + tostring(maximum) + ".")
            }
            return value
          }

          return map[string]any{
            "governanceEnabled": governanceEnabled,
            "policyCatalogConfigured": policyCatalogConfigured,
            "defaultPolicy": defaultPolicy,
            "dispatchMode": dispatchMode,
            "allowPolicySelection": allowPolicySelection,
            "allowEnforcementOverride": permission("allowEnforcementOverride", false),
            "allowWafDisable": permission("allowWafDisable", false),
            "allowCustomRules": permission("allowCustomRules", false),
            "allowRawHAProxyConfig": permission("allowRawHAProxyConfig", false),
            "maxCustomRuleIngresses": boundedInteger(customRuleLimits["maxIngresses"], 32, "extraContext.waf.customRules.limits.maxIngresses", 1, 1024),
            "maxCustomRuleBytesPerIngress": boundedInteger(customRuleLimits["maxBytesPerIngress"], 16384, "extraContext.waf.customRules.limits.maxBytesPerIngress", 1, 1048576),
            "selfServiceEnabled": selfServiceEnabled,
            "selfServiceConfigMapName": selfServiceConfigMapName,
            "selfServiceKey": selfServiceKey,
            "selfServiceAllowSecLang": selfServiceAllowSecLang,
            "selfServiceMaxPoliciesPerNamespace": boundedInteger(selfServiceLimits["maxPoliciesPerNamespace"], 4, "extraContext.waf.policies.selfService.limits.maxPoliciesPerNamespace", 1, 64),
            "selfServiceMaxTotalPolicies": boundedInteger(selfServiceLimits["maxTotalPolicies"], 64, "extraContext.waf.policies.selfService.limits.maxTotalPolicies", 1, 1024),
          }
        })
        var resolved = resolvedAny.(map[string]any)
        for _, key := range keys(resolved) {
          gov[key] = resolved[key]
        }
      %%}
      {%- end macro %}

  # Rejects an Ingress that configures the SAME feature through two annotation
  # families: the effective result would be order-dependent. Keyed by canonical
  # feature/parameter, so distinct features (and distinct timeouts) across
  # families stay legal. extraContext.annotationLibraries is injected by
  # templates/haproxytemplateconfig.yaml from controller.templateLibraries.*.enabled.
  features-950-annotation-family-feature-conflict:
    template: |-
      {%%
        var familyPrefix = map[string]string{
          "haptic":         "haproxy-haptic.org/",
          "haproxyIngress": "haproxy-ingress.github.io/",
          "haproxytech":    "haproxy.org/",
          "nginx":          "nginx.ingress.kubernetes.io/",
        }
        // Deterministic iteration order → stable fail() messages.
        var familyOrder = []string{"haptic", "haproxyIngress", "haproxytech", "nginx"}

        // Canonical feature/parameter → family → annotation-key suffixes. A key
        // listed under a family that doesn't use it is harmless; a key filed
        // under the wrong feature is not.
        var registry = []map[string]any{
          {"name": "WAF", "families": map[string][]string{
            "haptic":         {"waf-mode", "waf-policy"},
            "haproxyIngress": {"waf", "waf-mode"},
            "nginx":          {"enable-modsecurity", "modsecurity-snippet"},
          }},
          {"name": "external authentication", "families": map[string][]string{
            "haptic":         {"auth-url", "auth-signin", "auth-method", "auth-headers-request", "auth-headers-succeed", "auth-headers-fail", "oauth", "oauth-uri-prefix", "oauth-headers"},
            "haproxyIngress": {"auth-url", "auth-signin", "auth-method", "auth-headers-request", "auth-headers-succeed", "auth-headers-fail", "oauth", "oauth-uri-prefix", "oauth-headers"},
            "nginx":          {"auth-url", "auth-signin", "auth-method", "auth-response-headers"},
          }},
          {"name": "basic authentication", "families": map[string][]string{
            "haptic":         {"auth-type", "auth-secret", "auth-secret-type", "auth-realm", "satisfy"},
            "haproxyIngress": {"auth-secret", "auth-realm"},
            "haproxytech":    {"auth-type", "auth-secret", "auth-realm"},
            "nginx":          {"auth-type", "auth-secret", "auth-secret-type", "auth-realm", "satisfy"},
          }},
          {"name": "client-certificate (mTLS) authentication", "families": map[string][]string{
            "haptic":         {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-cert-header"},
            "haproxyIngress": {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-cert-header", "auth-tls-strict"},
            "nginx":          {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-pass-certificate-to-upstream", "auth-tls-verify-depth"},
          }},
          {"name": "CORS", "families": map[string][]string{
            "haptic":         {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
            "haproxyIngress": {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
            "haproxytech":    {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-max-age", "cors-respond-to-options"},
            "nginx":          {"enable-cors", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
          }},
          {"name": "shared rate limiting", "families": map[string][]string{
            "haptic":         {"rate-limit-requests", "rate-limit-rps", "rate-limit-rpm", "rate-limit-connections", "rate-limit-period", "rate-limit-size", "rate-limit-status-code", "rate-limit-allowlist", "rate-limit-burst", "rate-limit-algorithm", "rate-limit-key", "download-bandwidth-limit", "upload-bandwidth-limit", "bandwidth-limit-scope"},
            "haproxyIngress": {"limit-rps", "limit-rpm", "limit-connections", "limit-whitelist"},
            "haproxytech":    {"rate-limit-requests", "rate-limit-period", "rate-limit-size", "rate-limit-status-code", "rate-limit-whitelist"},
            "nginx":          {"limit-rps", "limit-rpm", "limit-connections", "limit-whitelist", "limit-rate", "limit-rate-after"},
          }},
          {"name": "HTTPS redirect", "families": map[string][]string{
            "haptic":         {"https-redirect", "https-redirect-code", "https-redirect-port"},
            "haproxyIngress": {"ssl-redirect", "ssl-redirect-code"},
            "haproxytech":    {"ssl-redirect", "ssl-redirect-code", "ssl-redirect-port"},
            "nginx":          {"ssl-redirect", "force-ssl-redirect"},
          }},
          {"name": "backend protocol", "families": map[string][]string{
            "haptic":         {"backend-protocol"},
            "haproxyIngress": {"backend-protocol"},
            "haproxytech":    {"server-proto"},
            "nginx":          {"backend-protocol"},
          }},
          {"name": "request body size limit", "families": map[string][]string{
            "haptic":         {"max-request-body-size"},
            "haproxyIngress": {"proxy-body-size"},
            "nginx":          {"proxy-body-size"},
          }},
          {"name": "source-IP allowlist", "families": map[string][]string{
            "haptic":         {"allowlist-source-range"},
            "haproxyIngress": {"allowlist-source-range", "whitelist-source-range"},
            "haproxytech":    {"allow-list", "whitelist"},
            "nginx":          {"whitelist-source-range"},
          }},
          {"name": "source-IP denylist", "families": map[string][]string{
            "haptic":         {"denylist-source-range"},
            "haproxyIngress": {"denylist-source-range"},
            "haproxytech":    {"deny-list", "blacklist"},
            "nginx":          {"denylist-source-range"},
          }},
          {"name": "canary traffic splitting", "families": map[string][]string{
            "haptic": {"canary", "canary-by-cookie", "canary-by-header", "canary-by-header-pattern", "canary-by-header-value", "canary-weight"},
            "nginx":  {"canary", "canary-by-header", "canary-by-header-value", "canary-by-header-pattern", "canary-by-cookie", "canary-weight", "canary-weight-total"},
          }},
          {"name": "session affinity", "families": map[string][]string{
            "haptic":         {"affinity", "session-cookie-name", "session-cookie-domain", "session-cookie-dynamic", "session-cookie-keywords", "session-cookie-max-age", "session-cookie-path", "session-cookie-preserve", "session-cookie-samesite", "session-cookie-secure", "session-cookie-strategy"},
            "haproxyIngress": {"affinity", "session-cookie-name", "session-cookie-strategy", "session-cookie-dynamic", "session-cookie-keywords", "session-cookie-domain", "session-cookie-same-site", "session-cookie-preserve"},
            "haproxytech":    {"cookie-persistence", "cookie-persistence-no-dynamic"},
            "nginx":          {"affinity", "session-cookie-name", "session-cookie-path", "session-cookie-domain", "session-cookie-secure", "session-cookie-samesite", "session-cookie-max-age", "session-cookie-expires", "session-cookie-hash"},
          }},
          {"name": "Host header rewrite", "families": map[string][]string{
            "haptic":      {"set-host"},
            "haproxytech": {"set-host"},
            "nginx":       {"upstream-vhost"},
          }},
          // One entry per timeout parameter: only the same timeout from two
          // families collides.
          {"name": "connect timeout", "families": map[string][]string{
            "haptic":         {"timeout-connect"},
            "haproxyIngress": {"timeout-connect"},
            "haproxytech":    {"timeout-connect"},
            "nginx":          {"proxy-connect-timeout"},
          }},
          {"name": "server (read) timeout", "families": map[string][]string{
            "haptic":         {"timeout-server"},
            "haproxyIngress": {"timeout-server"},
            "haproxytech":    {"timeout-server"},
            "nginx":          {"proxy-read-timeout"},
          }},
          {"name": "queue timeout", "families": map[string][]string{
            "haptic":         {"timeout-queue"},
            "haproxyIngress": {"timeout-queue"},
            "haproxytech":    {"timeout-queue"},
          }},
          {"name": "tunnel timeout", "families": map[string][]string{
            "haptic":         {"timeout-tunnel"},
            "haproxyIngress": {"timeout-tunnel"},
            "haproxytech":    {"timeout-tunnel"},
          }},
          {"name": "http-request timeout", "families": map[string][]string{
            "haptic":         {"timeout-http"},
            "haproxyIngress": {"timeout-http"},
            "haproxytech":    {"timeout-http"},
          }},
          {"name": "keep-alive timeout", "families": map[string][]string{
            "haptic":         {"timeout-keep"},
            "haproxyIngress": {"timeout-keep"},
          }},
          {"name": "health-check timeout", "families": map[string][]string{
            "haptic":      {"timeout-check"},
            "haproxytech": {"timeout-check"},
          }},
          // haproxytech timeout-client and nginx proxy-send-timeout have no
          // cross-family counterpart yet, so no entry.
        }

        var enabled = extraContext | dig("annotationLibraries") | fallback(map[string]any{})
        var enabledCount = 0
        for _, fam := range familyOrder {
          if en, ok := enabled.(map[string]any)[fam].(bool); ok && en {
            enabledCount++
          }
        }
        if enabledCount >= 2 {
          for _, ingress := range resources.ingresses.List() {
            var anns = ingress.Metadata.Annotations
            if len(anns) == 0 {
              continue
            }
            for _, entry := range registry {
              var fams = entry["families"].(map[string][]string)
              var hitFamilies = []string{}
              var hitDetail = []string{}
              for _, fam := range familyOrder {
                if en, ok := enabled.(map[string]any)[fam].(bool); !ok || !en {
                  continue
                }
                var keys, has = fams[fam]
                if !has {
                  continue
                }
                var present = []string{}
                for _, k := range keys {
                  if _, kp := anns[familyPrefix[fam]+k]; kp {
                    present = append(present, familyPrefix[fam]+k)
                  }
                }
                if len(present) > 0 {
                  hitFamilies = append(hitFamilies, fam)
                  hitDetail = append(hitDetail, join(present, ", "))
                }
              }
              if len(hitFamilies) >= 2 {
                var msg = "Ingress " + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + " configures the " + entry["name"].(string) + " feature through annotations from multiple families (" + join(hitDetail, "; ") + "). Configure each feature through a single annotation family: mixing families for one feature is rejected even when the values agree, because the effective configuration is order-dependent."
                // "admission" is a dry-run of a PROPOSED change, so deny it;
                // other modes render already-present state, where fail() would
                // abort the whole config and brick the fleet.
                if renderMode == "admission" {
                  fail(msg)
                } else {
                  recordEvent(ingress, "AnnotationFamilyConflict", msg)
                }
              }
            }
          }
        }
      %%}

# The conflict tests drive the guard via extraContext.annotationLibraries, so its
# gating logic is exercised regardless of which vendor libraries are merged; they
# use plugin-free features so none depends on a SPOA plugin.
validationTests:
  test-annotation-family-conflict-cors-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      Under the admission webhook (renderMode admission), one Ingress enabling
      CORS via both haproxy-haptic.org/cors-enable and
      nginx.ingress.kubernetes.io/enable-cors is rejected — even though both
      values are "true" and thus don't conflict — because the effective result
      is order-dependent.
    extraContext:
      renderMode: admission
      annotationLibraries:
        haptic: true
        nginx: true
        haproxyIngress: false
        haproxytech: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-cors
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-cors.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the CORS feature through annotations from multiple families"
      - type: contains
        target: rendering_error
        pattern: "haproxy-haptic.org/cors-enable"
      - type: contains
        target: rendering_error
        pattern: "nginx.ingress.kubernetes.io/enable-cors"
      - type: contains
        target: rendering_error
        pattern: "rejected even when the values agree"

  test-annotation-family-conflict-different-features-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Two families configuring DIFFERENT features on one Ingress (CORS vs backend-protocol) is allowed.
    extraContext:
      annotationLibraries:
        haptic: true
        nginx: true
        haproxyIngress: false
        haproxytech: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: diff-features
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          spec:
            ingressClassName: haproxy
            rules:
              - host: diff-features.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-different-timeouts-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Two families setting DIFFERENT timeout parameters (connect vs server) is allowed — timeouts are per-parameter, not one feature.
    extraContext:
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: false
        haproxytech: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: diff-timeouts
            annotations:
              haproxy-haptic.org/timeout-connect: "5s"
              haproxy.org/timeout-server: "30s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: diff-timeouts.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-same-timeout-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Under the admission webhook, the SAME timeout parameter (server) from two families collides and is rejected.
    extraContext:
      renderMode: admission
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: false
        haproxytech: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-timeout
            annotations:
              haproxy-haptic.org/timeout-server: "30s"
              haproxy.org/timeout-server: "60s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-timeout.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the server \\(read\\) timeout feature through annotations from multiple families"

  test-annotation-family-conflict-queue-timeout-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: The queue timeout (not just connect/server) is registered per-parameter, so the same timeout from two families collides and is rejected under the webhook.
    extraContext:
      renderMode: admission
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: false
        haproxytech: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-queue-timeout
            annotations:
              haproxy-haptic.org/timeout-queue: "5s"
              haproxy.org/timeout-queue: "10s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-queue-timeout.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the queue timeout feature through annotations from multiple families"

  test-annotation-family-conflict-disabled-family-inert:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: A disabled family's annotation is inert, so native CORS plus a disabled-nginx CORS annotation does NOT collide.
    extraContext:
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: false
        haproxytech: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: disabled-family
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: disabled-family.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-single-family-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Multiple CORS keys from ONE family on one Ingress is allowed (not a cross-family mix).
    extraContext:
      annotationLibraries:
        haptic: true
        nginx: true
        haproxyIngress: false
        haproxytech: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: single-family
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-max-age: "600"
          spec:
            ingressClassName: haproxy
            rules:
              - host: single-family.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-waf-rejected:
    # Needs the coraza plugin so neither family's own WAF processing fails first.
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled) (not .Values.controller.templateLibraries.haproxyIngress.enabled) (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: Under the admission webhook, an Ingress with both haproxy-haptic.org/waf-policy and haproxy-ingress.github.io/waf is rejected — the deny-vs-detect downgrade this guard prevents.
    extraContext:
      renderMode: admission
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: true
        haproxytech: false
      waf:
        ingressPermissions:
          allowPolicySelection: true
        policies:
          inline:
            baseline:
              enforcement: deny
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-waf
            annotations:
              haproxy-haptic.org/waf-policy: baseline
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-waf.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the WAF feature through annotations from multiple families"
      - type: contains
        target: rendering_error
        pattern: "haproxy-haptic.org/waf-policy"
      - type: contains
        target: rendering_error
        pattern: "haproxy-ingress.github.io/waf"

  test-annotation-family-conflict-cors-reconcile-warns:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      During a live reconcile (renderMode reconcile), the same cross-family CORS
      conflict does NOT abort the render — it records a Warning Event on the
      offending Ingress and proceeds, so one already-present conflicting Ingress
      can't brick the whole config.
    extraContext:
      renderMode: reconcile
      annotationLibraries:
        haptic: true
        nginx: true
        haproxyIngress: false
        haproxytech: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-cors
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-cors.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: events
        pattern: "Warning AnnotationFamilyConflict networking.k8s.io/v1 Ingress default/mixed-cors:"
      - type: contains
        target: events
        pattern: "configures the CORS feature through annotations from multiple families"

  test-annotation-family-conflict-load-gate-warns-not-fails:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      With renderMode unset (the daemon load gate default), a cross-family
      timeout conflict warns rather than failing, so a pre-existing conflict
      can't crash-loop the controller at startup.
    extraContext:
      annotationLibraries:
        haptic: true
        nginx: false
        haproxyIngress: false
        haproxytech: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-timeout
            annotations:
              haproxy-haptic.org/timeout-server: "30s"
              haproxy.org/timeout-server: "60s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-timeout.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: app, port: { number: 80 } } }
    assertions:
      # haproxy_valid is deliberately not asserted: with both families merged the
      # same timeout may be emitted twice — a separate concern from warn-vs-fail.
      - type: not_contains
        target: rendering_error
        pattern: "configures the server \\(read\\) timeout feature through annotations from multiple families"
      - type: contains
        target: events
        pattern: "Warning AnnotationFamilyConflict networking.k8s.io/v1 Ingress default/same-timeout:"
