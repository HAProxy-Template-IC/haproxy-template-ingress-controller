# HAPTIC-native annotation library — shared response cache (Varnish tier).
#
# Routes cache-eligible requests through a chart-deployed, consistent-hash-
# sharded Varnish tier so the cache is shared across the whole HAProxy fleet.
# Topology — the canonical HAProxy+Varnish "sandwich" (separate client-facing and
# backend-fetch frontends):
#
#   client → HAProxy (client frontend: WAF/RL/auth/routing) → varnish_cache → client   (hit)
#   client → HAProxy (client frontend) → varnish_cache → HAProxy (dedicated backend-  (miss)
#            fetch frontend, internal-only) → app
#
# On a miss Varnish fetches the origin from a DEDICATED internal HAProxy port
# (frontends-500-haptic-cache-origin), not the client-facing frontend — so the
# client-leg filter chain runs exactly once and never re-runs on the miss. That
# frontend routes by the HAProxy-computed X-Haptic-Backend header (set + strip-of-
# client-copy in the varnish_cache backend), reaching the same backend the client
# leg selected without re-deriving routing from an already-rewritten request.
# Per-route behaviour is DATA — maps and injected X-Haptic-Cache-* request headers
# the static VCL reads. All cache-control headers are del-header'd off the client
# first (a client must not be able to poison the key or skip rules).
#
# Everything is gated on extraContext.hapticCacheEnabled (set by the chart from
# cache.varnish.enabled); when off, nothing is emitted.
templateSnippets:

  # ==========================================================================
  # Build the reload-free per-route cache maps (always registered when the tier
  # is on, so map() references resolve even with no entries). Keyed by
  # resource_id (ns/name), which base routing sets before frontend-filters.
  # ==========================================================================
  features-870-haptic-cache-maps:
    template: |
      {#- HAPTIC shared cache — build the cache-enable / ttl / skip-ct / maxsize maps. -#}
      {%- var enabled = extraContext | dig("cache", "varnish", "enabled") | fallback("false") | tostring() %}
      {%- if enabled == "true" %}
        {%- var vSvc = extraContext | dig("cache", "varnish", "serviceName") | fallback("haptic-varnish-cache") | tostring() %}
        {%- var vNs = extraContext | dig("cache", "varnish", "namespace") | fallback("default") | tostring() %}
        {%- var enLines = []any{} %}
        {%- var ttlLines = []any{} %}
        {%- var skipLines = []any{} %}
        {%- var sizeLines = []any{} %}
        {%- var graceLines = []any{} %}
        {%- var swrLines = []any{} %}
        {%- var sieLines = []any{} %}
        {%- var keepLines = []any{} %}
        {%- var stripLines = []any{} %}
        {%- var varyLines = []any{} %}
        {%- var privateLines = []any{} %}
        {%- var negLines = []any{} %}
        {%- var authKeyedLines = []any{} %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- if ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" %}
            {%- var rid = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
            {%- enLines = append(enLines, rid + " 1") %}
            {%- var ttl = ingress.Metadata.Annotations["haproxy-haptic.org/cache-ttl"] %}
            {%- if ttl != "" %}
              {#- Validate the raw string, not toint(ttl): toint uses strconv.Atoi
                  (all-or-nothing), so a unit-suffixed value like "60s" parses to 0,
                  passes a `toint(ttl) < 0` guard, and is written verbatim into
                  haptic-cache-ttl.map — where the Varnish VCL computes
                  std.duration(ttl + "s") = "60ss" = 0s and silently never caches.
                  Require digits only so a bad unit is rejected at admission. -#}
              {%- if !regex_search(ttl, "^([0-9]+|auto)$") %}{{ fail("Invalid value '" + ttl + "' for annotation 'haproxy-haptic.org/cache-ttl' on Ingress '" + rid + "'. Must be a non-negative integer (seconds) with no unit suffix, e.g. \"60\" not \"60s\", or \"auto\" to follow the origin's Cache-Control.") }}{%- end %}
              {%- ttlLines = append(ttlLines, rid + " " + ttl) %}
            {%- end %}
            {%- var skip = ingress.Metadata.Annotations["haproxy-haptic.org/cache-exclude-content-types"] %}
            {%- if skip != "" %}
              {%- var toks = []any{} %}
              {%- for _, tok := range split(skip, ",") %}
                {%- var ct = strip(tok) %}
                {%- if ct != "" %}
                  {%- if !regex_search(ct, "^[A-Za-z0-9./+-]+$") %}{{ fail("Invalid media type '" + ct + "' in 'haproxy-haptic.org/cache-exclude-content-types' on Ingress '" + rid + "'.") }}{%- end %}
                  {%- toks = append(toks, ct) %}
                {%- end %}
              {%- end %}
              {%- if len(toks) > 0 %}{%- skipLines = append(skipLines, rid + " |" + (toks | toStringSlice() | join("|")) + "|") %}{%- end %}
            {%- end %}
            {%- var maxsz = ingress.Metadata.Annotations["haproxy-haptic.org/cache-max-object-size"] %}
            {%- if maxsz != "" %}
              {#- Same footgun as cache-ttl: validate the raw digits-only string
                  rather than leaning on toint()<=0 to reject unit suffixes. -#}
              {%- if !regex_search(maxsz, "^[0-9]+$") || toint(maxsz) <= 0 %}{{ fail("Invalid value '" + maxsz + "' for annotation 'haproxy-haptic.org/cache-max-object-size' on Ingress '" + rid + "'. Must be a positive integer (bytes) with no unit suffix, e.g. \"1048576\" not \"1mb\".") }}{%- end %}
              {%- sizeLines = append(sizeLines, rid + " " + maxsz) %}
            {%- end %}
            {#- Negative caching gets its OWN clock rather than reusing cache-ttl:
                a cached 404 during a bad deploy pins the outage for its lifetime,
                so it must be shortenable independently of the route's ordinary
                TTL. Same digits-only rule as cache-ttl. -#}
            {%- var negTtl = ingress.Metadata.Annotations["haproxy-haptic.org/cache-negative-ttl"] %}
            {%- if negTtl != "" %}
              {%- if !regex_search(negTtl, "^[0-9]+$") %}{{ fail("Invalid value '" + negTtl + "' for annotation 'haproxy-haptic.org/cache-negative-ttl' on Ingress '" + rid + "'. Must be a non-negative integer (seconds) with no unit suffix, e.g. \"30\" not \"30s\".") }}{%- end %}
              {%- negLines = append(negLines, rid + " " + negTtl) %}
            {%- end %}
            {#- Staleness windows. Same digits-only rule as cache-ttl and for the
                same reason: the VCL builds a duration by appending "s", so a
                unit-suffixed value yields 0s and silently disables the window. -#}
            {%- var swr = ingress.Metadata.Annotations["haproxy-haptic.org/cache-stale-while-revalidate"] %}
            {%- if swr != "" && !regex_search(swr, "^[0-9]+$") %}{{ fail("Invalid value '" + swr + "' for annotation 'haproxy-haptic.org/cache-stale-while-revalidate' on Ingress '" + rid + "'. Must be a non-negative integer (seconds) with no unit suffix, e.g. \"30\" not \"30s\".") }}{%- end %}
            {%- var sie = ingress.Metadata.Annotations["haproxy-haptic.org/cache-stale-if-error"] %}
            {%- if sie != "" && !regex_search(sie, "^[0-9]+$") %}{{ fail("Invalid value '" + sie + "' for annotation 'haproxy-haptic.org/cache-stale-if-error' on Ingress '" + rid + "'. Must be a non-negative integer (seconds) with no unit suffix, e.g. \"300\" not \"5m\".") }}{%- end %}
            {#- Two windows, not one. beresp.grace is the TOTAL time the object may
                still be used — the larger of the two. req.grace (set from the swr
                value below) caps how much of it is spent serving stale
                PROACTIVELY, so a route that asked for stale-if-error alone gets
                swr=0: ordinary expiry fetches synchronously, and the wider grace
                is reachable only as the fallback when that fetch fails. Without
                the split, stale-if-error would serve stale on every expiry — the
                behaviour its name denies. -#}
            {%- if swr != "" || sie != "" %}
              {%- var grace = toint(swr) %}
              {%- if toint(sie) > grace %}{%- grace = toint(sie) %}{%- end %}
              {%- graceLines = append(graceLines, rid + " " + tostring(grace)) %}
              {%- swrLines = append(swrLines, rid + " " + tostring(toint(swr))) %}
            {%- end %}
            {%- if sie != "" %}{%- sieLines = append(sieLines, rid + " 1") %}{%- end %}
            {%- var keep = ingress.Metadata.Annotations["haproxy-haptic.org/cache-revalidate"] %}
            {%- if keep != "" %}
              {%- if !regex_search(keep, "^[0-9]+$") %}{{ fail("Invalid value '" + keep + "' for annotation 'haproxy-haptic.org/cache-revalidate' on Ingress '" + rid + "'. Must be a non-negative integer (seconds) with no unit suffix, e.g. \"600\" not \"10m\".") }}{%- end %}
              {%- keepLines = append(keepLines, rid + " " + keep) %}
            {%- end %}
            {#- Declare the variance to caches DOWNSTREAM of HAPTIC. Varnish keys
                on X-Haptic-Cache-Vary internally, but that header is ours: a CDN
                or proxy in front of HAPTIC sees one publicly-cacheable response
                with no declared variance and will serve one consumer's body to
                another. Split by what the CLIENT actually sends, because that is
                what a downstream cache can key on:
                  header:<h>  -> Vary: <h>          exact, the client sends it
                  cookie:<c>  -> Vary: Cookie       coarse but correct
                  query:<q>   -> nothing            already part of the URL
                  consumer    -> Cache-Control: private
                  src         -> Cache-Control: private
                consumer and src are NOT expressible as Vary: emitting
                `Vary: X-Haptic-Consumer` would have every downstream client
                present it as absent, collapsing back to one shared variant — the
                same leak. Origin-sent Vary is untouched and still honoured by
                Varnish natively; this only adds what WE introduced.
                cache-key is parsed again here (it is also parsed in
                backends-870 to build the key expression) because the two need
                different things from it: the value there, the classification
                here. -#}
            {%- var ckeyForVary = ingress.Metadata.Annotations["haproxy-haptic.org/cache-key"] %}
            {%- if ckeyForVary != "" %}
              {%- var varyHdrs = []any{} %}
              {%- var needPrivate = false %}
              {%- for _, comp := range split(ckeyForVary, ",") %}
                {%- var c = strip(comp) %}
                {%- if c == "consumer" || c == "src" %}{%- needPrivate = true %}
                {%- else if hasPrefix(c, "header:") %}{%- varyHdrs = append(varyHdrs, strip(c[7:])) %}
                {%- else if hasPrefix(c, "cookie:") %}{%- varyHdrs = append(varyHdrs, "Cookie") %}
                {%- end %}
              {%- end %}
              {%- if len(varyHdrs) > 0 %}
                {%- var seenVary = map[string]bool{} %}
                {%- var uniq = []any{} %}
                {%- for _, h := range varyHdrs %}
                  {#- Header names are case-insensitive, so dedup on the folded
                      name while emitting the operator's original spelling. -#}
                  {%- if !seenVary[toLower(tostring(h))] %}{%- seenVary[toLower(tostring(h))] = true %}{%- uniq = append(uniq, h) %}{%- end %}
                {%- end %}
                {%- varyLines = append(varyLines, rid + " " + (uniq | toStringSlice() | join(",")) ) %}
              {%- end %}
              {%- if needPrivate %}{%- privateLines = append(privateLines, rid + " 1") %}{%- end %}
              {#- Caching a response to an AUTHENTICATED request is only safe when
                  the key identifies the caller. `consumer` is the one component
                  that provably does — it is HAPTIC's authenticated identity.
                  header:/cookie:/query:/src may or may not correlate with the
                  caller and cannot be trusted to, so a route keyed on those
                  keeps Varnish's builtin behaviour and simply does not cache
                  authenticated requests. -#}
              {%- for _, comp := range split(ckeyForVary, ",") %}
                {%- if strip(comp) == "consumer" %}{%- authKeyedLines = append(authKeyedLines, rid + " 1") %}{%- break %}{%- end %}
              {%- end %}
            {%- end %}
            {%- var stripCookie = ingress.Metadata.Annotations["haproxy-haptic.org/cache-strip-set-cookie"] %}
            {%- if stripCookie != "" %}
              {%- if stripCookie != "true" && stripCookie != "false" %}{{ fail("Invalid value '" + stripCookie + "' for annotation 'haproxy-haptic.org/cache-strip-set-cookie' on Ingress '" + rid + "'. Must be \"true\" or \"false\".") }}{%- end %}
              {%- if stripCookie == "true" %}{%- stripLines = append(stripLines, rid + " 1") %}{%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
        {%- var _, e1 = fileRegistry.Register("map", "haptic-cache-enable.map", (enLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e1 != nil %}{{ fail("failed to register haptic-cache-enable.map: " + tostring(e1)) }}{%- end %}
        {%- var _, e2 = fileRegistry.Register("map", "haptic-cache-ttl.map", (ttlLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e2 != nil %}{{ fail("failed to register haptic-cache-ttl.map: " + tostring(e2)) }}{%- end %}
        {%- var _, e3 = fileRegistry.Register("map", "haptic-cache-skip-ct.map", (skipLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e3 != nil %}{{ fail("failed to register haptic-cache-skip-ct.map: " + tostring(e3)) }}{%- end %}
        {%- var _, e4 = fileRegistry.Register("map", "haptic-cache-maxsize.map", (sizeLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e4 != nil %}{{ fail("failed to register haptic-cache-maxsize.map: " + tostring(e4)) }}{%- end %}
        {%- var _, e5 = fileRegistry.Register("map", "haptic-cache-grace.map", (graceLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e5 != nil %}{{ fail("failed to register haptic-cache-grace.map: " + tostring(e5)) }}{%- end %}
        {%- var _, e5b = fileRegistry.Register("map", "haptic-cache-swr.map", (swrLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e5b != nil %}{{ fail("failed to register haptic-cache-swr.map: " + tostring(e5b)) }}{%- end %}
        {%- var _, e6 = fileRegistry.Register("map", "haptic-cache-stale-if-error.map", (sieLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e6 != nil %}{{ fail("failed to register haptic-cache-stale-if-error.map: " + tostring(e6)) }}{%- end %}
        {%- var _, e7 = fileRegistry.Register("map", "haptic-cache-keep.map", (keepLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e7 != nil %}{{ fail("failed to register haptic-cache-keep.map: " + tostring(e7)) }}{%- end %}
        {%- var _, e8 = fileRegistry.Register("map", "haptic-cache-strip-cookie.map", (stripLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e8 != nil %}{{ fail("failed to register haptic-cache-strip-cookie.map: " + tostring(e8)) }}{%- end %}
        {%- var _, e9 = fileRegistry.Register("map", "haptic-cache-vary.map", (varyLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e9 != nil %}{{ fail("failed to register haptic-cache-vary.map: " + tostring(e9)) }}{%- end %}
        {%- var _, e10 = fileRegistry.Register("map", "haptic-cache-private.map", (privateLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e10 != nil %}{{ fail("failed to register haptic-cache-private.map: " + tostring(e10)) }}{%- end %}
        {%- var _, e11 = fileRegistry.Register("map", "haptic-cache-negative-ttl.map", (negLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e11 != nil %}{{ fail("failed to register haptic-cache-negative-ttl.map: " + tostring(e11)) }}{%- end %}
        {%- var _, e12 = fileRegistry.Register("map", "haptic-cache-authkey.map", (authKeyedLines | toStringSlice() | join("\n")) + "\n") %}
        {%- if e12 != nil %}{{ fail("failed to register haptic-cache-authkey.map: " + tostring(e12)) }}{%- end %}
      {%- end %}

  # ==========================================================================
  # Frontend routing: excluded paths go straight to the app; everything else on
  # a cache-enabled route goes to varnish_cache. Runs in every client frontend
  # after txn.resource_id is set, before the default use_backend, so these take
  # precedence (first-match wins). The cache-miss loopback never reaches these
  # frontends — Varnish fetches the dedicated backend-fetch port instead.
  # ==========================================================================
  frontend-filters-865-haptic-cache-route:
    template: |
      {#- HAPTIC shared cache — route cache-eligible requests to varnish_cache. -#}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var enabled = extraContext | dig("cache", "varnish", "enabled") | fallback("false") | tostring() %}
      {%- if enabled == "true" %}
        {%- var enMap, _ = pathResolver.GetPath("haptic-cache-enable.map", "map") %}
      # haptic/cache routing
      # Defense-in-depth: strip any client-supplied cache-control fetch header.
      http-request del-header X-Haptic-Cache-Fetch
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- if ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" %}
            {%- var rid = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
            {%- var excl = ingress.Metadata.Annotations["haproxy-haptic.org/cache-exclude-paths"] %}
            {%- if excl != "" %}
              {%- var paths = []any{} %}
              {%- for _, tok := range split(excl, ",") %}
                {%- var p = strip(tok) %}
                {%- if p != "" %}
                  {%- if !regex_search(p, "^/[!-~]*$") %}{{ fail("Invalid path '" + p + "' in 'haproxy-haptic.org/cache-exclude-paths' on Ingress '" + rid + "'. Must start with '/' and contain no spaces.") }}{%- end %}
                  {%- paths = append(paths, p) %}
                {%- end %}
              {%- end %}
              {%- if len(paths) > 0 %}
      use_backend %[var(txn.backend_name)] if { var(txn.resource_id) -m str {{ rid }} } { path_beg {{ paths | toStringSlice() | join(" ") }} }
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      # Route cache-eligible client requests to Varnish. The cache-miss loopback
      # never reaches this frontend (Varnish fetches the dedicated backend-fetch
      # port instead), so no source/loop guard is needed here.
      use_backend varnish_cache if { var(txn.resource_id),map({{ enMap }}) -m found }
      {%- end %}

  # ==========================================================================
  # The shared Varnish backend: consistent-hash sharding (bounded-load) over the
  # Varnish pod endpoints, reserved slots for reload-free scaling. It also owns
  # all X-Haptic-Cache-* header injection: del-header first (anti-poisoning),
  # then set the per-route TTL / skip-ct / max-size (from maps) and the custom
  # cache key (per-route, dynamic value).
  # ==========================================================================
  backends-870-haptic-varnish-cache:
    template: |
      {#- HAPTIC shared cache — the sharded varnish_cache backend + header injection. -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var enabled = extraContext | dig("cache", "varnish", "enabled") | fallback("false") | tostring() %}
      {%- if enabled == "true" %}
        {%- var vSvc = extraContext | dig("cache", "varnish", "serviceName") | fallback("haptic-varnish-cache") | tostring() %}
        {%- var vNs = extraContext | dig("cache", "varnish", "namespace") | fallback("default") | tostring() %}
        {%- var vPort = toint(extraContext | dig("cache", "varnish", "servicePort") | fallback("6081") | tostring()) %}
        {%- var hbf = extraContext | dig("cache", "haproxy", "hashBalanceFactor") | fallback("150") | tostring() %}
        {%- var ttlMap, _ = pathResolver.GetPath("haptic-cache-ttl.map", "map") %}
        {%- var skipMap, _ = pathResolver.GetPath("haptic-cache-skip-ct.map", "map") %}
        {%- var sizeMap, _ = pathResolver.GetPath("haptic-cache-maxsize.map", "map") %}
        {%- var graceMap, _ = pathResolver.GetPath("haptic-cache-grace.map", "map") %}
        {%- var swrMap, _ = pathResolver.GetPath("haptic-cache-swr.map", "map") %}
        {%- var sieMap, _ = pathResolver.GetPath("haptic-cache-stale-if-error.map", "map") %}
        {%- var keepMap, _ = pathResolver.GetPath("haptic-cache-keep.map", "map") %}
        {%- var stripMap, _ = pathResolver.GetPath("haptic-cache-strip-cookie.map", "map") %}
        {%- var varyMap, _ = pathResolver.GetPath("haptic-cache-vary.map", "map") %}
        {%- var privateMap, _ = pathResolver.GetPath("haptic-cache-private.map", "map") %}
        {%- var negMap, _ = pathResolver.GetPath("haptic-cache-negative-ttl.map", "map") %}
        {%- var authMap, _ = pathResolver.GetPath("haptic-cache-authkey.map", "map") %}
      {{ "\n" }}# haptic/varnish-cache — shared, consistent-hash-sharded cache tier
      backend varnish_cache
          balance uri
          hash-type consistent
        {%- if hbf != "0" %}
          hash-balance-factor {{ hbf }}
        {%- end %}
          # Anti-poisoning: strip any client-supplied cache-control headers first.
          http-request del-header X-Haptic-Cache-Vary
          http-request del-header X-Haptic-Cache-Skip-CT
          http-request del-header X-Haptic-Cache-Max-Size
          http-request del-header X-Haptic-Cache-TTL
          http-request del-header X-Haptic-Cache-Grace
          http-request del-header X-Haptic-Cache-SWR
          http-request del-header X-Haptic-Cache-Stale-If-Error
          http-request del-header X-Haptic-Cache-Keep
          http-request del-header X-Haptic-Cache-Strip-Cookie
          http-request del-header X-Haptic-Cache-Negative-TTL
          http-request del-header X-Haptic-Cache-Auth
          # Stamp the HAProxy-resolved backend so the dedicated backend-fetch
          # frontend routes the cache-miss loopback to the SAME backend this
          # client-leg selected — without re-deriving routing from an
          # already-rewritten request. del-header first so a client can't forge it.
          http-request del-header X-Haptic-Backend
          http-request set-header X-Haptic-Backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
          http-request set-header X-Haptic-Cache-TTL %[var(txn.resource_id),map({{ ttlMap }})] if { var(txn.resource_id),map({{ ttlMap }}) -m found }
          http-request set-header X-Haptic-Cache-Skip-CT %[var(txn.resource_id),map({{ skipMap }})] if { var(txn.resource_id),map({{ skipMap }}) -m found }
          http-request set-header X-Haptic-Cache-Max-Size %[var(txn.resource_id),map({{ sizeMap }})] if { var(txn.resource_id),map({{ sizeMap }}) -m found }
          {#- Only set when the route opted in: an explicit "0" grace would
              override Varnish's default_grace and disable stale delivery for a
              route that never asked to change it. -#}
          http-request set-header X-Haptic-Cache-Grace %[var(txn.resource_id),map({{ graceMap }})] if { var(txn.resource_id),map({{ graceMap }}) -m found }
          http-request set-header X-Haptic-Cache-SWR %[var(txn.resource_id),map({{ swrMap }})] if { var(txn.resource_id),map({{ swrMap }}) -m found }
          http-request set-header X-Haptic-Cache-Stale-If-Error %[var(txn.resource_id),map({{ sieMap }})] if { var(txn.resource_id),map({{ sieMap }}) -m found }
          http-request set-header X-Haptic-Cache-Keep %[var(txn.resource_id),map({{ keepMap }})] if { var(txn.resource_id),map({{ keepMap }}) -m found }
          http-request set-header X-Haptic-Cache-Strip-Cookie %[var(txn.resource_id),map({{ stripMap }})] if { var(txn.resource_id),map({{ stripMap }}) -m found }
          http-request set-header X-Haptic-Cache-Negative-TTL %[var(txn.resource_id),map({{ negMap }})] if { var(txn.resource_id),map({{ negMap }}) -m found }
          {#- The flag that lets Varnish cache an authenticated request. Requires
              BOTH that the route is keyed on `consumer` AND that a consumer was
              actually resolved: an empty identity would put every caller in one
              bucket, which is the leak this guards, not a fix for it. -#}
          http-request set-header X-Haptic-Cache-Auth 1 if { var(txn.resource_id),map({{ authMap }}) -m found } { var(txn.haptic_consumer),length gt 0 }
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- if ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" %}
            {%- var ckey = ingress.Metadata.Annotations["haproxy-haptic.org/cache-key"] %}
            {%- if ckey != "" %}
              {%- var rid = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
              {%- var parts = []any{} %}
              {%- for _, comp := range split(ckey, ",") %}
                {%- var c = strip(comp) %}
                {%- if c == "consumer" %}{%- parts = append(parts, "%[var(txn.haptic_consumer)]") %}
                {%- else if c == "src" %}{%- parts = append(parts, "%[src]") %}
                {%- else if hasPrefix(c, "header:") %}{%- parts = append(parts, "%[req.hdr(" + ValidateConfigValue(c[7:], "haproxy-haptic.org/cache-key", rid, false) + ")]") %}
                {%- else if hasPrefix(c, "cookie:") %}{%- parts = append(parts, "%[req.cook(" + ValidateConfigValue(c[7:], "haproxy-haptic.org/cache-key", rid, false) + ")]") %}
                {%- else if hasPrefix(c, "query:") %}{%- parts = append(parts, "%[urlp(" + ValidateConfigValue(c[6:], "haproxy-haptic.org/cache-key", rid, false) + ")]") %}
                {%- else %}{{ fail("Invalid cache-key component '" + c + "' in 'haproxy-haptic.org/cache-key' on Ingress '" + rid + "'. Valid: consumer, src, header:<h>, cookie:<c>, query:<q>.") }}{%- end %}
              {%- end %}
          http-request set-header X-Haptic-Cache-Vary {{ parts | toStringSlice() | join("|") }} if { var(txn.resource_id) -m str {{ rid }} }
            {%- end %}
          {%- end %}
        {%- end %}
          {#- Capture Varnish's hit/miss verdict for the access log. The VCL sets
              X-Cache in vcl_deliver, and a log-format cannot fetch res.hdr() —
              HAProxy rejects response-scoped fetches at log time — so it has to
              be materialised into a transaction variable first.
              http-after-response (not http-response) so it also covers responses
              HAProxy generates itself, and backend scope so routes that don't go
              through the cache evaluate nothing. -#}
          {#- Tell caches downstream of HAPTIC what this route varies on. add-header
              (not set-header) because both fields are comma-combinable lists per
              RFC 9110: the origin's own Vary / Cache-Control survives and ours is
              unioned with it, instead of one silently overwriting the other. -#}
          http-after-response add-header Vary %[var(txn.resource_id),map({{ varyMap }})] if { var(txn.resource_id),map({{ varyMap }}) -m found }
          {#- consumer/src keying cannot be expressed as Vary at all, so the only
              correct downstream signal is to keep shared caches out entirely. A
              browser may still cache it under any max-age the origin set.
              Rewrite a conflicting `public` to `private` FIRST rather than
              emitting both: RFC 9111 gives no precedence for a response carrying
              both directives, and while mainstream shared caches treat `private`
              as authoritative, relying on that convention is a weaker signal than
              simply not contradicting ourselves. The add-header then covers the
              responses that carried no `public` to rewrite, and is skipped when
              the rewrite already produced one. -#}
          http-after-response replace-header Cache-Control (?i)\bpublic\b private if { var(txn.resource_id),map({{ privateMap }}) -m found }
          http-after-response add-header Cache-Control private if { var(txn.resource_id),map({{ privateMap }}) -m found } !{ res.hdr(Cache-Control) -m sub -i private }
          http-after-response set-var(txn.cache_status) res.hdr(X-Cache) if { res.hdr(X-Cache) -m found }
          default-server check
      {{ BackendServers(vSvc, 0, vPort, map[string]any{"flags": []any{}}, "", "varnish_cache", vNs) | indent(4, true) }}
      {%- end %}

  # ==========================================================================
  # Dedicated Varnish backend-fetch frontend — the "sandwich" backend leg. On a
  # cache miss Varnish fetches the origin from THIS internal-only port instead of
  # looping back through the client-facing frontend, so the WAF / rate-limit /
  # auth / routing chain runs exactly once (on the client leg) and never re-runs
  # on the miss. This is the canonical HAProxy+Varnish topology (separate
  # client-facing and backend-fetch frontends), replacing the source-IP loop-break
  # (which churned with Varnish pod IPs, raced pod restarts, and broke under SNAT).
  #
  # Vetted by construction: only Varnish reaches this port (NetworkPolicy; it is
  # never published on the LoadBalancer). It routes by the HAProxy-computed
  # X-Haptic-Backend header — set in the varnish_cache backend and stripped of any
  # client copy there — because the request Varnish forwards was already
  # Host/path/prefix-rewritten on the client leg, so RE-DERIVING routing here
  # would mis-route rewritten routes and re-roll weighted (MULTIBACKEND) routes.
  # The header is captured, then stripped before the app. Infrastructure backend
  # names are refused so a stray or forged value can't loop back to Varnish
  # (varnish_cache), hit the SPOP agent (spoa-hub), or reach the tcp loopbacks.
  # ==========================================================================
  frontends-500-haptic-cache-origin:
    template: |
      {%- var enabled = extraContext | dig("cache", "varnish", "enabled") | fallback("false") | tostring() %}
      {%- if enabled == "true" %}
        {%- var loopbackPort = extraContext | dig("cache", "varnish", "loopbackPort") | fallback("8090") | tostring() %}
      {{ "\n" }}frontend haptic_cache_origin
          mode http
          option forwardfor if-none
          bind *:{{ loopbackPort }}{{ render "util-log-format-http" }}
          {#- Capture the routing decision, then strip the header so the app never
              sees it (and a client copy that slipped through can't reach it). -#}
          http-request set-var(txn.origin_backend) req.hdr(X-Haptic-Backend)
          http-request del-header X-Haptic-Backend
          {#- Refuse the infrastructure backends: varnish_cache would re-loop to
              Varnish, spoa-hub is a SPOP agent, and the tcp loopbacks/default are
              not app targets. Any legitimate value is a real app backend. -#}
          acl origin_backend_internal var(txn.origin_backend) -m str varnish_cache spoa-hub default_backend http-h1-loopback http-h2c-loopback
          http-request set-var(txn.denied_by) str(cache_origin_internal_backend) if origin_backend_internal
          http-request deny deny_status 421 if origin_backend_internal
          use_backend %[var(txn.origin_backend)] if { var(txn.origin_backend) -m found }
          default_backend default_backend
      {%- end %}

# ============================================================================
# The Varnish tier itself: a chart-deployed StatefulSet (or Deployment) +
# headless Service + static loopback VCL, applied via Server-Side Apply and
# owner-referenced to the HAProxyTemplateConfig (GC'd on uninstall). Emitted
# only when the tier is enabled. The VCL is generic: routing/TTL/vary/exclusions
# are driven by the X-Haptic-Cache-* request headers HAProxy injects.
# ============================================================================
k8sResources:
  varnish-cache:
    template: |
      {%- var enabled = extraContext | dig("cache", "varnish", "enabled") | fallback("false") | tostring() %}
      {%- if enabled == "true" %}
      {%- var vSvc = extraContext | dig("cache", "varnish", "serviceName") | fallback("haptic-varnish-cache") | tostring() %}
      {%- var vNs = extraContext | dig("cache", "varnish", "namespace") | fallback("default") | tostring() %}
      {%- var vPort = extraContext | dig("cache", "varnish", "servicePort") | fallback("6081") | tostring() %}
      {#- renovate: datasource=docker depName=varnish #}
      {%- var img = extraContext | dig("cache", "varnish", "image") | fallback("varnish:9.0") | tostring() %}
      {%- var imagePullPolicy = extraContext | dig("cache", "varnish", "imagePullPolicy") | fallback("IfNotPresent") | tostring() %}
      {%- var replicas = extraContext | dig("cache", "varnish", "replicas") | fallback("2") | tostring() %}
      {%- var malloc = extraContext | dig("cache", "varnish", "malloc") | fallback("256m") | tostring() %}
      {%- var workload = extraContext | dig("cache", "varnish", "workload") | fallback("statefulset") | tostring() %}
      {#- Varnish fetches cache misses from HAProxy's DEDICATED backend-fetch port
          (frontends-500-haptic-cache-origin) via an internal-only Service, never
          the client-facing frontend — so the WAF/RL/auth/routing chain runs once
          on the client leg. The origin Service + port are chart-owned (below), so
          this needs no operator originHost/originPort tuning. -#}
      {%- var loopbackPort = extraContext | dig("cache", "varnish", "loopbackPort") | fallback("8090") | tostring() %}
      {%- var originSvcName = extraContext | dig("cache", "varnish", "originServiceName") | fallback("haptic-cache-origin") | tostring() %}
      {%- var ctrlNs = extraContext | dig("controllerNamespace") | fallback(vNs) | tostring() %}
      {#- FQDN so Varnish resolves the origin Service even if the Varnish tier and
          the HAProxy fleet land in different namespaces. -#}
      {%- var originHost = originSvcName + "." + ctrlNs + ".svc.cluster.local" %}
      {%- var originPort = loopbackPort %}
      {%- var haproxySelector = extraContext | dig("haproxyPodSelector") | fallback(map[string]any{}) %}
      {%- var autoscaling = extraContext | dig("cache", "varnish", "autoscaling", "enabled") | fallback("false") | tostring() %}
      {%- var cpuReq = extraContext | dig("cache", "varnish", "resources", "requests", "cpu") | fallback("100m") | tostring() %}
      {%- var memReq = extraContext | dig("cache", "varnish", "resources", "requests", "memory") | fallback("384Mi") | tostring() %}
      {%- var memLim = extraContext | dig("cache", "varnish", "resources", "limits", "memory") | fallback("384Mi") | tostring() %}
      {%- var pdbEnabled = extraContext | dig("cache", "varnish", "podDisruptionBudget", "enabled") | fallback("true") | tostring() %}
      {%- var pdbMaxUnavailable = extraContext | dig("cache", "varnish", "podDisruptionBudget", "maxUnavailable") | fallback("1") | tostring() %}
      {%- var vcl = "vcl 4.1;\nimport std;\n\nbackend default {\n    .host = \"" + originHost + "\";\n    .port = \"" + originPort + "\";\n}\n\nsub vcl_recv {\n    # Look up a request the builtin would have passed. The builtin refuses to\n    # serve a cached response to a request carrying Authorization or Cookie,\n    # which is correct unless the cache key identifies the caller — so this\n    # bypass demands X-Haptic-Cache-Auth, which HAProxy sets only for a route\n    # keyed on `consumer` AND only when a consumer was actually resolved.\n    #\n    # Gating on X-Haptic-Cache-Vary alone was a cross-user leak: any cache-key at\n    # all enabled the bypass, so a route keyed on e.g. header:X-Api-Version cached\n    # one caller's authenticated response and served it to the next caller\n    # presenting the same header. Verified with varnishtest before and after.\n    if (req.http.X-Haptic-Cache-Vary && req.http.X-Haptic-Cache-Auth && (req.method == \"GET\" || req.method == \"HEAD\")) {\n        return (hash);\n    }\n    # beresp.grace is the total window the object may still be used; this caps\n    # how much of it is spent serving stale PROACTIVELY. A route that set only\n    # stale-if-error sends 0 here, so ordinary expiry fetches synchronously and\n    # the wider grace is reachable only as the fallback below.\n    if (req.http.X-Haptic-Cache-SWR) {\n        set req.grace = std.duration(req.http.X-Haptic-Cache-SWR + \"s\", 0s);\n    }\n}\n\nsub vcl_hash {\n    if (req.http.X-Haptic-Cache-Vary) {\n        hash_data(req.http.X-Haptic-Cache-Vary);\n    }\n}\n\n# Applied from several paths, and always AFTER any std.rfc_ttl(): verified with\n# varnishtest that rfc_ttl() resets grace and keep to their parameter defaults,\n# so setting them earlier is silently discarded.\nsub haptic_stale_windows {\n    if (bereq.http.X-Haptic-Cache-Grace) {\n        set beresp.grace = std.duration(bereq.http.X-Haptic-Cache-Grace + \"s\", 0s);\n    }\n    if (bereq.http.X-Haptic-Cache-Keep) {\n        set beresp.keep = std.duration(bereq.http.X-Haptic-Cache-Keep + \"s\", 0s);\n    }\n}\n\nsub vcl_backend_response {\n    if (bereq.http.X-Haptic-Cache-Skip-CT && beresp.http.Content-Type && std.strstr(bereq.http.X-Haptic-Cache-Skip-CT, \"|\" + regsub(beresp.http.Content-Type, \";.*$\", \"\") + \"|\")) {\n        set beresp.uncacheable = true;\n        set beresp.ttl = param.uncacheable_ttl;\n        return (deliver);\n    }\n    if (bereq.http.X-Haptic-Cache-Max-Size && beresp.http.Content-Length && std.integer(beresp.http.Content-Length, 0) > std.integer(bereq.http.X-Haptic-Cache-Max-Size, 0)) {\n        set beresp.uncacheable = true;\n        set beresp.ttl = param.uncacheable_ttl;\n        return (deliver);\n    }\n    if (bereq.http.X-Haptic-Cache-Strip-Cookie) {\n        unset beresp.http.Set-Cookie;\n    }\n    # stale-if-error. Abandoning leaves the existing object in place and lets\n    # Varnish fall back to it while it is still within beresp.grace — which is\n    # what turns an origin 5xx into a stale hit. Deliberately NOT limited to\n    # background fetches: past the stale-while-revalidate window the refresh is\n    # synchronous, and that is exactly the fetch a client is waiting on.\n    if (bereq.http.X-Haptic-Cache-Stale-If-Error && beresp.status >= 500) {\n        return (abandon);\n    }\n    # Negative caching, opt-in per route and on its own shorter clock: a cached\n    # 404 during a bad deploy pins the outage for its TTL, so it must not inherit\n    # the route's ordinary lifetime. 404 and 410 only — both mean \"this resource\n    # is not here\", which is what scanning traffic hammers the origin for.\n    #\n    # Deliberately OUTSIDE the cache-ttl branch: a route may want 404s cached\n    # while leaving ordinary lifetimes to the origin's own Cache-Control, and\n    # nesting this made the annotation a silent no-op without cache-ttl.\n    if (bereq.http.X-Haptic-Cache-Negative-TTL && !beresp.http.Set-Cookie && (beresp.status == 404 || beresp.status == 410)) {\n        set beresp.ttl = std.duration(bereq.http.X-Haptic-Cache-Negative-TTL + \"s\", 0s);\n        call haptic_stale_windows;\n        return (deliver);\n    }\n    if (bereq.http.X-Haptic-Cache-TTL) {\n        if (beresp.http.Set-Cookie) {\n            set beresp.uncacheable = true;\n            set beresp.ttl = param.uncacheable_ttl;\n            return (deliver);\n        }\n        if (beresp.status != 200) {\n            set beresp.uncacheable = true;\n            set beresp.ttl = param.uncacheable_ttl;\n            return (deliver);\n        }\n        if (bereq.http.X-Haptic-Cache-TTL == \"auto\") {\n            std.rfc_ttl();\n        } else {\n            set beresp.ttl = std.duration(bereq.http.X-Haptic-Cache-TTL + \"s\", 0s);\n        }\n        call haptic_stale_windows;\n        return (deliver);\n    }\n    call haptic_stale_windows;\n}\n\nsub vcl_backend_error {\n    # Same fallback for a fetch that never produced a response at all.\n    if (bereq.http.X-Haptic-Cache-Stale-If-Error) {\n        return (abandon);\n    }\n}\n\nsub vcl_deliver {\n    if (obj.hits > 0) {\n        if (obj.ttl <= 0s) {\n            set resp.http.X-Cache = \"STALE\";\n        } else {\n            set resp.http.X-Cache = \"HIT\";\n        }\n    } else {\n        set resp.http.X-Cache = \"MISS\";\n    }\n}\n" %}
      {%- var vclHash = sha256(vcl) %}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ vSvc }}-vcl
        namespace: {{ vNs }}
        labels:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
          app.kubernetes.io/managed-by: haptic
      data:
        default.vcl: |
      {{ vcl | indent(4, true) }}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ vSvc }}
        namespace: {{ vNs }}
        labels:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
          app.kubernetes.io/managed-by: haptic
      spec:
        clusterIP: None
        selector:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
        ports:
          - name: http
            port: {{ vPort }}
            targetPort: 6081
      ---
      # Dedicated internal Service for the Varnish backend-fetch (loopback)
      # origin. Gives Varnish a stable name for HAProxy's dedicated backend-fetch
      # frontend, targeting the HAProxy fleet on the loopback port. ClusterIP,
      # never a LoadBalancer (it must not be externally reachable); the haproxy
      # NetworkPolicy restricts this port to Varnish. (A YAML `#` comment, not a
      # Scriggo `{#- -#}` one — the stripping form would fuse `---` and
      # `apiVersion` into one line and break the multi-document parse.)
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ originSvcName }}
        namespace: {{ ctrlNs }}
        labels:
          app.kubernetes.io/name: haptic-cache-origin
          app.kubernetes.io/managed-by: haptic
      spec:
        type: ClusterIP
        selector:
        {%- for k, v := range haproxySelector %}
          {{ k }}: {{ tostring(v) }}
        {%- end %}
        ports:
          - name: cache-origin
            port: {{ loopbackPort }}
            targetPort: {{ loopbackPort }}
      ---
      {%- if workload == "deployment" %}
      apiVersion: apps/v1
      kind: Deployment
      {%- else %}
      apiVersion: apps/v1
      kind: StatefulSet
      {%- end %}
      metadata:
        name: {{ vSvc }}
        namespace: {{ vNs }}
        labels:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
          app.kubernetes.io/managed-by: haptic
      spec:
        {%- if autoscaling != "true" %}
        replicas: {{ replicas }}
        {%- end %}
        {%- if workload != "deployment" %}
        serviceName: {{ vSvc }}
        podManagementPolicy: Parallel
        {%- end %}
        selector:
          matchLabels:
            app.kubernetes.io/name: haptic-varnish-cache
        template:
          metadata:
            labels:
              app.kubernetes.io/name: haptic-varnish-cache
              app.kubernetes.io/instance: {{ vSvc }}
            annotations:
              haproxy-haptic.org/vcl-checksum: "{{ vclHash }}"
          spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: haptic-varnish-cache
                          app.kubernetes.io/instance: {{ vSvc }}
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: haptic-varnish-cache
                    app.kubernetes.io/instance: {{ vSvc }}
            containers:
              - name: varnish
                image: {{ img }}
                imagePullPolicy: {{ imagePullPolicy }}
                command: ["varnishd"]
                args: ["-F", "-a", ":6081", "-f", "/etc/varnish/default.vcl", "-s", "malloc,{{ malloc }}"]
                resources:
                  requests:
                    # A CPU request is required for the autoscaling HPA to compute
                    # utilization; keep the memory limit above malloc + overhead.
                    cpu: {{ cpuReq }}
                    memory: {{ memReq }}
                  limits:
                    memory: {{ memLim }}
                ports:
                  - name: http
                    containerPort: 6081
                volumeMounts:
                  - name: vcl
                    mountPath: /etc/varnish
                readinessProbe:
                  tcpSocket:
                    port: 6081
                  initialDelaySeconds: 2
                  periodSeconds: 5
                livenessProbe:
                  tcpSocket:
                    port: 6081
                  initialDelaySeconds: 5
                  periodSeconds: 10
            volumes:
              - name: vcl
                configMap:
                  name: {{ vSvc }}-vcl
      {%- if autoscaling == "true" %}
      {%- var minR = extraContext | dig("cache", "varnish", "autoscaling", "minReplicas") | fallback("2") | tostring() %}
      {%- var maxR = extraContext | dig("cache", "varnish", "autoscaling", "maxReplicas") | fallback("6") | tostring() %}
      {%- var cpuTarget = extraContext | dig("cache", "varnish", "autoscaling", "targetCPUUtilizationPercentage") | fallback("70") | tostring() %}
      {%- var scaleDownWindow = extraContext | dig("cache", "varnish", "autoscaling", "scaleDownStabilizationSeconds") | fallback("600") | tostring() %}
      ---
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: {{ vSvc }}
        namespace: {{ vNs }}
        labels:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
          app.kubernetes.io/managed-by: haptic
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: {% if workload == "deployment" %}Deployment{% else %}StatefulSet{% end %}
          name: {{ vSvc }}
        minReplicas: {{ minR }}
        maxReplicas: {{ maxR }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ cpuTarget }}
        behavior:
          scaleDown:
            # A scale event re-maps ~1/(N±1) of keys to a cold shard; a generous
            # window keeps the HPA from thrashing a warm cache.
            stabilizationWindowSeconds: {{ scaleDownWindow }}
      {%- end %}
      {%- if pdbEnabled == "true" %}
      ---
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: {{ vSvc }}
        namespace: {{ vNs }}
        labels:
          app.kubernetes.io/name: haptic-varnish-cache
          app.kubernetes.io/instance: {{ vSvc }}
          app.kubernetes.io/managed-by: haptic
      spec:
        maxUnavailable: {{ pdbMaxUnavailable }}
        selector:
          matchLabels:
            app.kubernetes.io/name: haptic-varnish-cache
            app.kubernetes.io/instance: {{ vSvc }}
      {%- end %}
      {%- end %}
