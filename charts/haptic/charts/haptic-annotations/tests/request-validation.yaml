# haptic-annotations library — API-gateway JSON request validation tests.
# Covers schema source resolution, plugin TOML schema blocks, request-schema.map
# production, SPOE dispatch, and render-time guardrails.
validationTests:
  test-haptic-request-validation-configmap:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request-schema-configmap → schema TOML block, packed map, body-size gate, SPOE dispatch
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: default
            name: api-schema
          data:
            schema.json: |
              {"type":"object","required":["name"],"properties":{"name":{"type":"string"}}}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-cm
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
              haproxy-haptic.org/request-schema-content-types: "application/json,application/merge-patch+json"
              haproxy-haptic.org/request-schema-max-body-size: "4096"
              haproxy-haptic.org/request-schema-fail-open: "false"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-cm.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-cm-alt
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
              haproxy-haptic.org/request-schema-content-types: "application/vnd.api+json"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-cm-alt.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:request-schema.map
        pattern: "default/validate-cm configmap/default/api-schema/schema\\.json/application/json,application/merge-patch\\+json 4096 false application/json,application/merge-patch\\+json"
      - type: contains
        target: map:request-schema.map
        pattern: "default/validate-cm-alt configmap/default/api-schema/schema\\.json/application/vnd\\.api\\+json 8192 false application/vnd\\.api\\+json"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "\\[plugins\\.params\\.schemas\\.\"configmap/default/api-schema/schema\\.json/application/json,application/merge-patch\\+json\"\\]"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "\\[plugins\\.params\\.schemas\\.\"configmap/default/api-schema/schema\\.json/application/vnd\\.api\\+json\"\\]"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "schema_base64 = \"eyJ0eXBlIjoib2JqZWN0IiwicmVxdWlyZWQiOlsibmFtZSJdLCJwcm9wZXJ0aWVzIjp7Im5hbWUiOnsidHlwZSI6InN0cmluZyJ9fX0K\""
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-message validate-request"
      - type: contains
        target: file:spoe.conf
        pattern: "schema_id=var\\(txn\\.req_schema_id\\).*body=req\\.body.*content_type=req\\.hdr\\(Content-Type\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "tune.bufsize 16384"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 100ms if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 400 if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\} \\{ req\\.hdr_cnt\\(Content-Length\\) gt 1 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 411 if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\} !\\{ req\\.hdr\\(Content-Length\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 413 if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\} \\{ var\\(txn\\.req_schema_body_len\\),sub\\(txn\\.req_schema_body_size\\) -m int lt 0 \\}"
      - type: not_contains
        target: haproxy.cfg
        pattern: "option http-buffer-request"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 413 if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub validate-request-group"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 422 if \\{ var\\(txn\\.req_schema_id\\) -m found \\} \\{ method POST PUT PATCH \\} !\\{ var\\(txn\\.hub\\.api_gateway\\.allowed\\) -m found \\}"

  test-haptic-request-validation-secret:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request-schema-secret uses Secret data as base64 schema payload
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: secret-schema
          data:
            schema.json: eyJ0eXBlIjoib2JqZWN0In0=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-secret
            annotations:
              haproxy-haptic.org/request-schema-secret: "secret-schema:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-secret.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:request-schema.map
        pattern: "default/validate-secret secret/default/secret-schema/schema\\.json/application/json 8192 false application/json"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "\\[plugins\\.params\\.schemas\\.\"secret/default/secret-schema/schema\\.json/application/json\"\\]"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "schema_base64 = \"eyJ0eXBlIjoib2JqZWN0In0=\""

  test-haptic-request-validation-requires-opt-in:
    _helm_skip_test: '{{ if .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request-schema annotations fail loudly when request validation is not enabled
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: default
            name: api-schema
          data:
            schema.json: |
              {"type":"object"}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-disabled
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-disabled.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "request validation is not enabled"

  test-haptic-request-validation-rejects-two-sources:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request validation requires exactly one schema source
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-two-sources
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
              haproxy-haptic.org/request-schema-secret: "secret-schema:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-two-sources.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "requires exactly one schema source"

  test-haptic-request-validation-missing-key:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: missing ConfigMap schema key fails render-time
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: default
            name: api-schema
          data:
            other.json: |
              {"type":"object"}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-missing-key
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-missing-key.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "empty or missing 'schema\\.json' data key"

  test-haptic-request-validation-max-body-bounded:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request-schema-max-body-size is bounded to protect HAProxy/plugin memory
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: default
            name: api-schema
          data:
            schema.json: |
              {"type":"object"}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-huge-body
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
              haproxy-haptic.org/request-schema-max-body-size: "1048577"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-huge-body.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Must be between 1 and 1048576 bytes"

  test-haptic-request-validation-max-body-fits-buffer:
    _helm_skip_test: '{{ if not .Values.controller.apiGateway.validation.enabled }}true{{ end }}'
    description: request-schema-max-body-size must fit the HAProxy validation buffer
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: default
            name: api-schema
          data:
            schema.json: |
              {"type":"object"}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: validate-buffer-overflow
            annotations:
              haproxy-haptic.org/request-schema-configmap: "api-schema:schema.json"
              haproxy-haptic.org/request-schema-max-body-size: "9000"
          spec:
            ingressClassName: haptic
            rules:
              - host: validate-buffer-overflow.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Must not exceed controller.apiGateway.validation.bufferSize minus controller.apiGateway.validation.bufferHeadroomBytes"
