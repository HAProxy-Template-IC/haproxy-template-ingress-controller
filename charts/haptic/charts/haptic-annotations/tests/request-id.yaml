# HAPTIC-native annotation library — request-id validation tests.
validationTests:
  test-haptic-request-id:
    description: >-
      request-id emits unique-id-format once in defaults and a host-scoped
      set-header per Ingress; accept-inbound adds the "only if absent" guard and
      the default header name is X-Request-ID.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rid-overwrite
            annotations:
              haproxy-haptic.org/request-id: "true"
              haproxy-haptic.org/request-id-header: "X-Trace-Id"
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: dummy, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rid-inbound
            annotations:
              haproxy-haptic.org/request-id: "true"
              haproxy-haptic.org/request-id-accept-inbound: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: b.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: dummy, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'unique-id-format %\[uuid\(7\)\]'
        description: >-
          The id is an opaque RFC 9562 UUIDv7 owned by base.yaml, not this
          library. It is emitted for every install, not only when an Ingress opts
          in, because the access log's req_id field reads it.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'unique-id-format.*%ci'
        description: >-
          Privacy regression guard — the id must never embed the client IP
          (personal data) or the frontend address, because it is forwarded
          upstream and echoed to clients.
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  unique-id-format '
        expected: "1"
        description: >-
          Exactly one unique-id-format in `defaults`; a second one from another
          library would be a duplicate directive.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Trace-Id %\\[unique-id\\] if"
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-header X-Request-ID %\[unique-id\] if .* !\{ req.hdr\(X-Request-ID\) -m reg \^\[A-Za-z0-9\._:-\]\{1,128\}\$ \}'
        description: >-
          accept-inbound preserves a client id only when it is a well-formed
          identifier; anything else is replaced, so a client cannot choose an
          arbitrary or oversized correlation id for the backend's logs.
