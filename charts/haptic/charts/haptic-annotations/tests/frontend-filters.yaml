# HAPTIC-native annotation library — frontend-filters validation tests.
# Covers forwardfor, request/response-set-header + src-ip-header + request-capture,
# CORS, allow/deny-list access control, and response-cookie / response-location-rewrite.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:

  test-haptic-forwardfor:
    description: haproxy-haptic.org/forwardfor=update emits a host-scoped X-Forwarded-For set-header (haproxy-ingress semantics)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ff-ingress
            annotations:
              haproxy-haptic.org/forwardfor: "update"
          spec:
            ingressClassName: haptic
            rules:
              - host: ff.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Forwarded-For %\\[src\\] if"

  test-haptic-header-manipulation:
    description: request/response-set-header (newline form), src-ip-header, and request-capture with a custom length
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-ingress
            annotations:
              haproxy-haptic.org/request-set-header: |-
                X-Custom-Req req-value
                X-Env production
              haproxy-haptic.org/response-set-header: |-
                X-Custom-Resp resp-value
              haproxy-haptic.org/src-ip-header: "X-Real-IP"
              haproxy-haptic.org/request-capture: |-
                X-Forwarded-Proto
                Referer
              haproxy-haptic.org/request-capture-len: "256"
          spec:
            ingressClassName: haptic
            rules:
              - host: hdr.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # Header modifiers are reload-free: the value lives in ing-reqhdr.map /
      # ing-reshdr.map keyed on the backend, read by one static line per name.
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-custom-req req-value'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-env production'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-custom-resp resp-value'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header X-Custom-Req %\[var\(txn\.backend_name\),concat\(\|set\|x-custom-req\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response set-header X-Custom-Resp %\[var\(txn\.backend_name\),concat\(\|set\|x-custom-resp\),map\([^)]*ing-reshdr\.map\),url_dec\(1\)\]'}
      # The value never appears as a per-backend directive (negative control).
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header X-Custom-Req "req-value"'}
      - {type: contains, target: haproxy.cfg, pattern: "http-request set-src hdr\\(X-Real-IP\\) if"}
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Forwarded-Proto len 256"}

  test-haptic-header-name-shared-across-ingresses:
    description: Two ingresses setting the same header name share one static line per frontend, spelled the lexicographically smallest of the two — which here is the SECOND ingress's, so the choice is a rule, not ingress order. A second ingress reusing a header name is a map entry, never a new config line.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-a, annotations: {haproxy-haptic.org/request-set-header: "x-shared from-a"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-b, annotations: {haproxy-haptic.org/request-set-header: "X-Shared from-b"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: b.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-a_svc_echo_80\|set\|x-shared from-a'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-b_svc_echo_80\|set\|x-shared from-b'}
      # One static line per rendered frontend (h1/h2c/https), not one per ingress.
      - {type: match_count, target: haproxy.cfg, pattern: 'set-header X-Shared %\[var\(txn\.backend_name\),concat\(\|set\|x-shared\)', expected: "3"}
      # Negative control: the lowercase spelling from the first ingress loses.
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header x-shared %'}

  test-haptic-cors:
    description: cors-enable emits the shared CORS macro output (http-after-response Allow-Origin + preflight 204)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-origin: "https://app.example.com"
              haproxy-haptic.org/cors-allow-methods: "GET, POST, OPTIONS"
              haproxy-haptic.org/cors-allow-credentials: "true"
              haproxy-haptic.org/cors-expose-headers: "X-Total-Count"
              haproxy-haptic.org/cors-max-age: "600"
          spec:
            ingressClassName: haptic
            rules:
              - host: cors.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Origin"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Credentials 'true'"
      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 204 if"}

  test-haptic-access-control:
    description: allowlist/denylist-source-range emit CIDR ACLs (aclPrefix haptic) plus host-scoped deny rules
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ac-ingress
            annotations:
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8,192.168.1.0/24"
              haproxy-haptic.org/denylist-source-range: "203.0.113.5"
          spec:
            ingressClassName: haptic
            rules:
              - host: ac.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "acl haptic_allowlist_default_ac-ingress src 10\\.0\\.0\\.0/8 192\\.168\\.1\\.0/24"
      - type: contains
        target: haproxy.cfg
        pattern: "acl haptic_denylist_default_ac-ingress src 203\\.0\\.113\\.5"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny if .* !haptic_allowlist_default_ac-ingress"

  test-haptic-proxy-cookie-and-redirect:
    description: response-cookie-domain/path and response-location-rewrite-from/to rewrite upstream Set-Cookie and Location/Refresh headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: px-ingress
            annotations:
              haproxy-haptic.org/response-cookie-domain: "old.example.com new.example.com"
              haproxy-haptic.org/response-cookie-path: "/old /new"
              haproxy-haptic.org/response-location-rewrite-from: "http://old.svc"
              haproxy-haptic.org/response-location-rewrite-to: "https://new.svc"
          spec:
            ingressClassName: haptic
            rules:
              - host: px.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-response replace-header Set-Cookie .*Domain=new\\.example\\.com"
      - {type: contains, target: haproxy.cfg, pattern: "http-response replace-header Set-Cookie .*Path=/new"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-response replace-header Location http://old\\\\.svc https://new\\.svc if"
      - {type: contains, target: haproxy.cfg, pattern: "http-response replace-header Refresh"}

  test-haptic-security-rules-scoped-by-route-not-host:
    description: >-
      CIDR access control, X-Forwarded-For and src-ip-header must be enforced on
      a wildcard host and on an Ingress with no host. All three were gated on an
      exact Host match, so a wildcard rule host never matched a concrete request
      host and a host-less rule emitted nothing at all — leaving the route served
      with the control absent.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: scoped-wild
            annotations:
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8"
              haproxy-haptic.org/forwardfor: "update"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.scoped.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: scoped-hostless
            annotations:
              haproxy-haptic.org/denylist-source-range: "192.0.2.0/24"
              haproxy-haptic.org/forwardfor: "update"
          spec:
            ingressClassName: haptic
            rules:
              - http:
                  paths:
                    - { path: /scoped-hostless, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # CIDR allow/deny reaches both shapes.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny if \{ var\(txn\.resource_id\) -m str default/scoped-wild \} !haptic_allowlist_default_scoped-wild'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny if \{ var\(txn\.resource_id\) -m str default/scoped-hostless \} haptic_denylist_default_scoped-hostless'
      # XFF overwrite reaches both shapes — else a forged XFF survives.
      - type: contains
        target: haproxy.cfg
        pattern: 'set-header X-Forwarded-For %\[src\] if \{ var\(txn\.resource_id\) -m str default/scoped-wild \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-header X-Forwarded-For %\[src\] if \{ var\(txn\.resource_id\) -m str default/scoped-hostless \}'
      # No enforcement may be gated on an exact host match again.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request deny if \{ var\(txn\.host\) -m str \*'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'set-header X-Forwarded-For %\[src\] if \{ var\(txn\.host\)'
