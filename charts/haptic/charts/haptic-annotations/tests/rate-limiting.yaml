# haptic-annotations library — rate-limiting validation tests.
# Covers per-source request/connection caps (rps/rpm/connections), the tunable
# period/size/status-code + allowlist, precedence, and the bwlim-out download
# throttle (download-bandwidth-limit / download-bandwidth-limit-after).
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}
  specBwExampleCom: &specBwExampleCom
    ingressClassName: haptic
    rules:
      - host: bw.example.com
        http:
          paths:
            - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
  extracontextCacheVarnish: &extracontextCacheVarnish
    cache: {varnish: {enabled: true}}

validationTests:
  test-haptic-rate-limit-rps:
    description: rate-limit-rps with tunable period/size/status-code and allowlist
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rps-ingress
            annotations:
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/rate-limit-period: "5s"
              haproxy-haptic.org/rate-limit-size: "200k"
              haproxy-haptic.org/rate-limit-status-code: "429"
              haproxy-haptic.org/rate-limit-allowlist: "10.0.0.0/8,192.168.0.0/16"
          spec:
            ingressClassName: haptic
            rules:
              - host: rps.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type ip size 200k expire 5s store http_req_rate"
      - {type: contains, target: haproxy.cfg, pattern: "http-request track-sc0 src"}
      - {type: contains, target: haproxy.cfg, pattern: "deny_status 429"}
      - {type: contains, target: haproxy.cfg, pattern: "src 10.0.0.0/8 192.168.0.0/16"}

  test-haptic-rate-limit-rpm-precedence:
    description: rate-limit-rps wins over rate-limit-rpm; rpm is ignored
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rpm-ingress
            annotations:
              haproxy-haptic.org/rate-limit-rps: "20"
              haproxy-haptic.org/rate-limit-rpm: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: rpm.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "expire 1s store http_req_rate"}
      - {type: contains, target: haproxy.cfg, pattern: "sc_http_req_rate.0. gt 20"}
      - {type: contains, target: haproxy.cfg, pattern: "rate-limit-rpm ignored"}

  test-haptic-rate-limit-connections:
    description: rate-limit-connections uses the conn_cur counter
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: conn-ingress
            annotations:
              haproxy-haptic.org/rate-limit-connections: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: conn.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "store conn_cur peers localinstance"}
      - {type: contains, target: haproxy.cfg, pattern: "sc_conn_cur.0. gt 100"}

  test-haptic-bandwidth-limit-per-stream:
    description: >-
      Without a scope, download- and upload-bandwidth-limit emit per-stream bwlim-out
      and bwlim-in filters and no stick-table. Also pins that no min-size is emitted:
      the deleted -after annotation mapped to it, but min-size is HAProxy's
      forward-chunk size (manual 9.7), not nginx's "throttle after N bytes".
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "100k"
              haproxy-haptic.org/upload-bandwidth-limit: "50k"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-out haptic_bwlim_out_default_bw-ingress default-limit 100k default-period 1s"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-in haptic_bwlim_in_default_bw-ingress default-limit 50k default-period 1s"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-bandwidth-limit haptic_bwlim_out_default_bw-ingress"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-bandwidth-limit haptic_bwlim_in_default_bw-ingress"
      - {type: not_contains, target: haproxy.cfg, pattern: "filter bwlim-(in|out) .*min-size"}
      - type: not_contains
        target: haproxy.cfg
        description: the per-stream form must not declare a stick-table
        pattern: "stick-table type (ip|integer) size 100k expire 60s store bytes_in_rate"

  test-haptic-bandwidth-limit-scope-client:
    description: >-
      bandwidth-limit-scope client shares one budget across all of a source IP's
      streams via a backend-local ip stick-table keyed on src.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/upload-bandwidth-limit: "1m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type ip size 100k expire 60s store bytes_in_rate\\(1s\\),bytes_out_rate\\(1s\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-out haptic_bwlim_out_default_bw-ingress limit 10m key src"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-in haptic_bwlim_in_default_bw-ingress limit 1m key src"
      - type: not_contains
        target: haproxy.cfg
        description: a shared filter takes limit/key, never the per-stream default-limit form
        pattern: "haptic_bwlim_\\w+_default_bw-ingress default-limit"

  test-haptic-bandwidth-limit-scope-service:
    description: >-
      bandwidth-limit-scope service caps the whole backend with an integer
      stick-table keyed on be_id, so all clients of the route share one budget.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "service"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type integer size 100k expire 60s store bytes_in_rate\\(1s\\),bytes_out_rate\\(1s\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-out haptic_bwlim_out_default_bw-ingress limit 10m key be_id"

  test-haptic-bandwidth-limit-scope-conflicts-with-rate-limit:
    description: >-
      A shared bandwidth scope plus a per-source rate-limit cap would put two
      stick-tables in one backend, which HAProxy rejects outright. The render must
      fail with an actionable message rather than emit a config that can't start.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
              haproxy-haptic.org/rate-limit-rps: "10"
          spec: *specBwExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: "HAProxy allows one stick-table per backend" }

  test-haptic-bandwidth-limit-scope-invalid:
    description: An unknown bandwidth-limit-scope value fails the render and lists the valid ones.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "everything"
          spec: *specBwExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: "Valid: stream, client, service" }

  test-haptic-rate-limit-cache-route-client-leg:
    description: >-
      On a cache-enabled route the per-pod limiter moves to the client leg
      (issue #134): a per-route table proxy plus resource_id-scoped track/deny
      in the frontend, emitted before the varnish_cache switch so cache hits
      consume the budget too. The application backend keeps no copy — on the
      origin leg src would be the Varnish pod. The non-cached twin route pins
      that the backend-copy pattern still matches real output.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-rps
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/rate-limit-rpm: "100"
              haproxy-haptic.org/rate-limit-period: "5s"
              haproxy-haptic.org/rate-limit-size: "200k"
              haproxy-haptic.org/rate-limit-status-code: "403"
              haproxy-haptic.org/rate-limit-allowlist: "10.0.0.0/8"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-rps.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-conn
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-connections: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-conn.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain-rps
            annotations:
              haproxy-haptic.org/rate-limit-rps: "10"
          spec:
            ingressClassName: haptic
            rules:
              - host: plain-rps.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend haptic_rl_tbl_default_cached-rps\\n\\s+stick-table type ip size 200k expire 5s store http_req_rate\\(5s\\) peers localinstance"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request track-sc0 src table haptic_rl_tbl_default_cached-rps if \\{ var\\(txn\\.resource_id\\) -m str default/cached-rps \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 403 if \\{ var\\(txn\\.resource_id\\) -m str default/cached-rps \\} \\{ sc_http_req_rate\\(0\\) gt 10 \\} !\\{ src 10\\.0\\.0\\.0/8 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "backend haptic_rl_tbl_default_cached-conn\\n\\s+stick-table type ip size 100k expire 30s store conn_cur peers localinstance"
      - type: contains
        target: haproxy.cfg
        pattern: "if \\{ var\\(txn\\.resource_id\\) -m str default/cached-conn \\} \\{ sc_conn_cur\\(0\\) gt 100 \\}"
      - type: contains
        target: haproxy.cfg
        description: rps wins over rpm on the client leg too, and the ignored cap is recorded
        pattern: "cache-enabled route \\(default/cached-rps\\) - rate-limit-rpm ignored"
      - type: match_order
        target: haproxy.cfg
        description: the client-leg deny must precede the varnish_cache switch
        patterns:
          - "http-request track-sc0 src table haptic_rl_tbl_default_cached-rps"
          - "use_backend varnish_cache"
      - type: not_contains
        target: haproxy.cfg
        description: no backend copy — on the origin leg it would key on the Varnish pod IP
        pattern: "# haptic/rate-limiting \\(default/cached-rps\\)"
      - type: contains
        target: haproxy.cfg
        description: positive twin — the backend-copy pattern matches a non-cached route
        pattern: "# haptic/rate-limiting \\(default/plain-rps\\)"

  test-haptic-rate-limit-cache-route-invalid-threshold:
    description: >-
      Skipping the backend copy for a cache-enabled route must not skip its
      validation — a bad threshold still fails the render.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bad
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/rate-limit-rps: "abc"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bad.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid rate-limit threshold 'abc'" }

  test-haptic-bandwidth-limit-cache-route-client-leg:
    description: >-
      On a cache-enabled route the bwlim filters move to the client frontend
      (issue #134), so responses served straight from varnish_cache are
      throttled too. Shared scopes get a per-route table proxy; the stream
      scope keeps the per-stream form. The application backend keeps no copy.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bw-client
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/upload-bandwidth-limit: "1m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bw-client.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bw-stream
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bw-stream.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain-bw
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec:
            ingressClassName: haptic
            rules:
              - host: plain-bw.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-out haptic_bwlim_out_default_cached-bw-client limit 10m key src table haptic_bwlim_tbl_default_cached-bw-client"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-in haptic_bwlim_in_default_cached-bw-client limit 1m key src table haptic_bwlim_tbl_default_cached-bw-client"
      - type: contains
        target: haproxy.cfg
        pattern: "backend haptic_bwlim_tbl_default_cached-bw-client\\n\\s+stick-table type ip size 100k expire 60s store bytes_in_rate\\(1s\\),bytes_out_rate\\(1s\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-bandwidth-limit haptic_bwlim_out_default_cached-bw-client if \\{ var\\(txn\\.resource_id\\) -m str default/cached-bw-client \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "filter bwlim-out haptic_bwlim_out_default_cached-bw-stream default-limit 100k default-period 1s"
      - type: match_order
        target: haproxy.cfg
        description: the client-leg limit assignment must precede the varnish_cache switch
        patterns:
          - "http-request set-bandwidth-limit haptic_bwlim_out_default_cached-bw-client"
          - "use_backend varnish_cache"
      - type: not_contains
        target: haproxy.cfg
        description: no backend copy — cache hits would bypass it entirely
        pattern: "# haptic/bandwidth-limit \\(default/cached-bw-client\\)"
      - type: contains
        target: haproxy.cfg
        description: positive twin — the backend-copy pattern matches a non-cached route
        pattern: "# haptic/bandwidth-limit \\(default/plain-bw\\)"

  test-haptic-rate-limit-cache-route-coexists-with-bandwidth-scope:
    description: >-
      On a cache-enabled route a shared bandwidth scope and a per-source cap
      may coexist: each client-leg limiter has its own table proxy, so the
      one-stick-table-per-backend refusal that applies to non-cached routes
      does not bite here.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-both
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-both.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend haptic_rl_tbl_default_cached-both"}
      - {type: contains, target: haproxy.cfg, pattern: "backend haptic_bwlim_tbl_default_cached-both"}

  test-haptic-bandwidth-limit-with-compression:
    description: >-
      Regression pin: HAProxy makes an explicit filter line mandatory for compression
      as soon as another filter is declared on the proxy, so compress-enable plus a
      bandwidth limit used to render a config HAProxy refused to start. haproxy_valid
      catches that. match_order pins compression ahead of the bwlim filter, so the
      download cap meters the compressed bytes that go on the wire.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/compress-enable: "true"
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "filter compression"
          - "filter bwlim-out haptic_bwlim_out_default_bw-ingress"
      - {type: contains, target: haproxy.cfg, pattern: "compression algo gzip"}
