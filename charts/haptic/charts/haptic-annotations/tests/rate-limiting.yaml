# haptic-annotations library — rate-limiting validation tests.
# Covers per-source request/connection caps (rps/rpm/connections), the tunable
# period/size/status-code + allowlist, precedence, and the bwlim-out download
# throttle (download-bandwidth-limit / download-bandwidth-limit-after).
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}
  specBwExampleCom: &specBwExampleCom
    ingressClassName: haptic
    rules:
      - host: bw.example.com
        http:
          paths:
            - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
  extracontextCacheVarnish: &extracontextCacheVarnish
    cache: {varnish: {enabled: true}}

validationTests:
  test-haptic-rate-limit-rps:
    description: >-
      rate-limit-rps with tunable period/size/status-code and allowlist: the route
      lands in haptic-rate-limit-routes.map, the window gets one shared string-keyed
      table sized to the largest request, the allowlist is the one per-route line on
      the frontend, and the backend section stays plain.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rps-ingress
            annotations:
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/rate-limit-period: "5s"
              haproxy-haptic.org/rate-limit-size: "200k"
              haproxy-haptic.org/rate-limit-status-code: "429"
              haproxy-haptic.org/rate-limit-allowlist: "10.0.0.0/8,192.168.0.0/16"
          spec:
            ingressClassName: haptic
            rules:
              - host: rps.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # No bandwidth route in the fixture: none of the bandwidth machinery is emitted.
      - {type: not_contains, target: haproxy.cfg, pattern: 'filter bwlim-'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'backend haptic_bw_tbl'}
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/rps-ingress req 5s 10 429$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend haptic_rl_tbl_req_5s from haptic-be-\w+$(?:\n[ \t]+guid [^\n]+)?\n[ \t]+stick-table type string len 340 size 204800 expire 5s store http_req_rate\(5s\) peers localinstance$'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request track-sc1 var\(txn\.lrl_key\) table haptic_rl_tbl_req_5s if \{ var\(txn\.lrl_counter\) -m str req \} \{ var\(txn\.lrl_window\) -m str 5s \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 429 if \{ var\(txn\.lrl_status\) -m str 429 \} \{ var\(txn\.denied_by\) -m str rate_limit_local \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.lrl_allow\) bool\(true\) if \{ var\(txn\.resource_id\) -m str default/rps-ingress \} \{ src 10\.0\.0\.0/8 192\.168\.0\.0/16 \}'}
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_rps-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-rate-limit-rpm-precedence:
    description: rate-limit-rps wins over rate-limit-rpm; rpm is ignored
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rpm-ingress
            annotations:
              haproxy-haptic.org/rate-limit-rps: "20"
              haproxy-haptic.org/rate-limit-rpm: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: rpm.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/rpm-ingress req 1s 20 429$'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_rl_tbl_req_1s'}
      - {type: contains, target: haproxy.cfg, pattern: 'expire 1s store http_req_rate\(1s\)'}
      - {type: contains, target: events, pattern: "RateLimitCapIgnored"}
      - {type: contains, target: events, pattern: "rate-limit-rpm ignored"}

  test-haptic-rate-limit-connections:
    description: rate-limit-connections uses the conn_cur counter
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: conn-ingress
            annotations:
              haproxy-haptic.org/rate-limit-connections: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: conn.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/conn-ingress conn 30s 100 429$'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_rl_tbl_conn_30s'}
      - {type: contains, target: haproxy.cfg, pattern: 'expire 30s store conn_cur peers localinstance'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request track-sc1 var\(txn\.lrl_key\) table haptic_rl_tbl_conn_30s if \{ var\(txn\.lrl_counter\) -m str conn \} \{ var\(txn\.lrl_window\) -m str 30s \}'}
      - {type: contains, target: haproxy.cfg, pattern: '\{ var\(txn\.lrl_counter\) -m str conn \} \{ sc_conn_cur\(1\),sub\(txn\.lrl_threshold\) -m int gt 0 \}'}

  test-haptic-bandwidth-limit-per-stream:
    description: >-
      Without a scope, download- and upload-bandwidth-limit ride the two per-stream
      filters every frontend carries, with the route's rates (in bytes) taken from
      haptic-bandwidth-routes.map; no shared-scope filter is declared. Also pins
      that no min-size is emitted: the deleted -after annotation mapped to it, but
      min-size is HAProxy's forward-chunk size (manual 9.7), not nginx's "throttle
      after N bytes".
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "100k"
              haproxy-haptic.org/upload-bandwidth-limit: "50k"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/bw-ingress 102400 51200 stream$'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-out haptic_bw_out default-limit 1m default-period 1s'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-in haptic_bw_in default-limit 1m default-period 1s'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-bandwidth-limit haptic_bw_out limit var\(txn\.bw_down\) if \{ var\(txn\.bw_scope\) -m str stream \} !\{ var\(txn\.bw_down\) -m str _ \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-bandwidth-limit haptic_bw_in limit var\(txn\.bw_up\) if \{ var\(txn\.bw_scope\) -m str stream \} !\{ var\(txn\.bw_up\) -m str _ \}'
      - {type: not_contains, target: haproxy.cfg, pattern: 'filter bwlim-(in|out) .*min-size'}
      - type: not_contains
        target: haproxy.cfg
        description: a stream-only fleet declares no shared-scope filter
        pattern: 'filter bwlim-(in|out) haptic_bw_(in|out)_(client|service)_'
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_bw-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-bandwidth-limit-scope-client:
    description: >-
      bandwidth-limit-scope client shares one budget across all of a source IP's
      streams: a shared filter per (direction, rate) meters into the one string-keyed
      table under "<route>|<src>".
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/upload-bandwidth-limit: "1m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/bw-ingress 10485760 1048576 client$'}
      - {type: contains, target: haproxy.cfg, pattern: 'stick-table type string len 340 size 100k expire 60s store bytes_in_rate\(1s\),bytes_out_rate\(1s\)'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-out haptic_bw_out_client_10485760 limit 10485760 key var\(txn\.bw_key\) table haptic_bw_tbl'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-in haptic_bw_in_client_1048576 limit 1048576 key var\(txn\.bw_key\) table haptic_bw_tbl'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var-fmt\(txn\.bw_key\) %\[var\(txn\.resource_id\)\]\|%\[src\] if \{ var\(txn\.bw_scope\) -m str client \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-bandwidth-limit haptic_bw_out_client_10485760 if \{ var\(txn\.bw_scope\) -m str client \} \{ var\(txn\.bw_down\) -m str 10485760 \}'}
      - type: not_contains
        target: haproxy.cfg
        description: a shared filter takes limit/key, never the per-stream default-limit form
        pattern: 'haptic_bw_(in|out)_client_\d+ default-limit'

  test-haptic-bandwidth-limit-scope-service:
    description: >-
      bandwidth-limit-scope service caps the whole route: the shared filter meters
      into the one table under the route id, so all clients of the route share one
      budget.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "service"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/bw-ingress 10485760 _ service$'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-out haptic_bw_out_service_10485760 limit 10485760 key var\(txn\.bw_key\) table haptic_bw_tbl'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.bw_key\) var\(txn\.resource_id\) if \{ var\(txn\.bw_scope\) -m str service \}'}

  test-haptic-bandwidth-limit-scope-coexists-with-rate-limit:
    description: >-
      A shared bandwidth scope and a per-source rate-limit cap coexist on one route:
      each limiter meters into its own shared table proxy, so the one-stick-table
      limit of a backend never applies.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
              haproxy-haptic.org/rate-limit-rps: "10"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/bw-ingress req 1s 10 429$'}
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/bw-ingress 10485760 _ client$'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_rl_tbl_req_1s'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_bw_tbl'}

  test-haptic-bandwidth-limit-scope-invalid:
    description: An unknown bandwidth-limit-scope value fails the render and lists the valid ones.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "everything"
          spec: *specBwExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: "Valid: stream, client, service" }

  test-haptic-rate-limit-cache-route-client-leg:
    description: >-
      The per-pod limiter runs on the client leg for every route, cache-enabled or
      not: the shared table proxies, the track and the deny sit in the frontend
      before the varnish_cache switch, so cache hits consume the budget too, and no
      backend carries a copy (on the origin leg src would be the Varnish pod).
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-rps
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/rate-limit-rpm: "100"
              haproxy-haptic.org/rate-limit-period: "5s"
              haproxy-haptic.org/rate-limit-size: "200k"
              haproxy-haptic.org/rate-limit-status-code: "403"
              haproxy-haptic.org/rate-limit-allowlist: "10.0.0.0/8"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-rps.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-conn
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-connections: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-conn.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain-rps
            annotations:
              haproxy-haptic.org/rate-limit-rps: "10"
          spec:
            ingressClassName: haptic
            rules:
              - host: plain-rps.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/cached-rps req 5s 10 403$'}
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/cached-conn conn 30s 100 429$'}
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/plain-rps req 1s 10 429$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend haptic_rl_tbl_req_5s from haptic-be-\w+$(?:\n[ \t]+guid [^\n]+)?\n[ \t]+stick-table type string len 340 size 204800 expire 5s store http_req_rate\(5s\) peers localinstance$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend haptic_rl_tbl_conn_30s from haptic-be-\w+$(?:\n[ \t]+guid [^\n]+)?\n[ \t]+stick-table type string len 340 size 102400 expire 30s store conn_cur peers localinstance$'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.lrl_allow\) bool\(true\) if \{ var\(txn\.resource_id\) -m str default/cached-rps \} \{ src 10\.0\.0\.0/8 \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 403 if \{ var\(txn\.lrl_status\) -m str 403 \} \{ var\(txn\.denied_by\) -m str rate_limit_local \}'}
      - {type: contains, target: events, pattern: "rate-limit-rpm ignored"}
      - type: match_order
        target: haproxy.cfg
        description: the client-leg track and deny must precede the varnish_cache switch
        patterns:
          - 'http-request track-sc1 var\(txn\.lrl_key\) table haptic_rl_tbl_req_5s'
          - 'http-request deny deny_status 403 if \{ var\(txn\.lrl_status\) -m str 403 \}'
          - 'use_backend varnish_cache'
      - type: not_contains
        target: haproxy.cfg
        description: no backend copy for any route
        pattern: '# haptic/rate-limiting \(default/'
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_plain-rps_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-rate-limit-cache-route-invalid-threshold:
    description: >-
      Skipping the backend copy for a cache-enabled route must not skip its
      validation — a bad threshold still fails the render.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bad
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/rate-limit-rps: "abc"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bad.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid rate-limit threshold 'abc'" }

  test-haptic-bandwidth-limit-cache-route-client-leg:
    description: >-
      Bandwidth limits run on the client frontend for every route, cache-enabled or
      not, so responses served straight from varnish_cache are throttled too. Shared
      scopes meter into the one shared table; the stream scope rides the per-stream
      filters. No backend carries a copy.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bw-client
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/upload-bandwidth-limit: "1m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bw-client.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-bw-stream
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-bw-stream.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain-bw
            annotations:
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec:
            ingressClassName: haptic
            rules:
              - host: plain-bw.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/cached-bw-client 10485760 1048576 client$'}
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/cached-bw-stream 102400 _ stream$'}
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/plain-bw 102400 _ stream$'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-out haptic_bw_out_client_10485760 limit 10485760 key var\(txn\.bw_key\) table haptic_bw_tbl'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-in haptic_bw_in_client_1048576 limit 1048576 key var\(txn\.bw_key\) table haptic_bw_tbl'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend haptic_bw_tbl from haptic-be-\w+$(?:\n[ \t]+guid [^\n]+)?\n[ \t]+stick-table type string len 340 size 100k expire 60s store bytes_in_rate\(1s\),bytes_out_rate\(1s\)$'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-bandwidth-limit haptic_bw_out_client_10485760 if \{ var\(txn\.bw_scope\) -m str client \} \{ var\(txn\.bw_down\) -m str 10485760 \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-bandwidth-limit haptic_bw_out limit var\(txn\.bw_down\) if \{ var\(txn\.bw_scope\) -m str stream \}'}
      - type: match_order
        target: haproxy.cfg
        description: the client-leg limit assignment must precede the varnish_cache switch
        patterns:
          - 'http-request set-bandwidth-limit haptic_bw_out_client_10485760'
          - 'use_backend varnish_cache'
      - type: not_contains
        target: haproxy.cfg
        description: no backend copy for any route
        pattern: '# haptic/bandwidth-limit \(default/'
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_plain-bw_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-rate-limit-cache-route-coexists-with-bandwidth-scope:
    description: >-
      On a cache-enabled route a shared bandwidth scope and a per-source cap coexist:
      each limiter meters into its own shared table proxy.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-both
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/download-bandwidth-limit: "10m"
              haproxy-haptic.org/bandwidth-limit-scope: "client"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-both.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/cached-both req 1s 10 429$'}
      - {type: contains, target: "map:haptic-bandwidth-routes.map", pattern: '(?m)^default/cached-both 10485760 _ client$'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_rl_tbl_req_1s'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend haptic_bw_tbl'}

  test-haptic-bandwidth-limit-with-compression:
    description: >-
      HAProxy makes an explicit filter line mandatory for compression as soon as
      another filter is declared on the proxy, so the frontend that carries the bwlim
      filters declares `filter compression` too; haproxy_valid catches a regression.
      match_order pins compression ahead of the bwlim filter, so the download cap
      meters the compressed bytes that go on the wire.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bw-ingress
            annotations:
              haproxy-haptic.org/compress-enable: "true"
              haproxy-haptic.org/download-bandwidth-limit: "100k"
          spec: *specBwExampleCom
    assertions:
      - type: haproxy_valid
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'filter compression'
          - 'filter bwlim-out haptic_bw_out default-limit'
      - {type: contains, target: haproxy.cfg, pattern: 'compression algo gzip'}

  test-haptic-rate-limit-status-code-not-deniable-rejected:
    description: >-
      deny_status only takes a status HAProxy has a built-in error page for; a
      418 used to pass the 3-digit check and break the whole config at load.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-teapot
            annotations:
              haproxy-haptic.org/rate-limit-rps: "10"
              haproxy-haptic.org/rate-limit-status-code: "418"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-teapot.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - {type: contains, target: rendering_error, pattern: "rate-limit-status-code' on Ingress 'default/rl-teapot'. HAProxy can only deny with a status that has a built-in error page"}
