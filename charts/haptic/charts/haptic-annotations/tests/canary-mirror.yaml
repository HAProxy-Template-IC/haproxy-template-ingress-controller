# HAPTIC-native annotation library — canary + mirror validation tests.
# Canary by header, header-pattern, cookie, and weight. Each canary Ingress
# shares its host+path with a non-canary main Ingress; the main owns the base
# route (features-800-haptic-canary-colocation) while the canary adds rows to the
# shared canary lane (ingress-annotations-compat util-canary-publish).
#
# The mirror test relies on the spoa-hub mirror plugin being enabled (mirror-target
# fails loud otherwise). The plugin auto-enables with the gateway library, which
# the chart test harness always renders with (scripts/test-templates.sh), so the
# single static mirror SPOE group (mirror-group) is present and the config validates.
_fx:
  endpointsEndpointsliceMain: &endpointsEndpointsliceMain
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: main-service-abc
        namespace: default
        labels:
          kubernetes.io/service-name: main-service
      addressType: IPv4
      endpoints:
        - addresses: ["10.0.0.1"]
      ports:
        - port: 8080
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: canary-service-abc
        namespace: default
        labels:
          kubernetes.io/service-name: canary-service
      addressType: IPv4
      endpoints:
        - addresses: ["10.0.0.2"]
      ports:
        - port: 8080
  servicesServiceMainService: &servicesServiceMainService
    - apiVersion: v1
      kind: Service
      metadata: {namespace: default, name: main-service}
      spec:
        ports:
          - port: 80
    - apiVersion: v1
      kind: Service
      metadata: {namespace: default, name: canary-service}
      spec:
        ports:
          - port: 80
  httpRootMainService: &httpRootMainService
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: main-service, port: {number: 80}}}
  httpRootCanaryService: &httpRootCanaryService
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: canary-service, port: {number: 80}}}

validationTests:
  test-haptic-canary-by-header:
    description: haproxy-haptic.org canary-by-header overlays a header-gated use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Canary"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'req\.hdr\(X-Canary\),strcmp\(txn\.canary_hval\) -m int eq 0'
      - {type: contains, target: "map:ing-canary-header-backend.map", pattern: '(?m)^canary\.example\.com\|X-Canary default_canary-ingress_svc_canary-service_80$'}
      - {type: contains, target: "map:ing-canary-header-value.map", pattern: '(?m)^canary\.example\.com\|X-Canary always$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend %\[var\(txn\.canary_backend\)\] if \{ var\(txn\.canary_backend\) -m found \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^[ \t]+use_backend[^\n]*\n(?:[ \t]+[^\n]*\n|\n)*[ \t]+http-request '

  test-haptic-canary-by-header-pattern:
    description: haproxy-haptic.org canary-by-header-pattern uses a regex match
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-pat.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-pat-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Region"
              haproxy-haptic.org/canary-by-header-pattern: "^(eu|us)-.*$"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-pat.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "req\\.hdr\\(X-Region\\) -m reg \\^\\(eu\\|us\\)-\\.\\*\\$"

  test-haptic-canary-by-cookie:
    description: haproxy-haptic.org canary-by-cookie overlays a cookie-gated use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-cookie.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-cookie-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-cookie: "canary_stage"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-cookie.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "req\\.cook\\(canary_stage\\) -m str always"}
      - {type: contains, target: "map:ing-canary-cookie-backend.map", pattern: '(?m)^canary-cookie\.example\.com\|canary_stage default_canary-cookie-ingress_svc_canary-service_80$'}

  test-haptic-canary-by-weight:
    description: haproxy-haptic.org canary-weight overlays a randomized use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-weight.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-weight-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-weight: "20"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-weight.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'rand\(100\),sub\(txn\.canary_weight\) -m int lt 0'
      - {type: contains, target: "map:ing-canary-weight.map", pattern: '(?m)^canary-weight\.example\.com 20$'}
      - {type: contains, target: "map:ing-canary-weight-backend.map", pattern: '(?m)^canary-weight\.example\.com default_canary-weight-ingress_svc_canary-service_80$'}

  test-haptic-mirror-buffer-honours-per-route-optout:
    _helm_skip_test: '{{ if not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.mirror "root" . "name" "mirror")) }}true{{ end }}'
    description: >-
      A route that opts out with request-buffering=off is not re-buffered by a
      SIBLING route's mirror-target on the same shared frontend. The mirror
      buffer runs frontend-wide, so without the per-backend map check in its
      condition the documented opt-out would be silently defeated by an
      unrelated mirrored Ingress.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: upload-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirrored
            annotations:
              haproxy-haptic.org/mirror-target: "http://mirror.internal:8443"
          spec:
            ingressClassName: haptic
            rules:
              - host: mirrored.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: mirror-service, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: upload
            annotations:
              haproxy-haptic.org/request-buffering: "off"
          spec:
            ingressClassName: haptic
            rules:
              - host: upload.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: upload-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:request-buffering.map
        pattern: "default_upload_svc_upload-service_80 off"
      # Both buffering rules — base's own and the mirror's — must consult the
      # map, so the opted-out backend escapes each of them.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} \\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str on \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} !\\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str off \\}"
      # An unconditional mirror buffer is exactly the bug this pins.
      - type: not_contains
        target: haproxy.cfg
        pattern: "wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\}\n"

  test-haptic-mirror-target:
    _helm_skip_test: '{{ if not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.mirror "root" . "name" "mirror")) }}true{{ end }}'
    description: haproxy-haptic.org mirror-target buffers the body and fires the SPOE mirror group
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mirror-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mirror-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-ingress
            annotations:
              haproxy-haptic.org/mirror-target: "https://mirror.internal:8443/shadow$request_uri"
          spec:
            ingressClassName: haptic
            rules:
              - host: mirror.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: mirror-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} !\\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str off \\}"
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.gw_mirror_targets\) var\(txn\.host\),map\([^)]*ing-mirror-hosts\.map\),concat\(,txn\.gw_mirror_targets,\) if \{ var\(txn\.host\),map\([^)]*ing-mirror-hosts\.map\) -m found \}'
      - {type: contains, target: "map:ing-mirror-hosts.map", pattern: '(?m)^mirror\.example\.com https\|mirror\.internal:8443\|2000\|0;$'}
      - type: contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub-mirror mirror-group if \\{ var\\(txn.gw_mirror_targets\\) -m found \\}"

  # Five mirror-target Ingresses. Each appends its own entry to the per-request
  # txn.gw_mirror_targets list; the SPOE config stays a single static `mirror`
  # message + `mirror-group` no matter how many targets exist. Proves adding
  # mirror targets never grows spoe.conf or the hub TOML (so it never reloads
  # the hub), and never fails the render.
  test-haptic-mirror-target-static-spoe-config:
    _helm_skip_test: '{{ if not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.mirror "root" . "name" "mirror")) }}true{{ end }}'
    description: "Five mirror-target Ingresses each append a target entry; the SPOE config remains one static mirror message + mirror-group (no per-Ingress slots, no fail)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports: [{port: 80}]
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mirror-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mirror-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-a
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-a:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-b
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-b:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: b.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-c
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-c:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: c.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-d
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-d:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: d.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-e
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-e:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: e.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
    assertions:
      - type: haproxy_valid
      # Five targets, still exactly one static message + group — no numbered slots.
      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\)'
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-5'}
      # Each of the five Ingresses is one map row under its own host.
      - {type: contains, target: "map:ing-mirror-hosts.map", pattern: '(?m)^a\.example\.com http\|sink-a:9000\|2000\|0;$'}
      - {type: contains, target: "map:ing-mirror-hosts.map", pattern: '(?m)^e\.example\.com http\|sink-e:9000\|2000\|0;$'}

  test-haptic-canary-precedence-header-cookie-weight:
    description: >-
      One canary with a header, a cookie and a weight: the filter tries the header,
      then the cookie, then the weight, each only while no canary backend is chosen.
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-all.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-all-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Canary"
              haproxy-haptic.org/canary-by-header-value: "blue"
              haproxy-haptic.org/canary-by-cookie: "canary_stage"
              haproxy-haptic.org/canary-weight: "5"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-all.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)req\.hdr\(X-Canary\),strcmp\(txn\.canary_hval\) -m int eq 0 \}\n[^\n]*unset-var\(txn\.canary_hval\)\n[^\n]*if !\{ var\(txn\.canary_backend\) -m found \} \{ req\.cook\(canary_stage\) -m str always \}\n[^\n]*set-var\(txn\.canary_weight\)[^\n]*if !\{ var\(txn\.canary_backend\) -m found \}'
      - {type: contains, target: "map:ing-canary-header-value.map", pattern: '(?m)^canary-all\.example\.com\|X-Canary blue$'}
      - {type: contains, target: "map:ing-canary-weight.map", pattern: '(?m)^canary-all\.example\.com 5$'}

  test-haptic-canary-cookie-name-comma-rejected:
    description: >-
      A comma in canary-by-cookie fails the render: the name is a converter argument
      in the shared canary lane, where it would break every frontend.
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-comma-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-cookie: "stage,x"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-comma.example.com
                http: *httpRootCanaryService
    assertions:
      - {type: contains, target: rendering_error, pattern: "canary-by-cookie' on Ingress 'default/canary-comma-ingress': may contain only letters, digits"}
