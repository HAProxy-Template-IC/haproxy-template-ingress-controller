  test-haptic-mirror-target:
    description: haproxy-haptic.org mirror-target buffers the body and fires the SPOE mirror group
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mirror-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mirror-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mirror-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-ingress
            annotations:
              haproxy-haptic.org/mirror-target: "https://mirror.internal:8443/shadow$request_uri"
          spec:
            ingressClassName: haptic
            rules:
              - host: mirror.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mirror-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "option http-buffer-request"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.gw_mirror_target_1\\) str\\(mirror.internal:8443\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub mirror-1-group if \\{ var\\(txn.host\\) -m str mirror.example.com \\}"
