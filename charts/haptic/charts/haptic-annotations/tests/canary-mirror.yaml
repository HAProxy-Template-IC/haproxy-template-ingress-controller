# HAPTIC-native annotation library — canary + mirror validation tests.
# Canary by header, header-pattern, cookie, and weight. Each canary Ingress
# shares its host+path with a non-canary main Ingress; the main owns the base
# route (features-800-haptic-canary-colocation) while the canary overlays a
# use_backend split (frontend-filters-810-haptic-canary).
#
# The mirror test relies on the spoa-hub mirror plugin being enabled (mirror-target
# fails loud otherwise). The plugin auto-enables with the gateway library, which
# the chart test harness always renders with (scripts/test-templates.sh), so the
# single static mirror SPOE group (mirror-group) is present and the config validates.
_fx:
  endpointsEndpointsliceMain: &endpointsEndpointsliceMain
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: main-service-abc
        namespace: default
        labels:
          kubernetes.io/service-name: main-service
      addressType: IPv4
      endpoints:
        - addresses: ["10.0.0.1"]
      ports:
        - port: 8080
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: canary-service-abc
        namespace: default
        labels:
          kubernetes.io/service-name: canary-service
      addressType: IPv4
      endpoints:
        - addresses: ["10.0.0.2"]
      ports:
        - port: 8080
  servicesServiceMainService: &servicesServiceMainService
    - apiVersion: v1
      kind: Service
      metadata: {namespace: default, name: main-service}
      spec:
        ports:
          - port: 80
    - apiVersion: v1
      kind: Service
      metadata: {namespace: default, name: canary-service}
      spec:
        ports:
          - port: 80
  httpRootMainService: &httpRootMainService
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: main-service, port: {number: 80}}}
  httpRootCanaryService: &httpRootCanaryService
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: canary-service, port: {number: 80}}}

validationTests:
  test-haptic-canary-by-header:
    description: haproxy-haptic.org canary-by-header overlays a header-gated use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Canary"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend default_canary-ingress_svc_canary-service_80 if \\{ req\\.hdr\\(X-Canary\\) -m str always \\}"

  test-haptic-canary-by-header-pattern:
    description: haproxy-haptic.org canary-by-header-pattern uses a regex match
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-pat.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-pat-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Region"
              haproxy-haptic.org/canary-by-header-pattern: "^(eu|us)-.*$"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-pat.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "req\\.hdr\\(X-Region\\) -m reg \\^\\(eu\\|us\\)-\\.\\*\\$"

  test-haptic-canary-by-cookie:
    description: haproxy-haptic.org canary-by-cookie overlays a cookie-gated use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-cookie.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-cookie-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-cookie: "canary_stage"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-cookie.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "req\\.cook\\(canary_stage\\) -m str always"}

  test-haptic-canary-by-weight:
    description: haproxy-haptic.org canary-weight overlays a randomized use_backend
    fixtures:
      services: *servicesServiceMainService
      endpoints: *endpointsEndpointsliceMain
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-weight.example.com
                http: *httpRootMainService
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-weight-ingress
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-weight: "20"
          spec:
            ingressClassName: haptic
            rules:
              - host: canary-weight.example.com
                http: *httpRootCanaryService
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend default_canary-weight-ingress_svc_canary-service_80 if \\{ rand\\(100\\) lt 20 \\}"

  test-haptic-mirror-buffer-honours-per-route-optout:
    description: >-
      A route that opts out with request-buffering=off is not re-buffered by a
      SIBLING route's mirror-target on the same shared frontend. The mirror
      buffer runs frontend-wide, so without the per-backend map check in its
      condition the documented opt-out would be silently defeated by an
      unrelated mirrored Ingress.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: upload-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirrored
            annotations:
              haproxy-haptic.org/mirror-target: "http://mirror.internal:8443"
          spec:
            ingressClassName: haptic
            rules:
              - host: mirrored.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: mirror-service, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: upload
            annotations:
              haproxy-haptic.org/request-buffering: "off"
          spec:
            ingressClassName: haptic
            rules:
              - host: upload.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: upload-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:request-buffering.map
        pattern: "default_upload_svc_upload-service_80 off"
      # Both buffering rules — base's own and the mirror's — must consult the
      # map, so the opted-out backend escapes each of them.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} \\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str on \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} !\\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str off \\}"
      # An unconditional mirror buffer is exactly the bug this pins.
      - type: not_contains
        target: haproxy.cfg
        pattern: "wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\}\n"

  test-haptic-mirror-target:
    description: haproxy-haptic.org mirror-target buffers the body and fires the SPOE mirror group
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mirror-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mirror-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-ingress
            annotations:
              haproxy-haptic.org/mirror-target: "https://mirror.internal:8443/shadow$request_uri"
          spec:
            ingressClassName: haptic
            rules:
              - host: mirror.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: mirror-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} !\\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str off \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.gw_mirror_targets\\) str\\(https\\|mirror.internal:8443\\|2000\\|0;\\),concat\\(,txn.gw_mirror_targets,\\) if \\{ var\\(txn.host\\) -m str mirror.example.com \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub-mirror mirror-group if \\{ var\\(txn.gw_mirror_targets\\) -m found \\}"

  # Five mirror-target Ingresses. Each appends its own entry to the per-request
  # txn.gw_mirror_targets list; the SPOE config stays a single static `mirror`
  # message + `mirror-group` no matter how many targets exist. Proves adding
  # mirror targets never grows spoe.conf or the hub TOML (so it never reloads
  # the hub), and never fails the render.
  test-haptic-mirror-target-static-spoe-config:
    description: "Five mirror-target Ingresses each append a target entry; the SPOE config remains one static mirror message + mirror-group (no per-Ingress slots, no fail)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mirror-service}
          spec:
            ports: [{port: 80}]
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mirror-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mirror-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-a
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-a:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-b
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-b:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: b.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-c
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-c:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: c.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-d
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-d:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: d.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mirror-e
            annotations: {haproxy-haptic.org/mirror-target: "http://sink-e:9000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: e.example.com
                http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: mirror-service, port: {number: 80}}}}]}
    assertions:
      - type: haproxy_valid
      # Five targets, still exactly one static message + group — no numbered slots.
      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror\n    args arg_targets=var\(txn\.gw_mirror_targets\)'
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-1'}
      - {type: not_contains, target: file:spoe.conf, pattern: 'spoe-message mirror-5'}
      # Each of the five Ingresses appended its own entry, host-gated.
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(http\|sink-a:9000\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if \{ var\(txn\.host\) -m str a\.example\.com \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(http\|sink-e:9000\|2000\|0;\),concat\(,txn\.gw_mirror_targets,\) if \{ var\(txn\.host\) -m str e\.example\.com \}'
