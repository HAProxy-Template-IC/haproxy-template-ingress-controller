# HAPTIC-native annotation library — auth / mTLS / external-auth / OAuth2 / WAF
# validation tests (haproxy-haptic.org/* prefix).
validationTests:
  # ============================================================================
  # Basic auth
  # ============================================================================
  test-haptic-basic-auth:
    description: >-
      haproxy-haptic.org/auth-type basic + auth-secret (auth-file htpasswd)
      generates a userlist (bcrypt hash + user::plain → insecure-password) and
      the backend auth challenge.
    fixtures:
      secrets:
        # data.auth = base64("admin:$2y$05$...\nguest::plainpw\n")
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: haptic-auth }
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCmd1ZXN0OjpwbGFpbnB3Cg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "haptic-auth"
              haproxy-haptic.org/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haptic
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: echo, port: { number: 80 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "userlist haptic_auth_default_haptic-auth"
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password [$]2y[$]05[$]"
      - type: contains
        target: haproxy.cfg
        pattern: "user guest insecure-password plainpw"
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "ProtectedArea" unless \{ http_auth\(haptic_auth_default_haptic-auth\) \}'

  test-haptic-basic-auth-map:
    description: >-
      haproxy-haptic.org/auth-secret-type auth-map reads one Secret data key per
      username; the base64-decoded value is that user's password hash, validated
      against hapticPasswordHashRegex.
    fixtures:
      secrets:
        # admin: base64("$2y$05$mN1WVk5Qnbg4QwdAdXbfz.8b3ceH6Q5KOVCKxR2IkNAfJgLi5pIKW")
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: haptic-authmap }
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: authmap-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "haptic-authmap"
              haproxy-haptic.org/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haptic
            rules:
              - host: authmap.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: echo, port: { number: 80 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "userlist haptic_auth_default_haptic-authmap"
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password [$]2y[$]05[$]"

  # ============================================================================
  # satisfy=any — OR-combine allowlist + basic auth
  # ============================================================================
  test-haptic-satisfy-any:
    description: >-
      satisfy=any folds the allowlist and basic auth into a single backend
      challenge that fires only for non-allow-listed, unauthenticated requests,
      and suppresses the unconditional auth challenge.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: satisfy-auth }
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: satisfy-any-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Protected"
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8,192.168.0.0/16"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: satisfy.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: echo, port: { number: 80 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "acl haptic_satisfy_ip_default_satisfy-any-ingress src 10\\.0\\.0\\.0/8 192\\.168\\.0\\.0/16"
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "Protected" if !haptic_satisfy_ip_default_satisfy-any-ingress !\{ http_auth\(haptic_auth_default_satisfy-auth\) \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "Protected" unless \{ http_auth\(haptic_auth_default_satisfy-auth\) \}'
      # The standalone allowlist deny (access-control fragment) is suppressed
      # under satisfy=any — the combined gate above owns the allowlist, so an
      # authenticated request from a non-allow-listed IP still passes.
      - type: not_contains
        target: haproxy.cfg
        pattern: "haptic_allowlist_default_satisfy-any-ingress"

  # ============================================================================
  # mTLS — client-cert verification + error page + cert passthrough
  # ============================================================================
  test-haptic-auth-tls:
    description: >-
      auth-tls-secret registers a SNI-keyed CA verify (verify required) in the
      crt-list, auth-tls-error-page lands in mtls-error.map, and
      auth-tls-cert-header forwards the X-SSL-Client-* headers.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: client-ca }
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: server-tls }
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-verify-client: "on"
              haproxy-haptic.org/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            tls:
              - hosts: ["api.example.com"]
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: echo, port: { number: 80 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
      - type: contains
        target: map:mtls-error.map
        pattern: "api.example.com https://login.example.com/cert-required"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-SSL-Client-Cert %\\[ssl_c_der,base64\\] if \\{ ssl_fc_has_crt \\}"

  # ============================================================================
  # External auth (SPOE) — requires spoa-hub loaded
  # ============================================================================
  test-haptic-external-auth:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      auth-url populates auth-url.map and the spoa-hub external-auth frontend
      wiring; auth-headers-succeed emits a per-header set-header on success.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-url: "https://auth.example/check"
              haproxy-haptic.org/auth-signin: "https://login.example/start"
              haproxy-haptic.org/auth-method: "POST"
              haproxy-haptic.org/auth-headers-request: "X-Tenant-Id"
              haproxy-haptic.org/auth-headers-succeed: "X-Auth-User"
              haproxy-haptic.org/auth-headers-fail: "WWW-Authenticate"
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: echo, port: { number: 80 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/protected https://auth.example/check"
      - type: contains
        target: map:auth-signin.map
        pattern: "default/protected https://login.example/start"
      - type: contains
        target: map:auth-method.map
        pattern: "default/protected POST"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
      # Security: a client-supplied copy of the pass-through header is stripped
      # before the auth value is set, so it can't survive when the auth reply
      # omits the header (identity/privilege-escalation guard).
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Auth-User if \\{ var\\(txn.auth_url\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\]"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header WWW-Authenticate"

  # ============================================================================
  # OAuth2-proxy — desugars onto external-auth
  # ============================================================================
  test-haptic-oauth-oauth2-proxy:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      oauth: oauth2-proxy derives the oauth2-proxy address from the Ingress's own
      /oauth2 path backend, setting auth-url (/oauth2/auth), auth-signin
      (/oauth2/start), and auth-method HEAD.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: oauth-app-svc }
          spec: { ports: [{ port: 80 }] }
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: oauth2-proxy }
          spec: { ports: [{ port: 4180 }] }
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthapp
            annotations:
              haproxy-haptic.org/oauth: "oauth2-proxy"
          spec:
            ingressClassName: haptic
            rules:
              - host: oauthapp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: oauth-app-svc, port: { number: 80 } }
                    - path: /oauth2
                      pathType: Prefix
                      backend:
                        service: { name: oauth2-proxy, port: { number: 4180 } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/oauthapp http://oauth2-proxy.default.svc:4180/oauth2/auth"
      - type: contains
        target: map:auth-signin.map
        pattern: "default/oauthapp /oauth2/start\\?rd=%\\[path\\]"
      - type: contains
        target: map:auth-method.map
        pattern: "default/oauthapp HEAD"

  # ============================================================================
  # WAF (Coraza via SPOA hub) — waf-policy / waf-mode
  # ============================================================================
  test-haptic-waf-without-coraza-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      haproxy-haptic.org/waf-policy set while the spoaHub coraza plugin is NOT
      enabled fails the render with an explicit diagnostic.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: []
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: []
      waf:
        ingressPermissions:
          allowPolicySelection: true
        policies:
          defaultPolicy: ""
          inline:
            baseline: {}
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: orphan-waf
            annotations:
              haproxy-haptic.org/waf-policy: baseline
          spec:
            ingressClassName: haptic
            rules:
              - host: orphan.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: { name: any, port: { number: 80 } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-waf sets HAPTIC WAF annotations but the spoaHub coraza plugin is not enabled"

  test-haptic-waf-setup-fields-policy-with-coraza-disabled-renders:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      A policy carrying setup-position fields (allowedMethods) must not fail
      config registration when coraza is disabled — the anchor requirement
      only applies when coraza is on. Regression pin for the load-gate crash
      where a deployment-wide allowedMethods policy merged into any baked
      test running without coraza and hard-failed the whole render.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: []
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: []
      waf:
        policies:
          defaultPolicy: ""
          inline:
            api-methods:
              enforcement: deny
              allowedMethods: [GET, POST, PUT, DELETE]
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: plain, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: any, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid

  test-haptic-auth-tls-cert-header-cannot-be-forged:
    description: >-
      The X-SSL-Client-* headers are set only when a client certificate is
      present, so without a strip a caller on plain HTTP — or on HTTPS presenting
      no certificate — had their own value forwarded to the application as the
      verified subject. The strip is unconditional for the route; the set stays
      gated on ssl_fc_has_crt.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-app
            annotations:
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Unconditional: a host-scoped strip missed wildcard and host-less rules.
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-CN\n' }
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-DN\n' }
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-Cert\n' }
      # The strip must precede the set, or the forged value survives.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request del-header X-SSL-Client-CN\n'
          - "http-request set-header X-SSL-Client-CN %\\[ssl_c_s_dn\\(CN\\)\\] if \\{ ssl_fc_has_crt \\}"
  test-haptic-basic-auth-missing-secret-rejected-at-admission:
    description: >-
      Writing an Ingress that asks for basic auth with a Secret that does not
      exist is refused when the resource is written, so the mistake surfaces at
      kubectl apply rather than as a 503 nobody sees until traffic arrives.
    extraContext:
      renderMode: admission
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-type: basic
              haproxy-haptic.org/auth-secret: does-not-exist
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "that Secret does not exist"

  test-haptic-basic-auth-secret-deleted-later-fails-closed:
    description: >-
      An Ingress already admitted, whose Secret is deleted afterwards, must
      degrade CLOSED rather than abort the whole render or serve unauthenticated.
      Emitting no rule left the backend with no authentication at all, so a
      deleted Secret silently turned the gate off.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-type: basic
              haproxy-haptic.org/auth-secret: does-not-exist
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request set-var\\(txn.denied_by\\) str\\(basic_auth_unavailable\\)" }
      # Must not reference a userlist that was never produced.
      - { type: not_contains, target: haproxy.cfg, pattern: "http_auth\\(haptic_auth_default_does-not-exist\\)" }

  test-haptic-auth-tls-missing-secret-rejected-at-admission:
    description: >-
      Writing an Ingress whose auth-tls-secret does not exist is refused when the
      resource is written. It previously rendered clean and served the host with
      client-certificate verification silently absent.
    extraContext:
      renderMode: admission
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-missing-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-missing.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "that Secret does not exist"

  test-haptic-auth-tls-secret-deleted-later-fails-closed:
    description: >-
      An already-admitted route whose CA Secret is deleted afterwards must stop
      serving rather than serve with verification absent. HAPTIC terminates every
      HTTPS host on one shared bind and the verify clause is a per-entry option,
      so there is no separate mTLS listener to refuse the handshake.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-missing-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-missing.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn\\.host\\) -m str mtls-missing\\.example\\.com \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(mtls_unavailable\\)"
      # The host must NOT be silently served with verification absent.
      - type: not_contains
        target: haproxy.cfg
        pattern: "ca-file [^ ]*no-such-ca"

  test-haptic-auth-tls-wildcard-host-fails-closed:
    description: >-
      A wildcard Ingress host must be denied by a single-label regex. An exact
      -m str match on the literal '*.example.com' never fires against a concrete
      request host, so the route kept serving with verification absent.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-wildcard
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.wild.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 503 if \{ var\(txn\.host\) -m reg \^\[\^\.\]\+\\\.wild\\\.example\\\.com\$ \}'
      # The literal wildcard must never reach an exact matcher — that is the bug.
      - type: not_contains
        target: haproxy.cfg
        pattern: '-m str \*\.wild\.example\.com'

  test-haptic-auth-tls-secret-without-ca-crt-fails-closed:
    description: >-
      A CA Secret that exists but carries no data.ca.crt is the same exposure as
      a missing Secret. It previously warned and served the host unverified.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: empty-ca }
          type: Opaque
          data:
            tls.crt: Zm9v
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-empty-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: empty-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-emptyca.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 503 if \{ var\(txn\.host\) -m str mtls-emptyca\.example\.com \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'ca-file [^ ]*empty-ca'

  test-haptic-auth-tls-secret-without-ca-crt-rejected-at-admission:
    description: >-
      Writing an Ingress whose auth-tls-secret carries no ca.crt is refused when
      the resource is written, same as a wholly missing Secret.
    extraContext:
      renderMode: admission
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: empty-ca }
          type: Opaque
          data:
            tls.crt: Zm9v
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-empty-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: empty-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-emptyca.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "that Secret has no data.ca.crt"

  test-haptic-auth-tls-cert-header-strip-covers-wildcard-and-hostless:
    description: >-
      The X-SSL-Client-* strip must not be host-scoped. A wildcard host never
      matched the exact -m str condition and a host-less rule skipped the block
      entirely, so a client-supplied identity header reached a backend this
      annotation tells to trust it.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: certhdr-wild
            annotations:
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.certhdr.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Unconditional strip — no trailing `if`.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request del-header X-SSL-Client-CN\n'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request del-header X-SSL-Client-Cert\n'
      # The strip must never be gated on a host match again.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'del-header X-SSL-Client-[A-Za-z]+ if'

  test-haptic-basic-auth-without-secret-annotation-fails-closed:
    description: >-
      auth-type basic with no auth-secret served every request unauthenticated - no userlist, no challenge, no warning, nothing at admission.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ba-noannot
            annotations:
              haproxy-haptic.org/auth-type: "basic"
          spec:
            ingressClassName: haptic
            rules:
              - host: ba-noannot.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(basic_auth_unavailable\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503"
      # The render must still succeed: a Secret deleted after admission must not
      # abort reconcile for the whole fleet.
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_ba-noannot_svc_echo_80"

  test-haptic-basic-auth-without-secret-annotation-fails-closed-at-admission:
    description: >-
      auth-type basic with no auth-secret served every request unauthenticated - no userlist, no challenge, no warning, nothing at admission. Rejected when the resource is written.
    extraContext:
      renderMode: admission
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ba-noannot
            annotations:
              haproxy-haptic.org/auth-type: "basic"
          spec:
            ingressClassName: haptic
            rules:
              - host: ba-noannot.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "fails closed with 503"
