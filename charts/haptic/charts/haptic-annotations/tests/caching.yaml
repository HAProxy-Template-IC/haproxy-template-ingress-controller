# HAPTIC-native annotation library — shared-cache (Varnish tier) tests.
validationTests:
  test-haptic-cache-core:
    description: >-
      With the Varnish tier enabled, cache-enable/cache-ttl build reload-free
      maps keyed by resource_id, the frontend routes cache-eligible non-loopback
      requests to varnish_cache, and the sharded consistent-hash backend is
      emitted with bounded-load balancing.
    extraContext:
      cache:
        varnish:
          enabled: true
          # Per-test extraContext deep-merges into the global context; pin the
          # topology this test asserts (PDB + anti-affinity need replicas > 1)
          # instead of relying on the deployment's values.
          replicas: 2
          podDisruptionBudget:
            enabled: true
            maxUnavailable: 1
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "300"
              haproxy-haptic.org/cache-key: "consumer,header:X-Api-Version"
              haproxy-haptic.org/cache-exclude-content-types: "text/html,text/xml"
              haproxy-haptic.org/cache-exclude-paths: "/admin,/live"
              haproxy-haptic.org/cache-max-object-size: "1048576"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:haptic-cache-enable.map"
        pattern: "default/cache-ingress 1"
      - type: contains
        target: "map:haptic-cache-ttl.map"
        pattern: "default/cache-ingress 300"
      # No source-IP loop-break map: the cache-miss loopback no longer enters the
      # client frontends (Varnish fetches the dedicated backend-fetch port), so
      # the fragile Varnish-pod-IP map is gone entirely.
      - type: not_contains
        target: haproxy.cfg
        pattern: "haptic-varnish-src"
      # Client-facing cache routing is unguarded by source now.
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend varnish_cache if \\{ var\\(txn.resource_id\\),map\\([^)]*haptic-cache-enable\\.map\\) -m found \\}\\n"
      # Dedicated backend-fetch frontend: internal-only bind, routes by the
      # validated X-Haptic-Backend header, refuses infrastructure backends.
      - type: contains
        target: haproxy.cfg
        pattern: "frontend haptic_cache_origin"
      - type: contains
        target: haproxy.cfg
        pattern: "bind \\*:8090"
      - type: contains
        target: haproxy.cfg
        pattern: "acl origin_backend_internal var\\(txn.origin_backend\\) -m str varnish_cache spoa-hub default_backend"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 421 if origin_backend_internal"
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend %\\[var\\(txn.origin_backend\\)\\] if \\{ var\\(txn.origin_backend\\) -m found \\}"
      # The varnish_cache backend stamps the resolved backend for the loopback,
      # stripping any client copy first.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Haptic-Backend\\n\\s*http-request set-header X-Haptic-Backend %\\[var\\(txn.backend_name\\)\\] if \\{ var\\(txn.backend_name\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Haptic-Cache-Fetch"
      # The forgeable-header bypass must be gone from the routing decision.
      - type: not_contains
        target: haproxy.cfg
        pattern: "req.hdr\\(X-Haptic-Cache-Fetch\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-TTL %\\[var\\(txn.resource_id\\),map\\([^)]*haptic-cache-ttl\\.map\\)\\]"
      - type: contains
        target: haproxy.cfg
        pattern: "backend varnish_cache"
      - type: contains
        target: haproxy.cfg
        pattern: "balance uri"
      - type: contains
        target: haproxy.cfg
        pattern: "hash-type consistent"
      - type: contains
        target: haproxy.cfg
        pattern: "hash-balance-factor 150"
      # Dedicated internal origin Service for the backend-fetch port (ClusterIP,
      # never a LoadBalancer; targets the HAProxy fleet on the loopback port).
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "name: haptic-cache-origin"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "(?s)name: haptic-cache-origin.*?type: ClusterIP.*?port: 8090"
      # Regression guard: a document separator must never fuse with the next
      # document's apiVersion (a stripping `{#- -#}` comment between `---` and
      # `apiVersion` would produce `---apiVersion:` — invalid multi-doc YAML the
      # live SSA apply rejects even though text assertions still pass).
      - type: not_contains
        target: "k8s:varnish-cache"
        pattern: "(?m)^---[A-Za-z]"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: StatefulSet"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: ConfigMap"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "clusterIP: None"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "malloc,256m"
      # A CPU request must be present so the autoscaling HPA can compute utilization.
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "cpu: 100m"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: PodDisruptionBudget"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "maxUnavailable: 1"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "podAntiAffinity:"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "topologySpreadConstraints:"
      # The VCL no longer sets a loopback marker header (source-based loop-break).
      - type: not_contains
        target: "k8s:varnish-cache"
        pattern: "X-Haptic-Cache-Fetch"
      - type: contains
        target: "map:haptic-cache-skip-ct.map"
        pattern: "default/cache-ingress \\|text/html\\|text/xml\\|"
      - type: contains
        target: "map:haptic-cache-maxsize.map"
        pattern: "default/cache-ingress 1048576"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Haptic-Cache-Vary"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Vary %\\[var\\(txn.haptic_consumer\\)\\]\\|%\\[req.hdr\\(X-Api-Version\\)\\] if \\{ var\\(txn.resource_id\\) -m str default/cache-ingress \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend %\\[var\\(txn.backend_name\\)\\] if \\{ var\\(txn.resource_id\\) -m str default/cache-ingress \\} \\{ path_beg /admin /live \\}"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "hash_data\\(req.http.X-Haptic-Cache-Vary\\)"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "std.strstr\\(bereq.http.X-Haptic-Cache-Skip-CT"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "sub vcl_recv"
      # The builtin refuses to serve a cached response to a request carrying
      # Authorization or Cookie. Overriding that is only safe when the key
      # identifies the caller, so the bypass demands the auth flag as well —
      # gating on the vary header alone leaked one caller's authenticated
      # response to the next.
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "if \\(req.http.X-Haptic-Cache-Vary && req.http.X-Haptic-Cache-Auth && \\(req.method == \"GET\" \\|\\| req.method == \"HEAD\"\\)\\) \\{"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "set resp.http.X-Cache = \"HIT\""

  test-haptic-cache-shared-rate-limit-loopback:
    _helm_skip_test: '{{ if not (and .Values.cache.varnish.enabled .Values.rateLimit.shared.enabled) }}true{{ end }}'
    description: >-
      One external request consumes one shared-limit budget even on a cache miss:
      the miss loopback fetches the dedicated backend-fetch frontend, which runs
      no rate-limit dispatch, so there is no second charge and no per-loopback
      unset hack. The client leg still dispatches the shared limiter normally.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-rate-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-requests: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-rate.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      # The client leg still dispatches the shared limiter.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-ratelimit-group"
      # The old per-loopback unset hack is gone — no source-map rl_limit clear.
      - type: not_contains
        target: haproxy.cfg
        pattern: "unset-var\\(txn\\.rl_limit\\)"
      # The loopback is separated onto the dedicated backend-fetch frontend.
      - type: contains
        target: haproxy.cfg
        pattern: "frontend haptic_cache_origin"

  test-haptic-cache-autoscaling:
    description: >-
      With autoscaling enabled, the Varnish tier emits a HorizontalPodAutoscaler
      targeting the workload (CPU utilization, generous scale-down window) and
      omits the static replica count so the HPA owns it.
    extraContext:
      cache:
        varnish:
          enabled: true
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 9
            targetCPUUtilizationPercentage: 65
            scaleDownStabilizationSeconds: 900
          podDisruptionBudget:
            enabled: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: HorizontalPodAutoscaler"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: StatefulSet\\s+metadata:\\s+name: [^\\s]*varnish-cache"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "minReplicas: 3"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "maxReplicas: 9"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "averageUtilization: 65"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "stabilizationWindowSeconds: 900"
      # The HPA owns the replica count — the workload must not pin a static one.
      - type: not_contains
        target: "k8s:varnish-cache"
        pattern: "replicas: 2"
      - type: not_contains
        target: "k8s:varnish-cache"
        pattern: "kind: PodDisruptionBudget"

  test-haptic-cache-ttl-unit-suffix-rejected:
    description: >-
      cache-ttl with a unit suffix (e.g. "60s") is rejected at admission instead
      of being written verbatim into haptic-cache-ttl.map, where the Varnish VCL
      would compute std.duration("60s"+"s")=0s and silently never cache. Regression
      pin for the toint() footgun (Atoi parses "60s" to 0, passing a `< 0` guard).
    extraContext:
      renderMode: admission
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-ttl
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-ttl.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '60s' for annotation 'haproxy-haptic.org/cache-ttl'.*Must be a non-negative integer .seconds. with no unit suffix" }

  test-haptic-cache-max-object-size-unit-suffix-rejected:
    description: >-
      cache-max-object-size with a unit suffix ("1mb") is rejected at admission —
      the digits-only guard, not a reliance on toint()<=0, is what enforces it.
    extraContext:
      renderMode: admission
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-maxsize
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-max-object-size: "1mb"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-maxsize.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '1mb' for annotation 'haproxy-haptic.org/cache-max-object-size'.*Must be a positive integer .bytes. with no unit suffix" }

  test-haptic-cache-access-log-fields:
    description: >-
      With the Varnish tier enabled, the cache leg captures Varnish's X-Cache
      verdict into a transaction variable (a log-format cannot fetch response
      headers) and contributes the cache/app_backend fields; the cache-origin
      frontend carries the JSON log-format too, so the second log line a MISS
      produces is in the same schema.
    extraContext:
      cache:
        varnish:
          enabled: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-log
            annotations:
              haproxy-haptic.org/cache-enable: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-log.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-after-response set-var\(txn\.cache_status\) res\.hdr\(X-Cache\) if \{ res\.hdr\(X-Cache\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(cache\)\[var\(txn\.cache_status\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(app_backend\)\[var\(txn\.backend_name\)\]'
        description: >-
          A cache-enabled route sets use_backend varnish_cache, so the core
          `backend` field no longer identifies the application backend.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend haptic_cache_origin$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(cache_origin_internal_backend\) if origin_backend_internal'

  test-haptic-cache-staleness-windows:
    description: >-
      stale-while-revalidate and stale-if-error collapse into one Varnish grace
      window (the larger of the two), while stale-if-error additionally flags the
      route so the VCL abandons an erroring background fetch instead of replacing
      a good stale object. cache-revalidate sets beresp.keep and
      cache-strip-set-cookie drops Set-Cookie before the cacheability test.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: stale-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-stale-while-revalidate: "30"
              haproxy-haptic.org/cache-stale-if-error: "600"
              haproxy-haptic.org/cache-revalidate: "900"
              haproxy-haptic.org/cache-strip-set-cookie: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: stale.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Total window is max(swr, sie) = 600, not 30 and not 630 …
      - { type: contains, target: "map:haptic-cache-grace.map", pattern: "(?m)^default/stale-ingress 600$" }
      # … while proactive stale delivery stops at the swr boundary.
      - { type: contains, target: "map:haptic-cache-swr.map", pattern: "(?m)^default/stale-ingress 30$" }
      - { type: contains, target: "map:haptic-cache-stale-if-error.map", pattern: "(?m)^default/stale-ingress 1$" }
      - { type: contains, target: "map:haptic-cache-keep.map", pattern: "(?m)^default/stale-ingress 900$" }
      - { type: contains, target: "map:haptic-cache-strip-cookie.map", pattern: "(?m)^default/stale-ingress 1$" }
      # A client must not be able to forge any of the new control headers.
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Grace" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Stale-If-Error" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Keep" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Strip-Cookie" }
      # del-header must precede the set-header that re-adds the trusted value.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Haptic-Cache-Grace"
          - "http-request set-header X-Haptic-Cache-Grace %\\[var\\(txn\\.resource_id\\),map\\("
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Stale-If-Error %\\[var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-stale-if-error\\.map\\)\\]"
      # The VCL wires each header to the matching beresp field.
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.grace = std.duration\\(bereq.http.X-Haptic-Cache-Grace" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.keep = std.duration\\(bereq.http.X-Haptic-Cache-Keep" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "unset beresp.http.Set-Cookie" }
      # req.grace is what enforces the split; without it the wider grace would
      # serve stale proactively and stale-if-error would not be error-only.
      - { type: contains, target: "k8s:varnish-cache", pattern: "set req.grace = std.duration\\(req.http.X-Haptic-Cache-SWR" }
      # The abandon must NOT be limited to background fetches: past the swr window
      # the refresh is synchronous, and that is the fetch the client waits on.
      - { type: contains, target: "k8s:varnish-cache", pattern: "X-Haptic-Cache-Stale-If-Error && beresp.status >= 500\\)" }
      - { type: not_contains, target: "k8s:varnish-cache", pattern: "bereq.is_bgfetch" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "sub vcl_backend_error" }
      # A stale delivery is distinguishable from a fresh hit in the access log.
      - { type: contains, target: "k8s:varnish-cache", pattern: "X-Cache = \"STALE\"" }

  test-haptic-cache-ttl-auto-follows-origin:
    description: >-
      cache-ttl "auto" hands the lifetime back to the origin's Cache-Control via
      std.rfc_ttl() (new in Varnish/Vinyl 9.0) instead of forcing a fixed TTL.
      The map carries the literal so the static VCL can branch on it.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auto-ttl
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "auto"
          spec:
            ingressClassName: haptic
            rules:
              - host: auto-ttl.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-ttl.map", pattern: "(?m)^default/auto-ttl auto$" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "if \\(bereq.http.X-Haptic-Cache-TTL == \"auto\"\\) \\{" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "std.rfc_ttl\\(\\);" }
      # The hit-for-pass lifetime follows the operator-tunable parameter rather
      # than a magic number duplicated from its default.
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.ttl = param.uncacheable_ttl;" }
      - { type: not_contains, target: "k8s:varnish-cache", pattern: "set beresp.ttl = 120s;" }

  test-haptic-cache-staleness-unit-suffix-rejected:
    description: >-
      The staleness windows share cache-ttl's unit-suffix footgun — the VCL builds
      the duration by appending "s", so "30s" would become std.duration("30ss")=0s
      and silently disable the window. Rejected at admission instead.
    extraContext:
      renderMode: admission
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-swr
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-stale-while-revalidate: "30s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-swr.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '30s' for annotation 'haproxy-haptic.org/cache-stale-while-revalidate'" }

  test-haptic-cache-strip-set-cookie-rejects-non-boolean:
    description: >-
      cache-strip-set-cookie drops a response header, so a typo must fail loudly
      rather than being read as false and leaving the route uncached.
    extraContext:
      renderMode: admission
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-strip
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-strip-set-cookie: "yes"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-strip.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value 'yes' for annotation 'haproxy-haptic.org/cache-strip-set-cookie'.*Must be \"true\" or \"false\"" }

  test-haptic-cache-stale-if-error-alone-is-error-only:
    description: >-
      A route that sets stale-if-error WITHOUT stale-while-revalidate must not
      serve stale on ordinary expiry. The total grace window widens to the
      error window, but the proactive window stays 0, so a normal expiry fetches
      synchronously and the wider grace is reachable only when that fetch fails.
      Regression pin for the collapse-into-one-window bug: with a single grace
      value, stale-if-error silently implied stale-while-revalidate.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sie-only
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-stale-if-error: "600"
          spec:
            ingressClassName: haptic
            rules:
              - host: sie-only.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-grace.map", pattern: "(?m)^default/sie-only 600$" }
      # The whole point: proactive staleness is off for this route.
      - { type: contains, target: "map:haptic-cache-swr.map", pattern: "(?m)^default/sie-only 0$" }
      - { type: contains, target: "map:haptic-cache-stale-if-error.map", pattern: "(?m)^default/sie-only 1$" }

  test-haptic-cache-vary-declared-downstream:
    description: >-
      A cache-key built from components the CLIENT sends (header:, cookie:) is
      declared to downstream caches as Vary, so a CDN or proxy in front of HAPTIC
      keys on the same dimensions Varnish does instead of serving one caller's
      response to another. add-header, so an origin's own Vary survives.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: vary-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version,cookie:sess,query:page"
          spec:
            ingressClassName: haptic
            rules:
              - host: vary.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # cookie:<c> collapses to Cookie; query:<q> contributes nothing because a
      # downstream cache already keys on the URL.
      - { type: contains, target: "map:haptic-cache-vary.map", pattern: "(?m)^default/vary-ingress X-Api-Version,Cookie$" }
      # No identity component here, so the response stays shareable.
      - { type: not_contains, target: "map:haptic-cache-private.map", pattern: "default/vary-ingress" }
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response add-header Vary %\\[var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-vary\\.map\\)\\]"

  test-haptic-cache-identity-key-marks-response-private:
    description: >-
      consumer and src cannot be expressed as Vary — a downstream cache never
      receives the discriminator, so declaring it would collapse every caller onto
      one shared variant. Those routes are marked Cache-Control: private instead,
      which keeps shared caches out while leaving the browser free to cache.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: consumer-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: consumer.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-private.map", pattern: "(?m)^default/consumer-ingress 1$" }
      # Nothing client-sendable to vary on, so no Vary entry for this route.
      - { type: not_contains, target: "map:haptic-cache-vary.map", pattern: "default/consumer-ingress" }
      # A conflicting `public` is rewritten rather than emitted alongside
      # `private`: RFC 9111 defines no precedence for a response carrying both.
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response replace-header Cache-Control \\(\\?i\\)\\\\bpublic\\\\b private if \\{ var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-private\\.map\\) -m found \\}"
      # …and the add-header is skipped when that rewrite already produced one, so
      # the response never carries `private` twice.
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response add-header Cache-Control private if \\{ var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-private\\.map\\) -m found \\} !\\{ res\\.hdr\\(Cache-Control\\) -m sub -i private \\}"
      # The rewrite must run before the add, or the guard reads a stale value.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "replace-header Cache-Control \\(\\?i\\)\\\\bpublic\\\\b private"
          - "add-header Cache-Control private"

  test-haptic-cache-vary-dedup-is-case-insensitive:
    description: >-
      HTTP header names are case-insensitive, so two cache-key components naming
      the same header in different case are one Vary dimension, not two. The
      operator's original spelling is what gets emitted.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: dedup-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version,header:x-api-version"
          spec:
            ingressClassName: haptic
            rules:
              - host: dedup.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-vary.map", pattern: "(?m)^default/dedup-ingress X-Api-Version$" }
      - { type: not_contains, target: "map:haptic-cache-vary.map", pattern: "x-api-version" }

  test-haptic-cache-negative-caching:
    description: >-
      cache-negative-ttl makes 404 and 410 cacheable on their own shorter clock,
      so scanning traffic stops reaching the origin. It is deliberately separate
      from cache-ttl: a cached 404 during a bad deploy pins the outage for its
      lifetime, so it must be shortenable without shortening everything else.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: neg-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "600"
              haproxy-haptic.org/cache-negative-ttl: "30"
          spec:
            ingressClassName: haptic
            rules:
              - host: neg.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-negative-ttl.map", pattern: "(?m)^default/neg-ingress 30$" }
      # Its own clock, not the route's 600.
      - { type: not_contains, target: "map:haptic-cache-negative-ttl.map", pattern: "default/neg-ingress 600" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Negative-TTL" }
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Negative-TTL %\\[var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-negative-ttl\\.map\\)\\]"
      # 404 and 410 only — a 5xx must never be negatively cached, or an origin
      # outage would be served back for the whole window.
      - { type: contains, target: "k8s:varnish-cache", pattern: "beresp.status == 404 \\|\\| beresp.status == 410" }
      # The check must stand OUTSIDE the cache-ttl branch. Nested, the annotation
      # silently did nothing on a route that leaves lifetimes to the origin.
      - type: match_order
        target: "k8s:varnish-cache"
        patterns:
          - "X-Haptic-Cache-Negative-TTL && !beresp.http.Set-Cookie"
          - "if \\(bereq.http.X-Haptic-Cache-TTL\\) \\{"
      # The stale windows are applied through one shared sub, so the three paths
      # that need them cannot drift apart.
      - { type: contains, target: "k8s:varnish-cache", pattern: "sub haptic_stale_windows" }
      - { type: match_count, target: "k8s:varnish-cache", pattern: "call haptic_stale_windows;", expected: "3" }

  test-haptic-cache-negative-ttl-unit-suffix-rejected:
    description: >-
      cache-negative-ttl shares cache-ttl's unit-suffix footgun — the VCL appends
      "s" to build the duration, so "30s" would yield 0s and silently disable
      negative caching rather than failing.
    extraContext:
      renderMode: admission
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-neg
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-negative-ttl: "30s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-neg.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '30s' for annotation 'haproxy-haptic.org/cache-negative-ttl'" }

  test-haptic-cache-auth-bypass-requires-consumer-key:
    description: >-
      Caching a response to an authenticated request is only safe when the cache
      key identifies the caller. A route keyed on something that does not —
      header:, cookie:, query:, src — must NOT get the auth flag, so Varnish keeps
      its builtin refusal and never serves one caller's authenticated response to
      another. Regression pin for a cross-user leak: the bypass used to fire on
      the presence of any cache-key at all.
    extraContext:
      cache:
        varnish:
          enabled: true
          replicas: 2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-keyed
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version"
          spec:
            ingressClassName: haptic
            rules:
              - host: hdr.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: consumer-keyed
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: consumer.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Only the consumer-keyed route may cache authenticated requests.
      - { type: contains, target: "map:haptic-cache-authkey.map", pattern: "(?m)^default/consumer-keyed 1$" }
      - { type: not_contains, target: "map:haptic-cache-authkey.map", pattern: "default/hdr-keyed" }
      # The flag additionally requires a consumer to have been RESOLVED: an empty
      # identity would put every caller in one bucket, which is the leak itself.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Auth 1 if \\{ var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-authkey\\.map\\) -m found \\} \\{ var\\(txn\\.haptic_consumer\\),length gt 0 \\}"
      # A client must not be able to forge the flag.
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Auth" }
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Haptic-Cache-Auth"
          - "http-request set-header X-Haptic-Cache-Auth 1"
