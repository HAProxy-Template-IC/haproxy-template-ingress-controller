# HAPTIC-native annotation library — HMAC + consumer-groups (auth crypto) tests.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: echo, port: { number: 80 } } }

validationTests:
  test-haptic-hmac:
    description: >-
      hmac-secret verifies a request signature: the route's algorithm, header, signed
      string and base64 key land in haptic-hmac-routes.map, and one frontend block
      waits for the body of a body-signed route, computes hmac over it with the key
      from the map, and denies 401 unless the client signature matches.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hmac-keys }
          type: Opaque
          data:
            secret: czNjcjN0LWtleQ==   # s3cr3t-key
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hmac-ingress
            annotations:
              haproxy-haptic.org/hmac-secret: "hmac-keys"
              haproxy-haptic.org/hmac-algorithm: "sha256"
              haproxy-haptic.org/hmac-header: "X-Signature"
          spec:
            ingressClassName: haptic
            rules:
              - host: hmac.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-hmac-routes.map", pattern: '(?m)^default/hmac-ingress sha256 X-Signature body ok czNjcjN0LWtleQ==$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request wait-for-body time 10s if \{ var\(txn\.hm_state\) -m str ok \} \{ var\(txn\.hm_signed\) -m str body \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.haptic_hmac\) req\.body,hmac\(sha256,txn\.hm_key\),hex,lower if \{ var\(txn\.hm_state\) -m str ok \} \{ var\(txn\.hm_signed\) -m str body \} \{ var\(txn\.hm_alg\) -m str sha256 \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 401 if \{ var\(txn\.hm_state\) -m str ok \} \{ var\(txn\.hm_hdr\) -m str X-Signature \} !\{ req\.hdr\(X-Signature\),strcmp\(txn\.haptic_hmac\) -m int 0 \}'
      # The key rides the map, never the config; buffering is per route, not proxy-wide.
      - {type: not_contains, target: haproxy.cfg, pattern: 'czNjcjN0LWtleQ=='}
      - {type: not_contains, target: haproxy.cfg, pattern: 'option http-buffer-request'}
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_hmac-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-consumer-groups:
    description: >-
      consumer-groups-secret builds a consumer→group map, the route's allowed set
      lands in haptic-consumer-group-allow.map, and one frontend block denies 403
      unless the request's consumer maps to a group the route allows.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg }
          type: Opaque
          data:
            groups: YWxpY2U6YWRtaW5zCmJvYjplZGl0b3JzCg==   # alice:admins / bob:editors
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-ingress
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "cg"
              haproxy-haptic.org/allowed-consumer-groups: "admins,editors"
          spec:
            ingressClassName: haptic
            rules:
              - host: cg.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-consumer-groups.map", pattern: '(?m)^default/cg\|alice admins$'}
      - {type: contains, target: "map:haptic-consumer-groups.map", pattern: '(?m)^default/cg\|bob editors$'}
      - {type: contains, target: "map:haptic-consumer-group-allow.map", pattern: '(?m)^default/cg-ingress\|admins 1$'}
      - {type: contains, target: "map:haptic-consumer-group-allow.map", pattern: '(?m)^default/cg-ingress\|editors 1$'}
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/cg-ingress default/cg ok$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.cg_group\) var\(txn\.cg_secret\),concat\(\|,txn\.haptic_consumer\),map\([^)]*haptic-consumer-groups\.map\) if \{ var\(txn\.cg_state\) -m str ok \} \{ var\(txn\.haptic_consumer\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 403 if \{ var\(txn\.cg_state\) -m str ok \} !\{ var\(txn\.resource_id\),concat\(\|,txn\.cg_group\),map\([^)]*haptic-consumer-group-allow\.map\) -m found \}'
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_cg-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-consumer-groups-partial-fails:
    description: >-
      Setting allowed-consumer-groups without consumer-groups-secret (or vice
      versa) must fail the render loudly, not silently leave the route
      unauthorized (fail-open for a security feature).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-partial
            annotations:
              haproxy-haptic.org/allowed-consumer-groups: "admins"
          spec:
            ingressClassName: haptic
            rules:
              - host: cg-partial.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "requires BOTH"}

  test-haptic-consumer-groups-missing-secret-fails-closed:
    description: >-
      Consumer-group authorization fails closed with 503 while its Secret is absent
      from the watch cache: the map marks the route missing, the frontend denies it,
      and an Event names the Secret.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-missing-secret
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "not-observed-yet"
              haproxy-haptic.org/allowed-consumer-groups: "admins"
          spec:
            ingressClassName: haptic
            rules:
              - host: cg-missing.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/cg-missing-secret default/not-observed-yet missing$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.cg_state\) -m str missing invalid \}'}
      - {type: contains, target: events, pattern: "ConsumerGroupsSecretMissing"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'not-observed-yet'}

  test-haptic-consumer-groups-blank-list-fails-closed:
    description: >-
      A non-empty allowed-consumer-groups whose tokens all strip to nothing
      passed the both-annotations-required guard and then skipped the entire
      authorization block, serving every caller on a restricted route.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg-secret }
          type: Opaque
          data: {groups: YWxpY2U6Z3JvdXAtYQo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-blank
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "cg-secret"
              haproxy-haptic.org/allowed-consumer-groups: ", "
          spec:
            ingressClassName: haptic
            rules:
              - host: cg-blank.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/cg-blank default/cg-secret invalid$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.denied_by\) str\(consumer_groups_unavailable\) if \{ var\(txn\.cg_state\) -m str missing invalid \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.cg_state\) -m str missing invalid \}'}

  test-haptic-consumer-groups-blank-list-rejected-at-admission:
    description: >-
      Writing an Ingress whose allowed-consumer-groups lists no group names is
      refused when the resource is written, not only degraded to 503 later.
    extraContext: {renderMode: admission}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg-secret }
          type: Opaque
          data: {groups: YWxpY2U6Z3JvdXAtYQo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-blank
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "cg-secret"
              haproxy-haptic.org/allowed-consumer-groups: ", "
          spec:
            ingressClassName: haptic
            rules:
              - host: cg-blank.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - {type: contains, target: rendering_error, pattern: "with no group names in it"}
