# HAPTIC-native annotation library — JWT auth validation tests.
validationTests:
  test-haptic-jwt-auth:
    description: >-
      jwt-secret registers the public key and emits the alg-confusion-hardened
      verify chain (constant alg, header-alg guard), exp/iss/required-claim
      denies, sets the shared consumer from sub, and forwards claims after
      del-header'ing them. A missing key Secret fails closed with 503.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: jwt-keys }
          type: Opaque
          data:
            pubkey.pem: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-ingress
            annotations:
              haproxy-haptic.org/jwt-secret: "jwt-keys"
              haproxy-haptic.org/jwt-algorithm: "RS256"
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
              haproxy-haptic.org/jwt-audience: "my-api"
              haproxy-haptic.org/jwt-required-claims: "scope"
              haproxy-haptic.org/jwt-forward-claims: "sub:X-User-Id,email:X-User-Email"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nosecret
            annotations:
              haproxy-haptic.org/jwt-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: nosec.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      # nbf is the other half of the validity window. Without it a token minted
      # for a future window is usable the moment it is issued.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401 if \\{ var\\(txn\\.haptic_jwt_nbf\\) -m found \\} \\{ var\\(txn\\.haptic_jwt_nbf\\),sub\\(txn\\.haptic_jwt_now\\) -m int gt 0 \\}"
      # THE ORDERING IS THE SECURITY PROPERTY: the signature must be verified
      # before any claim is trusted, and the identity taken only at the end.
      # jwt_payload_query parses, it does not verify.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request deny deny_status 401 unless \\{ http_auth_bearer,jwt_verify\\("
          - "http-request deny deny_status 401 if \\{ var\\(txn\\.haptic_jwt_nbf\\) -m found \\}"
          - "http-request set-var\\(txn\\.haptic_consumer\\) http_auth_bearer,jwt_payload_query\\('\\$\\.sub'\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.haptic_jwt_alg\\) http_auth_bearer,jwt_header_query\\('\\$.alg'\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401 unless \\{ var\\(txn.haptic_jwt_alg\\) -m str RS256 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "jwt_verify\\(RS256,\"[^\"]*haptic-jwt-default-jwt-keys\\.pem\"\\) -m int 1"
      - type: contains
        target: haproxy.cfg
        pattern: "jwt_payload_query\\('\\$.iss'\\) -m str \"https://issuer.example.com\""
      - type: contains
        target: haproxy.cfg
        pattern: "jwt_payload_query\\('\\$.aud'\\) -m str \"my-api\""
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401 unless \\{ http_auth_bearer,jwt_payload_query\\('\\$.scope'\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.haptic_consumer\\) http_auth_bearer,jwt_payload_query\\('\\$.sub'\\) unless \\{ var\\(txn.haptic_consumer\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-User-Id"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-User-Id %\\[http_auth_bearer,jwt_payload_query\\('\\$.sub'\\)\\]"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503"

  test-haptic-jwt-annotations-without-secret-fail-closed:
    description: >-
      jwt-issuer and friends are inert without jwt-secret, so a route configured
      with them but no key was served with no token verification at all while the
      annotations read as if JWT auth were on.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nokey
            annotations:
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
              haproxy-haptic.org/jwt-required-claims: "sub"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt-nokey.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(jwt_unavailable\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503"

  test-haptic-jwt-annotations-without-secret-rejected-at-admission:
    description: >-
      Writing an Ingress with jwt-* annotations but no jwt-secret is refused when
      the resource is written.
    extraContext:
      renderMode: admission
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nokey
            annotations:
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt-nokey.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Tokens cannot be verified without the key"
