validationTests:
  test-haptic-waf-trusted-missing-no-tenant-fallback:
    _helm_skip_test: '{{ if not .Values.spoaHub.plugins.coraza.enabled }}true{{ end }}'
    requires:
    - ingresses
    fixtures:
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          namespace: default
          name: echo
        spec:
          ports:
          - port: 80
            targetPort: 8080
      secrets:
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: jwt-keys
        type: Opaque
        data:
          pubkey.pem: 
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: api-keys
        data:
          keys: a2V5LW9uZTphbGljZQprZXktdHdvOmJvYgo=
      configmaps:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          namespace: default
          name: waf-policies
        data:
          policies.yaml: "tenant:\n  requestBody: {mode: none}\ntrusted:\n  enforcement: detect\n  requestBody:\
            \ {mode: none}\n"
        immutable: true
      waf_selfservice_catalogs:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          namespace: default
          name: waf-policies
        data:
          policies.yaml: "tenant:\n  requestBody: {mode: none}\ntrusted:\n  enforcement: detect\n  requestBody:\
            \ {mode: none}\n"
        immutable: true
      ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          namespace: default
          name: trusted-ingress
          annotations:
            haproxy-haptic.org/waf-policy: trusted
        spec:
          ingressClassName: haptic
          rules:
          - host: trusted-ingress.example.com
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: echo
                    port:
                      number: 80
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          namespace: default
          name: inline-policy
          annotations:
            haproxy-haptic.org/waf-policy: inline-safe
        spec:
          ingressClassName: haptic
          rules:
          - host: inline-policy.example.com
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: echo
                    port:
                      number: 80
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          messages:
          - check-request
        plugins:
        - name: coraza
          library: libcoraza_plugin.so
          messages:
          - check-request
          timeoutMs: 15
          params: ''
          dependsOn: []
          directives: 'Include @coraza.conf-recommended

            Include @crs-setup.conf.example

            Include @owasp_crs/*.conf

            SecRuleEngine On

            '
      waf:
        dispatch:
          mode: opt-in
          defaultEnforcement: deny
        ingressPermissions:
          allowPolicySelection: true
        policies:
          defaultPolicy: ''
          inline:
            __replace__: true
            inline-safe:
              requestBody:
                mode: none
          configMapRefs:
            __replace__: true
            central:
              namespace: security
              name: catalog
          selfService:
            enabled: true
    assertions:
    - type: haproxy_valid
    - type: contains
      target: haproxy.cfg
      pattern: http-request deny deny_status 503 if \{ var\(txn.resource_id\) -m str default/trusted-ingress \}
    - type: not_contains
      target: map:coraza-app.map
      pattern: default/trusted-ingress
    - type: contains
      target: events
      pattern: cannot resolve safely
    - type: contains
      target: map:coraza-app.map
      pattern: (?m)^default/inline-policy policy:inline-safe$
