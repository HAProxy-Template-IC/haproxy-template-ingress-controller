# haptic-annotations library — feature validation tests (40-features.yaml).
# Covers the native haproxy-haptic.org/* redirects, HSTS, default-backend and
# raw config injection. All fixtures use ingressClassName: haptic.
validationTests:

  # Regression guards for the renderMode-aware rejection of a misconfigured
  # routing annotation (WebhookRejectOrWarn). A bad https-redirect-code is
  # denied at the admission webhook but only warned-and-skipped on a live
  # reconcile, so one already-present bad Ingress can't brick the fleet.
  test-haptic-invalid-redirect-code-admission-rejected:
    description: Under the admission webhook, an invalid https-redirect-code value is rejected.
    extraContext:
      renderMode: admission
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redir
            annotations:
              haproxy-haptic.org/https-redirect: "true"
              haproxy-haptic.org/https-redirect-code: "999"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-redir.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid value '999' for annotation 'haproxy-haptic.org/https-redirect-code'"

  test-haptic-invalid-redirect-code-reconcile-warns:
    description: On a live reconcile, an invalid https-redirect-code warns (Event) and the render still succeeds instead of failing.
    extraContext:
      renderMode: reconcile
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redir
            annotations:
              haproxy-haptic.org/https-redirect: "true"
              haproxy-haptic.org/https-redirect-code: "999"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-redir.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: events
        pattern: "Warning InvalidAnnotationValue networking.k8s.io/v1 Ingress default/bad-redir:"
      - type: contains
        target: events
        pattern: "Invalid value '999' for annotation 'haproxy-haptic.org/https-redirect-code'"

  test-haptic-ssl-redirect:
    description: haproxy-haptic.org/https-redirect registers the host in the shared ssl-redirect map (reload-free) with the requested code
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: redir-ingress
            annotations:
              haproxy-haptic.org/https-redirect: "true"
              haproxy-haptic.org/https-redirect-code: "301"
          spec:
            ingressClassName: haptic
            rules:
              - host: secure.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:ssl-redirect-301.map
        pattern: "secure\\.example\\.com"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect scheme https code 301 if !\\{ ssl_fc \\}"

  test-haptic-redirects:
    description: haproxy-haptic.org permanent- and temporary-redirect register host→URL in the shared redirect-loc maps with their default codes
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: perm-ingress
            annotations:
              haproxy-haptic.org/permanent-redirect: "https://new.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: old.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: temp-ingress
            annotations:
              haproxy-haptic.org/temporary-redirect: "https://sale.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: promo.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-301.map
        pattern: "old\\.example\\.com https://new\\.example\\.com"
      - type: contains
        target: map:redirect-loc-302.map
        pattern: "promo\\.example\\.com https://sale\\.example\\.com"

  test-haptic-hsts:
    description: haproxy-haptic.org/hsts registers the full Strict-Transport-Security value in hsts.map
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hsts-ingress
            annotations:
              haproxy-haptic.org/hsts: "true"
              haproxy-haptic.org/hsts-max-age: "31536000"
              haproxy-haptic.org/hsts-include-subdomains: "true"
              haproxy-haptic.org/hsts-preload: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: hsts.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:hsts.map
        pattern: "hsts.example.com max-age=31536000; includeSubDomains; preload"

  test-haptic-default-backend:
    description: haproxy-haptic.org/default-backend emits a backend pool plus a per-host catch-all path entry routing unmatched requests to that Service
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: app-service
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: errors-service
          spec:
            ports:
              - port: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: app-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: app-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: errors-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: errors-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
          ports:
            - port: 9000
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: db-ingress
            annotations:
              haproxy-haptic.org/default-backend: "errors-service"
          spec:
            ingressClassName: haptic
            rules:
              - host: db.example.com
                http:
                  paths:
                    - path: /app
                      pathType: Prefix
                      backend:
                        service:
                          name: app-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_db-ingress_default-backend_errors-service"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.9:9000"
      - type: contains
        target: map:path-prefix.map
        pattern: "db\\.example\\.com/ BACKEND:default_db-ingress_default-backend_errors-service"

  test-haptic-config-injection:
    description: haproxy-haptic.org config-global/config-defaults/config-frontend inject raw directives verbatim into their sections
    # Self-contained w.r.t. WAF governance: raw-config injection is gated by
    # allowRawHAProxyConfig once any WAF policy activates governance. Set it here
    # so this test passes whether or not the deployment defines a policy.
    extraContext:
      waf:
        ingressPermissions:
          allowRawHAProxyConfig: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cfg-ingress
            annotations:
              haproxy-haptic.org/config-global: "tune.bufsize 32768"
              haproxy-haptic.org/config-defaults: "option dontlognull"
              haproxy-haptic.org/config-frontend: "http-request set-header X-Haptic-Test yes"
          spec:
            ingressClassName: haptic
            rules:
              - host: cfg.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "tune.bufsize 32768"
      - type: contains
        target: haproxy.cfg
        pattern: "option dontlognull"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Test yes"
