# haptic-annotations library — SHARED rate-limiting validation tests.
# Covers the map producer (80-rate-limit-shared.yaml) and the spoa-hub
# source-IP/frontend and consumer/backend dispatch paths it feeds.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  test-haptic-rate-limit-shared-ip:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: shared rate-limit-requests (ip key, token-bucket) -> packed map + SPOE dispatch
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-ip
            annotations:
              haproxy-haptic.org/rate-limit-requests: "100"
              haproxy-haptic.org/rate-limit-period: "1m"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-ip.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # Packed rule: limit=100, period 1m->60s, burst defaults to limit,
      # mode lease (token-bucket default), keyspec ip (default).
      - {type: contains, target: map:rate-limit.map, pattern: "default/rl-ip 100 60 100 lease ip"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group"
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "set-var\\(txn.rl_rule_invalid\\).*txn.rl_period"
          - "set-var\\(txn.rl_rule_invalid\\).*txn.rl_keyspec.*ip consumer"
          - "set-var\\(txn.denied_by\\) str\\(rate_limit_shared_invalid\\)"
          - "send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 429 hdr Retry-After"}
      - type: contains
        target: haproxy.cfg
        pattern: "!\\{ var\\(txn\\.hub\\.rate_limit\\.allowed\\) -m found \\}"
      - {type: contains, target: haproxy.cfg, pattern: "http-after-response set-header X-RateLimit-Limit"}

  # Gated on coraza too: the SPOE group it matches is emitted by the deployment,
  # not the fixture, so extraContext cannot make this self-contained (#129).
  test-haptic-rate-limit-shared-ip-before-waf:
    _helm_skip_test: '{{ if or (not .Values.rateLimit.shared.enabled) (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: source-IP rate limiting must reject floods before Coraza spends WAF CPU
    extraContext:
      waf:
        ingressPermissions: {allowPolicySelection: true, allowEnforcementOverride: true}
        policies: {defaultPolicy: "", inline: {baseline: {}}, configMapRefs: { __replace__: true }}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-ip-waf
            annotations:
              haproxy-haptic.org/rate-limit-requests: "100"
              haproxy-haptic.org/rate-limit-period: "1m"
              haproxy-haptic.org/waf-policy: baseline
              haproxy-haptic.org/waf-mode: deny
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-ip-waf.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if .*txn\\.rl_keyspec.* ip"
          - "send-spoe-group spoa-hub-check-request check-request-group"

  test-haptic-rate-limit-shared-exact-consumer:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: rate-limit-algorithm gcra → exact mode; rate-limit-key consumer; burst override
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: api-keys }
          type: Opaque
          data: {keys: YXBpa2V5LWFiYzEyMzphbGljZQo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-exact
            annotations:
              haproxy-haptic.org/rate-limit-requests: "50"
              haproxy-haptic.org/rate-limit-burst: "75"
              haproxy-haptic.org/rate-limit-key: "consumer"
              haproxy-haptic.org/rate-limit-algorithm: "gcra"
              haproxy-haptic.org/api-key-secret: "api-keys"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-exact.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # limit=50, period default 1s→1, burst=75, mode exact (gcra), keyspec consumer.
      - {type: contains, target: map:rate-limit.map, pattern: "default/rl-exact 50 1 75 exact consumer"}
      - type: contains
        target: haproxy.cfg
        pattern: "haptic/shared-rate-limit consumer \\(default/rl-exact\\)"
      - type: not_contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.denied_by\\) str\\(rate_limit_shared_unavailable\\) if .*var\\(txn.rl_mode\\) -m str exact.*!\\{ var\\(txn.hub.rate_limit.allowed\\) -m found \\}"
      - type: not_contains
        target: haproxy.cfg
        pattern: "deny deny_status 429 hdr Retry-After 1 if .*var\\(txn.rl_mode\\) -m str exact.*!\\{ var\\(txn.hub.rate_limit.allowed\\) -m found \\}"
      - type: match_order
        target: haproxy.cfg
        description: consumer quota dispatch must use the identity established by native authentication
        patterns:
          - "set-var\\(txn\\.haptic_consumer\\).*haptic-apikeys-default-api-keys\\.map"
          - "send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if .*txn\\.rl_keyspec.* consumer"

  test-haptic-rate-limit-shared-strict-unavailable:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: strict shared rate limiting denies a missing verdict in every mode
    extraContext:
      rateLimit:
        shared:
          failClosed: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-strict
            annotations:
              haproxy-haptic.org/rate-limit-requests: "50"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-strict.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.denied_by\\) str\\(rate_limit_shared_unavailable\\) if .*!\\{ var\\(txn.hub.rate_limit.allowed\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "deny deny_status 429 hdr Retry-After 1 if .*!\\{ var\\(txn.hub.rate_limit.allowed\\) -m found \\}"

  test-haptic-rate-limit-shared-consumer-cache-route:
    _helm_skip_test: '{{ if not (and .Values.cache.varnish.enabled .Values.rateLimit.shared.enabled) }}true{{ end }}'
    description: >-
      A cache-enabled route with a consumer-keyed shared limit dispatches on
      the CLIENT leg (issue #134): the api-key snippet at band 860 establishes
      the consumer, the dispatch at 863 is scoped to cache-enabled routes via
      the cache-enable map, and both precede the varnish_cache switch. The
      backend copy is dropped — it would be inert on both legs.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: api-keys }
          type: Opaque
          data: {keys: YXBpa2V5LWFiYzEyMzphbGljZQo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-rl-consumer
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-requests: "50"
              haproxy-haptic.org/rate-limit-key: "consumer"
              haproxy-haptic.org/api-key-secret: "api-keys"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-rl-consumer.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:rate-limit.map
        pattern: "default/cache-rl-consumer 50 1 50 lease consumer"
      - type: contains
        target: haproxy.cfg
        pattern: "# haptic/shared-rate-limit consumer on the client leg"
      # Every client-leg dispatch rule carries the cache-enable-map scope, so a
      # non-cached consumer route keeps its backend dispatch undoubled.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if \\{ var\\(txn\\.rl_limit\\) -m found \\} \\{ var\\(txn\\.rl_keyspec\\) -m str consumer \\} !\\{ var\\(txn\\.rl_rule_invalid\\) -m bool \\} \\{ var\\(txn\\.resource_id\\),map\\([^)]*haptic-cache-enable\\.map\\) -m found \\}"
      - type: match_order
        target: haproxy.cfg
        description: identity (860) before dispatch (863) before the cache switch (865)
        patterns:
          - "set-var\\(txn\\.haptic_consumer\\).*haptic-apikeys-default-api-keys\\.map"
          - "send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if .*txn\\.rl_keyspec.* consumer .*haptic-cache-enable"
          - "use_backend varnish_cache"
      - type: not_contains
        target: haproxy.cfg
        description: no backend copy — inert on the client leg, no txn.rl_* on the origin leg
        pattern: "# haptic/shared-rate-limit consumer \\(default/cache-rl-consumer\\)"

  test-haptic-rate-limit-shared-consumer-cache-requires-api-key:
    _helm_skip_test: '{{ if not (and .Values.cache.varnish.enabled .Values.rateLimit.shared.enabled) }}true{{ end }}'
    description: >-
      cache-enable + rate-limit-key consumer without api-key-secret is refused
      at admission: no client-leg identity source exists (JWT resolves in the
      backend a cached route never enters), so the limit could only fall back
      to source IP silently.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-rl-noid
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/rate-limit-requests: "50"
              haproxy-haptic.org/rate-limit-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-rl-noid.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "combines 'haproxy-haptic.org/cache-enable' with 'haproxy-haptic.org/rate-limit-key: consumer'"

  test-haptic-rate-limit-shared-consumer-cache-no-api-key-fails-closed:
    _helm_skip_test: '{{ if not (and .Values.cache.varnish.enabled .Values.rateLimit.shared.enabled) }}true{{ end }}'
    description: >-
      The same pairing on a route that already exists at reconcile time must
      not brick the fleet: the route fails closed with 503 (plus a Warning
      Event) instead of aborting the render, and no dispatch is emitted.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-rl-noid
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/rate-limit-requests: "50"
              haproxy-haptic.org/rate-limit-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-rl-noid.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(rate_limit_consumer_unavailable\\) if \\{ var\\(txn\\.resource_id\\) -m str default/cache-rl-noid \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn\\.resource_id\\) -m str default/cache-rl-noid \\}"
      - type: not_contains
        target: haproxy.cfg
        description: no client-leg dispatch for a route whose identity source is missing
        pattern: "# haptic/shared-rate-limit consumer on the client leg"

  test-haptic-rate-limit-shared-invalid-requests:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: non-positive rate-limit-requests fails the render
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-bad
            annotations:
              haproxy-haptic.org/rate-limit-requests: "0"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Must be a positive integer"}

  test-haptic-rate-limit-shared-invalid-period-zero:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: zero period fails before the plugin receives an invalid rule
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-zero-period
            annotations:
              haproxy-haptic.org/rate-limit-requests: "10"
              haproxy-haptic.org/rate-limit-period: "0ms"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-zero-period.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Must be greater than zero"}

  test-haptic-rate-limit-shared-refill-horizon-too-long:
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: a rule whose refill horizon exceeds the plugin state TTL is rejected
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-long-horizon
            annotations:
              haproxy-haptic.org/rate-limit-requests: "10"
              haproxy-haptic.org/rate-limit-period: "1h"
              haproxy-haptic.org/rate-limit-burst: "20"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-long-horizon.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Ingress default/rl-long-horizon has a shared rate-limit refill horizon above 3600 seconds"

  test-haptic-rate-limit-shared-requires-opt-in:
    _helm_skip_test: '{{ if .Values.rateLimit.shared.enabled }}true{{ end }}'
    description: rate-limit-requests fails loudly when the shared rate-limit feature is not enabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-disabled
            annotations:
              haproxy-haptic.org/rate-limit-requests: "10"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-disabled.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "shared rate limiting is not enabled"}

  test-haptic-rate-limit-store-resource:
    description: >-
      With shared rate limiting on, the optional Valkey store emits Sentinel-managed HA
      resources via k8sResources
    extraContext:
      rateLimit:
        shared:
          # Required, not incidental: the store renders only when the shared limiter is
          # on, because that is the condition under which role.yaml grants the RBAC to
          # apply it. A per-test extraContext deep-merges over the production one, so
          # setting managedStore alone does NOT imply this.
          enabled: true
          managedStore:
            enabled: true
            serviceName: haptic-rate-limit-store
            namespace: default
            port: 6379
            image: valkey/valkey:8-alpine
            replicas: 3
            sentinel: {port: 26379, masterName: haptic-rate-limit, quorum: 2}
    fixtures:
      ingresses: []
    assertions:
      - {type: contains, target: "k8s:rate-limit-store", pattern: "kind: Service"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "name: haptic-rate-limit-store-sentinel"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "kind: StatefulSet"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "kind: PodDisruptionBudget"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "name: haptic-rate-limit-store"}
      - type: contains
        target: "k8s:rate-limit-store"
        pattern: "app.kubernetes.io/instance: haptic-rate-limit-store"
      - {type: contains, target: "k8s:rate-limit-store", pattern: "image: valkey/valkey:8-alpine"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "sentinel monitor haptic-rate-limit"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "containerPort: 6379"}
      - {type: contains, target: "k8s:rate-limit-store", pattern: "containerPort: 26379"}
      # Without this every valkey-server announces its pod IP, Sentinel holds the
      # same pod under both an IP and a hostname, and a failover tells the freshly
      # promoted node to replicate from itself — leaving the tier with no primary.
      - {type: contains, target: "k8s:rate-limit-store", pattern: 'replica-announce-ip "\$self"'}

  test-haptic-rate-limit-store-requires-shared-opt-in:
    description: >-
      managedStore.enabled alone does NOT deploy the store — the render gate must match
      the RBAC gate in templates/role.yaml
    # THE REGRESSION GUARD for the forbidden-apply hot loop. managedStore.enabled
    # defaults to TRUE while shared.enabled defaults to FALSE, and role.yaml grants
    # apps/statefulsets + policy/poddisruptionbudgets only when BOTH are set. Before the
    # fix this combination — which is the CHART DEFAULT — rendered a Valkey StatefulSet
    # and PDB the controller had no permission to apply, so it retried ~9.5x/second
    # forever, logging at ERROR with no metric, no status condition and no non-zero exit
    # to surface it. If anyone loosens the render gate again, this goes red.
    #
    # Note the paired positive above (test-haptic-rate-limit-store-resource): together
    # they prove the gate discriminates, rather than this one passing because the
    # resource name is misspelled. An absent k8sResources key resolves to the empty
    # string, so a not_contains alone would pass vacuously.
    extraContext:
      rateLimit:
        shared:
          enabled: false
          managedStore: {enabled: true, serviceName: haptic-rate-limit-store, namespace: default}
    fixtures:
      ingresses: []
    assertions:
      - type: not_contains
        target: "k8s:rate-limit-store"
        pattern: "kind: StatefulSet"
        description: No Valkey StatefulSet without the shared limiter — the Role can't apply one
      - type: not_contains
        target: "k8s:rate-limit-store"
        pattern: "kind: PodDisruptionBudget"
        description: >-
          Nor a PDB. The Role's policy grant is or-combined with the varnish tier, so
          cache.varnish.enabled=true with its own PDB disabled re-exposes exactly this
      - type: not_contains
        target: "k8s:rate-limit-store"
        pattern: "kind: Service"
        description: >-
          Nor the headless and sentinel Services. These DID get created before the fix
          (services RBAC is unconditional), leaving two Services for a store that never
          existed

  test-haptic-rate-limit-store-requires-managed-store:
    description: With an external store, the shared limiter deploys no chart-owned workload
    # The bring-your-own-store path: shared limiting on, chart store off. Pins that
    # `enabled: false` is honoured rather than being treated as "unset, use the default".
    extraContext:
      rateLimit:
        shared:
          enabled: true
          managedStore: {enabled: false}
          externalStore:
            urls:
              - redis://byo-valkey:6379
    fixtures:
      ingresses: []
    assertions:
      - type: not_contains
        target: "k8s:rate-limit-store"
        pattern: "kind: StatefulSet"
        description: The operator's own store is in use, so the chart deploys none

  test-haptic-rate-limit-store-sentinel-tilt-safe-defaults:
    description: >-
      Sentinel blinds itself for a fixed 30s (TILT) when the deleted primary's
      hostname stalls its event loop, then rejects any replica whose link has
      been down longer than downAfterMilliseconds x 10. The default must survive
      a full TILT window, and the resolver must be bounded so TILT is unlikely.
    extraContext:
      rateLimit:
        shared:
          enabled: true
          managedStore: {enabled: true, serviceName: haptic-rate-limit-store, namespace: default, replicas: 3}
    fixtures:
      ingresses: []
    assertions:
      # 5000 x 10 = 50s allowance vs a ~35s gap. 2000 gave 20s and wedged forever.
      - type: contains
        target: "k8s:rate-limit-store"
        pattern: 'sentinel down-after-milliseconds haptic-rate-limit 5000'
      - type: not_contains
        target: "k8s:rate-limit-store"
        pattern: 'sentinel down-after-milliseconds haptic-rate-limit (2000|3000)\b'
      # Bounded resolver: the stock 5s x 2 per search domain is what trips TILT.
      # Anchored on newlines: a bare `contains dnsConfig` passed while the key was
      # fused onto the previous line as `spec:dnsConfig:`, which is invalid YAML
      # the API server rejects — the render looked fine and the store never applied.
      - {type: contains, target: "k8s:rate-limit-store", pattern: '\n      dnsConfig:\n'}
      - {type: not_contains, target: "k8s:rate-limit-store", pattern: '[a-zA-Z]:dnsConfig'}
      - type: match_order
        target: "k8s:rate-limit-store"
        patterns:
          - 'dnsConfig'
          - 'name: timeout'
          - 'value: "1"'

  test-haptic-rate-limit-store-sentinel-down-after-too-low-rejected:
    description: >-
      An operator-set downAfterMilliseconds at or below 3333 makes Valkey
      failover abort permanently, so the render refuses it rather than shipping
      a store that silently cannot fail over.
    extraContext:
      rateLimit:
        shared:
          enabled: true
          managedStore:
            enabled: true
            serviceName: haptic-rate-limit-store
            namespace: default
            replicas: 3
            sentinel: {downAfterMilliseconds: 2000}
    fixtures:
      ingresses: []
    assertions:
      - {type: contains, target: rendering_error, pattern: "below the 3334 ms minimum"}

  test-haptic-rate-limit-store-sentinel-down-after-boundary-accepted:
    description: >-
      3334 is the lowest value that survives a full 30s TILT window
      (3334 x 9 = 30006 > 30000) and must be accepted. Pins the guard's boundary
      against an off-by-one in either direction.
    extraContext:
      rateLimit:
        shared:
          enabled: true
          managedStore:
            enabled: true
            serviceName: haptic-rate-limit-store
            namespace: default
            replicas: 3
            sentinel: {downAfterMilliseconds: 3334}
    fixtures:
      ingresses: []
    assertions:
      - type: contains
        target: "k8s:rate-limit-store"
        pattern: 'sentinel down-after-milliseconds haptic-rate-limit 3334'
