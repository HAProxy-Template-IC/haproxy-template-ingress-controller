# HAPTIC-native annotation library — rewrite / upstream-header / next-upstream /
# session-affinity validation tests (haproxy-haptic.org/*).
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  test-haptic-path-rewrite:
    description: haproxy-haptic.org/path-rewrite — anything that is not a prefix strip keeps the backend replace-path rule (an unanchored pattern, an exact `^...$` match, a regex metacharacter in the prefix, a `\1` in the middle of the replacement, a `%` in the replacement) and no map-lane block is emitted for them
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-two
            annotations:
              haproxy-haptic.org/path-rewrite: "/foo/(.*) /bar/\\1"
          spec:
            ingressClassName: haptic
            rules:
              - host: two.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-exact
            annotations:
              haproxy-haptic.org/path-rewrite: "^/old$ /new"
          spec:
            ingressClassName: haptic
            rules:
              - host: exact.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-meta
            annotations:
              haproxy-haptic.org/path-rewrite: "^/v1.0/(.*) /\\1"
          spec:
            ingressClassName: haptic
            rules:
              - host: meta.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-mid
            annotations:
              haproxy-haptic.org/path-rewrite: "^/a/(.*) /b/\\1/c"
          spec:
            ingressClassName: haptic
            rules:
              - host: mid.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-fmt
            annotations:
              haproxy-haptic.org/path-rewrite: "^/x/(.*) /%[path]"
          spec:
            ingressClassName: haptic
            rules:
              - host: fmt.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path /foo/\(\.\*\) /bar/\\1'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path \^/old\$ /new'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path \^/v1\.0/\(\.\*\) /\\1'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path \^/a/\(\.\*\) /b/\\1/c'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path \^/x/\(\.\*\) /%\[path\]'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.rw_in\)'}

  test-haptic-path-rewrite-map-lane:
    description: A prefix strip (`^<prefix>(.*)` with `<new prefix>\1` or a plain `<new path>`, `$` optional) and the bare form ride the frontend map lane — an exact routes map gates a prefix-tree lookup on "<route id>|<path>" whose value is the byte offset to drop plus the new prefix, the backend body stays plain, and a bare value ending in `\1` keeps the whole path after it
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-strip
            annotations:
              haproxy-haptic.org/path-rewrite: "^/api/v1/(.*) /\\1"
          spec:
            ingressClassName: haptic
            rules:
              - host: strip.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-empty
            annotations:
              haproxy-haptic.org/path-rewrite: "^/api/v1(.*)$ \\1"
          spec:
            ingressClassName: haptic
            rules:
              - host: empty.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-drop
            annotations:
              haproxy-haptic.org/path-rewrite: "^/old/.* /new"
          spec:
            ingressClassName: haptic
            rules:
              - host: drop.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-bare
            annotations:
              haproxy-haptic.org/path-rewrite: "/backend"
          spec:
            ingressClassName: haptic
            rules:
              - host: bare.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-barecap
            annotations:
              haproxy-haptic.org/path-rewrite: "/foo\\1"
          spec:
            ingressClassName: haptic
            rules:
              - host: barecap.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.rw_in\) path if \{ var\(txn\.resource_id\),map\(\S*/haptic-rewrite-routes\.map\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.rw_v\) var\(txn\.resource_id\),concat\(\|,txn\.rw_in\),map_beg\(\S*/haptic-rewrite-prefix\.map\) if \{ var\(txn\.rw_in\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: "http-request set-var\\(txn\\.rw_off\\) var\\(txn\\.rw_v\\),field\\(1,' '\\),add\\(0\\) if \\{ var\\(txn\\.rw_v\\) -m found \\}"}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.rw_rest\) var\(txn\.rw_in\),bytes\(txn\.rw_off\) if \{ var\(txn\.rw_v\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: "http-request set-path %\\[var\\(txn\\.rw_v\\),field\\(2,' ',0\\)\\]%\\[var\\(txn\\.rw_rest\\)\\] if \\{ var\\(txn\\.rw_v\\) -m found \\}"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'replace-path'}
      - {type: contains, target: "map:haptic-rewrite-routes.map", pattern: '(?m)^default/pr-strip 1$'}
      - {type: contains, target: "map:haptic-rewrite-routes.map", pattern: '(?m)^default/pr-bare 1$'}
      - {type: contains, target: "map:haptic-rewrite-prefix.map", pattern: '(?m)^default/pr-strip\|/api/v1/ 8 /$'}
      - {type: contains, target: "map:haptic-rewrite-prefix.map", pattern: '(?m)^default/pr-empty\|/api/v1 7$'}
      - {type: contains, target: "map:haptic-rewrite-prefix.map", pattern: '(?m)^default/pr-drop\|/old/ 1048576 /new$'}
      - {type: contains, target: "map:haptic-rewrite-prefix.map", pattern: '(?m)^default/pr-bare\| 1048576 /backend$'}
      # Bare form with a trailing \1: replace-path (.*) captures the whole path
      # from offset 0, so "/foo\1" is /foo plus the whole path; offset 0 keeps it.
      - {type: contains, target: "map:haptic-rewrite-prefix.map", pattern: '(?m)^default/pr-barecap\| 0 /foo$'}

  test-haptic-proxy-body-size:
    description: haproxy-haptic.org/max-request-body-size — size with suffix lands in body-size.map as bytes
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: bs-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bs-ing
            annotations:
              haproxy-haptic.org/max-request-body-size: "8m"
          spec:
            ingressClassName: haptic
            rules:
              - host: body.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: bs-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:body-size.map, pattern: "default_bs-ing_svc_bs-svc_80 8388608"}

  test-haptic-request-buffering-off:
    description: haproxy-haptic.org/request-buffering — off lands in request-buffering.map, overriding the fleet-wide on default for this backend only
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: rb-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rb-ing
            annotations:
              haproxy-haptic.org/request-buffering: "off"
          spec:
            ingressClassName: haptic
            rules:
              - host: buffer.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: rb-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:request-buffering.map, pattern: "default_rb-ing_svc_rb-svc_80 off"}

  test-haptic-request-buffering-invalid:
    description: haproxy-haptic.org/request-buffering — a value other than on/off is rejected at admission
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rb-bad-ing
            annotations:
              haproxy-haptic.org/request-buffering: "yes"
          spec:
            ingressClassName: haptic
            rules:
              - host: buffer-bad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: rb-svc, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid value 'yes' for annotation 'haproxy-haptic.org/request-buffering'"

  test-haptic-next-upstream:
    description: haproxy-haptic.org/retry-on maps to retry-on plus retries
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nu-ing
            annotations:
              haproxy-haptic.org/retry-on: "error timeout http_503"
              haproxy-haptic.org/retries: "3"
          spec:
            ingressClassName: haptic
            rules:
              - host: nextup.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "retry-on conn-failure response-timeout 503"}
      - {type: contains, target: haproxy.cfg, pattern: "retries 3"}

  test-haptic-upstream-headers:
    description: set-host / x-forwarded-prefix / backend-connection-header relocate to reload-free reqhdr maps
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: hdr-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-ing
            annotations:
              haproxy-haptic.org/set-host: "internal.svc.local"
              haproxy-haptic.org/x-forwarded-prefix: "/api"
              haproxy-haptic.org/backend-connection-header: "keep-alive"
          spec:
            ingressClassName: haptic
            rules:
              - host: hdr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: hdr-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:reqhdr-host.map
        pattern: "default_hdr-ing_svc_hdr-svc_80 internal.svc.local"
      - {type: contains, target: map:reqhdr-xfwd-prefix.map, pattern: "default_hdr-ing_svc_hdr-svc_80 %2fapi"}
      - type: contains
        target: map:reqhdr-connection.map
        pattern: "default_hdr-ing_svc_hdr-svc_80 keep-alive"

  test-haptic-upstream-headers-encoding:
    description: A set-host / x-forwarded-prefix value with a space, a + and a % is URL-encoded in the reqhdr maps (space -> %20, + -> %2b, % -> %25), so the shared url_dec(1) reader round-trips it instead of turning + into a space or failing on the %.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: enc-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: enc-ing
            annotations:
              haproxy-haptic.org/x-forwarded-prefix: "/a b+c%d"
              haproxy-haptic.org/set-host: "up+stream.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: enc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: enc-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:reqhdr-xfwd-prefix.map, pattern: "default_enc-ing_svc_enc-svc_80 %2fa%20b%2bc%25d"}
      - {type: contains, target: map:reqhdr-host.map, pattern: "default_enc-ing_svc_enc-svc_80 up%2bstream\\.example\\.com"}
      # Negative control: the raw value must not leak into the map (it would be
      # mangled by the runtime CLI and mis-decoded by url_dec(1)).
      - {type: not_contains, target: map:reqhdr-xfwd-prefix.map, pattern: "b\\+c"}

  test-haptic-session-affinity:
    description: haproxy-haptic.org/affinity=cookie builds a best-of-breed cookie directive with dynamic key
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: aff-ing
            annotations:
              haproxy-haptic.org/affinity: "cookie"
              haproxy-haptic.org/session-cookie-name: "HAPTICSESS"
              haproxy-haptic.org/session-cookie-keywords: "httponly"
              haproxy-haptic.org/session-cookie-path: "/"
              haproxy-haptic.org/session-cookie-secure: "true"
              haproxy-haptic.org/session-cookie-samesite: "Strict"
              haproxy-haptic.org/session-cookie-max-age: "3600"
          spec:
            ingressClassName: haptic
            rules:
              - host: aff.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "cookie HAPTICSESS insert indirect nocache dynamic httponly attr Path=/ attr Secure attr SameSite=Strict attr Max-Age=3600"
      - {type: contains, target: haproxy.cfg, pattern: "dynamic-cookie-key "}
