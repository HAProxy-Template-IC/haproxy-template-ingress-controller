# HAPTIC-native annotation library — API-key auth validation tests.
validationTests:
  test-haptic-api-key:
    description: >-
      api-key-secret builds a reload-free apikeys map, the header key is checked
      (deny 401 on unknown key), the resolved consumer id is set into
      txn.haptic_consumer, and api-key-consumer-header forwards it upstream.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: api-keys }
          type: Opaque
          data:
            # apikey-abc123:alice / apikey-def456:bob
            keys: YXBpa2V5LWFiYzEyMzphbGljZQphcGlrZXktZGVmNDU2OmJvYgo=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: api-ingress
            annotations:
              haproxy-haptic.org/api-key-secret: "api-keys"
              haproxy-haptic.org/api-key-header: "X-API-Key"
              haproxy-haptic.org/api-key-consumer-header: "X-Consumer-ID"
          spec:
            ingressClassName: haptic
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-apikeys-default-api-keys.map", pattern: "apikey-abc123 alice"}
      - {type: contains, target: "map:haptic-apikeys-default-api-keys.map", pattern: "apikey-def456 bob"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.haptic_apikey\\) req.hdr\\(X-API-Key\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401 unless \\{ var\\(txn.haptic_apikey\\),map\\([^)]*haptic-apikeys-default-api-keys\\.map\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.haptic_consumer\\) var\\(txn.haptic_apikey\\),map\\([^)]*haptic-apikeys-default-api-keys\\.map\\) unless \\{ var\\(txn.haptic_consumer\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Consumer-ID %\\[var\\(txn.haptic_consumer\\)\\] if \\{ var\\(txn.haptic_consumer\\) -m found \\}"
      # The set is conditional on an identity existing, so without a strip a
      # caller's own X-Consumer-ID survives on any path that reaches the backend
      # without one — a `satisfy: any` route admitted by its IP allowlist — and
      # is forwarded to the application as the consumer.
      - {type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Consumer-ID"}
      # Ordering is the fix, not presence: a strip after the set would erase the
      # value HAPTIC just established.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Consumer-ID"
          - "http-request set-header X-Consumer-ID %\\[var\\(txn.haptic_consumer\\)\\]"

  test-haptic-api-key-missing-secret-fails-closed:
    description: >-
      An API-key-protected route fails closed with 503 while its Secret is
      absent from the watch cache and never references an unregistered map.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: api-ingress-missing-secret
            annotations:
              haproxy-haptic.org/api-key-secret: "not-observed-yet"
          spec:
            ingressClassName: haptic
            rules:
              - host: api-missing.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "WARNING haproxy-haptic.org/api-key-secret: referenced Secret not found.*failing closed \\(503\\)"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}
      - {type: not_contains, target: haproxy.cfg, pattern: "haptic-apikeys-default-not-observed-yet\\.map"}
      # The tenant-controlled Secret name must not be interpolated into a rendered
      # comment (a newline in it would inject a directive); it is absent from config.
      - {type: not_contains, target: haproxy.cfg, pattern: "not-observed-yet"}
