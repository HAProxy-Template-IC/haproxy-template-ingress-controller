# HAPTIC-native annotation library — API-key auth validation tests.
validationTests:
  test-haptic-api-key:
    description: >-
      api-key-secret builds the reload-free key→consumer map, the route's settings
      land in haptic-api-key-routes.map, and one frontend block checks the header key
      (deny 401 on an unknown key), sets txn.haptic_consumer and forwards it in
      api-key-consumer-header. The backend section stays plain.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: api-keys }
          type: Opaque
          data:
            # apikey-abc123:alice / apikey-def456:bob
            keys: YXBpa2V5LWFiYzEyMzphbGljZQphcGlrZXktZGVmNDU2OmJvYgo=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: api-ingress
            annotations:
              haproxy-haptic.org/api-key-secret: "api-keys"
              haproxy-haptic.org/api-key-header: "X-API-Key"
              haproxy-haptic.org/api-key-consumer-header: "X-Consumer-ID"
          spec:
            ingressClassName: haptic
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-apikeys.map", pattern: '(?m)^default/api-keys\|apikey-abc123 alice$'}
      - {type: contains, target: "map:haptic-apikeys.map", pattern: '(?m)^default/api-keys\|apikey-def456 bob$'}
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/api-ingress hdr X-API-Key default/api-keys ok X-Consumer-ID$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.haptic_apikey\) req\.hdr\(X-API-Key\) if \{ var\(txn\.ak_src\) -m str hdr \} \{ var\(txn\.ak_name\) -m str X-API-Key \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 401 if \{ var\(txn\.ak_state\) -m str ok \} !\{ var\(txn\.ak_consumer\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.haptic_consumer\) var\(txn\.ak_consumer\) if \{ var\(txn\.ak_consumer\) -m found \} !\{ var\(txn\.haptic_consumer\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-header X-Consumer-ID %\[var\(txn\.haptic_consumer\)\] if \{ var\(txn\.ak_fwd\) -m str X-Consumer-ID \} \{ var\(txn\.haptic_consumer\) -m found \}'
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request del-header X-Consumer-ID if \{ var\(txn\.ak_fwd\) -m str X-Consumer-ID \}'
          - 'http-request set-header X-Consumer-ID %\[var\(txn\.haptic_consumer\)\]'
      # The check lives on the frontend; the backend section stays plain (dynamic on 3.4).
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_api-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}
      - {type: not_contains, target: haproxy.cfg, pattern: 'haptic/api-key \(default/api-ingress\)'}

  test-haptic-api-key-missing-secret-fails-closed:
    description: >-
      An API-key-protected route fails closed with 503 while its Secret is absent
      from the watch cache: the map marks the route missing, the frontend denies it,
      and an Event names the Secret.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: api-ingress-missing-secret
            annotations:
              haproxy-haptic.org/api-key-secret: "not-observed-yet"
          spec:
            ingressClassName: haptic
            rules:
              - host: api-missing.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/api-ingress-missing-secret hdr X-API-Key default/not-observed-yet missing _$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 503 if \{ var\(txn\.ak_state\) -m str missing nosecret \}'
      - {type: contains, target: events, pattern: "ApiKeySecretMissing"}
      - {type: not_contains, target: haproxy.cfg, pattern: "not-observed-yet"}

  test-haptic-api-key-annotations-without-secret-fail-closed:
    description: >-
      api-key-header and friends are inert without api-key-secret, so a route
      configured with them but no Secret was served with no key check at all
      while the annotations read as if API-key auth were on.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ak-nosecret
            annotations:
              haproxy-haptic.org/api-key-header: "X-Token"
              haproxy-haptic.org/api-key-consumer-header: "X-Consumer-ID"
          spec:
            ingressClassName: haptic
            rules:
              - host: ak-nosecret.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/ak-nosecret _ _ _ nosecret _$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.ak_state\) -m str missing nosecret \}'}
      - {type: contains, target: events, pattern: "ApiKeySecretMissing"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'req\.hdr\(X-Token\)'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'X-Consumer-ID'}

  test-haptic-api-key-annotations-without-secret-rejected-at-admission:
    description: >-
      Writing an Ingress with api-key-* annotations but no api-key-secret is
      refused when the resource is written.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ak-nosecret
            annotations:
              haproxy-haptic.org/api-key-query: "token"
          spec:
            ingressClassName: haptic
            rules:
              - host: ak-nosecret.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - {type: contains, target: rendering_error, pattern: "Keys cannot be checked without it"}
