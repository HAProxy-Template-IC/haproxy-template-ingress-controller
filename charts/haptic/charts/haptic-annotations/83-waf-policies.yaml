# HAPTIC-native Coraza WAF policies (haproxy-haptic.org/*).
#
# Ingress owners select one exact policy name:
#
#   haproxy-haptic.org/waf-policy: public-web
#
# HAPTIC administrators and WAF policy authors own the policy catalog under
# extraContext.waf.policies.inline and/or trusted cross-namespace ConfigMaps.
# With policies.selfService enabled, each namespace may additionally author
# policies for its OWN Ingresses in a well-known ConfigMap (default
# `waf-policies`) in that namespace: names resolve trusted-catalog first, then
# own-namespace; a broken self-service catalog/policy fails only that
# namespace's selecting routes closed (503 + Warning Events) instead of the
# global render; secLang requires selfService.allowSecLang.
# There are deliberately no route-selectable built-in policies: body inspection,
# enforcement, exclusions, and permitted Ingress overrides are security policy.
#
# An Ingress selects one policy with `haproxy-haptic.org/waf-policy: <name>` and
# may override its enforcement per route with `haproxy-haptic.org/waf-mode`
# (deny|detect, gated by ingressPermissions.allowEnforcementOverride) — the
# standard detect-then-enforce rollout on a shared policy. Arbitrary route-local
# SecLang is NOT an Ingress annotation: rule authoring lives in an
# administrator-owned trusted policy's `secLang`; tenants tune via the
# structured policy fields (enforcement, requestBody, allowedMethods,
# paranoiaLevel, anomalyThreshold, crsSettings, ruleExclusions) — fine-tuning a
# rule's inputs, not disabling the rule. The effective directive
# order in a policy's Coraza application is:
#
#   setup-position fields (allowedMethods/paranoia/thresholds, path-scoped
#     ruleExclusions) spliced BEFORE the CRS include
#   -> chart-wide Coraza/CRS directives (incl. the CRS include)
#   -> policy exclusions (rule/target removals) + policy secLang
#   -> HAPTIC body-safety directives (not overridable)
templateSnippets:
  # Central scan/validation pass. Its name sorts after the nginx-ingress vendor
  # scan in spoa-hub's util-*-coraza-scan glob, so it preserves vendor apps and
  # appends HAPTIC apps instead of clobbering them.
  util-waf-haptic-coraza-scan:
    template: |-
      {%- import "util-waf-governance" for WafGovernance -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("sphCorazaScanHaptic", func() any {
          var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} })
          var gf = shared.Get("globalFeatures").(map[string]any)

          var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice()
          var corazaEnabled = false
          var corazaBaseDirectives = ""
          for _, p := range plugins {
            if p.(map[string]any)["name"].(string) == "coraza" {
              corazaEnabled = true
              corazaBaseDirectives = p | dig_string("", "directives")
            }
          }
          var wafAny = extraContext | dig("waf")
          if wafAny == nil { wafAny = map[string]any{} }
          var waf, wafOK = wafAny.(map[string]any)
          if !wafOK { fail("extraContext.waf must be a map.") }
          var allowedWafSettings = map[string]bool{
            "dispatch": true, "ingressPermissions": true,
            "customRules": true, "policies": true,
          }
          for _, field := range keys(waf) {
            if !allowedWafSettings[field] {
              fail("extraContext.waf contains unknown field '" + field + "'.")
            }
          }
          var boundedInteger = func(input any, defaultValue int, field string, minimum int, maximum int) int {
            if input == nil { return defaultValue }
            var text = tostring(input)
            if !regex_search(text, "^[0-9]+$") {
              fail(field + " must be an integer between " + tostring(minimum) + " and " + tostring(maximum) + ".")
            }
            var value = toint(text)
            if value < minimum || value > maximum {
              fail(field + " must be between " + tostring(minimum) + " and " + tostring(maximum) + ".")
            }
            return value
          }
          var dispatchAny = waf | dig("dispatch")
          if dispatchAny == nil { dispatchAny = map[string]any{} }
          var dispatch, dispatchOK = dispatchAny.(map[string]any)
          if !dispatchOK { fail("extraContext.waf.dispatch must be a map.") }
          for _, field := range keys(dispatch) {
            if field != "mode" && field != "defaultEnforcement" {
              fail("extraContext.waf.dispatch contains unknown field '" + field + "'.")
            }
          }
          var dispatchMode = "opt-in"
          if dispatch["mode"] != nil {
            var dispatchModeOK = false
            dispatchMode, dispatchModeOK = dispatch["mode"].(string)
            if !dispatchModeOK { fail("extraContext.waf.dispatch.mode must be a string.") }
          }
          if dispatchMode != "opt-in" && dispatchMode != "default-on" {
            fail("extraContext.waf.dispatch.mode must be one of: opt-in, default-on.")
          }
          var policiesAny = waf | dig("policies")
          if policiesAny == nil { policiesAny = map[string]any{} }
          var policies, policiesOK = policiesAny.(map[string]any)
          if !policiesOK { fail("extraContext.waf.policies must be a map.") }
          var allowedPolicySettings = map[string]bool{
            "defaultPolicy": true, "requestBody": true,
            "limits": true, "inline": true, "configMapRefs": true,
            "selfService": true,
          }
          for _, field := range keys(policies) {
            if !allowedPolicySettings[field] {
              fail("extraContext.waf.policies contains unknown field '" + field + "'.")
            }
          }
          var policyRequestBodyAny = policies | dig("requestBody")
          if policyRequestBodyAny == nil { policyRequestBodyAny = map[string]any{} }
          var policyRequestBody, policyRequestBodyOK = policyRequestBodyAny.(map[string]any)
          if !policyRequestBodyOK { fail("extraContext.waf.policies.requestBody must be a map.") }
          for _, field := range keys(policyRequestBody) {
            if field != "waitTimeout" && field != "defaultMaxBytes" && field != "maxBytes" {
              fail("extraContext.waf.policies.requestBody contains unknown field '" + field + "'.")
            }
          }
          var defaultMaxBodyBytesN = boundedInteger(policyRequestBody["defaultMaxBytes"], 8192, "extraContext.waf.policies.requestBody.defaultMaxBytes", 1, 1048576)
          var maxBodyBytesN = boundedInteger(policyRequestBody["maxBytes"], 8192, "extraContext.waf.policies.requestBody.maxBytes", 1, 1048576)
          var defaultMaxBodyBytes = tostring(defaultMaxBodyBytesN)
          var maxBodyBytes = tostring(maxBodyBytesN)
          if defaultMaxBodyBytesN > maxBodyBytesN {
            fail("extraContext.waf.policies.requestBody.defaultMaxBytes must not exceed maxBytes.")
          }
          var requestBufferSize = boundedInteger(extraContext | dig("requestBodyInspection", "haproxyBuffer", "sizeBytes"), 16384, "extraContext.requestBodyInspection.haproxyBuffer.sizeBytes", 16384, 2097152)
          var requestBufferReserved = boundedInteger(extraContext | dig("requestBodyInspection", "haproxyBuffer", "reservedBytes"), 8192, "extraContext.requestBodyInspection.haproxyBuffer.reservedBytes", 1, 2097151)
          if requestBufferReserved >= requestBufferSize {
            fail("extraContext.requestBodyInspection.haproxyBuffer.reservedBytes must be positive and smaller than sizeBytes.")
          }
          if maxBodyBytesN > requestBufferSize-requestBufferReserved {
            fail("extraContext.waf.policies.requestBody.maxBytes exceeds the shared HAProxy request-body capacity.")
          }
          var configuredDefaultPolicy = ""
          if policies["defaultPolicy"] != nil {
            var defaultPolicyOK = false
            configuredDefaultPolicy, defaultPolicyOK = policies["defaultPolicy"].(string)
            if !defaultPolicyOK { fail("extraContext.waf.policies.defaultPolicy must be a string.") }
          }
          var inlinePoliciesAny = policies | dig("inline")
          if inlinePoliciesAny == nil { inlinePoliciesAny = map[string]any{} }
          var inlinePolicies, inlinePoliciesOK = inlinePoliciesAny.(map[string]any)
          if !inlinePoliciesOK { fail("extraContext.waf.policies.inline must be a map of policy names to policy documents.") }
          var policyConfigMapRefsAny = policies | dig("configMapRefs")
          if policyConfigMapRefsAny == nil { policyConfigMapRefsAny = []any{} }
          var policyConfigMapRefs, policyConfigMapRefsOK = policyConfigMapRefsAny.([]any)
          if !policyConfigMapRefsOK { fail("extraContext.waf.policies.configMapRefs must be a list of maps with namespace, name, and key fields.") }
          var policyCatalogConfigured = len(inlinePolicies) > 0 || len(policyConfigMapRefs) > 0 || configuredDefaultPolicy != ""
          var defaultPolicy = configuredDefaultPolicy
          // Governance and Ingress-permission resolution — including
          // ingressPermissions field validation and the defaultPolicy-
          // required-when-selection-disabled invariant — is shared with the
          // nginx-ingress and haproxy-ingress compat shims via the
          // util-waf-governance macro, so the compat surfaces cannot drift
          // from this policy engine.
          var gov = map[string]any{}
          var _ = WafGovernance(gov)
          var governanceEnabled = gov["governanceEnabled"].(bool)
          var allowPolicySelection = gov["allowPolicySelection"].(bool)
          var allowEnforcementOverride = gov["allowEnforcementOverride"].(bool)
          var allowRawHAProxyConfig = gov["allowRawHAProxyConfig"].(bool)
          var selfServiceEnabled = gov["selfServiceEnabled"].(bool)
          var dispatchDefaultEnforcement = dispatch | dig("defaultEnforcement") | fallback("deny") | tostring()
          var limitsAny = policies | dig("limits")
          if limitsAny == nil { limitsAny = map[string]any{} }
          var limits, limitsOK = limitsAny.(map[string]any)
          if !limitsOK { fail("extraContext.waf.policies.limits must be a map.") }
          var maxPolicies = boundedInteger(limits["maxCount"], 16, "extraContext.waf.policies.limits.maxCount", 1, 1024)
          var maxPolicySecLangBytes = boundedInteger(limits["maxSecLangBytes"], 65536, "extraContext.waf.policies.limits.maxSecLangBytes", 1, 1048576)
          var maxPolicyRuleExclusions = boundedInteger(limits["maxRuleExclusions"], 256, "extraContext.waf.policies.limits.maxRuleExclusions", 1, 4096)

          // Body-safety directives are always emitted last. Route-local or
          // policy SecLang cannot request bytes HAProxy did not send or enable
          // response-body buffering on this request-only integration.
          var noBodySafety = "SecRequestBodyAccess Off\nSecResponseBodyAccess Off\n"
          var bufferedBodySafety = "SecRequestBodyAccess On\nSecRequestBodyLimitAction Reject\nSecResponseBodyAccess Off\n"

          var policyConfiguration = map[string]string{}
          var policySafety = map[string]string{}
          var policyBodyMode = map[string]string{}
          var policySetupDirectives = map[string]string{}
          var policyContentMode = map[string]string{}
          var policyMaxBody = map[string]string{}
          var policyEnforcement = map[string]string{}
          var policySource = map[string]string{}
          var selfServiceBrokenCatalog = map[string]string{}
          var selfServiceBrokenPolicy = map[string]string{}
          if policyCatalogConfigured || selfServiceEnabled {
            var allowedPolicyFields = map[string]bool{
              "description": true,
              "requestBody": true,
              "enforcement": true,
              "secLang": true,
              "allowedMethods": true,
              "paranoiaLevel": true,
              "anomalyThreshold": true,
              "crsSettings": true,
              "ruleExclusions": true,
            }

            // Normalize chart-value, trusted-ConfigMap, and self-service
            // policies through one strict path. The closure returns an error
            // string ("" on success) instead of failing so self-service
            // callers can scope a bad policy to its own namespace; trusted
            // call sites fail() on any returned error, preserving the
            // hard-fail contract for admin-owned sources. Policies register
            // under storeKey (equal to policyName for trusted sources,
            // "<namespace>/<policyName>" for self-service) — the "/" keeps
            // the two name spaces structurally collision-free.
            var registerPolicy = func(storeKey string, policyName string, rawPolicy any, source string) string {
            if !regex_search(policyName, "^[a-z0-9][a-z0-9._-]{0,62}$") {
              return "WAF policy name '" + policyName + "' from " + source + " must contain 1-63 lowercase letters, digits, dots, underscores, or hyphens and start with a letter or digit."
            }
            if policySource[storeKey] != "" {
              return "Duplicate WAF policy '" + policyName + "' from " + source + "; it is already defined by " + policySource[storeKey] + ". Policy names must be unique across chart values and ConfigMaps."
            }
            var policy, policyOK = rawPolicy.(map[string]any)
            if !policyOK {
              return "WAF policy '" + policyName + "' from " + source + " must be a YAML map."
            }
            for _, field := range keys(policy) {
              if !allowedPolicyFields[field] {
                return "WAF policy '" + policyName + "' from " + source + " contains unknown field '" + field + "'. Valid fields: description, enforcement, requestBody, secLang, allowedMethods, paranoiaLevel, anomalyThreshold, crsSettings, ruleExclusions."
              }
            }

            var description = ""
            if policy["description"] != nil {
              var descriptionOK = false
              description, descriptionOK = policy["description"].(string)
              if !descriptionOK {
                return "WAF policy '" + policyName + "' from " + source + " field description must be a string."
              }
            }
            if len(description) > 512 {
              return "WAF policy '" + policyName + "' from " + source + " has a description longer than 512 bytes."
            }

            var requestBodyAny = policy | dig("requestBody") | fallback(map[string]any{})
            var requestBody, requestBodyOK = requestBodyAny.(map[string]any)
            if !requestBodyOK {
              return "WAF policy '" + policyName + "' from " + source + " field requestBody must be a map with mode and optional maxBytes fields."
            }
            for _, field := range keys(requestBody) {
              if field != "mode" && field != "maxBytes" {
                return "WAF policy '" + policyName + "' from " + source + " requestBody contains unknown field '" + field + "'. Valid fields: mode, maxBytes."
              }
            }
            var requestBodyMode = "none"
            if requestBody["mode"] != nil {
              requestBodyMode = requestBody["mode"] | tostring()
            }
            if requestBodyMode != "none" && requestBodyMode != "any" && requestBodyMode != "json" {
              return "WAF policy '" + policyName + "' from " + source + " has invalid requestBody.mode '" + requestBodyMode + "'. Valid values: none, any, json."
            }
            if requestBodyMode == "none" && requestBody["maxBytes"] != nil {
              return "WAF policy '" + policyName + "' from " + source + " sets requestBody.maxBytes while requestBody.mode is none. Set mode to any or json to inspect a bounded body, or remove maxBytes."
            }
            var bodyMode = "none"
            var contentMode = "any"
            var bodySafety = noBodySafety
            if requestBodyMode == "any" || requestBodyMode == "json" {
              bodyMode = "buffered"
              bodySafety = bufferedBodySafety
            }
            if requestBodyMode == "json" {
              contentMode = "json"
            }

            var enforcement = "deny"
            if policy["enforcement"] != nil {
              enforcement = policy["enforcement"] | tostring()
            }
            if enforcement != "deny" && enforcement != "detect" {
              return "WAF policy '" + policyName + "' from " + source + " has invalid enforcement '" + enforcement + "'. Valid values: deny, detect."
            }

            var policyBodyBytes = defaultMaxBodyBytes
            if requestBody["maxBytes"] != nil {
              policyBodyBytes = requestBody["maxBytes"] | tostring()
            }
            if !regex_search(policyBodyBytes, "^[0-9]+$") {
              return "WAF policy '" + policyName + "' from " + source + " field requestBody.maxBytes must be an integer."
            }
            var policyBodyInt = toint(policyBodyBytes)
            if policyBodyInt < 1 || policyBodyInt > maxBodyBytesN {
              return "WAF policy '" + policyName + "' from " + source + " has requestBody.maxBytes '" + policyBodyBytes + "'; it must be between 1 and the configured policy maximum " + maxBodyBytes + "."
            }

            var secLang = ""
            if policy["secLang"] != nil {
              var secLangOK = false
              secLang, secLangOK = policy["secLang"].(string)
              if !secLangOK {
                return "WAF policy '" + policyName + "' from " + source + " field secLang must be a string."
              }
            }
            if strings_contains(secLang, "\"\"\"") {
              return "WAF policy '" + policyName + "' from " + source + " contains a TOML triple-quote delimiter in secLang; remove that sequence."
            }
            if len(secLang) > maxPolicySecLangBytes {
              return "WAF policy '" + policyName + "' from " + source + " secLang is " + tostring(len(secLang)) + " bytes; the configured limit is " + tostring(maxPolicySecLangBytes) + "."
            }

            var generatedExclusions = ""

            // Structured CRS tuning fields. These lower to SETUP-position
            // SecActions (spliced before `Include @owasp_crs/*.conf` in the
            // app's directives by the spoa-hub TOML emission) because CRS
            // reads tx.allowed_methods / paranoia / thresholds when its own
            // rules execute — a setvar appended AFTER the include (where
            // policy secLang lands) runs too late to take effect. Being
            // structured, they are safe for self-service catalogs, which
            // refuse raw secLang.
            var setupDirectives = ""
            var allowedMethodsAny = policy | dig("allowedMethods")
            if allowedMethodsAny != nil {
              var methods, methodsOK = allowedMethodsAny.([]any)
              if !methodsOK || len(methods) == 0 {
                return "WAF policy '" + policyName + "' from " + source + " field allowedMethods must be a non-empty list of HTTP methods."
              }
              var methodList = ""
              for _, rawMethod := range methods {
                var method = rawMethod | tostring()
                if !regex_search(method, "^[A-Z][A-Z-]{1,15}$") {
                  return "WAF policy '" + policyName + "' from " + source + " has invalid allowedMethods entry '" + method + "'. Methods must be uppercase HTTP method tokens such as GET or PATCH."
                }
                if methodList != "" { methodList += " " }
                methodList += method
              }
              setupDirectives += "SecAction \"id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=" + methodList + "'\"\n"
            }
            if policy["paranoiaLevel"] != nil {
              var paranoiaText = policy["paranoiaLevel"] | tostring()
              if !regex_search(paranoiaText, "^[1-4]$") {
                return "WAF policy '" + policyName + "' from " + source + " field paranoiaLevel must be an integer between 1 and 4."
              }
              setupDirectives += "SecAction \"id:900000,phase:1,pass,t:none,nolog,setvar:'tx.blocking_paranoia_level=" + paranoiaText + "'\"\n"
            }
            var thresholdAny = policy | dig("anomalyThreshold")
            if thresholdAny != nil {
              var threshold, thresholdOK = thresholdAny.(map[string]any)
              if !thresholdOK {
                return "WAF policy '" + policyName + "' from " + source + " field anomalyThreshold must be a map with inbound and/or outbound integer fields."
              }
              var thresholdVars = ""
              for _, field := range keys(threshold) {
                if field != "inbound" && field != "outbound" {
                  return "WAF policy '" + policyName + "' from " + source + " anomalyThreshold contains unknown field '" + field + "'. Valid fields: inbound, outbound."
                }
                var value = threshold[field] | tostring()
                if !regex_search(value, "^[1-9][0-9]{0,4}$") {
                  return "WAF policy '" + policyName + "' from " + source + " anomalyThreshold." + field + " must be a positive integer."
                }
                if thresholdVars != "" { thresholdVars += "," }
                thresholdVars += "setvar:'tx." + field + "_anomaly_score_threshold=" + value + "'"
              }
              setupDirectives += "SecAction \"id:900110,phase:1,pass,t:none,nolog," + thresholdVars + "\"\n"
            }
            {#- Curated CRS variable tuning. A tenant fine-tunes a rule's INPUTS
                (allowlist a content-type, raise an upload limit) instead of
                disabling the rule — the git-content-type case is
                allowedRequestContentTypes, NOT disabling 920420. Each registry
                entry stores the FULL target variable (tx.* today), so a tenant
                never types a collection prefix and can never reach the writable
                GLOBAL/IP/SESSION state collections; a future non-tx tunable is
                just another entry.

                mergeList entries OWN the CRS default list. The crs-setup
                SecAction that would set the variable (e.g. 900220 for content
                types) is COMMENTED OUT in crs-setup by default, so the variable
                is unset at render time — a runtime `%{...}` append would build an
                incomplete list the rule then rejects (this was a real bug: git
                clones 403'd because 920420 wraps the type as |type| and checks
                @within, and the appended value lacked the leading pipe and the
                defaults). The chart therefore emits the FULL value as a REPLACE:
                its baked CRS default plus the tenant's additions, each token
                formatted exactly as the rule matches it (|type|-wrapped,
                space-joined for content types). Same shape as allowedMethods,
                spliced before the CRS include where the rule reads it. boundedInt
                entries replace a scalar within [min,max]. No tenant secLang. -#}
            var crsSettingsAny = policy | dig("crsSettings")
            if crsSettingsAny != nil {
              var crsSettings, crsSettingsOK = crsSettingsAny.(map[string]any)
              if !crsSettingsOK {
                return "WAF policy '" + policyName + "' from " + source + " field crsSettings must be a map of CRS tuning names to values."
              }
              var crsRegistry = map[string]any{
                {#- crsDefault mirrors the CRS 900220 recommended content-type
                    list (commented out in crs-setup, so the chart owns it).
                    Revisit on a CRS major bump if that recommended set changes. -#}
                "allowedRequestContentTypes": map[string]any{"kind": "mergeList", "target": "allowed_request_content_type", "crsDefault": "|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|", "wrap": "|", "sep": " ", "charset": "^[A-Za-z0-9][A-Za-z0-9.+/_-]*$", "hint": "a media type such as application/x-git-upload-pack-request"},
                "maxFileSize":                map[string]any{"kind": "boundedInt", "target": "max_file_size", "minimum": 1, "maximum": 536870912, "hint": "a byte count between 1 and 536870912"},
                "maxNumArgs":                 map[string]any{"kind": "boundedInt", "target": "max_num_args", "minimum": 1, "maximum": 100000, "hint": "a count between 1 and 100000"},
                "totalArgLength":             map[string]any{"kind": "boundedInt", "target": "total_arg_length", "minimum": 1, "maximum": 10485760, "hint": "a byte count between 1 and 10485760"},
              }
              var crsClauses = []any{}
              {#- keys() is sorted, so the emitted setvar order is deterministic. -#}
              for _, field := range keys(crsSettings) {
                var specAny = crsRegistry[field]
                if specAny == nil {
                  return "WAF policy '" + policyName + "' from " + source + " crsSettings contains unknown field '" + field + "'. Valid fields: " + join(keys(crsRegistry), ", ") + "."
                }
                var spec = specAny.(map[string]any)
                var target = spec["target"].(string)
                if spec["kind"].(string) == "mergeList" {
                  var items, itemsOK = crsSettings[field].([]any)
                  if !itemsOK || len(items) == 0 {
                    return "WAF policy '" + policyName + "' from " + source + " crsSettings." + field + " must be a non-empty list (each entry " + spec["hint"].(string) + ")."
                  }
                  var charset = spec["charset"].(string)
                  var wrap = spec["wrap"].(string)
                  var sep = spec["sep"].(string)
                  {#- Start from the chart-owned CRS default, then append each
                      tenant token wrapped as the rule matches it.
                      strings_contains dedupes against both the default and any
                      earlier addition. Emitted as a REPLACE (full value). -#}
                  var merged = spec["crsDefault"].(string)
                  for _, rawItem := range items {
                    var token = rawItem | tostring()
                    if !regex_search(token, charset) {
                      return "WAF policy '" + policyName + "' from " + source + " crsSettings." + field + " entry '" + token + "' is invalid; expected " + spec["hint"].(string) + "."
                    }
                    var wrapped = wrap + token + wrap
                    if strings_contains(merged, wrapped) { continue }
                    merged += sep + wrapped
                  }
                  crsClauses = append(crsClauses, "setvar:'tx."+target+"="+merged+"'")
                } else {
                  var text = crsSettings[field] | tostring()
                  if !regex_search(text, "^[0-9]+$") {
                    return "WAF policy '" + policyName + "' from " + source + " crsSettings." + field + " value '" + text + "' must be " + spec["hint"].(string) + "."
                  }
                  var value = toint(text)
                  if value < spec["minimum"].(int) || value > spec["maximum"].(int) {
                    return "WAF policy '" + policyName + "' from " + source + " crsSettings." + field + " value '" + text + "' must be " + spec["hint"].(string) + "."
                  }
                  crsClauses = append(crsClauses, "setvar:'tx."+target+"="+text+"'")
                }
              }
              if len(crsClauses) > 0 {
                {#- One setup SecAction carries every tuned var; id in the
                    chart's above-CRS band (>999999) so it can't collide with a
                    CRS rule or the 1200000+ path-scoped exclusion IDs. -#}
                setupDirectives += "SecAction \"id:1210000,phase:1,pass,t:none,nolog," + join(crsClauses|toStringSlice(), ",") + "\"\n"
              }
            }
            {#- The CRS-anchor requirement is NOT enforced here at
                registration: a policy defined in the catalog but selected by
                no route must not fail the whole render just because the
                ambient coraza directives lack the anchor (that happens
                whenever a deployment-wide allowedMethods policy merges into a
                baked validationTest whose coraza is disabled or CRS-less).
                The check is route-scoped instead, at the point a route
                actually applies the policy — see the setup-anchor rejectRoute
                below. -#}
            {#- Structured, self-service-safe rule exclusions. Each entry is
                (rules[] + optional excludeTarget + optional path scope) — the
                tenant supplies only numeric CRS rule IDs, an exact target
                variable, and a literal path string; the chart owns the
                SecRule wrapper and its literal operator, so no tenant regex
                is ever evaluated on the request path (the ReDoS surface every
                raw-SecLang WAF exposes). Two lowerings:
                  * no path  -> config-time SecRuleRemoveById /
                    SecRuleUpdateTargetById, appended AFTER the CRS include
                    (the rules must exist to be removed) via generatedExclusions.
                  * with path -> runtime ctl:ruleRemove[Target]ById wrapped in
                    a chart-generated SecRule, spliced BEFORE the CRS include
                    (a ctl must run before the rule it targets) via
                    setupDirectives.
                Rule IDs are denylisted against the CRS scoring/setup/
                correlation machinery so a tenant can silence attack rules
                that false-positive but can NOT disable the anomaly-scoring
                rule that makes the block decision (i.e. can't turn off their
                own enforcement through the back door). -#}
            var ruleExclusionsAny = policy | dig("ruleExclusions")
            if ruleExclusionsAny != nil {
              var ruleExclusions, ruleExclusionsOK = ruleExclusionsAny.([]any)
              if !ruleExclusionsOK {
                return "WAF policy '" + policyName + "' from " + source + " field ruleExclusions must be a list of exclusion entries."
              }
              var isDeniedRuleId = func(id int) bool {
                return (id >= 900000 && id <= 901999) || (id >= 949000 && id <= 949999) || (id >= 959000 && id <= 959999) || (id >= 980000 && id <= 980999) || (id >= 990000 && id <= 999999)
              }
              var pathOps = map[string]string{
                "onPathPrefix": "@beginsWith",
                "onPathContains": "@contains",
                "onPathExact": "@streq",
                "onPathSuffix": "@endsWith",
              }
              var exclusionRuleCount = 0
              {#- Per-policy sequence for generated path-scoped SecRule IDs;
                  policy apps compile independently so a policy-local counter
                  is collision-free. -#}
              var exclusionRuleSeq = 0
              for _, rawEntry := range ruleExclusions {
                var entry, entryOK = rawEntry.(map[string]any)
                if !entryOK {
                  return "WAF policy '" + policyName + "' from " + source + " ruleExclusions entries must be maps."
                }
                for _, field := range keys(entry) {
                  if field != "rules" && field != "tags" && field != "excludeTarget" && field != "onPathPrefix" && field != "onPathContains" && field != "onPathExact" && field != "onPathSuffix" {
                    return "WAF policy '" + policyName + "' from " + source + " ruleExclusions entry contains unknown field '" + field + "'. Valid fields: rules, tags, excludeTarget, onPathPrefix, onPathContains, onPathExact, onPathSuffix."
                  }
                }
                {#- An entry selects rules by ID (rules) and/or by CRS tag
                    (tags). Rule IDs may be removed outright or target-excluded;
                    tags may ONLY target-exclude (so a tenant can't silence a
                    whole attack class by tag), hence tags requires
                    excludeTarget. -#}
                var ruleIds = []any{}
                if entry["rules"] != nil {
                  var rulesRaw, rulesRawOK = entry["rules"].([]any)
                  if !rulesRawOK || len(rulesRaw) == 0 {
                    return "WAF policy '" + policyName + "' from " + source + " ruleExclusions 'rules' must be a non-empty list of CRS rule IDs."
                  }
                  for _, rawId := range rulesRaw {
                    var idText = rawId | tostring()
                    if !regex_search(idText, "^[0-9]{6}$") {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions rule ID '" + idText + "' must be a 6-digit CRS rule ID."
                    }
                    var id = toint(idText)
                    if id < 900000 || id > 999999 {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions rule ID '" + idText + "' is outside the CRS rule range 900000-999999."
                    }
                    if isDeniedRuleId(id) {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions may not target rule '" + idText + "': the CRS setup, anomaly-scoring, and correlation rules (900000-901999, 949xxx, 959xxx, 980xxx, 990xxx+) are reserved so an exclusion can't disable enforcement itself."
                    }
                    ruleIds = append(ruleIds, idText)
                  }
                }
                var tagNames = []any{}
                if entry["tags"] != nil {
                  var tagsRaw, tagsRawOK = entry["tags"].([]any)
                  if !tagsRawOK || len(tagsRaw) == 0 {
                    return "WAF policy '" + policyName + "' from " + source + " ruleExclusions 'tags' must be a non-empty list of CRS rule tags."
                  }
                  for _, rawTag := range tagsRaw {
                    var tagText = rawTag | tostring()
                    if !regex_search(tagText, "^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$") {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions tag '" + tagText + "' is invalid; use a CRS tag such as attack-sqli."
                    }
                    tagNames = append(tagNames, tagText)
                  }
                }
                if len(ruleIds) == 0 && len(tagNames) == 0 {
                  return "WAF policy '" + policyName + "' from " + source + " ruleExclusions entry must set 'rules' and/or 'tags'."
                }
                exclusionRuleCount += len(ruleIds) + len(tagNames)
                if exclusionRuleCount > maxPolicyRuleExclusions {
                  return "WAF policy '" + policyName + "' from " + source + " exceeds the configured rule-exclusion limit " + tostring(maxPolicyRuleExclusions) + "."
                }
                var target = ""
                if entry["excludeTarget"] != nil {
                  target = entry["excludeTarget"] | tostring()
                  if !regex_search(target, "^[A-Z][A-Z0-9_]*(:[A-Za-z0-9_.-]+)?$") {
                    return "WAF policy '" + policyName + "' from " + source + " ruleExclusions excludeTarget '" + target + "' must be an exact Coraza variable such as ARGS:q (regex collection keys are not allowed)."
                  }
                }
                if len(tagNames) > 0 && target == "" {
                  return "WAF policy '" + policyName + "' from " + source + " ruleExclusions 'tags' requires 'excludeTarget': a tag can only exclude a variable from its rules, not remove a whole attack class. List specific rule IDs to disable a rule."
                }
                var pathOp = ""
                var pathValue = ""
                for pathField, op := range pathOps {
                  if entry[pathField] != nil {
                    if pathOp != "" {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions entry sets more than one of onPathPrefix/onPathContains/onPathExact/onPathSuffix; use at most one."
                    }
                    pathOp = op
                    pathValue = entry[pathField] | tostring()
                    if !regex_search(pathValue, "^[A-Za-z0-9/_.:%~=&?*+@,-]{1,256}$") {
                      return "WAF policy '" + policyName + "' from " + source + " ruleExclusions " + pathField + " '" + pathValue + "' must be a literal URL path (letters, digits, and /_.:%~=&?*+@,- , max 256 chars)."
                    }
                  }
                }
                if pathOp == "" {
                  {#- No path: config-time directives, after the CRS include. -#}
                  for _, idAny := range ruleIds {
                    var idText = idAny | tostring()
                    if target == "" {
                      generatedExclusions += "SecRuleRemoveById " + idText + "\n"
                    } else {
                      generatedExclusions += "SecRuleUpdateTargetById " + idText + " \"!" + target + "\"\n"
                    }
                  }
                  for _, tagAny := range tagNames {
                    generatedExclusions += "SecRuleUpdateTargetByTag \"" + tostring(tagAny) + "\" \"!" + target + "\"\n"
                  }
                } else {
                  {#- Path-scoped: one chart-owned SecRule (literal operator)
                      whose ctl removes the rule/target for this transaction,
                      spliced before the CRS include. IDs come from a policy-
                      local 12xxxxx band that never collides with CRS
                      (900000-999999) or HAPTIC's setup SecActions. -#}
                  var ctlActions = ""
                  for _, idAny := range ruleIds {
                    var idText = idAny | tostring()
                    if target == "" {
                      ctlActions += ",ctl:ruleRemoveById=" + idText
                    } else {
                      ctlActions += ",ctl:ruleRemoveTargetById=" + idText + ";" + target
                    }
                  }
                  for _, tagAny := range tagNames {
                    ctlActions += ",ctl:ruleRemoveTargetByTag=" + tostring(tagAny) + ";" + target
                  }
                  setupDirectives += "SecRule REQUEST_URI \"" + pathOp + " " + pathValue + "\" \"id:" + tostring(1200000 + exclusionRuleSeq) + ",phase:1,pass,t:none,nolog" + ctlActions + "\"\n"
                  exclusionRuleSeq++
                }
              }
            }
            policySetupDirectives[storeKey] = setupDirectives
            policyConfiguration[storeKey] = generatedExclusions + secLang + "\n"
            policySafety[storeKey] = bodySafety
            policyBodyMode[storeKey] = bodyMode
            policyContentMode[storeKey] = contentMode
            policyMaxBody[storeKey] = policyBodyBytes
            policyEnforcement[storeKey] = enforcement
            policySource[storeKey] = source
            return ""
          }

          // Trusted sources keep the hard-fail contract: any validation error
          // aborts the render. The maxCount budget applies to trusted policies
          // only — self-service policies have their own separate budgets so a
          // namespace can never exhaust the admin catalog's allowance.
          var trustedPolicyCount = 0
          for policyName, rawPolicy := range inlinePolicies {
            var registerError = registerPolicy(policyName, policyName, rawPolicy, "extraContext.waf.policies.inline." + policyName)
            if registerError != "" { fail(registerError) }
            trustedPolicyCount++
            if trustedPolicyCount > maxPolicies {
              fail("WAF policy catalogs define more than the configured limit " + tostring(maxPolicies) + ".")
            }
          }

          for _, rawSource := range policyConfigMapRefs {
            var policyConfigMap, sourceOK = rawSource.(map[string]any)
            if !sourceOK {
              fail("extraContext.waf.policies.configMapRefs entries must be maps with namespace, name, and key fields.")
            }
            for _, field := range keys(policyConfigMap) {
              if field != "namespace" && field != "name" && field != "key" {
                fail("extraContext.waf.policies.configMapRefs entry contains unknown field '" + field + "'. Valid fields: namespace, name, key.")
              }
            }
            for _, field := range []string{"namespace", "name", "key"} {
              if policyConfigMap[field] != nil {
                var _, fieldOK = policyConfigMap[field].(string)
                if !fieldOK { fail("extraContext.waf.policies.configMapRefs field '" + field + "' must be a string.") }
              }
            }
            var sourceNamespace = extraContext | dig("controllerNamespace") | fallback("") | tostring()
            if policyConfigMap["namespace"] != nil { sourceNamespace = policyConfigMap["namespace"].(string) }
            var sourceName = ""
            if policyConfigMap["name"] != nil { sourceName = policyConfigMap["name"].(string) }
            var sourceKey = "policies.yaml"
            if policyConfigMap["key"] != nil { sourceKey = policyConfigMap["key"].(string) }
            if sourceNamespace == "" || sourceName == "" {
              fail("extraContext.waf.policies.configMapRefs entries require a namespace and name (namespace defaults to the chart release namespace).")
            }
            if !regex_search(sourceNamespace, "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$") {
              fail("extraContext.waf.policies.configMapRefs namespace '" + sourceNamespace + "' is not a valid Kubernetes namespace.")
            }
            if !regex_search(sourceName, "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$") {
              fail("extraContext.waf.policies.configMapRefs name '" + sourceName + "' is not a valid ConfigMap name.")
            }
            if !regex_search(sourceKey, "^[-._A-Za-z0-9]+$") {
              fail("extraContext.waf.policies.configMapRefs key '" + sourceKey + "' is not a valid ConfigMap data key.")
            }
            var sourceID = "ConfigMap " + sourceNamespace + "/" + sourceName + " key " + sourceKey
            var cm = resources.configmaps.GetSingle(sourceNamespace, sourceName)
            if cm == nil {
              fail("WAF policy " + sourceID + " was not found.")
            }
            var policyYAML = cm.Data[sourceKey]
            if strip(policyYAML) == "" {
              fail("WAF policy " + sourceID + " is empty or missing.")
            }
            var parsedPolicies = map[string]any{}
            var parseError = unmarshalYAML(policyYAML, &parsedPolicies)
            if parseError != nil {
              fail("WAF policy " + sourceID + " is invalid YAML: " + parseError.Error())
            }
            for policyName, rawPolicy := range parsedPolicies {
              var registerError = registerPolicy(policyName, policyName, rawPolicy, sourceID)
              if registerError != "" { fail(registerError) }
              trustedPolicyCount++
              if trustedPolicyCount > maxPolicies {
                fail("WAF policy catalogs define more than the configured limit " + tostring(maxPolicies) + ".")
              }
            }
          }
            if defaultPolicy != "" && policyConfiguration[defaultPolicy] == "" {
              var available = keys(policySource)
              var availableText = "no policies are configured"
              if len(available) > 0 {
                availableText = "available policies: " + join(available, ", ")
              }
              fail("extraContext.waf.policies.defaultPolicy references unknown policy '" + defaultPolicy + "'; " + availableText + ".")
            }

            // Namespaced self-service catalogs. Failures here are SCOPED, not
            // global: a broken catalog or policy is recorded as a Warning Event
            // on the offending ConfigMap and only that namespace's selecting
            // routes fail closed with 503 (frontend-filters-113) — the global
            // render proceeds and every other namespace is unaffected. Under
            // the admission webhook the same breakage fail()s instead, so a
            // proposed change cannot introduce it (the baseline escape hatch
            // still admits changes unrelated to pre-existing breakage).
            // defaultPolicy resolved above, BEFORE this block, so a tenant
            // policy can never become the cluster baseline. Namespaces and
            // policy names iterate sorted so budget cuts are deterministic.
            if selfServiceEnabled {
              var ssConfigMapName = gov["selfServiceConfigMapName"].(string)
              var ssDataKey = gov["selfServiceKey"].(string)
              var ssAllowSecLang = gov["selfServiceAllowSecLang"].(bool)
              var ssMaxPerNamespace = gov["selfServiceMaxPoliciesPerNamespace"].(int)
              var ssMaxTotal = gov["selfServiceMaxTotalPolicies"].(int)
              // Discovery iterates the dedicated waf_selfservice_catalogs
              // watch (full bodies, fieldSelector-scoped to the well-known
              // name) — NOT the on-demand configmaps store, whose List()
              // deliberately returns only entries the render already touched.
              var ssNamespaces = []any{}
              var ssByNamespace = map[string]*resources.waf_selfservice_catalogs.T{}
              for _, catalogCM := range resources.waf_selfservice_catalogs.List() {
                // The injected fieldSelector already scopes the watch; re-check
                // the name as defense-in-depth (fixtures and offline validate
                // runs bypass watch selectors).
                if catalogCM.Metadata.Name != ssConfigMapName { continue }
                if ssByNamespace[catalogCM.Metadata.Namespace] == nil {
                  ssByNamespace[catalogCM.Metadata.Namespace] = catalogCM
                  ssNamespaces = append(ssNamespaces, catalogCM.Metadata.Namespace)
                }
              }
              var ssTotal = 0
              for _, nsAny := range sort_strings(ssNamespaces) {
                var ns = tostring(nsAny)
                var cm = ssByNamespace[ns]
                if cm == nil { continue }
                var sourceID = "self-service WAF ConfigMap " + ns + "/" + ssConfigMapName + " key " + ssDataKey
                var policyYAML = cm.Data[ssDataKey]
                var catalogError = ""
                var parsedPolicies = map[string]any{}
                if strip(policyYAML) == "" {
                  catalogError = sourceID + " is empty or missing."
                } else {
                  var parseError = unmarshalYAML(policyYAML, &parsedPolicies)
                  if parseError != nil {
                    catalogError = sourceID + " is invalid YAML: " + replace(parseError.Error(), "\n", " ")
                  }
                }
                if catalogError != "" {
                  if renderMode == "admission" { fail(catalogError) }
                  selfServiceBrokenCatalog[ns] = catalogError
                  recordEvent(cm, "WafPolicyCatalogInvalid", catalogError)
                  continue
                }
                // Budgets count only successfully REGISTERED policies: a
                // broken or colliding entry never consumes a slot, so it
                // can't squeeze a namespace's valid policies out of its own
                // budget (validation work stays bounded by the ConfigMap's
                // size either way).
                var nsCount = 0
                for _, policyName := range keys(parsedPolicies) {
                  var storeKey = ns + "/" + policyName
                  var policyError = ""
                  if policySource[policyName] != "" {
                    policyError = "Self-service WAF policy '" + policyName + "' from " + sourceID + " collides with the trusted-catalog policy of the same name (defined by " + policySource[policyName] + "). Rename the namespace policy; ambiguous names are never resolved silently."
                  } else if nsCount >= ssMaxPerNamespace {
                    policyError = sourceID + " defines more than the per-namespace self-service limit " + tostring(ssMaxPerNamespace) + "; policy '" + policyName + "' is not loaded."
                  } else if ssTotal >= ssMaxTotal {
                    policyError = "The cluster-wide self-service WAF policy budget " + tostring(ssMaxTotal) + " is exhausted; policy '" + policyName + "' from " + sourceID + " is not loaded."
                  }
                  if policyError == "" && !ssAllowSecLang {
                    var rawPolicyMap, rawPolicyMapOK = parsedPolicies[policyName].(map[string]any)
                    if rawPolicyMapOK && rawPolicyMap["secLang"] != nil {
                      policyError = "Self-service WAF policy '" + policyName + "' from " + sourceID + " uses secLang, which is disabled for self-service catalogs (extraContext.waf.policies.selfService.allowSecLang=false). Use the structured fields (enforcement, requestBody, allowedMethods, paranoiaLevel, anomalyThreshold, crsSettings, ruleExclusions), or ask the HAPTIC administrator to move the policy into a trusted catalog."
                    }
                  }
                  if policyError == "" {
                    policyError = registerPolicy(storeKey, policyName, parsedPolicies[policyName], sourceID)
                    if policyError == "" {
                      nsCount++
                      ssTotal++
                    }
                  }
                  if policyError != "" {
                    if renderMode == "admission" { fail(policyError) }
                    selfServiceBrokenPolicy[storeKey] = policyError
                    recordEvent(cm, "WafPolicyInvalid", policyError)
                  }
                }
              }
            }
          }

          // Preserve apps produced by vendor compatibility libraries. New app
          // entries use appName directly; legacy entries derive ns/name.
          var appsByName = map[string]any{}
          for _, existing := range (gf | dig("sphCorazaApps") | fallback([]any{}) | toSlice()) {
            var e = existing.(map[string]any)
            var appName = ""
            if e["appName"] != nil {
              appName = e["appName"].(string)
            } else {
              appName = e["ns"].(string) + "/" + e["name"].(string)
            }
            appsByName[appName] = e
          }

          var rules = []any{}
          var brokenRoutes = []any{}
          // Vendor and native per-Ingress applications consume the same Coraza
          // application map and therefore share one admission bound.
          for _, ingress := range resources.ingresses.List() {
            var ns = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name
            var resourceID = ns + "/" + name
            var annotations = ingress.Metadata.Annotations
            if governanceEnabled && !allowRawHAProxyConfig {
              var rawConfigAnnotation = ""
              for _, annotationName := range []string{
                "haproxy-haptic.org/config-global",
                "haproxy-haptic.org/config-defaults",
                "haproxy-haptic.org/config-frontend",
                "haproxy-haptic.org/config-backend",
                "haproxy-ingress.github.io/config-global",
                "haproxy-ingress.github.io/config-defaults",
                "haproxy-ingress.github.io/config-frontend",
                "haproxy-ingress.github.io/config-backend",
                "haproxy.org/backend-config-snippet",
                "nginx.ingress.kubernetes.io/configuration-snippet",
              } {
                if strip(annotations[annotationName]) != "" && rawConfigAnnotation == "" {
                  rawConfigAnnotation = annotationName
                }
              }
              if rawConfigAnnotation != "" {
                fail("Ingress " + resourceID + " sets raw HAProxy annotation '" + rawConfigAnnotation + "', but WAF governance disables all Ingress-authored raw configuration with extraContext.waf.ingressPermissions.allowRawHAProxyConfig=false. Raw frontend/defaults/global directives can bypass WAF enforcement for other routes; enable this only when every Ingress writer is a trusted HAProxy configuration administrator.")
              }
            }
            var mode = strip(annotations["haproxy-haptic.org/waf-mode"])
            var requestedPolicy = strip(annotations["haproxy-haptic.org/waf-policy"])
            var policy = ""
            var selectedSelfService = false
            var routeBrokenReason = ""
            // A route-scoped violation hard-fails ONLY when this route's own
            // resource is the one under admission review (admissionSubject is
            // controller-set from the webhook overlay; empty on reconcile,
            // config-proposal, and bulk renders). Violations on any other —
            // already present — resource record a Warning Event and fail
            // closed per-route (503 via frontend-filters-113), so one bad
            // existing Ingress can never wedge an unrelated admission or a
            // HAProxyTemplateConfig update. First reason wins; later checks
            // for an already-broken route are skipped.
            var underAdmission = renderMode == "admission" && tostring(admissionSubject | dig("store") | fallback("")) == "ingresses" && tostring(admissionSubject | dig("namespace") | fallback("")) == ns && tostring(admissionSubject | dig("name") | fallback("")) == name
            var rejectRoute = func(reason string, message string) {
              if underAdmission { fail(message) }
              if routeBrokenReason != "" { return }
              recordEvent(ingress, reason, message)
              routeBrokenReason = message
            }
            if requestedPolicy != "" && !allowPolicySelection {
              rejectRoute("WafPermissionDenied", "Ingress " + resourceID + " sets waf-policy, but the HAPTIC administrator disabled Ingress policy selection. Remove the annotation; default policy '" + defaultPolicy + "' applies automatically.")
            }
            // Resolve the requested name: trusted catalog first (bare global
            // names), then the Ingress's OWN namespace's self-service catalog
            // ("<ns>/<name>" store keys — structurally distinct, so neither
            // name space can shadow the other). Resolution failures are
            // scoped: under the admission webhook they fail() (deny the
            // proposed Ingress); on a live render they record a Warning Event
            // and the route fails closed with 503 (frontend-filters-113)
            // instead of serving without the WAF it asked for — and instead
            // of aborting the whole render over one bad route.
            if requestedPolicy != "" {
              var ssStoreKey = ns + "/" + requestedPolicy
              if strings_contains(requestedPolicy, "/") {
                rejectRoute("WafPolicyUnavailable", "Invalid value '" + requestedPolicy + "' for annotation 'haproxy-haptic.org/waf-policy' on Ingress '" + resourceID + "': policy names must not contain '/'. Self-service policies are selectable by bare name from their own namespace only.")
              } else if selfServiceBrokenPolicy[ssStoreKey] != "" {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "', which failed validation: " + selfServiceBrokenPolicy[ssStoreKey])
              } else if policySource[requestedPolicy] != "" {
                policy = requestedPolicy
              } else if policySource[ssStoreKey] != "" {
                policy = ssStoreKey
                selectedSelfService = true
              } else if selfServiceBrokenCatalog[ns] != "" {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "' but its namespace's self-service catalog is broken: " + selfServiceBrokenCatalog[ns])
              } else if !policyCatalogConfigured && !selfServiceEnabled {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " sets 'haproxy-haptic.org/waf-policy' but no reusable WAF policy catalog is configured. Define controller.config.templatingSettings.extraContext.waf.policies.inline/configMapRefs, enable policies.selfService, or remove the annotation.")
              } else {
                var available = []any{}
                for _, existingName := range keys(policySource) {
                  if !strings_contains(existingName, "/") {
                    available = append(available, existingName)
                  } else if hasPrefix(existingName, ns + "/") {
                    available = append(available, existingName[len(ns)+1:])
                  }
                }
                var availableText = "no policies are configured"
                if len(available) > 0 {
                  availableText = "available policies: " + join(available | toStringSlice(), ", ")
                }
                rejectRoute("WafPolicyUnavailable", "Unknown WAF policy '" + requestedPolicy + "' on Ingress " + resourceID + "; " + availableText + ". Policy names are exact and case-sensitive.")
              }
            }
            if policy == "" && routeBrokenReason == "" {
              policy = defaultPolicy
            }
            var active = policy != "" || requestedPolicy != ""

            if mode != "" && !active {
              rejectRoute("WafAnnotationInvalid", "Ingress " + resourceID + " sets 'haproxy-haptic.org/waf-mode' without 'haproxy-haptic.org/waf-policy'. Select a WAF policy or remove waf-mode.")
            }
            {#- Catalog-existence and unknown-policy handling live in the
                scoped resolution block above (rejectRoute) — they deny at
                admission but fail closed per-route on a live render, so a
                policy deleted out from under an existing Ingress can no
                longer abort the whole render. -#}
            {#- Mixing a native WAF annotation with a vendor WAF annotation on
                one Ingress is rejected generically (for any family pair) by
                the cross-family feature-collision guard in the
                ingress-annotations-compat library, which renders before these
                map files — so no policy-scoped check is needed here. -#}
            if active && !corazaEnabled {
              fail("Ingress " + resourceID + " sets HAPTIC WAF annotations but the spoaHub coraza plugin is not enabled. Enable spoaHub.plugins.coraza or remove the annotations.")
            }
            if !allowEnforcementOverride && mode != "" {
              rejectRoute("WafPermissionDenied", "Ingress " + resourceID + " sets waf-mode, but the HAPTIC administrator disabled Ingress enforcement overrides with extraContext.waf.ingressPermissions.allowEnforcementOverride=false.")
            }

            if policy != "" {
              if mode == "" {
                mode = policyEnforcement[policy]
              }
            } else if mode == "" {
              mode = "deny"
            }
            if mode != "deny" && mode != "detect" {
              rejectRoute("WafAnnotationInvalid", "Invalid value '" + mode + "' for annotation 'haproxy-haptic.org/waf-mode' on Ingress '" + resourceID + "'. Valid values: 'deny', 'detect'.")
            }
            // A tenant-authored policy must not weaken an administrator's
            // default-on baseline: tenant content in detect mode would turn
            // enforcement off for that route. Trusted-catalog policies may
            // (the admin authored or explicitly trusted them).
            if routeBrokenReason == "" && selectedSelfService && dispatchMode == "default-on" && dispatchDefaultEnforcement == "deny" && mode == "detect" {
              rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects self-service WAF policy '" + requestedPolicy + "' with effective enforcement 'detect', which would weaken the default-on baseline enforcement 'deny'. Only trusted-catalog policies may weaken the baseline; use enforcement: deny or ask the HAPTIC administrator to adopt the policy into a trusted catalog.")
            }

            {#- A route selecting a policy with setup-position fields
                (allowedMethods/paranoiaLevel/anomalyThreshold) needs the CRS
                include in the coraza directives to splice the SecActions
                before — without it the tuning silently wouldn't apply. Checked
                per-route (not at registration) so a catalog policy that no
                route selects never trips it, and route-scoped so one such
                route fails closed rather than aborting the whole render.
                corazaEnabled is implied: an active route with coraza off is
                already rejected by the coraza-not-enabled guard above. -#}
            if routeBrokenReason == "" && policy != "" && policySetupDirectives[policy] != "" && !strings_contains(corazaBaseDirectives, "Include @owasp_crs") {
              rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "' which sets allowedMethods/paranoiaLevel/anomalyThreshold/crsSettings or path-scoped ruleExclusions, but spoaHub.plugins.coraza.directives has no 'Include @owasp_crs' line to insert them before. Keep the CRS include in the coraza directives or remove the setup-position fields from the policy.")
            }

            // A broken route always fails closed — even when active is
            // false (e.g. a dangling waf-mode annotation): serving it as if
            // the annotation weren't there would silently ignore declared
            // intent.
            if routeBrokenReason != "" {
              brokenRoutes = append(brokenRoutes, map[string]any{
                "resourceID": resourceID,
                "reason": routeBrokenReason,
              })
            } else if active {
              var bodyMode = "none"
              var contentMode = "any"
              var ruleMaxBodyBytes = maxBodyBytes
              if policy != "" {
                bodyMode = policyBodyMode[policy]
                contentMode = policyContentMode[policy]
                ruleMaxBodyBytes = policyMaxBody[policy]
              }

              var appName = ""
              if policy != "" {
                appName = "policy:" + policy
                if appsByName[appName] == nil {
                  appsByName[appName] = map[string]any{
                    "appName": appName,
                    "source": policySource[policy],
                    "snippet": policyConfiguration[policy] + policySafety[policy],
                    "requestBodyMaxBytes": ruleMaxBodyBytes,
                    "setupDirectives": policySetupDirectives[policy],
                  }
                }
              }

              rules = append(rules, map[string]any{
                "resourceID": resourceID,
                "mode": mode,
                "appName": appName,
                "bodyMode": bodyMode,
                "contentMode": contentMode,
                "maxBodyBytes": ruleMaxBodyBytes,
              })
            }
          }

          var appNames = keys(appsByName)
          var apps = []any{}
          for _, appName := range appNames {
            apps = append(apps, appsByName[appName])
          }
          gf["sphCorazaApps"] = apps
          gf["corazaPolicyRoutes"] = rules
          gf["corazaBrokenRoutes"] = brokenRoutes
          return true
        })
      %%}

  map-haproxy-ingress-waf-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["mode"].(string) }}
      {%- end -%}

  map-coraza-app-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
        {%- if r["appName"].(string) != "" -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["appName"].(string) }}
        {%- end -%}
      {%- end -%}

  map-coraza-body-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["bodyMode"].(string) }} {{ r["contentMode"].(string) }} {{ r["maxBodyBytes"].(string) }}
      {%- end -%}

  # Fail-closed guard for routes whose selected WAF policy could not be
  # applied (unknown, ambiguous, or failed-validation self-service policy on a
  # live render). The admission webhook rejects proposed changes that would
  # introduce these, so this rule only covers breakage that pre-dates the
  # webhook or raced past it — such routes asked for a WAF and must fail
  # closed with 503 rather than silently serve unprotected.
  frontend-filters-113-haptic-waf-fail-closed:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range (gf | dig("corazaBrokenRoutes") | fallback([]any{}) | toSlice()) -%}
        {%- var e = entry.(map[string]any) -%}
      # WARNING haproxy-haptic.org/waf-policy on Ingress {{ e["resourceID"].(string) }}: {{ replace(e["reason"].(string), "\n", " ") }} Failing closed (503) for this route until it is fixed.
      http-request set-var(txn.denied_by) str(waf_policy_unavailable) if { var(txn.resource_id) -m str {{ e["resourceID"].(string) }} }
      http-request deny deny_status 503 if { var(txn.resource_id) -m str {{ e["resourceID"].(string) }} }
      {%- end -%}
