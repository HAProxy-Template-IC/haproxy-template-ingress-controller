# HAPTIC-native annotation library — request correlation ID.
#
# Generates a per-request unique ID (HAProxy `unique-id`) and forwards it to the
# upstream in a configurable header (default X-Request-ID), so a request can be
# correlated across HAProxy logs and the backend. Host-scoped per Ingress.
#
# This library only forwards the id upstream. `unique-id-format` itself belongs
# to base.yaml (defaults-settings-150-access-log-request-id), which emits it
# unconditionally so the access log's req_id field is always populated — two
# unique-id-format lines in one `defaults` section would be a duplicate
# directive, so this library must not emit its own.
templateSnippets:

  # ==========================================================================
  # Per-Ingress set-header (host-scoped). frontend-filters-* inherit no locals.
  # ==========================================================================
  frontend-filters-880-haptic-request-id:
    template: |
      {#
        HAPTIC request-id — forward a correlation ID upstream.

        Annotations:
          - haproxy-haptic.org/request-id: "true" (enables the feature)
          - haproxy-haptic.org/request-id-header: "<name>" (default X-Request-ID)
          - haproxy-haptic.org/request-id-accept-inbound: "true"
              preserve a client-supplied header value instead of overwriting it
              (default: always generate a fresh id, ignoring client input — a
              client-set id can't be trusted for internal correlation).

              A preserved value is only honoured when it is a well-formed
              identifier (^[A-Za-z0-9._:-]{1,128}$); anything else is replaced
              with a generated id. Without that bound a client chooses what lands
              in the backend's own logs, including an arbitrarily long value or
              one crafted to collide with another request's id. Envoy takes the
              same position (a non-UUID x-request-id disables its id-derived
              features).

        Generated HAProxy Config (host-scoped):
          accept-inbound=false (default):
            http-request set-header <H> %[unique-id] if <host-match>
          accept-inbound=true:
            http-request set-header <H> %[unique-id] if <host-match> !{ req.hdr(<H>) -m reg ^[A-Za-z0-9._:-]{1,128}$ }

        Note: the access log's `req_id` field is always HAProxy's own id
        (unique-id, an RFC 9562 UUIDv7 from base.yaml's
        defaults-settings-150-access-log-request-id). With accept-inbound the
        upstream therefore sees the client's id while the log line carries
        HAPTIC's — join them on the backend side if you enable it.
      #}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- if ingress.Metadata.Annotations["haproxy-haptic.org/request-id"] == "true" %}
            {%- var hdr = ingress.Metadata.Annotations["haproxy-haptic.org/request-id-header"] %}
            {%- if hdr == "" %}{%- hdr = "X-Request-ID" %}{%- end %}
            {%- var h = ValidateConfigValue(hdr, "haproxy-haptic.org/request-id-header", key, false) %}
            {%- var acceptInbound = ingress.Metadata.Annotations["haproxy-haptic.org/request-id-accept-inbound"] == "true" %}
            {%- var hosts = []string{} %}
            {%- for _, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # haptic/request-id ({{ key }})
              {%- if acceptInbound %}
      http-request set-header {{ h }} %[unique-id] if {{ HostMatchCondition(hosts) }} !{ req.hdr({{ h }}) -m reg ^[A-Za-z0-9._:-]{1,128}$ }
              {%- else %}
      http-request set-header {{ h }} %[unique-id] if {{ HostMatchCondition(hosts) }}
              {%- end %}
            {%- end %}
          {%- end %}
      {%- end -%}
