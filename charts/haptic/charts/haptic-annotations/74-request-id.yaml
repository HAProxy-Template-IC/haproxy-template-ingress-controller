# HAPTIC-native annotation library — request correlation ID.
#
# Generates a per-request unique ID (HAProxy `unique-id`) and forwards it to the
# upstream in a configurable header (default X-Request-ID), so a request can be
# correlated across HAProxy logs and the backend. Keyed by route.
#
# This library only forwards the id upstream. `unique-id-format` itself belongs
# to base.yaml (defaults-settings-150-access-log-request-id), which emits it
# unconditionally so the access log's req_id field is always populated — two
# unique-id-format lines in one `defaults` section would be a duplicate
# directive, so this library must not emit its own.
templateSnippets:

  # ==========================================================================
  # Per-route map lane. haptic-request-id-routes.map: "<route id>" ->
  # "<Header> <accept-inbound 0|1>"; one set-header per distinct pair, since
  # the header name is a literal: a new pair reloads once, a route on a known
  # pair is a map edit. With accept-inbound a client-supplied value is kept
  # only when it is a well-formed identifier (^[A-Za-z0-9._:-]{1,128}$):
  # without that bound a client chooses what lands in the backend's logs,
  # including a value crafted to collide with another request's id (Envoy
  # takes the same position). The access log's req_id is always HAProxy's own
  # id, so with accept-inbound join the two on the backend side.
  # ==========================================================================
  features-880-haptic-request-id:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/request-id']"]
      group: haptic-request-id
      effects: [publishValue]
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/request-id"] == "true" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var hdr = ingress.Metadata.Annotations["haproxy-haptic.org/request-id-header"] -%}
        {%- if hdr == "" -%}{%- hdr = "X-Request-ID" -%}{%- end -%}
        {%- var pair = ValidateConfigValue(hdr, "haproxy-haptic.org/request-id-header", key, false) + " 0" -%}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/request-id-accept-inbound"] == "true" -%}{%- pair = pair[:len(pair)-1] + "1" -%}{%- end -%}
        {{- shared.Publish("any", "any", "any") -}}
        {{- shared.Publish("route", key, key + " " + pair) -}}
        {{- shared.Publish("pair", pair, pair) -}}
      {%- end -%}

  frontend-filters-880-haptic-request-id:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-request-id", "any") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("hapticRequestIDMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("haptic-request-id", "route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haptic-request-id-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
        var pairs = []any{}
        for _, v := range incremental_values("haptic-request-id", "pair") {
          pairs = append(pairs, tostring(v))
        }
      %%}
      # haptic/request-id
      {%- for _, p := range sort_strings(pairs) %}
        {%- var parts = split(tostring(p), " ") %}
        {%- if parts[1] == "1" %}
      http-request set-header {{ parts[0] }} %[unique-id] if { var(txn.resource_id),map({{ routes }}) -m str "{{ p }}" } !{ req.hdr({{ parts[0] }}) -m reg ^[A-Za-z0-9._:-]{1,128}$ }
        {%- else %}
      http-request set-header {{ parts[0] }} %[unique-id] if { var(txn.resource_id),map({{ routes }}) -m str "{{ p }}" }
        {%- end %}
      {%- end %}
      {%- end %}
