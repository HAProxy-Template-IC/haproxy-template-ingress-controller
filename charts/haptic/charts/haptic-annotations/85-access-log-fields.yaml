# HAPTIC-native annotation library — JSON access-log field contributions.
#
# Extension point: log-fields-* (band 800, this library's range). Each snippet
# contributes named HAProxy log-format items and nothing else; base.yaml's
# util-log-format-http assembles them into the single log-format line every
# frontend emits. See base.yaml's "Access log" block for the contribution
# contract (item grammar, log-time-availability rule, gating, typing).
#
# Every snippet is gated on the feature it describes actually being configured,
# so an install that doesn't use a feature carries no permanently-empty key and
# pays no bytes per log line.
#
# Sensitive values are deliberately absent and must stay absent:
#   - txn.haptic_apikey is the presented API key (a raw secret),
#   - txn.haptic_hmac is signature material,
#   - ssl_c_der is the full client certificate (far too large for a log field).
templateSnippets:

  log-fields-800-consumer:
    template: |-
      {#-
        Authenticated consumer identity.

        Set by the native JWT (sub claim) and API-key (key id → consumer) backend
        rules, and the key a per-consumer rate limit buckets on, so it is the
        field that turns "someone is being throttled" into "which customer".
      -#}
      {%- var enabled = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/jwt-secret"] != "" || ingress.Metadata.Annotations["haproxy-haptic.org/api-key-secret"] != "" %}
          {%- enabled = true %}
        {%- end %}
      {%- end %}
      {%- if enabled %}
      %(consumer)[var(txn.haptic_consumer)]
      {%- end %}

  log-fields-810-cache:
    template: |-
      {#-
        Varnish cache verdict.

        cache is Varnish's own X-Cache header, captured into a transaction
        variable by backends-870-haptic-varnish-cache (a log-format cannot fetch
        response headers). HIT/MISS per request is the only place the cache
        effectiveness of a specific route is visible.

        app_backend earns its own field because a cache-enabled route sets
        `use_backend varnish_cache`, so the core `backend` field says
        "varnish_cache" and no longer identifies the application backend the
        request was routed to.
      -#}
      {%- if tostring(extraContext | dig("cache", "varnish", "enabled") | fallback("false")) == "true" %}
      %(cache)[var(txn.cache_status)]
      %(app_backend)[var(txn.backend_name)]
      {%- end %}

  log-fields-820-peer-ip:
    template: |-
      {#-
        The real TCP peer, when a forwarding header has replaced the client IP.

        `haproxy-haptic.org/src-ip-header` makes `http-request set-src` rewrite
        the source address, which also changes what the core client_ip field
        reports. fc_src is the untouched connection source, so the pair is the
        only way to see that a client claimed an address it doesn't own — i.e. to
        catch a spoofed forwarding header.
      -#}
      {%- var enabled = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/src-ip-header"] != "" %}
          {%- enabled = true %}
        {%- end %}
      {%- end %}
      {%- if enabled %}
      %(client_ip_peer)[fc_src]
      {%- end %}

  log-fields-830-captured-headers:
    template: |-
      {#-
        Request headers captured with `haproxy-haptic.org/request-capture`.

        %hr is the positional capture list HAProxy's own httplog carries, and it
        is the only consumer of the capture feature — without it the annotation
        configures captures that nothing reads.

        This is the one field an operator can make arbitrarily large: the
        annotation's per-header length is not capped. Raise
        extraContext.accessLog.maxLineBytes if wide captures push records past
        the truncation limit, since a truncated record is invalid JSON.

        The haproxytech library contributes an identical item for its own
        capture annotation; base's assembler deduplicates identical
        contributions, so both libraries can be enabled at once.
      -#}
      {%- var enabled = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/request-capture"] != "" %}
          {%- enabled = true %}
        {%- end %}
      {%- end %}
      {%- if enabled %}
      %(captured_headers)hr
      {%- end %}

  log-fields-840-mtls:
    template: |-
      {#-
        Client-certificate identity and verification result.

        ssl_c_verify is 0 on success and an X509 error code otherwise, so it is
        the field that says *why* a client certificate was refused; mtls_cn is
        the identity it presented. Both are connection-scoped and available at
        log time. The full DN, issuer, serial and the DER certificate are
        deliberately not logged — CN plus the error code answer the question at a
        fraction of the bytes.

        The vendor compatibility libraries contribute identical items for their
        own mTLS annotations; base's assembler deduplicates them.
      -#}
      {%- var enabled = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-secret"] != "" || ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cert-header"] == "true" %}
          {%- enabled = true %}
        {%- end %}
      {%- end %}
      {%- if enabled %}
      %(mtls_verify)[ssl_c_verify]
      %(mtls_cn)[ssl_c_s_dn(CN)]
      {%- end %}
