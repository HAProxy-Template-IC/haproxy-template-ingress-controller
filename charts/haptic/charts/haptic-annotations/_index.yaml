# HAPTIC-native annotation library (haproxy-haptic.org/*)
#
# The flagship, first-class annotation vocabulary for HAPTIC. Its capabilities
# are a best-of-breed SUPERSET of the three vendor annotation-compat libraries
# (haproxy.org/*, haproxy-ingress.github.io/*, nginx.ingress.kubernetes.io/*):
# for every capability it adopts whichever vendor's semantics is best, exposed
# under one clean native annotation name. Unlike the vendor libraries (which
# exist to ease migration FROM an upstream controller), this is the vocabulary
# HAPTIC's own docs and examples recommend going forward.
#
# Split library (ADR-0008): this _index.yaml is the load-rule authority
# (_helm_load + watchedResources + extraContext defaults). Production
# templateSnippets live in the sibling fragments by concern — 10-path-maps,
# 20-backend-directives, 30-frontend-filters, 40-features, 50-auth-spoe — and
# validationTests live under tests/. All fragments merge into one library at
# chart-render time; the merge order is lexicographic, but since each
# snippet/test name is unique the source file it lives in is purely
# organisational.
#
# Every annotation is documented (with its best-of-breed source and any
# divergence) in docs/site/docs/libraries/haptic-annotations.md and classified
# in 90-migration-coverage.yaml. Reserved output-annotation names on the
# haproxy-haptic.org group (e.g. haproxy-haptic.org/ownership) are NOT claimed
# as Ingress annotation keys here.

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.hapticAnnotations.enabled }}'

# Library-declared extraContext defaults. These flow into the rendered config's
# templatingSettings.extraContext as low-precedence defaults — an operator can
# override any of them via controller.config.templatingSettings.extraContext.
# Snippets read them the usual way, keeping a literal fallback so the snippet
# still works if the key is somehow absent.
templatingSettings:
  extraContext:
    # Default HSTS max-age (seconds) applied when haproxy-haptic.org/hsts is
    # enabled without an explicit haproxy-haptic.org/hsts-max-age. 63072000 =
    # 2 years (the modern HSTS-preload minimum).
    hapticHstsMaxAge: "63072000"
    # Regex a haproxy-haptic.org/auth-secret password hash must match, mirroring
    # the vendor libraries' hash-validation guard. Default accepts bcrypt
    # ($2a/$2b/$2y), Apache MD5 ($apr1), and crypt SHA-256/512 ($5/$6) / MD5 ($1).
    hapticPasswordHashRegex: '^\$(2[aby]|apr1|1|5|6)\$'
    # Shared-cache (Varnish tier) wiring. The chart overrides these from
    # controller.cache.varnish via templates/haproxytemplateconfig.yaml when the
    # tier is enabled; the fallbacks keep the caching snippets renderable
    # (offline/standalone) when it is not. hapticCacheEnabled gates whether the
    # varnish_cache backend + routing are emitted at all.
    hapticCacheEnabled: "false"
    hapticCacheVarnishService: "haptic-varnish-cache"
    hapticCacheVarnishNamespace: "default"
    hapticCacheVarnishPort: "6081"
    # HAProxy origin the Varnish tier loops back to on a miss; the chart sets
    # these to the controller-managed HAProxy Service (host + HTTP port).
    hapticCacheOriginHost: "haptic"
    hapticCacheOriginPort: "80"
    # Bounded-load consistent hashing: cap any one Varnish shard's share to this
    # factor of the mean (prevents a hot key pinning a pod). 0 disables.
    hapticCacheHashBalanceFactor: "150"
    # Varnish workload shape (chart-overridden from controller.cache.varnish.*).
    hapticCacheWorkload: "statefulset"          # statefulset | deployment
    hapticCacheReplicas: "2"
    hapticCacheImage: "varnish:7.6"
    hapticCacheMalloc: "256m"                    # -s malloc,<size> (≈75% of the mem limit)
    hapticCachePDBEnabled: "true"
    hapticCachePDBMaxUnavailable: "1"
    # Shared request-rate limiting (SPOA rate-limit + optional Valkey store).
    # The chart overrides these from controller.rateLimit.* via
    # templates/haproxytemplateconfig.yaml when enabled.
    hapticRateLimitSharedEnabled: "false"
    hapticRateLimitStoreEnabled: "false"
    hapticRateLimitStoreBaseName: "haptic-rate-limit-store"
    hapticRateLimitStoreNamespace: "default"
    hapticRateLimitStorePort: "6379"
    hapticRateLimitStoreImage: "valkey/valkey:8-alpine"
    hapticRateLimitStoreReplicas: "3"
    hapticRateLimitStoreCpuRequest: "50m"
    hapticRateLimitStoreMemRequest: "128Mi"
    hapticRateLimitStoreMemLimit: "128Mi"
    hapticRateLimitStoreSentinelPort: "26379"
    hapticRateLimitStoreSentinelQuorum: "2"
    hapticRateLimitStoreSentinelDownAfterMs: "2000"
    hapticRateLimitStoreSentinelFailoverTimeoutMs: "10000"
    hapticRateLimitStoreSentinelParallelSyncs: "1"
    hapticRateLimitStoreSentinelCpuRequest: "25m"
    hapticRateLimitStoreSentinelMemRequest: "64Mi"
    hapticRateLimitStoreSentinelMemLimit: "64Mi"
    hapticRateLimitStorePDBEnabled: "true"
    hapticRateLimitStorePDBMaxUnavailable: "1"
    # API-gateway JSON request validation (SPOA api-gateway plugin). The chart
    # overrides these from controller.apiGateway.validation when enabled.
    hapticRequestValidationEnabled: "false"
    hapticRequestValidationMaxBodyBytes: "8192"
    hapticRequestValidationBufferHeadroomBytes: "8192"
    hapticRequestValidationFailOpen: "false"
    hapticRequestValidationBodyWaitTimeout: "100ms"

watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]
  configmaps:
    apiVersion: v1
    resources: configmaps
    # Request-validation schemas are looked up by exact reference only. Keep
    # ConfigMap bodies on-demand so enabling this library doesn't retain every
    # cluster ConfigMap body in controller memory.
    store: on-demand
    indexBy: ["metadata.namespace", "metadata.name"]
