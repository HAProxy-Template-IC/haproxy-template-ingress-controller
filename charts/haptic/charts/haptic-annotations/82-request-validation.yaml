# HAPTIC-native JSON request validation annotations (haproxy-haptic.org/*).
#
# API-gateway request validation via the haproxy-spoa-hub api-gateway plugin
# (spoaHub.plugins.api-gateway). This validates buffered JSON request bodies
# against JSON Schemas resolved at render time from ConfigMaps or Secrets.
#
#   haproxy-haptic.org/request-schema-configmap    [<ns>/]<name>[:<key>]
#   haproxy-haptic.org/request-schema-secret       [<ns>/]<name>[:<key>]
#   haproxy-haptic.org/request-schema-content-types comma-separated media types (default application/json)
#   haproxy-haptic.org/request-schema-max-body-size positive bytes (default extraContext.apiGateway.requestSchemaValidation.requestBody.defaultMaxBytes)
#   haproxy-haptic.org/request-schema-fail-open    true | false (default extraContext.apiGateway.requestSchemaValidation.defaultFailOpen)
#
# Exactly one of request-schema-configmap / request-schema-secret activates
# validation. ConfigMap schemas are read from .data[key] and base64-encoded into
# the plugin TOML; Secret schemas use .data[key] as-is. The plugin compiles all
# schemas during init/validate, so invalid JSON/JSON Schema is rejected before
# serving traffic. Runtime dispatch is limited to POST/PUT/PATCH, rejects
# bodies over the configured cap before the SPOE roundtrip, and waits for
# request bodies only on routes that actually opted into validation.
templateSnippets:
  # The schema scan below (and its opt-in guard) runs only when the spoa-hub
  # library declares the request-schema map/config, i.e. only when the hub is
  # loaded. This guard must fire even when it is not — otherwise a
  # request-schema-* annotation is silently ignored on a hub-less install
  # (fail-open on request validation). features-* always renders, so the opt-in
  # check lives here; util-821 keeps its own guard for the enabled-type check.
  features-806-haptic-request-validation-optin:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"enabled": extraContext | dig("apiGateway", "requestSchemaValidation", "enabled") | fallback(false)}}) -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/request-schema-configmap']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-secret']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-content-types']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-max-body-size']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-fail-open']"
    template: |-
      {%- var enabled = tostring(props["enabled"]) -%}
      {%- if enabled != "true" -%}
        {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
          {%%
            var a = ingress.Metadata.Annotations
            var hasAny = a["haproxy-haptic.org/request-schema-configmap"] != "" || a["haproxy-haptic.org/request-schema-secret"] != "" || a["haproxy-haptic.org/request-schema-content-types"] != "" || a["haproxy-haptic.org/request-schema-max-body-size"] != "" || a["haproxy-haptic.org/request-schema-fail-open"] != ""
          %%}
          {%- if hasAny -%}
            {{- fail("Ingress " + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + " sets haproxy-haptic.org/request-schema-* annotations but request validation is not enabled. Set controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled=true, or remove the annotations.") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Both parallel legacy consumers replay the immutable publications through one root-local write.
  util-820-api-gateway-schemas:
    template: |-
      {%- var _, _ = shared.ComputeIfAbsent("apiGatewaySchemaScan", func() any {
        var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} })
        var _ = render "haptic-request-validation-publications"
        var gf = shared.Get("globalFeatures").(map[string]any)
        gf["apiGatewaySchemas"] = incremental_values("haptic-request-validation", "schemas")
        gf["apiGatewaySchemaRules"] = incremental_values("haptic-request-validation", "rules")
        return true
      }) -%}

  util-haptic-request-validation-bindings:
    template: |-
      {%- var apiGatewayAny = extraContext | dig("apiGateway") -%}
      {%- if apiGatewayAny == nil %}{%- apiGatewayAny = map[string]any{} %}{%- end -%}
      {%- var apiGateway, apiGatewayOK = apiGatewayAny.(map[string]any) -%}
      {%- if !apiGatewayOK %}{{- fail("extraContext.apiGateway must be a map.") -}}{%- end -%}
      {%- for _, field := range keys(apiGateway) -%}
        {%- if field != "requestSchemaValidation" %}{{- fail("extraContext.apiGateway contains unknown field '" + field + "'.") -}}{%- end -%}
      {%- end -%}
      {%- var validationAny = apiGateway | dig("requestSchemaValidation") -%}
      {%- if validationAny == nil %}{%- validationAny = map[string]any{} %}{%- end -%}
      {%- var validation, validationOK = validationAny.(map[string]any) -%}
      {%- if !validationOK %}{{- fail("extraContext.apiGateway.requestSchemaValidation must be a map.") -}}{%- end -%}
      {%- for _, field := range keys(validation) -%}
        {%- if field != "enabled" && field != "requestBody" && field != "defaultFailOpen" %}{{- fail("extraContext.apiGateway.requestSchemaValidation contains unknown field '" + field + "'.") -}}{%- end -%}
      {%- end -%}
      {%- var enabled = false -%}
      {%- var enabledAny, enabledSet = validation["enabled"] -%}
      {%- if enabledSet -%}
        {%- var enabledOK = false -%}
        {%- enabled, enabledOK = enabledAny.(bool) -%}
        {%- if !enabledOK %}{{- fail("extraContext.apiGateway.requestSchemaValidation.enabled must be a boolean.") -}}{%- end -%}
      {%- end -%}
      {%- var requestBodyAny = validation | dig("requestBody") -%}
      {%- if requestBodyAny == nil %}{%- requestBodyAny = map[string]any{} %}{%- end -%}
      {%- var requestBody, requestBodyOK = requestBodyAny.(map[string]any) -%}
      {%- if !requestBodyOK %}{{- fail("extraContext.apiGateway.requestSchemaValidation.requestBody must be a map.") -}}{%- end -%}
      {%- for _, field := range keys(requestBody) -%}
        {%- if field != "waitTimeout" && field != "defaultMaxBytes" %}{{- fail("extraContext.apiGateway.requestSchemaValidation.requestBody contains unknown field '" + field + "'.") -}}{%- end -%}
      {%- end -%}
      {%- var defaultMaxBody = "8192" -%}
      {%- var defaultMaxBodyAny, defaultMaxBodySet = requestBody["defaultMaxBytes"] -%}
      {%- if defaultMaxBodySet %}{%- defaultMaxBody = tostring(defaultMaxBodyAny) %}{%- end -%}
      {%- if !regex_search(defaultMaxBody, "^[0-9]+$") || toint(defaultMaxBody) < 1 || toint(defaultMaxBody) > 1048576 %}{{- fail("extraContext.apiGateway.requestSchemaValidation.requestBody.defaultMaxBytes must be an integer between 1 and 1048576 bytes.") -}}{%- end -%}
      {%- var waitTimeout = "100ms" -%}
      {%- var waitTimeoutAny, waitTimeoutSet = requestBody["waitTimeout"] -%}
      {%- if waitTimeoutSet %}{%- waitTimeout = tostring(waitTimeoutAny) %}{%- end -%}
      {%- if !regex_search(waitTimeout, "^[1-9][0-9]*(us|ms|s|m|h|d)?$") %}{{- fail("extraContext.apiGateway.requestSchemaValidation.requestBody.waitTimeout must be a positive HAProxy duration.") -}}{%- end -%}
      {%- var defaultFailOpen = false -%}
      {%- var defaultFailOpenAny, defaultFailOpenSet = validation["defaultFailOpen"] -%}
      {%- if defaultFailOpenSet -%}
        {%- var defaultFailOpenOK = false -%}
        {%- defaultFailOpen, defaultFailOpenOK = defaultFailOpenAny.(bool) -%}
        {%- if !defaultFailOpenOK %}{{- fail("extraContext.apiGateway.requestSchemaValidation.defaultFailOpen must be a boolean.") -}}{%- end -%}
      {%- end -%}
      {%- var validationBuffer = "16384" -%}
      {%- var validationBufferAny = extraContext | dig("requestBodyInspection", "haproxyBuffer", "sizeBytes") -%}
      {%- if validationBufferAny != nil %}{%- validationBuffer = tostring(validationBufferAny) %}{%- end -%}
      {%- if !regex_search(validationBuffer, "^[0-9]+$") %}{{- fail("extraContext.requestBodyInspection.haproxyBuffer.sizeBytes must be an integer.") -}}{%- end -%}
      {%- var validationBufferN = toint(validationBuffer) -%}
      {%- var validationBufferReserved = "8192" -%}
      {%- var validationBufferReservedAny = extraContext | dig("requestBodyInspection", "haproxyBuffer", "reservedBytes") -%}
      {%- if validationBufferReservedAny != nil %}{%- validationBufferReserved = tostring(validationBufferReservedAny) %}{%- end -%}
      {%- if !regex_search(validationBufferReserved, "^[0-9]+$") %}{{- fail("extraContext.requestBodyInspection.haproxyBuffer.reservedBytes must be an integer.") -}}{%- end -%}
      {%- var validationBufferReservedN = toint(validationBufferReserved) -%}
      {%- if validationBufferN < 16384 || validationBufferN > 2097152 %}{{- fail("extraContext.requestBodyInspection.haproxyBuffer.sizeBytes must be between 16384 and 2097152 bytes.") -}}{%- end -%}
      {%- if validationBufferReservedN < 1 || validationBufferReservedN >= validationBufferN %}{{- fail("extraContext.requestBodyInspection.haproxyBuffer.reservedBytes must be positive and smaller than sizeBytes.") -}}{%- end -%}
      {%- var validationBodyCapacityN = validationBufferN - validationBufferReservedN -%}
      {%- if toint(defaultMaxBody) > validationBodyCapacityN %}{{- fail("extraContext.apiGateway.requestSchemaValidation.requestBody.defaultMaxBytes exceeds the shared HAProxy request-body capacity.") -}}{%- end -%}
      {{- toJSON(map[string]any{"ingresses": map[string]any{
        "enabled": enabled,
        "defaultMaxBody": defaultMaxBody,
        "defaultFailOpen": defaultFailOpen,
        "validationBodyCapacity": validationBodyCapacityN,
        "validationBufferReserved": validationBufferReservedN,
      }}) -}}

  haptic-request-validation-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- render "util-haptic-request-validation-bindings" -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/request-schema-configmap']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-secret']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-content-types']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-max-body-size']"
        - "metadata.annotations['haproxy-haptic.org/request-schema-fail-open']"
      group: haptic-request-validation
      effects: [publishValue]
    template: |-
      {%- var enabled = props["enabled"].(bool) -%}
      {%- var defaultMaxBody = tostring(props["defaultMaxBody"]) -%}
      {%- var defaultFailOpen = props["defaultFailOpen"].(bool) -%}
      {%- var validationBodyCapacityN = toint(props["validationBodyCapacity"]) -%}
      {%- var validationBufferReservedN = toint(props["validationBufferReserved"]) -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var ns = ingress.Metadata.Namespace -%}
        {%- var name = ingress.Metadata.Name -%}
        {%- var key = ns + "/" + name -%}
        {%- var cmRef = ingress.Metadata.Annotations["haproxy-haptic.org/request-schema-configmap"] -%}
        {%- var secretRef = ingress.Metadata.Annotations["haproxy-haptic.org/request-schema-secret"] -%}
        {%- var contentTypesRaw = ingress.Metadata.Annotations["haproxy-haptic.org/request-schema-content-types"] -%}
        {%- var maxBodyRaw = ingress.Metadata.Annotations["haproxy-haptic.org/request-schema-max-body-size"] -%}
        {%- var failOpenRaw = ingress.Metadata.Annotations["haproxy-haptic.org/request-schema-fail-open"] -%}
        {%- var hasAny = cmRef != "" || secretRef != "" || contentTypesRaw != "" || maxBodyRaw != "" || failOpenRaw != "" -%}
        {%- if hasAny -%}
          {%- if !enabled -%}
            {{- fail("Ingress " + key + " sets haproxy-haptic.org/request-schema-* annotations but request validation is not enabled. Set controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled=true, or remove the annotations.") -}}
          {%- end -%}
          {%- if cmRef != "" && secretRef != "" -%}
            {{- fail("Ingress " + key + " sets both 'haproxy-haptic.org/request-schema-configmap' and 'haproxy-haptic.org/request-schema-secret'; request validation requires exactly one schema source.") -}}
          {%- end -%}
          {%- if cmRef == "" && secretRef == "" -%}
            {{- fail("Ingress " + key + " sets request-schema options without a schema source; set exactly one of 'haproxy-haptic.org/request-schema-configmap' or 'haproxy-haptic.org/request-schema-secret'.") -}}
          {%- end -%}

          {%- var sourceKind = "configmap" -%}
          {%- var sourceRef = cmRef -%}
          {%- if secretRef != "" -%}{%- sourceKind = "secret" -%}{%- sourceRef = secretRef -%}{%- end -%}
          {%- var refMain = sourceRef -%}
          {%- var dataKey = "schema.json" -%}
          {%- if strings_contains(sourceRef, ":") -%}
            {%- var refParts = strings_splitn(sourceRef, ":", 2) -%}
            {%- refMain = strip(refParts[0]) -%}
            {%- dataKey = strip(refParts[1]) -%}
          {%- end -%}
          {%- if refMain == "" || dataKey == "" -%}
            {{- fail("Invalid request schema reference '" + sourceRef + "' on Ingress '" + key + "'. Expected [<namespace>/]<name>[:<key>].") -}}
          {%- end -%}
          {%- if !regex_search(dataKey, "^[A-Za-z0-9._-]+$") -%}
            {{- fail("Invalid schema key '" + dataKey + "' in request schema reference on Ingress '" + key + "'. Allowed characters: letters, digits, '.', '_' and '-'.") -}}
          {%- end -%}
          {%- var sourceNs = ns -%}
          {%- var sourceName = refMain -%}
          {%- if strings_contains(refMain, "/") -%}
            {%- var nn = strings_splitn(refMain, "/", 2) -%}
            {%- sourceNs = strip(nn[0]) -%}
            {%- sourceName = strip(nn[1]) -%}
          {%- end -%}
          {%- if sourceNs == "" || sourceName == "" -%}
            {{- fail("Invalid request schema reference '" + sourceRef + "' on Ingress '" + key + "'. Namespace and name must be non-empty.") -}}
          {%- end -%}

          {%- var schemaB64 = "" -%}
          {%- if sourceKind == "configmap" -%}
            {%- var cm = resources.configmaps.GetSingle(sourceNs, sourceName) -%}
            {%- if cm == nil -%}
              {{- fail("ConfigMap '" + sourceNs + "/" + sourceName + "' referenced by 'haproxy-haptic.org/request-schema-configmap' on Ingress '" + key + "' was not found.") -}}
            {%- end -%}
            {%- var schemaText = cm.Data[dataKey] | tostring() -%}
            {%- if strip(schemaText) == "" -%}
              {{- fail("ConfigMap '" + sourceNs + "/" + sourceName + "' referenced by 'haproxy-haptic.org/request-schema-configmap' on Ingress '" + key + "' has an empty or missing '" + dataKey + "' data key.") -}}
            {%- end -%}
            {%- schemaB64 = schemaText | b64encode() -%}
          {%- else -%}
            {%- var sec = resources.secrets.GetSingle(sourceNs, sourceName) -%}
            {%- if sec == nil -%}
              {{- fail("Secret '" + sourceNs + "/" + sourceName + "' referenced by 'haproxy-haptic.org/request-schema-secret' on Ingress '" + key + "' was not found.") -}}
            {%- end -%}
            {%- schemaB64 = sec.Data[dataKey] | tostring() -%}
            {%- if strip(schemaB64) == "" -%}
              {{- fail("Secret '" + sourceNs + "/" + sourceName + "' referenced by 'haproxy-haptic.org/request-schema-secret' on Ingress '" + key + "' has an empty or missing '" + dataKey + "' data key.") -}}
            {%- end -%}
            {%- if !regex_search(schemaB64, "^[A-Za-z0-9+/=]+$") -%}
              {{- fail("Secret '" + sourceNs + "/" + sourceName + "' referenced by 'haproxy-haptic.org/request-schema-secret' on Ingress '" + key + "' has a malformed base64 schema value in key '" + dataKey + "'.") -}}
            {%- end -%}
          {%- end -%}

          {%- var maxBody = defaultMaxBody -%}
          {%- if maxBodyRaw != "" -%}{%- maxBody = strip(maxBodyRaw) -%}{%- end -%}
          {%- var maxBodyN = toint(maxBody) -%}
          {%- if maxBodyN <= 0 || maxBodyN > 1048576 -%}
            {{- fail("Invalid request schema max body size '" + maxBody + "' on Ingress '" + key + "'. Must be between 1 and 1048576 bytes.") -}}
          {%- end -%}
          {%- if maxBodyN > validationBodyCapacityN -%}
            {{- fail("Invalid request schema max body size '" + maxBody + "' on Ingress '" + key + "'. Must not exceed requestBodyInspection.haproxyBuffer.sizeBytes minus requestBodyInspection.haproxyBuffer.reservedBytes (" + tostring(validationBodyCapacityN) + " bytes body capacity with current settings, " + tostring(validationBufferReservedN) + " bytes reserved), otherwise HAProxy may validate a truncated request body.") -}}
          {%- end -%}

          {%- var failOpen = tostring(defaultFailOpen) -%}
          {%- if failOpenRaw != "" -%}{%- failOpen = strings_lower(strip(failOpenRaw)) -%}{%- end -%}
          {%- if failOpen != "true" && failOpen != "false" -%}
            {{- fail("Invalid value '" + failOpenRaw + "' for annotation 'haproxy-haptic.org/request-schema-fail-open' on Ingress '" + key + "'. Expected 'true' or 'false'.") -}}
          {%- end -%}

          {%- var contentTypes = []any{} -%}
          {%- if contentTypesRaw == "" -%}{%- contentTypesRaw = "application/json" -%}{%- end -%}
          {%- for _, tok := range split(contentTypesRaw, ",") -%}
            {%- var ct = strings_lower(strip(tok)) -%}
            {%- if ct != "" -%}
              {%- if !regex_search(ct, "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$") -%}
                {{- fail("Invalid media type '" + ct + "' in annotation 'haproxy-haptic.org/request-schema-content-types' on Ingress '" + key + "'.") -}}
              {%- end -%}
              {%- contentTypes = append(contentTypes, ct) -%}
            {%- end -%}
          {%- end -%}
          {%- if len(contentTypes) == 0 -%}
            {{- fail("Annotation 'haproxy-haptic.org/request-schema-content-types' on Ingress '" + key + "' must contain at least one media type.") -}}
          {%- end -%}

          {%- var contentTypesJoined = join(contentTypes, ",") -%}
          {#- Content types are route policy. Include them in the effective schema
              id so two routes can reuse the same schema source with different
              accepted media types without sharing the wrong compiled policy. -#}
          {%- var schemaID = sourceKind + "/" + sourceNs + "/" + sourceName + "/" + dataKey + "/" + contentTypesJoined -%}
          {{- shared.Publish("schemas", schemaID, map[string]any{
              "id": schemaID,
              "schemaBase64": schemaB64,
              "contentTypes": contentTypes,
            }) -}}
          {{- shared.Publish("rules", key, map[string]any{
              "resourceID": key,
              "schemaID": schemaID,
              "maxBodyBytes": tostring(maxBodyN),
              "failOpen": failOpen,
              "contentTypes": contentTypesJoined,
            }) -}}
        {%- end -%}
      {%- end -%}

  map-request-schema-820-haptic:
    template: |-
      {{- render "util-820-api-gateway-schemas" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- var rules = gf["apiGatewaySchemaRules"].([]any) -%}
      {%- for _, rule := range rules -%}
        {%- var r = rule.(map[string]any) -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["schemaID"].(string) }} {{ r["maxBodyBytes"].(string) }} {{ r["failOpen"].(string) }} {{ r["contentTypes"].(string) }}
      {%- end -%}
