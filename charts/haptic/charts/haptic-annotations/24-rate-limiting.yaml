# HAPTIC-native rate-limiting annotations (haproxy-haptic.org/*).
#
# Best-of-breed superset of the three vendor rate-limiting libraries:
#   - haproxytech.yaml      → tunable period / size / status-code + whitelist +
#                             'peers localinstance' reload-survival
#   - nginx-ingress/        → limit-connections (conn_cur) + limit-rate bandwidth
#   - haproxy-ingress/      → limit-rps / limit-rpm precedence + whitelist
#
# Exposed under one clean native vocabulary:
#   haproxy-haptic.org/rate-limit-rps          per-source request/sec cap
#   haproxy-haptic.org/rate-limit-rpm          per-source request/min cap
#   haproxy-haptic.org/rate-limit-connections  per-source concurrent-conn cap
#   haproxy-haptic.org/rate-limit-period       stick-table window override
#   haproxy-haptic.org/rate-limit-size         stick-table size
#   haproxy-haptic.org/rate-limit-status-code  deny status
#   haproxy-haptic.org/rate-limit-allowlist    exempt CIDRs
#   haproxy-haptic.org/download-bandwidth-limit  bytes/sec sent toward the client
#   haproxy-haptic.org/upload-bandwidth-limit    bytes/sec received from the client
#   haproxy-haptic.org/bandwidth-limit-scope     stream (default) | client | service
templateSnippets:
  backend-directives-810-haptic-rate-limiting:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {#-
        HAPTIC-native per-source-IP rate limiting.

        Documentation: docs/site/docs/libraries/haptic-annotations.md#rate-limiting

        Annotations (all optional; the block is emitted only when one of the
        three caps below is set):
          - haproxy-haptic.org/rate-limit-rps: per-source requests/second cap;
            requests over the cap are rejected (hard cap, no burst allowance).
          - haproxy-haptic.org/rate-limit-rpm: per-source requests/minute cap;
            ignored when rate-limit-rps is also set.
          - haproxy-haptic.org/rate-limit-connections: per-source concurrent
            connection cap (conn_cur); ignored when rps or rpm is set.
          - haproxy-haptic.org/rate-limit-period: stick-table window override
            (e.g. "10s"). When unset it derives from the cap: 1s for rps, 60s
            for rpm, 30s table-TTL for connections.
          - haproxy-haptic.org/rate-limit-size: stick-table size (default 100k).
          - haproxy-haptic.org/rate-limit-status-code: deny status (default 429).
          - haproxy-haptic.org/rate-limit-allowlist: comma-separated CIDRs never
            subject to the deny (still tracked). Invalid CIDR → fail.

        Precedence (HAProxy stores one stick-table per backend, and each data
        type at most once): rps > rpm > connections. rps and rpm both use
        http_req_rate and cannot coexist; connections uses a separate conn_cur
        counter. A higher-precedence cap silently wins and a comment records
        which lower caps were ignored.

        Generated HAProxy config (rate-limit-rps: 10, whitelist 10.0.0.0/8):
          stick-table type ip size 100k expire 1s store http_req_rate(1s) peers localinstance
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_http_req_rate(0) gt 10 } !{ src 10.0.0.0/8 }

        A cache-enabled route is skipped: on the client leg it is switched to
        varnish_cache before this backend, and on the origin leg src is the
        Varnish pod, not the client. frontend-filters-863 enforces it on the
        client leg instead, with its own table proxy (backends-810).
      -#}
      {%- if ingress != nil && !(tostring(extraContext | dig("cache", "varnish", "enabled") | fallback("false")) == "true" && ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true") %}
        {%%
          var ns = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          var key = ns + "/" + name
          var rps = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rps"]
          var rpm = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rpm"]
          var conns = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-connections"]
        %%}
        {#- Resolve the active cap by precedence: rps > rpm > connections.
            store/checkFetch pick the counter; defaultWindow drives expire. -#}
        {%- var threshold = "" %}
        {%- var store = "" %}
        {%- var checkFetch = "" %}
        {%- var defaultWindow = "" %}
        {%- if rps != "" %}
          {%- threshold = rps %}
          {%- store = "http_req_rate" %}
          {%- checkFetch = "sc_http_req_rate" %}
          {%- defaultWindow = "1s" %}
        {%- else if rpm != "" %}
          {%- threshold = rpm %}
          {%- store = "http_req_rate" %}
          {%- checkFetch = "sc_http_req_rate" %}
          {%- defaultWindow = "60s" %}
        {%- else if conns != "" %}
          {%- threshold = conns %}
          {%- store = "conn_cur" %}
          {%- checkFetch = "sc_conn_cur" %}
          {%- defaultWindow = "30s" %}
        {%- end %}
        {%- if threshold != "" %}
          {#- Threshold must be a positive integer; normalise it so only the
              integer lands on the config line. -#}
          {%- var n = toint(threshold) %}
          {%- if n <= 0 %}
            {{- fail("Invalid rate-limit threshold '" + threshold + "' on Ingress '" + key + "'. Must be a positive integer.") -}}
          {%- end %}
          {%- var thresholdOut = tostring(n) %}
          {#- period overrides the derived window; validate as a bare number or
              HAProxy duration suffix so it can't inject config. -#}
          {%- var window = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-period"] %}
          {%- if window == "" %}
            {%- window = defaultWindow %}
          {%- else if !regex_search(window, "^[0-9]+(us|ms|s|m|h|d)?$") %}
            {{- fail("Invalid value '" + window + "' for annotation 'haproxy-haptic.org/rate-limit-period' on Ingress '" + key + "'. Expected a HAProxy time value like '1s', '60s', '10m'.") -}}
          {%- end %}
          {%- var size = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-size"] %}
          {%- if size == "" %}
            {%- size = "100k" %}
          {%- else if !regex_search(size, "^[0-9]+[kKmMgG]?$") %}
            {{- fail("Invalid value '" + size + "' for annotation 'haproxy-haptic.org/rate-limit-size' on Ingress '" + key + "'. Expected a size like '100k', '1m'.") -}}
          {%- end %}
          {%- var status = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-status-code"] %}
          {%- if status == "" %}
            {%- status = "429" %}
          {%- else if !regex_search(status, "^[1-5][0-9][0-9]$") %}
            {{- fail("Invalid value '" + status + "' for annotation 'haproxy-haptic.org/rate-limit-status-code' on Ingress '" + key + "'. Expected a 3-digit HTTP status code.") -}}
          {%- end %}
          {#- rate-limit-allowlist: comma-separated CIDRs exempted from the deny
              via a trailing negated src guard. Routed through ValidateCidrList
              (full literal key at the call site for the lint gate). -#}
          {%- var whitelist = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-allowlist"] %}
          {%- var guard = "" %}
          {%- if whitelist != "" %}
            {%- var validated = ValidateCidrList(whitelist, "haproxy-haptic.org/rate-limit-allowlist", key) %}
            {%- if validated != "" %}
              {%- guard = " !{ src " + validated + " }" %}
            {%- end %}
          {%- end %}
          {#- Record any lower-precedence caps this render ignored. -#}
          {%- var ignored = []string{} %}
          {%- if rps != "" && rpm != "" %}{%- ignored = append(ignored, "rate-limit-rpm") %}{%- end %}
          {%- if (rps != "" || rpm != "") && conns != "" %}{%- ignored = append(ignored, "rate-limit-connections") %}{%- end %}
          {%- if len(ignored) > 0 %}
      # haptic/rate-limiting ({{ key }}) - {{ join(ignored, ", ") }} ignored (HAProxy stores one counter per stick-table per data type)
          {%- else %}
      # haptic/rate-limiting ({{ key }})
          {%- end %}
      {# `peers localinstance` (base.yaml global-top-050-peers) carries the #}
      {# per-source counter from the old worker to the new one on reload, so a #}
      {# client's accumulated rate survives config churn instead of resetting to #}
      {# zero and handing every client a fresh budget. Local-only: stays per-pod. #}
      stick-table type ip size {{ size }} expire {{ window }} store {{ store }}{% if store == "http_req_rate" %}({{ window }}){% end %} peers localinstance
      http-request track-sc0 src
      http-request set-var(txn.denied_by) str(rate_limit_local) if { {{ checkFetch }}(0) gt {{ thresholdOut }} }{{ guard }}
      http-request deny deny_status {{ status }} if { {{ checkFetch }}(0) gt {{ thresholdOut }} }{{ guard }}
        {%- end %}
      {%- end -%}

  backend-directives-815-haptic-bandwidth-limit:
    template: |
      {#
        HAPTIC-native bandwidth limiting (HAProxy bwlim filters, >= 2.7).

        Documentation: docs/site/docs/libraries/haptic-annotations.md#rate-and-bandwidth-limiting

        Annotations:
          - haproxy-haptic.org/download-bandwidth-limit: bytes/sec sent toward the
            client (e.g. "100k"). Emits a bwlim-out filter.
          - haproxy-haptic.org/upload-bandwidth-limit: bytes/sec received from the
            client. Emits a bwlim-in filter.
          - haproxy-haptic.org/bandwidth-limit-scope: what the budget is shared by.
              stream  (default) each stream gets the full limit  (per-stream filter)
              client            all streams of one source IP share it (key src)
              service           every stream of this backend shares it (key be_id)

        HAProxy mapping:
          filter bwlim-{out,in} <name> default-limit <rate> default-period 1s   (stream)
          filter bwlim-{out,in} <name> limit <rate> key {src,be_id}             (client/service)
          http-request set-bandwidth-limit <name>

        The shared scopes need a stick-table storing bytes_{in,out}_rate. `table` is
        optional and defaults to the current proxy's own stick-table (manual 9.7), so
        one backend-local table serves both directions and no separate table proxy is
        needed. HAProxy allows one stick-table per proxy, which is why a shared scope
        cannot coexist with the per-source rate-limit caps above.

        Operand order must stay `limit … key … table …`: client-native's
        BandwidthLimit.Result() re-serialises in that order, and any other order makes
        the desired and current configs normalise differently on every sync.

        No `peers localinstance`: a 1s byte-rate window is stale before the new worker
        forwards its first byte, unlike the request-rate table where a reset would hand
        every client a fresh budget.

        A cache-enabled route is skipped: the client leg never enters this
        backend (cache hits would stream unthrottled), and on the origin leg a
        src-keyed budget would pool all misses under the Varnish pod's IP.
        frontend-filters-864 enforces it on the client leg instead, with its
        own table proxy (backends-815) — which is also why a shared scope may
        coexist with a per-source cap there, unlike below.
      #}
      {%- if ingress != nil && !(tostring(extraContext | dig("cache", "varnish", "enabled") | fallback("false")) == "true" && ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true") %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var down = ingress.Metadata.Annotations["haproxy-haptic.org/download-bandwidth-limit"] %}
        {%- var up = ingress.Metadata.Annotations["haproxy-haptic.org/upload-bandwidth-limit"] %}
        {%- if down != "" || up != "" %}
          {%- var scope = ingress.Metadata.Annotations["haproxy-haptic.org/bandwidth-limit-scope"] %}
          {%- var tableKey = "" %}
          {%- var tableType = "" %}
          {%- if scope == "client" %}
            {%- tableKey = "src" %}
            {%- tableType = "ip" %}
          {%- else if scope == "service" %}
            {%- tableKey = "be_id" %}
            {%- tableType = "integer" %}
          {%- else if scope != "" && scope != "stream" %}
            {{- fail("Invalid value '" + scope + "' for annotation 'haproxy-haptic.org/bandwidth-limit-scope' on Ingress '" + key + "'. Valid: stream, client, service.") -}}
          {%- end %}
          {%- if tableKey != "" && (ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rps"] != "" || ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rpm"] != "" || ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-connections"] != "") %}
            {{- fail("Ingress '" + key + "' sets bandwidth-limit-scope '" + scope + "' next to a per-source rate-limit cap. HAProxy allows one stick-table per backend, so the config would not start. Use scope 'stream', or rate-limit-requests.") -}}
          {%- end %}
      # haptic/bandwidth-limit ({{ key }})
          {%- if tableKey != "" %}
      stick-table type {{ tableType }} size 100k expire 60s store bytes_in_rate(1s),bytes_out_rate(1s)
          {%- end %}
          {%- for _, direction := range []string{"download", "upload"} %}
            {%- var rate = down %}
            {%- var suffix = "out" %}
            {%- if direction == "upload" %}
              {%- rate = up %}
              {%- suffix = "in" %}
            {%- end %}
            {%- if rate != "" %}
              {%- if !regex_search(rate, "^[0-9]+[kKmMgG]?$") %}
                {{- fail("Invalid value '" + rate + "' for annotation 'haproxy-haptic.org/" + direction + "-bandwidth-limit' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
              {%- end %}
              {%- var fname = "haptic_bwlim_" + suffix + "_" + ns + "_" + name %}
              {%- var spec = "default-limit " + rate + " default-period 1s" %}
              {%- if tableKey != "" %}
                {%- spec = "limit " + rate + " key " + tableKey %}
              {%- end %}
      filter bwlim-{{ suffix }} {{ fname }} {{ spec }}
      http-request set-bandwidth-limit {{ fname }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # ==========================================================================
  # Client-leg limit data for cache-enabled routes (#134).
  #
  # frontend-filters-865 switches a cache-enabled route to `backend
  # varnish_cache`, so backend-directives-810/815 skip such routes (see their
  # headers) and the four snippets below re-emit the same limits in the client
  # frontends. This util resolves and validates the annotations once per
  # render and stores the result under the shared key "hapticCacheLocalLimits":
  #   rl: <ns>/<name> -> {table, store, checkFetch, threshold, window, size,
  #                       status, guard, ignored}
  #   bw: <ns>/<name> -> {ns, name, down, up, tableKey, tableType}
  # Consumed by frontend-filters-863/864 (rules) and backends-810/815 (table
  # proxies) — globs that cannot share template variables. Validation and
  # failure messages mirror backend-directives-810/815. The one-stick-table
  # refusal of 815 deliberately does not apply here: each limiter gets its own
  # table proxy, so a shared bandwidth scope and a per-source cap can coexist
  # on a cache-enabled route.
  # ==========================================================================
  util-haptic-cache-local-limits:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- var rlCfgs = map[string]any{} -%}
      {%- var bwCfgs = map[string]any{} -%}
      {%- if tostring(extraContext | dig("cache", "varnish", "enabled") | fallback("false")) == "true" -%}
        {%- for _, ingress := range resources.ingresses.List() -%}
          {%- if ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" -%}
            {%- var ns = ingress.Metadata.Namespace -%}
            {%- var name = ingress.Metadata.Name -%}
            {%- var key = ns + "/" + name -%}
            {%- var rps = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rps"] -%}
            {%- var rpm = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-rpm"] -%}
            {%- var conns = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-connections"] -%}
            {%- var threshold = "" -%}
            {%- var store = "" -%}
            {%- var checkFetch = "" -%}
            {%- var defaultWindow = "" -%}
            {%- if rps != "" -%}
              {%- threshold = rps -%}
              {%- store = "http_req_rate" -%}
              {%- checkFetch = "sc_http_req_rate" -%}
              {%- defaultWindow = "1s" -%}
            {%- else if rpm != "" -%}
              {%- threshold = rpm -%}
              {%- store = "http_req_rate" -%}
              {%- checkFetch = "sc_http_req_rate" -%}
              {%- defaultWindow = "60s" -%}
            {%- else if conns != "" -%}
              {%- threshold = conns -%}
              {%- store = "conn_cur" -%}
              {%- checkFetch = "sc_conn_cur" -%}
              {%- defaultWindow = "30s" -%}
            {%- end -%}
            {%- if threshold != "" -%}
              {%- var n = toint(threshold) -%}
              {%- if n <= 0 -%}
                {{- fail("Invalid rate-limit threshold '" + threshold + "' on Ingress '" + key + "'. Must be a positive integer.") -}}
              {%- end -%}
              {%- var window = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-period"] -%}
              {%- if window == "" -%}
                {%- window = defaultWindow -%}
              {%- else if !regex_search(window, "^[0-9]+(us|ms|s|m|h|d)?$") -%}
                {{- fail("Invalid value '" + window + "' for annotation 'haproxy-haptic.org/rate-limit-period' on Ingress '" + key + "'. Expected a HAProxy time value like '1s', '60s', '10m'.") -}}
              {%- end -%}
              {%- var size = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-size"] -%}
              {%- if size == "" -%}
                {%- size = "100k" -%}
              {%- else if !regex_search(size, "^[0-9]+[kKmMgG]?$") -%}
                {{- fail("Invalid value '" + size + "' for annotation 'haproxy-haptic.org/rate-limit-size' on Ingress '" + key + "'. Expected a size like '100k', '1m'.") -}}
              {%- end -%}
              {%- var status = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-status-code"] -%}
              {%- if status == "" -%}
                {%- status = "429" -%}
              {%- else if !regex_search(status, "^[1-5][0-9][0-9]$") -%}
                {{- fail("Invalid value '" + status + "' for annotation 'haproxy-haptic.org/rate-limit-status-code' on Ingress '" + key + "'. Expected a 3-digit HTTP status code.") -}}
              {%- end -%}
              {%- var whitelist = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-allowlist"] -%}
              {%- var guard = "" -%}
              {%- if whitelist != "" -%}
                {%- var validated = ValidateCidrList(whitelist, "haproxy-haptic.org/rate-limit-allowlist", key) -%}
                {%- if validated != "" -%}
                  {%- guard = " !{ src " + validated + " }" -%}
                {%- end -%}
              {%- end -%}
              {%- var ignored = []string{} -%}
              {%- if rps != "" && rpm != "" -%}{%- ignored = append(ignored, "rate-limit-rpm") -%}{%- end -%}
              {%- if (rps != "" || rpm != "") && conns != "" -%}{%- ignored = append(ignored, "rate-limit-connections") -%}{%- end -%}
              {%- rlCfgs[key] = map[string]any{"table": "haptic_rl_tbl_" + ns + "_" + name, "store": store, "checkFetch": checkFetch, "threshold": tostring(n), "window": window, "size": size, "status": status, "guard": guard, "ignored": join(ignored, ", ")} -%}
            {%- end -%}
            {%- var down = ingress.Metadata.Annotations["haproxy-haptic.org/download-bandwidth-limit"] -%}
            {%- var up = ingress.Metadata.Annotations["haproxy-haptic.org/upload-bandwidth-limit"] -%}
            {%- if down != "" || up != "" -%}
              {%- var scope = ingress.Metadata.Annotations["haproxy-haptic.org/bandwidth-limit-scope"] -%}
              {%- var tableKey = "" -%}
              {%- var tableType = "" -%}
              {%- if scope == "client" -%}
                {%- tableKey = "src" -%}
                {%- tableType = "ip" -%}
              {%- else if scope == "service" -%}
                {%- tableKey = "be_id" -%}
                {%- tableType = "integer" -%}
              {%- else if scope != "" && scope != "stream" -%}
                {{- fail("Invalid value '" + scope + "' for annotation 'haproxy-haptic.org/bandwidth-limit-scope' on Ingress '" + key + "'. Valid: stream, client, service.") -}}
              {%- end -%}
              {%- if down != "" && !regex_search(down, "^[0-9]+[kKmMgG]?$") -%}
                {{- fail("Invalid value '" + down + "' for annotation 'haproxy-haptic.org/download-bandwidth-limit' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
              {%- end -%}
              {%- if up != "" && !regex_search(up, "^[0-9]+[kKmMgG]?$") -%}
                {{- fail("Invalid value '" + up + "' for annotation 'haproxy-haptic.org/upload-bandwidth-limit' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
              {%- end -%}
              {%- bwCfgs[key] = map[string]any{"ns": ns, "name": name, "down": down, "up": up, "tableKey": tableKey, "tableType": tableType} -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- var _, _ = shared.ComputeIfAbsent("hapticCacheLocalLimits", func() any { return map[string]any{"rl": rlCfgs, "bw": bwCfgs} }) -%}

  frontend-filters-863-haptic-rate-limit-cache-routes:
    template: |
      {#- Client-leg twin of backend-directives-810 for cache-enabled routes:
          tracks into the route's table proxy (backends-810) because a frontend
          holds at most one stick-table of its own. Emitted before the cache
          switch at 865, so hits and misses consume the same budget. -#}
      {{- render "util-haptic-cache-local-limits" -}}
      {%- var limits = shared.Get("hapticCacheLocalLimits").(map[string]any) %}
      {%- var rl = limits["rl"].(map[string]any) %}
      {%- for _, key := range keys(rl) %}
        {%- var cfg = rl[key].(map[string]any) %}
      {{ "\n" }}# haptic/rate-limiting on the client leg — cache-enabled route ({{ key }}){% if tostring(cfg["ignored"]) != "" %} - {{ cfg["ignored"] }} ignored (HAProxy stores one counter per stick-table per data type){% end %}
      http-request track-sc0 src table {{ cfg["table"] }} if { var(txn.resource_id) -m str {{ key }} }
      http-request set-var(txn.denied_by) str(rate_limit_local) if { var(txn.resource_id) -m str {{ key }} } { {{ cfg["checkFetch"] }}(0) gt {{ cfg["threshold"] }} }{{ cfg["guard"] }}
      http-request deny deny_status {{ cfg["status"] }} if { var(txn.resource_id) -m str {{ key }} } { {{ cfg["checkFetch"] }}(0) gt {{ cfg["threshold"] }} }{{ cfg["guard"] }}
      {%- end %}

  frontend-filters-864-haptic-bandwidth-limit-cache-routes:
    template: |
      {#- Client-leg twin of backend-directives-815 for cache-enabled routes.
          Declared on the client frontend so responses served straight from
          varnish_cache are throttled too; shared scopes reference the route's
          table proxy (backends-815). Operand order `limit … key … table …`
          matches client-native's BandwidthLimit.Result(). -#}
      {{- render "util-haptic-cache-local-limits" -}}
      {%- var limits = shared.Get("hapticCacheLocalLimits").(map[string]any) %}
      {%- var bw = limits["bw"].(map[string]any) %}
      {%- for _, key := range keys(bw) %}
        {%- var cfg = bw[key].(map[string]any) %}
        {%- var fnameBase = tostring(cfg["ns"]) + "_" + tostring(cfg["name"]) %}
      {{ "\n" }}# haptic/bandwidth-limit on the client leg — cache-enabled route ({{ key }})
        {%- for _, direction := range []string{"download", "upload"} %}
          {%- var rate = tostring(cfg["down"]) %}
          {%- var suffix = "out" %}
          {%- if direction == "upload" %}
            {%- rate = tostring(cfg["up"]) %}
            {%- suffix = "in" %}
          {%- end %}
          {%- if rate != "" %}
            {%- var fname = "haptic_bwlim_" + suffix + "_" + fnameBase %}
            {%- var spec = "default-limit " + rate + " default-period 1s" %}
            {%- if tostring(cfg["tableKey"]) != "" %}
              {%- spec = "limit " + rate + " key " + tostring(cfg["tableKey"]) + " table haptic_bwlim_tbl_" + fnameBase %}
            {%- end %}
      filter bwlim-{{ suffix }} {{ fname }} {{ spec }}
      http-request set-bandwidth-limit {{ fname }} if { var(txn.resource_id) -m str {{ key }} }
          {%- end %}
        {%- end %}
      {%- end %}

  backends-810-haptic-cache-rate-limit-tables:
    template: |
      {#- Table proxies for the client-leg per-pod limiter
          (frontend-filters-863). Same table shape as backend-directives-810,
          including `peers localinstance` reload survival. -#}
      {{- render "util-haptic-cache-local-limits" -}}
      {%- var limits = shared.Get("hapticCacheLocalLimits").(map[string]any) %}
      {%- var rl = limits["rl"].(map[string]any) %}
      {%- for _, key := range keys(rl) %}
        {%- var cfg = rl[key].(map[string]any) %}
      {{ "\n" }}# haptic/rate-limiting client-leg table ({{ key }})
      backend {{ cfg["table"] }}
          stick-table type ip size {{ cfg["size"] }} expire {{ cfg["window"] }} store {{ cfg["store"] }}{% if tostring(cfg["store"]) == "http_req_rate" %}({{ cfg["window"] }}){% end %} peers localinstance
      {%- end %}

  backends-815-haptic-cache-bandwidth-tables:
    template: |
      {#- Table proxies for the client-leg shared-scope bandwidth limits
          (frontend-filters-864). No peers: see backend-directives-815. -#}
      {{- render "util-haptic-cache-local-limits" -}}
      {%- var limits = shared.Get("hapticCacheLocalLimits").(map[string]any) %}
      {%- var bw = limits["bw"].(map[string]any) %}
      {%- for _, key := range keys(bw) %}
        {%- var cfg = bw[key].(map[string]any) %}
        {%- if tostring(cfg["tableKey"]) != "" %}
      {{ "\n" }}# haptic/bandwidth-limit client-leg table ({{ key }})
      backend haptic_bwlim_tbl_{{ cfg["ns"] }}_{{ cfg["name"] }}
          stick-table type {{ cfg["tableType"] }} size 100k expire 60s store bytes_in_rate(1s),bytes_out_rate(1s)
        {%- end %}
      {%- end %}
