# HAPTIC-native annotation library — JWT bearer-token authentication.
#
# Verifies a JWT presented in the Authorization: Bearer header against an
# asymmetric public key (RS*/ES*/PS*) held in a Secret, with a hardened
# alg-confusion guard, standard claim checks (exp/nbf/iss/aud/required),
# optional claim forwarding, and the shared consumer identity
# (txn.haptic_consumer, from the `sub` claim). Runs on every HTTP frontend at
# frontend-filters-858 — before API-key auth (860) — so a JWT `sub` wins the
# set-once consumer identity, and before the cache switch (865), so a cached
# route is verified on the client leg too.
#
# Everything per route lives in haptic-jwt-routes.map, read by one uniform rule
# block, so a route is added, changed or removed with map operations only and
# its backend stays dynamic. HAProxy loads a `jwt_verify` public key at parse
# time from a literal path, so the one per-value text is a verify rule per
# distinct (algorithm, key file) pair in use: a new key Secret still reloads,
# a new route using a known key does not.
#
# Security model:
#   - ASYMMETRIC ONLY. HS* (symmetric) JWT is rejected: the shared HMAC secret
#     would have to be inlined into the rendered config (visible in the
#     HAProxyCfg CR and on disk). Only the public key ever appears in config.
#   - Alg-confusion hardened: the token's header `alg` must equal the configured
#     algorithm AND jwt_verify is called with the CONSTANT configured algorithm
#     (never the token's), so an attacker can't downgrade RS256→HS256 and sign
#     with the public key.
#   - Fail-CLOSED per route: if the key Secret is absent at render time the route
#     returns 503 (not open, not a whole-render failure); a present-but-malformed
#     Secret fails the render loudly.
#   - Forwarded claim headers are del-header'd off the client request first
#     (a client must not be able to spoof an identity claim).
templateSnippets:

  # ==========================================================================
  # util — resolve the JWT public key per Secret; register the PEM file.
  # ==========================================================================
  util-haptic-jwt-key:
    template: |
      {%- macro ResolveHapticJWTKey(secretNs string, secretName string, ingressKey string, result map[string]any) %}
        {%%
          var secret = resources.secrets.GetSingle(secretNs, secretName)
          result["found"] = secret != nil
          // "_" cannot occur in a namespace or Secret name, so two Secrets never share a file.
          result["filename"] = "haptic-jwt-" + secretNs + "_" + secretName + ".pem"
          if secret != nil {
            var pubkey = secret.Data["pubkey.pem"] | b64decode() | tostring()
            if strip(pubkey) == "" {
              fail("Secret '" + secretNs + "/" + secretName + "' referenced by 'haproxy-haptic.org/jwt-secret' on Ingress '" + ingressKey + "' has an empty or missing 'pubkey.pem' data key.")
            }
            result["pubkey"] = pubkey
          }
        %%}
      {%- end macro -%}

  # ==========================================================================
  # Register the public-key PEM file once per Secret (global side-effect).
  # ==========================================================================
  features-860-haptic-jwt:
    requires: [ingresses]
    template: |-
      {%- for _, file := range incremental_values("haptic-jwt-files", "files") -%}
        {%- var record = file.(map[string]any) -%}
        {%- var filename = tostring(record["filename"]) -%}
        {%- var _, regErr = fileRegistry.Register("file", filename, tostring(record["content"])) -%}
        {%- if regErr != nil -%}{{ fail("failed to register JWT public key " + filename + ": " + tostring(regErr)) }}{%- end -%}
      {%- end -%}
      {{- render "haptic-jwt-file-publications" -}}

  haptic-jwt-file-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/jwt-secret']"]
      group: haptic-jwt-files
      effects: [publishValue]
    template: |-
      {%- import "util-haptic-jwt-key" for ResolveHapticJWTKey -%}
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
      {%- var key = ns + "/" + dig_string(item, "", "metadata", "name") -%}
      {%- var jwtSecret = dig_string(item, "", "metadata", "annotations", "haproxy-haptic.org/jwt-secret") -%}
      {%- if jwtSecret != "" -%}
        {%- var refParts = split(HapticSecretRef(ns, jwtSecret, "haproxy-haptic.org/jwt-secret", key), "/") -%}
        {%- var info = map[string]any{} -%}
        {{- ResolveHapticJWTKey(refParts[0], refParts[1], key, info) -}}
        {%- if info["found"] == true -%}
          {%- var filename = tostring(info["filename"]) -%}
          {{- shared.Publish("files", filename, map[string]any{"filename": filename, "content": tostring(info["pubkey"])}) -}}
        {%- end -%}
      {%- end -%}

  # Resolves one Ingress's JWT settings into result: enabled, alg, keyFile,
  # state (ok|missing|nosecret), iss, aud, req ([]string), fwd ([]string "claim:Header"),
  # intent (the jwt-* annotation set without jwt-secret, "" otherwise). "_" marks
  # an unset scalar in the map. Shared by the map producer and the publisher.
  util-haptic-jwt-route:
    template: |-
      {%- import "util-haptic-jwt-key" for ResolveHapticJWTKey -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- macro HapticJWTRoute(ingress any, result map[string]any) -%}
        {%- var ns = dig_string(ingress, "", "metadata", "namespace") -%}
        {%- var key = ns + "/" + dig_string(ingress, "", "metadata", "name") -%}
        {%- var jwtSecret = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-secret") -%}
        {%- result["enabled"] = false -%}
        {%- result["intent"] = "" -%}
        {%- result["req"] = []string{} -%}
        {%- result["fwd"] = []string{} -%}
        {%- if jwtSecret == "" -%}
          {#- Without the key every other jwt-* annotation is inert, so the route
              would be served with no token verification at all. -#}
          {%- for _, a := range []string{"jwt-issuer", "jwt-audience", "jwt-required-claims", "jwt-forward-claims", "jwt-algorithm"} -%}
            {%- if tostring(result["intent"]) == "" && dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/" + a) != "" -%}
              {%- result["intent"] = a -%}
              {%- result["enabled"] = true -%}
              {%- result["state"] = "nosecret" -%}
              {%- result["alg"] = "_" -%}
              {%- result["keyFile"] = "_" -%}
              {%- result["iss"] = "_" -%}
              {%- result["aud"] = "_" -%}
            {%- end -%}
          {%- end -%}
        {%- else -%}
          {%- result["enabled"] = true -%}
          {%- var alg = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-algorithm") -%}
          {%- if alg == "" -%}{%- alg = "RS256" -%}{%- end -%}
          {%- if !regex_search(alg, "^(RS|ES|PS)(256|384|512)$") -%}
            {{- fail("Invalid value '" + alg + "' for annotation 'haproxy-haptic.org/jwt-algorithm' on Ingress '" + key + "'. Only asymmetric algorithms are supported (RS256/384/512, ES256/384/512, PS256/384/512); symmetric HS* JWT would require inlining the shared secret.") -}}
          {%- end -%}
          {%- result["alg"] = alg -%}
          {%- var secretRef = HapticSecretRef(ns, jwtSecret, "haproxy-haptic.org/jwt-secret", key) -%}
          {%- var refParts = split(secretRef, "/") -%}
          {%- result["secretRef"] = secretRef -%}
          {%- var info = map[string]any{} -%}
          {{- ResolveHapticJWTKey(refParts[0], refParts[1], key, info) -}}
          {%- result["state"] = "ok" -%}
          {%- result["keyFile"] = "_" -%}
          {%- if info["found"] == true -%}
            {%- result["keyFile"] = tostring(info["filename"]) -%}
          {%- else -%}
            {%- result["state"] = "missing" -%}
          {%- end -%}
          {%- result["iss"] = "_" -%}
          {%- var issRaw = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-issuer") -%}
          {%- if issRaw != "" -%}
            {%- var issV = ValidateConfigValue(issRaw, "haproxy-haptic.org/jwt-issuer", key, false) -%}
            {%- if regex_search(issV, "[\"{}\\\\]") -%}{{ fail("Invalid value for annotation 'haproxy-haptic.org/jwt-issuer' on Ingress '" + key + "': must not contain '\"', '{', '}' or '\\'.") }}{%- end -%}
            {%- result["iss"] = issV -%}
          {%- end -%}
          {%- result["aud"] = "_" -%}
          {%- var audRaw = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-audience") -%}
          {%- if audRaw != "" -%}
            {%- var audV = ValidateConfigValue(audRaw, "haproxy-haptic.org/jwt-audience", key, false) -%}
            {%- if regex_search(audV, "[\"{}\\\\]") -%}{{ fail("Invalid value for annotation 'haproxy-haptic.org/jwt-audience' on Ingress '" + key + "': must not contain '\"', '{', '}' or '\\'.") }}{%- end -%}
            {%- result["aud"] = audV -%}
          {%- end -%}
          {%- var claims = []string{} -%}
          {%- for _, claim := range split(dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-required-claims"), ",") -%}
            {%- var cl = strip(claim) -%}
            {%- if cl != "" -%}
              {%- if !regex_search(cl, "^[A-Za-z0-9_-]+$") -%}
                {{- fail("Invalid claim name '" + cl + "' in annotation 'haproxy-haptic.org/jwt-required-claims' on Ingress '" + key + "'. Allowed characters: letters, digits, '_', '-'.") -}}
              {%- end -%}
              {%- claims = append(claims, cl) -%}
            {%- end -%}
          {%- end -%}
          {%- result["req"] = claims -%}
          {%- var pairs = []string{} -%}
          {%- for _, pair := range split(dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/jwt-forward-claims"), ",") -%}
            {%- var p = strip(pair) -%}
            {%- if p != "" && strings_contains(p, ":") -%}
              {%- var kv = strings_splitn(p, ":", 2) -%}
              {%- var claim = strip(kv[0]) -%}
              {%- if !regex_search(claim, "^[A-Za-z0-9_-]+$") -%}
                {{- fail("Invalid claim name '" + claim + "' in annotation 'haproxy-haptic.org/jwt-forward-claims' on Ingress '" + key + "'. Allowed characters: letters, digits, '_', '-'.") -}}
              {%- end -%}
              {%- pairs = append(pairs, claim + ":" + ValidateConfigValue(strip(kv[1]), "haproxy-haptic.org/jwt-forward-claims", key, false)) -%}
            {%- end -%}
          {%- end -%}
          {%- result["fwd"] = pairs -%}
        {%- end -%}
      {%- end macro -%}

  # ==========================================================================
  # Per-route settings → haptic-jwt-routes.map.
  # ==========================================================================
  map-haptic-jwt-routes-858-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/jwt-secret']"
        - "metadata.annotations['haproxy-haptic.org/jwt-algorithm']"
        - "metadata.annotations['haproxy-haptic.org/jwt-issuer']"
        - "metadata.annotations['haproxy-haptic.org/jwt-audience']"
        - "metadata.annotations['haproxy-haptic.org/jwt-required-claims']"
        - "metadata.annotations['haproxy-haptic.org/jwt-forward-claims']"
    template: |-
      {%- import "util-haptic-jwt-route" for HapticJWTRoute -%}
      {%- var route = map[string]any{} -%}
      {{- HapticJWTRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {%- var req = "_" -%}
        {%- if len(route["req"].([]string)) > 0 -%}{%- req = "," + join(route["req"].([]string), ",") + "," -%}{%- end -%}
        {%- var fwd = "_" -%}
        {%- if len(route["fwd"].([]string)) > 0 -%}{%- fwd = "," + join(route["fwd"].([]string), ",") + "," -%}{%- end -%}
      {{ "\n" }}{{ dig_string(item, "", "metadata", "namespace") }}/{{ dig_string(item, "", "metadata", "name") }} {{ route["alg"] }} {{ route["keyFile"] }} {{ route["state"] }} {{ route["iss"] }} {{ route["aud"] }} {{ req }} {{ fwd }}
      {%- end -%}

  # Distinct (algorithm, key file) pairs, required claims and forwarded claims
  # in use — the literals the frontend block has to spell out — plus the
  # fail-closed events. A component cannot both publish and emit text.
  features-858-haptic-jwt-names:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/jwt-secret']"
        - "metadata.annotations['haproxy-haptic.org/jwt-algorithm']"
        - "metadata.annotations['haproxy-haptic.org/jwt-issuer']"
        - "metadata.annotations['haproxy-haptic.org/jwt-audience']"
        - "metadata.annotations['haproxy-haptic.org/jwt-required-claims']"
        - "metadata.annotations['haproxy-haptic.org/jwt-forward-claims']"
      group: haptic-jwt-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-jwt-route" for HapticJWTRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var route = map[string]any{} -%}
      {{- HapticJWTRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
        {%- var name = dig_string(item, "", "metadata", "name") -%}
        {%- var key = ns + "/" + name -%}
        {%- if tostring(route["intent"]) != "" -%}
          {{- WebhookRejectOrWarn(resources.ingresses.GetSingle(ns, name), "JWTSecretMissing", "Ingress " + key + " sets 'haproxy-haptic.org/" + tostring(route["intent"]) + "' but no 'haproxy-haptic.org/jwt-secret'. Tokens cannot be verified without the key, so this route fails closed with 503. Set jwt-secret, or remove the other jwt-* annotations.") -}}
        {%- else if tostring(route["state"]) == "missing" -%}
          {{- recordEvent(resources.ingresses.GetSingle(ns, name), "JWTSecretMissing", "Ingress " + key + " references Secret '" + tostring(route["secretRef"]) + "' in 'haproxy-haptic.org/jwt-secret', but it could not be resolved. Requests are denied with 503 until the key is present.") -}}
        {%- else -%}
          {%- var pair = tostring(route["alg"]) + "|" + tostring(route["keyFile"]) -%}
          {{- shared.Publish("keys", pair, pair) -}}
        {%- end -%}
        {%- for _, cl := range route["req"].([]string) -%}{{- shared.Publish("req", cl, cl) -}}{%- end -%}
        {%- for _, f := range route["fwd"].([]string) -%}
          {{- shared.Publish("fwd", f, f) -}}
          {{- shared.Publish("fwdhdr", strings_splitn(f, ":", 2)[1], strings_splitn(f, ":", 2)[1]) -}}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # JWT verification chain: one block per HTTP frontend.
  # ==========================================================================
  frontend-filters-858-haptic-jwt:
    requires: [ingresses]
    template: |
      {#
        Annotations:
          - haproxy-haptic.org/jwt-secret: "<ns/name>" | "<name>" (required; Secret
            with a `pubkey.pem` data key holding the PEM public key)
          - haproxy-haptic.org/jwt-algorithm: RS256 (default) | RS384/512, ES256/384/512,
            PS256/384/512 — asymmetric only
          - haproxy-haptic.org/jwt-issuer: required `iss` claim value (optional)
          - haproxy-haptic.org/jwt-audience: required `aud` claim value (optional)
          - haproxy-haptic.org/jwt-required-claims: comma-separated claim names that
            must be present (optional)
          - haproxy-haptic.org/jwt-forward-claims: comma-separated `<claim>:<header>`
            pairs forwarded upstream after successful verification (optional)

        Every rule is gated on the route's map entry (txn.jwt_*), so a route
        without JWT is untouched. Denies short-circuit, so the consumer identity
        and the forwarded claims below them are reached by valid tokens only.
        exp/nbf are enforced only when the claim is present. Emitted only
        while a route carries JWT settings; the first one reloads once, as
        does removing the last.
      #}
      {%- if incremental_value_count("haptic-jwt-routes", "any") > 0 -%}
      {%- var routes, e1 = pathResolver.GetPath("haptic-jwt-routes.map", "map") -%}
      {%- if e1 != nil -%}{{ fail(tostring(e1)) }}{%- end -%}
      {%- var keys = []any{} -%}
      {%- for _, v := range incremental_values("haptic-jwt-routes", "keys") -%}{%- keys = append(keys, tostring(v)) -%}{%- end -%}
      {%- var reqs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-jwt-routes", "req") -%}{%- reqs = append(reqs, tostring(v)) -%}{%- end -%}
      {%- var fwds = []any{} -%}
      {%- for _, v := range incremental_values("haptic-jwt-routes", "fwd") -%}{%- fwds = append(fwds, tostring(v)) -%}{%- end -%}
      {%- var fwdhdrs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-jwt-routes", "fwdhdr") -%}{%- fwdhdrs = append(fwdhdrs, tostring(v)) -%}{%- end -%}
      {{ "\n" }}# haptic/jwt
      http-request set-var(txn.jwt_cfg) var(txn.resource_id),map({{ routes }})
      http-request set-var(txn.jwt_alg) var(txn.jwt_cfg),field(1,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_key) var(txn.jwt_cfg),field(2,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_state) var(txn.jwt_cfg),field(3,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_iss) var(txn.jwt_cfg),field(4,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_aud) var(txn.jwt_cfg),field(5,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_req) var(txn.jwt_cfg),field(6,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.jwt_fwd) var(txn.jwt_cfg),field(7,' ') if { var(txn.jwt_cfg) -m found }
      http-request set-var(txn.denied_by) str(jwt_unavailable) if { var(txn.jwt_state) -m str nosecret }
      http-request set-var(txn.denied_by) str(jwt_key_unavailable) if { var(txn.jwt_state) -m str missing }
      http-request deny deny_status 503 if { var(txn.jwt_state) -m str missing nosecret }
      {%- for _, fh := range sort_strings(fwdhdrs) %}
      http-request del-header {{ fh }} if { var(txn.jwt_fwd) -m sub :{{ fh }}, }
      {%- end %}
      http-request set-var(txn.haptic_jwt_alg) http_auth_bearer,jwt_header_query('$.alg') if { var(txn.jwt_state) -m str ok }
      http-request set-var(txn.denied_by) str(jwt_algorithm) if { var(txn.jwt_state) -m str ok } !{ var(txn.haptic_jwt_alg),strcmp(txn.jwt_alg) -m int 0 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } !{ var(txn.haptic_jwt_alg),strcmp(txn.jwt_alg) -m int 0 }
      {%- for _, k := range sort_strings(keys) %}
        {%- var pair = split(tostring(k), "|") %}
        {%- var pemPath, pe = pathResolver.GetPath(pair[1], "file") %}
        {%- if pe != nil %}{{ fail(tostring(pe)) }}{% end %}
      http-request set-var(txn.denied_by) str(jwt_signature) if { var(txn.jwt_state) -m str ok } { var(txn.jwt_alg) -m str {{ pair[0] }} } { var(txn.jwt_key) -m str {{ pair[1] }} } !{ http_auth_bearer,jwt_verify({{ pair[0] }},"{{ pemPath }}") -m int 1 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } { var(txn.jwt_alg) -m str {{ pair[0] }} } { var(txn.jwt_key) -m str {{ pair[1] }} } !{ http_auth_bearer,jwt_verify({{ pair[0] }},"{{ pemPath }}") -m int 1 }
      {%- end %}
      http-request set-var(txn.haptic_jwt_now) date() if { var(txn.jwt_state) -m str ok }
      http-request set-var(txn.haptic_jwt_exp) http_auth_bearer,jwt_payload_query('$.exp','int') if { var(txn.jwt_state) -m str ok }
      http-request set-var(txn.denied_by) str(jwt_expired) if { var(txn.jwt_state) -m str ok } { var(txn.haptic_jwt_exp) -m found } { var(txn.haptic_jwt_exp),sub(txn.haptic_jwt_now) -m int lt 0 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } { var(txn.haptic_jwt_exp) -m found } { var(txn.haptic_jwt_exp),sub(txn.haptic_jwt_now) -m int lt 0 }
      http-request set-var(txn.haptic_jwt_nbf) http_auth_bearer,jwt_payload_query('$.nbf','int') if { var(txn.jwt_state) -m str ok }
      http-request set-var(txn.denied_by) str(jwt_not_yet_valid) if { var(txn.jwt_state) -m str ok } { var(txn.haptic_jwt_nbf) -m found } { var(txn.haptic_jwt_nbf),sub(txn.haptic_jwt_now) -m int gt 0 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } { var(txn.haptic_jwt_nbf) -m found } { var(txn.haptic_jwt_nbf),sub(txn.haptic_jwt_now) -m int gt 0 }
      http-request set-var(txn.denied_by) str(jwt_issuer) if { var(txn.jwt_state) -m str ok } !{ var(txn.jwt_iss) -m str _ } !{ http_auth_bearer,jwt_payload_query('$.iss'),strcmp(txn.jwt_iss) -m int 0 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } !{ var(txn.jwt_iss) -m str _ } !{ http_auth_bearer,jwt_payload_query('$.iss'),strcmp(txn.jwt_iss) -m int 0 }
      http-request set-var(txn.denied_by) str(jwt_audience) if { var(txn.jwt_state) -m str ok } !{ var(txn.jwt_aud) -m str _ } !{ http_auth_bearer,jwt_payload_query('$.aud'),strcmp(txn.jwt_aud) -m int 0 }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } !{ var(txn.jwt_aud) -m str _ } !{ http_auth_bearer,jwt_payload_query('$.aud'),strcmp(txn.jwt_aud) -m int 0 }
      {%- for _, cl := range sort_strings(reqs) %}
      http-request set-var(txn.denied_by) str(jwt_required_claim) if { var(txn.jwt_state) -m str ok } { var(txn.jwt_req) -m sub ,{{ cl }}, } !{ http_auth_bearer,jwt_payload_query('$.{{ cl }}') -m found }
      http-request deny deny_status 401 if { var(txn.jwt_state) -m str ok } { var(txn.jwt_req) -m sub ,{{ cl }}, } !{ http_auth_bearer,jwt_payload_query('$.{{ cl }}') -m found }
      {%- end %}
      http-request set-var(txn.haptic_consumer) http_auth_bearer,jwt_payload_query('$.sub') if { var(txn.jwt_state) -m str ok } !{ var(txn.haptic_consumer) -m found }
      {%- for _, f := range sort_strings(fwds) %}
        {%- var pair = strings_splitn(tostring(f), ":", 2) %}
      http-request set-header {{ pair[1] }} %[http_auth_bearer,jwt_payload_query('$.{{ pair[0] }}')] if { var(txn.jwt_state) -m str ok } { var(txn.jwt_fwd) -m sub ,{{ pair[0] }}:{{ pair[1] }}, }
      {%- end %}
      {%- end %}
