# HAPTIC-native annotation library — API-key authentication.
#
# Validates an API key presented in a request header (default X-API-Key) or a
# query parameter against a Secret-backed map of valid keys, and establishes the
# shared consumer identity (txn.haptic_consumer) that the per-consumer quota and
# consumer-group ACL features key on.
#
# Reload-free: the key→consumer map is delivered as an HAProxyMapFile, so keys
# can be added/rotated via the runtime map API without an HAProxy reload — the
# strongest reload-free story in the API-gateway feature set.
# Missing Secrets fail closed per route with 503 until the watch cache observes
# the Secret; a propagation race must never disable authentication or make the
# rendered config reference a map that was not registered.
#
# Secret format (data key `keys`, base64-encoded): one entry per line, either a
# bare `<apikey>` (the key is its own consumer id) or `<apikey>:<consumer>`.
templateSnippets:
  # ==========================================================================
  # API-key map generation (global side-effect: build one map per Secret)
  # ==========================================================================
  features-862-haptic-api-key:
    template: |
      {# HAPTIC API-key map generation: builds a reload-free apikey to consumer map per Secret. #}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var apiKeySecret = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-secret"] %}
        {%- if apiKeySecret != "" %}
          {%- var secretNs = ns %}
          {%- var secretName = apiKeySecret %}
          {%- if strings_contains(apiKeySecret, "/") %}
            {%- var parts = split(apiKeySecret, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var mapName = "haptic-apikeys-" + secretNs + "-" + secretName + ".map" %}
          {%- if first_seen("haptic_apikey_map", mapName) %}
            {%- var secretAny, _ = shared.ComputeIfAbsent("haptic_apikey_secret:" + secretNs + "/" + secretName, func() any { return resources.secrets.GetSingle(secretNs, secretName) }) %}
            {%- var secret, _ = secretAny.(*resources.secrets.T) %}
            {%- if secret == nil %}
      # WARNING haproxy-haptic.org/api-key-secret: Secret '{{ secretNs }}/{{ secretName }}' referenced on Ingress {{ key }} not found at render time; failing closed (503) for this route until it is present.
            {%- else %}
              {%- var keysData = secret.Data["keys"] | b64decode() | tostring() %}
              {%- if keysData == "" %}
                {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced by annotation 'haproxy-haptic.org/api-key-secret' on Ingress '" + key + "' has an empty or missing 'keys' data key.") -}}
              {%- end %}
              {%- var lines = []any{} %}
              {%- for _, rawLine := range split(keysData, "\n") %}
                {%- var l = strip(rawLine) %}
                {%- if l == "" %}{%- continue %}{%- end %}
                {%- var apikey = l %}
                {%- var consumer = l %}
                {%- if strings_contains(l, ":") %}
                  {%- var kp = strings_splitn(l, ":", 2) %}
                  {%- apikey = kp[0] %}
                  {%- consumer = kp[1] %}
                {%- end %}
                {#- Config-injection guard: the key is a map key and the consumer a
                    map value — both must be printable, whitespace-free tokens. -#}
                {%- if !regex_search(apikey, "^[!-~]+$") || !regex_search(consumer, "^[!-~]+$") %}
                  {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced on Ingress '" + key + "' has an invalid API key or consumer id (whitespace / control characters are not permitted).") -}}
                {%- end %}
                {%- lines = append(lines, apikey + " " + consumer) %}
              {%- end %}
              {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" %}
              {%- var _, regErr = fileRegistry.Register("map", mapName, mapContent) %}
              {%- if regErr != nil %}{{ fail("failed to register API-key map " + mapName + ": " + tostring(regErr)) }}{%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # ==========================================================================
  # API-key check + consumer identity (backend-directives; inherit_context)
  # ==========================================================================
  # ==========================================================================
  # Client-leg API-key enforcement for CACHE-ENABLED routes.
  #
  # backend-directives-806 puts the identity and the 401 in the application
  # backend. A cache-enabled route never enters that backend on the client leg —
  # frontend-filters-865 switches it to `backend varnish_cache` — so without this
  # the deny never runs for a cached request, and an uncredentialed caller is
  # served the authenticated response straight from cache. Varnish's builtin does
  # not save us: it only refuses to serve cached responses to requests carrying
  # Authorization or Cookie, and an API key is neither.
  #
  # Emitted at band 860, before the cache switch. Every rule is scoped to its own
  # route by resource_id. The backend copy stays: it is what enforces on the
  # cache-miss origin leg, and its `unless { var(txn.haptic_consumer) -m found }`
  # guard makes the second execution idempotent.
  # ==========================================================================
  frontend-filters-860-haptic-api-key-cache-routes:
    template: |
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- var apiKeySecret = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-secret"] %}
          {%- if apiKeySecret != "" %}
            {%- var secretNs = ns %}
            {%- var secretName = apiKeySecret %}
            {%- if strings_contains(apiKeySecret, "/") %}
              {%- var sparts = split(apiKeySecret, "/") %}
              {%- secretNs = sparts[0] %}
              {%- secretName = sparts[1] %}
            {%- end %}
            {%- var hdr = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-header"] %}
            {%- var qparam = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-query"] %}
            {%- var fetch = "" %}
            {%- if qparam != "" %}
              {%- fetch = "url_param(" + ValidateConfigValue(qparam, "haproxy-haptic.org/api-key-query", key, false) + ")" %}
            {%- else %}
              {%- var h = hdr %}
              {%- if h == "" %}{%- h = "X-API-Key" %}{%- end %}
              {%- fetch = "req.hdr(" + ValidateConfigValue(h, "haproxy-haptic.org/api-key-header", key, false) + ")" %}
            {%- end %}
            {%- var mapName = "haptic-apikeys-" + secretNs + "-" + secretName + ".map" %}
            {%- var secretAny, _ = shared.ComputeIfAbsent("haptic_apikey_secret:" + secretNs + "/" + secretName, func() any { return resources.secrets.GetSingle(secretNs, secretName) }) %}
            {%- var secret, _ = secretAny.(*resources.secrets.T) %}
      {{ "\n" }}# haptic/api-key on the client leg — cache-enabled route ({{ key }})
            {%- if secret == nil %}
      http-request set-var(txn.denied_by) str(api_key_unavailable) if { var(txn.resource_id) -m str {{ key }} }
      http-request deny deny_status 503 if { var(txn.resource_id) -m str {{ key }} }
            {%- else %}
              {%- var mapPath, _ = pathResolver.GetPath(mapName, "map") %}
      http-request set-var(txn.haptic_apikey) {{ fetch }} if { var(txn.resource_id) -m str {{ key }} }
      http-request set-var(txn.denied_by) str(api_key) if { var(txn.resource_id) -m str {{ key }} } !{ var(txn.haptic_apikey),map({{ mapPath }}) -m found }
      http-request deny deny_status 401 if { var(txn.resource_id) -m str {{ key }} } !{ var(txn.haptic_apikey),map({{ mapPath }}) -m found }
      http-request set-var(txn.haptic_consumer) var(txn.haptic_apikey),map({{ mapPath }}) if { var(txn.resource_id) -m str {{ key }} } !{ var(txn.haptic_consumer) -m found }
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  backend-directives-806-haptic-api-key:
    template: |
      {#
        HAPTIC API-key check

        Annotations:
          - haproxy-haptic.org/api-key-secret: "<ns/name>" | "<name>" (required)
          - haproxy-haptic.org/api-key-header: "<header>" (default X-API-Key)
          - haproxy-haptic.org/api-key-query: "<param>" (mutually exclusive with -header)
          - haproxy-haptic.org/api-key-consumer-header: "<header>" (forward the consumer id upstream)

        Generated HAProxy Config:
          http-request set-var(txn.haptic_apikey) req.hdr(<header>)
          http-request deny deny_status 401 unless { var(txn.haptic_apikey),map(<map>) -m found }
          http-request set-var(txn.haptic_consumer) var(txn.haptic_apikey),map(<map>) unless { var(txn.haptic_consumer) -m found }
          http-request set-header <consumer-header> %[var(txn.haptic_consumer)] if { var(txn.haptic_consumer) -m found }

        The consumer var is set-once (`unless -m found`) so JWT and API-key auth
        compose — the first producer (JWT at 805) wins. This is the shared
        identity the per-consumer quota / consumer-group features read.
      #}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var apiKeySecret = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-secret"] %}
        {%- if apiKeySecret != "" %}
          {%- var secretNs = ns %}
          {%- var secretName = apiKeySecret %}
          {%- if strings_contains(apiKeySecret, "/") %}
            {%- var parts = split(apiKeySecret, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var hdr = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-header"] %}
          {%- var qparam = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-query"] %}
          {%- if hdr != "" && qparam != "" %}
            {{- fail("Ingress '" + key + "' sets both haproxy-haptic.org/api-key-header and haproxy-haptic.org/api-key-query; they are mutually exclusive.") -}}
          {%- end %}
          {%- var fetch = "" %}
          {%- if qparam != "" %}
            {%- var q = ValidateConfigValue(qparam, "haproxy-haptic.org/api-key-query", key, false) %}
            {%- fetch = "url_param(" + q + ")" %}
          {%- else %}
            {%- if hdr == "" %}{%- hdr = "X-API-Key" %}{%- end %}
            {%- var h = ValidateConfigValue(hdr, "haproxy-haptic.org/api-key-header", key, false) %}
            {%- fetch = "req.hdr(" + h + ")" %}
          {%- end %}
          {%- var mapName = "haptic-apikeys-" + secretNs + "-" + secretName + ".map" %}
          {%- var secretAny, _ = shared.ComputeIfAbsent("haptic_apikey_secret:" + secretNs + "/" + secretName, func() any { return resources.secrets.GetSingle(secretNs, secretName) }) %}
          {%- var secret, _ = secretAny.(*resources.secrets.T) %}
      # haptic/api-key ({{ key }})
          {%- if secret == nil %}
      # WARNING haproxy-haptic.org/api-key-secret: Secret '{{ secretNs }}/{{ secretName }}' not found at render time; failing closed (503) for this route until it is present.
      http-request set-var(txn.denied_by) str(api_key_unavailable)
      http-request deny deny_status 503
          {%- else %}
            {%- var mapPath, _ = pathResolver.GetPath(mapName, "map") %}
      http-request set-var(txn.haptic_apikey) {{ fetch }}
      http-request set-var(txn.denied_by) str(api_key) unless { var(txn.haptic_apikey),map({{ mapPath }}) -m found }
      http-request deny deny_status 401 unless { var(txn.haptic_apikey),map({{ mapPath }}) -m found }
      http-request set-var(txn.haptic_consumer) var(txn.haptic_apikey),map({{ mapPath }}) unless { var(txn.haptic_consumer) -m found }
          {%- var consumerHdr = ingress.Metadata.Annotations["haproxy-haptic.org/api-key-consumer-header"] %}
          {%- if consumerHdr != "" %}
            {%- var ch = ValidateConfigValue(consumerHdr, "haproxy-haptic.org/api-key-consumer-header", key, false) %}
      {# Strip first: the set-header below is conditional on an identity having
          been established, so on any path that reaches here without one — a
          `satisfy: any` route admitted by IP, for example — the caller's own
          value would otherwise be forwarded to the application as the consumer. #}
      http-request del-header {{ ch }}
      http-request set-header {{ ch }} %[var(txn.haptic_consumer)] if { var(txn.haptic_consumer) -m found }
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}
