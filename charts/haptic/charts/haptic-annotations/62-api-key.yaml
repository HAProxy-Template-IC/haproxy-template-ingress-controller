# HAPTIC-native annotation library — API-key authentication.
#
# Validates an API key presented in a request header (default X-API-Key) or a
# query parameter against a Secret-backed map of valid keys, and establishes the
# shared consumer identity (txn.haptic_consumer) that the per-consumer quota and
# consumer-group ACL features key on.
#
# Everything per route lives in two maps, so a route is added, changed or
# removed with map operations only and its backend stays dynamic:
#   haptic-api-key-routes.map  <ns>/<name> → "<source> <name> <secret> <state> <forward-header> <forward-enabled>"
#   haptic-apikeys.map         <secret ns/name>|<apikey> → <consumer>
# One uniform rule block on every HTTP frontend (frontend-filters-860) reads
# them. The only per-value text is one fetch rule per distinct header or query
# parameter name in use, because `req.hdr(<name>)` takes a literal; a new NAME
# is the one change that still reloads. The rules run on the client leg for
# every route, cache-enabled ones included, before the cache switch (865).
#
# Missing Secrets fail closed per route with 503 until the watch cache observes
# the Secret; a propagation race must never disable authentication.
#
# Secret format (data key `keys`, base64-encoded): one entry per line, either a
# bare `<apikey>` (the key is its own consumer id) or `<apikey>:<consumer>`.
templateSnippets:
  util-haptic-secret-ref:
    template: |-
      {#- "<name>" is a Secret in the Ingress namespace, "<ns>/<name>" anywhere. The
          ref lands in whitespace-delimited map lines, so only DNS-1123 characters pass. -#}
      {%- macro HapticSecretRef(ns string, ref string, annotation string, key string) -%}
        {%- if !regex_search(ref, "^[a-z0-9.-]+(/[a-z0-9.-]+)?$") -%}
          {{- fail("Invalid value for annotation '" + annotation + "' on Ingress '" + key + "'. Expected a Secret name or 'namespace/name' (lowercase letters, digits, '-' and '.').") -}}
        {%- end -%}
        {%- if strings_contains(ref, "/") -%}{{- ref -}}{%- else -%}{{- ns + "/" + ref -}}{%- end -%}
      {%- end macro -%}

  # Resolves one Ingress's API-key settings; result["enabled"] false when the
  # route has none. Shared by the map producer and the name publisher so both
  # see the same values.
  util-haptic-api-key-route:
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- macro HapticApiKeyRoute(ingress any, result map[string]any) -%}
        {%- var ns = dig_string(ingress, "", "metadata", "namespace") -%}
        {%- var key = ns + "/" + dig_string(ingress, "", "metadata", "name") -%}
        {%- var apiKeySecret = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/api-key-secret") -%}
        {%- result["enabled"] = apiKeySecret != "" -%}
        {%- result["intent"] = "" -%}
        {%- result["fwdSet"] = false -%}
        {%- if apiKeySecret == "" -%}
          {#- Without the Secret the other api-key-* annotations are inert, so the
              route would be served with no key check while reading as protected. -#}
          {%- for _, a := range []string{"api-key-header", "api-key-query", "api-key-consumer-header"} -%}
            {%- if tostring(result["intent"]) == "" && dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/" + a) != "" -%}
              {%- result["intent"] = a -%}
              {%- result["enabled"] = true -%}
              {%- result["source"] = "_" -%}
              {%- result["name"] = "_" -%}
              {%- result["secretRef"] = "_" -%}
              {%- result["state"] = "nosecret" -%}
              {%- result["fwd"] = "_" -%}
            {%- end -%}
          {%- end -%}
        {%- else -%}
          {%- var hdr = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/api-key-header") -%}
          {%- var qparam = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/api-key-query") -%}
          {%- if hdr != "" && qparam != "" -%}
            {{- fail("Ingress '" + key + "' sets both haproxy-haptic.org/api-key-header and haproxy-haptic.org/api-key-query; they are mutually exclusive.") -}}
          {%- end -%}
          {%- if qparam != "" -%}
            {%- result["source"] = "query" -%}
            {%- result["name"] = ValidateConfigValue(qparam, "haproxy-haptic.org/api-key-query", key, false) -%}
          {%- else -%}
            {%- if hdr == "" -%}{%- hdr = "X-API-Key" -%}{%- end -%}
            {%- result["source"] = "hdr" -%}
            {%- result["name"] = ValidateConfigValue(hdr, "haproxy-haptic.org/api-key-header", key, false) -%}
          {%- end -%}
          {%- result["fwd"] = "_" -%}
          {%- var consumerHdr = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/api-key-consumer-header") -%}
          {%- if consumerHdr != "" -%}
            {%- result["fwd"] = ValidateConfigValue(consumerHdr, "haproxy-haptic.org/api-key-consumer-header", key, false) -%}
            {%- result["fwdSet"] = true -%}
          {%- end -%}
          {%- var secretRef = HapticSecretRef(ns, apiKeySecret, "haproxy-haptic.org/api-key-secret", key) -%}
          {%- var refParts = split(secretRef, "/") -%}
          {%- result["secretRef"] = secretRef -%}
          {%- result["state"] = "ok" -%}
          {%- if resources.secrets.GetSingle(refParts[0], refParts[1]) == nil -%}
            {%- result["state"] = "missing" -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  map-haptic-api-key-routes-860-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/api-key-secret']"
        - "metadata.annotations['haproxy-haptic.org/api-key-header']"
        - "metadata.annotations['haproxy-haptic.org/api-key-query']"
        - "metadata.annotations['haproxy-haptic.org/api-key-consumer-header']"
    template: |-
      {%- import "util-haptic-api-key-route" for HapticApiKeyRoute -%}
      {%- var route = map[string]any{} -%}
      {{- HapticApiKeyRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
      {{ "\n" }}{{ dig_string(item, "", "metadata", "namespace") }}/{{ dig_string(item, "", "metadata", "name") }} {{ route["source"] }} {{ route["name"] }} {{ route["secretRef"] }} {{ route["state"] }} {{ route["fwd"] }} {{ route["fwdSet"] }}
      {%- end -%}

  # Distinct header, query and forward-header names in use, for the fetch rules
  # the frontend block has to spell out; also the fail-closed event. A component
  # cannot both publish and emit text, hence the split from the map producer.
  features-860-haptic-api-key-names:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/api-key-secret']"
        - "metadata.annotations['haproxy-haptic.org/api-key-header']"
        - "metadata.annotations['haproxy-haptic.org/api-key-query']"
        - "metadata.annotations['haproxy-haptic.org/api-key-consumer-header']"
      group: haptic-api-key-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-api-key-route" for HapticApiKeyRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var route = map[string]any{} -%}
      {{- HapticApiKeyRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
        {%- var name = dig_string(item, "", "metadata", "name") -%}
        {%- var key = ns + "/" + name -%}
        {%- if tostring(route["intent"]) != "" -%}
          {{- WebhookRejectOrWarn(resources.ingresses.GetSingle(ns, name), "ApiKeySecretMissing", "Ingress " + key + " sets 'haproxy-haptic.org/" + tostring(route["intent"]) + "' but no 'haproxy-haptic.org/api-key-secret'. Keys cannot be checked without it, so this route fails closed with 503. Set api-key-secret, or remove the other api-key-* annotations.") -}}
        {%- else -%}
          {%- var fetchName = tostring(route["name"]) -%}
          {{- shared.Publish(tostring(route["source"]), fetchName, fetchName) -}}
          {%- if route["fwdSet"] == true -%}{{- shared.Publish("fwd", tostring(route["fwd"]), tostring(route["fwd"])) -}}{%- end -%}
          {%- if tostring(route["state"]) == "missing" -%}
            {{- recordEvent(resources.ingresses.GetSingle(ns, name), "ApiKeySecretMissing", "Ingress " + key + " references Secret '" + tostring(route["secretRef"]) + "' in 'haproxy-haptic.org/api-key-secret', but it could not be resolved. Requests are denied with 503 until the Secret is present.") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-haptic-apikeys-860-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/api-key-secret']"]
    template: |-
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
      {%- var key = ns + "/" + dig_string(item, "", "metadata", "name") -%}
      {%- var apiKeySecret = dig_string(item, "", "metadata", "annotations", "haproxy-haptic.org/api-key-secret") -%}
      {%- if apiKeySecret != "" -%}
        {%- var secretRef = HapticSecretRef(ns, apiKeySecret, "haproxy-haptic.org/api-key-secret", key) -%}
        {%- var refParts = split(secretRef, "/") -%}
        {%- var secret = resources.secrets.GetSingle(refParts[0], refParts[1]) -%}
        {%- if secret != nil -%}
          {%- var keysData = secret.Data["keys"] | b64decode() | tostring() -%}
          {%- if strip(keysData) == "" -%}
            {{- fail("Secret '" + secretRef + "' referenced by annotation 'haproxy-haptic.org/api-key-secret' on Ingress '" + key + "' has an empty or missing 'keys' data key.") -}}
          {%- end -%}
          {%- for _, rawLine := range split(keysData, "\n") -%}
            {%- var l = strip(rawLine) -%}
            {%- if l == "" %}{%- continue %}{%- end -%}
            {%- var apikey = l -%}
            {%- var consumer = l -%}
            {%- if strings_contains(l, ":") -%}
              {%- var kp = strings_splitn(l, ":", 2) -%}
              {%- apikey = kp[0] -%}
              {%- consumer = kp[1] -%}
            {%- end -%}
            {%- if !regex_search(apikey, "^[!-~]+$") || !regex_search(consumer, "^[!-~]+$") -%}
              {{- fail("Secret '" + secretRef + "' referenced on Ingress '" + key + "' has an invalid API key or consumer id (whitespace / control characters are not permitted).") -}}
            {%- end -%}
            {{- shared.Unique("map-haptic-apikeys", secretRef + "|" + apikey, "\n" + secretRef + "|" + apikey + " " + consumer) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # API-key check + consumer identity: one block per HTTP frontend.
  # Band 860: after JWT (858), whose `sub` wins the set-once identity, and
  # before consumer groups (862), the consumer rate limit (863) and the cache
  # switch (865).
  # ==========================================================================
  frontend-filters-860-haptic-api-key:
    requires: [ingresses]
    template: |
      {#
        Annotations:
          - haproxy-haptic.org/api-key-secret: "<ns/name>" | "<name>" (required)
          - haproxy-haptic.org/api-key-header: "<header>" (default X-API-Key)
          - haproxy-haptic.org/api-key-query: "<param>" (mutually exclusive with -header)
          - haproxy-haptic.org/api-key-consumer-header: "<header>" (forward the consumer id upstream)

        The route's settings come from haptic-api-key-routes.map, the key from
        haptic-apikeys.map keyed by "<secret>|<apikey>". A route whose Secret is
        absent is denied 503; an unknown or missing key 401. The consumer var is
        set-once (`!{ -m found }`) so JWT and API-key auth compose.

        The forward header is stripped from the client request first: on any path
        that reaches here without an identity — a `satisfy: any` route admitted by
        IP, for example — the caller's own value would otherwise be forwarded to the
        application as the consumer. Emitted only while a route carries API-key
        settings; the first one reloads once, as does removing the last.
      #}
      {%- if incremental_value_count("haptic-api-key-routes", "any") > 0 -%}
      {%- var routes, e1 = pathResolver.GetPath("haptic-api-key-routes.map", "map") -%}
      {%- if e1 != nil -%}{{ fail(tostring(e1)) }}{%- end -%}
      {%- var keys, e2 = pathResolver.GetPath("haptic-apikeys.map", "map") -%}
      {%- if e2 != nil -%}{{ fail(tostring(e2)) }}{%- end -%}
      {%- var hdrs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-api-key-routes", "hdr") -%}{%- hdrs = append(hdrs, tostring(v)) -%}{%- end -%}
      {%- var queries = []any{} -%}
      {%- for _, v := range incremental_values("haptic-api-key-routes", "query") -%}{%- queries = append(queries, tostring(v)) -%}{%- end -%}
      {%- var fwds = []any{} -%}
      {%- for _, v := range incremental_values("haptic-api-key-routes", "fwd") -%}{%- fwds = append(fwds, tostring(v)) -%}{%- end -%}
      {{ "\n" }}# haptic/api-key
      http-request set-var(txn.ak_cfg) var(txn.resource_id),map({{ routes }})
      http-request set-var(txn.ak_src) var(txn.ak_cfg),field(1,' ') if { var(txn.ak_cfg) -m found }
      http-request set-var(txn.ak_name) var(txn.ak_cfg),field(2,' ') if { var(txn.ak_cfg) -m found }
      http-request set-var(txn.ak_secret) var(txn.ak_cfg),field(3,' ') if { var(txn.ak_cfg) -m found }
      http-request set-var(txn.ak_state) var(txn.ak_cfg),field(4,' ') if { var(txn.ak_cfg) -m found }
      http-request set-var(txn.ak_fwd) var(txn.ak_cfg),field(5,' ') if { var(txn.ak_cfg) -m found }
      http-request set-var(txn.denied_by) str(api_key_unavailable) if { var(txn.ak_state) -m str missing nosecret }
      http-request deny deny_status 503 if { var(txn.ak_state) -m str missing nosecret }
      {%- for _, h := range sort_strings(hdrs) %}
      http-request set-var(txn.haptic_apikey) req.hdr({{ h }}) if { var(txn.ak_src) -m str hdr } { var(txn.ak_name) -m str {{ h }} }
      {%- end %}
      {%- for _, q := range sort_strings(queries) %}
      http-request set-var(txn.haptic_apikey) url_param({{ q }}) if { var(txn.ak_src) -m str query } { var(txn.ak_name) -m str {{ q }} }
      {%- end %}
      http-request set-var(txn.ak_consumer) var(txn.ak_secret),concat(|,txn.haptic_apikey),map({{ keys }}) if { var(txn.ak_state) -m str ok } { var(txn.haptic_apikey) -m found }
      http-request set-var(txn.denied_by) str(api_key) if { var(txn.ak_state) -m str ok } !{ var(txn.ak_consumer) -m found }
      http-request deny deny_status 401 if { var(txn.ak_state) -m str ok } !{ var(txn.ak_consumer) -m found }
      http-request set-var(txn.haptic_consumer) var(txn.ak_consumer) if { var(txn.ak_consumer) -m found } !{ var(txn.haptic_consumer) -m found }
      {%- for _, f := range sort_strings(fwds) %}
      http-request del-header {{ f }} if { var(txn.ak_fwd) -m str {{ f }} } { var(txn.ak_cfg),field(6,' ') -m str true }
      http-request set-header {{ f }} %[var(txn.haptic_consumer)] if { var(txn.ak_fwd) -m str {{ f }} } { var(txn.ak_cfg),field(6,' ') -m str true } { var(txn.haptic_consumer) -m found }
      {%- end %}
      {%- end %}
