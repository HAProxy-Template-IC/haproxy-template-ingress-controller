# HAPTIC-native SHARED rate-limiting annotations (haproxy-haptic.org/*).
#
# Fleet-wide rate limiting via the haproxy-spoa-hub rate-limit plugin
# (spoaHub.plugins.rate-limit). Distinct from the per-pod stick-table limiter
# in 24-rate-limiting.yaml: that caps each haproxy pod independently; this
# enforces ONE budget across all pods through a shared store. The two are
# independent — an Ingress may set either or both (both is redundant, not an
# error).
#
#   haproxy-haptic.org/rate-limit-requests    N requests per period (activates the shared limit)
#   haproxy-haptic.org/rate-limit-period      window (HAProxy duration; default 1s) — shared with 24-rate-limiting.yaml
#   haproxy-haptic.org/rate-limit-burst       burst allowance (default = requests)
#   haproxy-haptic.org/rate-limit-key         ip (default) | consumer
#   haproxy-haptic.org/rate-limit-algorithm   token-bucket (default) | gcra (exact)
#
# The chart opt-in (`rateLimit.shared.enabled=true`) must be set or
# using rate-limit-requests fails the render. A shared store is required for
# fleet-wide enforcement; the chart can deploy HA Valkey with Sentinel via
# `rateLimit.shared.managedStore.enabled=true`, or operators can provide their own
# HA Redis/Valkey endpoint under rateLimit.shared.externalStore.urls.
#
# This fragment produces the rate-limit.map that the spoa-hub library parses at
# frontend priority 020. Source-IP rules dispatch at priority 025 before Coraza;
# consumer rules dispatch on the same frontend at band 863, after the native
# authentication rules have set txn.haptic_consumer.
# Map value is
# "<limit> <period_seconds> <burst> <mode> <keyspec>" keyed by <ns>/<name>;
# the dispatch splits it positionally with field() and ships it as the
# rate-limit SPOE args. The deny status is always 429 (the standard); the
# per-route rate-limit-status-code applies to the per-pod limiter only.
templateSnippets:
  # The rate-limit.map producer below runs only when the spoa-hub library
  # declares that map (render_glob "map-rate-limit-*" in spoa-hub/_index.yaml),
  # i.e. only when the hub is loaded. The opt-in guard must fire even when it is
  # not — otherwise rate-limit-requests on an Ingress is silently ignored on a
  # hub-less install (fail-open on a rate limit). features-* always renders, so
  # the guard lives here; the producer assumes the opt-in once it runs.
  features-806-haptic-shared-rate-limit-optin:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"enabled": extraContext | dig("rateLimit", "shared", "enabled") | fallback("false")}}) -}}'
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/rate-limit-requests']"]
    template: |-
      {%- var sharedEnabled = tostring(props["enabled"]) -%}
      {%- if sharedEnabled != "true" -%}
        {%- var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
        {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-requests"] != "" -%}
          {{- fail("Ingress " + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + " sets annotation 'haproxy-haptic.org/rate-limit-requests' but shared rate limiting is not enabled. Set rateLimit.shared.enabled=true, or remove the annotation.") -}}
        {%- end -%}
      {%- end -%}

  map-rate-limit-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/rate-limit-requests']"
        - "metadata.annotations['haproxy-haptic.org/rate-limit-period']"
        - "metadata.annotations['haproxy-haptic.org/rate-limit-burst']"
        - "metadata.annotations['haproxy-haptic.org/rate-limit-key']"
        - "metadata.annotations['haproxy-haptic.org/rate-limit-algorithm']"
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var requests = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-requests"] -%}
        {%- if requests != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var key = ns + "/" + name -%}
          {#- requests: positive integer, the limit N. -#}
          {%- var n = toint(requests) -%}
          {%- if n <= 0 -%}
            {{- fail("Invalid value '" + requests + "' for annotation 'haproxy-haptic.org/rate-limit-requests' on Ingress '" + key + "'. Must be a positive integer.") -}}
          {%- end -%}
          {#- period: HAProxy duration → seconds (default 1s). ms checked
              before s (both end in 's'). -#}
          {%- var periodStr = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-period"] -%}
          {%- if periodStr == "" -%}{%- periodStr = "1s" -%}{%- end -%}
          {%- if !regex_search(periodStr, "^[0-9]+(ms|s|m|h|d)?$") -%}
            {{- fail("Invalid value '" + periodStr + "' for annotation 'haproxy-haptic.org/rate-limit-period' on Ingress '" + key + "'. Expected a time value like '1s', '60s', '10m'.") -}}
          {%- end -%}
          {%- var mult = 1.0 -%}
          {%- var numstr = periodStr -%}
          {%- if hasSuffix(periodStr, "ms") -%}{%- mult = 0.001 -%}{%- numstr = periodStr[0:len(periodStr)-2] -%}
          {%- else if hasSuffix(periodStr, "s") -%}{%- mult = 1.0 -%}{%- numstr = periodStr[0:len(periodStr)-1] -%}
          {%- else if hasSuffix(periodStr, "m") -%}{%- mult = 60.0 -%}{%- numstr = periodStr[0:len(periodStr)-1] -%}
          {%- else if hasSuffix(periodStr, "h") -%}{%- mult = 3600.0 -%}{%- numstr = periodStr[0:len(periodStr)-1] -%}
          {%- else if hasSuffix(periodStr, "d") -%}{%- mult = 86400.0 -%}{%- numstr = periodStr[0:len(periodStr)-1] -%}
          {%- end -%}
          {%- var pf, _ = tofloat(numstr) -%}
          {%- var periodS = pf * mult -%}
          {%- if periodS <= 0.0 -%}
            {{- fail("Invalid value '" + periodStr + "' for annotation 'haproxy-haptic.org/rate-limit-period' on Ingress '" + key + "'. Must be greater than zero.") -}}
          {%- end -%}
          {#- burst: positive integer, defaults to the limit. -#}
          {%- var burstStr = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-burst"] -%}
          {%- var burst = n -%}
          {%- if burstStr != "" -%}
            {%- var b = toint(burstStr) -%}
            {%- if b <= 0 -%}
              {{- fail("Invalid value '" + burstStr + "' for annotation 'haproxy-haptic.org/rate-limit-burst' on Ingress '" + key + "'. Must be a positive integer.") -}}
            {%- end -%}
            {%- burst = b -%}
          {%- end -%}
          {%- var horizonS = (burst | float64()) * periodS / (n | float64()) -%}
          {%- if horizonS > 3600.0 -%}
            {{- fail("Ingress " + key + " has a shared rate-limit refill horizon above 3600 seconds, which the bundled plugin cannot retain safely. Reduce rate-limit-period or rate-limit-burst.") -}}
          {%- end -%}
          {#- key dimension: ip (default) or consumer (txn.haptic_consumer). -#}
          {%- var keyspec = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-key"] -%}
          {%- if keyspec == "" -%}{%- keyspec = "ip" -%}{%- end -%}
          {%- if keyspec != "ip" && keyspec != "consumer" -%}
            {{- fail("Invalid value '" + keyspec + "' for annotation 'haproxy-haptic.org/rate-limit-key' on Ingress '" + key + "'. Expected 'ip' or 'consumer'.") -}}
          {%- end -%}
          {#- algorithm → plugin mode: gcra = exact; token-bucket = lease. -#}
          {%- var algo = ingress.Metadata.Annotations["haproxy-haptic.org/rate-limit-algorithm"] -%}
          {%- if algo == "" -%}{%- algo = "token-bucket" -%}{%- end -%}
          {%- var mode = "lease" -%}
          {%- if algo == "gcra" -%}{%- mode = "exact" -%}
          {%- else if algo != "token-bucket" -%}
            {{- fail("Invalid value '" + algo + "' for annotation 'haproxy-haptic.org/rate-limit-algorithm' on Ingress '" + key + "'. Expected 'token-bucket' or 'gcra'.") -}}
          {%- end -%}
      {{ "\n" }}{{ key }} {{ n }} {{ tostring(periodS) }} {{ burst }} {{ mode }} {{ keyspec }}
        {%- end -%}
      {%- end -%}
