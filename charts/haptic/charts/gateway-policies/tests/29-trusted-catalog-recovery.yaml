validationTests:
  test-gateway-policy-waf-trusted-missing:
    _helm_skip_test: '{{ if not .Values.spoaHub.plugins.coraza.enabled }}true{{ end }}'
    requires:
    - httproutes
    - grpcroutes
    - routepolicies
    fixtures:
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          namespace: default
          name: policy-gateway
          generation: 1
        spec:
          gatewayClassName: haptic
          listeners:
          - name: http
            port: 80
            protocol: HTTP
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          namespace: default
          name: echo
        spec:
          ports:
          - port: 80
            targetPort: 8080
      secrets:
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: jwt-keys
        type: Opaque
        data:
          pubkey.pem: 
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: api-keys
        data:
          keys: a2V5LW9uZTphbGljZQprZXktdHdvOmJvYgo=
      routepolicies:
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: api
        spec:
          waf:
            policy: trusted
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: jwt
        spec:
          waf:
            policy: tenant
            catalogRef:
              name: waf-policies
      httproutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          namespace: default
          name: same-name
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - same-name.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /api
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: api
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /jwt
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: jwt
      grpcroutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: GRPCRoute
        metadata:
          namespace: default
          name: same-name
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - same-name.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: api
      configmaps:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          namespace: default
          name: waf-policies
        data:
          policies.yaml: "tenant:\n  requestBody: {mode: none}\n"
        immutable: true
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          messages:
          - check-request
        plugins:
        - name: coraza
          library: libcoraza_plugin.so
          messages:
          - check-request
          timeoutMs: 15
          params: ''
          dependsOn: []
          directives: 'Include @coraza.conf-recommended

            Include @crs-setup.conf.example

            Include @owasp_crs/*.conf

            SecRuleEngine On

            '
      waf:
        dispatch:
          mode: opt-in
          defaultEnforcement: deny
        ingressPermissions:
          allowPolicySelection: true
        policies:
          defaultPolicy: ''
          inline:
            __replace__: true
          configMapRefs:
            __replace__: true
            central:
              namespace: security
              name: catalog
          selfService:
            enabled: true
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:gw-policy-errors.map
      pattern: (?m)^gateway/h_default_same-name_0 invalid$
    - type: not_contains
      target: map:gw-policy-errors.map
      pattern: gateway/h_default_same-name_1
    - type: contains
      target: map:coraza-app.map
      pattern: (?m)^gateway/h_default_same-name_1 policy:default/waf-policies/policies\.yaml/tenant$
    - type: not_contains
      target: map:coraza-app.map
      pattern: gateway/h_default_same-name_0
