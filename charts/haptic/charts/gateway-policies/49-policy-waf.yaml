  util-map-haproxy-ingress-waf-821-gateway:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayWAFModeMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "waf") != nil -%}
            {{- "\n" + tostring(record["id"]) + " " + tostring(record["waf"].(map[string]any)["mode"]) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-map-coraza-app-821-gateway:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayWAFAppMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "waf") != nil -%}
            {{- "\n" + tostring(record["id"]) + " " + tostring(record["waf"].(map[string]any)["appName"]) -}}
