        {%- end -%}
      {%- end macro -%}

  util-map-coraza-body-821-gateway:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayWAFBodyMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "waf") != nil -%}
            {{- "\n" + tostring(record["id"]) + " " + dig_string(record, "", "waf", "bodyMode") + " " + dig_string(record, "", "waf", "contentMode") + " " + dig_string(record, "", "waf", "maxBodyBytes") -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-gateway-policy-waf-apps:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro PublishGatewayWAFApps(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "waf") != nil -%}
            {{- shared.Publish("applications", dig_string(record, "", "waf", "appName"), dig(record, "waf", "application")) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}
