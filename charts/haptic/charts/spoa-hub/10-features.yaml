# SPOA hub library — production templateSnippets, batch 10:
#
#   - util-auth-validate-header-name      (header-name token guard)
#   - util-spoa-hub-enabled                (one-line truthiness gate)
#   - features-spoa-hub                    (file-registration entry point)
#   - status-extra-050-spoa-hub-health     (loopback child-watchdog endpoint)
#   - backends-100-spoa-hub                (backend spoa-hub block)

templateSnippets:
  # RFC 7230 token guard for HTTP header field names from annotation
  # values. Ingress libraries call this before embedding a header
  # name into a HAProxy `set-header` / `set-var` directive — defence
  # in depth for operator typos and against any future code path
  # where annotation editing isn't strictly RBAC-gated. The regex
  # mirrors RFC 7230 `tchar`; values containing whitespace, `;`,
  # fetch syntax like `%[var(...)]`, etc. fail-loud at render time.
  util-auth-validate-header-name:
    template: |-
      {%- macro ValidateAuthHeaderName(name string, annotation string, ns string, ingressName string) %}
        {%- if !regex_search(name, "^[A-Za-z0-9!#$&'*+.^_`|~-]+$") -%}
          {{- fail("Invalid HTTP header name '" + name + "' in annotation '" + annotation + "' on Ingress " + ns + "/" + ingressName + ". Header names must be RFC 7230 tokens (1*tchar): no whitespace, no special characters, no fetch syntax.") -}}
        {%- end -%}
      {%- end %}

  util-spoa-hub-enabled:
    template: |-
      {{- extraContext | dig("spoaHub", "enabled") | fallback(false) | tostring() -}}

  features-spoa-hub:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" -%}
        {%- var spoeContent = render "spoe-conf-content" -%}
        {%- var _, regErr = fileRegistry.Register("file", "spoe.conf", spoeContent) -%}
        {%- if regErr != nil %}
          {%- fail("failed to register spoe.conf: " + regErr.Error()) %}
        {%- end -%}
        {#- Register the runtime hub config (TOML) at <GeneralStorageDir>/spoa-hub-config.toml.
            The agent delivers it to the haproxy pod's filesystem and the
            spoa-hub sidecar's file-watch + graceful-reload picks it up without a
            restart. ADR-0007 captures the end-to-end flow.
            reloadOnPush=false: HAProxy never opens this file, only the sidecar
            does — unlike spoe.conf above, which the filter spoe directive
            references and which therefore keeps the default. -#}
        {%- var hubConfig = render "spoa-hub-config-content" -%}
        {%- var _, regErr2 = fileRegistry.Register("file", "spoa-hub-config.toml", hubConfig, false) -%}
        {%- if regErr2 != nil %}
          {%- fail("failed to register spoa-hub-config.toml: " + regErr2.Error()) %}
        {%- end -%}
      {%- end -%}

  status-extra-050-spoa-hub-health:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" %}
      http-request return status 204 if { path /spoa-hub-child-health } { dst 127.0.0.0/8 } { srv_is_up(spoa-hub/hub) }
      http-request return status 424 if { path /spoa-hub-child-health } { dst 127.0.0.0/8 }
      {%- end %}

  backends-100-spoa-hub:
    template: |
      {%- import "util-backend" for Backend -%}
      {%- if (render "util-spoa-hub-enabled") == "true" %}
      {#- mode spop is the native SPOP backend mode introduced in HAProxy 3.1.
          On HAProxy 3.0 the proxy mode doesn't exist and the parser rejects
          it ("unknown proxy mode 'spop'"); fall back to mode tcp, which is
          the legacy SPOE transport. The filter spoe directive in the
          frontend handles the protocol either way. Operators can force tcp
          on 3.1+ by setting spoaHub.haproxy.modeSpop: false. -#}
      {%- var modeSpopRequested = "true" %}
      {%- var modeSpopRequestedAny = extraContext | dig("spoaHub", "haproxy", "modeSpop") %}
      {%- if modeSpopRequestedAny != nil %}{%- modeSpopRequested = tostring(modeSpopRequestedAny) %}{%- end %}
      {%- var hapVersion = extraContext | dig_string("", "haproxyVersion") %}
      {%- var spopSupported = semver_gte(hapVersion, "3.1") %}
      {%- var mode = "tcp" %}
      {%- if modeSpopRequested == "true" && spopSupported %}{%- mode = "spop" %}{%- end %}
      {{ Backend(map[string]any{
           "name": "spoa-hub",
           "mode": mode,
           "body": []any{
             "option spop-check",
             "timeout connect 5s",
             "timeout check 500ms",
             "timeout server  " + tostring(extraContext | dig("spoaHub", "haproxy", "timeoutIdle") | fallback("5m")),
           },
           "servers": []any{map[string]any{
             "name":    "hub",
             "address": tostring(extraContext | dig("spoaHub", "haproxy", "socketPath") | fallback("/run/spoa/hub.sock")),
             "extra": []any{
               map[string]any{"name": "check"},
               map[string]any{"name": "inter", "args": []any{"1s"}},
               map[string]any{"name": "fastinter", "args": []any{"500ms"}},
               map[string]any{"name": "downinter", "args": []any{"1s"}},
               map[string]any{"name": "fall", "args": []any{"2"}},
               map[string]any{"name": "rise", "args": []any{"2"}},
               map[string]any{"name": "pool-low-conn", "args": []any{"0"}},
               map[string]any{"name": "pool-max-conn", "args": []any{tostring(extraContext | dig("spoaHub", "haproxy", "poolMaxConn") | fallback(100))}},
               map[string]any{"name": "pool-purge-delay", "args": []any{tostring(extraContext | dig("spoaHub", "haproxy", "poolPurgeDelay") | fallback("30s"))}},
             },
           }},
         }) }}
      {%- end %}
