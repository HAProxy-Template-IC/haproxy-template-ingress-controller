# SPOA hub library — Coraza WAF validation tests
#
# Covers the per-Ingress coraza dispatch flows (modsecurity-snippet,
# enable-modsecurity, dispatch-mode opt-in vs default-on, error paths).
# The producing Ingress walks now live in nginx-ingress.yaml's
# util-nginx-ingress-coraza-scan (per !1052); these tests cover the
# spoa-hub side of the rendered TOML + map files.

_fx:
  extracontextCoraza: &extracontextCoraza
    haproxyVersion: "3.2"
    waf:
      ingressPermissions: {allowCustomRules: true}
    spoaHub:
      enabled: true
      haproxy:
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
      hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
      plugins:
        - name: coraza
          library: libcoraza_plugin.so
          messages: ["check-request"]
          timeoutMs: 15
          dependsOn: []
          directives: |
            SecRuleEngine On
          params: ""
  ingressesTriggerExampleCom: &ingressesTriggerExampleCom
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: trigger, namespace: default}
      spec:
        ingressClassName: haproxy
        rules:
          - host: example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend: {service: {name: trigger-svc, port: {number: 80}}}
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: { number: 80 }}}

validationTests:
  test-spoa-hub-config-render-modsecurity-snippet-single:
    # Skip on HAProxy <3.1 (fixture pins haproxyVersion=3.2 so the spoa-hub
    # backend renders `mode spop`, which 3.0 can't parse) OR when nginx-ingress
    # is disabled: the fixture's nginx.ingress.kubernetes.io/* annotations are
    # scanned only by nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "A single Ingress with nginx.ingress.kubernetes.io/modsecurity-snippet sees its rule appended into the rendered coraza directives, with a comment marker identifying the source Ingress. The rule sits BELOW the values-supplied base directives."
    extraContext: *extracontextCoraza
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: protected
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from default/protected'
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"'
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'SecRuleEngine On'}

  test-spoa-hub-config-render-coraza-adaptive-concurrency:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "A coraza plugin with adaptiveConcurrency=true renders `adaptive_concurrency = true` in the hub config, alongside maxConcurrency as the controller's ceiling (ADR-0002)."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            maxConcurrency: 32
            adaptiveConcurrency: true
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: adaptive, namespace: default }
          spec:
            ingressClassName: haproxy
            rules:
              - host: adaptive.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'max_concurrency = 32'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'adaptive_concurrency = true'}

  test-spoa-hub-config-render-coraza-adaptive-concurrency-off-by-default:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With adaptiveConcurrency unset (the default), the hub config emits no adaptive_concurrency line — the fixed maxConcurrency path is byte-identical to before the feature, so an older hub never sees the field."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            maxConcurrency: 2
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: nonadaptive, namespace: default }
          spec:
            ingressClassName: haproxy
            rules:
              - host: nonadaptive.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'max_concurrency = 2'}
      - {type: not_contains, target: file:spoa-hub-config.toml, pattern: 'adaptive_concurrency'}

  test-spoa-hub-config-render-modsecurity-snippet-multi-deterministic:
    # Skip on HAProxy <3.1 (fixture pins haproxyVersion=3.2 so the spoa-hub
    # backend renders `mode spop`, which 3.0 can't parse) OR when nginx-ingress
    # is disabled: the fixture's nginx.ingress.kubernetes.io/* annotations are
    # scanned only by nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "Multiple Ingresses with modsecurity-snippet annotations are inlined into the rendered coraza directives in deterministic order — sorted by `<namespace>/<name>` — so renders are reproducible and don't churn the push payload across reconciliations."
    extraContext: *extracontextCoraza
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: zeta
            namespace: zone-z
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains evil" "id:3001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: z.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: alpha
            namespace: zone-a
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains bad" "id:1001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: a.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: middle
            namespace: zone-m
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains naughty" "id:2001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: m.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from zone-a/alpha[\s\S]*# nginx-ingress modsecurity-snippet from zone-m/middle[\s\S]*# nginx-ingress modsecurity-snippet from zone-z/zeta'

  # ============================================================================
  # Multi-tenant per-app WAF tests (rules don't bleed across Ingresses)
  # ============================================================================

  test-spoa-hub-config-render-modsecurity-snippet-isolated-per-app:
    # Skip on HAProxy <3.1 (fixture pins haproxyVersion=3.2 so the spoa-hub
    # backend renders `mode spop`, which 3.0 can't parse) OR when nginx-ingress
    # is disabled: the fixture's nginx.ingress.kubernetes.io/* annotations are
    # scanned only by nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "Multi-tenant isolation: Two Ingresses with distinct modsecurity-snippet annotations each get their own [plugins.params.applications.\"<ns>/<name>\"] block in the rendered spoa-hub-config.toml."
    extraContext: *extracontextCoraza
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: alpha
            namespace: tenant-a
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_HEADERS:X-Tenant-A-Block "@streq yes" "id:5001,phase:1,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: a.example.com, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }] } }] }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: bravo
            namespace: tenant-b
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_HEADERS:X-Tenant-B-Block "@streq yes" "id:5002,phase:1,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: b.example.com, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }] } }] }
    assertions:
      - type: haproxy_valid
      # Each Ingress gets its OWN [plugins.params.applications] block
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-a/alpha"\]'
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-b/bravo"\]'
      # Within tenant-a/alpha's block: alpha's rule appears, bravo's does NOT
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-a/alpha"\][\s\S]*?5001[\s\S]*?"""[\s\S]*?\[plugins\.params\.applications\."tenant-b/bravo"\]'
      - type: not_contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-a/alpha"\][\s\S]*?5002[\s\S]*?"""[\s\S]*?\[plugins\.params\.applications\."tenant-b/bravo"\]'
      # The base ruleset (SecRuleEngine On) IS shared — appears in both blocks
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-a/alpha"\][\s\S]*?SecRuleEngine On[\s\S]*?\[plugins\.params\.applications\."tenant-b/bravo"\]'
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[plugins\.params\.applications\."tenant-b/bravo"\][\s\S]*?SecRuleEngine On'

  test-spoa-hub-coraza-app-map-routes-by-resource-id:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: coraza-app.map carries one identity row per Ingress with a modsecurity-snippet, keyed by `<namespace>/<name>` (resource id). The frontend filter sets `txn.coraza_app` from `var(txn.resource_id),map(..
    extraContext: *extracontextCoraza
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: echo }
          spec: { ports: [{ port: 80 }] }
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: protected
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRuleEngine On
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
                    - path: /api
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:coraza-app.map, pattern: '(?m)^default/protected default/protected$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn.coraza_app\).*coraza-app\.map'
      - {type: contains, target: file:spoe.conf, pattern: 'app=var\(txn.coraza_app\)'}

  test-spoa-hub-config-render-modsecurity-snippet-host-less-accepted:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "An Ingress with modsecurity-snippet and a host-less rule renders successfully — coraza-app.map is keyed by <ns>/<name> (resource id), so the host dimension is irrelevant. The previous fail-loud guard is obsolete."
    extraContext:
      haproxyVersion: "3.2"
      waf:
        ingressPermissions: {allowCustomRules: true}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: ""
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hostless-modsec
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRuleEngine On
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: any, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:coraza-app.map
        pattern: '(?m)^default/hostless-modsec default/hostless-modsec$'
  test-spoa-hub-config-render-modsecurity-snippet-rejects-toml-triple-quote:
    # Skip when nginx-ingress is disabled: the fixture's
    # nginx.ingress.kubernetes.io/modsecurity-snippet annotation is scanned only
    # by nginx-ingress's util-nginx-ingress-coraza-scan, which produces the
    # rendering error this test asserts on.
    _helm_skip_test: '{{ include "haptic.nginxIngress.disabled" . }}'
    description: "An Ingress whose modsecurity-snippet contains a TOML triple-quote delimiter (\"\"\") is rejected at render time. The annotation value lands inside `directives = \"\"\"..."
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: injector }
      haproxyVersion: "3.2"
      waf:
        ingressPermissions: {allowCustomRules: true}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: injector
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRuleEngine On
                """
                detect_only = true
                directives = """
          spec: { ingressClassName: haproxy, rules: [{ host: i.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/injector annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' contains a TOML triple-quote"

  test-spoa-hub-config-render-modsecurity-without-coraza-fails:
    # Skip when nginx-ingress is disabled: the fixture's
    # nginx.ingress.kubernetes.io/modsecurity-snippet annotation is scanned only
    # by nginx-ingress's util-nginx-ingress-coraza-scan, which produces the
    # rendering error this test asserts on.
    _helm_skip_test: '{{ include "haptic.nginxIngress.disabled" . }}'
    description: "An Ingress carrying nginx.ingress.kubernetes.io/modsecurity-snippet while the spoaHub coraza plugin is NOT enabled fails the render with an explicit error. Silent ignore would hide a real misconfiguration; the operator wrote a per-Ingress WAF rule and nothing enforces it."
    extraContext:
      haproxyVersion: "3.2"
      waf:
        ingressPermissions: {allowCustomRules: true}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-auth"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: external_auth
            library: libhaproxy_spoa_hub_plugin_external_auth.so
            messages: ["check-auth"]
            timeoutMs: 6000
            dependsOn: []
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: orphan-rule
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains attack" "id:4001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: o.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-rule sets annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' but the spoaHub coraza plugin is not enabled"

  test-spoa-hub-config-render-multiple-plugins:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "Multiple enabled plugins each get their own [[plugins]] block. This pins the iteration over extraContext.spoaHub.plugins."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request", "get-fingerprint"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: "SecRuleEngine On"
            params: ""
          - name: fingerprinting
            library: libfingerprinting_plugin.so
            messages: ["get-fingerprint"]
            timeoutMs: 5
            dependsOn: []
            params: |
              ja4 = true
    fixtures:
      # Trigger the http_frontend so the SPOE filter directive can
      # render. After the bind-derivation refactor, an empty
      # fixture leaves no http frontend.
      ingresses: *ingressesTriggerExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'name = "coraza"'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'name = "fingerprinting"'}
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'library = "libfingerprinting_plugin.so"'
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'ja4 = true'}

  # =============================================================================
  # WAF dispatch mode (raw config: spec.templatingSettings.extraContext.waf.dispatch)
  # =============================================================================

  test-coraza-dispatch-opt-in-default:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "Default dispatch mode (`opt-in`) keeps the per-Ingress-gated send-spoe-group line and does NOT emit the coraza-disabled.map lookup or the str(deny) fallback. Regression test that the new branch doesn't leak into the default rendering."
    extraContext: *extracontextCoraza
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all. The Ingress carries no coraza-* annotation so the
      # opt-in path's "no Ingress opted in" assertions still hold.
      ingresses: *ingressesTriggerExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_active\) bool\(true\) if \{ var\(txn\.coraza_app\) -m found \} \|\| \{ var\(txn\.coraza_mode\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub-check-request check-request-group if \{ var\(txn\.coraza_active\) -m bool \}'
      - {type: not_contains, target: haproxy.cfg, pattern: 'coraza-disabled\.map'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.coraza_mode\) str\('}

  test-coraza-dispatch-default-on-no-annotations:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With dispatch.mode=default-on and no per-Ingress annotations, the rendered haproxy.cfg activates Coraza unless the route is in coraza-disabled.map, falls back to deny mode, and dispatches only when the explicit active flag is true."
    extraContext:
      haproxyVersion: "3.2"
      waf: {dispatch: {mode: default-on, defaultEnforcement: deny}}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all. The Ingress carries no coraza-* annotation so the
      # default-on path's "coraza-disabled.map is empty" assertion
      # still holds.
      ingresses: *ingressesTriggerExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_disabled\).*coraza-disabled\.map'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_mode\) str\(deny\) unless \{ var\(txn\.coraza_mode\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_active\) bool\(true\) unless \{ var\(txn\.coraza_disabled\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub-check-request check-request-group if \{ var\(txn\.coraza_active\) -m bool \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub-check-request check-request-group if \{ var\(txn\.coraza_app\)'

  test-coraza-dispatch-default-on-detect:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With dispatch.mode=default-on and defaultEnforcement=detect, the mode fallback causes detect-only=true to be sent to Coraza. Rule decisions are observed but coerced to allow by the plugin, while plugin and hub failures still fail closed."
    extraContext:
      haproxyVersion: "3.2"
      waf: {dispatch: {mode: default-on, defaultEnforcement: detect}}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all.
      ingresses: *ingressesTriggerExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_mode\) str\(detect\) unless \{ var\(txn\.coraza_mode\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_detect_only\) bool\(true\) if \{ var\(txn\.coraza_active\) -m bool \} \{ var\(txn\.coraza_mode\) -m str detect \}'

  test-coraza-dispatch-default-on-with-opt-out:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "With dispatch.mode=default-on and one Ingress carrying nginx.ingress.kubernetes.io/enable-modsecurity: \"false\", the coraza-disabled.map gets a `<ns>/<name> 1` entry; the send-spoe-group dispatch line is gated only on txn.coraza_disabled (so the opted-out resource skips the WAF)."
    extraContext:
      haproxyVersion: "3.2"
      waf:
        dispatch: {mode: default-on, defaultEnforcement: deny}
        ingressPermissions: {allowWafDisable: true}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: opted-out
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "false"
          spec:
            ingressClassName: haproxy
            rules:
              - host: opted-out.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:coraza-disabled.map, pattern: '(?m)^default/opted-out 1$'}

  test-coraza-dispatch-enable-modsecurity-bogus-rejected:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "An Ingress with nginx.ingress.kubernetes.io/enable-modsecurity set to a value other than \"true\" or \"false\" makes rendering fail loud. Only \"true\"/\"false\" are accepted."
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: bogus }
      haproxyVersion: "3.2"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: bogus
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "bogus"
          spec:
            ingressClassName: haproxy
            rules:
              - host: bogus.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: 'allowed values are "true" or "false"'}
      - {type: contains, target: rendering_error, pattern: 'default/bogus'}
  test-coraza-dispatch-governance-violation-reconcile-fails-closed:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: >-
      On a live reconcile, an existing Ingress whose modsecurity-snippet is
      rejected by governance (allowCustomRules=false) no longer aborts the
      whole render: the route fails closed with 503 via the nginx-ingress
      library's own frontend-filters-114 emission, a Warning Event lands on
      the Ingress, and no Coraza application is registered for it. Regression
      pin for the ingress-nginx-migration wedge (pre-existing snippet
      annotations bricking every render on first install).
    extraContext:
      renderMode: reconcile
      haproxyVersion: "3.2"
      waf:
        ingressPermissions: {allowCustomRules: false}
        # Governance activates only with a policy catalog, default-on
        # dispatch, or self-service enabled — plain opt-in compat mode keeps
        # upstream-permissive behavior.
        policies: {defaultPolicy: "", inline: {baseline: {}}, configMapRefs: { __replace__: true }}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: legacy-snippet
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRuleRemoveById 900001
          spec:
            ingressClassName: haproxy
            rules:
              - host: legacy-snippet.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn.resource_id\\) -m str default/legacy-snippet \\}"
      - type: contains
        target: events
        pattern: "Warning WafPermissionDenied networking.k8s.io/v1 Ingress default/legacy-snippet:.*allowCustomRules=false"
      - type: not_contains
        target: "file:spoa-hub-config.toml"
        pattern: 'applications\."default/legacy-snippet"'


  test-coraza-dispatch-enable-modsecurity-host-less-accepted:
    # Skip on HAProxy <3.1 (mode spop) OR when nginx-ingress is disabled: the
    # fixture's nginx.ingress.kubernetes.io/* annotations are scanned only by
    # nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "An Ingress with nginx.ingress.kubernetes.io/enable-modsecurity: \"false\" and a host-less rule renders successfully — coraza-disabled.map is now keyed by <ns>/<name> (resource id), so the host dimension is irrelevant and the previous fail-loud guard is obsolete."
    extraContext:
      haproxyVersion: "3.2"
      waf:
        dispatch: {mode: default-on, defaultEnforcement: deny}
        ingressPermissions: {allowWafDisable: true}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: host-less
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "false"
          spec:
            ingressClassName: haproxy
            rules:
              - http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:coraza-disabled.map, pattern: '(?m)^default/host-less 1$'}

  test-coraza-dispatch-default-on-rejects-unauthorized-opt-out:
    _helm_skip_test: '{{ if or (semverCompare "<3.1" .Values.haproxyVersion) (include "haptic.nginxIngress.disabled" .) }}true{{ else }}false{{ end }}'
    description: "Default-on dispatch treats WAF coverage as an administrator-owned baseline: an Ingress cannot opt out unless extraContext.waf.ingressPermissions.allowWafDisable is explicitly true."
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: unauthorized-opt-out }
      haproxyVersion: "3.2"
      waf:
        dispatch: {mode: default-on, defaultEnforcement: deny}
        # Per-test extraContext deep-merges into the global context, so pin
        # the permission this test asserts instead of relying on the global
        # values leaving it unset.
        ingressPermissions: {allowWafDisable: false}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: unauthorized-opt-out
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "false"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: 'disabled Ingress WAF opt-outs'}
      - {type: contains, target: rendering_error, pattern: 'default/unauthorized-opt-out'}
