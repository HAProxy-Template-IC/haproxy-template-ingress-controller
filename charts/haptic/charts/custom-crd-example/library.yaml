# Custom-CRD example library — the RULE #1 end-to-end proof that the reload-free
# author contract is resource-agnostic. It watches a `Route` custom resource
# (no bundled schema; accessed through generic incremental bindings and dig())
# and builds the same shape the ingress and gateway libraries build:
# one Backend() per Route with a literal server list, and per-Route request
# headers moved into route-reqhdr.map read by one static set-header line
# keyed on the backend. Default-disabled — it exists to document and test the
# macros, not for production routing. See docs/site/docs/libraries/reload-free.md.
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.customCrdExample.enabled }}'

watchedResources:
  routes:
    apiVersion: haptic-example.org/v1
    resources: routes
    indexBy: ["metadata.namespace", "metadata.name"]

templateSnippets:
  util-custom-route-header-bindings:
    template: |-
      {%- var mapPath, mapErr = pathResolver.GetPath("route-reqhdr.map", "map") -%}
      {%- if mapErr != nil -%}{{- fail(tostring(mapErr)) -}}{%- end -%}
      {{- toJSON(map[string]any{"routes": map[string]any{"mapPath": mapPath}}) -}}

  custom-route-header-map-items:
    requires: [routes]
    incremental:
      source: routes
    template: |-
      {%%
        var route = item
        var backend = tostring(dig(route, "metadata", "namespace")) + "_" +
          tostring(dig(route, "metadata", "name"))
        for _, header := range toSlice(dig(route, "spec", "requestHeaders")) {
          var name = tostring(dig(header, "name"))
          if !regex_search(name, "^[A-Za-z0-9!$&*+.^_~-]+$") {
            continue
          }
          var lower = toLower(name)
          show backend + "|set|" + lower + " " +
            queryEscape(tostring(dig(header, "value"))) + "\n"
        }
      %%}

  custom-route-header-rules:
    requires: [routes]
    incremental:
      bindingsTemplate: '{{- render "util-custom-route-header-bindings" -}}'
      effects: [publishValue]
    template: |-
      {%%
        var mapPath = dig_string(props, "", "mapPath")
        for _, header := range toSlice(dig(item, "spec", "requestHeaders")) {
          var name = dig_string(header, "", "name")
          if !regex_search(name, "^[A-Za-z0-9!$&*+.^_~-]+$") {
            continue
          }
          var lower = toLower(name)
          var key = "var(txn.backend_name),concat(|set|" + lower + "),map(" + mapPath + ")"
          var line = "\nhttp-request set-header " + name + " %[" + key +
            ",url_dec(1)] if { " + key + " -m found }"
          show shared.PublishRanked("rules", lower, lower + "\x00" + name, line)
        }
      %%}

  frontend-filters-990-custom-route-headers:
    requires: [routes]
    template: |-
      {%- var entries = render "custom-route-header-map-items" -%}
      {{- render "custom-route-header-rules" -}}
      {%%
        var content = "# <backend>|set|<name> -> URL-encoded value\n" + entries
        var _, mapErr = fileRegistry.Register("map", "route-reqhdr.map", content)
        if mapErr != nil { fail("failed to register route-reqhdr.map: " + tostring(mapErr)) }
        var metaErr = planRegistry.MapMeta("route-reqhdr.map", false)
        if metaErr != nil { fail("failed to declare route-reqhdr.map entry order: " + tostring(metaErr)) }
      %%}
      {{- incremental_ranked_text_fragment("custom-route-header-rules", "rules") -}}

  backends-990-custom-route:
    requires: [routes]
    incremental:
      source: routes
      effects: [backendPlan]
    template: |-
      {%- import "util-backend" for Backend -%}
      {%- var be = tostring(dig(item, "metadata", "namespace")) + "_" +
        tostring(dig(item, "metadata", "name")) -%}
      {{ Backend(map[string]any{
           "name": be,
           "guid": make_guid("be", be),
           "shape": "dynamic",
           "comments": []any{"# Custom Route " + be},
           "servers": []any{map[string]any{"name": "primary",
             "address": tostring(dig(item, "spec", "backend", "address")),
             "port": toint(dig(item, "spec", "backend", "port"))}},
         }) }}

validationTests:
  test-custom-crd-route-reload-free:
    requires: [routes]
    description: A custom Route CRD drives incremental backend and header-map components without resource-specific Go. Two Routes sharing a header name emit one static line (smallest spelling wins) and one map entry each.
    fixtures:
      # One Ingress only so the base builds an HTTP frontend for the shared
      # HeaderModifierRules line to render into; the Route CRD drives everything
      # asserted below.
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: web}
          spec: {ports: [{port: 80}]}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: web, annotations: {kubernetes.io/ingress.class: haptic}}
          spec:
            rules:
              - host: web.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
      routes:
        - apiVersion: haptic-example.org/v1
          kind: Route
          metadata: {namespace: default, name: r1}
          spec:
            backend: {address: 10.0.0.1, port: 8080}
            requestHeaders: [{name: X-Env, value: "prod eu"}]
        - apiVersion: haptic-example.org/v1
          kind: Route
          metadata: {namespace: default, name: r2}
          spec:
            backend: {address: 10.0.0.2, port: 8080}
            requestHeaders: [{name: x-env, value: "prod us"}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend default_r1 from haptic-be-\w+$'}
      - {type: contains, target: haproxy.cfg, pattern: 'server primary 10\.0\.0\.1:8080'}
      - {type: contains, target: map:route-reqhdr.map, pattern: 'default_r1\|set\|x-env prod%20eu'}
      - {type: contains, target: map:route-reqhdr.map, pattern: 'default_r2\|set\|x-env prod%20us'}
      # One static line per header NAME (both Routes share x-env), one per frontend.
      - {type: match_count, target: haproxy.cfg, expected: "3", pattern: 'set-header X-Env %\[var\(txn\.backend_name\),concat\(\|set\|x-env\),map\([^)]*route-reqhdr\.map\),url_dec\(1\)\]'}
      # Smallest spelling wins regardless of Route order (X-Env < x-env).
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header x-env %'}
