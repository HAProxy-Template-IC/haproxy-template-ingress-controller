# haproxy-ingress library — raw directive injection into the http frontend,
# global, and defaults sections.
#
# Complements the existing config-backend snippet (backend-directives-900).
# Each annotation injects raw, operator-authored HAProxy directives verbatim
# into the corresponding section via base.yaml's extension points:
#
#   config-frontend → frontend-extra-*    (http frontend, before routing logic)
#   config-global   → global-settings-*   (global section)
#   config-defaults → defaults-settings-* (defaults section)
#
# Multiple Ingresses carrying the same annotation each contribute their block,
# matching haproxy-ingress upstream which emits each snippet once per source.
#
# Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#configuration-snippet
templateSnippets:
  frontend-extra-650-haproxy-ingress-config-frontend:
    requires: [ingresses]
    template: |-
      {#
        config-frontend → raw directives in the http frontend.

        Runs before routing logic in every HTTP frontend.
      #}
      {%- var output, _ = shared.ComputeIfAbsent("haproxy-ingress-config-frontend-output", func() any {
        return render "util-incremental-haproxy-ingress-config-frontend"
      }) -%}
      {{- tostring(output) -}}

  util-incremental-haproxy-ingress-config-frontend:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/config-frontend']"]
    template: |-
      {%%
        var ingress = item
        var snippet = strip(dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/config-frontend"))
        if snippet != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haproxy-ingress-config-frontend", "header", "\n# haproxy-ingress/config-frontend")
          show shared.Unique("haproxy-ingress-config-frontend", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + snippet)
        }
      %%}

  global-settings-649-haproxy-ingress-config-frontend-cache:
    requires: [ingresses]
    template: |-
      {%- var _, _ = shared.ComputeIfAbsent("haproxy-ingress-config-frontend-output", func() any {
        return render "util-incremental-haproxy-ingress-config-frontend"
      }) -%}

  global-settings-650-haproxy-ingress-config-global:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/config-global']"]
    template: |-
      {%%
        var ingress = item
        var snippet = strip(dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/config-global"))
        if snippet != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haproxy-ingress-config-global", "header", "\n# haproxy-ingress/config-global")
          show shared.Unique("haproxy-ingress-config-global", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + snippet)
        }
      %%}

  defaults-settings-650-haproxy-ingress-config-defaults:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/config-defaults']"]
    template: |-
      {%%
        var ingress = item
        var snippet = strip(dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/config-defaults"))
        if snippet != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haproxy-ingress-config-defaults", "header", "\n# haproxy-ingress/config-defaults")
          show shared.Unique("haproxy-ingress-config-defaults", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + snippet)
        }
      %%}
