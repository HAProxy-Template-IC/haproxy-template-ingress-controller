# haproxy-ingress library — server-alias / server-alias-regex contributions.
#
# These annotations make extra hostnames route to the SAME backends as the
# Ingress's primary host. The chart's routing keys every path-map entry on the
# normalised host key (`txn.host_match`, produced by host.map / host-regex.map
# lookups), so an alias only needs to resolve to the SAME host key as the
# primary host — then every existing path-map entry for that host applies to the
# alias unchanged. No backend duplication, no path-map duplication.
#
#   server-alias:       comma-separated list of extra EXACT hostnames.
#                       → host.map entry  `<alias> <primary-host-key>`
#   server-alias-regex: a regular expression matching extra hostnames.
#                       → host-regex.map entry  `<regex> <primary-host-key>`
#
# Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#server-alias
templateSnippets:
  map-host-650-haproxy-ingress-alias:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/server-alias']"]
      effects: [recordEvent]
    template: |-
      {#
        server-alias → host.map entries.

        For each Ingress carrying haproxy-ingress.github.io/server-alias, emit
        one host.map entry per listed hostname, all pointing at the primary
        host's normalised key. The primary host key is MapKeyForHost(rule.Host)
        — the SAME normalisation map-host-500-ingress uses for the primary
        entry, so the alias lands on identical downstream path-map lookups.

        Aliases attach to the FIRST rule's host (haproxy-ingress's model: the
        alias is an Ingress-level alternative name for the resource's host).

        Extension Point: map-host-* (priority 650 - compatibility layer)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var aliasAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/server-alias"]
        if aliasAnnotation != "" {
          var rules = ingress.Spec.Rules
          if len(rules) > 0 {
            var primaryKey = MapKeyForHost(rules[0] | dig("host"))
            if primaryKey != "" {
              var namespace = ingress.Metadata.Namespace
              var name = ingress.Metadata.Name
              show shared.Unique("haproxy-ingress-map-host-alias", "header", "\n# haproxy-ingress/map-host-alias\n")
              var block = "# Ingress: " + namespace + "/" + name + " server-alias"
              for _, rawAlias := range split(aliasAnnotation, ",") {
                var alias = strip(rawAlias)
                if alias != "" {
                  var aliasInj = ConfigInjectionKind(alias, "mapkey")
                  if aliasInj != "" {
                    _ = WebhookRejectOrWarn(ingress, "InvalidServerAlias", "Ingress " + namespace + "/" + name + " annotation 'haproxy-ingress.github.io/server-alias' value contains " + aliasInj + ", which would split the host map; the alias is not applied. Remove whitespace and control characters from the value.")
                    continue
                  }
                  block += "\n" + MapKeyForHost(alias) + " " + primaryKey
                }
              }
              show shared.Unique("haproxy-ingress-map-host-alias", "resource/" + namespace + "/" + name, block + "\n")
            }
          }
        }
      %%}

  map-hostregex-650-haproxy-ingress-alias:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/server-alias-regex']"]
      effects: [recordEvent]
    template: |-
      {#
        server-alias-regex → host-regex.map entries.

        The annotation value is a regular expression matching extra hostnames.
        host-regex.map is consulted by base.yaml's routing cascade via
        `map_reg(host-regex.map)` after the exact host.map miss, so a single
        regex entry routes every matching hostname to the primary host key.

        The value is emitted verbatim (it is already a HAProxy-compatible PCRE),
        mapped to the primary host's normalised key.

        Extension Point: map-hostregex-* (priority 650 - compatibility layer)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var regexAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/server-alias-regex"]
        if regexAnnotation != "" {
          var rules = ingress.Spec.Rules
          if len(rules) > 0 {
            var primaryKey = MapKeyForHost(rules[0] | dig("host"))
            if primaryKey != "" {
              var namespace = ingress.Metadata.Namespace
              var name = ingress.Metadata.Name
              var regexTrimmed = strip(regexAnnotation)
              var regexInj = ConfigInjectionKind(regexTrimmed, "mapkey")
              if regexInj != "" {
                _ = WebhookRejectOrWarn(ingress, "InvalidServerAliasRegex", "Ingress " + namespace + "/" + name + " annotation 'haproxy-ingress.github.io/server-alias-regex' value contains " + regexInj + ", which would split the host-regex map; the alias regex is not applied. Remove whitespace and control characters from the value.")
              } else {
                show shared.Unique("haproxy-ingress-map-hostregex-alias", "header", "\n# haproxy-ingress/map-hostregex-alias\n")
                show shared.Unique("haproxy-ingress-map-hostregex-alias", "resource/" + namespace + "/" + name,
                  "# Ingress: " + namespace + "/" + name + " server-alias-regex\n" + regexTrimmed + " " + primaryKey + "\n")
              }
            }
          }
        }
      %%}
