# haproxy-ingress library — WAF (Coraza via SPOA hub) validation tests.
# /waf + /waf-mode dispatch, error paths, nginx-modsec coexistence. The
# trailing ssl-passthrough-named-port test lives here (file tail).
validationTests:
  # ============================================================================
  # WAF (Coraza, via SPOA hub): /waf + /waf-mode annotation tests
  # ============================================================================

  test-haproxy-ingress-waf-deny-default:
    # Needs the spoa-hub library loaded (the dispatch wiring lives there).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Single Ingress with haproxy-ingress.github.io/waf: \"modsecurity\" and no /waf-mode populates haproxy-ingress-waf.map with mode \"deny\", activates Coraza for that route, dispatches it, and fails closed unless the plugin explicitly returns allow."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-waf
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-waf.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port: { number: 80 }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:haproxy-ingress-waf.map
        pattern: "default/hi-waf deny"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.coraza_mode\\).*haproxy-ingress-waf\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.coraza_active\\) bool\\(true\\) if \\{ var\\(txn.coraza_app\\) -m found \\} \\|\\| \\{ var\\(txn.coraza_mode\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub check-request-group if \\{ var\\(txn.coraza_active\\) -m bool \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "deny deny_status 403 if \\{ var\\(txn.coraza_active\\) -m bool \\} \\{ var\\(txn.hub.coraza.action\\) -m found \\} !\\{ var\\(txn.hub.coraza.action\\) -m str allow \\}"

  test-haproxy-ingress-waf-detect-mode:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Ingress with haproxy-ingress.github.io/waf: \"modsecurity\" and /waf-mode: \"detect\" populates the map with \"detect\" and sends detect-only=true to Coraza. Coraza still evaluates the rules but coerces completed rule decisions to allow; infrastructure failures remain fail closed."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-shadow
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: shadow.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port: { number: 80 }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:haproxy-ingress-waf.map
        pattern: "default/hi-shadow detect"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.coraza_detect_only\\) bool\\(true\\) if \\{ var\\(txn.coraza_active\\) -m bool \\} \\{ var\\(txn.coraza_mode\\) -m str detect \\}"

  test-haproxy-ingress-waf-invalid-value-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Ingress with /waf set to anything other than \"modsecurity\" must fail-loud at render time. Only \"modsecurity\" is supported by the bundled coraza plugin; silent ignore would hide an operator typo."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: ""
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-bad-waf
            annotations:
              haproxy-ingress.github.io/waf: bogus
          spec:
            ingressClassName: haproxy
            rules:
              - host: bad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: any
                          port: { number: 80 }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid value 'bogus' for annotation 'haproxy-ingress\\.github\\.io/waf'"
      - type: contains
        target: rendering_error
        pattern: "default/hi-bad-waf"

  test-haproxy-ingress-waf-mode-invalid-value-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "/waf-mode set to anything other than \"deny\" or \"detect\" must fail-loud. Quietly defaulting to \"deny\" would mask a typo (\"detec\" / \"detct\" → silent enforcement when the operator intended shadow mode)."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: ""
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-bad-mode
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detec
          spec:
            ingressClassName: haproxy
            rules:
              - host: bad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: any
                          port: { number: 80 }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid value 'detec' for annotation 'haproxy-ingress\\.github\\.io/waf-mode'"
      - type: contains
        target: rendering_error
        pattern: "default/hi-bad-mode"

  test-haproxy-ingress-waf-mode-without-waf-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "/waf-mode set without /waf is an operator error (no-op upstream) and must fail-loud. Silently ignoring would let an operator who meant to enable WAF in detect mode silently run with no WAF at all."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: ""
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-mode-only
            annotations:
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: mode-only.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: any
                          port: { number: 80 }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "sets 'haproxy-ingress\\.github\\.io/waf-mode' but not 'haproxy-ingress\\.github\\.io/waf'"
      - type: contains
        target: rendering_error
        pattern: "default/hi-mode-only"

  test-haproxy-ingress-waf-host-less-accepted:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Ingress with /waf set AND a rule without a host must render successfully — the WAF map is now keyed by <ns>/<name>, so the host dimension is irrelevant. The previous fail-loud guard is obsolete."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: ""
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-waf-hostless
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: any
                          port: { number: 80 }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:haproxy-ingress-waf.map
        pattern: '(?m)^default/hi-waf-hostless deny$'
  test-haproxy-ingress-waf-coexist-with-nginx-modsec-snippet:
    # Skip when spoa-hub OR nginx-ingress is disabled: this test exercises the
    # coexistence of haproxy-ingress.github.io/waf with
    # nginx.ingress.kubernetes.io/modsecurity-snippet, the latter scanned only
    # by nginx-ingress's util-nginx-ingress-coraza-scan.
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (include "haptic.nginxIngress.disabled" .) }}true{{ end }}'
    description: "When BOTH nginx.ingress.kubernetes.io/modsecurity-snippet and haproxy-ingress.github.io/waf are present in the cluster, nginx's \"global rules + always dispatch\" wins for dispatch (the send-spoe-group..."
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nginx-modsec
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"
          spec:
            ingressClassName: haproxy
            rules:
              - host: nginx.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: haproxy-shadow
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: haproxy.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:haproxy-ingress-waf.map
        pattern: "default/haproxy-shadow detect"
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "# nginx-ingress modsecurity-snippet from default/nginx-modsec"
      - type: not_contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub check-request-group if \\{ var\\(txn.coraza_mode\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn.coraza_detect_only\\) bool\\(true\\) if \\{ var\\(txn.coraza_active\\) -m bool \\} \\{ var\\(txn.coraza_mode\\) -m str detect \\}"

  test-haproxy-ingress-waf-without-coraza-fails:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: Ingress with haproxy-ingress.github.io/waf set while the spoaHub coraza plugin is NOT enabled fails the render with an explicit diagnostic.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: []
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: []
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: orphan-waf
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
          spec:
            ingressClassName: haproxy
            rules:
              - host: orphan.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: any, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-waf sets annotation 'haproxy-ingress\\.github\\.io/waf' but the spoaHub coraza plugin is not enabled"

  test-haproxy-ingress-ssl-passthrough-named-port:
    description: haproxy-ingress.github.io/ssl-passthrough annotation must resolve a backend referenced by port.name to the correct numeric pod port
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: secure-grpc
            namespace: default
          spec:
            ports:
              - name: grpc-tls
                port: 9443
                targetPort: grpc-tls
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secure-grpc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: secure-grpc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.60"]
              targetRef:
                kind: Pod
                name: secure-grpc-0
          ports:
            - name: grpc-tls
              port: 9443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: secure-grpc
            namespace: default
            annotations:
              haproxy-ingress.github.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: grpc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: secure-grpc
                          port:
                            name: grpc-tls
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.60:9443 "
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.60:80 "
