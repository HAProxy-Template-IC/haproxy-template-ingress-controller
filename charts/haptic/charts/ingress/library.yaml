  test-ingress-named-port-service-not-yet-created:
    description: |
      Regression test for issue #50 (ingress-conformance wildcard flake).
      An Ingress referencing a Service by port NAME while that Service is
      not in the store MUST still render: Kubernetes is eventually
      consistent — the Ingress may legally be created before its Service,
      and the admission webhook's dry-run render can run before a
      just-created Service reaches the controller's watch cache. The old
      hard fail() denied the Ingress at admission ("ResolveServicePort:
      Service ... not found (needed to resolve port name 'http')") and
      blocked the entire haproxy.cfg render in the reconcile loop. Expected
      degraded output: the backend and its map entry exist with
      placeholder-only server slots (503 for this route) until a later
      reconcile converges. Because the degraded state is placeholder-only,
      the ingress-degraded-backend-events k8sResources template MUST emit a
      Warning Event on the owning Ingress (issue #66) so a permanent
      Service-name typo isn't a silent 503.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: wildcard-host
            namespace: default
            uid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
          spec:
            ingressClassName: haproxy
            rules:
              - host: bar.example.com
                http:
                  paths:
                    - path: /echo
                      pathType: Prefix
                      backend:
                        service:
                          name: foo-bar-com
                          port:
                            name: http
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_wildcard-host_svc_foo-bar-com_http"

      - type: contains
        target: map:path-prefix.map
        pattern: "bar.example.com/echo/ BACKEND:default_wildcard-host_svc_foo-bar-com_http"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 192\\.0\\.2\\.1:1 .*disabled"

      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[0-9]+ \\S+:0"

      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
        expected: "1"
      # Bucketed RFC3339: drives kubectl's LAST SEEN and refreshes the event TTL.
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: 'lastTimestamp: .?2[0-9]{3}-[0-9]{2}-[0-9]{2}T'
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "reason: BackendUnresolved"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "type: Warning"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "name: wildcard-host\\.backend-unresolved"
      # kubectl describe matches events by the involvedObject.uid field selector.
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Ingress"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "uid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
      # Token-only pattern: independent of the YAML marshaller's scalar quoting.
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/foo-bar-com"

  test-ingress-named-port-service-missing-slice-resolution:
    description: |
      Companion to test-ingress-named-port-service-not-yet-created: the
      Service is still missing from the store, but its EndpointSlices
      already arrived (watch events per resource type are independently
      ordered). The named port MUST resolve from the slice's own ports
      list, producing real server lines (svc-fast). A slice that does NOT
      carry the named port (svc-slow) must yield placeholder-only slots —
      never an "addr:0" server line. Degraded-backend Events (issue #66)
      must be precise: svc-fast serves traffic, so it gets NO Event;
      svc-slow is placeholder-only, so it does.
    fixtures:
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc-fast-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: svc-fast
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.9"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: fast-pod}
          ports:
            - name: http
              port: 8080
              protocol: TCP
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc-slow-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: svc-slow
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.10"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: slow-pod}
          ports:
            - name: metrics
              port: 9090
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: race
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: race.example.com
                http:
                  paths:
                    - path: /fast
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-fast
                          port:
                            name: http
                    - path: /slow
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-slow
                          port:
                            name: http
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.9:8080 .*enabled"

      - type: not_contains
        target: haproxy.cfg
        pattern: "10\\.0\\.0\\.10"

      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[0-9]+ \\S+:0"

      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/svc-slow"
      - type: not_contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/svc-fast"

  test-ingress-degraded-backend-event-multiple:
    description: |
      Two Ingresses degraded at once (issue #66) emit one Event each, as
      separate YAML documents. Pins the multi-doc separator: a malformed
      document stream would fail the production render's k8sResources
      parsing for every reconcile with two or more degraded Ingresses.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: first-broken
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: first.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: first-ghost
                          port:
                            name: http
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: second-broken
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: second.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: second-ghost
                          port:
                            name: http
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
        expected: "2"
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "(?m)^---$"
        expected: "1"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/first-ghost"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/second-ghost"

  test-ingress-degraded-backend-event-negatives:
    description: |
      The degraded-backend Event (issue #66) must stay silent in every
      non-degraded shape: (1) a by-name reference whose Service exists
      resolves normally; (2) a by-NUMBER reference to an absent Service is
      trusted as-is (ResolveServicePort never degrades it to port 0), so it
      is out of the Event's by-name scope. Neither may produce an Event.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: healthy-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: by-name-resolved
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: ok.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: healthy-svc
                          port:
                            name: http
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: by-number-absent
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: num.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ghost-svc
                          port:
                            number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_by-name-resolved_svc_healthy-svc_http"
      - type: not_contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
      - type: not_contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "BackendUnresolved"

  test-ingress-default-backend-rules-less:
    description: "Ingress with only spec.defaultBackend (no rules) emits a \"/\" catch-all entry in path-prefix.map pointing at the default backend pool, and the backend pool itself gets generated. Routes any request that didn't match a more-specific rule to that backend."
