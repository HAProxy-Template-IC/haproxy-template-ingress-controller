        pattern: "(?m)^example\\.com/ BACKEND:default_with-default_svc_fallback-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_with-default_svc_fallback-svc_http$"

  test-ingress-host-path-conflict-oldest-wins:
    description: "Two Ingresses in different namespaces declare the same host+path. HAProxy maps keep one entry per key, so we resolve deterministically: the OLDER Ingress (by creationTimestamp) keeps the route; the newer one's route is dropped. The older Ingress is in the alphabetically LAST namespace (zeta) and the newer in the FIRST (alpha), so only genuine timestamp ordering — not a namespace/name tiebreak — can make the older one win. Matches ingress-nginx's oldest-wins; an Ingress that was there first is not hijacked by a later conflicting one."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-old
            namespace: zeta
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-new
            namespace: alpha
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-old
            namespace: zeta
            creationTimestamp: "2020-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-old
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-new
            namespace: alpha
            creationTimestamp: "2026-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-new
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:zeta_route-old_svc_svc-old_http$"
        description: "the older Ingress (zeta/route-old) owns the route, despite being alphabetically last"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "alpha_route-new"
        description: "the newer Ingress (alpha/route-new) loses the route — no duplicate key in the map"
      - type: contains
        target: events
        pattern: 'Warning RouteConflict networking\.k8s\.io/v1 Ingress alpha/route-new: .*served by Ingress zeta/route-old'
        description: "the losing Ingress gets a RouteConflict Warning naming the winner"
      - type: not_contains
        target: events
        pattern: "zeta/route-old:"
        description: "the winning Ingress gets no conflict event"

  test-ingress-same-host-different-paths-coexist:
    description: "Two Ingresses on the same host but DIFFERENT paths are NOT a conflict — both routes render. Guards features-090-ingress-path-conflict against false positives."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-a
            namespace: team-a
          spec:
