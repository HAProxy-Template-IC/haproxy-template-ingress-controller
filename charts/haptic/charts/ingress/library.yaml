      - type: haproxy_valid
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
        expected: "2"
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "(?m)^---$"
        expected: "1"
      - {type: contains, target: "k8s:ingress-degraded-backend-events", pattern: "default/first-ghost"}
      - {type: contains, target: "k8s:ingress-degraded-backend-events", pattern: "default/second-ghost"}

  test-ingress-degraded-backend-event-negatives:
    description: |
      The degraded-backend Event (issue #66) must stay silent in every
      non-degraded shape: (1) a by-name reference whose Service exists
      resolves normally; (2) a by-NUMBER reference to an absent Service is
      trusted as-is (ResolveServicePort never degrades it to port 0), so it
      is out of the Event's by-name scope. Neither may produce an Event.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: healthy-svc, namespace: default}
          spec: *specHttp8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: by-name-resolved, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: ok.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: healthy-svc, port: {name: http}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: by-number-absent, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: num.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: ghost-svc, port: {number: 8080}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_by-name-resolved_svc_healthy-svc_http"
      - {type: not_contains, target: "k8s:ingress-degraded-backend-events", pattern: "kind: Event"}
      - {type: not_contains, target: "k8s:ingress-degraded-backend-events", pattern: "BackendUnresolved"}

  test-ingress-default-backend-rules-less:
    description: "Ingress with only spec.defaultBackend (no rules) emits a \"/\" catch-all entry in path-prefix.map pointing at the default backend pool, and the backend pool itself gets generated. Routes any request that didn't match a more-specific rule to that backend."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: fallback-svc, namespace: default}
          spec: *specHttp8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: only-default, namespace: default}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: fallback-svc, port: {number: 8080}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend default_only-default_svc_fallback-svc_http"}
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_only-default_svc_fallback-svc_http$"
      - {type: match_count, target: map:path-prefix.map, pattern: "(?m)^/ BACKEND:", expected: "1"}

  test-ingress-default-backend-with-rules-per-host:
    description: "Ingress with both spec.rules (host: example.com) and spec.defaultBackend emits a per-host catch-all \"example.com/\" entry in path-prefix.map alongside the rule's entries. K8s spec: requests matching the Ingress's host but no rule path go to defaultBackend; requests to OTHER hosts must NOT be caught."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: rule-svc, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
        - apiVersion: v1
          kind: Service
          metadata: {name: fallback-svc, namespace: default}
          spec: *specHttp8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: with-default, namespace: default}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: fallback-svc, port: {number: 8080}}}
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: rule-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend default_with-default_svc_rule-svc_http"}
      - {type: contains, target: haproxy.cfg, pattern: "backend default_with-default_svc_fallback-svc_http"}
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/api/ BACKEND:default_with-default_svc_rule-svc_http$"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:default_with-default_svc_fallback-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_with-default_svc_fallback-svc_http$"

  test-ingress-host-path-conflict-oldest-wins:
    description: "Two Ingresses in different namespaces declare the same host+path. HAProxy maps keep one entry per key, so we resolve deterministically: the OLDER Ingress (by creationTimestamp) keeps the route; the newer one's route is dropped. The older Ingress is in the alphabetically LAST namespace (zeta) and the newer in the FIRST (alpha), so only genuine timestamp ordering — not a namespace/name tiebreak — can make the older one win. Matches ingress-nginx's oldest-wins; an Ingress that was there first is not hijacked by a later conflicting one."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: svc-old, namespace: zeta}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
        - apiVersion: v1
          kind: Service
          metadata: {name: svc-new, namespace: alpha}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-old, namespace: zeta, creationTimestamp: "2020-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend: {service: {name: svc-old, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-new, namespace: alpha, creationTimestamp: "2026-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend: {service: {name: svc-new, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:zeta_route-old_svc_svc-old_http$"
        description: "the older Ingress (zeta/route-old) owns the route, despite being alphabetically last"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "alpha_route-new"
        description: "the newer Ingress (alpha/route-new) loses the route — no duplicate key in the map"
      - type: contains
        target: events
        pattern: 'Warning RouteConflict networking\.k8s\.io/v1 Ingress alpha/route-new: .*served by Ingress zeta/route-old'
        description: "the losing Ingress gets a RouteConflict Warning naming the winner"
      - type: not_contains
        target: events
        pattern: "zeta/route-old:"
        description: "the winning Ingress gets no conflict event"

  test-ingress-same-host-different-paths-coexist:
    description: "Two Ingresses on the same host but DIFFERENT paths are NOT a conflict — both routes render. Guards features-090-ingress-path-conflict against false positives."
    fixtures:
      services: *servicesServiceSvcA
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-a, namespace: team-a}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /cart
                      pathType: Prefix
                      backend: *backendSvcA
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-b, namespace: team-b}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /account
                      pathType: Prefix
                      backend: *backendSvcB
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/cart/ BACKEND:team-a_route-a_svc_svc-a_http$"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/account/ BACKEND:team-b_route-b_svc_svc-b_http$"

  test-ingress-implementation-specific-shares-slot-oldest-wins:
    description: "pathType Prefix and ImplementationSpecific render into the same path maps (they share a routing slot), so two Ingresses claiming the same host+path with those two path types collide. The owner computation collapses ImplementationSpecific to Prefix, so oldest-wins resolves the collision to a single map entry — the older Prefix Ingress here. If the two path types were treated as distinct slots, both would emit into path-prefix.map, producing a duplicate key."
    fixtures:
      services: *servicesServiceSvcA
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-a, namespace: team-a, creationTimestamp: "2020-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend: *backendSvcA
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-b, namespace: team-b, creationTimestamp: "2026-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: ImplementationSpecific
                      backend: *backendSvcB
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:team-a_route-a_svc_svc-a_http$"
        description: "the older Prefix Ingress owns the shared slot"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "team-b_route-b"
        description: "the newer ImplementationSpecific Ingress collapses to the same slot and loses — no duplicate key"

  test-ingress-prefix-trailing-slash-oldest-wins:
    description: "Prefix paths '/checkout' and '/checkout/' render into the same map keys (the emit stage strips the trailing slash for the Prefix slot), so they collide. The owner key applies the same trailing-slash normalization, so oldest-wins resolves them to a single map entry instead of emitting a duplicate key. The older Ingress ('/checkout') wins; the newer ('/checkout/') is dropped."
    fixtures:
      services: *servicesServiceSvcA
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-a, namespace: team-a, creationTimestamp: "2020-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend: *backendSvcA
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: route-b, namespace: team-b, creationTimestamp: "2026-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout/
                      pathType: Prefix
                      backend: *backendSvcB
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:"
        expected: "1"
        description: "exactly one entry for the shared route — no duplicate key from the trailing-slash variant"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:team-a_route-a_svc_svc-a_http$"
        description: "the older '/checkout' Ingress owns the route"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "team-b_route-b"
        description: "the newer '/checkout/' variant normalizes to the same key and loses"

  test-ingress-default-backend-newest-wins-per-host:
    description: "Two Ingresses in different namespaces both declare defaultBackend for the same host. HAProxy maps keep only one entry per key, so we MUST pick deterministically; the newest Ingress wins per host (matches operator intent on rollout + avoids stale-Ingress 503s during scenario churn)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: old-svc, namespace: ns-old}
          spec: *specHttp8080
        - apiVersion: v1
          kind: Service
          metadata: {name: new-svc, namespace: ns-new}
          spec: *specHttp8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: older, namespace: ns-old, creationTimestamp: "2024-01-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: old-svc, port: {number: 8080}}}
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend: {service: {name: old-svc, port: {number: 8080}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: newer, namespace: ns-new, creationTimestamp: "2024-06-01T00:00:00Z"}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: new-svc, port: {number: 8080}}}
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /new
                      pathType: Prefix
                      backend: {service: {name: new-svc, port: {number: 8080}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-new_newer_svc_new-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-old_older_svc_old-svc_http$"
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:"
        expected: "1"

  # Cross-tenant map-injection guard (#153). A whitespace-delimited map key means a
  # newline OR a space in spec.rules[].http.paths[].path smuggles a second entry
  # that hijacks another tenant's host+path. The path is guarded before it reaches
  # the owner-dedup key or the emitted line: denied at admission, warned-and-skipped
  # on reconcile so one hostile Ingress can't brick the fleet.
  test-ingress-path-newline-injection-admission-rejected:
    description: A newline in an Ingress path is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: tenant-a, name: attacker}
          spec:
            ingressClassName: haproxy
            rules:
              - host: attacker.example.com
                http:
                  paths:
                    - path: "/a\nvictim.example.com/secret BACKEND:tenant-a_evil_svc_web_80"
                      pathType: Exact
                      backend: {service: {name: web, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has a path containing whitespace or control characters"

  test-ingress-path-space-injection-admission-rejected:
    description: A space in an Ingress path is denied by the admission webhook (a space truncates a whitespace-delimited map key).
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: tenant-a, name: attacker}
          spec:
            ingressClassName: haproxy
            rules:
              - host: attacker.example.com
                http:
                  paths:
                    - path: "/a victim.example.com/secret"
                      pathType: Exact
                      backend: {service: {name: web, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has a path containing whitespace or control characters"

  test-ingress-path-injection-reconcile-warns-and-skips:
    description: On reconcile, a whitespace/newline path warns (Event) and the Ingress is skipped; the injected map line never appears while valid routes still render.
    extraContext: {renderMode: reconcile}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: web, namespace: tenant-a}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
        - apiVersion: v1
          kind: Service
          metadata: {name: good, namespace: tenant-b}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: tenant-a, name: attacker}
          spec:
            ingressClassName: haproxy
            rules:
              - host: attacker.example.com
                http:
                  paths:
                    - path: "/a\nvictim.example.com/secret BACKEND:tenant-a_evil_svc_web_80"
                      pathType: Exact
                      backend: {service: {name: web, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: tenant-b, name: legit}
          spec:
            ingressClassName: haproxy
            rules:
              - host: good.example.com
                http:
                  paths:
                    - path: /ok
                      pathType: Exact
                      backend: {service: {name: good, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-exact.map
        pattern: "(?m)^good\\.example\\.com/ok BACKEND:tenant-b_legit_svc_good_http$"
        description: "the valid route renders — scopes the absence assertions to a populated map"
      - type: not_contains
        target: map:path-exact.map
        pattern: "victim\\.example\\.com/secret"
        description: "the smuggled second line never appears in the routing map"
      - type: not_contains
        target: map:path-exact.map
        pattern: "attacker\\.example\\.com/a"
        description: "the hostile Ingress's own route is skipped too (the whole Ingress is rejected)"
      - type: contains
        target: events
        pattern: 'Warning InvalidPath networking\.k8s\.io/v1 Ingress tenant-a/attacker: .*whitespace or control characters'
        description: "the skipped Ingress gets an InvalidPath Warning naming it"
