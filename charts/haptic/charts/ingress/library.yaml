  test-ingress-endpoint-conditions-filter:
    description: |
      EndpointSlice entries with conditions.ready=false (pod starting up,
      not yet listening) or conditions.terminating=true (pod being shut
      down by kubelet) MUST be excluded from the rendered backend.
      Otherwise HAProxy dispatches requests to a not-yet-listening
      container (→ 503 SC-- during pod startup) or to a terminating
      container that has already stopped accepting connections
      (→ 503 SC-- during rolling restart drain window). Reproduces the
      single-replica rolling-restart 503 pattern observed in production.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: cond-svc, namespace: default}
          spec: *specPortsPort
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cond-svc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: cond-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-ready}
            - addresses: ["10.0.0.2"]
              conditions: {ready: false, serving: false, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-starting}
            - addresses: ["10.0.0.3"]
              conditions: {ready: false, serving: false, terminating: true}
              targetRef: {kind: Pod, name: cond-pod-terminating}
            # Absent conditions means Ready=true per the EndpointSlice spec.
            - addresses: ["10.0.0.4"]
              targetRef: {kind: Pod, name: cond-pod-noconds}
          ports:
            - {port: 8080, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: cond-test, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: cond-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: cond-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "server SRV_1 10\\.0\\.0\\.1:8080 .*enabled"}

      - {type: contains, target: haproxy.cfg, pattern: "server SRV_2 10\\.0\\.0\\.4:8080 .*enabled"}

      - {type: not_contains, target: haproxy.cfg, pattern: "10\\.0\\.0\\.2:8080"}

      - {type: not_contains, target: haproxy.cfg, pattern: "10\\.0\\.0\\.3:8080"}

