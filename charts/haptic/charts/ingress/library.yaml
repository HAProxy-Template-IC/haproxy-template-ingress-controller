_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ingress.enabled }}'
  inject:
    - path: watchedResources.ingresses.fieldSelector
      value: 'spec.ingressClassName={{ .Values.ingressClass.name }}'

# Lowest precedence: controller.config.templatingSettings.extraContext overrides these.
templatingSettings:
  extraContext:
    # Serve Ingress over HTTPS without spec.tls; no-op without a default certificate.
    ingressDefaultHTTPS: true
    # Only hosts actually served over HTTPS (default bind on, or spec.tls) redirect.
    ingressDefaultSSLRedirect: false
    # One of 301, 302, 303, 307, 308.
    ingressDefaultSSLRedirectCode: "308"

watchedResources:
  ingresses:
    apiVersion: networking.k8s.io/v1
    resources: ingresses
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
  services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]
  endpoints:
    apiVersion: discovery.k8s.io/v1
    resources: endpointslices
    indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
    # No debounce: a pod-IP rotation must reach HAProxy inside the kubelet Ready→SIGTERM window.
    debounceInterval: "0"

templateSnippets:

  features-100-ingress-bind:
    template: |
      {# needHTTPSTermination makes the terminating https frontend claim unmatched
          SNIs instead of the ssl-tcp passthrough frontend rejecting them. #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var tlsDefault bool = extraContext | dig("ingressDefaultHTTPS") | fallback(true) %}
      {%- var haveDefaultCert = tostring(extraContext | dig("tls", "defaultCertificate", "name") | fallback("")) != "" %}
      {%- var httpsByDefault = tlsDefault && haveDefaultCert %}
      {#- features-105-ingress-ssl-redirect reuses this gate. -#}
      {%- gf["ingressHTTPSByDefault"] = httpsByDefault %}
      {%- for _, ingress := range resources.ingresses.List() %}
      {%%
        gf["bindHTTPDefault"] = true
        gf["needHTTPFrontend"] = true
        if httpsByDefault || len(ingress.Spec.Tls) > 0 {
          gf["bindHTTPSDefault"] = true
          gf["needHTTPSFrontend"] = true
          gf["needHTTPSTermination"] = true
        }
      %%}
      {%- end %}

  features-100-ingress-tls:
    template: |
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%%
          var tlsList = ingress.Spec.Tls
          if len(tlsList) == 0 {
            continue
          }
        %%}
        {%- for _, tls := range tlsList %}
          {%%
            var secretName = tls.SecretName
            if secretName == "" {
              continue
            }
            var namespace = ingress.Metadata.Namespace
            if !first_seen("ingress_tls", namespace, secretName) {
              continue
            }

            var secret = resources.secrets.GetSingle(namespace, secretName)
            if secret == nil {
              continue
            }
            var tlsCrt, hasCrt = secret.Data["tls.crt"]
            var tlsKey, hasKey = secret.Data["tls.key"]
            if !hasCrt || !hasKey {
              continue
            }

            // HAProxy wants cert+key in one PEM; the pipe form drops b64decode's error.
            var combinedPem = (tlsCrt | b64decode()) + "\n" + (tlsKey | b64decode())

            var certFilename = namespace + "_" + secretName + ".pem"
            var certPath, certRegErr = fileRegistry.Register("cert", certFilename, combinedPem)
            if certRegErr != nil {
              fail("failed to register certificate " + certFilename + ": " + tostring(certRegErr))
            }

            // client-native sanitizes filenames on disk; the crt-list must match the real name.
            var sanitizedFilename = basename(certPath)

            var tlsCert = map[string]any{
              "secret_namespace": namespace,
              "secret_name": secretName,
              // ssl.yaml asserts .([]any) on tlsCertificates entries, which a typed
              // []string would panic on. toSlice() returns []any{} for nil.
              "sni_patterns": tls.Hosts | toSlice(),
              "sanitized_filename": sanitizedFilename,
            }
            gf["tlsCertificates"] = append(gf["tlsCertificates"].([]any), tlsCert)
          %%}
        {%- end %}
      {%- end %}

  features-105-ingress-ssl-redirect:
    template: |
      {%- var redirectAll bool = extraContext | dig("ingressDefaultSSLRedirect") | fallback(false) %}
      {%- if redirectAll %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var code = extraContext | dig("ingressDefaultSSLRedirectCode") | fallback("308") | tostring() %}
        {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" %}
          {{- fail("Invalid extraContext.ingressDefaultSSLRedirectCode '" + code + "': must be one of 301, 302, 303, 307, 308.") -}}
        {%- end %}
        {%- var httpsByDefault bool = gf | dig("ingressHTTPSByDefault") | fallback(false) %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {#- Gate per host: a bare host on a partly-TLS Ingress must not be
              redirected to a port it isn't served on. -#}
          {%- var tlsHosts = map[string]bool{} %}
          {%- for _, tls := range ingress.Spec.Tls %}
            {%- for _, h := range tls.Hosts %}
              {%- tlsHosts[toLower(h)] = true %}
            {%- end %}
          {%- end %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {%- var host = toLower(rule.Host) %}
              {%- if httpsByDefault || tlsHosts[host] %}
                {%- var redirectHosts []any = gf["sslRedirectHosts"] %}
                {%- gf["sslRedirectHosts"] = append(redirectHosts, map[string]any{"host": host, "code": code}) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}


  util-backend-name-ingress:
    template: |
      {% macro BackendNameIngress(ingress *resources.ingresses.T, path any) string %}{%%
        var namespace = ingress.Metadata.Namespace
        var name = ingress.Metadata.Name
        var serviceName = tostring(path | dig("backend", "service", "name") | fallback(""))
        var portName = tostring(path | dig("backend", "service", "port", "name") | fallback(""))
        var portNumber = path | dig("backend", "service", "port", "number") | fallback(0)

        if portName == "" && toint(portNumber) > 0 {
          var svc = resources.services.GetSingle(namespace, serviceName)
          if svc != nil {
            for _, sp := range svc.Spec.Ports {
              if toint(sp.Port) == toint(portNumber) {
                portName = sp.Name
                break
              }
            }
          }
        }

        var portIdentifier = portName
        if portIdentifier == "" {
          portIdentifier = tostring(portNumber)
        }

        show namespace + "_" + name + "_svc_" + serviceName + "_" + portIdentifier
      %%}{% end %}

  util-path-map-entry-ingress-shard:
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}

      {% macro PathMapEntryIngressShard(ingresses []*resources.ingresses.T, pathTypes []string, suffix string) string %}
        {#- Map keys are whitespace-delimited: a space/tab/newline in a path splits
            the line and smuggles a second entry (cross-tenant route hijack, #153).
            Reject the whole Ingress up front and skip it in BOTH the owner dedup
            and the emit loop, so a hostile value never claims a route nor emits.

            HAProxy maps hold one entry per key, so colliding host+path+slot claims
            resolve to one owner. Both the rejection scan and the ownership winner
            are global and identical for all three path maps and every shard, so
            they are computed once per render via shared.ComputeIfAbsent: three
            maps × N shards each rebuilding this over every Ingress was ~60% of the
            Ingress render at 3000 routes. gf["coLocatedIngresses"] is filled by the
            preceding haproxy.cfg render. -#}
        {%%
          var ownVal, _ = shared.ComputeIfAbsent("ingressPathOwnership", func() any {
            var rejected = map[string]bool{}
            for _, ring := range resources.ingresses.List() {
              var rid = ring.Metadata.Namespace + "/" + ring.Metadata.Name
              for _, rrule := range ring.Spec.Rules {
                for _, rpath := range rrule.Http.Paths {
                  if rpath.Path != "" && !rejected[rid] && (regex_search(rpath.Path, "[[:cntrl:]]") || strings_contains(rpath.Path, " ")) {
                    rejected[rid] = true
                    _ = WebhookRejectOrWarn(ring, "InvalidPath", "Ingress '" + rid + "' has a path containing whitespace or control characters, which cannot be written to the routing map; the route is not applied. Remove spaces, tabs and newlines from spec.rules[].http.paths[].path.")
                  }
                }
              }
            }
            var owner = map[string]string{}
            var ownerTs = map[string]string{}
            var ownerIsCanary = map[string]bool{}
            var gf = shared.Get("globalFeatures").(map[string]any)
            var coLocated = gf["coLocatedIngresses"]
            for _, ing := range resources.ingresses.List() {
              var oid = ing.Metadata.Namespace + "/" + ing.Metadata.Name
              if rejected[oid] {
                continue
              }
              var isCanary = false
              if coLocated != nil {
                var _, present = coLocated.(map[string]any)[oid]
                isCanary = present
              }
              var ts = ing.Metadata.CreationTimestamp
              for _, rule := range ing.Spec.Rules {
                for _, path := range rule.Http.Paths {
                  if path.Path != "" {
                    var oslot = tostring(path.PathType)
                    if oslot == "ImplementationSpecific" {
                      oslot = "Prefix"
                    }
                    // The emit stage strips the trailing slash for Prefix, so /foo and
                    // /foo/ share an owner key. Exact matches character-wise; slash kept.
                    var opath = path.Path
                    if oslot != "Exact" && len(opath) > 1 && hasSuffix(opath, "/") {
                      opath = opath[:len(opath)-1]
                    }
                    var okey = oslot + "|" + MapKeyForHost(rule.Host) + opath
                    var curId, seen = owner[okey]
                    var take = false
                    if !seen {
                      take = true
                    } else if ownerIsCanary[okey] && !isCanary {
                      // A canary only overlays a split; the main owns the base route.
                      take = true
                    } else if ownerIsCanary[okey] == isCanary {
                      if ts < ownerTs[okey] || (ts == ownerTs[okey] && oid < curId) {
                        take = true
                      }
                    }
                    // A canary with no main still owns (and serves) its own route.
                    if take {
                      owner[okey] = oid
                      ownerTs[okey] = ts
                      ownerIsCanary[okey] = isCanary
                    }
                  }
                }
              }
            }
            return map[string]any{"owner": owner, "rejected": rejected}
          })
          var own = ownVal.(map[string]any)
          var owner = own["owner"].(map[string]string)
          var rejected = own["rejected"].(map[string]bool)
          var coLocated = shared.Get("globalFeatures").(map[string]any)["coLocatedIngresses"]
        %%}
        {%- for _, ingress := range ingresses -%}
          {%- var id = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if rejected[id] -%}{%- continue -%}{%- end -%}
          {%- var matchCount = 0 -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- if path.Path != "" -%}
                {%- for _, checkType := range pathTypes -%}
                  {%- if path.PathType == checkType -%}
                    {%- var cslot = tostring(path.PathType) -%}
                    {%- if cslot == "ImplementationSpecific" -%}{%- cslot = "Prefix" -%}{%- end -%}
                    {%- var cpath = path.Path -%}
                    {%- if cslot != "Exact" && len(cpath) > 1 && hasSuffix(cpath, "/") -%}{%- cpath = cpath[:len(cpath)-1] -%}{%- end -%}
                    {%- var cwinner = owner[cslot + "|" + MapKeyForHost(rule.Host) + cpath] -%}
                    {%- if cwinner == id -%}
                      {%- matchCount = matchCount + 1 -%}
                    {%- else -%}
                      {#- recordEvent is shard-safe; EventCollector dedups the pfxexact
                          and prefix passes. Kept in the count loop, before the matchCount
                          gate, so it fires for an Ingress that owns no route at all. -#}
                      {%%
                        var loserCoLocated = false
                        if coLocated != nil {
                          var _, lc = coLocated.(map[string]any)[id]
                          loserCoLocated = lc
                        }
                        if !loserCoLocated {
                          recordEvent(ingress, "RouteConflict",
                            "host \""+rule.Host+"\" path \""+path.Path+"\" ("+
                              tostring(path.PathType)+") is already served by Ingress "+
                              cwinner+", which takes precedence; this Ingress's route is not applied")
                        }
                      %%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {%- if matchCount > 0 -%}
      {{ "\n" }}# Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ matchCount }} paths)
            {%- for _, rule := range ingress.Spec.Rules -%}
              {%- for _, path := range rule.Http.Paths -%}
                {%- if path.Path != "" -%}
                  {%- for _, checkType := range pathTypes -%}
                    {%- if path.PathType == checkType -%}
                      {%- var eslot = tostring(path.PathType) -%}
                      {%- if eslot == "ImplementationSpecific" -%}{%- eslot = "Prefix" -%}{%- end -%}
                      {%- var epath = path.Path -%}
                      {%- if eslot != "Exact" && len(epath) > 1 && hasSuffix(epath, "/") -%}{%- epath = epath[:len(epath)-1] -%}{%- end -%}
                      {%- if owner[eslot + "|" + MapKeyForHost(rule.Host) + epath] != id -%}{%- continue -%}{%- end -%}
                      {%- var pathStr = ValidateConfigValue(path.Path, "spec.rules[].http.paths[].path", id, false) -%}
                      {%- if suffix == "" && pathStr == "/" -%}{%- continue -%}{%- end -%}
                      {%- var actualSuffix = suffix -%}
                      {%- if suffix == "/" && hasSuffix(pathStr, "/") -%}{%- actualSuffix = "" -%}{%- end -%}
                      {#- pfxexact strips the trailing slash so /foo/ Prefix's boundary
                         entry is /foo. Exact must NOT strip: K8s conformance requires an
                         Exact /foo/ to reject request /foo. -#}
                      {%- if path.PathType != "Exact" && suffix == "" && len(pathStr) > 1 && hasSuffix(pathStr, "/") -%}{%- pathStr = pathStr[:len(pathStr)-1] -%}{%- end -%}
      {{ "\n" }}{{ MapKeyForHost(rule.Host) }}{{ pathStr }}{{ actualSuffix }} BACKEND:{{ BackendNameIngress(ingress, path) }}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}


  util-sharded-path-map-entry-ingress:
    template: |
      {%- import "util-path-map-entry-ingress-shard" for PathMapEntryIngressShard -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedPathMapEntryIngress(pathTypes []string, suffix string) string %}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- var n = toint(CalculateShardCount(len(allIngresses), 100)) -%}
      {%- if n <= 1 || len(allIngresses) < 100 -%}
      {{ PathMapEntryIngressShard(allIngresses, pathTypes, suffix) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go PathMapEntryIngressShard(shard_slice(allIngresses, i, n), pathTypes, suffix) }}
      {%- end -%}
      {%- end -%}
      {% end %}


  util-generate-backends-ingress:
    template: |
      {%- import "util-backend" for Backend, AppendLines, DefaultServerArgs -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {#- The profile carries the two uniform set-timeout rules (identical across
          every ingress backend → one shared profile for the plain case) plus any
          defaults-legal lines a snippet declared on serverOpts["profile"]. The
          per-server keywords (check, ssl, maxconn, …) are passed to Backend() as
          the structured `defaultServer` (DefaultServerArgs), so they sit on the
          profile's default-server line AND appear in the plan record — the deploy
          side composes `add server` from the record, not the profile text. The
          body carries only structural directives (stick-table, filter, raw
          injections); an empty body is a dynamic-eligible backend. -#}
      {%- var IngressProfile = func(serverOpts map[string]any, beTimeoutSrv string, beTimeoutTun string) []any {
        var profile = []any{beTimeoutSrv, beTimeoutTun}
        for _, l := range toSlice(serverOpts["profile"]) {
          profile = append(profile, l)
        }
        return profile
      } -%}
      {%- var IngressBody = func(serverOpts map[string]any, directives []any) []any {
        var body = []any{}
        for _, l := range toSlice(serverOpts["body"]) {
          body = append(body, l)
        }
        for _, l := range directives {
          body = append(body, l)
        }
        return body
      } -%}
      {% macro GenerateIngressBackends(ingresses []*resources.ingresses.T) string %}
        {#- Two uniform, byte-identical set-timeout lines every backend carries:
            the value is read from backend-timeouts.map keyed on the backend, so a
            timeout annotation add/edit is a map-only, reload-free change. `server`
            and `tunnel` are the only settable timeouts; the rest stay per-value. -#}
        {%- var toMap, _ = pathResolver.GetPath("backend-timeouts.map", "map") -%}
        {%- var beTimeoutSrv = "http-request set-timeout server var(txn.backend_name),concat(|server),map_str_int(" + tostring(toMap) + ") if { var(txn.backend_name),concat(|server),map_str_int(" + tostring(toMap) + ") -m found }" -%}
        {%- var beTimeoutTun = "http-request set-timeout tunnel var(txn.backend_name),concat(|tunnel),map_str_int(" + tostring(toMap) + ") if { var(txn.backend_name),concat(|tunnel),map_str_int(" + tostring(toMap) + ") -m found }" -%}
        {%- for _, ingress := range ingresses -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var svcName = path.Backend.Service.Name -%}
              {%- if svcName != "" -%}
                {%- var resolvedParts = split(ResolveServicePort(ns, svcName, path.Backend.Service.Port), " ") -%}
                {%- var port = toint(resolvedParts[0]) -%}
                {%- var portName = resolvedParts[1] -%}
                {%- var portId = portName -%}
                {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
                {%- if first_seen("ingress_backend", ns, name, svcName, portId) -%}
                  {%- var backendKey = BackendNameIngress(ingress, path) -%}
                  {%- var serverOpts = map[string]any{"flags": []any{}, "profile": []any{}, "body": []any{}} -%}
                  {%- var directives = AppendLines([]any{}, render_glob "backend-directives-*" inherit_context) -%}
                  {%- var profile = IngressProfile(serverOpts, beTimeoutSrv, beTimeoutTun) -%}
                  {%- var body = IngressBody(serverOpts, directives) -%}
      {{ Backend(map[string]any{
           "name": backendKey,
           "guid": make_guid("be", backendKey),
           "comments": []any{"# Backend for: Ingress " + ns + "/" + name + " → Service " + svcName + ":" + tostring(port)},
           "balance": serverOpts | dig("balance") | fallback(nil),
           "hashType": serverOpts | dig("hashType") | fallback(nil),
           "shape": serverOpts | dig("shape") | fallback(nil),
           "defaultServer": DefaultServerArgs(serverOpts),
           "profile": profile,
           "body": body,
           "servers": BackendServers(svcName, 0, port, serverOpts, portName, backendKey, ns),
         }) }}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {%- var dbSvcName = ingress.Spec.DefaultBackend.Service.Name -%}
          {%- if dbSvcName != "" -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} -%}
            {%- var resolvedParts = split(ResolveServicePort(ns, dbSvcName, ingress.Spec.DefaultBackend.Service.Port), " ") -%}
            {%- var port = toint(resolvedParts[0]) -%}
            {%- var portName = resolvedParts[1] -%}
            {%- var portId = portName -%}
            {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
            {%- if first_seen("ingress_backend", ns, name, dbSvcName, portId) -%}
              {%- var backendKey = BackendNameIngress(ingress, path) -%}
              {%- var serverOpts = map[string]any{"flags": []any{}, "profile": []any{}, "body": []any{}} -%}
              {%- var directives = AppendLines([]any{}, render_glob "backend-directives-*" inherit_context) -%}
              {%- var profile = IngressProfile(serverOpts, beTimeoutSrv, beTimeoutTun) -%}
              {%- var body = IngressBody(serverOpts, directives) -%}
      {{ Backend(map[string]any{
           "name": backendKey,
           "guid": make_guid("be", backendKey),
           "comments": []any{"# Default backend for: Ingress " + ns + "/" + name + " → Service " + dbSvcName + ":" + tostring(port)},
           "balance": serverOpts | dig("balance") | fallback(nil),
           "hashType": serverOpts | dig("hashType") | fallback(nil),
           "shape": serverOpts | dig("shape") | fallback(nil),
           "defaultServer": DefaultServerArgs(serverOpts),
           "profile": profile,
           "body": body,
           "servers": BackendServers(dbSvcName, 0, port, serverOpts, portName, backendKey, ns),
         }) }}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}

  util-sharded-backends-ingress:
    template: |
      {%- import "util-generate-backends-ingress" for GenerateIngressBackends -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressBackends(ingresses []*resources.ingresses.T) string %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressBackends(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressBackends(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  backends-500-ingress:
    template: |
      {%- import "util-sharded-backends-ingress" for ShardedIngressBackends -%}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- if len(allIngresses) > 0 %}
      # ingress/backends-ingress
      {{ ShardedIngressBackends(allIngresses) }}
      {%- end -%}
  util-generate-host-map-ingress:
    template: |
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- macro GenerateIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- for _, ingress := range ingresses -%}
      {%- var rules = ingress.Spec.Rules %}
      {%- var rulesWithHttp = selectattr(rules, "http") %}
      {%- if len(rulesWithHttp) > 0 %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ len(rulesWithHttp) }} hosts)
      {% for _, rule := range rulesWithHttp %}
      {%- var hostKey = MapKeyForHost(rule | dig("host")) %}
      {{ hostKey }} {{ hostKey }}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-host-map-ingress:
    template: |
      {%- import "util-generate-host-map-ingress" for GenerateIngressHostMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
      {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressHostMap(ingresses) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressHostMap(shard_slice(ingresses, i, n)) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-host-500-ingress:
    template: |
      {%- import "util-sharded-host-map-ingress" for ShardedIngressHostMap %}
      {%- var allIngresses = resources.ingresses.List() %}
      {%- if len(allIngresses) > 0 %}
      # ingress/map-host-ingress
      {{ ShardedIngressHostMap(allIngresses) }}
      {%- end -%}

  map-path-exact-500-ingress:
    template: |
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-exact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Exact"}, "") }}

  map-pfxexact-500-ingress:
    template: |
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-pfxexact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "") }}

  map-path-prefix-500-ingress:
    template: |
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-prefix-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "/") }}

  map-path-prefix-501-ingress-default:
    template: |
      {# map_beg longest-prefix match picks the most-specific rule entry first, so
         these catch-alls only fire when no rule path matched. NEWEST wins per host
         (rule routes are oldest-wins): a being-deleted Ingress would otherwise keep
         the catch-all and serve 503s. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- var candidates = []any{} -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- if ingress.Spec.DefaultBackend.Service -%}
          {%- var ts = ingress.Metadata.CreationTimestamp -%}
          {%- var rules = ingress.Spec.Rules -%}
          {%- if len(rules) == 0 -%}
            {%- candidates = append(candidates, map[string]any{"hostKey": "", "ingress": ingress, "ts": ts}) -%}
          {%- else -%}
            {%- for _, rule := range rules -%}
              {%- var hostKey = MapKeyForHost(rule.Host) -%}
              {%- candidates = append(candidates, map[string]any{"hostKey": hostKey, "ingress": ingress, "ts": ts}) -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- if len(candidates) > 0 -%}
        {%- var sorted = candidates | sort_by([]string{"$.ts:desc"}) -%}
        {%- for _, cand := range sorted -%}
          {%- var hostKey = tostring(cand["hostKey"]) -%}
          {%- if first_seen("ingress_default_host", hostKey) -%}
            {#- Scriggo miscompiles the implicit any → *T conversion at a typed macro
                parameter; the explicit assertion takes the standard emit path. -#}
            {%- var ingress = cand["ingress"].(*resources.ingresses.T) -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} (defaultBackend → "{{ hostKey }}/")
      {{ hostKey }}/ BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end -%}
        {%- end -%}
      {%- end %}


  # Shared contributor the annotation libraries call from their map-* snippets to
  # feed backend-timeouts.map (`<backend>|server` / `<backend>|tunnel` -> ms).
  # The value is parsed to integer ms here — the render-time validator that
  # replaces the `haproxy -c` parse the timeout loses by moving into the map — so
  # each library is one call. RULE #1: it sees two annotation names, not a kind.
  # Feeds backend-service.map (<backend> -> <ns>/<svc>) so the namespace/service
  # access-log fields need no per-backend `set-var` lines — which is what lets an
  # ingress backend stay dynamic (empty body). Mirrors the generator's iteration
  # and backend naming, deduped per backend name.
  map-backend-service-100-ingress:
    requires: [ingresses]
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%%
        var lines = []string{}
        for _, ingress := range resources.ingresses.List() {
          var ns = ingress.Metadata.Namespace
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              var svc = path.Backend.Service.Name
              if svc == "" {
                continue
              }
              var be = BackendNameIngress(ingress, path)
              if first_seen("map-backend-service", be) {
                lines = append(lines, be + " " + ns + "/" + svc)
              }
            }
          }
          var dbSvc = ingress.Spec.DefaultBackend.Service.Name
          if dbSvc != "" {
            var dbPath = map[string]any{"backend": ingress.Spec.DefaultBackend}
            var be = BackendNameIngress(ingress, dbPath)
            if first_seen("map-backend-service", be) {
              lines = append(lines, be + " " + ns + "/" + dbSvc)
            }
          }
        }
        if len(lines) > 0 {
          show "\n" + join(lines, "\n")
        }
      %%}

  util-ingress-backend-timeout:
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-haproxy-duration" for HAProxyDurationMs -%}
      {% macro IngressBackendTimeoutMapEntries(serverAnn string, tunnelAnn string) %}
      {%%
        var anns = []string{serverAnn, tunnelAnn}
        var kinds = []string{"server", "tunnel"}
        var lines = []string{}
        for i := 0; i < len(anns); i++ {
          var ann = anns[i]
          var kind = kinds[i]
          if ann == "" {
            continue
          }
          for _, ingress := range resources.ingresses.List() {
            var v = ingress.Metadata.Annotations[ann]
            if v == "" {
              continue
            }
            var ms = HAProxyDurationMs(v)
            if ms == "" {
              var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name
              _ = WebhookRejectOrWarn(ingress, "InvalidTimeout", "Annotation '" + ann + "' on Ingress '" + key + "' has value '" + v + "', which is not an HAProxy duration; the timeout is not applied. Use a value like 30s, 1m or 2000ms.")
              continue
            }
            for _, rule := range ingress.Spec.Rules {
              for _, path := range rule.Http.Paths {
                var be = BackendNameIngress(ingress, path)
                if first_seen("map-backend-timeout", be, kind) {
                  lines = append(lines, be + "|" + kind + " " + ms)
                }
              }
            }
          }
        }
        if len(lines) > 0 {
          show "\n" + join(lines, "\n")
        }
      %%}
      {% end %}

  # Shared contributor the annotation libraries call from their features-*
  # snippets to feed the ing-reqhdr.map / ing-reshdr.map machinery below. Parses
  # the `<name><kvSep><value>` records a header annotation carries (records split
  # on recordSep, name/value on the first kvSep) and appends {backend, op, name,
  # value} to gf, once per (backend, name) so two paths of one Ingress share the
  # entry. All parsing lives here so each library is one call — RULE #1: it sees
  # annotation names and separators, the same shape any resource library needs.
  util-ingress-header-contribute:
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {% macro IngressHeaderContribute(reqAnn string, respAnn string, recordSep string, kvSep string) %}
      {%%
        var gf = shared.Get("globalFeatures").(map[string]any)
        for _, ingress := range resources.ingresses.List() {
          var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name
          var contribute = func(ann string, bucket string) {
            if ann == "" {
              return
            }
            var annVal = ingress.Metadata.Annotations[ann]
            if annVal == "" {
              return
            }
            for _, rec := range split(annVal, recordSep) {
              var t = trimSpace(rec)
              if t == "" || !strings_contains(t, kvSep) {
                continue
              }
              var parts = split(t, kvSep)
              var hn = trimSpace(parts[0])
              var hv = trimSpace(parts[1:] | join(kvSep))
              if hn == "" {
                continue
              }
              // The name lands in the directive AND inside the map key, where `|`
              // is the delimiter — validate against the exact charset
              // HeaderModifierRules emits a line for, so a non-emittable name is
              // reported here rather than dropped without a line at request time.
              if !regex_search(hn, "^[A-Za-z0-9!$&*+.^_~-]+$") {
                _ = WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation '" + ann + "' on Ingress '" + key + "' names header '" + hn + "', which is not an HTTP token; the header is skipped. Use letters, digits and -._~!$&*+^.")
                continue
              }
              if ConfigInjectionKind(hv, "line") != "" {
                _ = WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation '" + ann + "' on Ingress '" + key + "' has a value containing " + ConfigInjectionKind(hv, "line") + ", which would split the frontend directive; the header is not applied. Remove control characters from the value.")
                continue
              }
              for _, rule := range ingress.Spec.Rules {
                for _, path := range rule.Http.Paths {
                  var be = BackendNameIngress(ingress, path)
                  // Dedup on the lowercased name: the map key is lowercased, so
                  // `X-Foo` and `x-foo` on one backend are one entry, deterministically.
                  if first_seen("ing-header-mod", bucket, be, toLower(hn)) {
                    gf[bucket] = append(toSlice(gf[bucket]), map[string]any{"backend": be, "op": "set", "name": hn, "value": hv})
                  }
                }
              }
            }
          }
          contribute(reqAnn, "ingReqHeaderMods")
          contribute(respAnn, "ingRespHeaderMods")
        }
      %%}
      {% end %}

  # Reload-free ingress request/response header modifiers. The annotation
  # libraries append {backend, op, name, value} to gf["ingReqHeaderMods"] /
  # gf["ingRespHeaderMods"] in their features-* snippets; this builds
  # ing-reqhdr.map / ing-reshdr.map (key `<backend>|<op>|<name>`, value
  # URL-encoded, `1` for del) once per render and emits one static set/add/del
  # line per distinct header NAME, keyed on the resolved backend. Adding a route
  # that reuses a header name is then a map entry, not a config line — the reload
  # this machinery avoids. The maps are registered whenever ingresses exist, so
  # the first header in the cluster is a map entry too, and the static lines read
  # backend_name, so a backendRef-style per-backend override is a map entry.
  frontend-filters-263-ingress-headers:
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- import "util-header-modifier-rules" for HeaderModifierRules -%}
      {%- if len(resources.ingresses.List()) == 0 %}{% return %}{% end -%}
      {%%
        // Capture the result of the single compute call directly — do not follow
        // it with a `func() any { return nil }` read-back, which would cache nil
        // permanently for this render if it ever ran before the write.
        var hmVal, _ = shared.ComputeIfAbsent("ingressHeaderMaps", func() any {
          var gf = shared.Get("globalFeatures").(map[string]any)
          // Smallest spelling per lowercased name wins, so two ingresses spelling
          // one header differently share one static line and the choice does not
          // depend on ingress order. `1` marks a del; set/add carry the value.
          var build = func(mods any, mapName string) map[string]any {
            var names = map[string]any{"set": map[string]string{}, "add": map[string]string{}, "del": map[string]string{}}
            var entries = []string{"# <backend>|set|add|del|<header> -> URL-encoded value (1 for del)"}
            for _, e := range toSlice(mods) {
              var be = tostring(dig(e, "backend"))
              var op = tostring(dig(e, "op"))
              var name = tostring(dig(e, "name"))
              var lower = toLower(name)
              var m = names[op].(map[string]string)
              var cur, seen = m[lower]
              if !seen || name < cur {
                m[lower] = name
              }
              if op == "del" {
                entries = append(entries, be + "|del|" + lower + " 1")
              } else {
                entries = append(entries, be + "|" + op + "|" + lower + " " + queryEscape(tostring(dig(e, "value"))))
              }
            }
            var display = func(op string) []string {
              var m = names[op].(map[string]string)
              var lowered = []any{}
              for _, k := range keys(m) {
                lowered = append(lowered, k)
              }
              var out = []string{}
              for _, k := range sort_strings(lowered) {
                out = append(out, m[tostring(k)])
              }
              return out
            }
            return map[string]any{"path": RegisterMap(mapName, entries, map[string]any{"ordered": false}),
              "set": display("set"), "add": display("add"), "del": display("del")}
          }
          return map[string]any{"req": build(gf["ingReqHeaderMods"], "ing-reqhdr.map"),
            "res": build(gf["ingRespHeaderMods"], "ing-reshdr.map")}
        })
      %%}
      {%- var hm = hmVal.(map[string]any) %}
      {%- var req = hm["req"].(map[string]any) %}
      {%- var res = hm["res"].(map[string]any) %}
      {{- HeaderModifierRules("request", "var(txn.backend_name)", tostring(req["path"]), req["set"].([]string), req["add"].([]string), req["del"].([]string)) -}}
      {{- HeaderModifierRules("response", "var(txn.backend_name)", tostring(res["path"]), res["set"].([]string), res["add"].([]string), res["del"].([]string)) -}}

  util-generate-ingress-status-patches:
    template: |
      {# statusPatch is mutex-guarded, so this is safe under the sharded go render. #}
      {% macro GenerateIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var addresses = gf["addresses"] %}
        {%- for _, ingress := range ingresses %}
          {%%
            var namespace = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name

            statusPatch(namespace, name,
              "networking.k8s.io/v1", "Ingress",
              map[string]interface{}{
                "deployed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": addresses,
                  },
                },
                "deployFailed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": []any{},
                  },
                },
              })
          %%}
        {%- end %}
      {% end %}

  util-sharded-ingress-status-patches:
    template: |
      {%- import "util-generate-ingress-status-patches" for GenerateIngressStatusPatches -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressStatusPatches(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressStatusPatches(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  status-patches-200-ingress:
    template: |
      {# gf["addresses"] comes from features-075-address-discovery. #}
      {%- import "util-sharded-ingress-status-patches" for ShardedIngressStatusPatches -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- if gf["addresses"] != nil %}
        {%- var allIngresses = resources.ingresses.List() -%}
        {%- if len(allIngresses) > 0 -%}
          {{- ShardedIngressStatusPatches(allIngresses) -}}
        {%- end -%}
      {%- end %}

k8sResources:
  # Ingress status has no conditions field, so a Warning Event is the only
  # operator-visible surface for a by-name backend left empty (no server
  # lines). Its degradedBackendRef:<ns>/<svc>/<port> keys are written by
  # BackendServers (base.yaml) during the haproxy.cfg render, which precedes
  # every k8sResources render.
  ingress-degraded-backend-events:
    template: |
      {%%
        var docs = []any{}
        for _, ingress := range resources.ingresses.List() {
          var ns = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          if ns == "" || name == "" {
            continue
          }

          // Spec walk must mirror GenerateIngressBackends: rule paths plus defaultBackend.
          var refs = ingress.Spec.Rules | flat_map(r => r.Http.Paths) | map(p => p.Backend.Service)
          refs = append(refs, ingress.Spec.DefaultBackend.Service)
          var degraded = refs |
            reject(s => s.Name == "" || s.Port.Name == "") |
            unique_by(s => s.Name + "/" + s.Port.Name) |
            filter(s => shared.Get("degradedBackendRef:" + ns + "/" + s.Name + "/" + s.Port.Name) != nil) |
            map(s => "Service '" + ns + "/" + s.Name + "' (port name '" + s.Port.Name + "')")
          if len(degraded) == 0 {
            continue
          }

          // Bounded to 253 chars; an Ingress name alone may already reach it.
          var evName = name + ".backend-unresolved"
          if len(evName) > 253 {
            // Hash-only, not truncated: a byte-truncated prefix can end on '.', making
            // the next label start with '-' (invalid DNS-1123) and failing every SSA.
            evName = "backend-unresolved-" + sha256(name)[:32]
          }

          // 20-minute bucket: stable within a bucket (no apply churn), changes
          // across buckets to refresh the apiserver's event TTL (--event-ttl, 1h).
          var bucket = now().UTC().Unix() / 1200 * 1200
          var lastSeen = unixTime(bucket, 0).UTC().Format("2006-01-02T15:04:05Z07:00")

          var resource = map[string]any{
            "apiVersion": "v1",
            "kind":       "Event",
            "metadata": map[string]any{
              "name":      evName,
              "namespace": ns,
            },
            "involvedObject": map[string]any{
              "apiVersion": "networking.k8s.io/v1",
              "kind":       "Ingress",
              "namespace":  ns,
              "name":       name,
              "uid":        ingress.Metadata.Uid,
            },
            "type":   "Warning",
            "reason": "BackendUnresolved",
            "message": "Backend " + join(degraded, ", ") +
              " not found: a by-name port reference resolves only through the" +
              " Service, so the backend has no endpoints and serves 503 until" +
              " the Service appears. If it never appears, check the Ingress" +
              " backend for a Service-name typo.",
            "lastTimestamp": lastSeen,
            "source": map[string]any{
              "component": "haptic",
            },
          }
          var rendered, _ = marshalYAML(resource)
          docs = append(docs, rendered)
        }
      %%}
      {%- for i, doc := range docs -%}
      {%- if i > 0 %}{{ "---" }}
      {% end %}
      {{ doc }}
      {%- end %}

validationTests:
  test-render-plan-many-backends-leave-no-tokens:
    description: >-
      Every generated backend is registered and spliced back in place: the
      sections are complete and no placeholder line reaches HAProxy.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: shop-svc, namespace: default}
          spec:
            ports: [{name: http, port: 80, targetPort: 8080}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: plan-a, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: a.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: shop-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: plan-b, namespace: default}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: shop-svc, port: {number: 80}}}
            rules:
              - host: b.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "@haptic:"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend default_plan-a_svc_shop-svc_http from haptic-be-\w+$\n\s+guid be:default_plan-a_svc_shop-svc_http$'
      - {type: contains, target: haproxy.cfg, pattern: "backend default_plan-b_svc_echo_80"}
      - {type: contains, target: haproxy.cfg, pattern: "backend default_plan-b_svc_shop-svc_http"}

  test-ingress-duplicate-backend-different-ports:
    description: Ingress with multiple paths to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-svc, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
              - {name: admin, port: 81, targetPort: 8081}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: multi-port, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 80}}}
                    - path: /admin
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 81}}}
                    - path: /app
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend default_multi-port_svc_api-svc_http"}

      - {type: contains, target: haproxy.cfg, pattern: "backend default_multi-port_svc_api-svc_admin"}

      - type: match_count
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_"
        expected: "2"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/api/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/admin/ BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/app/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/api BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/admin BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/app BACKEND:default_multi-port_svc_api-svc_http"

      - {type: not_contains, target: map:host.map, pattern: "hosts\\)\\S"}

      - {type: not_contains, target: map:path-prefix.map, pattern: "paths\\)\\S"}

      - {type: not_contains, target: map:path-prefix-exact.map, pattern: "paths\\)\\S"}

      - {type: contains, target: map:host.map, pattern: "(?m)^example\\.com example\\.com$"}

      - {type: contains, target: map:path-prefix.map, pattern: "(?m)^example\\.com/api/ BACKEND:"}

      - {type: contains, target: map:path-prefix-exact.map, pattern: "(?m)^example\\.com/api BACKEND:"}

  test-ingress-tls-basic:
    description: Ingress with spec.tls should register TLS certificates
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: example-tls, namespace: default}
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: tls-ingress, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - example.com
                  - www.example.com
                secretName: example-tls
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "default_example-tls\\.pem \\[ocsp-update on\\] example\\.com www\\.example\\.com"

      - {type: contains, target: cert:default_example-tls.pem, pattern: "BEGIN CERTIFICATE"}

  test-ingress-default-https:
    description: "A plain Ingress with no spec.tls is served over HTTPS by default — the chart binds its https port and terminates TLS with the default certificate (extraContext.ingressDefaultHTTPS defaults true). See features-100-ingress-bind."
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^frontend https$"}
      - {type: contains, target: haproxy.cfg, pattern: "bind \\*:443 ssl crt-list"}

  test-ingress-default-https-disabled:
    description: "extraContext.ingressDefaultHTTPS=false keeps a plain Ingress (no spec.tls) plaintext-only — no https frontend is emitted even though the default certificate is configured. See features-100-ingress-bind."
    extraContext: {ingressDefaultHTTPS: false}
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^frontend https$"}

  test-ingress-default-ssl-redirect:
    description: "extraContext.ingressDefaultSSLRedirect=true redirects every HTTPS-served Ingress host from HTTP to HTTPS with the configured code (default 308), reusing the shared ssl-redirect map. See features-105-ingress-ssl-redirect."
    extraContext: {ingressDefaultSSLRedirect: true}
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect scheme https code 308 if !\\{ ssl_fc \\}"
      - {type: contains, target: map:ssl-redirect-308.map, pattern: "(?m)^plain\\.example\\.com 1$"}

  test-ingress-default-ssl-redirect-disabled:
    description: "By default (ingressDefaultSSLRedirect unset) an HTTPS-served Ingress emits no global HTTP→HTTPS redirect — the feature is opt-in. See features-105-ingress-ssl-redirect."
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "redirect scheme https"}

  test-ingress-default-ssl-redirect-per-host:
    description: "With the default-HTTPS bind off (ingressDefaultHTTPS=false), the global redirect only registers hosts that carry their own certificate: a partly-TLS Ingress redirects its spec.tls host but not its bare host, which isn't served over HTTPS. See features-105-ingress-ssl-redirect."
    extraContext: {ingressDefaultHTTPS: false, ingressDefaultSSLRedirect: true}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
