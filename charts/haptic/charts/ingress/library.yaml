            - addresses: ["10.0.1.9"]
              targetRef: {kind: Pod, name: pool-twelve-pod-9}
            - addresses: ["10.0.1.10"]
              targetRef: {kind: Pod, name: pool-twelve-pod-10}
            - addresses: ["10.0.1.11"]
              targetRef: {kind: Pod, name: pool-twelve-pod-11}
            - addresses: ["10.0.1.12"]
              targetRef: {kind: Pod, name: pool-twelve-pod-12}
          ports:
            - {port: 8080, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: slot-pool-grows-to-fit
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: pool-twelve.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pool-twelve, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "server SRV_12 10\\.0\\.1\\.12:8080"}
      - {type: match_count, target: haproxy.cfg, pattern: "server SRV_[0-9]+ 10\\.0\\.1\\.[0-9]+:8080 guid srv:default_slot-pool-grows-to-fit_svc_pool-twelve_80:", expected: "12"}
      - {type: match_count, target: haproxy.cfg, pattern: "guid srv:default_slot-pool-grows-to-fit_svc_pool-twelve_80:SRV_[0-9]+ ", expected: "15"}
  test-ingress-slot-pool-annotation-is-block-size:
    description: |
      scale-server-slots is a block size (haproxytech semantics), not a cap: 6 pods with block 5 get 6 + 2 free rounded up to 10; nobody is dropped. Uses the native haproxy-haptic.org prefix (enabled by default) so every chart profile runs it.
