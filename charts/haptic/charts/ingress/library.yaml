          endpoints:
            - addresses: ["10.0.0.10"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: slow-pod}
          ports:
            - {name: metrics, port: 9090, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: race, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: race.example.com
                http:
                  paths:
                    - path: /fast
                      pathType: Prefix
                      backend: {service: {name: svc-fast, port: {name: http}}}
                    - path: /slow
                      pathType: Prefix
                      backend: {service: {name: svc-slow, port: {name: http}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "server SRV_1 10\\.0\\.0\\.9:8080 .*enabled"}

      - {type: not_contains, target: haproxy.cfg, pattern: "10\\.0\\.0\\.10"}

      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_[0-9]+ \\S+:0"}

      - {type: contains, target: "k8s:ingress-degraded-backend-events", pattern: "default/svc-slow"}
      - {type: not_contains, target: "k8s:ingress-degraded-backend-events", pattern: "default/svc-fast"}

  test-ingress-degraded-backend-event-multiple:
