        pattern: "# Backend for: Ingress default/unifi → Service unifi:8443"

      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.42:80 "

  test-ingress-named-port-skips-portless-slices:
    description: |
      A Service selector may also match pods that do not expose its named
      targetPort. Kubernetes places those endpoints in a separate EndpointSlice
      without that port. HAPTIC must skip the slice instead of falling back to
      the Service port and sending application traffic to the unrelated pod.
    fixtures:
      services:
