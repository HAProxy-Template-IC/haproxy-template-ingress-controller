          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-a
            namespace: team-a
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /cart
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-a
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-b
            namespace: team-b
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /account
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-b
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/cart/ BACKEND:team-a_route-a_svc_svc-a_http$"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/account/ BACKEND:team-b_route-b_svc_svc-b_http$"

  test-ingress-implementation-specific-shares-slot-oldest-wins:
    description: "pathType Prefix and ImplementationSpecific render into the same path maps (they share a routing slot), so two Ingresses claiming the same host+path with those two path types collide. The owner computation collapses ImplementationSpecific to Prefix, so oldest-wins resolves the collision to a single map entry — the older Prefix Ingress here. If the two path types were treated as distinct slots, both would emit into path-prefix.map, producing a duplicate key."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-a
            namespace: team-a
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-b
            namespace: team-b
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-a
            namespace: team-a
            creationTimestamp: "2020-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-a
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-b
            namespace: team-b
            creationTimestamp: "2026-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: svc-b
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:team-a_route-a_svc_svc-a_http$"
        description: "the older Prefix Ingress owns the shared slot"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "team-b_route-b"
        description: "the newer ImplementationSpecific Ingress collapses to the same slot and loses — no duplicate key"

  test-ingress-prefix-trailing-slash-oldest-wins:
    description: "Prefix paths '/checkout' and '/checkout/' render into the same map keys (the emit stage strips the trailing slash for the Prefix slot), so they collide. The owner key applies the same trailing-slash normalization, so oldest-wins resolves them to a single map entry instead of emitting a duplicate key. The older Ingress ('/checkout') wins; the newer ('/checkout/') is dropped."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-a
            namespace: team-a
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-b
            namespace: team-b
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-a
            namespace: team-a
            creationTimestamp: "2020-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-a
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: route-b
            namespace: team-b
            creationTimestamp: "2026-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /checkout/
                      pathType: Prefix
                      backend:
                        service:
                          name: svc-b
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:"
        expected: "1"
        description: "exactly one entry for the shared route — no duplicate key from the trailing-slash variant"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^shop\\.example\\.com/checkout/ BACKEND:team-a_route-a_svc_svc-a_http$"
        description: "the older '/checkout' Ingress owns the route"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "team-b_route-b"
        description: "the newer '/checkout/' variant normalizes to the same key and loses"

  test-ingress-default-backend-newest-wins-per-host:
    description: "Two Ingresses in different namespaces both declare defaultBackend for the same host. HAProxy maps keep only one entry per key, so we MUST pick deterministically; the newest Ingress wins per host (matches operator intent on rollout + avoids stale-Ingress 503s during scenario churn)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: old-svc
            namespace: ns-old
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: new-svc
            namespace: ns-new
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: older
            namespace: ns-old
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: old-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend:
                        service:
                          name: old-svc
                          port:
                            number: 8080
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: newer
            namespace: ns-new
            creationTimestamp: "2024-06-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: new-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /new
                      pathType: Prefix
                      backend:
                        service:
                          name: new-svc
                          port:
                            number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-new_newer_svc_new-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-old_older_svc_old-svc_http$"
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:"
        expected: "1"
