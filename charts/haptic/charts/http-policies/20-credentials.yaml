templateSnippets:
  util-public-key-secret:
    requires: [secrets]
    template: |-
      {%- macro ReadPublicKeySecret(namespace string, name string, result map[string]any) -%}
        {%%
          var secret = resources.secrets.GetSingle(namespace, name)
          result["found"] = secret != nil
          result["error"] = ""
          result["filename"] = "haptic-jwt-" + namespace + "_" + name + ".pem"
          if secret != nil {
            var content = dig_string(secret, "", "data", "pubkey.pem") | b64decode() | tostring()
            var info, err = public_key_info(content)
            if err != nil {
              result["error"] = "Secret " + namespace + "/" + name + " has no usable public key. Set pubkey.pem to one PEM public key."
            } else {
              result["content"] = info["pem"]
              result["info"] = info
            }
          }
        %%}
      {%- end macro -%}

  util-api-key-secret:
    requires: [secrets]
    template: |-
      {%- macro ReadAPIKeySecret(namespace string, name string, result map[string]any) -%}
        {%%
          var secret = resources.secrets.GetSingle(namespace, name)
          result["found"] = secret != nil
          result["error"] = ""
          var entries = map[string]any{}
          if secret != nil {
            var content = dig_string(secret, "", "data", "keys") | b64decode() | tostring()
            for _, line := range split(content, "\n") {
              var value = strip(line)
              if value == "" { continue }
              var parts = strings_splitn(value, ":", 2)
              var key = parts[0]
              var consumer = key
              if len(parts) == 2 { consumer = parts[1] }
              if !regex_search(key, "^[!-~]+$") || !regex_search(consumer, "^[!-~]+$") {
                result["error"] = "Secret " + namespace + "/" + name + " has an invalid API key or consumer. Remove whitespace and control characters."
                break
              }
              if previous, exists := entries[key]; exists && previous != consumer {
                result["error"] = "Secret " + namespace + "/" + name + " assigns one API key to multiple consumers. Keep one consumer per key."
                break
              }
              entries[key] = consumer
            }
            if len(entries) == 0 && result["error"] == "" {
              result["error"] = "Secret " + namespace + "/" + name + " contains no API keys. Populate keys with key:consumer entries."
            }
          }
          result["entries"] = entries
        %%}
      {%- end macro -%}
