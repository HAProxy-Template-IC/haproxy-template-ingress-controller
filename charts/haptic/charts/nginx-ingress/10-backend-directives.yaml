templateSnippets:

  backend-directives-670-nginx-ingress-session-affinity:
    template: |
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var affinity = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/affinity"] %}
        {%- if affinity == "cookie" %}
          {%- var cookieName = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-name"] %}
          {%- if cookieName == "" %}{%- cookieName = "INGRESSCOOKIE" %}{%- end %}
          {%- var cookiePath = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-path"] %}
          {%- var scInj = ConfigInjectionKind(cookieName, "token") %}
          {%- if scInj == "" && cookiePath != "" %}{%- scInj = ConfigInjectionKind(cookiePath, "token") %}{%- end %}
          {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
          {%- if cookiePath != "" %}
            {#- HAProxy's `cookie` has no bare `path` keyword; the path rides on `attr Path=`. -#}
            {%- cookieDir = cookieDir + " attr Path=" + cookiePath %}
          {%- end %}
          {%- var cookieSecure = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-secure"] %}
          {%- if cookieSecure == "true" %}
            {%- cookieDir = cookieDir + " attr Secure" %}
          {%- end %}
          {%- var cookieSameSite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-samesite"] %}
          {%- if cookieSameSite != "" %}
            {%- if cookieSameSite != "Strict" && cookieSameSite != "Lax" && cookieSameSite != "None" %}
              {{- fail("Invalid value '" + cookieSameSite + "' for annotation 'nginx.ingress.kubernetes.io/session-cookie-samesite' on Ingress '" + key + "'. Valid values: Strict, Lax, None") -}}
            {%- end %}
            {%- cookieDir = cookieDir + " attr SameSite=" + cookieSameSite %}
          {%- end %}
          {%- var cookieDomain = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-domain"] %}
          {%- if cookieDomain != "" %}
            {%- cookieDir = cookieDir + " domain " + ValidateConfigValue(cookieDomain, "nginx.ingress.kubernetes.io/session-cookie-domain", key, false) %}
          {%- end %}
          {#- Max-Age is the browser cookie lifetime, not HAProxy's `maxlife` stickiness window; Expires maps here too because HAProxy can't emit an absolute date. -#}
          {%- var cookieMaxAge = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-max-age"] %}
          {%- var cookieExpires = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-expires"] %}
          {%- var cookieLife = cookieMaxAge %}
          {%- var cookieLifeKey = "nginx.ingress.kubernetes.io/session-cookie-max-age" %}
          {%- if cookieLife == "" %}
            {%- cookieLife = cookieExpires %}
            {%- cookieLifeKey = "nginx.ingress.kubernetes.io/session-cookie-expires" %}
          {%- end %}
          {%- if cookieLife != "" %}
            {%- if !regex_search(cookieLife, "^[0-9]+$") %}
              {{- fail("Invalid value '" + cookieLife + "' for annotation '" + cookieLifeKey + "' on Ingress '" + key + "'. Must be a non-negative integer (seconds).") -}}
            {%- end %}
            {%- cookieDir = cookieDir + " attr Max-Age=" + cookieLife %}
          {%- end %}
          {%- var cookieHash = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-hash"] %}
          {%- if cookieHash != "" %}
      # Warning: nginx.ingress.kubernetes.io/session-cookie-hash={{ cookieHash }} on Ingress {{ key }} is not configurable in HAProxy — dynamic cookies always hash via dynamic-cookie-key.
          {%- end %}
          {%- if scInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' session-cookie-name/-path contains " + scInj + ", which would break the backend cookie directive; session affinity is not applied. Remove whitespace and control characters from the value.") -}}
          {%- else %}
      # nginx-ingress/session-affinity ({{ key }})
      {{ cookieDir }}
      dynamic-cookie-key {{ sha256(key) }}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-700-nginx-ingress-timeouts:
    template: |
      {#- proxy-read-timeout / proxy-send-timeout collapse into HAProxy's single
          settable server timeout (the larger wins), which moves to
          backend-timeouts.map via map-backend-timeout-700-nginx-timeouts
          (reload-free). timeout-connect stays per-value here. -#}
      {%- if ingress != nil %}
        {%- var connectTimeout = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-connect-timeout"] %}
        {%- if connectTimeout != "" %}
      # nginx-ingress/backend-directives-timeouts
      timeout connect {{ connectTimeout }}s
        {% end %}
      {%- end -%}

  # Reload-free settable timeout: proxy-read-timeout / proxy-send-timeout (seconds,
  # larger wins) become a `<backend>|server` entry in backend-timeouts.map as ms.
  # There is no tunnel equivalent in the nginx annotation set.
  map-backend-timeout-700-nginx-timeouts:
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%%
        var lines = []string{}
        for _, ingress := range resources.ingresses.List() {
          var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name
          var readT = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          var sendT = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]
          if readT == "" && sendT == "" {
            continue
          }
          var bad = ""
          if readT != "" && !regex_search(readT, "^[0-9]+$") {
            bad = "proxy-read-timeout"
          }
          if sendT != "" && !regex_search(sendT, "^[0-9]+$") {
            bad = "proxy-send-timeout"
          }
          if bad != "" {
            _ = WebhookRejectOrWarn(ingress, "InvalidTimeout", "Annotation 'nginx.ingress.kubernetes.io/" + bad + "' on Ingress '" + key + "' is not a whole number of seconds; the timeout is not applied.")
            continue
          }
          var secs = toint(readT)
          if toint(sendT) > secs {
            secs = toint(sendT)
          }
          if secs <= 0 {
            continue
          }
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              var be = BackendNameIngress(ingress, path)
              if first_seen("map-backend-timeout", be, "server") {
                lines = append(lines, be + "|server " + tostring(secs * 1000))
              }
            }
          }
        }
        if len(lines) > 0 {
          show "\n" + join(lines, "\n")
        }
      %%}

  backend-directives-710-nginx-ingress-load-balance:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var lb = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/load-balance"] %}
        {%- if lb != "" %}
          {%- var algo = "" %}
          {%- if lb == "round_robin" %}
            {%- algo = "roundrobin" %}
          {%- else if lb == "least_conn" %}
            {%- algo = "leastconn" %}
          {%- else if lb == "ip_hash" %}
            {%- algo = "source" %}
          {%- else if lb == "random" %}
            {%- algo = "random" %}
          {%- else if lb == "ewma" %}
            {%- algo = "leastconn" %}
          {%- else %}
            {{- fail("Invalid value '" + lb + "' for annotation 'nginx.ingress.kubernetes.io/load-balance' on Ingress '" + key + "'. Valid values: round_robin, least_conn, ip_hash, random, ewma") -}}
          {%- end %}
      # nginx-ingress/backend-directives-load-balance
      balance {{ algo }}
        {%- end %}
      {%- end -%}

  backend-directives-715-nginx-ingress-next-upstream:
    template: |
      {# A retry lands on a different server only because base.yaml's defaults set `option redispatch`. #}
      {# Silently ignored, no HAProxy CE equivalent: non_idempotent, proxy-next-upstream-timeout. #}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var nu = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream"] %}
        {%- var tries = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream-tries"] %}
        {%- if nu != "" || tries != "" %}
          {%- var off = false %}
          {%- var conds = []string{} %}
          {%- var seen = map[string]bool{} %}
          {%- for _, tok := range split(nu, " ") %}
            {%- var t = trimSpace(tok) %}
            {%- var mapped = "" %}
            {%- if t == "off" %}
              {%- off = true %}
            {%- else if t == "error" %}
              {%- mapped = "conn-failure" %}
            {%- else if t == "timeout" %}
              {%- mapped = "response-timeout" %}
            {%- else if t == "invalid_header" %}
              {%- mapped = "junk-response" %}
            {%- else if hasPrefix(t, "http_") %}
              {%- var code = t[5:] %}
              {%- if !regex_search(code, "^[1-5][0-9][0-9]$") %}
                {{- fail("Invalid status '" + code + "' in 'nginx.ingress.kubernetes.io/proxy-next-upstream' on Ingress '" + key + "'. Use http_<3-digit-status>.") -}}
              {%- end %}
              {%- mapped = code %}
            {%- end %}
            {%- if mapped != "" && !seen[mapped] %}
              {%- seen[mapped] = true %}
              {%- conds = append(conds, mapped) %}
            {%- end %}
          {%- end %}
          {%- if off %}
      # nginx-ingress/proxy-next-upstream ({{ key }}) - disabled
      retries 0
          {%- else %}
            {%- if len(conds) > 0 %}
      # nginx-ingress/proxy-next-upstream ({{ key }})
      retry-on {{ join(conds, " ") }}
            {%- end %}
            {%- if tries != "" %}
              {#- toint() returns 0 for junk like "abc"/"2.5", so an unchecked typo would silently drop the retry limit. -#}
              {%- if !regex_search(tries, "^[0-9]+$") %}
                {{- fail("Invalid value '" + tries + "' for 'nginx.ingress.kubernetes.io/proxy-next-upstream-tries' on Ingress '" + key + "'. Must be a non-negative integer.") -}}
              {%- end %}
              {%- var n = toint(tries) %}
              {%- if n > 0 %}
      retries {{ n }}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  map-body-size-720-nginx-ingress:
    template: |
      {# "0" means unlimited in nginx, hence no map entry. #}
      {# base.yaml's frontend-filters-250-request-body-size enforces the map (deny 413) keyed on the resolved backend, so a cap change is map-only and reload-free. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var bodySize = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-body-size"] -%}
        {%- if bodySize != "" -%}
          {%%
            var bytes = 0
            var sizeLen = len(bodySize)
            var lastChar = bodySize[sizeLen-1:]
            if lastChar == "k" || lastChar == "K" {
              bytes = toint(bodySize[:sizeLen-1]) * 1024
            } else if lastChar == "m" || lastChar == "M" {
              bytes = toint(bodySize[:sizeLen-1]) * 1048576
            } else if lastChar == "g" || lastChar == "G" {
              bytes = toint(bodySize[:sizeLen-1]) * 1073741824
            } else {
              bytes = toint(bodySize)
            }
          %%}
          {%- if bytes > 0 -%}
            {%- for _, rule := range ingress.Spec.Rules -%}
              {#- rule.Http is a value struct: .Paths is empty without an http block, so no nil guard. -#}
              {%- for _, path := range rule.Http.Paths -%}
                {%- var be = BackendNameIngress(ingress, path) -%}
                {%- if first_seen("map-body-size", be) -%}
      {{ "\n" }}{{ be }} {{ bytes }}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-725-nginx-ingress-limit-rate:
    template: |
      {# bwlim-out throttles data sent toward the client. limit-rate-after maps to
          min-size, which is HAProxy's forward-chunk size, NOT nginx's "throttle after
          N bytes" — HAProxy has no equivalent. Kept as the closest available knob and
          declared `different` in migration coverage rather than silently claimed
          equivalent; see docs/site/docs/libraries/nginx-ingress.md. #}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var rate = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate"] %}
        {%- var after = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate-after"] %}
        {%- if rate != "" %}
          {%- if !regex_search(rate, "^[0-9]+[kKmMgG]?$") %}
            {{- fail("Invalid value '" + rate + "' for 'nginx.ingress.kubernetes.io/limit-rate' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
          {%- end %}
          {%- var fname = "ni_limitrate_" + ns + "_" + name %}
          {%- var filterLine = "filter bwlim-out " + fname + " default-limit " + rate + " default-period 1s" %}
          {%- if after != "" %}
            {%- if !regex_search(after, "^[0-9]+[kKmMgG]?$") %}
              {{- fail("Invalid value '" + after + "' for 'nginx.ingress.kubernetes.io/limit-rate-after' on Ingress '" + key + "'. Expected a byte size like '1m'.") -}}
            {%- end %}
            {%- filterLine = filterLine + " min-size " + after %}
          {%- end %}
      # nginx-ingress/limit-rate ({{ key }})
      {{ filterLine }}
      http-request set-bandwidth-limit {{ fname }}
        {%- end %}
      {%- end -%}

  backend-directives-730-nginx-ingress-backend-protocol:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var proto = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/backend-protocol"] %}
        {%- if proto != "" %}
          {%- if proto == "HTTP" %}
            {#- HTTP/1.1 needs no server flag -#}
          {%- else if proto == "HTTPS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none") %}
          {%- else if proto == "GRPC" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto h2") %}
          {%- else if proto == "GRPCS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none proto h2") %}
          {%- else if proto == "AJP" %}
            {{- fail("Backend protocol 'AJP' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else if proto == "FCGI" %}
            {{- fail("Backend protocol 'FCGI' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else %}
            {{- fail("Invalid value '" + proto + "' for annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'. Valid values: HTTP, HTTPS, GRPC, GRPCS") -}}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-740-nginx-ingress-proxy-protocol:
    template: |
      {%- if ingress != nil %}
        {%- var pp = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/use-proxy-protocol"] %}
        {%- if pp == "true" %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2") %}
        {%- end %}
      {%- end -%}

  backend-directives-750-nginx-ingress-rewrite-target:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var rewrite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/rewrite-target"] %}
        {%- if rewrite != "" %}
          {#- Translate $1..$9 capture groups to \1..\9 -#}
          {%- rewrite = regexp("\\$([1-9])").ReplaceAll(rewrite, "\\$1") %}
          {#- Only a \N backreference forces backend scope (the regex side can't be map-driven); literal rewrites go to path-rewrite.map via map-path-rewrite-750-nginx-ingress. -#}
          {%- if regex_search(rewrite, "\\\\[1-9]") %}
      # nginx-ingress/backend-directives-rewrite-target ({{ key }})
      http-request replace-path (.*) {{ rewrite }}
          {%- end %}
        {%- end %}
      {%- end -%}

  map-path-rewrite-750-nginx-ingress:
    template: |
      {# Literal rewrites only (no \N); base.yaml's frontend-filters-400-path-rewrite applies them as set-path. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var rewrite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/rewrite-target"] -%}
        {%- if rewrite != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- rewrite = regexp("\\$([1-9])").ReplaceAll(rewrite, "\\$1") -%}
          {%- if !regex_search(rewrite, "\\\\[1-9]") -%}
            {%- for _, rule := range ingress.Spec.Rules -%}
              {%- for _, path := range rule.Http.Paths -%}
                {%- var be = BackendNameIngress(ingress, path) -%}
                {%- if first_seen("map-path-rewrite", be) -%}
      {{ "\n" }}{{ be }} {{ queryEscape(ValidateConfigValue(rewrite, "nginx.ingress.kubernetes.io/rewrite-target", key, true)) }}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-770-nginx-ingress-rate-limiting:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {#- One stick-table per backend, and it stores each data type once: http_req_rate(1s) and
          http_req_rate(60s) can't coexist ("store option 'http_req_rate' already enabled, ignored"),
          so limit-rps and limit-rpm are mutually exclusive. conn_cur is a separate data type. -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var limitRps = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rps"] %}
        {%- var limitRpm = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rpm"] %}
        {%- var limitConn = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-connections"] %}
        {#- The threshold reaches an unquoted sc_http_req_rate/sc_conn_cur ACL operand;
            a malformed value must fail rather than silently ship without the limit. Only
            the value that is actually emitted is checked (rps > rpm > connections). -#}
        {%- var rlInj = "" %}
        {%- var rlField = "" %}
        {%- var rlVal = "" %}
        {%- if limitRps != "" %}
          {%- rlInj = ConfigInjectionKind(limitRps, "token") %}{%- rlField = "limit-rps" %}{%- rlVal = limitRps %}
        {%- else if limitRpm != "" %}
          {%- rlInj = ConfigInjectionKind(limitRpm, "token") %}{%- rlField = "limit-rpm" %}{%- rlVal = limitRpm %}
        {%- else if limitConn != "" %}
          {%- rlInj = ConfigInjectionKind(limitConn, "token") %}{%- rlField = "limit-connections" %}{%- rlVal = limitConn %}
        {%- end %}
        {%- if rlInj != "" %}
          {{- fail("Invalid value '" + rlVal + "' for annotation 'nginx.ingress.kubernetes.io/" + rlField + "' on Ingress '" + key + "': contains " + rlInj + ", which would break the rate-limit ACL. Use a plain integer.") -}}
        {%- end %}
        {%- var limitWhitelist = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-whitelist"] %}
        {%- var exempt = "" %}
        {%- if limitWhitelist != "" %}
          {%- var validated = ValidateCidrList(limitWhitelist, "nginx.ingress.kubernetes.io/limit-whitelist", key) %}
          {%- if validated != "" %}
            {%- exempt = " !{ src " + validated + " }" %}
          {%- end %}
        {%- end %}
        {%- if limitRps != "" || limitRpm != "" %}
          {%- var ignored = []string{} %}
          {%- if limitRps != "" && limitRpm != "" %}{%- ignored = append(ignored, "limit-rpm") %}{%- end %}
          {%- if limitConn != "" %}{%- ignored = append(ignored, "limit-connections") %}{%- end %}
          {%- if len(ignored) > 0 %}
      # nginx-ingress/rate-limiting ({{ key }}) - {{ join(ignored, ", ") }} ignored (HAProxy stores http_req_rate once per stick-table; conn_cur needs a separate counter)
          {%- else %}
      # nginx-ingress/rate-limiting ({{ key }})
          {%- end %}
          {%- if limitRps != "" %}
      {# `peers localinstance` (base.yaml) carries the per-source counter across reloads. #}
      stick-table type ip size 100k expire 1s store http_req_rate(1s) peers localinstance
      http-request track-sc0 src
      http-request set-var(txn.denied_by) str(rate_limit_local) if { sc_http_req_rate(0) gt {{ limitRps }} }{{ exempt }}
      http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ limitRps }} }{{ exempt }}
          {%- else %}
      stick-table type ip size 100k expire 60s store http_req_rate(60s) peers localinstance
      http-request track-sc0 src
      http-request set-var(txn.denied_by) str(rate_limit_local) if { sc_http_req_rate(0) gt {{ limitRpm }} }{{ exempt }}
      http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ limitRpm }} }{{ exempt }}
          {%- end %}
        {%- else if limitConn != "" %}
      # nginx-ingress/rate-limiting ({{ key }})
      stick-table type ip size 100k expire 30s store conn_cur peers localinstance
      http-request track-sc0 src
      http-request set-var(txn.denied_by) str(rate_limit_connections) if { sc_conn_cur(0) gt {{ limitConn }} }{{ exempt }}
      http-request deny deny_status 429 if { sc_conn_cur(0) gt {{ limitConn }} }{{ exempt }}
        {%- end %}
      {%- end -%}

  # These maps are consumed by base.yaml's frontend-filters-26x-request-set-* rules,
  # so changing a header value is a map-only, reload-free update.
  map-reqhdr-host-760-nginx-ingress:
    template: |
      {# Shares the "map-reqhdr-host" first_seen namespace with the haproxytech set-host emitter. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var v = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/upstream-vhost"] -%}
        {%- if v != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {%- if first_seen("map-reqhdr-host", be) -%}
      {{ "\n" }}{{ be }} {{ queryEscape(ValidateConfigValue(v, "nginx.ingress.kubernetes.io/upstream-vhost", key, true)) }}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-reqhdr-xfwd-prefix-760-nginx-ingress:
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var v = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/x-forwarded-prefix"] -%}
        {%- if v != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {%- if first_seen("map-reqhdr-xfwd-prefix", be) -%}
      {{ "\n" }}{{ be }} {{ queryEscape(ValidateConfigValue(v, "nginx.ingress.kubernetes.io/x-forwarded-prefix", key, true)) }}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-reqhdr-connection-760-nginx-ingress:
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var v = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/connection-proxy-header"] -%}
        {%- if v != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {%- if first_seen("map-reqhdr-connection", be) -%}
      {{ "\n" }}{{ be }} {{ queryEscape(ValidateConfigValue(v, "nginx.ingress.kubernetes.io/connection-proxy-header", key, true)) }}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-780-nginx-ingress-upstream-hash:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var hashBy = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/upstream-hash-by"] %}
        {%- if hashBy != "" %}
          {%- var expr = "" %}
          {%- if hashBy == "$request_uri" %}
            {%- expr = "url" %}
          {%- else if hashBy == "$remote_addr" %}
            {%- expr = "src" %}
          {%- else if hasPrefix(hashBy, "$cookie_") %}
            {%- expr = "req.cook(" + hashBy[8:] + ")" %}
          {%- else if hasPrefix(hashBy, "$http_") %}
            {%- var hdrName = replace(hashBy[6:], "_", "-") %}
            {%- expr = "req.hdr(" + hdrName + ")" %}
          {%- else if hasPrefix(hashBy, "$arg_") %}
            {%- expr = "url_param(" + hashBy[5:] + ")" %}
          {%- else if hasPrefix(hashBy, "$") %}
            {{- fail("Unsupported nginx variable '" + hashBy + "' for annotation 'nginx.ingress.kubernetes.io/upstream-hash-by' on Ingress '" + key + "'. Supported: $request_uri, $remote_addr, $cookie_XXXX, $http_xxxx, $arg_XXXX") -}}
          {%- else %}
            {#- Not an nginx variable: passed through unvalidated as a raw HAProxy fetch -#}
            {%- expr = hashBy %}
          {%- end %}
      # nginx-ingress/backend-directives-upstream-hash ({{ key }})
      balance hash {{ expr }}
      hash-type consistent
        {%- end %}
      {%- end -%}

  backend-directives-900-nginx-ingress-config-snippet:
    template: |
      {%- if ingress != nil %}
        {%- var snippet = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/configuration-snippet"] %}
        {%- if snippet != "" %}
      # nginx-ingress/configuration-snippet
      {{ snippet }}
        {%- end %}
      {%- end -%}
