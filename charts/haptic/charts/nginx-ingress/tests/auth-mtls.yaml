# nginx-ingress library — auth + mTLS validation tests.
# mTLS client-cert pass-through, auth-tls secret, and external-auth (SPOE)
# flows including resource-id keying variants.
_fx:
  extracontextSpoahubEnabled: &extracontextSpoahubEnabled
    spoaHub:
      enabled: true
      haproxy:
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}
  httpApi: &httpApi
    paths:
      - path: /api
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  test-nginx-ingress-mtls-pass-cert:
    description: Nginx Ingress auth-tls-pass-certificate-to-upstream adds cert headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-ingress
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mtls.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl_c_der"}
      - {type: contains, target: haproxy.cfg, pattern: "ssl_c_s_dn"}

  test-nginx-ingress-auth-tls-secret:
    description: "nginx.ingress.kubernetes.io/auth-tls-secret references a Secret whose `ca.crt` is written to the general file dir (not ssl/, whose entries are cert+key bundles) and used in the crt-list line for the matching SNI as `ca-file <path> verify required`. HAProxy then verifies incoming client certs against that CA bundle."
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: client-ca}
          type: kubernetes.io/tls
          # Self-signed CA test fixture (re-used from echo demo).
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: server-tls}
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-secret: "client-ca"
              nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"

  test-nginx-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy (any plugin
    # enabled, or operator forces it). When the test renders against
    # default chart values (no plugins), spoa-hub library is absent —
    # auth-url.map doesn't exist and the frontend snippets don't
    # render. Skip in that case so validate-helm-libraries is green.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-url annotation populates auth-url.map and the spoa-hub frontend wiring (set-var, send-spoe-group, deny rule). Runs in a render where spoaHub is enabled with the external-auth plugin, simulating the auto-enable that nginxIngress=true triggers via the OR-expression in spoaHub.plugins.external-auth.enabled."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-url.map, pattern: "default/protected https://auth.example/check"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-auth check-auth-group"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 401"}

  test-nginx-ingress-external-auth-signin:
    # Same prerequisite as the other external-auth tests — needs the
    # spoa-hub library loaded so auth-signin.map is defined.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-signin annotation makes auth failures redirect (302) to the configured sign-in URL instead of returning 401. The deny rule still emits, so requests without auth-signin configured fall through to it."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-signin: "https://login.example/oauth2/start"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-signin.map
        pattern: "default/protected https://login.example/oauth2/start"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_signin\\).*auth-signin\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.auth_signin\\)\\] code 302"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 401"}

  test-nginx-ingress-external-auth-method:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-method annotation populates auth-method.map and threads through the SPOE check-auth message's `method` arg so the auth subrequest goes out with the configured verb. The external-auth plugin v0.3.0+ falls back to its plugin-level method config when this map lookup is empty, so routes without the annotation are unaffected."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-method: "POST"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpApi
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-method.map, pattern: "default/protected POST"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_method\\).*auth-method\\.map"
      - {type: contains, target: file:spoe.conf, pattern: "method=var\\(txn.auth_method\\)"}

  test-nginx-ingress-external-auth-response-headers:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-response-headers annotation populates auth-extract-headers.map and emits one `http-request set-header` per unique header in any ingress's pass list, gated on `allowed -m bool` so the headers only flow through to the upstream backend on auth success."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User, X-Auth-Roles"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpApi
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/protected X-Auth-User, X-Auth-Roles"
      - {type: contains, target: file:spoe.conf, pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_roles\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
      # Security: strip a client-supplied copy of each trusted header on the
      # auth-protected route before re-adding the plugin value, so a forged
      # inbound header can't survive when the auth reply omits it. del-header
      # must precede the corresponding set-header.
      - type: contains
        target: haproxy.cfg
        pattern: "(?s)del-header X-Auth-User if \\{ var\\(txn.auth_url\\) -m found \\}.*set-header X-Auth-User "
      - type: contains
        target: haproxy.cfg
        pattern: "(?s)del-header X-Auth-Roles if \\{ var\\(txn.auth_url\\) -m found \\}.*set-header X-Auth-Roles "

  test-nginx-ingress-external-auth-hostless-accepted:
    # Same as test-nginx-ingress-external-auth: needs the spoa-hub library
    # loaded for the auth-url.map definition.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Ingress with auth-url annotation AND a host-less rule must render successfully now that auth-url.map is keyed by <ns>/<name> (resource identity) rather than by host+path. The host dimension is no longer part of the key, so the previous fail-loud behaviour for host-less rules is obsolete. The map row is emitted by ns/name and the routing chain populates txn.resource_id correctly for whatever request the host-less Ingress's catch-all matches."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hostless-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/hostless-protected https://auth\.example/check$'
  # ----------------------------------------------------------------------------
  # auth-url <host><path> keying bug (red→green)
  #
  # auth-url.map (and friends) are currently keyed on the literal
  # `MapKeyForHost(host) + path` string. The frontend looks them up via plain
  # `map(...)` (exact match), so:
  #
  #   - regex paths never match: the row's key is the regex pattern string,
  #     the lookup key is the actual request path.
  #   - prefix paths only match the exact ingress path, never subpaths.
  #   - the wildcard-host case happens to work for Exact paths because both
  #     render and request collapse to ".example.com/<path>".
  #
  # The fix keys feature maps by `<ns>/<name>` (resource identity, derived
  # from the qualifier value the routing chain has already produced). After
  # the fix:
  #   - auth-url.map row: "default/<name> <url>"
  #   - consumer line:    "set-var(txn.auth_url) var(txn.resource_id),map(...)"
  #
  # All five tests below assert the post-fix shape, so they FAIL with the
  # current code (proving the bug) and PASS after the fix.
  # ----------------------------------------------------------------------------

  test-nginx-ingress-external-auth-resource-id-keying-wildcard-host:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url with wildcard host: the map row must be keyed by <ns>/<name>, not by the wildcard-stripped host+path. Demonstrates the new keying shape on a scenario that happens to work today (wildcard-host + Exact path), so any regression in the new keying is caught here even though the old keying didn't break this specific case at request time."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/wild-protected https://auth\.example/check$'
      - {type: not_contains, target: map:auth-url.map, pattern: '\.example\.com/'}
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-prefix-subpath:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url with Prefix path: a request to a SUBPATH of the ingress path must be authenticated. Today's bug: the map row is keyed \"host.example.com/api\" but the request lookup key is \"host.example.com/api/users\" — exact-match map() always misses on subpaths, so auth silently does not fire. After the fix the map is keyed \"<ns>/<name>\" and the consumer reads txn.resource_id, so any route owned by this ingress (regardless of subpath) triggers auth."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: prefix-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http: *httpApi
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/prefix-protected https://auth\.example/check$'
      - {type: not_contains, target: map:auth-url.map, pattern: 'api\.example\.com/api'}
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-regex-path:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url on an Ingress using haproxy-ingress.github.io/path-type=regex. Routing works today via map_reg(); auth-url.map does not because its key is the literal regex string and its consumer is exact-match. Same red→green pattern: row keyed by <ns>/<name>, consumer reads resource_id."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: regex-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/path-type: regex
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/regex-protected https://auth\.example/check$'
      - {type: not_contains, target: map:auth-url.map, pattern: 'api/v\[0-9'}
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-wildcard-regex:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Combination: wildcard host AND regex path (the case the user asked about). Today this is triple-broken — the row is keyed \".example.com/api/v[0-9]+/.*\", the consumer is exact-match, AND the haproxy-ingress regex-map renderer at haproxy-ingress.yaml:111 leaks the literal `*` into the regex pattern (it doesn't apply MapKeyForHost), making the path-regex.map invalid for HAProxy. The third bug is out of scope here, so we don't assert haproxy_valid; this test just demonstrates the auth-url keying mismatch."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-regex-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/path-type: regex
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      # haproxy_valid is intentionally omitted here — the wildcard `*` leaks
      # into path-regex.map via haproxy-ingress.yaml:111 (separate bug,
      # tracked elsewhere).
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/wild-regex-protected https://auth\.example/check$'
      - {type: not_contains, target: map:auth-url.map, pattern: '\.example\.com'}
  test-nginx-ingress-external-auth-resource-id-keying-deterministic:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: Re-rendering the same Ingress produces byte-identical basic-auth output.
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: svc-a}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: svc-b}
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: svc-a-abc
            labels:
              kubernetes.io/service-name: svc-a
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: svc-b-abc
            labels:
              kubernetes.io/service-name: svc-b
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: alpha
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/alpha"
          spec:
            ingressClassName: haproxy
            rules:
              - host: alpha.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: svc-a, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: beta
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/beta"
          spec:
            ingressClassName: haproxy
            rules:
              - host: beta.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: svc-b, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - {type: contains, target: map:auth-url.map, pattern: '(?m)^default/alpha https://auth\.example/alpha$'}
      - {type: contains, target: map:auth-url.map, pattern: '(?m)^default/beta https://auth\.example/beta$'}

  test-nginx-ingress-access-log-mtls-fields-deduplicated:
    _helm_skip_test: '{{ if or (include "haptic.nginxIngress.disabled" .) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ else }}false{{ end }}'
    description: >-
      Three annotation libraries contribute the same mTLS access-log fields for
      their own vocabularies. Identical items must be deduplicated into one JSON
      key rather than emitted per library — a duplicate key is resolved
      differently by every parser and silently corrupts a log pipeline. The two
      Ingresses use different families deliberately: the same feature configured
      twice on ONE Ingress is a cross-family collision and is rejected.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-native
            annotations:
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-native.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-nginx
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-nginx.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(mtls_verify\)\[ssl_c_verify\]'}
      - {type: contains, target: haproxy.cfg, pattern: '%\(mtls_cn\)\[ssl_c_s_dn\(CN\)\]'}
      - type: not_contains
        target: haproxy.cfg
        pattern: 'log-format "[^"]*%\(mtls_verify\)[^"]*%\(mtls_verify\)'
        description: >-
          The dedup contract, stated per record rather than as a total count: one
          log-format line must never carry the same field twice. A count would
          depend on how many frontends the deployment renders, and this test also
          runs in the operator's load gate.
      - {type: not_contains, target: haproxy.cfg, pattern: 'log-format "[^"]*%\(mtls_cn\)[^"]*%\(mtls_cn\)'}

  test-nginx-ingress-pass-certificate-cannot-be-forged:
    description: >-
      auth-tls-pass-certificate-to-upstream sets ssl-client-cert and
      ssl-client-subject-dn under a host match, so a wildcard or host-less rule
      left the caller's own values reaching the backend. The strip is
      unconditional; the set is scoped to the matched route.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nx-passcert
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.nx-cert.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header ssl-client-cert\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header ssl-client-subject-dn\n'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'del-header ssl-client-[a-z-]+ if'}
      - type: contains
        target: haproxy.cfg
        pattern: 'set-header ssl-client-cert %\[ssl_c_der,base64\] if \{ var\(txn\.resource_id\) -m str default/nx-passcert \}'

  test-nginx-ingress-auth-secret-missing-fails-closed:
    description: >-
      An unresolvable auth-secret left the backend unauthenticated, including under satisfy=any where the combined gate has no userlist either.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nx-noauth
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: nx-noauth.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(basic_auth_unavailable\\)"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}
      # The render must still succeed: a Secret deleted after admission must not
      # abort reconcile for the whole fleet.
      - {type: contains, target: haproxy.cfg, pattern: "backend default_nx-noauth_svc_echo_80"}

  test-nginx-ingress-auth-secret-missing-fails-closed-at-admission:
    description: >-
      An unresolvable auth-secret left the backend unauthenticated, including under satisfy=any where the combined gate has no userlist either. Rejected when the resource is written.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: nx-noauth
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: nx-noauth.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      # Admission must NOT reject. The webhook renders against the
      # watched-resource store, which lags the API server, so a Secret created
      # moments earlier is indistinguishable from one that is missing — this
      # denied correct manifests applied in the correct order. The runtime 503
      # below is the protection, and it self-heals when the store catches up.
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}

  # ============================================================================
  # Config-injection guards (issue #157). auth-* annotation values reach
  # whitespace-delimited map files or a quoted directive; a control character
  # would smuggle a second map entry or break the directive line. Char-class
  # rejection itself is proven by base's ConfigInjectionKind/Escape* tests —
  # these are per-site wiring checks that the guard is actually called.
  # ============================================================================
  test-nginx-ingress-auth-maps-skip-injection:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: One Ingress with control characters in auth-url, auth-signin and auth-method renders clean — each map guard skips its value (deny at admission via the shared reject helper, which base tests cover).
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-hostile
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check\nURLWN"
              nginx.ingress.kubernetes.io/auth-signin: "https://login.example/start\nSIGNINWN"
              nginx.ingress.kubernetes.io/auth-method: "POST\nMETHODWN"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth-hostile.example.com
                http: *httpApi
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: map:auth-url.map, pattern: "URLWN"}
      - {type: not_contains, target: map:auth-signin.map, pattern: "SIGNINWN"}
      - {type: not_contains, target: map:auth-method.map, pattern: "METHODWN"}

  test-nginx-ingress-external-auth-response-headers-injection-fails-closed:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: A trailing control character in auth-response-headers fails the render via the map snippet's own local guard. The companion header-name check strips per-name whitespace before validating, so it passes a trailing newline that would still reach the map value raw — the local line guard is what catches it.
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-attacker
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-response-headers: "X-Foo\n"
          spec:
            ingressClassName: haproxy
            rules:
              - host: attacker.example.com
                http: *httpApi
    assertions:
      - {type: contains, target: rendering_error, pattern: "inject an entry into the auth response-headers map"}

  test-nginx-ingress-auth-realm-escapes-quote:
    description: A double quote in auth-realm is escaped (not a breakout), so the emitted realm stays one valid HAProxy quoted string.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: realm-auth}
          data:
            auth: YWRtaW46JDJ5JDA1JG1PMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: realm-quote
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "realm-auth"
              nginx.ingress.kubernetes.io/auth-realm: 'Zone"members'
          spec:
            ingressClassName: haproxy
            rules:
              - host: realm.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request auth realm \"Zone"}

  test-nginx-ingress-auth-realm-injection-fails:
    description: A control character in auth-realm fails closed — the basic-auth backend directive is never emitted from a broken realm.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: realm-auth}
          data:
            auth: YWRtaW46JDJ5JDA1JG1PMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: realm-attacker
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "realm-auth"
              nginx.ingress.kubernetes.io/auth-realm: "Zone\nhttp-request set-header X-Pwned 1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: realm.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "break the auth realm directive"}
