validationTests:
  test-nginx-ingress-unknown-annotation-warns:
    description: An nginx.ingress.kubernetes.io annotation the coverage map doesn't declare records an UnknownAnnotation Event; declared ones, including dropped ones, don't.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: typo
            annotations:
              nginx.ingress.kubernetes.io/proxy-conect-timeout: "10"
              nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
              nginx.ingress.kubernetes.io/server-snippet: "listen 8080;"
              example.com/unrelated: "x"
          spec:
            ingressClassName: haproxy
            rules:
              - host: typo.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: events
        pattern: "Warning UnknownAnnotation networking.k8s.io/v1 Ingress default/typo: Ingress default/typo sets nginx\\.ingress\\.kubernetes\\.io/proxy-conect-timeout, which"
      - {type: not_contains, target: events, pattern: "server-snippet"}
      - {type: not_contains, target: events, pattern: "example\\.com/unrelated"}
      - {type: not_contains, target: events, pattern: "proxy-connect-timeout"}

  test-nginx-ingress-unknown-annotation-admits:
    description: An unknown annotation doesn't fail admission, so an annotation newer than the coverage map can't block updates to the Ingress carrying it.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: future
            annotations:
              nginx.ingress.kubernetes.io/some-future-annotation: "on"
          spec:
            ingressClassName: haproxy
            rules:
              - host: future.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: rendering_error, pattern: "some-future-annotation"}
