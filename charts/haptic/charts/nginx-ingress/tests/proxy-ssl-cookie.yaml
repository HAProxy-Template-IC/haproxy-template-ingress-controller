# nginx-ingress library — proxy-ssl-* (backend TLS to upstream) and
# proxy-cookie-domain / proxy-cookie-path validation tests.
validationTests:
  # ==========================================================================
  # Backend TLS to upstream (proxy-ssl-*)
  # ==========================================================================

  test-nginx-ingress-proxy-ssl-verify-on:
    description: proxy-ssl-verify=on with a proxy-ssl-secret writes the client cert + verifies against the secret CA when backend-protocol is HTTPS
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: pssl-service
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: pssl-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: pssl-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8443
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: upstream-client
          type: kubernetes.io/tls
          data:
            ca.crt: 
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pssl-ingress
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/proxy-ssl-secret: "upstream-client"
              nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
              nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "3"
              nginx.ingress.kubernetes.io/proxy-ssl-name: "upstream.internal"
              nginx.ingress.kubernetes.io/proxy-ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256"
              nginx.ingress.kubernetes.io/proxy-ssl-protocols: "TLSv1.2 TLSv1.3"
          spec:
            ingressClassName: haproxy
            rules:
              - host: pssl.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: pssl-service
                          port:
                            number: 443
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "ssl verify required"
      - type: not_contains
        target: haproxy.cfg
        pattern: "ssl verify none"
      - type: contains
        target: haproxy.cfg
        pattern: "ca-file [^ ]*default-upstream-client-proxy-ssl-ca\\.pem"
      # `crt` resolves against crt-base (the ssl dir), so the value MUST be the
      # bare filename — a ssl/-prefixed value doubles to ssl/ssl/<name> and fails
      # `haproxy -c` on a real deploy (offline validation hides it by writing the
      # cert wherever the config names it, so this exact-value pin is the guard).
      - type: contains
        target: haproxy.cfg
        pattern: " crt default-upstream-client-proxy-ssl-client\\.pem"
      - type: not_contains
        target: haproxy.cfg
        pattern: "crt ssl/"
      - type: not_contains
        target: haproxy.cfg
        pattern: "verify-depth 3"
      - type: contains
        target: haproxy.cfg
        pattern: "sni str\\(upstream\\.internal\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "verifyhost upstream\\.internal"
      - type: contains
        target: haproxy.cfg
        pattern: "ciphers ECDHE-RSA-AES128-GCM-SHA256"
      - type: contains
        target: haproxy.cfg
        pattern: "ssl-min-ver TLSv1\\.2"
      - type: contains
        target: haproxy.cfg
        pattern: "ssl-max-ver TLSv1\\.3"

  test-nginx-ingress-proxy-ssl-verify-off:
    description: proxy-ssl-verify=off keeps verify none and proxy-ssl directives are skipped when backend SSL is not enabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: pssloff-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: pssloff-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: pssloff-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pssloff-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
              nginx.ingress.kubernetes.io/proxy-ssl-name: "ignored.internal"
          spec:
            ingressClassName: haproxy
            rules:
              - host: pssloff.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: pssloff-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "sni str\\(ignored\\.internal\\)"

  # ==========================================================================
  # proxy-cookie-domain / proxy-cookie-path
  # ==========================================================================

  test-nginx-ingress-proxy-cookie-rewrite:
    description: proxy-cookie-domain and proxy-cookie-path rewrite the upstream Set-Cookie header
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: cookie-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cookie-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: cookie-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.3"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cookie-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-cookie-domain: "upstream.local app.example.com"
              nginx.ingress.kubernetes.io/proxy-cookie-path: "/api /"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cookie.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: cookie-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-response replace-header Set-Cookie \\(.\\*\\)Domain=upstream\\.local\\(.\\*\\) \\\\1Domain=app\\.example\\.com\\\\2"
      - type: contains
        target: haproxy.cfg
        pattern: "http-response replace-header Set-Cookie \\(.\\*\\)Path=/api\\(.\\*\\) \\\\1Path=/\\\\2"

  test-nginx-ingress-proxy-ssl-name-default-off-verify-none:
    description: proxy-ssl-name alone (no proxy-ssl-verify) does NOT request verification — matching nginx's default-off it emits verify none + sni and omits verifyhost (not a fail-open; verification was never requested)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: pssl-svc}
          spec:
            ports: [{port: 443}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pssl-noca
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/proxy-ssl-name: "up.internal"
          spec:
            ingressClassName: nginx
            rules:
              - host: pssl.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pssl-svc, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "ssl verify none sni str\\(up\\.internal\\)"
      - type: not_contains
        target: haproxy.cfg
        pattern: "verifyhost"
      - type: not_contains
        target: haproxy.cfg
        pattern: "verify required"

  test-nginx-ingress-proxy-ssl-verify-on-without-ca-rejected:
    description: proxy-ssl-verify with a truthy value ("True", case-insensitive) but no CA fails the render fail-closed (never silently downgrades to verify none)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: pssl-fc-svc}
          spec:
            ports: [{port: 443}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pssl-fc
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/proxy-ssl-verify: "True"
              nginx.ingress.kubernetes.io/proxy-ssl-name: "up.internal"
          spec:
            ingressClassName: nginx
            rules:
              - host: pfc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pssl-fc-svc, port: {number: 443}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "proxy-ssl-verify: on on Ingress 'default/pssl-fc' requires"

  test-nginx-ingress-upstream-vhost-injection-rejected:
    description: A control character in upstream-vhost aborts the render (config-injection guard)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: inj-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: inj-ing
            annotations:
              nginx.ingress.kubernetes.io/upstream-vhost: "evil.example.com\nhttp-request deny"
          spec:
            ingressClassName: nginx
            rules:
              - host: inj.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: inj-svc, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "must not contain control characters"
