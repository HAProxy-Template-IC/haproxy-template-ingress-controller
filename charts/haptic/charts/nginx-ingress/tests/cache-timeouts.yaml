validationTests:
  test-cache-dispatch-timeout-nginx:
    extraContext:
      cache:
        varnish:
          enabled: true
        haproxy:
          responseTimeoutMs: 2000
    fixtures:
      ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: slow
          namespace: default
          annotations:
            nginx.ingress.kubernetes.io/proxy-read-timeout: '7200'
        spec:
          ingressClassName: haptic
          rules:
          - host: slow.example.com
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: echo
                    port:
                      number: 80
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:cache-dispatch-timeout.map
      pattern: (?m)^budget 28806900$
