# nginx-ingress library — redirect + canary validation tests.
# permanent/temporal redirect, multi-sibling redirect, upstream-hash, canary
# by header and by weight.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  test-nginx-ingress-permanent-redirect:
    description: Nginx Ingress permanent-redirect generates 301 redirect
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: permredir-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://new.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: permredir.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-301.map
        pattern: "permredir.example.com https://new.example.com"

  test-nginx-ingress-temporal-redirect:
    description: Nginx Ingress temporal-redirect generates 302 redirect
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tempredir-ingress
            annotations:
              nginx.ingress.kubernetes.io/temporal-redirect: "https://temp.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tempredir.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-302.map
        pattern: "tempredir.example.com https://temp.example.com"

  test-nginx-ingress-permanent-redirect-code:
    description: permanent-redirect-code overrides the default 301 redirect status
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: permcode-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: permcode-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://new.example.com"
              nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
          spec:
            ingressClassName: haproxy
            rules:
              - host: permcode.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: permcode-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-308.map
        pattern: "permcode.example.com https://new.example.com"
      - {type: not_contains, target: haproxy.cfg, pattern: "code 301"}

  test-nginx-ingress-temporal-redirect-code:
    description: temporal-redirect-code overrides the default 302 redirect status
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: tempcode-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tempcode-ingress
            annotations:
              nginx.ingress.kubernetes.io/temporal-redirect: "https://temp.example.com"
              nginx.ingress.kubernetes.io/temporal-redirect-code: "307"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tempcode.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: tempcode-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-307.map
        pattern: "tempcode.example.com https://temp.example.com"

  test-nginx-ingress-redirect-loc-map-sorted:
    description: redirect-loc map lines are sorted by host (deterministic output, no reload churn)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: sort-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: zzz-sort-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://dest.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: zzz-sort.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: sort-service, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: aaa-sort-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://dest.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: aaa-sort.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: sort-service, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      # Both hosts land in redirect-loc-301.map; the 'aaa' line must precede the
      # 'zzz' line regardless of ingress iteration order (sorted, not map order).
      - type: contains
        target: map:redirect-loc-301.map
        pattern: "aaa-sort\\.example\\.com [^\\n]*\\nzzz-sort\\.example\\.com"

  test-nginx-ingress-from-to-www-redirect-apex:
    description: from-to-www-redirect on an apex host redirects to the www. form (301)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: apexwww-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: apexwww-ingress
            annotations:
              nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: apexwww-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:from-to-www.map, pattern: "example.com www.example.com"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect prefix https://%\\[var\\(txn.host\\),map\\([^)]*from-to-www\\.map\\)\\] code 301 if \\{ ssl_fc \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect prefix http://%\\[var\\(txn.host\\),map\\([^)]*from-to-www\\.map\\)\\] code 301 if !\\{ ssl_fc \\}"

  test-nginx-ingress-from-to-www-redirect-www:
    description: from-to-www-redirect on a www. host redirects to the apex form (301)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: wwwapex-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wwwapex-ingress
            annotations:
              nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: www.foo.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: wwwapex-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:from-to-www.map, pattern: "www.foo.com foo.com"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect prefix https://%\\[var\\(txn.host\\),map\\([^)]*from-to-www\\.map\\)\\] code 301 if \\{ ssl_fc \\}"

  test-nginx-ingress-redirect-with-many-siblings:
    # Reproducer for the test-e2e:[3.x] flake where TestIngressNginxTemporalRedirect /
    # TestIngressNginxPermanentRedirect sees its redirect rule disappear from
    # the running HAProxy config under heavy parallel-test churn. The chart
    # rendering itself is a pure function of the input resources; if the
    # render IS deterministic across many sibling Ingresses (all with their
    # own annotations contributing http_request_rules to the shared
    # http_frontend), the residual flake is dataplane-side, not chart-side.
    # If the render is NON-deterministic — e.g., the chart's iteration order
    # leaks into ordering of the redirect rules, and the redirect Ingress's
    # rule sometimes lands at a position that collides with a sibling — the
    # bug is right here in this test.
    description: redirect rule survives when many sibling Ingresses contribute http_request_rules to the same http_frontend
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: redir-svc}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: cors-svc}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: rewrite-svc}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: hsts-svc}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: srcip-svc}
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: redir-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: redir-svc
          addressType: IPv4
          endpoints: [{addresses: ["10.0.0.1"]}]
          ports: [{port: 8080}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cors-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: cors-svc
          addressType: IPv4
          endpoints: [{addresses: ["10.0.0.2"]}]
          ports: [{port: 8080}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: rewrite-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: rewrite-svc
          addressType: IPv4
          endpoints: [{addresses: ["10.0.0.3"]}]
          ports: [{port: 8080}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: hsts-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: hsts-svc
          addressType: IPv4
          endpoints: [{addresses: ["10.0.0.4"]}]
          ports: [{port: 8080}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: srcip-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: srcip-svc
          addressType: IPv4
          endpoints: [{addresses: ["10.0.0.5"]}]
          ports: [{port: 8080}]
      ingresses:
        # The redirect-bearing Ingress under test. The remaining ingresses
        # each contribute their own http_request_rule(s) to the shared
        # http_frontend so we hit the chart's many-rules-in-one-frontend
        # path, which is what the e2e flake exercises.
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: redir-ingress
            annotations:
              nginx.ingress.kubernetes.io/temporal-redirect: "https://flake-repro.example.com/temp"
          spec:
            ingressClassName: haproxy
            rules:
              - host: redir.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: redir-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              nginx.ingress.kubernetes.io/enable-cors: "true"
              nginx.ingress.kubernetes.io/cors-allow-origin: "https://allowed.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cors.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: cors-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rewrite-ingress
            annotations:
              nginx.ingress.kubernetes.io/rewrite-target: "/new"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rewrite.example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend: {service: {name: rewrite-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hsts-ingress
            annotations:
              haproxy-ingress.github.io/hsts: "true"
              haproxy-ingress.github.io/hsts-max-age: "31536000"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hsts.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: hsts-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: srcip-ingress
            annotations:
              haproxy-ingress.github.io/whitelist-source-range: "10.0.0.0/8"
          spec:
            ingressClassName: haproxy
            rules:
              - host: srcip.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: srcip-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:redirect-loc-302.map
        pattern: "redir.example.com https://flake-repro.example.com/temp"

  test-nginx-ingress-upstream-hash-header:
    description: Nginx Ingress upstream-hash-by translates $http_ variables
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-ingress
            annotations:
              nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_forwarded_for"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hash.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "balance hash req\\.hdr\\(x-forwarded-for\\)"}
      - {type: contains, target: haproxy.cfg, pattern: "hash-type consistent"}

  test-nginx-ingress-canary-by-header:
    description: Nginx Ingress canary by header generates use_backend rule
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: main-service}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: canary-service}
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: main-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: main-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: canary-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: canary-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: main-ingress}
          spec:
            ingressClassName: haproxy
            rules:
              - host: canary.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: main-service, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-ingress
            annotations:
              nginx.ingress.kubernetes.io/canary: "true"
              nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
          spec:
            ingressClassName: haproxy
            rules:
              - host: canary.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: canary-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "use_backend"}
      - {type: contains, target: haproxy.cfg, pattern: "req\\.hdr\\(X-Canary\\)"}

  test-nginx-ingress-canary-by-weight:
