# nginx-ingress library — server-alias validation tests.
# An alias host routes to the same backends as the Ingress's rule host(s).
validationTests:
  test-nginx-ingress-server-alias:
    description: server-alias adds alias hostnames to the host map pointing at the same normalized host key as the rule host
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: alias-ingress
            annotations:
              nginx.ingress.kubernetes.io/server-alias: "www.example.com, alias.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: app.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:host.map, pattern: "www\\.example\\.com app\\.example\\.com"}
      - {type: contains, target: map:host.map, pattern: "alias\\.example\\.com app\\.example\\.com"}

  test-nginx-ingress-server-alias-wildcard:
    description: server-alias normalizes a wildcard alias the same way rule hosts are normalized (leading * stripped)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: aliasw-ingress
            annotations:
              nginx.ingress.kubernetes.io/server-alias: "*.wild.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: primary.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:host.map, pattern: "\\.wild\\.example\\.com primary\\.example\\.com"}

  # server-alias config-injection guard: exercised in the shared hostile-Ingress
  # test (test-nginx-ingress-warn-guards-skip-injection, annotations.yaml).
