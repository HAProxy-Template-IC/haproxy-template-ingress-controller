# nginx-ingress library — auth, external-auth (SPOE), and WAF.
# auth-* SPOE map contributions + pass-headers, the basic-auth backend
# directive, the auth userlists (global-top), and the Coraza scan + coraza
# map contributions. Consumes the spoa-hub library SPOE extension points.
templateSnippets:
  # External-auth (auth-url) map contribution. The spoa-hub library
  # defines auth-url.map and the SPOE wiring; this snippet feeds the
  # map with one entry per Ingress that has the auth-url annotation set.
  # The frontend looks up the URL by `txn.resource_id` (= `<ns>/<name>`,
  # set in base.yaml from the routing chain's qualifier value) and
  # triggers the SPOE plugin.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-url: "https://auth-svc.example/check"
  #
  # Keying. The map is keyed by the OWNING Ingress's `<ns>/<name>`, not by
  # `<host><path>`. This is correct for any path type the routing chain
  # already resolved — Exact, Prefix, regex, wildcard host. Earlier
  # implementations of this snippet keyed on host+path and silently
  # missed for any non-Exact path; see commit history / plan archive.
  #
  # Out of scope (need upstream plugin / chart-architecture work):
  #   - auth-proxy-set-headers (plugin v0.3.0+ supports per-request
  #     forward_headers, but nginx-ingress's `auth-snippet` is
  #     freeform HAProxy config injection — not parseable into a
  #     header allowlist; haproxy-ingress flavour wires this via
  #     auth-headers-request)
  map-auth-url-500-nginx-ingress:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authUrl = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-url"] -%}
        {%- if authUrl != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var inj = ConfigInjectionKind(authUrl, "line") -%}
          {%- if inj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress " + ns + "/" + name + " annotation 'nginx.ingress.kubernetes.io/auth-url' value contains " + inj + ", which would inject an entry into the auth routing map; external auth is not applied. Remove control characters from the value.") -}}
            {%- continue -%}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authUrl }}
        {%- end -%}
      {%- end -%}

  # External-auth sign-in URL: when the auth service returns 401, redirect
  # the browser to this URL instead of denying. Standard pattern for
  # OIDC / SAML flows where unauthenticated users go to a login page.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-signin: "https://login.example/oauth2/start?rd=$escaped_request_uri"
  #
  # Note: HAProxy doesn't expand nginx variables ($escaped_request_uri etc.)
  # at redirect time; the URL is used verbatim. Operators wanting the
  # original-request preservation pattern need to add a query param via
  # the SPOA hub plugin (or use a redirect-aware auth service like
  # oauth2-proxy that handles it server-side).
  map-auth-signin-500-nginx-ingress:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authSignin = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-signin"] -%}
        {%- if authSignin != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var inj = ConfigInjectionKind(authSignin, "line") -%}
          {%- if inj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress " + ns + "/" + name + " annotation 'nginx.ingress.kubernetes.io/auth-signin' value contains " + inj + ", which would inject an entry into the auth sign-in map; the sign-in redirect is not applied. Remove control characters from the value.") -}}
            {%- continue -%}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authSignin }}
        {%- end -%}
      {%- end -%}

  # External-auth HTTP method override. Picked up by the spoa-hub
  # library's auth-method.map and threaded into the SPOE check-auth
  # message's `method` arg (plugin v0.3.0+). Without this annotation
  # the plugin uses its plugin-level method config (default GET).
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-method: "POST"
  #
  # The plugin allowlists GET / HEAD / POST / PUT / PATCH / DELETE /
  # OPTIONS; values outside that set produce an SPOE-side validation
  # error. Body-having methods (POST/PUT/PATCH) go out with an empty
  # body — the plugin does not forward the original request payload.
  map-auth-method-500-nginx-ingress:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authMethod = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-method"] -%}
        {%- if authMethod != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var inj = ConfigInjectionKind(authMethod, "line") -%}
          {%- if inj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress " + ns + "/" + name + " annotation 'nginx.ingress.kubernetes.io/auth-method' value contains " + inj + ", which would inject an entry into the auth method map; the method override is not applied. Remove control characters from the value.") -}}
            {%- continue -%}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authMethod }}
        {%- end -%}
      {%- end -%}

  # External-auth response-headers allowlist. Per-ingress comma-list of
  # response header names the SPOA hub should extract from the auth
  # reply and forward to the upstream backend on successful auth.
  # Lands in auth-extract-headers.map (which the spoa-hub library
  # threads into the SPOE message's `extract_headers` arg) and the
  # frontend-spoe-set-pass-headers-* extension point below emits one
  # `http-request set-header` per unique header.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User, X-Auth-Roles"
  #
  # Plugin v0.3.0+ extracts headers on every reply path (2xx, 3xx,
  # 4xx, 5xx) and exposes each as a transaction variable
  # `txn.hub.external_auth.<name>` (lower-cased, dashes → underscores).
  # The set-header directives are gated on `allowed -m bool` so they
  # only fire on auth success.
  # passHeaders is a comma-space list of header names written raw into this map
  # value. Guarded locally in line context (not mapkey): the ", " separator is
  # legitimate, and a control character is the real injection (a newline would
  # start a second map entry). Auth = security, so fail closed.
  map-auth-extract-headers-500-nginx-ingress:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var passHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-response-headers"] -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var inj = ConfigInjectionKind(passHeaders, "line") -%}
          {%- if inj != "" -%}
            {{- fail("Invalid value for annotation 'nginx.ingress.kubernetes.io/auth-response-headers' on Ingress '" + ns + "/" + name + "': contains " + inj + ", which would inject an entry into the auth response-headers map. Remove control characters from the value.") -}}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ passHeaders }}
        {%- end -%}
      {%- end -%}

  # Companion to map-auth-extract-headers-500-nginx-ingress: emit one
  # `http-request set-header` line per UNIQUE header across all
  # ingresses with auth-response-headers, so the plugin's extracted
  # txn vars get forwarded to the upstream backend on successful
  # auth. Per-route gating happens implicitly: the plugin only sets a
  # txn var when the header is in that route's per-ingress
  # extract_headers SPOE arg AND the auth response actually included
  # it. Routes that didn't ask for the header just see the
  # set-header skipped via `var ... -m found`.
  frontend-spoe-set-pass-headers-500-nginx-ingress:
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {#- Same render-shared dedup pattern as haproxy-ingress.yaml's
          equivalent snippet (see issue #49). The chart renders this
          snippet inside `frontend-filters-*` for both http_frontend
          AND http_frontend_h2c — `first_seen` would silently dedup
          across the two frontend renders, leaving the second
          frontend without the set-header directives.
      -#}
      {%- var pairs []any = []any{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var passHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-response-headers"] -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var ingressName = ingress.Metadata.Name -%}
          {%- for _, h := range split(passHeaders, ",") -%}
            {%- var name = h | strip() -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "nginx.ingress.kubernetes.io/auth-response-headers", ns, ingressName) -}}
              {# Dedupe on varName (after dash→underscore) so
                  spellings that collapse to the same plugin txn var
                  produce one set-header directive, not two. #}
              {%- var varName = replace(toLower(name), "-", "_") -%}
              {%- if !seen[varName] -%}
                {%- seen[varName] = true -%}
                {%- pairs = append(pairs, map[string]any{"name": name, "varName": varName}) -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- for _, pair := range pairs -%}
        {%- var pName = pair.(map[string]any)["name"].(string) -%}
        {%- var pVarName = pair.(map[string]any)["varName"].(string) -%}
      {# Strip any client-supplied copy of this trusted header on auth-protected
          routes BEFORE re-adding the plugin value, so a forged inbound header
          can't survive to the backend when the auth reply omits it (the
          set-header below is skipped when its var isn't found). Mirrors
          ingress-nginx's always-overwrite semantics. #}
      {{ "\n" }}      http-request del-header {{ pName }} if { var(txn.auth_url) -m found }
      {{ "\n" }}      http-request set-header {{ pName }} %[var(txn.hub.external_auth.{{ pVarName }})] if { var(txn.hub.external_auth.{{ pVarName }}) -m found } { var(txn.hub.external_auth.allowed) -m bool }
      {%- end -%}

  backend-directives-760-nginx-ingress-auth:
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {#-
        Nginx Ingress Basic Auth Backend Directive

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-type: "basic" (required)
          - nginx.ingress.kubernetes.io/auth-secret: "<ns/name>" or "<name>" (required)
          - nginx.ingress.kubernetes.io/auth-realm: "<realm>" (optional, default: "Restricted")

        Only auth-type "basic" is supported. Other types will fail with an error.

        Generates:
          http-request auth realm "<realm>" unless { http_auth(ni_auth_<secretNs>_<secretName>) }
      -#}
      {%- import "util-nginx-ingress-satisfy" for SatisfyAnyMode -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var authType = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-type"] %}
        {%- if authType != "" %}
          {%- if authType != "basic" %}
            {{- fail("Unsupported auth-type '" + authType + "' for annotation 'nginx.ingress.kubernetes.io/auth-type' on Ingress '" + key + "'. Only 'basic' is supported.") -}}
          {%- end %}
          {%- var authSecret = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-secret"] %}
          {%- if authSecret != "" %}
            {%- var authRealm = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-realm"] %}
            {%- if authRealm == "" %}{%- authRealm = "Restricted" %}{%- end %}
            {%- var realmInj = ConfigInjectionKind(authRealm, "line") %}
            {%- if realmInj != "" %}
              {{- fail("Invalid value for annotation 'nginx.ingress.kubernetes.io/auth-realm' on Ingress '" + key + "': contains " + realmInj + ", which would break the auth realm directive. Remove control characters from the value.") -}}
            {%- end %}
            {%- var secretNs = ns %}
            {%- var secretName = authSecret %}
            {%- if strings_contains(authSecret, "/") %}
              {%- var parts = split(authSecret, "/") %}
              {%- secretNs = parts[0] %}
              {%- secretName = parts[1] %}
            {%- end %}
            {%- var userlistName = "ni_auth_" + secretNs + "_" + secretName %}
            {#-
              Skip the http_auth ACL ref when the referenced Secret isn't in
              the controller's cache; the matching userlist snippet skips its
              userlist on the same condition so the rendered config stays
              self-consistent.

              The Secret lookup goes through shared.ComputeIfAbsent so both
              this snippet and the userlist snippet (which runs in a separate
              section earlier in the render) see the same answer. Stores are
              live during render, so a direct GetSingle in each snippet can
              observe different states if the informer lands an update
              between the two reads — that's the race commit 60e867fd
              guarded against at the call sites but didn't make coherent.
            -#}
            {%- var nginxAuthSecretAny, _ = shared.ComputeIfAbsent("nginx_auth_secret:" + secretNs + "/" + secretName, func() any {
              return resources.secrets.GetSingle(secretNs, secretName)
            }) %}
            {#- Assert to the typed pointer before the nil check (see the userlist
                snippet below): a boxed typed-nil *resources.secrets.T passes `!= nil`,
                which would emit an http_auth ref to a userlist the (correctly-skipping)
                userlist snippet never produced — `haproxy -c` then fails with
                "unable to find userlist". -#}
            {%- var nginxAuthSecret, _ = nginxAuthSecretAny.(*resources.secrets.T) %}
            {#- Under satisfy=any the auth challenge is folded into the combined
                IP-or-auth gate emitted by backend-directives-765, so suppress
                the unconditional challenge here (an allow-listed IP must pass
                without authenticating). -#}
            {%- if nginxAuthSecret == nil %}
              {# Before the satisfy fold: the combined gate in -765 has no userlist
                  either, so deferring to it would still serve unauthenticated. #}
              {{- recordEvent(ingress, "AuthSecretMissing", "Ingress " + key + " sets 'nginx.ingress.kubernetes.io/auth-secret', but that Secret could not be resolved. Basic auth cannot be enforced without it, so this route fails closed with 503. Create the Secret, or remove the auth annotations.") -}}
      # WARNING nginx.ingress.kubernetes.io/auth-secret: Secret not resolvable for {{ key }}; failing closed (503) until it is present.
      http-request set-var(txn.denied_by) str(basic_auth_unavailable)
      http-request deny deny_status 503
            {%- else if SatisfyAnyMode(ingress) == "" %}
      # nginx-ingress/backend-directives-auth ({{ key }})
      http-request set-var(txn.denied_by) str(basic_auth) unless { http_auth({{ userlistName }}) }
      http-request auth realm "{{ EscapeDquoteValue(authRealm) }}" unless { http_auth({{ userlistName }}) }
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # ============================================================================
  # Global Top (Auth Userlists)
  # ============================================================================

  global-top-700-nginx-ingress-auth:
    template: |
      {#
        Nginx Ingress Basic Auth Userlist Generation

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-type: "basic" (required)
          - nginx.ingress.kubernetes.io/auth-secret: "<ns/name>" or "<name>" (required)

        Nginx-ingress Secret format:
          The secret has a single key named "auth" containing htpasswd-format data:
            username:hash\n
            username:hash\n

          The "auth" key value is base64-encoded in the Secret's data field.

        Generated HAProxy Config:
          userlist ni_auth_<ns>_<name>
            user <username> password '<hash>'
      #}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var authType = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-type"] %}
        {%- if authType == "basic" %}
          {%- var authSecret = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-secret"] %}
          {%- if authSecret != "" %}
            {%- var secretNs = ns %}
            {%- var secretName = authSecret %}
            {%- if strings_contains(authSecret, "/") %}
              {%- var parts = split(authSecret, "/") %}
              {%- secretNs = parts[0] %}
              {%- secretName = parts[1] %}
            {%- end %}
            {#- auth-secret-type selects how the Secret encodes credentials:
                auth-file (default) = a single `auth` key holding an htpasswd file
                (username:hash lines); auth-map = each Secret data key is a username
                and its value is that user's password hash. -#}
            {%- var secretType = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-secret-type"] %}
            {%- if secretType == "" %}{%- secretType = "auth-file" %}{%- end %}
            {%- if secretType != "auth-file" && secretType != "auth-map" %}
              {{- fail("Invalid value '" + secretType + "' for annotation 'nginx.ingress.kubernetes.io/auth-secret-type' on Ingress '" + key + "'. Valid values: 'auth-file', 'auth-map'.") -}}
            {%- end %}
            {%- var userlistName = "ni_auth_" + secretNs + "_" + secretName %}
            {%- if first_seen("ni_userlist", userlistName) %}
              {#-
                Skip both the userlist and the matching backend ACL ref when the
                referenced Secret isn't in the controller's cache (informer not
                yet caught up, or the Secret was just cascade-deleted while the
                Ingress still lingers). The next render — once the cache catches
                up — will produce the full auth setup.

                Goes through shared.ComputeIfAbsent so the matching http_auth
                snippet sees the same Secret presence/absence; stores are live
                during render and two direct GetSingle calls can observe
                different states.
              -#}
              {%- var secretAny, _ = shared.ComputeIfAbsent("nginx_auth_secret:" + secretNs + "/" + secretName, func() any {
                return resources.secrets.GetSingle(secretNs, secretName)
              }) %}
              {#- Assert to the typed pointer BEFORE the nil check. GetSingle returns a
                  typed *resources.secrets.T — a typed-nil when the Secret is absent —
                  and boxing that through the closure's `any` yields a NON-nil interface,
                  so `secretAny != nil` would pass for an absent Secret and the `.Data`
                  access below would dereference a nil pointer. -#}
              {%- var secret, _ = secretAny.(*resources.secrets.T) %}
              {%- if secret != nil %}
                {%- if secretType == "auth-file" %}
                {%- var authData = secret.Data["auth"] | b64decode() | tostring() %}
                {%- if authData != "" %}
      # nginx-ingress/global-top-auth ({{ key }})
      userlist {{ userlistName }}
                  {%- for _, line := range split(authData, "\n") %}
                    {%- var lineTrimmed = trimSpace(line) %}
                    {%- if lineTrimmed != "" %}
                      {#- Split on first colon only: username:password_hash -#}
                      {%- var colonIdx = index(lineTrimmed, ":") %}
                      {%- if colonIdx > 0 %}
                        {%- var username = lineTrimmed[:colonIdx] %}
                        {%- var passwordHash = lineTrimmed[colonIdx+1:] %}
                        {#- The hash is emitted inside single quotes; reject any
                            value outside the htpasswd-hash charset (quote, space,
                            newline, control char) so a hostile Secret value cannot
                            break out of the line or inject a directive. -#}
                        {%- if !regex_search(passwordHash, "^[A-Za-z0-9$./{}=+_-]+$") %}
                          {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced by annotation 'nginx.ingress.kubernetes.io/auth-secret' on Ingress '" + key + "' has an invalid password hash for user '" + username + "' (only htpasswd-hash characters are permitted).") -}}
                        {%- end %}
        user {{ username }} password '{{ passwordHash }}'
                      {%- end %}
                    {%- end %}
                  {%- end %}
                {%- else %}
                  {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced by annotation 'nginx.ingress.kubernetes.io/auth-secret' on Ingress '" + key + "' has empty 'auth' key.") -}}
                {%- end %}
                {%- else %}
                {# auth-map: each Secret data key is a username, its value the password hash. #}
      # nginx-ingress/global-top-auth ({{ key }})
      userlist {{ userlistName }}
                  {%- for _, username := range keys(secret.Data) %}
                    {%- var passwordHash = secret.Data[username] | b64decode() | tostring() %}
                    {%- if username == "" || passwordHash == "" %}
                      {{- fail("Secret '" + secretNs + "/" + secretName + "' (auth-map) referenced by annotation 'nginx.ingress.kubernetes.io/auth-secret' on Ingress '" + key + "' has an empty username or hash.") -}}
                    {%- end %}
                    {#- Same config-injection guard as the auth-file branch: the
                        decoded value is operator-controlled and emitted inside
                        single quotes. -#}
                    {%- if !regex_search(passwordHash, "^[A-Za-z0-9$./{}=+_-]+$") %}
                      {{- fail("Secret '" + secretNs + "/" + secretName + "' (auth-map) referenced by annotation 'nginx.ingress.kubernetes.io/auth-secret' on Ingress '" + key + "' has an invalid password hash for user '" + username + "' (only htpasswd-hash characters are permitted).") -}}
                    {%- end %}
        user {{ username }} password '{{ passwordHash }}'
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # Coraza WAF: scan Ingresses for nginx.ingress.kubernetes.io/modsecurity-snippet
  # and nginx.ingress.kubernetes.io/enable-modsecurity annotations, populate
  # gf["sphCorazaApps"] and gf["sphCorazaDisabledKeys"] for the spoa-hub library
  # to consume. The scan + validation lives here (not in spoa-hub.yaml) per
  # RULE #1: spoa-hub.yaml must stay agnostic about Ingress / HTTPRoute / etc.
  # — annotations specific to nginx-ingress belong with the rest of the
  # nginx-ingress annotation surface.
  #
  # Cached via shared.ComputeIfAbsent so the scan runs at most once per
  # render. Consumers re-fetch through `render "util-nginx-ingress-coraza-scan"`:
  #   - spoa-hub.yaml's spoa-hub-config-content reads gf["sphCorazaApps"]
  #     to emit per-app `[plugins.params.applications."<ns>/<name>"]` blocks.
  #   - map-coraza-app-500-nginx-ingress emits coraza-app.map entries.
  #   - map-coraza-disabled-500-nginx-ingress emits coraza-disabled.map entries.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#modsecurity
  #
  # Annotations:
  #   nginx.ingress.kubernetes.io/modsecurity-snippet: <SecRule body>
  #     → per-Ingress WAF instance, bound to the Ingress's <ns>/<name>
  #       via coraza-app.map. Rules don't bleed into other Ingresses'
  #       traffic.
  #   nginx.ingress.kubernetes.io/enable-modsecurity: "false"
  #     → entry in coraza-disabled.map; the resource_id is excluded from the
  #       unconditional default-on dispatch in frontend-spoe-filters-050-coraza.
  #     "true" is accepted as a no-op (modsecurity-snippet already implies opt-in).
  #
  # Validation (route-scoped, like the native library's rejectRoute):
  #   - modsec-snippet contains TOML triple-quote (injection vector — TOML
  #     multi-line basic strings have no escape; """ would let an Ingress-
  #     write RBAC holder break out of the directives string and inject
  #     arbitrary TOML keys).
  #   - enable-modsecurity value other than "true"/"false".
  #   - governance denials (allowCustomRules / allowWafDisable) and the
  #     per-Ingress rule byte/count limits.
  #   A violation hard-fails ONLY the violating Ingress's own admission
  #   (admissionSubject match); on any other render the route fails closed
  #   with 503 (frontend-filters-114 below) plus a Warning Event, so one
  #   already-present bad Ingress can never wedge unrelated admissions or
  #   config updates. Still fail() (all modes): annotations present without
  #   the coraza plugin enabled in spoaHub.plugins — the 503 fail-closed
  #   machinery itself needs the plugin, and silent ignore would hide a real
  #   misconfiguration where nothing enforces the declared WAF intent.
  util-nginx-ingress-coraza-scan:
    template: |-
      {%- import "util-waf-governance" for WafGovernance -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("sphCorazaScanNginx", func() any {
          var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} })
          var gf = shared.Get("globalFeatures").(map[string]any)

          // Determine whether the coraza plugin is enabled (used by the
          // post-scan annotation-without-plugin validation).
          var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice()
          var corazaEnabled = false
          for _, p := range plugins {
            var pName = p.(map[string]any)["name"].(string)
            if pName == "coraza" {
              corazaEnabled = true
            }
          }
          var gov = map[string]any{}
          var _ = WafGovernance(gov)
          var hapticAllowWafDisable = gov["allowWafDisable"].(bool)
          var hapticAllowCustomRules = gov["allowCustomRules"].(bool)
          var maxCustomRuleIngresses = gov["maxCustomRuleIngresses"].(int)
          var maxCustomRuleBytesPerIngress = gov["maxCustomRuleBytesPerIngress"].(int)

          // Dedupe modsec apps by `ns/name`. Under UPDATE admission, the
          // dryrun-validator's overlay may carry both the existing Ingress
          // AND the proposed-new version side-by-side; without dedupe we'd
          // emit two `[plugins.params.applications."<ns>/<name>"]` headers
          // and the TOML parser would reject with `duplicate key`. The
          // map keyed by ns/name keeps the LAST seen entry, which under
          // the overlay's append-after-base ordering is the proposed
          // version — exactly what the dryrun-validator should be checking.
          var byKey = map[string]any{}
          var disabledKeys = []any{}
          var brokenRoutes = []any{}
          var rejectedKeys = map[string]bool{}
          var firstAnnotationKey = ""
          var firstAnnotationName = ""
          var anyAnnotation = false

          for _, ingress := range resources.ingresses.List() {
            var ns = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name
            var key = ns + "/" + name
            // Route-scoped rejection, mirroring the native library's
            // rejectRoute: hard-fail ONLY when this Ingress is the resource
            // under admission review; otherwise record a Warning Event and
            // fail the route closed (503 via this library's own
            // frontend-filters-114 emission) so one already-present bad
            // Ingress can never wedge an unrelated admission or a config
            // update. First reason wins.
            var subjectMatchesStore = tostring(admissionSubject | dig("store") | fallback("")) == "ingresses" || tostring(admissionSubject | dig("stores", "ingresses") | fallback(false)) == "true"
            var underAdmission = renderMode == "admission" && subjectMatchesStore && tostring(admissionSubject | dig("namespace") | fallback("")) == ns && tostring(admissionSubject | dig("name") | fallback("")) == name
            var rejectIngress = func(reason string, message string) {
              if underAdmission { fail(message) }
              if rejectedKeys[key] { return }
              rejectedKeys[key] = true
              recordEvent(ingress, reason, message)
              brokenRoutes = append(brokenRoutes, map[string]any{"resourceID": key, "reason": message})
            }

            var snippet = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/modsecurity-snippet"]
            if snippet != "" {
              if !hapticAllowCustomRules {
                rejectIngress("WafPermissionDenied", "Ingress " + key + " sets 'nginx.ingress.kubernetes.io/modsecurity-snippet', but the HAPTIC administrator disabled Ingress-authored custom WAF rules with extraContext.waf.ingressPermissions.allowCustomRules=false.")
              } else if strings_contains(snippet, "\"\"\"") {
                rejectIngress("WafAnnotationInvalid", "Ingress " + key + " annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' contains a TOML triple-quote delimiter (\"\"\"); this would break the rendered coraza directives multi-line string and is rejected. Remove the triple-quote sequence from the SecRule(s).")
              } else if len(snippet) > maxCustomRuleBytesPerIngress {
                rejectIngress("WafAnnotationInvalid", "Ingress " + key + " annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' is " + tostring(len(snippet)) + " bytes; the configured per-Ingress custom-rule limit is " + tostring(maxCustomRuleBytesPerIngress) + ".")
              } else if byKey[key] == nil && len(byKey) >= maxCustomRuleIngresses {
                rejectIngress("WafAnnotationInvalid", "Ingress " + key + " exceeds the configured custom-rule Ingress limit " + tostring(maxCustomRuleIngresses) + ". Move shared rules into a named HAPTIC policy or raise extraContext.waf.customRules.limits.maxIngresses deliberately.")
              }
              if rejectedKeys[key] {
                continue
              }
              // coraza-app.map is keyed by <ns>/<name> (resource id), not
              // by <host><path> — see frontend-spoe-filters-050-coraza
              // and base.yaml's resource_id extraction. Host-less rules
              // are fine because the routing chain still produces a
              // resource_id whatever path/host pattern matched.
              byKey[key] = map[string]any{
                "ns": ns,
                "name": name,
                "source": "nginx-ingress modsecurity-snippet from " + key,
                "snippet": snippet,
              }
              if !anyAnnotation {
                firstAnnotationKey = key
                firstAnnotationName = "nginx.ingress.kubernetes.io/modsecurity-snippet"
                anyAnnotation = true
              }
            }

            var v = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/enable-modsecurity"]
            if v == "false" {
              if !hapticAllowWafDisable {
                rejectIngress("WafPermissionDenied", "Ingress " + key + " disables WAF with 'nginx.ingress.kubernetes.io/enable-modsecurity: false', but the HAPTIC administrator disabled Ingress WAF opt-outs with extraContext.waf.ingressPermissions.allowWafDisable=false.")
                continue
              }
              disabledKeys = append(disabledKeys, key)
              if !anyAnnotation {
                firstAnnotationKey = key
                firstAnnotationName = "nginx.ingress.kubernetes.io/enable-modsecurity"
                anyAnnotation = true
              }
            } else if v == "true" {
              // No map entry — `enable-modsecurity: "true"` is a no-op
              // because opt-in is already implied by modsecurity-snippet
              // (rule customisation) and by haproxy-ingress.github.io's
              // `waf: modsecurity` annotation. We still surface the
              // annotation for the plugin-enabled check so a "true" alone
              // doesn't silently pass when coraza is disabled.
              if !anyAnnotation {
                firstAnnotationKey = key
                firstAnnotationName = "nginx.ingress.kubernetes.io/enable-modsecurity"
                anyAnnotation = true
              }
            } else if v != "" {
              rejectIngress("WafAnnotationInvalid", "Ingress " + key + " has nginx.ingress.kubernetes.io/enable-modsecurity: \"" + v + "\"; allowed values are \"true\" or \"false\".")
            }
          }

          if anyAnnotation && !corazaEnabled {
            fail("Ingress " + firstAnnotationKey + " sets annotation '" + firstAnnotationName + "' but the spoaHub coraza plugin is not enabled. Either enable spoaHub.plugins.coraza or remove the annotation.")
          }

          // Reduce the map back to a deterministic-order slice so the
          // rendered TOML's `[plugins.params.applications."<ns>/<name>"]`
          // blocks come out in stable namespace+name order across
          // reconciliations.
          var sortedKeys = keys(byKey)
          var modsecApps = []any{}
          for _, k := range sortedKeys {
            // Under UPDATE admission the overlay can carry base + proposed
            // versions of one Ingress; if any version was rejected the key
            // is broken and must not register an app.
            if rejectedKeys[k] { continue }
            modsecApps = append(modsecApps, byKey[k])
          }
          gf["sphCorazaApps"] = modsecApps
          gf["sphCorazaDisabledKeys"] = disabledKeys
          gf["sphNginxBrokenRoutes"] = brokenRoutes
          return true
        })
      %%}

  # coraza-app.map population. Walks the cached util-nginx-ingress-coraza-scan
  # output and emits one `<ns>/<name> <ns>/<name>` identity row per Ingress
  # carrying the modsecurity-snippet annotation. The map is consumed via
  # `var(txn.resource_id),map(...)` (see frontend-spoe-filters-050-coraza in
  # spoa-hub.yaml), so the value sent to the SPOE plugin is the resource id
  # itself.
  # Fail-closed guard for routes whose nginx-ingress WAF annotations were
  # rejected on a live render (governance denial, invalid value, or limit).
  # The admission webhook rejects proposed changes that would introduce
  # these, so this only covers breakage that pre-dates the webhook (e.g. an
  # ingress-nginx migration) or raced past it — such routes declared WAF
  # intent and must fail closed with 503 rather than silently serve with the
  # annotation ignored. Numbered 114 so it never collides with the native
  # library's frontend-filters-113 emission in the render_glob.
  frontend-filters-114-nginx-ingress-waf-fail-closed:
    template: |-
      {%- var _ = render "util-nginx-ingress-coraza-scan" -%}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} }) -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range (gf | dig("sphNginxBrokenRoutes") | fallback([]any{}) | toSlice()) -%}
        {%- var e = entry.(map[string]any) -%}
      # WARNING nginx-ingress WAF annotations on Ingress {{ e["resourceID"].(string) }}: {{ replace(e["reason"].(string), "\n", " ") }} Failing closed (503) for this route until it is fixed.
      http-request set-var(txn.denied_by) str(waf_policy_unavailable) if { var(txn.resource_id) -m str {{ e["resourceID"].(string) }} }
      http-request deny deny_status 503 if { var(txn.resource_id) -m str {{ e["resourceID"].(string) }} }
      {%- end -%}

  map-coraza-app-500-nginx-ingress:
    template: |-
      {%- var _ = render "util-nginx-ingress-coraza-scan" -%}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} }) -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- var modsecApps = gf | dig("sphCorazaApps") | fallback([]any{}) | toSlice() -%}
      {%- for _, app := range modsecApps -%}
        {%- var a = app.(map[string]any) -%}
        {%- var aNs = a | dig_string("", "ns") -%}
        {%- var aName = a | dig_string("", "name") -%}
        {%- if aNs != "" && aName != "" -%}
      {{ "\n" }}{{ aNs }}/{{ aName }} {{ aNs }}/{{ aName }}
        {%- end -%}
      {%- end -%}

  # coraza-disabled.map population: one `<ns>/<name> 1` row per Ingress
  # carrying `nginx.ingress.kubernetes.io/enable-modsecurity: "false"`.
  # Consumed under default-on dispatch (extraContext.waf.dispatch.mode == "default-on")
  # to skip the SPOE roundtrip for resources that opt out. Keyed by
  # `<ns>/<name>` (resource id) — the host dimension is not part of the
  # key, so host-less Ingress rules are fine (the routing chain still
  # resolves them to a resource_id).
  map-coraza-disabled-500-nginx-ingress:
    template: |-
      {%- var _ = render "util-nginx-ingress-coraza-scan" -%}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} }) -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- var disabledKeys = gf | dig("sphCorazaDisabledKeys") | fallback([]any{}) | toSlice() -%}
      {%- for _, key := range disabledKeys -%}
      {{ "\n" }}{{ key.(string) }} 1
      {%- end -%}
