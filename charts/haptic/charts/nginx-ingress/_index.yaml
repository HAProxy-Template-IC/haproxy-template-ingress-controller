# Nginx Ingress compatibility library for HAPTIC
# Provides support for nginx.ingress.kubernetes.io annotation compatibility
# Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
#
# This library is self-contained and works independently of other annotation libraries.
# All annotations use the nginx.ingress.kubernetes.io/* prefix.
#
# Split library (ADR-0008): this _index.yaml is the load-rule authority
# (_helm_load + watchedResources). Production templateSnippets live in the
# sibling fragments by concern — 10-backend-directives, 12-regex-paths,
# 15-proxy-ssl-cookie, 16-server-alias, 17-default-backend, 18-satisfy, 20-frontend-filters,
# 30-features, 40-auth-spoe — and validationTests live under tests/
# (annotations, regex-rewrite, redirects-canary, auth-mtls, proxy-ssl-cookie,
# server-alias, default-backend, satisfy, buffers-limits-affinity,
# unknown-annotations). All fragments merge into one library at
# chart-render time; the merge order is lexicographic, but since each
# snippet/test name is unique the source file it lives in is purely
# organisational.
#
# Supported annotations (see each section for details):
#
# Backend Configuration:
#   - proxy-connect-timeout, proxy-read-timeout, proxy-send-timeout
#   - load-balance
#   - proxy-body-size
#   - backend-protocol
#   - use-proxy-protocol
#   - rewrite-target, use-regex
#   - upstream-hash-by
#   - configuration-snippet
#   - default-backend (annotation; per-host catch-all Service)
#   - proxy-request-buffering, proxy-buffer-size (Event when headers can't fit)
#   - custom-http-errors (error pages fetched from the default backend)
#
# Backend TLS to upstream (only when backend-protocol HTTPS/GRPCS):
#   - proxy-ssl-secret (client cert + CA from a kubernetes.io/tls Secret)
#   - proxy-ssl-verify, proxy-ssl-name/proxy-ssl-server-name
#   - proxy-ssl-ciphers, proxy-ssl-protocols
#   (proxy-ssl-verify-depth has no per-server HAProxy keyword — surfaced as a
#    warning comment, not emitted)
#
# Upstream Set-Cookie rewriting:
#   - proxy-cookie-domain, proxy-cookie-path
#
# Session Affinity:
#   - affinity: cookie, affinity-mode
#   - session-cookie-name, session-cookie-path, session-cookie-domain
#   - session-cookie-secure, session-cookie-samesite
#   - session-cookie-max-age / session-cookie-expires (-> cookie `attr Max-Age=<s>`,
#     the browser cookie lifetime; not HAProxy's internal maxlife stickiness window)
#   (session-cookie-hash is accepted but NOT configurable in HAProxy — it emits a
#    warning; dynamic cookies always hash via dynamic-cookie-key)
#
# Authentication:
#   - auth-type, auth-secret, auth-realm
#
# Rate Limiting:
#   - limit-rps, limit-rpm, limit-connections, limit-whitelist, limit-burst-multiplier
#
# Frontend Filters:
#   - whitelist-source-range, denylist-source-range
#   - ssl-redirect, force-ssl-redirect
#   - hsts, hsts-max-age, hsts-include-subdomains, hsts-preload
#   - enable-cors, cors-allow-origin, cors-allow-methods, cors-allow-headers
#   - cors-allow-credentials, cors-max-age, cors-expose-headers
#   - custom-request-headers, custom-response-headers
#   - app-root
#   - permanent-redirect, permanent-redirect-code
#   - temporal-redirect, temporal-redirect-code
#   - from-to-www-redirect
#   - server-alias (alias hostnames routed to the same backends)
#   - satisfy ("any" → OR-combine whitelist-source-range with basic auth)
#
# Canary:
#   - canary, canary-by-header, canary-by-header-value, canary-by-header-pattern
#   - canary-by-cookie, canary-weight
#
# SSL Features:
#   - ssl-passthrough
#
# mTLS:
#   - auth-tls-pass-certificate-to-upstream, auth-tls-error-page, auth-tls-match-cn
#
# WAF (Coraza, requires spoaHub.plugins.coraza):
#   - modsecurity-snippet, enable-modsecurity

# Chart-time loading rules (consumed by haptic.prepareLibraries; stripped from output).
_helm_load: {enable: '{{ .Values.controller.templateLibraries.nginxIngress.enabled }}'}

# Library-declared extraContext defaults. These flow into the rendered config's
# templatingSettings.extraContext as low-precedence defaults — an operator can
# override any of them via controller.config.templatingSettings.extraContext.
templatingSettings:
  extraContext:
    # The status code for ssl-redirect / force-ssl-redirect HTTP→HTTPS redirects
    # — the equivalent of ingress-nginx's global `http-redirect-code` ConfigMap
    # key. Default 308 (Permanent Redirect, matching ingress-nginx). Valid: 301,
    # 302, 303, 307, 308.
    nginxHttpRedirectCode: "308"
    # The global default backend ("namespace/name") that serves
    # custom-http-errors pages for Ingresses without a default-backend
    # annotation — the equivalent of ingress-nginx's --default-backend-service.
    nginxDefaultBackendService: ""
    # How often custom-http-errors pages are re-fetched (s, m or h; at least
    # 30s). A changed page is deployed with one reload; an unchanged one costs
    # nothing.
    nginxCustomHTTPErrorsRefreshInterval: "5m"

watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]
