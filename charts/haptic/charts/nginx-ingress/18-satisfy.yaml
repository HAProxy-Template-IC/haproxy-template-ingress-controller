# nginx-ingress library — satisfy ("any"/"all").
#
# nginx.ingress.kubernetes.io/satisfy controls how an IP allow-list
# (whitelist-source-range) combines with basic auth:
#   - "all" (default): AND — the request must pass the allow-list AND
#     authenticate. This is the existing independent behavior (the frontend
#     whitelist deny and the backend unconditional auth challenge both fire),
#     so no extra config is emitted for satisfy=all.
#   - "any": OR — the request passes if EITHER its source IP is in the
#     allow-list OR it authenticates. HAProxy expresses this as a single
#     conditional auth challenge in the backend that only fires for
#     non-allow-listed, unauthenticated requests.
#
# Because the whitelist deny lives in the frontend (frontend-filters-700) and
# auth lives in the backend (backend-directives-760), satisfy=any needs both
# of those independent gates suppressed for the affected Ingress and replaced
# by the combined backend check here. The two existing snippets guard on
# SatisfyAnyMode() so the suppression stays scoped to satisfy=any Ingresses.
templateSnippets:
  # Shared predicate: is this Ingress in "satisfy=any combined" mode? True only
  # when satisfy=any AND a whitelist AND basic auth with a resolvable Secret are
  # all present — i.e. when there are genuinely two gates to OR together.
  util-nginx-ingress-satisfy:
    template: |
      {%- macro SatisfyAnyMode(ingress *resources.ingresses.T) string -%}
        {%%
          if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/satisfy"] != "any" {
            show ""
            return
          }
          if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/whitelist-source-range"] == "" {
            show ""
            return
          }
          if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-type"] != "basic" {
            show ""
            return
          }
          var authSecret = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-secret"]
          if authSecret == "" {
            show ""
            return
          }
          var ns = ingress.Metadata.Namespace
          var secretNs = ns
          var secretName = authSecret
          if strings_contains(authSecret, "/") {
            var parts = split(authSecret, "/")
            secretNs = parts[0]
            secretName = parts[1]
          }
          var sec = resources.secrets.GetSingle(secretNs, secretName)
          if sec == nil {
            show ""
            return
          }
          // Non-empty marker = combined mode is active.
          show "any"
        %%}
      {%- end macro -%}

  # A satisfy=any route publishes into the shared lane; one whose allowlist has
  # an IPv6 entry, or whose realm needs escaping, keeps the backend gate.
  ingress-satisfy-0765-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/satisfy']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/whitelist-source-range']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/auth-type']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/auth-secret']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/auth-realm']"
      group: ingress-satisfy
      effects: [publishValue]
    template: |-
      {%- import "util-nginx-ingress-basic-auth-route" for NginxBasicAuthRoute -%}
      {%- import "util-satisfy-publish" for PublishSatisfyAny -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var route = map[string]any{} -%}
        {{- NginxBasicAuthRoute(ingress, true, route) -}}
        {%- if tostring(route["lane"]) == "map" && tostring(route["state"]) == "ok" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- _ = PublishSatisfyAny(key, ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/whitelist-source-range"],
            "nginx.ingress.kubernetes.io/whitelist-source-range", "ni", tostring(route["userlist"]), tostring(route["realm"])) -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-901-nginx-ingress-satisfy-any:
    requires: [ingresses]
    template: |-
      {%- import "util-satisfy-lane" for SatisfyLane -%}
      {{- SatisfyLane("ni", "basic_auth") -}}

  backend-directives-765-nginx-ingress-satisfy-any:
    template: |
      {#
        Nginx Ingress satisfy=any combined IP-or-auth gate.

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#satisfy

        Emits, in the backend:
          acl ni_satisfy_ip_<ns>_<name> src <cidrs>
          http-request auth realm "<realm>" if !ni_satisfy_ip_<ns>_<name> !{ http_auth(<userlist>) }

        The challenge only fires for requests whose source IP is NOT in the
        allow-list AND that have not authenticated — exactly the OR semantics of
        satisfy=any. The independent whitelist deny (frontend-filters-700) and
        unconditional auth challenge (backend-directives-760) are suppressed for
        this Ingress via SatisfyAnyMode().

        Only reached when the allow-list carries an IPv6 entry (`cidr_partition`
        cannot cover mixed families) or the realm needs escaping (a map value
        cannot carry it); every other satisfy route is served by
        frontend-filters-901-nginx-ingress-satisfy-any. A backend rule makes the
        route structural, which is the cost of the fallback.
      #}
      {%- import "util-nginx-ingress-satisfy" for SatisfyAnyMode -%}
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- import "util-nginx-ingress-basic-auth-route" for NginxBasicAuthRoute -%}
      {%- if ingress != nil %}
        {%- var satRoute = map[string]any{} %}
        {%- if SatisfyAnyMode(ingress) != "" %}{{- NginxBasicAuthRoute(ingress, true, satRoute) -}}{%- end %}
        {%- var onLane = tostring(satRoute["lane"]) == "map" && tostring(satRoute["state"]) == "ok" &&
          !strings_contains(ValidateCidrList(ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/whitelist-source-range"], "nginx.ingress.kubernetes.io/whitelist-source-range", ingress.Metadata.Namespace + "/" + ingress.Metadata.Name), ":") %}
        {%- if SatisfyAnyMode(ingress) != "" && !onLane %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- var whitelist = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/whitelist-source-range"] %}
          {%- var authRealm = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-realm"] %}
          {%- if authRealm == "" %}{%- authRealm = "Restricted" %}{%- end %}
          {%- var realmInj = ConfigInjectionKind(authRealm, "line") %}
          {%- if realmInj != "" %}
            {{- fail("Invalid value for annotation 'nginx.ingress.kubernetes.io/auth-realm' on Ingress '" + key + "': contains " + realmInj + ", which would break the auth realm directive. Remove control characters from the value.") -}}
          {%- end %}
          {%- var authSecret = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-secret"] %}
          {%- var secretNs = ns %}
          {%- var secretName = authSecret %}
          {%- if strings_contains(authSecret, "/") %}
            {%- var parts = split(authSecret, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var userlistName = "ni_auth_" + secretNs + "_" + secretName %}
          {%- var aclName = "ni_satisfy_ip_" + ns + "_" + name %}
      # nginx-ingress/satisfy-any ({{ key }})
      acl {{ aclName }} src {{ ValidateCidrList(whitelist, "nginx.ingress.kubernetes.io/whitelist-source-range", key) }}
      http-request set-var(txn.denied_by) str(basic_auth) if !{{ aclName }} !{ http_auth({{ userlistName }}) }
      http-request auth realm "{{ EscapeDquoteValue(authRealm) }}" if !{{ aclName }} !{ http_auth({{ userlistName }}) }
        {%- end %}
      {%- end -%}
