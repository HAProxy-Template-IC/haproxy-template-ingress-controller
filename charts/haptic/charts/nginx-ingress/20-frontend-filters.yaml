# nginx-ingress library — frontend-filters-* annotation handlers.
# access-control, ssl-redirect, hsts, cors, custom-headers, app-root,
# permanent/temporal-redirect, canary, mtls-error.
templateSnippets:
  # ============================================================================
  # Frontend Filters
  # ============================================================================

  frontend-filters-700-nginx-ingress-access-control:
    template: |
      {#-
        Nginx Ingress Access Control Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#whitelist-source-range

        Annotations:
          - nginx.ingress.kubernetes.io/whitelist-source-range: "CIDR,CIDR,..." (optional)
          - nginx.ingress.kubernetes.io/denylist-source-range: "CIDR,CIDR,..." (optional)

        Generated HAProxy Config:
          acl <name> src <cidrs>
          http-request deny if <host-match> !<acl>    (for allowlist)
          http-request deny if <host-match> <acl>     (for denylist)
      -#}
      {%- import "util-emit-annotation-access-control" for EmitAnnotationAccessControl -%}
      {%- import "util-nginx-ingress-satisfy" for SatisfyAnyMode -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {#- Under satisfy=any the standalone whitelist deny would block a
            non-allow-listed IP before auth could rescue it, so suppress just
            the allow-list arm (pass an empty allow-annotation name) while
            keeping the deny-list arm intact. backend-directives-765 emits the
            combined IP-or-auth gate for these Ingresses instead. -#}
        {%- var allowAnn = "nginx.ingress.kubernetes.io/whitelist-source-range" -%}
        {%- if SatisfyAnyMode(ingress) != "" -%}{%- allowAnn = "" -%}{%- end -%}
        {{ EmitAnnotationAccessControl(ingress,
            allowAnn,
            "nginx.ingress.kubernetes.io/denylist-source-range",
            "ni",
            "nginx-ingress/whitelist-source-range ({KEY})",
            "nginx-ingress/denylist-source-range ({KEY})") }}
      {%- end -%}

  # SSL redirect relocated to features-105-nginx-ingress-ssl-redirect: it now
  # registers hosts into the shared gf["sslRedirectHosts"] map (ssl.yaml emits the
  # rule from ssl-redirect-<code>.map), so adding/removing a redirected host is a
  # map-only, reload-free update instead of a per-ingress inline-ACL redirect.
  frontend-filters-720-nginx-ingress-hsts:
    template: |
      {#-
        Nginx Ingress HSTS Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#http-strict-transport-security

        Annotations:
          - nginx.ingress.kubernetes.io/hsts: "true|false" (optional)
          - nginx.ingress.kubernetes.io/hsts-max-age: "<seconds>" (optional, default: 15724800)
          - nginx.ingress.kubernetes.io/hsts-include-subdomains: "true|false" (optional)
          - nginx.ingress.kubernetes.io/hsts-preload: "true|false" (optional)

        Generated HAProxy Config:
          http-response set-header Strict-Transport-Security "max-age=<age>[; includeSubDomains][; preload]" if { ssl_fc } <host-match>
      -#}
      {%- import "util-emit-annotation-hsts" for EmitAnnotationHSTS -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {{ EmitAnnotationHSTS(ingress,
            "nginx.ingress.kubernetes.io/hsts",
            "nginx.ingress.kubernetes.io/hsts-max-age",
            "nginx.ingress.kubernetes.io/hsts-include-subdomains",
            "nginx.ingress.kubernetes.io/hsts-preload",
            "15724800",
            "nginx-ingress/hsts") }}
      {%- end -%}

  frontend-filters-730-nginx-ingress-cors:
    template: |
      {#-
        Nginx Ingress CORS Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#enable-cors

        Annotations:
          - nginx.ingress.kubernetes.io/enable-cors: "true|false" (required to enable)
          - nginx.ingress.kubernetes.io/cors-allow-origin: "<origin>" (default: *)
          - nginx.ingress.kubernetes.io/cors-allow-methods: "<methods>" (default: GET, PUT, POST, DELETE, PATCH, OPTIONS)
          - nginx.ingress.kubernetes.io/cors-allow-headers: "<headers>" (default: DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization)
          - nginx.ingress.kubernetes.io/cors-allow-credentials: "true|false" (optional)
          - nginx.ingress.kubernetes.io/cors-max-age: "<seconds>" (default: 1728000)
          - nginx.ingress.kubernetes.io/cors-expose-headers: "<headers>" (optional)

        Generated HAProxy Config:
          http-response add-header Access-Control-Allow-Origin <origin> if <host-match>
          http-response add-header Access-Control-Allow-Methods <methods> if <host-match> METH_OPTIONS
          ... (other CORS headers)
      -#}
      {%- import "util-emit-annotation-cors" for EmitAnnotationCORS -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {{ EmitAnnotationCORS(ingress,
            "nginx.ingress.kubernetes.io",
            "nginx.ingress.kubernetes.io/enable-cors",
            "1728000",
            "nginx-ingress/cors") }}
      {%- end -%}

  frontend-filters-740-nginx-ingress-custom-headers:
    template: |
      {#-
        Nginx Ingress Custom Headers

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-headers

        Annotations:
          - nginx.ingress.kubernetes.io/custom-request-headers: "name:value|name:value|..."
          - nginx.ingress.kubernetes.io/custom-response-headers: "name:value|name:value|..."

        Format: Pipe-separated list of header:value pairs.

        Generated HAProxy Config:
          http-request set-header <name> <value> if <host-match>
          http-response set-header <name> <value> if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- var reqHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/custom-request-headers"] %}
          {%- var respHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/custom-response-headers"] %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- if reqHeaders != "" %}
      # nginx-ingress/custom-request-headers ({{ key }})
              {%- for _, header := range split(reqHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
      http-request set-header {{ headerName }} '{{ headerValue }}' if {{ HostMatchCondition(hosts) }}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if respHeaders != "" %}
      # nginx-ingress/custom-response-headers ({{ key }})
              {%- for _, header := range split(respHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
      http-response set-header {{ headerName }} '{{ headerValue }}' if {{ HostMatchCondition(hosts) }}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-750-nginx-ingress-app-root:
    template: |
      {#-
        Nginx Ingress App Root Annotation

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rewrite

        Annotation: nginx.ingress.kubernetes.io/app-root

        Redirects requests to / to the specified path.

        Generated HAProxy Config:
          http-request redirect location <path> code 302 if { path / } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- var appRoot = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/app-root"] %}
          {%- if appRoot != "" %}
            {%- var hosts = []string{} %}
            {%- for _, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # nginx-ingress/app-root ({{ key }})
      http-request redirect location {{ appRoot }} code 302 if { path / } {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  # permanent-redirect / temporal-redirect relocated to
  # features-140-nginx-ingress-redirects: they register hosts into the shared
  # host-keyed redirect map (base.yaml emits the rule from redirect-loc-<code>.map),
  # so adding/changing a host redirect is a map-only, reload-free update instead of
  # a per-ingress inline-ACL redirect.

  frontend-filters-775-nginx-ingress-from-to-www-redirect:
    template: |
      {#-
        Nginx Ingress From-to-WWW Redirect

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#redirect-fromto-www

        Annotation: nginx.ingress.kubernetes.io/from-to-www-redirect: "true"

        Redirects between the apex host and its www. counterpart with a 301:
          - host `example.com`     -> `www.example.com`
          - host `www.example.com` -> `example.com`

        Emitted in the HTTP frontend (post-routing, pre-backend) as a true
        client redirect — it sets the Location header via `redirect prefix`,
        never the Host header, so request routing is not corrupted. The
        original request path is preserved by `redirect prefix`, and the
        request scheme is preserved by gating on `ssl_fc` (two rules per host).

        Generated HAProxy Config (per matching host):
          http-request redirect prefix https://<target> code 301 if { var(txn.host) -m str <source> } { ssl_fc }
          http-request redirect prefix http://<target> code 301 if { var(txn.host) -m str <source> } !{ ssl_fc }
      -#}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var enabled = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/from-to-www-redirect"] %}
        {%- if enabled == "true" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- var srcHost = rule.Host %}
            {%- if srcHost != "" %}
              {%- var targetHost = "" %}
              {%- if hasPrefix(srcHost, "www.") %}
                {%- targetHost = srcHost[4:] %}
              {%- else %}
                {%- targetHost = "www." + srcHost %}
              {%- end %}
      # nginx-ingress/from-to-www-redirect ({{ key }}) {{ srcHost }} -> {{ targetHost }}
      http-request redirect prefix https://{{ targetHost }} code 301 if { var(txn.host) -m str {{ srcHost }} } { ssl_fc }
      http-request redirect prefix http://{{ targetHost }} code 301 if { var(txn.host) -m str {{ srcHost }} } !{ ssl_fc }
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  frontend-filters-780-nginx-ingress-canary:
    template: |
      {#-
        Nginx Ingress Canary Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#canary

        Annotations (on canary Ingress, with canary: "true"):
          - nginx.ingress.kubernetes.io/canary: "true" (required)
          - nginx.ingress.kubernetes.io/canary-by-header: "<header-name>" (optional)
          - nginx.ingress.kubernetes.io/canary-by-header-value: "<value>" (optional, default: "always")
          - nginx.ingress.kubernetes.io/canary-by-header-pattern: "<regex>" (optional)
          - nginx.ingress.kubernetes.io/canary-by-cookie: "<cookie-name>" (optional)
          - nginx.ingress.kubernetes.io/canary-weight: "<0-100>" (optional)

        Priority order: header > cookie > weight

        The canary Ingress must share a host with a non-canary (main) Ingress.
        use_backend rules are generated in the frontend for the matching host.

        Generated HAProxy Config:
          use_backend <canary-backend> if { req.hdr(<header>) -m str <value> } <host-match>
          use_backend <canary-backend> if { req.cook(<cookie>) -m str always } <host-match>
          use_backend <canary-backend> if { rand(100) lt <weight> } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var isCanary = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary"] %}
        {%- if isCanary == "true" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
            {#- Extract hosts and find the first backend name from this canary ingress -#}
            {%- var hosts = []string{} %}
            {%- var canaryBackend = "" %}
            {%- for _, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
              {%- if canaryBackend == "" %}
                {%- var http = rule | dig("http") %}
                {%- if http != nil %}
                  {%- var paths []any = http | dig("paths") | toSlice() %}
                  {%- if len(paths) > 0 %}
                    {%- canaryBackend = BackendNameIngress(ingress, paths[0]) %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if len(hosts) > 0 && canaryBackend != "" %}
              {%- var cond = HostMatchCondition(hosts) %}
              {%- var canaryHeader = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header"] %}
              {%- var canaryHeaderValue = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-value"] %}
              {%- var canaryHeaderPattern = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-pattern"] %}
              {%- var canaryCookie = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-cookie"] %}
              {%- var canaryWeight = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-weight"] %}
      # nginx-ingress/canary ({{ key }})
              {%- if canaryHeader != "" %}
                {%- if canaryHeaderPattern != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m reg {{ canaryHeaderPattern }} } {{ cond }}
                {%- else if canaryHeaderValue != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str {{ canaryHeaderValue }} } {{ cond }}
                {%- else %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str always } {{ cond }}
                {%- end %}
              {%- end %}
              {%- if canaryCookie != "" %}
      use_backend {{ canaryBackend }} if { req.cook({{ canaryCookie }}) -m str always } {{ cond }}
              {%- end %}
              {%- if canaryWeight != "" %}
      use_backend {{ canaryBackend }} if { rand(100) lt {{ canaryWeight }} } {{ cond }}
              {%- end %}
            {%- end %}
        {%- end %}
      {%- end -%}

  frontend-filters-790-nginx-ingress-mtls-error:
    template: |
      {#-
        Nginx Ingress mTLS Error Page and Certificate Passthrough

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#client-certificate-authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-tls-error-page: "<url>" (optional)
          - nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true|false" (optional)

        Generated HAProxy Config:
          http-request redirect location <url> code 302 if { ssl_c_verify gt 0 } <host-match>
          http-request set-header ssl-client-cert %[ssl_c_der,base64] if <host-match>
          http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var errorPage = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-error-page"] %}
            {%- var passCert = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] %}
            {%- var cond = HostMatchCondition(hosts) %}
            {%- if errorPage != "" %}
              {#- Inline URL guard: this snippet renders via the
                  always-compiled `frontend-filters-*` glob, so it
                  can't import util macros from spoa-hub.yaml (opt-in
                  library, absent under default values — Scriggo
                  would fail to resolve the import at compile time). -#}
              {%- if strings_contains(errorPage, "\n") || strings_contains(errorPage, "\r") || strings_contains(errorPage, " ") || strings_contains(errorPage, "\t") -%}
                {{- fail("Invalid URL in annotation 'nginx.ingress.kubernetes.io/auth-tls-error-page' on Ingress " + ns + "/" + name + ": value contains whitespace or newlines. URLs must not contain whitespace — they are interpolated into HAProxy directives where whitespace is significant and could be used to inject arbitrary config.") -}}
              {%- end %}
      # nginx-ingress/auth-tls-error-page ({{ key }})
      http-request redirect location {{ errorPage }} code 302 if { ssl_c_verify gt 0 } {{ cond }}
            {%- end %}
            {%- if passCert == "true" %}
      # nginx-ingress/auth-tls-pass-certificate-to-upstream ({{ key }})
      http-request set-header ssl-client-cert %[ssl_c_der,base64] if {{ cond }}
      http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if {{ cond }}
            {%- end %}
          {%- end %}
      {%- end -%}

  # nginx mirror-target needs the full request body buffered before the SPOE
  # mirror notification fires (else PUT/POST bodies arrive empty at the plugin)
  # — mirrors gateway/frontend-extra-200-gateway-mirror-buffer. Also the
  # plugin-enabled guard: mirror-target with the spoa-hub mirror plugin disabled
  # would emit `send-spoe-group spoa-hub mirror-1-group` for a non-existent SPOE
  # group (a `haproxy -c` failure), so fail() with an actionable message.
  frontend-extra-205-nginx-ingress-mirror-buffer:
    template: |
      {%- var hasMirror = false %}
      {%- var firstKey = "" %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] != "" %}
          {%- hasMirror = true %}
          {%- if firstKey == "" %}{%- firstKey = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}{%- end %}
        {%- end %}
      {%- end %}
      {%- if hasMirror %}
        {%- var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() %}
        {%- var mirrorEnabled = false %}
        {%- for _, p := range plugins %}
          {%- if p.(map[string]any)["name"].(string) == "mirror" %}
            {%- mirrorEnabled = true %}
          {%- end %}
        {%- end %}
        {%- if !mirrorEnabled %}
          {{- fail("Ingress " + firstKey + " sets 'nginx.ingress.kubernetes.io/mirror-target' but the spoaHub mirror plugin is not enabled. Either enable spoaHub.plugins.mirror or remove the annotation.") -}}
        {%- end %}
      # nginx-ingress/mirror-buffer: buffer the request body so it reaches the mirror plugin
      option http-buffer-request
      {%- end %}

  frontend-filters-555-nginx-ingress-mirror:
    template: |
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {#-
        Nginx Ingress mirror-target — fire-and-forget request mirroring via the
        spoa-hub mirror plugin (the same machinery the Gateway RequestMirror
        filter uses). Mirroring applies to all of the Ingress's hosts/paths.

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#mirror

        Only `mirror-target` is honoured. `mirror-host` (the plugin forces the
        mirrored Host to the target authority) and `mirror-request-body: off`
        (the plugin always forwards the buffered body) require a mirror-plugin
        change and are NOT supported.

        mirror-target is an nginx URL template (scheme://host[:port]$request_uri);
        only the authority (host:port) is used as the plugin's arg_target — the
        plugin re-attaches the live request path/query. Default port 80 (http) /
        443 (https).

        INDEXING: each mirror-target Ingress gets its OWN mirror index (1, 2, …)
        so two Ingresses that share a host (a common fan-out pattern) never
        overwrite each other's target on a shared slot. The plugin floors its
        slot count at mirrorStaticMinSlots (default 4), so indices up to that
        floor always have a `mirror-<i>-group`; if there are MORE mirror-target
        Ingresses than slots, the render fail()s and asks the operator to raise
        spoaHub.mirrorStaticMinSlots. Mirroring is host-scoped: a host-less
        Ingress is rejected, and when several Ingresses share a host each
        mirrors all of that host's traffic to its own target.

        Generated HAProxy Config (per mirror-target Ingress, with index <i>):
          http-request set-var(txn.gw_mirror_target_<i>) str(<host:port>) if <host-match>
          http-request set-var(txn.gw_mirror_scheme_<i>) str(http|https) if <host-match>
          http-request set-var(txn.gw_mirror_timeout_ms_<i>) int(<ms>) if <host-match>
          http-request set-var(txn.gw_mirror_retries_<i>) int(<n>) if <host-match>
          http-request send-spoe-group spoa-hub mirror-<i>-group if <host-match>
      -#}
      {%- var maxSlots = toint(extraContext | dig("spoaHub", "mirrorStaticMinSlots") | fallback("4")) %}
      {%- var idx = 0 %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var mt = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] %}
        {%- if mt != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {#- Host gate (mirroring is host-scoped). A mirror-target Ingress with no
              host can't be gated, so reject it rather than buffer-without-mirror. -#}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) == 0 %}
            {{- fail("Ingress '" + key + "' sets 'nginx.ingress.kubernetes.io/mirror-target' but defines no host; host-less / default-backend mirroring is not supported. Add a host to the Ingress rule.") -}}
          {%- end %}
          {%- idx = idx + 1 %}
          {%- if idx > maxSlots %}
            {{- fail("Ingress '" + key + "' is mirror-target Ingress #" + tostring(idx) + ", exceeding the " + tostring(maxSlots) + " available mirror slots. Raise spoaHub.mirrorStaticMinSlots to >= " + tostring(idx) + " or reduce the number of mirror-target Ingresses.") -}}
          {%- end %}
          {#- Parse scheme + authority. The value is scheme://host[:port] followed
              by an nginx path/variable (e.g. $request_uri) appended with no '/'
              separator, so the authority ends at the first '/' or '$'. -#}
          {%- var scheme = "http" %}
          {%- var rest = mt %}
          {%- if hasPrefix(mt, "https://") %}
            {%- scheme = "https" %}
            {%- rest = mt[8:] %}
          {%- else if hasPrefix(mt, "http://") %}
            {%- rest = mt[7:] %}
          {%- end %}
          {%- var cut = len(rest) %}
          {%- var sl = index(rest, "/") %}
          {%- var dl = index(rest, "$") %}
          {%- if sl >= 0 && sl < cut %}{%- cut = sl %}{%- end %}
          {%- if dl >= 0 && dl < cut %}{%- cut = dl %}{%- end %}
          {%- var authority = rest[:cut] %}
          {%- if !strings_contains(authority, ":") %}
            {%- if scheme == "https" %}{%- authority = authority + ":443" %}{%- else %}{%- authority = authority + ":80" %}{%- end %}
          {%- end %}
          {%- if !regex_search(authority, "^[A-Za-z0-9._-]+:[0-9]{1,5}$") %}
            {{- fail("Invalid value '" + mt + "' for annotation 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Expected scheme://host[:port][/path]; could not derive a host:port authority (got '" + authority + "').") -}}
          {%- end %}
          {#- Bound the port to 1-65535 (the charset regex alone accepts :0 and :99999). -#}
          {%- var portNum = toint(authority[index(authority, ":")+1:]) %}
          {%- if portNum < 1 || portNum > 65535 %}
            {{- fail("Invalid port '" + tostring(portNum) + "' in 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Port must be 1-65535.") -}}
          {%- end %}
          {%- var safeAuthority = ValidateConfigValue(authority, "nginx.ingress.kubernetes.io/mirror-target", key, false) %}
          {%- var cond = HostMatchCondition(hosts) %}
          {%- var timeoutMs = toint(extraContext | dig("timeout_server") | fallback("50000")) %}
          {%- var retriesCount = toint(extraContext | dig("retries") | fallback("3")) %}
      # nginx-ingress/mirror-target ({{ key }})
      http-request set-var(txn.gw_mirror_target_{{ idx }}) str({{ safeAuthority }}) if {{ cond }}
      http-request set-var(txn.gw_mirror_scheme_{{ idx }}) str({{ scheme }}) if {{ cond }}
      http-request set-var(txn.gw_mirror_timeout_ms_{{ idx }}) int({{ timeoutMs }}) if {{ cond }}
      http-request set-var(txn.gw_mirror_retries_{{ idx }}) int({{ retriesCount }}) if {{ cond }}
      http-request send-spoe-group spoa-hub mirror-{{ idx }}-group if {{ cond }}
        {%- end %}
      {%- end %}
