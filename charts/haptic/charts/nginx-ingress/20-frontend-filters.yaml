templateSnippets:
  frontend-filters-700-nginx-ingress-access-control:
    template: |
      {%- import "util-emit-annotation-access-control" for EmitAnnotationAccessControl -%}
      {%- import "util-nginx-ingress-satisfy" for SatisfyAnyMode -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {#- Under satisfy=any the allow-list deny would block an IP that auth could still
            rescue, so drop that arm; backend-directives-765 emits the combined gate. -#}
        {%- var allowAnn = "nginx.ingress.kubernetes.io/whitelist-source-range" -%}
        {%- if SatisfyAnyMode(ingress) != "" -%}{%- allowAnn = "" -%}{%- end -%}
        {{ EmitAnnotationAccessControl(ingress,
            allowAnn,
            "nginx.ingress.kubernetes.io/denylist-source-range",
            "ni",
            "nginx-ingress/whitelist-source-range ({KEY})",
            "nginx-ingress/denylist-source-range ({KEY})") }}
      {%- end -%}

  # ssl-redirect and hsts live in features-105/-155: they register hosts into gf maps
  # that ssl.yaml/base.yaml emit one shared map-driven rule from — don't move them back
  # to per-ingress inline ACLs here, that costs a reload per host change.

  frontend-filters-730-nginx-ingress-cors:
    template: |
      {%- import "util-emit-annotation-cors" for EmitAnnotationCORS -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {{ EmitAnnotationCORS(ingress,
            "nginx.ingress.kubernetes.io",
            "nginx.ingress.kubernetes.io/enable-cors",
            "1728000",
            "nginx-ingress/cors") }}
      {%- end -%}

  frontend-filters-740-nginx-ingress-custom-headers:
    template: |
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-logformat-value" for EscapeLogFormatValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- var reqHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/custom-request-headers"] %}
          {%- var respHeaders = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/custom-response-headers"] %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- if reqHeaders != "" %}
      # nginx-ingress/custom-request-headers ({{ key }})
              {%- for _, header := range split(reqHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
                    {%- var nameInj = ConfigInjectionKind(headerName, "token") %}
                    {%- var valInj = ConfigInjectionKind(headerValue, "line") %}
                    {%- if nameInj != "" %}
                      {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/custom-request-headers' header name contains " + nameInj + ", which would break the set-header directive; the header is not applied. Remove it from the header name.") -}}
                    {%- else if valInj != "" %}
                      {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/custom-request-headers' value contains " + valInj + ", which would split the frontend directive; the header is not applied. Remove control characters from the value.") -}}
                    {%- else %}
      http-request set-header {{ headerName }} "{{ EscapeLogFormatValue(headerValue) }}" if {{ HostMatchCondition(hosts) }}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if respHeaders != "" %}
      # nginx-ingress/custom-response-headers ({{ key }})
              {%- for _, header := range split(respHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
                    {%- var nameInj = ConfigInjectionKind(headerName, "token") %}
                    {%- var valInj = ConfigInjectionKind(headerValue, "line") %}
                    {%- if nameInj != "" %}
                      {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/custom-response-headers' header name contains " + nameInj + ", which would break the set-header directive; the header is not applied. Remove it from the header name.") -}}
                    {%- else if valInj != "" %}
                      {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/custom-response-headers' value contains " + valInj + ", which would split the frontend directive; the header is not applied. Remove control characters from the value.") -}}
                    {%- else %}
      http-response set-header {{ headerName }} "{{ EscapeLogFormatValue(headerValue) }}" if {{ HostMatchCondition(hosts) }}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
      {%- end -%}

  # app-root and permanent/temporal-redirect live in features-145/-140: they register
  # hosts into gf maps that base.yaml emits one shared map-driven rule from — don't
  # move them back to per-ingress inline ACLs here, that costs a reload per change.

  frontend-filters-775-nginx-ingress-from-to-www-redirect:
    template: |
      {# `redirect prefix` only sets Location; never rewrite the Host header instead,
          that corrupts routing. Map indirection keeps host changes reload-free. #}
      {%- var pairByHost = map[string]string{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- var hostKeys = []any{} -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/from-to-www-redirect"] == "true" %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- var srcHost = toLower(rule.Host) %}
            {%- if srcHost != "" && !seen[srcHost] %}
              {%- seen[srcHost] = true %}
              {%- var targetHost = "" %}
              {%- if hasPrefix(srcHost, "www.") %}{%- targetHost = srcHost[4:] %}{%- else %}{%- targetHost = "www." + srcHost %}{%- end %}
              {%- pairByHost[srcHost] = targetHost %}
              {%- hostKeys = append(hostKeys, srcHost) %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- if len(hostKeys) > 0 %}
        {%- var sortedHosts = sort_strings(hostKeys) %}
        {%- var lines = []string{} %}
        {%- for _, h := range sortedHosts %}{%- lines = append(lines, tostring(h) + " " + pairByHost[tostring(h)]) %}{%- end %}
        {%- var mapContent = join(lines, "\n") + "\n" %}
        {%- var _, mapErr = fileRegistry.Register("map", "from-to-www.map", mapContent) %}
        {%- if mapErr != nil %}{{ fail("failed to register from-to-www map: " + tostring(mapErr)) }}{%- end %}
        {%- var m, _ = pathResolver.GetPath("from-to-www.map", "map") %}
      # nginx-ingress/from-to-www-redirect
      http-request redirect prefix https://%[var(txn.host),map({{ m }})] code 301 if { ssl_fc } { var(txn.host),map({{ m }}) -m found }
      http-request redirect prefix http://%[var(txn.host),map({{ m }})] code 301 if !{ ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-780-nginx-ingress-canary:
    template: |
      {# HAProxy takes the first matching use_backend, so emission order is the
          documented canary precedence: header > cookie > weight. #}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var isCanary = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary"] %}
        {%- if isCanary == "true" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
            {%- var hosts = []string{} %}
            {%- var canaryBackend = "" %}
            {%- for _, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
              {%- if canaryBackend == "" %}
                {%- var http = rule | dig("http") %}
                {%- if http != nil %}
                  {%- var paths []any = http | dig("paths") | toSlice() %}
                  {%- if len(paths) > 0 %}
                    {%- canaryBackend = BackendNameIngress(ingress, paths[0]) %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if len(hosts) > 0 && canaryBackend != "" %}
              {%%
                var cond = HostMatchCondition(hosts)
                var canaryHeader = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header"]
                var canaryHeaderValue = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-value"]
                var canaryHeaderPattern = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-pattern"]
                var canaryCookie = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-cookie"]
                var canaryWeight = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-weight"]
              %%}
              {#- The header/cookie NAMES and the numeric weight are emitted unquoted
                  (req.hdr(<h>), req.cook(<c>), rand(100) lt <w>), so a space or quote
                  there breaks out of the ACL — token context. The regex/exact match
                  VALUES are single-quoted below (-m reg '<p>' / -m str '<v>'), where
                  HAProxy strong-quoting passes a backslash (e.g. \d+) literally with no
                  $ expansion — only a ' or a control character is a danger, so squote.
                  Only the operands that will actually be emitted are checked. -#}
              {%- var canaryInj = "" %}
              {%- var canaryField = "" %}
              {%- if canaryHeader != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryHeader, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-by-header" %}{%- end %}
                {%- if canaryInj == "" && canaryHeaderPattern != "" %}
                  {%- canaryInj = ConfigInjectionKind(canaryHeaderPattern, "squote") %}
                  {%- if canaryInj != "" %}{%- canaryField = "canary-by-header-pattern" %}{%- end %}
                {%- else if canaryInj == "" && canaryHeaderValue != "" %}
                  {%- canaryInj = ConfigInjectionKind(canaryHeaderValue, "squote") %}
                  {%- if canaryInj != "" %}{%- canaryField = "canary-by-header-value" %}{%- end %}
                {%- end %}
              {%- end %}
              {%- if canaryInj == "" && canaryCookie != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryCookie, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-by-cookie" %}{%- end %}
              {%- end %}
              {%- if canaryInj == "" && canaryWeight != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryWeight, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-weight" %}{%- end %}
              {%- end %}
              {%- if canaryInj != "" %}
                {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/" + canaryField + "' value contains " + canaryInj + ", which would break out of the canary routing condition; the canary route is not applied. Remove it from the value.") -}}
                {%- continue %}
              {%- end %}
      # nginx-ingress/canary ({{ key }})
              {%- if canaryHeader != "" %}
                {%- if canaryHeaderPattern != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m reg '{{ canaryHeaderPattern }}' } {{ cond }}
                {%- else if canaryHeaderValue != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str '{{ canaryHeaderValue }}' } {{ cond }}
                {%- else %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str always } {{ cond }}
                {%- end %}
              {%- end %}
              {%- if canaryCookie != "" %}
      use_backend {{ canaryBackend }} if { req.cook({{ canaryCookie }}) -m str always } {{ cond }}
              {%- end %}
              {%- if canaryWeight != "" %}
      use_backend {{ canaryBackend }} if { rand(100) lt {{ canaryWeight }} } {{ cond }}
              {%- end %}
            {%- end %}
        {%- end %}
      {%- end -%}

  frontend-filters-790-nginx-ingress-mtls-error:
    template: |
      {# auth-tls-error-page lives in features-150 (map-driven, reload-free); only
          cert passthrough belongs here. #}
      {%- import "util-ingress-helpers" for ResourceMatchCondition -%}
      {#- Strip unconditionally, and never host-scoped: a wildcard or host-less
          rule made the old exact host gate miss entirely, leaving the caller's
          own header to reach an application this annotation tells to trust it.
          A missed set is fail-closed; a missed strip is forgery. -#}
      {%- var anyPassCert = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true" %}
          {%- anyPassCert = true %}{%- break %}
        {%- end %}
      {%- end %}
      {%- if anyPassCert %}
      # nginx-ingress/auth-tls-pass-certificate-to-upstream — drop client-supplied copies
      http-request del-header ssl-client-cert
      http-request del-header ssl-client-subject-dn
      {%- end %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
          {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true" %}
            {%- var cond = ResourceMatchCondition([]string{key}) %}
      # nginx-ingress/auth-tls-pass-certificate-to-upstream ({{ key }})
      http-request set-header ssl-client-cert %[ssl_c_der,base64] if {{ cond }}
      http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if {{ cond }}
          {%- end %}
      {%- end -%}

  # The SPOE mirror notification fires before the request body would arrive, so
  # without buffering the plugin mirrors PUT/POST with an empty body.
  frontend-filters-093-nginx-ingress-mirror-buffer:
    template: |
      {%- var hasMirror = false %}
      {%- var firstKey = "" %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] != "" %}
          {%- hasMirror = true %}
          {%- if firstKey == "" %}{%- firstKey = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}{%- end %}
        {%- end %}
      {%- end %}
      {%- if hasMirror %}
        {%- var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() %}
        {%- var mirrorEnabled = false %}
        {%- for _, p := range plugins %}
          {%- if p.(map[string]any)["name"].(string) == "mirror" %}
            {%- mirrorEnabled = true %}
          {%- end %}
        {%- end %}
        {%- if !mirrorEnabled %}
          {{- fail("Ingress " + firstKey + " sets 'nginx.ingress.kubernetes.io/mirror-target' but the spoaHub mirror plugin is not enabled. Either enable spoaHub.plugins.mirror or remove the annotation.") -}}
        {%- end %}
        {%- var mirrorWait = extraContext | dig_string("10s", "requestBuffering", "waitTimeout") %}
      {# Content-Length-gated, not frontend-wide `option http-buffer-request`: one
          mirrored Ingress would buffer the whole shared frontend and stall every
          gRPC/streaming route on it into a 408. Trade-off: chunked bodies are not
          mirrored. The map check honours a route's `request-buffering: off`, and
          needs txn.backend_name — set by frontend-routing-logic, which is why this
          is a frontend-filters-* and not the earlier frontend-extra-*. Map default
          `on`, not the fleet setting: mirroring needs the body regardless. #}
      # nginx-ingress/mirror-buffer: buffer the request body so it reaches the mirror plugin
        {%- var rbMap, _ = pathResolver.GetPath("request-buffering.map", "map") %}
      http-request wait-for-body time {{ mirrorWait }} if { req.hdr(content-length) -m found } !{ var(txn.backend_name),map({{ rbMap }},on) -m str off }
      {%- end %}

  frontend-filters-555-nginx-ingress-mirror:
    template: |
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {#- Only `mirror-target` is honoured: the plugin forces the mirrored Host to the
          target authority and always forwards the buffered body, so `mirror-host` and
          `mirror-request-body: off` cannot be supported without a plugin change. Only
          the authority is used — the plugin re-attaches the live path/query.
          Entries accumulate in the per-request txn.gw_mirror_targets list that the
          single NOTIFY in frontend-filters-950-spoa-hub-mirror-fire fans out, so a new
          target touches neither spoe.conf nor the hub TOML. -#}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var mt = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] %}
        {%- if mt != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) == 0 %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' sets 'nginx.ingress.kubernetes.io/mirror-target' but defines no host; host-less / default-backend mirroring is not supported. Add a host to the Ingress rule.") -}}{%- continue %}
          {%- end %}
          {#- nginx appends the path/variable (e.g. $request_uri) with no '/' separator,
              so the authority ends at the first '/' or '$'. -#}
          {%- var scheme = "http" %}
          {%- var rest = mt %}
          {%- if hasPrefix(mt, "https://") %}
            {%- scheme = "https" %}
            {%- rest = mt[8:] %}
          {%- else if hasPrefix(mt, "http://") %}
            {%- rest = mt[7:] %}
          {%- end %}
          {%- var cut = len(rest) %}
          {%- var sl = index(rest, "/") %}
          {%- var dl = index(rest, "$") %}
          {%- if sl >= 0 && sl < cut %}{%- cut = sl %}{%- end %}
          {%- if dl >= 0 && dl < cut %}{%- cut = dl %}{%- end %}
          {%- var authority = rest[:cut] %}
          {%- if !strings_contains(authority, ":") %}
            {%- if scheme == "https" %}{%- authority = authority + ":443" %}{%- else %}{%- authority = authority + ":80" %}{%- end %}
          {%- end %}
          {%- if !regex_search(authority, "^[A-Za-z0-9._-]+:[0-9]{1,5}$") %}
            {{- fail("Invalid value '" + mt + "' for annotation 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Expected scheme://host[:port][/path]; could not derive a host:port authority (got '" + authority + "').") -}}
          {%- end %}
          {#- The charset regex above still accepts :0 and :99999. -#}
          {%- var portNum = toint(authority[index(authority, ":")+1:]) %}
          {%- if portNum < 1 || portNum > 65535 %}
            {{- fail("Invalid port '" + tostring(portNum) + "' in 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Port must be 1-65535.") -}}
          {%- end %}
          {%- var safeAuthority = ValidateConfigValue(authority, "nginx.ingress.kubernetes.io/mirror-target", key, false) %}
          {%- var cond = HostMatchCondition(hosts) %}
          {%- var timeoutMs = toint(extraContext | dig("spoaHub", "mirror", "targetTimeoutMs") | fallback(2000)) %}
          {%- var retriesCount = toint(extraContext | dig("spoaHub", "mirror", "targetRetries") | fallback(0)) %}
          {%- var entry = scheme + "|" + safeAuthority + "|" + tostring(timeoutMs) + "|" + tostring(retriesCount) %}
      # nginx-ingress/mirror-target ({{ key }})
      http-request set-var(txn.gw_mirror_targets) str({{ entry }};),concat(,txn.gw_mirror_targets,) if {{ cond }}
        {%- end %}
      {%- end %}
  log-fields-730-nginx-ingress-mtls:
    template: |-
      {# Byte-identical to the haptic-annotations and haproxy-ingress log-fields
          contributions on purpose: base deduplicates identical items, so several
          annotation libraries can be enabled at once. #}
      {%- var enabled = false %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- if ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-secret"] != "" || ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true" %}
          {%- enabled = true %}
        {%- end %}
      {%- end %}
      {%- if enabled %}
      %(mtls_verify)[ssl_c_verify]
      %(mtls_cn)[ssl_c_s_dn(CN)]
      {%- end %}
