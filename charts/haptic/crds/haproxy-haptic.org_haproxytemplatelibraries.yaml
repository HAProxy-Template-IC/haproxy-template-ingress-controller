---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: haproxytemplatelibraries.haproxy-haptic.org
spec:
  group: haproxy-haptic.org
  names:
    kind: HAProxyTemplateLibrary
    listKind: HAProxyTemplateLibraryList
    plural: haproxytemplatelibraries
    shortNames:
    - htpllib
    singular: haproxytemplatelibrary
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.revision
      name: Revision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HAProxyTemplateLibrary carries template library content that a
          HAProxyTemplateConfig pulls in through spec.libraryRefs.

          A library is a complete content contributor, not just a bag of snippets: it
          can define map files, general files, SSL certificates, Kubernetes resources
          and the main haproxyConfig template as well.

          It exists so the bulk of a configuration — templateSnippets and
          validationTests are ~94% of the rendered bytes — lives outside the object an
          operator reads and edits, and so a library too large for one object can be
          split across several without changing how it merges.

          It carries content only. A library cannot declare podSelector,
          watchedResources or dataplane settings, so it can never redefine the
          controller's operational identity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HAProxyTemplateLibrarySpec is the content one snippets object
              contributes.
            properties:
              files:
                additionalProperties:
                  description: "GeneralFile defines a general file generated from
                    a template.\n\nThe filename is derived from the map key in the
                    configuration.\nThe full path is constructed using the pathResolver.GetPath()
                    method in templates:\n\n\tExample: pathResolver.GetPath(\"503.http\",
                    \"file\") returns /etc/haproxy/general/503.http\n\nIMPORTANT:
                    This is a Kubernetes CRD type. When modifying this struct, you
                    must also update:\n  - The internal config type: pkg/core/config/types.go
                    (GeneralFile)\n  - The conversion logic: pkg/controller/conversion/converter.go
                    (ConvertSpec function - files section)"
                  properties:
                    postProcessing:
                      description: |-
                        PostProcessing defines optional post-processors to apply after rendering.

                        Post-processors run in the order specified and can transform the rendered output.
                      items:
                        description: |-
                          PostProcessorConfig defines a post-processor to apply to rendered template output.

                          IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                            - The internal config type: pkg/core/config/types.go (PostProcessorConfig)
                            - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                        properties:
                          params:
                            additionalProperties:
                              type: string
                            description: |-
                              Params contains post-processor-specific parameters.

                              For "regex_replace":
                                - pattern: Regular expression pattern to match
                                - replace: Replacement string
                            type: object
                          type:
                            description: Type specifies the post-processor type (e.g.,
                              "regex_replace").
                            type: string
                        required:
                        - params
                        - type
                        type: object
                      type: array
                    reloadOnPush:
                      default: true
                      description: |-
                        ReloadOnPush controls whether a content change to this file reloads HAProxy.

                        Keep it true for anything HAProxy itself reads — error pages, ca-files,
                        host-match lists — since only a reload makes the new content take effect.
                        Set it to false for a file a sidecar owns and watches on its own (the
                        spoa-hub TOML, the Vector config): HAProxy never opens those, so the
                        reload buys nothing and only costs a worker respawn.

                        This governs writes. Removing a file reloads only when the rendered
                        configuration (or a crt-list) still names it, which no sidecar-owned file
                        ever does.
                      type: boolean
                    template:
                      description: Template is the template for generating the file
                        content.
                      minLength: 1
                      type: string
                  required:
                  - template
                  type: object
                description: Files maps file names to their template definitions.
                type: object
              haproxyConfig:
                description: |-
                  HAProxyConfig contains the main HAProxy configuration template.

                  Exactly one member of a merged set supplies it, or the referencing
                  config does.
                properties:
                  postProcessing:
                    description: |-
                      PostProcessing defines optional post-processors to apply after rendering.

                      Post-processors run in the order specified and can transform the rendered output.
                      Common use case: Normalize indentation with regex_replace.
                    items:
                      description: |-
                        PostProcessorConfig defines a post-processor to apply to rendered template output.

                        IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                          - The internal config type: pkg/core/config/types.go (PostProcessorConfig)
                          - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                      properties:
                        params:
                          additionalProperties:
                            type: string
                          description: |-
                            Params contains post-processor-specific parameters.

                            For "regex_replace":
                              - pattern: Regular expression pattern to match
                              - replace: Replacement string
                          type: object
                        type:
                          description: Type specifies the post-processor type (e.g.,
                            "regex_replace").
                          type: string
                      required:
                      - params
                      - type
                      type: object
                    type: array
                  template:
                    description: Template is the template for generating haproxy.cfg.
                    minLength: 1
                    type: string
                required:
                - template
                type: object
              k8sResources:
                additionalProperties:
                  description: |-
                    K8sResource defines a template that emits one or more Kubernetes
                    resources via multi-doc YAML.

                    IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                      - The internal config type: pkg/core/config/types.go (K8sResource)
                      - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function - k8sResources section)
                  properties:
                    postProcessing:
                      description: |-
                        PostProcessing defines optional post-processors to apply after rendering.

                        Post-processors run in the order specified and can transform the rendered output.
                      items:
                        description: |-
                          PostProcessorConfig defines a post-processor to apply to rendered template output.

                          IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                            - The internal config type: pkg/core/config/types.go (PostProcessorConfig)
                            - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                        properties:
                          params:
                            additionalProperties:
                              type: string
                            description: |-
                              Params contains post-processor-specific parameters.

                              For "regex_replace":
                                - pattern: Regular expression pattern to match
                                - replace: Replacement string
                            type: object
                          type:
                            description: Type specifies the post-processor type (e.g.,
                              "regex_replace").
                            type: string
                        required:
                        - params
                        - type
                        type: object
                      type: array
                    template:
                      description: |-
                        Template is the template for generating the resource YAML.

                        The rendered output is parsed as one or more Kubernetes
                        resources (separate documents with `---`). Each document must
                        declare `apiVersion`, `kind`, and `metadata.name` (plus
                        `metadata.namespace` for namespaced kinds).
                      minLength: 1
                      type: string
                  required:
                  - template
                  type: object
                description: K8sResources maps resource template names to their template
                  definitions.
                type: object
              maps:
                additionalProperties:
                  description: |-
                    MapFile defines a HAProxy map file generated from a template.

                    IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                      - The internal config type: pkg/core/config/types.go (MapFile)
                      - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function - maps section)
                  properties:
                    postProcessing:
                      description: |-
                        PostProcessing defines optional post-processors to apply after rendering.

                        Post-processors run in the order specified and can transform the rendered output.
                      items:
                        description: |-
                          PostProcessorConfig defines a post-processor to apply to rendered template output.

                          IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                            - The internal config type: pkg/core/config/types.go (PostProcessorConfig)
                            - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                        properties:
                          params:
                            additionalProperties:
                              type: string
                            description: |-
                              Params contains post-processor-specific parameters.

                              For "regex_replace":
                                - pattern: Regular expression pattern to match
                                - replace: Replacement string
                            type: object
                          type:
                            description: Type specifies the post-processor type (e.g.,
                              "regex_replace").
                            type: string
                        required:
                        - params
                        - type
                        type: object
                      type: array
                    template:
                      description: |-
                        Template is the template for generating the map file content.

                        The rendered output should be in HAProxy map file format (key-value pairs).
                      minLength: 1
                      type: string
                  required:
                  - template
                  type: object
                description: Maps maps map file names to their template definitions.
                type: object
              migrationCoverage:
                description: |-
                  MigrationCoverage declares how a migration source's annotations are
                  handled. Opaque to the controller; consumed by the playground's
                  migration report.
                items:
                  description: |-
                    MigrationCoverageSource documents one migration source: how to detect
                    resources managed by that source controller and how each of its
                    annotations is handled by the template libraries.

                    IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                      - The internal config type: pkg/core/config/types.go (MigrationCoverageSource)
                      - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                  properties:
                    annotations:
                      additionalProperties:
                        description: |-
                          AnnotationCoverage classifies how one source-controller annotation is
                          handled by the template libraries.
                        properties:
                          doc:
                            description: |-
                              Doc is an anchor into the migration guide (docs/site/docs/
                              migrating.md) with more detail, e.g. "annotation-support".
                            type: string
                          note:
                            description: Note explains the classification in plain
                              language.
                            type: string
                          status:
                            description: |-
                              Status classifies the annotation:
                                - supported: semantics carried over.
                                - different: acted on, but with behaviour differences to check.
                                - dropped: accepted with no effect.
                                - fails: setting it fails the render with an error.
                            enum:
                            - supported
                            - different
                            - dropped
                            - fails
                            type: string
                        required:
                        - status
                        type: object
                      description: |-
                        Annotations maps each full annotation key of the source controller
                        to its migration classification.
                      type: object
                    detect:
                      description: Detect describes how to recognise resources managed
                        by the source.
                      properties:
                        annotationPrefixes:
                          description: |-
                            AnnotationPrefixes lists annotation key prefixes owned by the
                            source controller (e.g. "nginx.ingress.kubernetes.io/").
                          items:
                            type: string
                          type: array
                        ingressClasses:
                          description: |-
                            IngressClasses lists spec.ingressClassName values the source
                            controller conventionally serves (e.g. "nginx").
                          items:
                            type: string
                          type: array
                      type: object
                    source:
                      description: |-
                        Source names the migration source controller (e.g. as printed by
                        migration tooling). Unique across the list.
                      minLength: 1
                      type: string
                  required:
                  - source
                  type: object
                type: array
              revision:
                description: |-
                  Revision identifies this content to the configs that reference it. A
                  referencing spec.libraryRefs entry must carry the same string or the
                  controller holds the last-good configuration rather than rendering a
                  half-applied set.

                  The writer chooses the value and the controller only ever compares it
                  against the reference — it never derives a revision from the content.
                  That is what lets `kubectl edit` change a snippet in place and take
                  effect: the content moves, the revision does not, so the reference still
                  matches. A digest of the content is the convenient source for a
                  generator, because it changes exactly when the content does.
                maxLength: 253
                minLength: 1
                type: string
              sslCertificates:
                additionalProperties:
                  description: |-
                    SSLCertificate defines an SSL certificate generated from a template.

                    IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                      - The internal config type: pkg/core/config/types.go (SSLCertificate)
                      - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function - sslCertificates section)
                  properties:
                    postProcessing:
                      description: |-
                        PostProcessing defines optional post-processors to apply after rendering.

                        Post-processors run in the order specified and can transform the rendered output.
                      items:
                        description: |-
                          PostProcessorConfig defines a post-processor to apply to rendered template output.

                          IMPORTANT: This is a Kubernetes CRD type. When modifying this struct, you must also update:
                            - The internal config type: pkg/core/config/types.go (PostProcessorConfig)
                            - The conversion logic: pkg/controller/conversion/converter.go (ConvertSpec function)
                        properties:
                          params:
                            additionalProperties:
                              type: string
                            description: |-
                              Params contains post-processor-specific parameters.

                              For "regex_replace":
                                - pattern: Regular expression pattern to match
                                - replace: Replacement string
                            type: object
                          type:
                            description: Type specifies the post-processor type (e.g.,
                              "regex_replace").
                            type: string
                        required:
                        - params
                        - type
                        type: object
                      type: array
                    template:
                      description: |-
                        Template is the template for generating the certificate content.

                        The rendered output should be in PEM format (certificate + private key).
                      minLength: 1
                      type: string
                  required:
                  - template
                  type: object
                description: SSLCertificates maps certificate names to their template
                  definitions.
                type: object
              templateSnippets:
                additionalProperties:
                  description: TemplateSnippet defines a reusable template fragment.
                  properties:
                    requires:
                      description: |-
                        Requires lists watched-resource names this snippet depends on. When an
                        optional watched resource has no served candidate version, every
                        snippet requiring it is stripped from the effective config at load
                        time. Each entry must name a key of watchedResources.
                      items:
                        type: string
                      type: array
                    template:
                      description: |-
                        Template is the template content.

                        Can be included in other templates using {{ render "snippet_name" }}.
                      minLength: 1
                      type: string
                  required:
                  - template
                  type: object
                description: TemplateSnippets maps snippet names to reusable template
                  fragments.
                type: object
              templatingSettings:
                description: |-
                  TemplatingSettings lets a library ship defaults for the template context.

                  Template configuration, not operational identity: the referencing config
                  merges last, so anything an operator sets wins over every library.
                properties:
                  engine:
                    description: |-
                      Engine specifies which template engine to use for rendering.

                      Available engines:
                        - "scriggo" (default): Go template syntax, high performance rendering

                      Default: scriggo
                    enum:
                    - scriggo
                    type: string
                  extraContext:
                    description: |-
                      ExtraContext provides custom variables that are passed to all templates.

                      This allows users to add arbitrary data to the template context without
                      modifying controller code. Values can be any valid JSON type (string, number,
                      boolean, object, array).

                      Example:
                        extraContext:
                          debug:
                            enabled: true
                          environment: production
                          customValue: 42

                      Templates can then reference these as: {{ debug.enabled }}, {{ environment }}, etc.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              validationTests:
                additionalProperties:
                  description: |-
                    ValidationTest defines a validation test with fixtures and assertions.

                    The test name is provided by the map key in ValidationTests.
                  properties:
                    assertions:
                      description: |-
                        Assertions defines the validation checks to perform.

                        Optional in the schema, required in practice: config.ValidateStructure
                        rejects a merged config whose test declares none. The schema cannot
                        express it because the reserved `_global` entry is a shared baseline
                        rather than a test — the runner never executes its assertions — and
                        several template libraries each contribute part of it, so each of their
                        objects carries an incomplete `_global` that only becomes whole after
                        the merge.
                      items:
                        description: ValidationAssertion defines a single validation
                          check.
                        properties:
                          description:
                            description: Description explains what this assertion
                              validates.
                            type: string
                          expected:
                            description: Expected is the expected value for equals
                              assertions.
                            type: string
                          jsonpath:
                            description: JSONPath is the JSONPath expression for jsonpath
                              assertions.
                            type: string
                          pattern:
                            description: Pattern is the regex pattern for contains/not_contains
                              assertions.
                            type: string
                          patterns:
                            description: |-
                              Patterns is a list of regex patterns for match_order assertions.
                              The patterns must appear in the target in the order specified.
                            items:
                              type: string
                            type: array
                          target:
                            description: |-
                              Target specifies what to validate.

                              Format depends on assertion type:
                                - haproxy_valid: not used
                                - contains/not_contains/equals: "haproxy.cfg", "map:<name>", "file:<name>", "cert:<name>"
                                - jsonpath: the resource to query
                            type: string
                          type:
                            description: |-
                              Type is the assertion type.

                              Supported types:
                                - haproxy_valid: Validates that generated HAProxy config is syntactically valid
                                - contains: Checks if target contains pattern (regex)
                                - not_contains: Checks if target does not contain pattern (regex)
                                - equals: Checks if target equals expected value
                                - jsonpath: Evaluates JSONPath expression against target
                                - match_count: Counts how many times pattern matches in target (regex)
                                - match_order: Validates that patterns appear in specified order
                                - deterministic: Verifies that rendering twice produces identical output
                            enum:
                            - haproxy_valid
                            - contains
                            - not_contains
                            - equals
                            - jsonpath
                            - match_count
                            - match_order
                            - deterministic
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                    currentConfig:
                      description: |-
                        CurrentConfig contains the raw HAProxy configuration from a previous deployment.

                        This is used for testing slot-aware server assignment during rolling deployments.
                        When provided, templates can access currentConfig to preserve server slot ordering.
                        The content is parsed using the HAProxy config parser before being passed to templates.

                        Example:
                          currentConfig: |
                            backend my-backend
                                server srv1 10.0.0.1:8080
                                server srv2 10.0.0.2:8080
                      type: string
                    currentFiles:
                      additionalProperties:
                        type: string
                      description: |-
                        CurrentFiles are the currently-deployed general auxiliary files
                        (filename → content), exposed to templates under `currentFiles`. Used to
                        test templates that read their own prior output — e.g. self-rotating TLS
                        session-ticket keys inspecting the current key file's embedded date marker.
                      type: object
                    description:
                      description: Description explains what this test validates.
                      type: string
                    extraContext:
                      description: |-
                        ExtraContext provides custom variables that override the global extraContext for this test.

                        This allows testing template behavior with different extraContext values without
                        modifying the global configuration.

                        Example:
                          extraContext:
                            sanitize_auth_realm: true
                            debug: true
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    fixtures:
                      additionalProperties:
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        type: array
                      description: |-
                        Fixtures defines the Kubernetes resources to use for this test.

                        Keys are resource type names (matching WatchedResources keys).
                        Values are arrays of resources as raw JSON.

                        Example:
                          ingresses:
                            - apiVersion: networking.k8s.io/v1
                              kind: Ingress
                              metadata:
                                name: test-ingress

                        Optional per object so several libraries can each contribute part of the
                        shared `_global` baseline; see Assertions.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    httpResources:
                      description: |-
                        HTTPResources defines mock HTTP content for this test.

                        These fixtures are used when templates call http.Fetch() to provide
                        pre-defined content without making actual HTTP requests.

                        Example:
                          httpResources:
                            - url: http://blocklist.example.com/list.txt
                              content: |
                                blocked-value-1
                                blocked-value-2
                      items:
                        description: |-
                          HTTPResourceFixture defines mock HTTP content for validation tests.

                          When templates call http.Fetch() for the specified URL, the pre-defined
                          content is returned instead of making an actual HTTP request.
                        properties:
                          content:
                            description: |-
                              Content is the mock response body to return.

                              This content is returned when http.Fetch() is called with the
                              matching URL during test execution.
                            type: string
                          url:
                            description: |-
                              URL is the HTTP URL to mock.

                              When http.Fetch() is called with this URL during test execution,
                              the Content field is returned instead of fetching from the network.
                            minLength: 1
                            type: string
                        required:
                        - content
                        - url
                        type: object
                      type: array
                    minHAProxyVersion:
                      description: |-
                        MinHAProxyVersion specifies the minimum HAProxy version required to run this test.

                        When set, the test is skipped if the local HAProxy version is below this threshold.
                        This is useful for tests that use HAProxy features only available in newer versions
                        (e.g., shm-stats-file requires HAProxy 3.3+).

                        Format: "major.minor" (e.g., "3.3")
                      type: string
                    requires:
                      description: |-
                        Requires lists watched-resource names this test depends on. When an
                        optional watched resource has no served candidate version, every test
                        requiring it is stripped from the effective config at load time.
                        Each entry must name a key of watchedResources.
                      items:
                        type: string
                      type: array
                    requiresFields:
                      description: |-
                        RequiresFields lists schema field paths this test depends on, each in
                        the form "<watchedResourceKey>.<field.path>" (e.g.
                        "httproutes.spec.rules.filters.cors"). When any referenced field is
                        absent from the resolved schema generation of its watched resource,
                        the test is stripped from the effective config at load time. This
                        covers clusters that serve the resource at the same API version as
                        newer releases but with an older schema generation lacking the field.
                        The first dot-segment of each entry must name a key of
                        watchedResources.
                      items:
                        type: string
                      type: array
                  type: object
                description: |-
                  ValidationTests contains embedded validation test definitions.

                  Names must be unique across the merged set: the controller unions tests
                  per source and rejects a name two sources both define, because a silent
                  override would leave one author believing an assertion runs that does
                  not. The reserved `_global` entry accumulates instead.
                type: object
            required:
            - revision
            type: object
          status:
            description: HAProxyTemplateLibraryStatus reports what the controller
              observed.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently
                  observed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
