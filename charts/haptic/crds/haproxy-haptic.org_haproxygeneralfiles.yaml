---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: haproxygeneralfiles.haproxy-haptic.org
spec:
  group: haproxy-haptic.org
  names:
    kind: HAProxyGeneralFile
    listKind: HAProxyGeneralFileList
    plural: haproxygeneralfiles
    shortNames:
    - hpgf
    singular: haproxygeneralfile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.fileName
      name: File Name
      type: string
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HAProxyGeneralFile contains a rendered HAProxy general file (error pages, custom responses, etc.).

          This is a read-only resource automatically created and updated by the controller
          to expose general files generated from templates. Each HAProxyGeneralFile is owned by
          a HAProxyCfg resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HAProxyGeneralFileSpec contains the general file content.
            properties:
              checksum:
                description: |-
                  Checksum is the SHA-256 hash of the file content.

                  Used to detect changes and verify consistency across pods.
                  Format: sha256:<hex-digest>
                minLength: 1
                type: string
              compressed:
                description: |-
                  Compressed indicates the content is zstd+base64 encoded.

                  When true, consumers must decompress before use.
                type: boolean
              content:
                description: |-
                  Content is the file content.

                  This can be any content the HAProxy configuration references,
                  such as custom error pages or response files.
                minLength: 1
                type: string
              fileName:
                description: |-
                  FileName is the logical name of the file.

                  This corresponds to the key in HAProxyTemplateConfig.spec.files.
                minLength: 1
                type: string
              path:
                description: |-
                  Path is the file system path where this file is stored.

                  Example: /etc/haproxy/general/503.http
                minLength: 1
                type: string
            required:
            - checksum
            - content
            - fileName
            - path
            type: object
          status:
            description: HAProxyGeneralFileStatus tracks deployment state to HAProxy
              pods.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the resource's state.

                  Standard conditions include:
                  - "Synced": File has been successfully applied to all target pods
                  - "Ready": Resource is ready for use
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployedToPods:
                description: |-
                  DeployedToPods tracks which HAProxy pods currently have this file.

                  Pods are automatically added when the file is applied and removed when
                  the pod terminates.
                items:
                  description: PodDeploymentStatus tracks deployment to a specific
                    pod.
                  properties:
                    checksum:
                      description: Checksum of the configuration deployed to this
                        pod.
                      type: string
                    consecutiveErrors:
                      description: |-
                        ConsecutiveErrors is the count of consecutive sync failures.

                        This counter increments on each failure and resets to 0 on success.
                        High values indicate persistent problems requiring investigation.
                      minimum: 0
                      type: integer
                    lastError:
                      description: |-
                        LastError contains the error message from the most recent failed sync attempt.

                        This field is cleared when a sync succeeds. Combined with ConsecutiveErrors,
                        this helps identify persistent vs transient issues.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration is the spec generation Checksum was published as, so a
                        pod can be ordered against the spec rather than only compared to it.
                        Checksums are opaque: two differing values say the pod is not on the
                        current spec, never whether it is behind or how far. Reading it as
                        "pod is at or past generation N" needs no knowledge of intermediate
                        versions, which an observer's watch is not guaranteed to receive.

                        Zero means unknown — the publisher has no record of that checksum (it was
                        published by a previous leader, or before a restart), or the kind does not
                        populate it: only HAProxyCfg does today, though this type is shared with
                        the auxiliary file kinds. Treat unknown as not-yet-converged; the next
                        publish records it.
                      format: int64
                      type: integer
                    podName:
                      description: PodName is the name of the HAProxy pod.
                      minLength: 1
                      type: string
                  required:
                  - podName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - podName
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration reflects the generation of the spec that was most recently processed.

                  This is used to track whether status is up-to-date with latest spec changes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
