# Vector sidecar library — renders the vector config HAPTIC pushes to each
# HAProxy pod.
#
# Loaded only when vector.enabled is true, so when the sidecar is off this file
# contributes nothing at all — no empty general file, no dangling scrape source.
#
# The config is declared as a STATIC `files:` entry rather than registered through
# fileRegistry.Register(): the filename is fixed and there is exactly one of them.
# fileRegistry earns its keep only when the filename or the NUMBER of files is
# computed at render time (per-Ingress CA bundles, per-listener crt-lists).
#
# Delivery path, identical to the spoa-hub's config (ADR-0007):
#   render -> dataplane API general-storage -> <GeneralStorageDir>/vector.yaml
#   -> vector's --watch-config sees the write -> graceful reload, no restart.
#
# The readiness gate: this rendered config declares the prometheus_exporter sink,
# and the bootstrap ConfigMap deliberately does NOT. The kubelet probes the
# metrics port, so the container only becomes Ready once this file has been
# pushed and reloaded. Measured against timberio/vector 0.57.0: enabling vector's
# `api` block on a hot reload does NOT start the API server, so an api /health
# probe would never pass — the exporter port is the gate that actually works.

_helm_load:
  enable: '{{ .Values.vector.enabled }}'

files:
  vector.yaml:
    template: |
      {%- var vec = extraContext | dig("vector") | fallback(map[string]any{}) -%}
      {%- var socketPath = vec | dig_string("/run/vector/haproxy.sock", "socketPath") -%}
      {%- var metricsPort = vec | dig("metricsPort") | fallback(9598) -%}
      {%- var scrapeSecs = vec | dig("scrapeIntervalSecs") | fallback(15) -%}
      {%- var statsPort = vec | dig("haproxyStatsPort") | fallback(0) -%}
      {%- var hubPort = vec | dig("spoaHubMetricsPort") | fallback(0) -%}
      {%- var dataDir = vec | dig_string("/var/lib/vector", "dataDir") -%}
      {%- var excludes = vec | dig("excludeMetrics") | fallback([]any{}) | toSlice() -%}
      {#- Type-checked, not just defaulted. Scriggo's `if` treats ANY non-empty string
          as truthy, so a hand-written CR carrying the string "false" would silently
          enable ?no-maint — the exact bypass the Helm-side bool guard exists to stop,
          reached through the other API surface. There is no isbool() filter, so assert
          the type. fallback() is nil-only, so an explicit `false` survives it. -#}
      {#- Same comma-ok type assertion as excludeMaintServerMetrics below, and for the
          same reason: Scriggo's `if` treats any non-empty string as truthy, so a CR
          carrying the string "false" would silently enable the transform. -#}
      {%- var omitEmptyRaw = vec | dig("omitEmptyLogFields") -%}
      {%- var omitEmpty = true -%}
      {%- if omitEmptyRaw != nil -%}
        {%- var omitEmptyBool, omitIsBool = omitEmptyRaw.(bool) -%}
        {%- if !omitIsBool -%}
          {%- fail("extraContext.vector.omitEmptyLogFields must be a boolean, got '" + tostring(omitEmptyRaw) + "'. A quoted 'false' is truthy here and would silently enable the transform.") -%}
        {%- end -%}
        {%- omitEmpty = omitEmptyBool -%}
      {%- end -%}
      {%- var noMaintRaw = vec | dig("excludeMaintServerMetrics") -%}
      {%- var noMaint = true -%}
      {%- if noMaintRaw != nil -%}
        {%- var noMaintBool, isBool = noMaintRaw.(bool) -%}
        {%- if !isBool -%}
          {%- fail("extraContext.vector.excludeMaintServerMetrics must be a boolean, got '" + tostring(noMaintRaw) + "'. A quoted 'false' is truthy here and would silently enable HAProxy's ?no-maint filter.") -%}
        {%- end -%}
        {%- noMaint = noMaintBool -%}
      {%- end -%}
      {#- Each pattern is embedded in a VRL r'...' literal, so a quote or newline
          would break vector's config and crash-loop the sidecar. Reject those here
          as well as in Helm: a hand-written CR bypasses Helm entirely. -#}
      {%- for _, pat := range excludes -%}
        {%- var ps = tostring(pat) -%}
        {%- if ps == "" -%}
          {%- fail("extraContext.vector.excludeMetrics contains an empty pattern; an empty regex matches every metric name and would drop the entire exposition.") -%}
        {%- end -%}
        {%- if regex_search(ps, "['\"\n\r\\\\]") -%}
          {%- fail("extraContext.vector.excludeMetrics pattern '" + ps + "' contains a quote, backslash or newline. Patterns are embedded in a VRL r'...' literal, so those characters would break vector's config and crash-loop the sidecar.") -%}
        {%- end -%}
        {#- Compile check. Note the argument order: regex_search(subject, pattern),
            so the operator's string goes SECOND to be compiled as the pattern —
            passing it first (as above, for the charset test) compiles nothing.
            regex_search calls env.Fatal on an uncompilable pattern. -#}
        {%- var _ = regex_search("", ps) -%}
      {%- end -%}
      {#- Mirror of haptic.vector.validateValues in _vector.tpl. Duplicated on
          purpose: the HAProxyTemplateConfig CR is a first-class API that bypasses
          Helm, so a Helm-only guard protects nothing for a hand-written CR. -#}
      {%- if !hasPrefix(socketPath, "/") -%}
        {%- fail("extraContext.vector.socketPath must be an absolute path, got '" + socketPath + "'. HAProxy's `log <path>` form requires one.") -%}
      {%- end -%}
      {%- if toint(metricsPort) < 1 || toint(metricsPort) > 65535 -%}
        {%- fail("extraContext.vector.metricsPort must be a TCP port between 1 and 65535, got '" + tostring(metricsPort) + "'.") -%}
      {%- end -%}
      {%- if toint(scrapeSecs) < 1 -%}
        {%- fail("extraContext.vector.scrapeIntervalSecs must be a positive integer, got '" + tostring(scrapeSecs) + "'.") -%}
      {%- end -%}
      # Rendered by HAPTIC — do not edit. Overwritten on every reconciliation.
      data_dir: {{ dataDir }}

      sources:
        # HAProxy's log target is in the `global` section, which carries BOTH
        # access-log records and runtime process messages. The two have different
        # shapes, so this is a byte passthrough: parsing as JSON here would drop
        # every process line as a decode error. A future log-derived-metrics step
        # can parse in a transform without changing this source.
        haproxy_log:
          type: socket
          mode: unix_datagram
          path: {{ socketPath }}
          # HAProxy must be able to write to a socket vector created. Both
          # containers run as the pod's runAsUser, so this is belt-and-braces.
          socket_file_mode: 0o666
          decoding:
            codec: bytes
      {%- if toint(statsPort) > 0 %}

        # Re-export HAProxy's own Prometheus exporter so Prometheus scrapes one
        # endpoint per pod instead of one per container.
        #
        # NO instance_tag on purpose. It stamps the SCRAPED target onto every
        # series — "127.0.0.1:8404", identical on every pod, so it identifies
        # nothing — and Prometheus adds its own `instance` from the pod target
        # anyway, so vector's copy lands as `exported_instance`. Measured on a real
        # fleet: 15116 series × that label was 393 KB, two thirds of the 36% byte
        # growth the re-export was adding.
        #
        # honor_labels DOES stay: it preserves the labels HAProxy set (proxy,
        # server, code, state), which every existing dashboard and rule matches on.
      {%- if noMaint %}
        #
        # `?no-maint` asks HAProxy's own exporter to omit servers in MAINT state.
        # In HAPTIC's model MAINT means "reserved slot with no backing pod": backends
        # render a fixed number of slots so scaling needs no reload, and the spare
        # ones sit disabled. They emit a full metric set of zeros each, which on a
        # measured real fleet was 10,176 of 15,116 series (67%) and 1.15 MB of every
        # 1.67 MB scrape. No metric NAME disappears — only the empty slots — and the
        # per-backend census haproxy_backend_agg_server_status{state="MAINT"} still
        # reports how many slots are free, which is why that family is NOT in the
        # excludeMetrics defaults. Turn it off with vector.excludeMaintServerMetrics.
        #
        # vector rewrites this URL as `?no-maint=` (it appends the `=` for a valueless
        # parameter). Verified against the real exporter: `?no-maint`, `?no-maint=` and
        # `?no-maint=1` all filter identically, so the rewrite is harmless.
      {%- end %}
        haproxy_metrics:
          type: prometheus_scrape
          endpoints:
            - http://127.0.0.1:{{ toint(statsPort) }}/metrics{% if noMaint %}?no-maint{% end %}
          scrape_interval_secs: {{ toint(scrapeSecs) }}
          honor_labels: true
      {%- end %}
      {%- if toint(hubPort) > 0 %}

        # Same for the spoa-hub sidecar's metrics (spoa_*, plugin_coraza_*).
        # honor_labels keeps the hub's own label set intact so existing
        # dashboards and recording rules keep matching.
        spoa_hub_metrics:
          type: prometheus_scrape
          endpoints:
            - http://127.0.0.1:{{ toint(hubPort) }}/metrics
          scrape_interval_secs: {{ toint(scrapeSecs) }}
          honor_labels: true
      {%- end %}

        vector_metrics:
          type: internal_metrics

      {%- if len(excludes) > 0 || omitEmpty %}

      transforms:
      {%- end %}
      {%- if omitEmpty %}
        # Strip fields whose value is the empty string, so a record carries only what
        # actually happened. HAProxy's JSON encoder has no way to do this: the full
        # option set for %{...} is M/Q/X/E/bin/json/cbor (src/log.c) with no omit flag,
        # unknown options are silently ignored, and the closest one (+M) does the
        # OPPOSITE — it substitutes "-" for an empty value, and under +json that path
        # is unreachable anyway. So an unresolved field always renders as "key": "".
        # Measured on a real fleet: 27% smaller records (815 -> 595 bytes average),
        # because a feature that did not fire still costs its field on every line —
        # trace_id, denied_by, waf_matched_var, consumer and cache were empty in 100%
        # of sampled records.
        #
        # Deliberately a STRING rewrite, not parse_json + encode_json. Re-encoding
        # would save a further ~6% by compacting separators, but VRL objects are
        # key-sorted, so every field would come back alphabetically — burying `ts`,
        # which the log-format puts first precisely because `format raw` drops the
        # syslog timestamp. It also parses every record; this does not.
        #
        # SAFETY: the patterns anchor on the pair separator and restrict the key to
        # the field-name charset the log-fields framework already enforces. A crafted
        # field value cannot forge a match, because inside a JSON string an embedded
        # quote is escaped as \" and so cannot supply the unescaped opening quote.
        # Verified against a value containing a literal `", "client_ip": "", "`.
        # Numbers are untouched: only `: ""` matches, so `queue_time_ms: 0` survives.
        log_drop_empty:
          type: remap
          inputs: [haproxy_log]
          source: |
            # The FALLIBLE string(), never string!(). remap defaults drop_on_abort=true,
            # so an abort DISCARDS the event rather than passing it on — verified: with
            # .message absent, string!() aborts and the record is gone. The socket source
            # always sets .message today, but a dropped log line is invisible, so the
            # passthrough guarantee is made structural instead of resting on the codec.
            m, err = string(.message)
            if err == null && starts_with(m, "{") {
              m = replace(m, r', "[A-Za-z_][A-Za-z0-9_]*": ""', "")
              m = replace(m, r'\{"[A-Za-z_][A-Za-z0-9_]*": "", ', "{")
              m = replace(m, r'\{"[A-Za-z_][A-Za-z0-9_]*": ""\}', "{}")
              .message = m
            }
      {%- end %}
      {%- if len(excludes) > 0 %}
        # Drop metric families before they are re-exported. HAProxy's exporter
        # publishes host-computed aggregates — running maxima "since the process
        # started" and averages over "the last 1024 connections" — which are a
        # Prometheus anti-pattern: they cannot be aggregated across pods, a
        # since-boot maximum never resets, and the equivalent is derivable from the
        # raw series with max_over_time() / count by (). Dropping them at the source
        # is cheaper than paying for them in every scrape and in TSDB.
        #
        # Operator-controlled via extraContext.vector.excludeMetrics; each entry is
        # a regex matched against the METRIC NAME. Patterns are validated (charset +
        # compile) before they get here, because an invalid one would fail vector's
        # config load and crash-loop the sidecar.
        metrics_filtered:
          type: filter
        {%- if toint(statsPort) > 0 && toint(hubPort) > 0 %}
          inputs: [haproxy_metrics, spoa_hub_metrics, vector_metrics]
        {%- else if toint(statsPort) > 0 %}
          inputs: [haproxy_metrics, vector_metrics]
        {%- else if toint(hubPort) > 0 %}
          inputs: [spoa_hub_metrics, vector_metrics]
        {%- else %}
          inputs: [vector_metrics]
        {%- end %}
          condition:
            type: vrl
            source: |
              !match_any(string!(.name), [
        {%- for _, pat := range excludes %}
                r'{{ tostring(pat) }}',
        {%- end %}
              ])
      {%- end %}

      sinks:
        # For now the access log just goes to stdout, so `kubectl logs -c vector`
        # shows it. Point this at a real sink by overriding this file's template
        # through controller.config.templateSnippets.
        stdout:
          type: console
          inputs: [{% if omitEmpty %}log_drop_empty{% else %}haproxy_log{% end %}]
          encoding:
            codec: text

        # The single scrape target. Its presence is ALSO the readiness gate — see
        # the header comment.
        metrics:
          type: prometheus_exporter
      {%- if len(excludes) > 0 %}
          inputs: [metrics_filtered]
      {%- else %}
          inputs:
        {%- if toint(statsPort) > 0 %}
            - haproxy_metrics
        {%- end %}
        {%- if toint(hubPort) > 0 %}
            - spoa_hub_metrics
        {%- end %}
            - vector_metrics
      {%- end %}
          address: 0.0.0.0:{{ toint(metricsPort) }}

validationTests:
  test-vector-config-rendered:
    description: Vector config renders with the log socket, both scrape sources, and the exporter
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        spoaHubMetricsPort: 9101
        dataDir: /var/lib/vector
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid with vector enabled
      - type: contains
        target: file:vector.yaml
        pattern: 'mode: unix_datagram'
        description: Log source must be a UNIX datagram socket
      - type: contains
        target: file:vector.yaml
        pattern: 'path: /run/vector/haproxy\.sock'
        description: Socket path must come from the operator value
      - type: contains
        target: file:vector.yaml
        pattern: 'codec: bytes'
        description: >-
          Byte passthrough, not JSON decoding — the global log target carries
          non-JSON process messages alongside JSON access records
      - type: contains
        target: file:vector.yaml
        pattern: 'http://127\.0\.0\.1:8404/metrics'
        description: Must re-export HAProxy's exporter
      - type: contains
        target: file:vector.yaml
        pattern: 'http://127\.0\.0\.1:9101/metrics'
        description: Must re-export the spoa-hub's metrics
      - type: contains
        target: file:vector.yaml
        pattern: 'address: 0\.0\.0\.0:9598'
        description: Exporter must bind the configured metrics port
      - type: contains
        target: file:vector.yaml
        pattern: 'type: prometheus_exporter'
        description: >-
          The exporter sink is the readiness gate — without it the kubelet probe
          on the metrics port never passes

  test-vector-metric-exclusions:
    description: excludeMetrics renders a filter transform, and the exporter reads from it
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        spoaHubMetricsPort: 9101
        dataDir: /var/lib/vector
        excludeMetrics:
          - '^haproxy_(server|backend)_max_'
          - '^haproxy_backend_agg_'
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: contains
        target: file:vector.yaml
        pattern: 'type: filter'
        description: A filter transform must be emitted
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[metrics_filtered\]'
        description: >-
          The exporter must read from the FILTER, not the raw sources — otherwise the
          transform renders but drops nothing
      - type: contains
        target: file:vector.yaml
        pattern: "r'\\^haproxy_\\(server\\|backend\\)_max_'"
        description: Each pattern must reach the VRL condition
      - type: not_contains
        target: file:vector.yaml
        # The KEY form, not the bare word: the surrounding comment explains why the
        # option is absent, and a substring match would find that comment instead —
        # an assertion that can never fail.
        pattern: '(?m)^\s+instance_tag:'
        description: >-
          instance_tag stamps the scraped target onto every series (identical on every
          pod, and shadowed by Prometheus's own instance label) — 393 KB per scrape on
          a real fleet

  test-vector-omit-empty-log-fields:
    description: omitEmptyLogFields renders the remap transform and the stdout sink reads it
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 0
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        excludeMetrics: []
        omitEmptyLogFields: true
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^\s+log_drop_empty:'
        description: The transform must be emitted as a config KEY, not just described in a comment
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[log_drop_empty\]'
        description: >-
          The stdout sink must read the TRANSFORM. If it still read haproxy_log the
          transform would render and strip nothing — a silent no-op
      - type: contains
        target: file:vector.yaml
        # The pair-separator anchor is the security boundary: it is what stops a
        # crafted field value from forging a match, since an embedded quote inside a
        # JSON string is escaped as \" and cannot open a key.
        pattern: 'replace\(m, r'', "\[A-Za-z_\]\[A-Za-z0-9_\]\*": ""'', ""\)'
        description: The separator-anchored, charset-restricted pattern must reach the config
      - type: not_contains
        target: file:vector.yaml
        pattern: 'string!\(\.message\)'
        description: >-
          Must use the FALLIBLE string(), never string!(). remap defaults
          drop_on_abort=true, so an abort DISCARDS the log record — verified: with
          .message absent, string!() aborts and the line is silently lost
      - type: contains
        target: file:vector.yaml
        pattern: 'm, err = string\(\.message\)'
        description: The fallible form, so no record can ever be dropped by this transform

  test-vector-omit-empty-disabled-passes-through:
    description: With omitEmptyLogFields=false the log goes straight from source to sink
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 0
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        excludeMetrics: []
        omitEmptyLogFields: false
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: not_contains
        target: file:vector.yaml
        pattern: 'log_drop_empty'
        description: >-
          No transform at all — not even a rendered comment mentioning it, or the
          opt-out would look applied while the pipeline says otherwise
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[haproxy_log\]'
        description: The sink reads the raw source, preserving the byte-passthrough path

  test-vector-omit-empty-must-be-a-real-boolean:
    description: A quoted "false" is rejected rather than silently enabling the transform
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        omitEmptyLogFields: "false"
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'omitEmptyLogFields must be a boolean'
        description: Scriggo treats any non-empty string as truthy, so the CR path needs the type check too

  test-vector-no-maint-scrape-parameter:
    description: excludeMaintServerMetrics appends ?no-maint to the HAProxy scrape URL
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        # Non-zero on purpose, so the hub endpoint is actually rendered and the
        # "must not leak onto the hub" assertion below has something to match.
        spoaHubMetricsPort: 9101
        dataDir: /var/lib/vector
        excludeMetrics: []
        excludeMaintServerMetrics: true
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: contains
        target: file:vector.yaml
        # Anchored to the endpoint LINE and to the port, so a stray `?no-maint`
        # elsewhere in the file (a comment, the hub endpoint) cannot satisfy it.
        pattern: '(?m)^\s+- http://127\.0\.0\.1:8404/metrics\?no-maint$'
        description: >-
          Drops MAINT-state servers at the source. In HAPTIC's model MAINT means an
          empty reserved slot; on a real fleet that was 10,176 of 15,116 series (67%)
      - type: not_contains
        target: file:vector.yaml
        # The hub exposes no reserved-slot concept, so the parameter must not leak
        # onto its endpoint — it would be a meaningless query string there.
        pattern: '(?m)^\s+- http://127\.0\.0\.1:9101/metrics\?no-maint$'
        description: The parameter is HAProxy-specific and must not reach the hub endpoint

  test-vector-no-maint-disabled-keeps-every-slot:
    description: excludeMaintServerMetrics=false scrapes the plain endpoint
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        excludeMetrics: []
        excludeMaintServerMetrics: false
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^\s+- http://127\.0\.0\.1:8404/metrics$'
        description: Plain endpoint, so operators who alert on a drained server keep it
      - type: not_contains
        target: file:vector.yaml
        pattern: 'no-maint'
        description: >-
          Nothing may mention it — not even a rendered comment, or the opt-out would
          look applied while the URL says otherwise

  test-vector-no-exclusions-skips-the-transform:
    description: With no exclusions the exporter reads the sources directly — no dead transform
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        excludeMetrics: []
    assertions:
      - type: haproxy_valid
        description: HAProxy config must still be valid
      - type: not_contains
        target: file:vector.yaml
        pattern: 'type: filter'
        description: No filter transform when there is nothing to drop
      - type: contains
        target: file:vector.yaml
        pattern: '- haproxy_metrics'
        description: The exporter reads the scrape source directly

  test-vector-no-maint-must-be-a-real-boolean:
    description: A quoted "false" is rejected rather than silently enabling ?no-maint
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        # The STRING, not the boolean. Scriggo's `if` treats any non-empty string as
        # truthy, so without a type check this would enable the very filter the
        # operator was switching off — and a hand-written CR bypasses the Helm guard.
        excludeMaintServerMetrics: "false"
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'excludeMaintServerMetrics must be a boolean'
        description: >-
          Fails loudly instead of inverting the operator's intent, mirroring the
          Helm-side guard for the CR path

  test-vector-exclusion-pattern-must-not-carry-quotes:
    description: A pattern with a quote is rejected at render time
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        excludeMetrics:
          - "bad'pattern"
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'contains a quote, backslash or newline'
        description: >-
          Patterns land inside a VRL r'...' literal; a quote would break vector's
          config load and crash-loop the sidecar

  test-vector-config-no-spoa-hub:
    description: Without a hub metrics port, no dangling spoa_hub scrape source or input is emitted
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        # Explicit 0, not omitted: a test's extraContext MERGES over the _global
        # baseline, so leaving this out inherits the chart's real hub port and the
        # not_contains below would test nothing.
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: not_contains
        target: file:vector.yaml
        pattern: 'spoa_hub_metrics'
        description: >-
          A scrape source pointing at a port nothing listens on would make vector
          log a connection error every scrape_interval forever
      - type: contains
        target: file:vector.yaml
        pattern: 'http://127\.0\.0\.1:8404/metrics'
        description: HAProxy's exporter must still be re-exported

  test-access-log-target-vector-socket:
    description: >-
      With vector enabled the access log is emitted to the mounted UNIX datagram
      socket instead of stdout — the counterpart to
      test-access-log-target-default-is-stdout in base.yaml.
    fixtures: {}
    extraContext:
      accessLog:
        targets:
          - address: /run/vector/haproxy.sock
            format: raw
    assertions:
      - type: haproxy_valid
        description: A plain-path log target must pass HAProxy's config check
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log /run/vector/haproxy\.sock len 16384 format raw local0 info$'
        description: >-
          The plain-path form is HAProxy's UNIX datagram target; deliberately not
          `unix@`, which HAProxy 3.4 rejects for a ring server
      - type: not_contains
        target: haproxy.cfg
        pattern: '^  log stdout '
        description: >-
          Nothing should still be logging to stdout — a second target would double
          every record once vector re-emits to its own stdout

  test-vector-metrics-loopback-only:
    description: >-
      With the sidecar enabled, HAProxy answers /metrics only over loopback (vector
      scrapes it from inside the pod), while /healthz and /ready stay reachable
      from the pod IP for the kubelet's probes.
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        haproxyStatsPort: 8404
        spoaHubMetricsPort: 0
    assertions:
      - type: haproxy_valid
        description: The dst ACL must pass HAProxy's config check
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request use-service prometheus-exporter if \{ path /metrics \} \{ dst 127\.0\.0\.0/8 \}'
        description: >-
          Gated on dst (the address connected TO), not on the bind — binding this
          listener to loopback would break the kubelet probes on the same port
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 200 content-type text/plain string "READY" if \{ path /ready \}'
        description: /ready must stay unconditional or the pod never becomes Ready
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 200 content-type text/plain string "OK" if \{ path /healthz \}'
        description: /healthz must stay unconditional for the liveness probe

  test-vector-socket-path-must-be-absolute:
    description: A relative socketPath is rejected at render time
    fixtures: {}
    extraContext:
      vector:
        socketPath: run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'socketPath must be an absolute path'
        description: HAProxy resolves a relative log path against default-path origin
