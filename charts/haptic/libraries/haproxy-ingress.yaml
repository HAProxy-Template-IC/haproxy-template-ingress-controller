        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
