      haproxy-ingress.github.io/auth-url annotation flavour.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: hi-protected-svc-abc
            labels:
              kubernetes.io/service-name: hi-protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-url annotation
      - type: contains
        target: map:auth-url.map
        pattern: "hi-protected.example.com/ https://auth.example/check"
        description: auth-url.map must contain the host+path → URL entry
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
        description: Frontend looks up auth_url from the map after routing
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend triggers the SPOE check when auth_url is found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure

