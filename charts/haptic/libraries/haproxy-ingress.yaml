  test-haproxy-ingress-external-auth-headers-succeed-fail:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      haproxy-ingress.github.io/auth-headers-succeed and auth-headers-fail
      annotations both populate auth-extract-headers.map (their union
      per ingress) and produce per-unique-header HAProxy directives:
      `http-request set-header` for pass (fires on success, allowed=true)
      and `http-response set-header` for fail (fires on auth failure,
      after the deny rule, gated on `auth_url -m found` and
      `!allowed`).
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-succeed: "X-Auth-User, X-Auth-Roles"
              haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-headers-succeed and auth-headers-fail annotations
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/protected X-Auth-User, X-Auth-Roles, WWW-Authenticate, X-Error-Reason"
        description: auth-extract-headers.map must hold the union of pass and fail headers per ingress (with consistent comma+space spacing)
      - type: contains
        target: file:spoe.conf
        pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"
        description: SPOE message body threads txn.auth_extract_headers into the plugin's extract_headers arg
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
        description: First pass header gets a set-header line gated on allowed=true and var found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\]"
        description: Second pass header gets its own set-header line
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header WWW-Authenticate %\\[var\\(txn.hub.external_auth.www_authenticate\\)\\] if \\{ var\\(txn.auth_url\\) -m found \\} !\\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\} \\{ var\\(txn.hub.external_auth.www_authenticate\\) -m found \\}"
        description: First fail header uses http-after-response (fires on deny-generated responses, unlike http-response which only runs on backend responses)
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header X-Error-Reason %\\[var\\(txn.hub.external_auth.x_error_reason\\)\\]"
        description: Second fail header gets its own http-after-response set-header line

