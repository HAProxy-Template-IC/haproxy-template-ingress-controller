  test-haproxy-ingress-external-auth-headers-request-extends-spoe-message:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      haproxy-ingress.github.io/auth-headers-request listing a custom
      header (one not in the hardcoded six) must auto-extend the SPOE
      check-auth message body with a `hdr_<name>=req.hdr(<Name>)`
      capture, so the plugin actually sees the header. Headers that
      ARE in the hardcoded six must NOT be re-emitted (would produce
      a duplicate SPOE arg). Multiple ingresses listing the same
      custom header must dedupe to a single capture.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tenant-a
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              # Mix of hardcoded (Authorization) and custom (X-Tenant-ID, X-Request-ID).
              haproxy-ingress.github.io/auth-headers-request: "Authorization, X-Tenant-ID, X-Request-ID"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tenant-a.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tenant-b
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              # Repeats X-Tenant-ID — must dedupe across ingresses.
              haproxy-ingress.github.io/auth-headers-request: "X-Tenant-ID, X-Trace-Id"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tenant-b.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with custom auth-headers-request entries
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\)"
        description: Custom header X-Tenant-ID is captured as an SPOE arg
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_request_id=req\\.hdr\\(X-Request-ID\\)"
        description: Custom header X-Request-ID from tenant-a is captured
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_trace_id=req\\.hdr\\(X-Trace-Id\\)"
        description: Custom header X-Trace-Id from tenant-b is captured
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\) .*hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\)"
        description: Duplicate X-Tenant-ID across ingresses must collapse to one capture
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_authorization=req\\.hdr\\(Authorization\\) .*hdr_authorization=req\\.hdr"
        description: Hardcoded Authorization header must not be re-emitted by the auto-extend snippet

  test-haproxy-ingress-external-auth-headers-request-dash-underscore-collision:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Two header spellings that differ only in dashes vs underscores
      (e.g. `X-Request-Id` and `X_Request_Id`) lower-case to
      different strings but collapse to the same SPOE arg name
      after dash→underscore replacement (`hdr_x_request_id`).
      Without dedup on the post-replacement name, the chart would
      emit two `hdr_x_request_id=...` tokens on the same args= line
      — SPOE doesn't allow duplicate arg keys, so the parser's
      handling becomes undefined. Regression test for that.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
