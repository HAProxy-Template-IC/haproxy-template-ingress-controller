  test-haproxy-ingress-auth-tls-secret:
    description: |
      haproxy-ingress.github.io/auth-tls-secret references a
      Secret whose `ca.crt` is written to the general file dir
      (not ssl/ — Dataplane validates ssl/ uploads as cert+key)
      and used in the crt-list line for the matching SNI as
      `ca-file <path> verify required`. Combined with auth-tls-error-page
      (302 redirect on verification failure) and auth-tls-cert-header
      (forward client cert as headers to the backend on success).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mtls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mtls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: client-ca
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: server-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-ingress.github.io/auth-tls-secret: "client-ca"
              haproxy-ingress.github.io/auth-tls-verify-client: "on"
              haproxy-ingress.github.io/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-ingress.github.io/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with the auth-tls-* annotation set
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
        description: crt-list line carries the per-host ca-file path (general/, not ssl/ — Dataplane SSL endpoint validates ssl/ uploads as cert+key), verify mode, and SNI
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location https://login\\.example\\.com/cert-required code 302 if \\{ ssl_c_verify gt 0 \\}"
        description: auth-tls-error-page emits a 302 redirect gated on the cert-verify-failure ACL
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-SSL-Client-Cert %\\[ssl_c_der,base64\\] if \\{ ssl_fc_has_crt \\}"
        description: auth-tls-cert-header forwards the client cert (base64 DER) on requests that presented a cert

  test-haproxy-ingress-auth-tls-error-page-injection-rejected:
    description: |
      An auth-tls-error-page value containing whitespace (or
      newlines, tabs, etc.) must fail loudly — without validation,
      the value would be interpolated into a `http-request redirect
      location <url>` directive where whitespace is significant and
      could be used to inject arbitrary HAProxy directives. Defence
      in depth against any future code path where Ingress-write RBAC
      isn't strictly scoped.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mtls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mtls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redirect
            annotations:
              # Whitespace + injected `http-request deny` after the legitimate URL.
              haproxy-ingress.github.io/auth-tls-error-page: "https://evil.example.com code 301\n      http-request deny if TRUE"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid URL"
        description: Render must fail loudly when the URL contains whitespace
      - type: contains
        target: rendering_error
        pattern: "default/bad-redirect"
        description: Error must identify the offending Ingress

