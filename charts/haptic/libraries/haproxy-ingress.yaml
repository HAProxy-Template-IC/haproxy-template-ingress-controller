            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"
          spec:
            ingressClassName: haproxy
            rules:
              - host: nginx.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: coexist-svc, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: haproxy-shadow
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: haproxy.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: coexist-svc, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with both annotation flavours
      - type: contains
        target: map:haproxy-ingress-waf.map
        pattern: "default/haproxy-shadow detect"
        description: waf-map carries the haproxy-ingress detect-mode entry keyed by <ns>/<name>
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: "# nginx-ingress modsecurity-snippet from default/nginx-modsec"
        description: nginx-ingress modsec-snippet is still inlined
      - type: not_contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub check-request-group if \\{ var\\(txn.coraza_mode\\) -m found \\}"
        description: Dispatch is unconditional (nginx wins) — no per-path gate
      - type: contains
        target: haproxy.cfg
        pattern: "!\\{ var\\(txn.coraza_mode\\) -m str detect \\}"
        description: Deny rule still respects detect mode under unconditional dispatch

  test-haproxy-ingress-waf-without-coraza-fails:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Ingress with haproxy-ingress.github.io/waf set while the spoaHub
      coraza plugin is NOT enabled fails the render with an explicit
      diagnostic. Silent ignore would hide a misconfiguration: the
      operator wrote a per-Ingress WAF directive and nothing enforces
      it. Mirrors the equivalent fail-loud for nginx-ingress's
      /modsecurity-snippet.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: []
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        plugins: []
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: orphan-waf
            annotations:
              haproxy-ingress.github.io/waf: modsecurity
          spec:
            ingressClassName: haproxy
            rules:
              - host: orphan.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: any, port: { number: 80 } } }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-waf sets annotation 'haproxy-ingress\\.github\\.io/waf' but the spoaHub coraza plugin is not enabled"
        description: Render must fail with explicit annotation-without-coraza error

  test-haproxy-ingress-ssl-passthrough-named-port:
    description: haproxy-ingress.github.io/ssl-passthrough annotation must resolve a backend referenced by port.name to the correct numeric pod port
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: secure-grpc
            namespace: default
          spec:
            ports:
              - name: grpc-tls
                port: 9443
                targetPort: grpc-tls
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secure-grpc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: secure-grpc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.60"]
              targetRef:
                kind: Pod
                name: secure-grpc-0
          ports:
            - name: grpc-tls
              port: 9443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: secure-grpc
            namespace: default
            annotations:
              haproxy-ingress.github.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: grpc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: secure-grpc
                          port:
                            name: grpc-tls
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.60:9443 "
        description: haproxy-ingress SSL passthrough must use the resolved port for named-port references
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.60:80 "
        description: Must not regress to port-80 fallback
