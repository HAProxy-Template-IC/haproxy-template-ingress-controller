  test-haproxy-ingress-waf-deny-default:
    # Needs the spoa-hub library loaded (the dispatch wiring lives there).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Single Ingress with haproxy-ingress.github.io/waf: "modsecurity"
      and no /waf-mode populates haproxy-ingress-waf.map with mode
      "deny" and produces conditional dispatch in the rendered HAProxy
      config (set-var → map lookup → send-spoe-group if found).
    extraContext:
      spoaHub:
        enabled: true
