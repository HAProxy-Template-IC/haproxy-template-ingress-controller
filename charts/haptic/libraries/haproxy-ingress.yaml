    description: |
      haproxy-ingress.github.io/auth-headers-pass and auth-headers-fail
      annotations both populate auth-extract-headers.map (their union
      per ingress) and produce per-unique-header HAProxy directives:
      `http-request set-header` for pass (fires on success, allowed=true)
      and `http-response set-header` for fail (fires on auth failure,
      after the deny rule, gated on `auth_url -m found` and
      `!allowed`).
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-pass: "X-Auth-User, X-Auth-Roles"
              haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-headers-pass and auth-headers-fail annotations
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "protected.example.com/api X-Auth-User, X-Auth-Roles, WWW-Authenticate, X-Error-Reason"
        description: auth-extract-headers.map must hold the union of pass and fail headers per ingress (with consistent comma+space spacing)
      - type: contains
        target: file:spoe.conf
        pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"
        description: SPOE message body threads txn.auth_extract_headers into the plugin's extract_headers arg
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
        description: First pass header gets a set-header line gated on allowed=true and var found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\]"
        description: Second pass header gets its own set-header line
      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header WWW-Authenticate %\\[var\\(txn.hub.external_auth.www_authenticate\\)\\] if \\{ var\\(txn.auth_url\\) -m found \\} !\\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\} \\{ var\\(txn.hub.external_auth.www_authenticate\\) -m found \\}"
        description: First fail header gets an http-response set-header gated on the auth path having run, !allowed, and var found
      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header X-Error-Reason %\\[var\\(txn.hub.external_auth.x_error_reason\\)\\]"
        description: Second fail header gets its own http-response set-header line

  test-haproxy-ingress-external-auth-bad-header-name-rejected:
    _helm_skip_test: '{{ if include "haptic.spoaHub.enabled" . }}false{{ else }}true{{ end }}'
    description: |
      A header name in auth-headers-pass / auth-headers-fail that
      doesn't match the RFC 7230 token grammar (e.g. contains
      whitespace, fetch syntax, or other special characters) must
      fail loudly at template-render time. Defence in depth against
      malformed annotation values being embedded into HAProxy
      directives.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-header
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              # Contains an HAProxy fetch-syntax injection attempt:
              haproxy-ingress.github.io/auth-headers-pass: "X-Auth-User, %[var(txn.injected)]"
          spec:
            ingressClassName: haproxy
            rules:
              - host: bad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid HTTP header name"
        description: Render must fail loudly when a header name violates RFC 7230 token grammar
      - type: contains
        target: rendering_error
        pattern: "default/bad-header"
        description: Error must identify the offending Ingress

  test-haproxy-ingress-external-auth-hostless-rejected:
    # Same as test-haproxy-ingress-external-auth: needs the spoa-hub
    # library loaded.
    _helm_skip_test: '{{ if include "haptic.spoaHub.enabled" . }}false{{ else }}true{{ end }}'
    description: |
      Ingress with haproxy-ingress.github.io/auth-url AND a host-less
      rule must fail loudly at template-render time. Same security
      contract as the nginx-ingress flavour: silent skip is a
      security failure mode.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: hi-protected-svc-abc
            labels:
              kubernetes.io/service-name: hi-protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-hostless
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "auth-url set but a rule without a host"
        description: Template render must fail with the host-less error message
      - type: contains
        target: rendering_error
        pattern: "default/hi-hostless"
        description: Error must identify the offending Ingress
