  test-haproxy-ingress-path-type-exact:
    description: HAProxy-Ingress path-type exact annotation uses exact match map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: exact-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: exact-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: exact-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: exact-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "exact"
          spec:
            ingressClassName: haproxy
            rules:
              - host: exact.example.com
                http:
                  paths:
                    - path: /api/users
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: exact-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: "map:path-exact.map"
        pattern: '(?m)^exact\.example\.com/api/users BACKEND:default_exact-ingress_svc_exact-service_80$'
        description: |
          Map entry must carry the `BACKEND:<backend_name>` qualifier
          prefix so base.yaml's frontend-routing-logic can decode the
          qualifier (`field(1,:)`) and dispatch to the named backend.
          Asserting on the value (not just the key) is the assertion
          that would have caught the historical breakage where the
          renderer omitted the `BACKEND:` prefix and routing silently
          fell through to default_backend.

