# SSL/TLS Infrastructure Library for HAPTIC
# Contains SSL certificate management, HTTPS frontends, and SSL passthrough infrastructure
# Must be loaded after base.yaml to access frontend-routing-logic and file registry

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ssl.enabled }}'

# Test certificate fixtures (YAML anchors for reuse across validation tests).
# The default pair is ECDSA (EC PRIVATE KEY); the *_rsa pair is a 2048-bit RSA
# cert/key, used by the dual-cert test to prove RSA+ECDSA on the same SNI.
_test_tls_crt: &test_tls_crt 
_test_tls_key: &test_tls_key 
_test_tls_crt_rsa: &test_tls_crt_rsa 
_test_tls_key_rsa: &test_tls_key_rsa 

# Watch secrets for SSL certificate loading
watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]

# Library-declared extraContext defaults (lowest precedence; an operator overrides
# any of these via controller.config.templatingSettings.extraContext). HSTS is a
# TLS concern, so its global knobs live here; features-085-ssl-hsts-global reads them.
templatingSettings:
  extraContext:
    # Send Strict-Transport-Security on every TLS response (all hosts), matching
    # ingress-nginx's global `hsts: true` default. Off by default; a per-Ingress
    # hsts annotation still overrides the value for its hosts. HSTS only takes
    # effect over HTTPS — pair it with an HTTP→HTTPS redirect (the rendered config
    # emits a warning when HSTS is on but no redirect is configured).
    tls:
      hsts:
        enabled: false
        maxAge: "31536000"          # one year
        includeSubdomains: false
        preload: false

      # TLS cipher / protocol policy applied to EVERY SSL bind via
      # global ssl-default-bind-* (see global-settings-410-ssl-ciphers).
      # These sub-keys sit beside `hsts` under the single `tls` block; override
      # any of them through controller.config.templatingSettings.extraContext.tls.*
      # (Helm deep-merges, so overriding one key keeps the sibling defaults).
      #
      # Inclusive-by-default and CERT-AGNOSTIC: `ciphers` is a single forward-
      # secret superset spanning ECDSA (ECDHE-ECDSA-*), RSA (ECDHE-RSA-*), and
      # DHE (DHE-RSA-*). HAProxy offers only the suites it has a matching
      # certificate for, so the SAME list serves an RSA-only, ECDSA-only, or
      # dual (RSA+ECDSA) deployment with no per-cert-type config.
      #
      # To reach pre-2014 appliances that only do static-RSA key exchange,
      # append RSA-kx suites to `ciphers` (e.g. AES128-GCM-SHA256:AES256-SHA)
      # and lower `minVersion` — those clients lose forward secrecy, modern
      # clients keep it via server cipher ordering. Set a value to "" to omit
      # the directive and fall back to HAProxy's built-in default.
      # TLS 1.2 ciphers (ssl-default-bind-ciphers) — all forward-secret.
      # This default string is mirrored in the cipher-policy examples in
      # docs/site/docs/ssl-certificates.md (the test-ssl-global-cipher-policy-*
      # assertions also pin its head/tail) — change all copies together.
      ciphers: "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA"
      # TLS 1.3 cipher suites (ssl-default-bind-ciphersuites).
      ciphersuites: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
      # Minimum protocol version (ssl-default-bind-options ssl-min-ver).
      # TLSv1.2 is the safe floor; lower to TLSv1.0 only for legacy clients.
      minVersion: "TLSv1.2"

templateSnippets:
  # SSL bind options utility - used by both HTTPS frontend and SSL passthrough
  # Uses crt-list for certificate management with per-certificate OCSP configuration
  util-ssl-bind-options:
    template: >-
      {{- " " -}}ssl crt-list {{ pathResolver.GetPath("certificate-list.txt", "crt-list") }} alpn h2,http/1.1{% if (extraContext | dig("tls", "sessionTickets")) != nil %} tls-ticket-keys {{ pathResolver.GetPath("tls-ticket-keys", "file") }}{% end %}

  # Parameterised counterpart of `util-ssl-bind-options` — emits the
  # same `ssl crt-list <path> alpn h2,http/1.1` suffix but reads the
  # crt-list filename from the caller. Used by phase 4 of the
  # per-Gateway-IP refactor (`https-bind-extra-*` snippet) to give
  # each (Gateway, listener) bind its own crt-list (different SSL
  # configs without bind-line collision). The macro form keeps the
  # chart-static path on the simpler bare snippet above so that
  # call site stays a one-liner.
  util-ssl-bind-options-for-crtlist:
    template: |
      {%- macro SSLBindOptionsForCrtlist(crtlistFilename string) string -%}
        {{- " " -}}ssl crt-list {{ pathResolver.GetPath(crtlistFilename, "crt-list") }} alpn h2,http/1.1{% if (extraContext | dig("tls", "sessionTickets")) != nil %} tls-ticket-keys {{ pathResolver.GetPath("tls-ticket-keys", "file") }}{% end %}
      {%- end -%}

  # One 80-byte TLS session-ticket key (STEK), base64. The first 8 bytes hold a
  # YYYYMMDD marker inside HAProxy's 16-byte key-NAME field (a public identifier,
  # not secret); bytes 8..80 are crypto-random, so the AES-256 (16..48) and
  # HMAC-SHA-256 (48..80) halves are full-entropy. The marker lets the rotator
  # tell how old a key is without a comment line (HAProxy rejects those).
  util-ticket-key:
    template: |
      {%- macro NewTicketKey(dateStr string) string -%}
        {{- base64(dateStr + randBytes(72)) -}}
      {%- end -%}

  # Global TLS cipher / protocol policy. Rendered into the `global` section
  # (base.yaml's global-settings render_glob picks up global-settings-* from
  # every loaded library) so it lands right after global-settings-400-ssl.
  global-settings-410-ssl-ciphers:
    template: |
      {#-
        Global TLS cipher / protocol policy — applies to EVERY SSL bind via
        ssl-default-bind-*. Rendered from extraContext.tls (defaults declared
        in this library's templatingSettings.extraContext; Helm deep-merges an
        operator's partial override with those defaults).

        Cert-agnostic by construction: `tls.ciphers` is a forward-secret
        superset spanning ECDSA (ECDHE-ECDSA-*), RSA (ECDHE-RSA-*), and DHE
        (DHE-RSA-*). HAProxy only offers the suites it holds a matching
        certificate for, so one list serves an RSA-only, ECDSA-only, or dual
        (RSA+ECDSA) deployment identically. Per-listener Gateway TLS options
        (gateway/92-listener-tls-options) still override per bind.

        Any empty value omits its directive (falls back to HAProxy's built-in
        default). See docs: libraries/ssl for dual-cert / cert-manager setup.
      -#}
      {%- var ciphers = tostring(extraContext | dig("tls", "ciphers") | fallback("")) -%}
      {%- var ciphersuites = tostring(extraContext | dig("tls", "ciphersuites") | fallback("")) -%}
      {%- var minVer = tostring(extraContext | dig("tls", "minVersion") | fallback("")) -%}
      {#- Config-injection guard: these strings render verbatim into the global
          section, so each must stay within the cipher/version charset
          (letters, digits, and : _ + . -), which blocks newlines/control
          chars. Report the offending KEY rather than echoing the raw value —
          a value that failed the charset check may carry the very characters
          we're guarding against, and the error surfaces in logs/Events. -#}
      {%- if ciphers != "" && regex_search(ciphers, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.ciphers: only cipher characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if ciphersuites != "" && regex_search(ciphersuites, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.ciphersuites: only cipher characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if minVer != "" && regex_search(minVer, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.minVersion: only version characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if ciphers != "" %}
      ssl-default-bind-ciphers {{ ciphers }}
      {%- end %}
      {%- if ciphersuites != "" %}
      ssl-default-bind-ciphersuites {{ ciphersuites }}
      {%- end %}
      {%- if minVer != "" %}
      ssl-default-bind-options ssl-min-ver {{ minVer }}
      {%- end %}

  util-crtlist-line:
    template: |
      {#- Build a single crt-list line.

            <certFilename> [ocsp-update on[ ca-file <ca> verify <mode>]]\
                          [ <sniSuffix>]

          Inputs:
            certFilename   The cert file as stored on disk (sanitized
                           filename from features-100-{ingress,gateway}-tls).
            mtlsCfg        Optional `map[string]any{"ca_path": …,
                           "verify_mode": …}` — either nil (no client-
                           cert validation) or a resolved validation
                           block. The bracketed clause is emitted only
                           when both fields are non-empty.
            sniSuffix      Space-joined SNI patterns (shared chart-static
                           crt-list groups multiple SNIs per line) OR a
                           single listener hostname (per-listener
                           crt-list scopes one cert to one hostname).
                           Empty string for catchall — no trailing SNI
                           filter is appended.

          NOTE: `ca-ignore-err all crt-ignore-err all` (the
          AllowInsecureFallback lift) is BIND-scope, not crt-list-
          scope — HAProxy rejects the keywords inside a crt-list line.
          Phase 4's per-Gateway bind reads `gatewayListenerMTLSConfig`
          directly and adds the flags to its `bind *:<podPort>`
          directive; this macro does NOT emit them.
      -#}
      {%- macro CrtListLine(certFilename string, mtlsCfg any, sniSuffix string) string %}
        {%- var opts = "ocsp-update on" %}
        {%- if mtlsCfg != nil %}
          {%- var cfg = mtlsCfg.(map[string]any) %}
          {%- var caPath = tostring(cfg["ca_path"]) %}
          {%- var verifyMode = tostring(cfg["verify_mode"]) %}
          {%- if caPath != "" && verifyMode != "" %}
            {%- opts = opts + " ca-file " + caPath + " verify " + verifyMode %}
          {%- end %}
        {%- end %}
        {%- var line = certFilename + " [" + opts + "]" %}
        {%- if sniSuffix != "" %}
          {%- line = line + " " + sniSuffix %}
        {%- end %}
        {{- line -}}
      {%- end %}

  features-050-ssl-initialization:
    template: |
      {#-
        SSL Infrastructure Initialization

        Purpose: Initializes data structures for SSL feature registration.

        Extension Point: features-* (priority 050 - runs first)

        Provides (in shared.globalFeatures):
          - sslPassthroughBackends: Array for SSL passthrough backend registrations
          - tlsCertificates: Array for TLS certificate registrations
          - sslRedirectHosts: Array for SSL redirect host registrations

        Dependencies: None (this initializes the infrastructure)

        Used By:
          - features-100-gateway-ssl-passthrough
          - features-100-gateway-tls
          - features-100-ingress-tls
          - features-100-haproxytech-ssl-passthrough
          - features-100-haproxytech-ssl-redirect
      -#}

      {# Initialize SSL data structures atomically - ComputeIfAbsent ensures this runs exactly once.
         Only keys that ssl.yaml itself owns (produces or consumes) are seeded
         here. Keys owned end-to-end by another library (e.g. the gateway
         library's mtlsBlockedListeners / gatewayListenerMTLSConfig, populated
         and read entirely within gateway/*) self-seed in their producing
         snippet — ssl.yaml is Level 1 and must not know about Level 2+
         shared-state keys. #}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any {
        return map[string]any{
          "sslPassthroughBackends":      []any{},
          "tlsCertificates":             []any{},
          "sslRedirectHosts":            []any{},
          "clientCertVerifyHosts":       map[string]any{},
          "bindHTTPDefault":             false,
          "bindHTTPSDefault":            false,
          "needHTTPFrontend":            false,
          "needHTTPSFrontend":           false,
        }
      }) -%}
      {# Ensure fields exist (in case globalFeatures was created elsewhere without these fields) #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- if gf["sslPassthroughBackends"] == nil -%}
        {%- gf["sslPassthroughBackends"] = []any{} -%}
      {%- end -%}
      {%- if gf["tlsCertificates"] == nil -%}
        {%- gf["tlsCertificates"] = []any{} -%}
      {%- end -%}
      {%- if gf["sslRedirectHosts"] == nil -%}
        {%- gf["sslRedirectHosts"] = []any{} -%}
      {%- end -%}
      {%- if gf["clientCertVerifyHosts"] == nil -%}
        {%- gf["clientCertVerifyHosts"] = map[string]any{} -%}
      {%- end -%}
      {#- Bind-decision flags: each resource library's features-100-* phase
          OR's its contribution into these. Reading happens later in
          base.yaml's http_frontend block and ssl.yaml's https / ssl-tcp
          frontends to decide whether to emit the chart-static
          `bind *:httpPort` / `bind *:httpsPort` line and whether to
          render the surrounding frontend block at all.

          * bindHTTPDefault — emit `bind *:httpPort` in http_frontend
          * bindHTTPSDefault — emit `bind *:httpsPort` in https/ssl-tcp
          * needHTTPFrontend — render http_frontend block
          * needHTTPSFrontend — render https / ssl-tcp frontend blocks

          The bind-default flag is narrower than need-frontend: a Gateway
          HTTP listener at port 9090 (non-default) sets needHTTPFrontend
          (so http-bind-extra-* gets a frontend to attach to) but does
          NOT set bindHTTPDefault (the chart's default port stays
          unbound). For HTTPS, listeners with successfully-resolved
          certs at httpsPort set bindHTTPSDefault — listeners that fail
          cert validation (e.g. NoValidCACertificate) deliberately do
          not, so HAProxy doesn't answer handshakes for them. -#}
      {%- if gf["bindHTTPDefault"] == nil -%}
        {%- gf["bindHTTPDefault"] = false -%}
      {%- end -%}
      {%- if gf["bindHTTPSDefault"] == nil -%}
        {%- gf["bindHTTPSDefault"] = false -%}
      {%- end -%}
      {%- if gf["needHTTPFrontend"] == nil -%}
        {%- gf["needHTTPFrontend"] = false -%}
      {%- end -%}
      {%- if gf["needHTTPSFrontend"] == nil -%}
        {%- gf["needHTTPSFrontend"] = false -%}
      {%- end -%}

  features-085-ssl-hsts-global:
    template: |
      {#-
        Global HSTS (opt-in)

        Purpose: When extraContext.hstsEnabled is true, emit the
        Strict-Transport-Security header on *every* TLS response, matching
        ingress-nginx's global `hsts: true` default. Per-Ingress HSTS annotations
        still win for their hosts — the per-host response-header rule in
        frontend-filters-080-hsts runs after the global one, and set-header
        replaces, so a host-specific value overrides this default.

        Resource-agnostic: registers a single global value; it references no
        specific resource kind.

        Extension Point: features-* (priority 085 — after ssl init 050, before
        the resource TLS phase 100).

        Provides (in gf["hstsGlobalValue"]): the default Strict-Transport-Security
        value, or unset when disabled.

        extraContext knobs (safe opt-in default is OFF):
          - hstsEnabled            (bool, default false) — turn the global header on
          - hstsMaxAge             (default "31536000", one year)
          - hstsIncludeSubdomains  (bool, default false)
          - hstsPreload            (bool, default false)

        Used By: frontend-filters-080-hsts (emits the shared response-header rule
        and, when no HTTP→HTTPS redirect is configured, a warning that HSTS is
        only effective over HTTPS).
      -#}
      {%- var enabled bool = extraContext | dig("tls", "hsts", "enabled") | fallback(false) -%}
      {%- if enabled -%}
        {%- var maxAge = extraContext | dig("tls", "hsts", "maxAge") | fallback("31536000") | tostring() -%}
        {%- if regex_search(maxAge, "[[:cntrl:]]") -%}{{ fail("Invalid extraContext.hstsMaxAge '" + maxAge + "': must not contain control characters — config-injection guard.") }}{%- end -%}
        {%- var value = "max-age=" + maxAge -%}
        {%- if extraContext | dig("tls", "hsts", "includeSubdomains") | fallback(false) -%}{%- value = value + "; includeSubDomains" -%}{%- end -%}
        {%- if extraContext | dig("tls", "hsts", "preload") | fallback(false) -%}{%- value = value + "; preload" -%}{%- end -%}
        {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} }) -%}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
        {%- gf["hstsGlobalValue"] = value -%}
      {%- end -%}

  features-110-ssl-ticket-keys:
    template: |
      {%- import "util-ticket-key" for NewTicketKey -%}
      {#-
        Self-rotating TLS session-ticket keys (STEK).

        When session tickets are enabled (extraContext.tls.sessionTickets, set by
        the chart toggle tlsSessionTickets.enabled), emit a `tls-ticket-keys`
        general file with THREE 80-byte keys (base64, one per line). The
        controller pushes the identical file to every HAProxy pod, so a ticket
        sealed by one pod resumes on any other — for BOTH TLS 1.2 and 1.3.

        Rotation is self-contained, no seed secret and no controller timer: each
        key carries a YYYYMMDD marker in its (public) name bytes; bytes 8..80 are
        crypto-random. We read the CURRENT deployed file back from the render
        context (currentFiles, populated like currentConfig) and check the newest
        key's marker:
          - marker == today  → re-emit the current file UNCHANGED (deterministic,
                               so no spurious reload)
          - marker <  today  → drop the oldest key, keep the other two, append one
                               fresh key stamped today (one hitless reload; the
                               3-key window keeps yesterday's tickets resumable)
          - no current file  → seed three fresh keys
        randBytes (crypto/rand, non-deterministic) is called ONLY on the
        rotate/seed paths, so steady-state renders stay byte-identical.

        Resource-agnostic: the key file is HAPTIC's own operational material, not
        a watched routing resource.

        Extension Point: features-* (priority 110, after ssl init 050).
      -#}
      {%- if (extraContext | dig("tls", "sessionTickets")) != nil -%}
        {#- Today's YYYYMMDD marker. extraContext.tls.sessionTicketsToday pins it
            for deterministic validation tests; production uses the wall clock. -#}
        {%- var today = tostring(extraContext | dig("tls", "sessionTicketsToday") | fallback(now().UTC().Format("20060102"))) -%}
        {%- var cur = tostring(currentFiles["tls-ticket-keys"] | fallback("")) -%}
        {%- var lines = []any{} -%}
        {%- if cur != "" -%}
          {%- for _, ln := range split(trimSpace(cur), "\n") -%}
            {%- if trimSpace(tostring(ln)) != "" -%}
              {%- lines = append(lines, trimSpace(tostring(ln))) -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- var out = []any{} -%}
        {%- if len(lines) < 3 -%}
          {#- first deploy (or malformed/short file) → seed three fresh keys -#}
          {%- out = []any{NewTicketKey(today), NewTicketKey(today), NewTicketKey(today)} -%}
        {%- else -%}
          {%- var newest = tostring(lines[len(lines)-1]) -%}
          {%- var decoded = newest | b64decode() -%}
          {%- var marker = "" -%}
          {%- if len(decoded) >= 8 -%}{%- marker = decoded[:8] -%}{%- end -%}
          {%- if marker == today -%}
            {#- already rotated today → keep the current file verbatim -#}
            {%- out = lines -%}
          {%- else -%}
            {#- a day (or more) passed → slide the 3-key window forward -#}
            {%- out = []any{lines[len(lines)-2], lines[len(lines)-1], NewTicketKey(today)} -%}
          {%- end -%}
        {%- end -%}
        {%- var content = (out | toStringSlice() | join("\n")) + "\n" -%}
        {%- var _, tkErr = fileRegistry.Register("file", "tls-ticket-keys", content) -%}
        {%- if tkErr != nil -%}{{ fail("failed to register tls-ticket-keys file: " + tostring(tkErr)) }}{%- end -%}
      {%- end -%}

  features-140-ssl-passthrough-binds:
    template: |
      {#-
        SSL Passthrough Bind Decision

        Runs at priority 140 — after features-100-* (resource libraries
        register their passthrough backends via the
        `sslPassthroughBackends` shared list ssl.yaml owns) and before
        features-150-ssl-crtlist.

        sslPassthroughBackends carries an entry per listener that wants
        TLS-passthrough. frontends-500-ssl-tcp (in ssl.yaml) binds
        `*:httpsPort` and routes by SNI; we treat any passthrough backend
        as evidence we need the chart-static httpsPort bind on that
        frontend (and the corresponding loopback-fed `https` frontend on
        the unix socket). frontends-500-ssl-tcp itself gates further on
        `len(passthroughBackends) > 0`, so this lights up both flags
        consistently with that gate.

        Lives here (Level 1) rather than in gateway/haproxy-ingress/
        nginx-ingress (Level 2 / Level 3) because `sslPassthroughBackends`
        is ssl.yaml's shared state and the consumer (ssl-tcp frontend)
        is ssl.yaml's too — the bind decision belongs next to both. A
        chart with annotation-driven ssl-passthrough but no Gateway API
        previously saw `bindHTTPSDefault` stay false and the ssl-tcp
        frontend silently skipped.

        Note: TLS-Passthrough alone does NOT set `needHTTPSTermination` —
        a port that hosts only TLS listeners and no HTTPS terminating
        listeners must reject SNIs that no route claims (closes the
        upstream `TLSRouteHostnameIntersection` "should not reach
        backend", `TLSRouteInvalidBackendRefNonexistent`, and
        `TLSRouteInvalidBackendRefUnknownKind` conformance subtests
        where the test expects a TCP RST, not the 404 the chart would
        otherwise serve via the ssl-loopback fall-through).
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%%
        if len(gf["sslPassthroughBackends"].([]any)) > 0 {
          gf["bindHTTPSDefault"] = true
          gf["needHTTPSFrontend"] = true
        }
      %%}

  features-150-ssl-crtlist:
    template: |
      {%- import "util-crtlist-line" for CrtListLine -%}
      {#-
        SSL CRT-List Generation

        Purpose: Generates HAProxy crt-list file from registered TLS certificates.

        Extension Point: features-* (priority 150 - runs after certificate registration)

        Dependencies:
          - features-050-ssl-initialization
          - features-100-*-tls snippets (register certificates)

        Output:
          - certificate-list.txt crt-list file via fileRegistry.Register()

        Format: <cert-path> [ssl-options] [sni-filter ...]
        See: https://www.haproxy.com/documentation/haproxy-configuration-manual/latest/#5.1-crt-list
      -#}

      {%- var gf = shared.Get("globalFeatures") -%}
      {#- The default cert MUST be the first line of the crt-list. HAProxy
          uses the first entry as the implicit default for unmatched SNIs
          (and for clients that don't send SNI), and inherits THAT line's
          options — including `verify`. If a per-host auth-tls-secret line
          (verify required) ends up first instead, every unmatched-SNI
          handshake demands a client cert and fails with
          PEER_DID_NOT_RETURN_A_CERTIFICATE.

          Default-cert selection order:
            1. A Gateway HTTPS listener with no hostname registered as
               is_gateway_default — the spec says "no hostname = any
               hostname", which makes that listener's cert the right
               default for unmatched SNIs.
            2. The chart-level default.pem (the admin's default cert,
               loaded from values.yaml's default_ssl_cert_* secret).
          Without (1), tests like HTTPRouteHTTPSListener whose client
          trusts only the Gateway's specific cert reject the handshake
          for any unconfigured hostname (HAProxy presents default.pem,
          which is signed by a different CA).

          When multiple Gateway listeners qualify (rare; conformance
          tests one at a time), the first one in iteration order wins.
          Map iteration is non-deterministic; we lexically sort by
          (namespace, name) so the choice is reproducible across renders. -#}
      {%- var clientCertVerifyHosts = coalesce(gf["clientCertVerifyHosts"], map[string]any{}).(map[string]any) -%}
      {%- var tlsCerts []any = coalesce(gf["tlsCertificates"], []any{}) -%}

      {%- var defaultCertFilename = "default.pem" -%}
      {%- var gatewayDefaultCandidates = []any{} -%}
      {%- for _, tlsCert := range tlsCerts -%}
        {%- var tc any = tlsCert -%}
        {%- if dig(tc, "is_gateway_default") | fallback(false) -%}
          {%- gatewayDefaultCandidates = append(gatewayDefaultCandidates, tc) -%}
        {%- end -%}
      {%- end -%}
      {%- if len(gatewayDefaultCandidates) > 0 -%}
        {#- Pick deterministically: sort by ns/name. -#}
        {%- var keyMap = map[string]map[string]any{} -%}
        {%- var keys = []any{} -%}
        {%- for _, tc := range gatewayDefaultCandidates -%}
          {%- var tcm = tc.(map[string]any) -%}
          {%- var k = tostring(tcm["secret_namespace"]) + "/" + tostring(tcm["secret_name"]) -%}
          {%- keyMap[k] = tcm -%}
          {%- keys = append(keys, k) -%}
        {%- end -%}
        {%- var sortedKeys = sort_strings(keys) -%}
        {%- var winner = keyMap[tostring(sortedKeys[0])] -%}
        {%- defaultCertFilename = tostring(winner["sanitized_filename"] | fallback(tostring(winner["secret_namespace"]) + "_" + tostring(winner["secret_name"]) + ".pem")) -%}
      {%- end -%}
      {#- The default cert line covers TLS handshakes whose SNI doesn't
          match any specific SNI line below. If a Gateway listener with
          no hostname registered client-cert validation, that intent
          lands in clientCertVerifyHosts["*"] (gateway.yaml's mTLS pass
          uses "*" as the wildcard-SNI key). Apply that config to the
          default line so port-N TLS handshakes whose SNI doesn't match
          any per-listener hostname still get the right CA + verify
          mode — closes the conformance gap where port 443 (no
          listener hostname, default frontend validation) was answering
          handshakes without client-cert verification. -#}
      {%- var defaultCfg = clientCertVerifyHosts["*"] -%}
      {%- var crtlistLines = []any{CrtListLine(defaultCertFilename, defaultCfg, "")} -%}

      {# Generate entries for each registered TLS certificate.
         Per-host client-cert verification (driven by the ingress
         libraries' auth-tls-secret machinery) means the SNIs covered
         by a single cert may need different per-line ssl-options
         in the crt-list. We therefore group each cert's SNIs by
         their (ca_path, verify_mode) tuple and emit one crt-list
         line per group — the same cert can appear multiple times
         in a crt-list with different options, which is supported. #}
      {%- for _, tlsCert := range tlsCerts -%}
        {%- var tc any = tlsCert -%}
        {# Use sanitized_filename from the registration (set by ingress.yaml/gateway.yaml) #}
        {# This ensures the crt-list references the actual filename on disk after HAProxy sanitization #}
        {%- var certFilename = tc | dig("sanitized_filename") | fallback(tostring(tc | dig("secret_namespace")) + "_" + tostring(tc | dig("secret_name")) + ".pem") -%}
        {%- var snis []any = coalesce(tc | dig("sni_patterns"), []any{}).([]any) -%}

        {# Group SNIs by client-cert verify config. Empty key = no verify. #}
        {%- var snisByConfig = map[string][]any{} -%}
        {%- var configForKey = map[string]any{} -%}
        {%- for _, sni := range snis -%}
          {%- var cfgRaw = clientCertVerifyHosts[tostring(sni)] -%}
          {%- var key = "" -%}
          {%- if cfgRaw != nil -%}
            {%- var cfg = cfgRaw.(map[string]any) -%}
            {%- key = tostring(cfg["ca_path"]) + ":" + tostring(cfg["verify_mode"]) -%}
            {%- configForKey[key] = cfg -%}
          {%- end -%}
          {%- if snisByConfig[key] == nil -%}
            {%- snisByConfig[key] = []any{} -%}
          {%- end -%}
          {%- snisByConfig[key] = append(snisByConfig[key], sni) -%}
        {%- end -%}

        {# Emit one crt-list line per (config) group. Sort by key for
           deterministic output — Scriggo map iteration order is not
           guaranteed stable across renders, and a reordered crt-list
           triggers a HAProxy reload even when the underlying inputs
           are identical. #}
        {%- var keyList = []any{} -%}
        {%- for k := range snisByConfig -%}
          {%- keyList = append(keyList, k) -%}
        {%- end -%}
        {%- var sortedKeys = sort_strings(keyList) -%}
        {%- for _, key := range sortedKeys -%}
          {%- var groupSnis = snisByConfig[key] -%}
          {%- var cfg any = nil -%}
          {%- if key != "" -%}
            {%- cfg = configForKey[key] -%}
          {%- end -%}
          {%- var sniList = groupSnis | toStringSlice() | join(" ") -%}
          {%- var line = CrtListLine(tostring(certFilename), cfg, sniList) -%}
          {%- crtlistLines = append(crtlistLines, line) -%}
        {%- end -%}
      {%- end -%}

      {# Register the crt-list file with file_registry #}
      {# Add trailing newline to satisfy HAProxy's parser #}
      {%- var crtlistContent = (crtlistLines | toStringSlice() | join("\n")) + "\n" -%}
      {%- var _, crtListErr = fileRegistry.Register("crt-list", "certificate-list.txt", crtlistContent) -%}
      {%- if crtListErr != nil -%}{{ fail("failed to register crt-list: " + tostring(crtListErr)) }}{%- end -%}

  features-160-ssl-redirect-map:
    template: |
      {#-
        SSL Redirect Map Generation

        Purpose: Generates HAProxy map files for SSL redirect host lookups.

        Extension Point: features-* (priority 160 - runs after certificate registration)

        Dependencies:
          - features-050-ssl-initialization
          - features-100-*-ssl-redirect snippets (register redirect hosts)

        Output:
          - ssl-redirect-<code>.map files via fileRegistry.Register()
          - One map file per distinct redirect code (e.g., ssl-redirect-302.map)

        Map Format: <host> 1 (value is a presence marker for -m found)
      -#}

      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}

      {#-
        Group hosts by redirect code. Deduplicate per code via a presence set
        rather than the cross-render `first_seen` cache: under high resource
        churn the cache occasionally leaked between renders inside a single
        deployment cycle, leading to features-160 emitting an empty map while
        frontend-filters-050-ssl-redirect (which has no first_seen check) still
        emitted the redirect rule referencing the same map. The two snippets
        must register and reference maps in lockstep, so this deduplication
        stays local to this snippet and matches the rule emitter exactly: any
        host present in `redirectHosts` results in a map entry for its code.
      -#}
      {%- var hostsByCode = map[string][]any{} -%}
      {%- var seenByCode = map[string]map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- var e any = entry -%}
        {%- var code = tostring(e | dig("code")) -%}
        {%- var host = tostring(e | dig("host")) -%}
        {%- if seenByCode[code] == nil -%}
          {%- seenByCode[code] = map[string]bool{} -%}
          {%- hostsByCode[code] = []any{} -%}
        {%- end -%}
        {%- if !seenByCode[code][host] -%}
          {%- seenByCode[code][host] = true -%}
          {%- hostsByCode[code] = append(hostsByCode[code], host) -%}
        {%- end -%}
      {%- end -%}

      {# Generate one map file per redirect code #}
      {%- for code, hosts := range hostsByCode -%}
        {%- var lines = []any{} -%}
        {%- for _, host := range hosts -%}
          {%- lines = append(lines, tostring(host) + " 1") -%}
        {%- end -%}
        {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" -%}
        {%- var mapFilename = "ssl-redirect-" + code + ".map" -%}
        {%- var _, mapErr = fileRegistry.Register("map", mapFilename, mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register ssl redirect map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  frontend-filters-050-ssl-redirect:
    template: |
      {#-
        SSL Redirect Rules

        Purpose: Emits HAProxy redirect rules using map-based host lookups.

        Extension Point: frontend-filters-* (priority 050 - runs early)

        Dependencies:
          - features-160-ssl-redirect-map (generates map files)

        Output:
          - One http-request redirect rule per distinct redirect code
      -#}

      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}

      {# Determine distinct redirect codes from registered hosts #}
      {%- var codes = map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- var e any = entry -%}
        {%- codes[tostring(e | dig("code"))] = true -%}
      {%- end -%}

      {# Emit one redirect rule per code #}
      {%- for code := range codes %}
      # ssl/frontend-filters-ssl-redirect (code {{ code }})
      http-request redirect scheme https code {{ code }} if !{ ssl_fc } { var(txn.host),map_str({{ pathResolver.GetPath("ssl-redirect-" + code + ".map", "map") }}) -m found }
      {%- end %}

  # Global OCSP configuration - enables automatic OCSP stapling for all SSL certificates
  frontends-500-ssl-tcp:
    template: |
      {#-
        SSL Passthrough TCP Frontend

        Purpose: TCP frontend for SNI-based SSL passthrough routing.

        Extension Point: frontends-* (priority 500)

        Conditional: Only generated when sslPassthroughBackends is non-empty.

        Architecture:
          - Extracts SNI from TLS ClientHello
          - Routes to passthrough backends based on SNI match
          - Falls back to ssl-loopback backend for SSL termination

        Dependencies:
          - features-050-ssl-initialization
          - features-100-*-ssl-passthrough snippets
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var gfMap = gf.(map[string]any) -%}
      {%- var passthroughBackends []any = gfMap["sslPassthroughBackends"] -%}
      {%- var bindHTTPSDefault = tostring(gfMap | dig("bindHTTPSDefault")) == "true" -%}
      {%- if len(passthroughBackends) > 0 && bindHTTPSDefault -%}
      {# TCP frontend extracts SNI and routes to passthrough backends or loopback #}
      # ssl/frontends-ssl-tcp

      frontend ssl-tcp
          guid fe:ssl-tcp
          mode tcp
          option tcplog
          bind *:{{ extraContext | dig("httpsPort") | fallback(8443) }}

          # Extract SNI for routing decisions (wait up to 5s for client hello)
          tcp-request inspect-delay 5s

          {#- Reject contract for TLS-Passthrough listeners.

              Per Gateway-API spec, a TLS-Passthrough listener with
              hostname H claims SNIs matching H. A TLSRoute attached
              to that listener narrows further (route hostnames ∩
              listener hostname). For a connection whose SNI
                * matches a TLSRoute's effective SNI → routed to its
                  backend (the use_backend block below)
                * matches the listener's hostname pattern but NO
                  TLSRoute's effective SNI → MUST be rejected (no
                  route claims it; Gateway-API "should not reach
                  backend" contract)
                * matches NO listener pattern → falls through (an
                  HTTPS-terminating listener may legitimately accept
                  it; the chart cannot tell from req_ssl_sni alone
                  whether a different mechanism wants the SNI)

              This produces two ACLs:
                * `route_sni`     — req_ssl_sni in the use_backend
                                    allowlist (per-route effective SNI)
                * `listener_sni`  — req_ssl_sni in any TLS-Passthrough
                                    listener's hostname pattern

              Reject when listener_sni && !route_sni. The reject must
              precede `tcp-request content accept` because accept
              terminates the tcp-request content phase, so a later
              reject would never fire.

              Closes the upstream `TLSRouteHostnameIntersection`
              "should not reach backend" subtests, plus
              `TLSRouteInvalidBackendRefNonexistent` /
              `TLSRouteInvalidBackendRefUnknownKind` (an unresolvable-
              backend route is filtered at Pass 2's ResolvedRefs gate
              so the route's effective SNI never enters route_sni; the
              listener_hostname stays in listener_sni so its claimed
              SNIs hit the reject path). -#}
          {#- Per-Gateway routing isolation. The chart shares one bind
              across every TLSRoute attached to port httpsPort, but the
              Gateway-API spec requires per-Gateway listener-claim
              semantics: a Gateway whose listener pattern matches the
              inbound SNI must reject the connection if no route under
              THAT Gateway claims it, even if a sibling Gateway on the
              same port has routes that would accept the SNI under a
              wider pattern. Without this isolation, the upstream
              `TLSRouteHostnameIntersection` "should not reach backend"
              sub-tests fail when 4 Gateways with different listener-
              hostname patterns share port 443 (route SNI patterns
              from one Gateway would pass through another Gateway's
              listener filter).

              Bucket entries by (gw_namespace, gw_name) and emit per-
              Gateway listener_sni / route_sni / invalid_sni ACL +
              reject rules. Each Gateway X gets a sanitized ACL prefix
              `gw_<ns>_<name>` (dashes/dots/colons → underscores) and a
              reject rule of the form
                tcp-request content reject if <gwX>_listener_sni !<gwX>_route_sni
              for non-empty listeners, OR
                tcp-request content reject if !<gwX>_route_sni
              for empty (catch-all) listeners. Entries flagged invalid
              get their own per-Gateway invalid_sni ACL + unconditional
              reject (so the route's claimed SNI gets a TCP RST instead
              of a use_backend pointing at a non-existent Service).

              Ingress-level passthroughBackends (Pass 1, no Gateway
              identity) are NOT subject to the reject — they keep
              their existing fall-through behaviour. -#}
          {%%
            var byGateway = map[string]any{}
            var gwOrder = []any{}
            var hasIngressEntry = false
            var validPassthroughCount = 0
            for _, backend := range passthroughBackends {
              var b = backend.(map[string]any)
              var bMode = tostring(b["mode"] | fallback("Passthrough"))
              if bMode != "Passthrough" {
                continue
              }
              var gwNs = tostring(b | dig("gw_namespace") | fallback(""))
              var gwName = tostring(b | dig("gw_name") | fallback(""))
              if gwName == "" {
                hasIngressEntry = true
                continue
              }
              var gwKey = gwNs + ":" + gwName
              var gi map[string]any
              if existing, ok := byGateway[gwKey]; ok {
                gi = existing.(map[string]any)
              } else {
                gi = map[string]any{
                  "ns":               gwNs,
                  "name":             gwName,
                  "listenerPatterns": map[string]bool{},
                  "hasEmptyListener": false,
                  "routeSNIs":        map[string]bool{},
                  "invalidSNIs":      map[string]bool{},
                }
                byGateway[gwKey] = gi
                gwOrder = append(gwOrder, gwKey)
              }
              var lh = tostring(b | dig("listener_hostname") | fallback(""))
              if lh == "" {
                gi["hasEmptyListener"] = true
              } else {
                gi["listenerPatterns"].(map[string]bool)[lh] = true
              }
              var bInvalid = tostring(b | dig("invalid") | fallback("false")) == "true"
              var sni = tostring(b["sni"])
              if bInvalid {
                gi["invalidSNIs"].(map[string]bool)[sni] = true
              } else {
                gi["routeSNIs"].(map[string]bool)[sni] = true
                validPassthroughCount = validPassthroughCount + 1
              }
            }
            // Stable per-Gateway emission order: sort by gwKey.
            var gwOrderSorted = sort_strings(gwOrder)
          %%}
          {%- for _, gwKey := range gwOrderSorted %}
            {%- var gi = byGateway[tostring(gwKey)].(map[string]any) %}
            {%- var aclSan = "gw_" + replace(replace(replace(replace(tostring(gi["ns"]) + "_" + tostring(gi["name"]), "-", "_"), ".", "_"), ":", "_"), "/", "_") %}
            {%- var listenerPatterns = gi["listenerPatterns"].(map[string]bool) %}
            {%- var hasEmptyListener = gi["hasEmptyListener"].(bool) %}
            {%- var routeSNIs = gi["routeSNIs"].(map[string]bool) %}
            {%- var invalidSNIs = gi["invalidSNIs"].(map[string]bool) %}
            {#- Collect sorted lists for deterministic output. -#}
            {%%
              var lpRaw = []any{}
              for k := range listenerPatterns {
                lpRaw = append(lpRaw, k)
              }
              var lpKeys = sort_strings(lpRaw)
              var rsRaw = []any{}
              for k := range routeSNIs {
                rsRaw = append(rsRaw, k)
              }
              var rsKeys = sort_strings(rsRaw)
              var invRaw = []any{}
              for k := range invalidSNIs {
                invRaw = append(invRaw, k)
              }
              var invKeys = sort_strings(invRaw)
            %%}
            {%- for _, lpAny := range lpKeys %}
              {%- var lp = tostring(lpAny) %}
              {%- if hasPrefix(lp, "*.") %}
          acl {{ aclSan }}_listener_sni req_ssl_sni -m end {{ lp[1:] }}
              {%- else %}
          acl {{ aclSan }}_listener_sni req_ssl_sni -m str {{ lp }}
              {%- end %}
            {%- end %}
            {%- for _, sniAny := range rsKeys %}
              {%- var sni = tostring(sniAny) %}
              {%- if hasPrefix(sni, "*.") %}
          acl {{ aclSan }}_route_sni req_ssl_sni -m end {{ sni[1:] }}
              {%- else %}
          acl {{ aclSan }}_route_sni req_ssl_sni -m str {{ sni }}
              {%- end %}
            {%- end %}
            {%- for _, sniAny := range invKeys %}
              {%- var sni = tostring(sniAny) %}
              {%- if hasPrefix(sni, "*.") %}
          acl {{ aclSan }}_invalid_sni req_ssl_sni -m end {{ sni[1:] }}
              {%- else %}
          acl {{ aclSan }}_invalid_sni req_ssl_sni -m str {{ sni }}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- for _, gwKey := range gwOrder %}
            {%- var gi = byGateway[tostring(gwKey)].(map[string]any) %}
            {%- var aclSan = "gw_" + replace(replace(replace(replace(tostring(gi["ns"]) + "_" + tostring(gi["name"]), "-", "_"), ".", "_"), ":", "_"), "/", "_") %}
            {%- var listenerPatterns = gi["listenerPatterns"].(map[string]bool) %}
            {%- var hasEmptyListener = gi["hasEmptyListener"].(bool) %}
            {%- var routeSNIs = gi["routeSNIs"].(map[string]bool) %}
            {%- var invalidSNIs = gi["invalidSNIs"].(map[string]bool) %}
            {%- if hasEmptyListener %}
              {#- Empty listener: claims every SNI. Reject any SNI not
                  claimed by a valid route under THIS Gateway. When all
                  routes are invalid, route_sni ACL is undefined, so we
                  reject the per-route invalid_sni patterns explicitly
                  (still scoped to this Gateway's claimed SNIs — other
                  SNIs aren't this Gateway's concern). -#}
              {%- if len(routeSNIs) > 0 %}
          tcp-request content reject if !{{ aclSan }}_route_sni
              {%- else if len(invalidSNIs) > 0 %}
          tcp-request content reject if {{ aclSan }}_invalid_sni
              {%- end %}
            {%- else %}
              {#- Non-empty listener: reject if listener pattern matches
                  but no route under this Gateway claims the SNI. -#}
              {%- if len(routeSNIs) > 0 %}
          tcp-request content reject if {{ aclSan }}_listener_sni !{{ aclSan }}_route_sni
              {%- else if len(listenerPatterns) > 0 %}
          tcp-request content reject if {{ aclSan }}_listener_sni
              {%- end %}
            {%- end %}
          {%- end %}
          tcp-request content accept if { req_ssl_hello_type 1 }

          # Route to passthrough backends by SNI: wildcard *.host → `-m end .host` (single-label
          # subdomain only, not bare host), exact → `-m str`. See
          # https://haproxy-haptic.org/docs/latest/libraries/ssl/#ssl-passthrough
          {# Filter to Passthrough-mode entries only — the
             gateway-ssl-passthrough builder now also emits Terminate
             entries (consumed by frontends-600-gateway-tls-listener for
             the per-port mode-tcp frontends with TLS termination).
             Ingress entries don't carry `mode`, so an empty/missing
             value defaults to Passthrough behaviour for back-compat.
             Also skip entries flagged `invalid` — their backend block
             was suppressed (Pass 2 ResolvedRefs gate failure), so
             routing the SNI here would point at a non-existent
             backend. The reject ACLs above already cover them. #}
          {% for _, backend := range passthroughBackends -%}
          {%- var b any = backend %}
          {%- var bMode = tostring(b | dig("mode") | fallback("Passthrough")) %}
          {%- var bInvalid = tostring(b | dig("invalid") | fallback("false")) == "true" %}
          {%- if bMode == "Passthrough" && !bInvalid %}
          {%- var sni = tostring(b | dig("sni")) %}
          {%- if hasPrefix(sni, "*.") %}
          use_backend {{ b | dig("name") }} if { req_ssl_sni -m end {{ sni[1:] }} }
          {%- else %}
          use_backend {{ b | dig("name") }} if { req_ssl_sni -m str {{ sni }} }
          {%- end %}
          {%- end %}
          {%- end %}

          {%- var needHTTPSTermination = tostring(gfMap | dig("needHTTPSTermination")) == "true" %}
          {%- if needHTTPSTermination %}
          # Unmatched SNIs fall through to ssl-loopback (the chart's HTTPS-frontend bridge) for
          # cert-based TLS termination — HTTPS Gateway listeners / Ingress spec.tls.
          default_backend ssl-loopback
          {%- end %}

      {% end -%}

  backends-500-ssl-loopback:
    template: |
      {#-
        SSL Loopback Backend

        Purpose: Bridges TCP frontend to HTTPS frontend via Unix socket.

        Extension Point: backends-* (priority 500)

        Conditional: Only generated when sslPassthroughBackends is non-empty.

        Architecture:
          - TCP mode backend
          - Forwards to unix@/etc/haproxy/ssl-frontend.sock with PROXY protocol
          - Enables HTTPS frontend to receive connections from TCP frontend
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var passthroughBackends []any = gf["sslPassthroughBackends"] -%}
      {%- if len(passthroughBackends) > 0 -%}
      # ssl/backends-ssl-loopback

      backend ssl-loopback
          guid be:ssl-loopback
          mode tcp
          server loopback unix@/etc/haproxy/ssl-frontend.sock send-proxy-v2

      {%- end -%}

  frontends-500-https:
    template: |
      {#-
        HTTPS Frontend with SSL Termination

        Purpose: HTTPS frontend that terminates SSL and routes to backends.

        Extension Point: frontends-* (priority 500)

        Binding Modes:
          - With SSL passthrough: Binds to Unix socket (receives from ssl-loopback)
          - Without SSL passthrough: Binds directly to HTTPS port

        Dependencies:
          - util-ssl-bind-options (SSL bind configuration)
          - frontend-routing-logic (from base.yaml)
          - features-150-ssl-crtlist (certificate list)
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var gfMap = gf.(map[string]any) -%}
      {%- var passthroughBackends []any = gfMap["sslPassthroughBackends"] -%}
      {%- var needHTTPSFrontend = tostring(gfMap | dig("needHTTPSFrontend")) == "true" -%}
      {%- var bindHTTPSDefault = tostring(gfMap | dig("bindHTTPSDefault")) == "true" -%}
      {#- The https frontend renders only when at least one resource
          actually wants TLS termination — Ingress with spec.tls,
          Gateway/ListenerSet HTTPS or TLS listener (any port), or
          SSL passthrough backends (which need a unix-socket
          loopback target). Without it we'd emit an HAProxy frontend
          with no binds (validation error) any time the chart is
          installed without a TLS-terminating resource.

          The chart-static `bind *:httpsPort` itself is gated by
          bindHTTPSDefault, which is set ONLY when at least one
          listener with a successfully-resolved cert (or any
          passthrough backend) wants traffic on that port. A
          listener with NoValidCACertificate at port 443 leaves
          bindHTTPSDefault=false, so HAProxy doesn't answer
          handshakes for it — closes the conformance bug
          GatewayFrontendInvalidDefaultClientCertificateValidation
          relies on. -#}
      {%- if needHTTPSFrontend -%}
      # ssl/frontends-https

      frontend https
          guid fe:https
          mode http
          option forwardfor
      {%- if len(passthroughBackends) > 0 && bindHTTPSDefault %}
          bind unix@/etc/haproxy/ssl-frontend.sock mode 660{{ render "util-ssl-bind-options" }} accept-proxy
      {%- else if bindHTTPSDefault %}
          bind *:{{ extraContext | dig("httpsPort") | fallback(8443) }}{{ render "util-ssl-bind-options" }}
      {%- end %}
          {# Extension point for additional HTTPS bind directives (Gateway HTTPS listener ports, etc.). #}
          {# Sibling to http-bind-extra-* in base.yaml; resource libraries emit one bind per #}
          {# non-default Gateway HTTPS listener port using the same SSL options as the chart-static bind. #}
          {{- render_glob "https-bind-extra-*" | indent(2, true) }}

          {# Extension point for early frontend directives (options, captures, ACLs) #}
          {# Runs BEFORE routing logic; use frontend-filters-* for post-routing manipulation #}
          {{- render_glob "frontend-extra-*" | indent(2, true) }}

          {# Reuse frontend routing logic from base.yaml #}
          {{ render "frontend-routing-logic" | indent(2, true) }}

          {# Extension point for frontend request/response filters #}
          {# Runs AFTER routing decisions, BEFORE backend selection #}
          {{- render_glob "frontend-filters-*" | indent(2, true) }}

          # Use backend from txn.backend_name (set by qualifier logic)
          use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }

          # Default backend
          default_backend default_backend
      {%- end -%}

# SSL certificate files
#
# NOTE: Dynamic TLS certificate file generation
# ============================================
# TLS certificates are automatically generated using file_registry.Register() by resource
# libraries (ingress.yaml, gateway.yaml) when processing Ingress spec.tls and Gateway TLS
# configurations. No pre-declaration is needed - any TLS Secret referenced in these resources
# will be automatically converted to a certificate file.
#
# The crt-list file below references these certificates using the naming pattern:
#   {namespace}_{secretname}.pem
#
# Only the default certificate (fallback for SNI mismatch) needs to be defined here.
# All other certificates are registered dynamically at template rendering time.

sslCertificates:
  # Default SSL certificate (fallback for SNI mismatch)
  default.pem:
    template: |
      {# Default SSL certificate for HTTPS frontend #}
      {# Loads certificate from TLS Secret (configurable via values.yaml) #}
      {# Secret name and namespace come from templatingSettings.extraContext #}
      {%- var certNamespace = extraContext | dig("tls", "defaultCertificate", "namespace") | fallback("haptic") -%}
      {%- var certName = extraContext | dig("tls", "defaultCertificate", "name") | fallback("default-ssl-cert") -%}
      {%- var secret = resources.secrets.GetSingle(certNamespace, certName) -%}
      {%- if secret == nil -%}
      {{ fail("TLS Secret not found: " + certNamespace + "/" + certName + ". Ensure the Secret exists and is watched.") }}
      {%- end -%}
      {%- var crtB64, hasCrt = secret.Data["tls.crt"] -%}
      {%- var keyB64, hasKey = secret.Data["tls.key"] -%}
      {%- if !hasCrt || !hasKey -%}
      {{ fail("Invalid TLS Secret " + certNamespace + "/" + certName + ": missing tls.crt or tls.key fields. Ensure the Secret is of type kubernetes.io/tls.") }}
      {%- end -%}
      {{- b64decode(crtB64) -}}
      {{- b64decode(keyB64) -}}

# Validation tests for SSL functionality
validationTests:
  _global:
    description: Global SSL test fixtures
    fixtures:
      secrets:
        # Default SSL certificate, required by every test that renders a full
        # config (the default.pem template loads it). Its namespace MUST match
        # default.pem's lookup — extraContext.default_ssl_cert_namespace, which
        # the chart sets to the release namespace. Library YAML isn't Helm-tpl'd,
        # so templates/haproxytemplateconfig.yaml rewrites this namespace to that
        # same value (keeping the fixture and the lookup in lock-step regardless
        # of release namespace). The "haptic" placeholder is default.pem's own
        # fallback, used when the default certificate is disabled (no rewrite).
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: default-ssl-cert
            namespace: haptic
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        # Shared TLS cert for per-test TLS fixtures in the `default` namespace,
        # merged into every test via _global. A test whose spec.tls /
        # certificateRefs points at Secret `shared-tls` (namespace default) need
        # NOT inline its own copy of the cert — this deduplicates the identical
        # cert/key that was otherwise copy-pasted across the suite.
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: shared-tls
            namespace: default
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key

  test-ssl-certificate-loading:
    description: Verify default SSL certificate is loaded correctly
    fixtures: {}  # Uses _global fixtures
    assertions:
      - type: haproxy_valid

  test-ssl-https-frontend-basic:
    description: Verify HTTPS frontend is generated with correct bind options
    fixtures:
      # Trigger the chart's HTTPS frontend by declaring an Ingress with
      # spec.tls. After the bind-derivation refactor (chart-static
      # frontends are gated on listener state), an empty fixture would
      # leave the chart with nothing terminating SSL — and therefore no
      # `frontend https` rendered.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "frontend https"

      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^\s+mode http$.*?^\s+option forwardfor$'

      - type: contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"

      - type: contains
        target: haproxy.cfg
        pattern: "alpn h2,http/1.1"

  test-ssl-hsts-global-enabled:
    description: extraContext.tls.hsts.enabled emits a global Strict-Transport-Security header on TLS responses, plus a no-redirect warning
    extraContext:
      tls:
        hsts:
          enabled: true
          includeSubdomains: true
          preload: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" if \{ ssl_fc \}'
      # No ssl-redirect annotation → the effectiveness warning is emitted.
      - type: contains
        target: haproxy.cfg
        pattern: "HSTS is enabled globally but no HTTP"

  test-ssl-hsts-global-disabled:
    description: Without extraContext.tls.hsts.enabled, no global HSTS header is emitted (default off)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "Strict-Transport-Security"

  test-ssl-crtlist-basic:
    description: Verify crt-list file is generated with OCSP configuration
    fixtures:
      # Trigger the chart's HTTPS frontend (and its `ssl crt-list ...`
      # bind option) — see comment on test-ssl-https-frontend-basic for
      # why the bind-derivation refactor needs an explicit trigger here.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "ssl crt-list .*/certificate-list\\.txt"

      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "default\\.pem \\[ocsp-update on\\]"

      - type: not_contains
        target: crt-list:certificate-list.txt
        pattern: "^\\s*$"

  test-ssl-certificate-dots-in-name:
    description: SSL certificate with dots in secret name must use sanitized filename
    fixtures:
      secrets:
        # Default SSL certificate (required by HTTPS frontend)
        # Uses haproxy-haptic namespace (Helm default release namespace)
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: default-ssl-cert
            namespace: haproxy-haptic
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        # TLS secret with dots in the name - this is valid in Kubernetes
        # (secret names allow alphanumeric, '-', and '.')
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: api.example.com-tls
            namespace: default
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: api-ingress
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: api.example.com-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: api-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "default_api_example_com-tls\\.pem"

  test-ssl-certificate-custom-namespace:
    description: Default SSL certificate from a custom namespace (e.g. cert-manager) loads correctly
    extraContext:
      tls:
        defaultCertificate:
          namespace: cert-manager
          name: cluster-cert
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: cluster-cert
            namespace: cert-manager
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
    assertions:
      - type: haproxy_valid

  test-ssl-global-cipher-policy-default:
    description: Global TLS policy renders ssl-default-bind-ciphers / -ciphersuites and ssl-min-ver from the extraContext.tls defaults (a forward-secret superset spanning ECDSA, RSA, and DHE families)
    fixtures: {}  # Uses _global default cert; global section renders unconditionally
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:.*ECDHE-RSA-AES128-GCM-SHA256.*DHE-RSA-AES256-SHA'
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256'
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-options ssl-min-ver TLSv1\.2'

  test-ssl-global-cipher-policy-override:
    description: extraContext.tls overrides render (custom ciphers, lowered minVersion) and an empty value omits its directive (falls back to HAProxy's built-in default). In real charts a values.yaml override of one sub-key is Helm deep-merged with the library defaults (config template, not exercised by this harness)
    extraContext:
      tls:
        ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
        ciphersuites: ""
        minVersion: "TLSv1.0"
    fixtures: {}
    assertions:
      - type: haproxy_valid
      # custom cipher list override renders
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256'
      # lowered protocol floor renders
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-options ssl-min-ver TLSv1\.0'
      # empty ciphersuites omits the directive entirely (HAProxy default)
      - type: not_contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphersuites'

  test-ssl-global-cipher-policy-injection-guard:
    description: A cipher value containing characters outside the cipher/version charset (here a newline) is rejected by the config-injection guard
    extraContext:
      tls:
        ciphers: "ECDHE-RSA-AES128-GCM-SHA256\n  evil-injected-directive"
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "config-injection guard"

  test-ssl-dual-cert-rsa-ecdsa:
    description: An Ingress may reference two TLS Secrets (one ECDSA, one RSA) for the same host; both certs are emitted to the crt-list under the same SNI so HAProxy serves RSA or ECDSA per client capability
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: dual-ecdsa
            namespace: default
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: dual-rsa
            namespace: default
          data:
            tls.crt: *test_tls_crt_rsa
            tls.key: *test_tls_key_rsa
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: dual-svc
            namespace: default
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: dual-cert-ingress
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["dual.example.com"]
                secretName: dual-ecdsa
              - hosts: ["dual.example.com"]
                secretName: dual-rsa
            rules:
              - host: dual.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: dual-svc
                          port:
                            number: 80
    assertions:
      # HAProxy accepts two certs of different key types on the same SNI
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_dual-ecdsa\.pem \[ocsp-update on\] dual\.example\.com'
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_dual-rsa\.pem \[ocsp-update on\] dual\.example\.com'

  test-ssl-session-tickets-seed:
    description: Session tickets enabled with no current file → three fresh STEK keys seeded (stamped today) and every HTTPS bind carries tls-ticket-keys; haproxy -c accepts them
    extraContext:
      tls:
        sessionTickets:
          enabled: true
        sessionTicketsToday: "20260721"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:443 ssl crt-list \S+ alpn h2,http/1\.1 tls-ticket-keys \S*general/tls-ticket-keys'
      # three keys, each stamped with today's marker (base64 prefix of "20260721")
      - type: match_count
        target: file:tls-ticket-keys
        pattern: 'MjAyNjA3Mj'
        expected: "3"

  test-ssl-session-tickets-stable-same-day:
    description: When the newest current key already carries today's marker, the file is re-emitted unchanged — deterministic, so no spurious reload
    extraContext:
      tls:
        sessionTickets:
          enabled: true
        sessionTicketsToday: "20260721"
    currentFiles:
      tls-ticket-keys: |
        MjAyNjA3MjF1lg4Ku7QD/4vBgigOpTeyXBWr7YEbfGGtOvJy4F2jN7yqkvzCXyeKIzSddp+/e40yxVVDQG/6K0qKBzhxUY0QUm9ZC10HVVw=
        MjAyNjA3MjErsIpmS9wItsqQf9wXky/nqJRWDAhc+gzY//LjL4rfJebcDremmtxy07HV6au8uZ5H7uYKgJ8yuUuaIGfnxoV3Kd+7FHNukBs=
        MjAyNjA3MjGrtAkIIsCl/WPGwjgU0w8y6d8ue6eLGA8sKbY+KG3lzHj/1+5f9wRXhqwE691rSVoO5nixjtvP31seO7YnZiZ8inZ34TqSw9o=
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      # unchanged: re-rendering yields byte-identical output (no rotation, no reload)
      - type: deterministic
      # the exact newest key is preserved verbatim
      - type: contains
        target: file:tls-ticket-keys
        pattern: 'MjAyNjA3MjGrtAkIIsCl'
      # still exactly the three today-stamped keys (none dropped or added)
      - type: match_count
        target: file:tls-ticket-keys
        pattern: 'MjAyNjA3Mj'
        expected: "3"

  test-ssl-session-tickets-rotate:
    description: When the newest current key's marker is older than today, the 3-key window slides — drop the oldest, keep two, append one fresh key stamped today
    extraContext:
      tls:
        sessionTickets:
          enabled: true
        sessionTicketsToday: "20260721"
    currentFiles:
      tls-ticket-keys: |
        MjAyMDAxMDEBk+LdT3waWq9/eMXZ/OrL72ywGnk5iFvamSsGg9ROVL23GJJfFM0wesQcVpiLgm1+3Q10nN7UPo8TKVWQi+CH05wl5v1Snu8=
        MjAyMDAxMDE6V2yKRZF80TBhAzp/xBDTh+WvO3rDEAbCuD/4slIZeNSXJxS+YxUls4akNIRICp1poNnNbVgWgxiJC6m/cnISHta0dwkjGQY=
        MjAyMDAxMDEULATG7B3W7hY19QQOMzEr1a0GmjWsfRWtyCvWhGvE4eJL0aqagzZsRgtxWrKhgouiouA9LOSFu9x7/pG8CUn+qvCyJ4tPdu0=
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      # oldest key (line 1) dropped
      - type: not_contains
        target: file:tls-ticket-keys
        pattern: 'MjAyMDAxMDEBk'
      # two older keys carried over (lines 2 and 3)
      - type: contains
        target: file:tls-ticket-keys
        pattern: 'MjAyMDAxMDE6V2yKRZF8'
      - type: contains
        target: file:tls-ticket-keys
        pattern: 'MjAyMDAxMDEULATG7B3W'
      # exactly two old-marked keys remain
      - type: match_count
        target: file:tls-ticket-keys
        pattern: 'MjAyMDAxMDE'
        expected: "2"
      # one fresh key stamped today was appended
      - type: match_count
        target: file:tls-ticket-keys
        pattern: 'MjAyNjA3Mj'
        expected: "1"
