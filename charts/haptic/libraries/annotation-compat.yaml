# Annotation Compatibility Scaffold Library
#
# Provides shared HAProxy output macros and utility snippets consumed by the
# vendor-specific annotation libraries (haproxytech.yaml, haproxy-ingress.yaml,
# nginx-ingress.yaml). Sits at hierarchy level 2.5 — loaded after the resource
# libraries (ingress, gateway) and before the protocol libraries.
#
# This library does NOT process resources directly. It contains only stateless
# macros and parameterized utility snippets. Each protocol library extracts
# annotations from its own resource set and calls into the scaffold to emit
# HAProxy directives.
#
# Rationale and design: see docs/adr/0003-annotation-compat-scaffold-level-2-5.md
#
# Knowledge hierarchy:
#   Level 0:   base
#   Level 1:   ssl
#   Level 2:   ingress, gateway
#   Level 2.5: annotation-compat   <- this library
#   Level 3:   haproxytech, haproxy-ingress, nginx-ingress

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.annotationCompat.enabled }}'

templateSnippets:

  # SSL Passthrough — shared macro. Each protocol library calls into this
  # to feed its own ComputeIfAbsent cache slot; the build logic is shared,
  # the cache slot is per-library.

  util-build-annotation-ssl-passthrough:
    template: |
      {#-
        Macro: BuildAnnotationSSLPassthrough(sslData, annotationKey, namePrefix, firstSeenKey)

        Populates sslData["backends"] with one entry per (host, ingress) pair
        where the ingress carries a truthy annotationKey value AND has a
        well-formed first path with a service backend. Deduplicates hosts via
        first_seen(firstSeenKey, host).

        Service info (svcName/svcPort/svcPortName) is captured here at scan
        time rather than re-fetched by the consumer's `backends-*-
        ssl-passthrough` snippet. A second GetSingle() lookup in the consumer
        could disagree with the use_backend pass under concurrent ingress
        deletion — same iteration of resources.ingresses.List() avoids that
        race. Pinned by TestIngressAnnotations/nginx-ssl-passthrough.

        Backend entry shape (must stay identical across libraries):
          {
            "name":        namePrefix + ns + "-" + name,
            "sni":         host,
            "namespace":   ns,
            "ingress":     name,
            "svcName":     <first path's service name>,
            "svcPort":     <first path's service port (int)>,
            "svcPortName": <first path's service port name (string, "" if unnamed)>,
          }
      -#}
      {%- import "util-service-port-resolution" for ResolveServicePort %}
      {%- macro BuildAnnotationSSLPassthrough(sslData map[string]any, annotationKey string, namePrefix string, firstSeenKey string) %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- var passthrough = ingress.Metadata.Annotations[annotationKey] %}
          {%- if passthrough == "true" %}
            {%- var ns = ingress.Metadata.Namespace %}
            {%- var name = ingress.Metadata.Name %}
            {#- Find the first usable path's service to pair with each
                host. The same service is used for every host on this
                ingress (matches the prior consumer's "first path wins"
                semantics; passthrough by SNI doesn't route by path). -#}
            {%- var svcName = "" %}
            {%- var svcPort = 0 %}
            {%- var svcPortName = "" %}
            {#- First-service-found scan. The outer rule loop's body
                uses only path-level fields — flatten via `[*]`. The
                literal-desugar `break` exits the (single) loop on
                the first hit, faster than the original "no-op once
                svcName is set" pattern. -#}
            {%- for _, path := range ingress.Spec.Rules[*].Http.Paths %}
              {%- var n = path.Backend.Service.Name %}
              {%- if n != "" %}
                {%- var resolvedParts = split(ResolveServicePort(tostring(ns), n, path.Backend.Service.Port), " ") %}
                {%- svcName = n %}
                {%- svcPort = toint(resolvedParts[0]) %}
                {%- svcPortName = resolvedParts[1] %}
                {%- break %}
              {%- end %}
            {%- end %}
            {%- if svcName != "" %}
              {%- for _, rule := range ingress.Spec.Rules %}
                {%- if rule.Host != "" && first_seen(firstSeenKey, rule.Host) %}
                  {%- sslData["backends"] = append(sslData["backends"].([]any), map[string]any{
                    "name": namePrefix + ns + "-" + name,
                    "sni": rule.Host, "namespace": ns, "ingress": name,
                    "svcName": svcName, "svcPort": svcPort, "svcPortName": svcPortName,
                  }) %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-render-annotation-ssl-passthrough-backends:
    template: |
      {#-
        Macro: RenderAnnotationSSLPassthroughBackends(cacheKey, firstSeenKey, commentLabel)

        Renders one `backend <name> mode tcp` block per entry in
        sslData["backends"] (built earlier by BuildAnnotationSSLPassthrough),
        deduped per (ns/ingress) via the supplied firstSeenKey. No-op when
        the cache slot is empty.
      -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- macro RenderAnnotationSSLPassthroughBackends(cacheKey string, firstSeenKey string, commentLabel string) %}
        {%- var rawVal, _ = shared.ComputeIfAbsent(cacheKey, func() any { return nil }) %}
        {%- if rawVal == nil %}{% return %}{% end %}
        {%- var sslData = rawVal.(map[string]any) %}
        {%- var backends = sslData["backends"].([]any) %}
        {%- for _, backendInfo := range backends %}
          {%- var info = backendInfo.(map[string]any) %}
          {%- var beNs = info["namespace"] | tostring() %}
          {%- var beIngress = info["ingress"] | tostring() %}
          {%- var beName = info["name"] | tostring() %}
          {%- var svcName = info["svcName"] | tostring() %}
          {%- var svcPort = info["svcPort"] | toint() %}
          {%- var svcPortName = info["svcPortName"] | fallback("") | tostring() %}
          {%- if first_seen(firstSeenKey, beNs + "/" + beIngress) %}
      # {{ commentLabel }}/backends-ssl-passthrough

      backend {{ beName }}
          mode tcp
          {{ BackendServers(svcName, 10, svcPort, nil, svcPortName, beName, beNs) | indent(4) }}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-hsts:
    template: |
      {#-
        Macro: EmitAnnotationHSTS(
          ingress, enabledAnn, maxAgeAnn, subdomainsAnn, preloadAnn,
          defaultMaxAge, commentLabel
        )

        Reads the HSTS annotation set off the ingress and emits the
        `http-response set-header Strict-Transport-Security` rule scoped
        to the ingress's hosts. No-op when the enabledAnn is not "true"
        or the ingress has no hosts.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationHSTS(ingress *resources.ingresses.T, enabledAnn string, maxAgeAnn string, subdomainsAnn string, preloadAnn string, defaultMaxAge string, commentLabel string) %}
        {%- var enabled = ingress.Metadata.Annotations[enabledAnn] %}
        {%- if enabled == "true" %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var ns = ingress.Metadata.Namespace %}
            {%- var name = ingress.Metadata.Name %}
            {%- var key = ns + "/" + name %}
            {%- var maxAge = ingress.Metadata.Annotations[maxAgeAnn] %}
            {%- if maxAge == "" %}{%- maxAge = defaultMaxAge %}{%- end %}
            {%- var includeSubdomains = ingress.Metadata.Annotations[subdomainsAnn] %}
            {%- var preload = ingress.Metadata.Annotations[preloadAnn] %}
            {%- var hstsValue = "max-age=" + maxAge %}
            {%- if includeSubdomains == "true" %}{%- hstsValue = hstsValue + "; includeSubDomains" %}{%- end %}
            {%- if preload == "true" %}{%- hstsValue = hstsValue + "; preload" %}{%- end %}
      # {{ commentLabel }} ({{ key }})
      http-response set-header Strict-Transport-Security "{{ hstsValue }}" if { ssl_fc } {{ HostMatchCondition(hosts) }}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-cors:
    template: |
      {#-
        Macro: EmitAnnotationCORS(
          ingress, prefix, enabledAnn, defaultMaxAge, commentLabel
        )

        Emits the four standard CORS response headers (Allow-Origin,
        Allow-Methods, Allow-Headers, Max-Age) plus the conditional
        Allow-Credentials and Expose-Headers headers, scoped to the
        ingress's hosts.

        Args:
          prefix        — annotation key prefix (e.g.
                          "haproxy-ingress.github.io" or
                          "nginx.ingress.kubernetes.io")
          enabledAnn    — full annotation key that gates emission
                          (e.g. "<prefix>/cors-enable" or "<prefix>/enable-cors";
                          libraries differ on the suffix)
          defaultMaxAge — default value for the Max-Age header when
                          the cors-max-age annotation is unset

        haproxytech CORS is structurally different (http-request capture /
        set-header, validates origin=*+credentials=true conflict) and lives
        in haproxytech.yaml directly — does NOT use this macro.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationCORS(ingress *resources.ingresses.T, prefix string, enabledAnn string, defaultMaxAge string, commentLabel string) %}
        {%- var corsEnabled = ingress.Metadata.Annotations[enabledAnn] %}
        {%- if corsEnabled == "true" %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var ns = ingress.Metadata.Namespace %}
            {%- var name = ingress.Metadata.Name %}
            {%- var key = ns + "/" + name %}
            {%- var origin = ingress.Metadata.Annotations[prefix + "/cors-allow-origin"] %}
            {%- if origin == "" %}{%- origin = "*" %}{%- end %}
            {%- var methods = ingress.Metadata.Annotations[prefix + "/cors-allow-methods"] %}
            {%- if methods == "" %}{%- methods = "GET, PUT, POST, DELETE, PATCH, OPTIONS" %}{%- end %}
            {%- var headers = ingress.Metadata.Annotations[prefix + "/cors-allow-headers"] %}
            {%- if headers == "" %}{%- headers = "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" %}{%- end %}
            {%- var credentials = ingress.Metadata.Annotations[prefix + "/cors-allow-credentials"] %}
            {%- var exposeHeaders = ingress.Metadata.Annotations[prefix + "/cors-expose-headers"] %}
            {%- var maxAge = ingress.Metadata.Annotations[prefix + "/cors-max-age"] %}
            {%- if maxAge == "" %}{%- maxAge = defaultMaxAge %}{%- end %}
            {%- var cond = HostMatchCondition(hosts) %}
      # {{ commentLabel }} ({{ key }})
      http-response add-header Access-Control-Allow-Origin '{{ origin }}' if {{ cond }}
      http-response add-header Access-Control-Allow-Methods '{{ methods }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Allow-Headers '{{ headers }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Max-Age '{{ maxAge }}' if {{ cond }} METH_OPTIONS
            {% if credentials == "true" %}
      http-response add-header Access-Control-Allow-Credentials 'true' if {{ cond }}
            {% end %}
            {% if exposeHeaders != "" %}
      http-response add-header Access-Control-Expose-Headers '{{ exposeHeaders }}' if {{ cond }}
            {% end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-ssl-redirect:
    template: |
      {#-
        Macro: EmitAnnotationSSLRedirect(ingress, code, commentLabel)

        Emits the `http-request redirect scheme https code <code> if
        !{ ssl_fc } <host-match>` rule scoped to the ingress's hosts.
        The caller pre-computes `code` because the resolution rule
        varies across libraries — haproxy-ingress reads a single
        `ssl-redirect-code` annotation, nginx-ingress picks between 301
        and 308 based on `force-ssl-redirect`.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationSSLRedirect(ingress *resources.ingresses.T, code string, commentLabel string) %}
        {%- var hosts = []string{} %}
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
        {%- end %}
        {%- if len(hosts) > 0 %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
      # {{ commentLabel }} ({{ ns }}/{{ name }})
      http-request redirect scheme https code {{ code }} if !{ ssl_fc } {{ HostMatchCondition(hosts) }}
        {%- end %}
      {%- end macro %}

  # aclPrefix is per-library (haproxytech / hi / ni) — validation tests
  # assert on the resulting ACL names, so they must remain distinct.
  util-emit-annotation-access-control:
    template: |
      {#-
        Macro: EmitAnnotationAccessControl(
          ingress, allowAnnotation, denyAnnotation, aclPrefix,
          allowCommentFmt, denyCommentFmt
        )

        Reads the allowlist/denylist annotations and emits the CIDR ACL plus
        the gating http-request deny rule, scoped to the ingress's hosts.
        Comment format strings may contain {KEY} (replaced by "<ns>/<name>").
        No-op when the ingress has no hosts or neither annotation is set.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationAccessControl(ingress *resources.ingresses.T, allowAnnotation string, denyAnnotation string, aclPrefix string, allowCommentFmt string, denyCommentFmt string) %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var hosts = []string{} %}
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
        {%- end %}
        {%- var allowlist = ingress.Metadata.Annotations[allowAnnotation] %}
        {%- var denylist = ingress.Metadata.Annotations[denyAnnotation] %}
        {%- if allowlist != "" && len(hosts) > 0 %}
          {%- var aclName = aclPrefix + "_allowlist_" + ns + "_" + name %}
      # {{ replace(allowCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src{% for _, ip := range split(allowlist, ",") %}{% var t = trimSpace(ip) %}{% if t != "" %} {{ t }}{% end %}{% end %}

      http-request deny if {{ HostMatchCondition(hosts) }} !{{ aclName }}
        {%- end %}
        {%- if denylist != "" && len(hosts) > 0 %}
          {%- var aclName = aclPrefix + "_denylist_" + ns + "_" + name %}
      # {{ replace(denyCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src{% for _, ip := range split(denylist, ",") %}{% var t = trimSpace(ip) %}{% if t != "" %} {{ t }}{% end %}{% end %}

      http-request deny if {{ HostMatchCondition(hosts) }} {{ aclName }}
        {%- end %}
      {%- end macro %}
