# Annotation Compatibility Scaffold Library
#
# Provides shared HAProxy output macros and utility snippets consumed by the
# vendor-specific annotation libraries (haproxytech.yaml, haproxy-ingress.yaml,
# nginx-ingress.yaml). Sits at hierarchy level 2.5 — loaded after the resource
# libraries (ingress, gateway) and before the protocol libraries.
#
# This library does NOT process resources directly. It contains only stateless
# macros and parameterized utility snippets. Each protocol library extracts
# annotations from its own resource set and calls into the scaffold to emit
# HAProxy directives.
#
# Rationale and design: see docs/adr/0003-annotation-compat-scaffold-level-2-5.md
#
# Knowledge hierarchy:
#   Level 0:   base
#   Level 1:   ssl
#   Level 2:   ingress, gateway
#   Level 2.5: annotation-compat   <- this library
#   Level 3:   haproxytech, haproxy-ingress, nginx-ingress

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.annotationCompat.enabled }}'

templateSnippets:

  # ============================================================================
  # SSL Passthrough — shared macro
  #
  # Each protocol library has its own `util-build-X-ssl-passthrough` macro
  # that loops over Ingresses, checks for a vendor-specific annotation
  # (e.g. haproxy.org/ssl-passthrough, haproxy-ingress.github.io/ssl-passthrough,
  # nginx.ingress.kubernetes.io/ssl-passthrough), and appends per-host
  # entries to a `sslData["backends"]` slice. The shape of that loop is
  # identical across libraries; only three strings differ:
  #
  #   - annotationKey:  the annotation name to look up
  #   - namePrefix:     the backend-name prefix (preserves the existing per-library
  #                     naming convention for backwards compatibility)
  #   - firstSeenKey:   the first_seen() prefix used to dedupe hosts
  #
  # The protocol library's own `util-X-ssl-passthrough` snippet still owns the
  # ComputeIfAbsent cache key (so its data slot stays distinct), but the
  # build logic is shared.
  # ============================================================================

  util-build-annotation-ssl-passthrough:
    template: |
      {#-
        Macro: BuildAnnotationSSLPassthrough(sslData, annotationKey, namePrefix, firstSeenKey)

        Populates sslData["backends"] with one entry per (host, ingress) pair
        where the ingress carries a truthy annotationKey value AND has a
        well-formed first path with a service backend. Deduplicates hosts via
        first_seen(firstSeenKey, host).

        # Why service info is captured here, not by the consumer

        Earlier versions had this macro store only the (name, sni, namespace,
        ingress) tuple, leaving the consumer's `backends-*-ssl-passthrough`
        snippet to look the ingress up again via
        `resources.ingresses.GetSingle(ns, ingress)` and walk its rules to
        find a service. That second lookup created a render-order race: the
        macro's `resources.ingresses.List()` pass (which feeds the
        `use_backend` directive in `frontends-500-ssl-tcp`) could see an
        ingress that the later `GetSingle` did not — typically when an
        ingress is being deleted concurrent with another's webhook dry-run.
        The result was a config with `use_backend X` but no `backend X`
        block, which `haproxy -c` rejects, and the webhook denied the
        unrelated dry-run as collateral damage. (e2e
        `TestIngressAnnotations/nginx-ssl-passthrough` flake on !893.)

        Capturing svcName/svcPort here means both the use_backend directive
        and the backend block are derived from the same single iteration of
        the resource store, so they cannot disagree about set membership.
        Ingresses that lack a usable first path (no rules, no http, no
        backend.service) are dropped at build time so consumers never see
        an entry without enough info to emit a complete backend block.

        Backend entry shape (must stay identical across libraries):
          {
            "name":        namePrefix + ns + "-" + name,
            "sni":         host,
            "namespace":   ns,
            "ingress":     name,
            "svcName":     <first path's service name>,
            "svcPort":     <first path's service port (int)>,
            "svcPortName": <first path's service port name (string, "" if unnamed)>,
          }

        svcPortName was added when BuildAnnotationSSLPassthrough was switched to
        ResolveServicePort so that consumers can pass the resolved name to
        BackendServers as the 5th arg (was nil) for multi-port Services.
      -#}
      {%- import "util-service-port-resolution" for ResolveServicePort %}
      {%- macro BuildAnnotationSSLPassthrough(sslData map[string]any, annotationKey string, namePrefix string, firstSeenKey string) %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {%- var passthrough = ingress | dig("metadata", "annotations", annotationKey) | fallback("") | tostring() %}
          {%- if passthrough == "true" %}
            {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
            {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
            {#- Find the first usable path's service to pair with each
                host. The same service is used for every host on this
                ingress (matches the prior consumer's "first path wins"
                semantics; passthrough by SNI doesn't route by path). -#}
            {%- var svcName = "" %}
            {%- var svcPort = 0 %}
            {%- var svcPortName = "" %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- if svcName == "" %}
                {%- for _, path := range rule | dig("http", "paths") | fallback([]any{}) %}
                  {%- if svcName == "" %}
                    {%- var n = path | dig("backend", "service", "name") | fallback("") | tostring() %}
                    {%- if n != "" %}
                      {%- var resolvedParts = split(ResolveServicePort(tostring(ns), n, path | dig("backend", "service", "port")), " ") %}
                      {%- svcName = n %}
                      {%- svcPort = toint(resolvedParts[0]) %}
                      {%- svcPortName = resolvedParts[1] %}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if svcName != "" %}
              {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
                {%- var host = rule | dig("host") %}
                {%- if host != nil && first_seen(firstSeenKey, tostring(host)) %}
                  {%- sslData["backends"] = append(sslData["backends"].([]any), map[string]any{
                    "name": namePrefix + ns + "-" + name,
                    "sni": host, "namespace": ns, "ingress": name,
                    "svcName": svcName, "svcPort": svcPort, "svcPortName": svcPortName,
                  }) %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  # ============================================================================
  # SSL Passthrough backend emission — shared macro
  #
  # The three protocol libraries each emit `backend ... mode tcp` blocks for
  # entries previously stashed in their own SSL-passthrough cache slot by
  # BuildAnnotationSSLPassthrough. The loop is mechanical and identical
  # across libraries — only three strings differ:
  #
  #   - cacheKey      : shared.ComputeIfAbsent key the data lives under
  #   - firstSeenKey  : per-library first_seen() prefix that dedupes one
  #                     backend block per (ns/ingress) across hosts
  #   - commentLabel  : vendor name in the leading "# <label>/..." comment
  # ============================================================================

  util-render-annotation-ssl-passthrough-backends:
    template: |
      {#-
        Macro: RenderAnnotationSSLPassthroughBackends(cacheKey, firstSeenKey, commentLabel)

        Renders one `backend <name> mode tcp` block per entry in
        sslData["backends"] (built earlier by BuildAnnotationSSLPassthrough),
        deduped per (ns/ingress) via the supplied firstSeenKey. No-op when
        the cache slot is empty.
      -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- macro RenderAnnotationSSLPassthroughBackends(cacheKey string, firstSeenKey string, commentLabel string) %}
        {%- var rawVal, _ = shared.ComputeIfAbsent(cacheKey, func() any { return nil }) %}
        {%- if rawVal == nil %}{% return %}{% end %}
        {%- var sslData = rawVal.(map[string]any) %}
        {%- var backends = sslData["backends"].([]any) %}
        {%- for _, backendInfo := range backends %}
          {%- var info = backendInfo.(map[string]any) %}
          {%- var beNs = info["namespace"] | tostring() %}
          {%- var beIngress = info["ingress"] | tostring() %}
          {%- var beName = info["name"] | tostring() %}
          {%- var svcName = info["svcName"] | tostring() %}
          {%- var svcPort = info["svcPort"] | toint() %}
          {%- var svcPortName = info["svcPortName"] | fallback("") | tostring() %}
          {%- if first_seen(firstSeenKey, beNs + "/" + beIngress) %}
      # {{ commentLabel }}/backends-ssl-passthrough

      backend {{ beName }}
          mode tcp
          {{ BackendServers(svcName, 10, svcPort, nil, svcPortName, beName, beNs) | indent(4) }}
          {%- end %}
        {%- end %}
      {%- end macro %}

  # ============================================================================
  # HSTS / SSL-redirect — shared macros
  #
  # Both annotation libraries (haproxy-ingress, nginx-ingress) emit the
  # same HAProxy directives for HSTS and SSL-redirect, differing only in
  # annotation key prefixes, default values, and the comment label. The
  # macros below own the loop bodies; callers just feed in the per-vendor
  # annotation keys plus any vendor-specific code-resolution logic.
  # ============================================================================

  util-emit-annotation-hsts:
    template: |
      {#-
        Macro: EmitAnnotationHSTS(
          ingress, enabledAnn, maxAgeAnn, subdomainsAnn, preloadAnn,
          defaultMaxAge, commentLabel
        )

        Reads the HSTS annotation set off the ingress and emits the
        `http-response set-header Strict-Transport-Security` rule scoped
        to the ingress's hosts. No-op when the enabledAnn is not "true"
        or the ingress has no hosts.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationHSTS(ingress any, enabledAnn string, maxAgeAnn string, subdomainsAnn string, preloadAnn string, defaultMaxAge string, commentLabel string) %}
        {%- var enabled = ingress | dig("metadata", "annotations", enabledAnn) | fallback("") | tostring() %}
        {%- if enabled == "true" %}
          {%- var hosts = []any{} %}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
            {%- var h = rule | dig("host") %}
            {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
            {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
            {%- var key = ns + "/" + name %}
            {%- var maxAge = ingress | dig("metadata", "annotations", maxAgeAnn) | fallback(defaultMaxAge) | tostring() %}
            {%- var includeSubdomains = ingress | dig("metadata", "annotations", subdomainsAnn) | fallback("") | tostring() %}
            {%- var preload = ingress | dig("metadata", "annotations", preloadAnn) | fallback("") | tostring() %}
            {%- var hstsValue = "max-age=" + maxAge %}
            {%- if includeSubdomains == "true" %}{%- hstsValue = hstsValue + "; includeSubDomains" %}{%- end %}
            {%- if preload == "true" %}{%- hstsValue = hstsValue + "; preload" %}{%- end %}
      # {{ commentLabel }} ({{ key }})
      http-response set-header Strict-Transport-Security "{{ hstsValue }}" if { ssl_fc } {{ HostMatchCondition(hosts) }}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-cors:
    template: |
      {#-
        Macro: EmitAnnotationCORS(
          ingress, prefix, enabledAnn, defaultMaxAge, commentLabel
        )

        Emits the four standard CORS response headers (Allow-Origin,
        Allow-Methods, Allow-Headers, Max-Age) plus the conditional
        Allow-Credentials and Expose-Headers headers, scoped to the
        ingress's hosts.

        Args:
          prefix        — annotation key prefix (e.g.
                          "haproxy-ingress.github.io" or
                          "nginx.ingress.kubernetes.io")
          enabledAnn    — full annotation key that gates emission
                          (e.g. "<prefix>/cors-enable" or "<prefix>/enable-cors";
                          libraries differ on the suffix)
          defaultMaxAge — default value for the Max-Age header when
                          the cors-max-age annotation is unset

        The structurally-divergent haproxytech CORS (uses
        http-request capture / set-header instead of add-header,
        validates origin=*+credentials=true conflict) lives in
        haproxytech.yaml directly and does NOT use this macro.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationCORS(ingress any, prefix string, enabledAnn string, defaultMaxAge string, commentLabel string) %}
        {%- var corsEnabled = ingress | dig("metadata", "annotations", enabledAnn) | fallback("") | tostring() %}
        {%- if corsEnabled == "true" %}
          {%- var hosts = []any{} %}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
            {%- var h = rule | dig("host") %}
            {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
            {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
            {%- var key = ns + "/" + name %}
            {%- var origin = ingress | dig("metadata", "annotations", prefix + "/cors-allow-origin") | fallback("*") | tostring() %}
            {%- var methods = ingress | dig("metadata", "annotations", prefix + "/cors-allow-methods") | fallback("GET, PUT, POST, DELETE, PATCH, OPTIONS") | tostring() %}
            {%- var headers = ingress | dig("metadata", "annotations", prefix + "/cors-allow-headers") | fallback("DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization") | tostring() %}
            {%- var credentials = ingress | dig("metadata", "annotations", prefix + "/cors-allow-credentials") | fallback("") | tostring() %}
            {%- var exposeHeaders = ingress | dig("metadata", "annotations", prefix + "/cors-expose-headers") | fallback("") | tostring() %}
            {%- var maxAge = ingress | dig("metadata", "annotations", prefix + "/cors-max-age") | fallback(defaultMaxAge) | tostring() %}
            {%- var cond = HostMatchCondition(hosts) %}
      # {{ commentLabel }} ({{ key }})
      http-response add-header Access-Control-Allow-Origin '{{ origin }}' if {{ cond }}
      http-response add-header Access-Control-Allow-Methods '{{ methods }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Allow-Headers '{{ headers }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Max-Age '{{ maxAge }}' if {{ cond }} METH_OPTIONS
            {% if credentials == "true" %}
      http-response add-header Access-Control-Allow-Credentials 'true' if {{ cond }}
            {% end %}
            {% if exposeHeaders != "" %}
      http-response add-header Access-Control-Expose-Headers '{{ exposeHeaders }}' if {{ cond }}
            {% end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-emit-annotation-ssl-redirect:
    template: |
      {#-
        Macro: EmitAnnotationSSLRedirect(ingress, code, commentLabel)

        Emits the `http-request redirect scheme https code <code> if
        !{ ssl_fc } <host-match>` rule scoped to the ingress's hosts.
        The caller pre-computes `code` because the resolution rule
        varies across libraries — haproxy-ingress reads a single
        `ssl-redirect-code` annotation, nginx-ingress picks between 301
        and 308 based on `force-ssl-redirect`.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationSSLRedirect(ingress any, code string, commentLabel string) %}
        {%- var hosts = []any{} %}
        {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
          {%- var h = rule | dig("host") %}
          {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
        {%- end %}
        {%- if len(hosts) > 0 %}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
      # {{ commentLabel }} ({{ ns }}/{{ name }})
      http-request redirect scheme https code {{ code }} if !{ ssl_fc } {{ HostMatchCondition(hosts) }}
        {%- end %}
      {%- end macro %}

  # ============================================================================
  # IP Allow/Deny ACL — shared macro
  #
  # All three protocol libraries implement CIDR-based source-range access
  # control with the same shape: read an allowlist annotation and a denylist
  # annotation, emit `acl <name> src <cidrs>` plus a `http-request deny if
  # <host-match> [!]<acl>` rule, scoped to the ingress's hosts.
  #
  # Parameterized differences:
  #   - allowAnnotation / denyAnnotation: vendor-specific annotation keys
  #   - aclPrefix:    per-library ACL name prefix (haproxytech / hi / ni); validation
  #                   tests assert on these, so they must remain library-distinct
  #   - allowCommentFmt / denyCommentFmt: leading "# ..." comment per ruleset; each
  #                   library has its own phrasing. Format strings may contain the
  #                   literal {KEY} placeholder, which is substituted with the
  #                   "<ns>/<name>" key at emission time.
  # ============================================================================

  util-emit-annotation-access-control:
    template: |
      {#-
        Macro: EmitAnnotationAccessControl(
          ingress, allowAnnotation, denyAnnotation, aclPrefix,
          allowCommentFmt, denyCommentFmt
        )

        Reads the allowlist/denylist annotations and emits the CIDR ACL plus
        the gating http-request deny rule, scoped to the ingress's hosts.
        Comment format strings may contain {KEY} (replaced by "<ns>/<name>").
        No-op when the ingress has no hosts or neither annotation is set.
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition %}
      {%- macro EmitAnnotationAccessControl(ingress any, allowAnnotation string, denyAnnotation string, aclPrefix string, allowCommentFmt string, denyCommentFmt string) %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var hosts = []any{} %}
        {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
          {%- var h = rule | dig("host") %}
          {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
        {%- end %}
        {%- var allowlist = ingress | dig("metadata", "annotations", allowAnnotation) | fallback("") | tostring() %}
        {%- var denylist = ingress | dig("metadata", "annotations", denyAnnotation) | fallback("") | tostring() %}
        {%- if allowlist != "" && len(hosts) > 0 %}
          {%- var aclName = aclPrefix + "_allowlist_" + ns + "_" + name %}
      # {{ replace(allowCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src{% for _, ip := range split(allowlist, ",") %}{% var t = trimSpace(ip) %}{% if t != "" %} {{ t }}{% end %}{% end %}

      http-request deny if {{ HostMatchCondition(hosts) }} !{{ aclName }}
        {%- end %}
        {%- if denylist != "" && len(hosts) > 0 %}
          {%- var aclName = aclPrefix + "_denylist_" + ns + "_" + name %}
      # {{ replace(denyCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src{% for _, ip := range split(denylist, ",") %}{% var t = trimSpace(ip) %}{% if t != "" %} {{ t }}{% end %}{% end %}

      http-request deny if {{ HostMatchCondition(hosts) }} {{ aclName }}
        {%- end %}
      {%- end macro %}
