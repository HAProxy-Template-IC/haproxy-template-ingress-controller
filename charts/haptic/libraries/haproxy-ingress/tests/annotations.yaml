    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: "map:path-prefix-exact.map"
        pattern: '(?m)^begin\.example\.com/static BACKEND:default_begin-ingress_svc_begin-service_80$'
        description: Map entry must carry the `BACKEND:<backend_name>` qualifier prefix.

  test-haproxy-ingress-path-type-regex:
    description: "HAProxy-Ingress path-type=regex annotation produces a path-regex.map row keyed by the literal regex pattern with a `BACKEND:<backend_name>` qualifier value. base."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: regex-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: regex-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: regex.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: regex-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid (regex must parse cleanly)
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^regex\.example\.com/api/v\[0-9\]\+/\.\* BACKEND:default_regex-ingress_svc_regex-service_80$'
        description: "Map entry must carry the literal regex pattern as the key AND the `BACKEND:<backend_name>` qualifier value. The historical renderer wrote the row as `<host><pathRegex> ` (trailing space, no backend name) because it used `render \"util-backend-name-ingress\"` — which only defines the BackendNameIngress macro without calling it. With the fix the renderer imports the macro and calls it, so the row is well-formed."
  test-haproxy-ingress-path-type-regex-wildcard-host:
    description: HAProxy-Ingress path-type=regex annotation on a wildcard-host Ingress produces a valid regex (no leading literal `*`). The historical renderer used the raw rule.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: wild-regex-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-regex-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: wild-regex-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: "HAProxy must parse the rendered config (in particular, path-regex.map) without error. Catches the wildcard-`*` regex bug — without MapKeyForHost the key would start with `*.example.com` and HAProxy would reject the regex."
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^\.example\.com/api/v\[0-9\]\+/\.\* BACKEND:default_wild-regex-ingress_svc_wild-regex-service_80$'
        description: "Wildcard host normalisation: `*.example.com` → `.example.com` (leading `*` stripped via MapKeyForHost). The result is a valid regex pattern that matches concrete subdomains via base.yaml's regsub fallback at request time."
      - type: not_contains
        target: "map:path-regex.map"
        pattern: '\*\.example\.com'
        description: "The leading `*` from the wildcard host MUST NOT appear in the regex pattern (would make it an invalid regex)."
  test-haproxy-ingress-path-type-regex-rule-without-http:
    description: "HAProxy-Ingress path-type=regex with a rule that has no `http` block must not panic or emit any map row for that rule. Regression test for the typed-traversal migration (!1017) — `rule.Http.Paths` is accessed directly, and an absent `http:` in the source YAML must surface as an empty slice (loop emits nothing), not a nil-deref panic."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mixed-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              # Rule with no http block — must be tolerated.
              - host: nohttp.example.com
              # Rule with http block — must still emit its path.
              - host: hashttp.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: mixed-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid (no panic during render)
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^hashttp\.example\.com/api/v\[0-9\]\+/\.\* BACKEND:default_mixed-ingress_svc_mixed-service_80$'
        description: "The rule with an http block must still emit its row even when a sibling rule has no http block."
      - type: not_contains
        target: "map:path-regex.map"
        pattern: 'nohttp\.example\.com'
        description: "The rule without an http block must not contribute any map entry (its empty Paths slice produces zero iterations)."
  # ============================================================================
  # Phase 4: Session Affinity Tests
  # ============================================================================

  test-haproxy-ingress-session-affinity-basic:
