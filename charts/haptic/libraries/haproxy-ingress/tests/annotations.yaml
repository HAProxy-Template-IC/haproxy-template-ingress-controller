  # ============================================================================
  # Phase 3: Path Type Tests
  # ============================================================================

  test-haproxy-ingress-path-type-exact:
    description: HAProxy-Ingress path-type exact annotation uses exact match map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: exact-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: exact-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "exact"
          spec:
            ingressClassName: haproxy
            rules:
              - host: exact.example.com
                http:
                  paths:
                    - path: /api/users
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: exact-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: "map:path-exact.map"
        pattern: '(?m)^exact\.example\.com/api/users BACKEND:default_exact-ingress_svc_exact-service_80$'
        description: "Map entry must carry the `BACKEND:<backend_name>` qualifier prefix so base.yaml's frontend-routing-logic can decode the qualifier (`field(1,:)`) and dispatch to the named backend. Asserting on the value (not just the key) is the assertion that would have caught the historical breakage where the renderer omitted the `BACKEND:` prefix and routing silently fell through to default_backend."
  test-haproxy-ingress-path-type-prefix:
    description: HAProxy-Ingress path-type prefix annotation uses prefix map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: prefix-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: prefix-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "prefix"
          spec:
            ingressClassName: haproxy
            rules:
              - host: prefix.example.com
                http:
                  paths:
                    - path: /api
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: prefix-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: "map:path-prefix.map"
        pattern: '(?m)^prefix\.example\.com/api/ BACKEND:default_prefix-ingress_svc_prefix-service_80$'
        description: Map entry must carry the `BACKEND:<backend_name>` qualifier prefix; trailing slash for prefix matching.

  test-haproxy-ingress-path-type-begin:
    description: HAProxy-Ingress path-type begin annotation uses prefix-exact map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: begin-service
          spec:
            ports:
              - port: 80
      ingresses:
