# haproxy-ingress library — auth validation tests.
# Basic auth (userlist + password-hash validation), auth-tls client cert,
# and external-auth (SPOE) flows.
validationTests:
  # ============================================================================
  # Phase 7: Basic Auth Tests
  # ============================================================================

  test-haproxy-ingress-basic-auth:
    description: HAProxy-Ingress auth-secret generates userlist and auth directive
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: auth-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-ingress.github.io/auth-secret: "hi-auth-secret"
              haproxy-ingress.github.io/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: auth-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "userlist hi_auth_default_hi-auth-secret"
        description: Must generate userlist from secret
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password"
        description: Userlist must contain credentials
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "ProtectedArea"'
        description: Must require auth with custom realm

  test-haproxy-ingress-auth-password-hash-validation-reject:
    description: Password hash validation rejects non-matching hashes (haproxy-ingress)
    extraContext:
      password_hash_validation_regex: "^\\$apr1\\$"
      password_hash_validation_error_message: "Bcrypt hashes not allowed"
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDEwJGJjcnlwdGhhc2g=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: test-svc
                          port:
                            number: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: test-svc
          spec:
            ports:
              - port: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Bcrypt hashes not allowed"
        description: Must reject bcrypt hash with custom error message
      - type: contains
        target: rendering_error
        pattern: "admin"
        description: Error must include username

  test-haproxy-ingress-auth-password-hash-validation-allow:
    description: Password hash validation allows matching hashes (haproxy-ingress)
    extraContext:
      password_hash_validation_regex: "^\\$2[ayb]\\$"
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: test-svc
                          port:
                            number: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: test-svc
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password"
        description: User must be in config

  test-haproxy-ingress-auth-tls-secret:
    description: haproxy-ingress.github.io/auth-tls-secret references a Secret whose `ca.crt` is written to the general file dir (not ssl/ — Dataplane validates ssl/ uploads as cert+key) and used in the crt-list line...
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: client-ca
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: server-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-ingress.github.io/auth-tls-secret: "client-ca"
              haproxy-ingress.github.io/auth-tls-verify-client: "on"
              haproxy-ingress.github.io/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-ingress.github.io/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with the auth-tls-* annotation set
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
        description: crt-list line carries the per-host ca-file path (general/, not ssl/ — Dataplane SSL endpoint validates ssl/ uploads as cert+key), verify mode, and SNI
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location https://login\\.example\\.com/cert-required code 302 if \\{ ssl_c_verify gt 0 \\}"
        description: auth-tls-error-page emits a 302 redirect gated on the cert-verify-failure ACL
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-SSL-Client-Cert %\\[ssl_c_der,base64\\] if \\{ ssl_fc_has_crt \\}"
        description: auth-tls-cert-header forwards the client cert (base64 DER) on requests that presented a cert

  test-haproxy-ingress-auth-tls-error-page-injection-rejected:
    description: An auth-tls-error-page value containing whitespace (or newlines, tabs, etc.) must fail loudly — without validation, the value would be interpolated into a `http-request redirect location <url>` direct...
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redirect
            annotations:
              # Whitespace + injected `http-request deny` after the legitimate URL.
              haproxy-ingress.github.io/auth-tls-error-page: "https://evil.example.com code 301\n      http-request deny if TRUE"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid URL"
        description: Render must fail loudly when the URL contains whitespace
      - type: contains
        target: rendering_error
        pattern: "default/bad-redirect"
        description: Error must identify the offending Ingress

  test-haproxy-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy. Skip when
    # the library isn't loaded (e.g. validate-helm-libraries default
    # render).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-url annotation populates auth-url.map and the spoa-hub frontend wiring (set-var, send-spoe-group, deny rule). Mirrors test-nginx-ingress-external-auth but uses the haproxy-ingress.github.io/auth-url annotation flavour."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-url annotation
      - type: contains
        target: map:auth-url.map
        pattern: "default/hi-protected https://auth.example/check"
        description: auth-url.map must contain the <ns>/<name> → URL entry
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
        description: Frontend looks up auth_url from the map after routing
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend triggers the SPOE check when auth_url is found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure

  test-haproxy-ingress-external-auth-signin:
    # Same prerequisite as the other external-auth tests — needs the
    # spoa-hub library loaded so auth-signin.map is defined.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-signin annotation makes auth failures redirect (302) to the configured sign-in URL instead of returning 401. Mirrors test-nginx-ingress-external-auth-signin but uses the haproxy-ingress.github.io/auth-signin annotation."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-signin: "https://login.example/oauth2/start"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-signin annotation
      - type: contains
        target: map:auth-signin.map
        pattern: "default/hi-protected https://login.example/oauth2/start"
        description: auth-signin.map must contain the <ns>/<name> → URL entry
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_signin\\).*auth-signin\\.map"
        description: Frontend looks up auth_signin from the map
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.auth_signin\\)\\] code 302"
        description: Frontend redirects to auth-signin URL on auth failure (browser flow)
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Deny rule still emits as fallback for ingresses without auth-signin

