  test-haproxy-ingress-external-auth-headers-request-overlaps-builtin:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Regression test for the HAProxy 3.0 SPOE-frame-parse failure that surfaced as pipeline 2549047264's test-e2e [3.0] TestIngressAuthHeadersFail. An Ingress annotation `auth-headers-request: X-Forwarded-Uri` overlaps a header the base spoe-hub library already captures (`hdr_x_forwarded_uri= req.hdr(X-Forwarded-Uri)` is hardcoded in spoe-message-check-auth-body). The auto-extend snippet was supposed to dedup against those built-ins, but the pre-seeded `seen` map used dash-form keys (`x-forwarded-uri`) while the check uses underscore-form (`replace(toLower(name), \"-\", \"_\")` → `x_forwarded_uri`). The two never matched and the SPOE args line ended up with the header captured twice. HAProxy 3.0's SPOE notify-frame parser rejects duplicate arg names (spop returns \"Failed to parse frame: Tag\"); 3.1+ tolerates them silently, which is why only the 3.0 e2e shard failed. Fixture: an Ingress with `auth-headers-request: X-Forwarded-Uri` (one of the six built-in captures). The rendered spoe.conf args line must mention `hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri)` exactly ONCE."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports: [{ port: 80 }]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: overlaps-builtin
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-request: "X-Forwarded-Uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: overlaps.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_x_forwarded_uri=req\\.hdr\\(X-Forwarded-Uri\\).*hdr_x_forwarded_uri=req\\.hdr"
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_forwarded_uri=req\\.hdr\\(X-Forwarded-Uri\\)"

