  test-haproxy-ingress-external-auth-headers-request-extends-spoe-message:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: haproxy-ingress.github.io/auth-headers-request listing a custom header (one not in the hardcoded six) must auto-extend the SPOE check-auth message body with a `hdr_<name>=req.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tenant-a
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              # Mix of hardcoded (Authorization) and custom (X-Tenant-ID, X-Request-ID).
              haproxy-ingress.github.io/auth-headers-request: "Authorization, X-Tenant-ID, X-Request-ID"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tenant-a.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tenant-b
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              # Repeats X-Tenant-ID — must dedupe across ingresses.
              haproxy-ingress.github.io/auth-headers-request: "X-Tenant-ID, X-Trace-Id"
          spec:
            ingressClassName: haproxy
            rules:
              - host: tenant-b.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with custom auth-headers-request entries
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\)"
        description: Custom header X-Tenant-ID is captured as an SPOE arg
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_request_id=req\\.hdr\\(X-Request-ID\\)"
        description: Custom header X-Request-ID from tenant-a is captured
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_trace_id=req\\.hdr\\(X-Trace-Id\\)"
        description: Custom header X-Trace-Id from tenant-b is captured
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\) .*hdr_x_tenant_id=req\\.hdr\\(X-Tenant-ID\\)"
        description: Duplicate X-Tenant-ID across ingresses must collapse to one capture
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_authorization=req\\.hdr\\(Authorization\\) .*hdr_authorization=req\\.hdr"
        description: Hardcoded Authorization header must not be re-emitted by the auto-extend snippet

  test-haproxy-ingress-external-auth-headers-fail-both-frontends:
    # Regression for issue #49 — TestIngressAuthHeadersFail in the e2e
    # suite (pipeline 2546220821 job 14503514071) caught the chart
    # emitting `http-request deny deny_status 401` into ONE frontend
    # (http_frontend_h2c) but not the other (http_frontend). Plain
    # HTTP/1.1 traffic landed in http_frontend, hit the routing chain
    # without the deny rule, and reached the backend → 200 instead of
    # the expected 401.
    #
    # Pin both frontends explicitly: the chart's haproxy-ingress
    # auth-headers-fail path uses `first_seen` to dedupe the
    # `http-after-response set-header` directives across ingresses, but
    # that dedup must NOT bleed across the http_frontend and
    # http_frontend_h2c renders — both frontends serve client traffic
    # and need identical auth-deny semantics regardless of which one
    # the request landed in.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url + auth-headers-fail annotations must emit the deny 401 AND the http-after-response set-header directives into BOTH the HTTP/1.1 and H2C frontends. Regression for the asymmetric render that broke TestIngressAuthHeadersFail on MR !974 pipeline 2546220821."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-headers-fail
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/deny-with-fail-headers"
              haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # Both frontends must carry the deny 401 directive.
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend\b.*?http-request deny deny_status 401 if \{ var\(txn\.auth_url\) -m found \} !\{ var\(txn\.hub\.external_auth\.allowed\) -m bool \}.*?frontend http_frontend_h2c'
        description: http_frontend (HTTP/1.1) emits the auth deny 401 rule

      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend_h2c\b.*?http-request deny deny_status 401 if \{ var\(txn\.auth_url\) -m found \} !\{ var\(txn\.hub\.external_auth\.allowed\) -m bool \}'
        description: http_frontend_h2c (HTTP/2 cleartext) emits the auth deny 401 rule

      # Both frontends must carry the http-after-response set-header
      # directives for WWW-Authenticate.
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend\b.*?http-after-response set-header WWW-Authenticate.*?frontend http_frontend_h2c'
        description: http_frontend (HTTP/1.1) emits the WWW-Authenticate set-header
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend_h2c\b.*?http-after-response set-header WWW-Authenticate'
        description: http_frontend_h2c emits the WWW-Authenticate set-header

  test-haproxy-ingress-external-auth-headers-request-dash-underscore-collision:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: Two header spellings that differ only in dashes vs underscores (e.g. `X-Request-Id` and `X_Request_Id`) lower-case to different strings but collapse to the same SPOE arg name after dash→underscore rep...
    extraContext:
