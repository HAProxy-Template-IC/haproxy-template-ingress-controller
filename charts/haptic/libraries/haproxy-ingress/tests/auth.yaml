# haproxy-ingress library — auth validation tests.
# Basic auth (userlist + password-hash validation), auth-tls client cert,
# and external-auth (SPOE) flows.
validationTests:
  # ============================================================================
  # Phase 7: Basic Auth Tests
  # ============================================================================

  test-haproxy-ingress-basic-auth:
    description: HAProxy-Ingress auth-secret generates userlist and auth directive
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: auth-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-ingress.github.io/auth-secret: "hi-auth-secret"
              haproxy-ingress.github.io/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: auth-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "userlist hi_auth_default_hi-auth-secret"
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password"
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "ProtectedArea"'

  test-haproxy-ingress-basic-auth-missing-secret:
    description: >-
      auth-secret referencing a Secret that is ABSENT from the render snapshot
      (informer lag, or a cascade-delete that removed the Secret while the
      Ingress still lingers) must skip the userlist + auth ACL cleanly, not
      panic. Regression for the typed-nil gotcha: resources.secrets.GetSingle's
      result (statically *resources.secrets.T) is a typed-nil when the Secret is
      absent, and boxing it through shared.ComputeIfAbsent's `func() any` made it
      a non-nil `any`, so `secret != nil` passed and the subsequent
      `secret.(*resources.secrets.T).Data` dereferenced a nil pointer.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: auth-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress-missing-secret
            annotations:
              haproxy-ingress.github.io/auth-secret: "absent-secret"
              haproxy-ingress.github.io/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth-missing.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: auth-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "userlist hi_auth_default_absent-secret"
      - type: not_contains
        target: haproxy.cfg
        pattern: "http_auth(hi_auth_default_absent-secret)"

  test-haproxy-ingress-auth-password-hash-validation-reject:
    description: Password hash validation rejects non-matching hashes (haproxy-ingress)
    extraContext:
      password_hash_validation_regex: "^\\$apr1\\$"
      password_hash_validation_error_message: "Bcrypt hashes not allowed"
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDEwJGJjcnlwdGhhc2g=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: test-svc
                          port:
                            number: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: test-svc
          spec:
            ports:
              - port: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Bcrypt hashes not allowed"
      - type: contains
        target: rendering_error
        pattern: "admin"

  test-haproxy-ingress-auth-password-hash-validation-allow:
    description: Password hash validation allows matching hashes (haproxy-ingress)
    extraContext:
      password_hash_validation_regex: "^\\$2[ayb]\\$"
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: hi-auth-secret
          type: Opaque
          data:
            admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: test-svc
                          port:
                            number: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: test-svc
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "user admin password"

  test-haproxy-ingress-auth-tls-secret:
    description: haproxy-ingress.github.io/auth-tls-secret references a Secret whose `ca.crt` is written to the general file dir (not ssl/ — Dataplane validates ssl/ uploads as cert+key) and used in the crt-list line...
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: client-ca
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: server-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-ingress.github.io/auth-tls-secret: "client-ca"
              haproxy-ingress.github.io/auth-tls-verify-client: "on"
              haproxy-ingress.github.io/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-ingress.github.io/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location https://login\\.example\\.com/cert-required code 302 if \\{ ssl_c_verify gt 0 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-SSL-Client-Cert %\\[ssl_c_der,base64\\] if \\{ ssl_fc_has_crt \\}"

  test-haproxy-ingress-auth-tls-error-page-injection-rejected:
    description: An auth-tls-error-page value containing whitespace (or newlines, tabs, etc.) must fail loudly — without validation, the value would be interpolated into a `http-request redirect location <url>` direct...
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redirect
            annotations:
              # Whitespace + injected `http-request deny` after the legitimate URL.
              haproxy-ingress.github.io/auth-tls-error-page: "https://evil.example.com code 301\n      http-request deny if TRUE"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid URL"
      - type: contains
        target: rendering_error
        pattern: "default/bad-redirect"

  test-haproxy-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy. Skip when
    # the library isn't loaded (e.g. validate-helm-libraries default
    # render).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-url annotation populates auth-url.map and the spoa-hub frontend wiring (set-var, send-spoe-group, deny rule). Mirrors test-nginx-ingress-external-auth but uses the haproxy-ingress.github.io/auth-url annotation flavour."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/hi-protected https://auth.example/check"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"

  test-haproxy-ingress-oauth-oauth2-proxy:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth: oauth2_proxy desugars onto external-auth — derives the oauth2-proxy address from the Ingress's own /oauth2 path backend; sets auth-url (/oauth2/auth), auth-signin (/oauth2/start), auth-method HEAD, extract-headers, and forwards X-Auth-Request-Email on success."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: oauth-app-svc
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: oauth2-proxy
          spec:
            ports:
              - port: 4180
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthapp
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthapp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: oauth-app-svc
                          port:
                            number: 80
                    - path: /oauth2
                      pathType: Prefix
                      backend:
                        service:
                          name: oauth2-proxy
                          port:
                            number: 4180
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/oauthapp http://oauth2-proxy.default.svc:4180/oauth2/auth"
      - type: contains
        target: map:auth-signin.map
        pattern: "default/oauthapp /oauth2/start\\?rd=%\\[path\\]"
      - type: contains
        target: map:auth-method.map
        pattern: "default/oauthapp HEAD"
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/oauthapp X-Auth-Request-Email"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Request-Email %\\[var\\(txn.hub.external_auth.x_auth_request_email\\)\\]"

  test-haproxy-ingress-oauth-invalid-value:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth with an unsupported value aborts the render with a clear error naming both accepted spellings."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: [check-auth]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-bad-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthbad
            annotations:
              haproxy-ingress.github.io/oauth: "google"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthbad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: oauth-bad-svc, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Only 'oauth2_proxy' \\(or 'oauth2-proxy'\\) is supported"

  test-haproxy-ingress-oauth-no-prefix-path:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth set but no Ingress path matches oauth-uri-prefix aborts the render (the oauth2-proxy backend cannot be derived)."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: [check-auth]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-np-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthnp
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthnp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: oauth-np-svc, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has no Ingress path '/oauth2'"

  test-haproxy-ingress-oauth-auth-url-precedence:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "an explicit auth-url on the same Ingress as oauth takes precedence — the oauth desugaring contributes no auth-url.map entry."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: [check-auth]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-pr-svc}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth2-proxy}
          spec:
            ports: [{port: 4180}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthpr
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
              haproxy-ingress.github.io/auth-url: "https://explicit.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthpr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: oauth-pr-svc, port: {number: 80}}}
                    - path: /oauth2
                      pathType: Prefix
                      backend: {service: {name: oauth2-proxy, port: {number: 4180}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/oauthpr https://explicit.example/check"
      - type: not_contains
        target: map:auth-url.map
        pattern: "default/oauthpr http://oauth2-proxy"

  test-haproxy-ingress-external-auth-signin:
    # Same prerequisite as the other external-auth tests — needs the
    # spoa-hub library loaded so auth-signin.map is defined.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-signin annotation makes auth failures redirect (302) to the configured sign-in URL instead of returning 401. Mirrors test-nginx-ingress-external-auth-signin but uses the haproxy-ingress.github.io/auth-signin annotation."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: hi-protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-signin: "https://login.example/oauth2/start"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: hi-protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-signin.map
        pattern: "default/hi-protected https://login.example/oauth2/start"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_signin\\).*auth-signin\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.auth_signin\\)\\] code 302"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"

  test-haproxy-ingress-external-auth-method:
