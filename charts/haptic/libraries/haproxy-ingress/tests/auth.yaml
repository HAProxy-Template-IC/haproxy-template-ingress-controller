  test-haproxy-ingress-external-auth-headers-request-overlaps-builtin:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Regression test for the HAProxy 3.0 SPOE-frame-parse failure that surfaced as pipeline 2549047264's test-e2e [3.0] TestIngressAuthHeadersFail. An Ingress annotation `auth-headers-request: X-Forwarded-Uri` overlaps a header the base spoe-hub library already captures (`hdr_x_forwarded_uri= req.hdr(X-Forwarded-Uri)` is hardcoded in spoe-message-check-auth-body). The auto-extend snippet was supposed to dedup against those built-ins, but the pre-seeded `seen` map used dash-form keys (`x-forwarded-uri`) while the check uses underscore-form (`replace(toLower(name), \"-\", \"_\")` → `x_forwarded_uri`). The two never matched and the SPOE args line ended up with the header captured twice. HAProxy 3.0's SPOE notify-frame parser rejects duplicate arg names (spop returns \"Failed to parse frame: Tag\"); 3.1+ tolerates them silently, which is why only the 3.0 e2e shard failed. Fixture: an Ingress with `auth-headers-request: X-Forwarded-Uri` (one of the six built-in captures). The rendered spoe.conf args line must mention `hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri)` exactly ONCE."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports: [{ port: 80 }]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: overlaps-builtin
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-request: "X-Forwarded-Uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: overlaps.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid
      - type: not_contains
        target: file:spoe.conf
        pattern: "hdr_x_forwarded_uri=req\\.hdr\\(X-Forwarded-Uri\\).*hdr_x_forwarded_uri=req\\.hdr"
        description: "The built-in `hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri)` arg must not be re-emitted by the auto-extend snippet — duplicate arg names trip HAProxy 3.0's SPOE frame parser."
      - type: contains
        target: file:spoe.conf
        pattern: "hdr_x_forwarded_uri=req\\.hdr\\(X-Forwarded-Uri\\)"
        description: The built-in arg must still appear (sanity check on the negative above)

  test-haproxy-ingress-external-auth-headers-succeed-fail:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: haproxy-ingress.github.io/auth-headers-succeed and auth-headers-fail annotations both populate auth-extract-headers.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-succeed: "X-Auth-User, X-Auth-Roles"
              haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-headers-succeed and auth-headers-fail annotations
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/protected X-Auth-User, X-Auth-Roles, WWW-Authenticate, X-Error-Reason"
        description: auth-extract-headers.map must hold the union of pass and fail headers per ingress (with consistent comma+space spacing)
      - type: contains
        target: file:spoe.conf
        pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"
        description: SPOE message body threads txn.auth_extract_headers into the plugin's extract_headers arg
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
        description: First pass header gets a set-header line gated on allowed=true and var found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\]"
        description: Second pass header gets its own set-header line
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header WWW-Authenticate %\\[var\\(txn.hub.external_auth.www_authenticate\\)\\] if \\{ var\\(txn.auth_url\\) -m found \\} !\\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\} \\{ var\\(txn.hub.external_auth.www_authenticate\\) -m found \\}"
        description: First fail header uses http-after-response (fires on deny-generated responses, unlike http-response which only runs on backend responses)
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header X-Error-Reason %\\[var\\(txn.hub.external_auth.x_error_reason\\)\\]"
        description: Second fail header gets its own http-after-response set-header line

