  test-nginx-ingress-external-auth-response-headers:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Nginx Ingress auth-response-headers annotation populates
      auth-extract-headers.map and emits one
      `http-request set-header` per unique header in any ingress's
      pass list, gated on `allowed -m bool` so the headers only flow
      through to the upstream backend on auth success.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User, X-Auth-Roles"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-response-headers annotation
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "protected.example.com/api X-Auth-User, X-Auth-Roles"
        description: auth-extract-headers.map must contain the host+path → comma-list entry
      - type: contains
        target: file:spoe.conf
        pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"
        description: SPOE message body threads txn.auth_extract_headers into the plugin's extract_headers arg
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
        description: First pass header gets a set-header line gated on allowed=true and var found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_roles\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
        description: Second pass header gets its own set-header line

  test-nginx-ingress-external-auth-hostless-rejected:
    # Same as test-nginx-ingress-external-auth: needs the spoa-hub
    # library loaded for the auth-url.map definition (the fail() is
    # triggered while rendering that map's contributions).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Ingress with auth-url annotation AND a host-less rule must fail
      loudly at template-render time. The auth-url map is keyed by
      host+path; host-less rules can't be enforced (the frontend
      lookup uses txn.host_match which is always non-empty for matched
      requests, so the empty-host map entry would never match).
      Silently skipping auth on a route the operator marked protected
      is a security failure mode — fail-loud is the right behaviour.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hostless-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: contains
        target: rendering_error
        pattern: "auth-url set but a rule without a host"
        description: Template render must fail with the host-less error message
      - type: contains
        target: rendering_error
        pattern: "default/hostless-protected"
        description: Error must identify the offending Ingress
