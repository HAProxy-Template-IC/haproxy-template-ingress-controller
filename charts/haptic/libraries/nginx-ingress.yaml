# Nginx Ingress compatibility library for HAPTIC
# Provides support for nginx.ingress.kubernetes.io annotation compatibility
# Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
#
# This library is self-contained and works independently of other annotation libraries.
# All annotations use the nginx.ingress.kubernetes.io/* prefix.
#
# Supported annotations (see each section for details):
#
# Backend Configuration:
#   - proxy-connect-timeout, proxy-read-timeout, proxy-send-timeout
#   - load-balance
#   - proxy-body-size
#   - backend-protocol
#   - use-proxy-protocol
#   - rewrite-target
#   - upstream-hash-by
#   - configuration-snippet
#
# Session Affinity:
#   - affinity: cookie
#   - session-cookie-name, session-cookie-hash, session-cookie-path
#
# Authentication:
#   - auth-type, auth-secret, auth-realm
#
# Rate Limiting:
#   - limit-rps, limit-connections
#
# Frontend Filters:
#   - whitelist-source-range, denylist-source-range
#   - ssl-redirect, force-ssl-redirect
#   - hsts, hsts-max-age, hsts-include-subdomains, hsts-preload
#   - enable-cors, cors-allow-origin, cors-allow-methods, cors-allow-headers
#   - cors-allow-credentials, cors-max-age, cors-expose-headers
#   - custom-request-headers, custom-response-headers
#   - app-root
#   - permanent-redirect, temporal-redirect
#
# Canary:
#   - canary, canary-by-header, canary-by-header-value, canary-by-header-pattern
#   - canary-by-cookie, canary-weight
#
# SSL Features:
#   - ssl-passthrough
#
# mTLS:
#   - auth-tls-pass-certificate-to-upstream, auth-tls-error-page

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.nginxIngress.enabled }}'

watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]

templateSnippets:
  # ============================================================================
  # Backend Directives
  # ============================================================================

  backend-directives-670-nginx-ingress-session-affinity:
    template: |
      {#-
        Nginx Ingress Session Affinity (Cookie Persistence)

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#session-affinity

        Annotations:
          - nginx.ingress.kubernetes.io/affinity: "cookie" (required to enable)
          - nginx.ingress.kubernetes.io/session-cookie-name: "<name>" (default: INGRESSCOOKIE)
          - nginx.ingress.kubernetes.io/session-cookie-hash: "md5|sha1|index" (optional)
          - nginx.ingress.kubernetes.io/session-cookie-path: "<path>" (optional)

        Generated HAProxy Config:
          cookie <name> insert indirect nocache dynamic
          dynamic-cookie-key <sha256-of-ns/name>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var affinity = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/affinity") | fallback("") | tostring() %}
        {%- if affinity == "cookie" %}
          {%- var cookieName = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/session-cookie-name") | fallback("INGRESSCOOKIE") | tostring() %}
          {%- var cookiePath = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/session-cookie-path") | fallback("") | tostring() %}
          {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
          {%- if cookiePath != "" %}
            {#- HAProxy's `cookie` directive does not accept a bare `path`
                keyword (unlike nginx). The supported set is rewrite /
                insert / prefix / indirect / nocache / postonly / domain /
                maxidle / dynamic / maxlife / attr. Use `attr Path=<path>`
                to surface the cookie path attribute on the Set-Cookie
                header HAProxy emits. -#}
            {%- cookieDir = cookieDir + " attr Path=" + cookiePath %}
          {%- end %}
      # nginx-ingress/session-affinity ({{ key }})
      {{ cookieDir }}
      dynamic-cookie-key {{ sha256(key) }}
        {%- end %}
      {%- end -%}

  backend-directives-700-nginx-ingress-timeouts:
    template: |
      {#-
        Nginx Ingress Backend Timeouts

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-timeouts

        Annotations:
          - nginx.ingress.kubernetes.io/proxy-connect-timeout: "<seconds>" (plain number)
          - nginx.ingress.kubernetes.io/proxy-read-timeout: "<seconds>" (plain number)
          - nginx.ingress.kubernetes.io/proxy-send-timeout: "<seconds>" (plain number)

        Note: Nginx values are plain seconds. We append 's' suffix for HAProxy.
        proxy-read-timeout and proxy-send-timeout both map to HAProxy's timeout server.
        If both are set, the larger value is used.

        Generated HAProxy Config:
          timeout connect <val>s
          timeout server <val>s
      -#}
      {%- if ingress != nil %}
        {%- var connectTimeout = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-connect-timeout") | fallback("") | tostring() %}
        {%- var readTimeout = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-read-timeout") | fallback("") | tostring() %}
        {%- var sendTimeout = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-send-timeout") | fallback("") | tostring() %}
        {%- var hasTimeout = connectTimeout != "" || readTimeout != "" || sendTimeout != "" %}
        {%- if hasTimeout %}
      # nginx-ingress/backend-directives-timeouts
        {%- end %}
        {%- if connectTimeout != "" %}
      timeout connect {{ connectTimeout }}s
        {% end %}
        {%- if readTimeout != "" || sendTimeout != "" %}
          {#- Both map to timeout server; use the larger value if both set -#}
          {%- var serverVal = 0 %}
          {%- if readTimeout != "" %}
            {%- serverVal = toint(readTimeout) %}
          {%- end %}
          {%- if sendTimeout != "" %}
            {%- var sendVal = toint(sendTimeout) %}
            {%- if sendVal > serverVal %}
              {%- serverVal = sendVal %}
            {%- end %}
          {%- end %}
      timeout server {{ serverVal }}s
        {% end %}
      {%- end -%}

  backend-directives-710-nginx-ingress-load-balance:
    template: |
      {#-
        Nginx Ingress Load Balancing Algorithm

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-nginx-load-balancing

        Annotation: nginx.ingress.kubernetes.io/load-balance
        Values: round_robin, least_conn, ip_hash, random, ewma

        Mapping to HAProxy:
          round_robin -> roundrobin
          least_conn  -> leastconn
          ip_hash     -> source
          random      -> random
          ewma        -> leastconn (closest equivalent)

        Generated HAProxy Config:
          balance <algorithm>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var lb = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/load-balance") | fallback("") | tostring() %}
        {%- if lb != "" %}
          {%- var algo = "" %}
          {%- if lb == "round_robin" %}
            {%- algo = "roundrobin" %}
          {%- else if lb == "least_conn" %}
            {%- algo = "leastconn" %}
          {%- else if lb == "ip_hash" %}
            {%- algo = "source" %}
          {%- else if lb == "random" %}
            {%- algo = "random" %}
          {%- else if lb == "ewma" %}
            {%- algo = "leastconn" %}
          {%- else %}
            {{- fail("Invalid value '" + lb + "' for annotation 'nginx.ingress.kubernetes.io/load-balance' on Ingress '" + key + "'. Valid values: round_robin, least_conn, ip_hash, random, ewma") -}}
          {%- end %}
      # nginx-ingress/backend-directives-load-balance
      balance {{ algo }}
        {%- end %}
      {%- end -%}

  backend-directives-720-nginx-ingress-proxy-body-size:
    template: |
      {#-
        Nginx Ingress Proxy Body Size Limit

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-max-body-size

        Annotation: nginx.ingress.kubernetes.io/proxy-body-size
        Values: plain number (bytes), or with k/K, m/M, g/G suffix
        Value "0" means unlimited (no directive emitted).

        Generated HAProxy Config:
          http-request deny deny_status 413 if { req.body_size gt <bytes> }
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var bodySize = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-body-size") | fallback("") | tostring() %}
        {%- if bodySize != "" %}
          {%- var bytes = 0 %}
          {%- var sizeLen = len(bodySize) %}
          {%- var lastChar = bodySize[sizeLen-1:] %}
          {%- if lastChar == "k" || lastChar == "K" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1024 %}
          {%- else if lastChar == "m" || lastChar == "M" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1048576 %}
          {%- else if lastChar == "g" || lastChar == "G" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1073741824 %}
          {%- else %}
            {%- bytes = toint(bodySize) %}
          {%- end %}
          {%- if bytes > 0 %}
      # nginx-ingress/backend-directives-proxy-body-size ({{ key }})
      http-request deny deny_status 413 if { req.body_size gt {{ bytes }} }
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-730-nginx-ingress-backend-protocol:
    template: |
      {#-
        Nginx Ingress Backend Protocol

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#backend-protocol

        Annotation: nginx.ingress.kubernetes.io/backend-protocol
        Values: HTTP, HTTPS, GRPC, GRPCS

        Mapping to HAProxy server options:
          HTTP   -> (no additional flags)
          HTTPS  -> ssl verify none
          GRPC   -> proto h2
          GRPCS  -> ssl verify none proto h2

        AJP and FCGI are not supported in HAProxy and will fail with an error.
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var proto = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/backend-protocol") | fallback("") | tostring() %}
        {%- if proto != "" %}
          {%- if proto == "HTTP" %}
            {#- HTTP/1.1 is default, no flag needed -#}
          {%- else if proto == "HTTPS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none") %}
          {%- else if proto == "GRPC" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto h2") %}
          {%- else if proto == "GRPCS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none proto h2") %}
          {%- else if proto == "AJP" %}
            {{- fail("Backend protocol 'AJP' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else if proto == "FCGI" %}
            {{- fail("Backend protocol 'FCGI' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else %}
            {{- fail("Invalid value '" + proto + "' for annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'. Valid values: HTTP, HTTPS, GRPC, GRPCS") -}}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-740-nginx-ingress-proxy-protocol:
    template: |
      {#-
        Nginx Ingress Proxy Protocol to Backend

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#proxy-protocol

        Annotation: nginx.ingress.kubernetes.io/use-proxy-protocol
        Values: "true" | "false"

        When enabled, sends PROXY protocol v2 header to the backend.

        Generated HAProxy Config:
          (appends send-proxy-v2 to server options)
      -#}
      {%- if ingress != nil %}
        {%- var pp = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/use-proxy-protocol") | fallback("") | tostring() %}
        {%- if pp == "true" %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2") %}
        {%- end %}
      {%- end -%}

  backend-directives-750-nginx-ingress-rewrite-target:
    template: |
      {#-
        Nginx Ingress Rewrite Target

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rewrite

        Annotation: nginx.ingress.kubernetes.io/rewrite-target

        Nginx capture groups use $1, $2, etc. HAProxy uses \1, \2, etc.
        This template translates $N to \N in the rewrite target value.

        Generated HAProxy Config:
          http-request replace-path (.*) <translated-value>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var rewrite = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/rewrite-target") | fallback("") | tostring() %}
        {%- if rewrite != "" %}
          {#- Translate $1..$9 capture groups to \1..\9 -#}
          {%- rewrite = replace(rewrite, "$1", "\\1") %}
          {%- rewrite = replace(rewrite, "$2", "\\2") %}
          {%- rewrite = replace(rewrite, "$3", "\\3") %}
          {%- rewrite = replace(rewrite, "$4", "\\4") %}
          {%- rewrite = replace(rewrite, "$5", "\\5") %}
          {%- rewrite = replace(rewrite, "$6", "\\6") %}
          {%- rewrite = replace(rewrite, "$7", "\\7") %}
          {%- rewrite = replace(rewrite, "$8", "\\8") %}
          {%- rewrite = replace(rewrite, "$9", "\\9") %}
      # nginx-ingress/backend-directives-rewrite-target ({{ key }})
      http-request replace-path (.*) {{ rewrite }}
        {%- end %}
      {%- end -%}

  # External-auth (auth-url) map contribution. The spoa-hub library
  # defines auth-url.map and the SPOE wiring; this snippet feeds the
  # map with one entry per ingress+path that has the auth-url
  # annotation set. The frontend then looks up the URL by host+path
  # (matching the existing routing key) and triggers the SPOE plugin.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-url: "https://auth-svc.example/check"
  #
  # Out of scope (need upstream plugin / chart-architecture work):
  #   - auth-proxy-set-headers (plugin v0.3.0+ supports per-request
  #     forward_headers, but nginx-ingress's `auth-snippet` is
  #     freeform HAProxy config injection — not parseable into a
  #     header allowlist; haproxy-ingress flavour wires this via
  #     auth-headers-request)
  map-auth-url-500-nginx-ingress:
    template: |-
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authUrl = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-url") | fallback("") | tostring() -%}
        {%- if authUrl != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) -%}
            {%- var host = rule | dig("host") | fallback("") | tostring() -%}
            {#- Host-less ingress rules (rule without `host`) match all hosts in
                Kubernetes, but the frontend lookup key here is `host_match+path`
                — there's no way to derive the matching map key without
                enumerating every possible host. Fail loud rather than silently
                dropping auth: skipping auth on a route the operator marked as
                protected is a security failure mode. -#}
            {%- if host == "" -%}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-url set but a rule without a host. The auth-url map is keyed by host+path; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end -%}
            {%- for _, path := range rule | dig("http", "paths") | fallback([]any{}) -%}
              {%- var pathStr = path | dig("path") | fallback("") | tostring() -%}
      {{ "\n" }}{{ host }}{{ pathStr }} {{ authUrl }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth sign-in URL: when the auth service returns 401, redirect
  # the browser to this URL instead of denying. Standard pattern for
  # OIDC / SAML flows where unauthenticated users go to a login page.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-signin: "https://login.example/oauth2/start?rd=$escaped_request_uri"
  #
  # Note: HAProxy doesn't expand nginx variables ($escaped_request_uri etc.)
  # at redirect time; the URL is used verbatim. Operators wanting the
  # original-request preservation pattern need to add a query param via
  # the SPOA hub plugin (or use a redirect-aware auth service like
  # oauth2-proxy that handles it server-side).
  map-auth-signin-500-nginx-ingress:
    template: |-
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authSignin = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-signin") | fallback("") | tostring() -%}
        {%- if authSignin != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) -%}
            {%- var host = rule | dig("host") | fallback("") | tostring() -%}
            {%- if host == "" -%}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-signin set but a rule without a host. The auth-signin map is keyed by host+path; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end -%}
            {%- for _, path := range rule | dig("http", "paths") | fallback([]any{}) -%}
              {%- var pathStr = path | dig("path") | fallback("") | tostring() -%}
      {{ "\n" }}{{ host }}{{ pathStr }} {{ authSignin }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth HTTP method override. Picked up by the spoa-hub
  # library's auth-method.map and threaded into the SPOE check-auth
  # message's `method` arg (plugin v0.3.0+). Without this annotation
  # the plugin uses its plugin-level method config (default GET).
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-method: "POST"
  #
  # The plugin allowlists GET / HEAD / POST / PUT / PATCH / DELETE /
  # OPTIONS; values outside that set produce an SPOE-side validation
  # error. Body-having methods (POST/PUT/PATCH) go out with an empty
  # body — the plugin does not forward the original request payload.
  map-auth-method-500-nginx-ingress:
    template: |-
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var authMethod = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-method") | fallback("") | tostring() -%}
        {%- if authMethod != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) -%}
            {%- var host = rule | dig("host") | fallback("") | tostring() -%}
            {%- if host == "" -%}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-method set but a rule without a host. The auth-method map is keyed by host+path; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end -%}
            {%- for _, path := range rule | dig("http", "paths") | fallback([]any{}) -%}
              {%- var pathStr = path | dig("path") | fallback("") | tostring() -%}
      {{ "\n" }}{{ host }}{{ pathStr }} {{ authMethod }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth response-headers allowlist. Per-ingress comma-list of
  # response header names the SPOA hub should extract from the auth
  # reply and forward to the upstream backend on successful auth.
  # Lands in auth-extract-headers.map (which the spoa-hub library
  # threads into the SPOE message's `extract_headers` arg) and the
  # frontend-spoe-set-pass-headers-* extension point below emits one
  # `http-request set-header` per unique header.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#external-authentication
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User, X-Auth-Roles"
  #
  # Plugin v0.3.0+ extracts headers on every reply path (2xx, 3xx,
  # 4xx, 5xx) and exposes each as a transaction variable
  # `txn.hub.external_auth.<name>` (lower-cased, dashes → underscores).
  # The set-header directives are gated on `allowed -m bool` so they
  # only fire on auth success.
  map-auth-extract-headers-500-nginx-ingress:
    template: |-
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var passHeaders = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-response-headers") | fallback("") | tostring() -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) -%}
            {%- var host = rule | dig("host") | fallback("") | tostring() -%}
            {%- if host == "" -%}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-response-headers set but a rule without a host. The auth-extract-headers map is keyed by host+path; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end -%}
            {%- for _, path := range rule | dig("http", "paths") | fallback([]any{}) -%}
              {%- var pathStr = path | dig("path") | fallback("") | tostring() -%}
      {{ "\n" }}{{ host }}{{ pathStr }} {{ passHeaders }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Companion to map-auth-extract-headers-500-nginx-ingress: emit one
  # `http-request set-header` line per UNIQUE header across all
  # ingresses with auth-response-headers, so the plugin's extracted
  # txn vars get forwarded to the upstream backend on successful
  # auth. Per-route gating happens implicitly: the plugin only sets a
  # txn var when the header is in that route's per-ingress
  # extract_headers SPOE arg AND the auth response actually included
  # it. Routes that didn't ask for the header just see the
  # set-header skipped via `var ... -m found`.
  frontend-spoe-set-pass-headers-500-nginx-ingress:
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var passHeaders = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-response-headers") | fallback("") | tostring() -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var ingressName = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- for _, h := range split(passHeaders, ",") -%}
            {%- var name = h | strip() -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "nginx.ingress.kubernetes.io/auth-response-headers", ns, ingressName) -}}
              {#- Dedupe on varName (after dash→underscore) so
                  spellings that collapse to the same plugin txn var
                  produce one set-header directive, not two. -#}
              {%- var varName = replace(toLower(name), "-", "_") -%}
              {%- if first_seen("nginx-ingress-pass-header", varName) -%}
      {{ "\n" }}      http-request set-header {{ name }} %[var(txn.hub.external_auth.{{ varName }})] if { var(txn.hub.external_auth.{{ varName }}) -m found } { var(txn.hub.external_auth.allowed) -m bool }
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  backend-directives-760-nginx-ingress-auth:
    template: |
      {#-
        Nginx Ingress Basic Auth Backend Directive

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-type: "basic" (required)
          - nginx.ingress.kubernetes.io/auth-secret: "<ns/name>" or "<name>" (required)
          - nginx.ingress.kubernetes.io/auth-realm: "<realm>" (optional, default: "Restricted")

        Only auth-type "basic" is supported. Other types will fail with an error.

        Generates:
          http-request auth realm "<realm>" unless { http_auth(ni_auth_<secretNs>_<secretName>) }
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var authType = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-type") | fallback("") | tostring() %}
        {%- if authType != "" %}
          {%- if authType != "basic" %}
            {{- fail("Unsupported auth-type '" + authType + "' for annotation 'nginx.ingress.kubernetes.io/auth-type' on Ingress '" + key + "'. Only 'basic' is supported.") -}}
          {%- end %}
          {%- var authSecret = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-secret") | fallback("") | tostring() %}
          {%- if authSecret != "" %}
            {%- var authRealm = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-realm") | fallback("Restricted") | tostring() %}
            {%- var secretNs = ns %}
            {%- var secretName = authSecret %}
            {%- if strings_contains(authSecret, "/") %}
              {%- var parts = split(authSecret, "/") %}
              {%- secretNs = parts[0] %}
              {%- secretName = parts[1] %}
            {%- end %}
            {%- var userlistName = "ni_auth_" + secretNs + "_" + secretName %}
            {#-
              Skip the http_auth ACL ref when the referenced Secret isn't in
              the controller's cache; the matching userlist snippet skips its
              userlist on the same condition so the rendered config stays
              self-consistent.

              The Secret lookup goes through shared.ComputeIfAbsent so both
              this snippet and the userlist snippet (which runs in a separate
              section earlier in the render) see the same answer. Stores are
              live during render, so a direct GetSingle in each snippet can
              observe different states if the informer lands an update
              between the two reads — that's the race commit 60e867fd
              guarded against at the call sites but didn't make coherent.
            -#}
            {%- var nginxAuthSecret, _ = shared.ComputeIfAbsent("nginx_auth_secret:" + secretNs + "/" + secretName, func() any {
              return resources.secrets.GetSingle(secretNs, secretName)
            }) %}
            {%- if nginxAuthSecret != nil %}
      # nginx-ingress/backend-directives-auth ({{ key }})
      http-request auth realm "{{ authRealm }}" unless { http_auth({{ userlistName }}) }
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-770-nginx-ingress-rate-limiting:
    template: |
      {#-
        Nginx Ingress Rate Limiting

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rate-limiting

        Annotations:
          - nginx.ingress.kubernetes.io/limit-rps: "<requests-per-second>"
          - nginx.ingress.kubernetes.io/limit-connections: "<connections>"

        If both are set, limit-rps takes precedence (HAProxy only supports one
        stick-table per backend). A comment notes the limitation.

        For limit-rps:
          stick-table type ip size 100k expire 1s store http_req_rate(1s)
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_http_req_rate(0) gt <rps> }

        For limit-connections:
          stick-table type ip size 100k expire 30s store conn_cur
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_conn_cur(0) gt <connections> }
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var limitRps = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/limit-rps") | fallback("") | tostring() %}
        {%- var limitConn = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/limit-connections") | fallback("") | tostring() %}
        {%- if limitRps != "" %}
          {%- if limitConn != "" %}
      # nginx-ingress/rate-limiting ({{ key }}) - limit-rps takes precedence; limit-connections ignored (HAProxy supports one stick-table per backend)
          {%- else %}
      # nginx-ingress/rate-limiting ({{ key }})
          {%- end %}
      stick-table type ip size 100k expire 1s store http_req_rate(1s)
      http-request track-sc0 src
      http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ limitRps }} }
        {%- else if limitConn != "" %}
      # nginx-ingress/rate-limiting ({{ key }})
      stick-table type ip size 100k expire 30s store conn_cur
      http-request track-sc0 src
      http-request deny deny_status 429 if { sc_conn_cur(0) gt {{ limitConn }} }
        {%- end %}
      {%- end -%}

  backend-directives-780-nginx-ingress-upstream-hash:
    template: |
      {#-
        Nginx Ingress Upstream Hash-Based Load Balancing

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-nginx-upstream-hashing

        Annotation: nginx.ingress.kubernetes.io/upstream-hash-by

        Translates nginx variables to HAProxy fetches:
          $request_uri  -> url
          $remote_addr  -> src
          $cookie_XXXX  -> req.cook(XXXX)
          $http_xxxx    -> req.hdr(xxxx) (underscores replaced with hyphens)
          $arg_XXXX     -> url_param(XXXX)

        If the value starts with $ but doesn't match known patterns, fails with error.
        If the value doesn't start with $, it's passed through as-is (assumed HAProxy fetch).

        Generated HAProxy Config:
          balance hash <expr>
          hash-type consistent
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var hashBy = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/upstream-hash-by") | fallback("") | tostring() %}
        {%- if hashBy != "" %}
          {%- var expr = "" %}
          {%- if hashBy == "$request_uri" %}
            {%- expr = "url" %}
          {%- else if hashBy == "$remote_addr" %}
            {%- expr = "src" %}
          {%- else if hasPrefix(hashBy, "$cookie_") %}
            {%- expr = "req.cook(" + hashBy[8:] + ")" %}
          {%- else if hasPrefix(hashBy, "$http_") %}
            {%- var hdrName = replace(hashBy[6:], "_", "-") %}
            {%- expr = "req.hdr(" + hdrName + ")" %}
          {%- else if hasPrefix(hashBy, "$arg_") %}
            {%- expr = "url_param(" + hashBy[5:] + ")" %}
          {%- else if hasPrefix(hashBy, "$") %}
            {{- fail("Unsupported nginx variable '" + hashBy + "' for annotation 'nginx.ingress.kubernetes.io/upstream-hash-by' on Ingress '" + key + "'. Supported: $request_uri, $remote_addr, $cookie_XXXX, $http_xxxx, $arg_XXXX") -}}
          {%- else %}
            {#- Not a nginx variable, pass through as HAProxy fetch -#}
            {%- expr = hashBy %}
          {%- end %}
      # nginx-ingress/backend-directives-upstream-hash ({{ key }})
      balance hash {{ expr }}
      hash-type consistent
        {%- end %}
      {%- end -%}

  backend-directives-900-nginx-ingress-config-snippet:
    template: |
      {#-
        Nginx Ingress Backend Configuration Snippet

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#configuration-snippet

        Annotation: nginx.ingress.kubernetes.io/configuration-snippet
        Allows injecting raw HAProxy directives into the backend.
      -#}
      {%- if ingress != nil %}
        {%- var snippet = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/configuration-snippet") | fallback("") %}
        {%- if snippet != "" %}
      # nginx-ingress/configuration-snippet
      {{ snippet }}
        {%- end %}
      {%- end -%}

  # ============================================================================
  # Frontend Filters
  # ============================================================================

  frontend-filters-700-nginx-ingress-access-control:
    template: |
      {#-
        Nginx Ingress Access Control Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#whitelist-source-range

        Annotations:
          - nginx.ingress.kubernetes.io/whitelist-source-range: "CIDR,CIDR,..." (optional)
          - nginx.ingress.kubernetes.io/denylist-source-range: "CIDR,CIDR,..." (optional)

        Generated HAProxy Config:
          acl <name> src <cidrs>
          http-request deny if <host-match> !<acl>    (for allowlist)
          http-request deny if <host-match> <acl>     (for denylist)
      -#}
      {%- import "util-emit-annotation-access-control" for EmitAnnotationAccessControl -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {{ EmitAnnotationAccessControl(ingress,
            "nginx.ingress.kubernetes.io/whitelist-source-range",
            "nginx.ingress.kubernetes.io/denylist-source-range",
            "ni",
            "nginx-ingress/whitelist-source-range ({KEY})",
            "nginx-ingress/denylist-source-range ({KEY})") }}
      {%- end -%}

  frontend-filters-710-nginx-ingress-ssl-redirect:
    template: |
      {#-
        Nginx Ingress SSL Redirect Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#server-side-https-enforcement-through-redirect

        Annotations:
          - nginx.ingress.kubernetes.io/ssl-redirect: "true|false" (code 301)
          - nginx.ingress.kubernetes.io/force-ssl-redirect: "true|false" (code 308)

        If both are set, force-ssl-redirect takes precedence (code 308).

        Generated HAProxy Config:
          http-request redirect scheme https code <code> if !{ ssl_fc } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var sslRedirect = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/ssl-redirect") | fallback("") | tostring() %}
          {%- var forceSslRedirect = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/force-ssl-redirect") | fallback("") | tostring() %}
          {%- var code = "" %}
          {%- if forceSslRedirect == "true" %}
            {%- code = "308" %}
          {%- else if sslRedirect == "true" %}
            {%- code = "301" %}
          {%- end %}
          {%- if code != "" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # nginx-ingress/ssl-redirect ({{ key }})
      http-request redirect scheme https code {{ code }} if !{ ssl_fc } {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-720-nginx-ingress-hsts:
    template: |
      {#-
        Nginx Ingress HSTS Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#http-strict-transport-security

        Annotations:
          - nginx.ingress.kubernetes.io/hsts: "true|false" (optional)
          - nginx.ingress.kubernetes.io/hsts-max-age: "<seconds>" (optional, default: 15724800)
          - nginx.ingress.kubernetes.io/hsts-include-subdomains: "true|false" (optional)
          - nginx.ingress.kubernetes.io/hsts-preload: "true|false" (optional)

        Generated HAProxy Config:
          http-response set-header Strict-Transport-Security "max-age=<age>[; includeSubDomains][; preload]" if { ssl_fc } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var hstsEnabled = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/hsts") | fallback("") | tostring() %}
          {%- if hstsEnabled == "true" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
              {%- var maxAge = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/hsts-max-age") | fallback("15724800") | tostring() %}
              {%- var includeSubdomains = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/hsts-include-subdomains") | fallback("") | tostring() %}
              {%- var preload = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/hsts-preload") | fallback("") | tostring() %}
              {%- var hstsValue = "max-age=" + maxAge %}
              {%- if includeSubdomains == "true" %}{%- hstsValue = hstsValue + "; includeSubDomains" %}{%- end %}
              {%- if preload == "true" %}{%- hstsValue = hstsValue + "; preload" %}{%- end %}
      # nginx-ingress/hsts ({{ key }})
      http-response set-header Strict-Transport-Security "{{ hstsValue }}" if { ssl_fc } {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-730-nginx-ingress-cors:
    template: |
      {#-
        Nginx Ingress CORS Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#enable-cors

        Annotations:
          - nginx.ingress.kubernetes.io/enable-cors: "true|false" (required to enable)
          - nginx.ingress.kubernetes.io/cors-allow-origin: "<origin>" (default: *)
          - nginx.ingress.kubernetes.io/cors-allow-methods: "<methods>" (default: GET, PUT, POST, DELETE, PATCH, OPTIONS)
          - nginx.ingress.kubernetes.io/cors-allow-headers: "<headers>" (default: DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization)
          - nginx.ingress.kubernetes.io/cors-allow-credentials: "true|false" (optional)
          - nginx.ingress.kubernetes.io/cors-max-age: "<seconds>" (default: 1728000)
          - nginx.ingress.kubernetes.io/cors-expose-headers: "<headers>" (optional)

        Generated HAProxy Config:
          http-response add-header Access-Control-Allow-Origin <origin> if <host-match>
          http-response add-header Access-Control-Allow-Methods <methods> if <host-match> METH_OPTIONS
          ... (other CORS headers)
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var corsEnabled = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/enable-cors") | fallback("") | tostring() %}
          {%- if corsEnabled == "true" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
              {%- var origin = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-allow-origin") | fallback("*") | tostring() %}
              {%- var methods = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-allow-methods") | fallback("GET, PUT, POST, DELETE, PATCH, OPTIONS") | tostring() %}
              {%- var headers = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-allow-headers") | fallback("DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization") | tostring() %}
              {%- var credentials = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-allow-credentials") | fallback("") | tostring() %}
              {%- var exposeHeaders = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-expose-headers") | fallback("") | tostring() %}
              {%- var maxAge = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/cors-max-age") | fallback("1728000") | tostring() %}
              {%- var cond = HostMatchCondition(hosts) %}
      # nginx-ingress/cors ({{ key }})
      http-response add-header Access-Control-Allow-Origin '{{ origin }}' if {{ cond }}
      http-response add-header Access-Control-Allow-Methods '{{ methods }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Allow-Headers '{{ headers }}' if {{ cond }} METH_OPTIONS
      http-response add-header Access-Control-Max-Age '{{ maxAge }}' if {{ cond }} METH_OPTIONS
              {% if credentials == "true" %}
      http-response add-header Access-Control-Allow-Credentials 'true' if {{ cond }}
              {% end %}
              {% if exposeHeaders != "" %}
      http-response add-header Access-Control-Expose-Headers '{{ exposeHeaders }}' if {{ cond }}
              {% end %}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-740-nginx-ingress-custom-headers:
    template: |
      {#-
        Nginx Ingress Custom Headers

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-headers

        Annotations:
          - nginx.ingress.kubernetes.io/custom-request-headers: "name:value|name:value|..."
          - nginx.ingress.kubernetes.io/custom-response-headers: "name:value|name:value|..."

        Format: Pipe-separated list of header:value pairs.

        Generated HAProxy Config:
          http-request set-header <name> <value> if <host-match>
          http-response set-header <name> <value> if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var reqHeaders = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/custom-request-headers") | fallback("") | tostring() %}
          {%- var respHeaders = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/custom-response-headers") | fallback("") | tostring() %}
          {%- var hosts = []any{} %}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
            {%- var h = rule | dig("host") %}
            {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- if reqHeaders != "" %}
      # nginx-ingress/custom-request-headers ({{ key }})
              {%- for _, header := range split(reqHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
      http-request set-header {{ headerName }} '{{ headerValue }}' if {{ HostMatchCondition(hosts) }}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if respHeaders != "" %}
      # nginx-ingress/custom-response-headers ({{ key }})
              {%- for _, header := range split(respHeaders, "|") %}
                {%- var headerTrimmed = trimSpace(header) %}
                {%- if headerTrimmed != "" %}
                  {%- var parts = split(headerTrimmed, ":") %}
                  {%- if len(parts) >= 2 %}
                    {%- var headerName = trimSpace(parts[0]) %}
                    {%- var headerValue = trimSpace(join(parts[1:], ":")) %}
      http-response set-header {{ headerName }} '{{ headerValue }}' if {{ HostMatchCondition(hosts) }}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-750-nginx-ingress-app-root:
    template: |
      {#-
        Nginx Ingress App Root Annotation

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rewrite

        Annotation: nginx.ingress.kubernetes.io/app-root

        Redirects requests to / to the specified path.

        Generated HAProxy Config:
          http-request redirect location <path> code 302 if { path / } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var appRoot = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/app-root") | fallback("") | tostring() %}
          {%- if appRoot != "" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # nginx-ingress/app-root ({{ key }})
      http-request redirect location {{ appRoot }} code 302 if { path / } {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-760-nginx-ingress-permanent-redirect:
    template: |
      {#-
        Nginx Ingress Permanent Redirect

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#permanent-redirect

        Annotation: nginx.ingress.kubernetes.io/permanent-redirect

        Redirects all requests to the specified URL with code 301.

        Generated HAProxy Config:
          http-request redirect location <url> code 301 if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var url = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/permanent-redirect") | fallback("") | tostring() %}
          {%- if url != "" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # nginx-ingress/permanent-redirect ({{ key }})
      http-request redirect location {{ url }} code 301 if {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-770-nginx-ingress-temporal-redirect:
    template: |
      {#-
        Nginx Ingress Temporal Redirect

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#temporal-redirect

        Annotation: nginx.ingress.kubernetes.io/temporal-redirect

        Redirects all requests to the specified URL with code 302.

        Generated HAProxy Config:
          http-request redirect location <url> code 302 if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var url = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/temporal-redirect") | fallback("") | tostring() %}
          {%- if url != "" %}
            {%- var hosts = []any{} %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
            {%- end %}
            {%- if len(hosts) > 0 %}
      # nginx-ingress/temporal-redirect ({{ key }})
      http-request redirect location {{ url }} code 302 if {{ HostMatchCondition(hosts) }}
            {%- end %}
          {%- end %}
      {%- end -%}

  frontend-filters-780-nginx-ingress-canary:
    template: |
      {#-
        Nginx Ingress Canary Annotations

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#canary

        Annotations (on canary Ingress, with canary: "true"):
          - nginx.ingress.kubernetes.io/canary: "true" (required)
          - nginx.ingress.kubernetes.io/canary-by-header: "<header-name>" (optional)
          - nginx.ingress.kubernetes.io/canary-by-header-value: "<value>" (optional, default: "always")
          - nginx.ingress.kubernetes.io/canary-by-header-pattern: "<regex>" (optional)
          - nginx.ingress.kubernetes.io/canary-by-cookie: "<cookie-name>" (optional)
          - nginx.ingress.kubernetes.io/canary-weight: "<0-100>" (optional)

        Priority order: header > cookie > weight

        The canary Ingress must share a host with a non-canary (main) Ingress.
        use_backend rules are generated in the frontend for the matching host.

        Generated HAProxy Config:
          use_backend <canary-backend> if { req.hdr(<header>) -m str <value> } <host-match>
          use_backend <canary-backend> if { req.cook(<cookie>) -m str always } <host-match>
          use_backend <canary-backend> if { rand(100) lt <weight> } <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var isCanary = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary") | fallback("") | tostring() %}
        {%- if isCanary == "true" %}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
          {%- var key = ns + "/" + name %}
            {#- Extract hosts and find the first backend name from this canary ingress -#}
            {%- var hosts = []any{} %}
            {%- var canaryBackend = "" %}
            {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
              {%- var h = rule | dig("host") %}
              {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
              {%- if canaryBackend == "" %}
                {%- var http = rule | dig("http") %}
                {%- if http != nil %}
                  {%- var paths []any = http | dig("paths") | toSlice() %}
                  {%- if len(paths) > 0 %}
                    {%- canaryBackend = BackendNameIngress(ingress, paths[0]) %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if len(hosts) > 0 && canaryBackend != "" %}
              {%- var cond = HostMatchCondition(hosts) %}
              {%- var canaryHeader = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary-by-header") | fallback("") | tostring() %}
              {%- var canaryHeaderValue = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary-by-header-value") | fallback("") | tostring() %}
              {%- var canaryHeaderPattern = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary-by-header-pattern") | fallback("") | tostring() %}
              {%- var canaryCookie = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary-by-cookie") | fallback("") | tostring() %}
              {%- var canaryWeight = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/canary-weight") | fallback("") | tostring() %}
      # nginx-ingress/canary ({{ key }})
              {%- if canaryHeader != "" %}
                {%- if canaryHeaderPattern != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m reg {{ canaryHeaderPattern }} } {{ cond }}
                {%- else if canaryHeaderValue != "" %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str {{ canaryHeaderValue }} } {{ cond }}
                {%- else %}
      use_backend {{ canaryBackend }} if { req.hdr({{ canaryHeader }}) -m str always } {{ cond }}
                {%- end %}
              {%- end %}
              {%- if canaryCookie != "" %}
      use_backend {{ canaryBackend }} if { req.cook({{ canaryCookie }}) -m str always } {{ cond }}
              {%- end %}
              {%- if canaryWeight != "" %}
      use_backend {{ canaryBackend }} if { rand(100) lt {{ canaryWeight }} } {{ cond }}
              {%- end %}
            {%- end %}
        {%- end %}
      {%- end -%}

  frontend-filters-790-nginx-ingress-mtls-error:
    template: |
      {#-
        Nginx Ingress mTLS Error Page and Certificate Passthrough

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#client-certificate-authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-tls-error-page: "<url>" (optional)
          - nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true|false" (optional)

        Generated HAProxy Config:
          http-request redirect location <url> code 302 if { ssl_c_verify gt 0 } <host-match>
          http-request set-header ssl-client-cert %[ssl_c_der,base64] if <host-match>
          http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if <host-match>
      -#}
      {%- import "util-ingress-helpers" for HostMatchCondition -%}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
          {%- var hosts = []any{} %}
          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
            {%- var h = rule | dig("host") %}
            {%- if h != nil %}{%- hosts = append(hosts, h) %}{%- end %}
          {%- end %}
          {%- if len(hosts) > 0 %}
            {%- var errorPage = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-tls-error-page") | fallback("") | tostring() %}
            {%- var passCert = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream") | fallback("") | tostring() %}
            {%- var cond = HostMatchCondition(hosts) %}
            {%- if errorPage != "" %}
              {#- Inline URL guard: this snippet renders via the
                  always-compiled `frontend-filters-*` glob, so it
                  can't import util macros from spoa-hub.yaml (opt-in
                  library, absent under default values — Scriggo
                  would fail to resolve the import at compile time). -#}
              {%- if strings_contains(errorPage, "\n") || strings_contains(errorPage, "\r") || strings_contains(errorPage, " ") || strings_contains(errorPage, "\t") -%}
                {{- fail("Invalid URL in annotation 'nginx.ingress.kubernetes.io/auth-tls-error-page' on Ingress " + ns + "/" + name + ": value contains whitespace or newlines. URLs must not contain whitespace — they are interpolated into HAProxy directives where whitespace is significant and could be used to inject arbitrary config.") -}}
              {%- end %}
      # nginx-ingress/auth-tls-error-page ({{ key }})
      http-request redirect location {{ errorPage }} code 302 if { ssl_c_verify gt 0 } {{ cond }}
            {%- end %}
            {%- if passCert == "true" %}
      # nginx-ingress/auth-tls-pass-certificate-to-upstream ({{ key }})
      http-request set-header ssl-client-cert %[ssl_c_der,base64] if {{ cond }}
      http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if {{ cond }}
            {%- end %}
          {%- end %}
      {%- end -%}

  # ============================================================================
  # SSL Passthrough
  # ============================================================================

  util-nginx-ingress-ssl-passthrough:
    template: |
      {#- Caches SSL passthrough backends from nginx.ingress.kubernetes.io/ssl-passthrough annotations.
          Build logic lives in annotation-compat.yaml's BuildAnnotationSSLPassthrough macro;
          this snippet only owns the per-library cache key and naming-convention parameters. -#}
      {%- import "util-build-annotation-ssl-passthrough" for BuildAnnotationSSLPassthrough %}
      {%%
        var _, _ = shared.ComputeIfAbsent("ni_sslPassthrough", func() any {
          var sslData = map[string]any{"backends": []any{}}
          BuildAnnotationSSLPassthrough(sslData,
            "nginx.ingress.kubernetes.io/ssl-passthrough",
            "ssl-passthrough-ni-",
            "ni_sslPassthrough_host")
          return sslData
        })
      %%}

  features-100-nginx-ingress-ssl-passthrough:
    template: |
      {#-
        Nginx Ingress SSL Passthrough Registration

        Annotation: nginx.ingress.kubernetes.io/ssl-passthrough: "true"

        Registers SSL passthrough backends with global feature registry.
        The ssl.yaml library consumes these to generate:
          - TCP frontend for SNI-based routing
          - SSL passthrough backends

        Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#ssl-passthrough
      -#}
      {{ render "util-nginx-ingress-ssl-passthrough" }}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var sslBackends = gf | dig("sslPassthroughBackends") %}
      {%- if sslBackends != nil %}
        {%- var niVal, _ = shared.ComputeIfAbsent("ni_sslPassthrough", func() any { return nil }) %}
        {%- if niVal != nil %}
          {%- var niBackends = niVal.(map[string]any)["backends"].([]any) %}
          {%- for _, backend := range niBackends %}
            {%- gf["sslPassthroughBackends"] = append(gf["sslPassthroughBackends"].([]any), backend) %}
          {%- end %}
        {%- end %}
      {%- end %}

  features-110-nginx-ingress-mtls:
    template: |
      {#-
        Nginx Ingress Client-Cert Verification Registration

        Annotations:
          - nginx.ingress.kubernetes.io/auth-tls-secret: "<name>" or "<ns>/<name>"
            (kubernetes.io/tls Secret with `ca.crt` containing the CA bundle
            that signed the clients' certificates)
          - nginx.ingress.kubernetes.io/auth-tls-verify-client: "on" | "off" |
            "optional" | "optional_no_ca" (default: "on")

        Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#client-certificate-authentication

        Looks up each referenced Secret, writes its `ca.crt` to the SSL
        cert dir via fileRegistry (path becomes `ssl/<ns>-<name>-client-ca.pem`),
        and registers per-host config in `gf["clientCertVerifyHosts"]`.
        ssl.yaml's `features-150-ssl-crtlist` reads that map and emits a
        crt-list line with `[ca-file <path> verify <mode>]` for each
        affected host, so HAProxy verifies incoming client certs against
        the configured CA.

        nginx-ingress's `auth-tls-verify-depth` is intentionally NOT
        wired: HAProxy's crt-list does not expose a per-line verify-depth
        option (depth is global, controlled at the bind level). Operators
        needing a strict depth can rely on the CA bundle scope: only
        certs signed within the bundle's chain depth are accepted.

        Verify-client value mapping (nginx → HAProxy):
          - on               → verify required
          - off              → no entry registered (host falls through to
                               default crt-list line, no client-cert verify)
          - optional         → verify optional
          - optional_no_ca   → verify optional (HAProxy doesn't have a
                               distinct mode for "verify but accept invalid";
                               operators wanting to accept self-signed
                               certs should set verify=optional and inspect
                               ssl_c_used in their auth-tls-error-page logic)
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var secretRef = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-tls-secret") | fallback("") | tostring() %}
        {%- if secretRef != "" %}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
          {%- var verifyClient = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-tls-verify-client") | fallback("on") | tostring() | toLower() %}
          {%- if verifyClient == "off" %}
            {%- continue %}
          {%- end %}
          {%- var verifyMode = "" %}
          {%- if verifyClient == "on" %}
            {%- verifyMode = "required" %}
          {%- else if verifyClient == "optional" || verifyClient == "optional_no_ca" %}
            {%- verifyMode = "optional" %}
          {%- else %}
            {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-tls-verify-client=" + verifyClient + " which is not one of 'on', 'off', 'optional', 'optional_no_ca'.") -}}
          {%- end %}

          {%- var secretNs = ns %}
          {%- var secretName = secretRef %}
          {%- if strings_contains(secretRef, "/") %}
            {%- var parts = split(secretRef, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var secret = resources.secrets.GetSingle(secretNs, secretName) %}
          {%- if secret == nil %}
            {#- See the matching block in haproxy-ingress.yaml for why we
                skip-and-continue rather than fail() here: a missing
                referenced Secret on one Ingress should not cascade to
                webhook-rejection of every other Ingress in the cluster. -#}
            # WARNING nginx.ingress.kubernetes.io/auth-tls-secret: Secret '{{ secretNs }}/{{ secretName }}' referenced on Ingress {{ ns }}/{{ name }} not found at render time; skipping mTLS for this ingress.
            {%- continue %}
          {%- end %}
          {%- var caBundleB64 = secret | dig("data", "ca.crt") | fallback("") | tostring() %}
          {%- if caBundleB64 == "" %}
            # WARNING nginx.ingress.kubernetes.io/auth-tls-secret: Secret '{{ secretNs }}/{{ secretName }}' (referenced on Ingress {{ ns }}/{{ name }}) is missing data.ca.crt; skipping mTLS for this ingress.
            {%- continue %}
          {%- end %}
          {%- var caBundle = caBundleB64 | b64decode() | tostring() %}
          {#- Register the CA bundle as a "file" (general/) not "cert" (ssl/).
              The Dataplane API's SSL cert endpoint validates ssl/ uploads as
              cert+key bundles ("file should contain both certificate and
              private key" / 500), but a CA bundle has no private key. -#}
          {%- var caFilename = secretNs + "-" + secretName + "-client-ca.pem" %}
          {%- var _, regErr = fileRegistry.Register("file", caFilename, caBundle) -%}
          {%- if regErr != nil -%}
            {{- fail("failed to register client CA " + caFilename + ": " + tostring(regErr)) -}}
          {%- end -%}
          {%- var caPath, _ = pathResolver.GetPath(caFilename, "file") %}

          {%- for _, rule := range ingress | dig("spec", "rules") | fallback([]any{}) %}
            {%- var host = rule | dig("host") | fallback("") | tostring() %}
            {%- if host == "" %}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-tls-secret set but a rule without a host. Client-cert verification is keyed by SNI / host; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end %}
            {%- gf["clientCertVerifyHosts"].(map[string]any)[host] = map[string]any{
              "ca_path": caPath,
              "verify_mode": verifyMode,
            } %}
          {%- end %}
        {%- end %}
      {%- end %}

  backends-501-nginx-ingress-ssl-passthrough:
    template: |
      {#-
        Nginx Ingress SSL Passthrough Backends

        Generates TCP mode backends for Ingress resources with
        nginx.ingress.kubernetes.io/ssl-passthrough: "true" annotation.

        Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#ssl-passthrough
      -#}
      {%- import "util-backend-servers" for BackendServers -%}
      {{ render "util-nginx-ingress-ssl-passthrough" }}
      {%- var niVal, _ = shared.ComputeIfAbsent("ni_sslPassthrough", func() any { return nil }) %}
      {%- if niVal == nil %}{% return %}{% end %}
      {%- var sslData = niVal.(map[string]any) %}
      {%- var backends = sslData["backends"].([]any) %}
      {#- BuildAnnotationSSLPassthrough captures svcName/svcPort upfront so
          the use_backend (in ssl-tcp) and the backend block here both come
          from the same iteration of the resource store. Looking the
          ingress up again here would re-introduce the dry-run race that
          flaked TestIngressAnnotations/nginx-ssl-passthrough on !893. -#}
      {%- for _, backendInfo := range backends %}
        {%- var info = backendInfo.(map[string]any) %}
        {%- var beNs = info["namespace"] | tostring() %}
        {%- var beIngress = info["ingress"] | tostring() %}
        {%- var beName = info["name"] | tostring() %}
        {%- var svcName = info["svcName"] | tostring() %}
        {%- var svcPort = info["svcPort"] | toint() %}
        {%- if first_seen("ni_sslPassthrough_backend", beNs + "/" + beIngress) %}
      # nginx-ingress/backends-ssl-passthrough

      backend {{ beName }}
          mode tcp
          {{ BackendServers(svcName, 10, svcPort, nil, nil, beName, beNs) | indent(4) }}
        {%- end %}
      {%- end %}

  # ============================================================================
  # Global Top (Auth Userlists)
  # ============================================================================

  global-top-700-nginx-ingress-auth:
    template: |
      {#-
        Nginx Ingress Basic Auth Userlist Generation

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#authentication

        Annotations:
          - nginx.ingress.kubernetes.io/auth-type: "basic" (required)
          - nginx.ingress.kubernetes.io/auth-secret: "<ns/name>" or "<name>" (required)

        Nginx-ingress Secret format:
          The secret has a single key named "auth" containing htpasswd-format data:
            username:hash\n
            username:hash\n

          The "auth" key value is base64-encoded in the Secret's data field.

        Generated HAProxy Config:
          userlist ni_auth_<ns>_<name>
            user <username> password '<hash>'
      -#}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() %}
        {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() %}
        {%- var key = ns + "/" + name %}
        {%- var authType = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-type") | fallback("") | tostring() %}
        {%- if authType == "basic" %}
          {%- var authSecret = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/auth-secret") | fallback("") | tostring() %}
          {%- if authSecret != "" %}
            {%- var secretNs = ns %}
            {%- var secretName = authSecret %}
            {%- if strings_contains(authSecret, "/") %}
              {%- var parts = split(authSecret, "/") %}
              {%- secretNs = parts[0] %}
              {%- secretName = parts[1] %}
            {%- end %}
            {%- var userlistName = "ni_auth_" + secretNs + "_" + secretName %}
            {%- if first_seen("ni_userlist", userlistName) %}
              {#-
                Skip both the userlist and the matching backend ACL ref when the
                referenced Secret isn't in the controller's cache (informer not
                yet caught up, or the Secret was just cascade-deleted while the
                Ingress still lingers). The next render — once the cache catches
                up — will produce the full auth setup.

                Goes through shared.ComputeIfAbsent so the matching http_auth
                snippet sees the same Secret presence/absence; stores are live
                during render and two direct GetSingle calls can observe
                different states.
              -#}
              {%- var secret, _ = shared.ComputeIfAbsent("nginx_auth_secret:" + secretNs + "/" + secretName, func() any {
                return resources.secrets.GetSingle(secretNs, secretName)
              }) %}
              {%- if secret != nil %}
                {%- var authData = secret | dig("data", "auth") | fallback("") | b64decode() | tostring() %}
                {%- if authData != "" %}
      # nginx-ingress/global-top-auth ({{ key }})
      userlist {{ userlistName }}
                  {%- for _, line := range split(authData, "\n") %}
                    {%- var lineTrimmed = trimSpace(line) %}
                    {%- if lineTrimmed != "" %}
                      {#- Split on first colon only: username:password_hash -#}
                      {%- var colonIdx = index(lineTrimmed, ":") %}
                      {%- if colonIdx > 0 %}
                        {%- var username = lineTrimmed[:colonIdx] %}
                        {%- var passwordHash = lineTrimmed[colonIdx+1:] %}
        user {{ username }} password '{{ passwordHash }}'
                      {%- end %}
                    {%- end %}
                  {%- end %}
                {%- else %}
                  {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced by annotation 'nginx.ingress.kubernetes.io/auth-secret' on Ingress '" + key + "' has empty 'auth' key.") -}}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

# ============================================================================
# Validation Tests
# ============================================================================

validationTests:
  # ==========================================================================
  # Backend Directive Tests
  # ==========================================================================

  test-nginx-ingress-timeouts:
    description: Nginx Ingress timeout annotations generate correct config
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: timeout-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: timeout-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: timeout-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: timeout-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
          spec:
            ingressClassName: haproxy
            rules:
              - host: timeout.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: timeout-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "timeout connect 10s"
        description: Must set timeout connect with s suffix
      - type: contains
        target: haproxy.cfg
        pattern: "timeout server 60s"
        description: Must set timeout server from proxy-read-timeout

  test-nginx-ingress-load-balance:
    description: Nginx Ingress load-balance annotation maps to HAProxy algorithm
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: lb-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: lb-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: lb-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-ingress
            annotations:
              nginx.ingress.kubernetes.io/load-balance: "least_conn"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lb.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: lb-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "balance leastconn"
        description: Must map least_conn to leastconn

  test-nginx-ingress-ssl-redirect:
    description: Nginx Ingress ssl-redirect annotation generates 301 redirect
