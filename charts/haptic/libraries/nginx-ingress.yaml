  test-nginx-ingress-ssl-passthrough-skips-ingress-without-paths:
    description: |
      Regression test for the dry-run race that flaked
      TestIngressAnnotations/nginx-ssl-passthrough on !893.

      Pre-fix shape: BuildAnnotationSSLPassthrough added an entry to
      gf["sslPassthroughBackends"] for any (host, ingress) pair where
      the annotation was truthy. The use_backend in ssl-tcp was emitted
      from that list. The corresponding `backend X` block came from a
      separate `resources.ingresses.GetSingle` lookup that walked
      spec.rules to find a service. If the ingress had a host but no
      spec.rules[*].http.paths (or those paths had no backend.service),
      the use_backend was emitted without a matching backend block —
      `haproxy -c` rejected the config and the webhook denied the
      unrelated dry-run as collateral damage.

      Post-fix: the macro itself extracts svcName/svcPort up front and
      refuses to add an entry without them. This fixture's ingress has
      the annotation + a host but no http.paths, so neither
      use_backend nor backend should appear in the rendered config.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress-no-paths
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: noservice.example.com
                # Note: no `http:` block, so no paths.
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid (no use_backend without backend block)
      - type: not_contains
        target: haproxy.cfg
        pattern: "ssl-passthrough-ni-default-passthrough-ingress-no-paths"
        description: |
          Neither use_backend nor backend block must mention the
          path-less ingress. If a use_backend slipped through without a
          matching backend block, haproxy_valid would also fail with
          'unable to find required use_backend' — but assert on the
          string explicitly so a test failure points at the right cause.

