  test-nginx-ingress-auth-tls-secret:
    description: |
      nginx.ingress.kubernetes.io/auth-tls-secret references a
      Secret whose `ca.crt` is written to the general file dir
      (not ssl/ — Dataplane validates ssl/ uploads as cert+key)
      and used in the crt-list line for the matching SNI as
      `ca-file <path> verify required`. HAProxy then verifies incoming
      client certs against that CA bundle.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mtls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mtls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: client-ca
          type: kubernetes.io/tls
          # Self-signed CA test fixture (re-used from echo demo).
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: server-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-secret: "client-ca"
              nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-tls-secret annotation
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
        description: crt-list line carries the per-host ca-file path (general/, not ssl/ — Dataplane SSL endpoint validates ssl/ uploads as cert+key), verify mode, and SNI

  test-nginx-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy (any plugin
    # enabled, or operator forces it). When the test renders against
    # default chart values (no plugins), spoa-hub library is absent —
    # auth-url.map doesn't exist and the frontend snippets don't
    # render. Skip in that case so validate-helm-libraries is green.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: |
      Nginx Ingress auth-url annotation populates auth-url.map and the
      spoa-hub frontend wiring (set-var, send-spoe-group, deny rule).
      Runs in a render where spoaHub is enabled with the external-auth
      plugin, simulating the auto-enable that nginxIngress=true triggers
      via the OR-expression in spoaHub.plugins.external-auth.enabled.
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with auth-url annotation
      - type: contains
        target: map:auth-url.map
        pattern: "protected.example.com/ https://auth.example/check"
        description: auth-url.map must contain the host+path → URL entry
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
        description: Frontend looks up auth_url from the map after routing
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend triggers the SPOE check when auth_url is found
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure

