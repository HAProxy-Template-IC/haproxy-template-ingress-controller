  # ==========================================================================
  # Access log (structured JSON)
  # ==========================================================================

  test-access-log-core-fields:
    description: >-
      Every HTTP frontend emits the core JSON field set, the log target drops the
      syslog prefix so records are parseable as-is, and no log-time-illegal
      sample expression reaches a log-format.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: access-log-core }
          spec:
            ingressClassName: haptic
            rules:
              - host: log.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log stdout len 16384 format raw local0 info$'
        description: >-
          `log <target> [len N] [format F] <facility>` — the argument order is
          mandatory, and `format raw` is what removes the syslog header that
          would otherwise precede every JSON record.
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '%\(status:sint\)ST'
        description: Typed so `status` is a JSON number rather than a string.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(ts\)\[accept_date\(ms\),ms_utime\(%Y-%m-%dT%H:%M:%S\.%3NZ\)\]'
        description: >-
          `format raw` drops the syslog timestamp, so the record carries its own.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(resource\)\[var\(txn\.resource_id\)\]'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'var\(req\.gw_rule_id\)'
        description: >-
          The owner-identity cascade reads txn.gw_rule_id. `req.gw_rule_id` is a
          scope nothing ever writes, so that branch never fired and Gateway
          requests fell through to the backend-name split, yielding
          resource_id="gtw/<namespace>" — which every resource_id-keyed feature
          map (WAF, auth, rate limit, cache, schema) is looked up with.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.resource_namespace\) var\(txn\.gw_rule_id\),field\(1,_\)'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(denied_by\)\[var\(txn\.denied_by\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.trace_id\) req\.hdr\(traceparent\),field\(2,-\) if \{ req\.hdr\(traceparent\) -m reg '
        description: >-
          A W3C traceparent is captured behind its grammar regex, so junk or
          oversized headers contribute nothing.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'log-format "[^"]*%\[(path|pathq|req\.hdr\(|res\.hdr\(|req\.ssl_sni)'
        description: >-
          HAProxy rejects these at config-parse time inside a log-format ("needs
          HTTP request headers / request buffer which is not available here").
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  option tcplog$'
        description: Replaced everywhere by the TCP-safe JSON variant.

  test-access-log-every-frontend-has-a-format:
    description: >-
      Every frontend this fixture renders carries the JSON log-format, and no
      frontend is left on the old text directives.

      Assertions are anchored to frontend NAMES rather than counting frontends,
      deliberately: validationTests also run as the controller's fatal load gate
      against the operator's own values, so a count would depend on which
      frontend-adding features that deployment happens to enable — enabling the
      Varnish cache tier (which adds haptic_cache_origin) would then crash-loop a
      controller over a test that has nothing to do with caching. The frontends
      other libraries own are asserted in those libraries' own tests
      (haptic-annotations' cache-origin, gateway's per-port TCP frontends), and
      scripts/test-templates.sh carries the repo-side count invariant that catches
      a NEW frontend rendered without a log-format.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: access-log-coverage }
          spec:
            ingressClassName: haptic
            tls:
              - hosts: [coverage.example.com]
                secretName: shared-tls
            rules:
              - host: coverage.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend status$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http-tcp$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend_h2c$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^  log-format "%\{\+json\}o '
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  option tcplog$'
        description: The TCP-mode frontends use the TCP-safe JSON variant instead.
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  option httplog$'
        expected: "1"
        description: >-
          Only the `defaults` section keeps it, as the no-warning fallback for a
          frontend that has no format of its own. A second occurrence would mean a
          frontend is emitting text lines.

  test-access-log-custom-fields:
    description: >-
      extraContext.accessLog.fields adds one named item per entry, captured into
      txn.log_<name> at request time so request-scoped fetches work, and emitted
      in sorted-key order so the rendered config does not churn between renders.
    extraContext:
      accessLog:
        maxLineBytes: 8192
        fields:
          tenant: req.hdr(X-Tenant)
          zulu: str(z)
          alpha: query
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log stdout len 8192 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.log_tenant\) req\.hdr\(X-Tenant\)'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(tenant\)\[var\(txn\.log_tenant\)\]'
      - type: match_order
        target: haproxy.cfg
        patterns:
          - '%\(alpha\)\[var\(txn\.log_alpha\)\]'
          - '%\(tenant\)\[var\(txn\.log_tenant\)\]'
          - '%\(zulu\)\[var\(txn\.log_zulu\)\]'
        description: keys() is sorted, so emission order is deterministic.

  test-access-log-rejects-invalid-field-name:
    description: A JSON field name outside the allowed charset is rejected at render time.
    extraContext:
      accessLog:
        fields:
          "bad name": str(x)
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid accessLog.fields key 'bad name'"

  test-access-log-rejects-colliding-field-name:
    description: >-
      A custom field that shadows a built-in one is rejected — a duplicate JSON
      key is resolved differently by every parser and silently corrupts a log
      pipeline.
    extraContext:
      accessLog:
        fields:
          status: str(1)
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.fields\\['status'\\] collides with the built-in access-log field"

  test-access-log-rejects-unparseable-max-line-bytes:
    description: >-
      An absurd digit string is rejected on its shape, not by an int64 overflow
      that happens to land below the lower bound — the operator sees what they
      wrote, not -9223372036854775808.
    extraContext:
      accessLog:
        maxLineBytes: 123456789012345678901234567890
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "maxLineBytes must be an integer between 1024 and 65535, got '1234567890"
      - type: not_contains
        target: rendering_error
        pattern: "-9223372036854775808"
        description: >-
          The diagnostic must name what the operator wrote rather than the int64
          saturation artifact toint() would produce. (The echoed digits differ
          from the literal because a value this large parses as a float.)

  test-access-log-rejects-out-of-range-max-line-bytes:
    description: >-
      The maxLineBytes bound is enforced in the render as well as in Helm, because
      a hand-written HAProxyTemplateConfig never passes through Helm. Below 1024
      every record would be truncated into invalid JSON.
    extraContext:
      accessLog:
        maxLineBytes: 64
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.maxLineBytes must be an integer between 1024 and 65535, got 64"

  test-access-log-rejects-injection-in-field-value:
    description: >-
      Whitespace in a field expression would let the value continue the
      set-var line with a condition of its own.
    extraContext:
      accessLog:
        fields:
          evil: "str(a) if TRUE"
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "must not contain whitespace"

  test-access-log-denied-by-body-size:
    description: >-
      The body-size gate names itself in txn.denied_by, with the deny's own
      condition, so a 413 in the log is attributable to it rather than to the
      WAF or schema-validation body caps.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: access-log-body-limit
            annotations:
              haproxy-haptic.org/max-body-size: "1024"
          spec:
            ingressClassName: haptic
            rules:
              - host: body.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.denied_by\) str\(body_too_large\) if \{ var\(txn\.haptic_body_limit\) -m int gt 0 \}'
          - 'http-request deny deny_status 413 if \{ var\(txn\.haptic_body_limit\) -m int gt 0 \}'
        description: >-
          The marker must precede the deny: `deny` ends rule processing, so a
          marker after it would never run.

  test-access-log-target-default-is-stdout:
    description: >-
      With no accessLog.targets the access log goes to stdout exactly as before,
      and HAProxy's own process messages keep their own global stdout target.
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log stdout len 16384 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log stdout len 16384 format raw local0 info$'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  log global$'
        description: >-
          Replaced by an explicit target, so the access log no longer inherits
          whatever the global section happens to use.
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^ring '

  test-access-log-target-ring:
    description: >-
      A ring target emits its own buffered-TCP ring section and points the
      defaults log line at it, so access records leave the container instead of
      landing on stdout — while process messages still go to stdout.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: accesslog
              address: 127.0.0.1:6514
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log ring@accesslog len 16384 format rfc5424 local0 info$'
        description: >-
          The framing defaults to rfc5424 for a non-stdout target: a collector
          parses the syslog envelope and the JSON record inside it.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^ring accesslog$.*?^  server accesslog 127\.0\.0\.1:6514 log-proto legacy$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^ring accesslog$.*?^  size 65536$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log stdout len 16384 format raw local0 info$'
        description: Process/alert messages are unaffected — kubectl logs still works.
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log stdout'
        description: No access-log copy on stdout, which is the whole point.

  test-access-log-target-remote-and-fanout:
    description: >-
      An address target works without a ring (here a UDP syslog endpoint), and
      several targets fan out — the migration case, where records go to the new
      collector and stdout at once.
    extraContext:
      accessLog:
        targets:
          - address: 10.0.0.5:514
            format: rfc5424
            facility: local6
            level: debug
          - address: stdout
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log 10\.0\.0\.5:514 len 16384 format rfc5424 local6 debug$'
      - type: match_count
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log '
        expected: "1"
        description: match_count anchors on the first line only; the fan-out pair is asserted individually.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log stdout len 16384 format raw local0 info$'

  test-access-log-target-ring-with-tls-server-options:
    description: >-
      serverOptions is spliced verbatim onto the ring's server line, so TLS (or
      any other server keyword) is reachable without the chart modelling it.

      Two sharp edges this fixture encodes deliberately. The address is an IP
      because HAProxy resolves a ring server's address at config-PARSE time, so a
      name that does not resolve during validation fails the render — a sidecar
      (127.0.0.1) or a literal IP always works, a Service DNS name needs
      `resolvers`/`init-addr` through serverOptions. And the TLS options carry no
      ca-file, because any file referenced here must also exist where the config
      is validated (the controller pod), not just in the HAProxy pod; deliver
      such material through the chart's file mechanism so both see it.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: secure-log
              address: 10.43.12.7:6514
              size: 131072
              logProto: octet-count
              connectTimeout: 2s
              serverTimeout: 30s
              serverOptions: "ssl verify none"
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'server secure-log 10\.43\.12\.7:6514 log-proto octet-count ssl verify none'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log ring@secure-log len 16384 format rfc5424 local0 info$'

  test-access-log-target-rejects-address-and-ring:
    description: A target that sets both an address and a ring is ambiguous.
    extraContext:
      accessLog:
        targets:
          - address: stdout
            ring:
              name: accesslog
              address: 127.0.0.1:6514
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "sets both 'address' \\(stdout\\) and 'ring'"

  test-access-log-target-rejects-bad-address:
    description: >-
      The address is spliced into a `log` directive, so it is charset-checked
      rather than trusted.
    extraContext:
      accessLog:
        targets:
          - address: "stdout local0 info\nfrontend evil"
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid accessLog.targets\\[\\].address"

  test-access-log-target-rejects-unknown-field:
    extraContext:
      accessLog:
        targets:
          - address: stdout
            formatt: raw
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.targets entry contains unknown field 'formatt'"

  test-access-log-target-rejects-injection-in-server-options:
    description: >-
      serverOptions allows spaces (it carries real server keywords) so a newline
      or comment marker is what would let it inject a directive.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: accesslog
              address: 127.0.0.1:6514
              serverOptions: "ssl # sneaky"
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "must not contain control characters or '#'"

  test-access-log-target-rejects-dangling-ring-reference:
    description: >-
      A `log ring@<name>` with no such ring passes `haproxy -c` and then makes
      HAProxy refuse to start — validation green, data plane down. The render
      rejects it instead, because no gate downstream would catch it.
    extraContext:
      accessLog:
        targets:
          - address: ring@nowhere
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "points at a ring no target declares"

  test-access-log-target-socket-path-may-end-in-digits:
    description: >-
      The port bound must not misread a UNIX socket path. A colon is a legal
      filename character, so `/var/run/log:99999` is a valid destination whose
      trailing digits are part of the name — the check applies to the host:port
      forms only.
    extraContext:
      accessLog:
        targets:
          - address: /var/run/log:99999
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log /var/run/log:99999 len 16384 format rfc5424 local0 info$'

  test-access-log-target-rejects-out-of-range-port:
    description: >-
      The address shape allows five port digits, but HAProxy hard-ALERTs above
      65535 ("invalid port '99999'", measured on 3.0 and 3.4). Without this the
      value passes Helm and takes down the controller's config load instead of
      being rejected where the operator set it.
    extraContext:
      accessLog:
        targets:
          - address: 10.0.0.5:99999
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has port 99999, outside 1-65535"

  test-access-log-target-rejects-out-of-range-ring-port:
    description: >-
      Same bound on a ring server address, which reaches HAProxy through a
      different directive (`server` in the ring section, not `log`).
    extraContext:
      accessLog:
        targets:
          - ring:
              name: shipper
              address: 10.0.0.5:99999
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has port 99999, outside 1-65535"

  test-access-log-target-rejects-ring-too-small-for-a-record:
    description: >-
      The ring section carries `maxlen <maxLineBytes>`, and HAProxy caps that at
      the buffer minus a ~197-byte header. Undersized, it emits only a [WARNING]
      — which `haproxy_valid` treats as success — and then truncates every longer
      record mid-byte into invalid JSON, defeating the point of maxLineBytes.
      Measured identically on HAProxy 3.0 and 3.4.
    extraContext:
      accessLog:
        maxLineBytes: 16384
        targets:
          - ring:
              name: tiny
              address: 127.0.0.1:6514
              size: 4096
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "too small for accessLog.maxLineBytes 16384"

  test-access-log-target-rejects-duplicate-log-line:
    description: >-
      HAProxy sends every record down every `log` line, so two targets rendering
      an identical line log each request twice — accepted by `haproxy -c`, and
      visible only as doubled volume at the collector. The reachable way to hit
      this is a ring target plus a second entry addressing that same ring.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: shipper
              address: 127.0.0.1:6514
          - address: ring@shipper
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "would be logged twice"

  test-access-log-targets-fan-out-to-one-address-with-distinct-settings:
    description: >-
      The duplicate-line guard keys on the whole rendered line, not the address,
      so two targets sharing an address but differing in facility are real fan-out
      and stay allowed.
    extraContext:
      accessLog:
        targets:
          - address: stdout
          - address: stdout
            facility: local1
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log stdout len 16384 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults$.*?^  log stdout len 16384 format raw local1 info$'

  test-access-log-targets-rejects-empty-list:
    description: >-
      An empty list would fall back to stdout — the one destination this setting
      exists to move records off — so the operator who wrote it would silently get
      the opposite of what they asked for. An ABSENT key still takes the default.
    extraContext:
      accessLog:
        targets: []
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "is an empty list"

  test-access-log-target-rejects-duplicate-ring-name:
    description: >-
      Two targets naming the same ring would emit two `ring <name>` sections.
      Reject the second one where the operator can see which target caused it,
      rather than leaving HAProxy to reason about a duplicate section.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: dup
              address: 127.0.0.1:6514
          - ring:
              name: dup
              address: 127.0.0.1:6515
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Two ring sections cannot share a name"

  test-access-log-target-rejects-unusable-level:
    description: >-
      The level is a maximum-severity filter and access records are emitted at
      info, so `notice` and above silently drop every record while haproxy -c
      still returns 0. Measured: notice/warning/err each emitted zero records.
    extraContext:
      accessLog:
        targets:
          - address: stdout
            level: notice
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "a stricter level \\(notice and above\\) silently drops every one of them"

  test-access-log-target-rejects-unix-ring-server:
    description: >-
      HAProxy 3.4 rejects a UNIX ring server while 3.0 accepts it, so the chart
      refuses the form rather than rendering a config that works on some
      supported versions only.
    extraContext:
      accessLog:
        targets:
          - ring:
              name: accesslog
              address: unix@/var/run/log.sock
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "HAProxy 3.4 rejects a UNIX ring server"
