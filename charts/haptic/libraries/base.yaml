# Base Template Library for HAPTIC
#
# Provides resource-agnostic building blocks for HAProxy configuration generation.
# Libraries like ingress.yaml and gateway.yaml extend these primitives via:
#   - Plugin patterns: render_glob "backends-*", "map-host-*", etc.

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# The "frontend-routing-logic-regex-last" snippet below is the alternate
# variant of frontend-routing-logic; we conditionally swap it in and always
# strip the alternate so it never appears in the merged HAProxyTemplateConfig.
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.base.enabled }}'
  inject:
    - path: watchedResources.controller_services.labelSelector
      value: 'app.kubernetes.io/name={{ include "haptic.name" . }},app.kubernetes.io/component=loadbalancer'
    - path: templateSnippets.frontend-routing-logic
      from: templateSnippets.frontend-routing-logic-regex-last
      when: '{{- with .Values.controller.config.templatingSettings.extraContext.routing -}}{{- if eq .regexMatchOrder "last" }}true{{ end -}}{{- end -}}'
  unset:
    - templateSnippets.frontend-routing-logic-regex-last
#   - Composable macros: import and extend utility functions
#
# SSL/TLS infrastructure is in ssl.yaml (loaded separately when needed)

watchedResources:
  controller_services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]
    # labelSelector: injected by Helm from chart labels to match the LoadBalancer service

templateSnippets:
  # ============================================================================
  # Core Utility Macros
  # ============================================================================

  util-macros:
    template: |
      {#- Core utility macros for template rendering -#}

      {#- Calculates optimal shard count: clamp(count / itemsPerShard, 1, 2*GOMAXPROCS) -#}
      {% macro CalculateShardCount(resourceCount int, itemsPerShard int) string %}
        {%%
          var override = extraContext | dig("shardCountOverride")
          if override != nil {
            show tostring(toint(override))
            return
          }
          var maxShards = runtimeEnvironment.GOMAXPROCS * 2
          if maxShards < 1 { maxShards = 1 }
          var shardCount = resourceCount / itemsPerShard
          if shardCount < 1 { shardCount = 1 }
          if shardCount > maxShards { shardCount = maxShards }
          show tostring(shardCount)
        %%}
      {% end %}


  # ============================================================================
  # Ingress Helpers
  # ============================================================================

  # Single source of truth for how hosts get normalised into map keys.
  # Wildcard hosts (`*.example.com`) lose the leading `*` so the key becomes
  # `.example.com` — the same form host.map uses and the same form HAProxy's
  # `regsub(^[^.]*,,)` fallback in frontend-routing-logic produces at request
  # time. Resource-agnostic (operates on a hostname string), so it lives in
  # base and is imported by ingress.yaml, gateway/, and the vendor annotation
  # libraries alike — keeping any of them loadable without the others (gateway
  # imported this from ingress.yaml before, which broke gateway when ingress
  # was disabled). The argument is `any` because Scriggo's dig() returns any;
  # empty input → empty string (caller validates non-empty if it matters).
  util-host-key:
    template: |
      {%- macro MapKeyForHost(host any) string -%}
        {%- show tostring(host | fallback("")) | replace("*", "") -%}
      {%- end macro -%}

  util-ingress-helpers:
    template: |
      {#- Generates HAProxy host match condition for use in if-expressions.
          Small host lists use compact inline form: { var(txn.host) -m str host1 host2 ... }
          Large host lists (>30) use file-based matching to avoid HAProxy's 64-word-per-line limit.
      -#}
      {% macro HostMatchCondition(hosts []string) string %}
        {%%
          if len(hosts) <= 30 {
            // Compact inline form — stays under HAProxy's 64-word-per-line limit
            show "{ var(txn.host) -m str " + join(hosts, " ") + " }"
          } else {
            // File-based matching: register a host list file and use -f flag
            var content = join(hosts, "\n") + "\n"
            var filename = "host-match-" + md5(content) + ".lst"
            var path, err = fileRegistry.Register("file", filename, content)
            if err != nil {
              fail("Failed to register host match file '" + filename + "': " + err.Error())
            }
            show "{ var(txn.host) -m str -f " + path + " }"
          }
        %%}
      {% end %}

  # ============================================================================
  # Access log (structured JSON)
  #
  # Every frontend emits one JSON object per request/connection, built from
  # HAProxy's native `%{+json}o` log encoding. Libraries contribute fields
  # through the `log-fields-*` extension point; base owns the core field set,
  # the assembly, and the per-frontend emission.
  #
  # Two hard HAProxy constraints shape this (both verified against 3.0 and 3.4):
  #
  #  1. A log-format may only reference items available AT LOG TIME. `path`,
  #     `pathq`, `req.hdr()`, `res.hdr()` and `req.ssl_sni` are rejected at
  #     config-parse time ("needs HTTP request headers / request buffer which is
  #     not available here"), so anything request- or response-scoped must be
  #     materialised into a txn variable first — that is what the txn.* routing
  #     variables (util-routing-prefix/suffix) already do.
  #  2. A `defaults`-section log-format cannot reference HTTP-scoped fetches at
  #     all, so the format is emitted per frontend. `option httplog` stays in
  #     `defaults` as the no-warning fallback for a frontend without one; a
  #     frontend-level log-format alongside an inherited `option httplog` does
  #     NOT warn (the two in the SAME section do).
  # ============================================================================

  util-access-log-targets:
    template: |-
      {#-
        Parses and validates extraContext.accessLog.targets once per render into
        shared["accessLogTargets"], a list of normalised maps:
          {address, format, facility, level, ring}   (ring is nil or a map)

        WHY THIS EXISTS: the access log carries a client_ip field — personal data.
        Organisations that must keep it out of a general-purpose log store need to
        route it somewhere access-controlled, and overriding a chart-owned snippet
        is not configuration. HAProxy's own process and alert messages are NOT
        affected: they stay on the `global` stdout target, so `kubectl logs` keeps
        working for on-call while only the personal-data-bearing stream moves.

        Consumers render this snippet (it emits nothing) and then read
        shared.Get("accessLogTargets").

        Verified against HAProxy 3.0 and 3.4:
          - a `log` line may reference a ring defined LATER in the file, so the
            ring sections can come from global-top-* (which renders after
            `defaults`),
          - with a ring target, an unreachable collector costs the data plane
            nothing: 25/25 requests served in 112ms with the collector down, and
            all 25 records buffered and flushed once it came back.
      -#}
      {%- var _, _ = shared.ComputeIfAbsent("accessLogTargets", func() any {
        var formats = []string{"raw", "rfc3164", "rfc5424", "local", "priority", "short", "timed", "iso"}
        var facilities = []string{"kern", "user", "mail", "daemon", "auth", "syslog", "lpr", "news",
                                  "uucp", "cron", "auth2", "ftp", "ntp", "audit", "alert", "cron2",
                                  "local0", "local1", "local2", "local3", "local4", "local5", "local6", "local7"}
        {#- Only the levels that actually emit an access record. The level is a
            MAX severity filter and access logs are emitted at info, so anything
            stricter (notice and up) silently drops EVERY record while
            `haproxy -c` still returns 0 — measured: notice/warning/err each
            produced zero records. A knob whose plausible values destroy the log
            is not a knob. -#}
        var levels = []string{"info", "debug"}
        var addrRe = regexp("^(stdout|stderr|fd@[0-9]+|ring@[A-Za-z_][A-Za-z0-9_-]{0,63}|/[^[:space:]]+|\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}|[0-9A-Za-z._-]+:[0-9]{1,5})$")
        var ringNameRe = regexp("^[A-Za-z_][A-Za-z0-9_-]{0,63}$")
        {#- No unix@ here: HAProxy 3.4 rejects a UNIX ring server outright while
            3.0 accepts it, so offering it would render a config that only works
            on some of the supported versions. A UNIX socket collector is reached
            with the plain-path address form instead, which is a datagram target. -#}
        var ringAddrRe = regexp("^(\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}|[0-9A-Za-z._-]+:[0-9]{1,5})$")
        var durationRe = regexp("^[0-9]+(us|ms|s|m|h|d)?$")
        {#- A 5-digit shape match is not enough. HAProxy hard-ALERTs on a port
            above 65535 ("invalid port '99999'", measured on 3.0 and 3.4), so the
            value would pass Helm, reach the controller, and take down the config
            load instead of being rejected where the operator set it. Port 0 it
            ACCEPTS at config check (exit 0) even though nothing can be delivered
            there, so only this check catches it. -#}
        var portRe = regexp(":([0-9]{1,5})$")
        var checkPort = func(addr string, what string) {
          {#- An absolute path is a UNIX socket, not host:port, and a colon is a
              legal filename character — so `/var/run/log:99999` is a valid
              destination whose trailing digits are part of the name, not a port. -#}
          if hasPrefix(addr, "/") {
            return
          }
          var m = portRe.FindSubmatch(addr)
          if len(m) > 0 {
            var port = toint(m[1])
            if port < 1 || port > 65535 {
              fail(what + " '" + addr + "' has port " + tostring(port) + ", outside 1-65535. A port above 65535 is rejected by HAProxy at config parse; port 0 is accepted there but no record can ever be delivered to it.")
            }
          }
        }

        var rawTargets = extraContext | dig("accessLog", "targets")
        var list = []any{}
        if rawTargets != nil {
          var l, ok = rawTargets.([]any)
          if !ok {
            fail("controller.config.templatingSettings.extraContext.accessLog.targets must be a list of log targets.")
          }
          list = l
        }
        {#- An ABSENT key takes the chart default. An explicitly EMPTY list does
            not: it would fall back to stdout, which is the one destination this
            knob exists to move records off, so the operator who wrote it would
            silently get the opposite of what they asked for. -#}
        if rawTargets != nil && len(list) == 0 {
          fail("controller.config.templatingSettings.extraContext.accessLog.targets is an empty list. Name at least one target — use [{address: stdout}] for the chart default; an empty list would silently fall back to stdout, which is what this setting exists to move the access log away from.")
        }
        if len(list) == 0 {
          list = append(list, map[string]any{"address": "stdout"})
        }

        {#- A `log ring@<name>` whose ring does not exist passes `haproxy -c`
            (return code 0, so the render's validation gate accepts it) and then
            makes HAProxy REFUSE TO START: "unknown ring named '<name>'", exit 1.
            Validation green, data plane down. So the only ring names accepted in
            an address are the ones this chart emits, collected here first. -#}
        var declaredRings = map[string]bool{}
        for _, entry := range list {
          var t, ok = entry.(map[string]any)
          if ok && t["ring"] != nil {
            var r, rok = t["ring"].(map[string]any)
            if rok {
              declaredRings[tostring(r["name"] | fallback("accesslog"))] = true
            }
          }
        }

        var out = []any{}
        var seenRings = map[string]bool{}
        var seenLines = map[string]bool{}
        for _, entry := range list {
          var t, ok = entry.(map[string]any)
          if !ok {
            fail("Each controller.config.templatingSettings.extraContext.accessLog.targets entry must be a map with an address (or a ring).")
          }
          for _, k := range keys(t) {
            if k != "address" && k != "format" && k != "facility" && k != "level" && k != "ring" {
              fail("accessLog.targets entry contains unknown field '" + k + "'. Valid fields: address, format, facility, level, ring.")
            }
          }

          {#- A ring is a buffered TCP client the chart emits as its own section;
              the target then logs to ring@<name>. Giving both is ambiguous. -#}
          var ringRaw = t["ring"]
          var ring any = nil
          var address = tostring(t["address"] | fallback(""))
          if ringRaw != nil {
            var r, rok = ringRaw.(map[string]any)
            if !rok {
              fail("accessLog.targets[].ring must be a map (name, address, size, logProto, connectTimeout, serverTimeout, serverOptions).")
            }
            if address != "" {
              fail("accessLog.targets entry sets both 'address' (" + address + ") and 'ring'. A ring target logs to ring@<name>, so set one or the other.")
            }
            for _, k := range keys(r) {
              if k != "name" && k != "address" && k != "size" && k != "logProto" && k != "connectTimeout" && k != "serverTimeout" && k != "serverOptions" {
                fail("accessLog.targets[].ring contains unknown field '" + k + "'. Valid fields: name, address, size, logProto, connectTimeout, serverTimeout, serverOptions.")
              }
            }
            var ringName = tostring(r["name"] | fallback("accesslog"))
            if !ringNameRe.Match(ringName) {
              fail("Invalid accessLog.targets[].ring.name '" + ringName + "'. It names an HAProxy section, so it must match ^[A-Za-z_][A-Za-z0-9_-]{0,63}$.")
            }
            if seenRings[ringName] {
              fail("Duplicate accessLog.targets[].ring.name '" + ringName + "'. Two ring sections cannot share a name.")
            }
            seenRings[ringName] = true
            var ringAddr = tostring(r["address"] | fallback(""))
            if !ringAddrRe.Match(ringAddr) {
              fail("Invalid accessLog.targets[].ring.address '" + ringAddr + "' for ring '" + ringName + "'. Expected <host>:<port> or [<ipv6>]:<port> — the address of the log collector the ring forwards to. For a UNIX socket collector use a plain-path address target instead; HAProxy 3.4 rejects a UNIX ring server.")
            }
            checkPort(ringAddr, "accessLog.targets[].ring.address")
            var ringSize = toint(r["size"] | fallback(65536))
            if ringSize < 4096 || ringSize > 134217728 {
              fail("accessLog.targets[].ring.size for ring '" + ringName + "' must be between 4096 and 134217728 bytes; it is the in-memory buffer that holds records while the collector is unavailable.")
            }
            {#- The ring section carries `maxlen <maxLineBytes>`, and HAProxy caps
                that at the buffer minus a ~197-byte header. A size below that
                bound is only a [WARNING] ("event max length ... forced to N") —
                which the render's haproxy_valid gate treats as success — and then
                every record longer than N is truncated mid-byte into invalid
                JSON. Identical on 3.0 and 3.4; 256 is the measured overhead
                rounded up. -#}
            var rawMaxLine = tostring(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384))
            if regex_search(rawMaxLine, "^[0-9]{1,5}$") {
              var maxLine = toint(rawMaxLine)
              if ringSize < maxLine+256 {
                fail("accessLog.targets[].ring.size for ring '" + ringName + "' is " + tostring(ringSize) + ", too small for accessLog.maxLineBytes " + tostring(maxLine) + ". HAProxy would cap the ring's maxlen to the buffer minus its header and truncate every longer record into invalid JSON, warning but not failing. Give the ring at least " + tostring(maxLine+256) + " bytes (the buffer holds roughly size/maxLineBytes records while the collector is down).")
              }
            }
            var logProto = tostring(r["logProto"] | fallback("legacy"))
            if logProto != "legacy" && logProto != "octet-count" {
              fail("accessLog.targets[].ring.logProto for ring '" + ringName + "' must be legacy (RFC 6587 non-transparent framing, newline-delimited) or octet-count.")
            }
            var connectTimeout = tostring(r["connectTimeout"] | fallback("5s"))
            var serverTimeout = tostring(r["serverTimeout"] | fallback("10s"))
            if !durationRe.Match(connectTimeout) || !durationRe.Match(serverTimeout) {
              fail("accessLog.targets[].ring connectTimeout/serverTimeout for ring '" + ringName + "' must be HAProxy durations such as 5s or 500ms.")
            }
            {#- serverOptions is spliced verbatim onto the `server` line, which is
                what makes TLS and any other server keyword reachable without the
                chart modelling each one. Spaces are therefore allowed; a newline
                or a comment marker would let it inject a directive. -#}
            var serverOptions = tostring(r["serverOptions"] | fallback(""))
            if regex_search(serverOptions, "[[:cntrl:]#]") {
              fail("Invalid accessLog.targets[].ring.serverOptions for ring '" + ringName + "': it is appended verbatim to the ring's `server` line and must not contain control characters or '#' (config-injection guard).")
            }
            ring = map[string]any{
              "name": ringName, "address": ringAddr, "size": ringSize, "logProto": logProto,
              "connectTimeout": connectTimeout, "serverTimeout": serverTimeout, "serverOptions": serverOptions,
            }
            address = "ring@" + ringName
          }

          if address == "" {
            fail("An accessLog.targets entry needs an address (stdout, stderr, fd@<n>, <host>:<port>, /path/to.sock or ring@<name>) or a ring.")
          }
          if !addrRe.Match(address) {
            fail("Invalid accessLog.targets[].address '" + address + "'. Expected stdout, stderr, fd@<n>, <host>:<port>, [<ipv6>]:<port>, an absolute socket path, or ring@<name>.")
          }
          if hasPrefix(address, "ring@") && !declaredRings[address[5:]] {
            fail("accessLog.targets[].address '" + address + "' points at a ring no target declares. HAProxy accepts this at config check and then refuses to start (\"unknown ring named\"), so the render rejects it instead. Declare the ring on the target itself with a `ring:` block; to use a ring you define yourself, override the util-access-log-targets snippet.")
          }

          checkPort(address, "accessLog.targets[].address")

          {#- Default the framing to the target: stdout wants bare JSON so
              `kubectl logs | jq` works, while anything else is a syslog
              endpoint that expects a header it can parse. -#}
          var defaultFormat = "rfc5424"
          if address == "stdout" || address == "stderr" {
            defaultFormat = "raw"
          }
          var format = tostring(t["format"] | fallback(defaultFormat))
          if !(formats contains format) {
            fail("Invalid accessLog.targets[].format '" + format + "' for address '" + address + "'. Valid: " + join(formats, ", ") + ".")
          }
          var facility = tostring(t["facility"] | fallback("local0"))
          if !(facilities contains facility) {
            fail("Invalid accessLog.targets[].facility '" + facility + "'. It must be one of the 24 standard syslog facilities.")
          }
          var level = tostring(t["level"] | fallback("info"))
          if !(levels contains level) {
            fail("Invalid accessLog.targets[].level '" + level + "'. Valid: " + join(levels, ", ") + ". The level is a maximum-severity filter and access records are emitted at info, so a stricter level (notice and above) silently drops every one of them.")
          }

          {#- Each target renders one `log` line, and HAProxy sends every record
              down every one of them. Two targets that produce an IDENTICAL line
              therefore log each request TWICE — accepted by `haproxy -c`, silent
              at runtime, and visible only as doubled volume in the collector.
              The reachable way to hit this is a ring target plus a second entry
              addressing that same ring. Targets differing in any field are real
              fan-out and stay allowed. -#}
          var lineKey = address + " " + format + " " + facility + " " + level
          if seenLines[lineKey] {
            fail("Two accessLog.targets entries render the same log line ('" + lineKey + "'), so every request would be logged twice. Drop the duplicate, or make the targets differ (a different format, facility, or level).")
          }
          seenLines[lineKey] = true

          out = append(out, map[string]any{
            "address": address, "format": format, "facility": facility, "level": level, "ring": ring,
          })
        }
        return out
      }) -%}

  util-log-format-http:
    template: |-
      {#-
        util-log-format-http — the access-log directives for an HTTP-mode frontend.

        Emits, in order:
          1. the W3C Trace Context capture (see below),
          2. one `http-request set-var(txn.log_<name>)` line per
             extraContext.accessLog.fields entry,
          3. one `log-format "%{+json}o <items>"` line.

        Items come from `render_glob "log-fields-*"`. HAProxy's JSON encoder
        emits ONLY named items and silently DROPS literal text between them, so a
        malformed contribution would vanish from every log line with no error at
        all. Every token is therefore validated here and a bad one fail()s the
        render.

        CALL CONVENTION: append `{{ render "util-log-format-http" }}` to the END of
        an existing directive line in the frontend — never on a line of its own —
        and place it BEFORE any `http-request return` / `deny` rule, or the
        set-var lines never run for short-circuited requests.
      -#}
      {%- var fieldsRaw = extraContext | dig("accessLog", "fields") -%}
      {%- var fields = map[string]any{} -%}
      {%- if fieldsRaw != nil -%}
        {%- var f, ok = fieldsRaw.(map[string]any) -%}
        {%- if !ok -%}
          {{- fail("controller.config.templatingSettings.extraContext.accessLog.fields must be a map of <JSON field name> to <HAProxy sample expression>.") -}}
        {%- end -%}
        {%- fields = f -%}
      {%- end -%}
      {%- var lines = []string{} -%}
      {%- var items = []string{} -%}
      {%- var seen = map[string]string{} -%}
      {#- W3C Trace Context (https://www.w3.org/TR/trace-context/) is what
          OpenTelemetry propagates, so an inbound trace-id is the join key
          between this log line and a distributed trace. The ACL pins the full
          traceparent grammar so a junk or oversized header contributes nothing
          instead of eating the log-line budget. HAPTIC deliberately does not
          synthesize a traceparent when the client sends none: a root span no
          exporter ever emits produces broken traces downstream. -#}
      {%- lines = append(lines, "http-request set-var(txn.trace_id) req.hdr(traceparent),field(2,-) if { req.hdr(traceparent) -m reg ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$ }") -%}
      {#- Library-contributed items. Inserting a separator before every item
          means a snippet that forgot its leading newline cannot fuse its first
          item onto the previous snippet's last one; collapsing all whitespace
          afterwards is safe because log-format takes exactly one argument and,
          under +json, whitespace between named items is inert. -#}
      {%- var contributed = render_glob "log-fields-*" -%}
      {%- var flat = strip(regexp("[[:space:]]+").ReplaceAll(replace(contributed, "%(", " %("), " ")) -%}
      {%- if flat == "" -%}
        {{- fail("The JSON access log has no fields: render_glob \"log-fields-*\" produced nothing. base.yaml's log-fields-100-core must always contribute; check that it was not overridden with an empty templateSnippets entry.") -}}
      {%- end -%}
      {%- var itemRe = regexp("^%\\(([A-Za-z_][A-Za-z0-9_]{0,39})(:(sint|str|bool))?\\)(\\[[^[:space:]]+\\]|[A-Za-z]+)$") -%}
      {%- for _, tok := range split(flat, " ") -%}
        {%- var m = itemRe.FindSubmatch(tok) -%}
        {%- if len(m) == 0 -%}
          {{- fail("Invalid access-log item '" + tok + "' contributed by a log-fields-* snippet. Every item must be %(<name>)<ALIAS> or %(<name>)[<fetch>], optionally typed as %(<name>:sint)/%(<name>:str)/%(<name>:bool), with no whitespace. HAProxy's JSON encoder silently drops anything that is not a named item, so it is rejected here instead of disappearing from the log.") -}}
        {%- end -%}
        {%- var prev, dup = seen[m[1]] -%}
        {%- if dup -%}
          {#- Several libraries legitimately contribute the same field (mTLS from
              three annotation libraries, captured headers from two): an
              identical item is deduplicated, a conflicting one is a bug. -#}
          {%- if prev != tok -%}
            {{- fail("Conflicting access-log field '" + m[1] + "': two log-fields-* snippets contribute it with different values ('" + prev + "' and '" + tok + "'). A duplicate JSON key silently corrupts log pipelines — rename one of the fields.") -}}
          {%- end -%}
          {%- continue -%}
        {%- end -%}
        {%- seen[m[1]] = tok -%}
        {%- items = append(items, tok) -%}
      {%- end -%}
      {#- Operator fields. Values are captured at request time into txn.log_<name>
          because a log-format cannot fetch request-scoped data itself, and are
          always JSON strings: typing an expression that may not resolve renders
          "" into a numeric slot, which breaks a typed log index. -#}
      {%- var nameRe = regexp("^[A-Za-z_][A-Za-z0-9_]{0,39}$") -%}
      {%- for _, name := range keys(fields) -%}
        {%- if !nameRe.Match(name) -%}
          {{- fail("Invalid accessLog.fields key '" + name + "'. A JSON field name must match ^[A-Za-z_][A-Za-z0-9_]{0,39}$.") -}}
        {%- end -%}
        {%- var _, clash = seen[name] -%}
        {%- if clash -%}
          {{- fail("accessLog.fields['" + name + "'] collides with the built-in access-log field of the same name. Duplicate JSON keys silently corrupt log pipelines; pick a different field name.") -}}
        {%- end -%}
        {%- var expr = tostring(fields[name]) -%}
        {%- if expr == "" -%}
          {{- fail("accessLog.fields['" + name + "'] is empty. It must hold exactly one HAProxy sample expression, e.g. req.hdr(X-Tenant) or str(prod-eu).") -}}
        {%- end -%}
        {#- Parentheses and brackets are deliberately NOT blocked: every real
            sample expression needs them (req.hdr(X), field(2,-), str(prod-eu)),
            and they cannot escape the JSON item — the item always references
            txn.log_<name>, never the operator's text. An unbalanced one produces
            a set-var line HAProxy rejects, which the render's own `haproxy -c`
            validation fails on, so it is loud rather than silent. -#}
        {%- if regex_search(expr, "[[:space:][:cntrl:]\"\\\\#]") -%}
          {{- fail("Invalid accessLog.fields['" + name + "'] value '" + expr + "': an HAProxy sample expression here must not contain whitespace, '#', '\"' or a backslash (config-injection guard). For a constant label use str(<value>) with no spaces.") -}}
        {%- end -%}
        {%- seen[name] = "accessLog.fields" -%}
        {%- lines = append(lines, "http-request set-var(txn.log_" + name + ") " + expr) -%}
        {%- items = append(items, "%(" + name + ")[var(txn.log_" + name + ")]") -%}
      {%- end -%}
      {%- lines = append(lines, "log-format \"%{+json}o " + join(items, " ") + "\"") -%}
      {{- "\n  " + join(lines, "\n  ") -}}

  util-log-format-tcp:
    template: |-
      {#-
        util-log-format-tcp — the access-log directive for a mode-tcp frontend.

        Emits exactly one `log-format` line. A section may not also carry
        `option tcplog`: the two together make haproxy -c warn ("'log-format'
        overrides previous 'option tcplog'"), and scripts/test-helm-defaults.sh
        treats warnings as fatal.

        There is deliberately no log-fields-* extension point for TCP mode. The
        HTTP field set cannot be reused (a TCP connection has no status, method
        or path — the HTTP-only aliases render empty rather than erroring), and
        no bundled library needs a custom TCP field. Add a `log-fields-tcp-*`
        glob when a second consumer appears.

        CALL CONVENTION: append `{{ render "util-log-format-tcp" }}` to the end of
        the line that preceded `option tcplog`, and delete that line.
      -#}
      {%- var items = []string{
            "%(ts)[accept_date(ms),ms_utime(%Y-%m-%dT%H:%M:%S.%3NZ)]",
            "%(client_ip)ci",
            "%(frontend)f",
            "%(backend)b",
            "%(server)s",
            "%(bytes:sint)B",
            "%(t_queue:sint)Tw",
            "%(t_connect:sint)Tc",
            "%(t_total:sint)Tt",
            "%(retries:sint)rc",
            "%(term)ts",
          } -%}
      {{- "\n  log-format \"%{+json}o " + join(items, " ") + "\"" -}}

  log-fields-100-core:
    template: |-
      {#-
        Core JSON access-log fields — resource-agnostic (RULE #1).

        Extension point: log-fields-* (band 100, "basic config"; base sorts first
        so the core keys are stable and cannot be shadowed by a later library).

        Only items available at log time are used: aliases, and txn variables
        that util-routing-prefix/suffix already set. `%HPO` is the path without
        host or query string — the query string is deliberately absent, because
        it is the most common accidental carrier of tokens and session ids; an
        operator who wants it opts in with `accessLog.fields: {query: query}`.

        Types are only applied to items that always resolve. A typed item whose
        fetch does not resolve renders "" — a string in a numeric slot — so every
        txn-variable field stays an untyped string.

        `resource` is <namespace>/<name> of the routing resource that owns the
        matched route, whatever kind produced it; it is what makes a log line
        joinable back to a Kubernetes object. It is empty in frontends that do
        not run the routing logic (status, the cache-origin leg); an unset
        variable renders "" and never omits the key, so the JSON schema is
        identical on every frontend.

        NOT logged, though it would help: the port the routing key was built from.
        Gateway host/path map keys are `<host>:<port>/...`, so a routing miss
        shows only as backend=default_backend with no way to tell a wrong key
        from a missing map entry — that cost a real CI diagnosis. The obvious
        candidate does not work: `var(txn.listener_port)` renders null on the
        plain-HTTP path, because the inner frontend is entered over a UNIX socket
        where `dst_port` does not resolve, so the var is empty for every request
        that arrives through the demux. Logging it would add a permanently-null
        key. Fixing this needs the port carried across the demux hop first.

        Deliberately omitted: %cp — the client PORT. Note the reason changed with
        the UUIDv7 request id: the old `%ci:%cp_%fi:%fp_...` format carried the
        port, an opaque uuid(7) does not. It stays out because a source port
        identifies a connection rather than a request. Also omitted: %U, %Tt (inflated by
        keep-alive idle next to t_total), the %ac/%fc/%bc/%sc concurrency
        counters and %sq/%bq queue depths (Prometheus answers saturation better,
        and queues stay 0 without an opt-in maxconn), %r (duplicates
        method/path/http_version and carries the query), and %CC/%CS cookies.
      -#}
      %(ts)[accept_date(ms),ms_utime(%Y-%m-%dT%H:%M:%S.%3NZ)]
      %(req_id)ID
      %(trace_id)[var(txn.trace_id)]
      %(client_ip)ci
      %(frontend)f
      %(backend)b
      %(server)s
      %(method)HM
      %(host)[var(txn.host)]
      %(path)HPO
      %(http_version)HV
      %(status:sint)ST
      %(bytes:sint)B
      %(t_request:sint)TR
      %(t_queue:sint)Tw
      %(t_connect:sint)Tc
      %(t_response:sint)Tr
      %(t_total:sint)Ta
      %(retries:sint)rc
      %(term)tsc
      %(resource)[var(txn.resource_id)]
      %(denied_by)[var(txn.denied_by)]

  # ============================================================================
  # Frontend Routing Logic
  # ============================================================================

  # ----------------------------------------------------------------------------
  # util-routing-prefix / util-routing-suffix
  #
  # The two `frontend-routing-logic{,-regex-last}` variants share ~100 lines
  # of host extraction + host_match cascade + listener_port translation
  # (the prefix) and ~30 lines of qualifier parsing + MULTIBACKEND routing
  # + owner-resource identity (the suffix). The only difference is the
  # four path-matching set-var lines in the middle (regex's place in the
  # cascade). Hoisting the prefix and suffix into shared snippets means
  # there's exactly one source for the cascade — Gitar already caught a
  # lockstep drift on this MR (the regex-last variant was missing the
  # listener_port setup), and the shared snippet is what prevents the
  # next one. The variants below are 1-line shells that render the
  # prefix, emit their unique path-match cascade, and render the suffix.
  # ----------------------------------------------------------------------------
  util-routing-prefix:
    template: |
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      http-request set-var(txn.base) base
      http-request set-var(txn.path) path
      http-request set-var(txn.host_full) req.hdr(Host),lower
      http-request set-var(txn.host) req.hdr(Host),field(1,:),lower
      http-request set-var(txn.dst_port) dst_port
      http-request set-var(txn.listener_port) var(txn.dst_port)
      {#- Extension point: libraries may remap txn.listener_port from bind metadata.
          The blank line before render_glob is load-bearing (charts/CLAUDE.md → Whitespace Control). -#}

      {{ render_glob "frontend-routing-listener-port-*" }}
      # host_match cascade: full-host (port-pinned) > host:listener_port
      # (per-Gateway / per-listener-port scope) > host > wildcard > regex >
      # :listener_port catch-all. The port-scoped exact lookup MUST precede
      # the bare-host lookup: a hostname that appears on several listener
      # ports (e.g. foo.com on :80, :8080, :8090) has a distinct
      # `host:<podPort>` key for each non-default port plus a bare key for
      # the default port. Trying bare first would shadow the port-specific
      # backends with the default-port one (HTTPRouteListenerPortMatching).
      http-request set-var(txn.host_match) str()
      http-request set-var(txn.host_match) var(txn.host_full),map({{ mapPath("host.map") }},'') if { var(txn.host_full) -m sub : } { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),concat(:,txn.listener_port,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),regsub(^[^.]*,,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),map_reg({{ mapPath("host-regex.map") }},'') if { var(txn.host_match) -m len 0 }
      # listener-port catch-all (:port keys) when no host matched
      http-request set-var(txn.host_match) str(:),concat(,txn.listener_port,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }

  util-routing-suffix:
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      # qualifier = field 1 of path_match (BACKEND | MULTIBACKEND)
      http-request set-var(txn.path_match_qualifier) var(txn.path_match),field(1,:)
      {#- Advanced matchers (method/header/query) may rewrite path_match; re-parse
          the qualifier afterwards, but only when a matcher actually emitted rules. -#}
      {%- var adv = render_glob "frontend-matchers-advanced-*" %}
      {{ adv }}
      {%- if strip(adv) != "" %}
      http-request set-var(txn.path_match_qualifier) var(txn.path_match),field(1,:)
      {%- end %}
      # MULTIBACKEND: weighted random selection
      http-request set-var(txn.total_weight) var(txn.path_match),field(2,:) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.random_weight) rand(),mod(txn.total_weight) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.route_key) var(txn.path_match),field(3,:) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.lookup_key) var(txn.random_weight),concat(:,txn.route_key,) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.backend_name) var(txn.lookup_key),map({{ mapPath("weighted-multi-backend.map") }}) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      # BACKEND: direct routing
      http-request set-var(txn.backend_name) var(txn.path_match),field(2,:) if { var(txn.path_match_qualifier) -m str BACKEND }
      # owner resource id <ns>/<name>, keying per-resource feature maps (auth, coraza, …). See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      http-request set-var(txn.resource_namespace) var(txn.backend_name),field(1,_) if { var(txn.path_match_qualifier) -m str BACKEND }
      http-request set-var(txn.resource_name)      var(txn.backend_name),field(2,_) if { var(txn.path_match_qualifier) -m str BACKEND }
      http-request set-var(txn.resource_namespace) var(txn.route_key),field(1,_)    if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.resource_name)      var(txn.route_key),field(2,_)    if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      {#- The Gateway branch reads txn.gw_rule_id (set by
          frontend-matchers-advanced-500-gateway for every winning route rule,
          shape <ns>_<name>_<ruleIdx>). It was `req.gw_rule_id` until MR !1412 —
          a scope nobody ever writes — so the condition was always false and
          Gateway requests fell through to the BACKEND branch above, which split
          the `gtw_<ns>_<name>_<svc>_<port>` backend name and produced
          resource_id="gtw/<ns>". Every per-resource feature map (WAF, auth,
          rate limit, cache, schema validation) is keyed on resource_id. -#}
      http-request set-var(txn.resource_namespace) var(txn.gw_rule_id),field(1,_)   if { var(txn.gw_rule_id) -m found }
      http-request set-var(txn.resource_name)      var(txn.gw_rule_id),field(2,_)   if { var(txn.gw_rule_id) -m found }
      http-request set-var(txn.resource_id) var(txn.resource_namespace),concat(/,txn.resource_name,) if { var(txn.resource_namespace) -m found }

  frontend-routing-logic:
    template: |-
      {#-
        Path-based routing with qualifier system for backend selection.

        Qualifiers (set by map files, resolved here):
          - BACKEND:<name> → Direct routing to named backend
          - MULTIBACKEND:<weight>:<key> → Weighted routing via weighted-multi-backend.map

        Path Matching Order: Exact > Regex > Prefix-exact > Prefix
        (To select the alternative performance-first order — Exact > Prefix-exact >
         Prefix > Regex — set extraContext.routing.regexMatchOrder=last in
         values.yaml. The chart swaps in the frontend-routing-logic-regex-last
         variant below at load time.)

        Extension Points:
          - frontend-matchers-advanced-* → Advanced matchers (method, headers, query)
      -#}
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      # base/frontend-routing-logic — host/path → backend. See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      {{ render "util-routing-prefix" }}
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-exact.map") }})
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_reg({{ mapPath("path-regex.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-prefix-exact.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_beg({{ mapPath("path-prefix.map") }}) if !{ var(txn.path_match) -m found }
      {{ render "util-routing-suffix" }}

  frontend-routing-logic-regex-last:
    template: |-
      {#-
        Performance-first path matching variant: Exact > Prefix-exact > Prefix > Regex.

        This snippet exists only to be swapped into "frontend-routing-logic" by
        haptic.mergeLibraries when extraContext.routing.regexMatchOrder=last.
        It is unset before the merged config is rendered, so it never appears in
        the operator-visible HAProxyTemplateConfig output.

        Differs from the default variant only in the four path-matching set-var
        lines below (regex moved to last); the shared prefix and suffix are
        emitted via util-routing-prefix / util-routing-suffix to eliminate
        lockstep drift.
      -#}
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      # base/frontend-routing-logic (regex-last variant)
      {{ render "util-routing-prefix" }}
      # Path matching: Exact > Prefix-exact > Prefix > Regex
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-exact.map") }})
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-prefix-exact.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_beg({{ mapPath("path-prefix.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_reg({{ mapPath("path-regex.map") }}) if !{ var(txn.path_match) -m found }
      {{ render "util-routing-suffix" }}

  # ============================================================================
  # Backend Server Generation
  # ============================================================================

  # ----------------------------------------------------------------------------
  # Backend Server Generation - Helper Macros
  # ----------------------------------------------------------------------------

  util-backend-servers-helpers:
    template: |
      {#-
        Helper macros for BackendServers. Import these using:
          {% import "util-backend-servers-helpers" for BuildServerOptions %}
      -#}

      {#- Builds the HAProxy server options string (flags, maxconn).
          Called inline in server line output.
      -#}
      {% macro BuildServerOptions(serverOpts map[string]any) %}
        {%- var opts = "" -%}
        {%- var flags = serverOpts | dig("flags") | toSlice() -%}
        {%- if len(flags) > 0 -%}
          {%- opts = " " + join(toStringSlice(flags), " ") -%}
        {%- end -%}
        {%- if maxconn := serverOpts | dig("podMaxconnValue"); maxconn != nil -%}
          {%- opts = opts + " maxconn " + tostring(maxconn) -%}
        {%- end -%}
        {{- opts -}}
      {% end %}

  # ----------------------------------------------------------------------------
  # Service Port Resolution
  # ----------------------------------------------------------------------------

  util-service-port-resolution:
    template: |
      {#-
        ResolveServicePort - Resolve an Ingress/Gateway service-port reference to
        a concrete {port: int, name: string} pair by consulting the target Service.

        This is the single source of truth for translating the Kubernetes
        ServiceBackendPort shape ({number?: int, name?: string}) into the values
        BackendServers needs. All ingress / gateway / NGINX / haproxy-ingress /
        haproxytech library backend-rendering call sites must call this macro
        before invoking BackendServers — passing nil for portName to BackendServers
        (the old pattern) silently produces broken `:80` configs whenever a
        backend is referenced by port.name on a Service that does not also expose
        port 80.

        Parameters:
          namespace    - Service namespace (string)
          serviceName  - Service name (string)
          portRef      - The `port` value from an Ingress / Gateway / HTTPRoute
                         backend reference. Accepts either a dict shape
                         {number?: int, name?: string} (Kubernetes Ingress) or
                         a bare integer (Gateway API BackendObjectReference.port),
                         or nil.

        Returns:
          string — space-separated "<portNumber> <portName>" where portName is
          "" (empty string) when the Service port is unnamed. The macro must
          return a content-format type (Scriggo language constraint), which is
          why this is encoded as a string instead of a map. Unpack with
          split(ResolveServicePort(...), " ") → [portNumber, portName]. See
          the Example block below.

        Failure modes (call fail() and abort the render):
          - portRef is nil or has neither number nor name
          - portRef.name is set but the Service EXISTS and has no port with
            that name (a typo — fail loudly, see below)
          - Resolved port is <= 0 while the Service exists (defensive: e.g.
            Service port entry has port: 0)

        Non-failure (missing Service — Kubernetes eventual consistency):
          A reference to a Service that is not in the store never aborts the
          render. An Ingress may legally be created before the Service it
          references, and the admission webhook's dry-run render can run
          before a just-created Service reaches the controller's watch cache
          (issue #50 — hard-failing here flaked ingress-conformance at
          admission and, worse, blocked the ENTIRE haproxy.cfg render in the
          reconcile loop until the Service appeared). Behavior:
          - portRef.number given: the numeric port is trusted without Service
            validation; name backfill is best-effort (name="" if unknown).
          - portRef.name given: resolves to "0 <name>". BackendServers skips
            endpoints without a resolvable port, so the backend renders with
            placeholder slots only (503 for this route) and converges on a
            later reconcile once the Service and its EndpointSlices arrive.
            When that leaves a backend placeholder-only, BackendServers
            records the reference under shared "degradedBackendRef:*" keys;
            the ingress library reads those back to emit Warning Events on
            the owning Ingresses (issue #66) so a permanent Service-name
            typo isn't a silent 503.

        Why fail() not silent fallback:
          The previous fallback-to-80 behavior silently produced unusable HAProxy
          configs (server lines pointing at ports nothing was listening on) that
          looked syntactically valid; a real-world ingress for a unifi controller
          served 503 with <NOSRV>/SC-- for 73 days before the issue was noticed.
          fail() aborts the render, surfaces in controller logs and Ingress/
          Gateway `deployFailed` status, and leaves the last-known-good config
          serving — so a single misconfigured ingress doesn't break the cluster.

        Example:
          {%- var resolved = split(ResolveServicePort(tostring(ns), tostring(svcName), svc | dig("port")), " ") -%}
          {%- var port = toint(resolved[0]) -%}
          {%- var portName = resolved[1] -%}
          # Now: port is the Service port number; portName is "" if the Service port is unnamed.
          # Pass both to BackendServers(svcName, 0, port, nil, portName, backendKey, ns).
      -#}
      {% macro ResolveServicePort(namespace string, serviceName string, portRef any) string %}
        {%%
          // Accept either a {number?, name?} dict (Ingress's ServiceBackendPort shape)
          // or a bare numeric port (Gateway API's BackendObjectReference.port is a
          // *PortNumber — a bare int).
          var portNumber = 0
          var portName = ""
          if portRef != nil {
            // Try the dict shape first.
            var n = toint(portRef | dig("number") | fallback(0))
            var nm = tostring(portRef | dig("name") | fallback(""))
            if n > 0 || nm != "" {
              portNumber = n
              portName = nm
            } else {
              // Fall back to the bare-int shape.
              portNumber = toint(portRef)
            }
          }

          var resolvedPort = 0
          var resolvedName = ""
          var serviceMissing = false

          if portNumber > 0 {
            // Number given: trust it. Try to backfill name from the Service for the
            // `# Backend for:` comment and the first_seen deduplication key.
            resolvedPort = portNumber
            var svc = resources.services.GetSingle(namespace, serviceName)
            if svc != nil {
              for _, sp := range svc.Spec.Ports {
                if toint(sp.Port) == portNumber {
                  resolvedName = sp.Name
                  break
                }
              }
            }
          } else if portName != "" {
            // Name given, no number: look up the numeric port from the Service.
            var svc = resources.services.GetSingle(namespace, serviceName)
            if svc == nil {
              // Service not in the store (yet). Kubernetes is eventually
              // consistent: an Ingress may legally be created before the
              // Service it references (kubectl apply of a directory has no
              // ordering guarantee), and the admission webhook's dry-run
              // render can run before a just-created Service reaches the
              // controller's watch cache (issue #50 — this exact fail()
              // flaked the ingress-conformance wildcard test with an
              // admission denial, and in the reconcile loop it blocked the
              // entire haproxy.cfg render until the Service appeared).
              // Tolerate: resolve to port 0 with the requested name.
              // BackendServers skips endpoints without a resolvable port, so
              // the backend renders with placeholder slots only (503 for this
              // route) and converges once the Service arrives. A Service that
              // EXISTS but lacks the named port still fails below — that is a
              // real config error (typo), not a propagation race.
              serviceMissing = true
              resolvedName = portName
            } else {
              var found = false
              for _, sp := range svc.Spec.Ports {
                if sp.Name == portName {
                  resolvedPort = toint(sp.Port)
                  resolvedName = portName
                  found = true
                  break
                }
              }
              if !found {
                // Build a list of the Service's actual port names so the operator
                // can spot typos at a glance in the controller logs.
                var available = []any{}
                for _, sp := range svc.Spec.Ports {
                  available = append(available, sp.Name +
                    "(" + tostring(toint(sp.Port)) + ")")
                }
                fail("ResolveServicePort: Service " + namespace + "/" + serviceName +
                  " has no port named '" + portName + "' (available: [" +
                  join(toStringSlice(available), ", ") + "])")
              }
            }
          } else {
            var portRefStr = "nil"
            if portRef != nil {
              portRefStr = tostring(portRef)
            }
            fail("ResolveServicePort: Service " + namespace + "/" + serviceName +
              " referenced with neither port.number nor port.name (portRef=" +
              portRefStr + ")")
          }

          if resolvedPort <= 0 && !serviceMissing {
            fail("ResolveServicePort: Service " + namespace + "/" + serviceName +
              " port resolution yielded 0 (portRef=" + tostring(portRef) + ")")
          }
          show tostring(resolvedPort) + " " + resolvedName
        %%}
      {% end %}

  # ----------------------------------------------------------------------------
  # Backend Server Generation - Main Macro
  # ----------------------------------------------------------------------------

  util-backend-servers:
    template: |
      {#-
        BackendServers - Generates HAProxy server lines from Kubernetes EndpointSlices.

        This macro handles the complete flow:
        1. Resolve server slot count from parameters or defaults
        2. Look up the Service to find port name (for targetPort resolution)
        3. Fetch EndpointSlices and resolve actual pod ports
        4. Build slot assignment map from current config (if available)
        5. Assign endpoints to slots, preserving existing assignments
        6. Generate server lines with proper options

        Slot Preservation (Zero-Reload Updates):
        When currentConfig is available, the macro looks up the existing backend
        and preserves server slot assignments during rolling deployments. This
        enables zero-reload updates via HAProxy runtime API by keeping the same
        SRV_N slot for each pod IP:port combination across config changes.

        Parameters:
          serviceName    - Service name to look up endpoints
          maxServerSlots - Max slots (0 = use serverOpts.serverSlotsValue or default 10)
          port           - Service port number (may differ from pod port via targetPort)
          serverOpts     - Options map:
                             .serverSlotsValue - override slot count
                             .flags[]          - server flags (e.g., "backup", "weight 10")
                             .podMaxconnValue  - per-server maxconn
          portName       - Port name for targetPort resolution (nil = auto-lookup)
          backendName    - HAProxy backend name for slot preservation (nil = disabled)

        Example:
          {{ BackendServers("my-service", 0, 80, serverOpts, nil, "default_my-ingress_svc_my-service_http", "default") }}

        Output:
          server SRV_1 10.0.0.1:8080 enabled  # Pod: my-pod-abc
          server SRV_2 10.0.0.2:8080 enabled  # Pod: my-pod-def
          server SRV_3 192.0.2.1:1 disabled  # Placeholder
          ...
      -#}
      {% import "util-backend-servers-helpers" for BuildServerOptions %}
      {% macro BackendServers(serviceName string, maxServerSlots int, port int, serverOpts map[string]any, portName any, backendName any, namespace string) %}
        {%%
          // ── 1. Resolve server slot count ──────────────────────────────────
          // Priority: maxServerSlots param > serverOpts.serverSlotsValue > default (10)
          var slots = 10
          if maxServerSlots > 0 {
            slots = maxServerSlots
          } else if v := serverOpts | dig("serverSlotsValue"); v != nil {
            slots = toint(v)
          }

          // ── 1b. Optional slot prefix + weight ─────────────────────────────
          // slotPrefix (default "SRV_") lets ONE backend host servers from
          // several Services in disjoint, independently-preserved slot ranges
          // (weighted TCPRoute: `balance roundrobin` across backendRefs). Each
          // Service is emitted with its own prefix so the reload-free slot
          // preservation reads back only its own slots. weight (optional)
          // appends ` weight N` for proportional load-balancing. Both default
          // to the current behaviour, so existing single-Service callers are
          // byte-for-byte unchanged.
          var slotPrefix = "SRV_"
          if v := serverOpts | dig("slotPrefix"); v != nil && tostring(v) != "" {
            slotPrefix = tostring(v)
          }
          var weightSuffix = ""
          if v := serverOpts | dig("weight"); v != nil {
            weightSuffix = " weight " + tostring(toint(v))
          }

          // ── 2. Get port name for targetPort resolution ────────────────────
          // If provided as parameter, use it. Otherwise, look it up below.
          var pn = ""
          if portName != nil && tostring(portName) != "" {
            pn = tostring(portName)
          }

          // ── 3. Fetch EndpointSlices for the service ───────────────────────
          var allSlices = resources.endpoints.Fetch(namespace, serviceName)

          // ── 4. Look up port name from Service if not provided ─────────────
          // This enables targetPort resolution (service port → pod port)
          if pn == "" && len(allSlices) > 0 {
            if namespace != "" {
              var svc = resources.services.GetSingle(namespace, serviceName)
              if svc != nil {
                for _, sp := range svc.Spec.Ports {
                  if toint(sp.Port) == port {
                    pn = sp.Name
                    break
                  }
                }
              }
            }
          }

          // ── 5. Collect endpoints with resolved ports ──────────────────────
          var endpoints = []any{}
          for _, slice := range allSlices {
            // Resolve pod port from EndpointSlice's ports array
            var slicePorts = slice.Ports
            var resolvedPort = 0

            if pn != "" {
              // A Service selector may match pods that do not expose the
              // requested named targetPort. Kubernetes represents those pods
              // in a separate EndpointSlice whose ports list omits that name
              // (and may be empty). Never fall back to the Service port for
              // such a slice: the endpoint is not valid for this Service port.
              for _, p := range slicePorts {
                if p.Name == pn {
                  resolvedPort = toint(p.Port)
                  break
                }
              }
            } else {
              // Without a port name, retain the resolved Service port as the
              // compatibility fallback. A single concrete EndpointSlice port
              // is more precise and wins when present.
              resolvedPort = port
              if len(slicePorts) == 1 {
                var endpointPort = toint(slicePorts[0].Port)
                if endpointPort > 0 {
                  resolvedPort = endpointPort
                }
              }
            }
            // Note: If multiple ports exist but no name available,
            // we use the service port as fallback.

            if resolvedPort <= 0 {
              // No resolvable port for this slice: the referenced Service is
              // not in the store yet (ResolveServicePort returned 0 for a
              // by-name reference) and this slice doesn't carry the named
              // port either. An `addr:0` server line would be meaningless —
              // leave the slots as placeholders and let a later reconcile
              // converge once the Service arrives.
              continue
            }

            // Collect addresses from this slice. Filter on the
            // EndpointSlice conditions so endpoints whose pods aren't
            // actually serving don't end up in the backend:
            //
            //   - Ready=false: the pod is in the slice but the
            //     container isn't listening yet (kubelet adds new
            //     pods at PodReadyToStartContainers, well before
            //     the readiness probe flips Ready=true). Including
            //     it puts a dead IP in the SRV slot → HAProxy
            //     returns 503 SC-- on dispatch until the next
            //     reconcile catches up.
            //
            //   - Terminating=true: kubelet has sent SIGTERM and
            //     most apps stop accepting new connections on
            //     SIGTERM, well before the terminationGracePeriod
            //     elapses. Including it lets HAProxy keep dispatching
            //     to a draining/dead pod → 503 SC-- during the
            //     rolling-restart drain window.
            //
            // Per the K8s EndpointSlice spec, a nil Conditions.Ready
            // means "ready" (the producer didn't set it), so only
            // skip when explicitly false. Conditions.Terminating
            // defaults to nil/false; only skip when explicitly true.
            // Tested by validationTests test-ingress-endpoint-conditions-filter
            // in libraries/ingress.yaml.
            for _, ep := range slice.Endpoints {
              if ep.Conditions.Ready != nil && !*ep.Conditions.Ready {
                continue
              }
              if ep.Conditions.Terminating != nil && *ep.Conditions.Terminating {
                continue
              }
              for _, addr := range ep.Addresses {
                var name = ep.TargetRef.Name
                if name == "" { name = addr }
                endpoints = append(endpoints, map[string]any{
                  "name": name, "address": addr, "port": resolvedPort,
                })
              }
            }
          }

          // ── 5b. Record degraded by-name references for visibility ─────────
          // port <= 0 is only reachable when ResolveServicePort degraded a
          // by-NAME reference because the Service is absent from the store
          // (issue #66). If on top of that no EndpointSlice carried the named
          // port, this backend renders placeholder-only slots and serves 503 —
          // correct during a propagation race, but a Service-name typo would
          // stay silent forever. Mark the reference in the shared context so
          // post-config visibility surfaces (the ingress library's
          // `ingress-degraded-backend-events` k8sResources template) can map
          // it back to the owning resources after the render. When a slice
          // DOES resolve the named port, real servers were emitted and traffic
          // flows — no signal. ComputeIfAbsent is goroutine-safe (backends
          // render in shards) and dedups repeated references.
          if port <= 0 && pn != "" && len(endpoints) == 0 {
            shared.ComputeIfAbsent("degradedBackendRef:"+namespace+"/"+serviceName+"/"+pn,
              func() any { return true })
          }

          // ── 6. Build slot assignment map from current config ──────────────
          // Servers come from currentConfig.ServerIndex[bkName] — the upstream
          // value map `backend.Servers` is deliberately left nil by haptic's
          // parserconfig (see pkg/dataplane/parser/parserconfig/config.go).
          // highestUsedSlot is used by step 7's second pass to allocate new
          // endpoints AFTER all currently-used slots — never reusing a slot
          // freshly vacated in the same render. Required for option redispatch
          // to have a healthy fallback under merged rolling-restart EPS events.
          var existingSlots = map[string]int{}
          var usedSlots = map[int]bool{}
          var highestUsedSlot = 0
          var bkName = ""
          if backendName != nil {
            bkName = tostring(backendName)
          }
          if bkName != "" && !isNil(currentConfig) {
            var bkServers = currentConfig.ServerIndex[bkName]
            if bkServers != nil {
              for serverName, server := range bkServers {
                // Extract slot number from server name (e.g., "SRV_1" → 1)
                if hasPrefix(serverName, slotPrefix) {
                  var slotStr = serverName[len(slotPrefix):]
                  var slotNum = toint(slotStr)
                  if slotNum > 0 && slotNum <= slots {
                    // Skip placeholders (the unroutable sentinel on port 1) and
                    // any server without a resolvable port — we can't form an
                    // address:port slot key without one, and dereferencing a nil
                    // Port would panic. Both the current sentinel (192.0.2.1) and
                    // the legacy one (127.0.0.1) are skipped so slot preservation
                    // is correct across a rolling chart upgrade, where the live
                    // pod config still carries 127.0.0.1:1 placeholders until its
                    // first post-upgrade reload.
                    if server.Port != nil && !(*server.Port == 1 && (server.Address == "192.0.2.1" || server.Address == "127.0.0.1")) {
                      var key = server.Address + ":" + tostring(*server.Port)
                      existingSlots[key] = slotNum
                      usedSlots[slotNum] = true
                      if slotNum > highestUsedSlot {
                        highestUsedSlot = slotNum
                      }
                    }
                  }
                }
              }
            }
          }

          // ── 7. Assign endpoints to slots with preservation ────────────────
          // First pass: endpoints already in the prior config keep their slot.
          // Second pass: NEW endpoints take slots AFTER all currently-used
          // ones (highestUsedSlot+1, wrap at slots+1 → 1). Never reuse a
          // freshly-vacated slot — keeps the old slot as a drained
          // placeholder so option redispatch has a healthy fallback when a
          // rolling-restart's old-pod-terminating + new-pod-ready EPS events
          // are merged into one render.
          var slotAssignments = map[int]map[string]any{}  // slot → endpoint
          var unassignedEndpoints = []any{}

          // First pass: preserve existing slot assignments
          for _, ep := range endpoints {
            var epMap = ep.(map[string]any)
            var key = tostring(epMap["address"]) + ":" + tostring(epMap["port"])
            if slot, ok := existingSlots[key]; ok {
              slotAssignments[slot] = epMap
            } else {
              unassignedEndpoints = append(unassignedEndpoints, ep)
            }
          }

          // Second pass: allocate AFTER highestUsedSlot (wrap when needed).
          var nextFreeSlot = highestUsedSlot + 1
          if nextFreeSlot > slots {
            nextFreeSlot = 1
          }
          for _, ep := range unassignedEndpoints {
            var attempts = 0
            for slotAssignments[nextFreeSlot] != nil {
              nextFreeSlot++
              if nextFreeSlot > slots {
                nextFreeSlot = 1
              }
              attempts++
              if attempts > slots {
                break
              }
            }
            if slotAssignments[nextFreeSlot] == nil {
              slotAssignments[nextFreeSlot] = ep.(map[string]any)
              nextFreeSlot++
              if nextFreeSlot > slots {
                nextFreeSlot = 1
              }
            }
          }
        %%}
      {#- ── 8. Generate server lines ──────────────────────────────────────
        Server addresses are CONFIG-DRIVEN across reloads. HAProxy does NOT
        restore an IP-literal server's address from the server-state-file: the
        state-file address is only stashed in `srv->lastaddr` and applied via
        the `init-addr` resolution chain, which `srv_init_addr()` runs ONLY for
        FQDN / DNS-SRV servers (`if (srv->hostname || srv->srvrq)` in
        src/server.c). Pod servers are IP literals, so the parsed config
        address always wins on reload — `init-addr last` + the server-state
        machinery were a no-op for our address and have been removed. The full
        analysis and the alternatives we rejected (DNS/server-template) are in
        docs/adr/0011-no-haproxy-server-state-file.md. Correctness relies on the
        deploy pipeline rendering the CURRENT endpoints into the config (the
        single deploy-loop keeps it fresh) plus the runtime fast path for live,
        reload-free convergence.

        Placeholders use 192.0.2.1 (RFC 5737 TEST-NET-1, guaranteed unroutable),
        NOT 127.0.0.1 — defense in depth. If anything ever produced a slot with
        a placeholder address but an active port, 127.0.0.1:<bind-port> would
        point back at this proxy's own `bind *:80` and loop the request through
        the h2c loopback until `tune.http.maxhdr` trips → 400. 192.0.2.1 can
        never reach the bind, so the worst case is a fast `timeout connect` +
        `option redispatch` failover instead of an unbounded self-loop. -#}
      {%- for i := 1; i <= slots; i++ %}
      {%- if ep := slotAssignments[i]; ep != nil %}
      server {{ slotPrefix }}{{ i }} {{ ep["address"] }}:{{ ep["port"] }}{% if bkName != "" %} guid {{ make_guid("srv", bkName, slotPrefix + tostring(i)) }}{% end %} enabled{{ weightSuffix }}  # Pod: {{ ep["name"] }}
      {% else %}
      server {{ slotPrefix }}{{ i }} 192.0.2.1:1{% if bkName != "" %} guid {{ make_guid("srv", bkName, slotPrefix + tostring(i)) }}{% end %} disabled{{ weightSuffix }}  # Placeholder
      {% end %}
      {% end %}
      {% end %}
  # ============================================================================
  # Address Discovery
  # ============================================================================

  features-075-address-discovery:
    template: |
      {#-
        Address Discovery

        Purpose: Reads controller LoadBalancer service statuses to discover
        external addresses for status patches. Aggregates addresses from all
        matching services (e.g., internal + public LoadBalancers).

        Extension Point: features-* (priority 075 - after ssl init at 050, before TLS at 100)

        Provides (in gf["addresses"]):
          - Array of LoadBalancer ingress entries ({ip, hostname}) from all services
          - Deduplicated by ip or hostname to avoid redundant status entries
          - nil if no LoadBalancer addresses available

        Dependencies: None (initializes globalFeatures if needed)

        Used By:
          - status-patches-200-ingress
          - status-patches-200-gateway

        Not used by:
          - status-patches-100-gatewayclass — GatewayClass status doesn't carry addresses.
      -#}

      {#- Ensure globalFeatures is initialized (may not exist if SSL library is disabled) -#}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any {
        return map[string]any{}
      }) -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%%
        var addresses []any
        var seen = map[string]bool{}
        for _, svc := range resources.controller_services.List() {
          // Extract only ip/hostname to avoid SSA schema errors from
          // fields like ipMode that may not exist in target resource schemas
          for _, entry := range svc.Status.LoadBalancer.Ingress {
            var clean = map[string]any{}
            var ip = entry.Ip
            var hostname = entry.Hostname
            if ip != "" {
              clean["ip"] = ip
            }
            if hostname != "" {
              clean["hostname"] = hostname
            }
            if len(clean) > 0 {
              // Deduplicate by ip or hostname across services
              var key = ip + "/" + hostname
              if !seen[key] {
                seen[key] = true
                addresses = append(addresses, clean)
              }
            }
          }
        }

        // Cluster-IP fallback: when no LoadBalancer ingress is
        // available (NodePort / ClusterIP service types, bare-metal
        // clusters without metallb), fall back to the service's own
        // ClusterIPs so Gateway/Ingress status carries SOMETHING. The
        // fallback runs only when LB discovery returned nothing — we
        // don't want to mix LB-external IPs with cluster-internal
        // IPs in the same status block.
        if len(addresses) == 0 {
          for _, svc := range resources.controller_services.List() {
            for _, ipStr := range svc.Spec.ClusterIPs {
              // "None" is a sentinel for headless services and is
              // never a routable IP. Skip empty values too.
              if ipStr != "" && ipStr != "None" {
                if !seen[ipStr+"/"] {
                  seen[ipStr+"/"] = true
                  addresses = append(addresses, map[string]any{"ip": ipStr})
                }
              }
            }
          }
        }
        var statusPatchesEnabled bool = extraContext | dig("statusPatches", "enabled") | fallback(true)
        if statusPatchesEnabled {
          // Always set gf["addresses"] when status patches are enabled
          // (even as an empty slice). Downstream snippets gate on
          // `gf["addresses"] != nil`, so leaving it nil would suppress
          // ALL status patches — including Gateway Accepted=True, which
          // the Gateway API spec requires regardless of whether the
          // implementation has assigned an external address yet.
          // Empty addresses → conditions still get written; the macros
          // surface that as Programmed=False / AddressNotAssigned via
          // the deployFailed variant.
          gf["addresses"] = addresses
        }
      %%}

  # ============================================================================
  # Extension Points
  # ============================================================================

  # Global section directives — override or extend via global-settings-* snippets.
  # Users can override specific groups (e.g., defaults-settings-300-timeouts)
  # or add new ones (e.g., global-settings-500-tuning).
  global-settings:
    template: |
      {#- Renders global-settings-* snippets (global section directives) -#}
      {{- render_glob "global-settings-*" | strip() -}}

  global-settings-050-experimental:
    template: |
      {%- var shmEnabled bool = extraContext | dig("shmStatsEnabled") | fallback(false) -%}
      {%- if shmEnabled && semver_gte(extraContext | dig("haproxyVersion") | fallback(""), "3.3") %}
      expose-experimental-directives
      {%- end %}

  global-settings-100-logging:
    template: |
      {#-
        `format raw` strips the syslog header ("<134>Jul 25 21:01:17
        haproxy[1]: ") that would otherwise precede every JSON record and break
        a collector that parses lines directly. It also removes the syslog
        timestamp, which is why log-fields-100-core carries its own `ts`.

        Argument order is mandatory: `log <target> [len <n>] [format <f>]
        <facility> [<level>]`. `format raw len 16384` is a fatal config error.

        `len` truncates mid-byte, and a truncated JSON record is unparseable, so
        the default is generous. Raise it with
        extraContext.accessLog.maxLineBytes if custom fields or captured headers
        push records past it.
      -#}
      {#- The bound is enforced here as well as in the chart's Helm validation,
          because a hand-written HAProxyTemplateConfig reaches the engine without
          passing through Helm at all. Too small truncates every record into
          invalid JSON; a negative or absurd value is an HAProxy config error. -#}
      {#- Check the raw value's shape BEFORE converting: toint() saturates an
          absurd digit string to int64 min (-9223372036854775808), which the range
          check below would reject — but reporting that number instead of what the
          operator wrote is a poor diagnostic, and it leans on an overflow
          artifact rather than an explicit rule. Five digits covers 65535. -#}
      {%- var rawMax = tostring(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) -%}
      {%- if !regex_search(rawMax, "^[0-9]{1,5}$") -%}
        {{- fail("controller.config.templatingSettings.extraContext.accessLog.maxLineBytes must be an integer between 1024 and 65535, got '" + rawMax + "'.") -}}
      {%- end -%}
      {%- var maxLen = toint(rawMax) -%}
      {%- if maxLen < 1024 || maxLen > 65535 -%}
        {{- fail("controller.config.templatingSettings.extraContext.accessLog.maxLineBytes must be an integer between 1024 and 65535, got " + tostring(maxLen) + ". Below 1024 every JSON access-log record would be truncated into invalid JSON.") -}}
      {%- end -%}
      log stdout len {{ maxLen }} format raw local0 info

  global-settings-200-process:
    template: |
      {%- var processModel = extraContext | dig_string("daemon", "processModel") -%}
      {{ processModel }}
      {%- var nbthread = extraContext | dig("nbthread") | fallback(0) | toint() -%}
      {%- if nbthread > 0 %}
      nbthread {{ nbthread }}
      {%- end %}

  global-settings-210-graceful-reload:
    template: |
      {#- Graceful-stop bound: cap how long an old worker keeps draining -#}
      {#- after a reload. Without it, a worker pinned by a persistent -#}
      {#- keep-alive connection survives every reload and accumulates as a -#}
      {#- stale "draining" generation; a request looped through the -#}
      {#- http-tcp -> unix-socket -> http_frontend path can then land on a -#}
      {#- stale worker mid-reload and be corrupted (-> <BADREQ> 400). Both -#}
      {#- the official (haproxytech/kubernetes-ingress, default 30m) and -#}
      {#- community (haproxy-ingress, default 10m) controllers set -#}
      {#- hard-stop-after for this. The primary churn reducer is -#}
      {#- minDeploymentInterval (structural reloads only; the runtime fast -#}
      {#- path stays instant and bypasses it). -#}
      {%- var hsa = extraContext | dig("hardStopAfter") | fallback("10s") | tostring() -%}
      {%- if hsa != "" %}
      hard-stop-after {{ hsa }}
      {%- end %}

  global-settings-220-localpeer:
    template: |
      {#- Deterministic local-peer name so the always-on `peers localinstance` -#}
      {#- section (global-top-050-peers) recognises `peer local ...` as THIS -#}
      {#- process and LISTENS on it. On a master-worker reload the old worker -#}
      {#- then teaches the new worker its stick-table contents over that local -#}
      {#- peer, so per-source counters (e.g. rate-limit http_req_rate) survive -#}
      {#- the reload instead of resetting to zero. A static name keeps offline -#}
      {#- `haproxy -c` validation deterministic (no $HOSTNAME dependency); the -#}
      {#- single 127.0.0.1 peer never connects to other pods, so stick-tables -#}
      {#- stay per-replica (matches haproxytech/kubernetes-ingress). -#}
      localpeer local

  global-settings-250-shm-stats:
    template: |
      {%- var shmEnabled bool = extraContext | dig("shmStatsEnabled") | fallback(false) -%}
      {%- if shmEnabled && semver_gte(extraContext | dig("haproxyVersion") | fallback(""), "3.3") %}
      shm-stats-file {{ extraContext | dig("shmStatsPath") | fallback("/dev/shm/haproxy-stats") }}
      shm-stats-file-max-objects {{ extraContext | dig("shmStatsMaxObjects") | fallback(50000) }}
      {%- end %}

  global-settings-300-paths:
    template: |
      default-path origin {{ pathResolver.GetBaseDir() }}
      crt-base {{ pathResolver.GetPath("", "cert") }}

  # NOTE: there is deliberately no `server-state-file` / `load-server-state-from-file`.
  # HAProxy does not restore an IP-literal server's address from the state file
  # (it only restores port/op-state/admin and stashes the address in lastaddr,
  # applied solely to FQDN/DNS-SRV servers), so the machinery did not preserve
  # pod addresses across reloads and its port restoration minted a stale-slot
  # hybrid. Removed; reloads are config-driven. See
  # docs/adr/0011-no-haproxy-server-state-file.md.

  # Defaults section directives — override or extend via defaults-settings-* snippets.
  defaults-settings:
    template: |
      {#- Renders defaults-settings-* snippets (defaults section directives) -#}
      {{- render_glob "defaults-settings-*" | strip() -}}

  defaults-settings-100-options:
    template: |
      mode http
      {#- Access-log targets, one `log` line each. This replaces the historical
          `log global`, which tied traffic logs to whatever the global section
          used: proxies now log where extraContext.accessLog.targets says, while
          HAProxy's own process and alert messages keep using the global stdout
          target. With the default (stdout/raw/local0/info) the rendered line is
          what `log global` resolved to anyway. -#}
      {{- render "util-access-log-targets" -}}
      {%- var alTargets = shared.Get("accessLogTargets").([]any) -%}
      {%- var alMaxLen = toint(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) -%}
      {%- for _, tAny := range alTargets %}
        {%- var t = tAny.(map[string]any) %}
      log {{ t["address"] }} len {{ alMaxLen }} format {{ t["format"] }} {{ t["facility"] }} {{ t["level"] }}
      {%- end %}
      option httplog
      option dontlognull
      option log-health-checks
      # Retry a failed TCP connect on a different server in the backend (not the
      # same dead one); with the default `retries 3` this closes the pod-termination
      # race during rolling updates. See https://haproxy-haptic.org/docs/latest/libraries/base/#connection-reliability-and-timeouts
      option redispatch

  defaults-settings-150-access-log-request-id:
    template: |
      {#-
        Request correlation id, always available as the access log's `req_id`
        field and forwardable upstream by the request-id annotation.

        RFC 9562 UUIDv7 (supported by `uuid()` since HAProxy 3.0, the chart's
        floor): opaque with respect to the client, but time-ordered, which gives
        better index locality in a log store than v4. It deliberately carries NO
        client information — the historical `%ci:%cp_%fi:%fp_%Ts_%rt:%pid` format
        embedded the client IP (personal data under GDPR Art. 4(1) / Recital 30)
        and the frontend's own address into a value that is forwarded upstream,
        echoed to clients, and copied into app logs and support tickets, where
        neither the retention nor the purpose was ever scoped for it. Removing
        the IP from the identifier is what makes dropping the `client_ip` field
        an effective redaction.

        Emitted at band 150 so a raw `config-defaults` injection (band 800) can
        still override it — `uuid()` for UUIDv4 is the documented alternative.
      -#}
      unique-id-format %[uuid(7)]

  defaults-settings-200-balance:
    template: |
      balance roundrobin

  defaults-settings-300-timeouts:
    template: |
      # timeout connect 100ms (vs the usual 5s): fast-fail a SYN to a just-terminated
      # pod IP so `option redispatch` retries a live server within ~200ms instead of
      # stalling 5s into a 504. Override extraContext.timeout_connect on slow networks.
      # See https://haproxy-haptic.org/docs/latest/libraries/base/#connection-reliability-and-timeouts
      timeout connect {{ extraContext | dig("timeout_connect") | fallback("100") }}
      timeout client {{ extraContext | dig("timeout_client") | fallback("50000") }}
      timeout server {{ extraContext | dig("timeout_server") | fallback("50000") }}
      {%- var tHttpReq = extraContext | dig_string("", "timeout_http_request") -%}
      {%- var tKeepAlive = extraContext | dig_string("", "timeout_http_keep_alive") -%}
      {%- if tHttpReq != "" %}
      timeout http-request {{ tHttpReq }}
      {%- end -%}
      {%- if tKeepAlive != "" %}
      timeout http-keep-alive {{ tKeepAlive }}
      {%- end %}

  defaults-settings-400-errorfiles:
    template: |
      errorfile 400 {{ pathResolver.GetPath("400.http", "file") }}
      errorfile 403 {{ pathResolver.GetPath("403.http", "file") }}
      errorfile 408 {{ pathResolver.GetPath("408.http", "file") }}
      errorfile 500 {{ pathResolver.GetPath("500.http", "file") }}
      errorfile 502 {{ pathResolver.GetPath("502.http", "file") }}
      errorfile 503 {{ pathResolver.GetPath("503.http", "file") }}
      errorfile 504 {{ pathResolver.GetPath("504.http", "file") }}

  frontend-filters-100-server-header:
    template: |
      {# Identify the controller in HTTP responses. Most ingress controllers
         (nginx-ingress, traefik, ...) emit a Server header by default; HAProxy
         does not. The upstream Ingress conformance suite asserts that responses
         carry a Server header (default-backend feature's header table), and
         backends like the upstream echo image don't emit one themselves, so
         the controller is expected to. Set rather than add so we don't stack
         a backend-provided Server with our own. The leading newline below is
         load-bearing: render_glob concatenates snippet outputs verbatim, and
         the previous snippet's `option forwardfor` has no trailing newline,
         so without one we render `option forwardforhttp-response ...` as a
         single fused line (see test-spoa-hub-frontend-filters-newline-after-
         forwardfor). #}
      {{ "\n" }}http-response set-header Server haptic

  frontend-filters-250-request-body-size:
    template: |
      {%- var bsMap, _ = pathResolver.GetPath("body-size.map", "map") -%}
      {# Resource-agnostic request body-size enforcement. The per-backend limit
         (bytes) is looked up from body-size.map keyed on the resolved backend;
         resource libraries populate that map via map-body-size-* snippets. When a
         backend has no entry the limit resolves to 0 and the deny never fires, so
         this static rule is inert until a map entry exists — which is what makes
         adding or raising a body-size limit a map-only (reload-free) change rather
         than a per-backend `http-request deny` (a backend-section reload). `add(0)`
         forces the map value to a signed integer; `sub(<var>)` then does the
         dynamic comparison the literal `req.body_size gt <N>` form can't express. #}
      {{ "\n" }}http-request set-var(txn.haptic_body_limit) var(txn.backend_name),map({{ bsMap }},0),add(0)
      {#- txn.denied_by names the gate that blocked the request in the access log.
          413 is also produced by the WAF and schema-validation body caps, so the
          status code alone can't attribute it. The condition is a byte-for-byte
          copy of the deny's; `deny` ends rule processing, so the first matching
          gate's value is the one that survives. -#}
      http-request set-var(txn.denied_by) str(body_too_large) if { var(txn.haptic_body_limit) -m int gt 0 } { req.body_size,sub(txn.haptic_body_limit) -m int gt 0 }
      http-request deny deny_status 413 if { var(txn.haptic_body_limit) -m int gt 0 } { req.body_size,sub(txn.haptic_body_limit) -m int gt 0 }

  frontend-filters-260-request-set-host:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-host.map", "map") -%}
      {# Resource-agnostic upstream Host override, keyed on the resolved backend.
         Relocated from a per-backend `http-request set-header Host`; resource
         libraries populate reqhdr-host.map via map-reqhdr-host-* snippets.
         Inert until a backend has an entry, so changing the Host is map-only. #}
      {{ "\n" }}http-request set-header Host %[var(txn.backend_name),map({{ m }})] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-261-request-set-xfwd-prefix:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-xfwd-prefix.map", "map") -%}
      {# Resource-agnostic X-Forwarded-Prefix override, keyed on the resolved backend. #}
      {{ "\n" }}http-request set-header X-Forwarded-Prefix %[var(txn.backend_name),map({{ m }})] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-262-request-set-connection:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-connection.map", "map") -%}
      {# Resource-agnostic Connection header override, keyed on the resolved backend. #}
      {{ "\n" }}http-request set-header Connection %[var(txn.backend_name),map({{ m }})] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-400-path-rewrite:
    template: |
      {%- var m, _ = pathResolver.GetPath("path-rewrite.map", "map") -%}
      {# Resource-agnostic full-path rewrite, keyed on the resolved backend. Only
         LITERAL replacements live in the map; capture/regex rewrites stay as
         `http-request replace-path` in the backend (the regex side can't be
         map-driven). Runs after routing (path-based backend selection already
         happened), matching the old in-backend `replace-path (.*) <literal>`. #}
      {{ "\n" }}http-request set-path %[var(txn.backend_name),map({{ m }})] if { var(txn.backend_name),map({{ m }}) -m found }

  features-170-redirect-location-map:
    template: |
      {#-
        Builds redirect-loc-<code>.map (host → location URL) per distinct redirect
        code from gf["redirectHosts"]. Resource libraries feed gf["redirectHosts"]
        with {host, location, code} entries in the features phase; the rule is
        emitted by frontend-filters-060-redirect-location. Mirrors the ssl-redirect
        map machinery, but the location is a per-host map VALUE rather than a fixed
        `scheme https`.

        Host-collision policy: first-writer-wins per host — the first redirect
        registered for a host (by feed order: features snippet number, then ingress
        list order) claims it; later redirects for the same host are ignored, so a
        host lands in exactly one code's map. A map is registered for every code
        present (even one whose hosts were all claimed by another code), so the
        rule's per-code map reference always resolves.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["redirectHosts"], []any{}) -%}
      {%- var locByCode = map[string]map[string]string{} -%}
      {%- var seenHost = map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- var e any = entry -%}
        {%- var code = tostring(e | dig("code")) -%}
        {%- var host = tostring(e | dig("host")) -%}
        {%- if locByCode[code] == nil -%}{%- locByCode[code] = map[string]string{} -%}{%- end -%}
        {%- if host != "" && !seenHost[host] -%}
          {%- seenHost[host] = true -%}
          {%- locByCode[code][host] = tostring(e | dig("location")) -%}
        {%- end -%}
      {%- end -%}
      {#- Sort hosts before emitting lines so the map file is byte-deterministic
          across renders. Scriggo/Go map iteration order is not stable, and a
          reordered map file looks like a change to the controller — triggering a
          spurious HAProxy sync/reload that would undermine the reload-free goal.
          Same rationale as features-160-ssl-redirect-map and the ssl.yaml crt-list. -#}
      {%- for code, hostLoc := range locByCode -%}
        {%- var hostKeys = []any{} -%}
        {%- for host := range hostLoc -%}
          {%- hostKeys = append(hostKeys, host) -%}
        {%- end -%}
        {%- var sortedHosts = sort_strings(hostKeys) -%}
        {%- var lines = []any{} -%}
        {%- for _, host := range sortedHosts -%}
          {%- lines = append(lines, tostring(host) + " " + hostLoc[tostring(host)]) -%}
        {%- end -%}
        {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" -%}
        {%- var _, mapErr = fileRegistry.Register("map", "redirect-loc-" + code + ".map", mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register redirect-location map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  features-175-app-root-map:
    template: |
      {#-
        Builds app-root.map (host → root-redirect path) from gf["appRootHosts"].
        Resource libraries (haproxy-ingress / nginx app-root) register {host, path}
        entries in the features phase; frontend-filters-065-app-root emits the gated
        rule, so adding/changing an app-root is a map-only, reload-free update.
        First-writer-wins per host; hosts sorted for byte-deterministic output (no
        spurious reload). Resource-agnostic: operates only on the generic gf list.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var appRootHosts []any = coalesce(gf["appRootHosts"], []any{}) -%}
      {%- if len(appRootHosts) > 0 -%}
        {%- var pathByHost = map[string]string{} -%}
        {%- var seen = map[string]bool{} -%}
        {%- var hostKeys = []any{} -%}
        {%- for _, entry := range appRootHosts -%}
          {%- var host = tostring(entry | dig("host")) -%}
          {%- if host != "" && !seen[host] -%}
            {%- seen[host] = true -%}
            {%- pathByHost[host] = tostring(entry | dig("path")) -%}
            {%- hostKeys = append(hostKeys, host) -%}
          {%- end -%}
        {%- end -%}
        {%- var sortedHosts = sort_strings(hostKeys) -%}
        {%- var lines = []any{} -%}
        {%- for _, host := range sortedHosts -%}
          {%- lines = append(lines, tostring(host) + " " + pathByHost[tostring(host)]) -%}
        {%- end -%}
        {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" -%}
        {%- var _, mapErr = fileRegistry.Register("map", "app-root.map", mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register app-root map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  features-185-mtls-error-map:
    template: |
      {#-
        Builds mtls-error.map (host → client-cert-verify error page URL) from
        gf["mtlsErrorHosts"]. Resource libraries (haproxy-ingress / nginx
        auth-tls-error-page) register {host, location} entries in the features phase;
        frontend-filters-075-mtls-error emits the gated rule. The per-vendor
        cert-passthrough set-header directives stay in their own vendor snippets.
        First-writer-wins per host; hosts sorted for deterministic output.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var mtlsErrorHosts []any = coalesce(gf["mtlsErrorHosts"], []any{}) -%}
      {%- if len(mtlsErrorHosts) > 0 -%}
        {%- var locByHost = map[string]string{} -%}
        {%- var seen = map[string]bool{} -%}
        {%- var hostKeys = []any{} -%}
        {%- for _, entry := range mtlsErrorHosts -%}
          {%- var host = tostring(entry | dig("host")) -%}
          {%- if host != "" && !seen[host] -%}
            {%- seen[host] = true -%}
            {%- locByHost[host] = tostring(entry | dig("location")) -%}
            {%- hostKeys = append(hostKeys, host) -%}
          {%- end -%}
        {%- end -%}
        {%- var sortedHosts = sort_strings(hostKeys) -%}
        {%- var lines = []any{} -%}
        {%- for _, host := range sortedHosts -%}
          {%- lines = append(lines, tostring(host) + " " + locByHost[tostring(host)]) -%}
        {%- end -%}
        {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" -%}
        {%- var _, mapErr = fileRegistry.Register("map", "mtls-error.map", mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register mtls-error map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  features-190-hsts-map:
    template: |
      {#-
        Builds hsts.map (host → Strict-Transport-Security header value) from
        gf["hstsHosts"]. Resource libraries register {host, value} entries in the
        features phase; frontend-filters-080-hsts emits the single shared
        response-header rule, so changing an HSTS value is a map-only, reload-free
        update. First-writer-wins per host; hosts sorted for deterministic output.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var hstsHosts []any = coalesce(gf["hstsHosts"], []any{}) -%}
      {%- if len(hstsHosts) > 0 -%}
        {%- var valByHost = map[string]string{} -%}
        {%- var seen = map[string]bool{} -%}
        {%- var hostKeys = []any{} -%}
        {%- for _, entry := range hstsHosts -%}
          {%- var host = tostring(entry | dig("host")) -%}
          {%- if host != "" && !seen[host] -%}
            {%- seen[host] = true -%}
            {%- valByHost[host] = tostring(entry | dig("value")) -%}
            {%- hostKeys = append(hostKeys, host) -%}
          {%- end -%}
        {%- end -%}
        {%- var sortedHosts = sort_strings(hostKeys) -%}
        {%- var lines = []any{} -%}
        {%- for _, host := range sortedHosts -%}
          {%- lines = append(lines, tostring(host) + " " + valByHost[tostring(host)]) -%}
        {%- end -%}
        {%- var mapContent = (lines | toStringSlice() | join("\n")) + "\n" -%}
        {%- var _, mapErr = fileRegistry.Register("map", "hsts.map", mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register hsts map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  frontend-filters-060-redirect-location:
    template: |
      {#-
        Host-keyed location redirect. Emits one rule per distinct code in
        gf["redirectHosts"]: the `code` must be a literal (HAProxy rejects a map
        expression there), so the location comes from redirect-loc-<code>.map and
        the code is fixed per rule. Runs after ssl-redirect (050) so a scheme-upgrade
        redirect takes precedence for a host that has both. Resource-agnostic:
        references only var(txn.host) + the per-code map.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["redirectHosts"], []any{}) -%}
      {%- var codes = map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- codes[tostring(entry | dig("code"))] = true -%}
      {%- end -%}
      {%- for code := range codes %}
      {%- var m, _ = pathResolver.GetPath("redirect-loc-" + code + ".map", "map") %}
      # base/redirect-location (code {{ code }})
      http-request redirect location %[var(txn.host),map({{ m }})] code {{ code }} if { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-065-app-root:
    template: |
      {#-
        Host-keyed app-root redirect: when a registered host is requested at the
        site root, redirect to its configured path (fixed 302). Single shared rule
        driven by app-root.map (built by features-175-app-root-map). Runs before
        path-rewrite so the gate sees the original request path. Resource-agnostic:
        references only var(txn.host), path, and the map.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var appRootHosts []any = coalesce(gf["appRootHosts"], []any{}) -%}
      {%- if len(appRootHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("app-root.map", "map") %}
      # base/app-root
      http-request redirect location %[var(txn.host),map({{ m }})] code 302 if { path / } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-075-mtls-error:
    template: |
      {#-
        Host-keyed mTLS error redirect: when client-cert verification failed
        (ssl_c_verify gt 0) for a registered host, redirect to its error page
        (fixed 302). Single shared rule driven by mtls-error.map (built by
        features-185-mtls-error-map). The per-vendor X-SSL-Client-* cert-passthrough
        set-header directives stay in their own vendor snippets. Resource-agnostic.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var mtlsErrorHosts []any = coalesce(gf["mtlsErrorHosts"], []any{}) -%}
      {%- if len(mtlsErrorHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("mtls-error.map", "map") %}
      # base/mtls-error
      http-request redirect location %[var(txn.host),map({{ m }})] code 302 if { ssl_c_verify gt 0 } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-080-hsts:
    template: |
      {#-
        HSTS response header(s), gated on a TLS connection (ssl_fc):
          1. A global header on every TLS response when extraContext.hstsEnabled is
             set (value from features-085-ssl-hsts-global's gf["hstsGlobalValue"]).
          2. The host-keyed header driven by hsts.map (built by
             features-190-hsts-map) from per-Ingress annotations. It runs second,
             so a per-host value overrides the global default (set-header replaces).
        var(txn.host) set during request routing is still in scope at response time.
        Resource-agnostic: references only var(txn.host), the map, and the global value.
      -#}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var hstsHosts []any = coalesce(gf["hstsHosts"], []any{}) -%}
      {%- var hstsGlobal = tostring(coalesce(gf["hstsGlobalValue"], "")) -%}
      {%- if hstsGlobal != "" %}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}
      {%- if len(redirectHosts) == 0 %}
      # WARNING: HSTS is enabled globally but no HTTP→HTTPS redirect is configured.
      #   HSTS is only sent over HTTPS, so plain-HTTP clients get no protection and
      #   no upgrade. Add a redirect (per-Ingress ssl-redirect annotation, or your
      #   platform's global redirect) so clients reach HTTPS.
      {%- end %}
      # base/hsts-global (extraContext.hstsEnabled) — HSTS on every TLS response
      http-response set-header Strict-Transport-Security "{{ hstsGlobal }}" if { ssl_fc }
      {%- end %}
      {%- if len(hstsHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("hsts.map", "map") %}
      # base/hsts (per-Ingress values; override the global default above)
      http-response set-header Strict-Transport-Security %[var(txn.host),map({{ m }})] if { ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  # Status frontend directives — override or extend via status-extra-* snippets.
  # The status frontend (port 8404) serves health checks and can expose HAProxy's
  # built-in Prometheus exporter. Snippets are rendered inside the status frontend
  # block after the default health check rules.
  frontend-filters-999-debug:
    template: |
      {%- var debug bool = extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) -%}
      {%- if debug %}
      # HAProxy routing decision introspection
      http-response set-header X-HAProxy-Backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
      http-response set-header X-HAProxy-Host-Match %[var(txn.host_match)] if { var(txn.host_match) -m found }
      http-response set-header X-HAProxy-Path-Match %[var(txn.path_match)] if { var(txn.path_match) -m found }
      http-response set-header X-HAProxy-Path-Match-Qualifier %[var(txn.path_match_qualifier)] if { var(txn.path_match_qualifier) -m found }
      http-response set-header X-HAProxy-Total-Weight %[var(txn.total_weight)] if { var(txn.total_weight) -m found }
      http-response set-header X-HAProxy-Random-Weight %[var(txn.random_weight)] if { var(txn.random_weight) -m found }
      http-response set-header X-HAProxy-Route-Key %[var(txn.route_key)] if { var(txn.route_key) -m found }
      # Gateway-specific headers (set by gateway.yaml advanced matchers)
      http-response set-header X-Gateway-Matched-Route %[var(txn.matched_route)] if { var(txn.matched_route) -m found }
      http-response set-header X-Gateway-Match-Reason %[var(txn.match_reason)] if { var(txn.match_reason) -m found }
      http-response set-header X-Gateway-Filters-Applied %[var(txn.filters_applied)] if { var(txn.filters_applied) -m found }
      {%- end %}

  util-default-backend:
    template: |
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {%- var defaultBackendSvc = extraContext | dig("defaultBackendService") | fallback(nil) -%}
      {%- if defaultBackendSvc != nil %}
      {%%
        var dbNamespace = defaultBackendSvc | dig_string("", "namespace")
        var dbName = defaultBackendSvc | dig_string("", "name")
      %%}
      {%- var resolvedParts = split(ResolveServicePort(dbNamespace, dbName, defaultBackendSvc | dig("port")), " ") -%}
      {%- var dbPort = toint(resolvedParts[0]) -%}
      {%- var dbPortName = resolvedParts[1] -%}
      backend default_backend
          guid be:default_backend
          default-server check
          {{ BackendServers(dbName, 0, dbPort, nil, dbPortName, "default_backend", dbNamespace) | indent(2, true) }}
      {%- else %}
      backend default_backend
          guid be:default_backend
          # gRPC-aware fallback: a trailers-only grpc-status 12 (Unimplemented) for
          # application/grpc, else a plain 404. content-type is re-added via
          # http-after-response (the `return` action strips it). See
          # https://haproxy-haptic.org/docs/latest/libraries/base/#grpc-request-handling
          http-request return status 200 hdr "grpc-status" "12" hdr "grpc-message" "Unimplemented" if { req.hdr(content-type) -m sub "application/grpc" }
          http-after-response set-header content-type "application/grpc" if { res.hdr(grpc-status) -m found }
          http-request return status 404
      {%- end %}

  global-top-100-access-log-rings:
    template: |-
      {#-
        One `ring` section per access-log target that declares one. A ring is a
        buffered TCP client: records queue in memory when the collector is down
        and flush on reconnect, so a restarting log shipper never touches the
        data plane (measured: 25/25 requests served with the collector stopped,
        all 25 records delivered afterwards). Plain `log <host>:<port>` is UDP
        and drops them instead.

        This renders after the `defaults` section that references the ring, which
        HAProxy accepts — forward references to a ring are resolved post-parse
        (verified on 3.0 and 3.4).
      -#}
      {{- render "util-access-log-targets" -}}
      {%- for _, tAny := range shared.Get("accessLogTargets").([]any) %}
        {%- var t = tAny.(map[string]any) %}
        {%- if t["ring"] != nil %}
          {%- var r = t["ring"].(map[string]any) %}
      {{ "\n" }}ring {{ r["name"] }}
          description "haptic access log -> {{ r["address"] }}"
          format {{ t["format"] }}
          maxlen {{ toint(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) }}
          size {{ r["size"] }}
          timeout connect {{ r["connectTimeout"] }}
          timeout server {{ r["serverTimeout"] }}
          server {{ r["name"] }} {{ r["address"] }} log-proto {{ r["logProto"] }}{% if r["serverOptions"] != "" %} {{ r["serverOptions"] }}{% end %}
        {%- end %}
      {%- end %}

  global-top-050-peers:
    template: |
      {#- Always-on local peers section. Stick-tables opt in by appending -#}
      {#- `peers localinstance` to their definition (e.g. the haproxytech -#}
      {#- rate-limit table); HAProxy then replicates their contents from the -#}
      {#- old worker to the new worker on every reload, so per-source counters -#}
      {#- survive config churn instead of resetting to zero. The single peer -#}
      {#- `local` matches `localpeer local` (global-settings-220-localpeer), so -#}
      {#- HAProxy LISTENS on the socket and resyncs locally; it never connects -#}
      {#- to other replicas, so tables stay per-pod. The listener is a UNIX -#}
      {#- socket (not a TCP port) so it can never collide with a frontend or -#}
      {#- dynamic Gateway listener bind and take the whole proxy down. -#}
      peers localinstance
          peer local unix@{{ pathResolver.GetBaseDir() }}/peers.sock

  status-extra-100-prometheus-exporter:
    template: |
      http-request use-service prometheus-exporter if { path /metrics }

  global-top:
    template: |
      {#- Renders global-top-* snippets (e.g., userlist sections from haproxytech.yaml) -#}
      {{- render_glob "global-top-*" -}}

# ============================================================================
# Map Files
# ============================================================================
# Map files provide host and path routing tables.
# Resource libraries populate these via map-*-* snippets.

maps:
  host.map:
    template: |
      # Host to normalized host mapping (strips port, wildcards)
      {{ render_glob "map-host-*" -}}

  host-regex.map:
    template: |
      # Wildcard-host regex fallback: <regex pattern> <normalized host key>, tried
      # after the exact host.map + single-label regsub miss (multi-label hosts under
      # a wildcard listener). See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      {{ render_glob "map-hostregex-*" -}}

  path-exact.map:
    template: |
      # Exact path matches (use with map() function)
      {{ render_glob "map-path-exact-*" -}}

  path-prefix-exact.map:
    template: |
      # Prefix boundary matches without trailing slash
      {{ render_glob "map-pfxexact-*" -}}

  path-prefix.map:
    template: |
      # Prefix matches with trailing slash (use with map_beg())
      {{ render_glob "map-path-prefix-*" -}}

  path-regex.map:
    template: |
      # Regex matches (use with map_reg())
      {{ render_glob "map-path-regex-*" -}}

  weighted-multi-backend.map:
    template: |
      # Weighted routing: random_weight:route_key → backend_name
      {{ render_glob "map-weighted-backend-*" }}

  body-size.map:
    template: |
      # Per-backend request body-size limits: backend_name → max bytes. Populated by resource
      # libraries (map-body-size-*); enforced by frontend-filters-250-request-body-size.
      # See https://haproxy-haptic.org/docs/latest/libraries/base/#map-files
      {{ render_glob "map-body-size-*" -}}

  reqhdr-host.map:
    template: |
      # Per-backend upstream Host override: backend_name → host. Populated by
      # map-reqhdr-host-*; applied by frontend-filters-260-request-set-host.
      {{ render_glob "map-reqhdr-host-*" -}}

  reqhdr-xfwd-prefix.map:
    template: |
      # Per-backend X-Forwarded-Prefix override: backend_name → prefix. Populated via
      # map-reqhdr-xfwd-prefix-*; applied by frontend-filters-261-request-set-xfwd-prefix.
      {{ render_glob "map-reqhdr-xfwd-prefix-*" -}}

  reqhdr-connection.map:
    template: |
      # Per-backend Connection header override: backend_name → value. Populated via
      # map-reqhdr-connection-*; applied by frontend-filters-262-request-set-connection.
      {{ render_glob "map-reqhdr-connection-*" -}}

  path-rewrite.map:
    template: |
      # Per-backend literal full-path rewrite: backend_name → replacement path (capture/regex
      # rewrites stay as http-request replace-path in the backend). Populated via
      # map-path-rewrite-*; applied by frontend-filters-400-path-rewrite.
      {{ render_glob "map-path-rewrite-*" -}}

files:
  400.http:
    template: |
      HTTP/1.0 400 Bad Request
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>400 Bad Request</h1>
      <p>Your browser sent a request that this server could not understand.</p>
      </body></html>

  403.http:
    template: |
      HTTP/1.0 403 Forbidden
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>403 Forbidden</h1>
      <p>You don't have permission to access this resource.</p>
      </body></html>

  408.http:
    template: |
      HTTP/1.0 408 Request Time-out
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>408 Request Time-out</h1>
      <p>Your browser didn't send a complete request in time.</p>
      </body></html>

  500.http:
    template: |
      HTTP/1.0 500 Internal Server Error
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>500 Internal Server Error</h1>
      <p>An internal server error occurred.</p>
      </body></html>

  502.http:
    template: |
      HTTP/1.0 502 Bad Gateway
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>502 Bad Gateway</h1>
      <p>The server received an invalid response from an upstream server.</p>
      </body></html>

  503.http:
    template: |
      HTTP/1.0 503 Service Unavailable
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>503 Service Unavailable</h1>
      <p>No server is available to handle this request.</p>
      </body></html>

  504.http:
    template: |
      HTTP/1.0 504 Gateway Time-out
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>504 Gateway Time-out</h1>
      <p>The server didn't respond in time.</p>
      </body></html>

k8sResources:
  # User-facing HAProxy LoadBalancer Service. Replaces the chart-static
  # templates/haproxy-service.yaml main-Service block so the controller
  # owns the Service end-to-end:
  #
  #   - The set of `spec.ports` is derived from listener state at render
  #     time, not from chart-install-time defaults: the static
  #     http/https/stats triple is augmented with `gw-<port>-<proto>`
  #     entries for every Gateway / admitted ListenerSet listener whose
  #     port is not one of {80, 443, 8404}.
  #   - The resourceapplier injects an OwnerReference at apply time
  #     (controller=true, blockOwnerDeletion=true), so `helm uninstall`
  #     cascade-GCs this Service when the HAProxyTemplateConfig CR
  #     disappears.
  #
  # Service identity (name + namespace) and chart-shaped fields
  # (`type`, `loadBalancerIP`, `loadBalancerClass`,
  # `loadBalancerSourceRanges`, `externalTrafficPolicy`,
  # `internalTrafficPolicy`, `healthCheckNodePort`,
  # `publishNotReadyAddresses`, annotations, labels, selector,
  # per-port `nodePort`) are plumbed in from values.yaml via
  # `extraContext.haproxyService` by `templates/haproxytemplateconfig.yaml`.
  haproxy-service:
    template: |
      {%- var ctrlNs = tostring(extraContext | dig("controllerNamespace") | fallback("")) %}
      {%- var svcName = tostring(extraContext | dig("haproxyServiceName") | fallback("")) %}
      {%- var svc = extraContext | dig("haproxyService") %}
      {%- if ctrlNs == "" || svcName == "" || svc == nil %}{# Service identity not plumbed — chart bug; emit nothing. #}{%- else %}
      {%%
        var svcMap = svc.(map[string]any)
        var svcType = tostring(svcMap | dig("type") | fallback("LoadBalancer"))
        var exposesNodePort = svcType == "NodePort" || svcType == "LoadBalancer"

        // Service ports. The chart's templates/haproxytemplateconfig.yaml
        // builds this list with the http / https / stats defaults
        // (drawn from `haproxy.service.{http,https,stats}` in
        // values.yaml) plus anything the operator added under
        // `haproxy.service.extraPorts`. Non-default Gateway listener
        // ports are appended to the same list below as
        // `gw-<port>-<proto-letter>` entries. Operators consume
        // changes here purely through values.yaml — we don't
        // hardcode anything Service-port-shaped on the Scriggo side.
        var ports = []any{}
        var seenNames = map[string]bool{}
        var seenPorts = map[int]bool{}
        for _, rawPort := range svcMap | dig("ports") | toSlice() {
          var entry = rawPort.(map[string]any)
          var entryName = tostring(entry | dig("name") | fallback(""))
          var entryPort = toint(entry | dig("port") | fallback(0))
          if entryName == "" || entryPort <= 0 {
            continue
          }
          if seenNames[entryName] {
            continue
          }
          seenNames[entryName] = true
          seenPorts[entryPort] = true
          var built = map[string]any{
            "name":     entryName,
            "port":     entryPort,
            "protocol": tostring(entry | dig("protocol") | fallback("TCP")),
          }
          var targetVal = dig(entry, "targetPort")
          if targetVal == nil {
            built["targetPort"] = entryPort
          } else {
            built["targetPort"] = targetVal
          }
          if exposesNodePort {
            var entryNodePort = toint(entry | dig("nodePort") | fallback(0))
            if entryNodePort > 0 {
              built["nodePort"] = entryNodePort
            }
          }
          var appProto = dig(entry, "appProtocol")
          if appProto != nil {
            built["appProtocol"] = tostring(appProto)
          }
          ports = append(ports, built)
        }

        // Dynamic extra ports — extension point for higher-level
        // libraries (gateway, ingress, …) to contribute ports
        // discovered from their own watched resources. Each
        // contributing library populates
        // `shared.extraServicePorts` (a list of {name, port,
        // targetPort, protocol} maps) from its own haproxyConfig
        // render path; base.yaml merges them in here, skipping any
        // port already claimed by the static set so collisions
        // don't surface. shared.Get is used (not gf) because k8sResources
        // templates render in their own context and don't bind gf
        // locally — shared.Get is uniformly available on every
        // render path. Absent value (no contributors) → toSlice
        // returns []any{}, the loop is a no-op, base.yaml stays
        // at Level 0 of the library hierarchy.
        var extraPorts = shared.Get("extraServicePorts") | toSlice()
      %%}
      {%- for _, extraPort := range extraPorts %}
      {%%
        var port = toint(dig(extraPort, "port") | fallback(0))
        if port <= 0 || seenPorts[port] {
          continue
        }
        seenPorts[port] = true
        ports = append(ports, map[string]any{
          "name":       tostring(dig(extraPort, "name") | fallback("")),
          "port":       port,
          "targetPort": toint(dig(extraPort, "targetPort") | fallback(port)),
          "protocol":   tostring(dig(extraPort, "protocol") | fallback("TCP")),
        })
      %%}
      {%- end %}
      {%%
        var labels = svcMap | dig("labels") | fallback(map[string]any{})
        var selector = svcMap | dig("selector") | fallback(map[string]any{})
        var annotations = svcMap | dig("annotations") | fallback(map[string]any{})
        var spec = map[string]any{
          "type":     svcType,
          "selector": selector,
          "ports":    ports,
        }
        // Optional spec fields — only set when non-empty so the rendered
        // YAML stays compact and SSA doesn't track empty-string fields.
        var lbIP = tostring(svcMap | dig("loadBalancerIP") | fallback(""))
        if lbIP != "" {
          spec["loadBalancerIP"] = lbIP
        }
        var lbClass = tostring(svcMap | dig("loadBalancerClass") | fallback(""))
        if lbClass != "" {
          spec["loadBalancerClass"] = lbClass
        }
        var lbRanges = svcMap | dig("loadBalancerSourceRanges") | toSlice()
        if len(lbRanges) > 0 {
          spec["loadBalancerSourceRanges"] = lbRanges
        }
        var extPolicy = tostring(svcMap | dig("externalTrafficPolicy") | fallback(""))
        if extPolicy != "" {
          spec["externalTrafficPolicy"] = extPolicy
        }
        var intPolicy = tostring(svcMap | dig("internalTrafficPolicy") | fallback(""))
        if intPolicy != "" {
          spec["internalTrafficPolicy"] = intPolicy
        }
        var hcNodePort = toint(svcMap | dig("healthCheckNodePort") | fallback(0))
        if hcNodePort > 0 {
          spec["healthCheckNodePort"] = hcNodePort
        }
        var publishNotReady = svcMap | dig("publishNotReadyAddresses") | fallback(false)
        if tostring(publishNotReady) == "true" {
          spec["publishNotReadyAddresses"] = true
        }
        var meta = map[string]any{
          "name":      svcName,
          "namespace": ctrlNs,
          "labels":    labels,
        }
        var annotationsMap = annotations.(map[string]any)
        if len(annotationsMap) > 0 {
          meta["annotations"] = annotationsMap
        }
        var resource = map[string]any{
          "apiVersion": "v1",
          "kind":       "Service",
          "metadata":   meta,
          "spec":       spec,
        }
        var rendered, _ = marshalYAML(resource)
      %%}
      {{ rendered }}
      {%- end %}

haproxyConfig:
  template: |
    global
        {{ render "global-settings" | indent(2, true) }}

    defaults
        {{ render "defaults-settings" | indent(2, true) }}

    {#- Phase 1: Feature Registration (side effects only, output discarded) -#}
    {#- Initialize SSL features first (if SSL library is loaded) -#}
    {%- _ = render_glob "features-ssl-initialization" -%}
    {#- Let resource libraries scan resources and register infrastructure needs -#}
    {%- _ = render_glob "features-*" -%}
    {#- Phase 1.5: Status Patch Registration (side effects only, output discarded) -#}
    {%- _ = render_glob "status-patches-*" -%}
    {#- Include global top-level snippets (e.g., userlist sections) -#}
    {%- var globalTop = render "global-top" | strip() -%}
    {%- if globalTop != "" %}

    {{ globalTop }}
    {%- end %}

    frontend status
        guid fe:status
        mode http
        bind *:8404
        # Keep health probes quiet without removing the inherited log target:
        # `no log` plus the inherited HTTP log format makes haproxy -c warn.
        option dontlog-normal{{ render "util-log-format-http" }}
        http-request return status 200 content-type text/plain string "OK" if { path /healthz }
        http-request return status 200 content-type text/plain string "READY" if { path /ready }
        {# Extension point for status frontend directives (e.g., Prometheus exporter) #}
        {{- render_glob "status-extra-*" | indent(2, true) }}

    {#- The http_frontend renders only when at least one resource
        actually wants traffic on an HTTP port — Ingress, Gateway/
        ListenerSet HTTP listener at any port. Without it we'd emit
        an HAProxy frontend with no binds (validation error) any
        time the chart is installed for a use case that never opens
        port 80, e.g. an HTTPS-only Gateway whose listeners have
        unresolvable certs (the GatewayFrontendInvalidDefault
        ClientCertificateValidation conformance scenario).

        The chart-static `bind *:httpPort` itself is gated by a
        narrower flag — bindHTTPDefault — so a Gateway with only a
        non-default-port HTTP listener (say :9090) gets the
        frontend rendered (so http-bind-extra-* can attach `bind
        *:9090` to it) but NO `bind *:80`. -#}
    {%- var gf = shared.Get("globalFeatures") -%}
    {%- if gf != nil && tostring(gf.(map[string]any) | dig("needHTTPFrontend")) == "true" %}

    {# ─────────────────────────────────────────────────────────────────
       HTTP listener architecture: tcp inspector + dual loopback frontends.

       To multiplex HTTP/1.1 and HTTP/2 cleartext (h2c) on the same plain
       port, we mirror the chart's existing ssl-tcp → ssl-loopback → https
       chain (libraries/ssl.yaml ~lines 367-536). HAProxy 3.x can't
       multiplex h2c with HTTP/1.1 on a single bind: `proto h2` locks the
       bind H2-only, no `Upgrade: h2c` parser, ALPN works only inside TLS.
       So we inspect the first 24 bytes at a `mode tcp` outer frontend
       (the HTTP/2 prior-knowledge preface
       `PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n` — what gRPC-Go's insecure dial
       sends, and what the upstream Gateway-API GRPCRoute conformance
       suite exercises) and route to one of two unix-socket-bound inner
       frontends in `mode http`. PROXY-protocol v2 across the hop
       preserves the original client IP. The two inner frontends share
       the same routing logic via the same render_glob extension points,
       so any chart snippet that emits HTTP-level directives lands in
       both protocols' paths.

       The cost is ~10µs/request for a unix-socket roundtrip, which is
       invisible against typical backend latency. Plain HTTP carries
       little real-world edge traffic post-HSTS, so this trade-off is
       cheap; the upside is full Gateway-API conformance for GRPCRoutes
       attached to plaintext HTTP listeners.
    -#}

    frontend http-tcp
        guid fe:http-tcp
        mode tcp
        # Override the HTTP log format inherited from defaults. Without this,
        # HAProxy falls back implicitly and warns on every config check.
        #
        # dontlog-normal: this frontend is the internal h2c demultiplexer — every
        # connection it accepts is handed to http_frontend or http_frontend_h2c,
        # which logs the request itself. Logging the normal case here would
        # duplicate every request with a second, near-information-free record.
        # Abnormal terminations (h2c-preface stalls, client aborts before the
        # loopback hop) still log, and they are the only lines anyone reads here.
        option dontlog-normal{{ render "util-log-format-tcp" }}
        {%- if tostring(gf.(map[string]any) | dig("bindHTTPDefault")) == "true" %}
        bind *:{{ extraContext | dig("httpPort") | fallback(8080) }}
        {%- end %}
        {# Extension point for additional bind directives (Gateway HTTP listener ports). #}
        {# Lands on the OUTER tcp frontend so every HTTP port — chart-static and #}
        {# Gateway-derived — goes through the same h2c-detection inspector. #}
        {{- render_glob "http-bind-extra-*" | indent(2, true) }}

        # Wait for the first wire bytes so the h2c-preface ACL can classify the
        # connection (safety net for slow initial sends; fast clients aren't delayed).
        tcp-request inspect-delay 1s

        # Detect the h2c prior-knowledge preface (PRI * HTTP/2.0..SM.., 24 bytes; hex
        # below) — the only h2c signal available in mode tcp. See
        # https://haproxy-haptic.org/docs/latest/libraries/base/#h2c-cleartext-detection
        acl is_h2c req.payload(0,24) -m bin 505249202a20485454502f322e300d0a0d0a534d0d0a0d0a

        # Decide as soon as 24 bytes are in; WAIT_END covers shorter HTTP/1.1 sends.
        tcp-request content accept if { req.len ge 24 }
        tcp-request content accept if WAIT_END

        use_backend http-h2c-loopback if is_h2c
        default_backend http-h1-loopback

    backend http-h1-loopback
        guid be:http-h1-loopback
        mode tcp
        # send-proxy-v2 preserves the original client IP/port across the unix-socket hop.
        server loopback unix@/etc/haproxy/http-h1-frontend.sock send-proxy-v2

    backend http-h2c-loopback
        guid be:http-h2c-loopback
        mode tcp
        server loopback unix@/etc/haproxy/http-h2c-frontend.sock send-proxy-v2

    frontend http_frontend
        guid fe:http_frontend
        mode http
        option forwardfor
        # accept-proxy reads the PROXY v2 header from http-h1-loopback's send-proxy-v2,
        # so `src` and logging see the original client.
        bind unix@/etc/haproxy/http-h1-frontend.sock mode 660 accept-proxy{{ render "util-log-format-http" }}
        {# Extension point for early frontend directives (options, captures, ACLs) #}
        {# Runs BEFORE routing logic; use frontend-filters-* for post-routing manipulation #}
        {{- render_glob "frontend-extra-*" | indent(2, true) }}

        {# Include frontend routing logic (can be overridden by libraries) #}
        {{ render "frontend-routing-logic" | indent(2, true) }}
        {# Extension point for frontend request/response filters #}
        {# Runs AFTER routing decisions, BEFORE backend selection #}
        {# Libraries can inject filter logic here (header modification, redirects, rewrites) #}
        {{- render_glob "frontend-filters-*" | indent(2, true) }}
        use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
        default_backend default_backend

    frontend http_frontend_h2c
        guid fe:http_frontend_h2c
        mode http
        option forwardfor
        # `proto h2` locks this bind to HTTP/2 cleartext — required because
        # HAProxy can't auto-detect h2c on plaintext binds. The outer tcp
        # inspector has already classified the connection by preface, so
        # only h2c traffic reaches this socket.
        bind unix@/etc/haproxy/http-h2c-frontend.sock mode 660 accept-proxy proto h2{{ render "util-log-format-http" }}
        {# Same render_glob extension points as the h1 sibling — every #}
        {# routing/filter snippet lands in both protocols' frontends so #}
        {# behaviour stays in lockstep regardless of which protocol the #}
        {# client uses. #}
        {{- render_glob "frontend-extra-*" | indent(2, true) }}
        {{ render "frontend-routing-logic" | indent(2, true) }}
        {{- render_glob "frontend-filters-*" | indent(2, true) }}
        use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
        default_backend default_backend
    {%- end %}

    {# Extension point for additional frontends (e.g., custom TCP services) #}
    {# Resource libraries can inject frontends-* snippets #}
    {{- render_glob "frontends-*" -}}

    {# Include all resource-specific backend definitions using plugin pattern #}
    {# Resource libraries implement backends-* snippets (e.g., backends-ingress, backends-gateway) #}
    {{- render_glob "backends-*" }}

    {{ render "util-default-backend" | indent(0, true) }}
    {# Trailing newline preserved #}

  # Post-processing: normalize indentation to 2 spaces
  postProcessing:
    - type: regex_replace
      params:
        pattern: "^[ ]+"
        replace: "  "
    # Collapse runs of blank / whitespace-only lines (left behind by empty
    # extension-point snippets and render_glob boundaries) into a single blank
    # line. HAProxy ignores blank lines, so this is purely for readability.
    - type: template
      params:
        source: |-
          {{- regexp("\\n([ \\t]*\\n)+").ReplaceAll(input, "\n\n") -}}

# Global fixtures merged with all validation tests
# Test fixtures override global fixtures when same resource exists (by namespace/name)
validationTests:
  _global:
    description: Global fixtures for all validation tests
    # Shared echo backend, merged into every test's fixtures. A test whose
    # Ingress/route points at Service `echo` (port 80, endpoint 10.0.0.1:8080)
    # need NOT declare its own Service + EndpointSlice — this deduplicates the
    # otherwise-per-test backend fixtures that dominate the rendered CR. Tests
    # needing a differently-named/ported backend still declare their own.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: echo }
          spec: { ports: [{ port: 80 }] }
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: echo-abc
            labels: { kubernetes.io/service-name: echo }
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
    assertions:
      - type: haproxy_valid
      - type: deterministic

  test-k8s-haproxy-service-default-ports:
    description: "k8sResources.haproxy-service emits whatever ports the chart hands it under `extraContext.haproxyService.ports`. The chart's default builds an http / https / stats triple from `haproxy.service."
    fixtures: {}
    assertions:
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "kind: Service"
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "name: http\n"
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "name: https\n"
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "name: stats"

  test-k8s-haproxy-service-extra-ports:
    description: Operators using haptic without Gateway API (e.g. exposing a raw TCP frontend via a custom haproxyConfig snippet) declare additional Service ports through `haproxy.service.extraPorts` in values.yaml.
    fixtures: {}
    extraContext:
      haproxyService:
        type: ClusterIP
        labels:
          app.kubernetes.io/component: loadbalancer
        selector:
          app.kubernetes.io/component: loadbalancer
        annotations: {}
        loadBalancerIP: ""
        loadBalancerClass: ""
        loadBalancerSourceRanges: []
        externalTrafficPolicy: ""
        internalTrafficPolicy: ""
        healthCheckNodePort: 0
        publishNotReadyAddresses: false
        ports:
          - name: http
            port: 80
            targetPort: http
            protocol: TCP
          - name: https
            port: 443
            targetPort: https
            protocol: TCP
          - name: stats
            port: 8404
            targetPort: stats
            protocol: TCP
          - name: postgres
            port: 5432
            targetPort: 5432
            protocol: TCP
    assertions:
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "name: postgres"
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "port: 5432"
      - type: contains
        target: "k8s:haproxy-service"
        pattern: "name: http\n"

  test-address-discovery:
    description: Address discovery reads LoadBalancer status from controller service
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
                - hostname: "lb.example.com"
    assertions:
      - type: haproxy_valid

  test-address-discovery-multiple-services:
    description: Address discovery aggregates addresses from multiple LoadBalancer services
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-public
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-internal
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "192.168.1.50"
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-pending
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer: {}
    assertions:
      - type: haproxy_valid

  test-status-frontend-prometheus-exporter:
    description: Status frontend exposes Prometheus exporter on /metrics by default
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request use-service prometheus-exporter if { path /metrics }"

  test-guid-directives:
    description: GUIDs are present on frontends, backends, and default_backend
    fixtures:
      # Trigger the http_frontend by declaring an Ingress. After the
      # bind-derivation refactor (chart-static http_frontend is gated
      # on actual listener state), an empty fixture wouldn't render
      # the http_frontend at all.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "guid fe:status"
      - type: contains
        target: haproxy.cfg
        pattern: "guid fe:http_frontend"
      - type: contains
        target: haproxy.cfg
        pattern: "guid be:default_backend"
      - type: not_contains
        target: haproxy.cfg
        pattern: "tune\\.ssl\\.default-dh-param"
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend status$.*?^\s+mode http$.*?^\s+option dontlog-normal$'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend status$.*?^\s+no log$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http-tcp$.*?^\s+mode tcp$.*?^\s+option dontlog-normal$.*?^\s+log-format "%\{\+json\}o '
        description: >-
          The TCP demux frontend overrides the inherited HTTP format with the
          TCP-safe JSON one and suppresses its normal lines (the inner HTTP
          frontend logs the request).
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend$.*?^\s+mode http$.*?^\s+option forwardfor$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend_h2c$.*?^\s+mode http$.*?^\s+option forwardfor$'

  test-shm-stats-max-objects:
    description: shm-stats-file-max-objects uses configurable fixed value
    minHAProxyVersion: "3.3"
    extraContext:
      shmStatsEnabled: true
      haproxyVersion: "3.3.0"
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "shm-stats-file /dev/shm/haproxy-stats"
      - type: contains
        target: haproxy.cfg
        pattern: "shm-stats-file-max-objects 50000"

  test-default-backend-cross-namespace:
    description: Default backend resolves endpoints from a different namespace
    extraContext:
      defaultBackendService:
        namespace: ingress-default-backend
