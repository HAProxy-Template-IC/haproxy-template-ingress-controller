  test-grpcroute-headers:
    description: GRPCRoute with header matching (Exact and RegularExpression)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-api
            namespace: default
          spec:
            ports:
              - port: 9090
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: grpc-api-abc
            namespace: default
            labels:
              kubernetes.io/service-name: grpc-api
          endpoints:
            - addresses: ["10.0.1.1"]
          ports:
            - port: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: grpc-header-route
            namespace: default
          spec:
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.API
                      method: GetUser
                    headers:
                      - type: Exact
                        name: X-API-Version
                        value: v1
                      - type: RegularExpression
                        name: User-Agent
                        value: "^grpc-.*"
                backendRefs:
                  - name: grpc-api
                    port: 9090
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(default_grpc-header-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\}.*\\{ req\\.hdr\\(X-API-Version\\) \"v1\" \\} \\{ req\\.hdr\\(User-Agent\\) -m reg \"\\^grpc-\\.\\*\" \\}"
        description: Must generate header match conditions for GRPCRoute

