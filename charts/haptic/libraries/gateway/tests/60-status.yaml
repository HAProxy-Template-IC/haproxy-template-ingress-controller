validationTests:
  test-gateway-slot-preservation:
    description: Server slots should be preserved during rolling deployments when currentConfig is available
    currentConfig: |
      # Previous HAProxy configuration with gateway backend and server assignments
      backend gtw_default_slot-route_slot-svc_80
          server SRV_1 10.0.0.1:8080 check
          server SRV_2 10.0.0.2:8080 check
          server SRV_3 127.0.0.1:1 disabled
          server SRV_4 127.0.0.1:1 disabled
          server SRV_5 127.0.0.1:1 disabled
          server SRV_6 127.0.0.1:1 disabled
          server SRV_7 127.0.0.1:1 disabled
          server SRV_8 127.0.0.1:1 disabled
          server SRV_9 127.0.0.1:1 disabled
          server SRV_10 127.0.0.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: slot-pod-1
            - addresses: ["10.0.0.3"]
              targetRef:
                kind: Pod
                name: slot-pod-3
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: slot-route
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - slot-test.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: slot-svc
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with slot preservation

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_slot-route_slot-svc_80"
        description: Gateway backend must be generated

      # Note: check option is now on default-server, not on individual server lines
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080"
        description: Existing pod 10.0.0.1 must preserve its slot (SRV_1)

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_2 10\\.0\\.0\\.3:8080"
        description: New pod 10.0.0.3 should take the freed slot (SRV_2) from removed pod

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 127\\.0\\.0\\.1:1 .*disabled"
        description: Unused slots should remain as placeholders

  test-gateway-slot-preservation-lower-ip:
    description: Slot preservation must work regardless of IP ordering (new pod has lower IP)
    currentConfig: |
      # Previous config: SRV_1=10.0.0.5, SRV_2=10.0.0.6
      # After rolling: 10.0.0.6 removed, 10.0.0.2 added (lower IP than existing)
      # Expected: SRV_1 keeps 10.0.0.5, SRV_2 gets 10.0.0.2 (takes freed slot)
      backend gtw_default_slot-lower_slot-svc_80
          server SRV_1 10.0.0.5:8080 check
          server SRV_2 10.0.0.6:8080 check
          server SRV_3 127.0.0.1:1 disabled
          server SRV_4 127.0.0.1:1 disabled
          server SRV_5 127.0.0.1:1 disabled
          server SRV_6 127.0.0.1:1 disabled
          server SRV_7 127.0.0.1:1 disabled
          server SRV_8 127.0.0.1:1 disabled
          server SRV_9 127.0.0.1:1 disabled
          server SRV_10 127.0.0.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.5"]
              targetRef:
                kind: Pod
                name: slot-pod-5
            - addresses: ["10.0.0.2"]
              targetRef:
                kind: Pod
                name: slot-pod-2
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: slot-lower
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - slot-lower.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: slot-svc
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # Note: check option is now on default-server, not on individual server lines
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.5:8080"
        description: Existing pod 10.0.0.5 must preserve its slot (SRV_1)

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_2 10\\.0\\.0\\.2:8080"
        description: New pod 10.0.0.2 (lower IP) must take freed slot (SRV_2), not be sorted first

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 127\\.0\\.0\\.1:1 .*disabled"
        description: Unused slots should remain as placeholders

  test-gateway-status-patches:
    description: Gateway status patches register conditions and addresses
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: my-gateway
            namespace: default
            generation: 3
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: http
                protocol: HTTP
                port: 80
              - name: https
                protocol: HTTPS
                port: 443
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: web-route
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: my-gateway
                sectionName: http
            hostnames:
              - example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: web-svc
                    port: 80
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: web-svc
            namespace: default
          spec:
            ports:
              - port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with Gateway status patches
      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_web-route"
        description: Must generate backend for HTTPRoute

      - type: contains
        target: "status:default/my-gateway:rendered"
        pattern: '"observedGeneration":3'
        description: "The Gateway's status conditions must carry observedGeneration from metadata.generation (3 in this fixture). The upstream Gateway-API conformance helper GatewayStatusMustHaveListeners (helpers.go:272) waits for observedGeneration on every condition to match the spec's generation; reporting 0 (or omitting the field) keeps every conformance test that polls status stuck on `expected observedGeneration to be updated to N, only 0/2 were updated. stale conditions are: Accepted (generation 0), Programmed (generation 0)`."
