validationTests:
  test-gateway-status-per-gateway-address:
    description: "Phase 5 of the per-Gateway-IP refactor. Verifies that the Gateway status patcher writes the per-Gateway LoadBalancer Service's realized LB IP into Gateway.Status.Addresses instead of the chart's main LB IP. Two Gateway shapes:   * `gw-https-allocated`: HTTPS listener, no spec.addresses,     per-Gateway Service `gw-default-gw-https-allocated`     allocated `203.0.113.50` by MetalLB → status.addresses     MUST contain that IP, NOT the chart's main IP.   * `gw-http-only`: HTTP-only Gateway → no per-Gateway Service     → status.addresses keeps using the chart's main LB IP     (existing behaviour, untouched by phase 5)."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: haproxy
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-https-allocated
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-http-only
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "10.0.0.1"
      services:
        # Pre-populate the per-Gateway Service that phase 3 will emit,
        # already with a MetalLB-allocated IP, so the status patcher
        # has something to read back. (In production, the Service is
        # written by the resourceapplier and picked up by the watcher
        # on the next reconciliation.)
        - apiVersion: v1
          kind: Service
          metadata:
            name: gw-default-gw-https-allocated
            namespace: haptic-system
            labels:
              gateway.networking.k8s.io/gateway-name: gw-https-allocated
              gateway.networking.k8s.io/gateway-namespace: default
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.50"
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate alongside per-Gateway status patches.

      # gw-https-allocated: status.addresses uses per-Gateway Service IP.
      - type: contains
        target: 'status:default/gw-https-allocated:rendered'
        pattern: '"value":"203\.0\.113\.50"'
        description: "Gateway with HTTPS listener and per-Gateway Service gets that Service's LB IP (203.0.113.50) in status.addresses, NOT the chart's main LB IP."
      - type: not_contains
        target: 'status:default/gw-https-allocated:rendered'
        pattern: '"value":"10\.0\.0\.1"'
        description: "Chart's main LB IP (10.0.0.1) MUST NOT appear in status.addresses for HTTPS Gateways with their own per- Gateway Service. Without phase 5, the patcher would have left the main IP in place — that's the leak phase 5 closes."
      # gw-http-only: status.addresses keeps the chart's main LB IP.
      - type: contains
        target: 'status:default/gw-http-only:rendered'
        pattern: '"value":"10\.0\.0\.1"'
        description: "HTTP-only Gateway (no per-Gateway Service from phase 3) retains the existing behaviour: status.addresses contains the chart's main LB IP. Phase 5 only kicks in for HTTPS Gateways."
