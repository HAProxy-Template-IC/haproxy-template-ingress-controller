validationTests:
  test-gateway-crtlist-per-listener-shapes:
    description: "Phase 2 of the per-Gateway-IP refactor. Verifies that every HTTPS Gateway listener gets its OWN crt-list file via fileRegistry, and that the file's single line carries the listener-specific SSL options:   * Catchall + AllowValidOnly default validation → cert line     with `ca-file <path> verify required` and NO SNI filter.   * Hostnamed + AllowInsecureFallback per-port validation →     cert line with `ca-file <path> verify optional     ca-ignore-err all crt-ignore-err all` and the listener's     hostname as the SNI filter.   * Catchall + no mTLS → cert line with just `ocsp-update on`     (no verify clause, no SNI filter).   * mTLS-blocked listener (CA refs unresolvable) → NO crt-list     file emitted (phase 4's bind drops on missing file)."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-mixed
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - kind: ConfigMap
                        group: ""
                        name: ca-cm
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        mode: AllowInsecureFallback
                        caCertificateRefs:
                          - kind: ConfigMap
                            group: ""
                            name: ca-cm
            listeners:
              # Catchall + AllowValidOnly default validation.
              - name: https-default
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
              # Hostnamed + AllowInsecureFallback per-port override.
              - name: https-perport
                port: 8443
                hostname: second-example.org
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-bare
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              # Catchall, no mTLS at all.
              - name: https
                port: 9443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-broken-ca
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - kind: ConfigMap
                        group: ""
                        name: nonexistent-ca
            listeners:
              # mTLS-blocked: CA ref points at a non-existent ConfigMap.
              # Phase 2 must skip emission (no crt-list file).
              - name: https
                port: 7443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ca-cm
            namespace: default
          data:
            ca.crt: |
              -----BEGIN CERTIFICATE-----
              MIIDCzCCAfOgAwIBAgIUOaFEhrZTWgRilJ+HRB9hIBysOlMwDQYJKoZIhvcNAQEL
              BQAwFDESMBAGA1UEAwwJbG9jYWxob3N0MCAXDTI1MTExOTE4MjU1MVoYDzIxMjUx
              MDI2MTgyNTUxWjAUMRIwEAYDVQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEB
              AQUAA4IBDwAwggEKAoIBAQCX2HBp4WM+lR/Iyc/4LGMjPy4mGEqKUbnqhWQmOg1x
              4ygFI32G25fXGWcgFmVh8bFReQqu0tgY6IJ9POgZgyxsaiH3zWA2/0nGDz5o7gXy
              ygEKi7Ycs7lsE6x4cyK+kYhWofCMh2CrNK5eBW9QRxwSzbx3VDFjU/GuUZBtAUlH
              DKwfBoFG4HshFCPyvcpnNSKmGpKL0gE2s3ALsy5jjb4i2zrBx82x4cxPeIB8KzrC
              06oAupo2CuLZA1L2C+ePyRT4AlQPcN/iwZgj3+wxo/ZAIiLP+cWmF5uGWy6TDJ2l
              6+aKaaNj1BUPVJLSuovXXB2g6jF1ulH3UV5XO2ULCVsRAgMBAAGjUzBRMB0GA1Ud
              DgQWBBTGv/UXnggkJk+iNCtZqp1+SI/IhjAfBgNVHSMEGDAWgBTGv/UXnggkJk+i
              NCtZqp1+SI/IhjAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQAK
              3ot2A4rGNCXJndpy9iAkGTRy6IlBpLJRSIgRNZiYBE8HKeZu2GrgPb7WFT/TrZB6
              nc28sV7laCC5yreU1xei/fcNYOHylqgAGiEbkvRmskXSwn0JQZjzT5iukhNmPdWD
              IltmhBSqlfTlXTXk+c1YsyBkVCyMSNuFLwzd89KjreSllg19rTURiKG6FSJ6k0OI
              kTMemg3DfZnWYK+Mfpqv9UH2RnPa1Relrxi3KMfhWHvol1yIUHggOH72A8ZGzxVL
              Xx/OkI/0yz3PXo3LmRDjs33YJWK4S2dphZrKtLKhjpAHg256O3RSumgvwcic6UEc
              hJoZ+gyfZqGArrz3WVM9
              -----END CERTIFICATE-----
    assertions:
      - type: haproxy_valid

      # Catchall + AllowValidOnly: verify required, no SNI filter.
      - type: contains
        target: 'crt-list:gw-default-gw-mixed-https-default-crtlist.txt'
        pattern: '^default_tls-cert\.pem \[ocsp-update on ca-file [^ ]+ verify required\]\n$'
      # Hostnamed + AllowInsecureFallback per-port.
      - type: contains
        target: 'crt-list:gw-default-gw-mixed-https-perport-crtlist.txt'
        pattern: '^default_tls-cert\.pem \[ocsp-update on ca-file [^ ]+ verify optional\] second-example\.org\n$'
      # Catchall + no mTLS → just ocsp-update on, no verify, no SNI.
      - type: contains
        target: 'crt-list:gw-default-gw-bare-https-crtlist.txt'
        pattern: '^default_tls-cert\.pem \[ocsp-update on\]\n$'
      # mTLS-blocked listener: file MUST NOT be emitted. The
      # `contains` against an absent file resolves the target to the
      # empty string, so any non-empty pattern's `not_contains`
      # succeeds — we use the cert filename (which every emitted
      # crt-list line would carry) as the probe.
      - type: not_contains
        target: 'crt-list:gw-default-gw-broken-ca-https-crtlist.txt'
        pattern: 'default_tls-cert\.pem'
