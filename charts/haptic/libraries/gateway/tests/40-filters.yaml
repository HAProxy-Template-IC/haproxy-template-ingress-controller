validationTests:
  test-httproute-request-header-modifier:
    description: HTTPRoute with RequestHeaderModifier filter (add, set, remove headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: header-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - name: X-Custom-Header
                          value: custom-value
                      set:
                        - name: X-Replace-Header
                          value: new-value
                      remove:
                        - X-Remove-Header
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request add-header X-Custom-Header 'custom-value' if"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Replace-Header 'new-value' if"

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request del-header X-Remove-Header if'

  test-httproute-response-header-modifier:
    description: HTTPRoute with ResponseHeaderModifier filter (add, set, remove response headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: response-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: ResponseHeaderModifier
                    responseHeaderModifier:
                      add:
                        - name: X-Response-Header
                          value: response-value
                      set:
                        - name: X-Replace-Response
                          value: new-response
                      remove:
                        - X-Remove-Response
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-response add-header X-Response-Header 'response-value' if"

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header X-Replace-Response 'new-response' if"

      - type: contains
        target: haproxy.cfg
        pattern: 'http-response del-header X-Remove-Response if'

  test-httproute-request-redirect:
    description: HTTPRoute with RequestRedirect filter (scheme, path, status code)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-route
            namespace: default
          spec:
            hostnames:
              - old.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /old
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /new
                      statusCode: 301
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redirect_path\) path,regsub\("\^/old","/new"\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://new\.example\.com%\[var\(txn\.gw_redirect_path\)\]" code 301 if'

  test-httproute-request-redirect-default-port-omission:
    description: "RequestRedirect MUST NOT include the port in Location when the resulting (scheme, port) pair is the scheme's default ((http, 80) or (https, 443)) per Gateway API spec."
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-default-ports
            namespace: default
          spec:
            hostnames:
              - example.org
            rules:
              # Empty spec.scheme + port:80 → http://example.org (no :80)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-80
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      port: 80
                      statusCode: 302
              # spec.scheme=https + port:443 → https://example.org (no :443)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-443
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: example.org
                      port: 443
                      statusCode: 302
              # Non-default port stays in Location: spec.scheme=http + port:8080.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /non-default-port
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: http
                      hostname: example.org
                      port: 8080
                      statusCode: 302
    assertions:
      - type: haproxy_valid

      - type: not_contains
        target: haproxy.cfg
        pattern: 'http://example\.org:80(?:[^0-9]|$)'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'https://example\.org:443(?:[^0-9]|$)'
      - type: contains
        target: haproxy.cfg
        pattern: 'http://example\.org:8080'

  test-httproute-url-rewrite:
    description: HTTPRoute with URLRewrite filter (hostname and path rewrite)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: rewrite-route
            namespace: default
          spec:
            hostnames:
              - external.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api/v1
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      hostname: internal.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /api/v2
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header Host 'internal.example.com' if"

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request replace-path'

      - type: contains
        target: haproxy.cfg
        pattern: '"/api/v2'

  test-httproute-cors-filter:
    description: HTTPRoute CORS filter generates set-var, return 200, and response headers
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods:
                        - GET
                        - POST
                      allowHeaders:
                        - X-Custom-Header
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\} \\{ req\\.fhdr\\(Access-Control-Request-Method\\) -m found \\}"

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-methods \"GET, POST\""

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-headers \"X-Custom-Header\""

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header \"access-control-allow-origin\" \"%\\[var\\(txn\\.gw_cors_origin\\)\\]\""

  test-httproute-cors-wildcard-methods-echo:
    description: "Closes the chart-side gap on the HTTPRouteCORS conformance test sub-cases that send `allowMethods: [\"*\"]`."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-methods-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors-wildcard.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /cors-2
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods: ["*"]
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_acrm\\) req\\.fhdr\\(Access-Control-Request-Method\\)"

      - type: contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "%\[var\(txn\.gw_cors_acrm\)\]"'

      - type: not_contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS"'
  test-httproute-backend-request-header-modifier:
    description: HTTPRoute with per-backendRef RequestHeaderModifier emits set-header in correct backend
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v1
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v2
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: br-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v1
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v2
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v1_8080.*?http-request set-header Backend 'backend-v1'.*?backend gtw_default_br-route_backend-v2_8080"

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v2_8080.*?http-request set-header Backend 'backend-v2'"

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_br-route_backend-v1_8080[^a-zA-Z]+[^\\n]*\\n([^\\n]+\\n){0,5}[^\\n]*http-request set-header Backend 'backend-v1'"

  test-httproute-cors-no-hostname:
    description: HTTPRoute CORS filter on catch-all route (no hostnames) routes correctly
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: same-namespace
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: infra-backend-v1
            namespace: gateway-conformance-infra
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-origin
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - filters:
                  - type: CORS
                    cors:
                      allowOrigins:
