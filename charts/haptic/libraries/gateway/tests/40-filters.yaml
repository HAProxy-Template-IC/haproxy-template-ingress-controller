                      type: PathPrefix
                      value: /cors-wildcard-origin
                backendRefs:
                  - name: infra-backend-v1
                    port: 8080
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/cors-wildcard-origin/?\\s+GW_ROUTE_ID"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\}"

  test-httproute-redirect-preserves-request-scheme:
    description: RequestRedirect without spec.scheme preserves the request's scheme via txn.gw_request_scheme
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-svc
            namespace: default
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redir-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                backendRefs:
                  - name: backend-svc
                    port: 8080
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      scheme: https
                backendRefs:
                  - name: backend-svc
                    port: 8080
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(http\\) if !\\{ ssl_fc \\}"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(https\\) if \\{ ssl_fc \\}"

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "%\[var\(txn\.gw_request_scheme\)\]://example\.org%\[var\(txn\.gw_redir_port_part\)\]%\[path\]" code 302'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(\) if .* \{ var\(txn\.listener_port\) -m int \d+ \} !\{ ssl_fc \}'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(:\),concat\(,txn\.listener_port,\) if .* !\{ var\(txn\.gw_redir_port_part\) -m found \}'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://example\.org%\[path\]" code 302'

  test-httproute-request-mirror-single:
    description: "HTTPRoute with a single RequestMirror filter at full traffic (no percent / fraction): emits set-var(gw_mirror_target_1) + send-spoe-group spoa-hub mirror-1-group, plus option http-buffer-request on the frontend (without which req.body would be empty at the plugin)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports:
              - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef:
                        name: mirror-backend
                        namespace: default
                        port: 8080
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'option http-buffer-request'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-backend\.default\.svc\.cluster\.local:8080\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_scheme_1\) str\(http\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_timeout_ms_1\) int\(50000\) if'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_retries_1\) int\(3\) if'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if'

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-1'

      - type: contains
        target: file:spoe.conf
        pattern: 'arg_target=var\(txn\.gw_mirror_target_1\)'

      - type: contains
        target: file:spoe.conf
        pattern: 'arg_timeout_ms=var\(txn\.gw_mirror_timeout_ms_1\) arg_retries=var\(txn\.gw_mirror_retries_1\)'
  test-httproute-request-mirror-percent:
    description: "HTTPRoute with a RequestMirror filter at 20% sampling: the set-var + send-spoe-group directives are gated by a uniform rand(100) lt 20 ACL on top of the route-id condition."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-percent-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      percent: 20
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_sample_1\) rand\(100\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if .* \{ var\(txn\.gw_mirror_sample_1\) -m int lt 20 \}'

  test-httproute-request-mirror-fraction:
    description: "HTTPRoute with a RequestMirror filter using a fraction (numerator=25, denominator=50 — 50%) instead of percent. The chart normalises both forms to a percent-of-100 integer so the rand() ACL shape is uniform across config styles."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-fraction-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      fraction:
                        numerator: 25
                        denominator: 50
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if .* \{ var\(txn\.gw_mirror_sample_1\) -m int lt 50 \}'

  test-httproute-request-mirror-multiple:
    description: "HTTPRoute with two RequestMirror filters on the same rule (SupportHTTPRouteRequestMultipleMirrors). Each filter emits its own (set-var, send-spoe-group) triple; mirrors fire in sequence so each one's var(txn.gw_mirror_target_<i>) is read by its OWN indexed mirror-<i>-group NOTIFY. Single group name across both calls is a no-op on the second invocation — HAProxy SPOE only processes each group once per stream — so the chart MUST emit distinct group names per mirror index."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-a
            namespace: default
          spec:
            ports: [{port: 8081}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-b
            namespace: default
          spec:
            ports: [{port: 8082}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-multi-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-a, namespace: default, port: 8081}
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-b, namespace: default, port: 8082}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-a\.default\.svc\.cluster\.local:8081\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_2\) str\(mirror-b\.default\.svc\.cluster\.local:8082\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-2-group if'

  test-httproute-request-mirror-https-scheme:
    description: "HTTPRoute with a RequestMirror filter pointing at a Service whose target port carries appProtocol=https. The chart must emit arg_scheme=str(https) (not str(http)) so the mirror plugin dispatches over TLS rather than silently downgrading."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-tls
            namespace: default
          spec:
            ports:
              - port: 443
                name: https
                appProtocol: https
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-https-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-tls, namespace: default, port: 443}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_scheme_1\) str\(https\) if'

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-tls\.default\.svc\.cluster\.local:443\) if'

  test-httproute-request-mirror-dynamic-max:
    description: "Cluster with two routes carrying 1 and 3 mirror filters respectively. The chart's spoa-hub library must register at least the dynamic max (mirror-1..mirror-3) AND the static floor (mirror-1..mirror-mirrorStaticMinSlots, default 4) — so with mirrorFanout=3 and the default floor of 4, slots 1 through 4 are emitted. The floor exists because the SPOA hub reloads plugin handler state on every TOML file change; any transient render that emits messages=[] (between two conformance subtests, mid-reconciliation race, etc.) makes the mirror plugin drop in-flight SPOE NOTIFYs (issue #47). Keeping a static minimum means the empty-messages window never opens. Beyond the floor, the chart still extends dynamically — a route with 12 mirror filters renders mirror-1..mirror-12. The shrink-on-reload race remains for slots beyond mirrorStaticMinSlots until SPOA hub plugin-config reload is reworked to never unregister already-registered messages."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: m1, namespace: default}
          spec: {ports: [{port: 8081}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m2, namespace: default}
          spec: {ports: [{port: 8082}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m3, namespace: default}
          spec: {ports: [{port: 8083}]}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-one, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /one}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: m1, namespace: default, port: 8081}
                backendRefs: [{name: api-service, port: 80}]
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-three, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /three}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m2, namespace: default, port: 8082}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m3, namespace: default, port: 8083}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-1'

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-2'

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-3'

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-4'
      - type: not_contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-5'
      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-group mirror-3-group'

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-group mirror-4-group'
