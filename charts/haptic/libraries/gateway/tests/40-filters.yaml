validationTests:
  test-httproute-request-header-modifier:
    description: HTTPRoute with RequestHeaderModifier filter (add, set, remove headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: header-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - name: X-Custom-Header
                          value: custom-value
                      set:
                        - name: X-Replace-Header
                          value: new-value
                      remove:
                        - X-Remove-Header
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request add-header X-Custom-Header 'custom-value' if"
        description: Must generate add-header directive for RequestHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Replace-Header 'new-value' if"
        description: Must generate set-header directive for RequestHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request del-header X-Remove-Header if'
        description: Must generate del-header directive for RequestHeaderModifier filter

  test-httproute-response-header-modifier:
    description: HTTPRoute with ResponseHeaderModifier filter (add, set, remove response headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: response-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: ResponseHeaderModifier
                    responseHeaderModifier:
                      add:
                        - name: X-Response-Header
                          value: response-value
                      set:
                        - name: X-Replace-Response
                          value: new-response
                      remove:
                        - X-Remove-Response
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-response add-header X-Response-Header 'response-value' if"
        description: Must generate add-header directive for ResponseHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header X-Replace-Response 'new-response' if"
        description: Must generate set-header directive for ResponseHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: 'http-response del-header X-Remove-Response if'
        description: Must generate del-header directive for ResponseHeaderModifier filter

  test-httproute-request-redirect:
    description: HTTPRoute with RequestRedirect filter (scheme, path, status code)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-route
            namespace: default
          spec:
            hostnames:
              - old.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /old
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /new
                      statusCode: 301
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redirect_path\) path,regsub\("\^/old","/new"\) if'
        description: Must compute rewritten path via regsub on the matched prefix

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://new\.example\.com%\[var\(txn\.gw_redirect_path\)\]" code 301 if'
        description: Must emit redirect with full Location URL referencing the rewritten path

  test-httproute-request-redirect-default-port-omission:
    description: "RequestRedirect MUST NOT include the port in Location when the resulting (scheme, port) pair is the scheme's default ((http, 80) or (https, 443)) per Gateway API spec."
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-default-ports
            namespace: default
          spec:
            hostnames:
              - example.org
            rules:
              # Empty spec.scheme + port:80 → http://example.org (no :80)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-80
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      port: 80
                      statusCode: 302
              # spec.scheme=https + port:443 → https://example.org (no :443)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-443
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: example.org
                      port: 443
                      statusCode: 302
              # Non-default port stays in Location: spec.scheme=http + port:8080.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /non-default-port
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: http
                      hostname: example.org
                      port: 8080
                      statusCode: 302
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: not_contains
        target: haproxy.cfg
        pattern: 'http://example\.org:80(?:[^0-9]|$)'
        description: |
          (http, 80) is the http scheme's default port — Location
          must omit it. Detects the unconditional-append regression.
          Anchor with non-digit lookahead so `:80` doesn't match `:8080`.

      - type: not_contains
        target: haproxy.cfg
        pattern: 'https://example\.org:443(?:[^0-9]|$)'
        description: |
          (https, 443) is the https scheme's default port — Location
          must omit it.

      - type: contains
        target: haproxy.cfg
        pattern: 'http://example\.org:8080'
        description: Non-default ports remain in Location (sanity check)

  test-httproute-url-rewrite:
    description: HTTPRoute with URLRewrite filter (hostname and path rewrite)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: rewrite-route
            namespace: default
          spec:
            hostnames:
              - external.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api/v1
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      hostname: internal.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /api/v2
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header Host 'internal.example.com' if"
        description: Must generate hostname rewrite directive

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request replace-path'
        description: Must generate path prefix replacement directive

      - type: contains
        target: haproxy.cfg
        pattern: '"/api/v2'
        description: Must rewrite to new path prefix

  test-httproute-cors-filter:
    description: HTTPRoute CORS filter generates set-var, return 200, and response headers
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods:
                        - GET
                        - POST
                      allowHeaders:
                        - X-Custom-Header
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"
        description: Must emit gw_cors_origin set-var

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\} \\{ req\\.fhdr\\(Access-Control-Request-Method\\) -m found \\}"
        description: Inline return status 200 carries CORS preflight headers (synthetic responses skip http-response phase)

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-methods \"GET, POST\""
        description: Preflight return includes allow-methods header

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-headers \"X-Custom-Header\""
        description: Preflight return includes allow-headers header

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header \"access-control-allow-origin\" \"%\\[var\\(txn\\.gw_cors_origin\\)\\]\""
        description: Simple cross-origin (backend-served) responses emit allow-origin via http-response set-header

  test-httproute-cors-wildcard-methods-echo:
    description: "Closes the chart-side gap on the HTTPRouteCORS conformance test sub-cases that send `allowMethods: [\"*\"]`."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-methods-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors-wildcard.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /cors-2
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods: ["*"]
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_acrm\\) req\\.fhdr\\(Access-Control-Request-Method\\)"
        description: Preflight set-var captures the requested method into txn.gw_cors_acrm

      - type: contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "%\[var\(txn\.gw_cors_acrm\)\]"'
        description: Preflight return echoes the requested method dynamically

      - type: not_contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS"'
        description: |
          Old chart behaviour (expanding `*` to a fixed method list)
          is gone — that response is incompatible with the Gateway
          API conformance test's ValidHeaderValues check, which
          accepts only the requested method or a literal `*`.

  test-httproute-backend-request-header-modifier:
    description: HTTPRoute with per-backendRef RequestHeaderModifier emits set-header in correct backend
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v1
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v2
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: br-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v1
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v2
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v1_8080.*?http-request set-header Backend 'backend-v1'.*?backend gtw_default_br-route_backend-v2_8080"
        description: backend-v1 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v2_8080.*?http-request set-header Backend 'backend-v2'"
        description: backend-v2 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_br-route_backend-v1_8080[^a-zA-Z]+[^\\n]*\\n([^\\n]+\\n){0,5}[^\\n]*http-request set-header Backend 'backend-v1'"
        description: backend-v1 must have its own Backend header within first few lines (not v2's)

  test-httproute-cors-no-hostname:
    description: HTTPRoute CORS filter on catch-all route (no hostnames) routes correctly
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: same-namespace
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: infra-backend-v1
            namespace: gateway-conformance-infra
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-origin
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - "*"
                      allowMethods: ["PUT"]
                      allowCredentials: false
                matches:
                  - path:
                      type: PathPrefix
                      value: /cors-wildcard-origin
                backendRefs:
                  - name: infra-backend-v1
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/cors-wildcard-origin/?\\s+GW_ROUTE_ID"
        description: Path map must have entry for /cors-wildcard-origin (catch-all host)

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"
        description: CORS template must emit gw_cors_origin set-var

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\}"
        description: CORS template must emit inline-hdr return 200 for preflight

  test-httproute-redirect-preserves-request-scheme:
    description: RequestRedirect without spec.scheme preserves the request's scheme via txn.gw_request_scheme
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-svc
            namespace: default
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redir-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                backendRefs:
                  - name: backend-svc
                    port: 8080
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      scheme: https
                backendRefs:
                  - name: backend-svc
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config compiles

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(http\\) if !\\{ ssl_fc \\}"
        description: Sets gw_request_scheme=http for non-SSL requests (uses `if !` rather than `unless` because the dataplane API silently drops the latter)

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(https\\) if \\{ ssl_fc \\}"
        description: Sets gw_request_scheme=https for SSL requests

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "%\[var\(txn\.gw_request_scheme\)\]://example\.org%\[var\(txn\.gw_redir_port_part\)\]%\[path\]" code 302'
        description: |
          Redirect URL uses gw_request_scheme when spec.scheme is unset, and
          appends a runtime-resolved port-part (txn.gw_redir_port_part) so
          the Gateway listener port survives — per Gateway API spec for
          RequestRedirect, when both spec.scheme and spec.port are
          unspecified the redirect MUST use the Gateway listener port.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(\) if .* \{ var\(txn\.listener_port\) -m int \d+ \} !\{ ssl_fc \}'
        description: Empty port-part when (request scheme=http, listener_port=chart-static-http) — well-known omit case. Uses txn.listener_port (set by frontend-routing-logic from dst_port through pod-listener-port.map) so per-Gateway-IP binds (pod port → user-facing listener port) still produce the right omit decision.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(:\),concat\(,txn\.listener_port,\) if .* !\{ var\(txn\.gw_redir_port_part\) -m found \}'
        description: Otherwise port-part = ":<listener_port>" so a non-default Gateway listener port is preserved in the Location URL — using the translated listener port survives the per-Gateway pod-port hop.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://example\.org%\[path\]" code 302'
        description: Redirect URL uses literal scheme when spec.scheme=https
