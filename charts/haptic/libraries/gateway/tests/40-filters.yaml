validationTests:
  test-httproute-request-header-modifier:
    description: HTTPRoute with RequestHeaderModifier filter (add, set, remove headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: header-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      add:
                        - name: X-Custom-Header
                          value: custom-value
                      set:
                        - name: X-Replace-Header
                          value: new-value
                      remove:
                        - X-Remove-Header
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request add-header X-Custom-Header 'custom-value' if"
        description: Must generate add-header directive for RequestHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Replace-Header 'new-value' if"
        description: Must generate set-header directive for RequestHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request del-header X-Remove-Header if'
        description: Must generate del-header directive for RequestHeaderModifier filter

  test-httproute-response-header-modifier:
    description: HTTPRoute with ResponseHeaderModifier filter (add, set, remove response headers)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: response-filter-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: ResponseHeaderModifier
                    responseHeaderModifier:
                      add:
                        - name: X-Response-Header
                          value: response-value
                      set:
                        - name: X-Replace-Response
                          value: new-response
                      remove:
                        - X-Remove-Response
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-response add-header X-Response-Header 'response-value' if"
        description: Must generate add-header directive for ResponseHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header X-Replace-Response 'new-response' if"
        description: Must generate set-header directive for ResponseHeaderModifier filter

      - type: contains
        target: haproxy.cfg
        pattern: 'http-response del-header X-Remove-Response if'
        description: Must generate del-header directive for ResponseHeaderModifier filter

  test-httproute-request-redirect:
    description: HTTPRoute with RequestRedirect filter (scheme, path, status code)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-route
            namespace: default
          spec:
            hostnames:
              - old.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /old
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: new.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /new
                      statusCode: 301
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redirect_path\) path,regsub\("\^/old","/new"\) if'
        description: Must compute rewritten path via regsub on the matched prefix

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://new\.example\.com%\[var\(txn\.gw_redirect_path\)\]" code 301 if'
        description: Must emit redirect with full Location URL referencing the rewritten path

  test-httproute-request-redirect-default-port-omission:
    description: "RequestRedirect MUST NOT include the port in Location when the resulting (scheme, port) pair is the scheme's default ((http, 80) or (https, 443)) per Gateway API spec."
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redirect-default-ports
            namespace: default
          spec:
            hostnames:
              - example.org
            rules:
              # Empty spec.scheme + port:80 → http://example.org (no :80)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-80
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      port: 80
                      statusCode: 302
              # spec.scheme=https + port:443 → https://example.org (no :443)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-443
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      hostname: example.org
                      port: 443
                      statusCode: 302
              # Non-default port stays in Location: spec.scheme=http + port:8080.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /non-default-port
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: http
                      hostname: example.org
                      port: 8080
                      statusCode: 302
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: not_contains
        target: haproxy.cfg
        pattern: 'http://example\.org:80(?:[^0-9]|$)'
        description: |
          (http, 80) is the http scheme's default port — Location
          must omit it. Detects the unconditional-append regression.
          Anchor with non-digit lookahead so `:80` doesn't match `:8080`.

      - type: not_contains
        target: haproxy.cfg
        pattern: 'https://example\.org:443(?:[^0-9]|$)'
        description: |
          (https, 443) is the https scheme's default port — Location
          must omit it.

      - type: contains
        target: haproxy.cfg
        pattern: 'http://example\.org:8080'
        description: Non-default ports remain in Location (sanity check)

  test-httproute-url-rewrite:
    description: HTTPRoute with URLRewrite filter (hostname and path rewrite)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: rewrite-route
            namespace: default
          spec:
            hostnames:
              - external.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api/v1
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      hostname: internal.example.com
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /api/v2
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header Host 'internal.example.com' if"
        description: Must generate hostname rewrite directive

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request replace-path'
        description: Must generate path prefix replacement directive

      - type: contains
        target: haproxy.cfg
        pattern: '"/api/v2'
        description: Must rewrite to new path prefix

  test-httproute-cors-filter:
    description: HTTPRoute CORS filter generates set-var, return 200, and response headers
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods:
                        - GET
                        - POST
                      allowHeaders:
                        - X-Custom-Header
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"
        description: Must emit gw_cors_origin set-var

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\} \\{ req\\.fhdr\\(Access-Control-Request-Method\\) -m found \\}"
        description: Inline return status 200 carries CORS preflight headers (synthetic responses skip http-response phase)

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-methods \"GET, POST\""
        description: Preflight return includes allow-methods header

      - type: contains
        target: haproxy.cfg
        pattern: "hdr access-control-allow-headers \"X-Custom-Header\""
        description: Preflight return includes allow-headers header

      - type: contains
        target: haproxy.cfg
        pattern: "http-response set-header \"access-control-allow-origin\" \"%\\[var\\(txn\\.gw_cors_origin\\)\\]\""
        description: Simple cross-origin (backend-served) responses emit allow-origin via http-response set-header

  test-httproute-cors-wildcard-methods-echo:
    description: "Closes the chart-side gap on the HTTPRouteCORS conformance test sub-cases that send `allowMethods: [\"*\"]`."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-methods-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            hostnames:
              - cors-wildcard.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /cors-2
                filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - https://www.foo.com
                      allowMethods: ["*"]
                backendRefs:
                  - name: backend
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_acrm\\) req\\.fhdr\\(Access-Control-Request-Method\\)"
        description: Preflight set-var captures the requested method into txn.gw_cors_acrm

      - type: contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "%\[var\(txn\.gw_cors_acrm\)\]"'
        description: Preflight return echoes the requested method dynamically

      - type: not_contains
        target: haproxy.cfg
        pattern: 'hdr access-control-allow-methods "GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS"'
        description: |
          Old chart behaviour (expanding `*` to a fixed method list)
          is gone — that response is incompatible with the Gateway
          API conformance test's ValidHeaderValues check, which
          accepts only the requested method or a literal `*`.

  test-httproute-backend-request-header-modifier:
    description: HTTPRoute with per-backendRef RequestHeaderModifier emits set-header in correct backend
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v1
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v2
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: br-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v1
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v2
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v1_8080.*?http-request set-header Backend 'backend-v1'.*?backend gtw_default_br-route_backend-v2_8080"
        description: backend-v1 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v2_8080.*?http-request set-header Backend 'backend-v2'"
        description: backend-v2 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_br-route_backend-v1_8080[^a-zA-Z]+[^\\n]*\\n([^\\n]+\\n){0,5}[^\\n]*http-request set-header Backend 'backend-v1'"
        description: backend-v1 must have its own Backend header within first few lines (not v2's)

  test-httproute-cors-no-hostname:
    description: HTTPRoute CORS filter on catch-all route (no hostnames) routes correctly
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: same-namespace
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: infra-backend-v1
            namespace: gateway-conformance-infra
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: cors-wildcard-origin
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: same-namespace
            rules:
              - filters:
                  - type: CORS
                    cors:
                      allowOrigins:
                        - "*"
                      allowMethods: ["PUT"]
                      allowCredentials: false
                matches:
                  - path:
                      type: PathPrefix
                      value: /cors-wildcard-origin
                backendRefs:
                  - name: infra-backend-v1
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/cors-wildcard-origin/?\\s+GW_ROUTE_ID"
        description: Path map must have entry for /cors-wildcard-origin (catch-all host)

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_cors_origin\\) req\\.fhdr\\(Origin\\)"
        description: CORS template must emit gw_cors_origin set-var

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 200 hdr access-control-allow-origin .* if METH_OPTIONS \\{ var\\(txn\\.gw_cors_origin\\) -m found \\}"
        description: CORS template must emit inline-hdr return 200 for preflight

  test-httproute-redirect-preserves-request-scheme:
    description: RequestRedirect without spec.scheme preserves the request's scheme via txn.gw_request_scheme
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-svc
            namespace: default
          spec:
            ports:
              - port: 8080
                targetPort: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: redir-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-nil-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                backendRefs:
                  - name: backend-svc
                    port: 8080
              - matches:
                  - path:
                      type: PathPrefix
                      value: /scheme-https-and-port-nil
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: example.org
                      scheme: https
                backendRefs:
                  - name: backend-svc
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config compiles

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(http\\) if !\\{ ssl_fc \\}"
        description: Sets gw_request_scheme=http for non-SSL requests (uses `if !` rather than `unless` because the dataplane API silently drops the latter)

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_request_scheme\\) str\\(https\\) if \\{ ssl_fc \\}"
        description: Sets gw_request_scheme=https for SSL requests

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "%\[var\(txn\.gw_request_scheme\)\]://example\.org%\[var\(txn\.gw_redir_port_part\)\]%\[path\]" code 302'
        description: |
          Redirect URL uses gw_request_scheme when spec.scheme is unset, and
          appends a runtime-resolved port-part (txn.gw_redir_port_part) so
          the Gateway listener port survives — per Gateway API spec for
          RequestRedirect, when both spec.scheme and spec.port are
          unspecified the redirect MUST use the Gateway listener port.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(\) if .* \{ var\(txn\.listener_port\) -m int \d+ \} !\{ ssl_fc \}'
        description: Empty port-part when (request scheme=http, listener_port=chart-static-http) — well-known omit case. Uses txn.listener_port (set by frontend-routing-logic from dst_port through pod-listener-port.map) so per-Gateway-IP binds (pod port → user-facing listener port) still produce the right omit decision.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_redir_port_part\) str\(:\),concat\(,txn\.listener_port,\) if .* !\{ var\(txn\.gw_redir_port_part\) -m found \}'
        description: Otherwise port-part = ":<listener_port>" so a non-default Gateway listener port is preserved in the Location URL — using the translated listener port survives the per-Gateway pod-port hop.

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request redirect location "https://example\.org%\[path\]" code 302'
        description: Redirect URL uses literal scheme when spec.scheme=https

  test-httproute-request-mirror-single:
    description: |
      HTTPRoute with a single RequestMirror filter at full traffic (no
      percent / fraction): emits set-var(gw_mirror_target_1) +
      send-spoe-group spoa-hub mirror-1-group, plus option
      http-buffer-request on the frontend (without which req.body
      would be empty at the plugin).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports:
              - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-route
            namespace: default
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef:
                        name: mirror-backend
                        namespace: default
                        port: 8080
                backendRefs:
                  - name: api-service
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'option http-buffer-request'
        description: Frontend must force option http-buffer-request so req.body reaches the mirror plugin (the entire mirror flow is silently body-less without it)

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-backend\.default\.svc\.cluster\.local:8080\) if'
        description: Mirror target resolved to the Kubernetes Service DNS name + port; index 1 because the route has one mirror filter

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_scheme_1\) str\(http\) if'
        description: Mirror scheme defaults to http (HTTPS is a v0.2 plugin feature)

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if'
        description: send-spoe-group fires the mirror-1 NOTIFY after the set-var pair (per-index group name; SPOE only processes each group once per stream)

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-1'
        description: spoe.conf carries the per-index mirror-1 message body wired to var(txn.gw_mirror_target_1)

      - type: contains
        target: file:spoe.conf
        pattern: 'arg_target=var\(txn\.gw_mirror_target_1\)'
        description: spoe-message arg_target reads from the indexed var the frontend filter sets

  test-httproute-request-mirror-percent:
    description: |
      HTTPRoute with a RequestMirror filter at 20% sampling: the
      set-var + send-spoe-group directives are gated by a uniform
      rand(100) lt 20 ACL on top of the route-id condition.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-percent-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      percent: 20
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_sample_1\) rand\(100\) if'
        description: Random sample drawn ONCE per request into txn.gw_mirror_sample (not per-directive — bug Gitar review caught)

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if .* \{ var\(txn\.gw_mirror_sample_1\) -m int lt 20 \}'
        description: send-spoe-group gated on the pre-drawn sample (not re-rolling rand() per-directive)

  test-httproute-request-mirror-fraction:
    description: |
      HTTPRoute with a RequestMirror filter using a fraction
      (numerator=25, denominator=50 — 50%) instead of percent. The
      chart normalises both forms to a percent-of-100 integer so the
      rand() ACL shape is uniform across config styles.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-backend
            namespace: default
          spec:
            ports: [{port: 8080}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-fraction-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-backend, namespace: default, port: 8080}
                      fraction:
                        numerator: 25
                        denominator: 50
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if .* \{ var\(txn\.gw_mirror_sample_1\) -m int lt 50 \}'
        description: 25/50 fraction is normalised to percent=50 in the gated ACL

  test-httproute-request-mirror-multiple:
    description: |
      HTTPRoute with two RequestMirror filters on the same rule
      (SupportHTTPRouteRequestMultipleMirrors). Each filter emits its
      own (set-var, send-spoe-group) triple; mirrors fire in sequence
      so each one's var(txn.gw_mirror_target_<i>) is read by its
      OWN indexed mirror-<i>-group NOTIFY. Single group name across
      both calls is a no-op on the second invocation — HAProxy SPOE
      only processes each group once per stream — so the chart MUST
      emit distinct group names per mirror index.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-a
            namespace: default
          spec:
            ports: [{port: 8081}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-b
            namespace: default
          spec:
            ports: [{port: 8082}]
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-multi-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-a, namespace: default, port: 8081}
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-b, namespace: default, port: 8082}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-a\.default\.svc\.cluster\.local:8081\) if'
        description: First mirror's indexed set-var points at backend A

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_2\) str\(mirror-b\.default\.svc\.cluster\.local:8082\) if'
        description: Second mirror's indexed set-var points at backend B (distinct group name → SPOE actually fires the second NOTIFY; single shared `mirror-group` was dropped by HAProxy's per-stream group dedup)

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-1-group if'
        description: First mirror's send-spoe-group references its own indexed group

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request send-spoe-group spoa-hub mirror-2-group if'
        description: Second mirror's send-spoe-group references a different indexed group (the bug being fixed — same group name across multiple send-spoe-group calls in the same stream are silently no-ops)

  test-httproute-request-mirror-https-scheme:
    description: |
      HTTPRoute with a RequestMirror filter pointing at a Service whose
      target port carries appProtocol=https. The chart must emit
      arg_scheme=str(https) (not str(http)) so the mirror plugin
      dispatches over TLS rather than silently downgrading.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata:
            name: mirror-tls
            namespace: default
          spec:
            ports:
              - port: 443
                name: https
                appProtocol: https
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: mirror-https-route
            namespace: default
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /api}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: mirror-tls, namespace: default, port: 443}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_scheme_1\) str\(https\) if'
        description: arg_scheme is https when the mirror Service port declares appProtocol=https

      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.gw_mirror_target_1\) str\(mirror-tls\.default\.svc\.cluster\.local:443\) if'
        description: Target carries the resolved DNS:port

  test-httproute-request-mirror-dynamic-max:
    description: |
      Cluster with two routes carrying 1 and 3 mirror filters
      respectively. The chart's spoa-hub library emits mirror-1
      through mirror-4 in spoe.conf — the static floor of 4 slots
      that always exists regardless of route count (matching plugin
      v0.2.0's race-safe baseline) — and would extend to mirror-5,
      mirror-6, … if any route had more than 4 mirror filters. The
      plugin's hub-TOML messages list enumerates the same four (or
      more) names so the hub routes every declared SPOE message to
      the plugin.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-service
            namespace: default
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {name: m1, namespace: default}
          spec: {ports: [{port: 8081}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m2, namespace: default}
          spec: {ports: [{port: 8082}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m3, namespace: default}
          spec: {ports: [{port: 8083}]}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-one, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /one}}]
                filters:
                  - type: RequestMirror
                    requestMirror:
                      backendRef: {name: m1, namespace: default, port: 8081}
                backendRefs: [{name: api-service, port: 80}]
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-three, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /three}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m2, namespace: default, port: 8082}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m3, namespace: default, port: 8083}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-1'
        description: mirror-1 message emitted

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-2'
        description: mirror-2 message emitted

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-3'
        description: mirror-3 message emitted (matches the actual per-route max)

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-4'
        description: |
          mirror-4 emitted from the static floor of 4 slots, even though
          no route uses a 4th mirror filter. The floor exists to avoid
          a controller-side spoe.conf-before-haproxy.cfg race on route
          deletion (see spoa-hub.yaml's spoa-hub-config-content comment).

      - type: not_contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-5'
        description: mirror-5 NOT emitted — floor is 4, no route needs more

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-group mirror-4-group'
        description: matching group for the floor's highest index

  test-httproute-request-mirror-beyond-floor:
    description: |
      HTTPRoute carrying 6 RequestMirror filters on a single rule —
      double the static floor of 4. The chart must expand the spoe.conf
      message+group set to mirror-1..mirror-6 (no upper bound) so each
      mirror filter has its own SPOE group; HAProxy SPOE dedups
      send-spoe-group calls per stream, so duplicate group names would
      drop frames silently.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec: {ports: [{port: 80}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m1, namespace: default}
          spec: {ports: [{port: 8081}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m2, namespace: default}
          spec: {ports: [{port: 8082}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m3, namespace: default}
          spec: {ports: [{port: 8083}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m4, namespace: default}
          spec: {ports: [{port: 8084}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m5, namespace: default}
          spec: {ports: [{port: 8085}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: m6, namespace: default}
          spec: {ports: [{port: 8086}]}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: r-six, namespace: default}
          spec:
            hostnames: [api.example.com]
            rules:
              - matches: [{path: {type: PathPrefix, value: /six}}]
                filters:
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m1, namespace: default, port: 8081}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m2, namespace: default, port: 8082}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m3, namespace: default, port: 8083}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m4, namespace: default, port: 8084}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m5, namespace: default, port: 8085}}
                  - type: RequestMirror
                    requestMirror: {backendRef: {name: m6, namespace: default, port: 8086}}
                backendRefs: [{name: api-service, port: 80}]
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-group mirror-6-group'
        description: highest-index group exists (no static cap)

      - type: contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-6'
        description: matching message body for the highest slot

      - type: not_contains
        target: file:spoe.conf
        pattern: 'spoe-message mirror-7'
        description: nothing past the actual per-route max is emitted
