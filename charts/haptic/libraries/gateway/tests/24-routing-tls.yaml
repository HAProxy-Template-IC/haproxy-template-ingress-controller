        pattern: "backend gtw_tls_default_tls-mismatch"
        description: TLSRoute with non-intersecting hostname produces no backend

  test-tlsroute-wildcard-listener-exact-route:
    description: |
      Wildcard listener "*.example.com" + exact route "abc.example.com"
      produces a backend keyed on the exact route hostname (per Gateway
      API HostnameSinglePairIntersection).
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
