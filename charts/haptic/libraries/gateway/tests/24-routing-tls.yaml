validationTests:
  test-tlsroute-terminate-on-chart-static-httpsport:
    description: "Mirrors the upstream TLSRouteTerminateSimpleSameNamespace conformance fixture: a Gateway with one TLS-Terminate listener on port 8443 (which is also the chart's default httpsPort) and nothing else com."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tlsroute-terminate-default
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tlsterm
                protocol: TLS
                port: 8443
                hostname: tls.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-app
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: gw-tlsroute-terminate-default
            hostnames:
              - tls.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 8443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 8443
    assertions:
      - type: haproxy_valid
        description: |
          HAProxy config must be valid (the chart-static + new TLS
          frontend must coexist without conflicting on port 8443).

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend gateway-tls-port-8443$'
        description: |
          New TLS frontend claims port 8443 because the chart-static
          frontends decline (no HTTPS listener, no passthrough
          backends).

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:8443 ssl crt-list '
        description: |
          New TLS frontend's bind terminates TLS on 8443 (this is
          what the upstream TLSRouteTerminateSimpleSameNamespace
          fixture exercises).

      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:8443'
        expected: "1"
        description: |
          Exactly one frontend binds 8443 — the new TLS frontend. The
          chart-static HTTPS frontend and ssl-tcp do not also bind
          8443 (they bind their own httpsPort, which the chart-test
          framework defaults to 443; even if they DID try, the
          chart-static-bind gate in frontends-600-gateway-tls-listener
          would skip the new TLS frontend on a colliding port).

  test-tlsroute-invalid-backend-rejects-on-frontend:
    description: "Mirror of the upstream TLSRouteInvalidBackendRefUnknownKind conformance fixture's chart-side contract: a TLS Passthrough listener has a TLSRoute attached whose backendRef points at an unknown kind."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tlsroute-invalid
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 9445
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: invalid-backend
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: gw-tlsroute-invalid
            hostnames:
              - example.com
            rules:
              - backendRefs:
                  - group: unknownkind.example.com
                    kind: NonExistent
                    name: tls-backend
                    port: 443
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with invalid-backend TLSRoute

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend gateway-tls-port-9445$'
        description: Per-port frontend exists even when no route survives.

      - type: not_contains
        target: haproxy.cfg
        pattern: 'use_backend .* req_ssl_sni -m str example\.com'
        description: |
          No use_backend rule for example.com — the TLSRoute was
          filtered at Pass 2's ResolvedRefs gate (backend group/kind
          mismatch), so its SNI never enters the allowlist.

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+tcp-request content reject$'
        description: |
          Frontend ends with `tcp-request content reject` — connections
          whose SNI doesn't match a claimed route get a TCP RST. Upstream
          conformance asserts this via
          MakeTLSConnectionAndExpectEventuallyConnectionRejection.

  test-tlsroute-terminate-nondefault-port-frontend:
    description: TLSRoute attached to a TLS Terminate listener on a non-chart- static port renders a per-port mode-tcp frontend with TLS termination on the bind.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tlsroute-terminate
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tlsterm
                protocol: TLS
                port: 9444
                hostname: tls.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
                      namespace: default
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-app
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: gw-tlsroute-terminate
            hostnames:
              - tls.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 8443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 8443
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with Terminate per-port frontend

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend gateway-tls-port-9444$'
        description: Per-port TLS frontend exists for Terminate listener on 9444.

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:9444 ssl crt-list '
        description: |
          Bind carries `ssl crt-list ...` — Terminate mode terminates
          the TLS handshake; the crt-list lookup picks the cert by SNI.

      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if \{ ssl_fc_sni -m str tls\.example\.com \}'
        description: |
          Routing uses `ssl_fc_sni` (post-handshake SNI) — the
          handshake completed on the bind, so we can read the SNI
          HAProxy negotiated rather than re-parsing the bytes.

      - type: not_contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if .*req_ssl_sni'
        description: |
          Terminate-mode frontend MUST NOT use `req_ssl_sni` (which
          reads the buffered ClientHello before termination — wrong
          for a frontend that already terminated TLS).

  test-tlsroute-passthrough-nondefault-port-frontend:
    description: "TLSRoute attached to a TLS Passthrough listener on a port OTHER than the chart-static httpsPort lands on the new `frontends-600-gateway-tls-listener` per-port frontend, not on the chart's static ssl-t."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tlsroute-9443
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 9443
                hostname: "*.example.com"
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-app
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: gw-tlsroute-9443
            hostnames:
              - abc.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 8443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 8443
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with per-port TLS frontend

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend gateway-tls-port-9443$'
        description: Per-port TLS frontend exists for non-default port 9443.

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+mode tcp$'
        description: Frontend uses mode tcp (TLSRoute is L4).

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:9443$'
        description: |
          Plain bind (no `ssl ...`) for Passthrough mode — TLS bytes
          flow through HAProxy unmodified.

      - type: contains
        target: haproxy.cfg
        pattern: 'tcp-request inspect-delay 5s'
        description: |
          Passthrough preamble: inspect-delay lets req_ssl_sni read
          SNI from the buffered ClientHello without terminating.

      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if \{ req_ssl_sni -m str abc\.example\.com \}'
        description: |
          SNI-based use_backend rule routes the TLSRoute's claimed
          hostname to its TCP backend.

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+tcp-request content reject$'
        description: |
          Reject-default at end of frontend: SNIs that no route
          claims get a TCP RST (closes
          TLSRouteInvalidBackendRefNonexistent /
          TLSRouteInvalidBackendRefUnknownKind, where the unresolvable
          backend filters the route out at Pass 2's ResolvedRefs gate
          so the SNI never enters the allowlist).

  test-tlsroute-passthrough-basic:
    description: |
      TLSRoute attached to a TLS Passthrough listener emits a TCP-mode
      backend named gtw_tls_<ns>_<route>_<rule> and a SNI-keyed
      use_backend rule on the ssl-tcp frontend.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tlsroute
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 443
                hostname: "*.example.com"
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-app
            namespace: default
            generation: 1
          spec:
            parentRefs:
              - name: gw-tlsroute
            hostnames:
              - abc.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 8443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 8443
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with TLSRoute passthrough
      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_tls_default_tls-app_0"
        description: TLSRoute backend uses gtw_tls_<ns>_<name>_<ruleIdx> naming
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend gtw_tls_default_tls-app_0 if \\{ req_ssl_sni -m str abc\\.example\\.com \\}"
        description: ssl-tcp frontend dispatches by SNI to the TLSRoute backend
      - type: contains
        target: haproxy.cfg
        pattern: "frontend ssl-tcp"
        description: ssl-tcp frontend exists when TLSRoute passthrough is configured
      - type: not_contains
        target: haproxy.cfg
        pattern: "use_backend gtw_tls_default_tls-app_0 if .*ssl_fc_sni"
        description: SSL passthrough must use req_ssl_sni (TCP mode) NOT ssl_fc_sni (HTTPS mode)

  test-tlsroute-no-tls-listener:
    description: |
      TLSRoute parented to an HTTP-only Gateway (no TLS listener) must NOT
      produce a TLSRoute backend. Mirrors conformance
      tlsroute-invalid-no-matching-listener for the HTTP / HTTPS case.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-http-only
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: Same
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-app
            namespace: default
          spec:
            parentRefs:
              - name: gw-http-only
            hostnames:
              - tls.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 443
    assertions:
      - type: haproxy_valid
        description: HAProxy config valid even when TLSRoute has no matching listener
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend gtw_tls_default_tls-app"
        description: TLSRoute attached to HTTP-only Gateway must not produce a backend

  test-tlsroute-hostname-mismatch:
    description: |
      TLSRoute hostname not intersecting the listener hostname does NOT
