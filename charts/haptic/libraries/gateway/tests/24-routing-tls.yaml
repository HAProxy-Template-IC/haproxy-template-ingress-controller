                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-bad-section
            namespace: default
          spec:
            parentRefs:
              - name: gw-tls
                sectionName: nonexistent-listener
            hostnames:
              - tls.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 443
      services:
        - apiVersion: v1
