    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tls
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 443
                hostname: example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-mismatch
            namespace: default
          spec:
            parentRefs:
              - name: gw-tls
            hostnames:
              - other.test
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: tcp-backend-abc
            namespace: default
            labels:
              kubernetes.io/service-name: tcp-backend
          endpoints:
            - addresses: ["10.0.0.5"]
          ports:
            - port: 443
    assertions:
      - type: haproxy_valid
