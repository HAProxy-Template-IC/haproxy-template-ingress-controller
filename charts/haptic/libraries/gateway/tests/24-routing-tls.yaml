    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tls
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 443
                allowedRoutes:
                  namespaces:
                    from: Same
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-bad-kind
            namespace: default
          spec:
            parentRefs:
              - name: gw-tls
            hostnames:
              - tls.example.com
            rules:
              - backendRefs:
                  - group: example.com
                    kind: NotAService
                    name: not-a-service
                    port: 443
    assertions:
      - type: haproxy_valid
        description: HAProxy config valid when TLSRoute has non-Service backend
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend gtw_tls_default_tls-bad-kind"
        description: TLSRoute with non-Service backendRef produces no backend

  test-tlsroute-mixed-termination-protocol-conflict:
    description: |
      Mirrors the upstream Gateway API
      TLSRouteListenerMixedTerminationNotSupported conformance fixture:
      a Gateway with two TLS listeners on the same port, one in
      `tls.mode: Terminate` and the other in `tls.mode: Passthrough`.
      The chart treats this as `Accepted=False/ProtocolConflict` on
      both listeners with `attachedRoutes=0` (HAProxy can't both
      terminate and passthrough on the same bind, so neither listener
      can win) — pinned by the listener-level conditions on the
      Gateway status.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-tlsroute-mixed-termination-not-supported
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls-terminate
                port: 8443
                protocol: TLS
                hostname: terminate.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - name: tls-terminate-checks-certificate
                      namespace: gateway-conformance-infra
              - name: tls-passthrough
                port: 8443
                protocol: TLS
                hostname: passthrough.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-conformance-infra
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-terminate-checks-certificate
            namespace: gateway-conformance-infra
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid for mixed-termination Gateway shape

      # Both listeners' status: Accepted=False/ProtocolConflict.
      - type: match_count
        target: "status:gateway-conformance-infra/gateway-tlsroute-mixed-termination-not-supported:rendered"
        pattern: '"reason":"ProtocolConflict","status":"False","type":"Accepted"'
        expected: "2"
        description: |
          Both listeners must show Accepted=False/ProtocolConflict —
          conformance test asserts: "Listener with unsupported mixed
          Terminate/Passthrough must have Accepted=False with
          Reason=ProtocolConflict".

      - type: match_count
        target: "status:gateway-conformance-infra/gateway-tlsroute-mixed-termination-not-supported:rendered"
        pattern: '"attachedRoutes":0'
        expected: "2"
        description: |
          Both listeners must show attachedRoutes=0 (the conformance
          test asserts this directly via GatewayStatusMustHaveListeners).
