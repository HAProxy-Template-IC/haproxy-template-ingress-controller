    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-tls
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 443
                hostname: example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: tls-mismatch
            namespace: default
          spec:
            parentRefs:
