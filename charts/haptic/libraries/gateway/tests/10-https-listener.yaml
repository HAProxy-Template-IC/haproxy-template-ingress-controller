  test-backendtlspolicy-invalid-ca-cert-ref-rejects:
    description: "BackendTLSPolicy with caCertificateRefs that don't resolve (no matching ConfigMap or Secret in the cluster) and no wellKnownCACertificates: System fallback marks the targeted backend as broken."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-svc
            namespace: gateway-conformance-infra
          spec:
            ports:
              - port: 443
                targetPort: 8443
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: btls-route
            namespace: gateway-conformance-infra
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-svc
                    port: 443
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata:
            name: btls-policy
            namespace: gateway-conformance-infra
          spec:
            targetRefs:
              - group: ""
                kind: Service
                name: backend-svc
            validation:
              caCertificateRefs:
                - group: ""
                  kind: ConfigMap
                  name: nonexistent-ca-cm
              hostname: backend.example.com
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid when a BackendTLSPolicy points at a missing CA ConfigMap

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 503"
        description: Backend with unresolvable BackendTLSPolicy refuses traffic (5xx)

      - type: not_contains
        target: haproxy.cfg
        pattern: "default-server check ssl ca-file"
        description: No ssl ca-file is emitted when caCertificateRefs failed to resolve

  test-gateway-insecure-frontend-validation-mode-default:
    description: Gateway with spec.tls.frontend.default.mode=AllowInsecureFallback compiles cleanly. The status patch (verified end-to-end by the GatewayInsecureFrontendValidationMode conformance test) appends Insecur...
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-insecure-default
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                tls:
                  mode: Terminate
            tls:
              frontend:
                default:
                  mode: AllowInsecureFallback
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with frontend.default.mode=AllowInsecureFallback

  test-gateway-insecure-frontend-validation-mode-per-port:
    description: "Gateway with spec.tls.frontend.perPort[*].tls.validation.mode=AllowInsecureFallback compiles cleanly (GEP-91 perPort override path)."
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
