              hostname: backend.example.com
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid when a BackendTLSPolicy points at a missing CA ConfigMap

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 503"
        description: Backend with unresolvable BackendTLSPolicy refuses traffic (5xx)

      - type: not_contains
        target: haproxy.cfg
        pattern: "default-server check ssl ca-file"
        description: No ssl ca-file is emitted when caCertificateRefs failed to resolve

  test-gateway-insecure-frontend-validation-mode-default:
    description: |
      Gateway with spec.tls.frontend.default.mode=AllowInsecureFallback
      compiles cleanly. The status patch (verified end-to-end by the
      GatewayInsecureFrontendValidationMode conformance test) appends
      InsecureFrontendValidationMode=True/ConfigurationChanged to the
      gateway's conditions; chart-side we verify the templates don't
      blow up on the GEP-91 spec shape.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-insecure-default
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                tls:
                  mode: Terminate
            tls:
              frontend:
                default:
                  mode: AllowInsecureFallback
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with frontend.default.mode=AllowInsecureFallback

  test-gateway-insecure-frontend-validation-mode-per-port:
