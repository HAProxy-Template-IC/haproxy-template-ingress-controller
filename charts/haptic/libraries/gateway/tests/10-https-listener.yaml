validationTests:
  test-gateway-https-listener-with-invalid-cert-no-bind:
    description: |
      A Gateway HTTPS listener at the chart's default httpsPort with
      a malformed cert (Secret exists but tls.crt isn't valid PEM) is
      skipped by features-100-gateway-tls — the cert never enters
      gf["tlsCertificates"]. With no other resource asking for TLS
      termination, the chart-static `bind *:443 ssl ...` MUST NOT
      render: the operator's intent (this listener is not Accepted)
      should propagate to the bind-port surface so HAProxy doesn't
      answer handshakes with the chart's default cert.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: invalid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: malformed-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: malformed-cert
            namespace: default
          data:
            # Garbage that fails b64decode -> won't reach the PEM check
            tls.crt: bm90LWFjdHVhbGx5LXBlbQ==
            tls.key: bm90LWFjdHVhbGx5LXBlbQ==
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate even with no HTTPS frontend
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend MUST NOT render when no listener has a usable cert
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"
        description: Chart-static `bind *:443 ssl crt-list` MUST be omitted

  test-gateway-https-listener-mtls-unresolved-ca-no-bind:
    description: |
      Closes the GatewayFrontendInvalidDefaultClientCertificateValidation
      conformance gap on the chart side: a Gateway HTTPS listener with
      a valid server cert AND `spec.tls.frontend.default.validation`
      set, but caCertificateRefs that don't resolve to any
      ConfigMap/Secret, MUST NOT bind. Per spec a misconfigured mTLS
      validation makes the listener unusable; HAProxy answering
      handshakes with the chart's default cert (or even with the
      listener's server cert but no client-cert demand) would let
      "anyone" through, defeating the GEP-91 contract.

      The flow:
        1. features-100-gateway-tls — listener's server cert is
           valid PEM, registers fine → tlsCertificates non-empty.
        2. features-110-gateway-frontend-mtls — defaultValidation
           set; caCertificateRefs point at a non-existent
           ConfigMap. resolveValidation returns ("", "") because
           no parts collected. The listener key
           `default/mtls-bad-ca-gw/https` is added to
           gf["mtlsBlockedListeners"].
        3. features-150-gateway-bind — sees the listener in
           mtlsBlocked, skips it. With no other listener at port
           443 contributing, bindHTTPSDefault stays false and
           needHTTPSFrontend stays false. `frontend https` doesn't
           render and `bind *:443 ssl` is omitted.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: server-cert
                  frontendValidation:
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
      secrets:
        # Listener's server cert. Valid PEM so features-100-gateway-tls
        # registers it; the listener's bind would fire if not for the
        # mTLS-blocking layer below.
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: server-cert
            namespace: default
          data:
            tls.crt: 
            tls.key: 
        # NOTE: deliberately no ConfigMap "nonexistent-ca" — that's the
        # whole point of this test.
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend MUST NOT render — the lone listener is mTLS-blocked
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"
        description: |
          Chart-static `bind *:443 ssl crt-list` MUST be omitted —
          HAProxy must not answer TLS handshakes when no listener
          accepts traffic on this port (the conformance contract).

  test-gateway-https-listener-mtls-unresolved-ca-status-conditions:
    description: |
      Status-side companion of test-gateway-https-listener-mtls-
      unresolved-ca-no-bind. The chart-side fix for
      GatewayFrontendInvalidDefaultClientCertificateValidation
      requires BOTH:

        a) The listener's `bind *:443` must be omitted from the
           rendered HAProxy config (the bind-derivation refactor).
        b) The Gateway's `status.listeners[].conditions` must surface
           `ResolvedRefs=False/InvalidCACertificateRef` and
           `Accepted=False/NoValidCACertificate` so the upstream
           conformance test's status poll passes.

      This test pins (b): the JSON-marshalled status patch the chart
      registers via statusPatch() during haproxy.cfg render must
      contain the right reason strings for the listener whose
      caCertificateRefs don't resolve.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: server-cert
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: server-cert
            namespace: default
          data:
            tls.crt: 
            tls.key: 
        # No ConfigMap "nonexistent-ca" — that's the bug shape.
    assertions:
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"InvalidCACertificateRef"'
        description: |
          Listener's ResolvedRefs condition must surface
          InvalidCACertificateRef as the failure reason.
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"NoValidCACertificate"'
        description: |
          Listener's Accepted condition must surface
          NoValidCACertificate so attached routes know the
          listener is unusable.
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"status":"False"'
        description: |
          At least one listener-level condition flipped to
          False (covers both ResolvedRefs and Accepted).
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"name":"https"'
        description: The status entry targets the offending listener by name

  test-gateway-https-listener-with-valid-cert-binds:
    description: |
      The companion test to the invalid-cert case: a Gateway HTTPS
      listener at httpsPort with a resolvable cert sets gf
      ["bindHTTPSDefault"]=true via features-150-gateway-bind, the
      chart-static `bind *:443 ssl crt-list ...` renders normally,
      and `frontend https` exists.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: valid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: valid-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: valid-cert
            namespace: default
          # Inlined PEM blob: same self-signed cert/key the ssl.yaml
          # tests use via the &test_tls_crt anchor. YAML anchors are
          # file-local in the chart's library merge, so duplicating
          # here is the cheapest way to share the data — refactoring
          # to a chart-level constant is a follow-up.
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate
      - type: contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend must render
      - type: contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt-list"
        description: Chart-static `bind *:443 ssl crt-list` must render

  test-gateway-https-misdirected-listener-claim-maps:
    description: HTTPS listener hostnames are emitted as listener-claim maps and the misdirected directive references them
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: catch-all
                port: 443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: with-host
                port: 443
                hostname: second-example.org
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: with-wildcard
                port: 443
                hostname: "*.wildcard.org"
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^second-example\\.org second-example\\.org$"
        description: Exact-hostname HTTPS listener appears in claim map

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\\\\\$ \\*\\.wildcard\\.org$"
        description: Wildcard-hostname HTTPS listener appears as regex entry

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_sni_listener\\) ssl_fc_sni,lower,map\\("
        description: Misdirected directive looks up SNI in claim map

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 421 if .* var\\(txn\\.gw_sni_listener\\),strcmp\\(txn\\.gw_host_listener\\) eq 0"
        description: 421 logic compares SNI vs Host listener identities

  test-gateway-https-misdirected-conformance-shape:
    description: |
      Mirrors the upstream Gateway API
      HTTPRouteHTTPSListenerDetectMisdirectedRequests conformance
      fixture (gateway-api/conformance/base/manifests.yaml's
      `same-namespace-with-https-listener` Gateway). Pins the
      catch-all listener marker — the gap that previously left
      HTTPS-bound requests with SNI pointing at the catch-all
      listener (no listener.hostname) treated as "no listener
      claims this SNI", which blocked the 421 emission for
      misdirected requests originating from the catch-all listener.

      The fixture reproduces the four conformance listeners — the
      no-hostname catch-all, the second-example.org listener, the
      *.wildcard.org listener, and the fourth-example.wildcard.org
      override — so the rendered claim maps + emitted 421 directive
      cover all 15 SNI/Host scenarios the conformance test cycles
      through.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: same-namespace-with-https-listener
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: https-with-hostname
                port: 443
                hostname: second-example.org
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: https-with-wildcard-hostname
                port: 443
                hostname: "*.wildcard.org"
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: https-with-hostname-matching-wildcard
                port: 443
                hostname: fourth-example.wildcard.org
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: gateway-conformance-infra
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^second-example\\.org second-example\\.org$"
        description: Specific-hostname listener emits exact-claim entry

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^fourth-example\\.wildcard\\.org fourth-example\\.wildcard\\.org$"
        description: More-specific-than-wildcard listener emits exact-claim entry

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\\\\\$ \\*\\.wildcard\\.org$"
        description: Wildcard-hostname listener emits regex-claim entry

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\.\\*\\\\\\$ catchall:gateway-conformance-infra/same-namespace-with-https-listener$"
        description: |
          Catch-all (no-hostname) listener emits a `^.*$` regex entry
          with a `catchall:<gw-ns>/<gw-name>` identity. This is the
          fix that closes the conformance gap — without it, requests
          whose SNI matches the catch-all listener get an empty
          listener identity and the 421 gate's `len 0` check blocks
          spec-mandated misdirected emission.

      - type: match_order
        target: map:listener-hostname-claim-regex.map
        patterns:
          - "\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\\\\\$"
          - "\\^\\.\\*\\\\\\$"
        description: |
          More-specific wildcard regex entry must appear BEFORE the
          catch-all `^.*$` entry — `map_reg`'s first-match-wins rule
          requires it. A request like
          SNI=third-example.wildcard.org must land on the
          `*.wildcard.org` listener, not the catch-all.

  test-backendtlspolicy-compiles:
