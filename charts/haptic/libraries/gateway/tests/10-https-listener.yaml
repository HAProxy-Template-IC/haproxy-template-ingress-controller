  test-gateway-backend-client-cert-shape:
    description: |
      Mirrors the upstream Gateway API GatewayBackendClientCertificateFeature
      conformance fixture: a Gateway with HTTP listener (port 80), an
      HTTPRoute pointing at a Service, a BackendTLSPolicy validating
      that Service against a CA, and the Gateway carrying
      `spec.tls.backend.clientCertificateRef` so HAProxy presents a
      client cert when connecting upstream.

      Pins the chart's backend emission so:
        * `ssl ca-file <path> verify required sni str(<host>)
          verifyhost <host>` lands on the backend's `default-server`
          line (BackendTLSPolicy → upstream verify),
        * `crt <client-cert-pem-path>` is appended (Gateway-level
          backend client cert),
        * The Gateway's status carries
          `ResolvedRefs=True/ResolvedRefs` (the conformance test's
          status assertion).
