          kind: Gateway
          metadata:
            name: gateway-tls-backend-client-certificate
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
            tls:
