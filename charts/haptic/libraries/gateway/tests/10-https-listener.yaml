validationTests:
  test-gateway-https-listener-with-invalid-cert-no-bind:
    description: "A Gateway HTTPS listener at the chart's default httpsPort with a malformed cert (Secret exists but tls."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: invalid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: malformed-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: malformed-cert
            namespace: default
          data:
            # Garbage that fails b64decode -> won't reach the PEM check
            tls.crt: bm90LWFjdHVhbGx5LXBlbQ==
            tls.key: bm90LWFjdHVhbGx5LXBlbQ==
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate even with no HTTPS frontend
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend MUST NOT render when no listener has a usable cert
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"
        description: Chart-static `bind *:443 ssl crt-list` MUST be omitted

  test-gateway-https-listener-mtls-unresolved-ca-no-bind:
    description: "Closes the GatewayFrontendInvalidDefaultClientCertificateValidation conformance gap on the chart side: a Gateway HTTPS listener with a valid server cert AND `spec.tls.frontend.default."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: server-cert
                  frontendValidation:
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
      secrets:
        # Listener's server cert. Valid PEM so features-100-gateway-tls
        # registers it; the listener's bind would fire if not for the
        # mTLS-blocking layer below.
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: server-cert
            namespace: default
          data:
            tls.crt: 
            tls.key: 
        # NOTE: deliberately no ConfigMap "nonexistent-ca" — that's the
        # whole point of this test.
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate
      - type: not_contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend MUST NOT render — the lone listener is mTLS-blocked
      - type: not_contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt"
        description: "Chart-static `bind *:443 ssl crt-list` MUST be omitted — HAProxy must not answer TLS handshakes when no listener accepts traffic on this port (the conformance contract)."
  test-gateway-https-listener-mtls-unresolved-ca-status-conditions:
    description: "Status-side companion of test-gateway-https-listener-mtls- unresolved-ca-no-bind. The chart-side fix for GatewayFrontendInvalidDefaultClientCertificateValidation requires BOTH:"
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: mtls-bad-ca-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: server-cert
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs:
                      - group: ""
                        kind: ConfigMap
                        name: nonexistent-ca
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: server-cert
            namespace: default
          data:
            tls.crt: 
            tls.key: 
        # No ConfigMap "nonexistent-ca" — that's the bug shape.
    assertions:
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"InvalidCACertificateRef"'
        description: "Listener's ResolvedRefs condition must surface InvalidCACertificateRef as the failure reason."
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"NoValidCACertificate"'
        description: "Listener's Accepted condition must surface NoValidCACertificate so attached routes know the listener is unusable."
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"status":"False"'
        description: "At least one listener-level condition flipped to False (covers both ResolvedRefs and Accepted)."
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"name":"https"'
        description: The status entry targets the offending listener by name

  test-gateway-https-listener-with-valid-cert-binds:
    description: "The companion test to the invalid-cert case: a Gateway HTTPS listener at httpsPort with a resolvable cert sets gf [\"bindHTTPSDefault\"]=true via features-150-gateway-bind, the chart-static `bind *:443 ssl crt-list ...` renders normally, and `frontend https` exists."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haproxy
          spec:
            controllerName: "haproxy.org/haptic"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: valid-cert-gw
            namespace: default
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: valid-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: valid-cert
            namespace: default
          # Inlined PEM blob: same self-signed cert/key the ssl.yaml
          # tests use via the &test_tls_crt anchor. YAML anchors are
          # file-local in the chart's library merge, so duplicating
          # here is the cheapest way to share the data — refactoring
          # to a chart-level constant is a follow-up.
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must validate
      - type: contains
        target: haproxy.cfg
        pattern: "frontend https"
        description: HTTPS frontend must render
      - type: contains
        target: haproxy.cfg
        pattern: "bind .*:443.*ssl crt-list"
        description: Chart-static `bind *:443 ssl crt-list` must render

  test-gateway-https-misdirected-listener-claim-maps:
    description: HTTPS listener hostnames are emitted as listener-claim maps and the misdirected directive references them
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: catch-all
                port: 443
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: with-host
                port: 443
                hostname: second-example.org
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: with-wildcard
                port: 443
                hostname: "*.wildcard.org"
                protocol: HTTPS
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^second-example\\.org second-example\\.org$"
        description: Exact-hostname HTTPS listener appears in claim map

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\$ \\*\\.wildcard\\.org$"
        description: Wildcard-hostname HTTPS listener appears as regex entry

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_sni_listener\\) ssl_fc_sni,lower,map\\("
        description: Misdirected directive looks up SNI in claim map

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 421 if .* var\\(txn\\.gw_sni_listener\\),strcmp\\(txn\\.gw_host_listener\\) eq 0"
        description: 421 logic compares SNI vs Host listener identities
