                    port: 443
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata:
            name: btls-policy
            namespace: gateway-conformance-infra
          spec:
            targetRefs:
              - group: ""
                kind: Service
                name: backend-svc
            validation:
              caCertificateRefs:
