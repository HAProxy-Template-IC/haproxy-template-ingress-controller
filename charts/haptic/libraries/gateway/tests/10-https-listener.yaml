            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid for backend client-cert + BackendTLSPolicy shape

      - type: contains
        target: haproxy.cfg
        pattern: 'ssl ca-file [^ ]+ verify required sni str\(abc\.example\.com\) verifyhost abc\.example\.com'
        description: |
          Backend default-server line carries the BackendTLSPolicy CA +
          verify required + SNI + verifyhost (the upstream-side TLS).

      - type: contains
        target: haproxy.cfg
        pattern: 'crt [^ ]+gw-clientcert-gateway-conformance-infra-gateway-tls-backend-client-certificate\.pem'
        description: |
          Backend default-server line also carries the Gateway-level
          client cert (`crt /path/to/gw-clientcert-<gw>.pem`) so HAProxy
          presents that cert when connecting upstream — closes the
          GatewayBackendClientCertificateFeature conformance test's
          "configured client certificate should be presented" assertion.

      - type: contains
        target: "status:gateway-conformance-infra/gateway-tls-backend-client-certificate:rendered"
        pattern: '"reason":"ResolvedRefs","status":"True","type":"ResolvedRefs"'
        description: |
          Gateway top-level ResolvedRefs=True/ResolvedRefs (the backend
          clientCertificateRef Secret resolved cleanly).
