      refuse those requests rather than silently downgrading to
      plaintext — pins conformance test
      BackendTLSPolicyInvalidCACertificateRef.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
