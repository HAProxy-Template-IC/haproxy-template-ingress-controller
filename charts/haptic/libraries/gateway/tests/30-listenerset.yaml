        target: map:path-prefix-exact.map
        pattern: "listener-set-listener-allowed-routes-same\\.com/route-in-selected-namespace"
        description: from=Same REJECTS route-in-selected-namespace (different ns)

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "listener-set-listener-allowed-routes-same\\.com/route-not-in-selected-namespace"
        description: from=Same REJECTS route-not-in-selected-namespace (different ns)

      # listener-allowed-routes-selector (from: Selector,
      # matchLabels: allowed=ns) — accepts only the ns labelled
      # `allowed: ns` (gateway-api-routes-allowed-ns).
      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "listener-set-listener-allowed-routes-selector\\.com/route-in-same-namespace"
        description: "from=Selector REJECTS route-in-same-namespace (no `allowed: ns` label on gateway-conformance-infra)"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-listener-allowed-routes-selector\\.com/route-in-selected-namespace GW_ROUTE_ID:http:gateway-api-routes-allowed-ns_route-in-selected-namespace_0$"
        description: from=Selector ACCEPTS route in matching-label namespace

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "listener-set-listener-allowed-routes-selector\\.com/route-not-in-selected-namespace"
        description: from=Selector REJECTS route in non-matching-label namespace

