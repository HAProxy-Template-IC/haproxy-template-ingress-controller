            parentRefs:
              - kind: ListenerSet
                group: gateway.networking.k8s.io
                name: listener-set-http-routing-2
                namespace: gateway-conformance-infra
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /listener-set-http-routing-2-route
                backendRefs:
                  - name: infra-backend-v2
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # attaches-to-all-listeners — should produce 6 path-prefix
      # entries (one per listener hostname).
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-1\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to gateway-listener-1.com

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-2\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to gateway-listener-2.com

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-1\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to LS1-listener-1

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-2\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to LS1-listener-2

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-2-listener-1\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to LS2-listener-1

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-2-listener-2\\.com/route GW_ROUTE_ID:http:gateway-conformance-infra_attaches-to-all-listeners_0$"
        description: attaches-to-all-listeners attaches to LS2-listener-2

      # gateway-route — only attaches to Gateway listeners.
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-1\\.com/gateway-route GW_ROUTE_ID:http:gateway-conformance-infra_gateway-route_0$"
        description: gateway-route attaches to gateway-listener-1

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-2\\.com/gateway-route GW_ROUTE_ID:http:gateway-conformance-infra_gateway-route_0$"
        description: gateway-route attaches to gateway-listener-2

      # gateway-route MUST NOT attach to LS listeners (the
      # conformance test's "Host=listener-set-... Path=/gateway-route
      # → 404" sub-cases depend on this isolation).
      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-.+\\.com/gateway-route GW_ROUTE_ID"
        description: gateway-route does NOT attach to ListenerSet listeners

      # gateway-section-route — only attaches to gateway-listener-1
      # (sectionName-pinned).
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-1\\.com/gateway-section-route GW_ROUTE_ID:http:gateway-conformance-infra_gateway-section-route_0$"
        description: gateway-section-route attaches to gateway-listener-1 only

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-2\\.com/gateway-section-route GW_ROUTE_ID"
        description: gateway-section-route does NOT attach to gateway-listener-2

      # listener-set-http-routing-1-route — both LS1 listeners.
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-1\\.com/listener-set-http-routing-1-route GW_ROUTE_ID:http:gateway-conformance-infra_listener-set-http-routing-1-route_0$"
        description: LS1 route attaches to LS1-listener-1

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-2\\.com/listener-set-http-routing-1-route GW_ROUTE_ID:http:gateway-conformance-infra_listener-set-http-routing-1-route_0$"
        description: LS1 route attaches to LS1-listener-2

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^gateway-listener-.+\\.com/listener-set-http-routing-1-route GW_ROUTE_ID"
        description: LS1 route does NOT attach to Gateway listeners

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-2-listener-.+\\.com/listener-set-http-routing-1-route GW_ROUTE_ID"
        description: LS1 route does NOT cross-attach to LS2

      # listener-set-http-routing-1-section-route — only LS1-listener-1.
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-1\\.com/listener-set-http-routing-1-section-route GW_ROUTE_ID:http:gateway-conformance-infra_listener-set-http-routing-1-section-route_0$"
        description: LS1 section-route attaches to LS1-listener-1 only

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-2\\.com/listener-set-http-routing-1-section-route GW_ROUTE_ID"
        description: LS1 section-route does NOT attach to LS1-listener-2

      # listener-set-http-routing-2-route — both LS2 listeners.
      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-2-listener-1\\.com/listener-set-http-routing-2-route GW_ROUTE_ID:http:gateway-conformance-infra_listener-set-http-routing-2-route_0$"
        description: LS2 route attaches to LS2-listener-1

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-2-listener-2\\.com/listener-set-http-routing-2-route GW_ROUTE_ID:http:gateway-conformance-infra_listener-set-http-routing-2-route_0$"
        description: LS2 route attaches to LS2-listener-2

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^listener-set-http-routing-1-listener-.+\\.com/listener-set-http-routing-2-route GW_ROUTE_ID"
        description: LS2 route does NOT cross-attach to LS1

  test-listenerset-reference-grant-conformance-shape:
    description: |
      Mirrors the upstream Gateway API ListenerSetReferenceGrant
      conformance fixture. A Gateway in `gateway-conformance-infra`
      has `allowedListeners.namespaces.from: All`. Two ListenerSets
      attach via parentRef:

        * `listenerset-with-reference-grant` (same ns as Gateway,
          gateway-conformance-infra). Cross-ns cert ref to
          `gateway-conformance-web-backend` IS covered by the RG
          `reference-grant-for-listener-set` whose `from` clause
          allows `{ListenerSet, gateway-conformance-infra}`.
          Expected: top-level Accepted=True/Accepted, listener-
          level ResolvedRefs=True.

        * `listenerset-without-reference-grant` (different ns,
          gateway-api-listener-sets-test-reference-grant-ns).
          Cross-ns cert ref to `gateway-conformance-web-backend`
          but the RG only allows `{ListenerSet,
          gateway-conformance-infra}` (not the LS's namespace).
          Expected: top-level Accepted=False/ListenersNotValid,
          Programmed=False/ListenersNotValid, listener-level
          ResolvedRefs=False/RefNotPermitted.

      Pins the chart-side fix that folds per-listener cert-ref
      resolution into the top-level decision: a ListenerSet whose
      every listener has unresolvable refs MUST be rejected with
      `ListenersNotValid`, not `Accepted`.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-with-listener-sets-test-reference-grant
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: gateway-listener
                port: 443
                protocol: HTTPS
                hostname: gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: certificate
                      namespace: gateway-conformance-web-backend
            allowedListeners:
              namespaces:
                from: All
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-reference-grant
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listener-sets-test-reference-grant
              namespace: gateway-conformance-infra
            listeners:
              - name: listenerset-with-reference-grant-listener
                port: 443
                protocol: HTTPS
                hostname: listenerset-with-reference-grant-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: certificate
                      namespace: gateway-conformance-web-backend
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-without-reference-grant
            namespace: gateway-api-listener-sets-test-reference-grant-ns
            generation: 1
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listener-sets-test-reference-grant
              namespace: gateway-conformance-infra
            listeners:
              - name: listenerset-without-reference-grant-listener
                port: 443
                protocol: HTTPS
                hostname: listenerset-without-reference-grant-listener-1.com
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: certificate
                      namespace: gateway-conformance-web-backend
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: reference-grant-for-listener-set
            namespace: gateway-conformance-web-backend
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: gateway-conformance-infra
            to:
              - group: ""
                kind: Secret
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: reference-grant-for-gateway
            namespace: gateway-conformance-web-backend
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: Gateway
                namespace: gateway-conformance-infra
            to:
              - group: ""
                kind: Secret
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: certificate
            namespace: gateway-conformance-web-backend
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # listenerset-with-reference-grant: same-ns as Gateway, RG
      # exists for {ListenerSet, gateway-conformance-infra} →
      # cert resolves → all conditions True. Status JSON keys
      # render in alphabetical order (reason, status, type).
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-reference-grant:rendered"
        pattern: '"reason":"Accepted","status":"True","type":"Accepted"'
        description: With-RG listenerset top-level Accepted=True/Accepted

      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-reference-grant:rendered"
        pattern: '"reason":"Programmed","status":"True","type":"Programmed"'
        description: With-RG listenerset top-level Programmed=True/Programmed

      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-reference-grant:rendered"
        pattern: '"reason":"ResolvedRefs","status":"True","type":"ResolvedRefs"'
        description: With-RG listenerset's listener ResolvedRefs=True

      # listenerset-without-reference-grant: in DIFFERENT ns
      # (gateway-api-listener-sets-test-reference-grant-ns), the
      # only RG on the cert's ns is for {ListenerSet,
      # gateway-conformance-infra} — doesn't permit this ns →
      # cert ref is RefNotPermitted, top-level rolls up to
      # ListenersNotValid.
      - type: contains
        target: "status:gateway-api-listener-sets-test-reference-grant-ns/listenerset-without-reference-grant:rendered"
        pattern: '"reason":"ListenersNotValid","status":"False","type":"Accepted"'
        description: Without-RG listenerset top-level Accepted=False/ListenersNotValid

      - type: contains
        target: "status:gateway-api-listener-sets-test-reference-grant-ns/listenerset-without-reference-grant:rendered"
        pattern: '"reason":"ListenersNotValid","status":"False","type":"Programmed"'
        description: Without-RG listenerset top-level Programmed=False/ListenersNotValid

      - type: contains
        target: "status:gateway-api-listener-sets-test-reference-grant-ns/listenerset-without-reference-grant:rendered"
        pattern: '"reason":"RefNotPermitted","status":"False","type":"ResolvedRefs"'
        description: Without-RG listenerset's listener ResolvedRefs=False/RefNotPermitted
