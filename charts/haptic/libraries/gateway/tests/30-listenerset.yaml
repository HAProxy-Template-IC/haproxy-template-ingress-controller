validationTests:
  test-listenerset-default-not-allowed:
    description: "ListenerSet attached to a Gateway without `spec.allowedListeners` must be rejected with Accepted=False/NotAllowed and Programmed=False/NotAllowed (default-deny per Gateway API spec for SupportListenerSet). Pins the ListenerSetDefaultNotAllowed conformance test's status assertions."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-default-deny
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: not-allowed-set
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: gateway-default-deny
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid

      # The status-patches-220-listenerset snippet runs and emits a
      # statusPatch() for the not-allowed ListenerSet. We can't assert
      # on the patch payload directly via testrunner targets, but we
      # can check that the snippet didn't crash the render (covered by
      # haproxy_valid).

  test-listenerset-allowed-same-namespace:
    description: ListenerSet in the same namespace as a Gateway that sets `allowedListeners.namespaces.from=Same` must be Accepted=True/Accepted.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-allow-same
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: allowed-set
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: gateway-allow-same
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid

  test-listenerset-allowed-different-namespace-denied:
    description: "Same=`allowedListeners.namespaces.from=Same` but the ListenerSet lives in a different namespace from the parent Gateway → must be rejected with Accepted=False/NotAllowed."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-allow-same
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: cross-ns-set
            namespace: other
            generation: 1
          spec:
            parentRef:
              name: gateway-allow-same
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid

  test-listenerset-allowed-namespace-selector:
    description: "`allowedListeners.namespaces.from=Selector` admits ListenerSets whose namespace's labels match the selector's matchLabels, denies others."
    fixtures:
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: rg-allow-listenersets
            namespace: default
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-allowed-ns
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-not-allowed-ns
            to:
              - group: gateway.networking.k8s.io
                kind: Gateway
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-allowed-ns
            labels:
              allowed: ns
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-not-allowed-ns
            labels:
              other: label
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-selector
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    allowed: ns
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-permitted
            namespace: selector-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-permitted
                protocol: HTTP
                port: 8082
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-denied
            namespace: selector-not-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-denied
                protocol: HTTP
                port: 8083
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8082'

      - type: not_contains
        target: haproxy.cfg
        pattern: 'bind \*:8083'

  test-listenerset-cross-namespace-parentref-allowed-by-from-all:
    description: ListenerSet in a different namespace from its parent Gateway (with allowedListeners.from=All) is admitted by allowedListeners alone — cross-namespace parentRefs do NOT require a separate ReferenceGran...
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-allow-all
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-cross-ns
            namespace: tenant-a
            generation: 1
          spec:
            parentRef:
              name: gw-allow-all
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8090
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8090'

  test-listenerset-cross-namespace-parentref-with-grant:
    description: ListenerSet in a different namespace from its parent Gateway (with allowedListeners.from=All) is admitted regardless of ReferenceGrant presence — the cross-ns parentRef is permitted by allowedListener...
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-allow-all
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-cross-ns-with-grant
            namespace: tenant-a
            generation: 1
          spec:
            parentRef:
              name: gw-allow-all
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8091
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: rg-allow-ls
            namespace: default
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: tenant-a
            to:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: gw-allow-all
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8091'

  test-listenerset-listener-multi-port-bind:
    description: "Multi-port HTTP bind must include ports declared on accepted ListenerSet listeners (in addition to the Gateway's own listeners). Pins the routing-layer side of F2 listener-merge integration."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: multi-port-with-ls
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-listener
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: extra-ports-ls
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: multi-port-with-ls
            listeners:
              - name: extra-1
                protocol: HTTP
                port: 8085
              - name: extra-2
                protocol: HTTP
                port: 8086
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:80\b'

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8085\b'

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8086\b'

  test-listenerset-hostname-conflict:
    description: "Two listeners on the same (port, hostname) where one is on the Gateway and one is on a ListenerSet. Gateway wins the conflict (precedence: Gateway > earlier LS > later LS, then index), so the LS's con..."
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-with-conflict
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-listener
                protocol: HTTPS
                port: 443
                hostname: shared.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-conflicting
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-02T00:00:00Z"
          spec:
            parentRef:
              name: gw-with-conflict
            listeners:
              - name: ls-good
                protocol: HTTPS
                port: 443
                hostname: ls-only.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: ls-conflicts-with-gw
                protocol: HTTPS
                port: 443
                hostname: shared.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: '(?m)^shared\.example\.com shared\.example\.com$'

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: '(?m)^ls-only\.example\.com ls-only\.example\.com$'

  test-listenerset-protocol-conflict:
    description: "Two listeners on the same port but different protocols → the later one (LS) loses to the earlier one (Gateway). The conflicting LS listener doesn't bind. Pins ListenerSetProtocolConflict status assertion."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-protocol-host
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-http-80
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-protocol-conflict
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-02T00:00:00Z"
          spec:
            parentRef:
              name: gw-protocol-host
            listeners:
              - name: ls-tcp-80
                protocol: TCP
                port: 80
              - name: ls-good-http-9000
                protocol: HTTP
                port: 9000
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:9000\b'

  test-listenerset-allowed-routes-supported-kinds:
    description: "ListenerSet listener with `allowedRoutes.kinds: [HTTPRoute]` on a TLS-protocol listener must report `supportedKinds: []` and `ResolvedRefs=False/InvalidRouteKinds` — HTTPRoute is not in the chart's TLS-protocol default route-kinds set ([TLSRoute]), so the requested kind doesn't intersect. Mirrors the upstream ListenerSetAllowedRoutesSupportedKinds conformance fixture (gateway-with-listener-sets-test-supported-route-kinds Gateway + listenerset-test-allowed-routes-supported-kinds ListenerSet)."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-with-listener-sets-test-supported-route-kinds
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: gateway-listener
                protocol: HTTP
                port: 80
                hostname: gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-test-allowed-routes-supported-kinds
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            parentRef:
              name: gateway-with-listener-sets-test-supported-route-kinds
            listeners:
              - name: listener-set-listener-allowed-routes-tls-only
                protocol: TLS
                port: 443
                hostname: listener-set-listener-allowed-routes-tls-only.com
                allowedRoutes:
                  namespaces:
                    from: All
                  kinds:
                    - kind: HTTPRoute
                tls:
                  mode: Passthrough
    assertions:
      - type: contains
        target: "status:default/listenerset-test-allowed-routes-supported-kinds:rendered"
        pattern: '"name":"listener-set-listener-allowed-routes-tls-only","supportedKinds":\[\]'
      - type: contains
        target: "status:default/listenerset-test-allowed-routes-supported-kinds:rendered"
        pattern: '"reason":"InvalidRouteKinds"'
      - type: not_contains
        target: "status:default/listenerset-test-allowed-routes-supported-kinds:rendered"
        pattern: '"name":"listener-set-listener-allowed-routes-tls-only"[^}]*"TLSRoute"'
  test-listenerset-rendered-variant-includes-programmed-observed-generation:
    description: "The ListenerSet CRD defaults `status.conditions` to include both Accepted and Programmed entries with `observedGeneration` unset (so it serialises as 0). If the chart's rendered-variant patch only writes Accepted, the API-server-defaulted Programmed entry sticks around with observedGeneration=0 until the deployed-variant patch lands after the data plane reload. The Gateway-API conformance helper `ListenerSetListenersMustHaveConditions` fast-fails (`return false, err`) the first time it observes any top-level condition whose observedGeneration is behind the LS's metadata.generation — so a poll between the rendered and deployed applies sees Programmed (generation 0) and fails the test immediately. The rendered variant must therefore emit lsProgrammedCond too, so the very first apply bumps Programmed's observedGeneration to the current generation. Pinned by the upstream ListenerSetAllowedRoutesNamespaces conformance test — this fixture mirrors the LS shape that test creates so the patch payload is asserted directly here without waiting on a kind run."
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-rendered-variant-programmed-observed-gen
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: gateway-listener
                protocol: HTTP
                port: 80
                hostname: gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-rendered-variant-programmed-observed-gen
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: gateway-rendered-variant-programmed-observed-gen
            listeners:
              - name: listener
                protocol: HTTP
                port: 8081
                hostname: ls.example.com
                allowedRoutes:
                  namespaces:
                    from: All
    assertions:
      # Condition objects serialise with alphabetically-ordered keys
      # (Go map JSON), so observedGeneration always appears before type
      # within the same {...} entry. Match a whole condition entry to
      # bind both keys to the same object.
      - type: contains
        target: "status:default/ls-rendered-variant-programmed-observed-gen:rendered"
        pattern: '\{[^}]*"observedGeneration":1[^}]*"type":"Programmed"[^}]*\}'
      - type: contains
        target: "status:default/ls-rendered-variant-programmed-observed-gen:rendered"
        pattern: '\{[^}]*"observedGeneration":1[^}]*"type":"Accepted"[^}]*\}'

      - type: contains
        target: "status:default/ls-rendered-variant-programmed-observed-gen:deployed"
        pattern: '\{[^}]*"observedGeneration":1[^}]*"type":"Programmed"[^}]*\}'
