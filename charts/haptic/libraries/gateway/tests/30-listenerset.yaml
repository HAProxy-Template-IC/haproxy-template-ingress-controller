validationTests:
  test-listenerset-default-not-allowed:
    description: |
      ListenerSet attached to a Gateway without `spec.allowedListeners`
      must be rejected with Accepted=False/NotAllowed and
      Programmed=False/NotAllowed (default-deny per Gateway API spec
      for SupportListenerSet). Pins the
      ListenerSetDefaultNotAllowed conformance test's status assertions.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-default-deny
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: not-allowed-set
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: gateway-default-deny
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # The status-patches-220-listenerset snippet runs and emits a
      # statusPatch() for the not-allowed ListenerSet. We can't assert
      # on the patch payload directly via testrunner targets, but we
      # can check that the snippet didn't crash the render (covered by
      # haproxy_valid).

  test-listenerset-allowed-same-namespace:
    description: |
      ListenerSet in the same namespace as a Gateway that sets
      `allowedListeners.namespaces.from=Same` must be Accepted=True/Accepted.
      Programmed remains False/Pending until F2 (listener-merge) lands —
      the chart honestly surfaces partial implementation rather than
      claiming Programmed=True without actual data-plane wiring.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-allow-same
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: allowed-set
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: gateway-allow-same
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

  test-listenerset-allowed-different-namespace-denied:
    description: |
      Same=`allowedListeners.namespaces.from=Same` but the ListenerSet
      lives in a different namespace from the parent Gateway → must be
      rejected with Accepted=False/NotAllowed.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-allow-same
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: cross-ns-set
            namespace: other
            generation: 1
          spec:
            parentRef:
              name: gateway-allow-same
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8081
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

  test-listenerset-allowed-namespace-selector:
    description: |
      `allowedListeners.namespaces.from=Selector` admits ListenerSets
      whose namespace's labels match the selector's matchLabels, denies
      others. Pins the ListenerSetAllowedNamespaceSelector conformance
      test status assertion. Includes a ReferenceGrant in the Gateway's
      namespace covering both candidate ListenerSet namespaces — RG
      matching is independent of the Selector gate, so a permitted
      ListenerSet still needs an RG to attach cross-namespace.
    fixtures:
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: rg-allow-listenersets
            namespace: default
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-allowed-ns
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-not-allowed-ns
            to:
              - group: gateway.networking.k8s.io
                kind: Gateway
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-allowed-ns
            labels:
              allowed: ns
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-not-allowed-ns
            labels:
              other: label
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-selector
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    allowed: ns
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-permitted
            namespace: selector-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-permitted
                protocol: HTTP
                port: 8082
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-denied
            namespace: selector-not-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-denied
                protocol: HTTP
                port: 8083
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8082'
        description: Permitted ListenerSet's port must be bound

      - type: not_contains
        target: haproxy.cfg
        pattern: 'bind \*:8083'
        description: Denied ListenerSet's port must NOT be bound

  test-listenerset-cross-namespace-parentref-allowed-by-from-all:
    description: |
      ListenerSet in a different namespace from its parent Gateway
      (with allowedListeners.from=All) is admitted by allowedListeners
      alone — cross-namespace parentRefs do NOT require a separate
      ReferenceGrant per Gateway API conformance
      (ListenerSetReferenceGrant + ListenerSetAllowedNamespaceSelector).
      ReferenceGrant only gates resource references (Secret, ConfigMap)
      attached to listeners, not parentRefs.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-allow-all
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-cross-ns
            namespace: tenant-a
            generation: 1
          spec:
            parentRef:
              name: gw-allow-all
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8090
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8090'
        description: Cross-ns ListenerSet permitted by allowedListeners.from=All must be bound

  test-listenerset-cross-namespace-parentref-with-grant:
    description: |
      ListenerSet in a different namespace from its parent Gateway
      (with allowedListeners.from=All) is admitted regardless of
      ReferenceGrant presence — the cross-ns parentRef is permitted
      by allowedListeners alone. This test pins behaviour with an
      RG present (RG should be a no-op for parentRef admission).
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-allow-all
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-cross-ns-with-grant
            namespace: tenant-a
            generation: 1
          spec:
            parentRef:
              name: gw-allow-all
              namespace: default
            listeners:
              - name: extra
                protocol: HTTP
                port: 8091
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: rg-allow-ls
            namespace: default
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: tenant-a
            to:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: gw-allow-all
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8091'
        description: Cross-ns ListenerSet WITH RG must be bound

  test-listenerset-listener-multi-port-bind:
    description: |
      Multi-port HTTP bind must include ports declared on accepted
      ListenerSet listeners (in addition to the Gateway's own listeners).
      Pins the routing-layer side of F2 listener-merge integration.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: multi-port-with-ls
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-listener
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: extra-ports-ls
            namespace: default
            generation: 1
          spec:
            parentRef:
              name: multi-port-with-ls
            listeners:
              - name: extra-1
                protocol: HTTP
                port: 8085
              - name: extra-2
                protocol: HTTP
                port: 8086
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:80\b'
        description: Gateway's HTTP listener must be bound on port 80

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8085\b'
        description: Accepted ListenerSet listener must be bound on port 8085

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8086\b'
        description: Accepted ListenerSet listener must be bound on port 8086

  test-listenerset-hostname-conflict:
    description: |
      Two listeners on the same (port, hostname) where one is on the
      Gateway and one is on a ListenerSet. Gateway wins the conflict
      (precedence: Gateway > earlier LS > later LS, then index), so the
      LS's conflicting listener is dropped from the routing set. Uses
      HTTPS so the listener-hostname-claim map (only emitted for HTTPS/
      TLS listeners) shows the surviving claims. Pins
      ListenerSetHostnameConflict status assertion.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-with-conflict
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-listener
                protocol: HTTPS
                port: 443
                hostname: shared.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-conflicting
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-02T00:00:00Z"
          spec:
            parentRef:
              name: gw-with-conflict
            listeners:
              - name: ls-good
                protocol: HTTPS
                port: 443
                hostname: ls-only.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: ls-conflicts-with-gw
                protocol: HTTPS
                port: 443
                hostname: shared.example.com
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: '(?m)^shared\.example\.com shared\.example\.com$'
        description: Gateway-owned hostname claim must be present (Gateway wins)

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: '(?m)^ls-only\.example\.com ls-only\.example\.com$'
        description: Non-conflicting LS listener's hostname claim must be present

  test-listenerset-protocol-conflict:
    description: |
      Two listeners on the same port but different protocols → the later
      one (LS) loses to the earlier one (Gateway). The conflicting LS
      listener doesn't bind. Pins ListenerSetProtocolConflict status
      assertion.
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-protocol-host
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Same
            listeners:
              - name: gw-http-80
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-protocol-conflict
            namespace: default
            generation: 1
            creationTimestamp: "2024-01-02T00:00:00Z"
          spec:
            parentRef:
              name: gw-protocol-host
            listeners:
              - name: ls-tcp-80
                protocol: TCP
                port: 80
              - name: ls-good-http-9000
                protocol: HTTP
                port: 9000
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:9000\b'
        description: Non-conflicting LS HTTP listener at port 9000 must be bound

  test-listenerset-hostname-conflict-conformance-shape:
    description: |
      Mirrors the upstream Gateway API ListenerSetHostnameConflict
      conformance fixture: a Gateway with two listeners + four
      ListenerSets with a mix of conflicting and non-conflicting
      listeners. Per Gateway API listener precedence:

        * Gateway listeners win over ListenerSet listeners.
        * Within ListenerSets, earlier creationTimestamp wins.
        * On a conflict, the loser gets
          Accepted=False/HostnameConflict +
          Programmed=False/HostnameConflict +
          Conflicted=True/HostnameConflict.
        * A ListenerSet whose every listener loses a conflict (or
          fails ref resolution) rolls up to top-level
          Accepted=False/ListenersNotValid.

      Pins the chart's util-effective-listeners conflict-detection
      pass + status-patches-220-listenerset's emission of the
      derived per-listener and top-level conditions.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-with-listenerset-hostname-conflict
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: gateway-listener
                port: 80
                protocol: HTTP
                hostname: gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
              # Listener precedence: Gateway listeners win over
              # ListenerSet listeners on the same hostname+port.
              - name: hostname-conflict-with-gateway-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
            allowedListeners:
              namespaces:
                from: Same
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-conformance-infra
      listenersets:
        # LS1 — earliest creationTimestamp. 3 listeners; the
        # `hostname-conflict-with-gateway-listener` one CONFLICTS with
        # the Gateway's listener of the same hostname.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-hostname-conflict-with-gateway-1
            namespace: gateway-conformance-infra
            creationTimestamp: "2026-05-09T07:00:00Z"
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listenerset-hostname-conflict
              namespace: gateway-conformance-infra
            listeners:
              - name: listener-set-1-listener
                port: 80
                protocol: HTTP
                hostname: listener-set-1-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
              - name: hostname-conflict-with-gateway-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
              - name: hostname-conflict-with-listener-set-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-listener-set-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
        # LS2 — only listener conflicts with the Gateway → fully rejected.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-hostname-conflict-with-gateway-2
            namespace: gateway-conformance-infra
            creationTimestamp: "2026-05-09T07:01:00Z"
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listenerset-hostname-conflict
              namespace: gateway-conformance-infra
            listeners:
              - name: hostname-conflict-with-gateway-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
        # LS3 — `hostname-conflict-with-listener-set-listener` CONFLICTS
        # with LS1's listener of the same hostname (LS1 is earlier).
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-hostname-conflict-with-listener-set-1
            namespace: gateway-conformance-infra
            creationTimestamp: "2026-05-09T07:02:00Z"
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listenerset-hostname-conflict
              namespace: gateway-conformance-infra
            listeners:
              - name: listener-set-2-listener
                port: 80
                protocol: HTTP
                hostname: listener-set-2-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
              - name: hostname-conflict-with-listener-set-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-listener-set-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
        # LS4 — only listener conflicts with LS1 → fully rejected.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-hostname-conflict-with-listener-set-2
            namespace: gateway-conformance-infra
            creationTimestamp: "2026-05-09T07:03:00Z"
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listenerset-hostname-conflict
              namespace: gateway-conformance-infra
            listeners:
              - name: hostname-conflict-with-listener-set-listener
                port: 80
                protocol: HTTP
                hostname: hostname-conflict-with-listener-set-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      # LS1: top-level Accepted=True (has at least one valid listener).
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-gateway-1:rendered"
        pattern: '"reason":"Accepted","status":"True","type":"Accepted"'
        description: LS1 (mixed-conflict) top-level Accepted=True/Accepted

      # LS1's `hostname-conflict-with-gateway-listener` listener is
      # the conflict loser → Conflicted=True/HostnameConflict.
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-gateway-1:rendered"
        pattern: '"reason":"HostnameConflict","status":"True","type":"Conflicted"'
        description: LS1's conflicting listener gets Conflicted=True/HostnameConflict

      # LS2: only-listener conflicts → top-level
      # Accepted=False/ListenersNotValid.
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-gateway-2:rendered"
        pattern: '"reason":"ListenersNotValid","status":"False","type":"Accepted"'
        description: LS2 (all-conflicting) top-level Accepted=False/ListenersNotValid

      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-gateway-2:rendered"
        pattern: '"reason":"ListenersNotValid","status":"False","type":"Programmed"'
        description: LS2 top-level Programmed=False/ListenersNotValid

      # LS3: top-level Accepted=True (listener-set-2-listener is valid).
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-listener-set-1:rendered"
        pattern: '"reason":"Accepted","status":"True","type":"Accepted"'
        description: LS3 (mixed-conflict, vs LS1) top-level Accepted=True

      # LS4: only-listener conflicts → top-level Accepted=False/ListenersNotValid.
      - type: contains
        target: "status:gateway-conformance-infra/listenerset-with-hostname-conflict-with-listener-set-2:rendered"
        pattern: '"reason":"ListenersNotValid","status":"False","type":"Accepted"'
        description: LS4 (all-conflicting, vs LS1) top-level Accepted=False/ListenersNotValid

  test-listenerset-protocol-conflict-conformance-shape:
    description: |
      Mirrors the upstream Gateway API ListenerSetProtocolConflict
      conformance fixture: a Gateway with two listeners (HTTP on
      port 80) + two ListenerSets where each carries a TCP listener
      on port 80. Per Gateway API listener precedence, the Gateway's
      protocol claim on the port wins; later TCP listeners on the
      same port get Conflicted=True/ProtocolConflict.

      Pins the chart's util-effective-listeners conflict-detection
      pass + status-patches-220-listenerset's emission of the
      derived per-listener and top-level conditions for the
      Protocol-flavoured conflict path. Hostname is unset for the
      losing listeners because TCP listeners don't carry hostnames;
      precedence is decided on protocol mismatch alone.
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-with-listenerset-protocol-conflict
            namespace: gateway-conformance-infra
          spec:
            gatewayClassName: haptic
            listeners:
              - name: gateway-listener
                port: 80
                protocol: HTTP
                hostname: gateway-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
            allowedListeners:
              namespaces:
                from: Same
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-conformance-infra
      listenersets:
        # LS1 — earliest. 2 listeners; the TCP one CONFLICTS with the
        # Gateway's HTTP listener on port 80.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-protocol-conflict-with-gateway-1
            namespace: gateway-conformance-infra
            creationTimestamp: "2026-05-09T07:10:00Z"
          spec:
            parentRef:
              kind: Gateway
              group: gateway.networking.k8s.io
              name: gateway-with-listenerset-protocol-conflict
              namespace: gateway-conformance-infra
            listeners:
              - name: listener-set-1-listener
                port: 80
                protocol: HTTP
                hostname: listener-set-1-listener.com
                allowedRoutes:
                  namespaces:
                    from: All
              - name: protocol-conflict-with-gateway-listener
                port: 80
                protocol: TCP
                allowedRoutes:
                  namespaces:
                    from: All
        # LS2 — only listener (TCP on port 80) conflicts with the
        # Gateway's HTTP listener → fully rejected.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: listenerset-with-protocol-conflict-with-gateway-2
