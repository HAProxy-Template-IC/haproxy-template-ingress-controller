validationTests:
  test-grpcroute-h2c-on-port-80:
    description: "Pins the chart's plaintext h2c multiplexing on port 80: the new tcp inspector + dual-loopback architecture (libraries/base."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: GRPCRoute
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-svc
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: grpc-h2c
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.API
                      method: Echo
                backendRefs:
                  - name: grpc-svc
                    port: 9090
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http-tcp$'
        description: "Outer tcp inspector frontend exists."
      - type: contains
        target: haproxy.cfg
        pattern: 'acl is_h2c req\.payload\(0,24\) -m bin 505249202a20485454502f322e300d0a0d0a534d0d0a0d0a'
        description: "h2c preface byte-match ACL renders with the exact 24-byte hex of `PRI * HTTP/2.0\\\\r\\\\n\\\\r\\\\nSM\\\\r\\\\n\\\\r\\\\n`."
      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend http-h2c-loopback if is_h2c'
        description: "h2c-detected connections route to the h2c loopback backend."
      - type: contains
        target: haproxy.cfg
        pattern: 'default_backend http-h1-loopback'
        description: "Non-h2c connections fall through to the h1 loopback backend."
      - type: contains
        target: haproxy.cfg
        pattern: 'server loopback unix@/etc/haproxy/http-h1-frontend\.sock send-proxy-v2'
        description: "h1 loopback backend forwards to the unix socket with PROXY protocol v2 (preserves client IP)."
      - type: contains
        target: haproxy.cfg
        pattern: 'server loopback unix@/etc/haproxy/http-h2c-frontend\.sock send-proxy-v2'
        description: "h2c loopback backend forwards to its own unix socket, also with send-proxy-v2."
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend$'
        description: "Inner h1 frontend renders (mode http) — keeps the `http_frontend` name to preserve back-compat with existing chart tests asserting on `guid fe:http_frontend`."
      - type: contains
        target: haproxy.cfg
        pattern: 'bind unix@/etc/haproxy/http-h1-frontend\.sock mode 660 accept-proxy'
        description: "h1 inner frontend binds the unix socket with accept-proxy (parses the PROXY v2 header sent by the loopback backend)."
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend_h2c$'
        description: "New h2c inner frontend exists."
      - type: contains
        target: haproxy.cfg
        pattern: 'bind unix@/etc/haproxy/http-h2c-frontend\.sock mode 660 accept-proxy proto h2'
        description: "h2c inner frontend's bind carries `proto h2` so HAProxy parses the connection as HTTP/2 cleartext (the outer inspector has already verified the preface; `proto h2` here is required because plaintext h2c has no in-band protocol negotiation)."
      - type: contains
        target: haproxy.cfg
        pattern: 'backend gtw_default_grpc-h2c_grpc-svc_9090'
        description: "GRPCRoute backend exists with the conventional name shape."
      - type: contains
        target: haproxy.cfg
        pattern: 'default-server check proto h2'
        description: "GRPCRoute backend's default-server line emits `proto h2` so the upstream connection speaks HTTP/2 — chart's existing contract, asserted here for completeness."
  test-grpcroute-https-listener-alpn-h2:
    description: "Pins the chart's gRPC-over-TLS+ALPN-h2 emission contract for the production-relevant scenario where a Gateway has an HTTPS listener + GRPCRoute (the upstream conformance suite tests the plaintext h2c ."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                hostname: grpc.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: GRPCRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - group: ""
                      kind: Secret
                      name: grpc-tls-cert
                      namespace: default
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: grpc-tls-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-svc
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
            name: grpc-https
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method:
                      type: Exact
                      service: com.example.API
                      method: Echo
                backendRefs:
                  - name: grpc-svc
                    port: 9090
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:443 ssl crt-list [^ ]+ alpn h2,http/1\.1'
        description: "HTTPS listener bind on port 443 carries `alpn h2,http/1.1` so gRPC clients negotiate h2 over TLS."
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^backend gtw_default_grpc-https_grpc-svc_9090'
        description: GRPCRoute backend exists with the expected name shape.

      - type: contains
        target: haproxy.cfg
        pattern: 'default-server check proto h2'
        description: "GRPCRoute backend's `default-server` line emits `proto h2` so the upstream connection speaks h2 (gRPC requires HTTP/2)."
      - type: contains
        target: map:host.map
        pattern: '(?m)^grpc\.example\.com\b'
        description: "Host map carries an entry for the GRPCRoute's hostname (gRPC clients send it as `:authority` / SNI on TLS, and the host map drives the txn.host normalization that downstream method-matching keys off)."
