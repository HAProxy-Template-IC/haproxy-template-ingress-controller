validationTests:
  test-gateway-multi-port-listener-bind:
    description: Gateway with listeners on extra HTTP ports emits additional bind directives
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: multi-port-gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-80
                port: 80
                protocol: HTTP
              - name: l-8080
                port: 8080
                protocol: HTTP
              - name: l-8090
                port: 8090
                protocol: HTTP
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:80$"
        description: Must emit bind on port 80

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:8090$"
        description: Must emit bind on port 8090

  test-gateway-https-multi-port-listener-bind:
    description: |
      Gateway with HTTPS listeners on non-default ports emits additional
      `bind *:<port> ssl crt-list ...` directives in the https frontend.
      Verifies the https-bind-extra-* extension point: gateway.yaml's
      https-bind-extra-050-gateway-multi-port-bind hooks into ssl.yaml's
      https frontend and emits one TLS bind per unique non-default
      Gateway HTTPS listener port. Skips the chart-static https port
      (443) and the chart-static http port (default 80) so duplicate
      binds across frontends don't break HAProxy startup.
    fixtures:
      secrets:
        # Listener cert. Same namespace as the Gateway (default) so we
        # don't need a ReferenceGrant — the cert-resolvability check
        # in features-150-gateway-bind only counts certs registered
        # by features-100-gateway-tls, and that path skips
        # cross-namespace refs without a matching ReferenceGrant.
        - apiVersion: v1
          kind: Secret
          metadata:
            name: default-ssl-cert
            namespace: default
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: haptic
          spec:
            controllerName: haproxy.org/haptic
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: tls-gw
            namespace: default
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-https-default
                port: 443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  # Listeners need certificateRefs for the bind-decision
                  # cert-resolvability check (features-150-gateway-bind)
                  # to greenlight the frontend rendering. Without a
                  # registered cert the listener is treated as
                  # unresolvable and dropped — same path
                  # GatewayFrontendInvalidDefaultClientCertificateValidation
                  # exercises with NoValidCACertificate.
                  certificateRefs:
                    - kind: Secret
                      name: default-ssl-cert
              - name: l-https-8443
                port: 8443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: default-ssl-cert
              - name: l-https-9443
                port: 9443
                protocol: HTTPS
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: default-ssl-cert
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:8443 ssl crt-list .*alpn h2,http/1\\.1"
        description: Must emit additional TLS bind on port 8443 with chart-static SSL options

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:9443 ssl crt-list .*alpn h2,http/1\\.1"
        description: Must emit additional TLS bind on port 9443

      - type: not_contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*bind \\*:443 ssl crt-list .*\\n\\s*bind \\*:443 ssl crt-list"
        description: |
          Must NOT emit a duplicate TLS bind on the chart-static HTTPS
          port — chart-static already binds 443, so the bind-extra
          snippet skips httpsPort to avoid HAProxy parser error.
