templateSnippets:
  util-backend-name-gateway:
    template: |
      {#- Macro to generate gateway backend name from route and backend info #}
      {%- macro BackendNameGateway(route any, backend any) string -%}
      gtw_{{ route | dig("metadata", "namespace") | fallback("") }}_{{ route | dig("metadata", "name") | fallback("") }}_{{ backend | dig("name") | fallback("") }}_{{ backend | dig("port") | fallback("") }}
      {%- end macro -%}

  util-resource-helpers:
    template: |
      {#-
        Resource metadata & key-building helpers.

        Scriggo macros are text-typed, so every helper returns a string.
        For numeric fields (listener.port) callers still wrap with toint().

        Usage:
          {%- import "util-resource-helpers" for
                ResourceNamespace, ResourceName,
                GatewayKey, ListenerKey,
                ListenerProtocol, ListenerName, ListenerHostname,
                ResolveCertRefKey -%}
          var gwNs    = ResourceNamespace(gw)
          var gwName  = ResourceName(gw)
          var gwKey   = GatewayKey(gwNs, gwName)
          var lProto  = ListenerProtocol(listener)
          var lName   = ListenerName(listener)
          var lHost   = ListenerHostname(listener)
          var listKey = ListenerKey(gwNs, gwName, lName)
          var certKey = ResolveCertRefKey(listener, gwNs)  // "" if no certRefs
      -#}
      {%- macro ResourceNamespace(r any) string -%}
      {{- dig(r, "metadata", "namespace") | fallback("") -}}
      {%- end macro -%}

      {%- macro ResourceName(r any) string -%}
      {{- dig(r, "metadata", "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro GatewayKey(ns string, name string) string -%}
      {{- ns -}}/{{- name -}}
      {%- end macro -%}

      {%- macro ListenerKey(gwNs string, gwName string, listenerName string) string -%}
      {{- gwNs -}}/{{- gwName -}}/{{- listenerName -}}
      {%- end macro -%}

      {%- macro ListenerProtocol(listener any) string -%}
      {{- dig(listener, "protocol") | fallback("") -}}
      {%- end macro -%}

      {#- ListenerProtocolOr — like ListenerProtocol but with a caller-supplied
          fallback for listeners that omit `protocol`. Use "HTTP" when the
          enclosing logic treats a missing protocol as HTTP (matches the
          Gateway API default), "" when missing should be distinguished from
          any concrete value. -#}
      {%- macro ListenerProtocolOr(listener any, defaultProto string) string -%}
      {{- dig(listener, "protocol") | fallback(defaultProto) -}}
      {%- end macro -%}

      {%- macro ListenerName(listener any) string -%}
      {{- dig(listener, "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro ListenerHostname(listener any) string -%}
      {{- dig(listener, "hostname") | fallback("") -}}
      {%- end macro -%}

      {#- ResolveCertRefKey — extract the first cert ref as "<crNs>/<crName>".
          Returns "" when the listener has no tls.certificateRefs. Caller
          decides whether to look the key up in the shared certBySecret cache
          and what to do on a miss. -#}
      {%- macro ResolveCertRefKey(listener any, defaultNs string) string -%}
      {%- var certRefs = dig(listener, "tls", "certificateRefs") | toSlice() -%}
      {%- if len(certRefs) > 0 -%}
        {%- var cr = certRefs[0] -%}
        {%- var crNs = tostring(dig(cr, "namespace") | fallback(defaultNs)) -%}
        {%- var crName = tostring(dig(cr, "name") | fallback("")) -%}
        {{- crNs -}}/{{- crName -}}
      {%- end -%}
      {%- end macro -%}

  util-route-condition:
    template: |
      {#-
        RouteIdCondition - Generates HAProxy condition to match a Gateway route by ID.

        This is the standard pattern for filter processing: check if txn.gw_rule_id
        matches the specific routeId set by the advanced matchers.

        Usage:
          {%- import "util-route-condition" for RouteIdCondition -%}
          http-request set-header X-Custom 'value' if {{ RouteIdCondition(routeInfo | dig("routeId")) }}
      -#}
      {%- macro RouteIdCondition(routeId string) string -%}
      { var(txn.gw_rule_id) -m str "{{ routeId }}" }
      {%- end macro -%}

  util-bounded-k8s-name:
    template: |
      {#-
        BoundedK8sName - Build a Kubernetes object name that fits inside the
        RFC 1123 label limit (63 chars).

        Format: <prefix>-<ns>-<name>[-<suffix>]

        If the joined string is <=63 chars, it is returned verbatim.
        Otherwise the <ns>-<name> middle is truncated to make room for an
        8-char SHA-256 fingerprint of <ns>/<name>[/<suffix>] so distinct
        inputs that collide after truncation still produce distinct names.

        Used by the Gateway library to emit per-Gateway Services (marker for
        spec.infrastructure metadata propagation; static-address LoadBalancer
        Services for spec.addresses) whose natural names would exceed the
        63-char Service-name limit when fed long Gateway / namespace strings
        (the conformance suite's `gateway-with-infrastructure-metadata` in
        `gateway-conformance-infra` is 65 chars before any IP suffix).

        Usage:
          {%- import "util-bounded-k8s-name" for BoundedK8sName -%}
          var svcName = BoundedK8sName("gw", nsStr, nameStr, "")
      -#}
      {%- macro BoundedK8sName(prefix string, ns string, name string, suffix string) string -%}
      {%- var middle = ns + "-" + name -%}
      {%- var joined = prefix + "-" + middle -%}
      {%- if suffix != "" -%}{%- joined = joined + "-" + suffix -%}{%- end -%}
      {%- if len(joined) <= 63 -%}
      {{- joined -}}
      {%- else -%}
      {%- var hashKey = ns + "/" + name -%}
      {%- if suffix != "" -%}{%- hashKey = hashKey + "/" + suffix -%}{%- end -%}
      {%- var hashTag = sha256(hashKey)[0:8] -%}
      {%- var tail = "-" + hashTag -%}
      {%- if suffix != "" -%}{%- tail = tail + "-" + suffix -%}{%- end -%}
      {%- var room = 63 - len(prefix) - 1 - len(tail) -%}
      {%- if room < 1 -%}{%- room = 1 -%}{%- end -%}
      {%- if len(middle) > room -%}{%- middle = middle[0:room] -%}{%- end -%}
      {{- prefix + "-" + middle + tail -}}
      {%- end -%}
      {%- end macro -%}

  util-condition-transition-time:
    template: |
      {#-
        Gateway-API-shaped wrappers around the resource-agnostic
        `transitionTime(existingConditions, type, status)` helper. These
        macros encode the Gateway-API spec's structure for where conditions
        live (.status.conditions for Gateway/GatewayClass top-level,
        .status.listeners[byName].conditions for Gateway listeners,
        .status.parents[byIdx].conditions for HTTPRoute/GRPCRoute parents);
        the Go-side filter knows nothing about these paths and just
        compares the supplied conditions list to the proposed status,
        keeping the templating layer resource-agnostic.

        Why these macros exist at all: re-stamping lastTransitionTime on
        every render is a metav1.Condition spec violation AND breaks the
        status-applier checksum dedup, producing a self-feeding write loop
        where each SSA write triggers a watch event that re-renders. The
        generic helper preserves the existing timestamp when status is
        unchanged — these macros just make sure the helper sees the right
        conditions list.

        Usage:
          {%- import "util-condition-transition-time" for
                TopLevelTransitionTime, ListenerTransitionTime,
                RouteParentTransitionTime -%}
          {{ TopLevelTransitionTime(gateway, "Programmed", "True") }}
          {{ ListenerTransitionTime(gateway, "https", "Programmed", "True") }}
          {{ RouteParentTransitionTime(route, parentIdx, "Accepted", "True") }}
      -#}
      {%- macro TopLevelTransitionTime(resource any, conditionType string, newStatus string) string -%}
      {{- transitionTime(dig(resource, "status", "conditions"), conditionType, newStatus) -}}
      {%- end macro -%}

      {#-
        Listener entries come in as typegen-built structs in production
        (gateway.Status.Listeners is a typed slice when the Gateway is
        typed) but as map[string]any in fixture-only test paths. A
        `.(map[string]any)` assertion would panic on the typed shape —
        use dig() which handles both via JSON-tag lookup on structs
        and direct key lookup on maps. Same applies to RouteParentTransitionTime
        below.
      -#}
      {%- macro ListenerTransitionTime(gateway any, listenerName string, conditionType string, newStatus string) string -%}
      {%- var listeners = dig(gateway, "status", "listeners") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- for _, l := range listeners -%}
        {%- if found == nil && tostring(dig(l, "name") | fallback("")) == listenerName -%}
          {%- found = dig(l, "conditions") | toSlice() -%}
        {%- end -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {%- macro RouteParentTransitionTime(route any, parentIdx int, conditionType string, newStatus string) string -%}
      {%- var parents = dig(route, "status", "parents") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- if parentIdx >= 0 && parentIdx < len(parents) -%}
        {%- found = dig(parents[parentIdx], "conditions") | toSlice() -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

  util-hostname-intersect-gateway:
    template: |
      {#-
        HostnamesIntersect — listener.hostname × route.spec.hostnames

        Per Gateway API spec, an HTTPRoute attaches to a listener only when
        the hostname sets intersect. Wildcard rules (per spec):
          - Both empty → match (listener accepts everything, route claims everything)
          - Listener empty, route any → match (route narrows the listener)
          - Listener "*.example.com", route empty → match (route inherits listener)
          - Exact ↔ exact: byte-equal
          - Wildcard ↔ exact: route ends with `.<base>` where listener was `*.<base>`
            and the prefix part has no further dots (one DNS label only)
          - Wildcard ↔ wildcard: bases match, OR one base is a suffix of the other
            with the gap covering exactly one DNS label

        Returns true if any (listener-hostname, route-hostname) pair matches
        — listener carries one hostname, route may carry several. A single
        match is sufficient for attachment.
      -#}
      {#- Macros return "true" / "false" strings rather than bool because
          Scriggo macros only allow text-format return types. Callers use
          == "true" comparisons on the result. -#}
      {%- macro HostnamesIntersect(listenerHostname string, routeHostnames []any) -%}
        {%- if listenerHostname == "" -%}
          true
        {%- else if len(routeHostnames) == 0 -%}
          true
        {%- else -%}
          {%- var matched = "false" -%}
          {%- for _, rh := range routeHostnames -%}
            {%- if matched == "false" -%}
              {%- if HostnameSinglePairMatch(listenerHostname, tostring(rh)) == "true" -%}
                {%- matched = "true" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ matched -}}
        {%- end -%}
      {%- end macro -%}

      {#- HostnameSinglePairMatch — one listener hostname × one route hostname.
          Returns "true" / "false" string. The match boolean is just
          whether the intersection is non-empty. -#}
      {%- macro HostnameSinglePairMatch(lh string, rh string) -%}
        {%- if HostnameSinglePairIntersection(lh, rh) == "" -%}
          false
        {%- else -%}
          true
        {%- end -%}
      {%- end macro -%}

      {#- HostnameSinglePairIntersection — one listener hostname × one route
          hostname. Returns the *effective* hostname per Gateway API
          intersection rules:

            - lh exact, rh exact, equal           → that exact hostname
            - lh wildcard (*.X), rh exact (y.X)   → rh (the more specific exact)
            - lh exact (y.X), rh wildcard (*.X)   → lh (the more specific exact)
            - both wildcard, equal bases          → that wildcard
            - both wildcard, one base nested      → the more specific wildcard
            - else                                → "" (no intersection)

          Returns "" when there is no intersection.

          Wildcard semantics (Gateway API v1 spec, NOT RFC 1034):
            "*.X" matches any host that ends with ".X" and has at
            least one label before it. Both `foo.X` and
            `multi.label.foo.X` match (wildcards match any number of
            labels), but the bare `X` does not. -#}
      {#- HostnameRank — coarse "specificity" rank for a Gateway listener
          hostname. Higher rank = more specific. Used to determine which
          listener on a Gateway most specifically claims a given host so
          listener-isolation can drop a hostname from a less-specific
          listener's effective set when a more-specific sibling owns it.
            ""        → 0           (catch-all; lowest)
            "*.X"     → 100 + len(X) (wildcard; tied to suffix length)
            "X"       → 100000 + len(X) (exact; always beats any wildcard)
          The 100/100000 jumps make rank-comparisons safe across the
          three categories without needing tuple ordering. -#}
      {%- macro HostnameRank(h string) -%}
        {%- if h == "" -%}
          0
        {%- else if hasPrefix(h, "*.") -%}
          {{ 100 + len(h[2:]) }}
        {%- else -%}
          {{ 100000 + len(h) }}
        {%- end -%}
      {%- end macro -%}

      {%- macro HostnameSinglePairIntersection(lh string, rh string) -%}
        {%- if lh == rh -%}
          {{ lh }}
        {%- else if hasPrefix(lh, "*.") && !hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- if hasSuffix(rh, "."+lhBase) && len(rh) > len("."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- else if !hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var rhBase = rh[2:] -%}
          {%- if hasSuffix(lh, "."+rhBase) && len(lh) > len("."+rhBase) -%}
            {{ lh }}
          {%- end -%}
        {%- else if hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- var rhBase = rh[2:] -%}
          {%- if lhBase == rhBase -%}
            {{ lh }}
          {%- else if hasSuffix(lhBase, "."+rhBase) -%}
            {{ lh }}
          {%- else if hasSuffix(rhBase, "."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-reference-grant-permitted:
    template: |
      {#-
        ReferenceGrantPermitted — cross-namespace ref check.

        Per Gateway API spec, a cross-namespace reference is permitted only
        when there's a ReferenceGrant in the target namespace whose `from`
        clause matches the source (group/kind/namespace) and whose `to`
        clause matches the target (group/kind, optionally name). Same-
        namespace refs are always permitted (no grant needed).

        Returns "true" / "false" — Scriggo macro return-type constraint
        (see HostnamesIntersect doc). Callers use `== "true"`.

        Args:
          fromGroup, fromKind, fromNs — the source resource (e.g. Gateway)
          toGroup, toKind, toNs, toName — the target resource (Secret /
          Service). toName is optional in the grant; matches any if grant
          omits the name.
      -#}
      {%- macro ReferenceGrantPermitted(
          fromGroup string, fromKind string, fromNs string,
          toGroup string, toKind string, toNs string, toName string) -%}
        {%- if fromNs == toNs -%}
          true
        {%- else -%}
          {%- var permitted = "false" -%}
          {%- for _, g := range resources.referencegrants.Fetch(toNs) -%}
            {%- if permitted == "false" -%}
              {%- var fromOk = false -%}
              {%- for _, fr := range dig(g, "spec", "from") | toSlice() -%}
                {%- var frGroup = tostring(dig(fr, "group") | fallback("")) -%}
                {%- var frKind = tostring(dig(fr, "kind") | fallback("")) -%}
                {%- var frNs = tostring(dig(fr, "namespace") | fallback("")) -%}
                {%- if frGroup == fromGroup && frKind == fromKind && frNs == fromNs -%}
                  {%- fromOk = true -%}
                {%- end -%}
              {%- end -%}
              {%- if fromOk -%}
                {%- for _, to := range dig(g, "spec", "to") | toSlice() -%}
                  {%- if permitted == "false" -%}
                    {%- var toG = tostring(dig(to, "group") | fallback("")) -%}
                    {%- var toK = tostring(dig(to, "kind") | fallback("")) -%}
                    {%- var toN = tostring(dig(to, "name") | fallback("")) -%}
                    {%- if toG == toGroup && toK == toKind && (toN == "" || toN == toName) -%}
                      {%- permitted = "true" -%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ permitted -}}
        {%- end -%}
      {%- end macro -%}

  util-gw-mtls-blocked:
    template: |
      {#-
        ComputeGwMtlsBlocked — populate the set of mTLS-blocked listener
        names for a Gateway.

        A listener is "blocked" when its applicable TLS-frontend
        validation block (per-port override or default) has CA refs
        that can't be resolved against the live store. Routes attached
        to such listeners must not be served — otherwise the chart's
        HTTPS frontend would happily route them via a SIBLING Gateway's
        bind, closing the
        GatewayFrontendInvalidDefaultClientCertificateValidation
        conformance gap. The check matches the resolvability test
        features-110-gateway-frontend-mtls performs but reads the live
        resource stores rather than consuming pre-populated state, so
        the route-analysis pass doesn't depend on
        features-110-gateway-frontend-mtls having run first (it
        doesn't, when map files render in their own context).

        Memoizes per-Gateway via shared.ComputeIfAbsent — the walk runs
        once per Gateway regardless of how many routes attach to it.

        Usage:
          {%- import "util-gw-mtls-blocked" for ComputeGwMtlsBlocked,
                GetGwMtlsBlockedKey -%}
          {{ ComputeGwMtlsBlocked(gw) }}
          {%- var blockedAny, _ = shared.ComputeIfAbsent(
                GetGwMtlsBlockedKey(gw),
                func() any { return map[string]bool{} }) -%}
          {%- var gwMtlsBlocked = blockedAny.(map[string]bool) %}

        The double-ComputeIfAbsent at the call site is the chart's
        established render-to-populate + getter-to-fetch idiom (see
        util-gateway-analysis for the same pattern). The fetch
        closure is a no-op for cached entries; the macro guarantees
        the entry is present.
      -#}
      {%- macro GetGwMtlsBlockedKey(gw *resources.gateways.T) string -%}
        gwMtlsBlocked:{{ gw.Metadata.Namespace }}/{{ gw.Metadata.Name }}
      {%- end macro -%}

      {%- macro ComputeGwMtlsBlocked(gw *resources.gateways.T) -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("gwMtlsBlocked:"+gw.Metadata.Namespace+"/"+gw.Metadata.Name, func() any {
          var blocked = map[string]bool{}
          // Outer presence check uses dig() to distinguish "TLS
          // frontend block absent" (skip entirely) from "present
          // but with all zero values" (process and potentially
          // block listeners). Typed access alone can't observe
          // absence — it always yields the struct's zero value.
          if dig(gw, "spec", "tls", "frontend") == nil {
            return blocked
          }
          var gwNs = gw.Metadata.Namespace
          var defaultValidation any = nil
          if dig(gw, "spec", "tls", "frontend", "default", "validation") != nil {
            defaultValidation = gw.Spec.Tls.Frontend.Default.Validation
          }
          var perPortValidations = map[int]any{}
          for _, pp := range gw.Spec.Tls.Frontend.PerPort {
            var p = toint(pp.Port)
            if p > 0 && dig(pp, "tls", "validation") != nil {
              perPortValidations[p] = pp.Tls.Validation
            }
          }
          var resolveValidation = func(validation any) bool {
            var refs = dig(validation, "caCertificateRefs") | toSlice()
            if len(refs) == 0 {
              return false
            }
            for _, ref := range refs {
              var refKind = tostring(dig(ref, "kind") | fallback(""))
              var refGroup = tostring(dig(ref, "group") | fallback(""))
              var refName = tostring(dig(ref, "name") | fallback(""))
              var refNs = tostring(dig(ref, "namespace") | fallback(gwNs))
              if refName == "" {
                continue
              }
              if refGroup != "" && refGroup != "core" {
                continue
              }
              if refKind == "ConfigMap" {
                if resources.configmaps.GetSingle(refNs, refName) != nil {
                  return true
                }
              } else if refKind == "Secret" {
                if resources.secrets.GetSingle(refNs, refName) != nil {
                  return true
                }
              }
            }
            return false
          }
          for _, l := range gw.Spec.Listeners {
            var lProto = l.Protocol
            if lProto != "HTTPS" && lProto != "TLS" {
              continue
            }
            var lName = l.Name
            var validation any = perPortValidations[toint(l.Port)]
            if validation == nil {
              validation = defaultValidation
            }
            if validation == nil {
              continue
            }
            if !resolveValidation(validation) {
              blocked[lName] = true
            }
          }
          return blocked
        })
      %%}
      {%- end macro -%}
