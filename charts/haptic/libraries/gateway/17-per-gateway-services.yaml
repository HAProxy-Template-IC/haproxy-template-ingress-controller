templateSnippets:
  # ============================================================================
  # Per-Gateway LoadBalancer Service emission
  #
  # Each Gateway with HTTPS listeners and NO spec.addresses set gets its own
  # LoadBalancer Service in the controller namespace. MetalLB (or whatever
  # cluster IPAM is in use) allocates a unique LB IP for each Service, which
  # the chart's status patcher writes back into Gateway.Status.Addresses.
  # The Service's port → targetPort mapping uses phase 1's pod-port allocator,
  # so each (Gateway, listener) bind ends up on a unique container port — that
  # lets phase 4 emit one HAProxy bind per Gateway with isolated SSL config
  # (cert, verify mode, ca-ignore-err) on the same logical 443.
  #
  # Re-uses the existing `k8sResources.gateway-static-addresses` template by
  # writing entries into the same `shared.gatewayStaticAddressServices` map
  # the static-addresses path populates. The template doesn't distinguish
  # between "user-pinned via spec.addresses" and "chart-allocated per-Gateway"
  # entries — it just renders Services from whatever's in the map.
  #
  # Skips:
  #   * Gateways with `spec.addresses` set — those go through the existing
  #     static-addresses path (one Service per IP, with a per-IP MetalLB
  #     annotation). Re-emitting would collide on the Service name.
  #   * Gateways with no HTTPS listener — there's nothing for the chart's
  #     mode-http frontend to bind on, so a per-Gateway Service has no
  #     consumer. (HTTP-only Gateways still flow through the chart-static
  #     bind on 80.)
  #
  # NOT skipped: mTLS-blocked listeners. The Service stays up so connections
  # land at the chart's HAProxy pod; phase 4 declines to emit a bind for
  # the blocked listener, so the connection RSTs at the Pod boundary —
  # exactly what the GatewayFrontendInvalidDefaultClientCertificateValidation
  # contract requires.
  # ============================================================================

  features-090-gateway-per-gateway-services:
    template: |
      {%- import "util-bounded-k8s-name" for BoundedK8sName %}
      {{ render "util-gateway-pod-port-allocator" -}}
      {%- var ctrlNs = tostring(extraContext | dig("controllerNamespace") | fallback("")) %}
      {%- var podSelector = extraContext | dig("haproxyPodSelector") %}
      {%- if ctrlNs != "" && podSelector != nil && resources != nil && resources.gateways != nil %}
        {%- var allocations map[string]any = coalesce(shared.Get("gatewayPodPortAllocations"), map[string]any{}).(map[string]any) %}
        {%- var gwSvcsRaw, _ = shared.ComputeIfAbsent("gatewayStaticAddressServices", func() any { return map[string]any{} }) %}
        {%- var gwSvcs = gwSvcsRaw.(map[string]any) %}
        {%- for _, gw := range resources.gateways.List() %}
          {%- var gwNs = tostring(dig(gw, "metadata", "namespace") | fallback("")) %}
          {%- var gwName = tostring(dig(gw, "metadata", "name") | fallback("")) %}
          {#- Skip when spec.addresses is set — the existing static-
              addresses path emits one Service per IP. Mixing with a
              per-Gateway Service would collide on the Service name. -#}
          {%- var addrs = dig(gw, "spec", "addresses") | toSlice() %}
          {%- if len(addrs) == 0 && gwNs != "" && gwName != "" %}
            {%%
              // Walk the Gateway's listeners. The Service must expose
              // EVERY listener port (HTTPS + HTTP + TLS) — the
              // Gateway's status.addresses points at this one IP and
              // clients connect to <ip>:<listener.port> regardless of
              // protocol, so kube-proxy needs a port mapping for each.
              //
              // HTTPS listeners get a per-listener targetPort drawn
              // from phase 1's allocator (so phase 4's per-Gateway
              // bind on its unique pod port handles them). Other
              // protocols target their own port number directly,
              // routing to the chart-static HAProxy bind for that
              // port (HTTP → bind *:80, TLS-Passthrough → ssl-tcp,
              // TLS-Terminate non-default → frontends-600). Skip
              // duplicates by listenerPort (multiple listeners on
              // the same port disambiguate downstream via crt-list /
              // SNI / Host, not via duplicate Service ports).
              var ports = []any{}
              var seenPort = map[int]bool{}
              var hasHTTPS = false
              for _, listener := range dig(gw, "spec", "listeners") | toSlice() {
                var lName = tostring(dig(listener, "name") | fallback(""))
                var lPort = toint(dig(listener, "port") | fallback(0))
                var lProto = tostring(dig(listener, "protocol") | fallback(""))
                if lName == "" || lPort <= 0 || seenPort[lPort] {
                  continue
                }
                seenPort[lPort] = true
                var targetPort = lPort
                if lProto == "HTTPS" {
                  hasHTTPS = true
                  var allocKey = gwNs + "/" + gwName + ":" + lName + ":" + tostring(lPort)
                  if val, ok := allocations[allocKey]; ok {
                    targetPort = toint(val)
                  }
                }
                ports = append(ports, map[string]any{
                  "name":       "p" + tostring(lPort),
                  "port":       lPort,
                  "targetPort": targetPort,
                  "protocol":   "TCP",
                })
              }
              if hasHTTPS && len(ports) > 0 {
                var svcName = BoundedK8sName("gw", gwNs, gwName, "")
                // Carry the gateway-name + gateway-namespace labels so the
                // status read-back path (and the conformance test's
                // discovery) finds the per-Gateway Service the same way
                // it finds the static-addresses Services.
                var ownedLabels = map[string]any{
                  "gateway.networking.k8s.io/gateway-name":      gwName,
                  "gateway.networking.k8s.io/gateway-namespace": gwNs,
                }
                gwSvcs[ctrlNs+"/"+svcName] = map[string]any{
                  "namespace":   ctrlNs,
                  "name":        svcName,
                  "labels":      ownedLabels,
                  "annotations": map[string]any{},
                  "selector":    podSelector,
                  "ports":       ports,
                }
              }
            %%}
          {%- end %}
        {%- end %}
      {%- end %}
