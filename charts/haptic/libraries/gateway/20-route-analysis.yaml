templateSnippets:
  util-gateway-analysis:
    template: |
      {#- Caches route analysis in shared.gatewayAnalysis: {sortedRoutes, pathGroups, allRoutes}
          Uses ComputeIfAbsent for race-free caching across parallel template renders.
          The compute function runs exactly once, even with concurrent access. -#}
      {%- import "util-analyze-routes" for AnalyzeRoutes %}
      {%%
        var _, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any {
          var analysis = map[string]any{"pathGroups": map[string]any{}, "sortedRoutes": []any{}, "allRoutes": []any{}}
          AnalyzeRoutes(analysis)
          return analysis
        })
      %%}

  util-effective-listeners:
    template: |
      {#-
        Effective listeners per Gateway = the Gateway's own
        spec.listeners + spec.listeners from every accepted ListenerSet
        whose parentRef points at it AND whose listener does not lose a
        precedence-based hostname/protocol conflict.

        Caches a `map[gatewayKey][]listener` in shared so each
        consumer pays one ComputeIfAbsent + one map-key lookup
        regardless of how many sites read it. Also caches a per-
        ListenerSet acceptance/conflict map under
        "listenersetStatuses" so the F3 status patch and the routing
        sites agree byte-for-byte on which listeners survived.

        Each listener entry is a map[string]any with the original
        Listener fields plus three flat provenance keys:
        `__sourceKind` ("Gateway" | "ListenerSet"), `__sourceNs`,
        `__sourceName` (the source resource's namespace and name);
        an `_index` field with the listener's position in its owning
        resource (used for transition-time keying); and an `_accepted`
        bool indicating whether the listener's owning resource passed
        the parent gate. Flat keys are used instead of a nested
        `_source` map because Scriggo mis-evaluates the latter under
        certain conditions (literal map keys "kind"/"namespace"/"name"
        get rebound to listener-field values like "protocol" and
        "hostname"; see in-line comments at the LS listener loop).
        Routing/binding sites can treat the merged set uniformly;
        status patching consumes the per-LS statuses sub-key on the
        same effectiveListeners cache.

        Acceptance gate (matches the F3 status patch byte-for-byte):
          default-deny when allowedListeners is unset
          from=All       admit every namespace
          from=Same      admit ListenerSets in the parent Gateway namespace
          from=Selector  admit when the ListenerSet namespace labels
                         match allowedListeners.namespaces.selector.matchLabels
          cross-namespace parentRef requires a ReferenceGrant in the
          Gateway namespace permitting from {ListenerSet, lsNs} to
          {Gateway, gwName}.

        Conflict detection (per Gateway API spec):
          ProtocolConflict - multiple listeners on the same port use
            different protocols. Earlier (Gateway > earlier ListenerSet
            > later ListenerSet, then index) wins.
          HostnameConflict - multiple listeners on the same port use
            the same hostname. Earlier wins.
          Conflicting losers are dropped from the active routing set
          but recorded in listenersetStatuses for status emission.
      -#}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("effectiveListeners", func() any {
          // The cache value is a single map containing two sub-keys:
          //   "listeners" — map[gatewayKey][]listener (the merged effective
          //                 listener list per Gateway)
          //   "statuses"  — map[<ns>/<name>] (per-LS status map)
          //
          // statuses[<ns>/<name>] = map carrying the pre-computed acceptance
          // state F3 emits as conditions. Fields:
          //   permitted (bool)        - passed allowedListeners + RG gate
          //   rejectionReason (string)
          //   rejectionMessage (string)
          //   listenerConflicts ([]any) - per-listener {name, index,
          //     conflicted (string or ""), accepted (bool)}.
          //
          // Folding both into one cache value means "effectiveListeners
          // populated" implies "statuses populated". F3's status patch reads
          // this single value rather than depending on a separate, possibly-
          // unpopulated listenersetStatuses key.
          var statuses = map[string]any{}

          var out = map[string][]any{}

          for _, gw := range resources.gateways.List() {
            var gwNs = tostring(dig(gw, "metadata", "namespace") | fallback(""))
            var gwName = tostring(dig(gw, "metadata", "name") | fallback(""))
            var gwKey = gwNs + "/" + gwName

            // Determine the Gateway allowedListeners gate once per
            // Gateway. A Gateway with no allowedListeners default-denies
            // (per Gateway API spec for SupportListenerSet).
            var allowed = dig(gw, "spec", "allowedListeners")
            var allowedFrom = "None"
            var allowedSelector any = nil
            if allowed != nil {
              allowedFrom = tostring(dig(allowed, "namespaces", "from") | fallback("None"))
              allowedSelector = dig(allowed, "namespaces", "selector", "matchLabels")
            }
            // Scriggo workaround: without this `ComputeIfAbsent` capture
            // the closure later mis-evaluates `allowedFrom` (it picks
            // up listener-field strings like "protocol" or "hostname"
            // instead of the literal value computed above). The capture
            // pins the resolved value into a stable closure environment,
            // forcing Scriggo to materialise the correct binding before
            // the LS-acceptance switch runs. Use a per-Gateway cache key
            // so the call stays a no-op across multiple renders.
            var _, _ = shared.ComputeIfAbsent("__captureAllowedFrom_"+gwKey, func() any {
              return map[string]any{"allowedFrom": allowedFrom, "allowed": allowed}
            })

            // Sort the ListenerSets attached to this Gateway by
            // (creationTimestamp, namespace, name) so precedence is
            // deterministic across renders.
            var attachedSets = []any{}
            for _, ls := range resources.listenersets.List() {
              var pRef = dig(ls, "spec", "parentRef")
              if tostring(dig(pRef, "name") | fallback("")) != gwName {
                continue
              }
              var lsNs = tostring(dig(ls, "metadata", "namespace") | fallback(""))
              var pNs = tostring(dig(pRef, "namespace") | fallback(lsNs))
              if pNs != gwNs {
                continue
              }
              attachedSets = append(attachedSets, ls)
            }
            // Bubble-sort: O(n^2) but ListenerSet counts per Gateway are
            // tiny (<10 typical, hundreds in pathological cases). Avoids
            // pulling in a Scriggo sort helper.
            for i := 0; i < len(attachedSets); i++ {
              for j := i + 1; j < len(attachedSets); j++ {
                var a = attachedSets[i]
                var b = attachedSets[j]
                var aTs = tostring(dig(a, "metadata", "creationTimestamp") | fallback(""))
                var bTs = tostring(dig(b, "metadata", "creationTimestamp") | fallback(""))
                var aKey = tostring(dig(a, "metadata", "namespace") | fallback("")) + "/" + tostring(dig(a, "metadata", "name") | fallback(""))
                var bKey = tostring(dig(b, "metadata", "namespace") | fallback("")) + "/" + tostring(dig(b, "metadata", "name") | fallback(""))
                var swap = false
                if aTs == bTs {
                  if aKey > bKey {
                    swap = true
                  }
                } else if aTs == "" {
                  // Empty creationTimestamp sorts last so resources without
                  // an explicit timestamp (test fixtures) don't displace
                  // real ListenerSets in production.
                  swap = true
                } else if bTs != "" && aTs > bTs {
                  swap = true
                }
                if swap {
                  attachedSets[i] = b
                  attachedSets[j] = a
                }
              }
            }

            // Build the candidate listener list for conflict detection.
            // Each entry is a map carrying the listener fields plus
            // __sourceKind / __sourceNs / __sourceName / _index /
            // _accepted (bool — whether the listener's owning resource
            // passed the parent gate).
            var candidates = []any{}

            // Gateway own listeners come first; they always pass the
            // parent gate (no ListenerSet involved), so _accepted=true.
            for li, l := range dig(gw, "spec", "listeners") | toSlice() {
              var lc = map[string]any{}
              if m, ok := l.(map[string]any); ok {
                for k, v := range m {
                  lc[k] = v
                }
              }
              lc["__sourceKind"] = "Gateway"
              lc["__sourceNs"] = gwNs
              lc["__sourceName"] = gwName
              lc["_index"] = li
              lc["_accepted"] = true
              candidates = append(candidates, lc)
            }

            // ListenerSet listeners, in precedence order.
            for _, ls := range attachedSets {
              var lsNs = tostring(dig(ls, "metadata", "namespace") | fallback(""))
              var lsName = tostring(dig(ls, "metadata", "name") | fallback(""))
              var lsKey = lsNs + "/" + lsName

              // Parent acceptance gate.
              var permitted = false
              var rejectionReason = "NotAllowed"
              var rejectionMessage = "Parent Gateway does not allow ListenerSets from this namespace"
              switch allowedFrom {
              case "All":
                permitted = true
              case "Same":
                permitted = (lsNs == gwNs)
              case "Selector":
                if allowedSelector == nil {
                  permitted = false
                } else {
                  var nsObj = resources.namespaces.GetSingle(lsNs)
                  if nsObj == nil {
                    permitted = false
                  } else {
                    var nsLabels = dig(nsObj, "metadata", "labels")
                    if nsLabels == nil {
                      permitted = false
                    } else {
                      var nsMap = nsLabels.(map[string]any)
                      var allMatch = true
                      for k, v := range allowedSelector.(map[string]any) {
                        var actual, ok = nsMap[k]
                        if !ok || tostring(actual) != tostring(v) {
                          allMatch = false
                          break
                        }
                      }
                      permitted = allMatch
                    }
                  }
                }
              default:
                permitted = false
              }

              // Per Gateway API conformance (ListenerSetReferenceGrant
              // + ListenerSetAllowedNamespaceSelector), cross-namespace
              // ListenerSet parentRefs do NOT require a ReferenceGrant
              // — the Gateway's `allowedListeners` IS the policy.
              // ReferenceGrant only gates resource references (Secret,
              // ConfigMap, …) attached to listeners.

              // Pre-stash the per-LS status entry so F3 can read it
              // back. listenerConflicts gets filled in further below
              // after conflict detection runs.
              statuses[lsKey] = map[string]any{
                "permitted":         permitted,
                "rejectionReason":   rejectionReason,
                "rejectionMessage":  rejectionMessage,
                "listenerConflicts": []any{},
              }

              // Even when not permitted we still want listener entries
              // for the per-listener status output (Programmed=False/
              // NotAllowed flows via _accepted=false). They are flagged
              // _accepted=false so routing/binding loops skip them.
              for li, l := range dig(ls, "spec", "listeners") | toSlice() {
                // Avoid copying listener fields into a fresh map — the
                // copy loop's iteration variable seems to leak into the
                // surrounding scope's map literal evaluation under
                // Scriggo, breaking later reads of `_source.name`. We
                // instead use the listener map directly and stash our
                // metadata under `__source_*` keys (unlikely to clash
                // with Gateway API listener fields).
                var lcSrc = map[string]any{}
                if m, ok := l.(map[string]any); ok {
                  lcSrc = m
                }
                var lc = map[string]any{}
                for k, v := range lcSrc {
                  lc[k] = v
                }
                lc["__sourceKind"] = "ListenerSet"
                lc["__sourceNs"] = lsNs
                lc["__sourceName"] = lsName
                lc["_index"] = li
                lc["_accepted"] = permitted
                candidates = append(candidates, lc)
              }
            }

            // Conflict detection across the precedence-ordered list.
            //   ProtocolConflict - multiple listeners on the same port
            //     with different protocols. Earlier (higher precedence)
            //     wins; later listeners get Conflicted=True/ProtocolConflict.
            //   HostnameConflict - multiple listeners on the same port
            //     using the same hostname. Earlier wins; later listeners
            //     get Conflicted=True/HostnameConflict.
            // Conflict detection: rewritten to avoid `continue` because
            // Scriggo's `continue` inside this nested-if structure has
            // misbehaved here in past debugging sessions, terminating the
            // outer for-loop prematurely. Use boolean skip flags + nested
            // if-blocks instead — semantically identical, robust.
            var winningProtoByPort = map[int]string{}
            var claimedHostByPort = map[string]bool{}
            for ci := 0; ci < len(candidates); ci++ {
              var lc = candidates[ci].(map[string]any)
              var skip = !lc["_accepted"].(bool)
              if !skip {
                var port = toint(lc["port"] | fallback(0))
                if port <= 0 {
                  skip = true
                }
                if !skip {
                  var protocol = tostring(lc["protocol"] | fallback("HTTP"))
                  var winner, hasWinner = winningProtoByPort[port]
                  if !hasWinner {
                    winningProtoByPort[port] = protocol
                  } else if winner != protocol {
                    lc["_conflicted"] = "ProtocolConflict"
                    skip = true
                  }
                  if !skip {
                    var hostname = tostring(lc["hostname"] | fallback(""))
                    var hostKey = tostring(port) + "|" + hostname
                    if claimedHostByPort[hostKey] {
                      lc["_conflicted"] = "HostnameConflict"
                    } else {
                      claimedHostByPort[hostKey] = true
                    }
                  }
                }
              }
            }

            // Surface per-listener conflicts back into the
            // listenersetStatuses map so F3 can emit them as
            // Conflicted=True/<reason> on the ListenerSet
            // status.listeners[]. Avoids `continue` because Scriggo's
            // `continue` mis-handles this nested-if shape (terminates the
            // outer for-loop early instead of going to the next
            // iteration); using a plain `if` body works identically.
            for ci := 0; ci < len(candidates); ci++ {
              var lc = candidates[ci].(map[string]any)
              var srcKind = tostring(lc["__sourceKind"])
              var srcNs = tostring(lc["__sourceNs"])
              var srcName = tostring(lc["__sourceName"])
              if srcKind == "ListenerSet" {
                var lsKey = srcNs + "/" + srcName
                var entryAny = statuses[lsKey]
                if entryAny != nil {
                  var entry = entryAny.(map[string]any)
                  var conflicts = entry["listenerConflicts"].([]any)
                  var conflictReason = ""
                  c, hasC := lc["_conflicted"]
                  if hasC {
                    conflictReason = tostring(c)
                  }
                  conflicts = append(conflicts, map[string]any{
                    "name":           tostring(lc["name"] | fallback("")),
                    "index":          lc["_index"],
                    "conflicted":     conflictReason,
                    "accepted":       lc["_accepted"],
                  })
                  entry["listenerConflicts"] = conflicts
                  statuses[lsKey] = entry
                }
              }
            }

            // Routing/binding/cert sites consume the merged list. Drop
            // entries whose owning ListenerSet was not permitted (they
            // do not program into HAProxy) and entries flagged
            // _conflicted (a conflicting listener does not program; its
            // claim is held by the precedence-winning sibling).
            // Same pattern: skip flag in lieu of `continue`.
            var listeners = []any{}
            for _, c := range candidates {
              var lc = c.(map[string]any)
              var keep = lc["_accepted"].(bool)
              if keep {
                _, conflicted := lc["_conflicted"]
                if conflicted {
                  keep = false
                }
              }
              if keep {
                listeners = append(listeners, lc)
              }
            }
            out[gwKey] = listeners
          }

          return map[string]any{
            "listeners": out,
            "statuses":  statuses,
          }
        })
      %%}

  util-listenerset-routing-gate:
    template: |
      {#-
        IsListenerSetAdmitted — the routing-layer ListenerSet gate.

        Returns "true" / "false" — Scriggo macro return-type constraint
        (text-format only). Callers compare with `== "true"`.

        Implements the same gate util-effective-listeners uses, in macro
        form so the routing sites (multi-port-bind, misdirected map,
        host-map, mTLS) can apply it without re-deriving the logic. The
        F3 status patch (status-patches-220-listenerset) reads the
        listenersetStatuses cache directly rather than calling this
        macro, but they agree on the gate result.

        Gate:
          1. parentRef.name + parentRef.namespace points at `gw`
          2. allowedListeners admits this LS's namespace
             (default-deny → deny; from=All → admit; from=Same →
             ns equality; from=Selector → matchLabels against
             resources.namespaces[lsNs].metadata.labels)
          3. cross-namespace parentRef requires a ReferenceGrant in
             the Gateway's namespace permitting from
             {ListenerSet, lsNs} to {Gateway, gwName}.
      -#}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- macro IsListenerSetAdmitted(gw any, ls any) -%}
        {%- var gwNs = tostring(dig(gw, "metadata", "namespace") | fallback("")) -%}
        {%- var gwName = tostring(dig(gw, "metadata", "name") | fallback("")) -%}
        {%- var pRef = dig(ls, "spec", "parentRef") -%}
        {%- var result = "false" -%}
        {%- if tostring(dig(pRef, "name") | fallback("")) == gwName -%}
          {%- var lsNs = tostring(dig(ls, "metadata", "namespace") | fallback("")) -%}
          {%- var pNs = tostring(dig(pRef, "namespace") | fallback(lsNs)) -%}
          {%- if pNs == gwNs -%}
            {%- var allowed = dig(gw, "spec", "allowedListeners") -%}
            {%- var allowedFrom = "None" -%}
            {%- var allowedSelector any = nil -%}
            {%- if allowed != nil -%}
              {%- allowedFrom = tostring(dig(allowed, "namespaces", "from") | fallback("None")) -%}
              {%- allowedSelector = dig(allowed, "namespaces", "selector", "matchLabels") -%}
            {%- end -%}
            {%- var permitted = "false" -%}
            {%- if allowedFrom == "All" -%}
              {%- permitted = "true" -%}
            {%- else if allowedFrom == "Same" -%}
              {%- if lsNs == gwNs -%}
                {%- permitted = "true" -%}
              {%- end -%}
            {%- else if allowedFrom == "Selector" -%}
              {%- if allowedSelector != nil -%}
                {%- var nsObj = resources.namespaces.GetSingle(lsNs) -%}
                {%- if nsObj != nil -%}
                  {%- var nsLabels = dig(nsObj, "metadata", "labels") -%}
                  {%- if nsLabels != nil -%}
                    {%- var nsMap = nsLabels.(map[string]any) -%}
                    {%- var selMap = allowedSelector.(map[string]any) -%}
                    {%- var allMatch = "true" -%}
                    {%- for k, v := range selMap -%}
                      {%- var actual, ok = nsMap[k] -%}
                      {%- if !ok -%}
                        {%- allMatch = "false" -%}
                      {%- else if tostring(actual) != tostring(v) -%}
                        {%- allMatch = "false" -%}
                      {%- end -%}
                    {%- end -%}
                    {%- permitted = allMatch -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
            {%- if permitted == "true" -%}
              {#- Per Gateway API conformance (ListenerSetReferenceGrant
                  + ListenerSetAllowedNamespaceSelector), cross-namespace
                  ListenerSet parentRefs do NOT require a ReferenceGrant
                  — the Gateway's `allowedListeners` IS the policy.
                  ReferenceGrant only gates resource references
                  (Secret, ConfigMap, …) attached to listeners. -#}
              {%- result = "true" -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {{ result -}}
      {%- end macro -%}

      {#-
        IsRouteAllowedOnListener — listener-level
        `allowedRoutes.namespaces` gate, applied when a route's
        parentRef has resolved to a specific listener.

        Per Gateway API spec a listener accepts a route only when its
        `allowedRoutes.namespaces.from` permits the route's namespace:

          * `from: All`      — any namespace.
          * `from: Same`     — only listenerOwnerNs (the Gateway's or
                               ListenerSet's namespace).
          * `from: Selector` — namespaces whose labels match
                               `selector.matchLabels`.
          * (unset)          — defaults to `Same`.

        Returns "true" / "false" (Scriggo macro return-type
        constraint). Callers use `hasPrefix(... , "true")`.

        Exists separately from IsListenerSetAdmitted because the gates
        are distinct: IsListenerSetAdmitted checks the parent
        Gateway's `allowedListeners` (LS-level admission), while this
        macro checks the listener's `allowedRoutes` (route-level
        admission). A LS can be admitted on a Gateway but its
        listener can still reject a specific route's namespace.
      -#}
      {%- macro IsRouteAllowedOnListener(routeNs string, listener any, listenerOwnerNs string) -%}
        {%- var allowedFrom = "Same" -%}
        {%- var allowedSelector any = nil -%}
        {%- var allowed = listener | dig("allowedRoutes", "namespaces") -%}
        {%- if allowed != nil -%}
          {%- allowedFrom = tostring(dig(allowed, "from") | fallback("Same")) -%}
          {%- allowedSelector = dig(allowed, "selector", "matchLabels") -%}
        {%- end -%}
        {%- var result = "false" -%}
        {%- if allowedFrom == "All" -%}
          {%- result = "true" -%}
        {%- else if allowedFrom == "Same" -%}
          {%- if routeNs == listenerOwnerNs -%}
            {%- result = "true" -%}
          {%- end -%}
        {%- else if allowedFrom == "Selector" -%}
          {%- if allowedSelector != nil -%}
            {%- var nsObj = resources.namespaces.GetSingle(routeNs) -%}
            {%- if nsObj != nil -%}
              {%- var nsLabels = dig(nsObj, "metadata", "labels") -%}
              {%- if nsLabels != nil -%}
                {%- var nsMap = nsLabels.(map[string]any) -%}
                {%- var selMap = allowedSelector.(map[string]any) -%}
                {%- var allMatch = "true" -%}
                {%- for k, v := range selMap -%}
                  {%- var actual, ok = nsMap[k] -%}
                  {%- if !ok -%}
                    {%- allMatch = "false" -%}
                  {%- else if tostring(actual) != tostring(v) -%}
                    {%- allMatch = "false" -%}
                  {%- end -%}
                {%- end -%}
                {%- result = allMatch -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {{ result -}}
      {%- end macro -%}

  util-analyze-routes:
    template: |
      {#-
        Analyzes HTTPRoute/GRPCRoute resources and populates result with:
        - allRoutes: flat list of normalized route objects
        - pathGroups: routes grouped by host+path for conflict detection
        - sortedRoutes: routes sorted by precedence (method > headers > query > order)

        Hostname expansion: a route with `spec.hostnames` set produces one
        entry per declared hostname. A route with NO hostnames inherits
        the hostname(s) of every listener it attaches to (per Gateway
        API spec — "If the listener has hostnames specified and the
        HTTPRoute does not, the route inherits the listener's
        hostname"). This is what makes a sectionName-targeted route
        scope to its listener's hostname instead of bleeding across
        every Gateway sharing the frontend port.

        For each (route, attaching-listener) pair the routeInfo's
        hostname becomes the listener's hostname (or "" when the
        listener has no hostname either, which the host map handles via
        the regsub wildcard fallback).
      -#}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection, HostnameSinglePairMatch, HostnameRank %}
      {%- import "util-listenerset-routing-gate" for IsListenerSetAdmitted, IsRouteAllowedOnListener %}
      {%- macro AnalyzeRoutes(result map[string]any) %}
        {%- var allRoutes = []any{} %}

        {#- Process HTTPRoutes #}
        {%- for _, route := range resources.httproutes.List() %}
          {#- Compute the effective hostnames per Gateway API intersection
              rules. For each parentRef we accept (Gateway-targeted) and
              each attached listener:
                - route empty + listener empty           → ""        (catch-all)
                - route empty + listener H               → H         (route inherits)
                - route H... + listener ""               → each H    (route narrows)
                - route H... + listener L                → per-pair intersection
                                                            (drops pairs with no intersection)
              The aggregated set is what the chart should emit map entries for;
              hostnames that don't intersect any attached listener fall away,
              which is what the spec requires (a route with `wildcard.io` in
              spec.hostnames must NOT route to a `*.wildcard.io` listener,
              because `*.wildcard.io` doesn't match the bare `wildcard.io`).
              Routes with no surviving intersection produce no entries. -#}
          {%- var routeHostnames = route | dig("spec", "hostnames") | toSlice() %}
          {%- var parentRefs = dig(route, "spec", "parentRefs") | toSlice() %}
          {%- var effectiveHosts = map[string]bool{} %}
          {%- var resolvedGwCount = 0 %}
          {%- var routeNs = tostring(dig(route, "metadata", "namespace") | fallback("")) %}
          {%- for _, parentRef := range parentRefs %}
            {%- var prGroup = tostring(dig(parentRef, "group") | fallback("gateway.networking.k8s.io")) %}
            {%- var prKind = tostring(dig(parentRef, "kind") | fallback("Gateway")) %}
            {%- if prGroup == "gateway.networking.k8s.io" && prKind == "Gateway" %}
              {%- var gwNs = tostring(dig(parentRef, "namespace") | fallback(routeNs)) %}
              {%- var gwName = tostring(dig(parentRef, "name") | fallback("")) %}
              {%- var section = tostring(dig(parentRef, "sectionName") | fallback("")) %}
              {%- var prPort = toint(dig(parentRef, "port") | fallback(0)) %}
              {%- var gw = resources.gateways.GetSingle(gwNs, gwName) %}
              {%- if gw != nil %}
                {%- resolvedGwCount = resolvedGwCount + 1 %}
                {#- Pre-compute mTLS-blocked listener names for THIS Gateway
                    inline so the route-analysis pass doesn't depend on
                    features-110-gateway-frontend-mtls having run first
                    (it doesn't, when map files render in their own
                    context). Per Gateway API spec, a listener whose
                    spec.tls.frontend.default OR matching perPort
                    validation references a non-existent / wrong-kind /
                    cross-ns-without-RG ConfigMap or Secret cannot
                    terminate TLS, and routes attached to it must not
                    serve — otherwise the chart's HTTPS frontend would
                    happily route them via a SIBLING Gateway's bind
                    (closes the GatewayFrontendInvalidDefaultClient
                    CertificateValidation conformance gap). The check
                    here matches the resolvability test
                    features-110-gateway-frontend-mtls performs but
                    against the live resource stores rather than
                    consuming pre-populated state. -#}
