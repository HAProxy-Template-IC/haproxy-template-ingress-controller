              {%- var lsName = tostring(dig(parentRef, "name") | fallback("")) %}
              {%- var section = tostring(dig(parentRef, "sectionName") | fallback("")) %}
              {%- var prPort = toint(dig(parentRef, "port") | fallback(0)) %}
              {%- var ls = resources.listenersets.GetSingle(lsNs, lsName) %}
              {%- if ls != nil %}
                {%- var lsParentRef = dig(ls, "spec", "parentRef") %}
                {%- var gwName = tostring(dig(lsParentRef, "name") | fallback("")) %}
                {%- var gwNs = tostring(dig(lsParentRef, "namespace") | fallback(lsNs)) %}
                {%- var gw = resources.gateways.GetSingle(gwNs, gwName) %}
                {%- if gw != nil && hasPrefix(IsListenerSetAdmitted(gw, ls), "true") %}
                  {%- resolvedGwCount = resolvedGwCount + 1 %}
                  {%- for _, listener := range dig(ls, "spec", "listeners") | toSlice() %}
                    {%- var listenerName = tostring(dig(listener, "name") | fallback("")) %}
                    {%- if section == "" || section == listenerName %}
                      {%- var listenerPort = toint(dig(listener, "port") | fallback(0)) %}
                      {#- Listener-level admission gate (LS branch):
                          prPort pin AND allowedRoutes.namespaces.
                          Listener owner is the LS itself, so
                          listenerOwnerNs == lsNs (NOT the parent
                          Gateway's namespace). Merged into one
                          condition so the surrounding end-block
                          structure stays unchanged. -#}
                      {%- if (prPort == 0 || prPort == listenerPort) && hasPrefix(IsRouteAllowedOnListener(routeNs, listener, lsNs), "true") %}
                        {%- var listenerProto = tostring(dig(listener, "protocol") | fallback("HTTP")) %}
                        {%- var portSuffix = "" %}
                        {%- if listenerPort > 0 %}
                          {%- if (listenerProto == "HTTP" && listenerPort != 80) || (listenerProto == "HTTPS" && listenerPort != 443) || (listenerProto == "TLS" && listenerPort != 443) %}
                            {%- portSuffix = ":" + tostring(listenerPort) %}
                          {%- end %}
                        {%- end %}
                        {%- var listenerHostname = tostring(dig(listener, "hostname") | fallback("")) %}
                        {%- if len(routeHostnames) == 0 %}
                          {%- effectiveHosts[listenerHostname + portSuffix] = true %}
                        {%- else if listenerHostname == "" %}
                          {%- for _, rh := range routeHostnames %}
                            {%- effectiveHosts[tostring(rh) + portSuffix] = true %}
                          {%- end %}
                        {%- else %}
                          {%- for _, rh := range routeHostnames %}
                            {%- var inter = HostnameSinglePairIntersection(listenerHostname, tostring(rh)) %}
                            {%- if inter != "" %}
                              {#- Listener isolation per Gateway API spec
                                  (LS branch): drop intersections more-
                                  specifically claimed by a sibling listener
                                  on the SAME LS. Mirrors the Gateway branch
                                  fix; siblings come from the LS's own
                                  spec.listeners, not the parent Gateway. -#}
                              {%- var lsCurrentRank = toint(HostnameRank(listenerHostname)) %}
                              {%- var lsOwnedBySibling = false %}
                              {%- for _, sibling := range dig(ls, "spec", "listeners") | toSlice() %}
                                {%- if !lsOwnedBySibling %}
                                  {%- var sibName = tostring(dig(sibling, "name") | fallback("")) %}
                                  {%- if sibName != listenerName %}
                                    {%- var sibHost = tostring(dig(sibling, "hostname") | fallback("")) %}
                                    {%- if sibHost != "" && HostnameSinglePairIntersection(sibHost, inter) == inter && toint(HostnameRank(sibHost)) > lsCurrentRank %}
                                      {%- lsOwnedBySibling = true %}
                                    {%- end %}
                                  {%- end %}
                                {%- end %}
                              {%- end %}
                              {%- if !lsOwnedBySibling %}
                                {%- effectiveHosts[inter + portSuffix] = true %}
                              {%- end %}
                            {%- end %}
                          {%- end %}
                        {%- end %}
                      {%- end %}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
          {#- Same fallback as HTTPRoute branch — see comment there. -#}
          {%- if resolvedGwCount == 0 %}
            {%- if len(routeHostnames) == 0 %}
              {%- effectiveHosts[""] = true %}
            {%- else %}
              {%- for _, rh := range routeHostnames %}
                {%- effectiveHosts[tostring(rh)] = true %}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- if len(effectiveHosts) == 0 %}
            {%- continue %}
          {%- end %}
          {%- var hostnames = []any{} %}
          {%- for h := range effectiveHosts %}
            {%- hostnames = append(hostnames, h) %}
          {%- end %}
          {%- for _, hostname := range hostnames %}
            {%- var ruleIdx = 0 %}
            {%- for _, rule := range route | dig("spec", "rules") | toSlice() %}
              {%- var matchesList = rule | dig("matches") | toSlice() %}
              {%- if len(matchesList) == 0 %}
                {%- matchesList = []any{map[string]any{"method": map[string]any{}}} %}
              {%- end %}

              {%- for _, match := range matchesList %}
                {%- var filtersList = rule | dig("filters") | toSlice() | coalesce([]any{}) %}
                {#- GRPCRoute spec has no path matcher: an attached
                    GRPCRoute claims every path under the listener
                    hostname, with the gRPC method matchers (this
                    rule's match.method block) narrowing within. Use
                    PathPrefix "/" so the synthetic path emits into
                    the prefix map (matching every request URL)
                    instead of the exact map (which would only match
                    requests with exactly path="/" — never the case
                    for gRPC, whose requests carry the method as the
                    URL path: `/<service>/<method>`). Without this,
                    gw_routeId stays unset for gRPC traffic, the
                    GRPCRoute rule's gw_routeId scope check fails,
                    and the request falls through to default_backend
                    (404). Closes the upstream
                    GRPCExactMethodMatching / GRPCRouteHeaderMatching
                    / GRPCRouteListenerHostnameMatching /
                    GRPCRouteNamedRule / GRPCRouteWeight conformance
                    tests, plus the e2e TestGRPCOverTLS regression. -#}
                {%- var grpcPath = map[string]any{"type": "PathPrefix", "value": "/"} %}
                {%- var pathKey = hostname + "|" + (grpcPath["type"]) + "|" + (grpcPath["value"]) %}
                {%- var routeInfo = map[string]any{
                  "route": route,
                  "hostname": hostname,
                  "rule": rule,
                  "ruleIdx": ruleIdx,
                  "match": match,
                  "path": grpcPath,
                  "filters": filtersList,
                  "is_grpc": true,
                  "resource_type": "grpcroute",
                  "pathKey": pathKey,
                } %}
                {%- allRoutes = append(allRoutes, routeInfo) %}
              {%- end %}
              {#- Increment rule counter after processing all matches for this rule #}
              {%- ruleIdx = ruleIdx + 1 %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Group by path key to detect conflicts #}
        {%- var pathGroups = group_by(allRoutes, "pathKey") %}

        {#- Check for conflicts and mark routes needing VAR qualifier #}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var routes []any = pathGroups[pathKey] %}
          {#- Check if routes in this group have different matchers #}
          {%- var hasConflicts = false %}
          {%- if len(routes) > 1 %}
            {#- Build comparison key from match conditions #}
            {%- var firstConditions = "" %}
            {%- var firstRoute = routes[0] %}
            {%- var firstMatch = firstRoute["match"] %}
            {%- var firstMethod = firstMatch["method"] %}
            {%- if firstMethod != nil %}
              {%- firstConditions = firstConditions + "method:" + (firstMethod) %}
            {%- end %}
            {%- for idx, header := range firstMatch["headers"] | toSlice() %}
              {%- firstConditions = firstConditions + ";header:" + (header["name"]) + "=" + (header["value"]) %}
            {%- end %}
            {%- for idx, param := range firstMatch["queryParams"] | toSlice() %}
              {%- firstConditions = firstConditions + ";param:" + (param["name"]) + "=" + (param["value"]) %}
            {%- end %}

            {#- Check if any other route has different conditions #}
            {%- for i := 1; i < len(routes); i++ %}
              {%- var routeConditions = "" %}
              {%- var r = routes[i] %}
              {%- var routeMatch = r["match"] %}
              {%- var routeMethod = routeMatch["method"] %}
              {%- if routeMethod != nil %}
                {%- routeConditions = routeConditions + "method:" + (routeMethod) %}
              {%- end %}
              {%- for idx, header := range routeMatch["headers"] | toSlice() %}
                {%- routeConditions = routeConditions + ";header:" + (header["name"]) + "=" + (header["value"]) %}
              {%- end %}
              {%- for idx, param := range routeMatch["queryParams"] | toSlice() %}
                {%- routeConditions = routeConditions + ";param:" + (param["name"]) + "=" + (param["value"]) %}
              {%- end %}

              {%- if firstConditions != routeConditions %}
                {%- hasConflicts = true %}
              {%- end %}
            {%- end %}
          {%- end %}

          {#- Rebuild routes list with updated dicts #}
          {%- var updatedRoutes = []any{} %}
          {%- for _, route := range routes %}
            {%- var routeObj = route["route"] %}
            {%- var routeNs = routeObj | dig("metadata", "namespace") | fallback("") %}
            {%- var routeName = routeObj | dig("metadata", "name") | fallback("") %}
            {%- var ruleIdxVal = route["ruleIdx"] %}
            {%- var routeId = routeNs + "_" + routeName + "_" + (ruleIdxVal) %}
            {%- var updatedRoute = merge(route, map[string]any{
              "hasConflicts": hasConflicts,
              "pathKey": pathKey,
              "routeId": routeId,
            }) %}
            {%- updatedRoutes = append(updatedRoutes, updatedRoute) %}
          {%- end %}

          {#- Build conflictGroup string #}
          {%- var routeIds = map_extract(updatedRoutes, "routeId") %}
          {%- var conflictGroup = join(sort_strings(routeIds), "__") %}

          {#- Add conflictGroup to each route #}
          {%- var finalRoutes = []any{} %}
          {%- for _, route := range updatedRoutes %}
            {%- var routeWithGroup = merge(route, map[string]any{"conflictGroup": conflictGroup}) %}
            {%- finalRoutes = append(finalRoutes, routeWithGroup) %}
          {%- end %}

          {#- Update pathGroups with modified routes #}
          {%- pathGroups[pathKey] = finalRoutes %}
        {%- end %}

        {#- Rebuild allRoutes from updated pathGroups #}
        {%- var finalAllRoutes = []any{} %}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var pathRoutes []any = pathGroups[pathKey] %}
          {%- for _, route := range pathRoutes %}
            {%- finalAllRoutes = append(finalAllRoutes, route) %}
          {%- end %}
        {%- end %}

        {%- var sortedRoutes = finalAllRoutes | sort_by([]string{
          "$.path.type",
          "$.path.value | length:desc",
          "$.match.method:exists:desc",
          "$.match.headers | length:desc",
          "$.match.queryParams | length:desc",
          "$.route.metadata.creationTimestamp",
          "$.route.metadata.namespace ~ '/' ~ $.route.metadata.name",
          "$.ruleIdx",
        }) %}

        {#- Pre-compute filter existence flags (optimization: avoids repeated iteration) #}
        {%- var hasRequestHeader = false %}
        {%- var hasResponseHeader = false %}
        {%- var hasRedirect = false %}
        {%- var hasUrlrewrite = false %}
        {%- for _, route := range finalAllRoutes %}
          {%- var filters []any = route["filters"] %}
          {%- for _, filter := range filters %}
            {%- var filterType = filter["type"] %}
            {%- if filterType == "RequestHeaderModifier" %}
              {%- hasRequestHeader = true %}
            {%- else if filterType == "ResponseHeaderModifier" %}
              {%- hasResponseHeader = true %}
            {%- else if filterType == "RequestRedirect" %}
              {%- hasRedirect = true %}
            {%- else if filterType == "URLRewrite" %}
              {%- hasUrlrewrite = true %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Populate result map with analysis data #}
        {%- result["pathGroups"] = pathGroups %}
        {%- result["sortedRoutes"] = sortedRoutes %}
        {%- result["allRoutes"] = finalAllRoutes %}
        {#- Filter existence flags for optimized filter template rendering #}
        {%- result["hasRequestHeader_filter"] = hasRequestHeader %}
        {%- result["hasResponseHeader_filter"] = hasResponseHeader %}
        {%- result["hasRedirect_filter"] = hasRedirect %}
        {%- result["hasUrlrewrite_filter"] = hasUrlrewrite %}
      {%- end macro %}
