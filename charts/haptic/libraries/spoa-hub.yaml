  test-coraza-dispatch-enable-modsecurity-host-less-accepted:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      An Ingress with nginx.ingress.kubernetes.io/enable-modsecurity:
      "false" and a host-less rule renders successfully — coraza-disabled.map
      is now keyed by <ns>/<name> (resource id), so the host dimension
      is irrelevant and the previous fail-loud guard is obsolete.
    extraContext:
      haproxyVersion: "3.2"
      coraza:
        dispatch:
          mode: default-on
          defaultEnforcement: deny
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
