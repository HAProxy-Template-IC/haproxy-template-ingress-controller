            timeoutMs: 5
            dependsOn: []
            params: |
              ja4 = true
    fixtures:
      # Trigger the http_frontend so the SPOE filter directive can
      # render. After the bind-derivation refactor, an empty
      # fixture leaves no http frontend.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
