# SPOA hub template library for HAPTIC
#
# Provides the HAProxy-side wiring for the bundled `spoa-hub` sidecar:
#   - `backend spoa-hub` with `mode spop` (or `mode tcp` on HAProxy 2.x)
#   - `filter spoe engine spoa-hub config <path>` directive in frontends
#   - `spoe.conf` registered as a general file via fileRegistry, containing
#     the agent block and per-plugin spoe-message bodies
#
# This library is opt-in via `controller.templateLibraries.spoaHub.enabled`.
# The chart auto-enables it when the SPOA hub sidecar is on (i.e. any
# plugin under `spoaHub.plugins.*` is enabled, or the operator sets
# `spoaHub.enabled=true` directly).
#
# Configuration is delivered via templatingSettings.extraContext.spoaHub
# (set by templates/haproxytemplateconfig.yaml from values.yaml). The
# controller stays generic — it never sees a "spoaHub" field in the CRD
# spec.
#
# Extension points for plugin libraries:
#
#   spoe-agents-*                    — extra directives inside spoe-agent
#                                      block (e.g. additional `option` lines).
#   spoe-messages-<message-name>-*   — `spoe-message <name>` block defining
#                                      one message's args/fetches. Resolved
#                                      per-message: contributing libraries
#                                      replace the auto-stub for their own
#                                      messages, and untouched messages still
#                                      get a minimal stub so HAProxy accepts
#                                      the agent's group references.
#   frontend-spoe-filters-*          — directives in frontend, after the
#                                      filter spoe directive (e.g. set-var
#                                      for SPOE args, send-spoe-group to
#                                      trigger a check, deny rules on the
#                                      plugin's response var).
#   map-auth-url-*                   — per-ingress entries for auth-url.map
#                                      (cycle 4 external-auth flow).
#
# Usage:
#   controller:
#     templateLibraries:
#       spoaHub:
#         enabled: true   # auto-enabled when spoaHub.enabled is truthy

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# Loaded when explicitly enabled OR when haptic.spoaHub.enabled (helper) is truthy
# (any plugin under spoaHub.plugins.* enabled, or spoaHub.enabled=true).
_helm_load:
  enable: '{{ or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .) }}'

templateSnippets:
  # RFC 7230 token guard for HTTP header field names from annotation
  # values. Ingress libraries call this before embedding a header
  # name into a HAProxy `set-header` / `set-var` directive — defence
  # in depth for operator typos and against any future code path
  # where annotation editing isn't strictly RBAC-gated. The regex
  # mirrors RFC 7230 `tchar`; values containing whitespace, `;`,
  # fetch syntax like `%[var(...)]`, etc. fail-loud at render time.
  util-auth-validate-header-name:
    template: |-
      {%- macro ValidateAuthHeaderName(name string, annotation string, ns string, ingressName string) %}
        {%- if !regex_search(name, "^[A-Za-z0-9!#$&'*+.^_`|~-]+$") -%}
          {{- fail("Invalid HTTP header name '" + name + "' in annotation '" + annotation + "' on Ingress " + ns + "/" + ingressName + ". Header names must be RFC 7230 tokens (1*tchar): no whitespace, no special characters, no fetch syntax.") -}}
        {%- end -%}
      {%- end %}

  # URL guard for annotation values that get interpolated into
  # HAProxy directives (e.g. `http-request redirect location <url>`).
  # An unsanitised URL with whitespace, newlines, or HAProxy
  # metacharacters could let an Ingress-write RBAC holder inject
  # arbitrary directives into the shared frontend (e.g. closing the
  # current rule and opening a `http-request deny if TRUE`). The
  # check is intentionally strict — RFC 3986 URIs are constrained
  # enough that disallowing whitespace and newlines covers every
  # realistic injection vector while passing every legitimate
  # https://... value operators care about.
  util-auth-validate-url:
    template: |-
      {%- macro ValidateAuthURL(url string, annotation string, ns string, ingressName string) %}
        {%- if strings_contains(url, "\n") || strings_contains(url, "\r") || strings_contains(url, " ") || strings_contains(url, "\t") -%}
          {{- fail("Invalid URL in annotation '" + annotation + "' on Ingress " + ns + "/" + ingressName + ": value contains whitespace or newlines. URLs must not contain whitespace — they are interpolated into HAProxy directives where whitespace is significant and could be used to inject arbitrary config.") -}}
        {%- end -%}
      {%- end %}

  # features-* runs early in haproxyConfig.template (side-effect render).
  # We use it to register spoe.conf as a general file so the HAProxy
  # `filter spoe ... config <path>` directive resolves at validation
  # and runtime.
  # util-spoa-hub-enabled returns "true"/"false" so callers can test
  # truthiness with a cheap string compare. Scriggo's `if` requires a
  # bool, and `extraContext | dig(...)` returns `any`; tostring() routes
  # the value through Go's fmt and gives us a stable boolean string.
  util-spoa-hub-enabled:
    template: |-
      {{- extraContext | dig("spoaHub", "enabled") | fallback(false) | tostring() -}}

  features-spoa-hub:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" -%}
        {%- var spoeContent = render "spoe-conf-content" -%}
        {%- var _, regErr = fileRegistry.Register("file", "spoe.conf", spoeContent) -%}
        {%- if regErr != nil %}
          {%- fail("failed to register spoe.conf: " + regErr.Error()) %}
        {%- end -%}
        {#- Register the runtime hub config (TOML) at <GeneralStorageDir>/spoa-hub-config.toml.
            The dataplane API delivers it to the haproxy pod's filesystem and the
            spoa-hub sidecar's file-watch + graceful-reload picks it up without a
            restart. ADR-0007 captures the end-to-end flow. -#}
        {%- var hubConfig = render "spoa-hub-config-content" -%}
        {%- var _, regErr2 = fileRegistry.Register("file", "spoa-hub-config.toml", hubConfig) -%}
        {%- if regErr2 != nil %}
          {%- fail("failed to register spoa-hub-config.toml: " + regErr2.Error()) %}
        {%- end -%}
      {%- end -%}

  backends-100-spoa-hub:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" %}
      {#- mode spop is the native SPOP backend mode introduced in HAProxy 3.1.
          On HAProxy 3.0 the proxy mode doesn't exist and the parser rejects
          it ("unknown proxy mode 'spop'"); fall back to mode tcp, which is
          the legacy SPOE transport. The filter spoe directive in the
          frontend handles the protocol either way. Operators can force tcp
          on 3.1+ by setting spoaHub.haproxy.modeSpop: false. -#}
      {%- var modeSpopRequested = extraContext | dig("spoaHub", "modeSpop") | fallback(true) | tostring() %}
      {%- var hapVersion = extraContext | dig("haproxyVersion") | fallback("") | tostring() %}
      {%- var spopSupported = semver_gte(hapVersion, "3.1") %}
      backend spoa-hub
          mode {%- if modeSpopRequested == "true" && spopSupported %} spop{%- else %} tcp{%- end %}
          timeout connect 5s
          timeout server  {{ extraContext | dig("spoaHub", "timeoutIdle") | fallback("5m") }}
          server hub {{ extraContext | dig("spoaHub", "socketPath") | fallback("/run/spoa/hub.sock") }} pool-low-conn 0 pool-max-conn {{ extraContext | dig("spoaHub", "poolMaxConn") | fallback(100) }} pool-purge-delay {{ extraContext | dig("spoaHub", "poolPurgeDelay") | fallback("30s") }}
      {%- end %}

  # Renders the SPOA hub's runtime config.toml. Called from features-spoa-hub
  # via fileRegistry.Register("file", "spoa-hub-config.toml", ...). The
  # dataplane API delivers the rendered file to the haproxy pod, where the
  # spoa-hub sidecar's file-watch + graceful-reload (haproxy-spoa-hub MR1)
  # picks it up without a restart.
  #
  # The TOML mirrors the bootstrap configmap's shape (templates/spoa-hub-configmap.yaml)
  # — same plugin_dir, default_timeout_ms, [[listeners]], one [[plugins]]
  # block per enabled plugin, and a [plugins.params] block with the
  # operator's params: blob spliced verbatim. The runtime version differs in
  # one important place: for coraza, this snippet *appends* per-Ingress
  # `nginx.ingress.kubernetes.io/modsecurity-snippet` values into the
  # `directives = """..."""` field, sorted by `<ns>/<name>` for determinism,
  # so each Ingress's WAF rules land in the runtime hub without per-request
  # SPOE shipping. ADR-0007 captures the rationale.
  spoa-hub-config-content:
    template: |
      {%- var hub = extraContext | dig("spoaHub", "hub") | fallback(map[string]any{}) -%}
      {%- var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() -%}
      {%- var socketPath = extraContext | dig("spoaHub", "socketPath") | fallback("/run/spoa/hub.sock") | tostring() -%}

      {#- Scan all watched Ingresses for nginx.ingress.kubernetes.io/modsecurity-snippet
          annotations and group them by (namespace, name). MemoryStore.List() sorts by
          namespace+name so iteration order is deterministic; we record each non-empty
          snippet for inlining into coraza's directives field below.

          Snippets are spliced verbatim into a TOML multi-line basic string
          (`directives = """..."""`); a snippet containing `"""` would close
          the string early and let an Ingress-write RBAC holder inject
          arbitrary TOML keys into the rendered hub config (e.g. flip
          `detect_only`, change the listener address). In multi-tenant
          clusters where namespace-scoped users can edit Ingresses but
          should not control WAF runtime behaviour this is a privilege
          escalation. Reject snippets containing the closing delimiter
          fail-loud — TOML 1.0 multi-line basic strings have no escape
          for triple-quote, and SecRule values legitimately don't need it. -#}
      {%- var modsecuritySnippets = []any{} -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var snippet = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/modsecurity-snippet") | fallback("") | tostring() -%}
        {%- if snippet != "" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {%- if strings_contains(snippet, "\"\"\"") -%}
            {{- fail("Ingress " + ns + "/" + name + " annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' contains a TOML triple-quote delimiter (\"\"\"); this would break the rendered coraza directives multi-line string and is rejected. Remove the triple-quote sequence from the SecRule(s).") -}}
          {%- end -%}
          {%- modsecuritySnippets = append(modsecuritySnippets, map[string]any{
              "ns": ns, "name": name, "snippet": snippet,
          }) -%}
        {%- end -%}
      {%- end -%}

      {#- Fail-loud if any Ingress sets the annotation but coraza isn't enabled.
          Silent ignore would hide a real misconfiguration: the operator wrote
          a per-Ingress WAF rule and nothing enforces it. The fail() at render
          time turns into a clear admission denial via the dryrun validator. -#}
      {%- if len(modsecuritySnippets) > 0 -%}
        {%- var corazaEnabled = false -%}
        {%- for _, p := range plugins -%}
          {%- var pName = p.(map[string]any)["name"].(string) -%}
          {%- if pName == "coraza" -%}
            {%- corazaEnabled = true -%}
          {%- end -%}
        {%- end -%}
        {%- if !corazaEnabled -%}
          {%- var first = modsecuritySnippets[0].(map[string]any) -%}
          {{- fail("Ingress " + first["ns"].(string) + "/" + first["name"].(string) + " sets annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' but the spoaHub coraza plugin is not enabled. Either enable spoaHub.plugins.coraza or remove the annotation.") -}}
        {%- end -%}
      {%- end -%}

      plugin_dir = "{{ hub | dig("pluginDir") | fallback("/etc/haproxy-spoa-hub/plugins") }}"
      default_timeout_ms = {{ hub | dig("defaultTimeoutMs") | fallback(500) }}
      log_level = "{{ hub | dig("logLevel") | fallback("info") }}"
      max_connections = {{ hub | dig("maxConnections") | fallback(1000) }}
      blocking_thread_keep_alive_secs = {{ hub | dig("blockingThreadKeepAliveSecs") | fallback(30) }}
      {%- var workerThreads = hub | dig("workerThreads") -%}
      {%- if workerThreads != nil %}
      worker_threads = {{ workerThreads }}
      {%- end %}

      [[listeners]]
      type = "unix"
      address = "{{ socketPath }}"
      {% for _, plugin := range plugins %}
        {%- var p = plugin.(map[string]any) -%}
        {%- var pName = p["name"].(string) -%}
        {%- var pLibrary = p["library"].(string) -%}
        {%- var pMessages = p["messages"] | toSlice() -%}
        {%- var pTimeoutMs = p["timeoutMs"] -%}
        {%- var pDependsOn = p | dig("dependsOn") | fallback([]any{}) | toSlice() -%}
        {%- var pParams = p | dig("params") | fallback("") | tostring() -%}

      [[plugins]]
      name = "{{ pName }}"
      library = "{{ pLibrary }}"
      messages = [
        {%- for i, m := range pMessages -%}
          {%- if i > 0 -%}, {% end -%}
          "{{ m | tostring() }}"
        {%- end -%}
      ]
      timeout_ms = {{ pTimeoutMs }}
        {%- if len(pDependsOn) > 0 %}
      depends_on = [
          {%- for i, d := range pDependsOn -%}
            {%- if i > 0 -%}, {% end -%}
            "{{ d | tostring() }}"
          {%- end -%}
      ]
        {%- end %}

      [plugins.params]
        {%- if pName == "coraza" %}
          {#- Coraza-specific: emit the directives = """...""" block,
              concatenating values-supplied directives with per-Ingress
              modsecurity-snippet annotations sorted by <ns>/<name>. The
              comment line above each appended snippet identifies the
              source Ingress so `coraza-spoa --dump-config` output (and
              the rendered TOML on the haproxy pod's filesystem) is
              traceable back to whichever Ingress contributed each rule. -#}
          {%- var corazaDirectives = p | dig("directives") | fallback("") | tostring() %}
      directives = """
      {{ corazaDirectives | trimSpace() }}
          {%- for _, entry := range modsecuritySnippets %}
            {%- var e = entry.(map[string]any) %}

      # nginx-ingress modsecurity-snippet from {{ e["ns"].(string) }}/{{ e["name"].(string) }}
      {{ e["snippet"].(string) | trimSpace() }}
          {%- end %}
      """
        {%- end %}
        {%- if pParams != "" %}
      {{ pParams | trimSpace() }}
        {%- end %}
      {# Newline between plugin iterations so the next [[plugins]] table
         header lands on its own line. Without it the rendered TOML
         reads `transaction_ttl_ms = 10000[[plugins]]` and the hub's
         reload bails with a parse error. {% end %} preserves the
         trailing newline; {%- end -%} would strip it. #}
      {% end %}

  spoe-conf-content:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      [spoa-hub]

      spoe-agent spoa-hub-agent
      {%- if len(messages) > 0 %}
          groups
            {%- for _, msg := range messages -%}
              {{ " " + msg + "-group" }}
            {%- end %}
      {%- end %}
          option var-prefix       hub
          option pipelining
          option async
          timeout hello      {{ extraContext | dig("spoaHub", "timeoutHello") | fallback("2s") }}
          timeout idle       {{ extraContext | dig("spoaHub", "timeoutIdle") | fallback("5m") }}
          timeout processing {{ extraContext | dig("spoaHub", "timeoutProcessing") | fallback("500ms") }}
          use-backend spoa-hub
      {{ render_glob "spoe-agents-*" }}
      {#- Per-message SPOE-message bodies. Each known plugin message
          gets its canonical body via a literal `render`; everything
          else falls back to a minimal stub so HAProxy accepts the
          group's reference. This dispatch is hard-coded because the
          Scriggo fork's `render` requires a string literal — adding
          a new plugin with a real body means adding a branch here.
          The leading blank line before each block is required: the
          HAProxy SPOE config parser uses blank lines as block
          separators. -#}
      {%- for _, msg := range messages %}

      {% if msg == "check-auth" -%}
      {{ render "spoe-message-check-auth-body" }}
      {%- else if msg == "check-request" -%}
      {{ render "spoe-message-check-request-body" }}
      {%- else -%}
      spoe-message {{ msg }}
          args ip=src
      {%- end %}
      {%- end %}

      {#- Per-message group definitions. Each message becomes a singleton
          group (`<msg>-group`) so frontends can trigger it explicitly
          via `http-request send-spoe-group spoa-hub-agent <msg>-group`. -#}
      {%- for _, msg := range messages %}

      spoe-group {{ msg }}-group
          messages {{ msg }}
      {%- end %}

  # Canonical spoe-message check-auth body. Rendered by name from
  # spoe-conf-content's per-message dispatch when "check-auth" is in
  # the messages union. Args follow the haproxy-spoa-hub external-auth
  # plugin's documented contract:
  #
  #   - auth_url   (required) — drives the auth-url annotation lookup
  #   - method     (optional, v0.3.0+) — per-request HTTP method override
  #     for the auth subrequest, populated from the
  #     {nginx.ingress.kubernetes.io,haproxy-ingress.github.io}/auth-method
  #     annotations via auth-method.map. The plugin treats an empty
  #     value as "no override" and falls back to its plugin-level
  #     config, so routes without the annotation behave unchanged.
  #   - forward_headers (optional, v0.3.0+) — comma-separated list of
  #     request header names to forward to the auth service, populated
  #     from the haproxy-ingress.github.io/auth-headers-request
  #     annotation via auth-forward-headers.map. The plugin replaces
  #     its plugin-level forward_headers list with this when the arg
  #     is non-empty; empty (no annotation) falls back to the default.
  #   - extract_headers (optional, v0.3.0+) — comma-separated list of
  #     response header names to extract from the auth reply (on every
  #     reply path: 2xx, 3xx, 4xx, 5xx). Each extracted header becomes
  #     a transaction variable `txn.hub.external_auth.<name>` (with
  #     dashes → underscores). Populated as the union of pass + fail
  #     headers per ingress from auth-extract-headers.map; the
  #     ingress libraries themselves emit per-route per-header
  #     `set-header` (pass) and `deny ... hdr` (fail) directives that
  #     consume those vars.
  #
  # The plugin v0.3.0 also accepts `client_cert` / `client_key` SPOE
  # args for per-request mTLS to the auth service, but no upstream
  # ingress controller (nginx-ingress / haproxy-ingress) exposes a
  # typed annotation for "auth subrequest mTLS" — only for incoming
  # client-cert verification (a different feature). The chart
  # therefore does not wire `client_cert` / `client_key`. Operators
  # who need subrequest mTLS can extend the args= line with their
  # own SPOE arg sources (e.g. via the chart's user-config layer).
  #
  # The hardcoded `hdr_*` args at the end of the line capture the six
  # standard auth headers (Authorization, Cookie, X-Forwarded-*).
  # Ingress libraries can extend the captured set via the
  # `spoe-message-check-auth-extra-args-*` glob — e.g. haproxy-ingress
  # contributes one `hdr_<name>=req.hdr(<Name>)` per unique header
  # listed in any ingress's `auth-headers-request` annotation, so the
  # annotation alone determines what headers reach the auth service
  # (the plugin's `forward_headers` arg then narrows per-route).
  #
  # The plugin writes back the response variables
  # txn.hub.external_auth.allowed (bool) and ...status_code (uint32).
  spoe-message-check-auth-body:
    template: |-
      spoe-message check-auth
          args auth_url=var(txn.auth_url) path=path method=var(txn.auth_method) forward_headers=var(txn.auth_forward_headers) extract_headers=var(txn.auth_extract_headers) hdr_authorization=req.hdr(Authorization) hdr_cookie=req.hdr(Cookie) hdr_x_forwarded_for=req.hdr(X-Forwarded-For) hdr_x_forwarded_proto=req.hdr(X-Forwarded-Proto) hdr_x_forwarded_host=req.hdr(X-Forwarded-Host) hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri){{- render_glob "spoe-message-check-auth-extra-args-*" -}}

  # Canonical spoe-message check-request body. Args follow the
  # haproxy-spoa-hub-plugin-coraza message contract (plugin.rs:266-307):
  #
  #   - src-ip / src-port / dst-ip / dst-port — connection metadata for
  #     phase-1 connection rules and IP-based SecRules.
  #   - method / path / query / version — URI and request-line fields
  #     for phase-1 URI rules. Coraza canonicalizes path before
  #     SecRule evaluation; query is appended to the URI internally.
  #   - headers — the full request header block in HTTP wire format
  #     (`Name: Value\r\n`). The coraza plugin's parser expects this
  #     text shape (see `parse_haproxy_headers` in
  #     haproxy-spoa-hub-plugin-coraza/src/plugin.rs); HAProxy emits
  #     it via `req.hdrs`. **Not** `req.hdrs_bin` — that returns
  #     varint-encoded SPOE-wire bytes which the plugin would split
  #     wrong, leaving header-targeted SecRules
  #     (`REQUEST_HEADERS:X-*`) silently unmatched.
  #   - body — phase-2 body inspection. HAProxy buffers up to
  #     `tune.bufsize` bytes; SecRules see whatever was buffered when
  #     the request body completed (or was cut off by maxbody).
  #
  # `app` is intentionally omitted — single-WAF deployments use the
  # default WAF instance the plugin loads from `params.directives`.
  # Multi-tenant operators can add an `app=<expr>` to the args= line
  # via a chart user-override snippet to route per-tenant rule sets.
  #
  # The plugin writes back txn.hub.coraza.{action,status,rule_id,
  # anomaly_score,rules_hit,data}; the dispatcher in
  # frontend-spoe-filters-050-coraza denies on
  # rule_id >= 1 AND action == "deny".
  spoe-message-check-request-body:
    template: |-
      spoe-message check-request
          args src-ip=src src-port=src_port dst-ip=dst dst-port=dst_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body

  frontend-filters-100-spoa-hub:
    template: |-
      {%- if (render "util-spoa-hub-enabled") == "true" %}

      filter spoe engine spoa-hub config {{ pathResolver.GetPath("spoe.conf", "file") }}
      {{- render_glob "frontend-spoe-filters-*" }}
      {%- end %}

  # External-auth wiring: looks up the per-ingress auth URL in
  # auth-url.map (populated by ingress libraries from their auth-url
  # annotation), triggers the SPOE check, and denies on failure.
  # Conditional on `check-auth` being in the chart's messages union —
  # only emits when the external-auth plugin is enabled.
  # Coraza WAF dispatch. Triggers the check-request SPOE message on
  # every request when the coraza plugin is enabled. The plugin's
  # response sets `txn.hub.coraza.rule_id` (uint32, 0 if no rule
  # matched) and `txn.hub.coraza.action` ("allow"/"deny"/...). We
  # deny only when BOTH conditions hold:
  #   - rule_id >= 1: a real SecRule matched. The plugin's
  #     allowResult() and denyResult() error path both leave rule_id
  #     at zero, so this gate filters out "WAF init failed and we're
  #     denying every request" or "rule engine off" failure modes
  #     that would otherwise turn the deny into a default-deny on the
  #     whole frontend.
  #   - action == "deny": the plugin's interruption decision was an
  #     HTTP block (vs "drop" / "redirect" which would need different
  #     HAProxy actions). Today the chart only emits 403 deny, so
  #     drop/redirect actions correctly fall through to backend.
  # Priority 050 runs the WAF pass BEFORE the external-auth
  # subrequest at priority 100 — standard "WAF first, auth second"
  # pipeline. Emits nothing unless `check-request` is in the chart's
  # messages union (i.e. coraza is enabled).
  frontend-spoe-filters-050-coraza:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-request" %}
      http-request send-spoe-group spoa-hub check-request-group
      http-request deny deny_status 403 if { var(txn.hub.coraza.rule_id) -m int 1: } { var(txn.hub.coraza.action) -m str deny }
      {%- end %}

  frontend-spoe-filters-100-external-auth:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-auth" %}
      http-request set-var(txn.auth_url) var(txn.host_match),concat(,txn.path,),map({{ pathResolver.GetPath("auth-url.map", "map") }}) unless { var(txn.auth_url) -m found }
      http-request set-var(txn.auth_signin) var(txn.host_match),concat(,txn.path,),map({{ pathResolver.GetPath("auth-signin.map", "map") }}) unless { var(txn.auth_signin) -m found }
      http-request set-var(txn.auth_method) var(txn.host_match),concat(,txn.path,),map({{ pathResolver.GetPath("auth-method.map", "map") }}) unless { var(txn.auth_method) -m found }
      http-request set-var(txn.auth_forward_headers) var(txn.host_match),concat(,txn.path,),map({{ pathResolver.GetPath("auth-forward-headers.map", "map") }}) unless { var(txn.auth_forward_headers) -m found }
      http-request set-var(txn.auth_extract_headers) var(txn.host_match),concat(,txn.path,),map({{ pathResolver.GetPath("auth-extract-headers.map", "map") }}) unless { var(txn.auth_extract_headers) -m found }
      http-request send-spoe-group spoa-hub check-auth-group if { var(txn.auth_url) -m found }
      {#- Pass-headers extension point: ingress libraries emit one
          `http-request set-header` per unique header in any
          ingress's auth-response-headers / auth-headers-succeed union.
          Each line is gated on `allowed -m bool` (only on auth
          success) and `var ... -m found` (only when the plugin
          actually extracted that header). Empty when no ingress
          uses the annotation. The `{{ "\n" }}` after the glob
          emits a literal newline regardless of whether the glob
          matched anything — without it, when the glob is empty the
          adjacent `{#- ... -#}` trim markers collapse the
          send-spoe-group line into the redirect line. -#}
      {{- render_glob "frontend-spoe-set-pass-headers-*" }}{{ "\n" }}
      {#- Browser-friendly sign-in redirect on auth failure: if the
          ingress has `auth-signin`, redirect to it (302) instead of
          denying. The deny rule below still fires when auth-signin
          isn't configured, preserving the API-friendly default. -#}
      http-request redirect location %[var(txn.auth_signin)] code 302 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.auth_signin) -m found }
      http-request deny deny_status 401 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool }
      {#- Fail-headers extension point: ingress libraries emit one
          `http-after-response set-header` per unique header in any
          ingress's auth-headers-fail union. Runs on the deny
          response (and only that — the conditions gate on the
          auth path having run AND not allowed AND the per-header
          var being set). `http-after-response` rather than
          `http-response` because HAProxy's `http-request deny`
          short-circuits the request flow, generating its 401 reply
          internally; `http-response` rules only fire on responses
          received from a backend, so they'd silently skip the deny
          path. Empty when no ingress uses the annotation. Same
          trailing-newline trick as the pass-headers glob. -#}
      {{- render_glob "frontend-spoe-set-fail-headers-*" }}{{ "\n" }}
      {%- end %}

maps:
  auth-url.map:
    template: |
      # External-auth: per-ingress auth-url annotation values.
      # Keyed by host+path (matching the routing-logic key in base.yaml).
      # Populated by ingress libraries' map-auth-url-* contributions.
      {{- render_glob "map-auth-url-*" -}}

  auth-signin.map:
    template: |
      # External-auth: per-ingress sign-in URL for browser redirect on
      # auth failure. When set for a route, an auth failure produces a
      # 302 to this URL instead of a 401 — the standard pattern for
      # OIDC / SAML browser flows where the auth service redirects
      # unauthenticated users to a login page.
      # Populated by ingress libraries' map-auth-signin-* contributions.
      {{- render_glob "map-auth-signin-*" -}}

  auth-forward-headers.map:
    template: |
      # External-auth: per-ingress allowlist of request headers to
      # forward to the auth service. Populated by ingress libraries'
      # map-auth-forward-headers-* contributions from the
      # `haproxy-ingress.github.io/auth-headers-request` annotation
      # (no nginx-ingress equivalent — `auth-snippet` is freeform
      # HAProxy config injection, out of scope for templated wiring).
      # The value flows into the SPOE message's `forward_headers` arg
      # as a comma-separated list. Empty value (no annotation) → the
      # plugin falls back to its plugin-level forward_headers config.
      {{- render_glob "map-auth-forward-headers-*" -}}

  auth-extract-headers.map:
    template: |
      # External-auth: per-ingress union of response header names the
      # plugin should extract from the auth reply. Populated by ingress
      # libraries' map-auth-extract-headers-* contributions; each entry
      # is the comma-separated union of that ingress's
      # `auth-response-headers` / `auth-headers-succeed` and
      # `auth-headers-fail` annotation values. The value flows into the
      # SPOE message's `extract_headers` arg as a comma list; the
      # plugin then publishes each extracted header as a transaction
      # variable `txn.hub.external_auth.<name>` (with dashes →
      # underscores) and the ingress libraries' frontend
      # `set-header` (pass) / `deny ... hdr` (fail) snippets consume
      # those vars per-route. Empty value (no annotation) → no
      # per-route extraction; the plugin uses its plugin-level
      # extract_headers config.
      {{- render_glob "map-auth-extract-headers-*" -}}


  auth-method.map:
    template: |
      # External-auth: per-ingress HTTP method override for the auth
      # subrequest. Populated by ingress libraries' map-auth-method-*
      # contributions from the
      # `{nginx.ingress.kubernetes.io,haproxy-ingress.github.io}/auth-method`
      # annotations. The value flows into the SPOE message's `method`
      # arg (see spoe-message-check-auth-body); the external-auth
      # plugin v0.3.0+ treats an empty value as "no override" and falls
      # back to its plugin-level method config.
      {{- render_glob "map-auth-method-*" -}}

validationTests:
  test-spoa-hub-disabled:
    description: |
      With extraContext.spoaHub.enabled=false (or missing), the
      library must not emit the `backend spoa-hub` block, the SPOE
      filter, or any spoe.conf reference.
    extraContext:
      spoaHub:
        enabled: false
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid when spoaHub is disabled
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must not appear when spoaHub.enabled is false
      - type: not_contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub"
        description: SPOE filter must not appear when spoaHub.enabled is false

  test-spoa-hub-rendering:
    description: |
      With extraContext.spoaHub.enabled=true and `check-auth` in the
      messages union, the library emits the spoa-hub backend, the SPOE
      filter directive, the per-message group + canonical message body,
      and the external-auth frontend wiring (auth-url lookup, group
      trigger, deny rule).
    extraContext:
      # Pin the HAProxy version to 3.1+ so the rendered backend uses
      # `mode spop` (the assertion below requires it). Native SPOP
      # was introduced in HAProxy 3.1; on 3.0 the chart falls back to
      # `mode tcp`. test-spoa-hub-rendering-mode-tcp-on-haproxy30
      # covers that fallback path.
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with spoaHub enabled
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must appear when spoaHub is enabled
      - type: contains
        target: haproxy.cfg
        pattern: "mode spop"
        description: Backend uses native SPOP mode by default
      - type: contains
        target: haproxy.cfg
        pattern: "server hub /run/spoa/hub.sock"
        description: Server points at the hub's Unix-domain socket
      - type: contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub config"
        description: Frontends include the SPOE filter directive
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend explicitly triggers the auth group when auth_url is set
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-agent spoa-hub-agent"
        description: spoe.conf declares the spoa-hub agent
      - type: contains
        target: file:spoe.conf
        pattern: "groups check-auth-group"
        description: Agent's groups line references the auth group
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-message check-auth"
        description: Canonical spoe-message check-auth body is emitted
      - type: contains
        target: file:spoe.conf
        pattern: "args auth_url=var\\(txn.auth_url\\)"
        description: Message args include the auth_url binding
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-group check-auth-group"
        description: Group definition references the message

  # Regression: an Ingress with haproxy.org/forwarded-for=true triggers
  # the haproxytech library to emit `option forwardfor` in the frontend
  # at priority 100. The spoa-hub library's frontend-filters-100-* runs
  # next (alphabetical tie-break), so its output must start on a new
  # line — otherwise we get `option forwardforfilter spoe engine ...`
  # (a real bug found in CI when both snippets co-rendered).
  test-spoa-hub-frontend-filters-newline-after-forwardfor:
    description: |
      When haproxytech's option-forwardfor and the spoa-hub filter spoe
      directive both render at frontend-filters priority 100, they must
      be on separate lines. Catches the cycle 4 part C bug where the
      `{%- if` in spoa-hub's snippet stripped the separating newline.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: ff-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: ff-svc-abc
            labels:
              kubernetes.io/service-name: ff-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ff-ingress
            annotations:
              haproxy.org/forwarded-for: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ff.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ff-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy must validate (the concat bug produces invalid syntax)
      - type: not_contains
        target: haproxy.cfg
        pattern: "forwardforfilter"
        description: option forwardfor and filter spoe must not concatenate

  test-spoa-hub-mode-tcp-on-haproxy-3-0:
    description: |
      On HAProxy 3.0 the `spop` proxy mode doesn't exist (introduced
      in 3.1). The chart must auto-fall-back the spoa-hub backend to
      `mode tcp` — both transports work with the SPOE filter; mode
      spop is just the more efficient one on newer versions. This
      test pins haproxyVersion=3.0 and asserts the fallback.
    extraContext:
      haproxyVersion: "3.0"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: Rendered config must validate (mode tcp is valid on 3.0)
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend present
      - type: contains
        target: haproxy.cfg
        pattern: "mode tcp"
        description: Backend uses mode tcp on HAProxy 3.0
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub\\n    mode spop"
        description: Backend must NOT use mode spop on HAProxy 3.0

  # ============================================================================
  # spoa-hub-config.toml rendering (ADR-0007 / MR3)
  # ============================================================================

  test-spoa-hub-config-render-default:
    description: |
      With coraza enabled and no per-Ingress modsecurity-snippet
      annotations, the rendered spoa-hub-config.toml contains the
      top-level hub keys, the [[listeners]] block, and one [[plugins]]
      block for coraza with the base directives wrapped in
      `directives = """..."""`. No snippet comment markers appear.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
              Include @coraza.conf-recommended
            params: |
              request_body_limit = 131072
              detect_only = false
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'plugin_dir = "/etc/haproxy-spoa-hub/plugins"'
        description: Top-level plugin_dir is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'log_level = "info"'
        description: Top-level log_level is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'max_connections = 1000'
        description: Top-level max_connections is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[\[listeners\]\]'
        description: Listeners block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'address = "/run/spoa/hub.sock"'
        description: Listener address points at the configured socketPath
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[\[plugins\]\]'
        description: Coraza [[plugins]] block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'name = "coraza"'
        description: Plugin name is set
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'library = "libcoraza_plugin.so"'
        description: Plugin library filename is set
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'timeout_ms = 15'
        description: Plugin timeout_ms is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'SecRuleEngine On'
        description: Base coraza directives are inlined into directives = """..."""
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'request_body_limit = 131072'
        description: Free-form params blob is spliced under [plugins.params]
      - type: not_contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from'
        description: No snippet markers appear when no Ingress carries the annotation

  test-spoa-hub-config-render-modsecurity-snippet-single:
    description: |
      A single Ingress with nginx.ingress.kubernetes.io/modsecurity-snippet
      sees its rule appended into the rendered coraza directives, with a
      comment marker identifying the source Ingress. The rule sits BELOW
      the values-supplied base directives.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: protected
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port: { number: 80 }
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid with snippet inlined
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from default/protected'
        description: Snippet is preceded by a comment marker identifying the source Ingress
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'SecRule REQUEST_URI "@beginsWith /admin" "id:1001,phase:1,deny,status:403"'
        description: Snippet content is inlined verbatim
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'SecRuleEngine On'
        description: Base directives are still present alongside the snippet

  test-spoa-hub-config-render-modsecurity-snippet-multi-deterministic:
    description: |
      Multiple Ingresses with modsecurity-snippet annotations are
      inlined into the rendered coraza directives in deterministic
      order — sorted by `<namespace>/<name>` — so renders are
      reproducible and don't churn the dataplane API push payload
      across reconciliations.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: zeta
            namespace: zone-z
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains evil" "id:3001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: z.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: alpha
            namespace: zone-a
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains bad" "id:1001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: a.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: middle
            namespace: zone-m
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains naughty" "id:2001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: m.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid with three Ingresses' snippets inlined
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from zone-a/alpha[\s\S]*# nginx-ingress modsecurity-snippet from zone-m/middle[\s\S]*# nginx-ingress modsecurity-snippet from zone-z/zeta'
        description: Snippets are inlined sorted by namespace/name (alpha < middle < zeta)

  test-spoa-hub-config-render-modsecurity-snippet-rejects-toml-triple-quote:
    description: |
      An Ingress whose modsecurity-snippet contains a TOML triple-quote
      delimiter (""") is rejected at render time. The annotation value
      lands inside `directives = """..."""`; allowing the delimiter
      verbatim would let an Ingress-write RBAC holder break out of the
      string and inject arbitrary TOML keys into the rendered hub
      config. Fail-loud at admission keeps that escalation vector
      closed.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: injector
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRuleEngine On
                """
                detect_only = true
                directives = """
          spec: { ingressClassName: haproxy, rules: [{ host: i.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/injector annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' contains a TOML triple-quote"
        description: Render must fail with explicit triple-quote-rejection error

  test-spoa-hub-config-render-modsecurity-without-coraza-fails:
    description: |
      An Ingress carrying nginx.ingress.kubernetes.io/modsecurity-snippet
      while the spoaHub coraza plugin is NOT enabled fails the render
      with an explicit error. Silent ignore would hide a real
      misconfiguration; the operator wrote a per-Ingress WAF rule and
      nothing enforces it.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-auth"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: external_auth
            library: libhaproxy_spoa_hub_plugin_external_auth.so
            messages: ["check-auth"]
            timeoutMs: 6000
            dependsOn: []
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: orphan-rule
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/modsecurity-snippet: |
                SecRule ARGS "@contains attack" "id:4001,deny,status:403"
          spec: { ingressClassName: haproxy, rules: [{ host: o.example, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: e, port: { number: 80 } } } }] } }] }
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-rule sets annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' but the spoaHub coraza plugin is not enabled"
        description: Render must fail with explicit annotation-without-coraza error

  test-spoa-hub-config-render-multiple-plugins:
    description: |
      Multiple enabled plugins each get their own [[plugins]] block.
      This pins the iteration over extraContext.spoaHub.plugins.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request", "get-fingerprint"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: "SecRuleEngine On"
            params: ""
          - name: fingerprinting
            library: libfingerprinting_plugin.so
            messages: ["get-fingerprint"]
            timeoutMs: 5
            dependsOn: []
            params: |
              ja4 = true
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'name = "coraza"'
        description: Coraza plugin block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'name = "fingerprinting"'
        description: Fingerprinting plugin block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'library = "libfingerprinting_plugin.so"'
        description: Fingerprinting library filename is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'ja4 = true'
        description: Fingerprinting params blob is spliced
