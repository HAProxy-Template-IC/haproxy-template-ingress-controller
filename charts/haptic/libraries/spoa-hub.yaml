          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
