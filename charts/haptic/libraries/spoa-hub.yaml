                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid
      - type: contains
        target: file:spoa-hub-config.toml
