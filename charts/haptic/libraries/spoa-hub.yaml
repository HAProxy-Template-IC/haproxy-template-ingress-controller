            name: host-less
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "false"
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port: { number: 80 }
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid even with a host-less Ingress
      - type: contains
        target: map:coraza-disabled.map
        pattern: '(?m)^default/host-less 1$'
        description: |
          coraza-disabled.map carries the host-less Ingress as a
          resource-id-keyed entry; the routing chain still resolves it
          to a stable resource_id so the WAF skip applies correctly.
