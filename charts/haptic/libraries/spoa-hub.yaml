# SPOA hub template library for HAPTIC
#
# Provides the HAProxy-side wiring for the bundled `spoa-hub` sidecar:
#   - `backend spoa-hub` with `mode spop` (or `mode tcp` on HAProxy 2.x)
#   - `filter spoe engine spoa-hub config <path>` directive in frontends
#   - `spoe.conf` registered as a general file via fileRegistry, containing
#     the agent block and per-plugin spoe-message bodies
#
# This library is opt-in via `controller.templateLibraries.spoaHub.enabled`.
# The chart auto-enables it when the SPOA hub sidecar is on (i.e. any
# plugin under `spoaHub.plugins.*` is enabled, or the operator sets
# `spoaHub.enabled=true` directly).
#
# Configuration is delivered via templatingSettings.extraContext.spoaHub
# (set by templates/haproxytemplateconfig.yaml from values.yaml). The
# controller stays generic — it never sees a "spoaHub" field in the CRD
# spec.
#
# Extension points for plugin libraries:
#
#   spoe-agents-*                    — extra directives inside spoe-agent
#                                      block (e.g. additional `option` lines).
#   spoe-messages-<message-name>-*   — `spoe-message <name>` block defining
#                                      one message's args/fetches. Resolved
#                                      per-message: contributing libraries
#                                      replace the auto-stub for their own
#                                      messages, and untouched messages still
#                                      get a minimal stub so HAProxy accepts
#                                      the agent's group references.
#   frontend-spoe-filters-*          — directives in frontend, after the
#                                      filter spoe directive (e.g. set-var
#                                      for SPOE args, send-spoe-group to
#                                      trigger a check, deny rules on the
#                                      plugin's response var).
#   map-auth-url-*                   — per-ingress entries for auth-url.map
#                                      (cycle 4 external-auth flow).
#
# Usage:
#   controller:
#     templateLibraries:
#       spoaHub:
#         enabled: true   # auto-enabled when spoaHub.enabled is truthy

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# Loaded when explicitly enabled OR when haptic.spoaHub.enabled (helper) is truthy
# (any plugin under spoaHub.plugins.* enabled, or spoaHub.enabled=true).
_helm_load:
  enable: '{{ or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .) }}'

templateSnippets:
  # RFC 7230 token guard for HTTP header field names from annotation
  # values. Ingress libraries call this before embedding a header
  # name into a HAProxy `set-header` / `set-var` directive — defence
  # in depth for operator typos and against any future code path
  # where annotation editing isn't strictly RBAC-gated. The regex
  # mirrors RFC 7230 `tchar`; values containing whitespace, `;`,
  # fetch syntax like `%[var(...)]`, etc. fail-loud at render time.
  util-auth-validate-header-name:
    template: |-
      {%- macro ValidateAuthHeaderName(name string, annotation string, ns string, ingressName string) %}
        {%- if !regex_search(name, "^[A-Za-z0-9!#$&'*+.^_`|~-]+$") -%}
          {{- fail("Invalid HTTP header name '" + name + "' in annotation '" + annotation + "' on Ingress " + ns + "/" + ingressName + ". Header names must be RFC 7230 tokens (1*tchar): no whitespace, no special characters, no fetch syntax.") -}}
        {%- end -%}
      {%- end %}

  # URL guard for annotation values that get interpolated into
  # HAProxy directives (e.g. `http-request redirect location <url>`).
  # An unsanitised URL with whitespace, newlines, or HAProxy
  # metacharacters could let an Ingress-write RBAC holder inject
  # arbitrary directives into the shared frontend (e.g. closing the
  # current rule and opening a `http-request deny if TRUE`). The
  # check is intentionally strict — RFC 3986 URIs are constrained
  # enough that disallowing whitespace and newlines covers every
  # realistic injection vector while passing every legitimate
  # https://... value operators care about.
  util-spoa-hub-enabled:
    template: |-
      {{- extraContext | dig("spoaHub", "enabled") | fallback(false) | tostring() -}}

  features-spoa-hub:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" -%}
        {%- var spoeContent = render "spoe-conf-content" -%}
        {%- var _, regErr = fileRegistry.Register("file", "spoe.conf", spoeContent) -%}
        {%- if regErr != nil %}
          {%- fail("failed to register spoe.conf: " + regErr.Error()) %}
        {%- end -%}
        {#- Register the runtime hub config (TOML) at <GeneralStorageDir>/spoa-hub-config.toml.
            The dataplane API delivers it to the haproxy pod's filesystem and the
            spoa-hub sidecar's file-watch + graceful-reload picks it up without a
            restart. ADR-0007 captures the end-to-end flow. -#}
        {%- var hubConfig = render "spoa-hub-config-content" -%}
        {%- var _, regErr2 = fileRegistry.Register("file", "spoa-hub-config.toml", hubConfig) -%}
        {%- if regErr2 != nil %}
          {%- fail("failed to register spoa-hub-config.toml: " + regErr2.Error()) %}
        {%- end -%}
      {%- end -%}

  backends-100-spoa-hub:
    template: |
      {%- if (render "util-spoa-hub-enabled") == "true" %}
      {#- mode spop is the native SPOP backend mode introduced in HAProxy 3.1.
          On HAProxy 3.0 the proxy mode doesn't exist and the parser rejects
          it ("unknown proxy mode 'spop'"); fall back to mode tcp, which is
          the legacy SPOE transport. The filter spoe directive in the
          frontend handles the protocol either way. Operators can force tcp
          on 3.1+ by setting spoaHub.haproxy.modeSpop: false. -#}
      {%- var modeSpopRequested = extraContext | dig("spoaHub", "modeSpop") | fallback(true) | tostring() %}
      {%- var hapVersion = extraContext | dig("haproxyVersion") | fallback("") | tostring() %}
      {%- var spopSupported = semver_gte(hapVersion, "3.1") %}
      backend spoa-hub
          mode {%- if modeSpopRequested == "true" && spopSupported %} spop{%- else %} tcp{%- end %}
          timeout connect 5s
          timeout server  {{ extraContext | dig("spoaHub", "timeoutIdle") | fallback("5m") }}
          server hub {{ extraContext | dig("spoaHub", "socketPath") | fallback("/run/spoa/hub.sock") }} pool-low-conn 0 pool-max-conn {{ extraContext | dig("spoaHub", "poolMaxConn") | fallback(100) }} pool-purge-delay {{ extraContext | dig("spoaHub", "poolPurgeDelay") | fallback("30s") }}
      {%- end %}

  # Single-pass scan over all watched Ingresses for the two annotation
  # flavours that drive coraza behaviour:
  #   - nginx.ingress.kubernetes.io/modsecurity-snippet  (per-Ingress rule
  #     text → its OWN per-app WAF instance, bound to the Ingress's
  #     <host><path> via coraza-app.map; rules don't bleed into other
  #     Ingresses' traffic)
  #   - haproxy-ingress.github.io/waf                    (path-scoped opt-in
  #     dispatch via haproxy-ingress-waf.map; deny vs detect mode; routes to
  #     the default WAF unless the same Ingress also has a modsec-snippet)
  #
  # Cached via shared.ComputeIfAbsent("coraza_scan") so the scan runs at
  # most once per render — `spoa-hub-config-content` (per-app
  # `[plugins.params.applications."<ns>/<name>"]` block emission +
  # cross-annotation fail-loud), `frontend-spoe-filters-050-coraza`
  # (dispatch-mode decision), and `nginx-ingress.yaml`'s
  # map-coraza-app-* (coraza-app.map population) all consume the
  # same result. Validates the modsec-snippet triple-quote injection
  # vector inline (TOML multi-line basic strings have no escape;
  # allowing `"""` would let an Ingress-write RBAC holder break out of
  # the directives string and inject arbitrary TOML keys). Validates
  # host-less rules so a modsec-snippet without a host doesn't silently
  # become a no-op (the Ingress would have its own [[applications]]
  # entry but coraza-app.map wouldn't route any path to it).
  # Per-Ingress haproxy-ingress.github.io/waf validation lives in
  # haproxy-ingress.yaml's map snippet.
  util-coraza-scan:
    template: |-
      {%%
        var _, _ = shared.ComputeIfAbsent("coraza_scan", func() any {
          // Dedupe by `ns/name`. Under UPDATE admission overlays the
          // dryrun-validator's resource list can carry both the
          // existing Ingress AND the proposed-new version side-by-
          // side; without dedupe we'd emit two
          // `[plugins.params.applications."<ns>/<name>"]` headers and
          // the validator's TOML parser would reject with
          // `duplicate key`. The map keyed by ns/name keeps the LAST
          // seen entry, which under the overlay's append-after-base
          // ordering is the proposed version — exactly what the
          // dryrun-validator should be checking.
          var byKey = map[string]any{}
          var hasHaproxyIngressWaf = false
          for _, ingress := range resources.ingresses.List() {
            var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring()
            var name = ingress | dig("metadata", "name") | fallback("") | tostring()
            var snippet = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/modsecurity-snippet") | fallback("") | tostring()
            if snippet != "" {
              if strings_contains(snippet, "\"\"\"") {
                fail("Ingress " + ns + "/" + name + " annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' contains a TOML triple-quote delimiter (\"\"\"); this would break the rendered coraza directives multi-line string and is rejected. Remove the triple-quote sequence from the SecRule(s).")
              }
              // coraza-app.map is keyed by <ns>/<name> (resource id), not
              // by <host><path> — see frontend-spoe-filters-050-coraza
              // and base.yaml's resource_id extraction. Host-less rules
              // are fine because the routing chain still produces a
              // resource_id whatever path/host pattern matched.
              byKey[ns + "/" + name] = map[string]any{
                "ns": ns, "name": name, "snippet": snippet,
              }
            }
            var waf = ingress | dig("metadata", "annotations", "haproxy-ingress.github.io/waf") | fallback("") | tostring()
            if waf != "" {
              hasHaproxyIngressWaf = true
            }
          }
          // Reduce the map back to a deterministic-order slice for
          // emission. Sort the keys so the rendered TOML's
          // `[plugins.params.applications."<ns>/<name>"]` blocks come
          // out in stable namespace+name order across reconciliations.
          var sortedKeys = keys(byKey)
          var modsecApps = []any{}
          for _, k := range sortedKeys {
            modsecApps = append(modsecApps, byKey[k])
          }
          return map[string]any{
            "modsec_apps": modsecApps,
            "has_haproxy_ingress_waf": hasHaproxyIngressWaf,
          }
        })
      %%}

  # Renders the SPOA hub's runtime config.toml. Called from features-spoa-hub
  # via fileRegistry.Register("file", "spoa-hub-config.toml", ...). The
  # dataplane API delivers the rendered file to the haproxy pod, where the
  # spoa-hub sidecar's file-watch + graceful-reload (haproxy-spoa-hub MR1)
  # picks it up without a restart.
  #
  # The TOML mirrors the bootstrap configmap's shape (templates/spoa-hub-configmap.yaml)
  # — same plugin_dir, default_timeout_ms, [[listeners]], one [[plugins]]
  # block per enabled plugin, and a [plugins.params] block with the
  # operator's params: blob spliced verbatim. The runtime version differs in
  # one important place: for coraza, this snippet *appends* per-Ingress
  # `nginx.ingress.kubernetes.io/modsecurity-snippet` values into the
  # `directives = """..."""` field, sorted by `<ns>/<name>` for determinism,
  # so each Ingress's WAF rules land in the runtime hub without per-request
  # SPOE shipping. ADR-0007 captures the rationale.
  spoa-hub-config-content:
    template: |
      {%- var hub = extraContext | dig("spoaHub", "hub") | fallback(map[string]any{}) -%}
      {%- var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() -%}
      {%- var socketPath = extraContext | dig("spoaHub", "socketPath") | fallback("/run/spoa/hub.sock") | tostring() -%}

      {#- Coraza-relevant annotation scan (cached, single-pass — see
          util-coraza-scan). Used here for: (1) appending modsec-snippets
          into the directives string below, and (2) fail-loud when ANY
          coraza-targeting annotation (modsec-snippet OR
          haproxy-ingress.github.io/waf) is set without the plugin
          enabled. Silent ignore would hide a real misconfiguration:
          the operator wrote a per-Ingress WAF directive and nothing
          enforces it. The fail() at render time turns into a clear
          admission denial via the dryrun validator. -#}
      {%- var _ = render "util-coraza-scan" -%}
      {%- var corazaScan, _ = shared.ComputeIfAbsent("coraza_scan", func() any { return nil }) -%}
      {%- var modsecApps = corazaScan.(map[string]any)["modsec_apps"].([]any) -%}
      {%- var hasHaproxyIngressWaf = corazaScan.(map[string]any)["has_haproxy_ingress_waf"].(bool) -%}

      {%- if len(modsecApps) > 0 || hasHaproxyIngressWaf -%}
        {%- var corazaEnabled = false -%}
        {%- for _, p := range plugins -%}
          {%- var pName = p.(map[string]any)["name"].(string) -%}
          {%- if pName == "coraza" -%}
            {%- corazaEnabled = true -%}
          {%- end -%}
        {%- end -%}
        {%- if !corazaEnabled -%}
          {%- if len(modsecApps) > 0 -%}
            {%- var first = modsecApps[0].(map[string]any) -%}
            {{- fail("Ingress " + first["ns"].(string) + "/" + first["name"].(string) + " sets annotation 'nginx.ingress.kubernetes.io/modsecurity-snippet' but the spoaHub coraza plugin is not enabled. Either enable spoaHub.plugins.coraza or remove the annotation.") -}}
          {%- else -%}
            {#- has_haproxy_ingress_waf is true and modsec-snippets is empty —
                find the offending Ingress to point at in the error message. -#}
            {%- for _, ingress := range resources.ingresses.List() -%}
              {%- var w = ingress | dig("metadata", "annotations", "haproxy-ingress.github.io/waf") | fallback("") | tostring() -%}
              {%- if w != "" -%}
                {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
                {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
                {{- fail("Ingress " + ns + "/" + name + " sets annotation 'haproxy-ingress.github.io/waf' but the spoaHub coraza plugin is not enabled. Either enable spoaHub.plugins.coraza or remove the annotation.") -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

      plugin_dir = "{{ hub | dig("pluginDir") | fallback("/etc/haproxy-spoa-hub/plugins") }}"
      default_timeout_ms = {{ hub | dig("defaultTimeoutMs") | fallback(500) }}
      log_level = "{{ hub | dig("logLevel") | fallback("info") }}"
      max_connections = {{ hub | dig("maxConnections") | fallback(1000) }}
      blocking_thread_keep_alive_secs = {{ hub | dig("blockingThreadKeepAliveSecs") | fallback(30) }}
      {%- var workerThreads = hub | dig("workerThreads") -%}
      {%- if workerThreads != nil %}
      worker_threads = {{ workerThreads }}
      {%- end %}

      [[listeners]]
      type = "unix"
      address = "{{ socketPath }}"
      {% for _, plugin := range plugins %}
        {%- var p = plugin.(map[string]any) -%}
        {%- var pName = p["name"].(string) -%}
        {%- var pLibrary = p["library"].(string) -%}
        {%- var pMessages = p["messages"] | toSlice() -%}
        {%- var pTimeoutMs = p["timeoutMs"] -%}
        {%- var pDependsOn = p | dig("dependsOn") | fallback([]any{}) | toSlice() -%}
        {%- var pParams = p | dig("params") | fallback("") | tostring() -%}

      [[plugins]]
      name = "{{ pName }}"
      library = "{{ pLibrary }}"
      messages = [
        {%- for i, m := range pMessages -%}
          {%- if i > 0 -%}, {% end -%}
          "{{ m | tostring() }}"
        {%- end -%}
      ]
      timeout_ms = {{ pTimeoutMs }}
        {%- if len(pDependsOn) > 0 %}
      depends_on = [
          {%- for i, d := range pDependsOn -%}
            {%- if i > 0 -%}, {% end -%}
            "{{ d | tostring() }}"
          {%- end -%}
      ]
        {%- end %}

      [plugins.params]
        {%- var corazaDirectives = "" %}
        {%- if pName == "coraza" %}
          {#- Coraza-specific: emit the BASE directives only — no per-Ingress
              modsec-snippets. Each Ingress with a snippet gets its OWN
              [plugins.params.applications."<ns>/<name>"] block below, so
              its rules are scoped to that Ingress's traffic via
              coraza-app.map. Operators upgrading from the pre-multitenant
              chart who relied on rule bleed (one Ingress's SecRule firing
              on another Ingress's traffic) must move the shared rules
              into the chart-level `spoaHub.plugins.coraza.directives`
              values key. -#}
          {%- corazaDirectives = p | dig("directives") | fallback("") | tostring() %}
      directives = """
      {{ corazaDirectives | trimSpace() }}
      """
        {%- end %}
        {%- if pParams != "" %}
      {{ pParams | trimSpace() }}
        {%- end %}
        {%- if pName == "coraza" && len(modsecApps) > 0 %}
          {#- Per-app WAF instances. The plugin's config schema parses
              `applications` as a TOML table keyed by app name (see
              haproxy-spoa-hub-plugin-coraza/src/config.rs:124-130).
              `<ns>/<name>` is quoted because the slash isn't a bare-key
              char in TOML. Each block contains the chart-default base
              directives PRE-PENDED to the per-Ingress modsec-snippet,
              so per-app WAF instances inherit the base ruleset
              (operator's chart-wide config) plus their own custom
              rules. coraza-app.map (populated by nginx-ingress.yaml)
              binds <host><path> → "<ns>/<name>" so SPOE check-request
              sets `app=` and the plugin routes to this app's WAF. -#}
          {%- for _, app := range modsecApps %}
            {%- var a = app.(map[string]any) %}
            {%- var aNs = a["ns"].(string) %}
            {%- var aName = a["name"].(string) %}

      [plugins.params.applications."{{ aNs }}/{{ aName }}"]
      directives = """
      {{ corazaDirectives | trimSpace() }}

      # nginx-ingress modsecurity-snippet from {{ aNs }}/{{ aName }}
      {{ a["snippet"].(string) | trimSpace() }}
      """
          {%- end %}
        {%- end %}
      {# Newline between plugin iterations so the next [[plugins]] table
         header lands on its own line. Without it the rendered TOML
         reads `transaction_ttl_ms = 10000[[plugins]]` and the hub's
         reload bails with a parse error. {% end %} preserves the
         trailing newline; {%- end -%} would strip it. #}
      {% end %}

  spoe-conf-content:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      [spoa-hub]

      spoe-agent spoa-hub-agent
      {%- if len(messages) > 0 %}
          groups
            {%- for _, msg := range messages -%}
              {{ " " + msg + "-group" }}
            {%- end %}
      {%- end %}
          option var-prefix       hub
          option pipelining
          option async
          timeout hello      {{ extraContext | dig("spoaHub", "timeoutHello") | fallback("2s") }}
          timeout idle       {{ extraContext | dig("spoaHub", "timeoutIdle") | fallback("5m") }}
          timeout processing {{ extraContext | dig("spoaHub", "timeoutProcessing") | fallback("500ms") }}
          use-backend spoa-hub
      {{ render_glob "spoe-agents-*" }}
      {#- Per-message SPOE-message bodies. Each known plugin message
          gets its canonical body via a literal `render`; everything
          else falls back to a minimal stub so HAProxy accepts the
          group's reference. This dispatch is hard-coded because the
          Scriggo fork's `render` requires a string literal — adding
          a new plugin with a real body means adding a branch here.
          The leading blank line before each block is required: the
          HAProxy SPOE config parser uses blank lines as block
          separators. -#}
      {%- for _, msg := range messages %}

      {% if msg == "check-auth" -%}
      {{ render "spoe-message-check-auth-body" }}
      {%- else if msg == "check-request" -%}
      {{ render "spoe-message-check-request-body" }}
      {%- else if hasPrefix(msg, "mirror-") -%}
      {{ render "spoe-message-mirror-body" inherit_context }}
      {%- else -%}
      spoe-message {{ msg }}
          args ip=src
      {%- end %}
      {%- end %}

      {#- Per-message group definitions. Each message becomes a singleton
          group (`<msg>-group`) so frontends can trigger it explicitly
          via `http-request send-spoe-group spoa-hub-agent <msg>-group`. -#}
      {%- for _, msg := range messages %}

      spoe-group {{ msg }}-group
          messages {{ msg }}
      {%- end %}

  # Canonical spoe-message check-auth body. Rendered by name from
  # spoe-conf-content's per-message dispatch when "check-auth" is in
  # the messages union. Args follow the haproxy-spoa-hub external-auth
  # plugin's documented contract:
  #
  #   - auth_url   (required) — drives the auth-url annotation lookup
  #   - method     (optional, v0.3.0+) — per-request HTTP method override
  #     for the auth subrequest, populated from the
  #     {nginx.ingress.kubernetes.io,haproxy-ingress.github.io}/auth-method
  #     annotations via auth-method.map. The plugin treats an empty
  #     value as "no override" and falls back to its plugin-level
  #     config, so routes without the annotation behave unchanged.
  #   - forward_headers (optional, v0.3.0+) — comma-separated list of
  #     request header names to forward to the auth service, populated
  #     from the haproxy-ingress.github.io/auth-headers-request
  #     annotation via auth-forward-headers.map. The plugin replaces
  #     its plugin-level forward_headers list with this when the arg
  #     is non-empty; empty (no annotation) falls back to the default.
  #   - extract_headers (optional, v0.3.0+) — comma-separated list of
  #     response header names to extract from the auth reply (on every
  #     reply path: 2xx, 3xx, 4xx, 5xx). Each extracted header becomes
  #     a transaction variable `txn.hub.external_auth.<name>` (with
  #     dashes → underscores). Populated as the union of pass + fail
  #     headers per ingress from auth-extract-headers.map; the
  #     ingress libraries themselves emit per-route per-header
  #     `set-header` (pass) and `deny ... hdr` (fail) directives that
  #     consume those vars.
  #
  # The plugin v0.3.0 also accepts `client_cert` / `client_key` SPOE
  # args for per-request mTLS to the auth service, but no upstream
  # ingress controller (nginx-ingress / haproxy-ingress) exposes a
  # typed annotation for "auth subrequest mTLS" — only for incoming
  # client-cert verification (a different feature). The chart
  # therefore does not wire `client_cert` / `client_key`. Operators
  # who need subrequest mTLS can extend the args= line with their
  # own SPOE arg sources (e.g. via the chart's user-config layer).
  #
  # The hardcoded `hdr_*` args at the end of the line capture the six
  # standard auth headers (Authorization, Cookie, X-Forwarded-*).
  # Ingress libraries can extend the captured set via the
  # `spoe-message-check-auth-extra-args-*` glob — e.g. haproxy-ingress
  # contributes one `hdr_<name>=req.hdr(<Name>)` per unique header
  # listed in any ingress's `auth-headers-request` annotation, so the
  # annotation alone determines what headers reach the auth service
  # (the plugin's `forward_headers` arg then narrows per-route).
  #
  # The plugin writes back the response variables
  # txn.hub.external_auth.allowed (bool) and ...status_code (uint32).
  spoe-message-check-auth-body:
    template: |-
      spoe-message check-auth
          args auth_url=var(txn.auth_url) path=path method=var(txn.auth_method) forward_headers=var(txn.auth_forward_headers) extract_headers=var(txn.auth_extract_headers) hdr_authorization=req.hdr(Authorization) hdr_cookie=req.hdr(Cookie) hdr_x_forwarded_for=req.hdr(X-Forwarded-For) hdr_x_forwarded_proto=req.hdr(X-Forwarded-Proto) hdr_x_forwarded_host=req.hdr(X-Forwarded-Host) hdr_x_forwarded_uri=req.hdr(X-Forwarded-Uri){{- render_glob "spoe-message-check-auth-extra-args-*" -}}

  # Canonical spoe-message check-request body. Args follow the
  # haproxy-spoa-hub-plugin-coraza message contract (plugin.rs:266-307):
  #
  #   - src-ip / src-port / dst-ip / dst-port — connection metadata for
  #     phase-1 connection rules and IP-based SecRules.
  #   - method / path / query / version — URI and request-line fields
  #     for phase-1 URI rules. Coraza canonicalizes path before
  #     SecRule evaluation; query is appended to the URI internally.
  #   - headers — the full request header block in HTTP wire format
  #     (`Name: Value\r\n`). The coraza plugin's parser expects this
  #     text shape (see `parse_haproxy_headers` in
  #     haproxy-spoa-hub-plugin-coraza/src/plugin.rs); HAProxy emits
  #     it via `req.hdrs`. **Not** `req.hdrs_bin` — that returns
  #     varint-encoded SPOE-wire bytes which the plugin would split
  #     wrong, leaving header-targeted SecRules
  #     (`REQUEST_HEADERS:X-*`) silently unmatched.
  #   - body — phase-2 body inspection. HAProxy buffers up to
  #     `tune.bufsize` bytes; SecRules see whatever was buffered when
  #     the request body completed (or was cut off by maxbody).
  #
  # `app` is intentionally omitted — single-WAF deployments use the
  # default WAF instance the plugin loads from `params.directives`.
  # Multi-tenant operators can add an `app=<expr>` to the args= line
  # via a chart user-override snippet to route per-tenant rule sets.
  #
  # The plugin writes back txn.hub.coraza.{action,status,rule_id,
  # anomaly_score,rules_hit,data}; the dispatcher in
  # frontend-spoe-filters-050-coraza denies on
  # rule_id >= 1 AND action == "deny".
  #
  # `app=var(txn.coraza_app)` carries the per-Ingress WAF identifier
  # that the chart's `coraza-app.map` lookup populates from the
  # request's resource_id. The coraza plugin reads this in `process()`
  # (haproxy-spoa-hub-plugin-coraza/src/plugin.rs:370) and routes the
  # request to that app's WAF instance — the per-Ingress
  # [plugins.params.applications."<ns>/<name>"] block. When unset, the
  # plugin falls through to the default WAF (chart-default base
  # directives only). This is the multi-tenancy lever: per-Ingress
  # custom rules don't fire on other Ingresses' traffic.
  spoe-message-check-request-body:
    template: |-
      spoe-message check-request
          args src-ip=src src-port=src_port dst-ip=dst dst-port=dst_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body app=var(txn.coraza_app)

  # Canonical spoe-message mirror body. Rendered by name from
  # spoe-conf-content's per-message dispatch when "mirror" is in the
  # messages union (i.e. spoaHub.plugins.mirror is enabled). Args follow
  # the haproxy-spoa-hub-plugin-mirror plugin's contract
  # (haproxy-spoa-hub-plugin-mirror/src/request.rs):
  #
  #   - arg_target  : the mirror backend's <host:port>. Sourced from
  #     `var(txn.gw_mirror_target)` — set per-request by the gateway
  #     library's frontend-filter snippet when a route's RequestMirror
  #     filter matches. Different routes set different targets; the
  #     plugin reads the var-sourced value off each NOTIFY frame and
  #     dispatches dynamically, so a single spoe-message block covers
  #     every HTTPRoute mirror filter in the cluster.
  #   - arg_scheme  : "http" or "https". Same per-request variable
  #     pattern as arg_target. The chart currently only emits "http"
  #     (BackendTLSPolicy-style TLS mirroring is a v0.2 plugin feature);
  #     the variable plumbing is here so flipping in the future is a
  #     chart-side change, not a plugin contract change.
  #   - arg_method / arg_path / arg_query / arg_ver — request-line
  #     fields, pulled directly from HAProxy's request fetches.
  #   - arg_hdrs    : `req.hdrs_bin` — HAProxy's varint-prefixed wire
  #     format for the full header block. The plugin's request.rs
  #     parses this directly; using `req.hdrs` (text form) would
  #     mismatch.
  #   - arg_body    : raw request body, capped at the plugin's
  #     `max_body_bytes`. Requires `option http-buffer-request` on the
  #     consuming frontend (the gateway library forces this on any
  #     frontend with a RequestMirror filter); without it, PUT/POST
  #     bodies arrive empty here and the mirror sees zero-byte requests.
  #
  # The mirror plugin never writes back into HAProxy variables; the
  # ack is fire-and-forget. No `output_var` configuration needed.
  # Body for indexed mirror messages (`mirror-1`, `mirror-2`, ...).
  # Receives `msg` via inherit_context from spoe-conf-content's
  # per-message dispatch loop. The trailing index is what makes each
  # message + group unique per stream — HAProxy SPOE only processes
  # each group once per stream ("only one call to a group is allowed
  # per stream" per the docs), so HTTPRoutes carrying N mirror filters
  # need N distinct (message, group) pairs to actually trigger N
  # NOTIFY frames. The chart's frontend filter snippet (gateway library)
  # emits per-filter `set-var(txn.gw_mirror_target_<i>) ...`,
  # `send-spoe-group spoa-hub mirror-<i>-group ...` triples; the message
  # body below reads from the corresponding indexed txn variable. The
  # plugin's process() only inspects SPOE args, not the message name —
  # so all `mirror-<i>` messages route to the same plugin and dispatch
  # identically (just to different targets via the indexed var).
  spoe-message-mirror-body:
    template: |-
      {%- var idx = replace(msg, "mirror-", "") -%}
      spoe-message {{ msg }}
          args arg_target=var(txn.gw_mirror_target_{{ idx }}) arg_scheme=var(txn.gw_mirror_scheme_{{ idx }}) arg_method=method arg_path=path arg_query=query arg_ver=req.ver arg_hdrs=req.hdrs_bin arg_body=req.body

  frontend-filters-100-spoa-hub:
    template: |-
      {%- if (render "util-spoa-hub-enabled") == "true" %}

      filter spoe engine spoa-hub config {{ pathResolver.GetPath("spoe.conf", "file") }}
      {{- render_glob "frontend-spoe-filters-*" }}
      {%- end %}

  # Coraza WAF dispatch. Triggers the check-request SPOE message and
  # denies on rule match. The plugin's response sets
  # `txn.hub.coraza.rule_id` (uint32, 0 if no rule matched) and
  # `txn.hub.coraza.action` ("allow"/"deny"/...). We deny only when
  # BOTH conditions hold:
  #   - rule_id >= 1: a real SecRule matched. The plugin's allowResult()
  #     and denyResult() error path both leave rule_id at zero, so this
  #     gate filters out "WAF init failed and we're denying every
  #     request" or "rule engine off" failure modes that would otherwise
  #     turn the deny into a default-deny on the whole frontend.
  #   - action == "deny": the plugin's interruption decision was an HTTP
  #     block (vs "drop" / "redirect" which would need different HAProxy
  #     actions). Today the chart only emits 403 deny, so drop/redirect
  #     actions correctly fall through to backend.
  #
  # Multi-tenant per-path dispatch (no rule bleed across Ingresses):
  #
  # Two maps drive the per-path lookup:
  #   - coraza-app.map (populated by nginx-ingress.yaml's
  #     map-coraza-app-* snippet): `<host><path>` → `<ns>/<name>` for
  #     Ingresses that carry `nginx.ingress.kubernetes.io/modsecurity-snippet`.
  #     The matching app's `[plugins.params.applications."<ns>/<name>"]`
  #     block carries the chart-default base directives + that
  #     Ingress's per-Ingress rules. The plugin routes via the `app=`
  #     SPOE arg below.
  #   - haproxy-ingress-waf.map (populated by haproxy-ingress.yaml's
  #     map-haproxy-ingress-waf-* snippet): `<host><path>` → `deny|detect`
  #     for Ingresses with `haproxy-ingress.github.io/waf`. Drives the
  #     deny-skip predicate below for shadow-mode rollouts.
  #
  # Dispatch fires when EITHER map matches the current resource_id.
  # Resources without any matching annotation skip the SPOE roundtrip entirely
  # (matches haproxy-ingress.github.io upstream semantic). The
  # haproxy-ingress.github.io/waf-mode annotation only matters when a
  # `/waf` annotation is also present; without `/waf` the deny rule
  # falls back to its default (deny on rule match).
  #
  # **Behavior change vs pre-multitenant chart:** previously, ANY
  # nginx.ingress.kubernetes.io/modsecurity-snippet anywhere chart-wide
  # caused unconditional dispatch on EVERY request (rules pooled into a
  # single global WAF instance, evaluating against all traffic).
  # That's a privilege-escalation vector in multi-tenant clusters.
  # Now, modsec-snippets only fire on traffic owned by their carrying
  # Ingress (resource_id keying). Operators who depended on the
  # rule-bleed behavior must
  # move shared rules into chart-level
  # `spoaHub.plugins.coraza.directives` (the base ruleset, applied to
  # every per-Ingress app + the default WAF).
  #
  # Priority 050 runs the WAF pass BEFORE the external-auth subrequest
  # at priority 100 — standard "WAF first, auth second" pipeline. Emits
  # nothing unless `check-request` is in the chart's messages union
  # (i.e. coraza is enabled).
  frontend-spoe-filters-050-coraza:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-request" %}
      {%- var dispatchMode = extraContext | dig("coraza", "dispatch", "mode") | fallback("opt-in") | tostring() %}
      {%- var defaultEnforcement = extraContext | dig("coraza", "dispatch", "defaultEnforcement") | fallback("deny") | tostring() %}
      {%- if dispatchMode != "opt-in" && dispatchMode != "default-on" %}
        {%- fail("Invalid value for controller.templatingSettings.extraContext.coraza.dispatch.mode: '" + dispatchMode + "'; must be 'opt-in' or 'default-on'.") %}
      {%- end %}
      {%- if defaultEnforcement != "deny" && defaultEnforcement != "detect" %}
        {%- fail("Invalid value for controller.templatingSettings.extraContext.coraza.dispatch.defaultEnforcement: '" + defaultEnforcement + "'; must be 'deny' or 'detect'.") %}
      {%- end %}
      http-request set-var(txn.coraza_app) var(txn.resource_id),map({{ pathResolver.GetPath("coraza-app.map", "map") }}) unless { var(txn.coraza_app) -m found }
      http-request set-var(txn.coraza_mode) var(txn.resource_id),map({{ pathResolver.GetPath("haproxy-ingress-waf.map", "map") }}) unless { var(txn.coraza_mode) -m found }
      {%- if dispatchMode == "default-on" %}
      http-request set-var(txn.coraza_disabled) var(txn.resource_id),map({{ pathResolver.GetPath("coraza-disabled.map", "map") }}) unless { var(txn.coraza_disabled) -m found }
      http-request set-var(txn.coraza_mode) str({{ defaultEnforcement }}) unless { var(txn.coraza_mode) -m found }
      http-request send-spoe-group spoa-hub check-request-group unless { var(txn.coraza_disabled) -m found }
      {%- else %}
      http-request send-spoe-group spoa-hub check-request-group if { var(txn.coraza_app) -m found } || { var(txn.coraza_mode) -m found }
      {%- end %}
      http-request deny deny_status 403 if { var(txn.hub.coraza.rule_id) -m int 1: } { var(txn.hub.coraza.action) -m str deny } !{ var(txn.coraza_mode) -m str detect }
      {%- end %}

  # coraza-app.map population. Lives here in spoa-hub.yaml (not
  # nginx-ingress.yaml) for the same reason util-coraza-scan does:
  # the modsec-snippet annotation scan is cross-library precedent —
  # spoa-hub renders the per-app blocks regardless of whether the
  # nginx-ingress library is loaded, so the map that routes traffic
  # to those apps must also render regardless. validate-helm-libraries
  # CI renders the chart without nginx-ingress and would otherwise
  # leave coraza-app.map empty while the per-app blocks still exist
  # in the rendered TOML — apps configured but unreachable.
  #
  # Walks the cached util-coraza-scan output and emits one
  # `<ns>/<name> <ns>/<name>` identity row per ingress that has the
  # modsecurity-snippet annotation. The map is consumed via
  # `var(txn.resource_id),map(...)` (see frontend-spoe-filters-050-coraza),
  # so the value sent to the SPOE plugin is the resource id itself.
  # Sorted implicitly by MemoryStore.List() (namespace+name) for
  # deterministic output across reconciliations.
  map-coraza-app-500-spoa-hub:
    template: |-
      {%- var _ = render "util-coraza-scan" -%}
      {%- var corazaScan, _ = shared.ComputeIfAbsent("coraza_scan", func() any { return nil }) -%}
      {%- if corazaScan != nil -%}
        {%- var modsecApps = corazaScan.(map[string]any)["modsec_apps"].([]any) -%}
        {%- for _, app := range modsecApps -%}
          {%- var a = app.(map[string]any) -%}
          {%- var aNs = a["ns"].(string) -%}
          {%- var aName = a["name"].(string) -%}
      {{ "\n" }}{{ aNs }}/{{ aName }} {{ aNs }}/{{ aName }}
        {%- end -%}
      {%- end -%}

  # Coraza WAF per-Ingress opt-out under default-on dispatch. Lives in
  # spoa-hub.yaml (not nginx-ingress.yaml) for the same reason
  # map-coraza-app-500-spoa-hub does: the dispatch logic in
  # frontend-spoe-filters-050-coraza references coraza-disabled.map
  # regardless of which annotation library is loaded, so the snippet
  # populating it must render regardless too. Otherwise the validate-
  # helm-libraries CI (which renders without nginx-ingress) would
  # silently skip annotation-rejection diagnostics.
  #
  # Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#modsecurity
  #
  # Annotation:
  #   nginx.ingress.kubernetes.io/enable-modsecurity: "false"
  #     → entry in coraza-disabled.map; the path is excluded from the
  #       unconditional default-on dispatch in
  #       frontend-spoe-filters-050-coraza.
  #
  # `enable-modsecurity: "true"` is silently allowed but doesn't
  # produce any map entry — opt-in under default `mode: opt-in` is
  # already handled by `modsecurity-snippet` (rule customisation
  # implies opt-in for that path) and the haproxy-ingress.github.io
  # `waf: modsecurity` annotation. Adding a third opt-in path bloats
  # scope without filling a gap. Other values fail loud.
  map-coraza-disabled-500-spoa-hub:
    template: |-
      {#- Keyed by `<ns>/<name>` (resource id), consumed at request time
          via var(txn.resource_id),map(...). The host dimension is no
          longer part of the key, so host-less Ingress rules are fine
          (the routing chain still resolves them to a resource_id). -#}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {%- var v = ingress | dig("metadata", "annotations", "nginx.ingress.kubernetes.io/enable-modsecurity") | fallback("") | tostring() -%}
        {%- if v == "false" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
      {{ "\n" }}{{ ns }}/{{ name }} 1
        {%- else if v != "" && v != "true" -%}
          {%- var ns = ingress | dig("metadata", "namespace") | fallback("") | tostring() -%}
          {%- var name = ingress | dig("metadata", "name") | fallback("") | tostring() -%}
          {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/enable-modsecurity: \"" + v + "\"; allowed values are \"true\" or \"false\".") -}}
        {%- end -%}
      {%- end -%}

  # External-auth wiring: looks up the per-ingress auth URL in
  # auth-url.map (populated by ingress libraries from their auth-url
  # annotation), triggers the SPOE check, and denies on failure.
  # Conditional on `check-auth` being in the chart's messages union —
  # only emits when the external-auth plugin is enabled.

  frontend-spoe-filters-100-external-auth:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-auth" %}
      http-request set-var(txn.auth_url) var(txn.resource_id),map({{ pathResolver.GetPath("auth-url.map", "map") }}) unless { var(txn.auth_url) -m found }
      http-request set-var(txn.auth_signin) var(txn.resource_id),map({{ pathResolver.GetPath("auth-signin.map", "map") }}) unless { var(txn.auth_signin) -m found }
      http-request set-var(txn.auth_method) var(txn.resource_id),map({{ pathResolver.GetPath("auth-method.map", "map") }}) unless { var(txn.auth_method) -m found }
      http-request set-var(txn.auth_forward_headers) var(txn.resource_id),map({{ pathResolver.GetPath("auth-forward-headers.map", "map") }}) unless { var(txn.auth_forward_headers) -m found }
      http-request set-var(txn.auth_extract_headers) var(txn.resource_id),map({{ pathResolver.GetPath("auth-extract-headers.map", "map") }}) unless { var(txn.auth_extract_headers) -m found }
      http-request send-spoe-group spoa-hub check-auth-group if { var(txn.auth_url) -m found }
      {#- Pass-headers extension point: ingress libraries emit one
          `http-request set-header` per unique header in any
          ingress's auth-response-headers / auth-headers-succeed union.
          Each line is gated on `allowed -m bool` (only on auth
          success) and `var ... -m found` (only when the plugin
          actually extracted that header). Empty when no ingress
          uses the annotation. The `{{ "\n" }}` after the glob
          emits a literal newline regardless of whether the glob
          matched anything — without it, when the glob is empty the
          adjacent `{#- ... -#}` trim markers collapse the
          send-spoe-group line into the redirect line. -#}
      {{- render_glob "frontend-spoe-set-pass-headers-*" }}{{ "\n" }}
      {#- Browser-friendly sign-in redirect on auth failure: if the
          ingress has `auth-signin`, redirect to it (302) instead of
          denying. The deny rule below still fires when auth-signin
          isn't configured, preserving the API-friendly default. -#}
      http-request redirect location %[var(txn.auth_signin)] code 302 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.auth_signin) -m found }
      http-request deny deny_status 401 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool }
      {#- Fail-headers extension point: ingress libraries emit one
          `http-after-response set-header` per unique header in any
          ingress's auth-headers-fail union. Runs on the deny
          response (and only that — the conditions gate on the
          auth path having run AND not allowed AND the per-header
          var being set). `http-after-response` rather than
          `http-response` because HAProxy's `http-request deny`
          short-circuits the request flow, generating its 401 reply
          internally; `http-response` rules only fire on responses
          received from a backend, so they'd silently skip the deny
          path. Empty when no ingress uses the annotation. Same
          trailing-newline trick as the pass-headers glob. -#}
      {{- render_glob "frontend-spoe-set-fail-headers-*" }}{{ "\n" }}
      {%- end %}

maps:
  coraza-app.map:
    template: |
      # Coraza WAF: per-Ingress per-app routing for multi-tenant rule
      # isolation. Keyed by `<ns>/<name>` (resource id from
      # `txn.resource_id`, set by base.yaml from the routing chain's
      # qualifier value); the value is the same `<ns>/<name>` matching
      # the rendered `[plugins.params.applications."<ns>/<name>"]`
      # block in spoa-hub-config.toml.
      #
      # The frontend filter sets `txn.coraza_app` from this lookup and
      # the SPOE check-request message passes it as `app=` to the
      # plugin, which routes the request to that app's WAF instance.
      # Per-Ingress rules from `nginx.ingress.kubernetes.io/modsecurity-snippet`
      # only fire on traffic the routing chain attributes to the
      # carrying Ingress — they don't bleed into other Ingresses'
      # traffic.
      #
      # Empty / no entry → SPOE arg is empty → plugin falls through to
      # the default WAF (chart-default base directives only).
      # Populated by spoa-hub.yaml's own map-coraza-app-500-spoa-hub
      # snippet (cross-library scan via util-coraza-scan; lives here
      # rather than in nginx-ingress.yaml so the map renders even when
      # the nginx-ingress library isn't loaded — matches where the
      # per-app `[plugins.params.applications]` blocks are rendered).
      {{- render_glob "map-coraza-app-*" -}}

  haproxy-ingress-waf.map:
    template: |
      # Coraza WAF: per-Ingress opt-in driven by
      # haproxy-ingress.github.io/waf and /waf-mode annotations. Keyed
      # by `<ns>/<name>` (resource id from `txn.resource_id`). The
      # value is the resolved enforcement mode for the resource:
      #   - "deny"   — default; blocks on rule_id >= 1 && action == deny
      #   - "detect" — shadow mode; runs the WAF, txn.hub.coraza.* vars
      #                are populated, but the deny rule is skipped via
      #                `!{ var(txn.coraza_mode) -m str detect }`
      # Empty / no entry → no opt-in for that resource; under
      # conditional dispatch the request skips the SPOE roundtrip
      # entirely. Populated
      # by haproxy-ingress.yaml's map-haproxy-ingress-waf-500-* snippet.
      {{- render_glob "map-haproxy-ingress-waf-*" -}}

  coraza-disabled.map:
    template: |
      # Coraza WAF: per-Ingress opt-out under default-on dispatch
      # (controller.templatingSettings.extraContext.coraza.dispatch.mode
      # == "default-on"). Keyed by host+path; presence of an entry
      # excludes the path from the unconditional send-spoe-group
      # dispatch in `frontend-spoe-filters-050-coraza`.
      #
      # Populated by nginx-ingress.yaml's
      # map-coraza-disabled-500-nginx-ingress snippet from the
      # `nginx.ingress.kubernetes.io/enable-modsecurity: "false"`
      # annotation. Empty under default `mode: opt-in` (no opt-out
      # gate is needed when the dispatch is already gated per-path).
      {{- render_glob "map-coraza-disabled-*" -}}

  auth-url.map:
    template: |
      # External-auth: per-ingress auth-url annotation values.
      # Keyed by `<ns>/<name>` (resource id from `txn.resource_id`).
      # Populated by ingress libraries' map-auth-url-* contributions.
      {{- render_glob "map-auth-url-*" -}}

  auth-signin.map:
    template: |
      # External-auth: per-ingress sign-in URL for browser redirect on
      # auth failure. When set for a route, an auth failure produces a
      # 302 to this URL instead of a 401 — the standard pattern for
      # OIDC / SAML browser flows where the auth service redirects
      # unauthenticated users to a login page.
      # Populated by ingress libraries' map-auth-signin-* contributions.
      {{- render_glob "map-auth-signin-*" -}}

  auth-forward-headers.map:
    template: |
      # External-auth: per-ingress allowlist of request headers to
      # forward to the auth service. Populated by ingress libraries'
      # map-auth-forward-headers-* contributions from the
      # `haproxy-ingress.github.io/auth-headers-request` annotation
      # (no nginx-ingress equivalent — `auth-snippet` is freeform
      # HAProxy config injection, out of scope for templated wiring).
      # The value flows into the SPOE message's `forward_headers` arg
      # as a comma-separated list. Empty value (no annotation) → the
      # plugin falls back to its plugin-level forward_headers config.
      {{- render_glob "map-auth-forward-headers-*" -}}

  auth-extract-headers.map:
    template: |
      # External-auth: per-ingress union of response header names the
      # plugin should extract from the auth reply. Populated by ingress
      # libraries' map-auth-extract-headers-* contributions; each entry
      # is the comma-separated union of that ingress's
      # `auth-response-headers` / `auth-headers-succeed` and
      # `auth-headers-fail` annotation values. The value flows into the
      # SPOE message's `extract_headers` arg as a comma list; the
      # plugin then publishes each extracted header as a transaction
      # variable `txn.hub.external_auth.<name>` (with dashes →
      # underscores) and the ingress libraries' frontend
      # `set-header` (pass) / `deny ... hdr` (fail) snippets consume
      # those vars per-route. Empty value (no annotation) → no
      # per-route extraction; the plugin uses its plugin-level
      # extract_headers config.
      {{- render_glob "map-auth-extract-headers-*" -}}


  auth-method.map:
    template: |
      # External-auth: per-ingress HTTP method override for the auth
      # subrequest. Populated by ingress libraries' map-auth-method-*
      # contributions from the
      # `{nginx.ingress.kubernetes.io,haproxy-ingress.github.io}/auth-method`
      # annotations. The value flows into the SPOE message's `method`
      # arg (see spoe-message-check-auth-body); the external-auth
      # plugin v0.3.0+ treats an empty value as "no override" and falls
      # back to its plugin-level method config.
      {{- render_glob "map-auth-method-*" -}}

validationTests:
  test-spoa-hub-disabled:
    description: |
      With extraContext.spoaHub.enabled=false (or missing), the
      library must not emit the `backend spoa-hub` block, the SPOE
      filter, or any spoe.conf reference.
    extraContext:
      spoaHub:
        enabled: false
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid when spoaHub is disabled
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must not appear when spoaHub.enabled is false
      - type: not_contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub"
        description: SPOE filter must not appear when spoaHub.enabled is false

  test-spoa-hub-rendering:
    # The fixture below pins haproxyVersion=3.2 so the rendered backend
    # uses `mode spop` (which is what the assertions assume). On a 3.0
    # haproxy binary that line is a parser error — `mode spop` was
    # introduced in 3.1. test-spoa-hub-mode-tcp-on-haproxy-3-0 covers
    # the 3.0 fallback path; this test is skipped there.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      With extraContext.spoaHub.enabled=true and `check-auth` in the
      messages union, the library emits the spoa-hub backend, the SPOE
      filter directive, the per-message group + canonical message body,
      and the external-auth frontend wiring (auth-url lookup, group
      trigger, deny rule).
    extraContext:
      # Pin the HAProxy version to 3.1+ so the rendered backend uses
      # `mode spop` (the assertion below requires it). Native SPOP
      # was introduced in HAProxy 3.1; on 3.0 the chart falls back to
      # `mode tcp`. test-spoa-hub-rendering-mode-tcp-on-haproxy30
      # covers that fallback path.
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      # Trigger the http_frontend (where the SPOE filter directive +
      # frontend-filters auth-flow assertions live). The auth-url
      # annotation also activates the external-auth dispatch path so
      # the `http-request send-spoe-group ... check-auth-group` and
      # `deny deny_status 401` assertions actually have a route to
      # apply to. After the bind-derivation refactor, an empty
      # fixture leaves the http_frontend unrendered.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: auth-trigger
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "http://auth.svc.cluster.local/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with spoaHub enabled
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must appear when spoaHub is enabled
      - type: contains
        target: haproxy.cfg
        pattern: "mode spop"
        description: Backend uses native SPOP mode by default
      - type: contains
        target: haproxy.cfg
        pattern: "server hub /run/spoa/hub.sock"
        description: Server points at the hub's Unix-domain socket
      - type: contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub config"
        description: Frontends include the SPOE filter directive
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend explicitly triggers the auth group when auth_url is set
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-agent spoa-hub-agent"
        description: spoe.conf declares the spoa-hub agent
      - type: contains
        target: file:spoe.conf
        pattern: "groups check-auth-group"
        description: Agent's groups line references the auth group
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-message check-auth"
        description: Canonical spoe-message check-auth body is emitted
      - type: contains
        target: file:spoe.conf
        pattern: "args auth_url=var\\(txn.auth_url\\)"
        description: Message args include the auth_url binding
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-group check-auth-group"
        description: Group definition references the message

  # Regression: an Ingress with haproxy.org/forwarded-for=true triggers
  # the haproxytech library to emit `option forwardfor` in the frontend
  # at priority 100. The spoa-hub library's frontend-filters-100-* runs
  # next (alphabetical tie-break), so its output must start on a new
  # line — otherwise we get `option forwardforfilter spoe engine ...`
  # (a real bug found in CI when both snippets co-rendered).
  test-spoa-hub-frontend-filters-newline-after-forwardfor:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      When haproxytech's option-forwardfor and the spoa-hub filter spoe
      directive both render at frontend-filters priority 100, they must
      be on separate lines. Catches the cycle 4 part C bug where the
      `{%- if` in spoa-hub's snippet stripped the separating newline.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: ff-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ff-ingress
            annotations:
              haproxy.org/forwarded-for: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ff.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ff-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy must validate (the concat bug produces invalid syntax)
      - type: not_contains
        target: haproxy.cfg
        pattern: "forwardforfilter"
        description: option forwardfor and filter spoe must not concatenate

  test-spoa-hub-mode-tcp-on-haproxy-3-0:
    description: "On HAProxy 3.0 the `spop` proxy mode doesn't exist (introduced in 3.1). The chart must auto-fall-back the spoa-hub backend to `mode tcp` — both transports work with the SPOE filter; mode spop is just..."
    extraContext:
      haproxyVersion: "3.0"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: Rendered config must validate (mode tcp is valid on 3.0)
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend present
      - type: contains
        target: haproxy.cfg
        pattern: "mode tcp"
        description: Backend uses mode tcp on HAProxy 3.0
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub\\n    mode spop"
        description: Backend must NOT use mode spop on HAProxy 3.0

