        description: Fingerprinting params blob is spliced

  # =============================================================================
  # Coraza dispatch mode (controller.templatingSettings.extraContext.coraza.dispatch)
  # =============================================================================

  test-coraza-dispatch-opt-in-default:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      Default dispatch mode (`opt-in`) keeps the per-Ingress-gated
      send-spoe-group line and does NOT emit the coraza-disabled.map
      lookup or the str(deny) fallback. Regression test that the new
      branch doesn't leak into the default rendering.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all. The Ingress carries no coraza-* annotation so the
      # opt-in path's "no Ingress opted in" assertions still hold.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid in opt-in mode
      - type: contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub check-request-group if \{ var\(txn\.coraza_app\) -m found \} \|\| \{ var\(txn\.coraza_mode\) -m found \}'
        description: Conditional dispatch line is emitted (per-Ingress gated)
      - type: not_contains
        target: haproxy.cfg
        pattern: 'coraza-disabled\.map'
        description: coraza-disabled.map lookup is NOT emitted in opt-in mode
      - type: not_contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_mode\) str\('
        description: str(deny|detect) fallback is NOT emitted in opt-in mode

  test-coraza-dispatch-default-on-no-annotations:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      With dispatch.mode=default-on and no per-Ingress annotations,
      the rendered haproxy.cfg has the unconditional send-spoe-group
      line gated only on the coraza-disabled map lookup, plus the
      str(deny) fallback for txn.coraza_mode. coraza-disabled.map
      is empty (no Ingress opted out).
    extraContext:
      haproxyVersion: "3.2"
      coraza:
        dispatch:
          mode: default-on
          defaultEnforcement: deny
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all. The Ingress carries no coraza-* annotation so the
      # default-on path's "coraza-disabled.map is empty" assertion
      # still holds.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid in default-on mode
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_disabled\).*coraza-disabled\.map'
        description: coraza-disabled.map lookup is emitted
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_mode\) str\(deny\) unless \{ var\(txn\.coraza_mode\) -m found \}'
        description: str(deny) fallback for coraza_mode is emitted
      - type: contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub check-request-group unless \{ var\(txn\.coraza_disabled\) -m found \}'
        description: Unconditional dispatch line is emitted (gated only on opt-out)
      - type: not_contains
        target: haproxy.cfg
        pattern: 'send-spoe-group spoa-hub check-request-group if \{ var\(txn\.coraza_app\)'
        description: Old per-Ingress-gated dispatch line is NOT emitted in default-on mode

  test-coraza-dispatch-default-on-detect:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      With dispatch.mode=default-on and defaultEnforcement=detect, the
      str fallback line uses str(detect) so the existing deny-rule
      predicate `!{ var(txn.coraza_mode) -m str detect }` short-
