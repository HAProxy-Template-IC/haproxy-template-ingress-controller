      waf-mode annotation override.
    extraContext:
      haproxyVersion: "3.2"
      coraza:
        dispatch:
          mode: default-on
          defaultEnforcement: detect
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
            params: ""
    fixtures:
      # Trigger the http_frontend so the Coraza dispatch lines (which
      # render inside frontend-filters-*) can emit. After the bind-
      # derivation refactor, an empty fixture leaves no http_frontend
      # at all.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: trigger
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid in default-on detect mode
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.coraza_mode\) str\(detect\) unless \{ var\(txn\.coraza_mode\) -m found \}'
        description: str(detect) fallback is emitted
      - type: contains
        target: haproxy.cfg
        pattern: '!\{ var\(txn\.coraza_mode\) -m str detect \}'
        description: Existing deny-rule short-circuit predicate is preserved

  test-coraza-dispatch-default-on-with-opt-out:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: |
      With dispatch.mode=default-on and one Ingress carrying
      nginx.ingress.kubernetes.io/enable-modsecurity: "false", the
      coraza-disabled.map gets a `<ns>/<name> 1` entry; the
      send-spoe-group dispatch line is gated only on
      txn.coraza_disabled (so the opted-out resource skips the WAF).
    extraContext:
      haproxyVersion: "3.2"
      coraza:
        dispatch:
          mode: default-on
          defaultEnforcement: deny
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
