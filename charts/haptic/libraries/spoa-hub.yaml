    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request", "get-fingerprint"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
