                hostname: foo.com
                protocol: HTTP
              - name: l-8090
                port: 8090
                hostname: foo.com
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend
            namespace: default
          spec:
            ports:
              - port: 8080
