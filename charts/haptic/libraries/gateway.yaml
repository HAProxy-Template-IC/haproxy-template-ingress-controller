  test-httproute-precedence:
    description: Complex precedence ordering with multiple conflicting routes
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc1
            namespace: default
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc2
            namespace: default
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc3
            namespace: default
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc1-abc
            namespace: default
            labels:
              kubernetes.io/service-name: svc1
          endpoints:
            - addresses: ["10.0.1.1"]
          ports:
            - port: 80
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc2-abc
            namespace: default
            labels:
              kubernetes.io/service-name: svc2
          endpoints:
            - addresses: ["10.0.2.1"]
          ports:
            - port: 80
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc3-abc
            namespace: default
            labels:
              kubernetes.io/service-name: svc3
          endpoints:
            - addresses: ["10.0.3.1"]
          ports:
            - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route1
            namespace: default
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            hostnames:
              - example.com
            rules:
              # Most specific: /api/v1/users with method and headers
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api/v1/users
                    method: GET
                    headers:
                      - type: Exact
                        name: X-Auth
                        value: token
                backendRefs:
                  - name: svc1
                    port: 80
              # Less specific: /api/v1 with just method
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api/v1
                    method: GET
                backendRefs:
                  - name: svc2
                    port: 80
              # Least specific: /api with no extra matchers
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                backendRefs:
                  - name: svc3
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      # Verify routes are ordered by Gateway API precedence (most specific first)
      - type: match_order
        target: map:path-prefix.map
        patterns:
          - "/api/v1/users/.*default_route1_0"   # Most specific: longest path + method + headers
          - "/api/v1/ .*default_route1_1"        # Medium: medium path + method
          - "/api/ .*default_route1_2"           # Least specific: shortest path, no extra matchers
        description: Routes must be ordered by Gateway API precedence (most specific first)

  test-httproute-same-path-matcher-precedence:
    description: Routes with SAME path sorted by matcher specificity (method/headers/query)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-main
            namespace: default
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            name: svc-v2
            namespace: default
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc-main-abc
            namespace: default
            labels:
              kubernetes.io/service-name: svc-main
          endpoints:
            - addresses: ["10.0.1.1"]
          ports:
            - port: 80
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: svc-v2-abc
            namespace: default
            labels:
              kubernetes.io/service-name: svc-v2
          endpoints:
            - addresses: ["10.0.2.1"]
          ports:
            - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: precedence-test
            namespace: default
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            hostnames:
              - test.example.com
            rules:
              # RULE 0: Medium precedence - GET + 1 header
              # Declared FIRST but should sort to position 2
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                    method: GET
                    headers:
                      - type: Exact
                        name: X-Version
                        value: v1
                backendRefs:
                  - name: svc-main
                    port: 80
              # RULE 1: Lowest precedence - No matchers (catch-all)
              # Declared SECOND but should sort to position 4 (last)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: svc-main
                    port: 80
              # RULE 2: Highest precedence - GET + 2 headers + 1 query
              # Declared THIRD but should sort to position 1 (first)
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                    method: GET
                    headers:
                      - type: Exact
                        name: X-Version
                        value: v2
                      - type: Exact
                        name: X-Environment
                        value: prod
                    queryParams:
                      - type: Exact
                        name: debug
                        value: "true"
                backendRefs:
                  - name: svc-v2
                    port: 80
              # RULE 3: Low precedence - GET only
              # Declared FOURTH but should sort to position 3
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                    method: GET
                backendRefs:
                  - name: svc-v2
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      # Verify all 4 rules are present (including catch-all)
      - type: contains
        target: haproxy.cfg
        pattern: 'gw_rule_id.*precedence-test_0'
        description: Rule 0 (GET + 1 header) must be present

      - type: contains
        target: haproxy.cfg
        pattern: 'gw_rule_id.*precedence-test_1'
        description: Rule 1 (catch-all) must be present

      - type: contains
        target: haproxy.cfg
        pattern: 'gw_rule_id.*precedence-test_2'
        description: Rule 2 (GET + 2 headers + 1 query) must be present

      - type: contains
        target: haproxy.cfg
        pattern: 'gw_rule_id.*precedence-test_3'
        description: Rule 3 (GET only) must be present

