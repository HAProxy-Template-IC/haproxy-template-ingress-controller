            {%- for _, backendRef := range refsSlice %}
              {%- var backend = map[string]any{"name": backendRef | dig("name") | fallback(""), "port": backendRef | dig("port") | fallback(80)} %}
              {%- var weight = backendRef | dig("weight") | fallback(1) %}
