  test-listenerset-allowed-namespace-selector:
    description: |
      `allowedListeners.namespaces.from=Selector` admits ListenerSets
      whose namespace's labels match the selector's matchLabels, denies
      others. Pins the ListenerSetAllowedNamespaceSelector conformance
      test status assertion. Includes a ReferenceGrant in the Gateway's
      namespace covering both candidate ListenerSet namespaces — RG
      matching is independent of the Selector gate, so a permitted
      ListenerSet still needs an RG to attach cross-namespace.
    fixtures:
      referencegrants:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: rg-allow-listenersets
            namespace: default
          spec:
            from:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-allowed-ns
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                namespace: selector-not-allowed-ns
            to:
              - group: gateway.networking.k8s.io
                kind: Gateway
      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-allowed-ns
            labels:
              allowed: ns
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: selector-not-allowed-ns
            labels:
              other: label
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-selector
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haproxy
            allowedListeners:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    allowed: ns
            listeners:
              - name: http
                protocol: HTTP
                port: 80
      listenersets:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-permitted
            namespace: selector-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-permitted
                protocol: HTTP
                port: 8082
        - apiVersion: gateway.networking.k8s.io/v1
          kind: ListenerSet
          metadata:
            name: ls-denied
            namespace: selector-not-allowed-ns
            generation: 1
          spec:
            parentRef:
              name: gw-selector
              namespace: default
            listeners:
              - name: extra-denied
                protocol: HTTP
                port: 8083
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:8082'
        description: Permitted ListenerSet's port must be bound

      - type: not_contains
        target: haproxy.cfg
        pattern: 'bind \*:8083'
        description: Denied ListenerSet's port must NOT be bound

