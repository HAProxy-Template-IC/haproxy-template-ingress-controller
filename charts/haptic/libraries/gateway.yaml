            listeners:
              - name: http
                port: 80
                protocol: HTTP
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v1
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: backend-v2
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: backend-v1-abc
            namespace: default
            labels:
              kubernetes.io/service-name: backend-v1
          endpoints:
            - addresses: ["10.0.1.1"]
          ports:
            - port: 8080
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: backend-v2-abc
            namespace: default
            labels:
              kubernetes.io/service-name: backend-v2
          endpoints:
            - addresses: ["10.0.2.1"]
          ports:
            - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: br-route
            namespace: default
          spec:
            parentRefs:
              - name: gw
            rules:
              - backendRefs:
                  - name: backend-v1
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v1
                  - name: backend-v2
                    port: 8080
                    weight: 10
                    filters:
                      - type: RequestHeaderModifier
                        requestHeaderModifier:
                          set:
                            - name: Backend
                              value: backend-v2
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v1_8080.*?http-request set-header Backend 'backend-v1'.*?backend gtw_default_br-route_backend-v2_8080"
        description: backend-v1 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)backend gtw_default_br-route_backend-v2_8080.*?http-request set-header Backend 'backend-v2'"
        description: backend-v2 must have its own Backend header

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_br-route_backend-v1_8080[^a-zA-Z]+[^\\n]*\\n([^\\n]+\\n){0,5}[^\\n]*http-request set-header Backend 'backend-v1'"
        description: backend-v1 must have its own Backend header within first few lines (not v2's)

