          kind: EndpointSlice
          metadata:
            name: backend-abc
            namespace: default
            labels:
              kubernetes.io/service-name: backend
          endpoints:
            - addresses: ["10.0.1.1"]
          ports:
            - port: 8080
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-80
            namespace: default
          spec:
            parentRefs:
              - name: gw
                port: 80
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-8080
            namespace: default
          spec:
            parentRefs:
              - name: gw
                port: 8080
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: route-on-8090-by-section
