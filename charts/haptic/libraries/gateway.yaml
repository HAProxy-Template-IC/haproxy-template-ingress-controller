# Gateway API Template Library
#
# Provides Kubernetes Gateway API v1.2.0 support (HTTPRoute, GRPCRoute).
# Documentation: ../docs/libraries/gateway.md
#
# Features:
#   - Path matching: Exact, PathPrefix, RegularExpression
#   - Advanced matching: Method, headers, query params (HTTPRoute), gRPC method (GRPCRoute)
#   - Filters: RequestHeaderModifier, ResponseHeaderModifier, RequestRedirect, URLRewrite
#   - Traffic splitting: Weighted backends via MULTIBACKEND qualifier
#
# Architecture:
#   - util-gateway-analysis: Central cached analysis of all routes
#   - Sharded generation: Automatic parallel processing for large route sets
#   - Extension points: frontend-matchers-advanced-*, frontend-filters-*

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# Loaded only when Gateway API CRDs are detected on the cluster (via Capabilities).
_helm_load:
  enable: '{{ and .Values.controller.templateLibraries.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}'
  inject:
    - path: watchedResources.gateways.fieldSelector
      value: 'spec.gatewayClassName={{ .Values.gatewayClass.name }}'
    - path: watchedResources.gatewayclasses.fieldSelector
      value: 'spec.controllerName={{ .Values.gatewayClass.controllerName }}'

watchedResources:
  gatewayclasses:
    apiVersion: gateway.networking.k8s.io/v1
    resources: gatewayclasses
    # GatewayClass is cluster-scoped, so no namespace key. metadata.name is
    # globally unique already; indexing by name lets the templates look up
    # the matching class without scanning the whole list.
    indexBy: ["metadata.name"]
    enableValidationWebhook: false
    statusPatch: true
    # fieldSelector: injected by Helm to scope to GatewayClasses we own
    # (spec.controllerName == .Values.gatewayClass.controllerName).

  gateways:
    apiVersion: gateway.networking.k8s.io/v1
    resources: gateways
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: false
    statusPatch: true
    # fieldSelector: injected by Helm from gatewayClass.name

  httproutes:
    apiVersion: gateway.networking.k8s.io/v1
    resources: httproutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # Filter by Gateway reference using label selector
    # Users can label HTTPRoutes to target specific Gateways
    # Example: kubectl label httproute my-route gateway=haproxy

  grpcroutes:
    apiVersion: gateway.networking.k8s.io/v1
    resources: grpcroutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]

  endpoints:
    apiVersion: discovery.k8s.io/v1
    resources: endpointslices
    indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]

  namespaces:
    apiVersion: v1
    resources: namespaces
    # Cluster-scoped; metadata.name is globally unique. Watched so the
    # listener-attachment evaluator can resolve `allowedRoutes.namespaces.from:
    # Selector` against namespace labels (per Gateway API spec). Without this
    # the chart can't tell whether a route's namespace matches the listener's
    # namespace selector and the listener's `attachedRoutes` count drifts
    # from what conformance expects.
    indexBy: ["metadata.name"]

  referencegrants:
    apiVersion: gateway.networking.k8s.io/v1beta1
    resources: referencegrants
    # ReferenceGrant lives in the namespace that GRANTS access. Index by
    # namespace+name so the cert/backend-ref validators can list grants
    # in a target namespace efficiently. Per Gateway API spec, a
    # cross-namespace cert ref or backendRef is permitted iff a
    # ReferenceGrant in the TARGET namespace lists the source's
    # group/kind/namespace under spec.from and the target's group/kind
    # (and optional name) under spec.to.
    indexBy: ["metadata.namespace", "metadata.name"]

  backendtlspolicies:
    apiVersion: gateway.networking.k8s.io/v1alpha3
    resources: backendtlspolicies
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: false
    statusPatch: true

  configmaps:
    apiVersion: v1
    resources: configmaps
    # Watched only so BackendTLSPolicy CACertificateRefs that point at
    # ConfigMaps can be resolved (Core support per Gateway API spec).
    indexBy: ["metadata.namespace", "metadata.name"]

templateSnippets:
  # ============================================================================
  # Feature Registration
  # ============================================================================

  features-100-gateway-ssl-passthrough:
    template: |
      {#- Register SSL passthrough backends with global feature registry. -#}
      {{ render "util-gateway-ssl-passthrough" }}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var sslBackends = gf | dig("sslPassthroughBackends") %}
      {%- if sslBackends != nil %}
        {%- var gwVal, _ = shared.ComputeIfAbsent("gateway_ssl_passthrough", func() any { return nil }) %}
        {%- if gwVal != nil %}
          {%- var gwPassthrough = gwVal.(map[string]any) %}
          {%- var gatewayBackends = gwPassthrough["backends"].([]any) %}
          {%- for _, backend := range gatewayBackends %}
            {%- gf["sslPassthroughBackends"] = append(gf["sslPassthroughBackends"].([]any), backend) %}
          {%- end %}
        {%- end %}
      {%- end %}

  # Register Gateway TLS Terminate mode certificates with SSL infrastructure
  features-100-gateway-tls:
    template: |
      {% import "util-reference-grant-permitted" for ReferenceGrantPermitted %}
      {#- Register TLS certificates from Gateway listeners with TLS mode "Terminate" #}
      {#- Dynamically generates certificate files using fileRegistry.Register() #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {#- Gateway API TLS configuration structure:
          Gateway.spec.listeners[]:
            - name: https
              protocol: HTTPS  # or GRPC
              port: 443
              hostname: example.com  # optional, can be wildcard
              tls:
                mode: Terminate  # we only handle Terminate here, not Passthrough
                certificateRefs:
                  - kind: Secret
                    name: example-tls
                    namespace: default  # optional, defaults to Gateway namespace
      #}
      {#- Two-pass cert registration:
          Pass 1: walk every (gateway, listener, certRef) triple to compute
                  a per-secret aggregate — which SNIs it should bind, and
                  whether at least one of its listeners has no hostname
                  (in which case it qualifies as the chart's TLS default).
          Pass 2: emit one tlsCert entry per unique secret, with the
                  aggregated sni_patterns and is_gateway_default.
          The previous single-pass scheme used first_seen() to dedup
          per-secret, which dropped the SNI patterns of every listener
          after the first — so a Gateway whose listeners "https-A" and
          "https-B" share a cert ended up with only "https-A"'s SNI
          bound. Conformance HTTPRouteHTTPSListener exposes that gap.

          Cross-namespace refs are gated by ReferenceGrant: a Gateway
          referencing a Secret in a different namespace requires a
          ReferenceGrant in the Secret's namespace whose `from` matches
          the Gateway and `to` matches the Secret. Without a matching
          grant the cert is skipped (status patch reflects this with
          ResolvedRefs=False/RefNotPermitted, set elsewhere). -#}
      {%- var certAggregates = map[string]map[string]any{} %}
      {%- for _, gateway := range resources.gateways.List() %}
        {%%
          var gwSpec = gateway | dig("spec")
          if gwSpec == nil {
            continue
          }
        %%}
        {%- for _, listener := range gwSpec | dig("listeners") | toSlice() %}
          {%%
            var listenerTls = listener | dig("tls")
            var tlsMode = listenerTls | dig("mode") | fallback("")
            if listenerTls == nil || tlsMode != "Terminate" {
              continue
            }
          %%}
          {%- for _, certRef := range listenerTls | dig("certificateRefs") | toSlice() %}
            {%%
              var gatewayNs = gateway | dig("metadata", "namespace") | fallback("")
              var certNamespace = certRef | dig("namespace") | fallback(gatewayNs)
              var certName = certRef | dig("name") | fallback("")

              var certKind = certRef | dig("kind") | fallback("Secret")
              if certKind != "Secret" {
                continue
              }

              // Cross-namespace gate. Same-namespace refs are always
              // permitted (no grant needed); cross-ns refs without a
              // matching ReferenceGrant are skipped (the listener-status
              // path elsewhere surfaces this as ResolvedRefs=False
              // /RefNotPermitted).
              var nsStr = tostring(gatewayNs)
              var refNsStr = tostring(certNamespace)
              if refNsStr != nsStr {
                if ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", "Gateway", nsStr,
                  "", "Secret", refNsStr, tostring(certName)) != "true" {
                  continue
                }
              }

              var secretKey = tostring(certNamespace) + "/" + tostring(certName)
              var listenerHostname = listener | dig("hostname") | fallback("")
              var listenerHostnameStr = tostring(listenerHostname)

              var existing = certAggregates[secretKey]
              if existing == nil {
                certAggregates[secretKey] = map[string]any{
                  "secret_namespace":   certNamespace,
                  "secret_name":        certName,
                  "sni_patterns":       []any{},
                  "is_gateway_default": false,
                }
                existing = certAggregates[secretKey]
              }
              if listenerHostnameStr != "" {
                existing["sni_patterns"] = append(existing["sni_patterns"].([]any), listenerHostnameStr)
              } else {
                // Listener with no hostname → cert is a default
                // candidate (per spec, any SNI accepted).
                existing["is_gateway_default"] = true
              }
              certAggregates[secretKey] = existing
            %%}
          {%- end %}
        {%- end %}
      {%- end %}

      {#- Pass 2: emit one tlsCert entry per unique secret. Keys sorted
          for deterministic ordering — Scriggo map iteration is not stable
          and a reordered tlsCerts list would churn the rendered crt-list
          (HAProxy reload thrash on otherwise-identical input). -#}
      {%- var aggKeys = []any{} %}
      {%- for k := range certAggregates %}
        {%- aggKeys = append(aggKeys, k) %}
      {%- end %}
      {%- var sortedAggKeys = sort_strings(aggKeys) %}
      {%- for _, secretKey := range sortedAggKeys %}
        {%%
          var agg = certAggregates[tostring(secretKey)]
          var certNamespace = tostring(agg["secret_namespace"])
          var certName = tostring(agg["secret_name"])

          var secret = resources.secrets.GetSingle(certNamespace, certName)
          if secret == nil {
            continue
          }
          var secretData = secret | dig("data")
          var tlsCrtB64 = tostring(secretData | dig("tls.crt") | fallback(""))
          var tlsKeyB64 = tostring(secretData | dig("tls.key") | fallback(""))
          if secretData == nil || tlsCrtB64 == "" || tlsKeyB64 == "" {
            continue
          }
          // Decode and verify the data really is PEM. The conformance
          // suite's malformed-cert fixture has non-empty tls.crt /
          // tls.key fields whose decoded bytes aren't valid PEM —
          // writing such a cert into the crt-list crashes HAProxy at
          // reload time, which in turn fails the entire render-validate
          // pipeline so NO status patch ever reaches the API server
          // (the listener-level InvalidCertificateRef condition our
          // status macro produces is silently dropped). Skip the
          // registration; the listener-status path elsewhere already
          // surfaces the failure as ResolvedRefs=False
          // /InvalidCertificateRef.
          var tlsCrt, crtErr = b64decode(tlsCrtB64)
          var tlsKey, keyErr = b64decode(tlsKeyB64)
          if crtErr != nil || keyErr != nil {
            continue
          }
          if !hasPrefix(tlsCrt, "-----BEGIN ") || !hasPrefix(tlsKey, "-----BEGIN ") {
            continue
          }

          var combinedPem = tlsCrt + "\n" + tlsKey
          var certFilename = certNamespace + "_" + certName + ".pem"
          var certPath, _ = fileRegistry.Register("cert", certFilename, combinedPem)
          var sanitizedFilename = basename(certPath)

          var tlsCert = map[string]any{
            "secret_namespace":   certNamespace,
            "secret_name":        certName,
            "sni_patterns":       agg["sni_patterns"],
            "sanitized_filename": sanitizedFilename,
            "is_gateway_default": agg["is_gateway_default"],
          }
          var tlsCerts []any = gf["tlsCertificates"]
          gf["tlsCertificates"] = append(tlsCerts, tlsCert)
        %%}
      {%- end %}

  # ============================================================================
  # Route Analysis (Cached)
  # ============================================================================

  util-gateway-analysis:
    template: |
      {#- Caches route analysis in shared.gatewayAnalysis: {sortedRoutes, pathGroups, allRoutes}
          Uses ComputeIfAbsent for race-free caching across parallel template renders.
          The compute function runs exactly once, even with concurrent access. -#}
      {%- import "util-analyze-routes" for AnalyzeRoutes %}
      {%%
        var _, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any {
          var analysis = map[string]any{"pathGroups": map[string]any{}, "sortedRoutes": []any{}, "allRoutes": []any{}}
          AnalyzeRoutes(analysis)
          return analysis
        })
      %%}

  util-gateway-ssl-passthrough:
    template: |
      {#- Caches SSL passthrough backends in shared["gateway_ssl_passthrough"].backends
          Uses ComputeIfAbsent for race-free caching across parallel template renders.
          Note: first_seen() calls are safe inside the compute function due to the
          deadlock-free implementation of ComputeIfAbsent. -#}
      {%- import "util-build-ssl-passthrough" for BuildSSLPassthrough %}
      {%%
        var _, _ = shared.ComputeIfAbsent("gateway_ssl_passthrough", func() any {
          var sslData = map[string]any{"backends": []any{}}
          BuildSSLPassthrough(sslData)
          return sslData
        })
      %%}

  util-build-ssl-passthrough:
    template: |
      {#- Macro to populate SSL passthrough backend data.
          Called from ComputeIfAbsent to enable use of template functions (dig, toSlice, etc.). -#}
      {%- macro BuildSSLPassthrough(sslData map[string]any) %}
        {%- for _, route := range resources.httproutes.List() %}
          {%%
            var hasPassthrough = false
            for _, rule := range route | dig("spec", "rules") | toSlice() {
              for _, filter := range rule | dig("filters") | toSlice() {
                var filterType = filter | dig("type") | fallback("")
                if filterType == "ExtensionRef" {
                  var kind = filter | dig("extensionRef", "kind") | fallback("")
                  var name = filter | dig("extensionRef", "name") | fallback("")
                  if kind == "SSLPassthrough" || (name != "" && (name | toLower() | regex_search("ssl.*passthrough"))) {
                    hasPassthrough = true
                  }
                }
              }
            }
            if !hasPassthrough { continue }

            var ns = route | dig("metadata", "namespace") | fallback("")
            var routeName = route | dig("metadata", "name") | fallback("")
          %%}
          {%- for _, host := range route | dig("spec", "hostnames") | toSlice() %}
            {%- if first_seen("gateway_ssl_passthrough_hosts", host) %}
              {%- sslData["backends"] = append(sslData["backends"].([]any), map[string]any{
                "name": "ssl-passthrough-" + ns + "-" + routeName,
                "sni": host, "namespace": ns, "route": routeName, "route_type": "httproute",
              }) %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  util-analyze-routes:
    template: |
      {#-
        Analyzes HTTPRoute/GRPCRoute resources and populates result with:
        - allRoutes: flat list of normalized route objects
        - pathGroups: routes grouped by host+path for conflict detection
        - sortedRoutes: routes sorted by precedence (method > headers > query > order)

        Hostname expansion: a route with `spec.hostnames` set produces one
        entry per declared hostname. A route with NO hostnames inherits
        the hostname(s) of every listener it attaches to (per Gateway
        API spec — "If the listener has hostnames specified and the
        HTTPRoute does not, the route inherits the listener's
        hostname"). This is what makes a sectionName-targeted route
        scope to its listener's hostname instead of bleeding across
        every Gateway sharing the frontend port.

        For each (route, attaching-listener) pair the routeInfo's
        hostname becomes the listener's hostname (or "" when the
        listener has no hostname either, which the host map handles via
        the regsub wildcard fallback).
      -#}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection %}
      {%- macro AnalyzeRoutes(result map[string]any) %}
        {%- var allRoutes = []any{} %}

        {#- Process HTTPRoutes #}
        {%- for _, route := range resources.httproutes.List() %}
          {#- Compute the effective hostnames per Gateway API intersection
              rules. For each parentRef we accept (Gateway-targeted) and
              each attached listener:
                - route empty + listener empty           → ""        (catch-all)
                - route empty + listener H               → H         (route inherits)
                - route H... + listener ""               → each H    (route narrows)
                - route H... + listener L                → per-pair intersection
                                                            (drops pairs with no intersection)
              The aggregated set is what the chart should emit map entries for;
              hostnames that don't intersect any attached listener fall away,
              which is what the spec requires (a route with `wildcard.io` in
              spec.hostnames must NOT route to a `*.wildcard.io` listener,
              because `*.wildcard.io` doesn't match the bare `wildcard.io`).
              Routes with no surviving intersection produce no entries. -#}
          {%- var routeHostnames = route | dig("spec", "hostnames") | toSlice() %}
          {%- var parentRefs = dig(route, "spec", "parentRefs") | toSlice() %}
          {%- var effectiveHosts = map[string]bool{} %}
          {%- var resolvedGwCount = 0 %}
          {%- var routeNs = tostring(dig(route, "metadata", "namespace") | fallback("")) %}
          {%- for _, parentRef := range parentRefs %}
            {%- var prGroup = tostring(dig(parentRef, "group") | fallback("gateway.networking.k8s.io")) %}
            {%- var prKind = tostring(dig(parentRef, "kind") | fallback("Gateway")) %}
            {%- if prGroup == "gateway.networking.k8s.io" && prKind == "Gateway" %}
              {%- var gwNs = tostring(dig(parentRef, "namespace") | fallback(routeNs)) %}
              {%- var gwName = tostring(dig(parentRef, "name") | fallback("")) %}
              {%- var section = tostring(dig(parentRef, "sectionName") | fallback("")) %}
              {%- var gw = resources.gateways.GetSingle(gwNs, gwName) %}
              {%- if gw != nil %}
                {%- resolvedGwCount = resolvedGwCount + 1 %}
                {%- for _, listener := range dig(gw, "spec", "listeners") | toSlice() %}
                  {%- var listenerName = tostring(dig(listener, "name") | fallback("")) %}
                  {%- if section == "" || section == listenerName %}
                    {%- var listenerHostname = tostring(dig(listener, "hostname") | fallback("")) %}
                    {%- if len(routeHostnames) == 0 %}
                      {%- effectiveHosts[listenerHostname] = true %}
                    {%- else if listenerHostname == "" %}
                      {%- for _, rh := range routeHostnames %}
                        {%- effectiveHosts[tostring(rh)] = true %}
                      {%- end %}
                    {%- else %}
                      {%- for _, rh := range routeHostnames %}
                        {%- var inter = HostnameSinglePairIntersection(listenerHostname, tostring(rh)) %}
                        {%- if inter != "" %}
                          {%- effectiveHosts[inter] = true %}
                        {%- end %}
                      {%- end %}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
          {#- Two fallbacks share the "use route hostnames as-is" branch:
                1. No parentRefs at all (true orphan).
                2. parentRefs present but none resolve to a known Gateway
                   (typical for chart-test fixtures that omit Gateway
                   resources to keep the fixture small).
              When at least one parentRef DID resolve, we trust the
              intersection result — an empty effectiveHosts there means
              the spec-correct outcome that no listener intersects, and
              the route correctly produces no entries. -#}
          {%- if resolvedGwCount == 0 %}
            {%- if len(routeHostnames) == 0 %}
              {%- effectiveHosts[""] = true %}
            {%- else %}
              {%- for _, rh := range routeHostnames %}
                {%- effectiveHosts[tostring(rh)] = true %}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- if len(effectiveHosts) == 0 %}
            {%- continue %}
          {%- end %}
          {%- var hostnames = []any{} %}
          {%- for h := range effectiveHosts %}
            {%- hostnames = append(hostnames, h) %}
          {%- end %}
          {%- for _, hostname := range hostnames %}
            {%- var ruleIdx = 0 %}
            {%- for _, rule := range route | dig("spec", "rules") | toSlice() %}
              {%- var matchesList = rule | dig("matches") | toSlice() %}
              {%- if len(matchesList) == 0 %}
                {%- matchesList = []any{map[string]any{"path": map[string]any{"type": "PathPrefix", "value": "/"}}} %}
              {%- end %}

              {%- for _, match := range matchesList %}
                {%- var pathValue = match | dig("path") | coalesce(map[string]any{"type": "PathPrefix", "value": "/"}) %}
                {%- var filtersList = rule | dig("filters") | toSlice() | coalesce([]any{}) %}
                {%- var pathKey = hostname + "|" + (pathValue["type"]) + "|" + (pathValue["value"]) %}
                {%- var routeInfo = map[string]any{
                  "route": route,
                  "hostname": hostname,
                  "rule": rule,
                  "ruleIdx": ruleIdx,
                  "match": match,
                  "path": pathValue,
                  "filters": filtersList,
                  "is_grpc": false,
                  "resource_type": "httproute",
                  "pathKey": pathKey,
                } %}
                {%- allRoutes = append(allRoutes, routeInfo) %}
              {%- end %}
              {#- Increment rule counter after processing all matches for this rule #}
              {%- ruleIdx = ruleIdx + 1 %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Process GRPCRoutes similarly. Mirror the listener-inheritance
            logic so GRPCRoutes don't bleed across Gateways either. -#}
        {%- for _, route := range resources.grpcroutes.List() %}
          {#- Same listener-intersection treatment as HTTPRoutes above —
              see the HTTPRoute branch's comment for the full case
              breakdown. -#}
          {%- var routeHostnames = route | dig("spec", "hostnames") | toSlice() %}
          {%- var parentRefs = dig(route, "spec", "parentRefs") | toSlice() %}
          {%- var effectiveHosts = map[string]bool{} %}
          {%- var resolvedGwCount = 0 %}
          {%- var routeNs = tostring(dig(route, "metadata", "namespace") | fallback("")) %}
          {%- for _, parentRef := range parentRefs %}
            {%- var prGroup = tostring(dig(parentRef, "group") | fallback("gateway.networking.k8s.io")) %}
            {%- var prKind = tostring(dig(parentRef, "kind") | fallback("Gateway")) %}
            {%- if prGroup == "gateway.networking.k8s.io" && prKind == "Gateway" %}
              {%- var gwNs = tostring(dig(parentRef, "namespace") | fallback(routeNs)) %}
              {%- var gwName = tostring(dig(parentRef, "name") | fallback("")) %}
              {%- var section = tostring(dig(parentRef, "sectionName") | fallback("")) %}
              {%- var gw = resources.gateways.GetSingle(gwNs, gwName) %}
              {%- if gw != nil %}
                {%- resolvedGwCount = resolvedGwCount + 1 %}
                {%- for _, listener := range dig(gw, "spec", "listeners") | toSlice() %}
                  {%- var listenerName = tostring(dig(listener, "name") | fallback("")) %}
                  {%- if section == "" || section == listenerName %}
                    {%- var listenerHostname = tostring(dig(listener, "hostname") | fallback("")) %}
                    {%- if len(routeHostnames) == 0 %}
                      {%- effectiveHosts[listenerHostname] = true %}
                    {%- else if listenerHostname == "" %}
                      {%- for _, rh := range routeHostnames %}
                        {%- effectiveHosts[tostring(rh)] = true %}
                      {%- end %}
                    {%- else %}
                      {%- for _, rh := range routeHostnames %}
                        {%- var inter = HostnameSinglePairIntersection(listenerHostname, tostring(rh)) %}
                        {%- if inter != "" %}
                          {%- effectiveHosts[inter] = true %}
                        {%- end %}
                      {%- end %}
                    {%- end %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
          {#- Same fallback as HTTPRoute branch — see comment there. -#}
          {%- if resolvedGwCount == 0 %}
            {%- if len(routeHostnames) == 0 %}
              {%- effectiveHosts[""] = true %}
            {%- else %}
              {%- for _, rh := range routeHostnames %}
                {%- effectiveHosts[tostring(rh)] = true %}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- if len(effectiveHosts) == 0 %}
            {%- continue %}
          {%- end %}
          {%- var hostnames = []any{} %}
          {%- for h := range effectiveHosts %}
            {%- hostnames = append(hostnames, h) %}
          {%- end %}
          {%- for _, hostname := range hostnames %}
            {%- var ruleIdx = 0 %}
            {%- for _, rule := range route | dig("spec", "rules") | toSlice() %}
              {%- var matchesList = rule | dig("matches") | toSlice() %}
              {%- if len(matchesList) == 0 %}
                {%- matchesList = []any{map[string]any{"method": map[string]any{}}} %}
              {%- end %}

              {%- for _, match := range matchesList %}
                {%- var filtersList = rule | dig("filters") | toSlice() | coalesce([]any{}) %}
                {%- var grpcPath = map[string]any{"type": "Exact", "value": "/"} %}
                {%- var pathKey = hostname + "|" + (grpcPath["type"]) + "|" + (grpcPath["value"]) %}
                {%- var routeInfo = map[string]any{
                  "route": route,
                  "hostname": hostname,
                  "rule": rule,
                  "ruleIdx": ruleIdx,
                  "match": match,
                  "path": grpcPath,
                  "filters": filtersList,
                  "is_grpc": true,
                  "resource_type": "grpcroute",
                  "pathKey": pathKey,
                } %}
                {%- allRoutes = append(allRoutes, routeInfo) %}
              {%- end %}
              {#- Increment rule counter after processing all matches for this rule #}
              {%- ruleIdx = ruleIdx + 1 %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Group by path key to detect conflicts #}
        {%- var pathGroups = group_by(allRoutes, "pathKey") %}

        {#- Check for conflicts and mark routes needing VAR qualifier #}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var routes []any = pathGroups[pathKey] %}
          {#- Check if routes in this group have different matchers #}
          {%- var hasConflicts = false %}
          {%- if len(routes) > 1 %}
            {#- Build comparison key from match conditions #}
            {%- var firstConditions = "" %}
            {%- var firstRoute = routes[0] %}
            {%- var firstMatch = firstRoute["match"] %}
            {%- var firstMethod = firstMatch["method"] %}
            {%- if firstMethod != nil %}
              {%- firstConditions = firstConditions + "method:" + (firstMethod) %}
            {%- end %}
            {%- for idx, header := range firstMatch["headers"] | toSlice() %}
              {%- firstConditions = firstConditions + ";header:" + (header["name"]) + "=" + (header["value"]) %}
            {%- end %}
            {%- for idx, param := range firstMatch["queryParams"] | toSlice() %}
              {%- firstConditions = firstConditions + ";param:" + (param["name"]) + "=" + (param["value"]) %}
            {%- end %}

            {#- Check if any other route has different conditions #}
            {%- for i := 1; i < len(routes); i++ %}
              {%- var routeConditions = "" %}
              {%- var r = routes[i] %}
              {%- var routeMatch = r["match"] %}
              {%- var routeMethod = routeMatch["method"] %}
              {%- if routeMethod != nil %}
                {%- routeConditions = routeConditions + "method:" + (routeMethod) %}
              {%- end %}
              {%- for idx, header := range routeMatch["headers"] | toSlice() %}
                {%- routeConditions = routeConditions + ";header:" + (header["name"]) + "=" + (header["value"]) %}
              {%- end %}
              {%- for idx, param := range routeMatch["queryParams"] | toSlice() %}
                {%- routeConditions = routeConditions + ";param:" + (param["name"]) + "=" + (param["value"]) %}
              {%- end %}

              {%- if firstConditions != routeConditions %}
                {%- hasConflicts = true %}
              {%- end %}
            {%- end %}
          {%- end %}

          {#- Rebuild routes list with updated dicts #}
          {%- var updatedRoutes = []any{} %}
          {%- for _, route := range routes %}
            {%- var routeObj = route["route"] %}
            {%- var routeNs = routeObj | dig("metadata", "namespace") | fallback("") %}
            {%- var routeName = routeObj | dig("metadata", "name") | fallback("") %}
            {%- var ruleIdxVal = route["ruleIdx"] %}
            {%- var routeId = routeNs + "_" + routeName + "_" + (ruleIdxVal) %}
            {%- var updatedRoute = merge(route, map[string]any{
              "hasConflicts": hasConflicts,
              "pathKey": pathKey,
              "routeId": routeId,
            }) %}
            {%- updatedRoutes = append(updatedRoutes, updatedRoute) %}
          {%- end %}

          {#- Build conflictGroup string #}
          {%- var routeIds = map_extract(updatedRoutes, "routeId") %}
          {%- var conflictGroup = join(sort_strings(routeIds), "__") %}

          {#- Add conflictGroup to each route #}
          {%- var finalRoutes = []any{} %}
          {%- for _, route := range updatedRoutes %}
            {%- var routeWithGroup = merge(route, map[string]any{"conflictGroup": conflictGroup}) %}
            {%- finalRoutes = append(finalRoutes, routeWithGroup) %}
          {%- end %}

          {#- Update pathGroups with modified routes #}
          {%- pathGroups[pathKey] = finalRoutes %}
        {%- end %}

        {#- Rebuild allRoutes from updated pathGroups #}
        {%- var finalAllRoutes = []any{} %}
        {%- for _, pathKey := range keys(pathGroups) %}
          {%- var pathRoutes []any = pathGroups[pathKey] %}
          {%- for _, route := range pathRoutes %}
            {%- finalAllRoutes = append(finalAllRoutes, route) %}
          {%- end %}
        {%- end %}

        {%- var sortedRoutes = finalAllRoutes | sort_by([]string{
          "$.path.type",
          "$.path.value | length:desc",
          "$.match.method:exists:desc",
          "$.match.headers | length:desc",
          "$.match.queryParams | length:desc",
          "$.route.metadata.creationTimestamp",
          "$.route.metadata.namespace ~ '/' ~ $.route.metadata.name",
          "$.ruleIdx",
        }) %}

        {#- Pre-compute filter existence flags (optimization: avoids repeated iteration) #}
        {%- var hasRequestHeader = false %}
        {%- var hasResponseHeader = false %}
        {%- var hasRedirect = false %}
        {%- var hasUrlrewrite = false %}
        {%- for _, route := range finalAllRoutes %}
          {%- var filters []any = route["filters"] %}
          {%- for _, filter := range filters %}
            {%- var filterType = filter["type"] %}
            {%- if filterType == "RequestHeaderModifier" %}
              {%- hasRequestHeader = true %}
            {%- else if filterType == "ResponseHeaderModifier" %}
              {%- hasResponseHeader = true %}
            {%- else if filterType == "RequestRedirect" %}
              {%- hasRedirect = true %}
            {%- else if filterType == "URLRewrite" %}
              {%- hasUrlrewrite = true %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Populate result map with analysis data #}
        {%- result["pathGroups"] = pathGroups %}
        {%- result["sortedRoutes"] = sortedRoutes %}
        {%- result["allRoutes"] = finalAllRoutes %}
        {#- Filter existence flags for optimized filter template rendering #}
        {%- result["hasRequestHeader_filter"] = hasRequestHeader %}
        {%- result["hasResponseHeader_filter"] = hasResponseHeader %}
        {%- result["hasRedirect_filter"] = hasRedirect %}
        {%- result["hasUrlrewrite_filter"] = hasUrlrewrite %}
      {%- end macro %}

  util-reference-grant-permitted:
    template: |
      {#-
        ReferenceGrantPermitted — cross-namespace ref check.

        Per Gateway API spec, a cross-namespace reference is permitted only
        when there's a ReferenceGrant in the target namespace whose `from`
        clause matches the source (group/kind/namespace) and whose `to`
        clause matches the target (group/kind, optionally name). Same-
        namespace refs are always permitted (no grant needed).

        Returns "true" / "false" — Scriggo macro return-type constraint
        (see HostnamesIntersect doc). Callers use `== "true"`.

        Args:
          fromGroup, fromKind, fromNs — the source resource (e.g. Gateway)
          toGroup, toKind, toNs, toName — the target resource (Secret /
          Service). toName is optional in the grant; matches any if grant
          omits the name.
      -#}
      {%- macro ReferenceGrantPermitted(
          fromGroup string, fromKind string, fromNs string,
          toGroup string, toKind string, toNs string, toName string) -%}
        {%- if fromNs == toNs -%}
          true
        {%- else -%}
          {%- var permitted = "false" -%}
          {%- for _, g := range resources.referencegrants.Fetch(toNs) -%}
            {%- if permitted == "false" -%}
              {%- var fromOk = false -%}
              {%- for _, fr := range dig(g, "spec", "from") | toSlice() -%}
                {%- var frGroup = tostring(dig(fr, "group") | fallback("")) -%}
                {%- var frKind = tostring(dig(fr, "kind") | fallback("")) -%}
                {%- var frNs = tostring(dig(fr, "namespace") | fallback("")) -%}
                {%- if frGroup == fromGroup && frKind == fromKind && frNs == fromNs -%}
                  {%- fromOk = true -%}
                {%- end -%}
              {%- end -%}
              {%- if fromOk -%}
                {%- for _, to := range dig(g, "spec", "to") | toSlice() -%}
                  {%- if permitted == "false" -%}
                    {%- var toG = tostring(dig(to, "group") | fallback("")) -%}
                    {%- var toK = tostring(dig(to, "kind") | fallback("")) -%}
                    {%- var toN = tostring(dig(to, "name") | fallback("")) -%}
                    {%- if toG == toGroup && toK == toKind && (toN == "" || toN == toName) -%}
                      {%- permitted = "true" -%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ permitted -}}
        {%- end -%}
      {%- end macro -%}

  util-hostname-intersect-gateway:
    template: |
      {#-
        HostnamesIntersect — listener.hostname × route.spec.hostnames

        Per Gateway API spec, an HTTPRoute attaches to a listener only when
        the hostname sets intersect. Wildcard rules (per spec):
          - Both empty → match (listener accepts everything, route claims everything)
          - Listener empty, route any → match (route narrows the listener)
          - Listener "*.example.com", route empty → match (route inherits listener)
          - Exact ↔ exact: byte-equal
          - Wildcard ↔ exact: route ends with `.<base>` where listener was `*.<base>`
            and the prefix part has no further dots (one DNS label only)
          - Wildcard ↔ wildcard: bases match, OR one base is a suffix of the other
            with the gap covering exactly one DNS label

        Returns true if any (listener-hostname, route-hostname) pair matches
        — listener carries one hostname, route may carry several. A single
        match is sufficient for attachment.
      -#}
      {#- Macros return "true" / "false" strings rather than bool because
          Scriggo macros only allow text-format return types. Callers use
          == "true" comparisons on the result. -#}
      {%- macro HostnamesIntersect(listenerHostname string, routeHostnames []any) -%}
        {%- if listenerHostname == "" -%}
          true
        {%- else if len(routeHostnames) == 0 -%}
          true
        {%- else -%}
          {%- var matched = "false" -%}
          {%- for _, rh := range routeHostnames -%}
            {%- if matched == "false" -%}
              {%- if HostnameSinglePairMatch(listenerHostname, tostring(rh)) == "true" -%}
                {%- matched = "true" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ matched -}}
        {%- end -%}
      {%- end macro -%}

      {#- HostnameSinglePairMatch — one listener hostname × one route hostname.
          Returns "true" / "false" string. The match boolean is just
          whether the intersection is non-empty. -#}
      {%- macro HostnameSinglePairMatch(lh string, rh string) -%}
        {%- if HostnameSinglePairIntersection(lh, rh) == "" -%}
          false
        {%- else -%}
          true
        {%- end -%}
      {%- end macro -%}

      {#- HostnameSinglePairIntersection — one listener hostname × one route
          hostname. Returns the *effective* hostname per Gateway API
          intersection rules:

            - lh exact, rh exact, equal           → that exact hostname
            - lh wildcard (*.X), rh exact (y.X)   → rh (the more specific exact)
            - lh exact (y.X), rh wildcard (*.X)   → lh (the more specific exact)
            - both wildcard, equal bases          → that wildcard
            - both wildcard, one base nested      → the more specific wildcard
            - else                                → "" (no intersection)

          Returns "" when there is no intersection.

          Wildcard semantics (Gateway API v1 spec, NOT RFC 1034):
            "*.X" matches any host that ends with ".X" and has at
            least one label before it. Both `foo.X` and
            `multi.label.foo.X` match (wildcards match any number of
            labels), but the bare `X` does not. -#}
      {%- macro HostnameSinglePairIntersection(lh string, rh string) -%}
        {%- if lh == rh -%}
          {{ lh }}
        {%- else if hasPrefix(lh, "*.") && !hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- if hasSuffix(rh, "."+lhBase) && len(rh) > len("."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- else if !hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var rhBase = rh[2:] -%}
          {%- if hasSuffix(lh, "."+rhBase) && len(lh) > len("."+rhBase) -%}
            {{ lh }}
          {%- end -%}
        {%- else if hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- var rhBase = rh[2:] -%}
          {%- if lhBase == rhBase -%}
            {{ lh }}
          {%- else if hasSuffix(lhBase, "."+rhBase) -%}
            {{ lh }}
          {%- else if hasSuffix(rhBase, "."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-backend-name-gateway:
    template: |
      {#- Macro to generate gateway backend name from route and backend info #}
      {%- macro BackendNameGateway(route any, backend any) string -%}
      gtw_{{ route | dig("metadata", "namespace") | fallback("") }}_{{ route | dig("metadata", "name") | fallback("") }}_{{ backend | dig("name") | fallback("") }}_{{ backend | dig("port") | fallback("") }}
      {%- end macro -%}

  util-route-condition:
    template: |
      {#-
        RouteIdCondition - Generates HAProxy condition to match a Gateway route by ID.

        This is the standard pattern for filter processing: check if txn.gw_rule_id
        matches the specific routeId set by the advanced matchers.

        Usage:
          {%- import "util-route-condition" for RouteIdCondition -%}
          http-request set-header X-Custom 'value' if {{ RouteIdCondition(routeInfo | dig("routeId")) }}
      -#}
      {%- macro RouteIdCondition(routeId string) string -%}
      { var(txn.gw_rule_id) -m str "{{ routeId }}" }
      {%- end macro -%}

  util-condition-transition-time:
    template: |
      {#-
        Gateway-API-shaped wrappers around the resource-agnostic
        `transitionTime(existingConditions, type, status)` helper. These
        macros encode the Gateway-API spec's structure for where conditions
        live (.status.conditions for Gateway/GatewayClass top-level,
        .status.listeners[byName].conditions for Gateway listeners,
        .status.parents[byIdx].conditions for HTTPRoute/GRPCRoute parents);
        the Go-side filter knows nothing about these paths and just
        compares the supplied conditions list to the proposed status,
        keeping the templating layer resource-agnostic.

        Why these macros exist at all: re-stamping lastTransitionTime on
        every render is a metav1.Condition spec violation AND breaks the
        status-applier checksum dedup, producing a self-feeding write loop
        where each SSA write triggers a watch event that re-renders. The
        generic helper preserves the existing timestamp when status is
        unchanged — these macros just make sure the helper sees the right
        conditions list.

        Usage:
          {%- import "util-condition-transition-time" for
                TopLevelTransitionTime, ListenerTransitionTime,
                RouteParentTransitionTime -%}
          {{ TopLevelTransitionTime(gateway, "Programmed", "True") }}
          {{ ListenerTransitionTime(gateway, "https", "Programmed", "True") }}
          {{ RouteParentTransitionTime(route, parentIdx, "Accepted", "True") }}
      -#}
      {%- macro TopLevelTransitionTime(resource any, conditionType string, newStatus string) string -%}
      {{- transitionTime(dig(resource, "status", "conditions"), conditionType, newStatus) -}}
      {%- end macro -%}

      {%- macro ListenerTransitionTime(gateway any, listenerName string, conditionType string, newStatus string) string -%}
      {%- var listeners = dig(gateway, "status", "listeners") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- for _, l := range listeners -%}
        {%- var lm = l.(map[string]any) -%}
        {%- if found == nil && tostring(lm["name"]) == listenerName -%}
          {%- found = dig(lm, "conditions") | toSlice() -%}
        {%- end -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {%- macro RouteParentTransitionTime(route any, parentIdx int, conditionType string, newStatus string) string -%}
      {%- var parents = dig(route, "status", "parents") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- if parentIdx >= 0 && parentIdx < len(parents) -%}
        {%- var pm = parents[parentIdx].(map[string]any) -%}
        {%- found = dig(pm, "conditions") | toSlice() -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

  util-generate-backends-gateway:
    template: |
      {#- Macro to generate backends for Gateway API routes (HTTPRoute/GRPCRoute) #}
      {#- Deduplicates backends across all routes using first_seen for deduplication tracking #}
      {#- Parameters: #}
      {#-   routes: list of routes to process (from resources.httproutes or resources.grpcroutes) #}
      {#-   protoFlag: protocol flag for default-server ("" for HTTP, "h2" for gRPC) #}
      {#-   dedupCategory: category name for first_seen deduplication #}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- macro GenerateGatewayBackends(routes []any, protoFlag string, dedupCategory string) -%}
      {%- for _, route := range routes -%}
      {%- var routeNs = route | dig("metadata", "namespace") | fallback("") -%}
      {%- var routeName = route | dig("metadata", "name") | fallback("") -%}
      {%- for _, rule := range route | dig("spec", "rules") | toSlice() -%}
      {%- var backendRefs = rule | dig("backendRefs") -%}
      {%- if backendRefs != nil %}
      {%- for _, backendRef := range backendRefs | toSlice() -%}
      {#- Skip backendRefs the chart can't realise as a HAProxy backend.
          Per Gateway API spec, only core/v1 Service refs are routable;
          anything else (custom kind, wrong group) results in
          ResolvedRefs=False/InvalidKind on the route. The backend
          rendering below would otherwise silently use the ref's `name`
          field (which can collide with a real Service of the same
          name) and incorrectly route traffic. The route-matcher path
          below detects all-invalid rules and routes them to
          gw-invalid-backend (HTTP 500) instead. -#}
      {%- var refGroup = backendRef | dig("group") | fallback("") | tostring() -%}
      {%- var refKind = backendRef | dig("kind") | fallback("Service") | tostring() -%}
      {%- if (refGroup != "" && refGroup != "core") || refKind != "Service" -%}
        {%- continue -%}
      {%- end -%}
      {%- var backendName = backendRef | dig("name") | fallback("") -%}
      {%- var backendPort = backendRef | dig("port") | fallback(80) -%}
      {%- var backend = map[string]any{"name": backendName, "port": backendPort} -%}
      {%- var backendKey = routeNs + "_" + routeName + "_" + backendName + "_" + (backendPort) -%}
      {%- if first_seen(dedupCategory, backendKey) -%}
      {%- var routeTypeLabel = "GRPCRoute" -%}
      {%- if protoFlag == "" -%}{%- routeTypeLabel = "HTTPRoute" -%}{%- end -%}
      {%- var beKey = BackendNameGateway(route, backend) -%}
      {#- Per Gateway API spec, when the target Service port declares
          appProtocol (kubernetes.io/h2c, kubernetes.io/ws[s]), the data
          plane MUST honour that protocol. HAProxy's `proto` directive on
          default-server gives us h2c; WebSocket flows through native HTTP
          handling without any directive. We look up the Service by
          (namespace, name) and find the port matching backendRef.port. -#}
      {%- var resolvedProtoFlag = protoFlag -%}
      {%- if protoFlag == "" -%}
        {%- var svc = resources.services.GetSingle(tostring(routeNs), tostring(backendName)) -%}
        {%- if svc != nil -%}
          {%- for _, p := range svc | dig("spec", "ports") | toSlice() -%}
            {%- if (p | dig("port") | toint()) == toint(backendPort) -%}
              {%- var ap = p | dig("appProtocol") | fallback("") | tostring() -%}
              {%- if ap == "kubernetes.io/h2c" -%}
                {%- resolvedProtoFlag = "h2" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {#- BackendTLSPolicy lookup: per Gateway API spec, when a
          BackendTLSPolicy in the same namespace targets this Service
          (optionally pinned to a sectionName matching the port name),
          the data plane MUST connect to the backend over TLS, validate
          the server cert against the policy's CA bundle, and use
          policy.validation.hostname for SNI + cert hostname check.
          We resolve the policy's CA refs to a single PEM blob and
          stash it via fileRegistry; the default-server line below picks
          up the resulting `ssl ca-file ... verify required sni ...`. -#}
      {%- var btlsCaPath = "" -%}
      {%- var btlsHostname = "" -%}
      {%- var btlsConflictedReason = "" -%}
      {%%
        var portNameForBackend = ""
        if protoFlag == "" {
          var svcLookup = resources.services.GetSingle(tostring(routeNs), tostring(backendName))
          if svcLookup != nil {
            for _, p := range svcLookup | dig("spec", "ports") | toSlice() {
              if (p | dig("port") | toint()) == toint(backendPort) {
                portNameForBackend = tostring(p | dig("name") | fallback(""))
              }
            }
          }
        }
        var winningPolicy any = nil
        var winningPolicyTs = ""
        var winningPolicyKey = ""
        for _, pol := range resources.backendtlspolicies.List() {
          var polNs = tostring(dig(pol, "metadata", "namespace") | fallback(""))
          if polNs != tostring(routeNs) {
            continue
          }
          for _, tr := range dig(pol, "spec", "targetRefs") | toSlice() {
            var trGroup = tostring(dig(tr, "group") | fallback(""))
            var trKind = tostring(dig(tr, "kind") | fallback(""))
            var trName = tostring(dig(tr, "name") | fallback(""))
            var trSec = tostring(dig(tr, "sectionName") | fallback(""))
            if (trGroup != "" && trGroup != "core") || trKind != "Service" {
              continue
            }
            if trName != tostring(backendName) {
              continue
            }
            if trSec != "" && trSec != portNameForBackend {
              continue
            }
            // Conflict tiebreak — earliest creationTimestamp wins.
            var polTs = tostring(dig(pol, "metadata", "creationTimestamp") | fallback(""))
            var polKey = polNs + "/" + tostring(dig(pol, "metadata", "name") | fallback(""))
            if winningPolicy == nil {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs != "" && (winningPolicyTs == "" || polTs < winningPolicyTs) {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            } else if polTs == winningPolicyTs && polKey < winningPolicyKey {
              winningPolicy = pol
              winningPolicyTs = polTs
              winningPolicyKey = polKey
            }
            break
          }
        }
        if winningPolicy != nil {
          var validation = dig(winningPolicy, "spec", "validation")
          btlsHostname = tostring(dig(validation, "hostname") | fallback(""))
          var caRefs []any = dig(validation, "caCertificateRefs") | toSlice()
          var caBundleParts = []any{}
          if caRefs != nil {
            for _, ref := range caRefs {
              var refGroup = tostring(dig(ref, "group") | fallback(""))
              var refKind = tostring(dig(ref, "kind") | fallback(""))
              var refName = tostring(dig(ref, "name") | fallback(""))
              if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(tostring(routeNs), refName)
                if cm != nil {
                  var data = dig(cm, "data") | fallback(map[string]any{})
                  var dataMap = data.(map[string]any)
                  var caCrt, ok = dataMap["ca.crt"]
                  if ok && tostring(caCrt) != "" {
                    caBundleParts = append(caBundleParts, tostring(caCrt))
                  }
                }
              } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                var sec = resources.secrets.GetSingle(tostring(routeNs), refName)
                if sec != nil {
                  var data = dig(sec, "data") | fallback(map[string]any{})
                  var dataMap = data.(map[string]any)
                  var caCrt, ok = dataMap["ca.crt"]
                  var b64 = ""
                  if ok && tostring(caCrt) != "" {
                    b64 = tostring(caCrt)
                  } else {
                    var tlsCrt, ok2 = dataMap["tls.crt"]
                    if ok2 && tostring(tlsCrt) != "" {
                      b64 = tostring(tlsCrt)
                    }
                  }
                  if b64 != "" {
                    var decoded, decodeErr = b64decode(b64)
                    if decodeErr == nil {
                      caBundleParts = append(caBundleParts, decoded)
                    }
                  }
                }
              }
            }
          }
          var wkca = tostring(dig(validation, "wellKnownCACertificates") | fallback(""))
          if len(caBundleParts) > 0 {
            var caBundle = join(caBundleParts, "\n")
            var policyName = tostring(dig(winningPolicy, "metadata", "name") | fallback(""))
            var caFilename = "btls-" + tostring(routeNs) + "-" + policyName + ".crt"
            var resolvedPath, fileErr = fileRegistry.Register("file", caFilename, caBundle)
            if fileErr == nil {
              btlsCaPath = resolvedPath
            }
          } else if wkca == "System" {
            btlsCaPath = "@system-ca"
          }
        }
      %%}
      # Backend for: {{ routeTypeLabel }} {{ routeNs }}/{{ routeName }} → Service {{ backendName }}:{{ backendPort }}
      backend {{ beKey }}
          guid {{ make_guid("be", beKey) }}
        default-server check{%- if resolvedProtoFlag != "" %} proto {{ resolvedProtoFlag }}{%- end -%}
      {%- if btlsCaPath != "" && btlsCaPath != "@system-ca" %} ssl ca-file {{ btlsCaPath }} verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}) verifyhost {{ btlsHostname }}{%- end -%}
      {%- else if btlsCaPath == "@system-ca" %} ssl verify required{%- if btlsHostname != "" %} sni str({{ btlsHostname }}) verifyhost {{ btlsHostname }}{%- end -%}
      {%- end %}
      {#- Per-rule HTTPRoute timeouts: applied here in the backend
          (HAProxy doesn't allow `set-timeout server` in the frontend
          section, since no backend is bound at frontend phase). The
          matched rule's id is stashed in txn.gw_rule_id by the
          frontend matcher; we gate set-timeout on it. Only emit for
          HTTPRoute (protoFlag == ""), not GRPCRoute. -#}
      {%- if protoFlag == "" %}
        {%- var ruleIdxLocal = 0 %}
        {%- for _, rl := range route | dig("spec", "rules") | toSlice() %}
          {%- var rlTimeouts = rl | dig("timeouts") %}
          {%- if rlTimeouts != nil %}
            {%- var rlReq = rlTimeouts | dig("request") | fallback("") | tostring() %}
            {%- var rlBeReq = rlTimeouts | dig("backendRequest") | fallback("") | tostring() %}
            {%- var tval = rlReq %}
            {%- if tval == "" || tval == "0s" %}{%- tval = rlBeReq %}{%- end %}
            {%- if tval != "" && tval != "0s" %}
              {%- var ruleRouteId = tostring(routeNs) + "_" + tostring(routeName) + "_" + tostring(ruleIdxLocal) %}
        http-request set-timeout server {{ tval }} if { var(txn.gw_rule_id) -m str "{{ ruleRouteId }}" }
            {%- end %}
          {%- end %}
          {%- ruleIdxLocal = ruleIdxLocal + 1 %}
        {%- end %}
        {#- Per-backendRef RequestHeaderModifier
            (SupportHTTPRouteBackendRequestHeaderModification): emit
            set/add/remove header directives that apply unconditionally
            within this per-backendRef backend (the entire backend serves
            exactly one (route, service, port) tuple, so the directives
            run for every request landing here). -#}
        {%- for _, bRef := range backendRefs | toSlice() %}
          {%- if (bRef | dig("name") | fallback("") | tostring()) == backendName -%}
          {%- if (toint(bRef | dig("port") | fallback(0))) == toint(backendPort) %}
            {%- for _, bf := range bRef | dig("filters") | fallback([]any{}) %}
              {%- if (bf | dig("type")) == "RequestHeaderModifier" %}
                {%- var mod = bf | dig("requestHeaderModifier") %}
                {%- if mod != nil %}
                  {%- for _, h := range mod | dig("set") | fallback([]any{}) %}
        http-request set-header {{ h | dig("name") }} '{{ h | dig("value") }}'
                  {%- end %}
                  {%- for _, h := range mod | dig("add") | fallback([]any{}) %}
        http-request add-header {{ h | dig("name") }} '{{ h | dig("value") }}'
                  {%- end %}
                  {%- for _, name := range mod | dig("remove") | fallback([]any{}) %}
        http-request del-header {{ name }}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
        {{ BackendServers(backendName, 10, backendPort, nil, nil, beKey, tostring(routeNs)) | indent(2, true) -}}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  util-sharded-gateway-backends:
    template: |
      {#-
        Sharded Gateway Backend Generator

        Wraps GenerateGatewayBackends with automatic parallel sharding.
        Sharding is auto-calculated: clamp(resourceCount / 300, 1, 2 * GOMAXPROCS)
        Deduplication via first_seen() is thread-safe (uses sync.Map).
      -#}
      {%- import "util-generate-backends-gateway" for GenerateGatewayBackends -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedGatewayBackends(routes []any, protoFlag string, dedupCategory string) -%}
      {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
      {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateGatewayBackends(routes, protoFlag, dedupCategory) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateGatewayBackends(shard_slice(routes, i, n), protoFlag, dedupCategory) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  backends-500-gateway:
    template: |
      {#- Generate backend definitions from HTTPRoute and GRPCRoute resources -#}
      {%- import "util-sharded-gateway-backends" for ShardedGatewayBackends -%}
      {#- Pre-cache gateway analysis during haproxy.cfg render (sequential).
          This ensures the cache is populated BEFORE map files render in parallel,
          preventing race conditions on the shared map. -#}
      {{- render "util-gateway-analysis" -}}
      # gateway/backends-gateway
      {{ ShardedGatewayBackends(resources.httproutes.List(), "", "gatewayBackends_http") }}
      {{- ShardedGatewayBackends(resources.grpcroutes.List(), "h2", "gatewayBackends_grpc") -}}

  backends-501-gateway-invalid:
    template: |
      {#-
        Sink backend for HTTPRoute rules where every backendRef is
        invalid (unsupported kind, non-core group). Per Gateway API
        spec, requests matching such a rule must receive HTTP 500.

        The chart's frontend-matchers-advanced-900-path-match snippet
        routes such rules' traffic here (qualifier
        "BACKEND:gw-invalid-backend") rather than to a real Service-
        backed backend whose `name` happened to collide with the
        invalid ref's `name` field.

        Always rendered (even when no Gateway API resources exist) so
        the BACKEND qualifier always resolves; HAProxy refuses to load
        a config that references a non-existent backend.
      -#}
      # gateway/backends-501-gateway-invalid
      backend gw-invalid-backend
          guid be:gw-invalid-backend
          http-request return status 500

  backends-501-gateway-ssl-passthrough:
    template: |
      {#-
        Gateway API SSL Passthrough Backends

        Purpose:
          TCP backends for SSL passthrough from Gateway API resources.
          Forwards encrypted traffic directly to pods without SSL termination.
          Uses util-gateway-ssl-passthrough for cached analysis.

        Generated HAProxy Config:
          backend ssl-passthrough-<namespace>-<name>
            mode tcp
            server SRV_1 <pod-ip>:<pod-port> check
      -#}
      {#- Get cached SSL passthrough analysis (runs once, shared across all renders) #}
      {%- import "util-backend-servers" for BackendServers -%}
      {{ render "util-gateway-ssl-passthrough" }}

      {%- var sslPassthroughData = shared.Get("gateway_ssl_passthrough").(map[string]any) %}
      {%- var sslBackends []any = sslPassthroughData["backends"] %}
      {%- for _, backendInfo := range sslBackends %}
        {%- var biNamespace = backendInfo["namespace"] %}
        {%- var biRoute = backendInfo["route"] %}
        {%- var biName = backendInfo["name"] %}
        {%- var biRouteType = backendInfo["route_type"] %}
        {%- var routeKey = biNamespace + "/" + biRoute %}
        {%- if first_seen("gateway_ssl_passthrough_backends", routeKey) %}
          {#- Get the actual HTTPRoute resource to extract service details #}
          {%- if biRouteType == "httproute" %}
            {%- var route = resources.httproutes.GetSingle(biNamespace, biRoute) %}
            {%- var generated = false %}
            {%- for _, rule := range route | dig("spec", "rules") | toSlice() %}
              {%- if !generated %}
                {%- for _, backendRef := range rule | dig("backendRefs") | toSlice() %}
                  {%- if !generated %}
                    {%- var refName = backendRef | dig("name") | fallback("") %}
                    {%- var refPort = backendRef | dig("port") | fallback(80) %}
      # gateway/backends-gateway-ssl-passthrough

      backend {{ biName }}
          guid {{ make_guid("be", biName) }}
          mode tcp
          {{ BackendServers(refName, 10, refPort, nil, nil, biName, tostring(biNamespace)) | indent(4, false) }}
                    {%- generated = true %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  util-path-map-entry-gateway-shard:
    template: |
      {#-
        Gateway Path Map Entry Shard Processor

        Purpose: Generates map file entries for a slice of sorted routes.
        This is the inner macro used by sharding.
      -#}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {% macro PathMapEntryGatewayShard(sortedRoutes []any, pathGroups map[string]any, pathType string, suffix string) string %}
      {%- for _, routeInfo := range sortedRoutes %}
        {%- var riHostname = routeInfo["hostname"] %}
        {%- var riPath map[string]any = routeInfo["path"] %}
        {%- var riPath_type = riPath["type"] %}
        {%- var riPathValue = riPath["value"] %}
        {%- var pathKey = riHostname + "|" + riPath_type + "|" + riPathValue %}
        {%- if first_seen("gateway_pathMap_" + pathType + suffix, pathKey) %}
          {%- var routes []any = pathGroups[pathKey] %}
          {%- var firstRoute map[string]any = routes[0] %}
          {%- var frPath map[string]any = firstRoute["path"] %}
          {%- var frPath_type = frPath["type"] %}
        {%- if frPath != nil && frPath_type == pathType %}
          {%- var routeIds = []any{} %}
          {%- for _, r := range routes %}
            {%- var rid string = r["routeId"] %}
            {%- routeIds = append(routeIds, rid) %}
          {%- end %}
          {%- var routeIds_str = join(routeIds, "__") -%}
          {%- var frHostname = firstRoute["hostname"] %}
          {%- var frPath_val string = tostring(frPath["value"]) %}
          {%- if suffix == "" && frPath_val == "/" %}
            {%- continue %}
          {%- end %}
          {%- var frResourceType = firstRoute["resource_type"] %}
          {%- var routeTypeShort = frResourceType | replace("httproute", "http") | replace("grpcroute", "grpc") %}
          {%- var pathSuffix = suffix %}
          {%- if suffix == "/" && hasSuffix(frPath_val, "/") %}
            {%- pathSuffix = "" %}
          {%- end %}
          {%- if suffix == "" && len(frPath_val) > 1 && hasSuffix(frPath_val, "/") %}
            {%- frPath_val = frPath_val[:len(frPath_val)-1] %}
          {%- end %}
      {{ "\n" }}{{ MapKeyForHost(frHostname) }}{{ frPath_val }}{{ pathSuffix }} GW_ROUTE_ID:{{ routeTypeShort }}:{{ routeIds_str }}
        {%- end %}
        {%- end %}
      {%- end %}
      {% end %}

  util-path-map-entry-gateway:
    template: |
      {#- Sharded Gateway Path Map Entry Generator #}
      {%- import "util-path-map-entry-gateway-shard" for PathMapEntryGatewayShard -%}
      {%- import "util-macros" for CalculateShardCount -%}

      {%- macro GeneratePathMapEntries(pathType string, suffix string) %}
      # gateway/util-path-map-entry-gateway ({{ pathType }})

      {#- Get cached route analysis (runs once, shared across all renders) #}
      {{ render "util-gateway-analysis" }}

      {%- var gatewayAnalysis = shared.Get("gatewayAnalysis").(map[string]any) %}
      {%- var sortedRoutes []any = gatewayAnalysis["sortedRoutes"] %}
      {%- var pathGroups map[string]any = gatewayAnalysis["pathGroups"] %}

      {%- var n = toint(CalculateShardCount(len(sortedRoutes), 100)) -%}
      {%- if n <= 1 || len(sortedRoutes) < 100 -%}
      {{ PathMapEntryGatewayShard(sortedRoutes, pathGroups, pathType, suffix) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go PathMapEntryGatewayShard(shard_slice(sortedRoutes, i, n), pathGroups, pathType, suffix) }}
      {%- end -%}
      {%- end -%}
      {%- end macro %}

  util-generate-host-map-gateway:
    template: |
      {#-
        Generate host map entries for Gateway API routes.

        Per Gateway API spec the effective hostname set for a route is
        the *intersection* of the route's `spec.hostnames` with each
        attached listener's hostname:

          - route empty + listener empty           → "" (catch-all)
          - route empty + listener H               → H  (route inherits)
          - route H... + listener "" (catch-all)   → each H (route narrows)
          - route H... + listener L                → per-pair intersection
            (drops pairs with no intersection — e.g. `wildcard.io` against
             `*.wildcard.io` does NOT intersect, since `*.wildcard.io`
             matches at least one prefix label, not the bare base)

        AnalyzeRoutes does the same computation for the per-route
        routeInfo entries that drive advanced matchers; this snippet
        mirrors the logic so host.map and the route-analysis view stay
        consistent.
      -#}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {%- import "util-hostname-intersect-gateway" for HostnameSinglePairIntersection -%}
      {%- macro GenerateHostMap(routes []any, route_type string) -%}
      {%- for _, route := range routes %}
      {%%
        var routeHostnames = route | dig("spec", "hostnames") | toSlice()
        var parentRefs = dig(route, "spec", "parentRefs") | toSlice()
        var effectiveHosts = map[string]bool{}
        var resolvedGwCount = 0
        var routeNs = tostring(dig(route, "metadata", "namespace") | fallback(""))
        for _, parentRef := range parentRefs {
          var prGroup = tostring(dig(parentRef, "group") | fallback("gateway.networking.k8s.io"))
          var prKind = tostring(dig(parentRef, "kind") | fallback("Gateway"))
          if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
            continue
          }
          var gwNs = tostring(dig(parentRef, "namespace") | fallback(routeNs))
          var gwName = tostring(dig(parentRef, "name") | fallback(""))
          var section = tostring(dig(parentRef, "sectionName") | fallback(""))
          var gw = resources.gateways.GetSingle(gwNs, gwName)
          if gw == nil {
            continue
          }
          resolvedGwCount = resolvedGwCount + 1
          for _, listener := range dig(gw, "spec", "listeners") | toSlice() {
            var listenerName = tostring(dig(listener, "name") | fallback(""))
            if section != "" && section != listenerName {
              continue
            }
            var listenerHostname = tostring(dig(listener, "hostname") | fallback(""))
            if len(routeHostnames) == 0 {
              effectiveHosts[listenerHostname] = true
            } else if listenerHostname == "" {
              for _, rh := range routeHostnames {
                effectiveHosts[tostring(rh)] = true
              }
            } else {
              for _, rh := range routeHostnames {
                var inter = HostnameSinglePairIntersection(listenerHostname, tostring(rh))
                if inter != "" {
                  effectiveHosts[inter] = true
                }
              }
            }
          }
        }
        // Fallback when no parentRef resolves to a known Gateway:
        //   - true orphan (no parentRefs at all), or
        //   - chart-test fixture with parentRefs but no Gateway resource.
        // Routes that DID resolve at least one Gateway but found no
        // intersecting listener produce no entries (spec-correct).
        if resolvedGwCount == 0 {
          if len(routeHostnames) == 0 {
            effectiveHosts[""] = true
          } else {
            for _, rh := range routeHostnames {
              effectiveHosts[tostring(rh)] = true
            }
          }
        }
        var hostnames = []any{}
        for h := range effectiveHosts {
          hostnames = append(hostnames, h)
        }
      %%}
      {%- if len(hostnames) > 0 %}
      {%- var routeNs = route | dig("metadata", "namespace") | fallback("") %}
      {%- var routeName = route | dig("metadata", "name") | fallback("") %}
      # {{ route_type }}: {{ routeNs }}/{{ routeName }} ({{ len(hostnames) }} hosts)
      {% for _, hostname := range hostnames %}
      {%- if tostring(hostname) != "" %}
      {%- var hostKey = MapKeyForHost(tostring(hostname)) %}
      {{ hostKey }} {{ hostKey }}
      {%- end %}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-host-map-gateway:
    template: |
      {#- Sharded host map generator for Gateway API routes -#}
      {%- import "util-generate-host-map-gateway" for GenerateHostMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedHostMap(routes []any, route_type string) -%}
      {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
      {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateHostMap(routes, route_type) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateHostMap(shard_slice(routes, i, n), route_type) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-host-500-gateway:
    template: |
      {#- Generate host map entries for Gateway API routes #}
      {%- import "util-sharded-host-map-gateway" for ShardedHostMap %}
      # gateway/map-host-gateway
      {{- ShardedHostMap(resources.httproutes.List(), "HTTPRoute") -}}
      {{- ShardedHostMap(resources.grpcroutes.List(), "GRPCRoute") -}}

  map-host-regex-500-gateway:
    template: |
      {#-
        Wildcard listener hostnames as regex entries.

        For each Gateway listener whose hostname starts with `*.`,
        emit a regex map entry that matches the suffix at any depth
        (per Gateway API spec — `*.example.com` matches both
        `foo.example.com` and `a.b.foo.example.com`, but NOT
        `example.com` itself). The mapped value reuses the existing
        leading-dot host_match key (`.example.com`) so downstream
        path map lookups don't need to change.

        Why a regex map: HAProxy's `regsub(^[^.]*,,)` fallback in
        base.yaml only strips one label, so a request to
        `multiple.prefixes.bar.com` against an `*.bar.com` listener
        misses both the exact host.map and the single-strip
        fallback. `map_reg` lets a single entry match any depth.

        Why the leading anchor `^[^.]+(?:\.[^.]+)*\.bar\.com$`:
          - `[^.]+` requires at least one label,
          - `(?:\.[^.]+)*` allows arbitrarily-many extra labels,
          - the trailing `\.bar\.com$` pins the wildcard suffix.
        This excludes `bar.com` itself (which would have been matched
        already by the exact host.map entry for any sibling exact
        listener — and per spec must not match `*.bar.com`).
      -#}
      # gateway/map-host-regex-gateway
      {%%
        var seen = map[string]bool{}
        var suffixEntries = []any{}
        for _, gw := range resources.gateways.List() {
          for _, listener := range dig(gw, "spec", "listeners") | toSlice() {
            var h = tostring(dig(listener, "hostname") | fallback(""))
            if !hasPrefix(h, "*.") {
              continue
            }
            var suffix = h[2:]
            if seen[suffix] {
              continue
            }
            seen[suffix] = true
            suffixEntries = append(suffixEntries, map[string]any{"suffix": suffix})
          }
        }
        // Most-specific (longest) suffix wins HAProxy `map_reg` ties — that's
        // first-match-wins on file order, so emit longer suffixes first. Per
        // Gateway API spec: when a request Host matches multiple listeners'
        // wildcard hostnames, the most-specific one owns the request (e.g.
        // `bar.foo.example.com` belongs to `*.foo.example.com`, not `*.example.com`).
      %%}
      {%- var sortedSuffixEntries = suffixEntries | sort_by([]string{"$.suffix | length:desc"}) %}
      {%- for _, entry := range sortedSuffixEntries %}
      {%- var suffix = tostring(entry | dig("suffix")) %}
      ^[^.]+(?:\.[^.]+)*\.{{ replace(suffix, ".", "\\.") }}$ .{{ suffix }}
      {%- end %}

  map-path-exact-500-gateway:
    template: |
      {#- Generate exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-exact-gateway
      {{ GeneratePathMapEntries("Exact", "") }}

  map-pfxexact-500-gateway:
    template: |
      {#- Generate prefix-exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
