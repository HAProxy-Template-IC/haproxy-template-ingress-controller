      {{ GeneratePathMapEntries("PathPrefix", "/") }}

  util-generate-path-regex-map-gateway:
    template: |
      {#- Macro to generate regex path map entries for HTTPRoute -#}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {%- macro GeneratePathRegexMap(routes []any) -%}
      {%- for _, route := range routes %}
      {%- var routeNs = route | dig("metadata", "namespace") | fallback("") %}
      {%- var routeName = route | dig("metadata", "name") | fallback("") %}
      {%- var hostnames = route | dig("spec", "hostnames") | toSlice() | coalesce([]any{""}) %}
      {%- var rules = route | dig("spec", "rules") | toSlice() | coalesce([]any{}) %}
      {%- var regexEntries = []any{} %}
      {%- for _, hostname := range hostnames %}
      {%- for _, rule := range rules %}
      {%- var backendRefs = rule | dig("backendRefs") %}
      {%- if backendRefs != nil %}
      {%- var backendRefs_slice = backendRefs | toSlice() %}
      {%- var firstBackend = backendRefs_slice[0] %}
      {%- var backend = map[string]any{"name": firstBackend | dig("name") | fallback(""), "port": firstBackend | dig("port") | fallback(80)} %}
      {%- var matches []any = rule | dig("matches") | coalesce([]any{map[string]any{}}) %}
      {%- for _, match := range matches %}
      {%- var matchPath_type = match | dig("path", "type") | fallback("") %}
      {%- var matchPathValue = match | dig("path", "value") | fallback("/") %}
      {%- if matchPath_type == "RegularExpression" %}
      {%- regexEntries = append(regexEntries, map[string]any{
        "hostname": hostname,
        "pathValue": matchPathValue,
        "backend": backend,
      }) %}
      {%- end %}
      {%- end %}
      {%- end %}
      {%- end %}
      {%- end %}
      {%- if len(regexEntries) > 0 %}
      # HTTPRoute: {{ routeNs }}/{{ routeName }} ({{ len(regexEntries) }} regex paths)
      {% for _, entry := range regexEntries -%}
      {{ MapKeyForHost(entry["hostname"]) }}{{ entry["pathValue"] }} {{ BackendNameGateway(route, entry["backend"]) }}
      {% end -%}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-path-regex-map-gateway:
    template: |
      {#- Sharded regex path map generator for HTTPRoute -#}
      {%- import "util-generate-path-regex-map-gateway" for GeneratePathRegexMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedPathRegexMap(routes []any) -%}
      {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
      {%- if n <= 1 || len(routes) < 100 -%}
      {{ GeneratePathRegexMap(routes) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GeneratePathRegexMap(shard_slice(routes, i, n)) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-path-regex-500-gateway:
    template: |
      {#- Generate regex path map entries for HTTPRoute with RegularExpression type -#}
      {%- import "util-sharded-path-regex-map-gateway" for ShardedPathRegexMap %}
      # gateway/map-path-regex-gateway
      {{ ShardedPathRegexMap(resources.httproutes.List()) }}

  util-generate-weighted-backend-map-gateway:
    template: |
      {#- Macro to generate weighted backend map entries for HTTPRoute -#}
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {%- macro GenerateWeightedBackendMap(routes []any) -%}
      {%- for _, route := range routes %}
      {%- var routeNs = route | dig("metadata", "namespace") | fallback("") %}
      {%- var routeName = route | dig("metadata", "name") | fallback("") %}
      {%- var rules = route | dig("spec", "rules") | toSlice() | coalesce([]any{}) %}
      {%- var weightedEntries = []any{} %}
      {%- var ruleIdx = 0 %}
      {%- for _, rule := range rules %}
        {%- var backendRefs = rule | dig("backendRefs") %}
        {%- if backendRefs != nil %}
          {%- var refsSlice = backendRefs | toSlice() %}
          {%- if len(refsSlice) > 1 %}
            {%- var routeKey = routeNs + "_" + routeName + "_" + ruleIdx %}
            {%- var cumulative = 0 %}
            {%- for _, backendRef := range refsSlice %}
              {%- var backend = map[string]any{"name": backendRef | dig("name") | fallback(""), "port": backendRef | dig("port") | fallback(80)} %}
              {%- var weight = backendRef | dig("weight") | fallback(1) %}
              {%- for i := cumulative; i < cumulative + weight; i++ %}
                {%- weightedEntries = append(weightedEntries, map[string]any{
                  "index": i,
                  "routeKey": routeKey,
                  "backend": backend,
                }) %}
              {%- end %}
              {%- cumulative = cumulative + weight %}
            {%- end %}
          {%- end %}
        {%- end %}
        {%- ruleIdx = ruleIdx + 1 %}
      {%- end %}
      {%- if len(weightedEntries) > 0 %}
      # HTTPRoute: {{ routeNs }}/{{ routeName }} (weighted rules)
      {% for _, entry := range weightedEntries -%}
      {{ entry["index"] }}:{{ entry["routeKey"] }} {{ BackendNameGateway(route, entry["backend"]) }}
      {% end -%}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-weighted-backend-map-gateway:
    template: |
      {#- Sharded weighted backend map generator for HTTPRoute -#}
      {%- import "util-generate-weighted-backend-map-gateway" for GenerateWeightedBackendMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedWeightedBackendMap(routes []any) -%}
      {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
      {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateWeightedBackendMap(routes) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateWeightedBackendMap(shard_slice(routes, i, n)) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-weighted-backend-500-gateway:
    template: |
      {#- Generate weighted backend map entries for HTTPRoute -#}
      {%- import "util-sharded-weighted-backend-map-gateway" for ShardedWeightedBackendMap %}
      # gateway/map-weighted-backend-gateway
      {{ ShardedWeightedBackendMap(resources.httproutes.List()) }}

  # Frontend-extra: HTTPS misdirected-request detection (Gateway API
  # SupportGatewayHTTPSListenerDetectMisdirectedRequests).
  #
  # Per RFC 9110 §15.5.20 / Gateway API spec, an HTTPS listener that
  # carves up TLS connections by SNI must reject requests whose Host
  # header doesn't match the SNI: the client connected to a server
  # certificate the route doesn't authorise for that hostname.
  #
  # We only emit the directive on the HTTPS path (`{ ssl_fc }`); the
  # HTTP frontend renders the same snippet but the guards skip it.
  # Comparing via strcmp(<var>) in a converter chain — sample-fetch
  # to-sample-fetch comparison isn't expressible with `-m str`, but
  # strcmp returns 0 on equality which we negate.
  # gateway/frontend-extra-050-gateway-multi-port-bind:
  # Emits an additional `bind *:<port>` directive for every unique
  # non-default Gateway listener port we observe. Without this the HTTP
  # frontend only listens on the chart's `httpPort`, so any HTTPRoute
  # whose parent listener uses a different port (e.g. 8090) is
  # unreachable. The default port (`httpPort`) is already bound by
  # base.yaml; we filter it out so we don't emit a duplicate bind line.
  # HTTPS listeners are intentionally excluded — TLS binds need a crt
  # list and live in ssl.yaml.
  frontend-extra-050-gateway-multi-port-bind:
    template: |
      {%- var defaultPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var seen = map[int]bool{} %}
      {%- seen[defaultPort] = true %}
      {%- for _, gw := range resources.gateways.List() | toSlice() %}
        {%- for _, listener := range gw | dig("spec", "listeners") | fallback([]any{}) | toSlice() %}
          {%- var protocol = listener | dig("protocol") | fallback("HTTP") | tostring() %}
          {%- if protocol == "HTTP" %}
            {%- var port = toint(listener | dig("port") | fallback(0)) %}
            {%- if port > 0 && !seen[port] %}
              {%- seen[port] = true %}
      bind *:{{ port }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
  # gateway/frontend-extra-100-gateway-misdirected:
  # Implements HTTPS listener-isolation 421 detection per the
  # HTTPRouteHTTPSListenerDetectMisdirectedRequests conformance test.
  #
  # The naive "SNI != Host → 421" check is wrong: it returns 421 when
  # SNI=example.org and Host=unknown-example.org (no listener claims
  # `unknown-example.org`, so the request just routes through the
  # catch-all listener and 404s on the path lookup).
  #
  # The spec-correct rule is: a request is misdirected only when its
  # Host belongs to a *different* HTTPS listener than the one selected
  # by SNI. To express that we materialise two maps from the chart's
  # known HTTPS listeners (one per Gateway, the chart loops them
  # below):
  #   - listener-hostname-claim.map: exact hostname → itself
  #   - listener-hostname-claim-regex.map: regex (matching the wildcard
  #       expansion of `*.example.com` etc.) → the wildcard pattern
  #
  # The 421 check looks up SNI and Host in both maps; whichever
  # listener claims them. If both lookups produce the same listener
  # identity (including both being unclaimed → empty string → catch-all
  # listener), the request is on the right listener — let routing run.
  # Otherwise the listener doesn't own the requested host → 421.
  frontend-extra-100-gateway-misdirected:
    template: |
      {%- var exactEntries = []any{} %}
      {%- var regexEntries = []any{} %}
      {%- for _, gw := range resources.gateways.List() | toSlice() %}
        {%- for _, listener := range gw | dig("spec", "listeners") | fallback([]any{}) | toSlice() %}
          {%- var protocol = listener | dig("protocol") | fallback("HTTP") | tostring() %}
          {%- if protocol == "HTTPS" || protocol == "TLS" %}
            {%- var lh = listener | dig("hostname") | fallback("") | tostring() %}
            {%- if lh != "" %}
              {%- if regex_search(lh, "^\\*\\.") %}
                {#- Wildcard hostname — match exactly one DNS label
                    in front of the suffix, per Gateway API spec. -#}
                {%- var suffix = lh[2:] %}
                {%- var regexBase = tostring(replace(suffix, ".", "\\.")) %}
                {%- regexEntries = append(regexEntries, "^[^.]+\\." + regexBase + "\\$ " + lh) %}
              {%- else %}
                {%- exactEntries = append(exactEntries, lh + " " + lh) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- var exactPath, _ = fileRegistry.Register("map", "listener-hostname-claim.map", join(exactEntries, "\n") + "\n") %}
      {%- var regexPath, _ = fileRegistry.Register("map", "listener-hostname-claim-regex.map", join(regexEntries, "\n") + "\n") %}
      # gateway/frontend-extra-misdirected
      http-request set-var(txn.gw_host_canonical) req.fhdr(Host),lower,field(1,:)
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map({{ exactPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 }
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map_reg({{ regexPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_sni_listener) -m len 0 }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map({{ exactPath }},'') if { var(txn.gw_host_canonical) -m found }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map_reg({{ regexPath }},'') if { var(txn.gw_host_canonical) -m found } { var(txn.gw_host_listener) -m len 0 }
      http-request return status 421 if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_host_canonical) -m found } !{ var(txn.gw_sni_listener),strcmp(txn.gw_host_listener) eq 0 }
  # Advanced matcher setup - processes GW_ROUTE_ID qualifier (runs early)
  # Named with 010- prefix so alphabetical sort matches intended execution order
  frontend-matchers-advanced-010-route-id-setup:
    template: |
      {#- Process GW_ROUTE_ID qualifier to extract route type and route ID #}
      {#- Format: GW_ROUTE_ID:<route_type>:<routeIds> #}
      {#- Example: GW_ROUTE_ID:http:ns1_route1_0__ns2_route2_1 #}
      {#- This runs first (010 prefix) to set variables used by later matchers #}
      # gateway/frontend-matchers-advanced-010-route-id-setup
      http-request set-var(req.gw_route_type) var(txn.path_match),field(2,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }
      http-request set-var(req.gw_routeId) var(txn.path_match),field(3,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }

  # Advanced matcher generator - creates http-request statements for method/header/query matching
  # Named with 500- prefix so alphabetical sort matches intended execution order (runs after 010-)
  frontend-matchers-advanced-500-gateway:
    template: |
      {{- "" }}
      {# Generate http-request statements for routes with advanced matchers
         This is injected into base template via the advanced-matcher-* extension point #}
      # gateway/frontend-matchers-advanced-500-gateway
      {{ render "util-gateway-analysis" -}}
      {%- var gatewayAnalysis = shared.Get("gatewayAnalysis").(map[string]any) %}
      {%- var sortedRoutes []any = gatewayAnalysis["sortedRoutes"] %}
      {%- if len(sortedRoutes) > 0 %}
      # Advanced route matching (method/header/query)
      {%- for _, routeInfo := range sortedRoutes %}
        {%- var riMatch map[string]any = routeInfo["match"] %}
        {%- var riRoute map[string]any = routeInfo["route"] %}
        {%- var riRouteMeta = riRoute | dig("metadata") %}
        {%- var riResourceType = routeInfo["resource_type"] %}
        {%- var riIsGrpc bool = routeInfo["is_grpc"] %}
        {%- var riRouteId = routeInfo["routeId"] %}
        {%- var riConflictGroup = routeInfo["conflictGroup"] %}
        {%- var riRuleIdx = routeInfo["ruleIdx"] %}
        {%- var riPath map[string]any = routeInfo["path"] %}
        {#- Detect "path-only" rules — those with no method/header/query/grpc
            sub-matchers. The Gateway API spec requires evaluating rules in
            order of specificity, falling through to less-specific rules
            when a more-specific rule's sub-matchers don't all pass. The
            existing gw_routeId scope check (set by the path-map step to the
            most-specific path's rule IDs) blocks fallback across paths
            within the same HTTPRoute, so a path-only catch-all loses to a
            failed-but-more-specific sibling. We give path-only rules a
            relaxed scope check (gw_routeId begins with this HTTPRoute's
            prefix) plus a direct path predicate, restoring spec-compliant
            fallback semantics without altering the strict scope check for
            rules that already gate on their own sub-matchers. #}
        {%- var riHeaders_check = riMatch["headers"] %}
        {%- var riParams_check = riMatch["queryParams"] %}
        {%- var riMethod_check = riMatch["method"] %}
        {%- var grpcMethodCheck = riMatch["method"] %}
        {%- var isPathOnly = (riMethod_check == nil || riResourceType != "httproute") && riHeaders_check == nil && riParams_check == nil && (!riIsGrpc || grpcMethodCheck == nil) %}
        {#- Early exit: skip if another matcher already won #}
        {%- var conditions = []any{"!{ var(txn.gw_rule_id) -m found }"} %}

        {%- if isPathOnly %}
          {#- Path-only fallback: scope to this HTTPRoute (any rule of it
              must have been the path-map winner), plus the rule's path
              must match the request directly. -#}
          {%- var riNsScope = riRouteMeta | dig("namespace") | fallback("") | tostring() %}
          {%- var riNameScope = riRouteMeta | dig("name") | fallback("") | tostring() %}
          {%- var httprouteScope = riNsScope + "_" + riNameScope + "_" %}
          {%- conditions = append(conditions, "{ var(req.gw_routeId) -m beg \"" + httprouteScope + "\" }") %}
          {#- Direct path match for safety so different paths within the
              same HTTPRoute don't cross-match. -#}
          {%- if riPath != nil %}
            {%- var pathOnlyType = tostring(riPath["type"]) %}
            {%- var pathOnlyValue = tostring(riPath["value"]) %}
            {%- if pathOnlyType == "Exact" %}
              {%- conditions = append(conditions, "{ path \"" + pathOnlyValue + "\" }") %}
            {%- else if pathOnlyType == "RegularExpression" %}
              {%- var escapedPathOnly = replace(pathOnlyValue, "$", "\\$") %}
              {%- conditions = append(conditions, "{ path -m reg \"" + escapedPathOnly + "\" }") %}
            {%- else %}
              {#- PathPrefix (default). Per Gateway API spec, PathPrefix
                  matches whole segments — `/v2` matches `/v2`, `/v2/`,
                  `/v2/foo`, but NOT `/v2example`. HAProxy's plain
                  `path_beg` is byte-prefix (no boundary) and matches
                  the last case incorrectly; `path_dir` does a segment
                  match but it matches a directory ANYWHERE in the
                  path (so `/v2` would match `/foo/v2/example`). The
                  spec requires anchoring at the START of the path.

                  Use a regex anchored to ^ that matches either the
                  exact prefix or the prefix followed by a slash:

                      ^<prefix>(/|$)

                  Special case: bare `/` (root) matches every path —
                  emit a trivial path_beg "/" condition that's cheaper
                  than a regex and still always satisfied. -#}
              {%- if pathOnlyValue == "/" || pathOnlyValue == "" %}
                {%- conditions = append(conditions, "{ path_beg \"/\" }") %}
              {%- else %}
                {%- var pathPrefixValue = pathOnlyValue %}
                {%- if hasSuffix(pathPrefixValue, "/") %}
                  {%- pathPrefixValue = pathPrefixValue[:len(pathPrefixValue)-1] %}
                {%- end %}
                {%- var escaped = sanitize_regex(pathPrefixValue) %}
                {#- HAProxy expands $VAR / ${VAR} in config strings; the
                    documented escape for a literal dollar is `\$`. -#}
                {%- conditions = append(conditions, "{ path -m reg \"^" + escaped + "(/|\\$)\" }") %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- else %}
          {#- Rule has sub-matchers — keep the strict same-path conflictGroup
              check; the sub-matchers' own predicates already narrow the rule
              to its declared path. -#}
          {%- conditions = append(conditions, "{ var(req.gw_routeId) -m str \"" + riConflictGroup + "\" }") %}
        {%- end %}

        {#- Method matcher (HTTPRoute only) #}
        {%- var riMethod = riMatch["method"] %}
        {%- if riMethod != nil && riResourceType == "httproute" %}
          {%- conditions = append(conditions, "{ method " + (riMethod) + " }") %}
        {%- end %}

        {#- Header matchers #}
        {%- var riHeaders = riMatch["headers"] %}
        {%- for _, header := range riHeaders | toSlice() %}
          {%- var headerType = header["type"] %}
          {%- var headerName = header["name"] %}
          {%- var headerValue = header["value"] %}
          {%- if headerType == "Exact" %}
            {%- conditions = append(conditions, "{ req.hdr(" + headerName + ") \"" + headerValue + "\" }") %}
          {%- else if headerType == "RegularExpression" %}
            {#- Escape $ as \$ for HAProxy config (prevents env var expansion) #}
            {%- var escapedHeaderValue = replace(headerValue, "$", "\\$") %}
            {%- conditions = append(conditions, "{ req.hdr(" + headerName + ") -m reg \"" + escapedHeaderValue + "\" }") %}
          {%- end %}
        {%- end %}

        {#- Query parameter matchers (HTTPRoute only) #}
        {%- var riParams = riMatch["queryParams"] %}
        {%- for _, param := range riParams | toSlice() %}
          {%- var paramType = param["type"] %}
          {%- var paramName = param["name"] %}
          {%- var paramValue = param["value"] %}
          {%- if paramType == "Exact" %}
            {%- conditions = append(conditions, "{ urlp(" + paramName + ") \"" + paramValue + "\" }") %}
          {%- else if paramType == "RegularExpression" %}
            {#- Escape $ as \$ for HAProxy config (prevents env var expansion) #}
            {%- var escapedParamValue = replace(paramValue, "$", "\\$") %}
            {%- conditions = append(conditions, "{ urlp(" + paramName + ") -m reg \"" + escapedParamValue + "\" }") %}
          {%- end %}
        {%- end %}

        {#- GRPCRoute method matcher #}
        {%- var grpcMethod = riMatch["method"] %}
        {%- if riIsGrpc && grpcMethod != nil %}
          {%- var grpcMethod_map map[string]any = grpcMethod %}
          {%- var grpcService = grpcMethod_map["service"] %}
          {%- if grpcService != nil %}
            {%- var grpcPath = "/" + (grpcService) %}
            {%- var grpcMethod_name = grpcMethod_map["method"] %}
            {%- if grpcMethod_name != nil %}
              {%- grpcPath = grpcPath + "/" + (grpcMethod_name) %}
            {%- end %}
            {#- Match against :path header which contains gRPC method #}
            {%- var grpcType = grpcMethod_map["type"] %}
            {%- if grpcType == "Exact" %}
              {%- conditions = append(conditions, "{ req.hdr(:path) \"" + grpcPath + "\" }") %}
            {%- else if grpcType == "RegularExpression" %}
              {#- Escape $ as \$ for HAProxy config (prevents env var expansion) #}
              {%- var escapedGrpcPath = replace(grpcPath, "$", "\\$") %}
              {%- conditions = append(conditions, "{ req.hdr(:path) -m reg \"" + escapedGrpcPath + "\" }") %}
            {%- end %}
          {%- end %}
        {%- end %}

        {#- Set txn.gw_rule_id to mark this rule as winner #}
        {%- if len(conditions) > 0 %}
          {#- Build matcher type description for provenance comment #}
          {%- var descParts = []any{} %}
          {%- if riMethod != nil && riResourceType == "httproute" %}
            {%- descParts = append(descParts, "method " + (riMethod)) %}
          {%- end %}
          {%- if riHeaders != nil %}
            {%- descParts = append(descParts, len(toSlice(riHeaders)) + " headers") %}
          {%- end %}
          {%- if riParams != nil %}
            {%- descParts = append(descParts, len(toSlice(riParams)) + " query params") %}
          {%- end %}
          {%- if riIsGrpc && grpcMethod != nil %}
            {%- descParts = append(descParts, "gRPC method") %}
          {%- end %}
          {%- var matcherDesc = "path-only" %}
          {%- if len(descParts) > 0 %}{%- matcherDesc = join(descParts, ", ") %}{%- end %}
          {%- var riNs = riRouteMeta | dig("namespace") | fallback("") %}
          {%- var riName = riRouteMeta | dig("name") | fallback("") %}
      # Rule: {{ riResourceType | title() }} {{ riNs }}/{{ riName }} rule[{{ riRuleIdx }}] - {{ matcherDesc }}
      http-request set-var(txn.gw_rule_id) str({{ riRouteId }}) if {{ join(conditions, " ") }}
          {#- Debug headers if enabled #}
          {%- if debug | fallback(false) %}
            {#- Build detailed match reason #}
            {%- var matchTypes = []any{} %}
            {%- if riMethod != nil && riResourceType == "httproute" %}
              {%- matchTypes = append(matchTypes, "method") %}
            {%- end %}
            {%- if riHeaders != nil %}
              {%- matchTypes = append(matchTypes, "header") %}
            {%- end %}
            {%- if riParams != nil %}
              {%- matchTypes = append(matchTypes, "query") %}
            {%- end %}
            {%- if riIsGrpc && grpcMethod != nil %}
              {%- matchTypes = append(matchTypes, "grpc-method") %}
            {%- end %}
            {%- var matchTypes_str = "advanced" %}
            {%- if len(matchTypes) > 0 %}{%- matchTypes_str = join(matchTypes, "+") %}{%- end %}
      http-request set-var(txn.matched_route) str({{ riNs }}/{{ riName }}/rule{{ riRuleIdx }}) if {{ join(conditions, " ") }}
      http-request set-var(txn.match_reason) str({{ matchTypes_str }}) if {{ join(conditions, " ") }}
          {% end %}
        {% end %}
      {% end %}
      {% end %}

  # Path match setting - sets txn.path_match based on winning rule ID
  # Named with 900- prefix so alphabetical sort matches intended execution order (runs last)
  frontend-matchers-advanced-900-path-match:
    template: |
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {{- "" }}
      {# Set txn.path_match for backend selection based on winning rule
         Runs after frontend-matchers-advanced-500-gateway sets txn.gw_rule_id (900 prefix ensures late ordering) #}
      # gateway/frontend-matchers-advanced-900-path-match
      {{ render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- var gatewayAllRoutes = ga["allRoutes"] | toSlice() %}
      {%- if len(gatewayAllRoutes) > 0 %}
      # Set txn.path_match for backend selection based on txn.gw_rule_id
      {% for _, routeInfo := range gatewayAllRoutes -%}
        {%- var backendRefs []any = routeInfo | dig("rule", "backendRefs") | fallback([]any{}) %}
        {%- if len(backendRefs) > 0 %}
          {#- Filter to backendRefs the chart can route to. Per Gateway API
              spec, a backendRef is "valid" only when:
                - Group is "" or "core" (kept simple, the chart only
                  supports core/v1 Services)
                - Kind is Service
                - The referenced Service actually exists
              Anything else must result in HTTP 500 for traffic that
              matches this rule. The route's ResolvedRefs status
              condition reflects the failure separately
              (InvalidKind / BackendNotFound, set elsewhere). Filter
              once here and dispatch on the valid count. -#}
          {%- var validRefs = []any{} %}
          {%- var routeNs = tostring(routeInfo | dig("route", "metadata", "namespace") | fallback("")) %}
          {%- var routeKind = tostring(routeInfo | dig("route", "kind") | fallback("HTTPRoute")) %}
          {%- for _, ref := range backendRefs %}
            {%- var refMap map[string]any = ref %}
            {%- var refGroup = refMap | dig("group") | fallback("") | tostring() %}
            {%- var refKind = refMap | dig("kind") | fallback("Service") | tostring() %}
            {%- if (refGroup == "" || refGroup == "core") && refKind == "Service" %}
              {%- var refName = tostring(refMap | dig("name") | fallback("")) %}
              {%- var refNs = tostring(refMap | dig("namespace") | fallback(routeNs)) %}
              {%- var svc = resources.services.GetSingle(refNs, refName) %}
              {%- if svc != nil %}
                {#- Cross-namespace backend refs require a permitting
                    ReferenceGrant (per Gateway API spec). Without one,
                    the route should set ResolvedRefs=False/RefNotPermitted
                    AND traffic must NOT flow to the unauthorized backend
                    (we route those rules to gw-invalid-backend → 500). -#}
                {%- var refPermitted = true %}
                {%- if refNs != routeNs %}
                  {%- if ReferenceGrantPermitted(
                        "gateway.networking.k8s.io", routeKind, routeNs,
                        "", "Service", refNs, refName) != "true" %}
                    {%- refPermitted = false %}
                  {%- end %}
                {%- end %}
                {%- if refPermitted %}
                  {%- validRefs = append(validRefs, ref) %}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}

          {%- var qualifier = "" %}
          {%- if len(validRefs) == 0 %}
            {#- No valid backendRefs at all → route to the chart-level
                500-returning sink. Spec calls for HTTP 500 (not 503)
                whenever every backendRef in a rule is unresolvable.
                Conformance tests gating this:
                  HTTPRouteInvalidBackendRefUnknownKind — kind=NonExistent
                  HTTPRouteInvalidNonExistentBackendRef — Service missing
                Both share the same handling: route to gw-invalid-backend,
                which carries `http-request return status 500`. -#}
            {%- qualifier = "BACKEND:gw-invalid-backend" %}
          {%- else if len(validRefs) == 1 %}
            {#- Single valid backend: BACKEND qualifier #}
            {%- var backendRef map[string]any = validRefs[0] %}
            {%- var backendName = "gtw_" + (routeInfo | dig("route", "metadata", "namespace")) + "_" + (routeInfo | dig("route", "metadata", "name")) + "_" + (backendRef["name"]) + "_" + (backendRef["port"]) %}
            {%- qualifier = "BACKEND:" + backendName %}
          {%- else %}
            {#- Multiple valid backends: MULTIBACKEND qualifier. Note: a
                mixed (valid + invalid) rule renders as MULTIBACKEND with
                only the valid refs counted in the weighted distribution.
                The traffic share that should have gone to invalid refs
                "leaks" to the valid ones — a coarse approximation of the
                spec's "invalid share returns 500" rule. Refining to a
                proper weighted invalid-sink is follow-up work; the
                all-invalid case (the conformance test that gates this)
                is handled correctly above. -#}
            {%- var totalWeight = 0 %}
            {%- for _, ref := range validRefs %}
              {%- var refMap map[string]any = ref %}
              {%- var weight = refMap | dig("weight") | fallback(1) %}
              {%- totalWeight = totalWeight + (weight) %}
            {%- end %}
            {%- var routeKey = (routeInfo | dig("route", "metadata", "namespace")) + "_" + (routeInfo | dig("route", "metadata", "name")) + "_" + (routeInfo | dig("ruleIdx")) %}
            {%- qualifier = "MULTIBACKEND:" + totalWeight + ":" + routeKey %}
          {%- end %}
      http-request set-var(txn.path_match) str({{ qualifier }}) if { var(txn.gw_rule_id) -m str "{{ routeInfo | dig("routeId") }}" }
        {% end %}
      {% end %}
      {% end %}
  # Filter: RequestHeaderModifier - modifies request headers before backend selection
  frontend-filters-500-gateway-request-header:
    template: |
      {#- RequestHeaderModifier: set, add, or remove request headers -#}
      {%- import "util-route-condition" for RouteIdCondition -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- if ga["hasRequestHeader_filter"] %}
      # gateway/frontend-filters-gateway-request-header
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- for _, filter := range routeInfo | dig("filters") | fallback([]any{}) %}
          {%- if (filter | dig("type")) == "RequestHeaderModifier" %}
            {%- var routeId = routeInfo | dig("routeId") | tostring() %}
            {%- var cond = RouteIdCondition(routeId) %}
            {%- var mod = filter | dig("requestHeaderModifier") %}
            {%- if mod != nil %}
              {%- for _, h := range mod | dig("set") | fallback([]any{}) %}
      http-request set-header {{ h | dig("name") }} '{{ h | dig("value") }}' if {{ cond }}
              {%- end %}
              {%- for _, h := range mod | dig("add") | fallback([]any{}) %}
      http-request add-header {{ h | dig("name") }} '{{ h | dig("value") }}' if {{ cond }}
              {%- end %}
              {%- for _, name := range mod | dig("remove") | fallback([]any{}) %}
      http-request del-header {{ name }} if {{ cond }}
              {%- end %}
              {%- if debug | fallback(false) %}
      http-request set-var(txn.filters_applied) str(RequestHeaderModifier) if {{ cond }} !{ var(txn.filters_applied) -m found }
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}
  # HTTPRoute spec.rules[].timeouts is rendered directly into each
  # gateway backend (see GenerateGatewayBackends). HAProxy doesn't allow
  # `http-request set-timeout server` in the frontend section, so the
  # frontend just sets txn.gw_rule_id (already done by the route matcher
  # at frontend-matchers-advanced-900-path-match time) and the backend
  # gates set-timeout on that variable.
  # Filter: ResponseHeaderModifier - modifies response headers before sending to client
  frontend-filters-500-gateway-response-header:
    template: |
      {#- ResponseHeaderModifier: set, add, or remove response headers -#}
      {%- import "util-route-condition" for RouteIdCondition -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- if ga["hasResponseHeader_filter"] %}
      # gateway/frontend-filters-gateway-response-header
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- for _, filter := range routeInfo | dig("filters") | fallback([]any{}) %}
          {%- if (filter | dig("type")) == "ResponseHeaderModifier" %}
            {%- var routeId = routeInfo | dig("routeId") | tostring() %}
            {%- var cond = RouteIdCondition(routeId) %}
            {%- var mod = filter | dig("responseHeaderModifier") %}
            {%- if mod != nil %}
              {%- if debug | fallback(false) %}
      http-request set-var(txn.filters_applied) str(ResponseHeaderModifier) if {{ cond }} !{ var(txn.filters_applied) -m found }
              {%- end %}
              {%- for _, h := range mod | dig("set") | fallback([]any{}) %}
      http-response set-header {{ h | dig("name") }} '{{ h | dig("value") }}' if {{ cond }}
              {%- end %}
              {%- for _, h := range mod | dig("add") | fallback([]any{}) %}
      http-response add-header {{ h | dig("name") }} '{{ h | dig("value") }}' if {{ cond }}
              {%- end %}
              {%- for _, name := range mod | dig("remove") | fallback([]any{}) %}
      http-response del-header {{ name }} if {{ cond }}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}
  # Filter: HTTPRoute CORS — implements SupportHTTPRouteCORS
  #
  # Per Gateway API spec, the CORS filter (spec.rules[].filters[type=CORS])
  # has these knobs:
  #   - allowOrigins: list of origins (exact, wildcard "*", or pattern
  #     "https://*.foo.com" — wildcard is suffix-style on host part)
  #   - allowMethods: list of HTTP methods or "*"
  #   - allowHeaders: list of header names or "*"
  #   - exposeHeaders: list of headers to expose to the browser
  #   - allowCredentials: bool
  #   - maxAge: int (preflight cache duration, in seconds)
  #
  # Browsers send a CORS preflight (OPTIONS with Origin and
  # Access-Control-Request-Method) before non-simple cross-origin
  # requests. The data plane must short-circuit that with a synthetic
  # 200/204 response carrying the negotiated headers — never letting
  # the OPTIONS reach the backend. Simple cross-origin requests (with
  # an Origin header but no preflight) flow to the backend, and the
  # response gets the relevant headers tacked on.
  #
  # We render two HAProxy bits per CORS rule:
  #   1. http-request return ... if METH_OPTIONS Origin matches ...
  #      → preflight short-circuit (with the full set of CORS headers)
  #   2. http-response set-header ... if Origin matches and the rule
  #      matched (txn.gw_rule_id)
  #      → headers on the actual response (Allow-Origin,
  #         Allow-Credentials, Expose-Headers)
  #
  # Origin matching is encoded as a regex over the Origin header.
  # Exact entries get sanitize_regex'd; wildcard entries
  # ("https://*.foo.com") become "^https://[^.]+(?:\.[^.]+)*\.foo\.com\$";
  # the lone "*" means "match any origin".
  frontend-filters-450-gateway-cors:
    template: |
      {%- import "util-route-condition" for RouteIdCondition -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- if (routeInfo | dig("resource_type")) != "httproute" %}{%- continue %}{%- end %}
        {%- var routeId = routeInfo | dig("routeId") | tostring() %}
        {%- for _, filter := range routeInfo | dig("filters") | fallback([]any{}) %}
          {%- if (filter | dig("type")) != "CORS" %}{%- continue %}{%- end %}
          {%- var cors = filter | dig("cors") %}
          {%- if cors == nil %}{%- continue %}{%- end %}
          {#- Build origin regex. "*" = match-any (no Origin filter); else
              alternation of exact + wildcard patterns. -#}
          {%- var allowOrigins = cors | dig("allowOrigins") | fallback([]any{}) | toSlice() %}
          {%- var hasWildcardOrigin = false %}
          {%- var originAlternatives = []any{} %}
          {%- for _, o := range allowOrigins %}
            {%- var os = tostring(o) %}
            {%- if os == "*" %}
              {%- hasWildcardOrigin = true %}
            {%- else if regex_search(os, "\\*") %}
              {#- wildcard pattern — escape, then turn the literal `\*\.`
                  into a single-or-more-label match. We accept any number
                  of left labels (Gateway API allows any subdomain depth). -#}
              {%- var literal = tostring(sanitize_regex(os)) %}
              {%- var pattern = tostring(replace(literal, "\\*\\.", "[^.]+(?:\\.[^.]+)*\\.")) %}
              {%- originAlternatives = append(originAlternatives, "^" + pattern + "\\$") %}
            {%- else %}
              {%- originAlternatives = append(originAlternatives, "^" + tostring(sanitize_regex(os)) + "\\$") %}
            {%- end %}
          {%- end %}
          {%- var originRegex = "" %}
          {%- if !hasWildcardOrigin && len(originAlternatives) > 0 %}
            {%- originRegex = "(?:" + join(originAlternatives, "|") + ")" %}
          {%- end %}
          {#- Allow-credentials. With credentials true, Allow-Origin must
              echo the request Origin (browsers reject "*"). With
              credentials false, "*" alone makes wildcard origins also
              echo the request Origin (sub-test compliance). -#}
          {%- var allowCreds = cors | dig("allowCredentials") | fallback(false) %}
          {%- var methods = cors | dig("allowMethods") | fallback([]any{}) | toSlice() %}
          {%- var methodsList = []any{} %}
          {%- for _, m := range methods %}
            {%- var ms = tostring(m) %}
            {%- if ms == "*" %}
              {%- methodsList = []any{"GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"} %}
              {%- break %}
            {%- end %}
            {%- methodsList = append(methodsList, ms) %}
          {%- end %}
          {%- var headers = cors | dig("allowHeaders") | fallback([]any{}) | toSlice() %}
          {%- var headersList = []any{} %}
          {%- for _, h := range headers %}
            {%- var hs = tostring(h) %}
            {%- if hs == "*" %}
              {#- Wildcard headers: echo the requested headers from
                  Access-Control-Request-Headers verbatim. We skip the
                  literal Allow-Headers emission and rely on a per-request
                  echo via %[req.fhdr(...)]. -#}
              {%- headersList = []any{"*"} %}
              {%- break %}
            {%- end %}
            {%- headersList = append(headersList, hs) %}
          {%- end %}
          {%- var exposeHeaders = cors | dig("exposeHeaders") | fallback([]any{}) | toSlice() %}
          {%- var exposeList = []any{} %}
          {%- for _, eh := range exposeHeaders %}
            {%- exposeList = append(exposeList, tostring(eh)) %}
          {%- end %}
          {%- var maxAge = cors | dig("maxAge") | fallback(0) %}
          {#- Construct the route-id condition + Origin gate. The
              originRegex is "" when allowOrigins contains "*"; we then
              accept any non-empty Origin. -#}
          {%- var ruleCond = RouteIdCondition(routeId) %}
          {%- var originCond = "{ req.fhdr(Origin) -m found }" %}
          {%- if originRegex != "" %}
            {%- originCond = originCond + " { req.fhdr(Origin) -m reg \"" + originRegex + "\" }" %}
          {%- end %}
          {#- HAProxy caps each directive at 64 tokens; one big
              http-request return with all CORS headers blew that limit.
              We split into:
                1. set-var(txn.gw_cors_preflight) on preflight match
                2. http-request return status 200 if preflight
                3. http-response set-header per CORS header — preflight
                   ones gated on txn.gw_cors_preflight, always-on ones
                   on Origin + rule match.
              http-response runs after http-request return too, so the
              synthetic 200 picks up all the response-side directives. #}
      http-request set-var(txn.gw_cors_origin) req.fhdr(Origin) if {{ originCond }} {{ ruleCond }}
      http-request set-var(txn.gw_cors_preflight) str(1) if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found }
          {%- if len(headersList) > 0 && headersList[0] == "*" %}
      http-request set-var(txn.gw_cors_acrh) req.fhdr(Access-Control-Request-Headers) if { var(txn.gw_cors_preflight) -m str "1" }
          {%- end %}
      http-request return status 200 if { var(txn.gw_cors_preflight) -m str "1" }
      http-response set-header "access-control-allow-origin" "%[var(txn.gw_cors_origin)]" if { var(txn.gw_cors_origin) -m found }
          {%- if allowCreds %}
      http-response set-header "access-control-allow-credentials" "true" if { var(txn.gw_cors_origin) -m found }
          {%- end %}
          {%- if len(exposeList) > 0 %}
      http-response set-header "access-control-expose-headers" "{{ join(exposeList, ", ") }}" if { var(txn.gw_cors_origin) -m found }
          {%- end %}
          {#- Preflight-only response headers — gated on
              txn.gw_cors_preflight so they don't appear on
              regular cross-origin responses. -#}
          {%- if len(methodsList) > 0 %}
      http-response set-header "access-control-allow-methods" "{{ join(methodsList, ", ") }}" if { var(txn.gw_cors_preflight) -m str "1" }
          {%- end %}
          {%- if len(headersList) > 0 %}
            {%- if headersList[0] == "*" %}
      http-response set-header "access-control-allow-headers" "%[var(txn.gw_cors_acrh)]" if { var(txn.gw_cors_preflight) -m str "1" } { var(txn.gw_cors_acrh) -m found }
            {%- else %}
      http-response set-header "access-control-allow-headers" "{{ join(headersList, ", ") }}" if { var(txn.gw_cors_preflight) -m str "1" }
            {%- end %}
          {%- end %}
          {%- if toint(maxAge) > 0 %}
      http-response set-header "access-control-max-age" "{{ maxAge }}" if { var(txn.gw_cors_preflight) -m str "1" }
          {%- end %}
        {%- end %}
      {%- end %}
  # Filter: RequestRedirect - redirects requests to different locations
  frontend-filters-500-gateway-redirect:
    template: |
      {#- RequestRedirect: redirect to different scheme, host, port, or path -#}
      {%- import "util-route-condition" for RouteIdCondition -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- if ga["hasRedirect_filter"] %}
      # gateway/frontend-filters-gateway-redirect
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- for _, filter := range routeInfo | dig("filters") | fallback([]any{}) %}
          {%- if (filter | dig("type")) == "RequestRedirect" && (routeInfo | dig("resource_type")) == "httproute" %}
            {%- var routeId = routeInfo | dig("routeId") | tostring() %}
            {%- var cond = RouteIdCondition(routeId) %}
            {%- var redir = filter | dig("requestRedirect") %}
            {%- if redir != nil %}
              {#-
                The Gateway API redirect filter is implemented as a single
                `http-request redirect location "<URL>" code N` line. We
                always use the `location` form so scheme / hostname / port /
                path / status-code can be combined freely; HAProxy's
                `prefix` form prepends the prefix to the full original URI,
                which doesn't match the spec's "replace matched prefix"
                semantics for ReplacePrefixMatch.

                <URL> is built from:
                  - scheme:    spec.scheme (or sample-fetch %[var(txn.scheme)] / "http" fallback)
                  - host:      spec.hostname (or sample-fetch from Host header)
                  - port:      spec.port (optional, only emitted when set)
                  - pathPart:  one of
                                 spec.path.replaceFullPath verbatim,
                                 ReplacePrefixMatch via a per-request var
                                   computed by regsub on the original path,
                                 or the original path via %[path] sample.
              -#}
              {%- var scheme = redir | dig("scheme") | fallback("") %}
              {%- var hostname = redir | dig("hostname") | fallback("") %}
              {%- var port = redir | dig("port") | fallback("") %}
              {%- var pathMod = redir | dig("path") %}
              {%- var statusCode = redir | dig("statusCode") | fallback(302) %}

              {%- var schemePart = scheme %}
              {%- if schemePart == "" %}{%- schemePart = "http" %}{%- end %}
              {%- var hostPart = hostname %}
              {%- if hostPart == "" %}{%- hostPart = "%[req.hdr(Host)]" %}{%- end %}

              {#- For ReplacePrefixMatch, set a per-request variable holding
                  the rewritten path (matched prefix → replacement, rest of
                  segment-aware path preserved verbatim). The route condition
                  already gates segment-aware matching upstream, so any
                  request that reaches this filter is known to start with the
                  declared prefix. -#}
              {%- var pathExpr = "%[path]" %}
              {%- if pathMod != nil %}
                {%- var pathType = pathMod | dig("type") %}
                {%- if pathType == "ReplaceFullPath" %}
                  {%- pathExpr = (pathMod | dig("replaceFullPath") | tostring()) %}
                {%- else if pathType == "ReplacePrefixMatch" %}
                  {%- var matchPrefix = routeInfo | dig("path", "value") | fallback("/") | tostring() %}
                  {%- var replacementPrefix = (pathMod | dig("replacePrefixMatch") | fallback("") | tostring()) %}
                  {#- regsub uses POSIX ERE: anchor at start, escape the
                      matched prefix's regex metachars. The replacement has
                      no metachars (Gateway API enforces a path literal). -#}
                  {%- var escapedPrefix = sanitize_regex(matchPrefix) %}
      http-request set-var(txn.gw_redirect_path) path,regsub("^{{ escapedPrefix }}","{{ replacementPrefix }}") if {{ cond }}
                  {%- pathExpr = "%[var(txn.gw_redirect_path)]" %}
                {%- end %}
              {%- end %}

              {%- var loc = schemePart + "://" + hostPart %}
              {%- if port != "" %}{%- loc = loc + ":" + tostring(port) %}{%- end %}
              {%- loc = loc + pathExpr %}

              {%- if debug | fallback(false) %}
      http-request set-var(txn.filters_applied) str(RequestRedirect) if {{ cond }} !{ var(txn.filters_applied) -m found }
              {%- end %}
      http-request redirect location "{{ loc }}" code {{ statusCode }} if {{ cond }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}
  # Filter: URLRewrite - rewrites request URLs before sending to backend
  frontend-filters-500-gateway-urlrewrite:
    template: |
      {#- URLRewrite: rewrite hostname or path before backend -#}
      {%- import "util-route-condition" for RouteIdCondition -%}
      {{- render "util-gateway-analysis" -}}
      {%- var gaVal, _ = shared.ComputeIfAbsent("gatewayAnalysis", func() any { return nil }) %}
      {%- if gaVal == nil %}{% return %}{% end %}
      {%- var ga = gaVal.(map[string]any) %}
      {%- if ga["hasUrlrewrite_filter"] %}
      # gateway/frontend-filters-gateway-urlrewrite
      {%- for _, routeInfo := range ga["allRoutes"] | toSlice() %}
        {%- for _, filter := range routeInfo | dig("filters") | fallback([]any{}) %}
          {%- if (filter | dig("type")) == "URLRewrite" && (routeInfo | dig("resource_type")) == "httproute" %}
            {%- var routeId = routeInfo | dig("routeId") | tostring() %}
            {%- var cond = RouteIdCondition(routeId) %}
            {%- var rw = filter | dig("urlRewrite") %}
            {%- if rw != nil %}
              {%- if debug | fallback(false) %}
      http-request set-var(txn.filters_applied) str(URLRewrite) if {{ cond }} !{ var(txn.filters_applied) -m found }
              {%- end %}
              {%- var hostname = rw | dig("hostname") | fallback("") %}
              {%- if hostname != "" %}
      http-request set-header Host '{{ hostname }}' if {{ cond }}
              {%- end %}
              {%- var pathMod = rw | dig("path") %}
              {%- if pathMod != nil %}
                {%- var pathType = pathMod | dig("type") %}
                {%- if pathType == "ReplaceFullPath" %}
      http-request set-path "{{ pathMod | dig("replaceFullPath") }}" if {{ cond }}
                {%- else if pathType == "ReplacePrefixMatch" %}
                  {%- var origPrefix = routeInfo | dig("path", "value") | tostring() %}
                  {#- Strip a trailing slash from origPrefix so "/foo/" matches
                      the same paths as "/foo" — Gateway API treats them
                      equivalently for prefix purposes. -#}
                  {%- if hasSuffix(origPrefix, "/") && origPrefix != "/" %}
                    {%- origPrefix = origPrefix[:len(origPrefix)-1] %}
                  {%- end %}
                  {%- var regexPrefix = origPrefix | replace(".", "\\.") | replace("/", "\\/") %}
                  {%- var rp = pathMod | dig("replacePrefixMatch") | tostring() %}
                  {#- Trim trailing slash from the replacement; we always
                      add the slash separator ourselves before the capture
                      group so we never produce "//rest" when rp == "/" or
                      "/foo/" + "/rest". The exact-match line uses rp as-is
                      (or "/" if empty) so a request that exactly equals
                      the matched prefix gets exactly the replacement. -#}
                  {%- var rpExact = rp %}
                  {%- if rpExact == "" %}{%- rpExact = "/" %}{%- end %}
                  {%- var rpStripped = rp %}
                  {%- if hasSuffix(rpStripped, "/") && rpStripped != "/" %}
                    {%- rpStripped = rpStripped[:len(rpStripped)-1] %}
                  {%- end %}
                  {%- if rpStripped == "/" %}{%- rpStripped = "" %}{%- end %}
      http-request replace-path "^{{ regexPrefix }}/?\$" "{{ rpExact }}" if {{ cond }}
      http-request replace-path "^{{ regexPrefix }}/(.*)\$" "{{ rpStripped }}/\\1" if {{ cond }}
                {%- end %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}

  # ============================================================================
  # Status Patch Registration
  # ============================================================================

  util-generate-gateway-status-patches:
    template: |
      {#-
        Generate Gateway Status Patches

        For each Gateway, registers a status patch with:
          - deployed: Accepted + Programmed conditions, addresses, listener status
          - deployFailed: Accepted + Programmed(False) conditions, empty addresses

        Parameters:
          gateways: Slice of Gateway resources to process

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex)
      -#}
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for TopLevelTransitionTime, ListenerTransitionTime -%}
      {% macro GenerateGatewayStatusPatches(gateways []any) %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var rawAddresses = gf["addresses"].([]any) %}

        {#- Convert LoadBalancer addresses to Gateway API format -#}
        {%- var gatewayAddresses = []any{} %}
        {%- for _, addr := range rawAddresses %}
          {%%
            var ip = dig(addr, "ip")
            var hostname = dig(addr, "hostname")
            if ip != nil {
              gatewayAddresses = append(gatewayAddresses, map[string]any{
                "type": "IPAddress",
                "value": tostring(ip),
              })
            } else if hostname != nil {
              gatewayAddresses = append(gatewayAddresses, map[string]any{
                "type": "Hostname",
                "value": tostring(hostname),
              })
            }
          %%}
        {%- end %}

        {#- Count routes attached to each gateway/listener for status.

            The Gateway API spec defines route attachment as the AND of:
              1. parentRef matches the gateway (ns + name)
              2. parentRef.sectionName, if set, matches the listener's name
              3. listener.allowedRoutes.kinds, if set, contains the route kind
              4. listener.allowedRoutes.namespaces.from selects the route's
                 namespace (Same / All / Selector(matchLabels))
              5. The hostname intersection of listener.hostname and
                 route.spec.hostnames is non-empty (or both empty)

            All five must be true for a route to be "attached" — surfaced
            both as listener.attachedRoutes in Gateway status and (in a
            later commit) as the route's parents[].conditions[Accepted].

            Implementation: walk every (route × listener-of-target-gateway)
            pair and increment the count when all predicates hold. Indexed
            by `<gw_ns>/<gw_name>/<listener_name>`; the listener-status
            loop reads back via the same key. This replaces the earlier
            naive scheme (count per gateway+section, plus a "*" bucket for
            sectionless routes) which over-counted routes that targeted
            the gateway but didn't match the listener's hostname /
            allowedRoutes filters.
        -#}
        {%- var routeCounts = map[string]int{} %}
        {%%
          // Gather all routes (HTTPRoute + GRPCRoute) into a single
          // iteration so the predicate evaluation is uniform.
          var allRoutesForCount = []any{}
          for _, r := range resources.httproutes.List() {
            allRoutesForCount = append(allRoutesForCount, map[string]any{
              "kind":  "HTTPRoute",
              "route": r,
            })
          }
          for _, r := range resources.grpcroutes.List() {
            allRoutesForCount = append(allRoutesForCount, map[string]any{
              "kind":  "GRPCRoute",
              "route": r,
            })
          }

          for _, entry := range allRoutesForCount {
            var em = entry.(map[string]any)
            var routeKind = em["kind"].(string)
            var route = em["route"]
            var routeNs = dig(route, "metadata", "namespace") | fallback("") | tostring()
            var routeHostnames = dig(route, "spec", "hostnames") | toSlice()

            for _, parentRef := range dig(route, "spec", "parentRefs") | toSlice() {
              // Default group/kind for parentRef is gateway.networking.k8s.io/Gateway.
              // Skip any parentRef that targets something else (e.g. Mesh
              // Service ref); those don't apply to Gateway listener counts.
              var prGroup = dig(parentRef, "group") | fallback("gateway.networking.k8s.io") | tostring()
              var prKind = dig(parentRef, "kind") | fallback("Gateway") | tostring()
              if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
                continue
              }
              var gwNs = dig(parentRef, "namespace") | fallback(routeNs) | tostring()
              var gwName = dig(parentRef, "name") | fallback("") | tostring()
              var section = dig(parentRef, "sectionName") | fallback("") | tostring()

              var gw = resources.gateways.GetSingle(gwNs, gwName)
              if gw == nil {
                continue
              }

              for _, listener := range dig(gw, "spec", "listeners") | toSlice() {
                var listenerName = dig(listener, "name") | fallback("") | tostring()

                // (2) sectionName filter
                if section != "" && listenerName != section {
                  continue
                }

                // (2.5) parentRef.port filter (Gateway API spec): if the
                //       route's parentRef sets `.port`, only attach to
                //       listeners with the same `spec.port`. Mismatched
                //       routes get Accepted=False/NoMatchingParent.
                var parentPort = toint(dig(parentRef, "port") | fallback(0))
                var listenerPort = toint(dig(listener, "port") | fallback(0))
                if parentPort != 0 && listenerPort != parentPort {
                  continue
                }

                // (3) allowedRoutes.kinds — if specified, the route's
                //     group/kind must be in the list. Default group is
                //     gateway.networking.k8s.io.
                var allowedKindsRaw = dig(listener, "allowedRoutes", "kinds")
                if allowedKindsRaw != nil {
                  var kindOk = false
                  for _, ak := range toSlice(allowedKindsRaw) {
                    var akGroup = dig(ak, "group") | fallback("gateway.networking.k8s.io") | tostring()
                    var akKind = dig(ak, "kind") | fallback("") | tostring()
                    if akGroup == "gateway.networking.k8s.io" && akKind == routeKind {
                      kindOk = true
                      break
                    }
                  }
                  if !kindOk {
                    continue
                  }
                }

                // (4) allowedRoutes.namespaces.from — Same | All | Selector
                var fromMode = dig(listener, "allowedRoutes", "namespaces", "from") | fallback("Same") | tostring()
                switch fromMode {
                case "Same":
                  if routeNs != gwNs {
                    continue
                  }
                case "All":
                  // anything goes
                case "Selector":
                  // Resolve the route's namespace and match its labels
                  // against the selector's matchLabels. matchExpressions
                  // is intentionally not supported yet (no conformance
                  // test exercises it; if/when one does, this falls
                  // through and the predicate fails — which is the safe
                  // default for an unrecognised label-selector shape).
                  var ml = dig(listener, "allowedRoutes", "namespaces", "selector", "matchLabels")
                  if ml == nil {
                    continue
                  }
                  var nsObj = resources.namespaces.GetSingle(routeNs)
                  if nsObj == nil {
                    continue
                  }
                  var nsLabels = dig(nsObj, "metadata", "labels")
                  if nsLabels == nil {
                    continue
                  }
                  var nsMap = nsLabels.(map[string]any)
                  var allMatch = true
                  for k, v := range ml.(map[string]any) {
                    var actual, ok = nsMap[k]
                    if !ok || tostring(actual) != tostring(v) {
                      allMatch = false
                      break
                    }
                  }
                  if !allMatch {
                    continue
                  }
                default:
                  // Unknown `from` mode — treat as no match, since the
                  // implementation can't safely guess intent.
                  continue
                }

                // (5) hostname intersection
                var listenerHostname = dig(listener, "hostname") | fallback("") | tostring()
                // HostnamesIntersect returns "true"/"false" string —
                // Scriggo macro return-type constraint, see macro doc.
                if HostnamesIntersect(listenerHostname, routeHostnames) != "true" {
                  continue
                }

                // All predicates passed; this route attaches to this listener.
                var key = gwNs + "/" + gwName + "/" + listenerName
                routeCounts[key] = routeCounts[key] + 1
              }
            }
          }
        %%}

        {%- for _, gateway := range gateways %}
          {%%
            var namespace = dig(gateway, "metadata", "namespace") | fallback("")
            var name = dig(gateway, "metadata", "name") | fallback("")
            var generation = dig(gateway, "metadata", "generation") | fallback(0)
            var nsStr = tostring(namespace)
            var nameStr = tostring(name)

            // Pre-compute per-listener data the deployed and deployFailed
            // variants both consume. Specifically: allowedRoutes.kinds
            // intersection with the protocol-default kinds (per Gateway
            // API spec — ResolvedRefs goes False/InvalidRouteKinds when
            // the user requests an unsupported kind, supportedKinds
            // shrinks to the intersection). Computing once and reusing
            // ensures the two variants stay in lockstep.
            var listenerData = []any{}
            for _, listener := range dig(gateway, "spec", "listeners") | toSlice() {
              var listenerName = dig(listener, "name") | fallback("") | tostring()
              var protocol = dig(listener, "protocol") | fallback("HTTP") | tostring()

              // Default kinds the chart's data-plane supports per
              // listener protocol. The conformance suite treats this
              // as the "core" set; any user-requested kind not in this
              // set is rejected with InvalidRouteKinds.
              var defaultKinds = []any{}
              switch protocol {
              case "HTTP", "HTTPS":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute"},
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "GRPCRoute"},
                }
              case "TLS":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "TLSRoute"},
                }
              case "TCP":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "TCPRoute"},
                }
              case "UDP":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "UDPRoute"},
                }
              }

              // If the listener spec declares allowedRoutes.kinds, the
              // intersection with defaultKinds is what we report. If
              // anything was filtered out, ResolvedRefs goes False with
              // reason InvalidRouteKinds (per the Gateway API spec for
              // listener-status conditions).
              var requestedKinds = dig(listener, "allowedRoutes", "kinds")
              var supportedKinds = []any{}
              var hasInvalidKind = false
              if requestedKinds == nil {
                supportedKinds = defaultKinds
              } else {
                for _, reqEntry := range toSlice(requestedKinds) {
                  var reqGroup = dig(reqEntry, "group") | fallback("gateway.networking.k8s.io") | tostring()
                  var reqKind = dig(reqEntry, "kind") | fallback("") | tostring()
                  var matched = false
                  for _, def := range defaultKinds {
                    if tostring(dig(def, "group")) == reqGroup && tostring(dig(def, "kind")) == reqKind {
                      matched = true
                      break
                    }
                  }
                  if matched {
                    supportedKinds = append(supportedKinds, map[string]any{"group": reqGroup, "kind": reqKind})
                  } else {
                    hasInvalidKind = true
                  }
                }
              }

              // ResolvedRefs status / reason / message are derived from
              // (1) the kinds filter result and (2) certificateRef
              // validity for HTTPS/TLS listeners. InvalidRouteKinds and
              // InvalidCertificateRef are mutually exclusive reasons in
              // the spec; if both apply, kinds-based wins (the user
              // can fix kinds first to get a clearer cert error).
              // The transitionTime helper preserves the existing
              // timestamp when status doesn't change so the patch is
              // idempotent.
              var resolvedRefsStatus = "True"
              var resolvedRefsReason = "ResolvedRefs"
              var resolvedRefsMessage = "All references resolved"

              // Validate certificateRefs for HTTPS / TLS listeners.
              // Per Gateway API spec: an unsupported group/kind, a
              // missing target Secret, a Secret missing tls.crt /
              // tls.key data, or a cross-namespace ref without a
              // matching ReferenceGrant each makes the listener
              // ResolvedRefs=False with a different reason:
              //   InvalidCertificateRef — bad group/kind or malformed
              //     Secret content
              //   RefNotPermitted       — cross-ns ref without
              //     a permitting ReferenceGrant
              // The chart's existing TLS-cert rendering already
              // gracefully skips invalid refs (no haproxy crash), but
              // status didn't reflect the failure — conformance gates
              // on this.
              var hasInvalidCertRef = false
              var hasRefNotPermitted = false
              if protocol == "HTTPS" || protocol == "TLS" {
                var listenerTls = listener | dig("tls")
                if listenerTls != nil {
                  for _, ref := range listenerTls | dig("certificateRefs") | toSlice() {
                    var refGroup = dig(ref, "group") | fallback("") | tostring()
                    var refKind = dig(ref, "kind") | fallback("Secret") | tostring()
                    if refGroup != "" && refGroup != "core" {
                      hasInvalidCertRef = true
                      continue
                    }
                    if refKind != "Secret" {
                      hasInvalidCertRef = true
                      continue
                    }
                    var refName = dig(ref, "name") | fallback("") | tostring()
                    var refNs = dig(ref, "namespace") | fallback(nsStr) | tostring()
                    if refName == "" {
                      hasInvalidCertRef = true
                      continue
                    }
                    // Cross-namespace gate: requires a matching
                    // ReferenceGrant in the target Secret's namespace.
                    if refNs != nsStr {
                      var permitted = ReferenceGrantPermitted(
                        "gateway.networking.k8s.io", "Gateway", nsStr,
                        "", "Secret", refNs, refName,
                      )
                      if permitted != "true" {
                        hasRefNotPermitted = true
                        continue
                      }
                    }
                    var sec = resources.secrets.GetSingle(refNs, refName)
                    if sec == nil {
                      hasInvalidCertRef = true
                      continue
                    }
                    var sd = sec | dig("data")
                    var crtB64 = tostring(sd | dig("tls.crt") | fallback(""))
                    var keyB64 = tostring(sd | dig("tls.key") | fallback(""))
                    if crtB64 == "" || keyB64 == "" {
                      hasInvalidCertRef = true
                    } else {
                      var crt, crtErr = b64decode(crtB64)
                      var key, keyErr = b64decode(keyB64)
                      if crtErr != nil || keyErr != nil {
                        hasInvalidCertRef = true
                      } else if !hasPrefix(crt, "-----BEGIN ") || !hasPrefix(key, "-----BEGIN ") {
                        hasInvalidCertRef = true
                      }
                    }
                  }
                }
              }

              if hasInvalidKind {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "InvalidRouteKinds"
                resolvedRefsMessage = "Listener references unsupported route kinds"
              } else if hasRefNotPermitted {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "RefNotPermitted"
                resolvedRefsMessage = "Listener references a Secret across namespaces with no matching ReferenceGrant"
              } else if hasInvalidCertRef {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "InvalidCertificateRef"
                resolvedRefsMessage = "Listener references unsupported, missing, or malformed Secret"
              }

              // Count attached routes: routes with sectionName matching
              // this listener + wildcard routes (no sectionName) on the
              // same gateway.
              var specificKey = nsStr + "/" + nameStr + "/" + listenerName
              var wildcardKey = nsStr + "/" + nameStr + "/*"
              var attached = routeCounts[specificKey] + routeCounts[wildcardKey]

              // Per Gateway API spec, when a listener's references are
              // unresolvable (cert invalid, kind unsupported, …) the
              // listener also can't be Programmed — the dataplane
              // can't realise a binding it has no cert for. Programmed
              // mirrors ResolvedRefs in those cases (with reason
              // "Invalid" because the spec's listener-Programmed reasons
              // are coarser than ResolvedRefs's).
              var programmedListenerStatus = "True"
              var programmedListenerReason = "Programmed"
              var programmedListenerMessage = "Listener programmed"
              if resolvedRefsStatus != "True" {
                programmedListenerStatus = "False"
                programmedListenerReason = "Invalid"
                programmedListenerMessage = resolvedRefsMessage
              }

              listenerData = append(listenerData, map[string]any{
                "name":                  listenerName,
                "supportedKinds":        supportedKinds,
                "attachedRoutes":        attached,
                "resolvedRefsStatus":    resolvedRefsStatus,
                "resolvedRefsReason":    resolvedRefsReason,
                "resolvedRefsMessage":   resolvedRefsMessage,
                "programmedStatus":      programmedListenerStatus,
                "programmedReason":      programmedListenerReason,
                "programmedMessage":     programmedListenerMessage,
              })
            }

            // Build the deployed-variant listener status. Programmed
            // is taken from listenerData (which folds in the
            // ResolvedRefs failure cases — listener with bad cert /
            // unsupported kind can't be Programmed even if the
            // chart's deploy succeeded for the other listeners).
            var deployedListeners = []any{}
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              var lname = tostring(ldm["name"])
              deployedListeners = append(deployedListeners, map[string]any{
                "name":           ldm["name"],
                "supportedKinds": ldm["supportedKinds"],
                "attachedRoutes": ldm["attachedRoutes"],
                "conditions": []any{
                  condition("Accepted", "True", "Accepted", "Listener accepted",
                    generation, ListenerTransitionTime(gateway, lname, "Accepted", "True")),
                  condition("Programmed",
                    tostring(ldm["programmedStatus"]),
                    tostring(ldm["programmedReason"]),
                    tostring(ldm["programmedMessage"]),
                    generation,
                    ListenerTransitionTime(gateway, lname, "Programmed", tostring(ldm["programmedStatus"]))),
                  condition("ResolvedRefs",
                    tostring(ldm["resolvedRefsStatus"]),
                    tostring(ldm["resolvedRefsReason"]),
                    tostring(ldm["resolvedRefsMessage"]),
                    generation,
                    ListenerTransitionTime(gateway, lname, "ResolvedRefs", tostring(ldm["resolvedRefsStatus"]))),
                  condition("Conflicted", "False", "NoConflicts", "No conflicts detected",
                    generation, ListenerTransitionTime(gateway, lname, "Conflicted", "False")),
                },
              })
            }

            // Build the deployFailed-variant. Programmed=False unless
            // the listener's own programming was already False for
            // ref-resolution reasons (in which case the more-specific
            // listener-level reason wins).
            var failedListeners = []any{}
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              var lname = tostring(ldm["name"])
              var failProgrammedStatus = "False"
              var failProgrammedReason = "Invalid"
              var failProgrammedMessage = "Gateway not yet programmed"
              if tostring(ldm["programmedStatus"]) == "False" {
                failProgrammedReason = tostring(ldm["programmedReason"])
                failProgrammedMessage = tostring(ldm["programmedMessage"])
              }
              failedListeners = append(failedListeners, map[string]any{
                "name":           ldm["name"],
                "supportedKinds": ldm["supportedKinds"],
                "attachedRoutes": ldm["attachedRoutes"],
                "conditions": []any{
                  condition("Accepted", "True", "Accepted", "Listener accepted",
                    generation, ListenerTransitionTime(gateway, lname, "Accepted", "True")),
                  condition("Programmed", failProgrammedStatus, failProgrammedReason, failProgrammedMessage,
                    generation, ListenerTransitionTime(gateway, lname, "Programmed", failProgrammedStatus)),
                  condition("ResolvedRefs",
                    tostring(ldm["resolvedRefsStatus"]),
                    tostring(ldm["resolvedRefsReason"]),
                    tostring(ldm["resolvedRefsMessage"]),
                    generation,
                    ListenerTransitionTime(gateway, lname, "ResolvedRefs", tostring(ldm["resolvedRefsStatus"]))),
                  condition("Conflicted", "False", "NoConflicts", "No conflicts detected",
                    generation, ListenerTransitionTime(gateway, lname, "Conflicted", "False")),
                },
              })
            }

            // Emit BOTH a "rendered" and "deployed" variant carrying the
            // same content. The "rendered" variant fires after every
            // successful render — that's what the Gateway API spec
            // expects: status reflects the latest spec the controller
            // observed, even when the resulting HAProxy config is
            // byte-identical to the previous render and deployment is
            // skipped. Without it, a Gateway whose .spec mutates
            // without producing a HAProxy config diff (e.g. listener
            // hostname change that doesn't shift any path-map rows)
            // would have stale observedGeneration in its conditions.
            // The conformance test GatewayObservedGenerationBump pins
            // exactly this behaviour.
            //
            // The applier's per-(resource, gvr) checksum cache
            // dedupes redundant patches, so emitting the same content
            // in two phases doesn't double the API traffic — it just
            // closes the timing window between render and deploy.
            //
            // Gateway-level Programmed reflects listener health: per
            // spec, a Gateway is Programmed=True only when every
            // listener it owns can also be programmed. If any listener
            // failed to resolve refs (bad cert, unsupported kind, …)
            // the Gateway-level condition flips to False/Invalid with
            // a message pointing at the listener-side reason.
            // Conformance GatewayInvalidTLSConfiguration explicitly
            // checks this top-level Programmed=False alongside the
            // listener-level ResolvedRefs=False/InvalidCertificateRef.
            var gwProgrammedStatus = "True"
            var gwProgrammedReason = "Programmed"
            var gwProgrammedMessage = "Gateway programmed into the data plane"
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              if tostring(ldm["programmedStatus"]) == "False" {
                gwProgrammedStatus = "False"
                gwProgrammedReason = "Invalid"
                gwProgrammedMessage = "Listener " + tostring(ldm["name"]) + " is not programmed: " + tostring(ldm["programmedMessage"])
                break
              }
            }

            statusPatch(nsStr, nameStr,
              "gateway.networking.k8s.io/v1", "Gateway",
              map[string]interface{}{
                "rendered": map[string]interface{}{
                  "addresses": gatewayAddresses,
                  "conditions": []any{
                    condition("Accepted", "True", "Accepted", "Gateway accepted",
                      generation, TopLevelTransitionTime(gateway, "Accepted", "True")),
                    condition("Programmed", gwProgrammedStatus, gwProgrammedReason, gwProgrammedMessage,
                      generation, TopLevelTransitionTime(gateway, "Programmed", gwProgrammedStatus)),
                  },
                  "listeners": deployedListeners,
                },
                "deployed": map[string]interface{}{
                  "addresses": gatewayAddresses,
                  "conditions": []any{
                    condition("Accepted", "True", "Accepted", "Gateway accepted",
                      generation, TopLevelTransitionTime(gateway, "Accepted", "True")),
                    condition("Programmed", gwProgrammedStatus, gwProgrammedReason, gwProgrammedMessage,
                      generation, TopLevelTransitionTime(gateway, "Programmed", gwProgrammedStatus)),
                  },
                  "listeners": deployedListeners,
                },
                "deployFailed": map[string]interface{}{
                  "addresses": []any{},
                  "conditions": []any{
                    condition("Accepted", "True", "Accepted", "Gateway accepted",
                      generation, TopLevelTransitionTime(gateway, "Accepted", "True")),
                    condition("Programmed", "False", "AddressNotAssigned", "Gateway addresses not yet assigned",
                      generation, TopLevelTransitionTime(gateway, "Programmed", "False")),
                  },
                  "listeners": failedListeners,
                },
              })
          %%}
        {%- end %}
      {% end %}

  util-sharded-gateway-status-patches:
    template: |
      {#-
        Sharded Gateway Status Patches

        Wraps GenerateGatewayStatusPatches with automatic parallel sharding.
      -#}
      {%- import "util-generate-gateway-status-patches" for GenerateGatewayStatusPatches -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedGatewayStatusPatches(gateways []any) %}
        {%- var n = toint(CalculateShardCount(len(gateways), 100)) -%}
        {%- if n <= 1 || len(gateways) < 100 -%}
      {{ GenerateGatewayStatusPatches(gateways) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateGatewayStatusPatches(shard_slice(gateways, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  util-generate-route-status-patches:
    template: |
      {#-
        Generate Route Status Patches (HTTPRoute / GRPCRoute)

        For each route, registers a status patch with parents[] entries
        containing parentRef, controllerName, and conditions (Accepted, ResolvedRefs).

        Per-parent Accepted condition follows the Gateway API spec:
          - True/Accepted              — at least one listener of the parent
                                          gateway accepts this route (passing
                                          all five listener-attachment
                                          predicates: sectionName, kinds,
                                          namespaces, hostname intersection)
          - False/NoMatchingListenerHostname — every candidate listener has a
                                          hostname that doesn't intersect
                                          spec.hostnames
          - False/NoMatchingParent     — sectionName references a listener
                                          that doesn't exist on the gateway
          - False/NotAllowedByListeners — every candidate listener excludes
                                          the route via allowedRoutes.kinds
                                          or allowedRoutes.namespaces

        Parameters:
          routes: Slice of route resources to process
          apiVersion: API version string (e.g. "gateway.networking.k8s.io/v1")
          kind: Resource kind (e.g. "HTTPRoute" or "GRPCRoute")

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex)
      -#}
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {% macro GenerateRouteStatusPatches(routes []any, apiVersion string, kind string) %}
        {%- var controllerName = extraContext | dig("controllerName") | fallback("") | tostring() %}

        {#- Build a set of our gateway keys for quick lookup -#}
        {%- var ourGateways = map[string]bool{} %}
        {%- for _, gw := range resources.gateways.List() %}
          {%%
            var gwKey = tostring(dig(gw, "metadata", "namespace") | fallback("")) + "/" + tostring(dig(gw, "metadata", "name") | fallback(""))
            ourGateways[gwKey] = true
          %%}
        {%- end %}

        {%- for _, route := range routes %}
          {%%
            var namespace = dig(route, "metadata", "namespace") | fallback("")
            var name = dig(route, "metadata", "name") | fallback("")
            var generation = dig(route, "metadata", "generation") | fallback(0)
            var nsStr = tostring(namespace)
            var nameStr = tostring(name)
            var routeHostnames = dig(route, "spec", "hostnames") | toSlice()

            // Per Gateway API spec, ResolvedRefs=False can carry one
            // of these reasons (most-specific wins; first failure
            // wins fail-fast):
            //   InvalidKind     — backendRef.kind is not Service
            //   RefNotPermitted — cross-namespace ref without a
            //                      matching ReferenceGrant
            //   BackendNotFound — referenced Service doesn't exist
            // RefNotPermitted is checked before BackendNotFound so a
            // user fixing cross-ns auth doesn't first see the
            // not-found error.
            var allRefsResolved = true
            var refFailReason = ""
            var refFailMsg = ""
            for _, rule := range dig(route, "spec", "rules") | toSlice() {
              for _, backendRef := range dig(rule, "backendRefs") | toSlice() {
                var svcName = dig(backendRef, "name") | fallback("") | tostring()
                var svcNamespace = dig(backendRef, "namespace") | fallback(namespace) | tostring()
                var group = dig(backendRef, "group") | fallback("") | tostring()
                var refKind = dig(backendRef, "kind") | fallback("Service") | tostring()

                if !((group == "" || group == "core") && refKind == "Service") {
                  allRefsResolved = false
                  refFailReason = "InvalidKind"
                  refFailMsg = "Unsupported backend kind " + group + "/" + refKind
                  break
                }
                if svcNamespace != nsStr {
                  // Cross-namespace backend ref: requires a matching
                  // ReferenceGrant in the target Service's namespace.
                  if ReferenceGrantPermitted(
                    "gateway.networking.k8s.io", kind, nsStr,
                    "", "Service", svcNamespace, svcName) != "true" {
                    allRefsResolved = false
                    refFailReason = "RefNotPermitted"
                    refFailMsg = "Cross-namespace backend ref " + svcNamespace + "/" + svcName + " requires a matching ReferenceGrant"
                    break
                  }
                }
                var svc = resources.services.GetSingle(svcNamespace, svcName)
                if svc == nil {
                  allRefsResolved = false
                  refFailReason = "BackendNotFound"
                  refFailMsg = "Backend not found: " + svcNamespace + "/" + svcName
                  break
                }
              }
              if !allRefsResolved {
                break
              }
            }

            // Build parents array
            var parents = []any{}
            var parentIdx = 0
            for _, parentRef := range dig(route, "spec", "parentRefs") | toSlice() {
              var gwGroup = dig(parentRef, "group") | fallback("gateway.networking.k8s.io") | tostring()
              var gwKind = dig(parentRef, "kind") | fallback("Gateway") | tostring()
              var gwNamespace = dig(parentRef, "namespace") | fallback(namespace) | tostring()
              var gwName = dig(parentRef, "name") | fallback("") | tostring()

              // Only process parentRefs targeting our gateways
              if gwGroup == "gateway.networking.k8s.io" && gwKind == "Gateway" {
                var gwKey = gwNamespace + "/" + gwName
                if ourGateways[gwKey] {
                  var parentRefStatus = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  "Gateway",
                    "name":  gwName,
                  }
                  // Mirror spec.parentRefs[].namespace exactly:
                  // include the namespace whenever the spec set it,
                  // omit only when the spec omitted it. The previous
                  // "only when different from route namespace" rule
                  // dropped the namespace whenever it happened to
                  // match — which conformance reads as a status
                  // mismatch (the spec said "X", status says nil).
                  if dig(parentRef, "namespace") != nil {
                    parentRefStatus["namespace"] = gwNamespace
                  }
                  var sectionName = dig(parentRef, "sectionName")
                  var sectionNameStr = ""
                  if sectionName != nil {
                    parentRefStatus["sectionName"] = tostring(sectionName)
                    sectionNameStr = tostring(sectionName)
                  }
                  var parentPort = toint(dig(parentRef, "port") | fallback(0))

                  // Evaluate Accepted-by-listener for this parentRef.
                  // Walk the gateway's listeners; the first that accepts
                  // the route → Accepted=True. If none accepts, the most
                  // specific failure-reason wins. The spec ranks the
                  // reasons:
                  //   NoMatchingParent (sectionName missing) > NotAllowedByListeners (kinds/namespaces) > NoMatchingListenerHostname
                  var gw = resources.gateways.GetSingle(gwNamespace, gwName)
                  var acceptedStatus = "False"
                  var acceptedReason = "NotAllowedByListeners"
                  var acceptedMsg = "No listener accepts this route"
                  var sawSectionMatch = false
                  var sawPortMatch = false
                  var sawKindNs = false
                  var sawHostnameMismatch = false
                  if gw != nil {
                    for _, listener := range dig(gw, "spec", "listeners") | toSlice() {
                      var listenerName = dig(listener, "name") | fallback("") | tostring()

                      if sectionNameStr != "" && listenerName != sectionNameStr {
                        continue
                      }
                      if sectionNameStr != "" {
                        sawSectionMatch = true
                      }
                      // parentRef.port (Gateway API): when the route's
                      // parentRef sets `.port`, only the listener with
                      // the same `spec.port` is a match. Mismatched
                      // parents fail with NoMatchingParent (more specific
                      // than NotAllowedByListeners).
                      var listenerPort = toint(dig(listener, "port") | fallback(0))
                      if parentPort != 0 && listenerPort != parentPort {
                        continue
                      }
                      if parentPort != 0 {
                        sawPortMatch = true
                      }

                      // Kind filter
                      var kindOk = true
                      var allowedKindsRaw = dig(listener, "allowedRoutes", "kinds")
                      if allowedKindsRaw != nil {
                        kindOk = false
                        for _, ak := range toSlice(allowedKindsRaw) {
                          var akGroup = dig(ak, "group") | fallback("gateway.networking.k8s.io") | tostring()
                          var akKind = dig(ak, "kind") | fallback("") | tostring()
                          if akGroup == "gateway.networking.k8s.io" && akKind == kind {
                            kindOk = true
                            break
                          }
                        }
                      }

                      // Namespace filter
                      var nsOk = false
                      var fromMode = dig(listener, "allowedRoutes", "namespaces", "from") | fallback("Same") | tostring()
                      switch fromMode {
                      case "Same":
                        nsOk = nsStr == gwNamespace
                      case "All":
                        nsOk = true
                      case "Selector":
                        var ml = dig(listener, "allowedRoutes", "namespaces", "selector", "matchLabels")
                        if ml != nil {
                          var nsObj = resources.namespaces.GetSingle(nsStr)
                          if nsObj != nil {
                            var nsLabels = dig(nsObj, "metadata", "labels")
                            if nsLabels != nil {
                              var labelMap = nsLabels.(map[string]any)
                              var allMatch = true
                              for k, v := range ml.(map[string]any) {
                                var actual, ok = labelMap[k]
                                if !ok || tostring(actual) != tostring(v) {
                                  allMatch = false
                                  break
                                }
                              }
                              nsOk = allMatch
                            }
                          }
                        }
                      }

                      if !kindOk || !nsOk {
                        sawKindNs = true
                        continue
                      }

                      // Hostname intersection
                      var listenerHostname = dig(listener, "hostname") | fallback("") | tostring()
                      if HostnamesIntersect(listenerHostname, routeHostnames) != "true" {
                        sawHostnameMismatch = true
                        continue
                      }

                      // All five predicates passed.
                      acceptedStatus = "True"
                      acceptedReason = "Accepted"
                      acceptedMsg = "Route accepted"
                      break
                    }
                  }
                  if acceptedStatus == "False" {
                    if sectionNameStr != "" && !sawSectionMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "Section " + sectionNameStr + " not found on parent gateway"
                    } else if parentPort != 0 && !sawPortMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "No listener with port " + tostring(parentPort) + " on parent gateway"
                    } else if sawHostnameMismatch && !sawKindNs {
                      acceptedReason = "NoMatchingListenerHostname"
                      acceptedMsg = "No listener hostname intersects the route's hostnames"
                    } else {
                      acceptedReason = "NotAllowedByListeners"
                      acceptedMsg = "No listener accepts the route's namespace or kind"
                    }
                  }

                  // ResolvedRefs follows backend resolution. The
                  // refFailReason / refFailMsg were set during the
                  // backend-ref scan above (InvalidKind /
                  // BackendNotFound, fail-fast on first violation).
                  var resolvedStatus = "True"
                  var resolvedReason = "ResolvedRefs"
                  var resolvedMsg = "All backend references resolved"
                  if !allRefsResolved {
                    resolvedStatus = "False"
                    resolvedReason = refFailReason
                    resolvedMsg = refFailMsg
                  }

                  parents = append(parents, map[string]any{
                    "parentRef":      parentRefStatus,
                    "controllerName": controllerName,
                    "conditions": []any{
                      condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                        generation, RouteParentTransitionTime(route, parentIdx, "Accepted", acceptedStatus)),
                      condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                        generation, RouteParentTransitionTime(route, parentIdx, "ResolvedRefs", resolvedStatus)),
                    },
                  })
                }
              }
              parentIdx = parentIdx + 1
            }

            if len(parents) > 0 {
              // Emit both rendered + deployed phases (same content) so
              // the patch fires after render even when deployment is
              // skipped because the rendered HAProxy config is byte-
              // identical to the previous render. Without this,
              // observedGeneration in the route's parent.conditions
              // lags behind spec.metadata.generation whenever a route
              // mutation doesn't shift any HAProxy maps. Conformance
              // GatewayObservedGenerationBump pins this for routes too.
              statusPatch(nsStr, nameStr, apiVersion, kind,
                map[string]interface{}{
                  "rendered": map[string]interface{}{
                    "parents": parents,
                  },
                  "deployed": map[string]interface{}{
                    "parents": parents,
                  },
                  "deployFailed": map[string]interface{}{
                    "parents": parents,
                  },
                })
            }
          %%}
        {%- end %}
      {% end %}

  util-sharded-route-status-patches:
    template: |
      {#-
        Sharded Route Status Patches

        Wraps GenerateRouteStatusPatches with automatic parallel sharding.
      -#}
      {%- import "util-generate-route-status-patches" for GenerateRouteStatusPatches -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedRouteStatusPatches(routes []any, apiVersion string, kind string) %}
        {%- var n = toint(CalculateShardCount(len(routes), 100)) -%}
        {%- if n <= 1 || len(routes) < 100 -%}
      {{ GenerateRouteStatusPatches(routes, apiVersion, kind) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateRouteStatusPatches(shard_slice(routes, i, n), apiVersion, kind) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  util-generate-gatewayclass-status-patches:
    template: |
      {#-
        Generate GatewayClass Status Patches

        Per Gateway API spec, implementations MUST populate status on every
        GatewayClass that names them in `spec.controllerName`. The watcher
        is field-selector-filtered to that exact match (see _helm_load
        inject), so every GatewayClass in this list is one we own.

        For each GatewayClass we set:
          - Accepted=True with reason "Accepted" and the observed generation
            (the value the spec was at when we acknowledged it)
          - Or Accepted=False with reason "InvalidParameters" if the
            optional parametersRef is malformed (wrong group / kind)

        Variants written:
          - rendered:    deploy succeeded → Accepted=True
          - deployFailed: deploy failed   → Accepted=True (the GatewayClass
                          itself is still accepted; deployment failures
                          surface on the dependent Gateway, not here)

        We don't validate that the parametersRef target resource *exists* —
        that would require a watch on cluster-scoped HAProxyTemplateConfig
        which the controller doesn't have. Group/kind validation is the
        cheaper invariant that catches obvious user mistakes.

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex).
      -#}
      {%- import "util-condition-transition-time" for TopLevelTransitionTime -%}
      {% macro GenerateGatewayClassStatusPatches(gatewayClasses []any) %}
        {%- for _, gc := range gatewayClasses %}
          {%%
            var name = dig(gc, "metadata", "name") | fallback("")
            var generation = dig(gc, "metadata", "generation") | fallback(0)
            var nameStr = tostring(name)

            // Validate optional parametersRef. Empty / unset → accepted.
            // Mismatched group or kind → InvalidParameters.
            var paramsRef = dig(gc, "spec", "parametersRef")
            var acceptedStatus = "True"
            var acceptedReason = "Accepted"
            var acceptedMessage = "GatewayClass accepted by haproxy-haptic controller"
            if paramsRef != nil {
              var pGroup = dig(paramsRef, "group") | fallback("") | tostring()
              var pKind = dig(paramsRef, "kind") | fallback("") | tostring()
              if pGroup != "haproxy-haptic.org" || pKind != "HAProxyTemplateConfig" {
                acceptedStatus = "False"
                acceptedReason = "InvalidParameters"
                acceptedMessage = "spec.parametersRef must reference haproxy-haptic.org/HAProxyTemplateConfig (got " + pGroup + "/" + pKind + ")"
              }
            }

            var acceptedCondition = condition(
              "Accepted",
              acceptedStatus,
              acceptedReason,
              acceptedMessage,
              generation,
              TopLevelTransitionTime(gc, "Accepted", acceptedStatus),
            )

            // GatewayClass is cluster-scoped; pass empty namespace.
            statusPatch("", nameStr,
              "gateway.networking.k8s.io/v1", "GatewayClass",
              map[string]interface{}{
                "rendered": map[string]interface{}{
                  "conditions": []any{acceptedCondition},
                },
                "deployFailed": map[string]interface{}{
                  "conditions": []any{acceptedCondition},
                },
              })
          %%}
        {%- end %}
      {% end %}

  status-patches-100-gatewayclass:
    template: |
      {#-
        GatewayClass Status Patch Registration

        Extension Point: status-patches-* (priority 100 — runs before
        the priority-200 Gateway/HTTPRoute snippet so the class is
        accepted before any dependent resource's status is published).

        Watcher is filtered to spec.controllerName == ours, so every
        GatewayClass in the store is one we MUST set status on.
      -#}
      {%- import "util-generate-gatewayclass-status-patches" for GenerateGatewayClassStatusPatches -%}
      {%- var allGatewayClasses = resources.gatewayclasses.List() -%}
      {%- if len(allGatewayClasses) > 0 -%}
        {{- GenerateGatewayClassStatusPatches(allGatewayClasses) -}}
      {%- end -%}

  # ============================================================================
  # BackendTLSPolicy Status Patches
  # ============================================================================
  #
  # Per Gateway API spec, BackendTLSPolicy status carries one
  # PolicyAncestorStatus per Gateway that owns a route which references
  # the policy's target Service. We compute the set of ancestors and
  # write Accepted + ResolvedRefs conditions for each.
  #
  # Conditions we set:
  #   - Accepted=True  (Reason=Accepted)
  #     - and Accepted=False (Reason=Conflicted) when another policy
  #       targets the same (group, kind, name, sectionName) tuple
  #   - ResolvedRefs=True (Reason=ResolvedRefs)
  #     - or ResolvedRefs=False (Reason=NoValidCACertificate) when
  #       caCertificateRefs is empty / all refs are unresolvable
  #     - or ResolvedRefs=False (Reason=InvalidCACertificateRef) when
  #       a ref points at an unsupported group/kind
  #     - or ResolvedRefs=False (Reason=Invalid) when the wellKnown
  #       CACertificates value isn't recognised
  util-generate-backendtlspolicy-status-patches:
    template: |
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {% macro GenerateBackendTLSPolicyStatusPatches(policies []any, controllerName string) %}
        {%- for _, policy := range policies %}
          {%%
            var policyNs = tostring(dig(policy, "metadata", "namespace") | fallback(""))
            var policyName = tostring(dig(policy, "metadata", "name") | fallback(""))
            var generation = dig(policy, "metadata", "generation") | fallback(0)
            var apiVersion = "gateway.networking.k8s.io/v1alpha3"
            var kind = "BackendTLSPolicy"

            // Validate caCertificateRefs / wellKnownCACertificates.
            // Per spec, exactly one must be set; caCertificateRefs takes
            // precedence if both are present.
            var validation = dig(policy, "spec", "validation")
            var caRefs []any = dig(validation, "caCertificateRefs") | toSlice()
            if caRefs == nil {
              caRefs = []any{}
            }
            var wkca = dig(validation, "wellKnownCACertificates") | fallback("") | tostring()

            var resolvedStatus = "True"
            var resolvedReason = "ResolvedRefs"
            var resolvedMsg = "All references resolved"

            if len(caRefs) > 0 {
              var hasValid = false
              var hasInvalidGroupKind = false
              for _, ref := range caRefs {
                var refGroup = tostring(dig(ref, "group") | fallback(""))
                var refKind = tostring(dig(ref, "kind") | fallback(""))
                var refName = tostring(dig(ref, "name") | fallback(""))
                if (refGroup == "" || refGroup == "core") && refKind == "ConfigMap" {
                  var cm = resources.configmaps.GetSingle(policyNs, refName)
                  if cm != nil {
                    var data = dig(cm, "data") | fallback(map[string]any{})
                    var dataMap = data.(map[string]any)
                    var caCrt, ok = dataMap["ca.crt"]
                    if ok && tostring(caCrt) != "" {
                      hasValid = true
                    }
                  }
                } else if (refGroup == "" || refGroup == "core") && refKind == "Secret" {
                  var sec = resources.secrets.GetSingle(policyNs, refName)
                  if sec != nil {
                    var data = dig(sec, "data") | fallback(map[string]any{})
                    var dataMap = data.(map[string]any)
                    var caCrt, ok = dataMap["ca.crt"]
                    if ok && tostring(caCrt) != "" {
                      hasValid = true
                    }
                    if !ok {
                      var tlsCrt, ok2 = dataMap["tls.crt"]
                      if ok2 && tostring(tlsCrt) != "" {
                        hasValid = true
                      }
                    }
                  }
                } else {
                  hasInvalidGroupKind = true
                }
              }
              if !hasValid {
                resolvedStatus = "False"
                if hasInvalidGroupKind {
                  resolvedReason = "InvalidCACertificateRef"
                  resolvedMsg = "CACertificateRef points at an unsupported group / kind"
                } else {
                  resolvedReason = "NoValidCACertificate"
                  resolvedMsg = "No CACertificateRef resolves to a valid CA certificate"
                }
              }
            } else if wkca != "" {
              if wkca != "System" {
                resolvedStatus = "False"
                resolvedReason = "Invalid"
                resolvedMsg = "wellKnownCACertificates value " + wkca + " is not recognised"
              }
            } else {
              // Spec invariants reject this at admission, but be defensive
              resolvedStatus = "False"
              resolvedReason = "NoValidCACertificate"
              resolvedMsg = "Validation must specify caCertificateRefs or wellKnownCACertificates"
            }

            // Conflict detection: another BackendTLSPolicy targets the
            // same (group, kind, name, sectionName) tuple.
            //
            // Within one policy, targetRefs are validated by the CRD to
            // be distinct, so the conflict is across policies. We pick
            // a deterministic winner — earliest creationTimestamp, then
            // lex ordering on namespace/name — to avoid flapping when
            // two policies are written simultaneously.
            var acceptedStatus = "True"
            var acceptedReason = "Accepted"
            var acceptedMsg = "Policy accepted"
            var policyKey = policyNs + "/" + policyName
            var policyTs = tostring(dig(policy, "metadata", "creationTimestamp") | fallback(""))
            for _, tr := range dig(policy, "spec", "targetRefs") | toSlice() {
              var trGroup = tostring(dig(tr, "group") | fallback(""))
              var trKind = tostring(dig(tr, "kind") | fallback(""))
              var trName = tostring(dig(tr, "name") | fallback(""))
              var trSec = tostring(dig(tr, "sectionName") | fallback(""))
              for _, other := range resources.backendtlspolicies.List() {
                var otherNs = tostring(dig(other, "metadata", "namespace") | fallback(""))
                var otherName = tostring(dig(other, "metadata", "name") | fallback(""))
                var otherKey = otherNs + "/" + otherName
                if otherKey == policyKey || otherNs != policyNs {
                  continue
                }
                var otherTs = tostring(dig(other, "metadata", "creationTimestamp") | fallback(""))
                for _, otr := range dig(other, "spec", "targetRefs") | toSlice() {
                  var otrGroup = tostring(dig(otr, "group") | fallback(""))
                  var otrKind = tostring(dig(otr, "kind") | fallback(""))
                  var otrName = tostring(dig(otr, "name") | fallback(""))
                  var otrSec = tostring(dig(otr, "sectionName") | fallback(""))
                  if otrGroup == trGroup && otrKind == trKind && otrName == trName && otrSec == trSec {
                    // Same (g, k, n, sec). The earlier policy wins.
                    var thisIsLoser = false
                    if otherTs != "" && policyTs != "" && otherTs < policyTs {
                      thisIsLoser = true
                    } else if otherTs != "" && policyTs != "" && otherTs == policyTs && otherKey < policyKey {
                      thisIsLoser = true
                    } else if otherTs != "" && policyTs == "" {
                      thisIsLoser = true
                    } else if otherTs == policyTs && otherKey < policyKey {
                      thisIsLoser = true
                    }
                    if thisIsLoser {
                      acceptedStatus = "False"
                      acceptedReason = "Conflicted"
                      acceptedMsg = "Another BackendTLSPolicy already targets " + trKind + "/" + trName + "/" + trSec
                    }
                  }
                }
                if acceptedStatus == "False" {
                  break
                }
              }
              if acceptedStatus == "False" {
                break
              }
            }

            // Compute ancestors: the set of Gateways whose routes
            // reference any of the policy's target Services. Per spec
            // implementations MUST emit at least one ancestor entry;
            // when no Gateway is found we fall back to the targeted
            // Service so the policy is observable in status.
            var ancestorSet = map[string]bool{}
            var ancestors = []any{}
            for _, tr := range dig(policy, "spec", "targetRefs") | toSlice() {
              var trKind = tostring(dig(tr, "kind") | fallback(""))
              var trName = tostring(dig(tr, "name") | fallback(""))
              if trKind != "Service" {
                continue
              }
              for _, route := range resources.httproutes.List() {
                var routeNs = tostring(dig(route, "metadata", "namespace") | fallback(""))
                if routeNs != policyNs {
                  continue
                }
                var refsHit = false
                for _, rule := range dig(route, "spec", "rules") | toSlice() {
                  for _, br := range dig(rule, "backendRefs") | toSlice() {
                    var brName = tostring(dig(br, "name") | fallback(""))
                    var brKind = tostring(dig(br, "kind") | fallback("Service"))
                    if brKind == "Service" && brName == trName {
                      refsHit = true
                      break
                    }
                  }
                  if refsHit {
                    break
                  }
                }
                if !refsHit {
                  continue
                }
                for _, parentRef := range dig(route, "spec", "parentRefs") | toSlice() {
                  var prGroup = tostring(dig(parentRef, "group") | fallback("gateway.networking.k8s.io"))
                  var prKind = tostring(dig(parentRef, "kind") | fallback("Gateway"))
                  if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
                    continue
                  }
                  var gwName = tostring(dig(parentRef, "name") | fallback(""))
                  var gwNs = tostring(dig(parentRef, "namespace") | fallback(routeNs))
                  var ancKey = "Gateway/" + gwNs + "/" + gwName
                  if ancestorSet[ancKey] {
                    continue
                  }
                  ancestorSet[ancKey] = true
                  var aref = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  "Gateway",
                    "name":  gwName,
                  }
                  if dig(parentRef, "namespace") != nil {
                    aref["namespace"] = gwNs
                  }
                  ancestors = append(ancestors, map[string]any{
                    "ancestorRef":    aref,
                    "controllerName": controllerName,
                    "conditions": []any{
                      condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                        generation, RouteParentTransitionTime(policy, len(ancestors), "Accepted", acceptedStatus)),
                      condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                        generation, RouteParentTransitionTime(policy, len(ancestors), "ResolvedRefs", resolvedStatus)),
                    },
                  })
                }
              }
            }
            if len(ancestors) == 0 {
              for _, tr := range dig(policy, "spec", "targetRefs") | toSlice() {
                var trGroup = tostring(dig(tr, "group") | fallback(""))
                var trKind = tostring(dig(tr, "kind") | fallback(""))
                var trName = tostring(dig(tr, "name") | fallback(""))
                ancestors = append(ancestors, map[string]any{
                  "ancestorRef": map[string]any{
                    "group":     trGroup,
                    "kind":      trKind,
                    "name":      trName,
                    "namespace": policyNs,
                  },
                  "controllerName": controllerName,
                  "conditions": []any{
                    condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                      generation, RouteParentTransitionTime(policy, len(ancestors), "Accepted", acceptedStatus)),
                    condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                      generation, RouteParentTransitionTime(policy, len(ancestors), "ResolvedRefs", resolvedStatus)),
                  },
                })
              }
            }
            if len(ancestors) > 0 {
              statusPatch(policyNs, policyName, apiVersion, kind,
                map[string]interface{}{
                  "rendered": map[string]interface{}{
                    "ancestors": ancestors,
                  },
                  "deployed": map[string]interface{}{
                    "ancestors": ancestors,
                  },
                  "deployFailed": map[string]interface{}{
                    "ancestors": ancestors,
                  },
                })
            }
          %%}
        {%- end %}
      {% end %}

  status-patches-200-gateway:
    template: |
      {#-
        Gateway API Status Patch Registration

        Extension Point: status-patches-* (priority 200)

        Registers status patches for Gateway, HTTPRoute, and GRPCRoute resources.
        - Gateway: Accepted/Programmed conditions, addresses, listener status
        - Routes: Accepted/ResolvedRefs conditions per parent gateway

        Dependencies:
          - features-075-address-discovery (provides gf["addresses"])
      -#}
      {%- import "util-sharded-gateway-status-patches" for ShardedGatewayStatusPatches -%}
      {%- import "util-sharded-route-status-patches" for ShardedRouteStatusPatches -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- if gf["addresses"] != nil %}
        {%- var allGateways = resources.gateways.List() -%}
        {%- if len(allGateways) > 0 -%}
          {{- ShardedGatewayStatusPatches(allGateways) -}}
        {%- end -%}
      {%- end %}
      {%- var allHTTPRoutes = resources.httproutes.List() -%}
      {%- if len(allHTTPRoutes) > 0 -%}
        {{- ShardedRouteStatusPatches(allHTTPRoutes, "gateway.networking.k8s.io/v1", "HTTPRoute") -}}
      {%- end -%}
      {%- var allGRPCRoutes = resources.grpcroutes.List() -%}
      {%- if len(allGRPCRoutes) > 0 -%}
        {{- ShardedRouteStatusPatches(allGRPCRoutes, "gateway.networking.k8s.io/v1", "GRPCRoute") -}}
      {%- end -%}

  status-patches-300-backendtlspolicy:
    template: |
      {%- import "util-generate-backendtlspolicy-status-patches" for GenerateBackendTLSPolicyStatusPatches %}
      {%- var allPolicies = resources.backendtlspolicies.List() -%}
      {%- if len(allPolicies) > 0 -%}
        {%- var controllerName = extraContext | dig("controllerName") | fallback("haproxy.org/haptic") | tostring() -%}
        {{- GenerateBackendTLSPolicyStatusPatches(allPolicies, controllerName) -}}
      {%- end -%}

validationTests:
  test-httproute-duplicate-backend-different-ports:
    description: HTTPRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
              - name: admin
                port: 81
                targetPort: 8081
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: api-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: api-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: api-pod-1
          ports:
            - name: http
              port: 8080
              protocol: TCP
            - name: admin
              port: 8081
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: multi-port
            namespace: default
          spec:
            parentRefs:
              - name: gateway
                namespace: default
            hostnames:
              - example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                backendRefs:
                  - name: api-svc
                    port: 80
              - matches:
                  - path:
                      type: PathPrefix
                      value: /admin
                backendRefs:
                  - name: api-svc
                    port: 81
              - matches:
                  - path:
                      type: PathPrefix
                      value: /app
                backendRefs:
                  - name: api-svc
                    port: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_api-svc_80"
        description: Must generate backend for port 80

      - type: contains
        target: haproxy.cfg
        pattern: "backend gtw_default_multi-port_api-svc_81"
        description: Must generate backend for port 81

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^backend gtw_default_multi-port_api-svc_"
        expected: "2"
        description: Must generate exactly 2 backends (deduplication test)

      - type: contains
        target: haproxy.cfg
        pattern: "10.0.0.1:8080"
        description: Must include server with resolved targetPort 8080 (from service port 80)

      - type: contains
        target: haproxy.cfg
        pattern: "10.0.0.1:8081"
        description: Must include server with resolved targetPort 8081 (from service port 81)

  test-grpcroute-duplicate-backend-different-ports:
    description: GRPCRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: grpc-svc
            namespace: default
          spec:
            ports:
              - name: grpc
                port: 9090
                targetPort: 9090
              - name: grpc-admin
                port: 9091
                targetPort: 9091
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: grpc-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: grpc-svc
          endpoints:
            - addresses: ["10.0.0.2"]
              targetRef:
                name: grpc-pod-1
          ports:
            - port: 9090
            - port: 9091
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata:
