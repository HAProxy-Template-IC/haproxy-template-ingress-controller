  test-tlsroute-mixed-termination-protocol-conflict:
    description: |
      Gateway with both Passthrough and Terminate TLS listeners on the
      same port triggers ProtocolConflict. The Passthrough listener must
      not produce a backend (the data-plane refuses to dispatch
      conflicted listeners). Pins conformance test
      tlsroute-listener-mixed-termination-not-supported.

      Note: no Secret fixture is provided for the Terminate listener's
      certificateRef. That's fine — the chart skips invalid cert refs
      (status side surfaces InvalidCertificateRef) AND the Terminate
      listener is itself ProtocolConflict, so no cert ever gets
      consulted at runtime. Avoiding the secret fixture also avoids the
      cross-library YAML anchor (defined in ssl.yaml's
      _test_tls_crt/_test_tls_key) which doesn't resolve when libraries
      are loaded as independent files.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gw-mixed
            namespace: default
            generation: 1
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls-terminate
                protocol: TLS
                port: 8443
                hostname: terminate.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  certificateRefs:
                    - kind: Secret
                      name: tls-cert
              - name: tls-passthrough
                protocol: TLS
                port: 8443
                hostname: passthrough.example.com
                allowedRoutes:
                  namespaces:
                    from: Same
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Passthrough
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: route-passthrough
            namespace: default
          spec:
            parentRefs:
              - name: gw-mixed
                sectionName: tls-passthrough
            hostnames:
              - passthrough.example.com
            rules:
              - backendRefs:
                  - name: tcp-backend
                    port: 8443
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tcp-backend
            namespace: default
          spec:
            ports:
              - port: 8443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: tcp-backend-abc
            namespace: default
            labels:
              kubernetes.io/service-name: tcp-backend
          endpoints:
            - addresses: ["10.0.0.5"]
          ports:
            - port: 8443
    assertions:
      - type: haproxy_valid
        description: HAProxy config valid even when listeners are ProtocolConflict
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend gtw_tls_default_route-passthrough"
        description: ProtocolConflict listener must not produce a passthrough backend

