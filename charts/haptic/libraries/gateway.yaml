          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: slot-pod-1
            - addresses: ["10.0.0.3"]
              targetRef:
                kind: Pod
                name: slot-pod-3
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
