      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^abc\\.example\\.com/empty/ GW_ROUTE_ID:http:default_empty-listener-route_0$"
        description: abc.example.com dropped (claimed by abc-example-com sibling)

  # SupportGatewayInfrastructurePropagation (Standard channel) regression
  # tests. The chart's per-Gateway loop in util-generate-gateway-status-patches
  # emits a marker Service in the controller namespace whenever a Gateway
  # declares spec.infrastructure.{labels,annotations}. The conformance test
  # (sigs.k8s.io/gateway-api/conformance/tests/gateway-infrastructure.go)
  # discovers the resource via the gateway-name label and asserts subset
  # equality on its labels/annotations.
  #
  # The testrunner does not surface the rendered-resource collector
  # contents (see pkg/controller/testrunner/CLAUDE.md), so these tests
  # exercise the *render path* — proving the chart compiles, renders, and
  # produces a valid HAProxy config when infrastructure metadata is set.
  # The actual emission shape (ownedLabels / ownedAnnotations) is pinned
  # by the chart YAML's static structure and reviewed at PR time;
  # functional verification of the propagation lands in the integration
  # / conformance suite.
  test-gateway-infrastructure-propagation-labels-only:
    description: Gateway with spec.infrastructure.labels triggers marker Service emission and renders cleanly
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      controllerNamespace: "haptic-system"
      haproxyPodSelector:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: haproxy
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec:
            type: LoadBalancer
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-with-labels
            namespace: gateway-conformance-infra
            generation: 1
          spec:
            gatewayClassName: haproxy
            infrastructure:
              labels:
                key2: value2
                team: platform
            listeners:
              - name: http
                port: 8080
                protocol: HTTP
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with infrastructure-labels Gateway

