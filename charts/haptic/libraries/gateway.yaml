          spec:
            parentRefs:
              - name: gw
                sectionName: l-8090
            rules:
              - backendRefs:
                  - name: backend
                    port: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy config compiles

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com foo\\.com$"
        description: Port-80 route emits unsuffixed host entry

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:8080 foo\\.com:8080$"
        description: Port-8080 route emits :8080 suffixed host entry

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:8090 foo\\.com:8090$"
        description: Port-8090 route emits :8090 suffixed host entry

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.host_full\\) req\\.hdr\\(Host\\),lower"
        description: Routing logic captures full Host header (with port) for port-aware lookup

