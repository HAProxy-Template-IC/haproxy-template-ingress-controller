            - addresses: ["10.0.0.2"]
              targetRef:
                kind: Pod
                name: slot-pod-2
          ports:
            - port: 8080
              protocol: TCP
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: slot-lower
            namespace: default
          spec:
            parentRefs:
