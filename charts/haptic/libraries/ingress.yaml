            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_only-default_svc_fallback-svc_http"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_only-default_svc_fallback-svc_http$"
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:"
        expected: "1"

  test-ingress-default-backend-with-rules-per-host:
    description: "Ingress with both spec.rules (host: example.com) and spec.defaultBackend emits a per-host catch-all \"example.com/\" entry in path-prefix.map alongside the rule's entries. K8s spec: requests matching the Ingress's host but no rule path go to defaultBackend; requests to OTHER hosts must NOT be caught."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: rule-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: fallback-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: with-default
            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: rule-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_with-default_svc_rule-svc_http"
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_with-default_svc_fallback-svc_http"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/api/ BACKEND:default_with-default_svc_rule-svc_http$"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:default_with-default_svc_fallback-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_with-default_svc_fallback-svc_http$"

  test-ingress-default-backend-newest-wins-per-host:
    description: "Two Ingresses in different namespaces both declare defaultBackend for the same host. HAProxy maps keep only one entry per key, so we MUST pick deterministically; the newest Ingress wins per host (matches operator intent on rollout + avoids stale-Ingress 503s during scenario churn)."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: old-svc
            namespace: ns-old
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: new-svc
            namespace: ns-new
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: older
            namespace: ns-old
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: old-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend:
                        service:
                          name: old-svc
                          port:
                            number: 8080
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: newer
            namespace: ns-new
            creationTimestamp: "2024-06-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: new-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /new
                      pathType: Prefix
                      backend:
                        service:
                          name: new-svc
                          port:
                            number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-new_newer_svc_new-svc_http$"
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-old_older_svc_old-svc_http$"
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:"
        expected: "1"
