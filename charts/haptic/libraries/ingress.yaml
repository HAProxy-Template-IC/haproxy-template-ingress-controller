# Ingress Template Library
#
# Provides Kubernetes networking.k8s.io/v1 Ingress support.
# Features: path matching (Exact, Prefix), TLS certificates, backend generation.

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ingress.enabled }}'
  inject:
    - path: watchedResources.ingresses.fieldSelector
      value: 'spec.ingressClassName={{ .Values.ingressClass.name }}'

watchedResources:
  ingresses:
    apiVersion: networking.k8s.io/v1
    resources: ingresses
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # fieldSelector: injected by Helm from ingressClass.name
  services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]
  endpoints:
    apiVersion: discovery.k8s.io/v1
    resources: endpointslices
    indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
    # "0" = no per-watcher debounce: the reconciler fires on every
    # EndpointSlice change so a pod-IP rotation reaches HAProxy inside the
    # kubelet Ready→SIGTERM window. The reconciler-level refractory still
    # batches across resource kinds.
    debounceInterval: "0"

templateSnippets:
  # ============================================================================
  # Feature Registration
  # ============================================================================

  features-100-ingress-bind:
    template: |
      {#-
        Ingress contribution to the chart-static bind decision.

        * Any Ingress sets bindHTTPDefault — Ingress always serves
          plaintext on the chart's http port, so the http_frontend
          must bind there.
        * An Ingress with spec.tls additionally sets
          bindHTTPSDefault — the TLS-terminating listener lives on
          the chart's https port.

        Both flags also set the corresponding needHTTPFrontend /
        needHTTPSFrontend so the surrounding frontend block renders.
        Resource libraries other than ingress contribute to the same
        flags from their own features-100-*-bind / -tls snippets;
        first writer wins is fine because all flags are booleans.
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- for _, ingress := range resources.ingresses.List() %}
      {%%
        gf["bindHTTPDefault"] = true
        gf["needHTTPFrontend"] = true
        if len(ingress.Spec.Tls) > 0 {
          gf["bindHTTPSDefault"] = true
          gf["needHTTPSFrontend"] = true
          // Ingress with spec.tls has HTTPS termination (the chart's
          // HTTPS frontend hosts the cert). Light up
          // needHTTPSTermination so chart-static ssl-tcp falls
          // through to ssl-loopback for unmatched SNIs (current
          // behaviour) rather than rejecting them.
          gf["needHTTPSTermination"] = true
        }
      %%}
      {%- end %}

  features-100-ingress-tls:
    template: |
      {#- Registers TLS certificates from Ingress spec.tls with SSL infrastructure -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%%
          var tlsList = ingress.Spec.Tls
          if len(tlsList) == 0 {
            continue
          }
        %%}
        {%- for _, tls := range tlsList %}
          {%%
            var secretName = tls.SecretName
            if secretName == "" {
              continue
            }
            // Unique key for this secret (namespace + name)
            var namespace = ingress.Metadata.Namespace
            if !first_seen("ingress_tls", namespace, secretName) {
              continue
            }

            // Fetch Secret and extract cert+key
            var secret = resources.secrets.GetSingle(namespace, secretName)
            if secret == nil {
              continue
            }
            var tlsCrt, hasCrt = secret.Data["tls.crt"]
            var tlsKey, hasKey = secret.Data["tls.key"]
            if !hasCrt || !hasKey {
              continue
            }

            // Combine cert and key into single PEM (HAProxy format).
            // Pipe form discards the b64decode error return, matching the
            // pre-typing behaviour.
            var combinedPem = (tlsCrt | b64decode()) + "\n" + (tlsKey | b64decode())

            // Register certificate file dynamically using file_registry
            // The filename is sanitized by PathResolver (dots replaced with underscores, etc.)
            var certFilename = namespace + "_" + secretName + ".pem"
            var certPath, certRegErr = fileRegistry.Register("cert", certFilename, combinedPem)
            if certRegErr != nil {
              fail("failed to register certificate " + certFilename + ": " + tostring(certRegErr))
            }

            // Extract the sanitized filename from the returned path
            // This is needed because HAProxy client-native sanitizes filenames for storage
            var sanitizedFilename = basename(certPath)

            // Register with SSL infrastructure for crt-list generation
            // Use sanitized_filename to ensure crt-list matches the actual file on disk
            var tlsCert = map[string]any{
              "secret_namespace": namespace,
              "secret_name": secretName,
              {#- toSlice() normalises the typed []string from
                  Ingress.Spec.Tls[i].Hosts into []any so downstream
                  ssl.yaml consumers (which assert .([]any) on a
                  polymorphic tlsCertificates slice) don't trip on
                  the typed-slice shape. No `| fallback([]any{})` —
                  scriggoToSlice already returns []any{} for nil input. -#}
              "sni_patterns": tls.Hosts | toSlice(),
              "sanitized_filename": sanitizedFilename,
            }
            gf["tlsCertificates"] = append(gf["tlsCertificates"].([]any), tlsCert)
          %%}
        {%- end %}
      {%- end %}

  # ============================================================================
  # Host Key Normalisation
  # ============================================================================

  # Single source of truth for how Ingress hosts get normalised into map
  # keys. Wildcard hosts (`*.example.com`) lose the leading `*` so the
  # key becomes `.example.com` — the same form host.map uses (see
  # util-generate-host-map-ingress) and the same form HAProxy's
  # `regsub(^[^.]*,,)` fallback in base.yaml's frontend-routing-logic
  # produces at request time. With consistent normalisation, every
  # `<host><path>`-keyed map (host.map, auth-url.map, auth-signin.map,
  # auth-method.map, auth-forward-headers.map, auth-extract-headers.map,
  # haproxy-ingress-waf.map, coraza-app.map, …) can be looked up via
  # `var(txn.host_match),concat(,txn.path,),map_beg(...)` and a
  # wildcard-host Ingress's per-route entries will hit.
  #
  # The argument is `any` because Scriggo's `dig()` returns `any` and
  # forcing every caller to `tostring(rule | dig("host") | fallback(""))`
  # before the call would just push the same boilerplate everywhere.
  # Returns a string. Empty input → empty string (caller's responsibility
  # to validate non-empty if it matters; vendor libraries' annotation
  # walks already do).
  util-ingress-host-key:
    template: |
      {%- macro MapKeyForHost(host any) string -%}
        {%- show tostring(host | fallback("")) | replace("*", "") -%}
      {%- end macro -%}

  # ============================================================================
  # Backend Generation
  # ============================================================================

  util-backend-name-ingress:
    template: |
      {#- Generates backend name: <ns>_<ingress>_svc_<svc>_<port-name> (matches production format) -#}
      {% macro BackendNameIngress(ingress *resources.ingresses.T, path any) string %}{%%
        var namespace = ingress.Metadata.Namespace
        var name = ingress.Metadata.Name
        var serviceName = tostring(path | dig("backend", "service", "name") | fallback(""))
        var portName = tostring(path | dig("backend", "service", "port", "name") | fallback(""))
        var portNumber = path | dig("backend", "service", "port", "number") | fallback(0)

        // Resolve port number to port name via Service lookup when only number is specified
        if portName == "" && toint(portNumber) > 0 {
          var svc = resources.services.GetSingle(namespace, serviceName)
          if svc != nil {
            for _, sp := range svc.Spec.Ports {
              if toint(sp.Port) == toint(portNumber) {
                portName = sp.Name
                break
              }
            }
          }
        }

        // Fall back to port number if port name is not available
        var portIdentifier = portName
        if portIdentifier == "" {
          portIdentifier = tostring(portNumber)
        }

        show namespace + "_" + name + "_svc_" + serviceName + "_" + portIdentifier
      %%}{% end %}

  util-path-map-entry-ingress-shard:
    template: |
      {#- Generates map entries for a slice of Ingress resources -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}

      {% macro PathMapEntryIngressShard(ingresses []*resources.ingresses.T, pathTypes []string, suffix string) string %}
        {%- for _, ingress := range ingresses -%}
          {%- var matchCount = 0 -%}
          {#- Count matching paths. The outer rule loop's body uses
              only path-level fields — flatten via `[*]`. -#}
          {%- for _, path := range ingress.Spec.Rules[*].Http.Paths -%}
            {%- if path.Path != "" -%}
              {%- for _, checkType := range pathTypes -%}
                {%- if path.PathType == checkType -%}{%- matchCount = matchCount + 1 -%}{%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {%- if matchCount > 0 -%}
      {{ "\n" }}# Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ matchCount }} paths)
            {%- for _, rule := range ingress.Spec.Rules -%}
              {%- for _, path := range rule.Http.Paths -%}
                {%- if path.Path != "" -%}
                  {%- for _, checkType := range pathTypes -%}
                    {%- if path.PathType == checkType -%}
                      {%- var pathStr = path.Path -%}
                      {%- if suffix == "" && pathStr == "/" -%}{%- continue -%}{%- end -%}
                      {%- var actualSuffix = suffix -%}
                      {%- if suffix == "/" && hasSuffix(pathStr, "/") -%}{%- actualSuffix = "" -%}{%- end -%}
                      {#- For pfxexact (Prefix-boundary check, suffix=""), strip the
                         trailing slash so /foo/ Prefix's boundary entry is /foo
                         and request /foo hits it. For Exact (also suffix=""),
                         DO NOT strip — K8s spec says Exact is character-wise
                         exact, so /foo/ must NOT match request /foo (upstream
                         conformance scenario: "An Ingress with a trailing
                         slashes in an exact path rule should not match
                         requests without a trailing slash"). -#}
                      {%- if path.PathType != "Exact" && suffix == "" && len(pathStr) > 1 && hasSuffix(pathStr, "/") -%}{%- pathStr = pathStr[:len(pathStr)-1] -%}{%- end -%}
      {{ "\n" }}{{ MapKeyForHost(rule.Host) }}{{ pathStr }}{{ actualSuffix }} BACKEND:{{ BackendNameIngress(ingress, path) }}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}

  # ============================================================================
  # Map File Generation (Sharded)
  # ============================================================================

  util-sharded-path-map-entry-ingress:
    template: |
      {#- Wraps PathMapEntryIngressShard with parallel sharding logic -#}
      {%- import "util-path-map-entry-ingress-shard" for PathMapEntryIngressShard -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedPathMapEntryIngress(pathTypes []string, suffix string) string %}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- var n = toint(CalculateShardCount(len(allIngresses), 100)) -%}
      {%- if n <= 1 || len(allIngresses) < 100 -%}
      {{ PathMapEntryIngressShard(allIngresses, pathTypes, suffix) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go PathMapEntryIngressShard(shard_slice(allIngresses, i, n), pathTypes, suffix) }}
      {%- end -%}
      {%- end -%}
      {% end %}

  # ============================================================================
  # Backend Generation
  # ============================================================================

  util-generate-backends-ingress:
    template: |
      {#- Generates backend sections for a list of Ingresses -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-backend-servers-helpers" for BuildServerOptions -%}
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {% macro GenerateIngressBackends(ingresses []*resources.ingresses.T) string %}
        {%- for _, ingress := range ingresses -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var svcName = path.Backend.Service.Name -%}
              {%- if svcName != "" -%}
                {%- var resolvedParts = split(ResolveServicePort(ns, svcName, path.Backend.Service.Port), " ") -%}
                {%- var port = toint(resolvedParts[0]) -%}
                {%- var portName = resolvedParts[1] -%}
                {%- var portId = portName -%}
                {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
                {%- if first_seen("ingress_backend", ns, name, svcName, portId) -%}
      # Backend for: Ingress {{ ns }}/{{ name }} → Service {{ svcName }}:{{ port }}
                  {%- var backendKey = BackendNameIngress(ingress, path) %}
      backend {{ backendKey }}
          guid {{ make_guid("be", backendKey) }}
                  {%- var serverOpts = map[string]any{"flags": []any{}} -%}
                  {{- render_glob "backend-directives-*" inherit_context | indent(2, true) }}
        default-server {{ serverOpts | dig("checkDirective") | fallback("check") | tostring() }}{{ BuildServerOptions(serverOpts) }}
        {{ BackendServers(svcName, 0, port, serverOpts, portName, backendKey, ns) | indent(2, true) }}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {#- spec.defaultBackend — per K8s spec, handles requests that don't
             match any rule path. Emits its own backend pool through the same
             first_seen dedup so a default backend pointing at the same
             service+port as a rule backend doesn't produce a duplicate
             `backend` stanza. The synthesized path lets BackendNameIngress
             produce a stable, ingress-scoped backend name. -#}
          {%- var dbSvcName = ingress.Spec.DefaultBackend.Service.Name -%}
          {%- if dbSvcName != "" -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} -%}
            {%- var resolvedParts = split(ResolveServicePort(ns, dbSvcName, ingress.Spec.DefaultBackend.Service.Port), " ") -%}
            {%- var port = toint(resolvedParts[0]) -%}
            {%- var portName = resolvedParts[1] -%}
            {%- var portId = portName -%}
            {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
            {%- if first_seen("ingress_backend", ns, name, dbSvcName, portId) -%}
      # Default backend for: Ingress {{ ns }}/{{ name }} → Service {{ dbSvcName }}:{{ port }}
              {%- var backendKey = BackendNameIngress(ingress, path) %}
      backend {{ backendKey }}
          guid {{ make_guid("be", backendKey) }}
              {%- var serverOpts = map[string]any{"flags": []any{}} -%}
              {{- render_glob "backend-directives-*" inherit_context | indent(2, true) }}
        default-server {{ serverOpts | dig("checkDirective") | fallback("check") | tostring() }}{{ BuildServerOptions(serverOpts) }}
        {{ BackendServers(dbSvcName, 0, port, serverOpts, portName, backendKey, ns) | indent(2, true) }}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}

  util-sharded-backends-ingress:
    template: |
      {#- Sharded backend generator for Ingress resources -#}
      {%- import "util-generate-backends-ingress" for GenerateIngressBackends -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressBackends(ingresses []*resources.ingresses.T) string %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressBackends(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressBackends(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  backends-500-ingress:
    template: |
      {#- Generates HAProxy backend sections for all Ingress resources -#}
      {%- import "util-sharded-backends-ingress" for ShardedIngressBackends -%}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- if len(allIngresses) > 0 %}
      # ingress/backends-ingress
      {{ ShardedIngressBackends(allIngresses) }}
      {%- end -%}
  util-generate-host-map-ingress:
    template: |
      {#- Macro to generate host map entries for Ingress resources -#}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {%- macro GenerateIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- for _, ingress := range ingresses -%}
      {%- var rules = ingress.Spec.Rules %}
      {%- var rulesWithHttp = selectattr(rules, "http") %}
      {%- if len(rulesWithHttp) > 0 %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ len(rulesWithHttp) }} hosts)
      {% for _, rule := range rulesWithHttp %}
      {%- var hostKey = MapKeyForHost(rule | dig("host")) %}
      {{ hostKey }} {{ hostKey }}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-host-map-ingress:
    template: |
      {#- Sharded host map generator for Ingress resources -#}
      {%- import "util-generate-host-map-ingress" for GenerateIngressHostMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
      {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressHostMap(ingresses) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressHostMap(shard_slice(ingresses, i, n)) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-host-500-ingress:
    template: |
      {#- Generate host map entries for Ingress resources (wildcards converted to suffix form) -#}
      {%- import "util-sharded-host-map-ingress" for ShardedIngressHostMap %}
      {%- var allIngresses = resources.ingresses.List() %}
      {%- if len(allIngresses) > 0 %}
      # ingress/map-host-ingress
      {{ ShardedIngressHostMap(allIngresses) }}
      {%- end -%}

  map-path-exact-500-ingress:
    template: |
      {#-
        Ingress Exact Path Map Entries

        Purpose: Generates path-exact.map entries for Ingress exact path matching.

        Extension Point: map-path-exact-* (priority 500)

        Matches: Ingress paths with pathType: Exact
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-exact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Exact"}, "") }}

  map-pfxexact-500-ingress:
    template: |
      {#-
        Ingress Prefix-Exact Path Map Entries

        Purpose: Generates path-prefix-exact.map entries for exact prefix boundary matching.

        Extension Point: map-pfxexact-* (priority 500)

        Matches: Ingress paths with pathType: Prefix or ImplementationSpecific
        Note: No trailing slash - matches exact path for prefix boundary check.
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-pfxexact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "") }}

  map-path-prefix-500-ingress:
    template: |
      {#-
        Ingress Prefix Path Map Entries

        Purpose: Generates path-prefix.map entries for prefix path matching.

        Extension Point: map-path-prefix-* (priority 500)

        Matches: Ingress paths with pathType: Prefix or ImplementationSpecific
        Note: Adds trailing slash for HAProxy map_beg matching.
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-prefix-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "/") }}

  map-path-prefix-501-ingress-default:
    template: |
      {#- spec.defaultBackend catch-all entries per K8s Ingress spec
         ("defaultBackend handles requests that don't match any rule").
         The map_beg longest-prefix-match in path-prefix.map naturally
         picks the most-specific rule entry first, falling through to
         these catch-alls when no rule path matched.

         The hostKey for each entry determines what the catch-all
         applies to:
           - "" (rules-less Ingress, OR rule with no host):
                emits "/" — catches every host that didn't match a
                more-specific entry (the K8s "all traffic to default"
                semantics for rules-less; for hostless rules it matches
                the same all-hosts intent).
           - "<host>" (rule with a host):
                emits "<host>/" — catches requests to that host that
                didn't match any of the Ingress's rule paths.
         (Wildcard hosts already had their `*` stripped by
         MapKeyForHost, so `*.foo.com` becomes `.foo.com` which is the
         same form host.map uses.)

         Dedup per host: HAProxy maps keep only one entry per duplicate
         key, so two Ingresses both claiming the same host's catch-all
         would conflict. We sort all candidate (hostKey, ingress) pairs
         by creationTimestamp desc, then use first_seen per hostKey to
         pick the newest Ingress per host. The "newest wins" semantic
         (a) matches what operators expect when they roll out a new
         default and (b) avoids a stale-Ingress race during scenario
         churn — a first-by-list-order pick would land on a being-
         deleted backend whose pods are already gone, producing 503s
         on the new scenario's traffic (originally confirmed in
         GitLab MR !955 pipeline 2529981548 for the rules-less case;
         the same logic applies per host now). -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-ingress-host-key" for MapKeyForHost -%}
      {%- var candidates = []any{} -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {#- dig() handles "defaultBackend absent" (returns nil) vs
            "present but with no service" (returns the struct, then
            inner dig() returns nil on absent service). Typed access
            alone can't observe these cases. -#}
        {%- if dig(ingress, "spec", "defaultBackend") != nil && dig(ingress, "spec", "defaultBackend", "service") != nil -%}
          {%- var ts = ingress.Metadata.CreationTimestamp -%}
          {%- var rules = ingress.Spec.Rules -%}
          {%- if len(rules) == 0 -%}
            {%- candidates = append(candidates, map[string]any{"hostKey": "", "ingress": ingress, "ts": ts}) -%}
          {%- else -%}
            {%- for _, rule := range rules -%}
              {%- var hostKey = MapKeyForHost(rule.Host) -%}
              {%- candidates = append(candidates, map[string]any{"hostKey": hostKey, "ingress": ingress, "ts": ts}) -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- if len(candidates) > 0 -%}
        {%- var sorted = candidates | sort_by([]string{"$.ts:desc"}) -%}
        {%- for _, cand := range sorted -%}
          {%- var hostKey = tostring(cand["hostKey"]) -%}
          {%- if first_seen("ingress_default_host", hostKey) -%}
            {#- Explicit type assertion: cand is map[string]any so
                cand["ingress"] is statically `any`; without the
                `.(*resources.ingresses.T)` cast, BackendNameIngress's
                typed parameter would force Scriggo into an implicit
                `any → *T` conversion at the call site that empirically
                broke TestIngressAuthHeadersFail on MR !1010 (bisect-
                confirmed). The explicit assertion takes the standard
                Scriggo emit path instead. -#}
            {%- var ingress = cand["ingress"].(*resources.ingresses.T) -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} (defaultBackend → "{{ hostKey }}/")
      {{ hostKey }}/ BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end -%}
        {%- end -%}
      {%- end %}

  # ============================================================================
  # Status Patch Registration
  # ============================================================================

  util-generate-ingress-status-patches:
    template: |
      {#-
        Generate Ingress Status Patches

        For each Ingress, registers a status patch with:
          - deployed: LoadBalancer addresses from address discovery
          - deployFailed: Empty LoadBalancer addresses

        Parameters:
          ingresses: Slice of Ingress resources to process

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex)
      -#}
      {% macro GenerateIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var addresses = gf["addresses"] %}
        {%- for _, ingress := range ingresses %}
          {%%
            var namespace = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name

            statusPatch(namespace, name,
              "networking.k8s.io/v1", "Ingress",
              map[string]interface{}{
                "deployed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": addresses,
                  },
                },
                "deployFailed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": []any{},
                  },
                },
              })
          %%}
        {%- end %}
      {% end %}

  util-sharded-ingress-status-patches:
    template: |
      {#-
        Sharded Ingress Status Patches

        Wraps GenerateIngressStatusPatches with automatic parallel sharding.
        Uses the same pattern as ShardedIngressBackends.
      -#}
      {%- import "util-generate-ingress-status-patches" for GenerateIngressStatusPatches -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressStatusPatches(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressStatusPatches(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  status-patches-200-ingress:
    template: |
      {#-
        Ingress Status Patch Registration

        Extension Point: status-patches-* (priority 200)

        Registers status patches for all Ingress resources with LoadBalancer
        addresses from address discovery. Skips if no addresses are available.

        Dependencies:
          - features-075-address-discovery (provides gf["addresses"])
      -#}
      {%- import "util-sharded-ingress-status-patches" for ShardedIngressStatusPatches -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- if gf["addresses"] != nil %}
        {%- var allIngresses = resources.ingresses.List() -%}
        {%- if len(allIngresses) > 0 -%}
          {{- ShardedIngressStatusPatches(allIngresses) -}}
        {%- end -%}
      {%- end %}

validationTests:
  test-ingress-duplicate-backend-different-ports:
    description: Ingress with multiple paths to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
              - name: admin
                port: 81
                targetPort: 8081
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: multi-port
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 80
                    - path: /admin
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 81
                    - path: /app
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_http"

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_admin"

      - type: match_count
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_"
        expected: "2"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/api/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/admin/ BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/app/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/api BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/admin BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/app BACKEND:default_multi-port_svc_api-svc_http"

      # Map Formatting Tests - Ensure proper line separation
      - type: not_contains
        target: map:host.map
        pattern: "hosts\\)\\S"

      - type: not_contains
        target: map:path-prefix.map
        pattern: "paths\\)\\S"

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "paths\\)\\S"

      - type: contains
        target: map:host.map
        pattern: "(?m)^example\\.com example\\.com$"

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/api/ BACKEND:"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^example\\.com/api BACKEND:"

