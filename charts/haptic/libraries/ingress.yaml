  test-ingress-slot-preservation:
    description: |
      Existing pods keep their slot across renders; new pods land in
      slot N+1 after highestUsedSlot (no reuse of freshly-vacated slots).
      Existing pod parked at SRV_3 so the assertion is sensitive to actual
      preservation vs. lowest-free-slot luck.
    currentConfig: |
      # SRV_3: existing pod (10.0.0.1) — preserved across rollout.
      # SRV_4: old pod (10.0.0.2) being replaced → placeholder; new pod → SRV_5.
      backend default_slot-test_svc_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.1:8080 check
          server SRV_4 10.0.0.2:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        # After rolling deployment: pod 10.0.0.2 removed, pod 10.0.0.3 added
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: slot-pod-1
            - addresses: ["10.0.0.3"]
              targetRef:
                kind: Pod
                name: slot-pod-3
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: slot-test
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: slot-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: slot-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_slot-test_svc_slot-svc_80"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.1:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.3:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.3:8080"

  test-ingress-slot-preservation-lower-ip:
    description: |
      Slot assignment must be insensitive to IP sort order — existing pod
      keeps its parked slot even when the new pod's IP sorts lower.
      Existing pod at SRV_3 forces the assertion to be sensitive to
      actual preservation vs. iteration-order luck.
    currentConfig: |
      # SRV_3=10.0.0.5 stays; SRV_4=10.0.0.6 vacated → placeholder; 10.0.0.2 → SRV_5.
      backend default_slot-lower_svc_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.5:8080 check
          server SRV_4 10.0.0.6:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.5"]
              targetRef:
                kind: Pod
                name: slot-pod-5
            - addresses: ["10.0.0.2"]
              targetRef:
                kind: Pod
                name: slot-pod-2
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: slot-lower
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: slot-lower.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: slot-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.5:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.2:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.2:8080"

  test-ingress-endpoint-conditions-filter:
    description: |
      EndpointSlice entries with conditions.ready=false (pod starting up,
      not yet listening) or conditions.terminating=true (pod being shut
      down by kubelet) MUST be excluded from the rendered backend.
      Otherwise HAProxy dispatches requests to a not-yet-listening
      container (→ 503 SC-- during pod startup) or to a terminating
      container that has already stopped accepting connections
      (→ 503 SC-- during rolling restart drain window). Reproduces the
      single-replica rolling-restart 503 pattern observed in production.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: cond-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cond-svc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: cond-svc
          addressType: IPv4
          endpoints:
            # Healthy steady-state pod — must appear.
            - addresses: ["10.0.0.1"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-ready}
            # New pod with sandbox up but container not yet listening
            # (kubelet has added it to the slice as not-ready). MUST NOT
            # appear — including it puts a dead IP in the backend until
            # the readiness probe finally flips Ready=true.
            - addresses: ["10.0.0.2"]
              conditions: {ready: false, serving: false, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-starting}
            # Old pod after SIGTERM: kubelet keeps the entry in the slice
            # for the grace window but flags it terminating. MUST NOT
            # appear — most apps stop accepting new connections on
            # SIGTERM, so HAProxy dispatching to this pod produces
            # connection-refused 503s.
            - addresses: ["10.0.0.3"]
              conditions: {ready: false, serving: false, terminating: true}
              targetRef: {kind: Pod, name: cond-pod-terminating}
            # Endpoint with no conditions block at all — per the
            # EndpointSlice spec, nil Ready is treated as Ready=true (the
            # producer didn't fill it in). MUST appear.
            - addresses: ["10.0.0.4"]
              targetRef: {kind: Pod, name: cond-pod-noconds}
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: cond-test
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: cond-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: cond-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080 .*enabled"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_2 10\\.0\\.0\\.4:8080 .*enabled"

      - type: not_contains
        target: haproxy.cfg
        pattern: "10\\.0\\.0\\.2:8080"

      - type: not_contains
        target: haproxy.cfg
        pattern: "10\\.0\\.0\\.3:8080"

  test-ingress-status-patches:
    description: Ingress status patches register LoadBalancer addresses from controller service
    fixtures:
