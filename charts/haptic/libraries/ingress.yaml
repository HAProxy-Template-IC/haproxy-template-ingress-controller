  test-ingress-named-port-typo-fails:
    description: Ingress referencing a non-existent port name must fail rendering loudly with a clear message
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: unifi
            namespace: default
          spec:
            ports:
              - name: https-gui
                port: 8443
                targetPort: https-gui
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: unifi-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: unifi
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.42"]
          ports:
            - name: https-gui
              port: 8443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: unifi
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: unifi.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: unifi
                          port:
                            name: nonexistent-port-name
    assertions:
      - type: contains
        target: rendering_error
        pattern: "ResolveServicePort: Service default/unifi has no port named 'nonexistent-port-name'"
        description: Rendering must fail with a message naming the offending port and the service
      - type: contains
        target: rendering_error
        pattern: "https-gui\\(8443\\)"
        description: Error message must list the service's actual port names to aid debugging

  test-ingress-default-backend-rules-less:
    description: |
      Ingress with only spec.defaultBackend (no rules) emits a "/"
      catch-all entry in path-prefix.map pointing at the default backend
      pool, and the backend pool itself gets generated. Routes any
      request that didn't match a more-specific rule to that backend.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: fallback-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: only-default
            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_only-default_svc_fallback-svc_http"
        description: Backend pool for the default backend service is emitted
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_only-default_svc_fallback-svc_http$"
        description: Catch-all "/" entry points at the default backend
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:"
        expected: "1"
        description: Exactly one catch-all "/" entry (no duplicates)

  test-ingress-default-backend-with-rules-per-host:
    description: |
      Ingress with both spec.rules (host: example.com) and
      spec.defaultBackend emits a per-host catch-all "example.com/"
      entry in path-prefix.map alongside the rule's entries. K8s spec:
      requests matching the Ingress's host but no rule path go to
      defaultBackend; requests to OTHER hosts must NOT be caught.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: rule-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: fallback-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: with-default
            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: rule-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_with-default_svc_rule-svc_http"
        description: Backend pool for the rule path is emitted
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_with-default_svc_fallback-svc_http"
        description: Backend pool for the default backend is emitted
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/api/ BACKEND:default_with-default_svc_rule-svc_http$"
        description: Rule path /api keeps its specific entry
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:default_with-default_svc_fallback-svc_http$"
        description: Per-host catch-all "example.com/" points at default backend
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_with-default_svc_fallback-svc_http$"
        description: No global "/" catch-all (defaultBackend is scoped to the Ingress's host, not all hosts)

  test-ingress-default-backend-newest-wins-per-host:
    description: |
      Two Ingresses in different namespaces both declare defaultBackend
      for the same host. HAProxy maps keep only one entry per key, so
      we MUST pick deterministically; the newest Ingress wins per host
      (matches operator intent on rollout + avoids stale-Ingress 503s
      during scenario churn).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: old-svc
            namespace: ns-old
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: new-svc
            namespace: ns-new
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: older
            namespace: ns-old
            creationTimestamp: "2024-01-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: old-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend:
                        service:
                          name: old-svc
                          port:
                            number: 8080
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: newer
            namespace: ns-new
            creationTimestamp: "2024-06-01T00:00:00Z"
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: new-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /new
                      pathType: Prefix
                      backend:
                        service:
                          name: new-svc
                          port:
                            number: 8080
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-new_newer_svc_new-svc_http$"
        description: Per-host catch-all points at the newer Ingress's backend
      - type: not_contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:ns-old_older_svc_old-svc_http$"
        description: Older Ingress's defaultBackend does NOT claim the host catch-all
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/ BACKEND:"
        expected: "1"
        description: Exactly one catch-all entry for example.com (no duplicate-key collision)
