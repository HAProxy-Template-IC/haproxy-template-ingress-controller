                targetPort: controller
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: unifi-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: unifi
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.42"]
              targetRef:
                kind: Pod
                name: unifi-0
          ports:
            - name: https-gui
              port: 8443
              protocol: TCP
            - name: controller
              port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: unifi
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: unifi.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: unifi
                          port:
                            name: https-gui
    assertions:
      - type: haproxy_valid
        description: HAProxy configuration must be syntactically valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.42:8443 "
        description: Server line must use the resolved numeric pod port (8443), not the previous :80 fallback

      - type: contains
        target: haproxy.cfg
        pattern: "# Backend for: Ingress default/unifi → Service unifi:8443"
        description: Backend comment must show the resolved numeric port, not the misleading :80

      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.42:80 "
