                          port:
                            name: http
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: second-broken
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: second.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: second-ghost
                          port:
                            name: http
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
        expected: "2"
      - type: match_count
        target: "k8s:ingress-degraded-backend-events"
        pattern: "(?m)^---$"
        expected: "1"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/first-ghost"
      - type: contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "default/second-ghost"

  test-ingress-degraded-backend-event-negatives:
    description: |
      The degraded-backend Event (issue #66) must stay silent in every
      non-degraded shape: (1) a by-name reference whose Service exists
      resolves normally; (2) a by-NUMBER reference to an absent Service is
      trusted as-is (ResolveServicePort never degrades it to port 0), so it
      is out of the Event's by-name scope. Neither may produce an Event.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: healthy-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: by-name-resolved
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: ok.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: healthy-svc
                          port:
                            name: http
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: by-number-absent
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: num.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ghost-svc
                          port:
                            number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_by-name-resolved_svc_healthy-svc_http"
      # No Event object at all — neither shape is a by-name degradation.
      - type: not_contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "kind: Event"
      - type: not_contains
        target: "k8s:ingress-degraded-backend-events"
        pattern: "BackendUnresolved"

  test-ingress-default-backend-rules-less:
    description: "Ingress with only spec.defaultBackend (no rules) emits a \"/\" catch-all entry in path-prefix.map pointing at the default backend pool, and the backend pool itself gets generated. Routes any request that didn't match a more-specific rule to that backend."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: fallback-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: only-default
            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend default_only-default_svc_fallback-svc_http"
      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:default_only-default_svc_fallback-svc_http$"
      - type: match_count
        target: map:path-prefix.map
        pattern: "(?m)^/ BACKEND:"
        expected: "1"

  test-ingress-default-backend-with-rules-per-host:
    description: "Ingress with both spec.rules (host: example.com) and spec.defaultBackend emits a per-host catch-all \"example.com/\" entry in path-prefix.map alongside the rule's entries. K8s spec: requests matching the Ingress's host but no rule path go to defaultBackend; requests to OTHER hosts must NOT be caught."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: rule-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: fallback-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 8080
                targetPort: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: with-default
            namespace: default
          spec:
            ingressClassName: haproxy
            defaultBackend:
              service:
                name: fallback-svc
                port:
                  number: 8080
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
