# Ingress Template Library
#
# Provides Kubernetes networking.k8s.io/v1 Ingress support.
# Features: path matching (Exact, Prefix), TLS certificates, backend generation.

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ingress.enabled }}'
  inject:
    - path: watchedResources.ingresses.fieldSelector
      value: 'spec.ingressClassName={{ .Values.ingressClass.name }}'

# Library-declared extraContext defaults (merged at lowest precedence; an
# operator override via controller.config.templatingSettings.extraContext wins).
templatingSettings:
  extraContext:
    # Serve every Ingress over HTTPS on the chart's https port using the default
    # certificate, even without spec.tls (features-100-ingress-bind). Set to
    # false to keep Ingress plaintext-only until a host opts in via spec.tls.
    # Has no effect when the default certificate is disabled
    # (defaultSSLCertificate.enabled=false) — there is no cert to bind then.
    ingressDefaultHTTPS: true
    # Redirect all HTTPS-served Ingress hosts from HTTP to HTTPS
    # (features-105-ingress-ssl-redirect). Opt-in; per-host vendor `ssl-redirect`
    # annotations still work independently. Only redirects hosts actually served
    # over HTTPS (default-HTTPS bind on, or the Ingress has spec.tls).
    ingressDefaultSSLRedirect: false
    # HTTP status code for the redirect above: one of 301, 302, 303, 307, 308.
    ingressDefaultSSLRedirectCode: "308"

watchedResources:
  ingresses:
    apiVersion: networking.k8s.io/v1
    resources: ingresses
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # fieldSelector: injected by Helm from ingressClass.name
  services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]
  endpoints:
    apiVersion: discovery.k8s.io/v1
    resources: endpointslices
    indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
    # "0" = no per-watcher debounce: the reconciler fires on every
    # EndpointSlice change so a pod-IP rotation reaches HAProxy inside the
    # kubelet Ready→SIGTERM window. The reconciler-level refractory still
    # batches across resource kinds.
    debounceInterval: "0"

templateSnippets:
  # ============================================================================
  # Feature Registration
  # ============================================================================

  features-100-ingress-bind:
    template: |
      {#-
        Ingress contribution to the chart-static bind decision.

        * Any Ingress sets bindHTTPDefault — Ingress always serves
          plaintext on the chart's http port, so the http_frontend
          must bind there.
        * By default any Ingress ALSO sets bindHTTPSDefault, so the
          chart's https port terminates TLS with the default
          certificate and the Ingress is reachable over both HTTP and
          HTTPS out of the box — no spec.tls required. Two conditions
          gate this default-on HTTPS:
            - extraContext.ingressDefaultHTTPS (bool, default true).
              Set it false to keep Ingress plaintext-only until a
              spec.tls entry opts a host into HTTPS.
            - a default certificate must be configured — the chart
              surfaces defaultSSLCertificate.enabled as
              extraContext.default_ssl_cert_name. With the default cert
              disabled the chart is HTTP-only and there is no cert to
              bind, so the https port stays closed.
          An Ingress WITH spec.tls sets bindHTTPSDefault regardless of
          the toggle — its own cert terminates TLS.

        All flags also set the corresponding needHTTPFrontend /
        needHTTPSFrontend so the surrounding frontend block renders,
        plus needHTTPSTermination so the terminating https frontend
        claims unmatched SNIs (rather than the ssl-tcp passthrough
        frontend rejecting them). Resource libraries other than ingress
        contribute to the same flags from their own
        features-100-*-bind / -tls snippets; first writer wins is fine
        because all flags are booleans.
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var tlsDefault bool = extraContext | dig("ingressDefaultHTTPS") | fallback(true) %}
      {%- var haveDefaultCert = tostring(extraContext | dig("tls", "defaultCertificate", "name") | fallback("")) != "" %}
      {%- var httpsByDefault = tlsDefault && haveDefaultCert %}
      {#- Stash the default-HTTPS decision so features-105-ingress-ssl-redirect
          reuses the exact same gate (an Ingress host is only redirected to
          HTTPS when it is actually served over HTTPS). -#}
      {%- gf["ingressHTTPSByDefault"] = httpsByDefault %}
      {%- for _, ingress := range resources.ingresses.List() %}
      {%%
        gf["bindHTTPDefault"] = true
        gf["needHTTPFrontend"] = true
        if httpsByDefault || len(ingress.Spec.Tls) > 0 {
          gf["bindHTTPSDefault"] = true
          gf["needHTTPSFrontend"] = true
          gf["needHTTPSTermination"] = true
        }
      %%}
      {%- end %}

  features-100-ingress-tls:
    template: |
      {#- Registers TLS certificates from Ingress spec.tls with SSL infrastructure -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- for _, ingress := range resources.ingresses.List() %}
        {%%
          var tlsList = ingress.Spec.Tls
          if len(tlsList) == 0 {
            continue
          }
        %%}
        {%- for _, tls := range tlsList %}
          {%%
            var secretName = tls.SecretName
            if secretName == "" {
              continue
            }
            // Unique key for this secret (namespace + name)
            var namespace = ingress.Metadata.Namespace
            if !first_seen("ingress_tls", namespace, secretName) {
              continue
            }

            // Fetch Secret and extract cert+key
            var secret = resources.secrets.GetSingle(namespace, secretName)
            if secret == nil {
              continue
            }
            var tlsCrt, hasCrt = secret.Data["tls.crt"]
            var tlsKey, hasKey = secret.Data["tls.key"]
            if !hasCrt || !hasKey {
              continue
            }

            // Combine cert and key into single PEM (HAProxy format).
            // Pipe form discards the b64decode error return, matching the
            // pre-typing behaviour.
            var combinedPem = (tlsCrt | b64decode()) + "\n" + (tlsKey | b64decode())

            // Register certificate file dynamically using file_registry
            // The filename is sanitized by PathResolver (dots replaced with underscores, etc.)
            var certFilename = namespace + "_" + secretName + ".pem"
            var certPath, certRegErr = fileRegistry.Register("cert", certFilename, combinedPem)
            if certRegErr != nil {
              fail("failed to register certificate " + certFilename + ": " + tostring(certRegErr))
            }

            // Extract the sanitized filename from the returned path
            // This is needed because HAProxy client-native sanitizes filenames for storage
            var sanitizedFilename = basename(certPath)

            // Register with SSL infrastructure for crt-list generation
            // Use sanitized_filename to ensure crt-list matches the actual file on disk
            var tlsCert = map[string]any{
              "secret_namespace": namespace,
              "secret_name": secretName,
              {#- toSlice() normalises the typed []string from
                  Ingress.Spec.Tls[i].Hosts into []any so downstream
                  ssl.yaml consumers (which assert .([]any) on a
                  polymorphic tlsCertificates slice) don't trip on
                  the typed-slice shape. No `| fallback([]any{})` —
                  scriggoToSlice already returns []any{} for nil input. -#}
              "sni_patterns": tls.Hosts | toSlice(),
              "sanitized_filename": sanitizedFilename,
            }
            gf["tlsCertificates"] = append(gf["tlsCertificates"].([]any), tlsCert)
          %%}
        {%- end %}
      {%- end %}

  features-105-ingress-ssl-redirect:
    template: |
      {#-
        Global HTTP→HTTPS redirect for Ingress (opt-in).

        When extraContext.ingressDefaultSSLRedirect is true, every Ingress host
        that is served over HTTPS is registered into gf["sslRedirectHosts"], so
        the SSL library's features-160-ssl-redirect-map + frontend-filters-050
        emit the shared `http-request redirect scheme https` rule for it. This
        is the global counterpart to the per-host vendor `ssl-redirect`
        annotations, which keep working and are additive.

        A host is only redirected when it is actually reachable over HTTPS,
        decided per host: either the default-HTTPS bind is on
        (gf["ingressHTTPSByDefault"], set by features-100-ingress-bind from
        ingressDefaultHTTPS + the default cert), which serves every host, or the
        host carries its own certificate (it appears in a spec.tls[].hosts entry).
        A bare host on a partly-TLS Ingress is therefore not redirected, so the
        redirect never points a client at a port it isn't served on.

        extraContext knobs:
          - ingressDefaultSSLRedirect     (bool, default false) — turn it on.
          - ingressDefaultSSLRedirectCode (default "308") — HTTP status code;
            one of 301, 302, 303, 307, 308.

        The global toggle redirects all HTTPS-served Ingress hosts. For per-host
        control, leave it off and use the vendor `ssl-redirect` annotations.
      -#}
      {%- var redirectAll bool = extraContext | dig("ingressDefaultSSLRedirect") | fallback(false) %}
      {%- if redirectAll %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var code = extraContext | dig("ingressDefaultSSLRedirectCode") | fallback("308") | tostring() %}
        {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" %}
          {{- fail("Invalid extraContext.ingressDefaultSSLRedirectCode '" + code + "': must be one of 301, 302, 303, 307, 308.") -}}
        {%- end %}
        {%- var httpsByDefault bool = gf | dig("ingressHTTPSByDefault") | fallback(false) %}
        {%- for _, ingress := range resources.ingresses.List() %}
          {#- HTTPS availability is per-host: with the default-HTTPS bind on,
              every host is served; otherwise only the hosts that carry their
              own certificate (listed in a spec.tls[].hosts) are. Gate each host
              on that, so a bare host on a partly-TLS Ingress is never redirected
              to a port it isn't served on. -#}
          {%- var tlsHosts = map[string]bool{} %}
          {%- for _, tls := range ingress.Spec.Tls %}
            {%- for _, h := range tls.Hosts %}
              {%- tlsHosts[toLower(h)] = true %}
            {%- end %}
          {%- end %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {%- var host = toLower(rule.Host) %}
              {%- if httpsByDefault || tlsHosts[host] %}
                {%- var redirectHosts []any = gf["sslRedirectHosts"] %}
                {%- gf["sslRedirectHosts"] = append(redirectHosts, map[string]any{"host": host, "code": code}) %}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  # ============================================================================
  # Host Key Normalisation
  # ============================================================================
  #
  # The util-host-key snippet (macro MapKeyForHost) moved to base.yaml
  # ("Ingress Helpers" section) so gateway/ and the vendor annotation libraries
  # can import it without the ingress library being enabled. Importers are
  # unchanged: `{% import "util-host-key" for MapKeyForHost %}`.

  # ============================================================================
  # Backend Generation
  # ============================================================================

  util-backend-name-ingress:
    template: |
      {#- Generates backend name: <ns>_<ingress>_svc_<svc>_<port-name> (matches production format) -#}
      {% macro BackendNameIngress(ingress *resources.ingresses.T, path any) string %}{%%
        var namespace = ingress.Metadata.Namespace
        var name = ingress.Metadata.Name
        var serviceName = tostring(path | dig("backend", "service", "name") | fallback(""))
        var portName = tostring(path | dig("backend", "service", "port", "name") | fallback(""))
        var portNumber = path | dig("backend", "service", "port", "number") | fallback(0)

        // Resolve port number to port name via Service lookup when only number is specified
        if portName == "" && toint(portNumber) > 0 {
          var svc = resources.services.GetSingle(namespace, serviceName)
          if svc != nil {
            for _, sp := range svc.Spec.Ports {
              if toint(sp.Port) == toint(portNumber) {
                portName = sp.Name
                break
              }
            }
          }
        }

        // Fall back to port number if port name is not available
        var portIdentifier = portName
        if portIdentifier == "" {
          portIdentifier = tostring(portNumber)
        }

        show namespace + "_" + name + "_svc_" + serviceName + "_" + portIdentifier
      %%}{% end %}

  util-path-map-entry-ingress-shard:
    template: |
      {#- Generates map entries for a slice of Ingress resources -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}

      {% macro PathMapEntryIngressShard(ingresses []*resources.ingresses.T, pathTypes []string, suffix string) string %}
        {#- Oldest-wins route ownership. When two Ingresses claim the same
            host+path+slot, the older one (by creationTimestamp, tie-broken by
            namespace/name) owns the route and the newer one's entry is dropped,
            so the emitted map file has no duplicate keys and routing is
            deterministic — an Ingress that was there first keeps its route when
            a later one collides (matches ingress-nginx). Ingresses registered in
            gf["coLocatedIngresses"] (nginx canary Ingresses, which overlay a
            use_backend split onto their main's route instead of claiming a base
            route) are excluded, so the main owns the route alone. gf is
            populated during the haproxy.cfg render, which runs before this
            aux-file render (renderer/service.go), so the exclusion is in place.
            Recomputed per shard call (each shard needs the global owner view);
            the computation is cheap string/map work. -#}
        {%%
          var owner = map[string]string{}
          var ownerTs = map[string]string{}
          var ownerIsCanary = map[string]bool{}
          var gf = shared.Get("globalFeatures").(map[string]any)
          var coLocated = gf["coLocatedIngresses"]
          for _, ing := range resources.ingresses.List() {
            var oid = ing.Metadata.Namespace + "/" + ing.Metadata.Name
            var isCanary = false
            if coLocated != nil {
              var _, present = coLocated.(map[string]any)[oid]
              isCanary = present
            }
            var ts = ing.Metadata.CreationTimestamp
            for _, rule := range ing.Spec.Rules {
              for _, path := range rule.Http.Paths {
                if path.Path != "" {
                  var oslot = tostring(path.PathType)
                  if oslot == "ImplementationSpecific" {
                    oslot = "Prefix"
                  }
                  // Prefix "/foo" and "/foo/" render into the SAME map keys
                  // (the emit stage strips the trailing slash for the Prefix
                  // slot), so they must share an owner key. Exact is
                  // character-exact and keeps its trailing slash.
                  var opath = path.Path
                  if oslot != "Exact" && len(opath) > 1 && hasSuffix(opath, "/") {
                    opath = opath[:len(opath)-1]
                  }
                  var okey = oslot + "|" + MapKeyForHost(rule.Host) + opath
                  var curId, seen = owner[okey]
                  var take = false
                  if !seen {
                    take = true
                  } else if ownerIsCanary[okey] && !isCanary {
                    // A non-canary (main) Ingress always beats a canary
                    // incumbent: the canary only overlays a split, the main
                    // owns the base route.
                    take = true
                  } else if ownerIsCanary[okey] == isCanary {
                    // Same class (main vs main, or canary vs canary): oldest
                    // wins, tie-broken by namespace/name.
                    if ts < ownerTs[okey] || (ts == ownerTs[okey] && oid < curId) {
                      take = true
                    }
                  }
                  // A canary never displaces a non-canary owner: when both a
                  // main and a canary claim the route the main wins, but a
                  // canary with no main still owns (and serves) its own route.
                  if take {
                    owner[okey] = oid
                    ownerTs[okey] = ts
                    ownerIsCanary[okey] = isCanary
                  }
                }
              }
            }
          }
        %%}
        {%- for _, ingress := range ingresses -%}
          {%- var id = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- var matchCount = 0 -%}
          {#- Count only paths this Ingress OWNS for the given pathType(s); a
              path lost to an older Ingress on the same host+path is neither
              counted nor emitted below. -#}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- if path.Path != "" -%}
                {%- for _, checkType := range pathTypes -%}
                  {%- if path.PathType == checkType -%}
                    {%- var cslot = tostring(path.PathType) -%}
                    {%- if cslot == "ImplementationSpecific" -%}{%- cslot = "Prefix" -%}{%- end -%}
                    {%- var cpath = path.Path -%}
                    {%- if cslot != "Exact" && len(cpath) > 1 && hasSuffix(cpath, "/") -%}{%- cpath = cpath[:len(cpath)-1] -%}{%- end -%}
                    {%- var cwinner = owner[cslot + "|" + MapKeyForHost(rule.Host) + cpath] -%}
                    {%- if cwinner == id -%}
                      {%- matchCount = matchCount + 1 -%}
                    {%- else -%}
                      {#- This Ingress lost this route to an older Ingress
                          (oldest-wins). Emit a RouteConflict Warning on the
                          loser so operators see it via `kubectl describe
                          ingress` / events — unless the loser is a co-located
                          Ingress (nginx canary) that intentionally shares its
                          main's route (losing is by design). recordEvent uses
                          the same context access as statusPatch, so it is safe
                          in the sharded `go` render; the EventCollector dedups
                          the repeat from the pfxexact + prefix map passes. This
                          runs in the count loop (before the matchCount gate) so
                          it fires even for an Ingress that owns none of its
                          routes. -#}
                      {%%
                        var loserCoLocated = false
                        if coLocated != nil {
                          var _, lc = coLocated.(map[string]any)[id]
                          loserCoLocated = lc
                        }
                        if !loserCoLocated {
                          recordEvent(ingress, "RouteConflict",
                            "host \""+rule.Host+"\" path \""+path.Path+"\" ("+
                              tostring(path.PathType)+") is already served by Ingress "+
                              cwinner+", which takes precedence; this Ingress's route is not applied")
                        }
                      %%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {%- if matchCount > 0 -%}
      {{ "\n" }}# Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ matchCount }} paths)
            {%- for _, rule := range ingress.Spec.Rules -%}
              {%- for _, path := range rule.Http.Paths -%}
                {%- if path.Path != "" -%}
                  {%- for _, checkType := range pathTypes -%}
                    {%- if path.PathType == checkType -%}
                      {%- var eslot = tostring(path.PathType) -%}
                      {%- if eslot == "ImplementationSpecific" -%}{%- eslot = "Prefix" -%}{%- end -%}
                      {%- var epath = path.Path -%}
                      {%- if eslot != "Exact" && len(epath) > 1 && hasSuffix(epath, "/") -%}{%- epath = epath[:len(epath)-1] -%}{%- end -%}
                      {%- if owner[eslot + "|" + MapKeyForHost(rule.Host) + epath] != id -%}{%- continue -%}{%- end -%}
                      {%- var pathStr = path.Path -%}
                      {%- if suffix == "" && pathStr == "/" -%}{%- continue -%}{%- end -%}
                      {%- var actualSuffix = suffix -%}
                      {%- if suffix == "/" && hasSuffix(pathStr, "/") -%}{%- actualSuffix = "" -%}{%- end -%}
                      {#- For pfxexact (Prefix-boundary check, suffix=""), strip the
                         trailing slash so /foo/ Prefix's boundary entry is /foo
                         and request /foo hits it. For Exact (also suffix=""),
                         DO NOT strip — K8s spec says Exact is character-wise
                         exact, so /foo/ must NOT match request /foo (upstream
                         conformance scenario: "An Ingress with a trailing
                         slashes in an exact path rule should not match
                         requests without a trailing slash"). -#}
                      {%- if path.PathType != "Exact" && suffix == "" && len(pathStr) > 1 && hasSuffix(pathStr, "/") -%}{%- pathStr = pathStr[:len(pathStr)-1] -%}{%- end -%}
      {{ "\n" }}{{ MapKeyForHost(rule.Host) }}{{ pathStr }}{{ actualSuffix }} BACKEND:{{ BackendNameIngress(ingress, path) }}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}

  # ============================================================================
  # Map File Generation (Sharded)
  # ============================================================================

  util-sharded-path-map-entry-ingress:
    template: |
      {#- Wraps PathMapEntryIngressShard with parallel sharding logic -#}
      {%- import "util-path-map-entry-ingress-shard" for PathMapEntryIngressShard -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedPathMapEntryIngress(pathTypes []string, suffix string) string %}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- var n = toint(CalculateShardCount(len(allIngresses), 100)) -%}
      {%- if n <= 1 || len(allIngresses) < 100 -%}
      {{ PathMapEntryIngressShard(allIngresses, pathTypes, suffix) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go PathMapEntryIngressShard(shard_slice(allIngresses, i, n), pathTypes, suffix) }}
      {%- end -%}
      {%- end -%}
      {% end %}

  # ============================================================================
  # Backend Generation
  # ============================================================================

  util-generate-backends-ingress:
    template: |
      {#- Generates backend sections for a list of Ingresses -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-backend-servers" for BackendServers -%}
      {%- import "util-backend-servers-helpers" for BuildServerOptions -%}
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {% macro GenerateIngressBackends(ingresses []*resources.ingresses.T) string %}
        {%- for _, ingress := range ingresses -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var svcName = path.Backend.Service.Name -%}
              {%- if svcName != "" -%}
                {%- var resolvedParts = split(ResolveServicePort(ns, svcName, path.Backend.Service.Port), " ") -%}
                {%- var port = toint(resolvedParts[0]) -%}
                {%- var portName = resolvedParts[1] -%}
                {%- var portId = portName -%}
                {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
                {%- if first_seen("ingress_backend", ns, name, svcName, portId) -%}
      # Backend for: Ingress {{ ns }}/{{ name }} → Service {{ svcName }}:{{ port }}
                  {%- var backendKey = BackendNameIngress(ingress, path) %}
      backend {{ backendKey }}
          guid {{ make_guid("be", backendKey) }}
                  {%- var serverOpts = map[string]any{"flags": []any{}} -%}
                  {{- render_glob "backend-directives-*" inherit_context | indent(2, true) }}
        default-server {{ serverOpts | dig("checkDirective") | fallback("check") | tostring() }}{{ BuildServerOptions(serverOpts) }}
        {{ BackendServers(svcName, 0, port, serverOpts, portName, backendKey, ns) | indent(2, true) }}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {#- spec.defaultBackend — per K8s spec, handles requests that don't
             match any rule path. Emits its own backend pool through the same
             first_seen dedup so a default backend pointing at the same
             service+port as a rule backend doesn't produce a duplicate
             `backend` stanza. The synthesized path lets BackendNameIngress
             produce a stable, ingress-scoped backend name. -#}
          {%- var dbSvcName = ingress.Spec.DefaultBackend.Service.Name -%}
          {%- if dbSvcName != "" -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} -%}
            {%- var resolvedParts = split(ResolveServicePort(ns, dbSvcName, ingress.Spec.DefaultBackend.Service.Port), " ") -%}
            {%- var port = toint(resolvedParts[0]) -%}
            {%- var portName = resolvedParts[1] -%}
            {%- var portId = portName -%}
            {%- if portId == "" -%}{%- portId = tostring(port) -%}{%- end -%}
            {%- if first_seen("ingress_backend", ns, name, dbSvcName, portId) -%}
      # Default backend for: Ingress {{ ns }}/{{ name }} → Service {{ dbSvcName }}:{{ port }}
              {%- var backendKey = BackendNameIngress(ingress, path) %}
      backend {{ backendKey }}
          guid {{ make_guid("be", backendKey) }}
              {%- var serverOpts = map[string]any{"flags": []any{}} -%}
              {{- render_glob "backend-directives-*" inherit_context | indent(2, true) }}
        default-server {{ serverOpts | dig("checkDirective") | fallback("check") | tostring() }}{{ BuildServerOptions(serverOpts) }}
        {{ BackendServers(dbSvcName, 0, port, serverOpts, portName, backendKey, ns) | indent(2, true) }}
            {%- end -%}
          {%- end -%}
        {%- end %}
      {% end %}

  util-sharded-backends-ingress:
    template: |
      {#- Sharded backend generator for Ingress resources -#}
      {%- import "util-generate-backends-ingress" for GenerateIngressBackends -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressBackends(ingresses []*resources.ingresses.T) string %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressBackends(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressBackends(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  backends-500-ingress:
    template: |
      {#- Generates HAProxy backend sections for all Ingress resources -#}
      {%- import "util-sharded-backends-ingress" for ShardedIngressBackends -%}
      {%- var allIngresses = resources.ingresses.List() -%}
      {%- if len(allIngresses) > 0 %}
      # ingress/backends-ingress
      {{ ShardedIngressBackends(allIngresses) }}
      {%- end -%}
  util-generate-host-map-ingress:
    template: |
      {#- Macro to generate host map entries for Ingress resources -#}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- macro GenerateIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- for _, ingress := range ingresses -%}
      {%- var rules = ingress.Spec.Rules %}
      {%- var rulesWithHttp = selectattr(rules, "http") %}
      {%- if len(rulesWithHttp) > 0 %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ len(rulesWithHttp) }} hosts)
      {% for _, rule := range rulesWithHttp %}
      {%- var hostKey = MapKeyForHost(rule | dig("host")) %}
      {{ hostKey }} {{ hostKey }}
      {% end %}
      {%- end %}
      {%- end %}
      {%- end macro -%}

  util-sharded-host-map-ingress:
    template: |
      {#- Sharded host map generator for Ingress resources -#}
      {%- import "util-generate-host-map-ingress" for GenerateIngressHostMap -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {%- macro ShardedIngressHostMap(ingresses []*resources.ingresses.T) -%}
      {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
      {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressHostMap(ingresses) }}
      {%- else -%}
      {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressHostMap(shard_slice(ingresses, i, n)) }}
      {%- end -%}
      {%- end -%}
      {%- end macro -%}

  map-host-500-ingress:
    template: |
      {#- Generate host map entries for Ingress resources (wildcards converted to suffix form) -#}
      {%- import "util-sharded-host-map-ingress" for ShardedIngressHostMap %}
      {%- var allIngresses = resources.ingresses.List() %}
      {%- if len(allIngresses) > 0 %}
      # ingress/map-host-ingress
      {{ ShardedIngressHostMap(allIngresses) }}
      {%- end -%}

  map-path-exact-500-ingress:
    template: |
      {#-
        Ingress Exact Path Map Entries

        Purpose: Generates path-exact.map entries for Ingress exact path matching.

        Extension Point: map-path-exact-* (priority 500)

        Matches: Ingress paths with pathType: Exact
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-exact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Exact"}, "") }}

  map-pfxexact-500-ingress:
    template: |
      {#-
        Ingress Prefix-Exact Path Map Entries

        Purpose: Generates path-prefix-exact.map entries for exact prefix boundary matching.

        Extension Point: map-pfxexact-* (priority 500)

        Matches: Ingress paths with pathType: Prefix or ImplementationSpecific
        Note: No trailing slash - matches exact path for prefix boundary check.
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-pfxexact-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "") }}

  map-path-prefix-500-ingress:
    template: |
      {#-
        Ingress Prefix Path Map Entries

        Purpose: Generates path-prefix.map entries for prefix path matching.

        Extension Point: map-path-prefix-* (priority 500)

        Matches: Ingress paths with pathType: Prefix or ImplementationSpecific
        Note: Adds trailing slash for HAProxy map_beg matching.
      -#}
      {%- import "util-sharded-path-map-entry-ingress" for ShardedPathMapEntryIngress -%}
      # ingress/map-path-prefix-ingress
      {{ ShardedPathMapEntryIngress([]string{"Prefix", "ImplementationSpecific"}, "/") }}

  map-path-prefix-501-ingress-default:
    template: |
      {#- spec.defaultBackend catch-all entries per K8s Ingress spec
         ("defaultBackend handles requests that don't match any rule").
         The map_beg longest-prefix-match in path-prefix.map naturally
         picks the most-specific rule entry first, falling through to
         these catch-alls when no rule path matched.

         The hostKey for each entry determines what the catch-all
         applies to:
           - "" (rules-less Ingress, OR rule with no host):
                emits "/" — catches every host that didn't match a
                more-specific entry (the K8s "all traffic to default"
                semantics for rules-less; for hostless rules it matches
                the same all-hosts intent).
           - "<host>" (rule with a host):
                emits "<host>/" — catches requests to that host that
                didn't match any of the Ingress's rule paths.
         (Wildcard hosts already had their `*` stripped by
         MapKeyForHost, so `*.foo.com` becomes `.foo.com` which is the
         same form host.map uses.)

         Dedup per host: HAProxy maps keep only one entry per duplicate
         key, so two Ingresses both claiming the same host's catch-all
         would conflict. We sort all candidate (hostKey, ingress) pairs
         by creationTimestamp desc, then use first_seen per hostKey to
         pick the newest Ingress per host. The "newest wins" semantic
         (a) matches what operators expect when they roll out a new
         default and (b) avoids a stale-Ingress race during scenario
         churn — a first-by-list-order pick would land on a being-
         deleted backend whose pods are already gone, producing 503s
         on the new scenario's traffic (originally confirmed in
         GitLab MR !955 pipeline 2529981548 for the rules-less case;
         the same logic applies per host now). -#}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- var candidates = []any{} -%}
      {%- for _, ingress := range resources.ingresses.List() -%}
        {#- dig() handles "defaultBackend absent" (returns nil) vs
            "present but with no service" (returns the struct, then
            inner dig() returns nil on absent service). Typed access
            alone can't observe these cases. -#}
        {%- if dig(ingress, "spec", "defaultBackend") != nil && dig(ingress, "spec", "defaultBackend", "service") != nil -%}
          {%- var ts = ingress.Metadata.CreationTimestamp -%}
          {%- var rules = ingress.Spec.Rules -%}
          {%- if len(rules) == 0 -%}
            {%- candidates = append(candidates, map[string]any{"hostKey": "", "ingress": ingress, "ts": ts}) -%}
          {%- else -%}
            {%- for _, rule := range rules -%}
              {%- var hostKey = MapKeyForHost(rule.Host) -%}
              {%- candidates = append(candidates, map[string]any{"hostKey": hostKey, "ingress": ingress, "ts": ts}) -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}
      {%- if len(candidates) > 0 -%}
        {%- var sorted = candidates | sort_by([]string{"$.ts:desc"}) -%}
        {%- for _, cand := range sorted -%}
          {%- var hostKey = tostring(cand["hostKey"]) -%}
          {%- if first_seen("ingress_default_host", hostKey) -%}
            {#- Explicit type assertion: cand is map[string]any so
                cand["ingress"] is statically `any`; without the
                `.(*resources.ingresses.T)` cast, BackendNameIngress's
                typed parameter would force Scriggo into an implicit
                `any → *T` conversion at the call site that empirically
                broke TestIngressAuthHeadersFail on MR !1010 (bisect-
                confirmed). The explicit assertion takes the standard
                Scriggo emit path instead. -#}
            {%- var ingress = cand["ingress"].(*resources.ingresses.T) -%}
            {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} (defaultBackend → "{{ hostKey }}/")
      {{ hostKey }}/ BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end -%}
        {%- end -%}
      {%- end %}

  # ============================================================================
  # Status Patch Registration
  # ============================================================================

  util-generate-ingress-status-patches:
    template: |
      {#-
        Generate Ingress Status Patches

        For each Ingress, registers a status patch with:
          - deployed: LoadBalancer addresses from address discovery
          - deployFailed: Empty LoadBalancer addresses

        Parameters:
          ingresses: Slice of Ingress resources to process

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex)
      -#}
      {% macro GenerateIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var addresses = gf["addresses"] %}
        {%- for _, ingress := range ingresses %}
          {%%
            var namespace = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name

            statusPatch(namespace, name,
              "networking.k8s.io/v1", "Ingress",
              map[string]interface{}{
                "deployed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": addresses,
                  },
                },
                "deployFailed": map[string]interface{}{
                  "loadBalancer": map[string]interface{}{
                    "ingress": []any{},
                  },
                },
              })
          %%}
        {%- end %}
      {% end %}

  util-sharded-ingress-status-patches:
    template: |
      {#-
        Sharded Ingress Status Patches

        Wraps GenerateIngressStatusPatches with automatic parallel sharding.
        Uses the same pattern as ShardedIngressBackends.
      -#}
      {%- import "util-generate-ingress-status-patches" for GenerateIngressStatusPatches -%}
      {%- import "util-macros" for CalculateShardCount -%}
      {% macro ShardedIngressStatusPatches(ingresses []*resources.ingresses.T) %}
        {%- var n = toint(CalculateShardCount(len(ingresses), 100)) -%}
        {%- if n <= 1 || len(ingresses) < 100 -%}
      {{ GenerateIngressStatusPatches(ingresses) }}
        {%- else -%}
          {%- for i := 0; i < n; i++ -%}
      {{ go GenerateIngressStatusPatches(shard_slice(ingresses, i, n)) }}
          {%- end -%}
        {%- end -%}
      {% end %}

  status-patches-200-ingress:
    template: |
      {#-
        Ingress Status Patch Registration

        Extension Point: status-patches-* (priority 200)

        Registers status patches for all Ingress resources with LoadBalancer
        addresses from address discovery. Skips if no addresses are available.

        Dependencies:
          - features-075-address-discovery (provides gf["addresses"])
      -#}
      {%- import "util-sharded-ingress-status-patches" for ShardedIngressStatusPatches -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- if gf["addresses"] != nil %}
        {%- var allIngresses = resources.ingresses.List() -%}
        {%- if len(allIngresses) > 0 -%}
          {{- ShardedIngressStatusPatches(allIngresses) -}}
        {%- end -%}
      {%- end %}

k8sResources:
  # Warning Events for Ingresses whose by-name backend reference rendered
  # placeholder-only slots because the Service is absent (issue #66).
  #
  # networking.k8s.io/v1 Ingress status has no conditions field (only
  # loadBalancer), so — unlike Gateway API routes, which get
  # ResolvedRefs=False/BackendNotFound on their parent status — there is no
  # status surface to carry "your backend Service doesn't exist". Without a
  # signal, a permanent Service-name typo is indistinguishable from a
  # propagation race and serves 503 silently forever (the degraded render is
  # deliberate, see util-service-port-resolution). A core/v1 Event on the
  # Ingress is the operator-visible surface: it shows up in
  # `kubectl describe ingress` and `kubectl get events`.
  #
  # Mechanics:
  #   - BackendServers (base.yaml, step 5b) records every by-name reference
  #     that ended up placeholder-only under a shared
  #     "degradedBackendRef:<ns>/<service>/<portName>" key during the
  #     haproxy.cfg render. k8sResources templates render strictly after the
  #     config render, so the keys are complete when this template runs.
  #   - This template walks the watched Ingresses, probes each by-name
  #     backend reference against those keys, and emits one Event per
  #     affected Ingress (one message listing all of its degraded refs).
  #   - The Event's name is deterministic, so the resource applier SSAs the
  #     same object every cycle and orphan-prunes it as soon as the Service
  #     appears (brief propagation races thus produce a short-lived Event
  #     that cleans itself up — no flapping conditions).
  #   - The apiserver expires Events after --event-ttl (default 1h).
  #     lastTimestamp is therefore bucketed to 20-minute steps: while the
  #     degradation persists, any reconcile in a new bucket changes the
  #     payload, which re-applies the Event and refreshes its TTL — without
  #     churning the applier on every render. metadata.creationTimestamp
  #     carries the first-observed time for free.
  ingress-degraded-backend-events:
    template: |
      {%%
        var docs = []any{}
        for _, ingress := range resources.ingresses.List() {
          var ns = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          if ns == "" || name == "" {
            continue
          }

          // Collect this Ingress's by-name service-port references that the
          // config render recorded as degraded. Spec walk mirrors
          // GenerateIngressBackends: every rule path plus defaultBackend.
          var degraded = []any{}
          var seen = map[string]bool{}
          var refs = []any{}
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              refs = append(refs, map[string]any{
                "service":  path.Backend.Service.Name,
                "portName": path.Backend.Service.Port.Name,
              })
            }
          }
          refs = append(refs, map[string]any{
            "service":  ingress.Spec.DefaultBackend.Service.Name,
            "portName": ingress.Spec.DefaultBackend.Service.Port.Name,
          })
          for _, rawRef := range refs {
            var ref = rawRef.(map[string]any)
            var svcName = tostring(ref["service"])
            var pn = tostring(ref["portName"])
            if svcName == "" || pn == "" {
              continue
            }
            var key = ns + "/" + svcName + "/" + pn
            if seen[key] {
              continue
            }
            seen[key] = true
            if shared.Get("degradedBackendRef:" + key) != nil {
              degraded = append(degraded, "Service '" + ns + "/" + svcName +
                "' (port name '" + pn + "')")
            }
          }
          if len(degraded) == 0 {
            continue
          }

          // Deterministic per-Ingress Event name, bounded to the 253-char
          // limit (Ingress names may themselves be up to 253 chars).
          var evName = name + ".backend-unresolved"
          if len(evName) > 253 {
            // Hash-only overflow name: a byte-truncated prefix can end on a
            // '.' separator, making the next label start with '-' (invalid
            // DNS-1123) and failing every SSA of the Event thereafter.
            evName = "backend-unresolved-" + sha256(name)[:32]
          }

          // 20-minute lastTimestamp bucket: stable within a bucket (no
          // apply churn), changes across buckets (refreshes the apiserver's
          // event TTL while the degradation persists).
          var bucket = now().UTC().Unix() / 1200 * 1200
          var lastSeen = unixTime(bucket, 0).UTC().Format("2006-01-02T15:04:05Z07:00")

          var resource = map[string]any{
            "apiVersion": "v1",
            "kind":       "Event",
            "metadata": map[string]any{
              "name":      evName,
              "namespace": ns,
            },
            "involvedObject": map[string]any{
              "apiVersion": "networking.k8s.io/v1",
              "kind":       "Ingress",
              "namespace":  ns,
              "name":       name,
              "uid":        ingress.Metadata.Uid,
            },
            "type":   "Warning",
            "reason": "BackendUnresolved",
            "message": "Backend " + join(toStringSlice(degraded), ", ") +
              " not found: a by-name port reference resolves only through the" +
              " Service, so the backend has no endpoints and serves 503 until" +
              " the Service appears. If it never appears, check the Ingress" +
              " backend for a Service-name typo.",
            "lastTimestamp": lastSeen,
            "source": map[string]any{
              "component": "haptic",
            },
          }
          var rendered, _ = marshalYAML(resource)
          docs = append(docs, rendered)
        }
      %%}
      {%- for i, doc := range docs -%}
      {%- if i > 0 %}{{ "---" }}
      {% end %}
      {{ doc }}
      {%- end %}

validationTests:
  test-ingress-duplicate-backend-different-ports:
    description: Ingress with multiple paths to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: api-svc
            namespace: default
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 8080
              - name: admin
                port: 81
                targetPort: 8081
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: multi-port
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 80
                    - path: /admin
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 81
                    - path: /app
                      pathType: Prefix
                      backend:
                        service:
                          name: api-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_http"

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_admin"

      - type: match_count
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_"
        expected: "2"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/api/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/admin/ BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/app/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/api BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/admin BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/app BACKEND:default_multi-port_svc_api-svc_http"

      # Map Formatting Tests - Ensure proper line separation
      - type: not_contains
        target: map:host.map
        pattern: "hosts\\)\\S"

      - type: not_contains
        target: map:path-prefix.map
        pattern: "paths\\)\\S"

      - type: not_contains
        target: map:path-prefix-exact.map
        pattern: "paths\\)\\S"

      - type: contains
        target: map:host.map
        pattern: "(?m)^example\\.com example\\.com$"

      - type: contains
        target: map:path-prefix.map
        pattern: "(?m)^example\\.com/api/ BACKEND:"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "(?m)^example\\.com/api BACKEND:"

  test-ingress-tls-basic:
    description: Ingress with spec.tls should register TLS certificates
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: example-tls
            namespace: default
          data:
            # Test certificate (base64-encoded)
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tls-ingress
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - example.com
                  - www.example.com
                secretName: example-tls
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "default_example-tls\\.pem \\[ocsp-update on\\] example\\.com www\\.example\\.com"

      - type: contains
        target: cert:default_example-tls.pem
        pattern: "BEGIN CERTIFICATE"

  test-ingress-default-https:
    description: "A plain Ingress with no spec.tls is served over HTTPS by default — the chart binds its https port and terminates TLS with the default certificate (extraContext.ingressDefaultHTTPS defaults true). See features-100-ingress-bind."
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: plain
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^frontend https$"
      - type: contains
        target: haproxy.cfg
        pattern: "bind \\*:443 ssl crt-list"

  test-ingress-default-https-disabled:
    description: "extraContext.ingressDefaultHTTPS=false keeps a plain Ingress (no spec.tls) plaintext-only — no https frontend is emitted even though the default certificate is configured. See features-100-ingress-bind."
    extraContext:
      ingressDefaultHTTPS: false
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: plain
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "(?m)^frontend https$"

  test-ingress-default-ssl-redirect:
    description: "extraContext.ingressDefaultSSLRedirect=true redirects every HTTPS-served Ingress host from HTTP to HTTPS with the configured code (default 308), reusing the shared ssl-redirect map. See features-105-ingress-ssl-redirect."
    extraContext:
      ingressDefaultSSLRedirect: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: plain
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect scheme https code 308 if !\\{ ssl_fc \\}"
      - type: contains
        target: map:ssl-redirect-308.map
        pattern: "(?m)^plain\\.example\\.com 1$"

  test-ingress-default-ssl-redirect-disabled:
    description: "By default (ingressDefaultSSLRedirect unset) an HTTPS-served Ingress emits no global HTTP→HTTPS redirect — the feature is opt-in. See features-105-ingress-ssl-redirect."
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: plain
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "redirect scheme https"

  test-ingress-default-ssl-redirect-per-host:
    description: "With the default-HTTPS bind off (ingressDefaultHTTPS=false), the global redirect only registers hosts that carry their own certificate: a partly-TLS Ingress redirects its spec.tls host but not its bare host, which isn't served over HTTPS. See features-105-ingress-ssl-redirect."
    extraContext:
      ingressDefaultHTTPS: false
      ingressDefaultSSLRedirect: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: partial-tls
            namespace: default
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - secure.example.com
                secretName: shared-tls
            rules:
              - host: secure.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: echo
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:ssl-redirect-308.map
        pattern: "(?m)^secure\\.example\\.com 1$"
      - type: not_contains
        target: map:ssl-redirect-308.map
        pattern: "plain\\.example\\.com"

  test-ingress-slot-preservation:
    description: |
      Existing pods keep their slot across renders; new pods land in
      slot N+1 after highestUsedSlot (no reuse of freshly-vacated slots).
      Existing pod parked at SRV_3 so the assertion is sensitive to actual
      preservation vs. lowest-free-slot luck.
    currentConfig: |
      # SRV_3: existing pod (10.0.0.1) — preserved across rollout.
      # SRV_4: old pod (10.0.0.2) being replaced → placeholder; new pod → SRV_5.
      backend default_slot-test_svc_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.1:8080 check
          server SRV_4 10.0.0.2:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        # After rolling deployment: pod 10.0.0.2 removed, pod 10.0.0.3 added
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef:
                kind: Pod
                name: slot-pod-1
            - addresses: ["10.0.0.3"]
              targetRef:
                kind: Pod
                name: slot-pod-3
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: slot-test
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: slot-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: slot-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "backend default_slot-test_svc_slot-svc_80"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.1:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.3:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.3:8080"

  test-ingress-slot-preservation-lower-ip:
    description: |
      Slot assignment must be insensitive to IP sort order — existing pod
      keeps its parked slot even when the new pod's IP sorts lower.
      Existing pod at SRV_3 forces the assertion to be sensitive to
      actual preservation vs. iteration-order luck.
    currentConfig: |
      # SRV_3=10.0.0.5 stays; SRV_4=10.0.0.6 vacated → placeholder; 10.0.0.2 → SRV_5.
      backend default_slot-lower_svc_slot-svc_80
          server SRV_1 192.0.2.1:1 disabled
          server SRV_2 192.0.2.1:1 disabled
          server SRV_3 10.0.0.5:8080 check
          server SRV_4 10.0.0.6:8080 check
          server SRV_5 192.0.2.1:1 disabled
          server SRV_6 192.0.2.1:1 disabled
          server SRV_7 192.0.2.1:1 disabled
          server SRV_8 192.0.2.1:1 disabled
          server SRV_9 192.0.2.1:1 disabled
          server SRV_10 192.0.2.1:1 disabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: slot-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: slot-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: slot-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.5"]
              targetRef:
                kind: Pod
                name: slot-pod-5
            - addresses: ["10.0.0.2"]
              targetRef:
                kind: Pod
                name: slot-pod-2
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: slot-lower
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: slot-lower.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: slot-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_3 10\\.0\\.0\\.5:8080"
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_[12] 10\\.0\\.0\\.2:8080"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_4 192\\.0\\.2\\.1:1 .*disabled"
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_5 10\\.0\\.0\\.2:8080"

  test-ingress-endpoint-conditions-filter:
    description: |
      EndpointSlice entries with conditions.ready=false (pod starting up,
      not yet listening) or conditions.terminating=true (pod being shut
      down by kubelet) MUST be excluded from the rendered backend.
      Otherwise HAProxy dispatches requests to a not-yet-listening
      container (→ 503 SC-- during pod startup) or to a terminating
      container that has already stopped accepting connections
      (→ 503 SC-- during rolling restart drain window). Reproduces the
      single-replica rolling-restart 503 pattern observed in production.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: cond-svc
            namespace: default
          spec:
            ports:
              - port: 80
                targetPort: 8080
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cond-svc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: cond-svc
          addressType: IPv4
          endpoints:
            # Healthy steady-state pod — must appear.
            - addresses: ["10.0.0.1"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-ready}
            # New pod with sandbox up but container not yet listening
            # (kubelet has added it to the slice as not-ready). MUST NOT
            # appear — including it puts a dead IP in the backend until
            # the readiness probe finally flips Ready=true.
            - addresses: ["10.0.0.2"]
              conditions: {ready: false, serving: false, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-starting}
            # Old pod after SIGTERM: kubelet keeps the entry in the slice
            # for the grace window but flags it terminating. MUST NOT
            # appear — most apps stop accepting new connections on
            # SIGTERM, so HAProxy dispatching to this pod produces
            # connection-refused 503s.
            - addresses: ["10.0.0.3"]
              conditions: {ready: false, serving: false, terminating: true}
              targetRef: {kind: Pod, name: cond-pod-terminating}
            # Endpoint with no conditions block at all — per the
            # EndpointSlice spec, nil Ready is treated as Ready=true (the
            # producer didn't fill it in). MUST appear.
            - addresses: ["10.0.0.4"]
              targetRef: {kind: Pod, name: cond-pod-noconds}
          ports:
            - port: 8080
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: cond-test
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: cond-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: cond-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10\\.0\\.0\\.1:8080 .*enabled"

      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_2 10\\.0\\.0\\.4:8080 .*enabled"

      - type: not_contains
        target: haproxy.cfg
        pattern: "10\\.0\\.0\\.2:8080"

      - type: not_contains
        target: haproxy.cfg
        pattern: "10\\.0\\.0\\.3:8080"

