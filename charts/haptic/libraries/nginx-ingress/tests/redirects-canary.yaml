# nginx-ingress library — redirect + canary validation tests.
# permanent/temporal redirect, multi-sibling redirect, upstream-hash, canary
# by header and by weight.
validationTests:
  test-nginx-ingress-permanent-redirect:
    description: Nginx Ingress permanent-redirect generates 301 redirect
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: permredir-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: permredir-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: permredir-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: permredir-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://new.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: permredir.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: permredir-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "redirect location https://new.example.com code 301"

