  test-nginx-ingress-permanent-redirect-code:
    description: permanent-redirect-code overrides the default 301 redirect status
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: permcode-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: permcode-ingress
            annotations:
              nginx.ingress.kubernetes.io/permanent-redirect: "https://new.example.com"
              nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
          spec:
            ingressClassName: haproxy
            rules:
              - host: permcode.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: permcode-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "redirect location https://new.example.com code 308"
      - type: not_contains
        target: haproxy.cfg
        pattern: "redirect location https://new.example.com code 301"

