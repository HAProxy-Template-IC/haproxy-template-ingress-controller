          metadata:
            name: main-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: main-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: canary-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: canary-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: main-ingress
          spec:
            ingressClassName: haproxy
            rules:
              - host: canary.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: main-service
                          port:
                            number: 80
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: canary-ingress
            annotations:
              nginx.ingress.kubernetes.io/canary: "true"
              nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
          spec:
            ingressClassName: haproxy
            rules:
              - host: canary.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: canary-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend"
      - type: contains
        target: haproxy.cfg
        pattern: "req\\.hdr\\(X-Canary\\)"

