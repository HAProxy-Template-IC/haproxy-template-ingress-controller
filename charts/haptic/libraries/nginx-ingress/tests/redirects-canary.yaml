            namespace: default
            name: main-service
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: canary-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
