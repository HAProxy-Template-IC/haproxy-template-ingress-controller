  test-nginx-ingress-from-to-www-redirect-apex:
    description: from-to-www-redirect on an apex host redirects to the www. form (301)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: apexwww-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: apexwww-ingress
            annotations:
              nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: apexwww-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect prefix https://www.example.com code 301 if \\{ var\\(txn.host\\) -m str example.com \\} \\{ ssl_fc \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect prefix http://www.example.com code 301 if \\{ var\\(txn.host\\) -m str example.com \\} !\\{ ssl_fc \\}"

