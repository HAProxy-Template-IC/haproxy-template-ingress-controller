  test-nginx-ingress-ssl-passthrough:
    description: Nginx Ingress ssl-passthrough creates TCP backend and SNI routing
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: passthrough-service
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: passthrough-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: passthrough-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: passthrough.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: passthrough-service
                          port:
                            number: 443
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend ssl-passthrough-ni-default-passthrough-ingress"
        description: Must generate SSL passthrough backend with ni prefix
      - type: contains
        target: haproxy.cfg
        pattern: "mode tcp"
        description: Backend must be in TCP mode
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend ssl-passthrough-ni-default-passthrough-ingress if { req_ssl_sni -m str passthrough.example.com }"
        description: TCP frontend must route by SNI

  test-nginx-ingress-ssl-passthrough-skips-ingress-without-paths:
    description: "Regression test for the dry-run race that flaked TestIngressAnnotations/nginx-ssl-passthrough on !893. Pre-fix shape: BuildAnnotationSSLPassthrough added an entry to gf[\"sslPassthroughBackends\"] for any (host, ingress) pair where the annotation was truthy. The use_backend in ssl-tcp was emitted from that list. The corresponding `backend X` block came from a separate `resources.ingresses.GetSingle` lookup that walked spec.rules to find a service. If the ingress had a host but no spec.rules[*].http.paths (or those paths had no backend.service), the use_backend was emitted without a matching backend block — `haproxy -c` rejected the config and the webhook denied the unrelated dry-run as collateral damage. Post-fix: the macro itself extracts svcName/svcPort up front and refuses to add an entry without them. This fixture's ingress has the annotation + a host but no http.paths, so neither use_backend nor backend should appear in the rendered config."
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress-no-paths
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: noservice.example.com
                # Note: no `http:` block, so no paths.
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid (no use_backend without backend block)
      - type: not_contains
        target: haproxy.cfg
        pattern: "ssl-passthrough-ni-default-passthrough-ingress-no-paths"
        description: "Neither use_backend nor backend block must mention the path-less ingress. If a use_backend slipped through without a matching backend block, haproxy_valid would also fail with 'unable to find required use_backend' — but assert on the string explicitly so a test failure points at the right cause."
  test-nginx-ingress-ssl-passthrough-named-port:
    description: nginx-ingress SSL passthrough annotation must resolve a backend referenced by port.name to the correct numeric pod port (regression guard for the silent fallback-to-not-rendered bug in BuildAnnotationSSLPassthrough)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: secure-app
            namespace: default
          spec:
            ports:
              - name: https
                port: 8443
                targetPort: https
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secure-app-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: secure-app
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.50"]
              targetRef:
                kind: Pod
                name: secure-app-0
          ports:
            - name: https
              port: 8443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: secure-app
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: secure-app.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: secure-app
                          port:
                            name: https
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.50:8443 "
        description: nginx-ingress SSL passthrough must use the resolved port for named-port references
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.50:80 "
        description: Must not regress to port-80 fallback for nginx-ingress SSL passthrough
