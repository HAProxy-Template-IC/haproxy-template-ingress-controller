  test-nginx-ingress-rate-limit-rps-and-rpm:
    description: limit-rps takes precedence over limit-rpm (HAProxy stores http_req_rate once per table)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: rpsrpm-service
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rpsrpm-ingress
            annotations:
              nginx.ingress.kubernetes.io/limit-rps: "10"
              nginx.ingress.kubernetes.io/limit-rpm: "300"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rpsrpm.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: rpsrpm-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type ip size 100k expire 1s store http_req_rate\\(1s\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "deny deny_status 429 if \\{ sc_http_req_rate\\(0\\) gt 10 \\}"
      - type: not_contains
        target: haproxy.cfg
        pattern: "gt 300"
      - type: contains
        target: haproxy.cfg
        pattern: "limit-rpm ignored"

  test-nginx-ingress-rate-limit-whitelist:
    description: Nginx Ingress limit-whitelist exempts CIDRs from rate limiting
    fixtures:
      services:
        - apiVersion: v1
