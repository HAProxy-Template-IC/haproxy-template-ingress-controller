# nginx-ingress library — annotation validation tests.
# Backend directives, frontend filters, session affinity, basic auth, and
# SSL passthrough.
validationTests:
  # ==========================================================================
  # Backend Directive Tests
  # ==========================================================================

  test-nginx-ingress-timeouts:
    description: Nginx Ingress timeout annotations generate correct config
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: timeout-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: timeout-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: timeout-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: timeout-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
          spec:
            ingressClassName: haproxy
            rules:
              - host: timeout.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: timeout-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid
      - type: contains
        target: haproxy.cfg
        pattern: "timeout connect 10s"
        description: Must set timeout connect with s suffix
      - type: contains
        target: haproxy.cfg
        pattern: "timeout server 60s"
        description: Must set timeout server from proxy-read-timeout

