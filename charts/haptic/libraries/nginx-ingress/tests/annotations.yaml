          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "my-auth"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: auth-service
                          port:
