            name: secure-app-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: secure-app
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.50"]
              targetRef:
                kind: Pod
                name: secure-app-0
          ports:
            - name: https
              port: 8443
              protocol: TCP
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: secure-app
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: secure-app.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: secure-app
                          port:
                            name: https
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.50:8443 "
      - type: not_contains
        target: haproxy.cfg
        pattern: "server SRV_1 10.0.0.50:80 "

