            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User, X-Auth-Roles"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/protected X-Auth-User, X-Auth-Roles"
      - type: contains
        target: file:spoe.conf
        pattern: "extract_headers=var\\(txn.auth_extract_headers\\)"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_user\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Roles %\\[var\\(txn.hub.external_auth.x_auth_roles\\)\\] if \\{ var\\(txn.hub.external_auth.x_auth_roles\\) -m found \\} \\{ var\\(txn.hub.external_auth.allowed\\) -m bool \\}"

  test-nginx-ingress-external-auth-hostless-accepted:
    # Same as test-nginx-ingress-external-auth: needs the spoa-hub library
    # loaded for the auth-url.map definition.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Ingress with auth-url annotation AND a host-less rule must render successfully now that auth-url.map is keyed by <ns>/<name> (resource identity) rather than by host+path. The host dimension is no longer part of the key, so the previous fail-loud behaviour for host-less rules is obsolete. The map row is emitted by ns/name and the routing chain populates txn.resource_id correctly for whatever request the host-less Ingress's catch-all matches."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hostless-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/hostless-protected https://auth\.example/check$'
  # ----------------------------------------------------------------------------
  # auth-url <host><path> keying bug (red→green)
  #
  # auth-url.map (and friends) are currently keyed on the literal
  # `MapKeyForHost(host) + path` string. The frontend looks them up via plain
  # `map(...)` (exact match), so:
  #
  #   - regex paths never match: the row's key is the regex pattern string,
  #     the lookup key is the actual request path.
  #   - prefix paths only match the exact ingress path, never subpaths.
  #   - the wildcard-host case happens to work for Exact paths because both
  #     render and request collapse to ".example.com/<path>".
  #
  # The fix keys feature maps by `<ns>/<name>` (resource identity, derived
  # from the qualifier value the routing chain has already produced). After
  # the fix:
  #   - auth-url.map row: "default/<name> <url>"
  #   - consumer line:    "set-var(txn.auth_url) var(txn.resource_id),map(...)"
  #
  # All five tests below assert the post-fix shape, so they FAIL with the
  # current code (proving the bug) and PASS after the fix.
  # ----------------------------------------------------------------------------

  test-nginx-ingress-external-auth-resource-id-keying-wildcard-host:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url with wildcard host: the map row must be keyed by <ns>/<name>, not by the wildcard-stripped host+path. Demonstrates the new keying shape on a scenario that happens to work today (wildcard-host + Exact path), so any regression in the new keying is caught here even though the old keying didn't break this specific case at request time."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/wild-protected https://auth\.example/check$'
      - type: not_contains
        target: map:auth-url.map
        pattern: '\.example\.com/'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-prefix-subpath:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url with Prefix path: a request to a SUBPATH of the ingress path must be authenticated. Today's bug: the map row is keyed \"host.example.com/api\" but the request lookup key is \"host.example.com/api/users\" — exact-match map() always misses on subpaths, so auth silently does not fire. After the fix the map is keyed \"<ns>/<name>\" and the consumer reads txn.resource_id, so any route owned by this ingress (regardless of subpath) triggers auth."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: prefix-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/prefix-protected https://auth\.example/check$'
      - type: not_contains
        target: map:auth-url.map
        pattern: 'api\.example\.com/api'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-regex-path:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url on an Ingress using haproxy-ingress.github.io/path-type=regex. Routing works today via map_reg(); auth-url.map does not because its key is the literal regex string and its consumer is exact-match. Same red→green pattern: row keyed by <ns>/<name>, consumer reads resource_id."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: regex-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/path-type: regex
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/regex-protected https://auth\.example/check$'
      - type: not_contains
        target: map:auth-url.map
        pattern: 'api/v\[0-9'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.auth_url\) var\(txn\.resource_id\),map\('
  test-nginx-ingress-external-auth-resource-id-keying-wildcard-regex:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Combination: wildcard host AND regex path (the case the user asked about). Today this is triple-broken — the row is keyed \".example.com/api/v[0-9]+/.*\", the consumer is exact-match, AND the haproxy-ingress regex-map renderer at haproxy-ingress.yaml:111 leaks the literal `*` into the regex pattern (it doesn't apply MapKeyForHost), making the path-regex.map invalid for HAProxy. The third bug is out of scope here, so we don't assert haproxy_valid; this test just demonstrates the auth-url keying mismatch."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-regex-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/path-type: regex
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      # haproxy_valid is intentionally omitted here — the wildcard `*` leaks
      # into path-regex.map via haproxy-ingress.yaml:111 (separate bug,
      # tracked elsewhere).
      - type: contains
        target: map:auth-url.map
        pattern: '(?m)^default/wild-regex-protected https://auth\.example/check$'
      - type: not_contains
        target: map:auth-url.map
        pattern: '\.example\.com'
