  test-nginx-ingress-external-auth-response-headers:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-response-headers annotation populates auth-extract-headers.map and emits one `http-request set-header` per unique header in any ingress's pass list, gated on `allowed -m bool` so the headers only flow through to the upstream backend on auth success."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
