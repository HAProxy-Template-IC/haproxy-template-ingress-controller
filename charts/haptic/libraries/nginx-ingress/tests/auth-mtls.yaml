# nginx-ingress library — auth + mTLS validation tests.
# mTLS client-cert pass-through, auth-tls secret, and external-auth (SPOE)
# flows including resource-id keying variants.
validationTests:
  test-nginx-ingress-mtls-pass-cert:
    description: Nginx Ingress auth-tls-pass-certificate-to-upstream adds cert headers
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mtls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mtls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-ingress
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mtls.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "ssl_c_der"
      - type: contains
        target: haproxy.cfg
        pattern: "ssl_c_s_dn"

  test-nginx-ingress-auth-tls-secret:
    description: "nginx.ingress.kubernetes.io/auth-tls-secret references a Secret whose `ca.crt` is written to the general file dir (not ssl/ — Dataplane validates ssl/ uploads as cert+key) and used in the crt-list line for the matching SNI as `ca-file <path> verify required`. HAProxy then verifies incoming client certs against that CA bundle."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: mtls-service
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: mtls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: mtls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: client-ca
          type: kubernetes.io/tls
          # Self-signed CA test fixture (re-used from echo demo).
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata:
            namespace: default
            name: server-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              nginx.ingress.kubernetes.io/auth-tls-secret: "client-ca"
              nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mtls-service
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"

  test-nginx-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy (any plugin
    # enabled, or operator forces it). When the test renders against
    # default chart values (no plugins), spoa-hub library is absent —
    # auth-url.map doesn't exist and the frontend snippets don't
    # render. Skip in that case so validate-helm-libraries is green.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-url annotation populates auth-url.map and the spoa-hub frontend wiring (set-var, send-spoe-group, deny rule). Runs in a render where spoaHub is enabled with the external-auth plugin, simulating the auto-enable that nginxIngress=true triggers via the OR-expression in spoaHub.plugins.external-auth.enabled."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/protected https://auth.example/check"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"

  test-nginx-ingress-external-auth-signin:
    # Same prerequisite as the other external-auth tests — needs the
    # spoa-hub library loaded so auth-signin.map is defined.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-signin annotation makes auth failures redirect (302) to the configured sign-in URL instead of returning 401. The deny rule still emits, so requests without auth-signin configured fall through to it."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: protected-svc
          spec:
            ports:
              - port: 80
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            namespace: default
            name: protected-svc-abc
            labels:
              kubernetes.io/service-name: protected-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "https://auth.example/check"
              nginx.ingress.kubernetes.io/auth-signin: "https://login.example/oauth2/start"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: protected-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-signin.map
        pattern: "default/protected https://login.example/oauth2/start"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_signin\\).*auth-signin\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.auth_signin\\)\\] code 302"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"

  test-nginx-ingress-external-auth-method:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "Nginx Ingress auth-method annotation populates auth-method.map and threads through the SPOE check-auth message's `method` arg so the auth subrequest goes out with the configured verb. The external-auth plugin v0.3.0+ falls back to its plugin-level method config when this map lookup is empty, so routes without the annotation are unaffected."
    extraContext:
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
