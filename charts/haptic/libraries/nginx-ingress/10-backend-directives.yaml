# nginx-ingress library — backend-directives-* annotation handlers.
# session-affinity, timeouts, load-balance, proxy-body-size, backend-protocol,
# proxy-protocol, rewrite-target, rate-limiting, upstream-hash, config-snippet.
# (Two source blocks — general directives + rate/hash/snippet — merged here;
# the basic-auth backend directive lives in 40-auth-spoe with the rest of auth.)
templateSnippets:
  # ============================================================================
  # Backend Directives
  # ============================================================================

  backend-directives-670-nginx-ingress-session-affinity:
    template: |
      {#-
        Nginx Ingress Session Affinity (Cookie Persistence)

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#session-affinity

        Annotations:
          - nginx.ingress.kubernetes.io/affinity: "cookie" (required to enable)
          - nginx.ingress.kubernetes.io/session-cookie-name: "<name>" (default: INGRESSCOOKIE)
          - nginx.ingress.kubernetes.io/session-cookie-hash: accepted but NOT configurable in
            HAProxy (md5/sha1/index cannot be honoured); emits a warning, does not change hashing
          - nginx.ingress.kubernetes.io/session-cookie-path: "<path>" (optional)
          - nginx.ingress.kubernetes.io/session-cookie-secure: "true" (optional -> attr Secure)
          - nginx.ingress.kubernetes.io/session-cookie-samesite: "Strict|Lax|None" (optional -> attr SameSite=<v>)

        Generated HAProxy Config:
          cookie <name> insert indirect nocache dynamic [attr Path=<p>] [attr Secure] [attr SameSite=<v>]
          dynamic-cookie-key <sha256-of-ns/name>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var affinity = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/affinity"] %}
        {%- if affinity == "cookie" %}
          {%- var cookieName = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-name"] %}
          {%- if cookieName == "" %}{%- cookieName = "INGRESSCOOKIE" %}{%- end %}
          {%- var cookiePath = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-path"] %}
          {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
          {%- if cookiePath != "" %}
            {#- HAProxy's `cookie` directive does not accept a bare `path`
                keyword (unlike nginx). The supported set is rewrite /
                insert / prefix / indirect / nocache / postonly / domain /
                maxidle / dynamic / maxlife / attr. Use `attr Path=<path>`
                to surface the cookie path attribute on the Set-Cookie
                header HAProxy emits. -#}
            {%- cookieDir = cookieDir + " attr Path=" + cookiePath %}
          {%- end %}
          {#- session-cookie-secure -> Secure cookie attribute. HAProxy's
              `cookie` directive supports repeated `attr` keywords. -#}
          {%- var cookieSecure = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-secure"] %}
          {%- if cookieSecure == "true" %}
            {%- cookieDir = cookieDir + " attr Secure" %}
          {%- end %}
          {#- session-cookie-samesite -> SameSite cookie attribute. Only the
              three browser-defined values are valid; reject anything else
              rather than emit a malformed Set-Cookie attribute. -#}
          {%- var cookieSameSite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-samesite"] %}
          {%- if cookieSameSite != "" %}
            {%- if cookieSameSite != "Strict" && cookieSameSite != "Lax" && cookieSameSite != "None" %}
              {{- fail("Invalid value '" + cookieSameSite + "' for annotation 'nginx.ingress.kubernetes.io/session-cookie-samesite' on Ingress '" + key + "'. Valid values: Strict, Lax, None") -}}
            {%- end %}
            {%- cookieDir = cookieDir + " attr SameSite=" + cookieSameSite %}
          {%- end %}
          {#- session-cookie-hash selects the cookie-value hashing algorithm in
              nginx (md5|sha1|index). HAProxy uses `dynamic` cookies (the server
              name hashed via dynamic-cookie-key) and that algorithm is not
              operator-selectable, so the value cannot be honoured — surface a
              warning rather than silently ignore it (cf. proxy-ssl-verify-depth). -#}
          {%- var cookieHash = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-hash"] %}
          {%- if cookieHash != "" %}
      # Warning: nginx.ingress.kubernetes.io/session-cookie-hash={{ cookieHash }} on Ingress {{ key }} is not configurable in HAProxy — dynamic cookies always hash via dynamic-cookie-key.
          {%- end %}
      # nginx-ingress/session-affinity ({{ key }})
      {{ cookieDir }}
      dynamic-cookie-key {{ sha256(key) }}
        {%- end %}
      {%- end -%}

  backend-directives-700-nginx-ingress-timeouts:
    template: |
      {#-
        Nginx Ingress Backend Timeouts

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-timeouts

        Annotations:
          - nginx.ingress.kubernetes.io/proxy-connect-timeout: "<seconds>" (plain number)
          - nginx.ingress.kubernetes.io/proxy-read-timeout: "<seconds>" (plain number)
          - nginx.ingress.kubernetes.io/proxy-send-timeout: "<seconds>" (plain number)

        Note: Nginx values are plain seconds. We append 's' suffix for HAProxy.
        proxy-read-timeout and proxy-send-timeout both map to HAProxy's timeout server.
        If both are set, the larger value is used.

        Generated HAProxy Config:
          timeout connect <val>s
          timeout server <val>s
      -#}
      {%- if ingress != nil %}
        {%- var connectTimeout = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-connect-timeout"] %}
        {%- var readTimeout = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"] %}
        {%- var sendTimeout = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"] %}
        {%- var hasTimeout = connectTimeout != "" || readTimeout != "" || sendTimeout != "" %}
        {%- if hasTimeout %}
      # nginx-ingress/backend-directives-timeouts
        {%- end %}
        {%- if connectTimeout != "" %}
      timeout connect {{ connectTimeout }}s
        {% end %}
        {%- if readTimeout != "" || sendTimeout != "" %}
          {#- Both map to timeout server; use the larger value if both set -#}
          {%- var serverVal = 0 %}
          {%- if readTimeout != "" %}
            {%- serverVal = toint(readTimeout) %}
          {%- end %}
          {%- if sendTimeout != "" %}
            {%- var sendVal = toint(sendTimeout) %}
            {%- if sendVal > serverVal %}
              {%- serverVal = sendVal %}
            {%- end %}
          {%- end %}
      timeout server {{ serverVal }}s
        {% end %}
      {%- end -%}

  backend-directives-710-nginx-ingress-load-balance:
    template: |
      {#-
        Nginx Ingress Load Balancing Algorithm

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-nginx-load-balancing

        Annotation: nginx.ingress.kubernetes.io/load-balance
        Values: round_robin, least_conn, ip_hash, random, ewma

        Mapping to HAProxy:
          round_robin -> roundrobin
          least_conn  -> leastconn
          ip_hash     -> source
          random      -> random
          ewma        -> leastconn (closest equivalent)

        Generated HAProxy Config:
          balance <algorithm>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var lb = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/load-balance"] %}
        {%- if lb != "" %}
          {%- var algo = "" %}
          {%- if lb == "round_robin" %}
            {%- algo = "roundrobin" %}
          {%- else if lb == "least_conn" %}
            {%- algo = "leastconn" %}
          {%- else if lb == "ip_hash" %}
            {%- algo = "source" %}
          {%- else if lb == "random" %}
            {%- algo = "random" %}
          {%- else if lb == "ewma" %}
            {%- algo = "leastconn" %}
          {%- else %}
            {{- fail("Invalid value '" + lb + "' for annotation 'nginx.ingress.kubernetes.io/load-balance' on Ingress '" + key + "'. Valid values: round_robin, least_conn, ip_hash, random, ewma") -}}
          {%- end %}
      # nginx-ingress/backend-directives-load-balance
      balance {{ algo }}
        {%- end %}
      {%- end -%}

  backend-directives-715-nginx-ingress-next-upstream:
    template: |
      {#-
        Nginx Ingress proxy-next-upstream — when to retry against the next server.

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#proxy-next-upstream

        Annotations:
          - proxy-next-upstream: space-separated conditions (error, timeout,
              invalid_header, http_500/502/503/504/403/404/429, non_idempotent, off)
          - proxy-next-upstream-tries: max attempts (0 = unlimited in nginx)

        HAProxy mapping (backend-level):
          error -> conn-failure ; timeout -> response-timeout ;
          invalid_header -> junk-response ; http_<NNN> -> <NNN> ;
          off -> `retries 0` ; tries N(>0) -> `retries N`.
        `option redispatch` is already set in defaults so a retry lands on a
        different server. Ignored (no HAProxy CE equivalent): non_idempotent and
        proxy-next-upstream-timeout.
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var nu = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream"] %}
        {%- var tries = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream-tries"] %}
        {%- if nu != "" || tries != "" %}
          {%- var off = false %}
          {%- var conds = []string{} %}
          {%- var seen = map[string]bool{} %}
          {%- for _, tok := range split(nu, " ") %}
            {%- var t = trimSpace(tok) %}
            {%- var mapped = "" %}
            {%- if t == "off" %}
              {%- off = true %}
            {%- else if t == "error" %}
              {%- mapped = "conn-failure" %}
            {%- else if t == "timeout" %}
              {%- mapped = "response-timeout" %}
            {%- else if t == "invalid_header" %}
              {%- mapped = "junk-response" %}
            {%- else if hasPrefix(t, "http_") %}
              {%- var code = t[5:] %}
              {%- if !regex_search(code, "^[1-5][0-9][0-9]$") %}
                {{- fail("Invalid status '" + code + "' in 'nginx.ingress.kubernetes.io/proxy-next-upstream' on Ingress '" + key + "'. Use http_<3-digit-status>.") -}}
              {%- end %}
              {%- mapped = code %}
            {%- end %}
            {%- if mapped != "" && !seen[mapped] %}
              {%- seen[mapped] = true %}
              {%- conds = append(conds, mapped) %}
            {%- end %}
          {%- end %}
          {%- if off %}
      # nginx-ingress/proxy-next-upstream ({{ key }}) - disabled
      retries 0
          {%- else %}
            {%- if len(conds) > 0 %}
      # nginx-ingress/proxy-next-upstream ({{ key }})
      retry-on {{ join(conds, " ") }}
            {%- end %}
            {%- if tries != "" %}
              {#- Reject non-integer values up front: toint() returns 0 for junk
                  like "abc"/"2.5", which would otherwise be silently dropped and
                  hide an operator typo. -#}
              {%- if !regex_search(tries, "^[0-9]+$") %}
                {{- fail("Invalid value '" + tries + "' for 'nginx.ingress.kubernetes.io/proxy-next-upstream-tries' on Ingress '" + key + "'. Must be a non-negative integer.") -}}
              {%- end %}
              {%- var n = toint(tries) %}
              {%- if n > 0 %}
      retries {{ n }}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-720-nginx-ingress-proxy-body-size:
    template: |
      {#-
        Nginx Ingress Proxy Body Size Limit

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-max-body-size

        Annotation: nginx.ingress.kubernetes.io/proxy-body-size
        Values: plain number (bytes), or with k/K, m/M, g/G suffix
        Value "0" means unlimited (no directive emitted).

        Generated HAProxy Config:
          http-request deny deny_status 413 if { req.body_size gt <bytes> }
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var bodySize = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-body-size"] %}
        {%- if bodySize != "" %}
          {%- var bytes = 0 %}
          {%- var sizeLen = len(bodySize) %}
          {%- var lastChar = bodySize[sizeLen-1:] %}
          {%- if lastChar == "k" || lastChar == "K" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1024 %}
          {%- else if lastChar == "m" || lastChar == "M" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1048576 %}
          {%- else if lastChar == "g" || lastChar == "G" %}
            {%- bytes = toint(bodySize[:sizeLen-1]) * 1073741824 %}
          {%- else %}
            {%- bytes = toint(bodySize) %}
          {%- end %}
          {%- if bytes > 0 %}
      # nginx-ingress/backend-directives-proxy-body-size ({{ key }})
      http-request deny deny_status 413 if { req.body_size gt {{ bytes }} }
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-725-nginx-ingress-limit-rate:
    template: |
      {#-
        Nginx Ingress limit-rate / limit-rate-after — per-connection download throttle.

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#limit-rate

        Annotations:
          - limit-rate: max bytes/sec sent to a single client connection (e.g. "100k")
          - limit-rate-after: bytes transferred before throttling kicks in (e.g. "1m")

        HAProxy mapping (per-stream bandwidth limit, HAProxy CE >= 2.7):
          filter bwlim-out <name> default-limit <rate> default-period 1s [min-size <after>]
          http-request set-bandwidth-limit <name>
        bwlim-out limits data sent toward the client; min-size is the offset before
        the limit applies (= limit-rate-after).
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var rate = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate"] %}
        {%- var after = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate-after"] %}
        {%- if rate != "" %}
          {%- if !regex_search(rate, "^[0-9]+[kKmMgG]?$") %}
            {{- fail("Invalid value '" + rate + "' for 'nginx.ingress.kubernetes.io/limit-rate' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
          {%- end %}
          {%- var fname = "ni_limitrate_" + ns + "_" + name %}
          {%- var filterLine = "filter bwlim-out " + fname + " default-limit " + rate + " default-period 1s" %}
          {%- if after != "" %}
            {%- if !regex_search(after, "^[0-9]+[kKmMgG]?$") %}
              {{- fail("Invalid value '" + after + "' for 'nginx.ingress.kubernetes.io/limit-rate-after' on Ingress '" + key + "'. Expected a byte size like '1m'.") -}}
            {%- end %}
            {%- filterLine = filterLine + " min-size " + after %}
          {%- end %}
      # nginx-ingress/limit-rate ({{ key }})
      {{ filterLine }}
      http-request set-bandwidth-limit {{ fname }}
        {%- end %}
      {%- end -%}

  backend-directives-730-nginx-ingress-backend-protocol:
    template: |
      {#-
        Nginx Ingress Backend Protocol

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#backend-protocol

        Annotation: nginx.ingress.kubernetes.io/backend-protocol
        Values: HTTP, HTTPS, GRPC, GRPCS

        Mapping to HAProxy server options:
          HTTP   -> (no additional flags)
          HTTPS  -> ssl verify none
          GRPC   -> proto h2
          GRPCS  -> ssl verify none proto h2

        AJP and FCGI are not supported in HAProxy and will fail with an error.
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var proto = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/backend-protocol"] %}
        {%- if proto != "" %}
          {%- if proto == "HTTP" %}
            {#- HTTP/1.1 is default, no flag needed -#}
          {%- else if proto == "HTTPS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none") %}
          {%- else if proto == "GRPC" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto h2") %}
          {%- else if proto == "GRPCS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl verify none proto h2") %}
          {%- else if proto == "AJP" %}
            {{- fail("Backend protocol 'AJP' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else if proto == "FCGI" %}
            {{- fail("Backend protocol 'FCGI' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else %}
            {{- fail("Invalid value '" + proto + "' for annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'. Valid values: HTTP, HTTPS, GRPC, GRPCS") -}}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-740-nginx-ingress-proxy-protocol:
    template: |
      {#-
        Nginx Ingress Proxy Protocol to Backend

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#proxy-protocol

        Annotation: nginx.ingress.kubernetes.io/use-proxy-protocol
        Values: "true" | "false"

        When enabled, sends PROXY protocol v2 header to the backend.

        Generated HAProxy Config:
          (appends send-proxy-v2 to server options)
      -#}
      {%- if ingress != nil %}
        {%- var pp = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/use-proxy-protocol"] %}
        {%- if pp == "true" %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2") %}
        {%- end %}
      {%- end -%}

  backend-directives-750-nginx-ingress-rewrite-target:
    template: |
      {#-
        Nginx Ingress Rewrite Target

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rewrite

        Annotation: nginx.ingress.kubernetes.io/rewrite-target

        Nginx capture groups use $1, $2, etc. HAProxy uses \1, \2, etc.
        This template translates $N to \N in the rewrite target value.

        Generated HAProxy Config:
          http-request replace-path (.*) <translated-value>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var rewrite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/rewrite-target"] %}
        {%- if rewrite != "" %}
          {#- Translate $1..$9 capture groups to \1..\9 -#}
          {%- rewrite = replace(rewrite, "$1", "\\1") %}
          {%- rewrite = replace(rewrite, "$2", "\\2") %}
          {%- rewrite = replace(rewrite, "$3", "\\3") %}
          {%- rewrite = replace(rewrite, "$4", "\\4") %}
          {%- rewrite = replace(rewrite, "$5", "\\5") %}
          {%- rewrite = replace(rewrite, "$6", "\\6") %}
          {%- rewrite = replace(rewrite, "$7", "\\7") %}
          {%- rewrite = replace(rewrite, "$8", "\\8") %}
          {%- rewrite = replace(rewrite, "$9", "\\9") %}
      # nginx-ingress/backend-directives-rewrite-target ({{ key }})
      http-request replace-path (.*) {{ rewrite }}
        {%- end %}
      {%- end -%}

  backend-directives-770-nginx-ingress-rate-limiting:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {#-
        Nginx Ingress Rate Limiting

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rate-limiting

        Annotations:
          - nginx.ingress.kubernetes.io/limit-rps: "<requests-per-second>"
          - nginx.ingress.kubernetes.io/limit-rpm: "<requests-per-minute>"
          - nginx.ingress.kubernetes.io/limit-connections: "<connections>"
          - nginx.ingress.kubernetes.io/limit-whitelist: "<CIDR>,<CIDR>,..." (exempt sources)

        HAProxy supports only one stick-table per backend, and a stick-table
        can hold each data type only once: `store http_req_rate` is keyed by
        the data type, so two http_req_rate counters with different periods
        (1s vs 60s) cannot coexist in one table — HAProxy rejects the second
        with "store option 'http_req_rate' already enabled, ignored". So
        limit-rps and limit-rpm are mutually exclusive at the HAProxy layer.

        Precedence: limit-rps > limit-rpm > limit-connections. When a
        higher-precedence option is set, the lower ones are ignored (a comment
        notes it). limit-connections uses a different counter type (conn_cur).

        limit-whitelist appends a trailing negated `src` ACL to the deny line
        so requests from the listed CIDRs are never rate-limited.

        For limit-rps:
          stick-table type ip size 100k expire 1s store http_req_rate(1s) peers localinstance
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_http_req_rate(0) gt <rps> }

        For limit-rpm:
          stick-table type ip size 100k expire 60s store http_req_rate(60s)
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_http_req_rate(0) gt <rpm> }

        For limit-connections:
          stick-table type ip size 100k expire 30s store conn_cur peers localinstance
          http-request track-sc0 src
          http-request deny deny_status 429 if { sc_conn_cur(0) gt <connections> }
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var limitRps = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rps"] %}
        {%- var limitRpm = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rpm"] %}
        {%- var limitConn = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-connections"] %}
        {%- var limitWhitelist = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-whitelist"] %}
        {#- Build the optional trailing exemption ACL from limit-whitelist. -#}
        {%- var exempt = "" %}
        {%- if limitWhitelist != "" %}
          {%- var validated = ValidateCidrList(limitWhitelist, "nginx.ingress.kubernetes.io/limit-whitelist", key) %}
          {%- if validated != "" %}
            {%- exempt = " !{ src " + validated + " }" %}
          {%- end %}
        {%- end %}
        {%- if limitRps != "" || limitRpm != "" %}
          {#- Note any lower-precedence options that this render ignores. -#}
          {%- var ignored = []string{} %}
          {%- if limitRps != "" && limitRpm != "" %}{%- ignored = append(ignored, "limit-rpm") %}{%- end %}
          {%- if limitConn != "" %}{%- ignored = append(ignored, "limit-connections") %}{%- end %}
          {%- if len(ignored) > 0 %}
      # nginx-ingress/rate-limiting ({{ key }}) - {{ join(ignored, ", ") }} ignored (HAProxy stores http_req_rate once per stick-table; conn_cur needs a separate counter)
          {%- else %}
      # nginx-ingress/rate-limiting ({{ key }})
          {%- end %}
          {%- if limitRps != "" %}
      {#- `peers localinstance` (base.yaml) preserves the per-source counter -#}
      {#- across reloads so the limit isn't reset to zero on config churn. -#}
      stick-table type ip size 100k expire 1s store http_req_rate(1s) peers localinstance
      http-request track-sc0 src
      http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ limitRps }} }{{ exempt }}
          {%- else %}
      stick-table type ip size 100k expire 60s store http_req_rate(60s) peers localinstance
      http-request track-sc0 src
      http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ limitRpm }} }{{ exempt }}
          {%- end %}
        {%- else if limitConn != "" %}
      # nginx-ingress/rate-limiting ({{ key }})
      stick-table type ip size 100k expire 30s store conn_cur peers localinstance
      http-request track-sc0 src
      http-request deny deny_status 429 if { sc_conn_cur(0) gt {{ limitConn }} }{{ exempt }}
        {%- end %}
      {%- end -%}

  backend-directives-760-nginx-ingress-upstream-headers:
    template: |
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {#-
        Nginx Ingress Upstream Request Headers

        Documentation:
          https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#upstream-vhost
          https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#x-forwarded-prefix

        Annotations:
          - nginx.ingress.kubernetes.io/upstream-vhost: "<host>" — overrides the
            Host header sent to the upstream.
          - nginx.ingress.kubernetes.io/x-forwarded-prefix: "<prefix>" — sets the
            X-Forwarded-Prefix header (companion to rewrite-target).
          - nginx.ingress.kubernetes.io/connection-proxy-header: "<value>" — sets
            the Connection header sent to the upstream.

        Emitted as backend (post-routing) http-request rules so rewriting Host
        does not disturb the frontend's host-based backend selection.

        Generated HAProxy Config:
          http-request set-header Host <host>
          http-request set-header X-Forwarded-Prefix <prefix>
          http-request set-header Connection <value>
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var upstreamVhost = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/upstream-vhost"] %}
        {%- var xfp = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/x-forwarded-prefix"] %}
        {%- var connHeader = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/connection-proxy-header"] %}
        {%- if upstreamVhost != "" %}
      # nginx-ingress/upstream-vhost ({{ key }})
      http-request set-header Host {{ ValidateConfigValue(upstreamVhost, "nginx.ingress.kubernetes.io/upstream-vhost", key, true) }}
        {%- end %}
        {%- if xfp != "" %}
      # nginx-ingress/x-forwarded-prefix ({{ key }})
      http-request set-header X-Forwarded-Prefix {{ ValidateConfigValue(xfp, "nginx.ingress.kubernetes.io/x-forwarded-prefix", key, true) }}
        {%- end %}
        {%- if connHeader != "" %}
      # nginx-ingress/connection-proxy-header ({{ key }})
      http-request set-header Connection {{ ValidateConfigValue(connHeader, "nginx.ingress.kubernetes.io/connection-proxy-header", key, true) }}
        {%- end %}
      {%- end -%}

  backend-directives-780-nginx-ingress-upstream-hash:
    template: |
      {#-
        Nginx Ingress Upstream Hash-Based Load Balancing

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#custom-nginx-upstream-hashing

        Annotation: nginx.ingress.kubernetes.io/upstream-hash-by

        Translates nginx variables to HAProxy fetches:
          $request_uri  -> url
          $remote_addr  -> src
          $cookie_XXXX  -> req.cook(XXXX)
          $http_xxxx    -> req.hdr(xxxx) (underscores replaced with hyphens)
          $arg_XXXX     -> url_param(XXXX)

        If the value starts with $ but doesn't match known patterns, fails with error.
        If the value doesn't start with $, it's passed through as-is (assumed HAProxy fetch).

        Generated HAProxy Config:
          balance hash <expr>
          hash-type consistent
      -#}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var hashBy = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/upstream-hash-by"] %}
        {%- if hashBy != "" %}
          {%- var expr = "" %}
          {%- if hashBy == "$request_uri" %}
            {%- expr = "url" %}
          {%- else if hashBy == "$remote_addr" %}
            {%- expr = "src" %}
          {%- else if hasPrefix(hashBy, "$cookie_") %}
            {%- expr = "req.cook(" + hashBy[8:] + ")" %}
          {%- else if hasPrefix(hashBy, "$http_") %}
            {%- var hdrName = replace(hashBy[6:], "_", "-") %}
            {%- expr = "req.hdr(" + hdrName + ")" %}
          {%- else if hasPrefix(hashBy, "$arg_") %}
            {%- expr = "url_param(" + hashBy[5:] + ")" %}
          {%- else if hasPrefix(hashBy, "$") %}
            {{- fail("Unsupported nginx variable '" + hashBy + "' for annotation 'nginx.ingress.kubernetes.io/upstream-hash-by' on Ingress '" + key + "'. Supported: $request_uri, $remote_addr, $cookie_XXXX, $http_xxxx, $arg_XXXX") -}}
          {%- else %}
            {#- Not a nginx variable, pass through as HAProxy fetch -#}
            {%- expr = hashBy %}
          {%- end %}
      # nginx-ingress/backend-directives-upstream-hash ({{ key }})
      balance hash {{ expr }}
      hash-type consistent
        {%- end %}
      {%- end -%}

  backend-directives-900-nginx-ingress-config-snippet:
    template: |
      {#-
        Nginx Ingress Backend Configuration Snippet

        Documentation: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#configuration-snippet

        Annotation: nginx.ingress.kubernetes.io/configuration-snippet
        Allows injecting raw HAProxy directives into the backend.
      -#}
      {%- if ingress != nil %}
        {%- var snippet = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/configuration-snippet"] %}
        {%- if snippet != "" %}
      # nginx-ingress/configuration-snippet
      {{ snippet }}
        {%- end %}
      {%- end -%}
