# SPOA hub library — general validation tests
#
# Covers default rendering, mode-tcp fallback on HAProxy 3.0, disabled-library
# behaviour, and multi-plugin rendering. Coraza-specific tests live in
# tests/coraza.yaml; external-auth-specific tests live in their owning vendor
# libraries (haproxytech / haproxy-ingress / nginx-ingress).

validationTests:
  test-spoa-hub-disabled:
    description: "With extraContext.spoaHub.enabled=false (or missing), the library must not emit the `backend spoa-hub` block, the SPOE filter, or any spoe.conf reference."
    extraContext:
      spoaHub:
        enabled: false
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid when spoaHub is disabled
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must not appear when spoaHub.enabled is false
      - type: not_contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub"
        description: SPOE filter must not appear when spoaHub.enabled is false

  test-spoa-hub-rendering:
    # The fixture below pins haproxyVersion=3.2 so the rendered backend
    # uses `mode spop` (which is what the assertions assume). On a 3.0
    # haproxy binary that line is a parser error — `mode spop` was
    # introduced in 3.1. test-spoa-hub-mode-tcp-on-haproxy-3-0 covers
    # the 3.0 fallback path; this test is skipped there.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With extraContext.spoaHub.enabled=true and `check-auth` in the messages union, the library emits the spoa-hub backend, the SPOE filter directive, the per-message group + canonical message body, and the external-auth frontend wiring (auth-url lookup, group trigger, deny rule)."
    extraContext:
      # Pin the HAProxy version to 3.1+ so the rendered backend uses
      # `mode spop` (the assertion below requires it). Native SPOP
      # was introduced in HAProxy 3.1; on 3.0 the chart falls back to
      # `mode tcp`. test-spoa-hub-rendering-mode-tcp-on-haproxy30
      # covers that fallback path.
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      # Trigger the http_frontend (where the SPOE filter directive +
      # frontend-filters auth-flow assertions live). The auth-url
      # annotation also activates the external-auth dispatch path so
      # the `http-request send-spoe-group ... check-auth-group` and
      # `deny deny_status 401` assertions actually have a route to
      # apply to. After the bind-derivation refactor, an empty
      # fixture leaves the http_frontend unrendered.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: auth-trigger
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/auth-url: "http://auth.svc.cluster.local/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: trigger-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy config must be valid with spoaHub enabled
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend must appear when spoaHub is enabled
      - type: contains
        target: haproxy.cfg
        pattern: "mode spop"
        description: Backend uses native SPOP mode by default
      - type: contains
        target: haproxy.cfg
        pattern: "server hub /run/spoa/hub.sock"
        description: Server points at the hub's Unix-domain socket
      - type: contains
        target: haproxy.cfg
        pattern: "filter spoe engine spoa-hub config"
        description: Frontends include the SPOE filter directive
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub check-auth-group"
        description: Frontend explicitly triggers the auth group when auth_url is set
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 401"
        description: Frontend denies on auth failure
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-agent spoa-hub-agent"
        description: spoe.conf declares the spoa-hub agent
      - type: contains
        target: file:spoe.conf
        pattern: "groups check-auth-group"
        description: Agent's groups line references the auth group
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-message check-auth"
        description: Canonical spoe-message check-auth body is emitted
      - type: contains
        target: file:spoe.conf
        pattern: "args auth_url=var\\(txn.auth_url\\)"
        description: Message args include the auth_url binding
      - type: contains
        target: file:spoe.conf
        pattern: "spoe-group check-auth-group"
        description: Group definition references the message

  # Regression: an Ingress with haproxy.org/forwarded-for=true triggers
  # the haproxytech library to emit `option forwardfor` in the frontend
  # at priority 100. The spoa-hub library's frontend-filters-100-* runs
  # next (alphabetical tie-break), so its output must start on a new
  # line — otherwise we get `option forwardforfilter spoe engine ...`
  # (a real bug found in CI when both snippets co-rendered).
  test-spoa-hub-frontend-filters-newline-after-forwardfor:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "When haproxytech's option-forwardfor and the spoa-hub filter spoe directive both render at frontend-filters priority 100, they must be on separate lines. Catches the cycle 4 part C bug where the `{%- if` in spoa-hub's snippet stripped the separating newline."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata:
            namespace: default
            name: ff-svc
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ff-ingress
            annotations:
              haproxy.org/forwarded-for: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ff.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ff-svc
                          port:
                            number: 80
    assertions:
      - type: haproxy_valid
        description: HAProxy must validate (the concat bug produces invalid syntax)
      - type: not_contains
        target: haproxy.cfg
        pattern: "forwardforfilter"
        description: option forwardfor and filter spoe must not concatenate

  test-spoa-hub-mode-tcp-on-haproxy-3-0:
    description: "On HAProxy 3.0 the `spop` proxy mode doesn't exist (introduced in 3.1). The chart must auto-fall-back the spoa-hub backend to `mode tcp` — both transports work with the SPOE filter; mode spop is just..."
    extraContext:
      haproxyVersion: "3.0"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: Rendered config must validate (mode tcp is valid on 3.0)
      - type: contains
        target: haproxy.cfg
        pattern: "backend spoa-hub"
        description: spoa-hub backend present
      - type: contains
        target: haproxy.cfg
        pattern: "mode tcp"
        description: Backend uses mode tcp on HAProxy 3.0
      - type: not_contains
        target: haproxy.cfg
        pattern: "backend spoa-hub\\n    mode spop"
        description: Backend must NOT use mode spop on HAProxy 3.0

  # ============================================================================
  # spoa-hub-config.toml rendering (ADR-0007 / MR3)
  # ============================================================================

  test-spoa-hub-config-render-default:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With coraza enabled and no per-Ingress modsecurity-snippet annotations, the rendered spoa-hub-config.toml contains the top-level hub keys, the [[listeners]] block, and one [[plugins]] block for coraza with the base directives wrapped in `directives = \"\"\"...\"\"\"`. No snippet comment markers appear."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: ["check-request"]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
        hub:
          logLevel: info
          maxConnections: 1000
          blockingThreadKeepAliveSecs: 30
          pluginDir: /etc/haproxy-spoa-hub/plugins
          defaultTimeoutMs: 500
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            directives: |
              SecRuleEngine On
              Include @coraza.conf-recommended
            params: |
              request_body_limit = 131072
              detect_only = false
    fixtures: {}
    assertions:
      - type: haproxy_valid
        description: HAProxy config must remain valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'plugin_dir = "/etc/haproxy-spoa-hub/plugins"'
        description: Top-level plugin_dir is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'log_level = "info"'
        description: Top-level log_level is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'max_connections = 1000'
        description: Top-level max_connections is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[\[listeners\]\]'
        description: Listeners block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'address = "/run/spoa/hub.sock"'
        description: Listener address points at the configured socketPath
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: '\[\[plugins\]\]'
        description: Coraza [[plugins]] block is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'name = "coraza"'
        description: Plugin name is set
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'library = "libcoraza_plugin.so"'
        description: Plugin library filename is set
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'timeout_ms = 15'
        description: Plugin timeout_ms is rendered
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'SecRuleEngine On'
        description: Base coraza directives are inlined into directives = """..."""
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'request_body_limit = 131072'
        description: Free-form params blob is spliced under [plugins.params]
      - type: not_contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from'
        description: No snippet markers appear when no Ingress carries the annotation
