# SPOA hub template library for HAPTIC
#
# Provides the HAProxy-side wiring for the bundled `spoa-hub` sidecar:
#   - `backend spoa-hub` with `mode spop` (or `mode tcp` on HAProxy 2.x)
#   - `filter spoe engine spoa-hub config <path>` directive in frontends
#   - `spoe.conf` registered as a general file via fileRegistry, containing
#     the agent block and per-plugin spoe-message bodies
#
# This library is opt-in via `controller.templateLibraries.spoaHub.enabled`.
# The chart auto-enables it when the SPOA hub sidecar is on (i.e. any
# plugin under `spoaHub.plugins.*` is enabled, or the operator sets
# `spoaHub.enabled=true` directly).
#
# Configuration is delivered via templatingSettings.extraContext.spoaHub
# (set by templates/haproxytemplateconfig.yaml from values.yaml). The
# controller stays generic — it never sees a "spoaHub" field in the CRD
# spec.
#
# Extension points for plugin libraries:
#
#   spoe-agents-*                    — extra directives inside spoe-agent
#                                      block (e.g. additional `option` lines).
#   spoe-messages-<message-name>-*   — `spoe-message <name>` block defining
#                                      one message's args/fetches. Resolved
#                                      per-message: contributing libraries
#                                      replace the auto-stub for their own
#                                      messages, and untouched messages still
#                                      get a minimal stub so HAProxy accepts
#                                      the agent's group references.
#   frontend-spoe-filters-*          — directives in frontend, after the
#                                      filter spoe directive (e.g. set-var
#                                      for SPOE args, send-spoe-group to
#                                      trigger a check, deny rules on the
#                                      plugin's response var).
#   map-auth-url-*                   — per-ingress entries for auth-url.map
#                                      (cycle 4 external-auth flow).
#
# Usage:
#   controller:
#     templateLibraries:
#       spoaHub:
#         enabled: true   # auto-enabled when spoaHub.enabled is truthy

# Chart-time loading rules (consumed by haptic.mergeLibraries; stripped from output).
# Loaded when explicitly enabled OR when haptic.spoaHub.enabled (helper) is truthy
# (any plugin under spoaHub.plugins.* enabled, or spoaHub.enabled=true).
_helm_load:
  enable: '{{ or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .) }}'

maps:
  coraza-app.map:
    template: |
      # Coraza WAF per-Ingress app routing: <ns>/<name> (resource id) → app, so each
      # tenant's modsecurity-snippet rules stay isolated. Populated by nginx-ingress
      # map-coraza-app-*; fed to the check-request SPOE app= arg (empty → default WAF).
      # See https://haproxy-haptic.org/docs/latest/operations/spoa-hub/
      {{ render_glob "map-coraza-app-*" -}}

  haproxy-ingress-waf.map:
    template: |
      # Coraza WAF per-Ingress enforcement mode: <ns>/<name> → deny (block) | detect (shadow).
      # Populated by haproxy-ingress map-haproxy-ingress-waf-* (/waf + /waf-mode); read into
      # txn.coraza_mode (empty → no opt-in; request skips the WAF SPOE roundtrip).
      # See https://haproxy-haptic.org/docs/latest/operations/spoa-hub/
      {{ render_glob "map-haproxy-ingress-waf-*" -}}

  coraza-disabled.map:
    template: |
      # Coraza WAF per-path opt-out (only under coraza.dispatch.mode=default-on): an entry
      # (keyed by host+path) excludes that path from the unconditional WAF SPOE dispatch.
      # Populated by nginx-ingress map-coraza-disabled-* (enable-modsecurity: "false");
      # empty under the default opt-in dispatch. See https://haproxy-haptic.org/docs/latest/operations/spoa-hub/
      {{ render_glob "map-coraza-disabled-*" -}}

  auth-url.map:
    template: |
      # External-auth per-ingress auth-url. Keyed by <ns>/<name> (resource id).
      # Populated by ingress libraries' map-auth-url-* contributions.
      {{ render_glob "map-auth-url-*" -}}

  auth-signin.map:
    template: |
      # External-auth per-ingress sign-in URL: when set, an auth failure redirects (302) to it
      # instead of denying (401) — browser OIDC/SAML login flows. Keyed by <ns>/<name>.
      # Populated by ingress libraries' map-auth-signin-* contributions.
      {{ render_glob "map-auth-signin-*" -}}

  auth-forward-headers.map:
    template: |
      # External-auth per-ingress request-header allowlist forwarded to the auth service (comma
      # list). Keyed by <ns>/<name>. Populated by ingress map-auth-forward-headers-*
      # (haproxy-ingress.github.io/auth-headers-request); fed to the check-auth SPOE
      # forward_headers arg (empty → plugin-level default).
      {{ render_glob "map-auth-forward-headers-*" -}}

  auth-extract-headers.map:
    template: |
      # External-auth per-ingress response-header names to extract from the auth reply (comma
      # union of auth-response-headers / auth-headers-succeed|fail). Keyed by <ns>/<name>.
      # Populated by ingress map-auth-extract-headers-*; fed to the check-auth SPOE
      # extract_headers arg, which publishes each as txn.hub.external_auth.<name>.
      # See https://haproxy-haptic.org/docs/latest/operations/spoa-hub/
      {{ render_glob "map-auth-extract-headers-*" -}}


  auth-method.map:
    template: |
      # External-auth per-ingress HTTP method override for the auth subrequest. Keyed by
      # <ns>/<name>. Populated by ingress map-auth-method-* ({nginx,haproxy}-ingress
      # auth-method annotations); fed to the check-auth SPOE method arg (empty → no override).
      {{ render_glob "map-auth-method-*" -}}

  rate-limit.map:
    template: |
      # Shared rate-limit per-route rule: <ns>/<name> (resource id) →
      # "limit period burst mode keyspec" (space-separated, always all five).
      # Populated by the haptic-annotations map-rate-limit-* producer; split
      # positionally in frontend-spoe-filters-150-rate-limit and shipped as the
      # rate-limit SPOE args. Empty → route isn't rate-limited (SPOE skipped).
      # See https://haproxy-haptic.org/docs/latest/operations/spoa-hub/
      {{ render_glob "map-rate-limit-*" -}}
