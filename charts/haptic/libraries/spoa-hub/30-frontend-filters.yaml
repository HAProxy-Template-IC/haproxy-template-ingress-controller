# SPOA hub library — production templateSnippets, batch 30:
#
# Frontend-scope directives that dispatch into the SPOA hub:
#   - frontend-filters-100-spoa-hub        (filter spoe directive)
#   - frontend-spoe-filters-020-rate-limit-config (shared-limit map lookup)
#   - frontend-spoe-filters-025-rate-limit-ip (pre-WAF source-IP limit)
#   - frontend-spoe-filters-050-coraza     (WAF dispatch + deny)
#   - frontend-spoe-filters-100-external-auth (external-auth subrequest)

templateSnippets:
  # Shared implementation for source-IP and authenticated-consumer rate-limit
  # dispatch. The caller chooses the key dimension and is responsible for
  # attaching the SPOE filter to its proxy. Keeping verdict handling here makes
  # the pre-WAF frontend path and post-auth backend path fail closed identically.
  util-spoa-rate-limit-dispatch:
    template: |
      {% macro DispatchSharedRateLimit(keySpec string) string %}
      {#- Build <ns>/<name>|<dimension>. Consumer mode uses the identity set by
          native API-key/JWT backend rules and falls back to source IP when the
          route has no authenticated identity. -#}
      http-request set-var(txn.rl_dim) src if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} }
      {%- if keySpec == "consumer" %}
      http-request set-var(txn.rl_dim) var(txn.haptic_consumer) if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str consumer } { var(txn.haptic_consumer) -m found }
      {%- end %}
      http-request set-var(txn.rl_key) var(txn.resource_id),concat(|,txn.rl_dim) if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} }
      http-request send-spoe-group spoa-hub check-ratelimit-group if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} }
      {#- Missing verdicts can happen if the hub/plugin is unavailable or times
          out. An explicitly limited route fails closed so overload cannot
          bypass the budget. The plugin's fail_open setting still controls
          malformed-rule handling inside the plugin. -#}
      http-request deny deny_status 429 hdr Retry-After 1 if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.hub.rate_limit.allowed) -m found }
      http-request deny deny_status 429 hdr Retry-After %[var(txn.hub.rate_limit.retry_after)] if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found } !{ var(txn.hub.rate_limit.allowed) -m bool }
      {#- http-after-response also covers HAProxy's internally generated 429. -#}
      http-after-response set-header X-RateLimit-Limit %[var(txn.hub.rate_limit.limit)] if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found }
      http-after-response set-header X-RateLimit-Remaining %[var(txn.hub.rate_limit.remaining)] if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found }
      http-after-response set-header X-RateLimit-Reset %[var(txn.hub.rate_limit.reset)] if { var(txn.rl_limit) -m found } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found }
      {% end %}

  # Body-inspecting features pass req.body to SPOE, and HAProxy only exposes
  # buffered bytes. Emit the one shared tune.bufsize configured for all request
  # inspectors; duplicate feature-specific directives would be ambiguous.
  global-settings-350-request-body-inspection-buffer:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- var bodyInspectionEnabled = messages contains "validate-request" || messages contains "check-request" %}
      {%- if bodyInspectionEnabled %}
        {%- var bufferSize = 16384 %}
        {%- var configuredBufferSize = extraContext | dig("requestBodyInspection", "haproxyBuffer", "sizeBytes") %}
        {%- if configuredBufferSize != nil %}{%- bufferSize = toint(configuredBufferSize) %}{%- end %}
        {%- if bufferSize < 16384 || bufferSize > 2097152 %}
          {%- fail("extraContext.requestBodyInspection.haproxyBuffer.sizeBytes must be between 16384 and 2097152 bytes.") %}
        {%- end %}
      tune.bufsize {{ bufferSize }}
      {%- end %}

  frontend-filters-100-spoa-hub:
    template: |-
      {%- if (render "util-spoa-hub-enabled") == "true" %}

      filter spoe engine spoa-hub config {{ pathResolver.GetPath("spoe.conf", "file") }}
      {{- render_glob "frontend-spoe-filters-*" }}
      {%- end %}

  # Resolve and parse the packed shared-rate-limit rule before any plugin is
  # dispatched. Priority 020 lets source-IP limits reject abusive traffic at
  # 025, before the more expensive Coraza pass at 050. Consumer-keyed limits
  # reuse these transaction variables later in the selected Ingress backend,
  # after native API-key/JWT rules have established txn.haptic_consumer.
  frontend-spoe-filters-020-rate-limit-config:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-ratelimit" %}
      {#- One packed map keyed by resource_id -> "limit period burst mode
          keyspec". Routes without an annotation miss and skip all later
          rate-limit rules. -#}
      http-request set-var(txn.rl_cfg) var(txn.resource_id),map({{ pathResolver.GetPath("rate-limit.map", "map") }}) unless { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_limit) var(txn.rl_cfg),field(1,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_period) var(txn.rl_cfg),field(2,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_burst) var(txn.rl_cfg),field(3,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_mode) var(txn.rl_cfg),field(4,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_keyspec) var(txn.rl_cfg),field(5,' ') if { var(txn.rl_cfg) -m found }
      {%- end %}

  # Source-IP limits are the public-edge DoS guard. Run them before Coraza so
  # rejected floods do not consume WAF CPU. Consumer quotas deliberately run
  # later in the selected backend because their identity is established there.
  frontend-spoe-filters-025-rate-limit-ip:
    template: |
      {%- import "util-spoa-rate-limit-dispatch" for DispatchSharedRateLimit %}
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-ratelimit" %}
      {{ DispatchSharedRateLimit("ip") }}
      {%- end %}

  # Coraza WAF dispatch. Reusable HAPTIC policies add a per-Ingress body
  # contract: requestBody:none never waits, while requestBody:any/json requires
  # a bounded complete Content-Length body. The plugin receives explicit
  # body-mode/body-complete and detect-only values.
  #
  # Multi-tenant per-path dispatch (no rule bleed across Ingresses):
  #
  # Two maps drive the per-path lookup:
  #   - coraza-app.map (populated by nginx-ingress.yaml's
  #     map-coraza-app-* snippet): `<host><path>` → `<ns>/<name>` for
  #     Ingresses that carry `nginx.ingress.kubernetes.io/modsecurity-snippet`.
  #     The matching app's `[plugins.params.applications."<ns>/<name>"]`
  #     block carries the chart-default base directives + that
  #     Ingress's per-Ingress rules. The plugin routes via the `app=`
  #     SPOE arg below.
  #   - haproxy-ingress-waf.map (populated by haproxy-ingress.yaml's
  #     map-haproxy-ingress-waf-* snippet): `<host><path>` → `deny|detect`
  #     for Ingresses with `haproxy-ingress.github.io/waf`. Drives the
  #     deny-skip predicate below for shadow-mode rollouts.
  #
  # Dispatch fires when either the app or enforcement map matches resource_id.
  # Resources without any matching annotation skip the SPOE roundtrip entirely
  # (matches haproxy-ingress.github.io upstream semantic). The
  # haproxy-ingress.github.io/waf-mode annotation only matters when a
  # `/waf` annotation is also present; without `/waf` the deny rule
  # falls back to its default (deny on rule match).
  #
  # **Behavior change vs pre-multitenant chart:** previously, ANY
  # nginx.ingress.kubernetes.io/modsecurity-snippet anywhere chart-wide
  # caused unconditional dispatch on EVERY request (rules pooled into a
  # single global WAF instance, evaluating against all traffic).
  # That's a privilege-escalation vector in multi-tenant clusters.
  # Now, modsec-snippets only fire on traffic owned by their carrying
  # Ingress (resource_id keying). Operators who depended on the
  # rule-bleed behavior must move shared rules into chart-level
  # `spoaHub.plugins.coraza.directives` (the base ruleset, applied to
  # every per-Ingress app + the default WAF).
  #
  # Priority 050 runs the WAF pass BEFORE the external-auth subrequest
  # at priority 100 — standard "WAF first, auth second" pipeline. Emits
  # nothing unless `check-request` is in the chart's messages union
  # (i.e. coraza is enabled).
  frontend-spoe-filters-050-coraza:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-request" %}
      {%- var dispatchMode = extraContext | dig_string("opt-in", "waf", "dispatch", "mode") %}
      {%- var defaultEnforcement = extraContext | dig_string("deny", "waf", "dispatch", "defaultEnforcement") %}
      {%- var corazaBodyWaitTimeout = extraContext | dig_string("100ms", "waf", "policies", "requestBody", "waitTimeout") %}
      {%- if dispatchMode != "opt-in" && dispatchMode != "default-on" %}
        {%- fail("Invalid WAF dispatch mode '" + dispatchMode + "'; set controller.config.templatingSettings.extraContext.waf.dispatch.mode in Helm values or spec.templatingSettings.extraContext.waf.dispatch.mode in a raw HAProxyTemplateConfig to 'opt-in' or 'default-on'.") %}
      {%- end %}
      {%- if defaultEnforcement != "deny" && defaultEnforcement != "detect" %}
        {%- fail("Invalid WAF default enforcement '" + defaultEnforcement + "'; set controller.config.templatingSettings.extraContext.waf.dispatch.defaultEnforcement in Helm values or spec.templatingSettings.extraContext.waf.dispatch.defaultEnforcement in a raw HAProxyTemplateConfig to 'deny' or 'detect'.") %}
      {%- end %}
      {%- if !regex_search(corazaBodyWaitTimeout, "^[1-9][0-9]*(us|ms|s|m|h|d)?$") %}
        {%- fail("extraContext.waf.policies.requestBody.waitTimeout must be a positive HAProxy duration.") %}
      {%- end %}
      http-request set-var(txn.coraza_app) var(txn.resource_id),map({{ pathResolver.GetPath("coraza-app.map", "map") }}) unless { var(txn.coraza_app) -m found }
      http-request set-var(txn.coraza_mode) var(txn.resource_id),map({{ pathResolver.GetPath("haproxy-ingress-waf.map", "map") }}) unless { var(txn.coraza_mode) -m found }
      http-request set-var(txn.coraza_body_cfg) var(txn.resource_id),map({{ pathResolver.GetPath("coraza-body.map", "map") }}) unless { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_body_policy) var(txn.coraza_body_cfg),field(1,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_content_policy) var(txn.coraza_body_cfg),field(2,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_max_body) var(txn.coraza_body_cfg),field(3,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_body_mode) str(none)
      http-request set-var(txn.coraza_body_complete) bool(false)
      http-request set-var(txn.coraza_detect_only) bool(false)
      http-request set-var(txn.coraza_active) bool(false)
      {%- if dispatchMode == "default-on" %}
      http-request set-var(txn.coraza_disabled) var(txn.resource_id),map({{ pathResolver.GetPath("coraza-disabled.map", "map") }}) unless { var(txn.coraza_disabled) -m found }
      http-request set-var(txn.coraza_mode) str({{ defaultEnforcement }}) unless { var(txn.coraza_mode) -m found }
      http-request set-var(txn.coraza_active) bool(true) unless { var(txn.coraza_disabled) -m found }
      {%- else %}
      http-request set-var(txn.coraza_active) bool(true) if { var(txn.coraza_app) -m found } || { var(txn.coraza_mode) -m found }
      {%- end %}
      http-request set-var(txn.coraza_body_mode) str(buffered) if { var(txn.coraza_active) -m bool } { var(txn.coraza_body_policy) -m str buffered } { method POST PUT PATCH DELETE }
      http-request set-var(txn.coraza_detect_only) bool(true) if { var(txn.coraza_active) -m bool } { var(txn.coraza_mode) -m str detect }
      {#- Buffered profiles inspect a bounded complete body. A chunked/streaming
          request (Transfer-Encoding, no Content-Length) cannot prove
          completeness from req.body and is rejected 411 — but a request with
          NO body (neither header, e.g. an ordinary DELETE or empty POST) has
          an empty complete body and is passed through to Coraza, not rejected.
          The Content-Type check tolerates the RFC 9110 optional whitespace
          before the parameter `;`. All body-contract rejections are skipped in
          detect (shadow) mode: a detect policy observes without blocking live
          traffic; truncated/uninspectable bodies simply aren't inspected. -#}
      http-request return status 415 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_content_policy) -m str json } { req.hdr(Content-Length) -m found } !{ req.hdr(Content-Type),field(1,';'),lower -m reg ^application/([a-z0-9.+-]+\+)?json[[:space:]]*$ }
      http-request return status 400 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr_cnt(Content-Length) gt 1 }
      http-request return status 411 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr(Transfer-Encoding) -m found } !{ req.hdr(Content-Length) -m found }
      http-request set-var(txn.coraza_body_size) req.body_size if { var(txn.coraza_body_mode) -m str buffered }
      http-request return status 413 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_size),sub(txn.coraza_max_body) -m int gt 0 }
      http-request wait-for-body time {{ corazaBodyWaitTimeout }} if { var(txn.coraza_body_mode) -m str buffered }
      http-request set-var(txn.coraza_body_len) req.body_len if { var(txn.coraza_body_mode) -m str buffered }
      http-request return status 413 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_len),sub(txn.coraza_body_size) -m int lt 0 }
      http-request set-var(txn.coraza_body_complete) bool(true) if { var(txn.coraza_body_mode) -m str buffered }
      http-request send-spoe-group spoa-hub check-request-group if { var(txn.coraza_active) -m bool }
      {#- Hub admission and plugin engine failures fail closed in both enforce
          and detect modes. Detect-only coercion happens inside Coraza only for
          completed rule decisions, never for infrastructure errors. -#}
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m found }
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m str ok }
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.action) -m found }
      http-request return status 400 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 400 }
      http-request return status 413 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 413 }
      http-request return status 503 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 500:599 }
      http-request deny deny_status 403 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.action) -m str allow }
      {%- end %}

  # External-auth wiring: looks up the per-ingress auth URL in
  # auth-url.map (populated by ingress libraries from their auth-url
  # annotation), triggers the SPOE check, and denies on failure.
  # Conditional on `check-auth` being in the chart's messages union —
  # only emits when the external-auth plugin is enabled.

  frontend-spoe-filters-100-external-auth:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-auth" %}
      http-request set-var(txn.auth_url) var(txn.resource_id),map({{ pathResolver.GetPath("auth-url.map", "map") }}) unless { var(txn.auth_url) -m found }
      http-request set-var(txn.auth_signin) var(txn.resource_id),map({{ pathResolver.GetPath("auth-signin.map", "map") }}) unless { var(txn.auth_signin) -m found }
      http-request set-var(txn.auth_method) var(txn.resource_id),map({{ pathResolver.GetPath("auth-method.map", "map") }}) unless { var(txn.auth_method) -m found }
      http-request set-var(txn.auth_forward_headers) var(txn.resource_id),map({{ pathResolver.GetPath("auth-forward-headers.map", "map") }}) unless { var(txn.auth_forward_headers) -m found }
      http-request set-var(txn.auth_extract_headers) var(txn.resource_id),map({{ pathResolver.GetPath("auth-extract-headers.map", "map") }}) unless { var(txn.auth_extract_headers) -m found }
      http-request send-spoe-group spoa-hub check-auth-group if { var(txn.auth_url) -m found }
      {#- Pass-headers extension point: ingress libraries emit one
          `http-request set-header` per unique header in any
          ingress's auth-response-headers / auth-headers-succeed union.
          Each line is gated on `allowed -m bool` (only on auth
          success) and `var ... -m found` (only when the plugin
          actually extracted that header). Empty when no ingress
          uses the annotation. The `{{ "\n" }}` after the glob
          emits a literal newline regardless of whether the glob
          matched anything — without it, when the glob is empty the
          adjacent `{#- ... -#}` trim markers collapse the
          send-spoe-group line into the redirect line. -#}
      {{- render_glob "frontend-spoe-set-pass-headers-*" }}{{ "\n" }}
      {#- Browser-friendly sign-in redirect on auth failure: if the
          ingress has `auth-signin`, redirect to it (302) instead of
          denying. The deny rule below still fires when auth-signin
          isn't configured, preserving the API-friendly default. -#}
      http-request redirect location %[var(txn.auth_signin)] code 302 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.auth_signin) -m found }
      http-request deny deny_status 401 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool }
      {#- Fail-headers extension point: ingress libraries emit one
          `http-after-response set-header` per unique header in any
          ingress's auth-headers-fail union. Runs on the deny
          response (and only that — the conditions gate on the
          auth path having run AND not allowed AND the per-header
          var being set). `http-after-response` rather than
          `http-response` because HAProxy's `http-request deny`
          short-circuits the request flow, generating its 401 reply
          internally; `http-response` rules only fire on responses
          received from a backend, so they'd silently skip the deny
          path. Empty when no ingress uses the annotation. Same
          trailing-newline trick as the pass-headers glob. -#}
      {{- render_glob "frontend-spoe-set-fail-headers-*" }}{{ "\n" }}
      {%- end %}

  # API-gateway request validation. Resolves the per-route schema rule from
  # request-schema.map (populated by haptic-annotations), rejects oversized
  # bodies before the SPOE call, waits for a body only on matching validation
  # routes, sends bounded request bodies to the api-gateway plugin, and fails
  # closed when the plugin denies or returns no verdict.
  #
  # Priority 200 runs after auth (100) and the source-IP shared limiter (025):
  # cheap public-edge rejection happens before JSON parsing/schema validation
  # under DoS. Consumer quotas run in the selected backend after native auth.
  frontend-spoe-filters-200-request-validation:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "validate-request" %}
      {%- var requestValidationWaitTimeout = extraContext | dig_string("100ms", "apiGateway", "requestSchemaValidation", "requestBody", "waitTimeout") %}
      {%- if !regex_search(requestValidationWaitTimeout, "^[1-9][0-9]*(us|ms|s|m|h|d)?$") %}
        {%- fail("extraContext.apiGateway.requestSchemaValidation.requestBody.waitTimeout must be a positive HAProxy duration.") %}
      {%- end %}
      {#- Packed map keyed by resource_id →
          "schema_id max_body_bytes fail_open content_types". Validation only
          applies to body-carrying methods; routes without a schema map entry
          skip the lookup results and SPOE roundtrip. -#}
      http-request set-var(txn.req_schema_cfg) var(txn.resource_id),map({{ pathResolver.GetPath("request-schema.map", "map") }}) unless { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_id) var(txn.req_schema_cfg),field(1,' ') if { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_max_body) var(txn.req_schema_cfg),field(2,' ') if { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_fail_open) var(txn.req_schema_cfg),field(3,' ') if { var(txn.req_schema_cfg) -m found }
      http-request return status 400 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { req.hdr_cnt(Content-Length) gt 1 }
      http-request return status 411 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ req.hdr(Content-Length) -m found }
      http-request set-var(txn.req_schema_body_size) req.body_size if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_size),sub(txn.req_schema_max_body) -m int gt 0 }
      http-request wait-for-body time {{ requestValidationWaitTimeout }} if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request set-var(txn.req_schema_body_len) req.body_len if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_len),sub(txn.req_schema_body_size) -m int lt 0 }
      http-request send-spoe-group spoa-hub validate-request-group if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      {#- Missing verdicts fail closed unless the route explicitly set
          request-schema-fail-open=true. This covers hub/plugin timeout or
          unavailability. Plugin-returned schema_not_found obeys the same
          fail-open knob inside the plugin and returns allowed=true when open. -#}
      http-request return status 422 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.req_schema_fail_open) -m str true }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str body_too_large }
      http-request return status 415 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str unsupported_media_type }
      http-request return status 422 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.hub.api_gateway.allowed) -m bool }
      {%- end %}

  # Fire the single mirror SPOE group once per request — the last frontend
  # filter (priority 950), after every mirror source has appended its target
  # entry to txn.gw_mirror_targets (gateway RequestMirror filters at 550, the
  # mirror-target Ingress annotation libraries at 555/820). HAProxy SPOE only
  # processes each group once per stream, but a single `mirror-group` carries
  # ALL targets: the mirror message's arg_targets is the whole list, and the
  # plugin fans out to each entry. So one static message + one group cover
  # every mirror in the cluster — adding a target never changes spoe.conf or
  # the hub TOML, only the frontend append above. The fire must come after all
  # appends, since send-spoe-group captures arg_targets at its position.
  #
  # Resource-agnostic (reads one variable, fires one group). Gated on "mirror"
  # being in the SPOE messages union — the same condition spoe-conf-content uses
  # to declare `mirror-group`, so the reference always resolves (a test that
  # overrides extraContext.spoaHub.haproxy.messages without "mirror" gets no fire
  # and no dangling group). The `-m found` guard makes it a no-op for requests
  # that matched no mirror source.
  frontend-filters-950-spoa-hub-mirror-fire:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "mirror" %}
      # spoa-hub/mirror: dispatch every appended target from one NOTIFY
      http-request send-spoe-group spoa-hub mirror-group if { var(txn.gw_mirror_targets) -m found }
      {%- end %}
