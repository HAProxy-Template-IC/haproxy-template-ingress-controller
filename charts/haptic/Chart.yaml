apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
version: 0.2.0-alpha.1
appVersion: "0.2.0-alpha.1"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (templates/_libraries.tpl). base/ssl/ingress are core
# (always present, in the parent's libraries/).
dependencies:
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.2.0-alpha.1-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.2.0-alpha.1
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Changelog — summary of the most recently shipped release (0.2.0-alpha.1).
  # See CHANGELOG.md at the repo root for the full record (chart changes live
  # under each release's "Helm chart" subsection), including the [Unreleased]
  # entries that will land in the next release.
  artifacthub.io/changes: |
    - kind: added
      description: HAProxy 3.4 support; a runtime fast path applies endpoint, map, and TLS-certificate changes to live HAProxy workers without a reload
    - kind: added
      description: nginx-ingress template library for nginx.ingress.kubernetes.io annotation compatibility
    - kind: added
      description: SPOA hub sidecar with eight plugins (API gateway, WAF, external auth, request mirroring, fingerprinting, MaxMind, rate limiting, SSO)
    - kind: added
      description: Extended Gateway API support (TLSRoute, TCPRoute, RequestMirror, static addresses, ListenerSet, session persistence)
    - kind: added
      description: The config's embedded validationTests are enforced at admission, at startup, and on every config change
    - kind: changed
      description: "BREAKING: ingressClass/gatewayClass default names change from haproxy to haptic, pod-spec values move under podSpec blocks, and routing.regexMatchOrder replaces the path-regex-last library"
    - kind: changed
      description: The gateway library resolves Gateway API versions at runtime — installing or upgrading Gateway API CRDs activates support without helm upgrade
    - kind: security
      description: Annotation values interpolated into the HAProxy config are validated against strict charsets, closing a config-injection vector

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/dev/
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
