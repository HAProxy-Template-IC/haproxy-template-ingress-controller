apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
version: 0.1.0
appVersion: "0.1.0"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (templates/_libraries.tpl). base/ssl/ingress are core
# (always present, in the parent's libraries/).
dependencies:
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.1.0-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Changelog — summary of the most recently shipped release (0.1.0).
  # See CHANGELOG.md at the repo root for the full record (chart changes live
  # under each release's "Helm chart" subsection), including the [Unreleased]
  # entries that will land in the next release.
  artifacthub.io/changes: |
    - kind: added
      description: Initial Helm chart deploying the controller and HAProxy pods with leader election and a default NetworkPolicy
    - kind: added
      description: Modular template library system (base / ssl / ingress / gateway / haproxytech / haproxy-ingress / nginx-ingress)
    - kind: added
      description: Gateway API and Ingress status reporting (LoadBalancer addresses propagated to .status)

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://gitlab.com/haproxy-haptic/haptic#readme
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
