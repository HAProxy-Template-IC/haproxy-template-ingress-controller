apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
# The HAProxy pod's helper containers are native sidecars (initContainers with
# restartPolicy: Always), GA in 1.33: they start before HAProxy and are stopped
# only after it exited, so the drain socket, SPOE and log shipping outlive it.
kubeVersion: ">=1.33.0-0"
version: 0.2.2
appVersion: "0.2.2"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (charts/helm-helpers/templates/_libraries.tpl). Every library is a subchart,
# including base/kubernetes-backends/ssl/ingress; spoa-hub carries no condition because its enable
# predicate is an `or` over a template helper, which a Helm condition cannot
# express — its own _helm_load.enable still gates it.
dependencies:
  - name: helm-helpers
    version: 0.1.0
  - name: base
    version: 0.1.0
    condition: controller.templateLibraries.base.enabled
  - name: kubernetes-backends
    version: 0.1.0
    condition: controller.templateLibraries.kubernetesBackends.enabled
  - name: ssl
    version: 0.1.0
    condition: controller.templateLibraries.ssl.enabled
  - name: ingress
    version: 0.1.0
    condition: controller.templateLibraries.ingress.enabled
  - name: ingress-annotations-compat
    version: 0.1.0
    condition: controller.templateLibraries.ingressAnnotationsCompat.enabled
  - name: governance
    version: 0.1.0
    condition: controller.templateLibraries.governance.enabled
  # No condition: spoa-hub's enable predicate is
  # `or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .)`,
  # and Helm's condition: accepts only a values path. Gating on the flag alone
  # empties `backend spoa-hub` on the default profile, where the helper is what
  # turns the library on. The library's own _helm_load.enable still gates it.
  - name: spoa-hub
    version: 0.1.0
  - name: http-policies
    version: "0.1.0"
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: gateway-policies
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: custom-crd-example
    version: 0.1.0
    condition: controller.templateLibraries.customCrdExample.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.2.2-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.2.2
      platforms:
        - linux/amd64
        - linux/arm64
    - name: varnish
      image: registry.gitlab.com/haproxy-haptic/haptic/varnish:0.2.2
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Release highlights; full notes are in the root CHANGELOG.md.
  artifacthub.io/changes: |
    - kind: added
      description: HTTP/3 (QUIC) on every TLS-terminating HTTPS listener, on by default; the HAProxy and Gateway Services gain a UDP port
    - kind: added
      description: nginx-ingress custom-http-errors, proxy-request-buffering, limit-burst-multiplier, affinity-mode and auth-tls-match-cn annotations, plus Warning Events for unknown annotations and oversized response headers
    - kind: changed
      description: "BREAKING: rename extraContext timeout_* keys to camelCase and ssl_redirect_default to the boolean sslRedirectDefault; old keys fail the install"
    - kind: changed
      description: "BREAKING: hapticHstsMaxAge is replaced by tls.hsts.maxAge, so the haproxy-haptic.org/hsts default max-age drops to one year"
    - kind: security
      description: "BREAKING: basic-auth Secrets accept only bcrypt, SHA-256/SHA-512 crypt and yescrypt hashes by default"
    - kind: security
      description: "BREAKING: host alias regexes match the whole hostname and never Gateway listeners, exact aliases must be hostnames, and an older Ingress keeps a contested alias host"
    - kind: changed
      description: "BREAKING: validationTest assertions no longer see your extraContext; fixtures also render with it and must pass haproxy -c"
    - kind: changed
      description: "BREAKING for Varnish users: the bundled non-root Varnish image needs the IPC_LOCK capability"
    - kind: removed
      description: "BREAKING: http.Fetch option delay, the strings_replace function, one-argument trim, and the haptic_events_dropped_total metric"
    - kind: changed
      description: Response headers the chart adds are set with http-after-response, so HAProxy-generated error pages carry them too
    - kind: fixed
      description: A configuration that keeps failing to load no longer denies admission cluster-wide; controllers probe readiness on /readyz and liveness on /livez
    - kind: fixed
      description: nginx-ingress use-regex and rewrite-target match regex paths case-insensitively and substitute capture groups
    - kind: fixed
      description: Leader lease released on shutdown during a configuration hand-over, and the first render after startup waits for every watched resource
    - kind: fixed
      description: Endpoint changes reach HAProxy without 503s during rolling restarts, and renders scale linearly with the number of watched resources

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/0.2.2/
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
