apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
# The HAProxy pod's helper containers are native sidecars (initContainers with
# restartPolicy: Always), GA in 1.33: they start before HAProxy and are stopped
# only after it exited, so the drain socket, SPOE and log shipping outlive it.
kubeVersion: ">=1.33.0-0"
version: 0.2.0-alpha.3
appVersion: "0.2.0-alpha.3"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (charts/helm-helpers/templates/_libraries.tpl). Every library is a subchart,
# including base/kubernetes-backends/ssl/ingress; spoa-hub carries no condition because its enable
# predicate is an `or` over a template helper, which a Helm condition cannot
# express — its own _helm_load.enable still gates it.
dependencies:
  - name: helm-helpers
    version: 0.1.0
  - name: base
    version: 0.1.0
    condition: controller.templateLibraries.base.enabled
  - name: kubernetes-backends
    version: 0.1.0
    condition: controller.templateLibraries.kubernetesBackends.enabled
  - name: ssl
    version: 0.1.0
    condition: controller.templateLibraries.ssl.enabled
  - name: ingress
    version: 0.1.0
    condition: controller.templateLibraries.ingress.enabled
  - name: ingress-annotations-compat
    version: 0.1.0
    condition: controller.templateLibraries.ingressAnnotationsCompat.enabled
  - name: governance
    version: 0.1.0
    condition: controller.templateLibraries.governance.enabled
  # No condition: spoa-hub's enable predicate is
  # `or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .)`,
  # and Helm's condition: accepts only a values path. Gating on the flag alone
  # empties `backend spoa-hub` on the default profile, where the helper is what
  # turns the library on. The library's own _helm_load.enable still gates it.
  - name: spoa-hub
    version: 0.1.0
  - name: http-policies
    version: "0.1.0"
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: gateway-policies
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: custom-crd-example
    version: 0.1.0
    condition: controller.templateLibraries.customCrdExample.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.2.0-alpha.3-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.2.0-alpha.3
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Release highlights; full notes are in the root CHANGELOG.md.
  artifacthub.io/changes: |
    - kind: added
      description: Agent certificates renew automatically, externally managed credentials support GitOps, and haptic doctor checks the live fleet
    - kind: fixed
      description: Gateway route and backend TLS policy status updates preserve other controllers' entries during concurrent updates
    - kind: added
      description: The HAPTIC agent applies eligible routing and certificate changes at runtime, including dynamic backends on HAProxy 3.4
    - kind: added
      description: Pre-rollout validation checks the complete configuration before applying release objects
    - kind: added
      description: Native annotations provide shared rate limiting, Varnish caching, opt-in response compression, request-schema validation and reusable WAF policies
    - kind: added
      description: Vector supplies structured access logs, request metrics and optional distributed tracing
    - kind: changed
      description: Incremental rendering, warm followers and shared resource storage reduce repeated work and memory use
    - kind: changed
      description: "BREAKING: Kubernetes 1.33 or newer is required for native sidecars and graceful HAProxy shutdown"
    - kind: changed
      description: "BREAKING: migrate controller workload values under controller, dataplane settings to haproxy.agent, and certificate settings to defaultSSLCertificate"
    - kind: changed
      description: "BREAKING: vendor annotation libraries require explicit enablement and access logs use JSON"
    - kind: changed
      description: "BREAKING: the haptic binary and agent replace haptic-controller and the Data Plane API; configuration libraries are separate resources"
    - kind: added
      description: Gateway API adds TLSRoute, TCPRoute, ListenerSet, backend TLS, frontend client authentication and request mirroring
    - kind: security
      description: Route and annotation validation prevents configuration injection, and management ports have restricted network access

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/0.2.0-alpha.3/
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
