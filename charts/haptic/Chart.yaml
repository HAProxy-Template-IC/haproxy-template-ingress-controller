apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
version: 0.2.0-alpha.1
appVersion: "0.2.0-alpha.1"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (templates/_libraries.tpl). Every library is a subchart,
# including base/kubernetes-backends/ssl/ingress; spoa-hub carries no condition because its enable
# predicate is an `or` over a template helper, which a Helm condition cannot
# express — its own _helm_load.enable still gates it.
dependencies:
  - name: base
    version: 0.1.0
    condition: controller.templateLibraries.base.enabled
  - name: kubernetes-backends
    version: 0.1.0
    condition: controller.templateLibraries.kubernetesBackends.enabled
  - name: ssl
    version: 0.1.0
    condition: controller.templateLibraries.ssl.enabled
  - name: ingress
    version: 0.1.0
    condition: controller.templateLibraries.ingress.enabled
  - name: ingress-annotations-compat
    version: 0.1.0
    condition: controller.templateLibraries.ingressAnnotationsCompat.enabled
  - name: governance
    version: 0.1.0
    condition: controller.templateLibraries.governance.enabled
  # No condition: spoa-hub's enable predicate is
  # `or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .)`,
  # and Helm's condition: accepts only a values path. Gating on the flag alone
  # empties `backend spoa-hub` on the default profile, where the helper is what
  # turns the library on. The library's own _helm_load.enable still gates it.
  - name: spoa-hub
    version: 0.1.0
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: custom-crd-example
    version: 0.1.0
    condition: controller.templateLibraries.customCrdExample.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.2.0-alpha.1-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.2.0-alpha.1
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Changelog — hand-curated summary of the changes staged for the next release
  # (the [Unreleased] section of CHANGELOG.md). Updated during release curation
  # ahead of the version bump. See CHANGELOG.md at the repo root for the full
  # record; chart changes live under each release's "Helm chart" subsection.
  artifacthub.io/changes: |
    - kind: added
      description: The HAPTIC agent runs as each HAProxy pod's agent container and applies map entries, certificates, crt-lists and server address/weight/state to the running worker with no reload
    - kind: added
      description: On HAProxy 3.4, adding or removing a route (Ingress, HTTPRoute or custom CRD) with a dynamic-shaped backend and map-driven per-route logic deploys without a reload; on 3.0-3.3 servers are still added and removed at runtime
    - kind: added
      description: Per-route logic (header modifiers, redirects, URL rewrites, timeouts, mirrors) is driven by map files, so changing it is a runtime map update rather than a reload
    - kind: added
      description: "haptic diff predicts whether a change will reload before it is applied; haptic agent state prints one pod's applied, running and last-known-good plan"
    - kind: changed
      description: "BREAKING: the HAProxy pod's dataplane container is now the agent (haproxy.dataplane.* values move to haproxy.agent.*), and the controller binary is haptic (was haptic-controller)"
    - kind: changed
      description: Backends hold one server per endpoint named after the pod, and hash-family load balancing defaults to hash-type consistent so pod churn stays reload-free
    - kind: changed
      description: The watcher debounce default is 100ms (was 2s), since reload pacing now lives in the agent
    - kind: removed
      description: "BREAKING: the HAProxy Data Plane API and its per-version clients, plus the SRV_N server-slot pool, pod-names.map and the serverSlots/scale-server-slots knobs"

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/dev/
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
