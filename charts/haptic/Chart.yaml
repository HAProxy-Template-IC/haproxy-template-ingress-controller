apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
# The HAProxy pod's helper containers are native sidecars (initContainers with
# restartPolicy: Always), GA in 1.33: they start before HAProxy and are stopped
# only after it exited, so the drain socket, SPOE and log shipping outlive it.
kubeVersion: ">=1.33.0-0"
version: 0.4.0
appVersion: "0.4.0"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (charts/helm-helpers/templates/_libraries.tpl). Every library is a subchart,
# including base/kubernetes-backends/ssl/ingress; spoa-hub carries no condition because its enable
# predicate is an `or` over a template helper, which a Helm condition cannot
# express — its own _helm_load.enable still gates it.
dependencies:
  - name: helm-helpers
    version: 0.1.0
  - name: base
    version: 0.1.0
    condition: controller.templateLibraries.base.enabled
  - name: kubernetes-backends
    version: 0.1.0
    condition: controller.templateLibraries.kubernetesBackends.enabled
  - name: ssl
    version: 0.1.0
    condition: controller.templateLibraries.ssl.enabled
  - name: ingress
    version: 0.1.0
    condition: controller.templateLibraries.ingress.enabled
  - name: ingress-annotations-compat
    version: 0.1.0
    condition: controller.templateLibraries.ingressAnnotationsCompat.enabled
  - name: governance
    version: 0.1.0
    condition: controller.templateLibraries.governance.enabled
  # No condition: spoa-hub's enable predicate is
  # `or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .)`,
  # and Helm's condition: accepts only a values path. Gating on the flag alone
  # empties `backend spoa-hub` on the default profile, where the helper is what
  # turns the library on. The library's own _helm_load.enable still gates it.
  - name: spoa-hub
    version: 0.1.0
  - name: http-policies
    version: "0.1.0"
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: gateway-policies
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: custom-crd-example
    version: 0.1.0
    condition: controller.templateLibraries.customCrdExample.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://gitlab.com/haproxy-haptic/haptic
sources:
  - https://gitlab.com/haproxy-haptic/haptic
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: registry.gitlab.com/haproxy-haptic/haptic:0.4.0-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:0.4.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: varnish
      image: registry.gitlab.com/haproxy-haptic/haptic/varnish:0.4.0
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Release highlights; full notes are in the root CHANGELOG.md.
  artifacthub.io/changes: |
    - kind: fixed
      description: Invalid watched resources no longer block independent endpoint updates and admission requests
    - kind: added
      description: Gateway HTTPRoute ExternalAuth filters through the SPOA hub HTTP auth plugin
    - kind: added
      description: Gateway header session persistence, permanent cookies, and weighted TLSRoute backends
    - kind: added
      description: Governance rules can include or exempt specific namespaces
    - kind: changed
      description: "BREAKING: Helm rejects unknown or wrongly typed values; check the 0.4 upgrade notes before upgrading"
    - kind: changed
      description: "BREAKING: Gateway timeouts.request is ignored; backendRequest sets server inactivity, and zero uses the maximum timeout"
    - kind: changed
      description: "BREAKING: auth-headers-request rejects header names containing underscores; rename them with dashes"
    - kind: fixed
      description: External auth forwards dashed request headers, including X-Api-Key and the default X-Forwarded headers
    - kind: fixed
      description: Large controller restarts use less memory and complete their first render even when it exceeds the regular render timeout
    - kind: fixed
      description: HTTP content acceptance progresses under resource churn and restores prior content when deployment validation refuses new content
    - kind: changed
      description: Auxiliary-file publication reuses unchanged objects and pod-status entries to reduce Kubernetes API writes
    - kind: fixed
      description: Gateway retry and session policies apply to their own route rule, with unsupported retry settings reported on the route
    - kind: security
      description: The pre-rollout validation values Secret omits generated agent credentials and the webhook private key
  artifacthub.io/containsSecurityUpdates: "true"

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/0.4.0/
    - name: Issue Tracker
      url: https://gitlab.com/haproxy-haptic/haptic/-/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
