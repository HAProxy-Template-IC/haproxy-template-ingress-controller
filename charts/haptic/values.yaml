# Default values for haptic.
#
# Port architecture: Container ports (*.ports.*) are the source of truth.
# Services reference them by name (targetPort: http). See README for details.

# Common labels added to all resources
# These are merged with chart-defined labels
commonLabels: {}
# environment: production
# team: platform

# Common annotations added to all resources
commonAnnotations: {}
# config.kubernetes.io/managed-by: helm

# HAProxy version - selects the major.minor series for both controller and HAProxy pod images
# Controller image suffix: registry.gitlab.com/haproxy-haptic/haptic:0.1.0-haproxy3.2
# HAProxy pod image: haproxytech/haproxy-debian:<patch from haproxyPatchVersions[<series>]>
# Must match a version built by CI (see versions.env for supported versions).
# Not Renovate-managed: cutting over to a new series is an operational decision
# (must also update Chart.yaml artifacthub annotation and dev-env manifests to match).
haproxyVersion: "3.2"

# Latest tested patch versions for each supported HAProxy major.minor.
# Used as the default HAProxy pod image tag unless haproxy.image.tag is set.
# Renovate updates each entry to the latest patch within its own series (the
# series clamp is derived from the map key by the custom manager in
# renovate.json, so adding or removing a series needs no config change).
haproxyPatchVersions:
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.0": "3.0.23"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.1": "3.1.17"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.2": "3.2.19"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.3": "3.3.10"

# Latest tested revision tags for each supported HAProxy Enterprise major.minor.
# Enterprise uses HAProxy's revision scheme (e.g. 3.2r1, 3.2r2).
# See https://www.haproxy.com/documentation/haproxy-enterprise/release-notes/ for new revisions.
# Updated manually during chart releases.
haproxyEnterprisePatchVersions:
  "3.0": "3.0r1"
  "3.1": "3.1r1"
  "3.2": "3.2r1"
  "3.3": ""

# Replica count for controller
# Default: 2 replicas for high availability with leader election
# Only the leader replica deploys configs; followers remain ready for failover
replicaCount: 2
# Controller image configuration
image:
  repository: registry.gitlab.com/haproxy-haptic/haptic
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""
nameOverride: ""
fullnameOverride: ""
# Controller configuration
controller:
  # Name of the HAProxyTemplateConfig CRD
  # This is the name of the HAProxyTemplateConfig custom resource
  crdName: haptic-config
  # Introspection HTTP server port
  # Provides /healthz, /debug/vars, and /debug/pprof endpoints
  # Health checks use this port (see controller.ports.healthz)
  # Access via: kubectl port-forward pod/controller-xxx 8080:8080
  debugPort: 8080
  # Initial log level for the controller
  # Values: TRACE, DEBUG, INFO, WARN, ERROR (case-insensitive)
  # This sets the LOG_LEVEL environment variable
  # Can be overridden at runtime via controller.config.logging.level
  logLevel: INFO
  # Controller container ports
  # These are the ports the controller container listens on
  # Services and health probes reference these by name
  ports:
    healthz: 8080 # Health check endpoint
    metrics: 9090 # Prometheus metrics endpoint
    webhook: 9443 # Admission webhook HTTPS endpoint
  # Template libraries
  # Control which predefined template libraries to include.
  # Merge order is fixed by templates/_libraries.tpl (haptic.mergeLibraries) and
  # documented in docs/template-libraries.md; later libraries override earlier
  # ones, and user-provided controller.config always wins.
  # Each library can define its own watched resources (conditionally included when enabled)
  templateLibraries:
    # Base library: Resource-agnostic core configuration
    # Provides generic HAProxy configuration, error pages, and plugin orchestration
    # Uses resource_* patterns to discover and include resource-specific implementations
    base:
      enabled: true
    # SSL library: SSL/TLS infrastructure and certificate management
    # Provides HTTPS frontend, SSL passthrough infrastructure, and default certificate loading
    # Watched resources: secrets (for SSL certificate loading)
    # Features: HTTPS termination, SSL passthrough (coordinated with resource libraries)
    ssl:
      enabled: true
    # Ingress library: Kubernetes Ingress resource support
    # Provides routing and backend management for networking.k8s.io/v1 Ingress resources
    # Implements resource_ingress_* plugin interface (backends, maps, routing logic)
    # Watched resources: ingresses (filtered by spec.ingressClassName)
    ingress:
      enabled: true
    # Gateway library: Kubernetes Gateway API support
    # Provides routing for gateway.networking.k8s.io/v1 resources (HTTPRoute, GRPCRoute)
    # Implements resource_gateway_* plugin interface
    # Watched resources: httproutes, grpcroutes
    # Features: Path matching, header matching, traffic splitting, host-based routing
    gateway:
      enabled: true
    # Annotation-compat scaffold: shared HAProxy output macros and utility
    # snippets consumed by the vendor-specific annotation libraries below.
    # Sits at hierarchy level 2.5 — currently provides one macro for the
    # SSL-passthrough annotation scan and one for CIDR allow/deny ACL
    # emission, both shared across haproxytech / haproxy-ingress /
    # nginx-ingress. See docs/adr/0003-annotation-compat-scaffold-level-2-5.md
    annotationCompat:
      enabled: true
    # HAProxyTech library: haproxy.org/* annotation compatibility
    # Covers basic auth, allow/deny lists, SSL redirect, SSL passthrough, CORS,
    # cookie persistence, server SSL/mTLS, timeouts, health checks, rate
    # limiting, header rewriting, and per-backend snippet injection. See
    # docs/libraries/haproxytech.md for the per-annotation reference.
    # Reference: https://github.com/haproxytech/kubernetes-ingress
    haproxytech:
      enabled: true
    # HAProxy Ingress library: haproxy-ingress.github.io/* annotation compatibility
    # Covers the same feature areas as the haproxytech library plus path-type
    # (regex), HSTS, external auth (via the SPOA hub), and incoming client
    # mTLS — see docs/libraries/haproxy-ingress.md for the per-annotation
    # reference (~50+ annotations).
    # Reference: https://haproxy-ingress.github.io/docs/configuration/keys/
    haproxyIngress:
      enabled: true
    # Nginx Ingress library: nginx.ingress.kubernetes.io annotation compatibility
    # Provides migration support from nginx-ingress to HAPTIC
    # Supports: timeouts, load balancing, SSL redirect, CORS, auth, rate limiting, canary, and more
    # Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
    nginxIngress:
      enabled: false
    # SPOA hub library: HAProxy-side wiring for the bundled spoa-hub sidecar
    # Provides the `backend spoa-hub` block, the `filter spoe engine` directive
    # in frontends, and registers the `spoe.conf` general file so vendor
    # annotation libraries can plug into the SPOE message lifecycle (e.g.
    # nginx-ingress / haproxy-ingress wire `auth-url` / `auth-signin` /
    # `auth-method` annotations through the external-auth plugin).
    # Reads its config from templatingSettings.extraContext.spoaHub, which the
    # chart populates from the values.yaml `spoaHub:` block.
    # Auto-enabled by haptic.mergeLibraries when the sidecar is on (any plugin
    # enabled, or `spoaHub.enabled: true` set explicitly). Set to true here to
    # force-include the library even with no plugins enabled.
    spoaHub:
      enabled: false
  # Pluggable validator sidecar
  # Runs a second instance of the haproxy-spoa-hub binary alongside the
  # controller pod, in --validate-socket mode. The admission webhook
  # consults it on every Ingress / HTTPRoute change to reject manifests
  # whose plugin TOML (e.g. coraza modsecurity-snippet) is broken before
  # they reach the data plane. Loads the same plugins and config.toml as
  # the HAProxy-side sidecar (so the validator and runtime see identical
  # plugin behavior). Communicates via a Unix socket on a shared emptyDir.
  validators:
    # Master enable. Leave as null to auto-derive from the spoa-hub
    # sidecar's own enable (the typical case — plugins that need
    # admission-time validation are the same plugins that run on the
    # data plane). Set to false to force the validator sidecar off.
    # Set to true to render it even when spoaHub is off (useful for
    # bench/test setups validating template fragments without a
    # data-plane sidecar).
    enabled: null
    # Directory for the validator Unix socket (a shared emptyDir mounted
    # into both the controller container and the validator sidecar).
    socketDir: /var/run/haptic-validators
    # Socket filename. The full path (socketDir + socketName) is what
    # the controller dials and what the chart writes into spec.validators
    # entries below.
    socketName: spoa-hub.sock
    # Resource requests/limits for the validator sidecar. Validation is
    # bursty (admission webhooks are infrequent) so this is sized small.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Container-level securityContext for the validator sidecar.
    # runAsUser=65532 matches the controller's nonroot UID so the Unix
    # socket the sidecar creates under socketDir is readable / writable
    # by the controller without extra fsGroup plumbing.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    # Extra volume mounts added to the validator sidecar only. Useful
    # when a plugin's validate() override needs auxiliary data (e.g.
    # MMDB databases for maxmind, OWASP CRS rule files for coraza).
    # Same shape as spoaHub.extraVolumeMounts.
    extraVolumeMounts: []
    # Entries appended to spec.validators of the rendered
    # HAProxyTemplateConfig. Each entry has the CRD shape:
    #   - name: <unique-name>
    #     socketPath: <unix socket path the controller dials>
    #     files: ["<glob>", ...]   # file paths the controller routes here
    #     timeoutMs: <int>          # optional, default 5000
    #     maxConnections: <int>     # optional, default 4
    # Operators wire their own globs based on which template snippets
    # produce validate-able file content. The chart does NOT auto-inject
    # an entry — supplying a default with empty `files` would fail the
    # CRD's MinItems=1 validation, and the right glob list depends on
    # which plugins the operator actually rendered output for.
    # Example (after enabling coraza in spoaHub.plugins and a template
    # library that emits per-Ingress rule files):
    #   entries:
    #     - name: spoa-hub
    #       socketPath: /var/run/haptic-validators/spoa-hub.sock
    #       files:
    #         - "general/coraza/*.conf"
    entries: []
  # Default SSL Certificate Configuration
  # A default SSL certificate is required for HTTPS traffic.
  #
  # DEFAULT BEHAVIOR (works out of the box with cert-manager):
  # The chart creates a self-signed certificate for localdev.me (dev/test only).
  # For production, override certManager.dnsNames and certManager.issuerRef.
  #
  # Certificate management options:
  #   1. cert-manager (default): Uses self-signed issuer for localdev.me
  #   2. Manual: Set certManager.enabled=false, create TLS Secret externally
  #   3. Inline (testing only): Set create=true with cert/key values
  defaultSSLCertificate:
    # Enable default SSL certificate requirement
    # Set to false to disable HTTPS support (HTTP only mode)
    enabled: true
    # Name of the Kubernetes TLS Secret containing the default certificate
    # When using cert-manager, this is the Secret name that cert-manager will create
    secretName: "default-ssl-cert"
    # Namespace of the TLS Secret
    # Defaults to Release.Namespace if empty
    namespace: ""
    #
    # cert-manager configuration (enabled by default)
    # Requires cert-manager to be installed in the cluster
    # Creates a Certificate resource that provisions the TLS Secret automatically
    certManager:
      enabled: true
      # Create a self-signed Issuer for the certificate
      # When true, the chart creates an Issuer named <release>-ssl-selfsigned
      # When false, you must provide an existing Issuer via issuerRef
      createIssuer: true
      # DNS names for the certificate
      # Default: localdev.me (resolves to 127.0.0.1, useful for local development)
      # PRODUCTION: Override with your actual domain names
      dnsNames:
        - "localdev.me"
        - "*.localdev.me"
      # Issuer reference for cert-manager Certificate resource
      # When createIssuer=true, this is auto-configured to use the self-signed Issuer
      # When createIssuer=false, you must specify an existing Issuer or ClusterIssuer
      issuerRef:
        # Name of the Issuer (auto-set when createIssuer=true)
        name: ""
        kind: Issuer
        # group: cert-manager.io  # Optional, defaults to cert-manager.io
      # Certificate validity duration (default: 1 year for self-signed)
      duration: 8760h # 1 year
      # Renew certificate when this much time is left (default: 30 days)
      renewBefore: 720h # 30 days
    #
    # Manual certificate management
    # Set certManager.enabled=false and create the TLS Secret externally
    #
    # Inline certificate (testing only)
    # WARNING: NOT recommended - embeds secrets in Helm values
    create: false
    # cert: |
    #   -----BEGIN CERTIFICATE-----
    #   MIIDXTCCAkWgAwIBAgIJAKJ... (your certificate)
    #   -----END CERTIFICATE-----
    # key: |
    #   -----BEGIN PRIVATE KEY-----
    #   MIIEvQIBADANBgkqhkiG9w... (your private key)
    #   -----END PRIVATE KEY-----
  # Status patches update Ingress/Gateway resource status with LoadBalancer addresses.
  # Disable during migration from another ingress controller to prevent premature DNS
  # cutover when tools like external-dns watch status fields.
  statusPatches:
    enabled: true
  # Pod-spec scheduling, runtime, and metadata for the controller Deployment.
  # The chart's _pod-spec.tpl helper renders the universally-shared fields
  # (priorityClassName / runtimeClassName / terminationGracePeriodSeconds /
  # dnsPolicy / dnsConfig / hostAliases / topologySpreadConstraints /
  # nodeSelector / affinity / tolerations / imagePullSecrets) from this block.
  # The remaining fields (podAnnotations, podLabels, podSecurityContext) are
  # consumed directly by templates/deployment.yaml, which mixes them with
  # workload-specific data (config checksums, component labels, container UID).
  podSpec:
    # Image pull secrets (private registry access)
    imagePullSecrets: []
    # Pod annotations
    podAnnotations: {}
    # Pod labels
    podLabels: {}
    # Priority class for pod scheduling
    # Used to mark critical workloads for preferential scheduling and preemption
    # Common values:
    #   - system-cluster-critical: Highest priority for cluster infrastructure
    #   - system-node-critical: High priority for node management components
    #   - "" (empty): Default priority (recommended for most deployments)
    # Requires priority class to be pre-created in the cluster
    priorityClassName: ""
    # Topology spread constraints for high availability
    # Controls pod distribution across topology domains (zones, nodes, etc.)
    # Default: [] (empty, user opt-in)
    # Example for zone spreading:
    #   - maxSkew: 1
    #     topologyKey: topology.kubernetes.io/zone
    #     whenUnsatisfiable: DoNotSchedule
    #     labelSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: haptic
    #         app.kubernetes.io/component: controller
    topologySpreadConstraints: []
    # Pod security context
    # Complies with Pod Security Standards (PSS) Restricted profile
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532 # nonroot user
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # Node selector
    nodeSelector: {}
    # Tolerations
    tolerations: []
    # Affinity rules
    affinity: {}
    # Termination grace period in seconds
    terminationGracePeriodSeconds: 30
    # DNS policy (ClusterFirst, ClusterFirstWithHostNet, Default, None)
    dnsPolicy: ClusterFirst
    # DNS config for custom DNS settings
    dnsConfig: {}
    # nameservers:
    #   - 8.8.8.8
    # searches:
    #   - my-namespace.svc.cluster.local
    # options:
    #   - name: ndots
    #     value: "2"
    # Host aliases (/etc/hosts entries)
    hostAliases: []
    # - ip: "127.0.0.1"
    #   hostnames:
    #     - "foo.local"
    #     - "bar.local"
    # Runtime class name (for specialized runtimes like gVisor, Kata)
    runtimeClassName: ""
  # HAProxyTemplateConfig specification
  # This configuration is rendered into a HAProxyTemplateConfig CRD
  # Users can customize this configuration using Helm values or create
  # the HAProxyTemplateConfig resource manually
  config:
    # Reference to the Secret containing HAProxy Dataplane API credentials
    # The Secret is automatically created by the Helm chart
    credentialsSecretRef:
      # Name will be set by the template to: {{ include "haptic.fullname" . }}-credentials
      name: "" # Will be filled in by Helm template
      # Namespace defaults to Release.Namespace if not specified
    podSelector:
      matchLabels:
        app.kubernetes.io/component: loadbalancer
        # app.kubernetes.io/name and app.kubernetes.io/instance are set dynamically by template
    controller:
      # Health check and metrics ports — display-only.
      # The chart strips these before serialising the CRD; the controller
      # reads the actual ports from the HEALTHZ_PORT and METRICS_PORT env
      # vars (defaults 8080 / 9090; set 0 to disable). To change them,
      # set the env var via controller.extraEnv and update
      # controller.ports.{healthz,metrics} so the container port and
      # Service still line up.
      healthzPort: 8080
      metricsPort: 9090
      # Leader election for high availability
      # When multiple controller replicas are running, only the leader performs
      # write operations (deploying configs to HAProxy). All replicas continue
      # watching resources, rendering configs, and validating (hot standby).
      leaderElection:
        # Enable leader election (recommended when replicaCount > 1)
        enabled: true
        # Name of the Lease resource used for coordination
        # Defaults to the Helm release fullname if not specified
        # This ensures multiple releases in the same namespace don't conflict
        leaseName: ""
        # Duration that non-leader candidates wait to acquire leadership
        # Default: 15s (failover happens within this time after leader failure)
        leaseDuration: 15s
        # Duration the leader retries refreshing leadership before giving up
        # Default: 10s (should be < lease_duration, maintains 1.5x safety ratio)
        renewDeadline: 10s
        # Interval between leadership refresh attempts
        # Default: 2s (should be < renew_deadline, typically 1/5 of it)
        retryPeriod: 2s
      # Reconciler refractory window between resource-change events and a
      # render+deploy cycle. Leading-edge: the first change after the window
      # fires immediately; further changes within the window are batched.
      # Lower it for faster response on small clusters; raise it on
      # high-churn clusters to absorb more changes per render.
      # Default: 5s (shared with the per-watcher debounce default)
      # reconciliationDebounceInterval: 5s
    dataplane:
      # Port is defined in haproxy.ports.dataplane and referenced here
      port: 5555 # Must match haproxy.ports.dataplane value
      # Minimum time between consecutive deployments (rate limiting)
      # Prevents rapid-fire deployments from hammering HAProxy instances
      # Default: 2s
      minDeploymentInterval: 2s
      # Interval for periodic drift prevention deployments
      # Triggers deployment if no deployment occurred within this interval
      # Helps detect and correct configuration drift from external changes
      # Default: 60s
      driftPreventionInterval: 60s
      # Maximum parallel Dataplane API operations during sync.
      # Prevents overwhelming the API when syncing large configurations.
      # Values:
      #   - null/omitted: auto-calculated as dataplane GOMAXPROCS * 10
      #   - 0: unlimited (explicitly disable limiting - not recommended)
      #   - N > 0: use that exact limit
      # Auto-calculation uses the dataplane container's CPU/memory to determine
      # an appropriate parallelism level that balances throughput and API stability.
      # maxParallel: null
      # Directory paths for HAProxy auxiliary files
      # These paths are used for both validation and deployment
      # See: https://www.haproxy.com/documentation/haproxy-data-plane-api/reference/configuration-file/#resources
      mapsDir: /etc/haproxy/maps
      sslCertsDir: /etc/haproxy/ssl
      generalStorageDir: /etc/haproxy/general
      configFile: /etc/haproxy/haproxy.cfg
      # Throttle for republishing the rendered config as the HAProxyCfg
      # observability CRD. Reduces etcd write pressure during endpoint churn.
      # Default: 30s
      # configPublishInterval: 30s
      # Maximum time the Dataplane sync waits for HAProxy to report a
      # graceful reload as completed. Set higher than the Dataplane API's
      # own reload-delay setting.
      # Default: 10s
      # reloadVerificationTimeout: 10s
      # Overall timeout for one Dataplane sync to a single HAProxy endpoint
      # (parse + diff + transactional apply + optional reload-verify).
      # Default: 2m
      # syncTimeout: 2m
      # Max retries the VersionAdapter performs on HTTP 409 transaction
      # commit conflicts. 0 disables retries.
      # Default: 3
      # syncMaxRetries: 3
    # Frontend path-matching order
    # "default" — Exact > Regex > Prefix-exact > Prefix (de-facto standard)
    # "last"    — Exact > Prefix-exact > Prefix > Regex (performance-first;
    #             evaluates faster matchers before regex)
    # The chart swaps in the regex-last variant of the frontend-routing-logic
    # snippet at Helm load time when this is set to "last".
    routing:
      regexMatchOrder: default
    # Runtime log level override (optional)
    # Uncomment to override controller.logLevel at runtime without pod restart
    # logging:
    #   level: DEBUG
    # Template rendering settings
    # extraContext provides custom variables available to all templates
    templatingSettings:
      engine: scriggo # Template engine: "scriggo" (Go templates)
      extraContext:
        # Enable debug headers in HAProxy responses
        # When enabled, HAProxy adds headers like X-HAProxy-Backend, X-Gateway-Matched-Route
        # to show internal routing decisions
        debug: true
        # Parallel sharding is auto-calculated based on resource count and GOMAXPROCS.
        # Formula: clamp(resourceCount / 300, 1, 2 * GOMAXPROCS)
        # Override by setting shardCountOverride to a specific value:
        # shardCountOverride: 8
        # HAProxy bind ports are defined in haproxy.ports (referenced by templates)
        # Auth realm sanitization: auto-replace spaces with dashes in haproxy.org/auth-realm
        # The DataPlane API forbids spaces in realm names. By default (false), the controller
        # fails with a clear error. Set to true to auto-sanitize realm names.
        # sanitize_auth_realm: false
        # Password hash validation regex - validates password hashes in auth secrets
        # Default "^.*$" allows all hashes for backward compatibility.
        # Example to block bcrypt: "^(?!\$2[ayb]\$).*$"
        password_hash_validation_regex: "^.*$"
        # Error message shown when password hash validation fails.
        # The actual error will include username, secret name, and pattern.
        password_hash_validation_error_message: "Invalid password hash"
        # Coraza WAF dispatch behaviour. Controls which HTTP requests
        # HAPTIC's rendered `frontend-spoe-filters-050-coraza` ships to
        # the SPOA hub for WAF inspection. This is a HAPTIC-side
        # template decision (it changes the rendered haproxy.cfg); it
        # does NOT affect the SPOA hub TOML or the coraza plugin's
        # runtime behaviour — for those, see `spoaHub.plugins.coraza.
        # {directives,params}`.
        #
        # The hub passively processes whatever SPOE messages HAProxy
        # sends; this block decides which requests reach it.
        coraza:
          dispatch:
            # `opt-in` (default): WAF runs only on paths with a per-
            # Ingress `nginx.ingress.kubernetes.io/modsecurity-snippet`
            # or `haproxy-ingress.github.io/waf: "modsecurity"`.
            # Matches the haproxy-ingress.github.io upstream's per-
            # path-only model.
            #
            # `default-on`: WAF runs on every request unless the path
            # is opted out via
            # `nginx.ingress.kubernetes.io/enable-modsecurity: "false"`.
            # Mirrors ingress-nginx's `enable-modsecurity` ConfigMap
            # key. haproxy-ingress.github.io has no upstream
            # equivalent — this is a HAPTIC parity feature for
            # operators migrating from ingress-nginx.
            mode: opt-in
            # WAF enforcement when `mode: default-on`. Per-path
            # `haproxy-ingress.github.io/waf-mode: "detect"` overrides
            # this for that path. Ignored when `mode: opt-in`.
            defaultEnforcement: deny
    watchedResourcesIgnoreFields:
      - metadata.managedFields
      - metadata.annotations['kubectl.kubernetes.io/last-applied-configuration']
    watchedResources:
      # Resource-specific watched resources are defined in template libraries:
      # - ingresses: Defined in ingress library (when enabled)
      # - httproutes, grpcroutes: Defined in gateway library (when enabled)
      #
      # Core resources (always watched):
      services:
        apiVersion: v1
        resources: services
        indexBy: ["metadata.namespace", "metadata.name"]
      endpoints:
        apiVersion: discovery.k8s.io/v1
        resources: endpointslices
        indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
      secrets:
        apiVersion: v1
        resources: secrets
        store: on-demand
        indexBy: ["metadata.namespace", "metadata.name"]
        #
        # You can add custom watched resources here or override library-defined resources
        # Example - Watch ConfigMaps:
        # configmaps:
        #   apiVersion: v1
        #   resources: configmaps
        #   indexBy: ["metadata.namespace", "metadata.name"]
        #   # Optional: per-resource debounce override; defaults to 5s.
        #   # Useful to react faster on routes (e.g. "500ms" on httproutes for canary work)
        #   # On EndpointSlices, keep the default — a longer debounce
        #   # delays Pod removal from the HAProxy backend by that
        #   # window, so traffic keeps landing on Terminating Pods.
        #   debounceInterval: ""
    # Template customization
    # The sections below (templateSnippets, maps, files, haproxyConfig, validationTests)
    # are provided by template libraries (see controller.templateLibraries above).
    # You can override or extend library templates by defining them here.
    # User-provided values always take precedence over library defaults.
    #
    # HAProxy global and defaults sections are composed from overridable snippets:
    #   global-settings-100-logging    log directive
    #   global-settings-200-process    daemon, nbthread
    #   global-settings-300-paths      default-path, crt-base
    #   global-settings-400-ssl        tune.ssl.default-dh-param
    #   defaults-settings-100-options  mode, log, option directives
    #   defaults-settings-200-balance  balance algorithm
    #   defaults-settings-300-timeouts timeout connect/client/server
    #   defaults-settings-400-errorfiles errorfile directives
    #
    # Override a snippet to replace its content, or add new ones to extend:
    #
    # Example - Custom timeouts:
    # templateSnippets:
    #   defaults-settings-300-timeouts:
    #     template: |
    #       timeout connect 5000
    #       timeout client 30000
    #       timeout server 30000
    #       timeout tunnel 600000
    #       timeout http-request 10000
    #
    # Example - Add global tuning directives:
    # templateSnippets:
    #   global-settings-500-tuning:
    #     template: |
    #       tune.bufsize 262144
    #       no-memory-trimming
    #
    # Example - Add a custom map:
    # maps:
    #   custom.map:
    #     template: |
    #       # Your custom map content
    #
    # Example - Add custom validation tests:
    # validationTests:
    #   test-custom-feature:
    #     description: Test custom feature
    #     fixtures:
    #       ingresses: [...]
    #     assertions: [...]
  # Uncomment and customize as needed:
  # templateSnippets:
  # maps:
  # files:
  # haproxyConfig:
  # validationTests:

# Webhook configuration
# Kubernetes admission webhook for resource validation
# ValidatingWebhookConfiguration is created by Helm at installation time
webhook:
  # Enable webhook validation
  # Requires at least one entry under controller.config.watchedResources (or a
  # library-contributed one) to have enableValidationWebhook: true
  enabled: true
  # Webhook HTTPS server port is defined in controller.ports.webhook

  # Secret name containing webhook TLS certificates
  # The Secret must contain keys: tls.crt, tls.key, ca.crt
  # Defaults to: {{ include "haptic.fullname" . }}-webhook-cert
  # Leave empty to use the default naming convention
  secretName: ""
  # Service configuration for webhook endpoint
  service:
    # Service port (exposed to Kubernetes API server)
    port: 443
  # Certificate management
  # Choose ONE of the following options:
  #
  # Option 1: Use cert-manager (default, recommended)
  # Requires cert-manager to be installed in the cluster
  # Creates a self-signed certificate automatically for dev/test
  certManager:
    enabled: true
    # Create a self-signed Issuer for webhook certificates
    # When enabled, the chart creates an Issuer that can sign webhook certificates
    # This is the simplest setup - just set enabled=true and createIssuer=true
    createIssuer: true
    # Issuer reference for cert-manager Certificate resource
    # When createIssuer=true, this references the auto-created Issuer
    # When createIssuer=false, this must reference an existing Issuer/ClusterIssuer
    issuerRef:
      # Name of the Issuer (auto-set when createIssuer=true)
      name: ""
      kind: Issuer
      # group: cert-manager.io  # Optional, defaults to cert-manager.io
    # Certificate validity duration (default: 1 year)
    duration: 8760h # 1 year
    # Renew certificate when this much time is left (default: 30 days)
    renewBefore: 720h # 30 days
  #
  # Option 2: Manual certificate management
  # Provide base64-encoded CA bundle for ValidatingWebhookConfiguration
  # This is required when certManager.enabled is false
  # Create the certificate Secret manually with keys: tls.crt, tls.key, ca.crt
  # Secret name is configured via webhook.secretName (default: {{ release-fullname }}-webhook-cert)
  caBundle: "" # Base64-encoded CA certificate
  # Example:
  # caBundle: LS0tLS1CRUdJTi...
# IngressClass resource
# Creates an IngressClass resource for Kubernetes 1.18+
# Only created when ingress library is enabled and API is available
ingressClass:
  # Enable IngressClass creation
  enabled: true
  # Name of the IngressClass
  # Default is "haptic" (not "haproxy") to avoid conflicts with other HAProxy
  # ingress controllers during side-by-side migration. Override to "haproxy"
  # (or any other value) if you are replacing an existing controller and want
  # existing Ingress manifests to match without edits.
  name: haptic
  # Mark as default IngressClass for the cluster
  # Warning: Only one IngressClass should be marked as default cluster-wide
  # Set to true only if this is the sole ingress controller
  default: false
  # Controller identifier (must be unique across all ingress controllers)
  # This value should match what the controller uses to identify itself
  controllerName: haproxy-haptic.org/controller
# GatewayClass resource
# Creates a GatewayClass resource for Gateway API
# Only created when gateway library is enabled and Gateway API CRDs are installed
# Prerequisites: Gateway API CRDs must be installed first:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
gatewayClass:
  # Enable GatewayClass creation
  enabled: true
  # Name of the GatewayClass
  # Default is "haptic" (matching ingressClass.name) to avoid conflicts with
  # other HAProxy Gateway controllers during side-by-side migration.
  name: haptic
  # Mark as default GatewayClass for the cluster
  # Warning: Only one GatewayClass should be marked as default cluster-wide
  # Set to true only if this is the sole Gateway API controller
  default: false
  # Controller identifier (must be unique across all Gateway API controllers)
  # This value should match what the controller uses to identify itself
  controllerName: haproxy-haptic.org/controller
  # Reference to HAProxyTemplateConfig for controller-specific configuration
  # Automatically points to the HAProxyTemplateConfig created by this chart
  # This links Gateway API configuration to the controller's template-based config
  parametersRef:
    group: haproxy-haptic.org
    kind: HAProxyTemplateConfig
    # Name will default to controller.crdName if empty
    name: ""
    # Namespace will default to Release.Namespace if empty
    namespace: ""
# Dataplane API credentials
# If password is empty, it will be:
#   1. Preserved from existing Secret (via lookup during helm install/upgrade)
#   2. Generated deterministically from release name and namespace (for GitOps tools
#      like ArgoCD where lookup is unavailable during template rendering)
# Set explicit values for dev environments where you need predictable credentials.
credentials:
  dataplane:
    username: admin
    password: ""  # Leave empty for auto-generation
# ServiceAccount configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
# Container security context
# Complies with Pod Security Standards (PSS) Restricted profile
# No capabilities required - controller uses only standard syscalls
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
# Service configuration
# Exposes controller endpoints (health and metrics)
# Ports are defined in controller.ports and referenced in template
service:
  type: ClusterIP
  # Service annotations
  annotations: {}
  # Cluster IP (leave empty for auto-assignment)
  clusterIP: ""
  # Load balancer configuration (when type: LoadBalancer)
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  loadBalancerClass: ""
  # External traffic policy (Cluster or Local)
  externalTrafficPolicy: ""
  # Internal traffic policy
  internalTrafficPolicy: ""
  # Session affinity (None or ClientIP)
  sessionAffinity: ""
  sessionAffinityConfig: {}
# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /healthz
    port: healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: healthz
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3
# Resources limits and requests
# Note: The controller automatically detects and respects container resource limits:
# - CPU limits: Go 1.25+ automatically sets GOMAXPROCS based on cgroup CPU limits
# - Memory limits: automemlimit library automatically sets GOMEMLIMIT to 90% of cgroup memory limits
#
# The AUTOMEMLIMIT environment variable can be used to adjust the memory limit ratio (default: 0.9)
# Example: AUTOMEMLIMIT=0.8 sets GOMEMLIMIT to 80% of the container memory limit
#
# Default configuration uses Guaranteed QoS for memory (requests = limits) for eviction protection.
# No CPU limit is set to avoid throttling. See: https://home.robusta.dev/blog/kubernetes-memory-limit
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 512Mi
# Extra environment variables for controller container
# Example:
#   extraEnv:
#     - name: MY_VAR
#       value: "my-value"
extraEnv: []
# Extra volumes for controller pod
# Use this to add custom volumes (ConfigMaps, Secrets, emptyDir, etc.)
extraVolumes: []
# - name: custom-config
#   configMap:
#     name: my-config
# - name: tmp-data
#   emptyDir: {}
# Extra volume mounts for controller container
extraVolumeMounts: []
# - name: custom-config
#   mountPath: /etc/custom-config
#   readOnly: true
# Init containers for controller pod
# Run before the main container starts
initContainers: []
# - name: wait-for-db
#   image: busybox:1.36
#   command: ['sh', '-c', 'until nc -z db 5432; do sleep 1; done']
# Sidecar containers for controller pod
sidecars: []
# - name: log-collector
#   image: fluent/fluent-bit:latest
#   volumeMounts:
#     - name: logs
#       mountPath: /var/log
# Startup probe (useful for slow-starting containers)
# When enabled, liveness and readiness probes are disabled until startup succeeds
startupProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: healthz
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 30
# Container lifecycle hooks
lifecycle: {}
# preStop:
#   exec:
#     command: ["/bin/sh", "-c", "sleep 15"]
# postStart:
#   httpGet:
#     path: /ready
#     port: 8080
# Deployment update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
# Minimum seconds for pod to be considered ready after becoming healthy
minReadySeconds: 0
# Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 10
# Deployment-level annotations (different from pod annotations)
deploymentAnnotations: {}
# reloader.stakater.com/auto: "true"
# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Pod Disruption Budget
# Enabled by default to protect against simultaneous pod eviction during cluster operations
# Only applies when replicaCount > 1 (see template conditional)
podDisruptionBudget:
  enabled: true
  # Only one of minAvailable or maxUnavailable should be set
  minAvailable: 1
  # maxUnavailable: 1
# Prometheus Metrics and Monitoring
# The controller exposes 31 Prometheus metrics on port 9090. Authoritative list
# lives in pkg/controller/metrics/metrics.go; a representative subset is
# asserted by pkg/controller/metrics.TestMetrics_AllMetricsRegistered. Coverage groups:
# - Reconciliation pipeline: cycles, errors, duration, queue wait
# - Deployment: operations, errors, duration
# - Validation: totals, errors, embedded test pass/fail/duration
# - Resources: per-type counts (includes haproxy-pods + every watched type)
# - Event bus: subscribers, publishes, drop counters (by subscriber/critical/observability)
# - Webhook: admission requests, validation results, cert expiry + rotations
# - Leader election: is-leader gauge, transitions, time-as-leader
# - Parser cache: hits and misses
# - Build info: version/commit/Go-version static gauge
#
# Metrics endpoint: http://<pod-ip>:9090/metrics
# Access via: kubectl port-forward pod/<controller-pod> 9090:9090
#
# For complete metric definitions and queries, see:
# pkg/controller/metrics/README.md in the repository
monitoring:
  # ServiceMonitor for Prometheus Operator
  # Creates a ServiceMonitor resource that configures Prometheus to scrape metrics
  serviceMonitor:
    enabled: false
    # Scrape interval for metrics collection
    interval: 30s
    # Timeout for each scrape
    scrapeTimeout: 10s
    # Additional labels for ServiceMonitor resource
    # Used by Prometheus to select which ServiceMonitors to use
    labels: {}
    #   prometheus: kube-prometheus
    #   release: prometheus
    # Relabeling configurations applied before scraping
    # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
    relabelings: []
    # Example: Add cluster label
    # - sourceLabels: [__address__]
    #   targetLabel: cluster
    #   replacement: production
    # Metric relabeling configurations applied to scraped metrics
    metricRelabelings: []
    # Example: Drop specific metrics
    # - sourceLabels: [__name__]
    #   regex: 'haptic_event_subscribers'
    #   action: drop
  # PodMonitor for Prometheus Operator (alternative to ServiceMonitor)
  # Use when metrics are exposed directly on pods rather than via Service
  podMonitor:
    enabled: false
    # Scrape interval for metrics collection
    interval: 30s
    # Timeout for each scrape
    scrapeTimeout: 10s
    # Additional labels for PodMonitor resource
    labels: {}
    # Relabeling configurations
    relabelings: []
    # Metric relabeling configurations
    metricRelabelings: []
  # PrometheusRule for alerting
  # Creates alerting rules for Prometheus Operator
  prometheusRule:
    enabled: false
    # Additional labels for PrometheusRule resource
    # Used by Prometheus to select which PrometheusRules to use
    labels: {}
    # Custom alerting rules (overrides default rules when non-empty)
    rules: []
    # - alert: HAProxyControllerReconciliationErrors
    #   expr: rate(haptic_reconciliation_errors_total[5m]) > 0
    #   for: 5m
    #   labels:
    #     severity: warning
    #   annotations:
    #     summary: "HAProxy controller has reconciliation errors"
    # Default rules (created when rules is empty and defaultRules.enabled is true)
    defaultRules:
      enabled: true
      # Individual rule toggles
      reconciliationErrors: true
      deploymentFailures: true
      highQueueDepth: true
      leaderElectionLost: true
  # Grafana dashboard ConfigMap
  # Creates a ConfigMap with dashboard JSON for Grafana sidecar discovery
  grafanaDashboard:
    enabled: false
    # Labels for dashboard discovery (Grafana sidecar)
    labels:
      grafana_dashboard: "1"
    # Annotations added to the dashboard ConfigMap.
    # The folder annotation key must match grafana.sidecar.dashboards.folderAnnotation
    # in kube-prometheus-stack (default: "grafana_folder"). The k8s-sidecar raw default
    # is "k8s-sidecar-target-directory".
    annotations:
      grafana_folder: "HAProxy"
    # Namespace for the dashboard ConfigMap (defaults to release namespace)
    # Set to the namespace where Grafana is running if the sidecar is not configured
    # to search all namespaces (grafana.sidecar.dashboards.searchNamespace: ALL).
    namespace: ""
    # Use the built-in dashboard. It covers a curated subset of the
    # ~31 controller metrics — reconciliation, deployment, validation,
    # events, leader election, and webhook health — which is enough
    # for a single-pane operator view. The full metric catalogue lives
    # in pkg/controller/metrics/README.md if you want to build a
    # deeper dashboard yourself.
    # Set to false to provide your own dashboard JSON via customDashboard.
    useBuiltIn: true
    # Custom dashboard JSON (only used when useBuiltIn: false)
    customDashboard: {}
# HAProxy data plane configuration
# Deploys HAProxy pods with Dataplane API sidecars
# The controller manages these pods' configurations
haproxy:
  # Enable HAProxy deployment as part of this chart
  # Set to false to use external HAProxy pods (bring your own HAProxy)
  enabled: true
  # HAProxy container ports
  # These are the ports HAProxy listens on inside the container
  # Services and NetworkPolicies reference these by name or value
  #
  # IMPORTANT: http/https default to the literal Gateway-listener-port
  # numbers (80/443) so that Gateway listeners on arbitrary ports never
  # collide with the chart-static internal binds. With http=8080 a
  # Gateway listener on port 8080 (legitimate per spec) shares HAProxy's
  # `bind *:8080` with the chart-static http frontend (Service NAT
  # routes Service port 80 → containerPort 8080), making `dst_port`
  # ambiguous between the two logical listeners. Binding on the literal
  # numbers eliminates the collision: each Gateway listener port owns
  # its own bind and dst_port is unambiguous. The HAProxy container has
  # `CAP_NET_BIND_SERVICE` granted (see haproxy-deployment.yaml) so
  # privileged ports work as non-root.
  #
  # Plumbing: the chart automatically threads these values into the
  # template engine via `extraContext.httpPort` / `extraContext.httpsPort`
  # so HAProxy's bind directives (in base/ssl) and the redirect-filter's
  # well-known-port omit logic (in gateway) all reference the same
  # values. Override via this knob — no need to also set
  # `controller.config.templatingSettings.extraContext.httpPort`
  # explicitly.
  ports:
    http: 80 # HTTP frontend
    https: 443 # HTTPS frontend
    stats: 8404 # Health/stats page
    dataplane: 5555 # Dataplane API (for controller communication)
  # Number of HAProxy replicas
  replicaCount: 2
  # HAProxy image configuration
  # Tag defaults to the patch version from haproxyPatchVersions (community) or
  # haproxyEnterprisePatchVersions (enterprise) for the selected haproxyVersion.
  image:
    repository: haproxytech/haproxy-debian
    pullPolicy: IfNotPresent
    # Override the HAProxy pod image tag. Leave empty to use the patch version
    # from haproxyPatchVersions or haproxyEnterprisePatchVersions (recommended).
    # Example: "3.2.10" (community) or "3.2r2" (enterprise)
    tag: ""
  # Enterprise mode configuration
  # Set to true when using HAProxy Enterprise images (hapee-registry.haproxy.com/haproxy-enterprise)
  # Enterprise images have different binary paths and user configuration
  enterprise:
    enabled: false
    # HAProxy Enterprise version (e.g., "3.0", "3.1", "3.2")
    # Used to construct binary paths: /opt/hapee-{version}/sbin/hapee-lb
    version: "3.2"
  # Binary paths - automatically derived from enterprise settings
  # Override these only if using custom images with non-standard paths
  # Community defaults:
  #   haproxyBin: /usr/local/sbin/haproxy
  #   dataplaneBin: /usr/local/bin/dataplaneapi
  # Enterprise defaults (when enterprise.enabled=true):
  #   haproxyBin: /opt/hapee-{version}/sbin/hapee-lb
  #   dataplaneBin: /opt/hapee-extras/sbin/hapee-dataplaneapi
  haproxyBin: ""
  dataplaneBin: ""
  # HAProxy service configuration
  # Service exposes HAProxy container ports externally
  # targetPort references are defined in template using named ports
  service:
    type: NodePort
    annotations: {}
    # LoadBalancer configuration (when type: LoadBalancer)
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    # External traffic policy (Cluster or Local)
    # Local preserves client source IP but may cause uneven load distribution
    externalTrafficPolicy: ""
    # Internal traffic policy
    internalTrafficPolicy: ""
    # Health check node port (for LoadBalancer with Local traffic policy)
    healthCheckNodePort: ""
    # Publish not-ready addresses
    publishNotReadyAddresses: false
    # Port configurations
    http:
      port: 80
      # targetPort: http (set in template)
      nodePort: 30080
    https:
      port: 443
      # targetPort: https (set in template)
      nodePort: 30443
    stats:
      port: 8404
      # targetPort: stats (set in template)
      nodePort: 30404
    # Additional Service ports. Operators using haptic without
    # Gateway API (e.g. an Ingress-only deployment that also exposes
    # a raw TCP frontend via a custom haproxyConfig snippet, or
    # anything else not modelled by an Ingress / Gateway /
    # ListenerSet) declare them here. The chart concatenates these
    # entries with the http/https/stats triple above into a single
    # `extraContext.haproxyService.ports` list that the
    # `k8sResources.haproxy-service` template iterates verbatim.
    #
    # Each entry mirrors a `corev1.ServicePort` shape: at minimum
    # `name` + `port`. `targetPort` defaults to `port`, `protocol`
    # defaults to TCP. `nodePort` only applies when
    # `haproxy.service.type` is `NodePort` or `LoadBalancer`.
    # Names must be RFC 1123 labels and unique across all Service
    # ports (including the http/https/stats entries above and any
    # Gateway-derived `gw-*` entries the controller adds at render
    # time).
    #
    # To drop a default entry (e.g. expose only http on the
    # Service), set the matching `haproxy.service.<name>.port` to
    # 0 — entries with port 0 are filtered out at chart-render time.
    #
    # Example — exposing a raw TCP frontend on port 5432:
    #   extraPorts:
    #     - name: postgres
    #       port: 5432
    #       targetPort: 5432
    #       protocol: TCP
    #       nodePort: 30432
    extraPorts: []
  # Dataplane API sidecar configuration
  dataplane:
    service:
      type: ClusterIP
      # port references haproxy.ports.dataplane (set in template)
    # Credentials are configured via top-level 'credentials.dataplane' section
    # Resource limits and requests for Dataplane API sidecar
    # Default configuration uses Guaranteed QoS for memory (requests = limits).
    # No CPU limit is set to avoid throttling.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi
    # Extra environment variables for Dataplane API container
    # Example:
    #   extraEnv:
    #     - name: GOMAXPROCS
    #       value: "4"
    # Note: GOMAXPROCS is auto-calculated from memory limits when no CPU limit is set.
    # Setting it here overrides the automatic calculation.
    extraEnv: []
    # validateConfig: Whether Dataplane API should validate configs before applying.
    # The controller already validates locally, so server-side validation is redundant.
    # Set to true if you want double-validation for extra safety.
    validateConfig: false
    # Enable debug socket for runtime profiling (pprof, goroutines, stack traces).
    # When set, Dataplane API listens on this Unix socket for debug commands.
    # Usage: kubectl exec <pod> -c dataplane -- socat - UNIX-CONNECT:<path>
    # Commands: "pprof cpu start /tmp/cpu.prof 30", "pprof mem /tmp/mem.prof",
    #           "pprof web start 6060 300", "goroutines", "stack"
    debugSocketPath: ""
  # Extra environment variables for HAProxy container
  # Example:
  #   extraEnv:
  #     - name: MY_VAR
  #       value: "my-value"
  extraEnv: []
  # Shared memory stats file (shm-stats-file global directive, HAProxy 3.3+).
  # Persists HAProxy stats counters in a memory-mapped file across reloads,
  # eliminating false metric drops on dashboards when HAProxy reloads.
  # Requires HAProxy 3.3+ (version-gated in templates via semver_gte).
  shmStats:
    enabled: false
    path: "/dev/shm/haproxy-stats"
    # Maximum number of objects in the shm-stats file. Each HAProxy frontend,
    # backend, listen, and server directive counts as one object. The shm-stats
    # file is fixed-size once created — HAProxy cannot resize it on reload.
    # Formula: (number of backends + number of servers) * safety margin.
    # Default 50000 supports ~40k servers with headroom.
    maxObjects: 50000
    # Size limit for the /dev/shm emptyDir volume (medium: Memory).
    # Auto-calculated from maxObjects if not set (~4KB per object with 10% margin).
    # For 50,000 objects the auto-calculated size is 215Mi.
    # Override this if you have specific memory constraints.
    # Note: counts against the pod's memory limit (SizeMemoryBackedVolumes).
    # shmSizeLimit: "256Mi"
  # Number of HAProxy threads (nbthread global directive).
  # Default (key absent): auto-calculated from CPU requests (ceil of CPU cores, minimum 1).
  # Set to 0 to disable the nbthread directive entirely (HAProxy uses its built-in default).
  # Set to a positive integer to override the auto-calculation.
  # Supports Helm templating: nbthread: "{{ mul 2 (.Values.someValue | int) }}"
  # nbthread: 4
  #
  # Resource limits and requests for HAProxy containers
  # Default configuration uses Guaranteed QoS for memory (requests = limits) for eviction protection.
  # No CPU limit is set to avoid throttling during traffic spikes.
  # HAProxy uses ~32KB per connection (16KB each direction).
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  # Pod-spec scheduling, runtime, and metadata for the HAProxy Deployment.
  # The chart's _pod-spec.tpl helper renders the universally-shared fields
  # from this block. podSecurityContext, podAnnotations, and shareProcessNamespace
  # are consumed directly by templates/haproxy-deployment.yaml.
  podSpec:
    # Priority class for pod scheduling
    # Used to mark critical workloads for preferential scheduling and preemption
    # Common values:
    #   - system-cluster-critical: Highest priority for cluster infrastructure
    #   - system-node-critical: High priority for node management components
    #   - "" (empty): Default priority (recommended for most deployments)
    # Requires priority class to be pre-created in the cluster
    priorityClassName: ""
    # Topology spread constraints for high availability
    # Controls pod distribution across topology domains (zones, nodes, etc.)
    # Default: [] (empty, user opt-in)
    # Example for zone spreading:
    #   - maxSkew: 1
    #     topologyKey: topology.kubernetes.io/zone
    #     whenUnsatisfiable: DoNotSchedule
    #     labelSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: haptic
    #         app.kubernetes.io/component: loadbalancer
    topologySpreadConstraints: []
    # Node selector for HAProxy pods
    nodeSelector: {}
    # Tolerations for HAProxy pods
    tolerations: []
    # Affinity rules for HAProxy pods
    affinity: {}
    # DNS policy (ClusterFirst, ClusterFirstWithHostNet, Default, None)
    dnsPolicy: ClusterFirst
    # DNS config for custom nameservers, searches, and options
    dnsConfig: {}
    # nameservers:
    #   - 8.8.8.8
    # searches:
    #   - my-namespace.svc.cluster.local
    # options:
    #   - name: ndots
    #     value: "2"
    # Host aliases (/etc/hosts entries)
    hostAliases: []
    # - ip: "127.0.0.1"
    #   hostnames:
    #     - "foo.local"
    # Runtime class name (for specialized runtimes like gVisor, Kata)
    runtimeClassName: ""
    # Extra pod annotations for HAProxy pods (supports template expressions)
    podAnnotations: {}
    # Share process namespace between containers (required for signal-based sidecar reload)
    shareProcessNamespace: false
    # Termination grace period in seconds
    terminationGracePeriodSeconds: 30
    # Pod security context for HAProxy deployment
    # Complies with Pod Security Standards (PSS) Restricted profile
    # NO NET_BIND_SERVICE capability required - HAProxy binds to unprivileged ports (8080, 8443, 8404)
    # Kubernetes Service handles mapping to privileged ports (80, 443)
    #
    # UIDs are auto-derived based on enterprise.enabled:
    #   Community: runAsUser=99, runAsGroup=99, fsGroup=99 (haproxy user)
    #   Enterprise: runAsUser=1000, runAsGroup=1000, fsGroup=1000 (hapee-lb user)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      # Pod-level sysctls (requires kubelet allowedUnsafeSysctls for unsafe sysctls)
      sysctls: []
      # Example:
      #   - name: net.ipv4.tcp_wmem
      #     value: "4096 16384 536870912"
  # Extra volumes for HAProxy pod
  extraVolumes: []
  # - name: custom-config
  #   configMap:
  #     name: my-haproxy-config
  # Extra volume mounts for HAProxy container
  extraVolumeMounts: []
  # - name: custom-config
  #   mountPath: /etc/haproxy/custom
  #   readOnly: true
  # Init containers for HAProxy pod
  initContainers: []
  # - name: init-config
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'echo "Initializing..."']
  # Sidecar containers for HAProxy pod
  sidecars: []
  # - name: log-shipper
  #   image: fluent/fluent-bit:latest
  # Container lifecycle hooks for HAProxy container
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 30"]
  # Deployment update strategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Minimum seconds for pod to be considered ready
  minReadySeconds: 0
  # Number of old ReplicaSets to retain
  revisionHistoryLimit: 10
  # KEDA autoscaling for HAProxy loadbalancer
  # Enables event-driven scaling based on traffic metrics
  keda:
    enabled: false
    # Scaling limits
    minReplicaCount: 2
    maxReplicaCount: 10
    # How often KEDA checks triggers (seconds)
    pollingInterval: 30
    # Cooldown period before scaling down (seconds)
    cooldownPeriod: 300
    # Fallback configuration if trigger fails
    fallback:
      failureThreshold: 3
      replicas: 2
    # Advanced HPA behavior configuration
    advanced: {}
    # horizontalPodAutoscalerConfig:
    #   behavior:
    #     scaleDown:
    #       stabilizationWindowSeconds: 300
    #       policies:
    #         - type: Percent
    #           value: 10
    #           periodSeconds: 60
    #     scaleUp:
    #       stabilizationWindowSeconds: 0
    # Triggers (required when keda.enabled is true)
    # See: https://keda.sh/docs/2.17/scalers/
    triggers: []
    # Example: Scale based on CPU/memory utilization of the haproxy container
    # (use containerName to target only haproxy, excluding sidecar overhead)
    # - type: cpu
    #   metricType: Utilization
    #   metadata:
    #     value: "80"
    #     containerName: "haproxy"
    # - type: memory
    #   metricType: Utilization
    #   metadata:
    #     value: "80"
    #     containerName: "haproxy"
    # Example: Scale based on HAProxy connection count
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://prometheus:9090
    #     metricName: haproxy_connections_total
    #     threshold: "1000"
    #     query: sum(rate(haproxy_server_connections_total[1m]))
    # Example: Scale based on HTTP requests per second
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://prometheus:9090
    #     metricName: haproxy_http_requests_per_second
    #     threshold: "500"
    #     query: sum(rate(haproxy_http_requests_total[1m]))
    # Example: Time-based scaling for business hours
    # - type: cron
    #   metadata:
    #     timezone: UTC
    #     start: 0 8 * * 1-5
    #     end: 0 18 * * 1-5
    #     desiredReplicas: "5"
  # Initial HAProxy bootstrap config rendered into the haproxy-config ConfigMap.
  # This is the config HAProxy starts with on pod boot. The controller replaces
  # it via the Dataplane API on its first reconcile, so the bootstrap only
  # matters during the seconds between pod start and controller handoff (and on
  # pod restart before the controller reconciles again).
  #
  # The string is processed through Helm's tpl, so chart helpers
  # ({{ include "haptic.haproxy.nbthread" . }}) and value references
  # ({{ .Values.haproxy.ports.stats }}) are available. To customise the
  # bootstrap, copy this default into your values file and edit it.
  #
  # !!! warning "Preserve the /ready 503 until controller takeover"
  #     The default returns 503 on /ready so the pod stays NotReady until the
  #     controller pushes its first real config (which then defines the
  #     production /ready handler). An override that returns 200 on /ready
  #     will let the Service route traffic to HAProxy before any backends
  #     exist — clients will see 404s.
  initialConfig: |
    global
        log stdout len 4096 local0 info
        {{- with include "haptic.haproxy.nbthread" . }}
        nbthread {{ . }}
        {{- end }}

    defaults
        mode http
        log global
        option httplog
        timeout connect 5000
        timeout client 50000
        timeout server 50000

    frontend status
        bind *:{{ .Values.haproxy.ports.stats }}
        http-request return status 200 content-type text/plain string "OK" if { path /healthz }
        http-request return status 503 content-type text/plain string "Not ready - waiting for controller config" if { path /ready }

    frontend http_frontend
        bind *:{{ .Values.haproxy.ports.http }}
        default_backend default_backend

    backend default_backend
        http-request return status 404
  # NetworkPolicy configuration for HAProxy loadbalancer pods
  # This controls network access to/from HAProxy pods that handle incoming traffic
  #
  # !!! warning "CNI Plugin Requirement"
  #     NetworkPolicies require a CNI plugin that supports NetworkPolicy enforcement
  #     (e.g., Calico, Cilium, Weave Net). Clusters without a compatible CNI plugin
  #     will ignore NetworkPolicy resources. kind clusters use kindnet by default,
  #     which does NOT support NetworkPolicy. To test NetworkPolicies with kind,
  #     install Calico or Cilium.
  #
  # !!! warning "Deny-All Prevention"
  #     Setting allowExternal: false with empty allowedSources will cause
  #     Helm installation to fail with a validation error. This prevents
  #     accidental creation of a deny-all policy that blocks all traffic.
  #     Either set allowExternal: true OR provide allowedSources.
  networkPolicy:
    # Enable NetworkPolicy for HAProxy loadbalancer pods
    # Enable in production to restrict network access
    enabled: true
    # Allow external traffic (from any source including internet)
    # true: Allow traffic from any source (required for public-facing ingress with NodePort/LoadBalancer)
    # false: Only allow from specific sources defined in allowedSources
    #
    # When true, the NetworkPolicy omits the 'from' clause for HTTP/HTTPS ingress rules,
    # which is the standard Kubernetes pattern for allowing traffic from any source.
    allowExternal: true
    # When allowExternal: false, define allowed traffic sources
    # REQUIRED if allowExternal is false - empty list will cause Helm validation error
    #
    # Example - allow only from specific namespaces:
    # allowedSources:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: frontend
    #     podSelector:
    #       matchLabels:
    #         app: nginx
    #
    # Example - allow from any pod in specific namespaces:
    # allowedSources:
    #   - namespaceSelector:
    #       matchLabels:
    #         environment: production
    #
    # Example - allow from specific IP ranges:
    # allowedSources:
    #   - ipBlock:
    #       cidr: 10.0.0.0/8
    #       except:
    #         - 10.1.0.0/16
    allowedSources: []
    # Additional custom ingress rules
    # These are added to the NetworkPolicy as-is
    # Use this for advanced scenarios not covered by the default rules
    # Example:
    # extraIngress:
    #   - from:
    #       - ipBlock:
    #           cidr: 192.168.1.0/24
    #     ports:
    #       - port: 8080
    extraIngress: []
    # Additional custom egress rules
    # Default egress rules allow DNS and backend service connections
    # Use this to add additional egress restrictions
    # Example:
    # extraEgress:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             name: external-api
    #     ports:
    #       - port: 443
    extraEgress: []
# NetworkPolicy configuration for controller pods
# This controls network access to/from the controller that manages HAProxy configurations
networkPolicy:
  enabled: true
  # Egress rules
  egress:
    # Allow DNS resolution (required for service discovery)
    allowDNS: true
    # Kubernetes API Server access (required for watching resources)
    # Configure based on your cluster setup
    kubernetesApi:
      # For kind/standard clusters
      # Adjust this CIDR based on your cluster
      - cidr: 0.0.0.0/0 # Allow all by default, restrict in production
        ports:
          - port: 443
            protocol: TCP
          - port: 6443
            protocol: TCP
    # HAProxy Dataplane API pods (in any namespace)
    haproxyPods:
      # Allow access to all pods matching the pod_selector
      enabled: true
      # Pod selector for HAProxy pods
      podSelector:
        matchLabels:
          app.kubernetes.io/component: loadbalancer
          # app.kubernetes.io/name and app.kubernetes.io/instance are set dynamically by template
      # Namespace selector - empty {} means all namespaces
      namespaceSelector: {}
      # Ports are defined in haproxy.ports (referenced in template)
    # Additional custom egress rules
    additionalRules:
      # Allow HAProxy (load balancer) to connect to any backend service in the cluster
      # This is required for HAProxy to proxy traffic and perform health checks
      - to:
          - namespaceSelector: {} # All namespaces
          - podSelector: {} # All pods
            # Example of additional custom rule:
            # - to:
            #     - namespaceSelector:
            #         matchLabels:
            #           name: monitoring
            #   ports:
            #     - port: 9090
            #       protocol: TCP
  # Ingress rules
  ingress:
    # Allow Prometheus/monitoring to scrape metrics
    # IMPORTANT: Enable this if using ServiceMonitor with NetworkPolicy
    # Without this, Prometheus cannot access the metrics endpoint
    monitoring:
      enabled: false # Set to true when using Prometheus with NetworkPolicy
      # Pod selector for monitoring systems (e.g., Prometheus)
      # Match the labels of your Prometheus pods
      podSelector: {}
      #   matchLabels:
      #     app: prometheus
      #     app.kubernetes.io/name: prometheus
      # Namespace selector for monitoring systems
      # Match the namespace where Prometheus is running
      namespaceSelector: {}
      #   matchLabels:
      #     name: monitoring
      #     kubernetes.io/metadata.name: monitoring
      # Port is defined in controller.ports.metrics (referenced in template)
    # Allow health checks from load balancers/ingress
    healthChecks:
      enabled: true
      # Allow from anywhere for health checks
      from:
        - podSelector: {}
          # Port is defined in controller.ports.healthz (referenced in template)
    # Allow controller to access HAProxy Dataplane API
    # IMPORTANT: This is required for the controller to sync configurations
    dataplaneApi:
      enabled: true
      # Allow from controller pods in the same namespace
      from:
        - podSelector: {}
          # Port is defined in haproxy.ports.dataplane (referenced in template)
    # Allow Kubernetes API server to call webhook
    # IMPORTANT: Enable this when webhook is enabled with NetworkPolicy
    webhook:
      enabled: true # Automatically enabled when webhook.enabled is true
      # Allow from all sources (API server nodes)
      # The Kubernetes API server needs to reach the webhook endpoint
      from:
        - podSelector: {}
        - namespaceSelector: {}
    # Additional custom ingress rules
    additionalRules: []

# Extra Kubernetes resources to deploy alongside the chart.
# Supports Helm templating ({{ .Release.Name }}, {{ .Release.Namespace }}, etc.)
#
# Can be a list (replaced wholesale when merging values files):
#   extraDeploy:
#     - apiVersion: monitoring.coreos.com/v1
#       kind: ServiceMonitor
#       metadata:
#         name: "{{ .Release.Name }}-haproxy-stats"
#
# Or a dict (keys are merge identifiers, composable across values files):
#   extraDeploy:
#     service-monitor:
#       apiVersion: monitoring.coreos.com/v1
#       kind: ServiceMonitor
#       metadata:
#         name: "{{ .Release.Name }}-haproxy-stats"
#       spec:
#         selector:
#           matchLabels:
#             app.kubernetes.io/instance: "{{ .Release.Name }}"
#         endpoints:
#           - port: stats
#             path: /metrics
# SPOA hub sidecar
# Bundles the haproxy-spoa-hub binary plus seven plugin shared libraries
# (coraza, external-auth, fingerprinting, maxmind, mirror, otel, sso-auth) inside
# the HAProxy pod. Communicates with HAProxy over a Unix-domain socket.
# The sidecar is rendered conditionally — absent when no plugin is
# enabled, automatically present when at least one is.
spoaHub:
  # Master enable. Leave as null to auto-derive from plugins.*.enabled
  # (the typical case). Set to false to force the sidecar off even when a
  # plugin is enabled (rare; mostly for migrations or chart testing).
  # Set to true to render the sidecar even with no plugins enabled (useful
  # for chart-rendering tests).
  enabled: null

  image:
    repository: registry.gitlab.com/haproxy-haptic/haptic/spoa-hub
    pullPolicy: IfNotPresent
    # Override the tag. Leave empty to use .Chart.AppVersion (recommended).
    tag: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Hub-side runtime knobs (rendered into /etc/haproxy-spoa-hub/config.toml).
  hub:
    # info | debug | warn | error
    logLevel: "info"
    # Tokio worker thread count. Leave null for the default (CPU count).
    workerThreads: null
    maxConnections: 1000
    blockingThreadKeepAliveSecs: 30

  # HAProxy-side wiring. The chart surfaces these into
  # templatingSettings.extraContext.spoaHub (see
  # templates/haproxytemplateconfig.yaml), and the spoa-hub template
  # library reads them when emitting the `backend spoa-hub` block,
  # the `filter spoe engine` directive, and the spoe.conf agent.
  haproxy:
    socketPath: /run/spoa/hub.sock
    # `mode spop` is the native SPOP backend mode, introduced in HAProxy
    # 3.1. The chart auto-falls back to `mode tcp` on HAProxy 3.0 (where
    # this proxy mode doesn't exist) — both work with the SPOE filter,
    # mode spop is just the more efficient transport. Set this to false
    # to force tcp on 3.1+ as well (rare; mostly for compat testing).
    modeSpop: true
    timeoutHello: 2s
    timeoutIdle: 5m
    timeoutProcessing: 500ms
    poolMaxConn: 100
    poolPurgeDelay: 30s

  # Plugins. Each entry has chart-managed lifecycle keys (enabled, timeoutMs,
  # messages, dependsOn) plus a free-form `params:` TOML string blob spliced
  # verbatim under the hub's `[plugins.params]` table. The chart never parses
  # `params:` — see each upstream plugin's README for the schema and copy
  # the recommended block in.
  #
  # `enabled` is templatable: the default value is a `tpl`-evaluated string
  # so a plugin can auto-enable itself when the template libraries that
  # rely on it are turned on. Operator override is via a literal bool
  # (`--set spoaHub.plugins.<X>.enabled=true|false`); explicit bools always
  # win over the templated default. `external-auth` already wires this up
  # — its default is `'{{ .Values.controller.templateLibraries.nginxIngress.enabled }}'`
  # so flipping the nginx-ingress library on consumes
  # `nginx.ingress.kubernetes.io/auth-url` annotations without a second
  # toggle. Other plugins keep `'{{ false }}'` until a similar wire-up
  # exists for the libraries that need them.
  #
  # IMPORTANT: `params:` is rendered *inside* the `[plugins.params]` scope,
  # so any bare table header in it (e.g. `[instrumentation]`) would close
  # that scope and be parsed as a top-level table. Use either:
  #   - dotted keys for nested values:  `instrumentation.name = "..."`
  #   - or fully-qualified headers:     `[plugins.params.instrumentation]`
  # Bare `[xxx]` headers inside `params:` will break the plugin's config.
  plugins:
    coraza:
      # Auto-enabled when EITHER nginx-ingress OR haproxy-ingress library
      # is on. nginx-ingress feeds coraza via `nginx.ingress.kubernetes.io/modsecurity-snippet`
      # (rule text appended to the global `directives = """..."""` block,
      # always-dispatch). haproxy-ingress feeds it via `haproxy-ingress.github.io/waf`
      # + `/waf-mode` (path-scoped opt-in dispatch via a single
      # `haproxy-ingress-waf.map` whose value is the resolved enforcement
      # mode for the path — `deny` or `detect`).
      # haproxy-ingress is on by default in HAPTIC, so flipping coraza
      # on by default with it adds the spoa-hub sidecar (~50 MB) to the
      # baseline footprint — accepted in exchange for richer chart
      # defaults: any user setting `/waf: modsecurity` on an Ingress
      # gets the WAF wired without a second toggle.
      # haproxytech (haproxy.org/*) has no public WAF annotation; nothing
      # to OR. Operators wanting cluster-wide WAF without either ingress
      # library can `--set spoaHub.plugins.coraza.enabled=true`.
      #
      # NOTE: this block configures the WAF service (rules, body
      # limits, plugin runtime knobs — all rendered into the spoa-hub
      # TOML). The dispatch decision — i.e., which HTTP requests
      # HAProxy ships to the WAF — lives separately under
      # `controller.templatingSettings.extraContext.coraza.dispatch`,
      # because it changes the rendered haproxy.cfg, not the hub TOML.
      enabled: '{{ or .Values.controller.templateLibraries.nginxIngress.enabled .Values.controller.templateLibraries.haproxyIngress.enabled }}'
      timeoutMs: 15
      messages: ["check-request"]
      dependsOn: []
      # Coraza WAF rule directives. The chart appends these to the
      # rendered TOML's `directives = """..."""` field, then appends
      # any per-Ingress `nginx.ingress.kubernetes.io/modsecurity-snippet`
      # values from watched Ingresses, so per-resource rules land in the
      # runtime hub's coraza section without per-request SPOE shipping.
      # Order is: this base, then snippets sorted by `<ns>/<name>` for
      # determinism. Each appended snippet is preceded by a comment of
      # the form `# nginx-ingress modsecurity-snippet from <ns>/<name>`.
      #
      # Do NOT also set `directives = "..."` inside `params:` below —
      # the chart emits its own `directives = """..."""` line, so a
      # duplicate would produce a coraza parse error.
      directives: |
        SecRuleEngine On
        Include @coraza.conf-recommended
        Include @crs-setup.conf.example
        Include @owasp_crs/*.conf
      params: |
        request_body_limit = 131072
        request_body_in_memory_limit = 131072
        response_body_limit = 131072
        response_check = false
        detect_only = false
        transaction_ttl_ms = 10000
    external-auth:
      # Auto-enabled when nginx-ingress is enabled (it's opt-in by default,
      # so flipping it on signals the operator wants its features —
      # including the auth-url wiring). haproxy-ingress is intentionally
      # NOT in the OR even though it has an auth-url handler: that library
      # is ON by default and most operators with it enabled don't use
      # external-auth, so OR-ing it in would deploy the spoa-hub sidecar
      # for everyone (~50 MB extra in the haproxy pod). Operators using
      # haproxy-ingress.github.io/auth-url should set this to 'true'
      # explicitly. The haproxytech library has no external-auth
      # annotation in its public schema.
      enabled: '{{ .Values.controller.templateLibraries.nginxIngress.enabled }}'
      timeoutMs: 6000
      messages: ["check-auth"]
      dependsOn: []
      params: |
        timeout_ms = 5000
        fail_open = false
        method = "GET"
        allow_plaintext = false
        forward_headers = [
          "authorization", "cookie",
          "x-forwarded-for", "x-forwarded-proto",
          "x-forwarded-host", "x-forwarded-uri"
        ]
        extract_headers = ["x-auth-user", "x-auth-roles"]
    fingerprinting:
      enabled: '{{ false }}'
      timeoutMs: 5
      messages: ["get-fingerprint"]
      dependsOn: []
      params: |
        sort_extensions = true
        exclude_extensions = [41]
        ja4 = true
    maxmind:
      enabled: '{{ false }}'
      timeoutMs: 10
      messages: ["geoip-enrich"]
      dependsOn: []
      # Site-specific: supply MMDB paths and lookup definitions.
      # See https://gitlab.com/haproxy-haptic/haproxy-spoa-hub-plugin-maxmind
      params: |
        # [databases]
        # city = { path = "/data/GeoLite2-City.mmdb" }
        # asn  = { path = "/data/GeoLite2-ASN.mmdb" }
        #
        # [[lookups]]
        # name       = "country_code"
        # message    = "geoip-enrich"
        # database   = "city"
        # path       = ["country", "iso_code"]
        # output_var = "geo_country"
    mirror:
      # Auto-enabled when the gateway library is on. The Gateway API
      # HTTPRouteFilter of type RequestMirror is the only chart consumer
      # of this plugin today; flipping the gateway library on signals the
      # operator wants Gateway-API features including request mirroring.
      # Without this auto-derive an operator who configures a Gateway
      # with a RequestMirror filter would get silently-ignored mirroring
      # unless they also flipped this flag — and the controller would
      # then emit a chart-render error pointing at the missing plugin.
      enabled: '{{ .Values.controller.templateLibraries.gateway.enabled }}'
      # SPOE-side processing timeout. The plugin's `process()` only does
      # synchronous SPOE-arg parsing and a tokio spawn — microseconds —
      # so the ack is back to HAProxy long before this hits. The actual
      # HTTP roundtrip to the mirror backend is governed by the plugin's
      # own `timeout_ms` (under `params:` below) and never blocks HAProxy.
      timeoutMs: 50
      # HAProxy SPOE only processes each group once per stream
      # ("only one call to a group is allowed per stream", per the
      # docs). For HTTPRoutes carrying multiple RequestMirror filters,
      # the chart emits one (set-var, set-var, send-spoe-group) triple
      # per filter, each referencing its OWN group — so we need one
      # message name per possible mirror index. Four is enough for the
      # conformance suite (max 2 mirrors per rule today) plus headroom;
      # bump if a real workload exceeds it. Plugin-side these are all
      # routed to the same mirror plugin (the plugin's process() only
      # reads SPOE args, not the message name), so no plugin change is
      # required to grow this list.
      messages: ["mirror-1", "mirror-2", "mirror-3", "mirror-4"]
      dependsOn: []
      # Plugin runtime knobs (rendered into the spoa-hub TOML's
      # [plugins.params] block for the mirror plugin). All fields map
      # 1:1 to the plugin's PluginConfig struct
      # (haproxy-spoa-hub-plugin-mirror/src/config.rs):
      #   - timeout_ms: per-request HTTP timeout to the mirror backend.
      #   - max_body_bytes: cap on reassembled body bytes. Bodies larger
      #     than this are truncated and the mirror request is still sent.
      #   - request_concurrency: bounded in-flight dispatches across all
      #     targets. When saturated, excess dispatches are dropped (not
      #     queued) — keeps the SPOA worker thread responsive under burst
      #     load. Defaults match the plugin's own defaults; raise for
      #     high-fan-out workloads.
      #   - verify_tls: validate TLS certs for HTTPS mirror targets.
      #     Defaults to false because the Gateway API conformance suite
      #     uses self-signed in-cluster certs. Once BackendTLSPolicy-style
      #     trust material is threaded through to the mirror plugin a
      #     future minor release will flip this default to true.
      #   - worker_threads (v0.2.0+, omitted by default): tokio worker
      #     thread count. Omitting the line lets the plugin auto-derive
      #     from std::thread::available_parallelism() (cgroup-aware on
      #     Linux 5.16+ / glibc 2.36+, so a sidecar with cpu:100m sees
      #     its limit rather than the host's CPU count) and floor at 2.
      #     The floor of 2 is load-bearing — a single-worker tokio
      #     runtime self-deadlocks under load because reqwest's
      #     connection driver and per-request dispatch tasks would have
      #     to share one worker. Operators who want predictable
      #     resource accounting can pin a specific count by uncommenting
      #     the line below; the default scales with the available
      #     parallelism so high-load multi-core deployments aren't
      #     bottlenecked on the pre-v0.2.0 hardcoded `worker_threads=2`.
      #   - pool_max_idle_per_host (v0.2.0+, default 32): bounds the
      #     per-target idle-connection pool. reqwest's default is
      #     unbounded, which is fine for a single hot target but
      #     accumulates unbounded idle keep-alive sockets in a
      #     long-running plugin mirroring to many distinct backends.
      #     0 disables idle reuse entirely.
      params: |
        timeout_ms = 200
        max_body_bytes = 1048576
        request_concurrency = 1024
        verify_tls = false
        # worker_threads = 4
        pool_max_idle_per_host = 32
    otel:
      enabled: '{{ false }}'
      timeoutMs: 50
      messages: ["otel-on-request", "otel-on-response"]
      dependsOn: []
      # Dotted keys (instead of an `[instrumentation]` header) keep these
      # values inside the `[plugins.params]` scope. For richer configs with
      # arrays of tables (tracer_pipelines, exporters, …), use
      # `[plugins.params.tracer_pipelines]` etc. — see the upstream README.
      params: |
        instrumentation.name = "haproxy-edge"
        instrumentation.scopes = ["request", "response"]
    sso-auth:
      enabled: '{{ false }}'
      timeoutMs: 6000
      messages: ["auth-request"]
      dependsOn: []
      params: |
        max_providers = 10
        max_session_age_seconds = 3600

  # Pod-level securityContext additions. Merged into the existing
  # haproxy.podSecurityContext at render time.
  podSecurityContext: {}

  # Container-level securityContext for the spoa-hub container. runAsUser=99
  # matches the pod's existing fsGroup (99) so the unix socket the hub
  # creates under /run/spoa is accessible to the haproxy container without
  # extra plumbing.
  securityContext:
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 99
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Extra volume mounts added to the spoa-hub container only. Useful for
  # mounting MMDB files (maxmind), OIDC client secrets (sso-auth), etc.
  # Example:
  #   - name: maxmind-data
  #     mountPath: /data
  #     readOnly: true
  extraVolumeMounts: []

extraDeploy: {}
