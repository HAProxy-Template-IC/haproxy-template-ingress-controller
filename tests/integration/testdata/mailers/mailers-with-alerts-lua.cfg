global
    tune.lua.bool-sample-conversion normal
    lua-load general/mailers.lua
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 600 level admin

mailers alerts
    mailer smtp1 192.0.2.1:587
    mailer smtp2 192.0.2.2:587
    timeout mail 10s

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

backend web
    email-alert mailers alerts
    email-alert from haptic@example.invalid
    email-alert to operator@example.invalid
    email-alert level alert
    server srv1 10.0.0.1:8080
