global
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 600 level admin

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http
    bind *:80
    # Strategy-1 request body-size enforcement, exactly as the chart's
    # frontend-filters-250-request-body-size renders it: the per-backend limit
    # lives in body-size.map (keyed on the resolved backend), NOT in the backend
    # section. backend_name is resolved by routing in production; set explicitly
    # here so the map lookup has a key.
    http-request set-var(txn.backend_name) str(web)
    http-request set-var(txn.haptic_body_limit) var(txn.backend_name),map(/etc/haproxy/maps/body-size.map,0),add(0)
    http-request deny deny_status 413 if { var(txn.haptic_body_limit) -m int gt 0 } { req.body_size,sub(txn.haptic_body_limit) -m int gt 0 }
    default_backend web

backend web
    balance roundrobin
    server srv1 192.168.1.10:8080 check
