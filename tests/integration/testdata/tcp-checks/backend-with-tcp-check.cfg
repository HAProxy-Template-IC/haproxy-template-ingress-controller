global
    daemon
    maxconn 4096

defaults
    mode tcp
    timeout client 30s
    timeout server 30s
    timeout connect 5s

frontend tcp-in
    bind *:3306
    default_backend mysql

backend mysql
    balance roundrobin
    option tcp-check
    tcp-check connect
    tcp-check expect string +OK
    server srv1 192.168.1.10:3306 check
