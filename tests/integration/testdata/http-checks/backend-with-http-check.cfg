global
    daemon
    maxconn 4096

defaults
    mode http
    timeout client 30s
    timeout server 30s
    timeout connect 5s

frontend http-in
    bind *:80
    default_backend web

backend web
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server srv1 192.168.1.10:80 check
