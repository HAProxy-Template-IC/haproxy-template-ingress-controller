# Audited Ingresses for the migrate-check offline integration test.
# Mixed sources, statuses, and one render-failing Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: store
  annotations:
    acme.io/ssl-redirect: "true"
    acme.io/canary: "true"
    acme.io/unknown-knob: "42"
spec:
  ingressClassName: acme
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: store
  annotations:
    acme.io/rate-limit: "100"
spec:
  ingressClassName: acme
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8080
---
# Attributed by the legacy class annotation, and carries a FAILING annotation
# — the template's fail() rejects it, so this is a blocker via REAL render.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy
  namespace: store
  annotations:
    kubernetes.io/ingress.class: acme
    acme.io/rewrite-target: /
spec:
  rules:
    - host: legacy.example.com
      http:
        paths:
          - path: /old
            pathType: Prefix
            backend:
              service:
                name: legacy-svc
                port:
                  number: 80
---
# No source annotations and not the acme class → unattributed, renders fine.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plain
  namespace: default
spec:
  ingressClassName: someone-else
  rules:
    - host: plain.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plain-svc
                port:
                  number: 80
