# Hand-made migrate-check fixture config.
#
# This is a minimal, self-contained HAProxyTemplateConfig used only by the
# migrate-check offline integration test. It stands in for the real chart
# render: it watches networking.k8s.io/v1 Ingresses, declares
# spec.migrationCoverage in the contract shape (source detect rules +
# per-annotation status/note/doc), and its haproxyConfig template rejects
# one specific annotation via fail() so the test exercises the REAL-render
# hard-failure path (not a hardcoded Go check).
#
# The coverage data here is fictitious ("acme" / acme.io/*) on purpose: the
# Go side must be entirely data-driven, so the test proves classification
# with a source name that appears in NO vendor library.
apiVersion: haproxy-haptic.org/v1alpha1
kind: HAProxyTemplateConfig
metadata:
  name: migrate-check-fixture
spec:
  watchedResources:
    ingresses:
      apiVersion: networking.k8s.io/v1
      resources: ingresses
      indexBy:
        - metadata.namespace
        - metadata.name

  haproxyConfig:
    template: |
      global
        default-path origin {{ pathResolver.GetBaseDir() }}
        log stdout format raw local0

      defaults
        mode http
        timeout connect 5s
        timeout client 30s
        timeout server 30s

      frontend http
        bind :8080
        default_backend not-found

      {%- for _, ing := range resources.ingresses.List() %}
      {%%
        var ns   = ing | dig("metadata", "namespace") | fallback("") | tostring()
        var name = ing | dig("metadata", "name") | fallback("") | tostring()
        var anns = ing | dig("metadata", "annotations") | fallback(map[string]any{})
        var unsupported = anns | dig("acme.io/rewrite-target") | fallback("") | tostring()
      %%}
      {%- if unsupported != "" %}
        {{ fail("acme.io/rewrite-target is not supported: " + ns + "/" + name) }}
      {%- end %}
      backend ingress_{{ ns }}_{{ name }}
        server app 127.0.0.1:8080
      {%- end %}

      backend not-found
        http-request deny deny_status 404

  migrationCoverage:
    - source: acme
      detect:
        ingressClasses:
          - acme
        annotationPrefixes:
          - acme.io/
      annotations:
        acme.io/ssl-redirect:
          status: supported
          note: HAPTIC redirects HTTP to HTTPS the same way.
          doc: migrating.md#ssl-redirect
        acme.io/rate-limit:
          status: different
          note: HAPTIC rate-limits per HAProxy worker, not cluster-wide, so the effective limit is higher under multiple replicas.
          doc: migrating.md#rate-limit
        acme.io/canary:
          status: dropped
          note: Canary weighting is ignored; all traffic goes to the primary backend.
          doc: migrating.md#canary
        acme.io/rewrite-target:
          status: fails
          note: Path rewriting via this annotation is rejected; use a HAPTIC path-rewrite template instead.
          doc: migrating.md#rewrite-target
