# Minimal from-scratch HAProxy ingress.
#
# One backend per watched Service, routed by "<service>.example.com" via a
# generated host map. Edit this template, or add a Service on the right, and
# watch the rendered haproxy.cfg change.
dataplane:
  mapsDir: /etc/haproxy/maps
  sslCertsDir: /etc/haproxy/ssl
  generalStorageDir: /etc/haproxy/general

haproxyConfig:
  template: |
    global
      default-path origin {{ pathResolver.BaseDir }}
      log stdout format raw local0

    defaults
      mode http
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    resolvers cluster-dns
      parse-resolv-conf
      hold valid 10s

    frontend http
      bind :8080
      # Route by Host header via the generated host -> backend map.
      use_backend %[req.hdr(host),lower,map({{ pathResolver.GetPath("host.map", "map") }})]
      default_backend not-found
    {%- for _, svc := range resources.services.List() %}
    backend {{ svc.metadata.namespace }}_{{ svc.metadata.name }}
      server app {{ svc.metadata.name }}.{{ svc.metadata.namespace }}.svc check resolvers cluster-dns init-addr none
    {%- end %}

    backend not-found
      http-request deny deny_status 404

watchedResources:
  services:
    apiVersion: v1
    resources: services
    indexBy:
      - metadata.namespace
      - metadata.name

maps:
  host.map:
    template: |
      {% for _, svc := range resources.services.List() %}{{ svc.metadata.name }}.example.com {{ svc.metadata.namespace }}_{{ svc.metadata.name }}
      {% end %}
