# Minimal from-scratch HAProxy ingress.
#
# One backend per watched Service, routed by "<service>.example.com" via a
# generated host map. Edit this template, or add a Service on the right, and
# watch the rendered haproxy.cfg change.
#
# The controller is resource-agnostic: it learns each resource's shape from the
# cluster (or a bundled schema) at runtime. Here we use the untyped
# resources.services.List() + dig() access, which needs no schema.
haproxyConfig:
  template: |
    global
      log stdout format raw local0

    defaults
      mode http
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    resolvers cluster-dns
      parse-resolv-conf
      hold valid 10s

    frontend http
      bind :8080
      # Route by Host header via the generated host -> backend map.
      use_backend %[req.hdr(host),lower,map({{ pathResolver.GetPath("host.map", "map") }})]
      default_backend not-found
    {%- for _, svc := range resources.services.List() %}
    {%%
      var ns   = svc | dig("metadata", "namespace") | fallback("") | tostring()
      var name = svc | dig("metadata", "name") | fallback("") | tostring()
    %%}
    backend {{ ns }}_{{ name }}
      server app {{ name }}.{{ ns }}.svc check resolvers cluster-dns init-addr none
    {%- end %}

    backend not-found
      http-request deny deny_status 404

watchedResources:
  services:
    apiVersion: v1
    resources: services
    indexBy:
      - metadata.namespace
      - metadata.name

maps:
  host.map:
    template: |
      {% for _, svc := range resources.services.List() %}{{ svc | dig("metadata", "name") | fallback("") | tostring() }}.example.com {{ svc | dig("metadata", "namespace") | fallback("") | tostring() }}_{{ svc | dig("metadata", "name") | fallback("") | tostring() }}
      {% end %}
