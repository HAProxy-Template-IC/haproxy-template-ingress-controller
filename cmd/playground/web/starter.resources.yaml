# Paste your own `kubectl get svc -A -o yaml` here, or edit these. The playground
# accepts a kubectl List (below), a single object, or a multi-document stream, and
# buckets each object by apiVersion+kind against the config's watchedResources.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: shop
      namespace: demo
    spec:
      ports:
        - port: 8080
  - apiVersion: v1
    kind: Service
    metadata:
      name: blog
      namespace: demo
    spec:
      ports:
        - port: 80
