# Example resources for the Gateway API library. This is what
# `kubectl get gatewayclasses,gateways,httproutes,svc,endpointslices,secrets -A -o yaml`
# produces. A GatewayClass (matching the controller) + a Gateway with an HTTP
# listener + an HTTPRoute route "api.example.com" to the "api" Service.
apiVersion: v1
kind: List
items:
  # HAPTIC's own LoadBalancer Service, as the cluster reports it. The controller
  # discovers its external address here (status.loadBalancer.ingress) and writes
  # it into each Ingress/Gateway .status (the "deployed" phase). Replace the
  # example IP with your controller's real LoadBalancer address — or delete this
  # object to see the no-address case. Matched by the controller_services watcher.
  - apiVersion: v1
    kind: Service
    metadata:
      name: release-name-haptic-haproxy
      namespace: default
      labels:
        app.kubernetes.io/name: haptic
        app.kubernetes.io/component: loadbalancer
    spec:
      type: LoadBalancer
    status:
      loadBalancer:
        ingress:
          - ip: 203.0.113.42
  # Default TLS certificate served for HTTPS (self-signed example cert).
  - apiVersion: v1
    kind: Secret
    type: kubernetes.io/tls
    metadata:
      name: default-ssl-cert
      namespace: default
    data:
      tls.crt: 
      tls.key: 
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata: {name: haptic}
    spec: {controllerName: haproxy-haptic.org/controller}
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: edge, namespace: platform}
    spec:
      gatewayClassName: haptic
      listeners:
        - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
  - apiVersion: v1
    kind: Service
    metadata: {name: api, namespace: platform}
    spec:
      ports: [{name: http, port: 80, targetPort: 8080}]
      selector: {app: api}
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata: {name: api-e5f6, namespace: platform, labels: {kubernetes.io/service-name: api}}
    addressType: IPv4
    ports: [{name: http, port: 8080}]
    endpoints:
      - {addresses: [10.244.4.30], conditions: {ready: true}}
      - {addresses: [10.244.5.31], conditions: {ready: true}}
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: api, namespace: platform}
    spec:
      parentRefs: [{name: edge}]
      hostnames: [api.example.com]
      rules:
        - matches: [{path: {type: PathPrefix, value: /}}]
          backendRefs: [{name: api, port: 80}]
