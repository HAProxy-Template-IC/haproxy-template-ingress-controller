extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation: disable
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

ignore:
  - charts/haptic/templates/  # Helm templates contain Go template syntax
  - tests/schemas-ga-*/       # Vendored upstream Gateway API release CRDs (scripts/fetch-gateway-api-schemas.sh)
  - .claude/                  # Session state and nested worktrees; may contain Helm templates
  - .codex/                   # Ditto — the Makefile already excludes it from markdownlint
  - pkg/generated/
  - node_modules/
  - vendor/
  - docs/vale/styles/Google/     # Vendored Vale style package (vale sync), kept byte-identical to upstream
  - debug-logs/               # Test failure artifacts (tests/e2e/cleanup.go), captured for CI
  - .cache/                   # CI go module/build cache; contains 3rd-party YAML
