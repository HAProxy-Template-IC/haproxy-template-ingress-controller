# Development values for HAPTIC Helm chart

# Explicit credentials for dev environment (avoids auto-generation complexity)
# In production, leave password empty to auto-generate secure random credentials
credentials:
  dataplane:
    username: admin
    password: adminpass

# IngressClass name must match what the demo ingresses use
ingressClass:
  name: haptic

# Use local development image
image:
  repository: haptic
  tag: dev
  pullPolicy: Never  # Never pull, always use local image

# Enable Gateway API support for development
controller:
  templateLibraries:
    gateway:
      enabled: true
    # Enable nginx-ingress library so nginx.ingress.kubernetes.io/auth-url
    # is wired (also auto-flips spoaHub.plugins.external-auth.enabled on,
    # since the OR-expression in values.yaml gates on this library).
    nginxIngress:
      enabled: true

  logLevel: DEBUG  # LOG_LEVEL env var for controller startup
  config:
    logging:
      level: DEBUG  # Runtime log level (overrides env var if set)

    # Fast-timings preset for dev/CI: collapse every event-to-deploy throttle
    # to ~100ms and push driftPreventionInterval out to 10m so it doesn't
    # fire mid-test. Production defaults (5s refractory, 2s minDeploymentInterval,
    # 30s configPublishInterval, 60s driftPreventionInterval) target steady-
    # state load on real clusters; in CI they only add latency that nobody
    # benefits from. Safety ceilings (reloadVerificationTimeout, syncTimeout,
    # deploymentTimeout, syncMaxRetries) are deliberately left at chart
    # defaults — they only matter on failure paths.
    controller:
      reconciliationDebounceInterval: 100ms
    dataplane:
      minDeploymentInterval: 100ms
      configPublishInterval: 200ms
      driftPreventionInterval: 10m

    templatingSettings:
      extraContext:
        debug: true  # Enable introspection headers for development

    # HTTP Store Demo: Block requests based on header values from HTTP-fetched blocklist
    maps:
      header-blocklist.map:
        template: |
          {%- var blocklist_url = "http://blocklist-server.echo.svc:80/blocklist.txt" -%}
          {%- var blocklist_content, _ = http.Fetch(blocklist_url, map[string]any{"critical": true, "delay": "60s"}) -%}
          {%- for _, line := range (blocklist_content | tostring() | split("\n")) -%}
          {%- var value = trimSpace(line) -%}
          {%- if value != "" -%}
          {{ value }} 1
          {% end -%}
          {%- end %}

    templateSnippets:
      # Hook into frontend routing to check header against blocklist
      # Uses "frontend-filters-*" naming convention to be auto-included by base.yaml
      frontend-filters-http-store-demo:
        template: |
          # HTTP Store Demo: Block requests with blacklisted header values
          http-request deny deny_status 403 if { req.hdr(X-Custom-Header) -m found } { req.hdr(X-Custom-Header),map({{ pathResolver.GetPath("header-blocklist.map", "map") }}) -m found }

# HAProxy Service - expose externally via NodePort for dev/testing
haproxy:
  service:
    type: NodePort
    # Explicit NodePorts must be set to match kind extraPortMappings
    http:
      nodePort: 30080
    https:
      nodePort: 30443
    stats:
      nodePort: 30404
  # kind cluster maps NodePort services to localhost via extraPortMappings
  # This makes HAProxy accessible at http://localhost:30080 and https://localhost:30443

  # Enable network policies in dev with permissive settings
  networkPolicy:
    enabled: true
    allowExternal: true  # Allow NodePort access from host

# Resource limits for development (allow more flexibility)
resources:
  limits:
    cpu: "4"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Disable autoscaling for development (fixed replica count)
autoscaling:
  enabled: false

networkPolicy:
  enabled: true

# Development-specific pod labels for easier identification
podLabels:
  environment: development
  managed-by: dev-script

# Disable health probes until /healthz endpoint is implemented
livenessProbe: {}
readinessProbe: {}

# Disable monitoring for simpler development setup
monitoring:
  serviceMonitor:
    enabled: false

# Enable webhook for development testing
webhook:
  enabled: true
  # secretName defaults to: {{ include "haptic.fullname" . }}-webhook-cert
  certManager:
    enabled: false  # Use manual certificates generated by dev script
  # CA bundle will be set dynamically by dev script via --set webhook.caBundle=...

# External-auth plugin for the SPOA hub. allow_plaintext=true is needed
# because the dev auth-server.yaml fixture serves http://, not https://.
# image.tag defaults to "main-latest" so local devs get the most recent
# main-branch image without having to build it themselves; CI overrides
# this via the SPOA_TAG env var (passed through start-dev-env.sh) to
# point at the freshly-built ci-${CI_PIPELINE_ID} snapshot.
# hub.logLevel is bumped to debug so test failures surface the per-
# connection SPOE handshakes and per-request plugin invocations
# (the default `info` level only logs startup messages).
spoaHub:
  image:
    tag: main-latest
  hub:
    logLevel: debug
  plugins:
    external-auth:
      params: |
        timeout_ms = 5000
        fail_open = false
        method = "GET"
        allow_plaintext = true
        forward_headers = [
          "authorization", "cookie",
          "x-forwarded-for", "x-forwarded-proto",
          "x-forwarded-host", "x-forwarded-uri"
        ]
        extract_headers = ["x-auth-user", "x-auth-roles"]
    # Enable coraza so the controller renders the WAF section into
    # /etc/haproxy/general/spoa-hub-config.toml. The runtime hub
    # reloads on file-watch (haproxy-spoa-hub MR1), so per-Ingress
    # `nginx.ingress.kubernetes.io/modsecurity-snippet` annotations
    # land in the running config without a pod restart. Smallest
    # viable directives — operators wanting OWASP CRS get the chart
    # default; CI keeps it minimal so per-test snippets are the only
    # rules surfacing 403s during e2e.
    coraza:
      enabled: 'true'
      directives: |
        SecRuleEngine On
      params: |
        request_body_limit = 131072
        request_body_in_memory_limit = 131072
        response_body_limit = 131072
        response_check = false
        detect_only = false
        transaction_ttl_ms = 10000
