---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-production-config
  namespace: haptic
data:
  haproxy.cfg: |
    global
        log stdout len 4096 local0 info
        # The agent runs every runtime command on this socket; the master
        # socket (-S below) serves reload and show proc only.
        stats socket /etc/haproxy/haproxy-worker.sock mode 600 level admin
        default-path origin /etc/haproxy

    defaults
        mode http
        log global
        option httplog
        option dontlognull
        timeout connect 5000
        timeout client 50000
        timeout server 50000

    frontend status
        bind *:8404
        http-request return status 200 content-type text/plain string "OK" if { path /healthz }

    frontend http_frontend
        bind *:8080
        default_backend default_backend

    backend default_backend
        http-request return status 404

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-production
  namespace: haptic
  labels:
    app: haproxy
    component: loadbalancer
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
      component: loadbalancer
  template:
    metadata:
      labels:
        app: haproxy
        component: loadbalancer
        environment: production
    spec:
      containers:
        # HAProxy container
        - name: haproxy
          image: haproxytech/haproxy-debian:3.2.23
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Create required directories
              mkdir -p /etc/haproxy/maps /etc/haproxy/ssl /etc/haproxy/general
              chown -R haproxy:haproxy /etc/haproxy

              # Copy initial config
              cp /config/haproxy.cfg /etc/haproxy/haproxy.cfg

              # Start HAProxy in master-worker mode with master socket
              exec haproxy -W -db -S "/etc/haproxy/haproxy-master.sock,level,admin" -- /etc/haproxy/haproxy.cfg
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: healthz
              containerPort: 8404
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: haproxy-runtime
              mountPath: /etc/haproxy
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8404
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8404
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

        # HAPTIC agent: owns this pod's file tree and HAProxy's sockets.
        # It runs the controller's own image — one binary, two roles — so the
        # image tag must match the controller's.
        - name: agent
          image: registry.gitlab.com/haproxy-haptic/haptic:0.2.0-alpha.1-haproxy3.2
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - --base-dir=/etc/haproxy
            - --config=haproxy.cfg
            - --listen=:5555
          env:
            # The same Secret the controller reads, so both ends of the wire
            # agree without a second credential to rotate.
            - name: DATAPLANE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haptic-dataplane-credentials
                  key: username
            - name: DATAPLANE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haptic-dataplane-credentials
                  key: password
          ports:
            - name: dataplane
              containerPort: 5555
              protocol: TCP
            - name: agent-metrics
              containerPort: 9101
              protocol: TCP
          volumeMounts:
            - name: haproxy-runtime
              mountPath: /etc/haproxy
          # /readyz means "the agent can accept applies": the sockets answer,
          # the tree is hashed and the inventory is built. It stays true after a
          # rejected apply, because draining the pod would fence off the repair.
          startupProbe:
            httpGet:
              path: /readyz
              port: 5555
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5555
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi

      volumes:
        - name: config
          configMap:
            name: haproxy-production-config
        - name: haproxy-runtime
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-production
  namespace: haptic
  labels:
    app: haproxy
    component: loadbalancer
spec:
  type: NodePort
  selector:
    app: haproxy
    component: loadbalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
    - name: healthz
      port: 8404
      targetPort: 8404
      nodePort: 30404
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-production-dataplane
  namespace: haptic
  labels:
    app: haproxy
    component: loadbalancer
spec:
  type: ClusterIP
  selector:
    app: haproxy
    component: loadbalancer
  ports:
    - name: dataplane
      port: 5555
      targetPort: 5555
      protocol: TCP
