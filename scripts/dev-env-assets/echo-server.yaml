# echo-server: stateless backend used as the upstream for routing tests.
#
# Image: jmalloc/echo-server (well-known echo-style HTTP server that
# returns the incoming request as JSON, including headers and body).
# Used by both the e2e test suite (tests/e2e) and the dev-env script
# (scripts/start-dev-env.sh). Identical to what start-dev-env.sh applies
# inline as a heredoc — the YAML lives here so it can be embedded into
# the Go e2e suite via the devassets package.
---
apiVersion: v1
kind: Namespace
metadata:
  name: echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: echo
  labels:
    app: echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
        - name: server
          image: ealen/echo-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: echo
  labels:
    app: echo-server
spec:
  selector:
    app: echo-server
  ports:
    - name: http
      port: 80
      targetPort: 80
