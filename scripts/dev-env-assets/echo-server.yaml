# echo-server: stateless backend used as the upstream for routing tests.
#
# Image: ealen/echo-server (well-known echo-style HTTP server that
# returns the incoming request as JSON, including headers and body).
# Used by both the e2e test suite (tests/e2e) and the dev-env script
# (scripts/start-dev-env.sh). Identical to what start-dev-env.sh applies
# inline as a heredoc — the YAML lives here so it can be embedded into
# the Go e2e suite via the devassets package.
---
apiVersion: v1
kind: Namespace
metadata: {name: echo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo-server, namespace: echo, labels: {app: echo-server}}
spec:
  replicas: 1
  selector: {matchLabels: {app: echo-server}}
  template:
    metadata: {labels: {app: echo-server}}
    spec:
      containers:
        - name: server
          image: ealen/echo-server@sha256:ec8a6e95890df937a1eb5fafca033a32172d4f43c1fea1f302931d5f230a137f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # K8s contract: a backend Pod is Ready only when its
          # listener actually answers — not the instant the
          # container process starts. Without this probe kubelet
          # marks the container Running (= Ready, since no other
          # probe is configured), EndpointSlice flips while Node
          # is still loading modules and hasn't called listen()
          # yet, and any consumer routes to a pod whose kernel
          # RSTs incoming SYNs. Closing this race is what
          # readiness probes exist for; every fixture serving
          # real traffic in the e2e suite needs one.
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
            successThreshold: 1
            failureThreshold: 1
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata: {name: echo-server, namespace: echo, labels: {app: echo-server}}
spec:
  selector: {app: echo-server}
  ports:
    - name: http
      port: 80
      targetPort: 80
