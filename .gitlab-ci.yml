stages:
  - lint
  - test
  - build
  - integration
  - deploy

# Triggers the documented zero-jobs-MR workaround. This MR (!1183) is
# docs-only (landing-page CSS/HTML polish); its diff matches only `docs/**`,
# which doesn't fire `.rules-docs` reliably — same shape as the !980/!995
# gap. Touching .gitlab-ci.yml gives the pipeline runnable jobs.

# Prevent duplicate pipelines for MR and branch pushes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # Language and tool versions
  # renovate: datasource=docker depName=golang
  GO_VERSION: "1.26"
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29"
  # renovate: datasource=docker depName=python
  PYTHON_VERSION: "3.14"
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: "0.32.0"
  # renovate: datasource=docker depName=kindest/node
  KIND_NODE_VERSION: "v1.36.1"
  # Container registry
  CI_REGISTRY_IMAGE: registry.gitlab.com/haproxy-haptic/haptic
  # Coverage packages (excludes generated code) - keep in sync with Makefile
  COVERAGE_PACKAGES: "./cmd/...,./pkg/compression/...,./pkg/controller/...,./pkg/core/...,./pkg/dataplane/...,./pkg/events/...,./pkg/httpstore/...,./pkg/introspection/...,./pkg/k8s/...,./pkg/lifecycle/...,./pkg/metrics/...,./pkg/stores/...,./pkg/templating/...,./pkg/webhook/..."
  # Chart testing tool versions
  # renovate: datasource=github-releases depName=helm/chart-testing
  CT_VERSION: "3.14.0"
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "1.1.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "0.8.0"
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.38.0"
  # markdownlint-cli2 pinned to 0.14.0 - newer versions require Node.js 20+
  MARKDOWNLINT_VERSION: "0.14.0"
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: "2.16.0"
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: "3.1.1"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "1.46.0"
  # CI image base path - tag is computed from Dockerfile content hash (see compute-ci-image-tag job)
  # Short hash-based tags avoid the 128-char OCI tag limit while maintaining cacheability
  CI_IMAGE_BASE: ${CI_REGISTRY_IMAGE}/ci

# Reusable rules for path-based filtering.
#
# KNOWN GAP: docs-only MRs (e.g. `charts/haptic/CHANGELOG.md` or
# `docs/**/*.md` only, with no other file types touched) produce MR
# pipelines with zero runnable jobs — GitLab marks them `failed` and
# the project's `ci_must_pass` gate blocks the merge. Workaround
# until this is properly diagnosed: include a `.gitlab-ci.yml`
# touch (e.g. a comment edit) in any otherwise-docs-only MR so the
# diff matches the `.gitlab-ci.yml` entry below. Four `if:`-based
# attempts to fix this in CI rules (MRs !957, !959, !960, !961) all
# failed empirically — `if:`-only job rules don't reliably fire on
# this project's MR pipelines even when their condition is true.
# Likely a project-level setting we can't see from outside.
#
# Workaround applied to !1162 (docs-only): this comment puts .gitlab-ci.yml
# in the MR diff so the merge_request pipeline has runnable jobs.
.rules-code:
  rules:
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - .tool-versions
        - Makefile
        - Dockerfile
        - scripts/**/*
        - .gitlab-ci.yml
        - .golangci.yml
        # Config files (ensures lint job runs for config-only changes)
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.json"
        - "**/*.md"
        - .markdownlint-cli2.jsonc

.rules-helm:
  rules:
    - changes:
        - charts/**/*
        - .gitlab-ci.yml
        # Re-run chart-test (which runs `make chart-size-check`) when the
        # release-Secret size estimator itself changes, so a broken gate is caught.
        - scripts/check-chart-release-size.py

.rules-docs:
  rules:
    - changes:
        - docs/**/*
        - charts/**/docs/**/*
        - charts/**/mkdocs.yml
        - .gitlab-ci.yml

# Jobs that only run on MRs (skip main branch and tags)
# Use when tests already passed in MR and don't need to re-run on merge
.rules-mr-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never

# HAProxy version matrix for multi-version testing
.haproxy-version-matrix:
  parallel:
    matrix:
      - HAPROXY_VERSION: ["3.0", "3.1", "3.2", "3.3", "3.4"]

# Go module + build cache for the unit-test job. Earlier experiments
# applied this cache to every Go-using job and measured regressions:
# audit 96s → 230s, validate-helm-libraries 187s → 269-386s, build-snapshot
# 160s → 360s. The ~100s build-cache upload (~22890 files for an empty
# delta) exceeded their actual work. Only the unit-test job is large
# enough that the compile savings (~150s) outweigh the cache transfer
# (~100s), so the cache is scoped to it alone.
# go.sum keys both entries: a renovate dep bump invalidates and refetches;
# otherwise the next run gets a warm cache and only recompiles changed
# packages.
.go-cache:
  cache:
    - key:
        files:
          - go.sum
        prefix: go-mod
      paths:
        - .cache/go-mod
      policy: pull-push
    - key:
        files:
          - go.sum
        prefix: go-build-test
      paths:
        - .cache/go-build
      policy: pull-push
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod

# Docker-in-Docker base configuration for jobs that need to run Docker commands
# (e.g., kind clusters, docker build). In GitLab CI, the Docker daemon runs in
# a separate container (docker:dind service) accessible via the "docker" hostname.
.docker-dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_HOST: tcp://docker:2376
  tags:
    - saas-linux-xlarge-amd64
  retry:
    max: 2
    when: runner_system_failure

# Base configuration for goreleaser jobs (snapshot and release)
# Provides Docker login, buildx setup, and common dependencies
.goreleaser-base:
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  extends:
    - .docker-dind
  needs:
    - compute-ci-image-tag
    - job: build-ci
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Create named context for TLS-enabled DinD (workaround for docker/buildx#2520)
    - docker context create builder-context
    - docker buildx create --use --name multiarch --bootstrap builder-context

# =============================================================================
# CI Image Builds (.pre stage - runs before all other stages)
# =============================================================================

# Compute CI image tag from Dockerfile content hash
# This job runs in .pre stage and exports CI_IMAGE_TAG for other jobs via dotenv artifact
# Using content hash ensures: deterministic tags, short tags (<128 chars), automatic cache invalidation
compute-ci-image-tag:
  stage: .pre
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  script:
    - |
      DOCKERFILE_HASH=$(sha256sum .gitlab/ci/images/ci/Dockerfile | cut -c1-12)
      echo "CI_IMAGE_TAG=${DOCKERFILE_HASH}" >> ci-image.env
      echo "Computed CI image tag from Dockerfile hash: ${DOCKERFILE_HASH}"
  artifacts:
    reports:
      dotenv: ci-image.env

.build-ci-image:
  stage: .pre
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  tags:
    - saas-linux-medium-amd64
  # NOTE: build-ci runs unconditionally (except on tags). Two earlier failure
  # modes forced this:
  #   1. Main-branch merge commits blending concurrent Dockerfile edits produced
  #      a content hash present in no feature branch, so no image was pushed
  #      for it and subsequent branches failed on manifest-unknown.
  #   2. MR pipelines whose diff touched `.gitlab/ci/images/**` sometimes still
  #      skipped build-ci due to how `changes:` resolves in MR context (see the
  #      MR !530 / pipeline 2478325374 incident), leaving downstream jobs to
  #      race an unbuilt image tag.
  # Downstream jobs depend on build-ci non-optionally, so the CI image is
  # guaranteed present. --import-cache + inline cache export in the script
  # below keeps unchanged rebuilds fast (cache hit on every layer, no-op push).
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json

build-ci:
  extends:
    - .build-ci-image
    - .haproxy-version-matrix
  needs:
    - compute-ci-image-tag
  script:
    - |
      CI_IMAGE="${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}"
      echo "Building CI image: ${CI_IMAGE}"

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=.gitlab/ci/images/ci/ \
        --local dockerfile=.gitlab/ci/images/ci/ \
        --opt build-arg:GO_VERSION=${GO_VERSION} \
        --opt build-arg:HAPROXY_VERSION=${HAPROXY_VERSION} \
        --opt build-arg:DOCKER_VERSION=${DOCKER_VERSION} \
        --opt build-arg:KIND_VERSION=${KIND_VERSION} \
        --opt build-arg:CT_VERSION=${CT_VERSION} \
        --opt build-arg:HELM_UNITTEST_VERSION=${HELM_UNITTEST_VERSION} \
        --opt build-arg:KUBECONFORM_VERSION=${KUBECONFORM_VERSION} \
        --opt build-arg:YAMLLINT_VERSION=${YAMLLINT_VERSION} \
        --opt build-arg:MARKDOWNLINT_VERSION=${MARKDOWNLINT_VERSION} \
        --opt build-arg:GORELEASER_VERSION=${GORELEASER_VERSION} \
        --opt build-arg:COSIGN_VERSION=${COSIGN_VERSION} \
        --opt build-arg:SYFT_VERSION=${SYFT_VERSION} \
        --opt label:org.opencontainers.image.source=${CI_PROJECT_URL} \
        --opt label:org.opencontainers.image.revision=${CI_COMMIT_SHA} \
        --opt label:haptic.ci.dockerfile-hash=${CI_IMAGE_TAG} \
        --opt label:haptic.ci.go-version=${GO_VERSION} \
        --opt label:haptic.ci.haproxy-version=${HAPROXY_VERSION} \
        --opt label:haptic.ci.docker-version=${DOCKER_VERSION} \
        --opt label:haptic.ci.kind-version=${KIND_VERSION} \
        --opt label:haptic.ci.goreleaser-version=${GORELEASER_VERSION} \
        --opt label:haptic.ci.cosign-version=${COSIGN_VERSION} \
        --opt label:haptic.ci.syft-version=${SYFT_VERSION} \
        --import-cache type=registry,ref=${CI_IMAGE} \
        --export-cache type=inline \
        --output type=image,name=${CI_IMAGE},push=true

build-python-docs:
  extends: .build-ci-image
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=.gitlab/ci/images/python-docs/ \
        --local dockerfile=.gitlab/ci/images/python-docs/ \
        --opt build-arg:PYTHON_VERSION=${PYTHON_VERSION} \
        --import-cache type=registry,ref=${CI_REGISTRY_IMAGE}/ci/python-docs:latest \
        --export-cache type=inline \
        --output type=image,name=${CI_REGISTRY_IMAGE}/ci/python-docs:latest,push=true

# =============================================================================
# Lint Stage
# =============================================================================

lint:
  stage: lint
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  before_script:
    - go version
  script:
    - make lint
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week
    when: always

audit:
  stage: lint
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  script:
    - make audit

chart-test:
  stage: lint
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-helm, rules]
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  script:
    - make lint-chart-ci KUBE_VERSION="${KIND_NODE_VERSION#v}"
  artifacts:
    reports:
      junit: chart-test-results.xml
    expire_in: 1 week
    when: always

# =============================================================================
# Test Stage
# =============================================================================

test:
  stage: test
  extends: .go-cache
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  tags:
    - saas-linux-large-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  before_script:
    - haproxy -v
  script:
    # gotestsum passes coverage flags through to go test - single test run.
    # Use -coverpkg to exclude generated code from coverage calculation.
    # -count=1 disables Go's test result cache: cached results from prior
    # runs on main carry coverage profile entries for files that have been
    # deleted on the branch, which break `go tool cover -func` on the next
    # step (cover needs to read each referenced source file by path).
    - |
      go tool gotestsum --junitfile report.xml --format testname -- \
        -race -count=1 -coverprofile=coverage.out -covermode=atomic \
        -coverpkg=${COVERAGE_PACKAGES} \
        ./...
    # Show coverage summary
    - go tool cover -func=coverage.out | tail -1
  artifacts:
    paths:
      - coverage.out
    reports:
      junit: report.xml
    expire_in: 1 week
    when: always

.validate-helm-libraries-base:
  stage: test
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - charts/**/*
        - .gitlab-ci.yml
  before_script:
    - haproxy -v
  script:
    # `make validate-helm-libraries` is the single source of truth for
    # the "render chart -> validate" smoke. The make target builds the
    # binary, renders the chart with all bundled libraries enabled,
    # and runs `controller validate --schema-dir=tests/schemas`.
    # Keep this CI block as a thin wrapper — every flag/path/contract
    # change goes in the make target so devs see the same behaviour
    # locally.
    - make validate-helm-libraries HAPROXY_VERSION=$HAPROXY_VERSION

validate-helm-libraries:
  extends:
    - .validate-helm-libraries-base
    - .haproxy-version-matrix

# =============================================================================
# Build Stage
# =============================================================================

# Base template for snapshot builds (CI and main branch)
# Uses goreleaser for multi-arch builds and docker buildx for images.
# CI snapshots (single-arch amd64) skip goreleaser entirely and run go build
# directly — faster, no `go generate` hook, no arm64/arm cross-compile.
# The 4 per-HAProxy-version docker buildx invocations run in parallel; the
# 2xlarge runner has 16 vCPU, well above what 4 concurrent buildkit builds
# saturate.
#
# Variables that control behavior:
#   PLATFORMS: Docker build platforms (e.g., "linux/amd64" or "linux/amd64,linux/arm64,linux/arm/v7")
#   SNAPSHOT_TAG: Image tag prefix (e.g., "ci-${CI_PIPELINE_ID}" or "main-${CI_COMMIT_SHORT_SHA}")
#   CREATE_DEFAULT_TAG: If "true", creates a default tag pointing to haproxy3.4
.snapshot-build-base:
  stage: build
  extends:
    - .goreleaser-base
  tags:
    - saas-linux-2xlarge-amd64
  script:
    # Build controller binary into binary-context/<TARGETPLATFORM>/haptic-controller —
    # the path the runtime stage of Dockerfile expects via --build-context binary=.
    - |
      mkdir -p binary-context/linux/amd64
      if [ "${PLATFORMS}" = "linux/amd64" ]; then
        echo "CI snapshot: building amd64 binary directly with go build"
        BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -trimpath -buildvcs=false -pgo=auto \
          -ldflags="-s -w -X main.version=${SNAPSHOT_TAG} -X main.commit=${CI_COMMIT_SHORT_SHA} -X main.date=${BUILD_DATE}" \
          -o binary-context/linux/amd64/haptic-controller \
          ./cmd/controller
      else
        echo "Multi-arch snapshot: using goreleaser"
        goreleaser build --snapshot --clean
        cp dist/controller_linux_amd64_v1/haptic-controller binary-context/linux/amd64/
        if [[ "$PLATFORMS" == *"arm64"* ]]; then
          mkdir -p binary-context/linux/arm64 binary-context/linux/arm/v7
          cp dist/controller_linux_arm64_v8.0/haptic-controller binary-context/linux/arm64/
          cp dist/controller_linux_arm_7/haptic-controller binary-context/linux/arm/v7/
        fi
      fi
    # Build and push Docker images for each HAProxy version IN PARALLEL.
    # The `multiarch` buildx builder uses the docker-container driver and
    # serves concurrent buildctl requests; the 4 builds share the same Go
    # binary input layer (no rebuild) and only differ in their HAProxy base.
    # `set -o pipefail` inside the subshell preserves docker exit codes
    # past the sed prefix; the parent loop tracks each PID so a single
    # build failure fails the whole job.
    - |
      pids=""
      for HAPROXY_VERSION in 3.0 3.1 3.2 3.3 3.4; do
        TAG="${CI_REGISTRY_IMAGE}:${SNAPSHOT_TAG}-haproxy${HAPROXY_VERSION}"
        echo "Starting build: ${TAG}"
        (
          set -o pipefail
          docker buildx build \
            --platform "${PLATFORMS}" \
            --build-arg HAPROXY_VERSION="${HAPROXY_VERSION}" \
            --build-arg GIT_COMMIT="${CI_COMMIT_SHORT_SHA}" \
            --build-arg GIT_TAG="${SNAPSHOT_TAG}" \
            --build-context binary=binary-context \
            --target runtime \
            --tag "${TAG}" \
            --push \
            . 2>&1 | sed "s|^|[hp${HAPROXY_VERSION}] |"
        ) &
        pids="${pids} $!"
      done
      failed=0
      for pid in ${pids}; do
        wait "${pid}" || failed=1
      done
      [ "${failed}" -eq 0 ]
    # Create default tag if requested (points to haproxy3.4)
    - |
      if [ "${CREATE_DEFAULT_TAG}" = "true" ]; then
        docker buildx imagetools create \
          --tag "${CI_REGISTRY_IMAGE}:${SNAPSHOT_TAG}" \
          "${CI_REGISTRY_IMAGE}:${SNAPSHOT_TAG}-haproxy3.4"
      fi

# Build snapshot images for CI testing (single-arch, fast)
# Produces images with tags: ci-<pipeline_id>-haproxy<version>
build-snapshot:
  extends: .snapshot-build-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  variables:
    PLATFORMS: "linux/amd64"
    SNAPSHOT_TAG: "ci-${CI_PIPELINE_ID}"
    CREATE_DEFAULT_TAG: "false"

# Pre-build the ingress-conformance test image once per pipeline.
# `test-ingress-conformance` runs with `parallel: 4`; without this job
# every shard would re-clone the upstream repo, re-apply our two
# vendored patches, and re-`go test -c` the upstream binary — ~150s of
# duplicated work × 4 shards. Build once, push to the pipeline-scoped
# registry tag, the test job pulls.
#
# The image carries an empty kubeconfig stub (CONFORMANCE_BAKE_KUBECONFIG=0
# in the make target) because the kind cluster doesn't exist yet at
# build time — the test job creates it later and bind-mounts the real
# kubeconfig into the container at /etc/kubeconfig.
build-ingress-conformance-image:
  stage: build
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  interruptible: true
  variables:
    # Pin to the same HAProxy version test-ingress-conformance uses.
    # The image itself is HAProxy-version-agnostic (it doesn't link
    # against HAProxy); the tag suffix just mirrors the conformance
    # job's variable so the two stay in lockstep when we revisit the
    # matrix.
    HAPROXY_VERSION: "3.4"
    INGRESS_CONFORMANCE_IMAGE: "${CI_REGISTRY_IMAGE}/ingress-conformance:ci-${CI_PIPELINE_ID}-haproxy3.4"
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        # Narrow chart-side trigger to chart-impl files only (mirrors
        # .rules-spoa-chart). Doc-only chart changes (CLAUDE.md,
        # README.md, CHANGELOG.md) historically matched `charts/**/*`
        # and dragged this build + test-ingress-conformance into the
        # pipeline; meanwhile `build-spoa-image-snapshot` (which
        # test-ingress-conformance hard-needs:) didn't match doc
        # changes, so GitLab refused the pipeline with
        # "build-spoa-image-snapshot does not exist".
        - "**/*.go"
        - go.mod
        - go.sum
        - scripts/**/*
        - .gitlab-ci.yml
        - Makefile
        - Dockerfile.ingress-conformance-test
        - tests/conformance/patches/**
    - !reference [.rules-spoa-chart, rules]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - make build-ingress-conformance-image CONFORMANCE_BAKE_KUBECONFIG=0
    - docker push ${INGRESS_CONFORMANCE_IMAGE}

# Publish snapshot images from main branch (multi-arch, for users)
# Produces images with tags: main-<short-sha>-haproxy<version>
publish-main-snapshot:
  extends: .snapshot-build-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
    SNAPSHOT_TAG: "main-${CI_COMMIT_SHORT_SHA}"
    CREATE_DEFAULT_TAG: "true"

# Publish snapshot chart from main branch
# Produces chart with version: 0.0.0-main.<short-sha>
publish-chart-snapshot:
  stage: build
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      SNAPSHOT_VERSION="0.0.0-main.g${CI_COMMIT_SHORT_SHA}"
      helm package charts/haptic --version "$SNAPSHOT_VERSION" --app-version "main-${CI_COMMIT_SHORT_SHA}"
      helm push haptic-${SNAPSHOT_VERSION}.tgz oci://${CI_REGISTRY}/haproxy-haptic/haptic/charts
      echo "Published chart snapshot: haptic:${SNAPSHOT_VERSION}"

# =============================================================================
# SPOA Hub Image (sidecar for the HAProxy pod)
# =============================================================================
#
# Builds a multi-arch container image that layers six plugin shared
# libraries on top of registry.gitlab.com/haproxy-haptic/haproxy-spoa-hub.
# Lifecycle rides with the controller VERSION; the image is HAProxy-version
# independent (the hub speaks SPOP at the wire level, no link-time HAProxy
# dep). Plugin .so files come from the upstream projects' Generic Package
# Registries — every download is sha256-checked against the project's
# SHA256SUMS manifest and cosign-verified against the project's tag identity.

.rules-spoa:
  rules:
    - changes:
        # SPOA hub image build inputs.
        - versions-spoa.env
        - Dockerfile.spoa-hub
        - scripts/prep-spoa-plugins.sh
        - scripts/smoke-spoa-image.sh
        - scripts/render-spoa-bundle.sh
        - docs/controller/docs/operations/spoa-hub.md
        - .gitlab-ci.yml
        # Go-source paths. `test-e2e` triggers on these (its own
        # `changes:` lists **/*.go, go.mod, go.sum) and `needs:`
        # `build-spoa-image-snapshot` non-optionally — so the build
        # job MUST trigger on the same paths or GitLab refuses to
        # create the pipeline ("does not exist in the pipeline ...
        # use needs:optional"). MR !859 (a go.mod-only renovate bump)
        # was rejected at creation for exactly this reason.
        - "**/*.go"
        - go.mod
        - go.sum
        # Makefile: `test-ingress-conformance` lists Makefile in its own
        # `changes:` and also hard-`needs:` `build-spoa-image-snapshot`,
        # so a Makefile-only change (e.g. the codegen targets) must build
        # the SPOA image too, or GitLab rejects the MR pipeline at creation.
        - Makefile
        # Chart files that drive SPOE wiring. Without these in the
        # change list, MRs that touch only chart YAML never trigger
        # `build-spoa-image-snapshot`, which `test-e2e` `needs:` —
        # so the SPOE-rendering integration test silently skips for
        # every chart-only change. !849-!854 each merged with broken
        # SPOE output (render_glob trim-marker bug collapsing
        # send-spoe-group + redirect onto one line) because none of
        # them touched any of the files above. Listed individually
        # rather than `charts/**` so unrelated chart docs / values
        # changes don't pay the ~10-minute test-e2e cost.
        - charts/haptic/libraries/base.yaml
        - charts/haptic/libraries/ssl.yaml
        - charts/haptic/libraries/ingress.yaml
        - charts/haptic/charts/gateway/**/*
        - charts/haptic/charts/haproxytech/**/*
        - charts/haptic/charts/haproxy-ingress/**/*
        - charts/haptic/charts/nginx-ingress/**/*
        - charts/haptic/libraries/spoa-hub/**/*
        - charts/haptic/values.yaml
        - charts/haptic/templates/_helpers.tpl
        - charts/haptic/templates/haproxytemplateconfig.yaml
        - charts/haptic/templates/spoa-hub-configmap.yaml
        - scripts/start-dev-env.sh
        - tests/e2e/**/*
        - scripts/dev-env-assets/**/*

# Chart-side trigger for the SPOA image-build pipeline. Composed with
# `.rules-spoa` (via `!reference`) on `prep-spoa-plugins` and
# `build-spoa-image-snapshot` so chart YAML edits that affect SPOE
# wiring rebuild the image — `test-e2e` needs that image and was
# silently skipping for every chart-only change before this MR.
# !849-!854 each merged with broken SPOE output (render_glob
# trim-marker bug collapsing send-spoe-group + redirect onto one
# line) because the integration test wasn't running.
#
# Deliberately NOT applied to `smoke-spoa-amd64` or
# `docs-spoa-versions`: chart edits don't change image bytes (so
# smoking the rebuilt image is wasted work) and don't touch
# spoa-hub.md (so the docs drift guard has nothing to check).
# Listed individually rather than `charts/**` so unrelated chart
# docs / values changes don't pay the ~10-minute test-e2e cost.
.rules-spoa-chart:
  rules:
    - changes:
        - charts/haptic/libraries/base.yaml
        - charts/haptic/libraries/ssl.yaml
        - charts/haptic/libraries/ingress.yaml
        # `gateway` is a split-library directory (per ADR-0008); the
        # legacy `gateway.yaml` file no longer exists. The glob covers
        # every fragment and any future tests/ subdir, so chart-only
        # MRs that touch the gateway library trigger the SPOA build
        # that `test-e2e` / conformance hard-`needs:`.
        - charts/haptic/charts/gateway/**/*
        - charts/haptic/charts/haproxytech/**/*
        - charts/haptic/charts/haproxy-ingress/**/*
        - charts/haptic/charts/nginx-ingress/**/*
        - charts/haptic/libraries/spoa-hub/**/*
        - charts/haptic/values.yaml
        - charts/haptic/templates/_helpers.tpl
        - charts/haptic/templates/haproxytemplateconfig.yaml
        - charts/haptic/templates/spoa-hub-configmap.yaml
        - scripts/start-dev-env.sh
        - tests/e2e/**/*
        - scripts/dev-env-assets/**/*

# Drift guard: the bundled-versions table in spoa-hub.md is auto-rendered
# from versions-spoa.env. Fail CI if the doc and the env file disagree.
docs-spoa-versions:
  stage: lint
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - !reference [.rules-spoa, rules]
  interruptible: true
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/render-spoa-bundle.sh --check

# Download upstream plugin .so files for every architecture, verify each
# against its project's SHA256SUMS manifest and cosign-attested keyless
# signature, and stage them under plugins/<arch>/ for the build job. The
# CI image already ships cosign; alpine is enough here since we only need
# bash (for associative arrays in the prep script), curl, jq, and cosign.
prep-spoa-plugins:
  stage: build
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    # Always fire on main pushes so the build-spoa-image-main publish
    # has its mandatory `needs:` dep satisfied. The haptic snapshot,
    # chart snapshot, and SPOA-hub snapshot all advance together per
    # main commit; a CHANGELOG-only or controller-only main push that
    # matches neither .rules-spoa nor .rules-spoa-chart would otherwise
    # schedule build-spoa-image-main with no prep job, yielding a
    # GitLab yaml-validation error ("prep-spoa-plugins does not exist
    # in the pipeline") that manifests as a 0-job pipeline marked
    # failed and blocks the merge gate of the next MR.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-spoa, rules]
    # build-spoa-image-snapshot has prep-spoa-plugins as a hard
    # `needs:` dep, so prep must trigger whenever the image build
    # does — including on chart-only changes via .rules-spoa-chart.
    - !reference [.rules-spoa-chart, rules]
  interruptible: true
  before_script:
    - apk add --no-cache bash curl cosign jq
  script:
    - bash scripts/prep-spoa-plugins.sh
  artifacts:
    paths:
      - plugins/
    expire_in: 1 week

# Mirror the upstream ingress-conformance echoserver image into our own
# Container Registry.
#
# Why this exists: the upstream Cucumber suite
# (kubernetes-sigs/ingress-controller-conformance, pinned in the
# test-ingress-conformance job below) hard-codes
# `k8s.gcr.io/ingressconformance/echoserver:v0.0.1` as the backend
# image for every scenario's generated Deployment. `k8s.gcr.io` was
# retired in 2023 and now redirects to `registry.k8s.io`. Pulls of
# this image from GitLab.com SaaS runners reliably exceed the
# upstream suite's 5-minute `WaitForEndpointsTimeout`
# (test/kubernetes/kubernetes.go) on the FIRST scenario — every
# subsequent scenario passes because containerd has the image
# cached by then, but the first failure already marks TestSuite
# FAIL. Issue #45 has the full investigation chain.
#
# Solution: mirror the upstream image (digest-pinned, byte-identical)
# into this project's registry, then vendor an upstream patch
# (tests/conformance/patches/0002-use-mirrored-echoserver-image.patch)
# that replaces the `EchoContainer` constant with the mirrored path.
# Pulls from registry.gitlab.com cache locally on the GitLab.com
# fleet and complete in seconds, well inside the 5-min budget.
#
# Cadence: scheduled (weekly) + on-demand `when: manual` for the
# initial bootstrap. Refreshes the same tag with the same content —
# the digest pin in the patch is the authoritative version reference,
# the tag is only there to give Docker tooling something to display.
# A future upstream image bump (new SHA) needs:
#   1. Update the SRC_IMAGE digest below
#   2. Update the same digest in tests/conformance/patches/0002-*.patch
#   3. Trigger this job to publish the new content
mirror-ingress-conformance-image:
  stage: build
  image: docker:29
  extends:
    - .docker-dind
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    # Two ways to trigger:
    # 1. Pipeline schedule with MIRROR_IMAGES=true set in the
    #    schedule's variables (configured in the GitLab UI). The
    #    gate is the variable, not the source — that way other
    #    scheduled pipelines (nightly builds, dependency scans,
    #    etc.) don't drag this job along.
    # 2. Manual play on any pipeline that includes the job
    #    (allow_failure so a missed click on an MR pipeline
    #    doesn't fail the whole pipeline).
    - if: $MIRROR_IMAGES == "true"
    - when: manual
      allow_failure: true
  interruptible: false
  variables:
    SRC_IMAGE: "k8s.gcr.io/ingressconformance/echoserver:v0.0.1@sha256:9b34b17f391f87fb2155f01da2f2f90b7a4a5c1110ed84cb5379faa4f570dc52"
    DST_IMAGE: "${CI_REGISTRY_IMAGE}/ingress-conformance-echo:v0.0.1"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$SRC_IMAGE"
    - docker tag "$SRC_IMAGE" "$DST_IMAGE"
    - docker push "$DST_IMAGE"
    - echo "Mirrored $SRC_IMAGE -> $DST_IMAGE"

# Multi-arch image build template. The Dockerfile pulls plugin .so files
# from the prep stage via --build-context plugins=plugins.
.build-spoa-image-base:
  stage: build
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  extends:
    - .docker-dind
  tags:
    - saas-linux-large-amd64
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: prep-spoa-plugins
  variables:
    SPOA_IMAGE: "${CI_REGISTRY_IMAGE}/spoa-hub"
  before_script:
    - source versions-spoa.env
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create builder-context
    - docker buildx create --use --name multiarch --bootstrap builder-context
    - docker run --rm --privileged tonistiigi/binfmt --install arm64,arm
  script:
    # Upstream hub image tags are stripped of the leading `v` (e.g. tag
    # v0.2.2 publishes as :0.2.2), matching the upstream CI's IMAGE_TAG=
    # ${CI_COMMIT_TAG#v} convention. Dockerfile ARG substitution can't do
    # the prefix-strip itself (`${VAR#v}` is bash, not Dockerfile syntax),
    # so we strip in CI before passing as a build-arg.
    - HUB_TAG="${SPOA_HUB_VERSION#v}"
    - |
      docker buildx build \
        --platform "${PLATFORMS}" \
        --build-arg "SPOA_HUB_VERSION=${HUB_TAG}" \
        --build-context plugins=plugins \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${SPOA_TAG}" \
        --tag "${SPOA_IMAGE}:${SPOA_TAG}" \
        --metadata-file metadata.json \
        --push \
        -f Dockerfile.spoa-hub \
        .
  artifacts:
    paths:
      - metadata.json
    expire_in: 1 week

# Single-arch snapshot for MR pipelines (smoke-tested then discarded).
build-spoa-image-snapshot:
  extends: .build-spoa-image-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-spoa, rules]
    # Trigger on chart YAML changes too — `test-e2e` `needs:`
    # this job, and chart-only MRs should still run integration
    # against a fresh image. .rules-spoa-chart is documented above.
    - !reference [.rules-spoa-chart, rules]
  interruptible: true
  variables:
    PLATFORMS: "linux/amd64"
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"

# Multi-arch publish from main branch. Always fires on main pushes so
# the `main-latest` SPOA-hub snapshot tracks the haptic-controller and
# chart snapshots in lockstep — operators pulling a `main-<sha>` set
# get a coherent triple. `prep-spoa-plugins` mirrors this gate so the
# mandatory `needs:` dependency is satisfied even on main pushes that
# touch neither SPOA-image inputs nor chart YAML (e.g. controller-only
# or CHANGELOG-only commits).
build-spoa-image-main:
  extends: .build-spoa-image-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
    SPOA_TAG: "main-${CI_COMMIT_SHORT_SHA}"
  after_script:
    - docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}/spoa-hub:main-latest"
        "${CI_REGISTRY_IMAGE}/spoa-hub:main-${CI_COMMIT_SHORT_SHA}"

# Multi-arch release on version tags. Sign + attest jobs depend on this.
build-spoa-image-release:
  extends: .build-spoa-image-base
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
    SPOA_TAG: "${CI_COMMIT_TAG#v}"
  after_script:
    - |
      if ! echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
        docker buildx imagetools create \
          --tag "${CI_REGISTRY_IMAGE}/spoa-hub:latest" \
          "${CI_REGISTRY_IMAGE}/spoa-hub:${CI_COMMIT_TAG#v}"
      fi

# Cosign keyless sign-by-digest of the released image.
sign-spoa-image:
  stage: build
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  tags:
    - saas-linux-small-amd64
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-spoa-image-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
    - cosign sign --yes "${CI_REGISTRY_IMAGE}/spoa-hub@${DIGEST}"

# CycloneDX SBOM via syft, attached as a cosign attestation.
attest-spoa-sbom:
  stage: build
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  tags:
    - saas-linux-small-amd64
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-spoa-image-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
    - syft scan "${CI_REGISTRY_IMAGE}/spoa-hub@${DIGEST}" -o cyclonedx-json=spoa-sbom.cdx.json
    - cosign attest --yes --type cyclonedx --predicate spoa-sbom.cdx.json
        "${CI_REGISTRY_IMAGE}/spoa-hub@${DIGEST}"
  artifacts:
    paths:
      - spoa-sbom.cdx.json
    expire_in: 1 month

# Boot the snapshot image and verify all six plugins load. amd64 only on
# MR pipelines (snapshot build is single-arch); arm64 smoke gates to main
# and release where the multi-arch manifest is published.
.smoke-spoa-base:
  stage: integration
  image: docker:${DOCKER_VERSION}
  extends:
    - .docker-dind
  interruptible: true
  timeout: 5 minutes
  before_script:
    - apk add --no-cache bash
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        SPOA_SMOKE_TAG="${CI_COMMIT_TAG#v}"
      elif [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        SPOA_SMOKE_TAG="main-${CI_COMMIT_SHORT_SHA}"
      else
        SPOA_SMOKE_TAG="ci-${CI_PIPELINE_ID}"
      fi
    - bash scripts/smoke-spoa-image.sh "${CI_REGISTRY_IMAGE}/spoa-hub:${SPOA_SMOKE_TAG}"

smoke-spoa-amd64:
  extends: .smoke-spoa-base
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-spoa, rules]
  needs:
    - job: build-spoa-image-snapshot
      optional: true
    - job: build-spoa-image-main
      optional: true
    - job: build-spoa-image-release
      optional: true

# arm64 smoke needs a multi-arch manifest, so it only runs on main and on
# release tags where build-spoa-image-{main,release} produces one. MR
# pipelines build snapshot as amd64 only, so arm64 smoke is unreachable
# there by design.
smoke-spoa-arm64:
  extends: .smoke-spoa-base
  tags:
    - saas-linux-small-arm64
  # Workaround for MTU mismatch on hosted arm64 dind runners
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      command: ["--mtu=1400"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-spoa-image-main
      optional: true
    - job: build-spoa-image-release
      optional: true

# =============================================================================
# Integration Stage
# =============================================================================

.test-integration-base:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  timeout: 30 minutes
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
  variables:
    KEEP_CLUSTER: "false"
  script:
    - mkdir -p coverage
    - |
      go tool gotestsum --junitfile report-integration.xml --format testname -- \
        -tags=integration -race -timeout 15m \
        -coverprofile=coverage/integration-${HAPROXY_VERSION}.out -covermode=atomic \
        -coverpkg=${COVERAGE_PACKAGES} \
        ./tests/integration/...
  artifacts:
    paths:
      - coverage/
    reports:
      junit: report-integration.xml
    when: always
    expire_in: 1 week

test-integration:
  tags:
    - saas-linux-2xlarge-amd64
  extends:
    - .test-integration-base
    - .haproxy-version-matrix

# Combined unit + integration coverage report (merges all HAProxy version coverage files)
coverage-combined:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  tags:
    - saas-linux-medium-amd64
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: test
      artifacts: true
    - job: "test-integration: [3.0]"
      artifacts: true
      optional: true
    - job: "test-integration: [3.1]"
      artifacts: true
      optional: true
    - job: "test-integration: [3.2]"
      artifacts: true
      optional: true
    - job: "test-integration: [3.3]"
      artifacts: true
      optional: true
    - job: "test-integration: [3.4]"
      artifacts: true
      optional: true
  script:
    - mkdir -p coverage
    - cp coverage.out coverage/unit.out
    - |
      echo "Unit test coverage:"
      go tool cover -func=coverage/unit.out | tail -5
    - |
      for f in coverage/integration-*.out; do
        [ -f "$f" ] && echo "Integration coverage ($f):" && go tool cover -func="$f" | tail -5
      done
    - |
      PROFILES="coverage/unit.out"
      for f in coverage/integration-*.out; do
        [ -f "$f" ] && PROFILES="$PROFILES $f"
      done
      echo "Merging coverage profiles: $PROFILES"
      go run github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c $PROFILES > coverage/combined.out
    - |
      echo "Combined coverage:"
      go tool cover -func=coverage/combined.out | tail -1
    # Convert combined coverage to Cobertura for GitLab diff visualization
    - gocover-cobertura < coverage/combined.out > coverage/combined.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/combined.xml
    expire_in: 1 week

test-acceptance:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  timeout: 30 minutes
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
  variables:
    HAPROXY_VERSION: "3.4"
    KIND_NODE_IMAGE: kindest/node:${KIND_NODE_VERSION}
    KEEP_NAMESPACE: "true"  # Preserve namespaces so after_script can collect logs on failure
  before_script:
    # Pull test image from registry and tag it for the acceptance tests
    # The Go test code handles kind cluster creation with DinD support
    - |
      TEST_IMAGE="${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-haproxy${HAPROXY_VERSION}"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull ${TEST_IMAGE}
      docker tag ${TEST_IMAGE} haptic:test
  script:
    - go tool gotestsum --junitfile report-acceptance.xml --format testname -- -tags=acceptance -v -timeout 25m -run TestAllAcceptanceParallel ./tests/acceptance/...
  after_script:
    # Extract debug logs on failure for troubleshooting
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "Job failed - extracting debug logs..."
        mkdir -p debug-logs

        # Use the kubeconfig created by the acceptance tests
        export KUBECONFIG=/tmp/haproxy-test-kubeconfig

        # List all test namespaces (they have pattern test-*)
        for ns in $(kubectl get ns -o name 2>/dev/null | grep '^namespace/test-' | cut -d/ -f2); do
          echo "=== Namespace: $ns ===" >> debug-logs/test-namespaces.log

          # Controller pod logs with timestamps for correlation
          kubectl -n "$ns" logs -l app=haptic-controller --all-containers=true \
            --timestamps=true --since=10m \
            >> debug-logs/controller-$ns.log 2>&1 || true

          # Blocklist server logs (nginx) - critical for HTTP store tests
          kubectl -n "$ns" logs -l app=blocklist-server --all-containers=true \
            --timestamps=true --since=10m \
            >> debug-logs/blocklist-server-$ns.log 2>&1 || true

          # Pod status with IP addresses for debugging service routing
          kubectl -n "$ns" get pods -o wide >> debug-logs/pods-$ns.log 2>&1 || true

          # Events sorted by time with more detail
          kubectl -n "$ns" get events --sort-by=.lastTimestamp -o wide \
            >> debug-logs/events-$ns.log 2>&1 || true

          # Lease status for leader election debugging
          kubectl -n "$ns" get leases -o yaml \
            >> debug-logs/leases-$ns.log 2>&1 || true

          # ConfigMap content for HTTP store debugging
          kubectl -n "$ns" get configmaps -o yaml \
            >> debug-logs/configmaps-$ns.log 2>&1 || true
        done

        # Kind control plane logs for diagnosing API server/kube-proxy issues
        echo "Extracting Kind control plane logs..."

        # Use kind's built-in log export (most comprehensive)
        kind export logs debug-logs/kind-logs --name haproxy-test 2>/dev/null || true

        # Fallback: get kube-system pod logs directly
        kubectl -n kube-system get pods -o wide >> debug-logs/kube-system-pods.log 2>&1 || true
        kubectl -n kube-system logs -l component=kube-proxy --all-containers=true \
          --timestamps=true --since=10m >> debug-logs/kube-proxy.log 2>&1 || true
        kubectl -n kube-system logs -l k8s-app=kube-dns --all-containers=true \
          --timestamps=true --since=10m >> debug-logs/coredns.log 2>&1 || true

        # API server and etcd logs from docker (Kind runs as docker container)
        docker logs haproxy-test-control-plane >> debug-logs/kind-node.log 2>&1 || true

        echo "Debug logs extracted"
        ls -la debug-logs/ || true
      fi
  artifacts:
    reports:
      junit: report-acceptance.xml
    paths:
      - debug-logs/
    when: always
    expire_in: 1 week

# Go-based full-stack E2E suite. Replaces the (now-deleted) bash
# scripts/test-routes.sh — same coverage, real per-test isolation,
# parallel execution, structured failure dumps.
#
# Self-contained: TestMain creates its own kind cluster (kind-haptic-e2e),
# helm-installs the chart, deploys backend fixtures, and runs tests with
# per-test namespace isolation. No start-dev-env.sh dependency.
.test-e2e-base:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  timeout: 25 minutes
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
    - job: build-spoa-image-snapshot
  variables:
    CTRL_NAMESPACE: haptic
    RELEASE_NAME: haptic
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"
    # The Makefile target re-tags from haptic:test → haptic:test-haproxyX.Y
    # so the chart's image-tag composition resolves locally. SKIP_DOCKER_BUILD
    # tells the Makefile NOT to run docker-build-test; we pulled the
    # registry image instead.
    SKIP_DOCKER_BUILD: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - scripts/**/*
        - .gitlab-ci.yml
    # Narrowed from `charts/**/*` to .rules-spoa-chart so doc-only chart
    # edits (CLAUDE.md / README.md) don't drag in the integration suite
    # — and so this job's trigger stays in lockstep with the
    # `build-spoa-image-snapshot` it hard-needs:.
    - !reference [.rules-spoa-chart, rules]
  before_script:
    - |
      # Pull pre-built controller image from the matrix-build job and tag
      # under the haptic:test alias the Makefile expects. The Makefile then
      # re-tags to haptic:test-haproxy${HAPROXY_VERSION} (the chart's
      # composed image tag).
      TEST_IMAGE="${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-haproxy${HAPROXY_VERSION}"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull ${TEST_IMAGE}
      docker tag ${TEST_IMAGE} haptic:test
    - |
      # Pull the freshly-built SPOA hub snapshot and re-tag as the chart's
      # default upstream reference (registry.gitlab.com/.../spoa-hub:main-latest).
      # kind nodes have no registry credentials, so without this the
      # spoa-hub container would fail ImagePullBackOff. The chart's
      # imagePullPolicy is IfNotPresent — kubelet uses the locally-loaded
      # image.
      SPOA_IMAGE="${CI_REGISTRY_IMAGE}/spoa-hub:${SPOA_TAG}"
      docker pull ${SPOA_IMAGE}
      docker tag ${SPOA_IMAGE} registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:main-latest
  script:
    - make test-e2e
  after_script:
    # On failure, the per-test t.Cleanup hooks already wrote
    # debug-logs/<test-name>/ inside the test process (controller logs,
    # haproxy logs, HAProxyCfg, namespace events, applied manifests).
    # Add suite-level context for cases where the failure is in TestMain /
    # setup rather than in a single test body, and for cluster-wide
    # diagnostics (NetworkPolicy, services, DNS, port connectivity) that
    # only make sense at suite level. This mirrors what the old
    # scripts/test-routes.sh after_script captured.
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "Job failed - extracting suite-level diagnostics..."
        mkdir -p debug-logs/_suite

        export KUBECONFIG=/tmp/haproxy-e2e-kubeconfig

        # Per-pod controller logs (all containers). Catches replicas that
        # failed differently from the leader.
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/name=haptic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== Controller: $pod ===" >> debug-logs/_suite/controller.log
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" --all-containers=true >> debug-logs/_suite/controller.log 2>&1 || true
        done

        # Per-pod haproxy / dataplane / spoa-hub logs (current + previous
        # for spoa-hub, which crashloops on config errors).
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/component=loadbalancer -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== HAProxy: $pod ===" >> debug-logs/_suite/haproxy.log
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c haproxy >> debug-logs/_suite/haproxy.log 2>&1 || true
          echo "=== Dataplane: $pod ===" >> debug-logs/_suite/dataplane.log
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c dataplane >> debug-logs/_suite/dataplane.log 2>&1 || true
          echo "=== spoa-hub: $pod (current) ===" >> debug-logs/_suite/spoa-hub.log
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c spoa-hub >> debug-logs/_suite/spoa-hub.log 2>&1 || true
          echo "=== spoa-hub: $pod (previous) ===" >> debug-logs/_suite/spoa-hub.log
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c spoa-hub --previous >> debug-logs/_suite/spoa-hub.log 2>&1 || true
          echo "=== spoa-hub config.toml: $pod ===" >> debug-logs/_suite/spoa-hub-config.log
          kubectl -n ${CTRL_NAMESPACE} exec "$pod" -c spoa-hub -- cat /etc/haproxy-spoa-hub/config.toml >> debug-logs/_suite/spoa-hub-config.log 2>&1 || true
        done

        # Deployed haproxy.cfg + auxiliary files (SPOE pipeline + auth-url
        # routing map). Useful when a route / deny / external-auth flow
        # surprises the test.
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c haproxy -- \
          cat /etc/haproxy/haproxy.cfg > debug-logs/_suite/haproxy.cfg 2>&1 || true
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c haproxy -- \
          cat /etc/haproxy/general/spoe.conf > debug-logs/_suite/spoe.conf 2>&1 || true
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c haproxy -- \
          cat /etc/haproxy/maps/auth-url.map > debug-logs/_suite/auth-url.map 2>&1 || true

        # CRD-side desired state (what the controller wants HAProxy to be).
        kubectl -n ${CTRL_NAMESPACE} get haproxycfg -o yaml \
          > debug-logs/_suite/haproxycfg.yaml 2>&1 || true

        # NetworkPolicy across all namespaces — if the chart's NP is
        # blocking spoa-hub egress to auth-server / blocklist-server,
        # external-auth and HTTP-store tests fail with allowed=false /
        # blocked-by-default behavior that's hard to debug without this.
        kubectl get networkpolicy -A -o yaml \
          > debug-logs/_suite/networkpolicies.yaml 2>&1 || true

        # In-cluster DNS check from the spoa-hub container. Confirms
        # auth-server and blocklist-server resolve at request time —
        # NetworkPolicy and CoreDNS regressions both surface here.
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c spoa-hub -- \
          sh -c "echo '--- auth-server ---'; nslookup auth-server.echo.svc.cluster.local 2>&1; getent hosts auth-server.echo.svc.cluster.local 2>&1; echo '--- blocklist-server ---'; nslookup blocklist-server.echo.svc.cluster.local 2>&1; getent hosts blocklist-server.echo.svc.cluster.local 2>&1" \
          > debug-logs/_suite/spoa-hub-dns.log 2>&1 || true

        # Cluster-wide pod state + events.
        kubectl get pods -A -o wide > debug-logs/_suite/pods.log 2>&1 || true
        kubectl get events -A --sort-by=.lastTimestamp \
          > debug-logs/_suite/events.log 2>&1 || true

        # Service details — NodePort allocation issues block all tests.
        kubectl get svc -n ${CTRL_NAMESPACE} -o yaml \
          > debug-logs/_suite/services.yaml 2>&1 || true

        # Network connectivity diagnostics from the CI job → kind nodeport.
        # The e2e cluster's host ports are 31080/31443/31404 (shifted from
        # the dev cluster's 30080/30443/30404 — see kind-config in
        # tests/e2e/main_test.go).
        {
          echo "=== Network Diagnostics ==="
          echo "DOCKER_HOST: ${DOCKER_HOST:-not set}"
          echo ""
          echo "=== Docker host resolution ==="
          DOCKER_HOSTNAME=$(echo "$DOCKER_HOST" | sed 's|tcp://||' | cut -d: -f1)
          getent hosts "$DOCKER_HOSTNAME" 2>&1 || echo "Failed to resolve docker hostname"
          NODEPORT_IP=$(getent hosts "$DOCKER_HOSTNAME" | awk '{print $1}' | head -1)
          echo ""
          echo "=== Port 31080 connectivity test (HTTP NodePort) ==="
          echo "Testing connection to ${NODEPORT_IP}:31080..."
          timeout 5 curl -vs --max-time 5 -H "Host: echo.localdev.me" "http://${NODEPORT_IP}:31080/" 2>&1 | head -50 || echo "Connection failed"
          echo ""
          echo "=== Port 31443 connectivity test (HTTPS NodePort) ==="
          echo "Testing connection to ${NODEPORT_IP}:31443..."
          timeout 5 curl -vsk --max-time 5 "https://${NODEPORT_IP}:31443/" 2>&1 | head -50 || echo "Connection failed"
          echo ""
          echo "=== Port 31404 connectivity test (stats) ==="
          timeout 5 curl -vs --max-time 5 "http://${NODEPORT_IP}:31404/healthz" 2>&1 | head -20 || echo "Connection failed"
        } > debug-logs/_suite/network-diagnostics.log 2>&1

        echo "Suite diagnostics in debug-logs/_suite/; per-test diagnostics in debug-logs/<test>/"
        ls -la debug-logs/
      fi
  artifacts:
    paths:
      - debug-logs/
    when: on_failure
    expire_in: 1 week

test-e2e:
  extends:
    - .test-e2e-base
    - .haproxy-version-matrix

# Upstream Gateway API conformance suite (sigs.k8s.io/gateway-api/conformance).
#
# Runs the same kind+helm setup as test-e2e (including MetalLB so Gateways
# get reachable LoadBalancer IPs), then invokes `make test-gateway-conformance`
# which builds the test binary into a tiny distroless image and runs it as a
# sibling container on the kind docker network. From that vantage point the
# test process reaches MetalLB-allocated LoadBalancer IPs directly — same
# code path locally and under DinD, no NodePort tunneling. The DinD daemon
# owns the kind network in CI; locally it's the host daemon. The shard
# regex from scripts/shard-conformance-tests.sh is passed as TEST_RUN_PATTERN.
#
# Pinned to a single HAProxy version: the conformance suite tests the
# chart's Gateway API surface (GatewayClass / Gateway / HTTPRoute behavior
# + status reconciliation), which is HAProxy-version-agnostic. Running
# the matrix here would just re-run the same tests N times. The
# HAProxy-version matrix already lives on test-e2e.
#
# Trigger rules match test-e2e's (skip default branch / tags, run on
# Go/chart/script changes) so any code change that could affect Gateway
# API behavior triggers a conformance check. CI failures here are real
# regressions — there are no skipped tests to mask them.
test-gateway-conformance:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  # Per-shard timeout. The full suite (~108 upstream tests) took ~30-40
  # minutes on local hardware before sharding; a 4-way split puts each
  # shard at ~25-30 tests, comfortably inside 25 minutes including the
  # 3-4 minute kind+helm cluster bootstrap that every shard pays once.
  timeout: 25 minutes
  # Run 4 shards in parallel. GitLab CI injects $CI_NODE_INDEX (1..4)
  # and $CI_NODE_TOTAL (=4); the before_script invocation of
  # scripts/shard-conformance-tests.sh hashes each upstream test name
  # into one of those buckets. Each shard runs its slice of the suite
  # in a fully isolated kind cluster — there's no cross-shard state
  # leakage because every shard spins up its own kind cluster via
  # `make test-e2e` (TEST_RUN_PATTERN="^$" shortcircuits the e2e tests
  # themselves so the cluster boot is the only cost).
  parallel: 4
  interruptible: true
  variables:
    CTRL_NAMESPACE: haptic
    RELEASE_NAME: haptic
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"
    SKIP_DOCKER_BUILD: "1"
    # Pin to the most-recent supported HAProxy version. Matches the
    # default in versions.env / charts/haptic/values.yaml.
    HAPROXY_VERSION: "3.4"
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
    - job: build-spoa-image-snapshot
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - scripts/**/*
        - .gitlab-ci.yml
    # Narrowed chart-side trigger — see .test-e2e-base for the
    # rationale (must stay in lockstep with build-spoa-image-snapshot).
    - !reference [.rules-spoa-chart, rules]
  before_script:
    # Reuse the test-e2e prep: pull the controller + spoa-hub snapshots
    # built earlier in the same pipeline, retag locally so the
    # MetalLB-bootstrapping kind cluster can find them.
    - |
      TEST_IMAGE="${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-haproxy${HAPROXY_VERSION}"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull ${TEST_IMAGE}
      docker tag ${TEST_IMAGE} haptic:test
    - |
      SPOA_IMAGE="${CI_REGISTRY_IMAGE}/spoa-hub:${SPOA_TAG}"
      docker pull ${SPOA_IMAGE}
      docker tag ${SPOA_IMAGE} registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:main-latest
  script:
    # Bring up the conformance cluster (kind + MetalLB + helm install).
    # HAPTIC_E2E_PROFILE=conformance:
    #   - Selects conformance-values.yaml (no HTTP-store demo, no dev
    #     fixtures the conformance suite doesn't need) so the chart's
    #     render hot path never blocks on an unreachable blocklist URL.
    #   - Skips applyBackendFixtures so the conformance suite's per-scenario
    #     backend pods are the only ones in the cluster — no e2e demo
    #     leftovers polluting test resource ordering.
    # TEST_RUN_PATTERN=^$ short-circuits the e2e tests so the binary
    # exits cleanly after setup; the cluster stays up because
    # KEEP_CLUSTER=true (default).
    - HAPTIC_E2E_PROFILE=conformance TEST_RUN_PATTERN="^$" make test-e2e
    # Derive the shard's `-run` regex. CI_NODE_INDEX / CI_NODE_TOTAL
    # are populated by GitLab CI's `parallel: <N>` keyword above; the
    # script hashes each upstream test ShortName into one of the
    # buckets so the partition is deterministic across runs and
    # branches (CRC32 modulo N).
    - |
      SHARD_PATTERN="$(scripts/shard-conformance-tests.sh "${CI_NODE_INDEX}" "${CI_NODE_TOTAL}")"
      echo "Conformance shard ${CI_NODE_INDEX}/${CI_NODE_TOTAL}: ${SHARD_PATTERN}"
      TEST_RUN_PATTERN="${SHARD_PATTERN}" make test-gateway-conformance
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        # Per-shard subdir so 4 parallel jobs don't clobber each
        # other's diagnostics (GitLab aggregates artifacts from all
        # shards into the same MR artifact tab).
        LOG_DIR="debug-logs/_conformance/shard-${CI_NODE_INDEX:-1}-of-${CI_NODE_TOTAL:-1}"
        echo "Conformance shard ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1} failed — extracting cluster diagnostics to ${LOG_DIR}..."
        mkdir -p "$LOG_DIR"

        export KUBECONFIG=/tmp/haproxy-e2e-kubeconfig

        # Controller logs across replicas
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/name=haptic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== Controller: $pod ===" >> "$LOG_DIR/controller.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" --all-containers=true >> "$LOG_DIR/controller.log" 2>&1 || true
        done

        # HAProxy + dataplane + spoa-hub sidecar logs. spoa-hub stdout
        # is the only place that records SPOE NOTIFY arrivals and
        # per-plugin dispatch errors — without it, conformance flakes
        # like issue #45 are undebuggable from the artifacts alone.
        # `|| true` on the spoa-hub line so older HAProxy pods that
        # pre-date the sidecar (and clusters without the sidecar
        # enabled) don't fail this script.
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/component=loadbalancer -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== HAProxy: $pod ===" >> "$LOG_DIR/haproxy.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c haproxy >> "$LOG_DIR/haproxy.log" 2>&1 || true
          echo "=== Dataplane: $pod ===" >> "$LOG_DIR/dataplane.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c dataplane >> "$LOG_DIR/dataplane.log" 2>&1 || true
          echo "=== SPOA-hub: $pod ===" >> "$LOG_DIR/spoa-hub.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c spoa-hub >> "$LOG_DIR/spoa-hub.log" 2>&1 || true

          # SPOA-hub /metrics scrape. Bound on the pod loopback by the
          # chart (spoaHub.hub.metricsAddr default 127.0.0.1:9095, set
          # in libraries/spoa-hub.yaml + templates/spoa-hub-configmap.yaml).
          # Plugin counters live here: plugin_mirror_dispatches_total /
          # dispatch_dropped_total / dispatch_outcomes_total,
          # plugin_coraza_evaluations_total,
          # plugin_external-auth_auth_requests_total, etc.
          #
          # Scrape from the haproxy container which shares the pod's
          # network namespace with the sidecar (the spoa-hub container
          # is read-only + minimal, no scraping tools). The
          # haproxytech/haproxy-debian image has neither curl nor
          # busybox wget pre-installed — fall through a chain of
          # candidates and `printf` the failure reason if all miss, so
          # an empty scrape is debuggable instead of silent.
          echo "=== SPOA-hub /metrics on $pod ===" >> "$LOG_DIR/spoa-hub-metrics.txt"
          kubectl -n ${CTRL_NAMESPACE} exec "$pod" -c haproxy -- sh -c '
            if command -v curl >/dev/null 2>&1; then
              curl -fsS --max-time 5 http://127.0.0.1:9095/metrics
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O- --timeout=5 http://127.0.0.1:9095/metrics
            else
              # Last-resort raw HTTP/1.0 via /dev/tcp (bash-only). The
              # haproxy-debian image ships dash as /bin/sh, but the
              # explicit `bash` here works because the image installs
              # bash for the entrypoint. If even bash is missing the
              # scrape will fail silently and we will see only the
              # header line — at which point install curl in the image.
              printf "GET /metrics HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" \
                | bash -c "exec 3<>/dev/tcp/127.0.0.1/9095; cat >&3; cat <&3" 2>&1 \
                || printf "scrape failed: no curl/wget/bash-tcp on haproxy container; install curl in haproxytech/haproxy-debian image for /metrics capture\n"
            fi
          ' >> "$LOG_DIR/spoa-hub-metrics.txt" 2>&1 || true
        done

        # Rendered HAProxy config (the desired config the controller pushed)
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c haproxy -- \
          cat /etc/haproxy/haproxy.cfg > "$LOG_DIR/haproxy.cfg" 2>&1 || true

        # Conformance fixtures and chart resources at point of failure
        kubectl get gatewayclass -o yaml > "$LOG_DIR/gatewayclasses.yaml" 2>&1 || true
        kubectl get gateway -A -o yaml > "$LOG_DIR/gateways.yaml" 2>&1 || true
        kubectl get httproute -A -o yaml > "$LOG_DIR/httproutes.yaml" 2>&1 || true
        kubectl get pods -A -o wide > "$LOG_DIR/pods.log" 2>&1 || true

        # Cluster-wide events — kubelet's "pulling image" / "container
        # failed to start" / "service has no endpoints" lines all show
        # up here. Critical for diagnosing flakes where a test-created
        # pod never reaches Ready in the test's timeout window (the
        # pods.log snapshot only shows the post-fact state, not the
        # state machine that led there). Sorted by lastTimestamp so the
        # tail of the file is the most recent.
        kubectl get events -A --sort-by='.lastTimestamp' > "$LOG_DIR/events.log" 2>&1 || true

        # Pod descriptions for the test namespaces — `kubectl get pods
        # -o wide` shows ready/not-ready as a column, but only `kubectl
        # describe pod` carries the kubelet event chain that explains
        # *why* a pod stuck in Pending or CrashLoopBackOff did so. Cap
        # at the test namespaces so we don't dump 100+ system pods.
        # kubectl JSONPath doesn't support the `=~` regex operator
        # (https://kubernetes.io/docs/reference/kubectl/jsonpath/) — a
        # filter expression with `=~` evaluates to an empty match
        # silently, so the for-loop never iterates and the capture is
        # a no-op. List every namespace name and filter with `grep -E`
        # to keep the conformance ones.
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | grep -E '^(ingress-conformance|gateway-conformance)'); do
          kubectl -n "$ns" describe pods > "$LOG_DIR/pods-describe-${ns}.log" 2>&1 || true

          # Backend pod stdout (echo-server / GRPC echo / infra-backend-v{1,2,3}).
          # Without these, mirror-style flakes like #47 are undebuggable:
          # the spoa-hub metrics show whether the mirror plugin dispatched
          # (and got a 2xx back), but the conformance test's
          # `ExpectMirroredRequest` scans the *backend pod's stdout* via
          # `kubectl logs` for a path-matching line. If the line is in the
          # pod's log here but the test failed with "Couldn't find mirrored
          # request", the bottleneck is kubelet's log-shipping pipeline,
          # not the chart's data path. If the line is missing here too,
          # the backend never received the request (and we look at the
          # mirror plugin's network path next). Either way, having the
          # final stdout snapshot is the data point that lets the
          # investigation make a decision.
          #
          # `--prefix` annotates each line with `[pod/<name>]` so concat'd
          # output stays disambiguable when a namespace has multiple
          # backend pods. `--all-containers --ignore-errors` so a pod
          # that's been deleted between the list and the fetch doesn't
          # abort the loop.
          kubectl -n "$ns" logs --prefix --all-containers=true --ignore-errors \
            -l 'app in (echo,echo-v1,echo-v2,echo-v3,infra-backend-v1,infra-backend-v2,infra-backend-v3,grpc-infra-backend-v1,grpc-infra-backend-v2,web-backend,app-backend-v1,tcp-backend)' \
            --tail=-1 > "$LOG_DIR/backend-pods-${ns}.log" 2>&1 || true
        done

        # MetalLB state — IPAddressPool exhaustion or speaker issues
        # surface as Gateway addresses staying empty.
        kubectl -n metallb-system get pods -o yaml > "$LOG_DIR/metallb-pods.yaml" 2>&1 || true
        kubectl get ipaddresspool,l2advertisement -A -o yaml > "$LOG_DIR/metallb-config.yaml" 2>&1 || true

        # Per-failure HAProxy snapshots collected by the conformance
        # test binary's snapshotting RoundTripper (see
        # tests/conformance/snapshotter.go). Each ConfigMap holds a
        # gzipped tar of /etc/haproxy at the moment a request to a
        # specific Gateway failed, plus annotations identifying the
        # failing test name, request host, SNI and timestamp. The
        # raw ConfigMaps go in one bundle for completeness; the
        # tarballs are extracted into per-test subdirectories so
        # the haproxy.cfg + maps/ + ssl/ + general/ tree is browsable
        # without further base64 / tar gymnastics.
        SNAPSHOT_DIR="$LOG_DIR/haproxy-snapshots"
        mkdir -p "$SNAPSHOT_DIR"
        kubectl -n haptic get configmaps -l app.kubernetes.io/component=conformance-snapshot -o yaml > "$SNAPSHOT_DIR/_configmaps-raw.yaml" 2>&1 || true
        for cm in $(kubectl -n haptic get configmaps -l app.kubernetes.io/component=conformance-snapshot -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          # Use the haptic.io/test-name annotation when available
          # so the on-disk dir mirrors the failing Go test path;
          # fall back to the CM name otherwise.
          TEST_NAME=$(kubectl -n haptic get cm "$cm" -o jsonpath='{.metadata.annotations.haptic\.io/test-name}' 2>/dev/null || echo "$cm")
          # Strip path separators in the test name so we get one
          # subdir per failing subtest (sanitized).
          SAFE_NAME=$(echo "${TEST_NAME:-$cm}" | tr '/' '_' | tr -cd '[:alnum:]._-')
          OUT="$SNAPSHOT_DIR/${SAFE_NAME:-$cm}"
          mkdir -p "$OUT"
          kubectl -n haptic get cm "$cm" -o jsonpath='{.metadata.annotations}' > "$OUT/_annotations.json" 2>&1 || true

          # /etc/haproxy tarball — what the dataplane API actually
          # wrote to disk on the pod. binaryData values are
          # base64-encoded in the API response; decode + untar.
          # kubectl jsonpath returns the raw base64 string, no
          # extra envelope.
          mkdir -p "$OUT/etc-haproxy"
          kubectl -n haptic get cm "$cm" -o jsonpath='{.binaryData.etc-haproxy\.tar\.gz}' 2>/dev/null | base64 -d | tar -xzf - -C "$OUT/etc-haproxy" 2>/dev/null || \
            echo "etc-haproxy tarball extract failed for $cm" > "$OUT/_etc-haproxy-extract-error.txt"

          # HAProxyCfg CRD dump — the controller's RENDERED config
          # before the dataplane sync. If a wrong rule was already
          # in spec.content, the chart is to blame; if spec.content
          # is correct but the etc-haproxy tarball above is wrong,
          # the dataplane sync is to blame.
          kubectl -n haptic get cm "$cm" -o jsonpath='{.binaryData.haproxycfg-crds\.yaml}' 2>/dev/null | base64 -d > "$OUT/haproxycfg-crds.yaml" 2>/dev/null || \
            echo "haproxycfg dump extract failed for $cm" > "$OUT/_haproxycfg-extract-error.txt"
        done

        # Clean up the snapshot ConfigMaps so they don't leak
        # across re-runs on the same persistent cluster (the kind
        # cluster is ephemeral in CI but local KEEP_CLUSTER=true
        # runs would otherwise accumulate them).
        kubectl -n haptic delete configmaps -l app.kubernetes.io/component=conformance-snapshot --ignore-not-found > /dev/null 2>&1 || true
      fi
  artifacts:
    paths:
      - debug-logs/
    when: on_failure
    expire_in: 1 week

# On-demand job that produces a submittable Gateway API ConformanceReport.
#
# Unlike test-gateway-conformance (sharded 4x as a fast regression gate), this
# runs the FULL suite in ONE process — `cSuite.Report()` only knows about the
# tests the running instance executed, so a coherent report can't be stitched
# from shards. It's `when: manual` so the ~full-suite runtime never lands on
# every pipeline; trigger it when you want to refresh the report for an upstream
# implementations-list submission. The report YAML is uploaded as an artifact
# (download it, commit it under conformance/reports/, then open the
# kubernetes-sigs/gateway-api PR — that PR is a deliberate, separate step).
gateway-conformance-report:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  # Full suite (~108 tests) unsharded plus the kind+helm bootstrap.
  timeout: 60 minutes
  interruptible: true
  variables:
    CTRL_NAMESPACE: haptic
    RELEASE_NAME: haptic
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"
    SKIP_DOCKER_BUILD: "1"
    HAPROXY_VERSION: "3.4"
    # Single source of truth for the kept-container name: exported into the
    # environment, so the Makefile's `CONFORMANCE_CONTAINER ?=` picks it up AND
    # the docker cp/rm below reference the same value — no drift.
    CONFORMANCE_CONTAINER: haptic-conformance-run
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
    - job: build-spoa-image-snapshot
  rules:
    # On-demand only: never auto-runs. Failure of the (optional) job must not
    # block the pipeline — the report artifact is still produced and uploaded.
    - when: manual
      allow_failure: true
  # Reuse the snapshot-image pull from the sharded job verbatim.
  before_script:
    - !reference [test-gateway-conformance, before_script]
  script:
    # Bring up the conformance cluster (same as the sharded job).
    - HAPTIC_E2E_PROFILE=conformance TEST_RUN_PATTERN="^$" make test-e2e
    - |
      # Full (unsharded) suite with report output. The container is KEPT (not
      # --rm) so we can `docker cp` the report it wrote; the report is produced
      # even when some tests fail (it records the failures), so capture it
      # regardless of the test exit code, then propagate that code.
      set +e
      CONFORMANCE_KEEP_CONTAINER=1 \
        CONFORMANCE_REPORT_OUTPUT=/conformance-report.yaml \
        CONFORMANCE_IMPL_VERSION="$(cat VERSION 2>/dev/null || echo main)" \
        TEST_RUN_PATTERN="" \
        make test-gateway-conformance
      rc=$?
      docker cp "${CONFORMANCE_CONTAINER}:/conformance-report.yaml" ./conformance-report.yaml \
        || echo "WARN: no conformance report was produced"
      docker rm -f "${CONFORMANCE_CONTAINER}" >/dev/null 2>&1 || true
      echo "=== Gateway API ConformanceReport ==="
      cat ./conformance-report.yaml 2>/dev/null || true
      exit "$rc"
  artifacts:
    name: "gateway-conformance-report-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - conformance-report.yaml
    expire_in: 30 days

# Upstream Kubernetes Ingress conformance suite
# (kubernetes-sigs/ingress-controller-conformance).
#
# Same architecture as test-gateway-conformance: bring up the e2e
# cluster via `make test-e2e` (with TEST_RUN_PATTERN=^$ to skip the e2e
# scenarios themselves), then invoke `make test-ingress-conformance`
# which builds two binaries (our wrapper + the upstream binary from a
# pinned `git clone`), bakes them into a distroless image, and runs the
# image as a sibling container on the kind docker network. The wrapper
# parses the upstream's Cucumber JSON into Go-test subtests, so each
# scenario shows up as a named pass/fail in this job's log.
#
# Upstream is dormant (last commit 2023-08-28). The Makefile pins the
# commit SHA; this job inherits that pin. We don't auto-follow master.
#
# Sharded 4 ways via `parallel:`. Each shard runs in its own
# kind cluster on its own runner and exercises a non-overlapping
# subset of the upstream features: the `path_rules` feature (dominant
# at ~10 min unsharded — 16 scenarios serial) is split scenario-wise
# round-robin, the other 4 features bin-pack one per shard. The
# splitter and its coverage invariant live in
# tests/conformance/ingress_sharding.go (+ _test.go). Sharding is
# safe here in a way it wasn't for the reverted in-process
# parallel-features patch (commit 9f119efc) because each shard has
# its own haproxy.cfg via its own kind cluster + haptic install —
# no cross-feature collisions in one config.
#
# HAProxy version pinned for the same reason as Gateway API conformance:
# the chart's Ingress surface is HAProxy-version-agnostic, the matrix
# already lives on test-e2e. Trigger rules match the gateway job's so
# any Go/chart/script change runs both conformance suites.
test-ingress-conformance:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp${HAPROXY_VERSION}
  extends:
    - .docker-dind
  # Per-shard timeout. The unsharded job was budgeted at 20 min for
  # ~17 min observed; per-shard runtime is dominated by the kind+helm
  # bootstrap (~2 min) plus ~4 min for the sharded suite — same 20 min
  # margin still applies and the integration-stage gating is the max
  # across shards, not the sum.
  timeout: 20 minutes
  parallel: 4
  interruptible: true
  variables:
    CTRL_NAMESPACE: haptic
    RELEASE_NAME: haptic
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"
    SKIP_DOCKER_BUILD: "1"
    # Pin to the most-recent supported HAProxy version. Matches the
    # default in versions.env / charts/haptic/values.yaml.
    HAPROXY_VERSION: "3.4"
    INGRESS_CONFORMANCE_IMAGE: "${CI_REGISTRY_IMAGE}/ingress-conformance:ci-${CI_PIPELINE_ID}-haproxy3.4"
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
    - job: build-spoa-image-snapshot
    - job: build-ingress-conformance-image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        # Keep in lockstep with build-ingress-conformance-image's
        # `changes:` list — test depends on build, so test's trigger
        # set must be a subset of build's or GitLab refuses the
        # pipeline ("needs: build-... does not exist in the pipeline").
        # Easiest enforcement: identical lists. Adding Makefile and
        # tests/conformance/patches/** here so a patch-only or
        # Makefile-only change actually exercises the test (pipeline
        # 2550972533 quietly skipped the test job because the patch
        # commit matched none of the original paths).
        - "**/*.go"
        - go.mod
        - go.sum
        - scripts/**/*
        - .gitlab-ci.yml
        - Makefile
        - Dockerfile.ingress-conformance-test
        - tests/conformance/patches/**
    # Narrowed chart-side trigger — see build-ingress-conformance-image
    # above (must stay in lockstep) and .test-e2e-base for the wider
    # rationale.
    - !reference [.rules-spoa-chart, rules]
  before_script:
    # Reuse the test-e2e prep: pull controller + spoa-hub snapshots
    # built earlier in the same pipeline, retag locally so the kind
    # cluster's containerd can find them by `haptic:test`.
    - |
      TEST_IMAGE="${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-haproxy${HAPROXY_VERSION}"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull ${TEST_IMAGE}
      docker tag ${TEST_IMAGE} haptic:test
    - |
      SPOA_IMAGE="${CI_REGISTRY_IMAGE}/spoa-hub:${SPOA_TAG}"
      docker pull ${SPOA_IMAGE}
      docker tag ${SPOA_IMAGE} registry.gitlab.com/haproxy-haptic/haptic/spoa-hub:main-latest
    # Pull the pre-built conformance test image (built once per
    # pipeline by build-ingress-conformance-image). The Makefile
    # consumes $INGRESS_CONFORMANCE_IMAGE directly — no need to retag.
    - docker pull ${INGRESS_CONFORMANCE_IMAGE}
  script:
    # Bring up the conformance cluster — HAPTIC_E2E_PROFILE=conformance
    # selects the trimmed values file (no HTTP-store demo blocklist URL,
    # no dev fixtures) and skips applyBackendFixtures so the conformance
    # suite's per-scenario backends are the only pods exercised. Same
    # rationale as the gateway-conformance job above; this fixes the
    # ingress conformance suite hitting the same per-render http.Fetch
    # retry burst the gateway suite did when the chart's blocklist URL
    # was unreachable during cluster bring-up.
    - HAPTIC_E2E_PROFILE=conformance TEST_RUN_PATTERN="^$" make test-e2e
    # SHARD_ID / SHARD_COUNT come from GitLab CI's `parallel: 4`
    # keyword (CI_NODE_INDEX is 1-based, CI_NODE_TOTAL=4). The Go
    # wrapper consumes them via shardEnv() and runs only this shard's
    # slice of the feature files. CONFORMANCE_IMAGE_PREBUILT=1 short-
    # circuits the Makefile's local build chain.
    - |
      echo "Ingress-conformance shard ${CI_NODE_INDEX}/${CI_NODE_TOTAL}"
      SHARD_ID=${CI_NODE_INDEX} SHARD_COUNT=${CI_NODE_TOTAL} \
        CONFORMANCE_IMAGE_PREBUILT=1 \
        make test-ingress-conformance
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        # Per-shard subdir so 4 parallel jobs don't clobber each
        # other's diagnostics (GitLab aggregates artifacts from all
        # shards into the same MR artifact tab). Same shape as the
        # gateway-conformance after_script subdir.
        LOG_DIR="debug-logs/_ingress-conformance/shard-${CI_NODE_INDEX:-1}-of-${CI_NODE_TOTAL:-1}"
        echo "Ingress conformance shard ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1} failed — extracting cluster diagnostics to ${LOG_DIR}..."
        mkdir -p "$LOG_DIR"

        export KUBECONFIG=/tmp/haproxy-e2e-kubeconfig

        # Controller logs across replicas
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/name=haptic -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== Controller: $pod ===" >> "$LOG_DIR/controller.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" --all-containers=true >> "$LOG_DIR/controller.log" 2>&1 || true
        done

        # HAProxy + dataplane + spoa-hub sidecar logs. spoa-hub stdout
        # is the only place that records SPOE NOTIFY arrivals and
        # per-plugin dispatch errors — without it, conformance flakes
        # like issue #45 are undebuggable from the artifacts alone.
        # `|| true` on the spoa-hub line so older HAProxy pods that
        # pre-date the sidecar (and clusters without the sidecar
        # enabled) don't fail this script.
        for pod in $(kubectl -n ${CTRL_NAMESPACE} get pods -l app.kubernetes.io/component=loadbalancer -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "=== HAProxy: $pod ===" >> "$LOG_DIR/haproxy.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c haproxy >> "$LOG_DIR/haproxy.log" 2>&1 || true
          echo "=== Dataplane: $pod ===" >> "$LOG_DIR/dataplane.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c dataplane >> "$LOG_DIR/dataplane.log" 2>&1 || true
          echo "=== SPOA-hub: $pod ===" >> "$LOG_DIR/spoa-hub.log"
          kubectl -n ${CTRL_NAMESPACE} logs "$pod" -c spoa-hub >> "$LOG_DIR/spoa-hub.log" 2>&1 || true

          # SPOA-hub /metrics scrape. Bound on the pod loopback by the
          # chart (spoaHub.hub.metricsAddr default 127.0.0.1:9095, set
          # in libraries/spoa-hub.yaml + templates/spoa-hub-configmap.yaml).
          # Plugin counters live here: plugin_mirror_dispatches_total /
          # dispatch_dropped_total / dispatch_outcomes_total,
          # plugin_coraza_evaluations_total,
          # plugin_external-auth_auth_requests_total, etc.
          #
          # Scrape from the haproxy container which shares the pod's
          # network namespace with the sidecar (the spoa-hub container
          # is read-only + minimal, no scraping tools). The
          # haproxytech/haproxy-debian image has neither curl nor
          # busybox wget pre-installed — fall through a chain of
          # candidates and `printf` the failure reason if all miss, so
          # an empty scrape is debuggable instead of silent.
          echo "=== SPOA-hub /metrics on $pod ===" >> "$LOG_DIR/spoa-hub-metrics.txt"
          kubectl -n ${CTRL_NAMESPACE} exec "$pod" -c haproxy -- sh -c '
            if command -v curl >/dev/null 2>&1; then
              curl -fsS --max-time 5 http://127.0.0.1:9095/metrics
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O- --timeout=5 http://127.0.0.1:9095/metrics
            else
              # Last-resort raw HTTP/1.0 via /dev/tcp (bash-only). The
              # haproxy-debian image ships dash as /bin/sh, but the
              # explicit `bash` here works because the image installs
              # bash for the entrypoint. If even bash is missing the
              # scrape will fail silently and we will see only the
              # header line — at which point install curl in the image.
              printf "GET /metrics HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" \
                | bash -c "exec 3<>/dev/tcp/127.0.0.1/9095; cat >&3; cat <&3" 2>&1 \
                || printf "scrape failed: no curl/wget/bash-tcp on haproxy container; install curl in haproxytech/haproxy-debian image for /metrics capture\n"
            fi
          ' >> "$LOG_DIR/spoa-hub-metrics.txt" 2>&1 || true
        done

        # Rendered HAProxy config (the desired config the controller pushed)
        kubectl -n ${CTRL_NAMESPACE} exec deployment/${RELEASE_NAME}-haproxy -c haproxy -- \
          cat /etc/haproxy/haproxy.cfg > "$LOG_DIR/haproxy.cfg" 2>&1 || true

        # IngressClasses + Ingress fixtures the conformance suite created
        # (and the echo backends it derived from them). The upstream
        # binary creates per-scenario random namespaces, so cluster-wide
        # listings are the right granularity here.
        kubectl get ingressclass -o yaml > "$LOG_DIR/ingressclasses.yaml" 2>&1 || true
        kubectl get ingress -A -o yaml > "$LOG_DIR/ingresses.yaml" 2>&1 || true
        kubectl get pods -A -l app.kubernetes.io/name=ingress-conformance-echo -o yaml > "$LOG_DIR/echo-pods.yaml" 2>&1 || true
        kubectl get services -A -o yaml > "$LOG_DIR/services.yaml" 2>&1 || true
        kubectl get pods -A -o wide > "$LOG_DIR/pods.log" 2>&1 || true

        # Cluster-wide events + per-namespace pod descriptions. Three
        # consecutive ingress-conformance failures (issue #45 follow-up)
        # showed `waiting for service endpoints available: timed out`
        # in the test step, but the existing artifact set lacks the
        # kubelet event chain (`Pulling image`, `Failed to pull image`,
        # `Back-off restarting failed container`) that would explain
        # *why* the backend pod didn't reach Ready. Same capture as
        # the gateway-conformance after_script — kept in lockstep so
        # both flake classes get the same diagnostic.
        kubectl get events -A --sort-by='.lastTimestamp' > "$LOG_DIR/events.log" 2>&1 || true
        # kubectl JSONPath has no `=~` regex operator (see comment on
        # the gateway-conformance after_script block for context). Use
        # grep -E for the filter.
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | grep -E '^ingress-conformance'); do
          kubectl -n "$ns" describe pods > "$LOG_DIR/pods-describe-${ns}.log" 2>&1 || true

          # Echo backend pod stdout. The upstream ingress-conformance
          # suite scans the backend's stdout via `kubectl logs` for the
          # request fingerprint that confirms a route correctly delivered
          # traffic; when a scenario times out, the data point that
          # disambiguates "backend never received the request" from
          # "kubelet log-shipping lost the race against the 10s budget"
          # is whether the line is in the post-fact stdout snapshot here.
          # Same rationale as the gateway-conformance backend-logs
          # capture (see #47).
          kubectl -n "$ns" logs --prefix --all-containers=true --ignore-errors \
            -l app.kubernetes.io/name=ingress-conformance-echo \
            --tail=-1 > "$LOG_DIR/backend-pods-${ns}.log" 2>&1 || true
        done
      fi
  artifacts:
    paths:
      - debug-logs/
    when: on_failure
    expire_in: 1 week

# Helm chart default values test with cert-manager
# Verifies that the chart works out-of-the-box with default values when cert-manager is installed
test-helm-defaults:
  stage: integration
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  extends:
    - .docker-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    # Was `.rules-helm` (charts/**/*); narrowed to .rules-spoa-chart so
    # doc-only chart edits don't drag this job in, and the trigger set
    # stays in lockstep with build-spoa-image-snapshot (hard-needs:).
    - !reference [.rules-spoa-chart, rules]
    - changes:
        - .gitlab-ci.yml
  timeout: 15 minutes
  interruptible: true
  needs:
    - compute-ci-image-tag
    - job: build-ci
    - job: build-snapshot
    # Same-pipeline spoa-hub snapshot. test-helm-defaults exercises chart
    # defaults end-to-end (cluster install + smoke), and with coraza
    # auto-enabled the chart now renders the spoa-hub sidecar by
    # default. Pin its image tag to the snapshot built in this very
    # pipeline (SPOA_TAG below) so the test sees the chart-branch
    # version of the sidecar — pulling main-latest would silently
    # mask chart-branch skew per !893's post-mortem.
    - job: build-spoa-image-snapshot
  variables:
    # Unique cluster name - different from haproxy-test (integration) and haptic-dev (dev/routes)
    CLUSTER_NAME: helm-defaults
    NAMESPACE: haptic
    HAPROXY_VERSION: "3.4"
    # Consumed by scripts/test-helm-defaults.sh — overrides
    # spoaHub.image.tag to the per-pipeline snapshot built by
    # build-spoa-image-snapshot above. Same scheme as test-e2e via
    # start-dev-env.sh:734.
    SPOA_TAG: "ci-${CI_PIPELINE_ID}"
  before_script:
    - |
      # Pull pre-built test image from registry
      TEST_IMAGE="${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-haproxy${HAPROXY_VERSION}"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull ${TEST_IMAGE}
    - |
      # Pre-create kind cluster with DinD-compatible networking
      kind create cluster --name ${CLUSTER_NAME} --config .gitlab/ci/kind-config-dind.yaml --wait 120s
    - |
      # Fix kubeconfig to use "docker" hostname instead of 0.0.0.0
      mkdir -p ~/.kube
      kind get kubeconfig --name ${CLUSTER_NAME} > ~/.kube/config
      sed -i 's|https://0\.0\.0\.0:|https://docker:|g' ~/.kube/config
    - |
      # Wait for API server to be ready
      for i in $(seq 1 30); do
        if kubectl get nodes &>/dev/null; then
          echo "API server is ready"
          break
        fi
        echo "Waiting for API server... (attempt $i/30)"
        sleep 2
      done
    - |
      # Load test image into kind cluster
      kind load docker-image ${TEST_IMAGE} --name ${CLUSTER_NAME}
  script:
    - ./scripts/test-helm-defaults.sh --image "${TEST_IMAGE}"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "Job failed - extracting debug logs..."
        mkdir -p debug-logs

        echo "=== Pod Status ===" > debug-logs/pods.log
        kubectl get pods -A -o wide >> debug-logs/pods.log 2>&1 || true

        echo "=== Events ===" > debug-logs/events.log
        kubectl get events -A --sort-by='.lastTimestamp' >> debug-logs/events.log 2>&1 || true

        echo "=== Controller Logs ===" > debug-logs/controller.log
        kubectl logs -n ${NAMESPACE} -l app.kubernetes.io/component=controller --tail=200 >> debug-logs/controller.log 2>&1 || true

        echo "=== HAProxy Logs ===" > debug-logs/haproxy.log
        kubectl logs -n ${NAMESPACE} -l app.kubernetes.io/component=loadbalancer --tail=200 >> debug-logs/haproxy.log 2>&1 || true

        echo "=== Certificates ===" > debug-logs/certificates.log
        kubectl get certificates -A -o wide >> debug-logs/certificates.log 2>&1 || true
        kubectl describe certificates -n ${NAMESPACE} >> debug-logs/certificates.log 2>&1 || true

        echo "=== Issuers ===" > debug-logs/issuers.log
        kubectl get issuers -A -o wide >> debug-logs/issuers.log 2>&1 || true

        echo "=== TLS Secrets ===" > debug-logs/secrets.log
        kubectl get secrets -A --field-selector type=kubernetes.io/tls >> debug-logs/secrets.log 2>&1 || true

        echo "Debug logs extracted to debug-logs/"
        ls -la debug-logs/
      fi
  artifacts:
    paths:
      - debug-logs/
    when: on_failure
    expire_in: 1 week
  tags:
    - saas-linux-large-amd64

# =============================================================================
# Deploy Stage
# =============================================================================

# =============================================================================
# Controller Release (triggered by v* tags)
# =============================================================================

# Build binaries and Docker images with GoReleaser, create GitLab release
release-controller:
  stage: deploy
  extends:
    - .goreleaser-base
  tags:
    - saas-linux-large-amd64
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    GIT_DEPTH: 0
    GITLAB_TOKEN: ${CI_JOB_TOKEN}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - !reference [.goreleaser-base, before_script]
    - source versions.env
  script:
    - export VERSION=${CI_COMMIT_TAG}
    # Extract release notes from CHANGELOG.md
    - |
      awk -v ver="${VERSION#v}" '/^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 } found { print }' CHANGELOG.md > /tmp/release-notes.md
      if [ ! -s /tmp/release-notes.md ]; then
        echo "Release ${VERSION}" > /tmp/release-notes.md
      fi
    # GoReleaser builds binaries, Docker images, manifests, signs everything, and creates GitLab release
    - goreleaser release --clean --release-notes /tmp/release-notes.md
    # Post-release: SBOM generation (goreleaser can't do this for Docker images)
    # Query registry for digests using buildx imagetools (dockers_v2 doesn't include digest in artifacts.json)
    - |
      for HAPROXY_VERSION in $HAPROXY_VERSIONS; do
        IMAGE_TAG="${CI_REGISTRY_IMAGE}:${VERSION#v}-haproxy${HAPROXY_VERSION}"
        IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
        if [ -z "$IMAGE_DIGEST" ]; then
          echo "ERROR: Could not get digest for $IMAGE_TAG"
          exit 1
        fi
        IMAGE_REF="${CI_REGISTRY_IMAGE}@${IMAGE_DIGEST}"
        echo "Generating SBOM for ${IMAGE_TAG} (${IMAGE_DIGEST})..."
        syft $IMAGE_REF -o spdx-json > sbom-haproxy${HAPROXY_VERSION}.spdx.json
        cosign attest --predicate sbom-haproxy${HAPROXY_VERSION}.spdx.json --type spdxjson --yes $IMAGE_REF
      done
    # Create latest tags (stable releases only)
    # Use buildx imagetools to create tags and query digests from registry
    - |
      if ! echo "$VERSION" | grep -qE -- '-(alpha|beta|rc)'; then
        for HAPROXY_VERSION in $HAPROXY_VERSIONS; do
          SOURCE_TAG="${CI_REGISTRY_IMAGE}:${VERSION#v}-haproxy${HAPROXY_VERSION}"
          LATEST_TAG="${CI_REGISTRY_IMAGE}:latest-haproxy${HAPROXY_VERSION}"
          docker buildx imagetools create --tag "$LATEST_TAG" "$SOURCE_TAG"
          IMAGE_DIGEST=$(docker buildx imagetools inspect "$LATEST_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes ${CI_REGISTRY_IMAGE}@${IMAGE_DIGEST}
        done
      fi

# =============================================================================
# Chart Release (triggered by haptic-chart-v* tags)
# =============================================================================

release-chart:
  stage: deploy
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  tags:
    - saas-linux-medium-amd64
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_TAG =~ /^haptic-chart-v.*/
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Docker login needed for cosign to push signatures to OCI registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Extract version from tag (haptic-chart-v0.1.0 -> v0.1.0)
    - export VERSION=${CI_COMMIT_TAG#haptic-chart-}
    # Strip v prefix for chart version (Helm best practice: use pure SemVer)
    - export CHART_VERSION=${VERSION#v}
    # Extract release notes from chart CHANGELOG.md
    - |
      awk -v ver="${CHART_VERSION}" '/^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 } found { print }' charts/haptic/CHANGELOG.md > .release-notes.md
      if [ ! -s .release-notes.md ]; then
        echo "Helm Chart Release ${VERSION}" > .release-notes.md
      fi
    # Package and push chart to OCI registry
    - helm package charts/haptic --version $CHART_VERSION
    - |
      helm push haptic-$CHART_VERSION.tgz oci://${CI_REGISTRY}/haproxy-haptic/haptic/charts 2>&1 | tee push-output.txt
      CHART_DIGEST=$(grep 'Digest:' push-output.txt | awk '{print $2}')
      # Sign the OCI artifact using digest (cosign doesn't support oci:// prefix)
      cosign sign --yes ${CI_REGISTRY}/haproxy-haptic/haptic/charts/haptic@${CHART_DIGEST}
    # Create GitLab release
    - |
      RELEASE_NAME="Helm Chart ${VERSION}"
      if echo "$VERSION" | grep -qE '-(alpha|beta|rc)\.'; then
        RELEASE_NAME="Helm Chart ${VERSION} (Pre-release)"
      fi
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"${RELEASE_NAME}\",
             \"tag_name\": \"${CI_COMMIT_TAG}\",
             \"description\": $(cat .release-notes.md | jq -Rs .)
           }" \
           --request POST \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

# =============================================================================
# Release Documentation (triggered by release tags)
# =============================================================================

# Trigger versioned documentation build for controller releases
trigger-docs-controller-release:
  stage: deploy
  needs:
    - release-controller
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  inherit:
    variables: false
  variables:
    DOC_VERSION: ${CI_COMMIT_TAG}
  trigger:
    project: haproxy-haptic/haproxy-haptic.gitlab.io
    branch: main
    strategy: depend

# Trigger versioned documentation build for chart releases
trigger-docs-chart-release:
  stage: deploy
  needs:
    - release-chart
  rules:
    - if: $CI_COMMIT_TAG =~ /^haptic-chart-v.*/
  inherit:
    variables: false
  variables:
    DOC_VERSION: ${CI_COMMIT_TAG#haptic-chart-}
  trigger:
    project: haproxy-haptic/haproxy-haptic.gitlab.io
    branch: main
    strategy: depend

# =============================================================================
# MR Documentation Preview
# =============================================================================

# MR documentation preview with versioned docs
# Uses shared deployment script from pages repo for consistency with production
pages-preview:
  stage: deploy
  image: ${CI_REGISTRY_IMAGE}/ci/python-docs:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build-python-docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &pages-preview-changes
        - docs/**/*
        - charts/**/docs/**/*
        - charts/**/mkdocs.yml
  script:
    - |
      # Clone pages repo to get deployment script
      git clone --depth 1 https://gitlab.com/haproxy-haptic/haproxy-haptic.gitlab.io.git pages-repo
      chmod +x pages-repo/scripts/deploy-docs.sh
    - |
      # Download production site from latest pages artifact
      echo "Downloading production site from pages artifact..."
      PAGES_PROJECT_ID="haproxy-haptic%2Fhaproxy-haptic.gitlab.io"
      curl --location --output pages-artifact.zip \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${PAGES_PROJECT_ID}/jobs/artifacts/main/download?job=pages"
      unzip -q pages-artifact.zip
      rm pages-artifact.zip
    - |
      # Set up versions backup for deploy script
      mkdir -p /tmp/versions-backup
      for prefix in controller helm-chart; do
        if [ -f "public/${prefix}/versions.json" ]; then
          cp "public/${prefix}/versions.json" "/tmp/versions-backup/${prefix}-versions.json"
        fi
      done
      export VERSIONS_BACKUP_DIR="/tmp/versions-backup"

      # Build dev docs on top of existing site
      pages-repo/scripts/deploy-docs.sh dev . ./public
    - echo "Preview available at ${CI_PAGES_URL}/"
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    expire_in: never  # Cleaned up automatically when MR closes
  artifacts:
    paths:
      - public
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    url: $CI_PAGES_URL/
    on_stop: pages-preview-cleanup
    auto_stop_in: 1 week

# Cleanup job for MR preview (runs when MR is closed/merged)
pages-preview-cleanup:
  stage: deploy
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
      changes: *pages-preview-changes
  script:
    - echo "MR preview environment stopped"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    action: stop

# Trigger pages project to build and deploy docs to group-level pages
# Note: rules:changes doesn't work for multi-project triggers (GitLab issue #263385)
# so we trigger on every main branch push instead
trigger-pages:
  stage: deploy
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  inherit:
    variables: false
  trigger:
    project: haproxy-haptic/haproxy-haptic.gitlab.io
    branch: main
    strategy: depend

# Trigger pages project to build versioned docs on controller release tags
trigger-pages-release:
  stage: deploy
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  inherit:
    variables: false
  variables:
    DOC_VERSION: $CI_COMMIT_TAG
  trigger:
    project: haproxy-haptic/haproxy-haptic.gitlab.io
    branch: main
    strategy: depend

# =============================================================================
# Automatic Release Tagging (triggered when VERSION or Chart.yaml changes)
# =============================================================================
# These jobs automatically create release tags when version files change on main.
# This eliminates manual tagging after MR merge - just update VERSION or Chart.yaml,
# merge to main, and CI creates the tag and triggers the release pipeline.

# Create controller release tag when VERSION file changes on main
create-controller-release-tag:
  stage: deploy
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  tags:
    - saas-linux-small-amd64
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_TAG
      when: never  # Don't run on tag pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - VERSION=$(cat VERSION)
    - TAG="v${VERSION}"
    # Check if tag already exists (idempotency)
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
        echo "Tag ${TAG} already exists, skipping"
        exit 0
      fi
    # Create and push the tag
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git tag -a "${TAG}" -m "Controller release ${VERSION}"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${TAG}"
    # Trigger release pipeline for the new tag
    - |
      curl --fail-with-body --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=${TAG}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
    - echo "Created and pushed tag ${TAG}, release pipeline triggered"

# Create chart release tag when Chart.yaml version changes on main
create-chart-release-tag:
  stage: deploy
  image: ${CI_IMAGE_BASE}:${CI_IMAGE_TAG}-hp3.4
  tags:
    - saas-linux-small-amd64
  needs:
    - compute-ci-image-tag
    - job: build-ci
  rules:
    - if: $CI_COMMIT_TAG
      when: never  # Don't run on tag pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - VERSION=$(yq '.version' charts/haptic/Chart.yaml)
    - TAG="haptic-chart-v${VERSION}"
    # Check if tag already exists (idempotency)
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
        echo "Tag ${TAG} already exists, skipping"
        exit 0
      fi
    # Create and push the tag
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git tag -a "${TAG}" -m "Chart release v${VERSION}"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${TAG}"
    # Trigger release pipeline for the new tag
    - |
      curl --fail-with-body --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=${TAG}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
    - echo "Created and pushed tag ${TAG}, release pipeline triggered"
