global
    log stdout format raw local0 info

defaults be-http
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe from be-http
    bind :8080
    http-request set-var(txn.be) req.hdr(x-be)
    use_backend %[var(txn.be)] if { var(txn.be) -m found }
    default_backend nope

frontend upstream from be-http
    bind :9000
    http-request return status 200 content-type text/plain string upstream-ok

backend nope from be-http
    http-request return status 503 content-type text/plain string no-backend

backend kw from be-http
    balance roundrobin

backend probe1 from be-http
backend probe2 from be-http
backend probe3 from be-http
backend probe4 from be-http

backend bal_roundrobin from be-http
    balance roundrobin
backend bal_static_rr from be-http
    balance static-rr
backend bal_leastconn from be-http
    balance leastconn
backend bal_first from be-http
    balance first
backend bal_random from be-http
    balance random
backend bal_source from be-http
    balance source
backend bal_source_consistent from be-http
    balance source
    hash-type consistent
backend bal_uri from be-http
    balance uri
backend bal_uri_consistent from be-http
    balance uri
    hash-type consistent
backend bal_hdr from be-http
    balance hdr(host)
backend bal_hdr_consistent from be-http
    balance hdr(host)
    hash-type consistent

backend sslpre from be-http
    server p1 127.0.0.1:9443 ssl verify required ca-file /cfg/tls/ca.crt crl-file /cfg/tls/crl.pem crt /cfg/tls/client.pem
