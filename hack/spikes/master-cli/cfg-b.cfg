global
    log stdout format raw local0 info

defaults plain
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 20s

defaults be-http from plain
    http-request set-header X-Prof yes
    http-request set-timeout server 2s
    http-request return status 503 content-type text/plain string denied-by-profile if { var(txn.deny) -m found }

frontend fe from plain
    bind :8080
    http-request set-var(txn.be) req.hdr(x-be)
    http-request set-var(txn.deny) req.hdr(x-deny) if { req.hdr(x-deny) -m found }
    use_backend %[var(txn.be)] if { var(txn.be) -m found }
    default_backend nope

frontend echoup from plain
    bind :9000
    http-request return status 200 content-type text/plain hdr x-prof-seen "%[req.hdr(X-Prof)]" string fast-upstream

backend nope from plain
    http-request return status 503 content-type text/plain string no-backend

backend fileFast from be-http
    server fast 127.0.0.1:9000

backend fileSlow from be-http
    server slow 127.0.0.1:9100

backend ctrlFast from plain
    server fast 127.0.0.1:9000

backend ctrlSlow from plain
    server slow 127.0.0.1:9100
