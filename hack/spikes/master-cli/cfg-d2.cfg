global
    log stdout format raw local0 info

defaults be-http
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe from be-http
    bind :8080
    http-request set-var(txn.be) req.hdr(x-be)
    use_backend %[var(txn.be)] if { var(txn.be) -m found }
    default_backend nope

frontend upstream from be-http
    bind :9000
    http-request return status 200 content-type text/plain string upstream-ok

backend nope from be-http
    http-request return status 503 content-type text/plain string no-backend

backend alwaysup from be-http
    server s1 127.0.0.1:9000

backend p1 from be-http
backend p2 from be-http
backend p3 from be-http
backend p4 from be-http
backend p5 from be-http
backend p6 from be-http
backend p7 from be-http
backend p8 from be-http
backend p9 from be-http
backend p10 from be-http
backend p11 from be-http
