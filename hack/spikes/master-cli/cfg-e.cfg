global
    log stdout format raw local0 info

defaults be-http
    mode http
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout http-keep-alive 120s
    http-reuse safe

frontend fe from be-http
    bind :8080
    http-request set-var(txn.be) req.hdr(x-be)
    use_backend %[var(txn.be)] if { var(txn.be) -m found }
    default_backend nope

frontend upstream from be-http
    bind :9000
    http-request return status 200 content-type text/plain string upstream-ok

backend nope from be-http
    http-request return status 503 content-type text/plain string no-backend

backend e1 from be-http
backend e2 from be-http
backend e3 from be-http
backend e4 from be-http
backend e5 from be-http
backend e6 from be-http
