# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
#
# Configuration for oapi-codegen code generation
# Generates the HAProxy Dataplane API v3.3 client (models + raw client only)
#
# Note: Using compatibility mode to avoid name collisions between
# enum value "client" (becomes const Client) and HTTP client struct (type Client).
#
package: v33
output: pkg/generated/dataplaneapi/v33/api.gen.go
generate:
  models: true
  client: true
  # HAPTIC pushes config as raw text and never calls GetSwagger(); the embedded
  # base64 spec blob is dead weight. The on-disk spec.json stays the source of
  # truth for the validator generator and for regeneration.
  embedded-spec: false
output-options:
  # HAPTIC calls only a small storage/CA-file/reload/config-push slice of the
  # DataPlane API. Whitelisting those operation IDs makes oapi-codegen prune
  # every other operation AND every schema not transitively reachable from them.
  # The community client has no directly-referenced model types of its own (only
  # the v32ee config does -- see its note), so pruning here is loss-free. The
  # on-disk spec.json stays the full source of truth for the validator generator.
  # Keep this list in sync with the methods dispatched in pkg/dataplane/client.
  include-operation-ids:
    - addMapEntry
    - replaceCert
    - getAllCerts
    - deleteRuntimeMapEntry
    - replaceRuntimeMapEntry
    - showRuntimeMap
    - createCaFile
    - createStorageGeneralFile
    - createStorageMapFile
    - createStorageSSLCertificate
    - createStorageSSLCrtListFile
    - deleteCaFile
    - deleteStorageGeneralFile
    - deleteStorageMap
    - deleteStorageSSLCertificate
    - deleteStorageSSLCrtListFile
    - getAllCaFiles
    - getAllStorageGeneralFiles
    - getAllStorageMapFiles
    - getAllStorageSSLCertificates
    - getAllStorageSSLCrtListFiles
    - getCaFile
    - getConfigurationVersion
    - getHAProxyConfiguration
    - getOneStorageGeneralFile
    - getOneStorageMap
    - getOneStorageSSLCertificate
    - getOneStorageSSLCrtListFile
    - getReload
    - postHAProxyConfiguration
    - replaceStorageGeneralFile
    - replaceStorageMapFile
    - replaceStorageSSLCertificate
    - replaceStorageSSLCrtListFile
    - setCaFile
  # HAPTIC only uses the raw *Client (-> *http.Response, hand-decoded); the typed
  # "ClientWithResponses" half (ParseXxxResponse, WithBaseURL, per-op Response
  # structs) is ~39% of the generated file and has zero consumers. Suppress it by
  # overriding its template with an empty body. NB: the body must be a rendered
  # action ({{- "" -}}), not blank/whitespace -- Go text/template silently ignores
  # a whitespace-only Parse() and would keep the built-in template.
  user-templates:
    client-with-responses.tmpl: |
      {{- "" -}}
compatibility:
  always-prefix-enum-values: true
