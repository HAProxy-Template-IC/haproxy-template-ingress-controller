site_name: "HAPTIC - Template-Driven HAProxy Ingress Controller for Kubernetes"
site_url: https://haproxy-haptic.org/
site_description: "HAPTIC is an open-source, template-driven HAProxy ingress controller for Kubernetes. Full control over HAProxy configuration through templates, with Ingress and Gateway API support out of the box."

repo_name: haproxy-haptic/haptic
repo_url: https://gitlab.com/haproxy-haptic/haptic

docs_dir: docs

# The landing page markup lives in overrides/home.html (the theme custom_dir),
# which `mkdocs serve` does not watch by default — edits there wouldn't
# live-reload. Watch it explicitly so serve rebuilds on home.html changes.
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/stable-version.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md

plugins:
  - search: false
