StylesPath = docs/vale/styles
MinAlertLevel = error
Vocab = Haptic

; Prose lint for the user-facing docs site, invoked as `vale docs/site/docs`
; from `make lint`. Two styles:
;
;   Haptic — project rules encoding CLAUDE.md "User Documentation Authoring"
;   Google — vendored errata-ai/Google package (MIT; see the style dir),
;            implementing the Google developer-docs style guide our editorial
;            rules are distilled from
;
; Google rules disabled below were measured against the full corpus
; (2026-07-12, 8.8k raw findings) and rejected as noise for this project:
;   Parens/Semicolons  advisory style; parens carry defaults and asides in
;                      reference docs legitimately
;   EmDash             flags SPACED em dashes; spaced em dashes ARE the house
;                      style throughout docs and CLAUDE.md itself
;   Passive            active voice is the editorial default, but reference
;                      prose legitimately uses patient-focused passive ("the
;                      Secret is mounted"); enforcement would force awkward
;                      rewrites at scale
;   Colons             fights the deliberate bold-label pattern
;                      ("**Decision**: Use ...")
;   WordList           replaced by Haptic.WordSwaps — the stock list bans
;                      domain-standard terms (disable, regex, CLI)
;
; The Haptic vocabulary (config/vocabularies/Haptic/accept.txt) feeds
; Vale.Spelling AND the exception lists of Google.Headings/Google.Acronyms:
; product names and audience-known acronyms live there; an acronym absent
; from the vocabulary must be spelled out on first use per page.
[*.md]
BasedOnStyles = Haptic, Google
Vale.Spelling = YES
Google.Parens = NO
Google.EmDash = NO
Google.Semicolons = NO
Google.Passive = NO
Google.Colons = NO
Google.WordList = NO
Google.AMPM = error
Google.Acronyms = error
Google.Contractions = error
Google.DateFormat = error
Google.Ellipses = error
Google.Exclamation = error
Google.FirstPerson = error
Google.Gender = error
Google.GenderBias = error
Google.HeadingPunctuation = error
Google.Headings = error
Google.Latin = error
Google.LyHyphens = error
Google.OptionalPlurals = error
Google.Ordinal = error
Google.OxfordComma = error
Google.Periods = error
Google.Quotes = error
Google.Ranges = error
Google.Slang = error
Google.Spacing = error
Google.Spelling = error
Google.Units = error
Google.We = error
Google.Will = error
