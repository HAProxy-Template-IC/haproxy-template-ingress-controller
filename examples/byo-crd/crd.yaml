# A deliberately tiny, made-up CRD to show that HAPTIC can route on and report
# status to ANY resource — there is nothing HAProxy- or HAPTIC-specific about it.
# Replace it with your own CRD and only the HAProxyTemplateConfig changes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.examples.haptic.dev
spec:
  group: examples.haptic.dev
  scope: Namespaced
  names:
    kind: WebApp
    listKind: WebAppList
    plural: webapps
    singular: webapp
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [host, serviceName, servicePort]
              properties:
                host:
                  type: string
                  description: Hostname to route to this app.
                serviceName:
                  type: string
                  description: Backing Kubernetes Service name (same namespace).
                servicePort:
                  type: integer
                  description: Backing Service port.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer }
                      lastTransitionTime: { type: string, format: date-time }
      additionalPrinterColumns:
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
