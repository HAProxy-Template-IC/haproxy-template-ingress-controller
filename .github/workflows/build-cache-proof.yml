name: Normal compilation cache proof
'on':
  push:
    branches:
      - ci/github-build-cache-proof-20261013
permissions:
  contents: read
concurrency:
  group: build-cache-proof
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_SUITE: compile
      PILOT_GO_CACHE_DIR: ${{ github.workspace }}/../haptic-go-cache
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the same source with cold and warm caches
        run: |
          test ! -e "$PILOT_GO_CACHE_DIR"
          mkdir .build-proof
          for phase in cold warm; do
            bash .github/scripts/run-build-pilot.sh
            mv .pilot ".build-proof/$phase"
            docker rm haptic-pilot
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('.build-proof')
          results = {phase: json.loads((root / phase / 'result.json').read_text()) for phase in ('cold', 'warm')}
          identities = {}
          for phase in results:
              assert results[phase]['exit_code'] == 0
              lines = (root / phase / 'binary-version.txt').read_text().splitlines()
              identities[phase] = [line.strip() for line in lines if 'Commit:' in line or 'Source Hash:' in line]
              assert len(identities[phase]) == 2
              commit = next(line.split(':', 1)[1].strip() for line in lines if 'Commit:' in line)
              assert len(commit) >= 7 and os.environ['PILOT_SOURCE_SHA'].startswith(commit)
              assert all('unknown' not in line for line in identities[phase])
          assert identities['cold'] == identities['warm']
          results['seconds_saved'] = results['cold']['test_seconds'] - results['warm']['test_seconds']
          results['identity'] = identities['cold']
          (root / 'comparison.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: normal-build-cache-proof
          path: .build-proof/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
