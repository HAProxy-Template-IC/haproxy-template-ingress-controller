name: Mirror pinned CI images
'on':
  workflow_dispatch:
  push:
    branches:
      - ci/github-registry-mirror-20261013
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-registry-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.2
          cache: false
      - name: Install pinned registry copier
        run: go install github.com/google/go-containerregistry/cmd/crane@8a72a424fdecb4caa14f2d525e5d2503331442b5
      - name: Authenticate destination registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Copy all platforms and verify unchanged manifests
        run: make mirror-github-ci-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: registry-mirror
          path: .pilot/registry-mirror.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
