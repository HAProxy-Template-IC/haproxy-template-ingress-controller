name: Native ARM GitOps timing proof
'on':
  push:
    branches:
    - ci/github-gitops-arm-proof-20261013
permissions:
  contents: read
concurrency:
  group: gitops-arm-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitops:
    name: gitops-${{ matrix.provider }}-${{ matrix.certificates }}-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [argo, flux]
        certificates: [external, cert-manager]
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_SUITE: gitops
      GITOPS_PROVIDER: ${{ matrix.provider }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates }}
      KIND_NODE_IMAGE: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
      HAPROXY_VERSION: '3.4'
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: true
        cache-dependency-path: go.sum
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Exercise install, stable sync, upgrade, rejection and recovery
      run: bash .github/scripts/run-lifecycle-arm.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: gitops-${{ matrix.provider }}-${{ matrix.certificates }}-arm
        path: |
          .pilot/
          debug-logs/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
