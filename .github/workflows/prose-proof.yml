name: Documentation verification proof
'on':
  push:
    branches:
      - ci/github-prose-proof-*
permissions:
  contents: read
  actions: read
concurrency:
  group: prose-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection:
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.select.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 .github/scripts/select-verification-profile.py
      - name: Require a real documentation-only change
        env:
          PROFILE: ${{ steps.select.outputs.profile }}
        run: test "$PROFILE" = prose
  full:
    needs: selection
    uses: ./.github/workflows/ci-speed-proof.yml
    with:
      verification_job_prefix: 'full / '
      verification_profile: ${{ needs.selection.outputs.profile }}
  verified:
    needs: [selection, full]
    if: always() && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every documentation check
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          VERIFICATION_RESULT: ${{ needs.full.result }}
        run: test "$SELECTION_RESULT" = success && test "$VERIFICATION_RESULT" = success
