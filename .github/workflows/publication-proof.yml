name: Publication migration proof
'on':
  push:
    branches:
      - ci/github-publication-proof-20261013
permissions:
  contents: read
  id-token: write
concurrency:
  group: publication-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64,arm
      - name: Build and verify publication with GitHub signing identity
        run: |
          mkdir -p .pilot
          bash scripts/retry.sh docker pull "$PILOT_CI_IMAGE"
          docker run --rm --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env GITHUB_WORKFLOW_REF \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env GITHUB_ACTIONS --env PILOT_SOURCE_SHA --env PILOT_VERIFY_SIGNATURES=1 \
            --entrypoint bash "$PILOT_CI_IMAGE" -euc '
              git config --global --add safe.directory "$PWD"
              make prepare-github-release-config
              docker buildx create --driver docker-container --use --name publication-builder --bootstrap
              make goreleaser-snapshot GORELEASER_CONFIG=.pilot/goreleaser.github.yml
              make test-snapshot-publication
            '
      - name: Make publication evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .pilot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-proof
          path: .pilot/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
