name: Pull request revision identity experiment
'on':
  pull_request:
    branches:
    - ci/github-pr-context-base-20261013
permissions:
  contents: read
  actions: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Record tested and API revisions
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/inspect-pr-context.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-revision-identity
        path: pr-revision-identity.json
        retention-days: 1
        if-no-files-found: error
