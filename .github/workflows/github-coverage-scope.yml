name: GitHub complete coverage scope verification
'on':
  push:
    branches:
    - ci/github-coverage-scope-20261012
permissions:
  contents: read
  actions: read
concurrency:
  group: coverage-scope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining:
    name: agent-fix-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
        - name: integration-3.0
          suite: integration-coverage
          haproxy: '3.0'
        - name: integration-3.1
          suite: integration-coverage
          haproxy: '3.1'
        - name: integration-3.2
          suite: integration-coverage
          haproxy: '3.2'
        - name: integration-3.3
          suite: integration-coverage
          haproxy: '3.3'
        - name: integration-3.4
          suite: integration-coverage
          haproxy: '3.4'
        - name: coverage-renderer
          suite: coverage-shard
          shard: renderer
        - name: coverage-rest
          suite: coverage-shard
          shard: rest
    env:
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      BASELINE_CHART_VERSION: ''
      GITOPS_PROVIDER: ''
      GITOPS_CERTIFICATES: ''
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run the existing suite on a fresh runner
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-agent-fix-${{ matrix.name }}
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: warn
  combined:
    name: coverage-combined
    needs: remaining
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PILOT_SUITE: coverage-combined
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      BASELINE_CHART_VERSION: ''
      GITOPS_PROVIDER: ''
      GITOPS_CERTIFICATES: ''
      SHARD_ID: ''
      SHARD_COUNT: '4'
    steps:
    - *id001
    - name: Collect all seven successful coverage profiles
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: 'set -euo pipefail

        mkdir -p .pilot/coverage-inputs

        gh run view "$GITHUB_RUN_ID" --json headSha > .pilot/coverage-provenance.json

        jq --exit-status --arg sha "$GITHUB_SHA" ''.headSha == $sha'' .pilot/coverage-provenance.json

        gh run download "$GITHUB_RUN_ID" --pattern ''runner-pilot-agent-fix-*'' --dir
        .pilot/coverage-inputs

        '
    - name: Merge coverage with the complete package scope
      run: bash .github/scripts/run-build-pilot.sh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: runner-pilot-coverage-combined
        path: .pilot/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
