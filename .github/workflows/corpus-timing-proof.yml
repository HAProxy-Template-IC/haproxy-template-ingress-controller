name: Chart corpus timing proof
'on':
  push:
    branches:
    - ci/github-corpus-timing-proof-20261013
permissions:
  contents: read
concurrency:
  group: corpus-timing-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORIGINAL_SHA: 13aa79c40e991249e8df8bb042d3568e7e7a8bff
      CI_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.ORIGINAL_SHA }}
        path: original
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        persist-credentials: false
    - name: Compare all corpus assertions on the same runner
      run: |
        mkdir -p evidence .ci-go-cache/build .ci-go-cache/modules
        lscpu > evidence/host.txt
        docker pull "$CI_IMAGE"
        docker image inspect "$CI_IMAGE" > evidence/toolchain.json
        for variant in original candidate; do
          git -C "$variant" rev-parse HEAD > "evidence/$variant.sha"
          docker run --rm --volume "$PWD:$PWD" --workdir "$PWD/$variant" \
            --volume "$PWD/.ci-go-cache:/ci-go-cache" \
            --env GOCACHE=/ci-go-cache/build --env GOMODCACHE=/ci-go-cache/modules \
            --env GOFLAGS=-p=4 --env PKG=./cmd/haptic \
            --env TEST_RUN_PATTERN='^TestPlanDifferential' \
            --entrypoint bash "$CI_IMAGE" -c \
            'git config --global --add safe.directory "$PWD"; make test-unit COUNT=1' \
            2>&1 | tee "evidence/$variant.log"
          cp "$variant/report.xml" "evidence/$variant.xml"
        done
    - name: Retain timing and assertion evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: chart-corpus-timing
        path: evidence/
        retention-days: 1
        if-no-files-found: error
