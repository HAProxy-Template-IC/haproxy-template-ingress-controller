name: Native compiler cache timing proof
'on':
  push:
    branches:
    - ci/github-native-build-proof-20261013
permissions:
  contents: read
concurrency:
  group: native-build-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build-${{ matrix.name }}-cold
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: container
          native: '0'
        - name: host-cache
          native: '1'
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      TEST_RUN_PATTERN: ^TestIngressBasic$
      PILOT_NATIVE_BUILD: ${{ matrix.native }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select compiler cache variant
      env:
        BUILD_METHOD: ${{ matrix.name }}
      run: 'mkdir -p .pilot

        printf "%s\n" "$BUILD_METHOD" > .pilot/compiler-cache-variant

        '
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: 'go.sum

          Makefile

          Dockerfile

          cmd/haptic/default.pgo

          .pilot/compiler-cache-variant

          '
    - name: Build and validate the candidate on a fresh cluster
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Record compiler output identity
      if: always()
      run: 'container=$(docker create haptic:test)

        docker cp "$container:/usr/local/bin/haptic" "$RUNNER_TEMP/haptic-built"

        docker rm "$container"

        sha256sum "$RUNNER_TEMP/haptic-built" | cut -d'' '' -f1 > .pilot/binary-sha256.txt

        go version -m "$RUNNER_TEMP/haptic-built" > .pilot/binary-buildinfo.txt

        rm "$RUNNER_TEMP/haptic-built"

        '
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-build-${{ matrix.name }}-cold
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
  warm:
    name: build-${{ matrix.name }}-warm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: container
          native: '0'
        - name: host-cache
          native: '1'
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      TEST_RUN_PATTERN: ^TestIngressBasic$
      PILOT_NATIVE_BUILD: ${{ matrix.native }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select compiler cache variant
      env:
        BUILD_METHOD: ${{ matrix.name }}
      run: 'mkdir -p .pilot

        printf "%s\n" "$BUILD_METHOD" > .pilot/compiler-cache-variant

        '
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: 'go.sum

          Makefile

          Dockerfile

          cmd/haptic/default.pgo

          .pilot/compiler-cache-variant

          '
    - name: Build and validate the candidate on a fresh cluster
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Record compiler output identity
      if: always()
      run: 'container=$(docker create haptic:test)

        docker cp "$container:/usr/local/bin/haptic" "$RUNNER_TEMP/haptic-built"

        docker rm "$container"

        sha256sum "$RUNNER_TEMP/haptic-built" | cut -d'' '' -f1 > .pilot/binary-sha256.txt

        go version -m "$RUNNER_TEMP/haptic-built" > .pilot/binary-buildinfo.txt

        rm "$RUNNER_TEMP/haptic-built"

        '
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-build-${{ matrix.name }}-warm
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
    needs: build
