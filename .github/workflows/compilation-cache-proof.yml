name: Shared compilation cache proof
'on':
  push:
    branches:
    - ci/github-compilation-cache-proof-20261013
permissions:
  contents: read
concurrency:
  group: compilation-cache-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Compile ${{ matrix.shard }} test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
        - command
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_SUITE: unit-cache
      PILOT_GO_CACHE_DIR: ${{ github.workspace }}/../haptic-go-cache
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
      SHARD_ID: ${{ matrix.shard }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore and update compiled packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-${{ github.sha
          }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-
    - name: Compile test packages without executing tests
      run: bash .github/scripts/run-remaining-pilot.sh
  consume:
    name: Restore command cache and execute shard ${{ matrix.index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index:
        - 2
        - 3
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_SUITE: unit-shard
      PILOT_GO_CACHE_DIR: ${{ github.workspace }}/../haptic-go-cache
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
      SHARD_ID: command
      SHARD_INDEX: ${{ matrix.index }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require shared compilation cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-command-race-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Execute every selected command test
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain command test evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: command-cache-shard-${{ matrix.index }}
        path: .pilot/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
    needs: compile
