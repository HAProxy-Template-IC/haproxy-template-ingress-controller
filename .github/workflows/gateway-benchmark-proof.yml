name: Gateway benchmark migration proof
'on':
  push:
    branches:
    - ci/github-gateway-benchmark-proof-20261013
permissions:
  contents: read
concurrency:
  group: gateway-benchmark-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: gateway-api-benchmark-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      PILOT_SUITE: gateway-benchmark
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run unchanged benchmark workload and artifact gates
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain validated benchmark evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: gateway-api-benchmark-smoke
        path: .pilot/gateway-benchmark/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
