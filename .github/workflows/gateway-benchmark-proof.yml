name: Gateway benchmark migration proof
'on':
  workflow_call:
  push:
    branches:
    - ci/github-gateway-benchmark-proof-20261013
permissions:
  contents: read
concurrency:
  group: gateway-benchmark-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: gateway-api-benchmark-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 165
    env:
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: true
        cache-dependency-path: go.sum
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Install benchmark source inspection tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ripgrep
    - name: Run unchanged benchmark workload and artifact gates
      run: |
        export BENCH_CI_OUTPUT="$RUNNER_TEMP/gateway-benchmark"
        mkdir -p "$BENCH_CI_OUTPUT"
        export HAPTIC_E2E_EXTRA_VALUES="$RUNNER_TEMP/benchmark-bootstrap-values.yaml"
        cat > "$HAPTIC_E2E_EXTRA_VALUES" <<'YAML'
        controller:
          extraEnv:
            - {name: GOMAXPROCS, value: '2'}
            - {name: GOGC, value: '300'}
            - {name: TMPDIR, value: /v}
          extraVolumes:
            - name: validation-scratch
              emptyDir: {medium: Memory, sizeLimit: 512Mi}
          extraVolumeMounts:
            - {name: validation-scratch, mountPath: /v}
        YAML
        make bench-gateway-api-ci
    - name: Make validated artifacts readable
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/gateway-benchmark"
    - name: Retain validated benchmark evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: gateway-api-benchmark-smoke
        path: ${{ runner.temp }}/gateway-benchmark/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
