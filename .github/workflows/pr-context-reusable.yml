name: Reusable workflow revision identity experiment
'on':
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: git show -s --format='%H %T %P' HEAD
  identity:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Check nested job revision identity
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_IDENTITY_JOB: full / source
      run: python3 .github/scripts/inspect-pr-context.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-revision-identity-reusable
        path: pr-revision-identity.json
        retention-days: 1
        if-no-files-found: error
