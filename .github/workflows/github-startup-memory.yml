name: GitHub simultaneous startup verification
'on':
  push:
    branches:
    - ci/github-startup-matrix-20261013
permissions:
  contents: read
concurrency:
  group: startup-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    name: startup-matrix-${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        include:
        - name: hp3.0
          haproxy: '3.0'
        - name: hp3.1
          haproxy: '3.1'
        - name: hp3.2
          haproxy: '3.2'
        - name: hp3.3
          haproxy: '3.3'
        - name: hp3.4
          haproxy: '3.4'
        - name: rate-limit-1
          profile: rate-limit
        - name: rate-limit-2
          profile: rate-limit
        - name: rate-limit-3
          profile: rate-limit
        - name: cache
          profile: cache
        - name: api-gateway
          profile: api-gateway
          channel: experimental
        - name: conformance-standard
          profile: conformance
        - name: conformance-experimental
          profile: conformance
          channel: experimental
        - name: minimum-kubernetes
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      HAPTIC_E2E_PROFILE: ${{ matrix.profile || '' }}
      HAPTIC_E2E_GWAPI_CHANNEL: ${{ matrix.channel || 'standard' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5'
        }}
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=750m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '3'
      PILOT_STARTUP_ONLY: '1'
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Run native ARM suite
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-startup-matrix-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
