name: GitHub simultaneous startup scheduling diagnosis
'on':
  push:
    branches:
    - ci/github-startup-scheduling-20261012
permissions:
  contents: read
concurrency:
  group: startup-scheduling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    name: startup-scheduling-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        include:
        - name: rate-limit-gc300
          runner: ubuntu-24.04-arm
          profile: rate-limit
          channel: standard
          gogc: '300'
          gomaxprocs: '2'
          capture: '0'
        - name: rate-limit-gcoff
          runner: ubuntu-24.04-arm
          profile: rate-limit
          channel: standard
          gogc: 'off'
          gomaxprocs: '2'
          capture: '0'
    env:
      PILOT_GOGC: ${{ matrix.gogc }}
      PILOT_GOMAXPROCS: ${{ matrix.gomaxprocs }}
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_CAPTURE_PROFILES: ${{ matrix.capture }}
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      HAPTIC_E2E_PROFILE: ${{ matrix.profile || '' }}
      HAPTIC_E2E_GWAPI_CHANNEL: ${{ matrix.channel || 'standard' }}
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=750m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '3'
      PILOT_STARTUP_ONLY: '1'
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: false
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: matrix.runner == 'ubuntu-24.04-arm'
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-startup-scheduling-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
