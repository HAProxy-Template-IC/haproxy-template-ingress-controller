name: Native ARM upgrade timing proof
'on':
  push:
    branches:
    - ci/github-upgrade-arm-proof-20261013
permissions:
  contents: read
concurrency:
  group: upgrade-arm-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upgrade:
    name: upgrade-${{ matrix.baseline }}-${{ matrix.kubernetes }}-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - baseline: 0.4.0
          kubernetes: current
          node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        - baseline: 0.5.0
          kubernetes: minimum
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
    env:
      SOURCE_SHA: ${{ github.sha }}
      BASELINE_CHART_VERSION: ${{ matrix.baseline }}
      KIND_NODE_IMAGE: ${{ matrix.node }}
      HAPROXY_VERSION: '3.4'
      VARNISH_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: Build the exact candidate image
      run: 'mkdir -p .pilot debug-logs

        git diff --exit-code "$SOURCE_SHA"

        test "$(kind get clusters | wc -l)" -eq 0

        git rev-parse HEAD > .pilot/source.txt

        lscpu > .pilot/host.txt

        sed -i "s|^version:.*|version: 0.0.0-github.g${SOURCE_SHA:0:8}|" charts/haptic/Chart.yaml

        yq -i ''.cache.varnish.image = strenv(VARNISH_IMAGE)'' charts/haptic/values.yaml

        git diff > .pilot/test-values.patch

        make docker-build-test 2>&1 | tee .pilot/build.log

        docker image inspect haptic:test > .pilot/controller-image.json

        '
    - name: Exercise upgrade, traffic, rejection and repair
      run: 'started=$(date +%s)

        set +e

        SKIP_DOCKER_BUILD=1 make test-chart-upgrade 2>&1 | tee .pilot/test.log

        result=${PIPESTATUS[0]}

        set -e

        elapsed=$(( $(date +%s) - started ))

        printf ''{"exit_code":%s,"test_seconds":%s}\n'' "$result" "$elapsed" > .pilot/result.json

        exit "$result"

        '
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: upgrade-${{ matrix.baseline }}-${{ matrix.kubernetes }}-arm
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
