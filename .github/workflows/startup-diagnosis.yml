name: Conformance startup diagnosis
'on':
  push:
    branches:
      - ci/github-startup-diagnosis-20261013
permissions:
  contents: read
jobs:
  startup:
    name: startup-${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CONFORMANCE_SOURCE_SHA: ${{ github.sha }}
      CONFORMANCE_MODE: candidate
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned native tools
        run: bash .github/scripts/install-arm-pilot-tools.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
          cache: false
      - name: Run complete startup validation on a fresh runner
        run: bash .github/scripts/run-conformance-report.sh startup
      - name: Retain startup timeline and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug-logs/conformance-report/
          retention-days: 1
          if-no-files-found: error
