name: GitHub hosted E2E verification

on:
  push:
    branches:
      - ci/github-complete-verification-20261012

permissions:
  contents: read

concurrency:
  group: arm-runner-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e-arm64-hp${{ matrix.haproxy }}-${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        haproxy: ['3.0', '3.1', '3.2', '3.3', '3.4']
        shard: ['1', '2', '3']
        include:
          - haproxy: '3.4'
            shard: cache
            profile: cache
          - haproxy: '3.4'
            shard: rate-limit
            profile: rate-limit
          - haproxy: '3.4'
            shard: api-gateway
            profile: api-gateway
            channel: experimental
          - haproxy: '3.4'
            shard: minimum-kubernetes-1
            index: '1'
            node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
          - haproxy: '3.4'
            shard: minimum-kubernetes-2
            index: '2'
            node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
          - haproxy: '3.4'
            shard: minimum-kubernetes-3
            index: '3'
            node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy }}
      E2E_SHARD_INDEX: ${{ matrix.index || matrix.shard }}
      HAPTIC_E2E_PROFILE: ${{ matrix.profile || '' }}
      HAPTIC_E2E_GWAPI_CHANNEL: ${{ matrix.channel || 'standard' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' }}
      HAPTIC_E2E_EXTRA_SET: controller.resources.limits.cpu=4;controller.resources.limits.memory=2Gi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned native tools
        run: bash .github/scripts/install-arm-pilot-tools.sh
      - name: Build and test on ARM
        run: bash .github/scripts/run-arm-pilot.sh
      - name: Retain pilot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-pilot-e2e-arm64-hp${{ matrix.haproxy }}-${{ matrix.shard }}
          path: |
            .pilot/
            debug-logs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

  gateway-conformance:
    name: gateway-conformance-arm64-${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4']
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_STARTUP_ONLY: '1'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      HAPTIC_E2E_PROFILE: conformance
      HAPTIC_E2E_GWAPI_CHANNEL: experimental
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      HAPTIC_E2E_EXTRA_SET: controller.resources.limits.cpu=4;controller.resources.limits.memory=2Gi
      CONFORMANCE_PARALLEL: '4'
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned native tools
        run: bash .github/scripts/install-arm-pilot-tools.sh
      - name: Build and start a fresh conformance cluster
        run: bash .github/scripts/run-arm-pilot.sh
      - name: Run upstream Gateway API conformance
        shell: bash
        run: |
          set -euo pipefail
          TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)
          export TEST_RUN_PATTERN
          printf '%s\n' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt
          set +e
          make test-gateway-conformance 2>&1 | tee .pilot/conformance.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > .pilot/conformance.exit
          exit "$result"
      - name: Retain pilot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-pilot-gateway-conformance-arm64-${{ matrix.shard }}
          path: |
            .pilot/
            debug-logs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
