name: GitHub Pages migration proof
'on':
  push:
    branches:
      - ci/github-pages-proof-20261014
permissions:
  contents: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install browser and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y brotli
          npm ci --prefix scripts/visual-qa
          node scripts/visual-qa/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Restore and package the complete preserved website
        run: |
          make restore-github-pages PAGES_OUTPUT="$RUNNER_TEMP/source"
          make prepare-github-pages PAGES_SOURCE="$RUNNER_TEMP/source" PAGES_OUTPUT="$RUNNER_TEMP/public"
      - name: Verify every engine and legacy redirects in both browsers
        env:
          PAGES_BROWSERS: chromium,firefox
        run: make test-github-pages-browser PAGES_OUTPUT="$RUNNER_TEMP/public"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: pages-migration-preview
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PAGES_BROWSERS: chromium,firefox
      PAGES_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Restore the exact uploaded site and browser tools
        run: |
          mkdir "$RUNNER_TEMP/public"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/public"
          npm ci --prefix scripts/visual-qa
          node scripts/visual-qa/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Verify the live site in both browsers
        run: make test-github-pages-browser PAGES_OUTPUT="$RUNNER_TEMP/public"
