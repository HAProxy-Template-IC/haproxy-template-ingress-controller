name: Gateway scale diagnosis
'on':
  push:
    branches:
    - ci/github-gateway-profile-20261013
    - ci/github-gateway-network-proof-20261013
permissions:
  contents: read
concurrency:
  group: gateway-scale-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: gateway-scale-diagnosis
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 165
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: true
        cache-dependency-path: go.sum
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Install benchmark source inspection tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends ripgrep

        '
    - name: Profile the unchanged workload with normal artifact gates
      run: 'export BENCH_CI_OUTPUT="$RUNNER_TEMP/gateway-benchmark"

        mkdir -p "$BENCH_CI_OUTPUT"

        python3 .github/scripts/profile-gateway-benchmark.py > "$RUNNER_TEMP/profile-observer.log" 2>&1 &

        observer_pid=$!

        trap ''kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true'' EXIT

        make bench-gateway-api-ci

        wait "$observer_pid"

        '
    - name: Make validated artifacts readable
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/gateway-benchmark"
    - name: Retain validated benchmark evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: gateway-api-benchmark-smoke
        path: ${{ runner.temp }}/gateway-benchmark/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
