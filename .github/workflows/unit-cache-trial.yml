name: Go cache comparison job
on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
permissions:
  contents: read
jobs:
  unit:
    name: ${{ inputs.phase }} unit-command-1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PILOT_SUITE: unit-shard
      SHARD_ID: command
      SHARD_INDEX: '1'
      SHARD_COUNT: '3'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      HAPROXY_VERSION: '3.4'
      PILOT_GO_CACHE_DIR: ${{ github.workspace }}/.ci-go-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore compilation and module caches
        if: inputs.phase == 'warm'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.PILOT_GO_CACHE_DIR }}
          key: haptic-go-cache-pilot-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Run the unchanged tests on a fresh runner
        run: bash .github/scripts/run-remaining-pilot.sh
      - name: Save compilation and module caches
        if: inputs.phase == 'cold'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.PILOT_GO_CACHE_DIR }}
          key: haptic-go-cache-pilot-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Retain timing and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-cache-${{ inputs.phase }}
          path: .pilot/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
