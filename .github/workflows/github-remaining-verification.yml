name: GitHub remaining CI verification
'on':
  push:
    branches:
    - ci/github-remaining-verification-20261012
permissions:
  contents: read
concurrency:
  group: remaining-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining:
    name: remaining-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
        - name: integration-3.0
          suite: integration
          haproxy: '3.0'
        - name: integration-3.1
          suite: integration
          haproxy: '3.1'
        - name: integration-3.2
          suite: integration
          haproxy: '3.2'
        - name: integration-3.3
          suite: integration
          haproxy: '3.3'
        - name: integration-3.4
          suite: integration
          haproxy: '3.4'
        - name: agent-3.0
          suite: agent
          haproxy: '3.0'
        - name: agent-3.4
          suite: agent
          haproxy: '3.4'
        - name: upgrade-0.1.0-current
          suite: upgrade
          baseline: 0.1.0
          node: ''
        - name: upgrade-0.2.0-current
          suite: upgrade
          baseline: 0.2.0
          node: ''
        - name: upgrade-0.2.1-current
          suite: upgrade
          baseline: 0.2.1
          node: ''
        - name: upgrade-0.2.2-current
          suite: upgrade
          baseline: 0.2.2
          node: ''
        - name: upgrade-0.3.0-current
          suite: upgrade
          baseline: 0.3.0
          node: ''
        - name: upgrade-0.4.0-current
          suite: upgrade
          baseline: 0.4.0
          node: ''
        - name: upgrade-0.4.1-current
          suite: upgrade
          baseline: 0.4.1
          node: ''
        - name: upgrade-0.5.0-current
          suite: upgrade
          baseline: 0.5.0
          node: ''
        - name: upgrade-0.2.0-alpha.3-current
          suite: upgrade
          baseline: 0.2.0-alpha.3
          node: ''
        - name: install-without-gateway-current
          suite: plain
          node: ''
        - name: upgrade-0.1.0-minimum
          suite: upgrade
          baseline: 0.1.0
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.2.0-minimum
          suite: upgrade
          baseline: 0.2.0
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.2.1-minimum
          suite: upgrade
          baseline: 0.2.1
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.2.2-minimum
          suite: upgrade
          baseline: 0.2.2
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.3.0-minimum
          suite: upgrade
          baseline: 0.3.0
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.4.0-minimum
          suite: upgrade
          baseline: 0.4.0
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.4.1-minimum
          suite: upgrade
          baseline: 0.4.1
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.5.0-minimum
          suite: upgrade
          baseline: 0.5.0
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: upgrade-0.2.0-alpha.3-minimum
          suite: upgrade
          baseline: 0.2.0-alpha.3
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: install-without-gateway-minimum
          suite: plain
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: gitops-argo-external
          suite: gitops
          provider: argo
          certificates: external
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: gitops-argo-cert-manager
          suite: gitops
          provider: argo
          certificates: cert-manager
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: gitops-flux-external
          suite: gitops
          provider: flux
          certificates: external
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: gitops-flux-cert-manager
          suite: gitops
          provider: flux
          certificates: cert-manager
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
        - name: ingress-1
          suite: ingress
          shard: '1'
        - name: ingress-2
          suite: ingress
          shard: '2'
        - name: ingress-3
          suite: ingress
          shard: '3'
        - name: ingress-4
          suite: ingress
          shard: '4'
        - name: acceptance
          suite: acceptance
        - name: defaults
          suite: defaults
        - name: vector
          suite: vector
        - name: lint
          suite: lint
        - name: unit
          suite: unit
        - name: chart
          suite: chart
    env:
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' }}
      BASELINE_CHART_VERSION: ${{ matrix.baseline || '' }}
      GITOPS_PROVIDER: ${{ matrix.provider || '' }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates || '' }}
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run the existing suite on a fresh runner
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-remaining-${{ matrix.name }}
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: warn
