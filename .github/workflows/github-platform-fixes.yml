name: GitHub platform corrections
'on':
  push:
    branches:
    - ci/github-platform-fixes-20261012
permissions:
  contents: read
concurrency:
  group: platform-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  defaults:
    name: platform-defaults-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
        - name: defaults
          suite: defaults
          haproxy: '3.4'
          node: ''
          baseline: ''
          provider: ''
          certificates: ''
          shard: ''
    env:
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:d4a7ca1d3f00d5c9af8f0ca64a2acf29f3f8e4df61e02c810c1b8fea974b6879
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' }}
      BASELINE_CHART_VERSION: ${{ matrix.baseline || '' }}
      GITOPS_PROVIDER: ${{ matrix.provider || '' }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates || '' }}
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run the existing suite on a fresh runner
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-platform-defaults-x64
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: warn
  ingress:
    name: platform-ingress-arm64-${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
        - '1'
        - '2'
        - '3'
        - '4'
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '4'
      HAPTIC_E2E_CONTROLLER_STARTUP: staged
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_STARTUP_ONLY: '1'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      HAPTIC_E2E_PROFILE: conformance
      HAPTIC_E2E_GWAPI_CHANNEL: experimental
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      HAPTIC_E2E_EXTRA_SET: controller.resources.limits.cpu=4;controller.resources.limits.memory=2Gi
      CONFORMANCE_PARALLEL: '4'
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_ID: ${{ matrix.shard }}
      SHARD_COUNT: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Build and start a fresh conformance cluster
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Build native upstream echo fixture and run Ingress conformance
      run: bash .github/scripts/run-ingress-arm-pilot.sh
    - name: Retain pilot evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-platform-ingress-arm64-${{ matrix.shard }}
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: warn
