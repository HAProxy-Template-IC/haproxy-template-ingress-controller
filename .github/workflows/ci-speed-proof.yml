name: CI migration speed proof
'on':
  push:
    branches:
    - ci/github-speed-proof-20261012
  workflow_dispatch: {}
  workflow_call:
    inputs:
      verification_job_prefix:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite_gitops_argo_cert_manager:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env: &id001
      PILOT_GOGC: '300'
      PILOT_CAPTURE_NETWORK: ${{ startsWith(matrix.name, 'e2e-') && endsWith(matrix.name, '-3') && '1' || '0' }}
      PILOT_GOMAXPROCS: '2'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      E2E_SHARD_INDEX: ${{ matrix.index || matrix.shard || '1' }}
      HAPTIC_E2E_PROFILE: ${{ matrix.profile || '' }}
      HAPTIC_E2E_GWAPI_CHANNEL: ${{ matrix.channel || 'standard' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5'
        }}
      HAPTIC_E2E_EXTRA_SET: ${{ matrix.settings || 'controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi'
        }}
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_CI_IMAGE: ${{ matrix.image || 'registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad'
        }}
      BASELINE_CHART_VERSION: ${{ matrix.baseline || '' }}
      GITOPS_PROVIDER: ${{ matrix.provider || '' }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates || '' }}
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '4'
      SHARD_INDEX: ${{ matrix.index || matrix.shard || '' }}
      PILOT_STARTUP_ONLY: ${{ matrix.startup || '0' }}
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
      E2E_SHARD_WEIGHTS: .github/e2e-shard-weights.json
      PILOT_GO_CACHE_DIR: ${{ (matrix.suite == 'unit-shard' || matrix.suite == 'helm') && format('{0}/.ci-go-cache', github.workspace) || '' }}
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
    steps: &id002
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse Go downloads and compilation
      if: matrix.suite == 'unit-shard' && (matrix.shard != 'command' || matrix.index == 1)
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-${{ github.sha
          }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-
    - name: Restore shared command compilation
      if: matrix.suite == 'unit-shard' && matrix.shard == 'command' && matrix.index != 1
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-${{ github.sha
          }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard == 'command' && 'command-race' || matrix.shard }}-
    - name: Restore and maintain shared Helm compilation
      if: matrix.suite == 'helm' && matrix.haproxy == '3.4'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', '.gitlab/ci/build-pins.yml') }}
    - name: Restore shared Helm compilation
      if: matrix.suite == 'helm' && matrix.haproxy != '3.4'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', '.gitlab/ci/build-pins.yml') }}
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      if: matrix.suite == 'snapshot' || matrix.suite == 'spoa'
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64,arm
        cache-image: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: true
        cache-dependency-path: go.sum
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: matrix.runner == 'ubuntu-24.04-arm'
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Run upstream Gateway conformance
      if: matrix.kind == 'gateway'
      run: 'set -euo pipefail

        TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)

        export TEST_RUN_PATTERN

        printf ''%s\n'' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt

        set +e

        make test-gateway-conformance 2>&1 | tee .pilot/conformance.log

        result=${PIPESTATUS[0]}

        printf ''%s\n'' "$result" > .pilot/conformance.exit

        exit "$result"

        '
    - name: Collect conformance failure snapshots
      if: always() && matrix.kind == 'gateway'
      env:
        KUBECONFIG: /tmp/haproxy-e2e-kubeconfig
      run: |
        kubectl -n haptic get configmaps -l app.kubernetes.io/component=conformance-snapshot \
          -o json > .pilot/conformance-snapshots.json
    - name: Run upstream Ingress conformance
      if: matrix.kind == 'ingress'
      run: bash .github/scripts/run-ingress-arm-pilot.sh
    - name: Check controller output
      if: matrix.kind == 'nightly'
      run: KUBECONFIG=/tmp/haproxy-e2e-kubeconfig make check-controller-output
    - name: Run existing x64 suite
      if: matrix.kind == 'x64'
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Run native build and publication checks
      if: matrix.kind == 'build'
      run: bash .github/scripts/run-build-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-evidence-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          kind: x64
          name: gitops-argo-cert-manager
          suite: gitops
          provider: argo
          certificates: cert-manager
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
          channel: ''
          index: ''
          profile: ''
          settings: ''
          shard: ''
          startup: ''
          haproxy: ''
          image: ''
          baseline: ''
