      GITOPS_PROVIDER: ${{ matrix.provider || '' }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates || '' }}
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '4'
      SHARD_INDEX: ${{ matrix.index || matrix.shard || '' }}
      PILOT_STARTUP_ONLY: ${{ matrix.startup || '0' }}
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
      E2E_SHARD_WEIGHTS: .github/e2e-shard-weights.json
      PILOT_GO_CACHE_DIR: ${{ matrix.suite == 'unit-shard' && format('{0}/.ci-go-cache',
        github.workspace) || '' }}
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse Go downloads and compilation
      if: matrix.suite == 'unit-shard'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum')
          }}-${{ matrix.shard }}-${{ matrix.index || '0' }}-${{ github.sha }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod',
          'go.sum') }}-${{ matrix.shard }}-${{ matrix.index || '0' }}-
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      if: matrix.suite == 'snapshot' || matrix.suite == 'spoa'
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64,arm
        cache-image: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: true
        cache-dependency-path: go.sum
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: matrix.runner == 'ubuntu-24.04-arm'
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Run upstream Gateway conformance
      if: matrix.kind == 'gateway'
      run: 'set -euo pipefail

        TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)

        export TEST_RUN_PATTERN

        printf ''%s\n'' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt

        set +e

        make test-gateway-conformance 2>&1 | tee .pilot/conformance.log

        result=${PIPESTATUS[0]}

        printf ''%s\n'' "$result" > .pilot/conformance.exit

        exit "$result"

        '
    - name: Run upstream Ingress conformance
      if: matrix.kind == 'ingress'
      run: bash .github/scripts/run-ingress-arm-pilot.sh
    - name: Check controller output
      if: matrix.kind == 'nightly'
      run: KUBECONFIG=/tmp/haproxy-e2e-kubeconfig make check-controller-output
    - name: Run existing x64 suite
      if: matrix.kind == 'x64'
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Run native build and publication checks
      if: matrix.kind == 'build'
      run: bash .github/scripts/run-build-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-evidence-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
  coverage-inputs:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        include:
        - name: coverage-rest
          kind: x64
          runner: ubuntu-24.04
          suite: coverage-shard
          shard: rest
        - name: integration-3.0
          kind: x64
          runner: ubuntu-24.04
          suite: integration-coverage
          haproxy: '3.0'
          image: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:75e4761cf4db2ced4da3d874c4d6946dbd4eac88b0d65333e5359c46426d6000
        - name: integration-3.4
          kind: x64
          runner: ubuntu-24.04
          suite: integration-coverage
          haproxy: '3.4'
          image: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
        - name: integration-3.2
          kind: x64
          runner: ubuntu-24.04
          suite: integration-coverage
          haproxy: '3.2'
          image: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:e9d51d59a99a63b8437654d9a8fddf71bec50021ab95b1d64058bb58c0cdda07
        - name: integration-3.1
          kind: x64
          runner: ubuntu-24.04
          suite: integration-coverage
          haproxy: '3.1'
          image: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:df6198590aedf8b724bae6bbca026eafe5f14c76931df1c313ea242e6a9846ae
        - name: integration-3.3
          kind: x64
          runner: ubuntu-24.04
          suite: integration-coverage
          haproxy: '3.3'
          image: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:df051fa5e261664aed9a4ee4cf056721f247a3a8e5314fd21863818dd496f102
        - name: coverage-renderer
          kind: x64
          runner: ubuntu-24.04
          suite: coverage-shard
          shard: renderer
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_CI_IMAGE: ${{ matrix.image || 'registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad'
        }}
      SHARD_ID: ${{ matrix.shard || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run existing x64 suite
      if: matrix.kind == 'x64'
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-evidence-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
  coverage:
    name: coverage-combined
    needs: coverage-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PILOT_SUITE: coverage-combined
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Download all seven coverage profiles
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: 'set -euo pipefail

        mkdir -p .pilot/coverage-inputs

        gh run download "$GITHUB_RUN_ID" --pattern ''ci-evidence-coverage-*'' --pattern
        ''ci-evidence-integration-*'' --dir .pilot/coverage-inputs

        '
    - name: Merge the complete package coverage
      run: bash .github/scripts/run-build-pilot.sh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: ci-evidence-coverage-combined
        path: '.pilot/combined*

          .pilot/result.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
  verified:
    name: verified
    needs:
    - verification
    - coverage-inputs
    - coverage
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require every check from this exact run and source
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/verify-run.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-verification
        path: ci-verification.json
        retention-days: 1
        if-no-files-found: error
