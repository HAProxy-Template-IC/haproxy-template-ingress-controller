name: CI images
'on':
  push:
    branches:
      - main
    paths:
      - ci/**
      - scripts/ci-image-input-hash.sh
      - scripts/build-ci-image.sh
      - scripts/build-docs-image.sh
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the CI image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish CI images for the current build inputs
        run: python3 -m scripts.ci.github_toolchain --publish
