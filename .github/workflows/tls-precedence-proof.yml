name: TLSRoute precedence migration proof
'on':
  push:
    branches:
    - ci/github-tls-precedence-proof-20261013
permissions:
  contents: read
  actions: read
concurrency:
  group: tls-precedence-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canary:
    name: nightly-gwapi-canary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      SCALE_SEED_WORKERS: '4'
      HAPTIC_E2E_PROFILE: conformance
      HAPTIC_E2E_GWAPI_CHANNEL: experimental
      PILOT_STARTUP_ONLY: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: Use the failing upstream Gateway API revision
      run: echo "HAPTIC_E2E_GWAPI_VERSION=0da5a10ebb0eb8382a70612ab7fc1e359787b188" >> "$GITHUB_ENV"
    - name: Boot conformance cluster
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Run full upstream conformance
      run: 'bash scripts/prepare-gateway-api-canary.sh prepare "$HAPTIC_E2E_GWAPI_VERSION"

        make test-gateway-conformance

        '
    - name: Collect conformance failure snapshots
      if: always()
      env:
        KUBECONFIG: /tmp/haproxy-e2e-kubeconfig
      run: "kubectl -n haptic get configmaps -l app.kubernetes.io/component=conformance-snapshot \\\n  -o json > .pilot/conformance-snapshots.json\n"
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: nightly-gwapi-canary
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
