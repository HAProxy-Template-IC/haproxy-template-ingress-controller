name: Tag verified releases
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-tagging
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'maint/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck source and every required CI job
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --allow-prose
      - name: Create a missing release tag and dispatch its publication
        if: steps.verification.outputs.profile == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
        run: |
          CI_IMAGE=$(python3 -m scripts.ci.github_toolchain "$CI_IMAGE")
          docker run --rm --volume "$PWD:$PWD" --workdir "$PWD" \
            --env GH_TOKEN --env GITHUB_REPOSITORY --entrypoint bash "$CI_IMAGE" -euc '
              git config --global --add safe.directory "$PWD"
              make tag-github-release
            '
      - name: Make publication evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .publication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-tag
          path: .publication/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
