name: GitHub nightly workload verification
'on':
  push:
    branches:
    - ci/github-nightly-verification-20261012
permissions:
  contents: read
concurrency:
  group: nightly-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nightly:
    name: nightly-arm64-${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gateway-1.1.0
          release: v1.1.0
          pattern: TestGatewayAPIReleaseMatrix
        - name: gateway-1.4.0
          release: v1.4.0
          pattern: TestGatewayAPIReleaseMatrix
        - name: gateway-1.5.1
          release: v1.5.1
          pattern: TestGatewayAPIReleaseMatrix
        - name: gateway-churn
          churn: '1'
          pattern: TestGatewayChurn
        - name: scale
          scale: '1'
          pattern: TestScale
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '4'
      HAPTIC_E2E_CONTROLLER_STARTUP: staged
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: registry.gitlab.com/haproxy-haptic/haptic/varnish@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      HAPTIC_E2E_EXTRA_SET: controller.resources.limits.cpu=4;controller.resources.limits.memory=2Gi
      TEST_RUN_PATTERN: ${{ matrix.pattern }}
      HAPTIC_E2E_GWAPI_VERSION: ${{ matrix.release || '' }}
      HAPTIC_E2E_CHURN: ${{ matrix.churn || '' }}
      HAPTIC_E2E_SCALE: ${{ matrix.scale || '' }}
      HAPTIC_E2E_AGENT_DEBUG: ${{ matrix.scale || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.2
        cache: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - name: Build and test on ARM
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Check controller output consistency
      if: ${{ matrix.churn == '1' || matrix.scale == '1' }}
      run: KUBECONFIG=/tmp/haproxy-e2e-kubeconfig make check-controller-output
    - name: Retain pilot evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runner-pilot-nightly-arm64-${{ matrix.name }}
        path: '.pilot/

          debug-logs/

          scale-metrics.json

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: warn
