name: Focused CI failure diagnosis
'on':
  push:
    branches:
    - ci/github-mirror-diagnosis-20261013
permissions:
  contents: read
jobs:
  mirror:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        include:
        - name: minimum-full-shard
          runner: ubuntu-24.04-arm
          kind: arm
          haproxy: '3.4'
          shard: minimum-kubernetes-3
          index: '3'
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
          baseline: ''
          certificates: ''
          provider: ''
          repeat: '1'
          pattern: ''
        - name: minimum-mirror-repeat
          runner: ubuntu-24.04-arm
          kind: arm
          haproxy: '3.4'
          shard: minimum-kubernetes-3
          index: '3'
          node: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
          baseline: ''
          certificates: ''
          provider: ''
          repeat: '20'
          pattern: ^TestHapticMirrorTarget$
        - name: current-mirror-repeat
          runner: ubuntu-24.04-arm
          kind: arm
          haproxy: '3.4'
          shard: minimum-kubernetes-3
          index: '3'
          node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          baseline: ''
          certificates: ''
          provider: ''
          repeat: '20'
          pattern: ^TestHapticMirrorTarget$
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      E2E_SHARD_INDEX: ${{ matrix.index || matrix.shard || '1' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5'
        }}
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      E2E_SHARD_TOTAL: '4'
      E2E_SHARD_WEIGHTS: .github/e2e-shard-weights.json
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      COUNT: ${{ matrix.repeat }}
      TEST_RUN_PATTERN: ${{ matrix.pattern }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: matrix.runner == 'ubuntu-24.04-arm'
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: matrix.runner == 'ubuntu-24.04-arm'
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y tcpdump

        mkdir -p .pilot

        python3 .github/scripts/capture-cluster-network.py > .pilot/network-capture.log 2>&1 &

        capture_pid=$!

        set +e

        bash .github/scripts/run-arm-pilot.sh

        result=$?

        set -e

        touch .pilot/test-finished

        wait "$capture_pid"

        sudo chown -R "$(id -u):$(id -g)" .pilot

        exit "$result"

        '
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mirror-diagnosis-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
  defaults:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: ${{ matrix.haproxy || '3.4' }}
      E2E_SHARD_INDEX: ${{ matrix.index || matrix.shard || '1' }}
      HAPTIC_E2E_PROFILE: ${{ matrix.profile || '' }}
      HAPTIC_E2E_GWAPI_CHANNEL: ${{ matrix.channel || 'standard' }}
      KIND_NODE_IMAGE: ${{ matrix.node || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5'
        }}
      HAPTIC_E2E_EXTRA_SET: ${{ matrix.settings || 'controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi'
        }}
      PILOT_SUITE: ${{ matrix.suite }}
      PILOT_CI_IMAGE: ${{ matrix.image || 'ghcr.io/haproxy-haptic/haptic-ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad'
        }}
      BASELINE_CHART_VERSION: ${{ matrix.baseline || '' }}
      GITOPS_PROVIDER: ${{ matrix.provider || '' }}
      GITOPS_CERTIFICATES: ${{ matrix.certificates || '' }}
      SHARD_ID: ${{ matrix.shard || '' }}
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '4'
      SHARD_INDEX: ${{ matrix.index || matrix.shard || '' }}
      PILOT_STARTUP_ONLY: ${{ matrix.startup || '0' }}
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
      E2E_SHARD_WEIGHTS: .github/e2e-shard-weights.json
      PILOT_GO_CACHE_DIR: ${{ matrix.suite == 'unit-shard' && '/tmp/haptic-go-cache' || '' }}
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse Go downloads and compilation
      if: matrix.suite == 'unit-shard'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard }}-${{ matrix.index
          || '0' }}-${{ github.sha }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.shard }}-${{
          matrix.index || '0' }}-
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      if: matrix.suite == 'snapshot' || matrix.suite == 'spoa'
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64,arm
        cache-image: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: matrix.runner == 'ubuntu-24.04-arm'
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
      if: matrix.runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: matrix.runner == 'ubuntu-24.04-arm'
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Run upstream Gateway conformance
      if: matrix.kind == 'gateway'
      run: 'set -euo pipefail

        TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)

        export TEST_RUN_PATTERN

        printf ''%s\n'' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt

        set +e

        make test-gateway-conformance 2>&1 | tee .pilot/conformance.log

        result=${PIPESTATUS[0]}

        printf ''%s\n'' "$result" > .pilot/conformance.exit

        exit "$result"

        '
    - name: Run upstream Ingress conformance
      if: matrix.kind == 'ingress'
      run: bash .github/scripts/run-ingress-arm-pilot.sh
    - name: Check controller output
      if: matrix.kind == 'nightly'
      run: KUBECONFIG=/tmp/haproxy-e2e-kubeconfig make check-controller-output
    - name: Run existing x64 suite
      if: matrix.kind == 'x64'
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Run native build and publication checks
      if: matrix.kind == 'build'
      run: bash .github/scripts/run-build-pilot.sh
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-evidence-${{ matrix.name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        include:
        - runner: ubuntu-24.04
          kind: x64
          name: defaults-image
          suite: defaults
          channel: ''
          index: ''
          profile: ''
          settings: ''
          shard: ''
          startup: ''
          certificates: ''
          haproxy: ''
          baseline: ''
          provider: ''
          image: ''
          node: ''
