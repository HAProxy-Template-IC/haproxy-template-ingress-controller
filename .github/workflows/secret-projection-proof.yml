name: Secret projection timing proof
'on':
  push:
    branches:
    - ci/github-secret-projection-proof-20261013
permissions:
  contents: read
concurrency:
  group: secret-projection-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rotation:
    name: rotation-${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: original
          source: 8e462df2b716ca7c83799aa2aeccd63fea1b7d7f
          interval: 1m0s
        - name: five-seconds
          source: ''
          interval: 5s
    env:
      PILOT_SOURCE_SHA: ${{ matrix.source || github.sha }}
      PILOT_GOGC: '300'
      PILOT_GOMAXPROCS: '2'
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_VARNISH_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      TEST_RUN_PATTERN: ^TestAgent(TLSRotation|CertificateExpiryRecovery)$
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.PILOT_SOURCE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    - name: Exercise automatic certificate rotation on a fresh cluster
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Verify the kubelet interval
      if: always()
      env:
        EXPECTED_INTERVAL: ${{ matrix.interval }}
      run: "docker exec haptic-e2e-control-plane cat /var/lib/kubelet/config.yaml > .pilot/kubelet.yaml\ndocker exec haptic-e2e-control-plane\
        \ kubectl --kubeconfig=/etc/kubernetes/admin.conf \\\n  get --raw /api/v1/nodes/haptic-e2e-control-plane/proxy/configz\
        \ > .pilot/kubelet-effective.json\njq -e --arg expected \"$EXPECTED_INTERVAL\" ' .kubeletconfig.syncFrequency == $expected'\
        \ .pilot/kubelet-effective.json\n"
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rotation-${{ matrix.name }}
        path: '.pilot/

          debug-logs/

          '
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
