name: Publish main snapshot
'on':
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful canonical CI run for the main snapshot commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: snapshot-publication
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete canonical CI evidence from main
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: |
          python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN"
          jq -e '.branch == "main"' .publication/verified-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: snapshot-source
          path: .publication/verified-source.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  images:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        phase: [controller, spoa]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: snapshot-source
          path: .publication/
      - &login
        name: Authenticate publication registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64,arm
          cache-image: false
      - name: Publish every supported architecture and verify image source labels
        env:
          PUBLICATION_PHASE: ${{ matrix.phase }}
        run: bash .github/scripts/run-snapshot-publication.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: snapshot-${{ matrix.phase }}
          path: .publication/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  smoke:
    needs: [source, images]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - *checkout
      - *login
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: snapshot-spoa
          path: .publication/
      - name: Smoke-test the published bundle on its native architecture
        run: make smoke-spoa-image SPOA_SMOKE_IMAGE="$(cat .publication/spoa-reference.txt)"
  chart:
    needs: [source, images, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - *checkout
      - *source
      - *login
      - name: Publish the matching chart after all images pass
        env:
          PUBLICATION_PHASE: chart
        run: bash .github/scripts/run-snapshot-publication.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: snapshot-chart
          path: .publication/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
